<script>window.DECK={"id":"k-pr-zasada-3","rozdzial":"Rozdział 4 · Zasada 3: Zastosowanie Pojedynczej Zintegrowanej Struktury Ramowej · s. 25–26","tytul":"Zasada 3: jedna rama, cztery powody, baza wiedzy","prev":"k-pr-zasada-2.html","next":"k-pr-aktywatory.html","T":{"wytyczne-isaca":{"t":"Obecne wytyczne ISACA","eg":"Obecne wytyczne ISACA","pd":"Obecne wytyczne ISACA (Ilustracja 10)","en":"Existing ISACA guidance (COBIT 4.1, Val IT, Risk IT, BMIS, ITAF)","wyj":"Starsze poradniki tego samego wydawcy, np. o wartości i o ryzyku, które COBIT 5 połączył w jeden.\n\nWcześniejsze materiały ISACA (COBIT 4.1, Val IT, Risk IT, BMIS, ITAF, Board Briefing) trafiły do bazy wiedzy COBIT 5. Model procesów COBIT 5 łączy modele procesów COBIT 4.1, Val IT i Risk IT. Inne standardy, np. ITIL, zostają osobne; COBIT 5 tylko się do nich dopasowuje.\n\nŻeby nie trzeba było stosować kilku osobnych ram ISACA naraz. COBIT 5 zawiera całą tę wiedzę.","zycie":"Masz trzy stare zeszyty: z przepisami na ciasta, z domowym budżetem i z listą awarii w mieszkaniu. Przepisujesz je do jednego nowego notesu, a stare chowasz do szuflady. Stare zeszyty to „wcześniejsze wytyczne”, nowy notes to COBIT 5.","firma":"Firma miała osobne regulaminy: zakupowy, bezpieczeństwa i audytu, każdy od innego działu. Nowy dyrektor łączy je w jeden regulamin firmowy, w którym nic nie ginie. Stare regulaminy przestają być potrzebne osobno.","urzad":"Gmina miała trzy stare zarządzenia wójta: o sprzęcie, o kontroli wewnętrznej i o ryzyku. Nowe zarządzenie łączy je w jedno i uchyla poprzednie. Tak COBIT 5 wchłonął Val IT, Risk IT i inne materiały ISACA.","it":"Model referencyjny procesów COBIT 5 łączy modele COBIT 4.1, Val IT i Risk IT (s. 33). Dlatego wartość i ryzyko IT opisują procesy z 37, np. EDM02 i EDM03, a nie osobne ramy.","egz":"COBIT 5 integruje wytyczne ISACA: COBIT 4.1, Val IT, Risk IT, BMIS, ITAF i Board Briefing. ITIL, TOGAF i normy ISO to inne standardy: COBIT 5 się z nimi dopasowuje, ale ich nie wchłania. Na Ilustracji 10 podręcznik pisze „Obecne wytyczne ISACA”, czyli istniejące w chwili tworzenia COBIT 5. Chodzi o wcześniejsze materiały, nie o nowe. ITIL, TOGAF i normy ISO to nie są wytyczne ISACA. Forma egzaminacyjna nie jest potwierdzona (brak w SP1 i u Altkom); kurs przyjmuje formę z podręcznika – „Obecne wytyczne ISACA” (Ilustracja 10; EN: existing ISACA guidance). „Obecne” znaczy: istniejące w chwili powstania COBIT 5 (COBIT 4.1, Val IT, Risk IT, BMIS, ITAF). Nie myl z: ITIL – ITIL to inny standard, nie ISACA. Na Ilustracji 10 należy do „innych standardów i metodyk”.; ISO/IEC 27001 – Normy ISO to inne standardy, a nie wytyczne ISACA.; Baza wiedzy COBIT 5 – Wytyczne ISACA to jedno z trzech wejść do bazy wiedzy, a nie sama baza.","src":"COBIT 5 Framework (PL), s. 25; COBIT 5 Framework (PL), s. 26; COBIT 5 Framework (PL), s. 23; COBIT 5 Framework (PL), s. 33"},"struktura-ramowa":{"t":"Struktura ramowa","eg":"Struktura ramowa","pd":"Metodyka","en":"Framework","wyj":"Gotowy, uporządkowany zbiór reguł i dobrych praktyk, z którego korzystamy zamiast wymyślać od zera.\n\nStruktura ramowa (framework) daje model, pojęcia, zasady, role i dobre praktyki, ale nie szczegółową instrukcję krok po kroku. Organizacja dostosowuje ją do swojej wielkości i potrzeb. COBIT 5 jest strukturą ramową dla Ładu i Zarządzania IT w organizacji i łączy w jedną całość inne standardy i struktury, np. ITIL i ISO/IEC 27001.\n\nŻeby organizacja nie wymyślała od zera, jak podejść do złożonego obszaru, tylko korzystała z gotowego, sprawdzonego zestawu pojęć, zasad i praktyk i dopasowywała go do siebie.","zycie":"Dietetyk daje Ci zasadę talerza: połowa warzywa, ćwierć białko, ćwierć węglowodany. Nie mówi, co jutro zjesz – to układasz sam, pod swoje smaki i portfel. Zasada talerza to struktura ramowa, a Twój plan posiłków to już jej dopasowanie do siebie.","firma":"Właściciel otwiera kawiarnię we franczyzie i dostaje księgę standardów: wygląd lokalu, receptury, sposób obsługi gości. Grafik pracy i lokalnych dostawców ustala już sam. Księga to rama, w której dopasowuje szczegóły do swojego miasta.","urzad":"Dyrektor szkoły dostaje standardy kontroli zarządczej dla sektora finansów publicznych. Mówią, co ma być pod kontrolą – cele, ryzyka, dokumentacja – ale nie mówią, jak dokładnie prowadzić rejestr ryzyk w tej szkole. To struktura ramowa: wspólna dla wszystkich jednostek, a szczegóły ustala szkoła.","it":"Organizacja przyjmuje COBIT 5 jako strukturę ramową i w procesie APO01 (Zarządzanie metodyką zarządzania IT) ustala, jak wpiąć w nią ITIL dla obsługi usług i ISO/IEC 27001 dla bezpieczeństwa. Zgodnie z zasadą 3 powstaje jeden spójny system zamiast kilku osobnych.","egz":"W pytaniach: „Zastosowanie Pojedynczej Zintegrowanej Struktury Ramowej” (Zasada 3), „Zasady, Polityki i Struktury ramowe” (aktywator 1). Egzamin: „Struktura ramowa”. Podręcznik: „Metodyka”. EN: Framework. „COBIT 5 jest zintegrowaną strukturą ramową” = „COBIT 5 jest zintegrowaną metodyką”. Nie myl z: Norma / standard (np. ISO/IEC 27001) – Norma ma wymagania, z którymi można certyfikować zgodność. COBIT 5 jest strukturą ramową – nie certyfikuje się organizacji „na COBIT”.; Procedura – Procedura to szczegółowy przepis wykonania; struktura ramowa jest ogólniejsza.","src":"COBIT 5 Framework (PL), s. 91; materiały Altkom"},"rodzina-produktow":{"t":"Rodzina produktów COBIT 5","eg":"Rodzina produktów COBIT 5","pd":"Rodzina produktów COBIT 5","en":"COBIT 5 product family","wyj":"Cała półka książek COBIT 5: główny podręcznik i poradniki do wybranych tematów, np. audytu czy ryzyka.\n\nZ bazy wiedzy, przez filtr aktywatorów, powstają publikacje. Na czele jest COBIT 5 (Framework). Obok są przewodniki o aktywatorach, np. Procesy umożliwiające, i przewodniki specjalistyczne, np. Wdrożenie czy Audyt.\n\nŻeby każdy czytelnik dostał przewodnik do swojej pracy, a wszystkie przewodniki mówiły tym samym językiem.","zycie":"Producent mebli dokłada do szafy główną instrukcję montażu. Osobno są ulotki: jak dbać o drewno, jak bezpiecznie przykręcić szafę do ściany. Wszystko ma jeden styl i te same numery części. To rodzina produktów.","firma":"Franczyza pizzerii ma księgę marki, a obok osobne poradniki: dla kuchni, dla dostawców, dla kontroli jakości. Wszystkie wychodzą z jednej centrali i mają ten sam układ. To odpowiednik rodziny produktów COBIT 5.","urzad":"Ministerstwo odpowiedzialne za cyfryzację wydaje główne wytyczne dla urzędów. Osobno publikuje poradniki: o bezpieczeństwie, o audycie systemów i o wdrażaniu e-usług. Wszystkie mają ten sam układ i słownictwo, a urzędnik sięga po ten, którego akurat potrzebuje. Razem tworzą jedną rodzinę publikacji.","it":"Audytor IT szuka praktyk procesu MEA02 (Monitorowanie, ocena i oszacowanie systemu kontroli wewnętrznej) w COBIT 5: Procesy umożliwiające. Do planu audytu bierze przewodnik specjalistyczny COBIT 5 — Audyt.","egz":"Dwie grupy przewodników: o aktywatorach (np. Procesy umożliwiające, Informacje umożliwiające) i specjalistyczne (np. Wdrożenie, Bezpieczeństwo informacji, Audyt, Ryzyko). Wdrożenie to przewodnik specjalistyczny, a nie przewodnik o aktywatorze. Grupy w podręczniku: „Przewodniki dotyczące czynników umożliwiających” i „Specjalistyczne przewodniki”. Egzamin mówi „aktywator” zamiast „czynnik umożliwiający”. Egzaminacyjnych nazw grup po polsku nie potwierdziliśmy. Nie myl z: Baza wiedzy COBIT 5 – Baza wiedzy to źródło. Rodzina produktów to publikacje, które z niej powstają.; COBIT 5 – COBIT 5 (Framework) to jeden element rodziny, a nie cała rodzina.; COBIT 2019 – COBIT 2019 to nowsza wersja ramy, a nie produkt z rodziny COBIT 5.","src":"COBIT 5 Framework (PL), s. 26, Ilustracja 11; COBIT 5 Framework (PL), s. 26; COBIT 5 Framework (PL), s. 33"},"baza-wiedzy":{"t":"Baza wiedzy COBIT 5","eg":"Baza wiedzy COBIT 5","pd":"Baza wiedzy COBIT 5","en":"COBIT 5 knowledge base","wyj":"Jedna duża szafa z całą zebraną wiedzą, z której potem robi się kolejne poradniki.\n\nDo bazy trafiają wcześniejsze wytyczne ISACA, nowe materiały ISACA oraz inne standardy i metodyki. Baza przechowuje aktualne treści i ma strukturę na treści przyszłe. Przez filtr aktywatorów powstają z niej publikacje z rodziny produktów.\n\nŻeby cała wiedza ISACA i dopasowanie do innych standardów były w jednym miejscu i miały wspólny układ.","zycie":"Babcia przez lata zbierała przepisy z gazet, od sąsiadek i z telewizji. Wkłada je do jednego pudełka z przegródkami i zostawia puste przegródki na nowe. Z pudełka wnuczka robi książeczki: „ciasta”, „zupy”. Pudełko to baza wiedzy, książeczki to produkty.","firma":"Sieć kawiarni zbiera w jednym firmowym repozytorium wymagania sanepidu, normy jakości i własne receptury. Z niego powstają osobne instrukcje dla baristy, kucharza i kierownika. Repozytorium to baza wiedzy.","urzad":"Urząd wojewódzki tworzy jedną bazę przepisów, wytycznych i wzorów pism. Ma w niej też miejsce na przepisy, które dopiero przyjdą. Z bazy przygotowuje osobne poradniki dla różnych wydziałów. Tak działa baza wiedzy COBIT 5.","it":"Przewodnik COBIT 5: Procesy umożliwiające to produkt z bazy wiedzy przefiltrowany przez aktywator Proces. Stąd jednolity układ opisu każdego z 37 procesów (interpretacja kursu).","egz":"Ilustracja 10: wejścia → baza wiedzy → filtr aktywatorów → rodzina produktów. Baza zawiera także strukturę dla przyszłych treści. Nie myl z: Rodzina produktów COBIT 5 – Rodzina produktów to gotowe publikacje (np. Framework, przewodniki). Baza wiedzy to źródło, z którego powstają.; COBIT 5 – COBIT 5 (Framework) to jeden produkt z rodziny. Baza wiedzy jest szersza i ma miejsce także na treści przyszłe.; Obecne wytyczne ISACA – Wcześniejsze wytyczne ISACA to jedno z trzech wejść do bazy, a nie sama baza.","src":"COBIT 5 Framework (PL), s. 25, Ilustracja 10; COBIT 5 Framework (PL), s. 26"},"zasada-3":{"t":"Zasada 3: Zastosowanie Pojedynczej Zintegrowanej Struktury Ramowej","eg":"Zasada 3: Zastosowanie Pojedynczej Zintegrowanej Struktury Ramowej","pd":"Zasada 3: Stosowanie jednej zintegrowanej metodyki","en":"Principle 3: Applying a Single Integrated Framework","wyj":"Jedne spójne reguły, w które da się wpiąć inne normy, zamiast pięciu osobnych instrukcji.\n\nCOBIT 5 jest pojedynczą zintegrowaną strukturą ramową (single integrated framework) z czterech powodów: jest spójny z innymi standardami (np. ITIL, ISO 27001, TOGAF), obejmuje całą organizację, ma prostą architekturę i łączy wiedzę rozproszoną wcześniej w metodykach ISACA (np. Val IT, Risk IT). Ta wiedza trafia do bazy wiedzy COBIT 5, z której powstaje rodzina produktów. COBIT 5 może działać z innymi standardami, ale nie musi.\n\nŻeby organizacja korzystała z jednej spójnej ramy, w którą da się wpiąć inne standardy i wytyczne, zamiast utrzymywać kilka osobnych.","zycie":"Mama prowadzi kalendarz szkolny dzieci, tata grafik treningów, a babcia karteczki z wizytami u lekarza. Rodzina przenosi wszystko do jednego wspólnego kalendarza w telefonie, w którym każdy widzi całość. Jeden kalendarz, do którego trafiają wszystkie źródła – to idea Zasady 3.","firma":"Restauracja musi spełniać wymagania sanepidu, BHP i franczyzodawcy. Zamiast trzech osobnych segregatorów właściciel tworzy jeden system jakości, w którym każde wymaganie ma swoje miejsce. Jedna rama, do której wpinają się inne normy – to Zasada 3.","urzad":"Informatyk starostwa ma na głowie KRI, RODO, ISO 27001 i praktyki ITIL. Zamiast pisać osobne procedury do każdego dokumentu, układa jedną politykę IT i przypisuje do niej wymagania z poszczególnych źródeł. To Zasada 3.","it":"APO01 (Zarządzanie metodyką zarządzania IT) ustala jedną ramę zarządzania IT. Praktyki ITIL podpina się w niej np. pod DSS02 (Zarządzanie zgłoszeniami serwisowymi i incydentami), a zabezpieczenia z ISO 27001 pod APO13 (Zarządzanie bezpieczeństwem).","egz":"Kluczowe aspekty: prosta architektura, spójność z innymi standardami, pokrycie całej organizacji, integracja wytycznych ISACA. Twierdzenie, że COBIT musi być stosowany z innymi standardami, jest fałszywe. Egzamin: „Zastosowanie Pojedynczej Zintegrowanej Struktury Ramowej”. Podręcznik: „Stosowanie jednej zintegrowanej metodyki”. Struktura ramowa = metodyka = framework. Nie myl z: Zasada 2: Pokrycie całej organizacji – Zasada 2 to zakres (cała organizacja). Zasada 3 to integracja wielu wytycznych w jedną ramę.","src":"COBIT 5 Framework (PL), s. 25; COBIT 5 Framework (PL), s. 25, Ilustracja 10; COBIT 5 Framework (PL), s. 26, Ilustracja 11"},"integrator":{"t":"Zintegrowana struktura ramowa (integrator)","eg":"Zintegrowana struktura ramowa (integrator)","pd":"Jedna zintegrowana metodyka COBIT 5","en":"Single integrated framework (COBIT 5 as integrator)","wyj":"COBIT 5 jak listwa z gniazdkami: inne normy i metody da się w niego wpiąć i połączyć.\n\nDotychczasowe wytyczne ISACA (COBIT 4.1, Val IT, Risk IT i inne), nowe materiały oraz odniesienia do innych standardów (ITIL, TOGAF, ISO) trafiają do jednej bazy wiedzy COBIT 5 (knowledge base). Z niej, przez model aktywatorów (enablers), powstaje rodzina produktów: Framework, przewodniki o aktywatorach i przewodniki specjalistyczne. COBIT 5 nie zastępuje innych standardów, tylko jest ramą, w którą one się wpinają.\n\nŻeby organizacja nie musiała sama sklejać kilku osobnych metodyk ISACA i innych standardów: COBIT 5 daje jedną ramę na górze, a szczegóły można brać z ITIL, TOGAF czy norm ISO.","zycie":"W domu leżą instrukcja od pralki, gwarancja na lodówkę, umowa na prąd i zeszyt z przepisami babci, każde w innej szufladzie. Wkładasz wszystko do jednego segregatora z przegródkami i z niego robisz sobie ściągi, np. „co zrobić, gdy coś się zepsuje”. COBIT 5 robi to samo z wytycznymi ISACA i innymi standardami: zbiera je w jedną bazę, z której powstają kolejne przewodniki.","firma":"Właścicielka cukierni ma wymagania sanepidu, zasady BHP, przepisy z umowy franczyzowej i własne notatki. Spisuje je w jeden firmowy podręcznik, a z niego robi krótkie karty osobno dla kuchni i dla kasy. Jedna baza, z której powstaje kilka gotowych materiałów – tak działa COBIT 5 jako integrator.","urzad":"Informatyk w starostwie ma na biurku KRI, RODO, normę ISO 27001 i stare zarządzenia starosty. Zamiast pięciu osobnych regulaminów pisze jedną politykę, która w każdym punkcie odsyła do właściwego źródła. Tak COBIT 5 łączy różne standardy w jedną spójną ramę, zamiast je zastępować.","it":"Organizacja realizuje DSS02 (Zarządzanie zgłoszeniami serwisowymi i incydentami) według szczegółowych praktyk ITIL, a APO13 (Zarządzanie bezpieczeństwem) według ISO/IEC 27001. COBIT 5 daje wspólną ramę, cele i odpowiedzialności, do których te praktyki się podłączają (Zasada 3).","egz":"COBIT 5 integruje Val IT i Risk IT (model procesów COBIT 5 łączy modele COBIT 4.1, Val IT i Risk IT, s. 33). Nie myl z: COBIT 5 – COBIT 5 (Framework) to jeden z produktów rodziny. Baza wiedzy jest szersza.","src":"COBIT 5 Framework (PL), s. 25; COBIT 5 Framework (PL), s. 25, Ilustracja 10; COBIT 5 Framework (PL), s. 26, Ilustracja 11; COBIT 5 Framework (PL), s. 33"}},"S":[{"lekcje":["pr-k30-zasada-3","pr-k31-cztery-powody-integracji"],"pt":"Lekcje 1.30–1.31","h":"Zasada 3: COBIT 5 integruje inne standardy – nie zastępuje ich","b":"<p><w k=\"zasada-3\">Zastosowanie Pojedynczej Zintegrowanej Struktury Ramowej</w> <span class=\"en\">Applying a Single Integrated <w k=\"struktura-ramowa\">Framework</w></span>. Cztery powody:</p><ol><li>spójny z innymi normami i metodykami,</li><li>obejmuje całą organizację,</li><li>prosta architektura materiałów,</li><li>łączy wcześniej rozproszoną wiedzę ISACA.</li></ol>","c":"COBIT 5 może być nadrzędną strukturą ramową – integruje, nie zastępuje; może, ale nie musi działać z innymi standardami.","s":"COBIT 5 Framework (PL), s. 25; s. 23","ctx":"<p>COBIT 5 jest <w k=\"integrator\">integratorem</w>: organizacja może użyć go jako nadrzędnej <w k=\"struktura-ramowa\">struktury ramowej</w> i wpiąć pod nią ITIL, normy ISO czy TOGAF (rama architektury korporacyjnej, wiedza ogólna). COBIT 5 mówi, po co praktyka istnieje i kto ustala priorytety; szczegółowe standardy – jak ją wykonać. Rozproszona wiedza ISACA to m.in. COBIT, Val IT (wartość), Risk IT (ryzyko), BMIS (model bezpieczeństwa informacji), Board Briefing on IT Governance i ITAF (rama audytu IT).</p><p>Pułapki: „COBIT 5 zastępuje ITIL i ISO” – fałsz; „COBIT 5 musi być stosowany z innymi standardami” – fałsz. Zdania prawdziwe, ale nie na temat, nie są powodami integracji: „współdziałanie siedmiu aktywatorów” to zasada 4, „ITIL dobrze opisuje usługi” to cecha ITIL. Podręcznik pisze „jednej zintegrowanej metodyki” – na egzaminie <b>struktura ramowa</b>.</p><p>Pułapka „najnowsze”: zasada 2 mówi, że COBIT 5 jest spójny z najnowszymi <b>poglądami dotyczącymi Ładu</b>, więc da się go wpiąć w każdy system ładu korporacyjnego (s. 23). Zasada 3 mówi o spójności z innymi najnowszymi <b>normami i metodykami</b> (s. 25). Poglądy na Ład → zasada 2; normy i metodyki → zasada 3. Inne zasady też mają swoje hasła: przełożenie potrzeb interesariuszy – zasada 1, relacja Ładu i Zarządzania – zasada 5.</p><p>Przykład z banku: ITIL dla obsługi zgłoszeń i ISO/IEC 27001 dla bezpieczeństwa zostają, ale bank przypina je do procesów i celów COBIT 5 – i widzi całość w jednym miejscu.</p>"},{"pt":"Sprawdź się","quiz":{"id":"q-pak-T04Q08","sylabus":["PR-01-01","PR-02-10"],"tresc":"W organizacji działa kilka standardów zarządzania i kierownictwo chce uporządkować ich wykorzystanie. Zauważa też, że pracownicy, procesy i systemy nie współpracują skutecznie. Który opis prawidłowo rozróżnia zasadę 3 (Zastosowanie Pojedynczej Zintegrowanej Struktury Ramowej) i zasadę 4 (Aktywacja holistycznego podejścia)?","opcje":[{"t":"Zasada 3 łączy standardy, zasada 4 – współdziałanie aktywatorów","ok":true,"w":"Zasada 3 integruje inne standardy i struktury ramowe w COBIT 5. Zasada 4 mówi, że siedem aktywatorów musi działać razem."},{"t":"Zasada 3 zastępuje aktywatory, a zasada 4 zastępuje inne standardy","ok":false,"w":"Zasady niczego nie zastępują. Opis myli też zakresy obu zasad."},{"t":"Zasada 3 dotyczy wyłącznie IT, a zasada 4 wyłącznie zarządu","ok":false,"w":"Nie ma takiego podziału zakresu między dział IT i zarząd."},{"t":"Zasada 3 dotyczy kompetencji, a zasada 4 wyłącznie audytu","ok":false,"w":"Żadna z tych zasad nie dotyczy tylko kompetencji ani tylko audytu."}],"src":"COBIT 5 Framework (EN), sekcja rozdział 1, rysunek 2","pomoc":{"t":"Pytanie dotyczy lekcji 1.30 „Zasada 3 – jedna nadrzędna rama, która łączy inne standardy”. Cel lekcji: Potrafię wyjaśnić, że COBIT 5 może być nadrzędną ramą, która integruje inne standardy, ale ich nie zastępuje i nie musi być z nimi stosowany.","k":["integrator"]},"kurs":"Zasada 3 integruje inne standardy i struktury ramowe w COBIT 5. Zasada 4 mówi, że siedem aktywatorów musi działać razem.","kontekst":""}},{"pt":"Sprawdź się","quiz":{"id":"q-pra-32-3","sylabus":["PR-02-10","PR-02-11"],"tresc":"Co na Rysunku 10 pełni rolę filtra zawartości dla bazy wiedzy COBIT 5?","opcje":[{"t":"Inne standardy i metodyki","ok":false,"w":"To też wejście do bazy wiedzy."},{"t":"Aktywatory COBIT 5","ok":true,"w":"Dobrze. Aktywatory filtrują bazę wiedzy na konkretne produkty."},{"t":"Obecne wytyczne ISACA","ok":false,"w":"To wejście do bazy wiedzy, a nie filtr."},{"t":"Pięć zasad COBIT 5","ok":false,"w":"Zasady nie są filtrem na Rysunku 10."}],"src":"COBIT 5 Framework (EN), sekcja rozdział 4, rysunki 10–11","pomoc":{"t":"Pytanie dotyczy lekcji 1.31 „Dlaczego COBIT 5 jest zintegrowaną strukturą ramową – cztery powody”. Cel lekcji: Potrafię podać cztery powody, dla których COBIT 5 jest jedną zintegrowaną strukturą ramową.","k":[]},"kurs":"Dobrze. Aktywatory filtrują bazę wiedzy na konkretne produkty.","kontekst":""}},{"pt":"Arkusz próbny","sp1":"sp1-37","lekcja":"1.31","temat":"Dlaczego COBIT 5 jest zintegrowaną strukturą ramową – cztery powody","k":[]},{"pt":"Arkusz próbny","sp1":"sp1-45","lekcja":"1.31","temat":"Dlaczego COBIT 5 jest zintegrowaną strukturą ramową – cztery powody","k":[]},{"lekcje":["pr-k32-baza-wiedzy"],"pt":"Lekcja 1.32","h":"Baza wiedzy: wiele źródeł, filtr aktywatorów, jedna rodzina produktów","b":"<p>Ilustracja 10:</p><div class=\"tblwrap\"><table class=\"tbl\"><tr><th>Wejście</th><th>Środek</th><th>Wyjście</th></tr><tr><td><w k=\"wytyczne-isaca\">obecne wytyczne ISACA</w>, nowe materiały ISACA, inne standardy</td><td><w k=\"baza-wiedzy\">Baza wiedzy COBIT 5</w>, filtr: aktywatory</td><td><w k=\"rodzina-produktow\">Rodzina produktów COBIT 5</w></td></tr></table></div>","c":"Baza wiedzy przechowuje obecne treści i daje strukturę przyszłym; aktywatory filtrują ją w rodzinę produktów.","s":"COBIT 5 Framework (PL), s. 25–26, Ilustracje 10–11","ctx":"<p>Baza wiedzy <span class=\"en\">COBIT 5 knowledge base</span> ma dwie role: zawiera wszystkie dotychczasowe wytyczne i treści oraz jest strukturą dla przyszłych. Wejściem są wcześniejsze wytyczne ISACA (COBIT 4.1, Val IT 2.0, Risk IT, BMIS), nowe materiały ISACA i inne standardy – COBIT 5 dopasowano m.in. do ITIL, TOGAF i norm ISO. Aktywatory działają jak filtr zawartości.</p><p>Rodzina produktów (Ilustracja 11): główny podręcznik COBIT 5 <span class=\"en\">Framework</span>; przewodniki o aktywatorach, np. „Procesy umożliwiające”, „Informacje umożliwiające”; przewodniki specjalistyczne, np. „Wdrożenie”, „Bezpieczeństwo informacji”, „Audyt”, „Ryzyko”; do tego środowisko sieciowe oparte na współpracy. Pułapka: „Procesy umożliwiające” to przewodnik o aktywatorze, a nie specjalistyczny.</p>"},{"pt":"Sprawdź się","quiz":{"id":"q-pak-T04Q08","sylabus":["PR-01-01","PR-02-10"],"tresc":"W organizacji działa kilka standardów zarządzania i kierownictwo chce uporządkować ich wykorzystanie. Zauważa też, że pracownicy, procesy i systemy nie współpracują skutecznie. Który opis prawidłowo rozróżnia zasadę 3 (Zastosowanie Pojedynczej Zintegrowanej Struktury Ramowej) i zasadę 4 (Aktywacja holistycznego podejścia)?","opcje":[{"t":"Zasada 3 zastępuje aktywatory, a zasada 4 zastępuje inne standardy","ok":false,"w":"Zasady niczego nie zastępują. Opis myli też zakresy obu zasad."},{"t":"Zasada 3 dotyczy wyłącznie IT, a zasada 4 wyłącznie zarządu","ok":false,"w":"Nie ma takiego podziału zakresu między dział IT i zarząd."},{"t":"Zasada 3 łączy standardy, zasada 4 – współdziałanie aktywatorów","ok":true,"w":"Zasada 3 integruje inne standardy i struktury ramowe w COBIT 5. Zasada 4 mówi, że siedem aktywatorów musi działać razem."},{"t":"Zasada 3 dotyczy kompetencji, a zasada 4 wyłącznie audytu","ok":false,"w":"Żadna z tych zasad nie dotyczy tylko kompetencji ani tylko audytu."}],"src":"COBIT 5 Framework (EN), sekcja rozdział 1, rysunek 2","pomoc":{"t":"Pytanie dotyczy lekcji 1.32 „Baza wiedzy i rodzina produktów COBIT 5”. Cel lekcji: Potrafię opisać, jak wiedza z wytycznych ISACA i innych standardów trafia przez bazę wiedzy do rodziny produktów COBIT 5.","k":["baza-wiedzy","wytyczne-isaca","rodzina-produktow"]},"kurs":"Zasada 3 integruje inne standardy i struktury ramowe w COBIT 5. Zasada 4 mówi, że siedem aktywatorów musi działać razem.","kontekst":""}}],"bankRevision":"57e231c6e019d2bc","legacySp1Order":[null,null,null,{"sp1":"sp1-37"},{"sp1":"sp1-45"},null,null]};</script>
