<script>window.DECK={"id":"k-pc-oceny","rozdzial":"Rozdział 8 · Model zdolności procesu · s. 41–45","tytul":"Skala ocen N/C/W/P i reguła poziomu","prev":"k-pc-atrybuty.html","next":"k-pc-iso.html","T":{"ocena-c":{"t":"C – Częściowy","eg":"C – Częściowy","pd":"P – częściowo osiągnięto","en":"P – Partially achieved (>15–50%)","wyj":"Trochę: coś się dzieje, ale nieregularnie i z dużymi brakami.\n\nGdy osiągnięcie wynosi powyżej 15% do 50%, asesor wpisuje C – Częściowy. Są pewne dowody, ale część aspektów jest nieprzewidywalna. Dokładnie 50% to jeszcze C (konwencja ISO/IEC 15504-2, nie tekst FW-PL).\n\nŻeby oznaczyć atrybut osiągnięty tylko częściowo. To za mało, żeby proces osiągnął poziom, którego dotyczy atrybut.","zycie":"Syn sprząta pokój, ale tylko wtedy, gdy mu przypomnisz, i nie zawsze. Mniej więcej co trzeci raz jest porządek. To C: coś jest, ale bez systemu.","firma":"W warsztacie kartę naprawy ma około 40% zleceń. Ocena to C.","urzad":"Kontrola w urzędzie miasta sprawdza 100 decyzji podatkowych. Komplet podpisów ma około 45% z nich. Dowody są, ale z dużymi brakami, więc ocena to C – Częściowy.","it":"Incydenty w DSS02 rejestruje tylko jedna zmiana serwisu. Asesor znajduje dowody w około 30% przypadków i daje C na PA 1.1.","egz":"C = Częściowy, >15–50% (zapis „>” – konwencja ISO/IEC 15504-2; FW-PL s. 45: „15–50%”). W angielskim arkuszu ta sama ocena to P – Partially. Ocena C na atrybucie danego poziomu = poziom nieosiągnięty. Na egzaminie PL „Częściowy” ma literę C. Po angielsku i w podręczniku ta sama ocena ma literę P (Partially). A „P” na egzaminie PL to Pełny! Nie myl z: P – Pełny – Na egzaminie PL P to Pełny (>85–100%). Częściowy to C. W EN to odwrotnie: P = Partially.; W – Większościowy – C to >15–50% i nie wystarcza do osiągnięcia poziomu. W to >50–85% i już wystarcza dla atrybutów tego poziomu.","src":"COBIT 5 Framework (PL), s. 45; sylabus PeopleCert; materiały Altkom"},"ocena-p":{"t":"P – Pełny","eg":"P – Pełny","pd":"F – w pełni osiągnięto","en":"F – Fully achieved (>85–100%)","wyj":"W pełni: działa kompletnie i systematycznie, bez poważnych słabych punktów.\n\nGdy osiągnięcie wynosi powyżej 85% do 100%, asesor wpisuje P – Pełny. Dowody pokazują kompletne i systematyczne osiągnięcie, bez istotnych słabości.\n\nŻeby oznaczyć atrybut osiągnięty kompletnie i systematycznie. Tylko P na niższych poziomach otwiera drogę wyżej.","zycie":"Przez cały rok córka sama odrabia lekcje i pakuje plecak. Raz zapomniała linijki, ale to drobiazg. To P: w pełni, bez istotnych wpadek.","firma":"W warsztacie każde zlecenie ma kartę, termin i podpis odbioru. Ocena to P – Pełny.","urzad":"W starostwie każda skarga mieszkańca ma datę wpływu i datę odpowiedzi. Kontrola sprawdza 50 skarg i znajduje jedną drobną pomyłkę. Bez istotnych słabości, więc ocena to P – Pełny.","it":"Żeby DSS02 osiągnął poziom 3, PA 1.1, PA 2.1 i PA 2.2 muszą mieć P. PA 3.1 i PA 3.2 potrzebują co najmniej W.","egz":"P (egzamin PL) = Pełny, >85–100% (EN: F – Fully). Wszystkie atrybuty niższych poziomów muszą mieć P, żeby proces osiągnął wyższy poziom. PUŁAPKA NR 1: na egzaminie PL P = Pełny (Fully). Po angielsku i w podręczniku P = Partially, czyli częściowy, a Pełny to F. Ta sama litera, przeciwne znaczenie. Nie myl z: C – Częściowy – Polskie C to angielskie P (Partially, >15–50%). Polskie P to angielskie F (Fully, >85–100%).; W – Większościowy – W wystarcza dla atrybutów ocenianego poziomu. P jest wymagane na wszystkich niższych poziomach.; Relacja P na Ilustracji 5 – Na il. 5 litera P oznacza relację podstawową (cele organizacji). To nie jest ocena atrybutu.","src":"COBIT 5 Framework (PL), s. 45; COBIT 5 Framework (PL), s. 42; sylabus PeopleCert; materiały Altkom"},"ocena-n":{"t":"N – Nieosiągnięty","eg":"N – Nieosiągnięty","pd":"N – nie osiągnięto","en":"N – Not achieved (0–15%)","wyj":"Prawie nic: śladów, że to się dzieje, nie ma albo jest tylko kilka.\n\nAsesor zbiera dowody dla jednego atrybutu procesu. Gdy osiągnięcie wynosi 0–15%, wpisuje N – Nieosiągnięty. Dokładnie 15% to jeszcze N (konwencja ISO/IEC 15504-2, nie tekst FW-PL).\n\nŻeby asesor mógł jedną literą zapisać, że atrybutu prawie nie ma. To dolny stopień skali N/C/W/P.","zycie":"Sprawdzasz, czy syn odrabia lekcje sam. Przez miesiąc zrobił to raz, po trzech przypomnieniach. To N: śladu prawie nie ma.","firma":"W hurtowni jest jedna kopia zapasowa sprzed roku i nikt nie wie, gdzie leży. Ocena to N.","urzad":"W urzędzie gminy na sto spraw tylko dwie zarejestrowano w terminie. Dowodów prawie nie ma, więc ocena to N – Nieosiągnięty.","it":"Asesor ocenia PA 1.1 dla DSS04. Planu ciągłości nie ma, są tylko stare kopie zapasowe. Ocena N oznacza poziom 0.","egz":"N = Nieosiągnięty, 0–15%. Dokładnie 15% to wciąż N – według konwencji ISO/IEC 15504-2 (uproszczenie); FW-PL s. 45 podaje tylko „0–15%, 15–50%” bez rozstrzygnięcia krańców. N na PA 1.1 → poziom 0. Nie myl z: C – Częściowy – N to 0–15%: dowodów brak albo są znikome. C to >15–50%: są pewne dowody częściowego osiągnięcia.; Poziomy zdolności 0–5 – N to ocena jednego atrybutu. Poziom 0 to wynik całego procesu, gdy PA 1.1 nie osiąga co najmniej W.","src":"COBIT 5 Framework (PL), s. 45; sylabus PeopleCert; materiały Altkom"},"ocena-w":{"t":"W – Większościowy","eg":"W – Większościowy","pd":"L – w znacznym stopniu osiągnięto","en":"L – Largely achieved (>50–85%)","wyj":"W większości: działa systematycznie, choć zdarzają się słabsze miejsca.\n\nGdy osiągnięcie wynosi powyżej 50% do 85%, asesor wpisuje W – Większościowy. Widać systematyczne podejście, choć zdarzają się słabości. Dokładnie 85% to jeszcze W (konwencja ISO/IEC 15504-2, nie tekst FW-PL).\n\nŻeby oznaczyć atrybut osiągnięty w znacznym stopniu, z drobnymi słabościami. W wystarcza na poziomie, który właśnie oceniasz.","zycie":"Córka prawie zawsze wraca na czas, ale raz w miesiącu się spóźnia. Jest system, są drobne wpadki. To W: w większości.","firma":"W piekarni plan produkcji powstaje codziennie, ale co piąty dzień nikt go nie sprawdza. Ocena to W.","urzad":"W urzędzie marszałkowskim rejestr skarg prowadzi się systematycznie, ale kompletnych jest około 70% wpisów. W pozostałych brakuje daty odpowiedzi. Jest system, są słabości, więc ocena to W – Większościowy.","it":"DSS02 ma PA 1.1 na P, a PA 2.1 i PA 2.2 na W. Proces osiąga poziom 2, ale nie wejdzie na poziom 3.","egz":"W = Większościowy, >50–85% (EN: L – Largely; zapis „>” – konwencja ISO/IEC 15504-2, FW-PL s. 45: „50–85%”). Proces osiąga poziom, gdy atrybuty tego poziomu mają W lub P, a niższe – P. Na egzaminie PL „Większościowy” ma literę W. Po angielsku i w podręczniku to L (Largely, „w znacznym stopniu”). W wystarcza dla atrybutów poziomu, który oceniasz, ale nie dla niższych. Nie myl z: P – Pełny – W (>50–85%) wystarcza dla atrybutów ocenianego poziomu. P (>85–100%) jest wymagane na wszystkich niższych poziomach.; C – Częściowy – C (>15–50%) nie wystarcza do osiągnięcia poziomu. W już wystarcza.","src":"COBIT 5 Framework (PL), s. 45; COBIT 5 Framework (PL), s. 42; sylabus PeopleCert; materiały Altkom"},"rezultat":{"t":"Rezultat / wynik","eg":"Rezultat / wynik","pd":"Wynik","en":"Output","wyj":"Konkretny produkt pracy, np. raport, działający program albo podpisana umowa.\n\nRezultat (output) to bezpośredni produkt pracy procesu albo projektu, np. wdrożony system, raport czy przeprowadzone szkolenie. W COBIT 5 wyjścia (outputs) praktyk jednego procesu bywają wejściami innych praktyk i procesów. Korzyść (benefit) pojawia się dopiero wtedy, gdy rezultat realnie coś poprawia u interesariuszy.\n\nŻeby odróżnić to, co praca bezpośrednio wytworzyła, od korzyści, którą ma przynieść, i nie uznawać samego dostarczenia za sukces.","zycie":"Kupujesz bieżnię i stawiasz ją w sypialni – bieżnia to rezultat. Jeśli po pół roku służy za wieszak na ubrania, rezultat jest, a korzyści, czyli lepszej kondycji, nie ma.","firma":"Warsztat zamawia stronę internetową z rezerwacją wizyt i od poniedziałku strona działa – to rezultat. Czy przyniesie korzyść, okaże się, gdy właściciel policzy, ile osób naprawdę się przez nią umówiło.","urzad":"Szkoła robi dla rodziców szkolenie z e-dziennika: 80 osób na sali, lista obecności podpisana. To rezultat. Korzyść będzie wtedy, gdy rodzice przestaną dzwonić do sekretariatu po oceny.","it":"Projekt w BAI03 (Zarządzanie identyfikacją i budowaniem rozwiązań) dostarcza nową aplikację – to rezultat (output). Czy powstała korzyść, sprawdza się później, np. w EDM02 (Zapewnienie realizacji korzyści), porównując efekty z uzasadnieniem biznesowym.","egz":"Pytania o „sukces projektu”: dostarczenie zgodnie z umową (rezultat) NIE oznacza jeszcze wartości dla interesariuszy (korzyść). Nie myl z: Realizacja korzyści – Korzyść = zmiana na lepsze dzięki rezultatowi.; Rezultat procesu w ISO/IEC 15504 (outcome) – Tu „rezultat” to output – konkretny produkt pracy (raport, działający system). W ocenie zdolności (ISO/IEC 15504) „rezultat” to outcome – obserwowalny skutek osiągnięcia przeznaczenia procesu. To dwa różne angielskie słowa przetłumaczone tak samo.","src":"COBIT 5 Framework (PL), s. 92"},"skala-ocen":{"t":"Skala ocen N / C / W / P","eg":"Skala ocen N / C / W / P","pd":"Skala ocen N / P / L / F","en":"Rating scale N/P/L/F","wyj":"Cztery stopnie: nic, trochę, w większości, w pełni, czyli N, C, W, P.\n\nKażdy atrybut procesu (np. PA 1.1, PA 2.1) asesor ocenia na podstawie dowodów w czterostopniowej skali: N – nieosiągnięty (Not achieved, 0–15%), C – częściowy (Partially, >15–50%), W – większościowy (Largely, >50–85%), P – pełny (Fully, >85–100%). Proces osiąga dany poziom, gdy atrybuty tego poziomu mają W lub P, a wszystkie atrybuty niższych poziomów mają P.\n\nŻeby asesor mógł ocenić, w jakim stopniu atrybut procesu jest osiągnięty, a nie tylko „tak albo nie”, i żeby oceny różnych asesorów były porównywalne.","zycie":"Przez miesiąc patrzysz, jak syn sprząta swój pokój. Prawie nigdy – N; czasem, gdy mu przypomnisz – C; zwykle tak, ale zdarzają się wpadki – W; zawsze i bez przypominania – P. Tak samo asesor ocenia atrybut procesu: czterema stopniami, od braku do pełnego.","firma":"Asesor sprawdza w warsztacie, czy praca jest planowana i pilnowana (PA 2.1). Plany są, ale w co trzecim zleceniu nikt nie sprawdził terminu – ocena W. Jeśli PA 1.1 ma P, a PA 2.2 co najmniej W, warsztat ma poziom 2; do poziomu 3 musi najpierw dociągnąć PA 2.1 i PA 2.2 do P.","urzad":"Asesor ocenia w urzędzie gminy proces kopii zapasowych. Kopie się robią, ale tylko kilka z nich ktoś kiedykolwiek próbnie odtworzył, więc PA 1.1 dostaje C. Przy C urząd nie ma nawet poziomu 1, bo do niego PA 1.1 musi mieć co najmniej W.","it":"Asesor ocenia BAI06 (Zarządzanie zmianami): PA 1.1 = P, PA 2.1 = P, PA 2.2 = C, bo tylko część wniosków o zmianę jest kontrolowana. Proces ma poziom 1, bo na poziomie 2 atrybut PA 2.2 musi mieć co najmniej W.","egz":"Żeby pozytywnie przejść ocenę danego poziomu, wystarczy W (większościowy) lub P (pełny). Ocena C (częściowy) to za mało. Niższe poziomy muszą mieć P. NAJWIĘKSZA PUŁAPKA: na egzaminie PL litera P oznacza PEŁNY (Fully). W podręczniku i po angielsku P to Partially, czyli częściowy. Egzamin: N – Nieosiągnięty, C – Częściowy, W – Większościowy, P – Pełny. Nie myl z: Relacja P na Ilustracji 5 – Na Ilustracji 5 (cele organizacji) P oznacza relację PODSTAWOWĄ. To coś zupełnie innego niż ocena atrybutu.","src":"COBIT 5 Framework (PL), s. 45; materiały Altkom; sylabus PeopleCert"},"proces":{"t":"Proces","eg":"Proces","pd":"Proces","en":"Process","wyj":"Coś, co robimy regularnie i zawsze w podobny sposób, np. przyjmowanie każdego zgłoszenia.\n\nProces (process) przyjmuje wejścia (inputs), przetwarza je przez praktyki i działania ukierunkowane przez polityki i procedury i daje wyniki (outputs), np. produkt albo usługę. Ma właściciela, role i mierniki, a wynik jednego procesu bywa wejściem innego. W COBIT 5 procesy są jednym z siedmiu aktywatorów, a Referencyjny Model Procesu opisuje ich 37.\n\nŻeby powtarzalną pracę wykonywać za każdym razem tak samo dobrze, niezależnie od tego, kto ją akurat robi, i żeby dało się ją mierzyć i poprawiać.","zycie":"Co sobotę rano sprawdzasz lodówkę, piszesz listę, jedziesz do sklepu, rozpakowujesz i odhaczasz, czego zabrakło. Za tydzień wszystko powtarza się od nowa. To proces: stałe kroki, wejście (pusta lodówka i lista) i wynik (pełna lodówka).","firma":"W sklepie internetowym z herbatą przychodzi zamówienie, pracownik pakuje paczkę, drukuje etykietę i fakturę, a kurier odbiera paczki o 15:00. Tak samo dzieje się z każdym zamówieniem, codziennie. To proces – powtarzalny, z wejściem (zamówienie) i wynikiem (paczka u klienta).","urzad":"Do urzędu gminy wpływa wniosek o wycinkę drzewa. Kancelaria go rejestruje, kierownik przydziela go referentowi, ten jedzie na oględziny i wydaje decyzję. Każdy kolejny wniosek idzie tą samą ścieżką – to jest proces.","it":"DSS02 (Zarządzanie zgłoszeniami serwisowymi i incydentami) to proces: każde zgłoszenie (wejście) jest rejestrowane, klasyfikowane, rozwiązywane i zamykane (praktyki), a wynikiem jest przywrócona usługa i wpis w rejestrze. Działa codziennie i tak samo dla każdego zgłoszenia.","egz":"Opis „zbiór praktyk ukierunkowanych politykami i procedurami, który przetwarza wejścia w wyniki” to Proces (Załącznik H). Nie myl z: Projekt – Projekt jest jednorazowy, ma początek i koniec (np. wdrożenie systemu). Proces trwa i się powtarza (np. obsługa zgłoszeń w tym systemie).","src":"COBIT 5 Framework (PL), s. 93"}},"S":[{"lekcje":["pc-k40-skala-ocen","pc-k41-oceny-n-i-c","pc-k42-oceny-w-i-p"],"pt":"Lekcje 4.40–4.42","h":"Skala ocen N/C/W/P: progi 15, 50 i 85%","b":"<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>Egzamin PL<\/th><th>EN = podręcznik<\/th><th>Stopień<\/th><\/tr><tr><td><w k=\"ocena-n\">N – Nieosiągnięty<\/w><\/td><td>N – Not achieved<\/td><td>0–15%<\/td><\/tr><tr><td><w k=\"ocena-c\">C – Częściowy<\/w><\/td><td><b>P<\/b> – Partially<\/td><td>&gt;15–50%<\/td><\/tr><tr><td><w k=\"ocena-w\">W – Większościowy<\/w><\/td><td>L – Largely<\/td><td>&gt;50–85%<\/td><\/tr><tr><td><w k=\"ocena-p\"><b>P<\/b> – Pełny<\/w><\/td><td>F – Fully<\/td><td>&gt;85–100%<\/td><\/tr><\/table><\/div>","c":"Na egzaminie P znaczy Pełny; w podręczniku P znaczy „częściowo”.","s":"COBIT 5 Framework (PL), s. 45","ctx":"<p><w k=\"skala-ocen\">Skalę ocen<\/w> <span class=\"en\">Rating scale<\/span> stosuje się do każdego atrybutu osobno; procent opisuje stopień, w jakim istnieją dowody. N – brak dowodów lub znikoma ich liczba. C – pewne dowody, osiąganie częściowe, niektóre aspekty nieprzewidywalne. W – dowody systematyczne, mogą istnieć pewne słabości. P – dowody kompletne, brak istotnych słabości (co nie znaczy 100%).<\/p><p>Skutek: PA 1.1 z oceną N albo C oznacza poziom 0, bo „w znacznym stopniu” zaczyna się od W. Tylko N znaczy to samo w obu skalach. Przykład: bank dostaje angielski raport „PA 2.1 – P”; w polskim zestawieniu musi wpisać C – Częściowy, inaczej słaby atrybut wyglądałby na wzorowy.<\/p>"},{"pt":"Sprawdź się","quiz":{"id":"q-pck-40-3","sylabus":["PC-01-03","PC-02-06"],"tresc":"Co na <b>polskim egzaminie<\/b> oznacza ocena P?","opcje":[{"t":"Pełny – atrybut osiągnięty w ponad 85–100%","ok":true,"w":"Dobrze. Na egzaminie PL P = Pełny (<em>Fully achieved<\/em>)."},{"t":"Przewidywalny – poziom 4 zdolności","w":"Litera skali ocen nie jest nazwą poziomu."},{"t":"Większościowy – atrybut osiągnięty w ponad 50–85%","w":"To ocena W."},{"t":"Częściowy – atrybut osiągnięty w ponad 15–50%","w":"To znaczenie litery P w podręczniku i EN (<em>Partially<\/em>). Na egzaminie to C."}],"src":"COBIT 5 Framework (PL), s. 45; materiały Altkom","pomoc":{"t":"Pytanie dotyczy lekcji 4.40 „Skala ocen N/C/W/P”. Cel lekcji: Potrafię podać cztery oceny skali N/C/W/P z progami i ich angielskie odpowiedniki N/P/L/F.","k":["skala-ocen"]}}},{"pt":"Sprawdź się","quiz":{"id":"q-pck-41-3","sylabus":["PC-01-03","PC-02-06"],"tresc":"Jak podręcznik opisuje ocenę, którą egzamin PL nazywa N – Nieosiągnięty?","opcje":[{"t":"Dowody systematycznego osiągania, z pewnymi słabościami","w":"To opis oceny W (w podręczniku L)."},{"t":"Brak dowodów osiągania atrybutu albo ich znikoma liczba","ok":true,"w":"Dobrze. N to 0–15%."},{"t":"Proces nie istnieje w organizacji","w":"Ocena N dotyczy atrybutu, a nie istnienia procesu."},{"t":"Pewne dowody i częściowe osiąganie atrybutu","w":"To opis oceny C (w podręczniku P)."}],"src":"COBIT 5 Framework (PL), s. 45","pomoc":{"t":"Pytanie dotyczy lekcji 4.41 „Oceny N i C – za mało na nowy poziom”. Cel lekcji: Potrafię rozpoznać oceny N i C i wyjaśnić, dlaczego N albo C przy PA 1.1 oznacza poziom 0.","k":["ocena-n","ocena-c"]}}},{"pt":"Sprawdź się","quiz":{"id":"q-pck-42-3","sylabus":["PC-01-03","PC-02-06"],"tresc":"Który zestaw par EN → egzamin PL jest poprawny?","opcje":[{"t":"L → C, F → W, P → P","w":"Pary są przesunięte."},{"t":"L → W, F → P, P → P","w":"EN P (Partially) to na egzaminie C, a nie P."},{"t":"L → W, F → P, P → C","ok":true,"w":"Dobrze. Largely = Większościowy, Fully = Pełny, Partially = Częściowy."},{"t":"L → P, F → W, P → C","w":"L i F są zamienione."}],"src":"COBIT 5 Framework (PL), s. 45; materiały Altkom","pomoc":{"t":"Pytanie dotyczy lekcji 4.42 „Oceny W i P – w większości i w pełni”. Cel lekcji: Potrafię odróżnić ocenę W od oceny P i podać ich angielskie odpowiedniki L i F.","k":["ocena-w","ocena-p"]}}},{"lekcje":["pc-k43-regula-poziomu"],"pt":"Lekcja 4.43","h":"Reguła poziomu: nowy szczebel co najmniej W, niższe – P","b":"<p><w k=\"proces\">Proces<\/w> osiąga poziom n, gdy:<\/p><ol><li>atrybuty poziomu n mają <b>W lub P<\/b>,<\/li><li>wszystkie atrybuty niższych poziomów mają <b>P<\/b>.<\/li><\/ol><p>Poziom 1: wystarczy PA 1.1 = W.<\/p>","c":"Bez średniej i bez przeskoków: piętro może być w budowie, fundament musi być gotowy.","s":"Sylabus; COBIT 5 Framework (PL), s. 42","ctx":"<p>Regułę formułuje sylabus, a jej sedno podaje podręcznik: „Każdy z poziomów potencjału może zostać osiągnięty tylko wtedy, gdy w pełni uzyskano niższy poziom”. Przykład z podręcznika – poziom 3: PA 3.1 i PA 3.2 na W lub P, a PA 1.1, PA 2.1 i PA 2.2 na P. Poziom 1 nie ma niższych atrybutów, więc wystarczy W; na poziomie 2 PA 1.1 musi już mieć P.<\/p><p>Trzy błędy egzaminacyjne: liczenie średniej z atrybutów, wymaganie P także na zdobywanym szczeblu i przeskakiwanie szczebla dzięki dobrym ocenom wyżej. Przykład: gmina ma wspólną, stosowaną procedurę (PA 3.1 i PA 3.2 = P), ale nikt nie planuje pracy (PA 2.1 = C) – wynik to poziom 1, nie 3.<\/p>"},{"pt":"Sprawdź się","quiz":{"id":"q-pck-43-2","sylabus":["PC-01-03","PC-02-06"],"tresc":"Proces ma PA 1.1 = P, PA 2.1 = W, PA 2.2 = W. Jaki poziom osiąga?","opcje":[{"t":"Poziom 3, bo wszystkie oceny są co najmniej W","w":"Poziom 3 wymaga atrybutów PA 3.1 i PA 3.2 oraz P na poziomie 2."},{"t":"Poziom 0, bo nie wszystkie atrybuty mają P","w":"PA 1.1 = P, więc poziom 1 jest osiągnięty."},{"t":"Poziom 1, bo PA 2.1 i PA 2.2 nie mają P","w":"Na nowym poziomie wystarczy W."},{"t":"Poziom 2","ok":true,"w":"Dobrze. PA 2.1 i PA 2.2 mają co najmniej W, a PA 1.1 = P."}],"src":"COBIT 5 Framework (PL), s. 42; sylabus PeopleCert","pomoc":{"t":"Pytanie dotyczy lekcji 4.43 „Reguła poziomu – W na nowym szczeblu, P poniżej”. Cel lekcji: Potrafię zastosować regułę: atrybuty danego poziomu mają co najmniej W, a wszystkie niższe mają P.","k":[]}}},{"pt":"Arkusz próbny","sp1":"sp1-35","lekcja":"4.43","temat":"Reguła poziomu – W na nowym szczeblu, P poniżej","k":[]},{"lekcje":["pc-k44-liczymy-poziom"],"pt":"Lekcja 4.44","h":"Poziom liczysz od dołu, cel wybierasz z kosztów i korzyści","b":"<p>PA 1.1 P · 2.1 W · 2.2 P · 3.1 P · 3.2 W<\/p><ul><li>poziomy 1 i 2 – spełnione,<\/li><li>poziom 3 – nie, bo PA 2.1 nie ma P.<\/li><\/ul><p><b><w k=\"rezultat\">Wynik<\/w>: poziom 2.<\/b><\/p>","c":"Pierwszy niespełniony szczebel zatrzymuje wynik; rozsądne minimum to poziom 1 dla wszystkich procesów.","s":"Sylabus; COBIT 5 Framework (PL), s. 43, 45","ctx":"<p>Sprawdzaj szczeble od poziomu 1 w górę i przy każdym pytaj: czy jego atrybuty mają co najmniej W i czy wszystkie niższe mają P. Drugi przykład: PA 1.1 = W, PA 2.1 = P, PA 2.2 = P daje poziom 1 – poziom 2 blokuje PA 1.1 bez P.<\/p><p>Poziom docelowy wybiera organizacja dla każdego procesu osobno, na podstawie rachunku kosztów i korzyści oraz analizy wykonalności; rzadko jest to jeden z najwyższych. Podręcznik: ambicją wielu organizacji będzie poziom 1 we wszystkich procesach – proces, który nie daje wyniku, nie ma sensu. Przykład: ubezpieczyciel przyjmuje minimum 1 dla wszystkich 37 procesów i cel 3 dla obsługi szkód; różnica między stanem obecnym a docelowym to luka do planu doskonalenia.<\/p>"},{"pt":"Sprawdź się","quiz":{"id":"q-pck-44-3","sylabus":["PC-01-03","PC-02-06"],"tresc":"Sklep internetowy: PA 1.1 = W, PA 2.1 = P, PA 2.2 = P. Jaki poziom zdolności osiągnął proces?","opcje":[{"t":"Poziom 1","ok":true,"w":"Dobrze. Poziom 2 wymaga PA 1.1 = P, a tu jest W."},{"t":"Poziom 2, bo atrybuty poziomu 2 mają P","w":"Poziom 1 nie jest osiągnięty w pełni."},{"t":"Poziom 0, bo PA 1.1 nie ma P","w":"Na poziom 1 wystarczy PA 1.1 = W."},{"t":"Poziom 3, bo większość ocen to P","w":"Brak ocen poziomu 3 i nie liczy się większość."}],"src":"COBIT 5 Framework (PL), s. 42; sylabus PeopleCert","pomoc":{"t":"Pytanie dotyczy lekcji 4.44 „Liczymy poziom krok po kroku i wybieramy poziom docelowy”. Cel lekcji: Potrafię wyznaczyć poziom zdolności z ocen atrybutów i wyjaśnić, jak wybiera się poziom docelowy.","k":[]}}}]};</script>
