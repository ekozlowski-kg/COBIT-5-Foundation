window.DECK={id:'03-czytanie-pytan',rozdzial:'Poza podręcznikiem · Egzamin',tytul:'Rozbiór pytań: 9 typów na przykładach',prev:'k-ex-strategia.html',next:'k-ex-powtorka.html',
T:{"faza-3":{"t":"Faza 3: Dokąd chcemy dojść?","eg":"Faza 3: Dokąd chcemy dojść?","pd":"Faza 3: Do czego dążymy?","en":"Phase 3: Where do we want to be?","wyj":"Trzeci krok: mówisz jasno, gdzie chcesz być, i widzisz, ile brakuje do celu.\n\nDefiniujesz stan docelowy, np. wyższy poziom zdolności procesu. Analiza luk pokazuje, czego brakuje. Wybierasz szybkie korzyści i najbardziej opłacalne inicjatywy. Rezultat komunikujesz ludziom, a program układa mapę drogową.\n\nŻeby jasno nazwać cel i zobaczyć lukę między dziś a celem. Wtedy wiesz, co zrobić najpierw.","zycie":"Ważysz 92 kg. Ustalasz cel: 84 kg do lipca. Widzisz lukę – 8 kg. Najprostszy ruch to rzucić słodzone napoje, więc zaczynasz od niego. Mówisz rodzinie, do czego dążysz. To faza 3.","firma":"Sklep chce wysyłać paczki w 2 dni zamiast 4: najpierw nowy kurier, potem nowy magazyn.","urzad":"Starostwo ustala cel: połowa spraw w wydziale komunikacji ma być umawiana przez e-rezerwację, czyli rezerwację wizyt przez Internet. Analiza luk pokazuje, że brakuje systemu rezerwacji i szkoleń dla urzędników. Cel i plan dojścia starosta ogłasza wszystkim pracownikom.","it":"Stan docelowy: DSS02 na poziomie 3. Analiza luk pokazuje braki w atrybutach PA 2.1, PA 2.2, PA 3.1 i PA 3.2.","egz":"Elementy fazy 3: Zdefiniowanie stanu docelowego, Komunikowanie rezultatu, Definiowanie mapy drogowej. Faza 3 to też analiza luk i szybkie korzyści. „Identyfikacja odtwórców ról” to już faza 4. Działanie programu w fazie 3 na egzaminie to „Definiowanie mapy drogowej”. Podręcznik (il. 17) pisze „Zdefiniowanie planu działań”. Słowo „plan” kusi, żeby wskazać fazę 4, a to faza 3. Nie myl z: Faza 4: Co trzeba zrobić? – Mapa drogowa (faza 3) wyznacza kierunek i kolejność kroków. Planowanie programu (faza 4) to szczegółowy plan z projektami i uzasadnieniami biznesowymi.; Faza 2: Gdzie jesteśmy teraz? – Faza 2 opisuje stan obecny. Faza 3 ustala stan docelowy i lukę.","src":"COBIT 5 Framework (PL), s. 38"},"faza-4":{"t":"Faza 4: Co trzeba zrobić?","eg":"Faza 4: Co trzeba zrobić?","pd":"Faza 4: Jakie działania należy podjąć? (odczyt il. 17)","en":"Phase 4: What needs to be done?","wyj":"Czwarty krok: rozpisujesz konkretne zadania, koszty i ludzi, zanim cokolwiek zaczniesz robić.\n\nPlanujesz program i projekty wspierane przez uzasadnienia biznesowe. Wskazujesz odtwórców ról, czyli osoby do nowych zadań. Budujesz usprawnienia, ale jeszcze ich nie wdrażasz.\n\nŻeby zamienić cel w konkretne projekty z ludźmi, kosztami i spodziewanymi korzyściami. Bez planu realizacja się rozjedzie.","zycie":"Masz cel: minus 8 kg. Teraz rozpisujesz plan posiłków, kupujesz karnet i umawiasz się z kolegą na wspólne bieganie we wtorki. Liczysz koszt i sprawdzasz, czy się opłaca. Jeszcze nie biegasz. To faza 4.","firma":"Sklep rozpisuje dwa projekty, zmianę kuriera i nowy magazyn, każdy z kosztorysem i zyskiem.","urzad":"Starostwo rozpisuje projekt e-rezerwacji z budżetem i uzasadnieniem biznesowym: ile kosztuje i o ile skróci kolejki. Wyznacza dwie urzędniczki na opiekunki systemu. System jest przygotowany, ale mieszkańcy jeszcze z niego nie korzystają.","it":"Każdy projekt prowadzisz według BAI01 i z uzasadnieniem biznesowym. Tabela RACI wskazuje, kto odpowiada za usprawniony proces DSS02.","egz":"Faza, w której projekty są wspierane przez uzasadnienia biznesowe → faza 4. Jej działania: Planowanie programu, Identyfikacja odtwórców ról, Budowanie usprawnień. „Budowanie usprawnień” brzmi jak robota w terenie, ale to faza 4. Samo „Wdrażanie usprawnień” to faza 5. Podręcznik nazywa działanie programu „Zaplanowanie programu”, a egzamin – „Planowanie programu”. Nie myl z: Faza 5: Jak się tam dostaniemy? – Faza 4 buduje i planuje usprawnienia. Faza 5 je wdraża (Wdrażanie usprawnień, Wykonywanie planu).; Faza 3: Dokąd chcemy dojść? – Faza 3 wyznacza mapę drogową. Faza 4 zamienia ją w plan programu z projektami i uzasadnieniami biznesowymi.","src":"COBIT 5 Framework (PL), s. 38"},"interesariusz":{"t":"Interesariusz","eg":"Interesariusz","pd":"Interesariusz","en":"Stakeholder","wyj":"Każdy, kogo dana sprawa obchodzi, bo coś na niej zyska albo straci.\n\nSpisuje się wszystkich, którzy mają wobec organizacji oczekiwania, odpowiadają za nią albo ponoszą skutki jej działań (stakeholders). Dzieli się ich na wewnętrznych (internal: zarząd, kierownictwo, właściciele procesów, użytkownicy, audyt wewnętrzny) i zewnętrznych (external: klienci, dostawcy, regulatorzy, audytorzy zewnętrzni, udziałowcy). Ich potrzeby (stakeholder needs) Ład ocenia i przekłada na cele organizacji.\n\nŻeby organizacja wiedziała, czyje potrzeby ma zaspokajać i przed kim się rozlicza. Od interesariuszy zaczyna się cała kaskada celów COBIT 5.","zycie":"Wspólnota w bloku decyduje o wymianie windy. Pani z parteru zapłaci tyle samo co inni, choć z windy nie korzysta, starszy pan z dziesiątego piętra bez niej nie wyjdzie z domu, a zarządca chce zamknąć temat przed zimą. Każde z nich coś na tej decyzji zyskuje albo traci – wszyscy są interesariuszami, także ci, którzy windą nie jeżdżą.","firma":"Właściciel piekarni kupuje na kredyt nowy piec. Piekarze martwią się, czy ogarną nową obsługę, klienci liczą na świeże bułki od szóstej, bank pyta o spłatę rat, a sanepid przyjdzie sprawdzić, czy wszystko jest zgodnie z przepisami. Każdy z nich coś zyska albo straci na tej decyzji: piekarze to interesariusze wewnętrzni, klienci, bank i sanepid – zewnętrzni.","urzad":"Urząd gminy przenosi zapisy do przedszkoli do internetu. Rodzice chcą zapisać dziecko z telefonu, dyrektorki przedszkoli boją się bałaganu na listach, a babcia, która wychowuje wnuka, nie ma komputera i pyta, czy dalej może przyjść z papierem. Wszyscy oni są interesariuszami tej zmiany – również babcia, która z systemu nigdy nie skorzysta.","it":"W EDM05 (Zapewnienie przejrzystości dotyczącej interesariuszy) zarząd ustala, którym interesariuszom i jak raportuje wyniki IT, np. udziałowcom raport kwartalny, a regulatorowi wymagane sprawozdania. Relacje z interesariuszami biznesowymi wewnątrz organizacji prowadzi APO08 (Zarządzanie relacjami).","egz":"Rozróżniaj interesariuszy wewnętrznych (kierownictwo, zarząd, CIO, właściciele procesów, audyt wewnętrzny) i zewnętrznych (klienci, partnerzy biznesowi, regulatorzy, dostawcy, audytorzy zewnętrzni). Źródło: Ilustracja 7 (s. 22); por. s. 69 (il. 29). Nie myl z: Shareholder – udziałowiec / akcjonariusz – Udziałowiec to tylko jeden z interesariuszy – ten, który ma udziały. Interesariuszem jest też np. klient czy regulator, choć nie ma żadnych udziałów.; Użytkownik systemu – Użytkownik jest interesariuszem, ale interesariuszem może być też ktoś, kto z systemu w ogóle nie korzysta (np. pacjent czekający na wynik badania).; Decydent – Interesariusz nie musi podejmować decyzji – wystarczy, że decyzja na niego wpływa.","src":"COBIT 5 Framework (PL), s. 22, 93"},"lad":{"t":"Ład","eg":"Ład","pd":"Nadzór","en":"Governance","wyj":"Szefostwo decyduje, po co i co robimy, i pilnuje, czy idziemy w dobrą stronę.\n\nOrgan Ładu, zwykle zarząd pod przewodnictwem prezesa, ocenia potrzeby, warunki i opcje interesariuszy (Evaluate), ustala priorytety i podejmuje decyzje (Direct), a potem monitoruje sprawność i zgodność z wyznaczonym kierunkiem (Monitor). Wyniki z Zarządzania wracają do Ładu i cykl się powtarza.\n\nŻeby informatyka robiła to, czego potrzebuje cała organizacja, a nie tylko to, co umieją informatycy.","zycie":"Wspólnota mieszkaniowa na zebraniu rocznym ocenia stan budynku i decyduje: w tym roku najpierw dach, elewacja dopiero za dwa lata, a zarządca co kwartał pokazuje wydatki. Wyboru dekarza i pilnowania ekipy zebranie już nie robi – to robota zarządcy. Ocenić, wyznaczyć kierunek, monitorować: to jest Ład.","firma":"Właścicielka restauracji raz na kwartał siada z wynikami i decyduje: celujemy w rodziny z dziećmi, marża ma wynosić co najmniej 20%, a za trzy miesiące sprawdzamy, czy to działa. Co i jak gotować każdego dnia, ustala już szef kuchni. Ona sprawuje Ład, on zarządza.","urzad":"Rada gminy przyjmuje strategię cyfryzacji: najpierw e-usługi dla mieszkańców, potem nowy system księgowy. Ustala na to budżet i co pół roku każe sobie przedstawić, co zrobiono. Wybór dostawcy i prowadzenie wdrożenia zostawia urzędowi – rada sprawuje Ład, a nie zarządza projektem.","it":"W EDM03 (Zapewnienie optymalizacji ryzyka) zarząd ocenia ryzyko IT, ustala apetyt na ryzyko i monitoruje, czy organizacja go nie przekracza.","egz":"Zapamiętaj czasowniki: Ład = Oszacuj, Kieruj, Monitoruj (EDM); odpowiada zarząd pod przewodnictwem prezesa (EN: chairperson – przewodniczący rady/zarządu, nie CEO). Zarządzanie = Planuj, Twórz, Wykonuj, Monitoruj; odpowiada kierownictwo pod przewodnictwem CEO. Egzamin PL: „Ład”. Podręcznik PL: „Nadzór”. EN: Governance. To jedno i to samo pojęcie. Słowo „nadzór” w pytaniu egzaminacyjnym może też pojawić się w zbitce „ład i nadzór”. Nie myl z: Zarządzanie – Zarządzanie (management) planuje, buduje, uruchamia i monitoruje działania ZGODNIE z kierunkiem wyznaczonym przez Ład.; Nadzór w znaczeniu kontroli / inspekcji – Polskie „nadzór” kojarzy się z kontrolą. W COBIT to coś szerszego: także wyznaczanie kierunku i ustalanie priorytetów.; Ład korporacyjny (enterprise governance) – Ład nad IT w organizacji (GEIT) jest CZĘŚCIĄ ładu korporacyjnego (Zasada 2).","src":"COBIT 5 Framework (PL), s. 14, 91"},"ocena-p":{"t":"P – Pełny","eg":"P – Pełny","pd":"F – w pełni osiągnięto","en":"F – Fully achieved (>85–100%)","wyj":"W pełni: działa kompletnie i systematycznie, bez poważnych słabych punktów.\n\nGdy osiągnięcie wynosi powyżej 85% do 100%, asesor wpisuje P – Pełny. Dowody pokazują kompletne i systematyczne osiągnięcie, bez istotnych słabości.\n\nŻeby oznaczyć atrybut osiągnięty kompletnie i systematycznie. Tylko P na niższych poziomach otwiera drogę wyżej.","zycie":"Przez cały rok córka sama odrabia lekcje i pakuje plecak. Raz zapomniała linijki, ale to drobiazg. To P: w pełni, bez istotnych wpadek.","firma":"W warsztacie każde zlecenie ma kartę, termin i podpis odbioru. Ocena to P – Pełny.","urzad":"W starostwie każda skarga mieszkańca ma datę wpływu i datę odpowiedzi. Kontrola sprawdza 50 skarg i znajduje jedną drobną pomyłkę. Bez istotnych słabości, więc ocena to P – Pełny.","it":"Żeby DSS02 osiągnął poziom 3, PA 1.1, PA 2.1 i PA 2.2 muszą mieć P. PA 3.1 i PA 3.2 potrzebują co najmniej W.","egz":"P (egzamin PL) = Pełny, >85–100% (EN: F – Fully). Wszystkie atrybuty niższych poziomów muszą mieć P, żeby proces osiągnął wyższy poziom. PUŁAPKA NR 1: na egzaminie PL P = Pełny (Fully). Po angielsku i w podręczniku P = Partially, czyli częściowy, a Pełny to F. Ta sama litera, przeciwne znaczenie. Nie myl z: C – Częściowy – Polskie C to angielskie P (Partially, >15–50%). Polskie P to angielskie F (Fully, >85–100%).; W – Większościowy – W wystarcza dla atrybutów ocenianego poziomu. P jest wymagane na wszystkich niższych poziomach.; Relacja P na Ilustracji 5 – Na il. 5 litera P oznacza relację podstawową (cele organizacji). To nie jest ocena atrybutu.","src":"COBIT 5 Framework (PL), s. 42, 45"},"ocena-w":{"t":"W – Większościowy","eg":"W – Większościowy","pd":"L – w znacznym stopniu osiągnięto","en":"L – Largely achieved (>50–85%)","wyj":"W większości: działa systematycznie, choć zdarzają się słabsze miejsca.\n\nGdy osiągnięcie wynosi powyżej 50% do 85%, asesor wpisuje W – Większościowy. Widać systematyczne podejście, choć zdarzają się słabości. Dokładnie 85% to jeszcze W (konwencja ISO/IEC 15504-2, nie tekst FW-PL).\n\nŻeby oznaczyć atrybut osiągnięty w znacznym stopniu, z drobnymi słabościami. W wystarcza na poziomie, który właśnie oceniasz.","zycie":"Córka prawie zawsze wraca na czas, ale raz w miesiącu się spóźnia. Jest system, są drobne wpadki. To W: w większości.","firma":"W piekarni plan produkcji powstaje codziennie, ale co piąty dzień nikt go nie sprawdza. Ocena to W.","urzad":"W urzędzie marszałkowskim rejestr skarg prowadzi się systematycznie, ale kompletnych jest około 70% wpisów. W pozostałych brakuje daty odpowiedzi. Jest system, są słabości, więc ocena to W – Większościowy.","it":"DSS02 ma PA 1.1 na P, a PA 2.1 i PA 2.2 na W. Proces osiąga poziom 2, ale nie wejdzie na poziom 3.","egz":"W = Większościowy, >50–85% (EN: L – Largely; zapis „>” – konwencja ISO/IEC 15504-2, FW-PL s. 45: „50–85%”). Proces osiąga poziom, gdy atrybuty tego poziomu mają W lub P, a niższe – P. Na egzaminie PL „Większościowy” ma literę W. Po angielsku i w podręczniku to L (Largely, „w znacznym stopniu”). W wystarcza dla atrybutów poziomu, który oceniasz, ale nie dla niższych. Nie myl z: P – Pełny – W (>50–85%) wystarcza dla atrybutów ocenianego poziomu. P (>85–100%) jest wymagane na wszystkich niższych poziomach.; C – Częściowy – C (>15–50%) nie wystarcza do osiągnięcia poziomu. W już wystarcza.","src":"COBIT 5 Framework (PL), s. 42, 45"},"organ-ladu":{"t":"Organ Ładu i nadzoru","eg":"Organ Ładu i nadzoru","pd":"Organ nadzorujący","en":"Governing body","wyj":"Szef albo grupa na samej górze, np. zarząd, rada nadzorcza czy dyrektor urzędu, którzy decydują o kierunku.\n\nNa Ilustracji 9 właściciele i interesariusze delegują (delegate) uprawnienia organowi Ładu (governing body), a ten jest przed nimi rozliczany (accountable). Organ Ładu wyznacza kierunek (set direction) kierownictwu (management). Kierownictwo instruuje i dopasowuje (instruct and align) role operacyjne, które raportują (report) do kierownictwa (FW-PL s. 24, Il. 9). Strzałka monitorowania (monitor) łączy kierownictwo z organem Ładu; według uzasadnień egzaminacyjnych to kierownictwo odpowiada wykonawczo za monitorowanie. Sam organ Ładu też monitoruje, ale wyniki względem kierunku, który wyznaczył (EDM).\n\nŻeby było jasne, kto w imieniu właścicieli i interesariuszy sprawuje Ład: wyznacza kierunek kierownictwu i odpowiada za wyniki.","zycie":"Właściciele mieszkań na zebraniu wspólnoty wybierają zarząd i powierzają mu dbanie o budynek. Zarząd wyznacza kierunek – w tym roku dach – i każe administratorowi to załatwić, a administrator raportuje postępy. Na następnym zebraniu zarząd rozlicza się przed właścicielami: to on jest organem Ładu.","firma":"Właściciele rodzinnej sieci piekarni powołują radę, która raz na kwartał ustala, dokąd firma zmierza: otwieramy dwa nowe punkty, nie wchodzimy w catering. Dyrektor zarządzający dostaje ten kierunek i sam układa plan, a rada sprawdza wyniki i odpowiada przed właścicielami. Ta rada to organ Ładu.","urzad":"Mieszkańcy w wyborach powierzają radzie gminy pilnowanie spraw gminy. Rada uchwala strategię i budżet, wyznacza kierunek wójtowi i urzędowi, a potem rozlicza ich z wykonania; sama odpowiada przed mieszkańcami przy kolejnych wyborach. W tej scenie rada gminy pełni rolę organu Ładu.","it":"Zarząd jako organ Ładu w EDM01 (Zapewnienie i utrzymanie ładu korporacyjnego) ustala zasady podejmowania decyzji o IT, a w EDM05 (Zapewnienie przejrzystości dotyczącej interesariuszy) raportuje udziałowcom i regulatorom, jak IT realizuje cele. Plany i kierowanie pracą zespołów zostawia kierownictwu IT (APO, BAI, DSS, MEA).","egz":"Według uzasadnień egzaminacyjnych organ Ładu i nadzoru jest odpowiedzialny decyzyjnie (rozliczany) i wyznacza kierunek. Za monitorowanie osiągania celów odpowiada wykonawczo kierownictwo. Egzamin: „Organ Ładu i nadzoru”. Podręcznik: „Organ nadzorujący”. Nie myl z: Kierownictwo (management) – Kierownictwo realizuje kierunek, instruuje i dopasowuje role operacyjne i odpowiada wykonawczo za monitorowanie osiągania celów; organ Ładu wyznacza kierunek i jest rozliczany przed interesariuszami.","src":"COBIT 5 Framework (PL), s. 24"},"poziom-2":{"t":"Poziom 2 – Proces zarządzany","eg":"Poziom 2 – Proces zarządzany","pd":"Poziom 2 potencjału – proces zarządzany","en":"Level 2 – Managed process","wyj":"Robota daje efekt, a do tego ktoś ją planuje, pilnuje i trzyma papiery w porządku.\n\nAsesor najpierw sprawdza, czy PA 1.1 ma P. Potem ocenia PA 2.1 (plan, monitorowanie, korekta) i PA 2.2 (kontrola produktów pracy). Oba muszą mieć co najmniej W.\n\nŻeby proces nie zależał od szczęścia: ktoś go planuje, pilnuje i trzyma porządek w jego dokumentach.","zycie":"Domowe rachunki: masz kalendarz terminów, co miesiąc sprawdzasz, czy wszystko zapłacone, a potwierdzenia trzymasz w jednej teczce. Rachunki są płacone (poziom 1), a do tego planowane i pilnowane, z porządkiem w papierach. To poziom 2.","firma":"Warsztat samochodowy ma grafik przyjęć, kierownik codziennie sprawdza, czy auta są gotowe na czas, a karty zleceń mają wzór i trafiają do archiwum. Drugi warsztat tej samej firmy robi to jednak po swojemu. Poziom 2 tak, poziom 3 jeszcze nie.","urzad":"Wydział komunikacji starostwa planuje obsadę okienek, co tydzień sprawdza kolejki i przesuwa ludzi, gdy trzeba. Wnioski mają wzór, są rejestrowane i przechowywane. To proces zarządzany, czyli poziom 2.","it":"Proces BAI06 (zarządzanie zmianami): zmiany w systemach są planowane, ich wykonanie jest pilnowane, a wnioski o zmianę mają wzór i wersje. Każdy zespół IT robi to jednak według własnych zasad. To poziom 2, jeszcze nie 3.","egz":"„Planowanie, monitorowanie i dostosowanie” + „produkty pracy kontrolowane” → poziom 2, proces zarządzany. Atrybuty: zarządzanie wydajnością i zarządzanie produktami pracy. „Zarządzany” w COBIT 5 to poziom 2. W COBIT 4.1 „Zarządzany i wymierny” to poziom 4. Podobna nazwa, inne piętro. Nie myl z: Poziom 3 – Proces ustanowiony – Poziom 3 to jeden zdefiniowany standard, stosowany przy każdym wykonaniu. Poziom 2 to zarządzanie wykonaniem, bez wymogu wspólnego standardu.; Poziom 4 dojrzałości COBIT 4.1 („Zarządzany i wymierny”) – Podobna nazwa, inny model i inny poziom. Skal COBIT 4.1 i COBIT 5 nie da się prosto porównać.; PA 2.2 Zarządzanie produktami pracy – PA 2.2 to jeden z dwóch atrybutów poziomu 2. Poziom 2 to wynik całego procesu, liczony z PA 1.1, PA 2.1 i PA 2.2.","src":"COBIT 5 Framework (PL), s. 42"},"raci-a":{"t":"Odpowiedzialny decyzyjnie (A)","eg":"Odpowiedzialny decyzyjnie (A)","pd":"Strona rozliczana","en":"Accountable (A)","wyj":"Jedna osoba, która na końcu odpowiada głową za to, czy zadanie się udało.\n\nW tabeli RACI przy działaniu wpisujesz A jednej roli, ostatecznie odpowiedzialnej za wynik. A nie musi wykonywać pracy. A zawsze powinien dostawać informacje o realizacji, żeby nadzorować zadanie.\n\nŻeby przy każdym działaniu była jedna osoba, która odpowiada za jego powodzenie.","zycie":"Organizujecie wesele. Pomaga wiele osób: kucharze, DJ, świadkowie. Ale to para młoda odpowiada za całość i to ją rozliczą goście i rodzice. Para młoda jest A.","firma":"W firmie budowlanej kierownik budowy odpowiada za oddanie domu w terminie. Murarze i elektrycy wykonują pracę (R). Gdy dom jest opóźniony, inwestor rozlicza kierownika budowy. On jest A.","urzad":"Burmistrz zleca remont szkoły podstawowej. Sprawę prowadzi wydział inwestycji, a jego naczelnik odpowiada przed burmistrzem za termin i budżet. Firma remontowa wykonuje pracę, więc jest R. Naczelnik wydziału jest A – to jego burmistrz rozliczy, gdy remont się opóźni.","it":"W tabelach RACI COBIT 5 przy praktykach EDM literę A ma zwykle zarząd. Przy praktykach zarządzania A często ma CIO albo właściciel procesu biznesowego (przykład kursu, nie cytat z tabeli).","egz":"„Kto odpowiada za powodzenie / sukces zadania”, „odpowiedzialny decyzyjnie” → A. „Ostatecznie odpowiedzialny” → A. „Wykonuje”, „odpowiedzialny wykonawczo” → R. Przy jednym działaniu jeden A. Podręcznik: „strona rozliczana”. Egzamin: „odpowiedzialny decyzyjnie” (A), w parze z „odpowiedzialny wykonawczo” (R). Rozróżnia je drugie słowo: decyzyjnie = odpowiada za sukces, wykonawczo = wykonuje. Nie myl z: Odpowiedzialny wykonawczo (R) – A (odpowiedzialny decyzyjnie) odpowiada za powodzenie. R (odpowiedzialny wykonawczo) wykonuje. Pracę może robić kilku R, ale A jest jeden. Różnicę niesie drugie słowo nazwy.; Informowany (I) – A zawsze powinien dostawać informacje o realizacji, ale nie staje się przez to rolą I. Informacje są mu potrzebne do nadzoru.","src":"COBIT 5 Framework (PL), s. 89, 92"},"raci-r":{"t":"Odpowiedzialny wykonawczo (R)","eg":"Odpowiedzialny wykonawczo (R)","pd":"Strona odpowiedzialna","en":"Responsible (R)","wyj":"Ten, kto własnymi rękami robi daną robotę.\n\nW tabeli RACI przy działaniu wpisujesz R tym rolom, które zajmują się realizacją zadania. Przy jednym działaniu może być kilka ról R (A zwykle jest jeden – praktyka tabel RACI, interpretacja kursu, nie FW-PL). R uwzględnia wejścia od C i w razie potrzeby eskaluje problem.\n\nŻeby przy każdym działaniu było jasne, kto wykonuje pracę.","zycie":"Przy przeprowadzce kolega z bratem noszą kartony do auta. Oni są R: wykonują pracę. Ty decydujesz i odpowiadasz za całą przeprowadzkę, więc jesteś A.","firma":"W biurze podróży konsultantka rezerwuje klientowi hotel i bilety. Jest R, bo wykonuje zadanie. Kierowniczka biura, która odpowiada za zadowolenie klienta, jest A.","urzad":"W urzędzie miasta inspektor przygotowuje projekt decyzji o dodatku mieszkaniowym: sprawdza dochody i liczy kwotę. Jest R, bo wykonuje zadanie. Kierownik działu, który decyzję podpisuje i odpowiada za jej poprawność, jest A.","it":"W tabeli RACI procesu DSS02 przy rozwiązywaniu incydentów literę R mają zwykle role operacyjne, np. kierownik usług IT i zespoły wsparcia (przykład kursu, nie cytat z tabeli).","egz":"„Kto wykonuje zadanie / zajmuje się jego realizacją” → R. Uwaga na podręcznikowe „strona odpowiedzialna”: to R, a nie A. Podręcznik: „strona odpowiedzialna”. Po polsku „odpowiedzialny” brzmi jak ten, kto odpowiada za wynik, a to jest A. Egzamin pisze „odpowiedzialny wykonawczo”: R wykonuje. A to „odpowiedzialny decyzyjnie” – różni je drugie słowo. Nie myl z: Odpowiedzialny decyzyjnie (A) – R wykonuje zadanie. A odpowiada za jego powodzenie i jest z niego rozliczany.; Konsultant (C) – R robi robotę. C tylko dostarcza wejścia (opinie, dane) w dwukierunkowej rozmowie.","src":"COBIT 5 Framework (PL), s. 90, 93"},"rola-kierownictwo":{"t":"Kierownictwo","eg":"Kierownictwo","pd":"Zarządzanie (podpis roli na Ilustracji 9)","en":"Management","wyj":"Kierownicy, którzy dostają kierunek od szefostwa, rozdzielają pracę ludziom i pilnują, czy organizacja osiąga cele.\n\nKierownictwo dostaje kierunek od organu Ładu. Instruuje i dopasowuje role operacyjne i odbiera ich raporty – między kierownictwem a rolami operacyjnymi są tylko te dwie relacje (FW-PL s. 24, Il. 9). Strzałka monitorowania łączy kierownictwo z organem Ładu; według uzasadnień egzaminacyjnych to kierownictwo odpowiada wykonawczo za monitorowanie. Swoją pracę prowadzi w obszarze Planuj, Twórz, Wykonuj i Monitoruj.\n\nŻeby kierunek od organu Ładu zamienił się w konkretne zadania i żeby ktoś pilnował ich wykonania.","zycie":"Zarząd wspólnoty postanawia: w tym roku remont dachu. Administrator budynku wybiera firmę i ustala jej harmonogram. Firma raportuje administratorowi postępy, a on co miesiąc mówi zarządowi, czy remont idzie zgodnie z planem. Administrator to kierownictwo: instruuje i dopasowuje.","firma":"Rada spółki ustala: otwieramy czwarty sklep bez kredytu. Dyrektor zarządzający układa plan, rozdziela zadania kierownikom i co tydzień patrzy na raporty sprzedaży. To kierownictwo z Ilustracji 9.","urzad":"Rada gminy uchwala strategię e-usług. Sekretarz gminy rozdziela zadania wydziałom, dopasowuje grafik informatyków i co miesiąc zdaje radzie gminy relację z postępów. Sekretarz działa jako kierownictwo.","it":"Kierownictwo IT mierzy, czy IT osiąga cele, m.in. w procesie MEA01 (Monitorowanie, ocena i oszacowanie wydajności i zgodności) z domeny MEA, i raportuje wyniki organowi Ładu.","egz":"„Kto instruuje i dopasowuje role operacyjne?” → Kierownictwo. Kto odpowiada wykonawczo za monitorowanie w rolach z Ilustracji 9? Według uzasadnień egzaminacyjnych także Kierownictwo, a nie organ Ładu. Podręcznikowy podpis „Zarządzanie” na Ilustracji 9 to ta sama rola. Na Ilustracji 9 podręcznik podpisuje tę rolę „Zarządzanie”, a egzamin mówi „Kierownictwo” (tę formę podręcznik ma też w nagłówku na s. 31). W uzasadnieniach egzaminacyjnych to kierownictwo odpowiada wykonawczo za monitorowanie, a nie organ Ładu. Nie myl z: Organ Ładu i nadzoru – Organ Ładu wyznacza kierunek i jest rozliczany przed interesariuszami. Kierownictwo realizuje kierunek, instruuje i dopasowuje role operacyjne i odpowiada wykonawczo za monitorowanie osiągania celów.; Zarządzanie – Zarządzanie to obszar działań (PBRM, 32 procesy). Kierownictwo to rola z Ilustracji 9, czyli ludzie, którzy te działania prowadzą.; Oszacuj, Kieruj i Monitoruj (EDM) – „Monitoruj” w EDM to praktyka procesów Ładu: Ład monitoruje sprawność i zgodność względem kierunku (s. 14). W pytaniu o role z Ilustracji 9 egzamin wiąże monitorowanie z kierownictwem.","src":"COBIT 5 Framework (PL), s. 14, 24, 31"},"zasada-2":{"t":"Zasada 2: Pokrycie całej organizacji","eg":"Zasada 2: Pokrycie całej organizacji","pd":"Zasada 2: Uwzględnienie wszystkich aspektów działania przedsiębiorstwa","en":"Principle 2: Covering the Enterprise End-to-End","wyj":"Informatyka to sprawa całej firmy czy urzędu, a nie tylko działu informatyków.\n\nŁad nad IT w organizacji (governance of enterprise IT) jest częścią ładu korporacyjnego (enterprise governance). COBIT 5 obejmuje wszystkie funkcje i procesy, w których przetwarza się informacje, także zewnętrzne usługi i procesy. Zasada wprowadza Podejście do Ładu (governance approach) z czterema komponentami: Cel Ładu, aktywatory Ładu, zakres Ładu oraz role, działania i relacje.\n\nŻeby informację i technologię traktować jako sprawę całej organizacji, a Ład nad IT jako część ładu korporacyjnego, a nie wyłącznie zadanie działu IT.","zycie":"W domu z rodzinnego Wi-Fi i wspólnego konta z filmami korzystają dzieci, dziadek i partner. Hasło ustawione przez „domowego informatyka” na nic się zda, jeśli dziecko poda je kolegom. Zasady dotyczą całego domu, nie jednej osoby – to Zasada 2.","firma":"W sklepie internetowym dane klientów widzi sprzedawca przy pakowaniu, księgowa przy fakturach i kurier na etykiecie. Informatyk ustawi najlepsze zabezpieczenia, ale jeśli sprzedawca wyśle listę klientów prywatnym mailem, i tak jest wyciek. Dlatego zasady obejmują wszystkich, także firmę kurierską – to Zasada 2.","urzad":"W urzędzie gminy dane w ewidencji ludności wpisują urzędnicy wydziału spraw obywatelskich, a informatyk tylko utrzymuje system. Gdy ktoś wpisze zły adres, to problem całego urzędu, nie informatyka. Ład nad informacją obejmuje każdy wydział – to Zasada 2.","it":"APO10 (Zarządzanie dostawcami) obejmuje usługi świadczone z zewnątrz, a DSS06 (Zarządzanie mechanizmami kontrolnymi procesów biznesowych) kontrolę informacji w procesach biznesowych, np. w fakturowaniu. Zasięg COBIT 5 wychodzi więc poza dział IT.","egz":"Według uzasadnień egzaminacyjnych „ujednolicenie z najnowszymi poglądami na temat Ładu” to kluczowy aspekt zasady „Pokrycie całej organizacji” (s. 23). Egzamin (uzasadnienie SP1): „Pokrycie całej organizacji”. Podręcznik: „Uwzględnienie wszystkich aspektów działania przedsiębiorstwa”. Nie myl z: Zasada 3: Zastosowanie Pojedynczej Zintegrowanej Struktury Ramowej – Zasada 3 dotyczy integracji z INNYMI standardami. Zasada 2 dotyczy objęcia CAŁEJ organizacji.","src":"COBIT 5 Framework (PL), s. 23"},"zasada-4":{"t":"Zasada 4: Aktywacja holistycznego podejścia","eg":"Zasada 4: Aktywacja holistycznego podejścia","pd":"Zasada 4: Wdrożenie podejścia całościowego","en":"Principle 4: Enabling a Holistic Approach","wyj":"Patrz na całość: sukces zależy od wielu rzeczy naraz, nie tylko od sprzętu.\n\nCOBIT 5 wyróżnia 7 kategorii aktywatorów (enablers), m.in. procesy, struktury organizacyjne, informację oraz ludzi, umiejętności i kompetencje. Aktywatory indywidualnie i kolektywnie decydują o tym, czy Ład i Zarządzanie działają: każdy potrzebuje wejść od innych i dostarcza im wyników. Wszystkie mają cztery wspólne wymiary (interesariusze, cele, cykl życia, dobre praktyki), a ich wydajność mierzą wskaźniki wiodące i opóźnione.\n\nŻeby Ład i Zarządzanie IT budować na wszystkich współpracujących aktywatorach, a nie tylko na technologii czy na pojedynczym procesie.","zycie":"Kupujesz dziecku biurko i lampkę, żeby lepiej się uczyło. Nic się nie zmienia, dopóki nie ustalicie planu dnia, zasady „najpierw lekcje, potem gry”, a Ty sam nie odłożysz telefonu przy kolacji. Dopiero wszystkie te elementy razem dają efekt – to Zasada 4.","firma":"Sklep spożywczy stawia kasę samoobsługową, ale kolejki się nie skracają. Nikt nie pilnuje kasy, kasjerki nie umieją pomóc klientom, a klienci nie wiedzą, że wolno z niej korzystać. Sam sprzęt nie wystarczy, potrzebne są też ludzie, procedury i nawyki – to Zasada 4.","urzad":"Starostwo wdraża elektroniczne zarządzanie dokumentacją. System działa, ale urzędnicy dalej drukują pisma, bo nie ma instrukcji kancelaryjnej ani szkoleń, a kierownik sam woli papier. Bez procesów, ludzi, struktur i kultury system zostaje pustą skorupą – to Zasada 4.","it":"APO13 (Zarządzanie bezpieczeństwem) działa dopiero razem z polityką bezpieczeństwa, strukturą odpowiedzialną za bezpieczeństwo, kulturą zgłaszania incydentów, przeszkolonymi ludźmi, informacją i narzędziami. Przykład 4 z FW-PL: procesy i procedury bezpieczeństwa informacji nie będą skuteczne, jeśli kultura i etyka są nieodpowiednie.","egz":"Liczba 7 aktywatorów i 4 wymiary aktywatora to tematy Zasady 4. Pytania o „jakość kontekstową”, „wskaźniki wiodące” i „cykl życia aktywatora” też należą do Zasady 4. Egzamin (uzasadnienia SP1): „Aktywacja holistycznego podejścia” – „aktywacja”, bo egzamin tłumaczy enabler jako „aktywator”. Podręcznik: „Wdrożenie podejścia całościowego”. Rozpoznawaj po słowach: holistyczne / całościowe / aktywatory. Nie myl z: Zasada 2: Pokrycie całej organizacji – Zasada 2: CAŁA organizacja (zakres). Zasada 4: WSZYSTKIE rodzaje aktywatorów (całościowe podejście).","src":"COBIT 5 Framework (PL), s. 27, 28"}},
S:[{"pt":"Jak czytać pytania","h":"Większość błędów to źle przeczytane pytanie","b":"Na egzaminie zwykle wiesz, o czym mowa, ale odpowiadasz na inne pytanie niż zadane. Tu rozbierzesz 9 typów pytań: słowo-sygnał, pułapkę i sposób czytania. Każdy typ przećwiczysz na jednym pytaniu.","c":"Najpierw ustal, czego szukasz. Dopiero potem czytaj odpowiedzi.","s":"Wiedza ogólna o egzaminie: sylabus PeopleCert COBIT 5 Foundation (poziomy wiedza i rozumienie)","ctx":"<p>Egzamin COBIT 5 Foundation sprawdza wiedzę i rozumienie, a nie doświadczenie zawodowe. Pytania są krótkie, ale gęste: jedno słowo, np. „NIE”, „NAJLEPIEJ” albo „pierwszy”, zmienia to, czego szukasz. Dlatego przy każdym pytaniu przechodzisz te same cztery kroki: ostatnie zdanie, słowo-sygnał, szufladka COBIT 5, prawda albo fałsz przy każdej opcji.<\/p><p>W ćwiczeniach aplikacji pod każdym pytaniem jest przycisk „Nie rozumiem pytania”. Pokazuje on typ pytania, słowa-sygnały i znaczenie trudnych pojęć, ale nie zdradza odpowiedzi. Po odpowiedzi możesz też otworzyć gotowe polecenie dla AI, które wytłumaczy pytanie krok po kroku.<\/p>"},{"pt":"Typ 1 · przeczenie","h":"NIE: szukasz jedynej fałszywej","b":"Gdy w pytaniu stoi NIE, trzy odpowiedzi są prawdziwe. Przy każdej powiedz sobie „prawda” albo „fałsz” i zaznacz jedyny fałsz. Najczęstszy błąd: wybierasz pierwszą prawdziwą, bo oko przeoczyło NIE.","c":"Pytanie z NIE przeczytaj dwa razy.","s":"Wiedza ogólna o egzaminie (pytania z przeczeniem pisane wersalikami)","ctx":"<p>Na egzaminie słowo NIE jest zwykle pisane wersalikami, ale w stresie łatwo je przeoczyć. Pytanie z przeczeniem odwraca zadanie: zamiast jednej prawdy szukasz jednego fałszu wśród trzech prawd.<\/p><p>Najpewniejsza metoda: obok każdej opcji postaw w myślach „P” albo „F”. Jeśli wyjdą Ci dwa „F”, jedno z nich jest pomyłką. Wróć do podręcznika w pamięci i sprawdź, która z dwóch opcji naprawdę jest w COBIT 5.<\/p><p>Przykład: <w k=\"interesariusz\">interesariusze<\/w> dzielą się na wewnętrznych i zewnętrznych. Pytanie „kto NIE jest interesariuszem zewnętrznym” ma trzy osoby spoza organizacji i jedną z jej wnętrza. To ją zaznaczasz.<\/p>"},{"pt":"Sprawdź się","quiz":{"tresc":"Który z poniższych NIE jest interesariuszem zewnętrznym urzędu gminy?","opcje":[{"t":"Mieszkańcy korzystający z e-usług","w":"To interesariusz zewnętrzny: użytkownik usług spoza organizacji (s. 22)."},{"t":"Firma dostarczająca system podatkowy","w":"To interesariusz zewnętrzny: dostawca (s. 22)."},{"t":"Regionalna izba obrachunkowa, która kontroluje gminę","w":"To interesariusz zewnętrzny: organ nadzoru i kontroli (s. 22)."},{"t":"Sekretarz gminy","w":"Tak. Sekretarz pracuje w urzędzie, więc jest interesariuszem wewnętrznym. Pytanie z NIE: trzy opcje były prawdziwe.","ok":true}],"src":"COBIT 5 Framework (PL), s. 22 (Ilustracja 7). Pytanie autorskie.","pomoc":{"t":"Zadaj przy każdej osobie pytanie: czy pracuje w urzędzie, czy poza nim?","k":["interesariusz"]}}},{"pt":"Typ 2 · stopniowanie","h":"NAJLEPIEJ: kilka prawdziwych, jedna pełna","b":"Dwie albo trzy odpowiedzi mogą być częściowo prawdziwe. Wybierz tę, która mówi najwięcej i najdokładniej według podręcznika. Typowa pułapka to odpowiedź za wąska, czyli mówiąca tylko część prawdy.","c":"Przy „najlepiej” porównuj opcje ze sobą, nie tylko z podręcznikiem.","s":"Wiedza ogólna o egzaminie; FW-PL s. 23 (Zasada 2)","ctx":"<p>Słowa „najlepiej”, „najtrafniej”, „najbardziej” oznaczają, że egzamin dopuszcza kilka odpowiedzi brzmiących dobrze. Twoje zadanie to ranking: która opcja jest najpełniejsza i najbliższa słowom podręcznika.<\/p><p>Przykład: <w k=\"zasada-2\">Zasada 2<\/w> mówi, że COBIT 5 obejmuje całą organizację. Opcja „obejmuje wszystkie procesy działu IT” brzmi poważnie, ale jest za wąska. Zasada dotyczy wszystkich funkcji i procesów, w których przetwarza się informacje, nie tylko działu IT.<\/p>"},{"pt":"Sprawdź się","quiz":{"tresc":"Co NAJLEPIEJ opisuje Zasadę 2: Pokrycie całej organizacji?","opcje":[{"t":"COBIT 5 obejmuje wszystkie procesy działu IT","w":"Za wąskie. Zasada 2 wychodzi poza dział IT."},{"t":"Ład nad IT jest częścią ładu korporacyjnego i obejmuje wszystkie funkcje oraz procesy organizacji","w":"Tak. To pełny opis Zasady 2 (s. 23).","ok":true},{"t":"COBIT 5 łączy inne standardy w jedną strukturę ramową","w":"To Zasada 3: Zastosowanie Pojedynczej Zintegrowanej Struktury Ramowej."},{"t":"COBIT 5 oddziela Ład od Zarządzania","w":"To Zasada 5."}],"src":"COBIT 5 Framework (PL), s. 23. Pytanie autorskie.","pomoc":{"t":"Szukasz opisu pełnego, a nie tylko prawdziwego. Porównaj zakres każdej opcji.","k":["zasada-2"]}}},{"pt":"Typ 3 · scenariusz","h":"Scenariusz: najpierw ostatnie zdanie","b":"W długim pytaniu właściwe pytanie stoi na końcu. Przeczytaj je najpierw, potem wróć do opisu i wyłów 2–3 fakty pasujące do pojęć COBIT 5. Nazwy firm, kwoty i daty to zwykle tło.","c":"Opis sytuacji to tło, a pytanie to ostatnie zdanie.","s":"Wiedza ogólna o egzaminie","ctx":"<p>Scenariusz ma sprawdzić, czy umiesz zastosować pojęcie, a nie tylko je wyrecytować. Dlatego opis jest dłuższy niż potrzeba: zawiera szczegóły, które mają odwrócić uwagę.<\/p><p>Metoda: (1) przeczytaj ostatnie zdanie i nazwij szufladkę, np. „pytają o interesariuszy”; (2) wróć do opisu i podkreśl w myślach osoby, role i oczekiwania; (3) odrzuć opcje z innej szufladki. Przykład: szpital, w którym dyrektor finansowy, ordynatorzy i inspektor ochrony danych mają różne oczekiwania wobec systemu, to podręcznikowy obraz <w k=\"interesariusz\">interesariuszy<\/w>.<\/p>"},{"pt":"Sprawdź się","quiz":{"kontekst":"Szpital wdraża nowy system rejestracji pacjentów. Dyrektor finansowy pyta o koszty, ordynatorzy chcą krótszych kolejek, a inspektor ochrony danych obawia się wycieku danych pacjentów. Zarząd zatwierdził budżet na 18 miesięcy.","tresc":"Kim są w COBIT 5 osoby wymienione w opisie?","opcje":[{"t":"Interesariuszami","w":"Tak. Mają oczekiwania wobec IT i wpływ na nie, więc są interesariuszami (s. 17–18).","ok":true},{"t":"Organem Ładu i nadzoru","w":"Organ Ładu to np. zarząd, który ocenia, ukierunkowuje i monitoruje. W opisie nikt nie pełni tej roli."},{"t":"Właścicielami procesów IT","w":"Opis nie mówi, że te osoby odpowiadają za procesy IT. Mają tylko oczekiwania wobec systemu."},{"t":"Osobami Odpowiedzialnymi wykonawczo (R)","w":"R to rola w diagramie RACI przy praktyce procesu, a nie określenie osób z oczekiwaniami."}],"src":"COBIT 5 Framework (PL), s. 17–18. Pytanie autorskie.","pomoc":{"t":"Przeczytaj najpierw pytanie, potem opis. Co łączy wszystkie wymienione osoby?","k":["interesariusz"]}}},{"pt":"Typ 4 · nazwa","h":"Nazwa: wybierz wersję z egzaminu","b":"Polski egzamin ma własne nazwy, inne niż podręcznik. „Czynnik umożliwiający” z podręcznika to na egzaminie „aktywator”, a „nadzór” to „Ład”. Gdy obok siebie stoją dwie wersje tej samej rzeczy, wybierz egzaminacyjną.","c":"Dwie podobne nazwy obok siebie to sygnał pułapki nazw.","s":"Uzasadnienia egzaminacyjne PL; FW-PL s. 27","ctx":"<p>Polski egzamin powstał z innego tłumaczenia niż polski podręcznik, więc wiele nazw się różni. Pytanie o nazwę często ma trzy wersje tej samej rzeczy: egzaminacyjną, podręcznikową i dosłowne tłumaczenie z angielskiego, a czwarta opcja to inne pojęcie.<\/p><p>Przykład: <w k=\"zasada-4\">Zasada 4<\/w> na egzaminie to „Aktywacja holistycznego podejścia”. Podręcznik pisze „Wdrożenie podejścia całościowego”. Obie nazwy opisują tę samą zasadę, ale punkt dostaniesz tylko za egzaminacyjną. Nazwy egzaminacyjne utrwalisz w zakładce Ćwiczenie nazw.<\/p>"},{"pt":"Sprawdź się","quiz":{"tresc":"Jak na polskim egzaminie nazywa się Zasada 4 COBIT 5 (<em>Enabling a Holistic Approach<\/em>)?","opcje":[{"t":"Wdrożenie podejścia całościowego","w":"To nazwa z polskiego podręcznika. Na egzaminie wybierasz nazwę egzaminacyjną."},{"t":"Umożliwienie podejścia holistycznego","w":"To dosłowne tłumaczenie, którego nie ma ani na egzaminie, ani w podręczniku."},{"t":"Aktywacja holistycznego podejścia","w":"Tak, to nazwa z polskiego egzaminu.","ok":true},{"t":"Zastosowanie Pojedynczej Zintegrowanej Struktury Ramowej","w":"To Zasada 3."}],"src":"Nazwy z uzasadnień egzaminacyjnych PL; COBIT 5 Framework (PL), s. 27. Pytanie autorskie.","pomoc":{"t":"Trzy opcje opisują tę samą zasadę różnymi słowami. Która wersja pochodzi z egzaminu?","k":["zasada-4"]}}},{"pt":"Typ 5 · kto?","h":"„Kto?”: rola, nie czynność","b":"Pytanie „kto” szuka roli. Za Ład odpowiada zarząd pod przywództwem prezesa, a za Zarządzanie kadra zarządzająca pod przywództwem dyrektora generalnego. W diagramie RACI rolę A ma zawsze jedna osoba.","c":"Odpowiadaj według COBIT 5, nie według swojej firmy.","s":"COBIT 5 Framework (PL), s. 31; Załącznik G (RACI)","ctx":"<p>Pytania „kto?” sprawdzają role. Pułapka polega na tym, że w Twojej organizacji może być inaczej, np. Ładem IT „zajmuje się” dyrektor IT. Egzamin pyta jednak o model COBIT 5: <w k=\"lad\">Ład<\/w> sprawuje <w k=\"organ-ladu\">Organ Ładu i nadzoru<\/w>, w większości organizacji zarząd pod przywództwem prezesa, a Zarządzanie prowadzi <w k=\"rola-kierownictwo\">kierownictwo<\/w> (s. 31).<\/p><p>W diagramie RACI <w k=\"raci-a\">Odpowiedzialny decyzyjnie (A)<\/w> jest jeden, bo ktoś musi ostatecznie rozliczać wynik. <w k=\"raci-r\">Odpowiedzialnych wykonawczo (R)<\/w> może być wielu.<\/p>"},{"pt":"Sprawdź się","quiz":{"tresc":"Ile ról A (Odpowiedzialny decyzyjnie) powinna mieć jedna praktyka w diagramie RACI?","opcje":[{"t":"Tyle, ile działów bierze w niej udział","w":"Wiele działów może mieć R, C albo I, ale A jest jedno."},{"t":"Dokładnie jedną","w":"Tak. Rozliczalność nie może być rozproszona, więc A jest jeden.","ok":true},{"t":"Co najmniej dwie, dla kontroli krzyżowej","w":"Kontrolę zapewnia podział ról, a nie podwójne A."},{"t":"Żadnej, jeśli praktykę wykonuje dostawca zewnętrzny","w":"Rozliczalność zostaje w organizacji także przy outsourcingu."}],"src":"COBIT 5 Framework (PL), Załącznik G; diagramy RACI w COBIT 5: Procesy umożliwiające. Pytanie autorskie.","pomoc":{"t":"Przypomnij sobie różnicę między „decyduje i rozlicza” a „wykonuje”.","k":["raci-a","raci-r"]}}},{"pt":"Typ 6 · proces","h":"Proces: najpierw domena, potem słowo-klucz","b":"Ustal najpierw, czy to Ład (EDM: Oszacuj, Kieruj i Monitoruj), czy Zarządzanie (APO, BAI, DSS, MEA). Potem szukaj słowa-klucza w treści: korzyści, ryzyko, zasoby, zmiana, incydent, zgodność.","c":"Monitorują i Organ Ładu (EDM), i kierownictwo (MEA). Sprawdź, kto.","s":"COBIT 5 Framework (PL), s. 32–33","ctx":"<p>Najczęstsza pułapka w pytaniach o procesy to słowo „monitorowanie”. Pojawia się i w <w k=\"lad\">Ładzie<\/w> (EDM: Oszacuj, Kieruj i Monitoruj), i w Zarządzaniu (MEA: Monitoruj, Oszacuj i Oceń). Rozstrzyga to, kto monitoruje i po co.<\/p><p>Gdy zarząd sprawdza, czy osiągnięto uzgodniony kierunek, to EDM. Gdy kierownictwo albo dział IT regularnie mierzy wydajność i zgodność procesów i raportuje wyniki, to MEA. Przykład: gmina, w której informatyk co miesiąc porównuje dostępność systemów z ustalonymi wskaźnikami i raportuje sekretarzowi, to MEA.<\/p>"},{"pt":"Sprawdź się","quiz":{"kontekst":"W starostwie powiatowym dział informatyki co miesiąc porównuje dostępność systemów z ustalonymi wskaźnikami i przekazuje raport sekretarzowi powiatu.","tresc":"Gdzie w modelu procesów COBIT 5 leży opisana czynność?","opcje":[{"t":"Do Ładu, bo monitorowanie to czynność EDM","w":"EDM to Ład: monitoruje Organ Ładu i nadzoru. Tu raportuje dział IT, czyli kierownictwo."},{"t":"Do Zarządzania, do domeny DSS, bo dotyczy działania systemów","w":"DSS to codzienna obsługa systemów. Pomiar wyników i raport dla kierownictwa to MEA."},{"t":"Do Zarządzania, do domeny APO, bo dotyczy ustalania wskaźników","w":"Wskaźniki ustalono wcześniej. Tu chodzi o regularny pomiar i raport, a nie o planowanie."},{"t":"Do Zarządzania, do domeny MEA","w":"Tak. MEA to Monitoruj, Oszacuj i Oceń: regularny pomiar wydajności i zgodności oraz raport dla kierownictwa.","ok":true}],"src":"COBIT 5 Framework (PL), s. 32–33. Pytanie autorskie.","pomoc":{"t":"Ustal najpierw, czy to Ład, czy Zarządzanie. Kto monitoruje i komu raportuje?","k":["lad"]}}},{"pt":"Typ 7 · zdolność procesu","h":"Poziom zdolności: licz od dołu","b":"Poziom jest osiągnięty, gdy jego atrybuty mają W albo P, a wszystkie niższe mają P. Idź od poziomu 1 w górę i zatrzymaj się na pierwszym, który nie spełnia reguły. Uwaga: P znaczy Pełny.","c":"Atrybuty niższego poziomu muszą być ocenione na P (Pełny).","s":"COBIT 5 Framework (PL), s. 42–45","ctx":"<p>Polski egzamin używa skali N, C, W, P: <w k=\"ocena-w\">W – Większościowy<\/w> i <w k=\"ocena-p\">P – Pełny<\/w>. Angielska skala to N, P, L, F, więc litera P znaczy w niej co innego (Partially). To najczęstsza pułapka w tych pytaniach.<\/p><p>Metoda krok po kroku: wypisz atrybuty poziomami. Poziom 1 to PA 1.1, poziom 2 to PA 2.1 i PA 2.2, poziom 3 to PA 3.1 i PA 3.2. Dla każdego poziomu sprawdź dwa warunki: jego atrybuty mają W albo P, a atrybuty wszystkich niższych poziomów mają P. Pierwszy poziom, który nie spełnia warunków, zatrzymuje liczenie. Wynikiem jest poziom o jeden niższy, np. <w k=\"poziom-2\">Poziom 2 – Proces zarządzany<\/w>.<\/p>"},{"pt":"Sprawdź się","quiz":{"tresc":"Wynik oceny procesu: PA 1.1 = P, PA 2.1 = W, PA 2.2 = P, PA 3.1 = W, PA 3.2 = C. Jaki poziom zdolności osiągnął proces?","opcje":[{"t":"Poziom 1 – Proces wykonywany","w":"Za nisko. Poziom 2 też jest osiągnięty: PA 2.1 = W, PA 2.2 = P, a PA 1.1 = P."},{"t":"Poziom 3 – Proces ustanowiony","w":"Nie. PA 3.2 = C nie wystarcza, a do poziomu 3 atrybuty poziomu 2 musiałyby mieć P (PA 2.1 ma W)."},{"t":"Poziom 0 – Proces niekompletny","w":"Nie. PA 1.1 = P, więc proces jest co najmniej wykonywany."},{"t":"Poziom 2 – Proces zarządzany","w":"Tak. Poziom 2 ma atrybuty W i P, a poziom 1 ma P. Poziom 3 odpada.","ok":true}],"src":"COBIT 5 Framework (PL), s. 42–45. Pytanie autorskie.","pomoc":{"t":"Sprawdzaj poziom po poziomie od dołu: atrybuty tego poziomu W albo P, niższych P.","k":["ocena-w","ocena-p","poziom-2"]}}},{"pt":"Typ 8 · kolejność","h":"Kolejność: ułóż całą sekwencję","b":"Gdy pytanie mówi „pierwszy”, „następny” albo „faza”, wypisz w myślach całą kolejność, np. siedem faz wdrożenia albo cztery kroki kaskady celów, i dopiero wtedy wybierz. Nie zgaduj po jednym słowie.","c":"Najpierw cała lista, potem miejsce na liście.","s":"COBIT 5 Framework (PL), s. 37–38","ctx":"<p>Pytania o kolejność sprawdzają, czy wiesz, co dzieje się w danym kroku. Opis z pytania łatwo pomylić z sąsiednią fazą, bo fazy na siebie zachodzą.<\/p><p>Siedem faz cyklu wdrożenia: 1 Jakie są wyznaczniki? 2 Gdzie jesteśmy teraz? 3 Dokąd chcemy dojść? 4 Co trzeba zrobić? 5 Jak się tam dostaniemy? 6 Czy dotarliśmy do celu? 7 Jak utrzymać motywację do działania? Podręcznik (s. 38) mówi, że w <w k=\"faza-3\">fazie 3<\/w> określa się cel i szuka luk oraz rozwiązań. W <w k=\"faza-4\">fazie 4<\/w> planuje się praktyczne rozwiązania jako projekty z uzasadnieniem biznesowym.<\/p>"},{"pt":"Sprawdź się","quiz":{"kontekst":"Ubezpieczyciel wdraża COBIT 5. Zespół ocenił obecny stan procesów, ustalił poziom docelowy i zidentyfikował luki oraz możliwe rozwiązania.","tresc":"Która faza cyklu wdrożenia jest NASTĘPNA?","opcje":[{"t":"Faza 4: Co trzeba zrobić?","w":"Tak. Po określeniu celu i luk (faza 3) planuje się praktyczne rozwiązania jako projekty z uzasadnieniem biznesowym (s. 38).","ok":true},{"t":"Faza 2: Gdzie jesteśmy teraz?","w":"Ta faza już była: zespół ocenił stan obecny."},{"t":"Faza 5: Jak się tam dostaniemy?","w":"W fazie 5 rozwiązania wdraża się w praktyce. Najpierw trzeba je zaplanować."},{"t":"Faza 6: Czy dotarliśmy do celu?","w":"To ocena po wdrożeniu, a niczego jeszcze nie wdrożono."}],"src":"COBIT 5 Framework (PL), s. 38. Pytanie autorskie.","pomoc":{"t":"Ustal, które fazy opisuje scenariusz. Co dzieje się zaraz po nich?","k":["faza-3","faza-4"]}}},{"pt":"Typ 9 · słowa skrajne","h":"Skrajne słowa: zawsze, tylko, wszystkie","b":"COBIT 5 nie ma charakteru normatywnego. Trzeba go dostosować do organizacji. Odpowiedź z „zawsze”, „tylko” albo „musi” zwykle jest fałszywa. Zwykle, nie zawsze: sprawdź, czy podręcznik naprawdę tak twierdzi.","c":"Słowo skrajne to sygnał do sprawdzenia, a nie automatyczny fałsz.","s":"COBIT 5 Framework (PL), s. 32, 35","ctx":"<p>Podręcznik kilka razy podkreśla, że COBIT 5 nie ma charakteru normatywnego (s. 32, 35). To zbiór dobrych praktyk, które organizacja dostosowuje do swojej wielkości, branży i potrzeb. Dlatego opcje mówiące, że coś trzeba robić zawsze, wyłącznie albo w całości, zwykle przeczą duchowi COBIT 5.<\/p><p>Są jednak wyjątki, w których skrajne słowo jest prawdziwe. Przykład: „rolę A ma zawsze jedna osoba”. Słowo skrajne każe więc sprawdzić opcję, a nie skreślić ją z automatu.<\/p>"},{"pt":"Sprawdź się","quiz":{"tresc":"Które stwierdzenie o COBIT 5 jest prawdziwe?","opcje":[{"t":"COBIT 5 trzeba zawsze wdrożyć w całości, wszystkie 37 procesów naraz","w":"Fałsz. Wdrożenie jest stopniowe i zaczyna się od procesów o najwyższym priorytecie (s. 38)."},{"t":"COBIT 5 dotyczy wyłącznie działu IT","w":"Fałsz. Zasada 2 obejmuje całą organizację."},{"t":"COBIT 5 można dostosować do wielkości i potrzeb organizacji","w":"Tak. COBIT 5 nie ma charakteru normatywnego i trzeba go dostosować (s. 32, 35).","ok":true},{"t":"COBIT 5 zastępuje inne standardy, np. ITIL i ISO/IEC 27001","w":"Fałsz. Zasada 3: COBIT 5 integruje się z innymi standardami, a nie je zastępuje."}],"src":"COBIT 5 Framework (PL), s. 23, 25, 32, 35, 38. Pytanie autorskie.","pomoc":{"t":"Zwróć uwagę na słowa skrajne w opcjach i zastanów się, czy podręcznik je potwierdza.","k":["zasada-2"]}}},{"pt":"Podsumowanie","h":"Cztery kroki przy każdym pytaniu","b":"1. Przeczytaj ostatnie zdanie. 2. Znajdź słowo-sygnał. 3. Nazwij szufladkę COBIT 5. 4. Przy każdej opcji powiedz „prawda” albo „fałsz”. Gdy pytanie jest niezrozumiałe, kliknij „Nie rozumiem pytania” albo zapytaj AI.","c":"Ćwicz to na treningu słabych tematów w zakładce Mój poziom.","s":"Podsumowanie części","ctx":"<p>Te cztery kroki zajmują kilka sekund, a chronią przed większością błędów z nieuwagi. Na egzaminie masz średnio 48 sekund na pytanie, więc wystarczy czasu, żeby przy każdym pytaniu przejść je spokojnie.<\/p><p>Zakładka „Mój poziom” szacuje Twój wynik i pokazuje słabe tematy. Każdy temat ma odnośnik do działu podręcznika, krótki trening i gotowe polecenie dla AI. Do niego warto wracać po każdym rozdziale i po każdym egzaminie próbnym.<\/p>"}]};
