<script>window.DECK={"id":"k-en-role","rozdzial":"Załącznik G · Aktywatory szczegółowo · s. 65–88","tytul":"Role i komitety (Rysunek 33)","prev":"k-en-struktury.html","next":"k-en-kultura.html","T":{"it-portfel":{"t":"Portfel","eg":"Portfel","pd":"Portfel inwestycyjny","en":"Portfolio","wyj":"Lista wszystkich projektów i programów, na które organizacja wydaje albo chce wydać pieniądze.\n\nWszystkie pomysły i trwające projekty trafiają na jedną listę. Kierownictwo porównuje koszty, korzyści i ryzyko. Wybiera, co uruchomić, co kontynuować, a co zatrzymać. Listę przegląda się regularnie.\n\nŻeby organizacja wydawała ograniczone pieniądze na to, co daje jej najwięcej korzyści przy akceptowalnym ryzyku.","zycie":"Rodzina ma 20 000 zł oszczędności i trzy pomysły: nowe auto, remont łazienki, kurs dla córki. Porównuje i wybiera łazienkę i kurs – to zarządzanie domowym portfelem.","firma":"Zarząd szpitala przegląda co kwartał listę 12 projektów IT. Dwa zatrzymuje, bo przestały być potrzebne, a pieniądze przenosi na bezpieczeństwo danych.","urzad":"Urząd marszałkowski ma na liście 15 projektów IT, m.in. nową stronę, e-usługi dla przedsiębiorców i wymianę serwerów. Zarząd województwa co pół roku przegląda całą listę i porównuje koszty, korzyści i ryzyko. Jeden projekt wstrzymuje, a zaoszczędzone pieniądze przesuwa na e-usługi.","it":"APO05 Zarządzanie portfelem projektów; definicja portfela inwestycyjnego w słowniku FW-PL (s. 92).","egz":"APO05 Zarządzanie Portfelem (Manage Portfolio). Kolejność do zapamiętania: portfel zawiera programy, a programy zawierają projekty. Nie myl z: Program – Program to kilka projektów dla jednego celu. Portfel to wszystkie inwestycje organizacji naraz – wiele programów i projektów.; Projekt – Projekt to jedno przedsięwzięcie. Portfel to lista wszystkich przedsięwzięć, spośród których się wybiera.","src":"COBIT 5 Framework (PL), s. 92; COBIT 5 Framework (PL), s. 33, Ilustracja 16; COBIT 5 Framework (PL), s. 31"},"it-bezpieczenstwo-informacji":{"t":"Bezpieczeństwo informacji","eg":"Bezpieczeństwo informacji","pd":"bezpieczeństwo informacji","en":"Information security","wyj":"Ochrona informacji przed podejrzeniem przez obcych, zepsuciem i utratą.\n\nOrganizacja ustala, jakie informacje są cenne. Wprowadza zabezpieczenia: konta i hasła, uprawnienia, kopie, aktualizacje, szkolenia. Sprawdza, czy działają, i reaguje na incydenty bezpieczeństwa.\n\nŻeby informacje organizacji i ludzi nie trafiły w niepowołane ręce, nie zostały zmienione i nie zginęły.","zycie":"Ustawiasz w telefonie kod blokady i nie podajesz nikomu kodu z SMS-a od banku. To Twoje bezpieczeństwo informacji.","firma":"Przychodnia szkoli pracowników, jak rozpoznać fałszywego maila, i wymaga dwóch dowodów przy logowaniu do kart pacjentów.","urzad":"Urząd skarbowy przechowuje zeznania podatkowe tysięcy osób. Pracownicy logują się kartą i hasłem, widzą tylko sprawy swojego działu, a każde przeglądanie danych podatnika zostaje zapisane. Raz w roku przechodzą szkolenie z rozpoznawania fałszywych maili.","it":"Cel związany z IT nr 10 i procesy APO13 Zarządzanie bezpieczeństwem oraz DSS05 Zarządzanie usługami bezpieczeństwa (FW-PL s. 19, 33).","egz":"Cel związany z IT nr 10 (FW-PL s. 19); procesy APO13 Zarządzanie bezpieczeństwem (Manage Security) i DSS05 Zarządzanie usługami bezpieczeństwa (Manage Security Services). Nie myl z: Ryzyko związane z IT – Ryzyko IT to możliwość, że coś pójdzie źle. Bezpieczeństwo informacji to działania, które to ryzyko zmniejszają.; Dostęp i Bezpieczeństwo – „Dostęp i Bezpieczeństwo” w COBIT 5 to jedna z kategorii jakości (celów aktywatora). To hasło opisuje szeroko ochronę informacji.","src":"COBIT 5 Framework (PL), s. 19; COBIT 5 Framework (PL), s. 33, Ilustracja 16"},"role-organizacyjne":{"t":"Role i struktury organizacyjne","eg":"Role i struktury organizacyjne","pd":"Role i struktury organizacyjne w ramach metodyki COBIT 5","en":"Roles and organisational structures (Figure 33)","wyj":"Typowe stanowiska i zespoły, np. szef informatyki czy komisja ds. ryzyka, i za co odpowiadają.\n\nCOBIT 5 podaje ilustracyjną listę ról i struktur organizacyjnych (Ilustracja 33), np. zarząd (Board), CEO, CFO, CIO, CISO, komitet ds. strategii IT (IT Strategy Committee), komitety sterujące (Steering Committees) i PMO. Dla każdej opisuje, za co odpowiada, np. CIO za dopasowanie strategii IT i biznesowej, a CISO za bezpieczeństwo informacji. Te role są kolumnami tabel RACI, a organizacja przypisuje je do swoich stanowisk i może łączyć kilka ról w jednej osobie.\n\nŻeby organizacja miała wzorcowy zestaw ról i struktur, do których może przypisać odpowiedzialność w tabelach RACI, nawet jeśli u niej stanowiska nazywają się inaczej.","zycie":"Rodzina buduje dom. Mama decyduje o całości i podpisuje kredyt (jak CEO), tata pilnuje rat i rachunków (CFO), córka-informatyczka ogarnia internet, kamery i inteligentne gniazdka (CIO), a co tydzień cała trójka siada jako „komitet sterujący” budowy. To te same funkcje co w tabeli COBIT, tylko pod innymi nazwami.","firma":"W sklepie internetowym na 8 osób właścicielka jest jednocześnie CEO i CFO, a jedyny informatyk pełni rolę CIO i CISO – dba i o serwer, i o hasła. Co poniedziałek właścicielka, informatyk i kierownik magazynu spotykają się jako komitet sterujący nowego projektu. Role z Ilustracji 33 są te same, tylko obsadzone przez mniej osób.","urzad":"W starostwie starosta pełni rolę zbliżoną do CEO, skarbnik do CFO, a kierownik referatu informatyki do CIO. Inspektor ochrony danych odpowiada dyrektorowi ds. prywatności, a osoba odpowiedzialna za bezpieczeństwo informacji – CISO. Nazwy w urzędzie są inne, ale funkcje z tabeli COBIT da się do nich przypisać.","it":"Organizacja rozpisuje RACI dla procesu APO13 (Zarządzanie bezpieczeństwem) i kolumnę CISO przypisuje kierownikowi bezpieczeństwa informacji, a kolumnę CIO dyrektorowi IT. Ilustracja 33 jest ilustracyjna, więc w mniejszej firmie te kolumny mogą trafić do innych stanowisk albo do jednej osoby.","egz":"Najwyższa rangą rola odpowiedzialna za dopasowanie strategii IT i biznesowej to CIO. Komitetowi strategicznemu IT przewodniczy członek zarządu, a nie CIO. Nie myl z: CIO vs CISO – CIO: dopasowanie strategii IT do biznesu i dostarczanie IT. CISO: bezpieczeństwo informacji.; PMO vs VMO – PMO wspiera realizację projektów. VMO zajmuje się wartością portfela i uzasadnieniami biznesowymi.","src":"COBIT 5 Framework (PL), s. 76; COBIT 5 Framework (PL), s. 76, Ilustracja 33; COBIT 5 Framework (PL), s. 77"},"ryzyko":{"t":"Ryzyko","eg":"Ryzyko","pd":"Ryzyko","en":"Risk","wyj":"Coś może pójść źle; liczy się, jak bardzo jest to prawdopodobne i jak bardzo zaboli.\n\nRyzyko (risk) to połączenie prawdopodobieństwa zdarzenia i jego konsekwencji. Dotyczy przyszłości. Dopowiedzenie kursu (interpretacja, nie definicja z s. 93): gdy zdarzenie już nastąpiło, mówimy raczej o problemie albo incydencie. Ład ustala apetyt na ryzyko (risk appetite), czyli ile ryzyka organizacja jest gotowa przyjąć (EDM03, Zapewnienie optymalizacji ryzyka), a Zarządzanie identyfikuje, ocenia i ogranicza ryzyka w tych granicach (APO12, Zarządzanie ryzykiem).\n\nŻeby z wyprzedzeniem widzieć, co może pójść źle i jak bardzo by zaszkodziło, i świadomie decydować, czemu zapobiegać, a co zaakceptować.","zycie":"Planujecie wesele w ogrodzie w lipcu. Deszcz jest dość prawdopodobny, a skutek byłby duży – goście mokną, tort się rozpływa – więc rezerwujecie namiot. Ryzyko to ta możliwość deszczu razem z jej skutkami; jeśli w dniu wesela leje, macie już problem, a nie ryzyko.","firma":"W biurze rachunkowym tylko pani Ewa umie obsługiwać program do płac. Jeśli zachoruje w ostatnim tygodniu miesiąca, pensje u klientów się spóźnią. Szef ocenia, że to mało prawdopodobne, ale bolesne, więc każe przeszkolić drugą osobę – tak wygląda praca z ryzykiem.","urzad":"Nabór wniosków o dopłaty do wymiany pieców w urzędzie gminy zamyka się w piątek o 15:00, a wszystko idzie przez jeden serwer. Awaria akurat w piątek jest mało prawdopodobna, ale skutek byłby fatalny, więc informatyk robi kopię i ma tego dnia dyżur. To ryzyko: możliwość zdarzenia plus jego skutki.","it":"W procesie APO12 (Zarządzanie ryzykiem) dział IT prowadzi rejestr ryzyk: np. „awaria serwerowni” ma ocenione prawdopodobieństwo i skutki. Dla ryzyk powyżej apetytu ustalonego przez Ład w EDM03 (Zapewnienie optymalizacji ryzyka) planuje się działania, np. zapasowe centrum danych.","egz":"Na egzaminie ryzyko pojawia się głównie jako „optymalizacja ryzyka” (cel Ładu) i „apetyt na ryzyko” (czynnik środowiskowy we wdrożeniu). Nie myl z: Issue / problem / incydent – Problem już zaistniał; ryzyko jest możliwością w przyszłości.; Zagrożenie – Zagrożenie to źródło (np. powódź); ryzyko łączy prawdopodobieństwo z konsekwencjami.","src":"COBIT 5 Framework (PL), s. 93"},"lad":{"t":"Ład","eg":"Ład","pd":"Nadzór","en":"Governance","wyj":"Szefostwo decyduje, po co i co robimy, i pilnuje, czy idziemy w dobrą stronę.\n\nOrgan Ładu, zwykle zarząd pod przewodnictwem prezesa, ocenia potrzeby, warunki i opcje interesariuszy (Evaluate), ustala priorytety i podejmuje decyzje (Direct), a potem monitoruje sprawność i zgodność z wyznaczonym kierunkiem (Monitor). Wyniki z Zarządzania wracają do Ładu i cykl się powtarza.\n\nŻeby informatyka robiła to, czego potrzebuje cała organizacja, a nie tylko to, co umieją informatycy.","zycie":"Wspólnota mieszkaniowa na zebraniu rocznym ocenia stan budynku i decyduje: w tym roku najpierw dach, elewacja dopiero za dwa lata, a zarządca co kwartał pokazuje wydatki. Wyboru dekarza i pilnowania ekipy zebranie już nie robi – to robota zarządcy. Ocenić, wyznaczyć kierunek, monitorować: to jest Ład.","firma":"Właścicielka restauracji raz na kwartał siada z wynikami i decyduje: celujemy w rodziny z dziećmi, marża ma wynosić co najmniej 20%, a za trzy miesiące sprawdzamy, czy to działa. Co i jak gotować każdego dnia, ustala już szef kuchni. Ona sprawuje Ład, on zarządza.","urzad":"Rada gminy przyjmuje strategię cyfryzacji: najpierw e-usługi dla mieszkańców, potem nowy system księgowy. Ustala na to budżet i co pół roku każe sobie przedstawić, co zrobiono. Wybór dostawcy i prowadzenie wdrożenia zostawia urzędowi – rada sprawuje Ład, a nie zarządza projektem.","it":"W EDM03 (Zapewnienie optymalizacji ryzyka) zarząd ocenia ryzyko IT, ustala apetyt na ryzyko i monitoruje, czy organizacja go nie przekracza.","egz":"Zapamiętaj czasowniki: Ład = Oszacuj, Kieruj, Monitoruj (EDM); odpowiada zarząd pod przewodnictwem prezesa (EN: chairperson – przewodniczący rady/zarządu, nie CEO). Zarządzanie = Planuj, Twórz, Wykonuj, Monitoruj; odpowiada kierownictwo pod przewodnictwem CEO. Egzamin PL: „Ład”. Podręcznik PL: „Nadzór”. EN: Governance. To jedno i to samo pojęcie. Słowo „nadzór” w pytaniu egzaminacyjnym może też pojawić się w zbitce „ład i nadzór”. Nie myl z: Zarządzanie – Zarządzanie (management) planuje, buduje, uruchamia i monitoruje działania ZGODNIE z kierunkiem wyznaczonym przez Ład.; Nadzór w znaczeniu kontroli / inspekcji – Polskie „nadzór” kojarzy się z kontrolą. W COBIT to coś szerszego: także wyznaczanie kierunku i ustalanie priorytetów.; Ład korporacyjny (enterprise governance) – Ład nad IT w organizacji (GEIT) jest CZĘŚCIĄ ładu korporacyjnego (Zasada 2).","src":"COBIT 5 Framework (PL), s. 91; COBIT 5 Framework (PL), s. 14; materiały Altkom"},"zarzadzanie":{"t":"Zarządzanie","eg":"Zarządzanie","pd":"Zarządzanie","en":"Management","wyj":"Kierownicy planują i wykonują pracę w kierunku, który wyznaczyło szefostwo.\n\nKierownictwo pod przewodnictwem CEO planuje, tworzy, wykonuje i monitoruje działania (Plan, Build, Run, Monitor) zgodnie z kierunkiem wskazanym przez Ład. W COBIT 5 to cztery domeny: APO, BAI, DSS i MEA, razem 32 procesy. Wyniki i informacje zwrotne wracają do Ładu, który je ocenia i w razie potrzeby koryguje kierunek.\n\nŻeby kierunek wyznaczony przez Ład zamienić w zaplanowaną, wykonaną i sprawdzoną pracę, która prowadzi do celów organizacji.","zycie":"Rodzina ustaliła: „oszczędzamy na wakacje” (to Ład). Ty robisz plan zakupów, porównujesz ceny, co miesiąc przelewasz 1000 zł na lokatę i sprawdzasz, czy kwota rośnie. Ta codzienna robota to Zarządzanie.","firma":"Właściciel restauracji ustalił, że w weekendy ma być nowe menu. Kierownik zmiany układa grafik, zamawia towar, pilnuje jakości dań i w poniedziałek raportuje właścicielowi, jak poszło. Praca kierownika to Zarządzanie.","urzad":"Wójt zdecydował, że mieszkańcy mają załatwiać sprawy przez internet. Sekretarz gminy i kierownik informatyki planują projekt, wybierają dostawcę, wdrażają e-usługi i co miesiąc raportują wójtowi. Ich praca to Zarządzanie.","it":"W dziale IT szpitala APO09 (Zarządzanie umowami o świadczenie usług) planuje poziomy usług, BAI03 (Zarządzanie identyfikacją i budowaniem rozwiązań) buduje nowy moduł rejestracji, DSS01 (Zarządzanie eksploatacją) utrzymuje go w ruchu, a MEA01 (Monitorowanie, ocena i oszacowanie wydajności i zgodności) mierzy wyniki i raportuje je do Ładu.","egz":"Zarządzanie działa zgodnie z kierunkiem wyznaczonym przez organ Ładu, aby osiągnąć cele organizacji (definicja, s. 31). Nie myl z: Ład – Ład ocenia, kieruje i monitoruje; Zarządzanie planuje, tworzy, wykonuje i monitoruje. Oba „monitorują”, ale Ład monitoruje kierunek i cele, a Zarządzanie – realizację działań.","src":"COBIT 5 Framework (PL), s. 92; COBIT 5 Framework (PL), s. 14"}},"S":[{"lekcje":["en-k30-role-c-level"],"pt":"Lekcja 2.30","h":"Rysunek 33: każda rola ma jedno słowo-klucz","b":"<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>Rola<\/th><th>Słowo-klucz<\/th><\/tr><tr><td>Zarząd<\/td><td>rozliczany za <w k=\"lad\">nadzór<\/w><\/td><\/tr><tr><td>CEO – dyrektor generalny<\/td><td>pełne <w k=\"zarzadzanie\">zarządzanie<\/w><\/td><\/tr><tr><td>COO<\/td><td>funkcjonowanie organizacji<\/td><\/tr><tr><td>CFO / CRO<\/td><td>finanse / <w k=\"ryzyko\">ryzyko<\/w> całej organizacji<\/td><\/tr><tr><td>CIO – dyrektor ds. informatyki<\/td><td>dopasowanie strategii IT i biznesowej<\/td><\/tr><tr><td>CISO<\/td><td><w k=\"it-bezpieczenstwo-informacji\">bezpieczeństwo informacji<\/w> we wszystkich formach<\/td><\/tr><\/table><\/div>","c":"Dopasowanie strategii IT i biznesu to CIO, a nie CISO ani dyrektor ds. architektury.","s":"COBIT 5 Framework (PL), s. 76, Ilustracja 33","ctx":"<p><w k=\"role-organizacyjne\">Role i struktury organizacyjne<\/w> (<span class=\"en\">Roles and organisational structures<\/span>; w podręczniku Ilustracja 33) to wzorce używane w diagramach RACI. Tabela ma charakter ilustracyjny i nie wyznacza uniwersalnej struktury organizacyjnej. Jedna osoba może pełnić kilka ról.<\/p><p>Rozwinięcia skrótów: <span class=\"en\">Chief Executive / Operating / Financial / Risk / Information / Information Security Officer<\/span>, czyli dyrektor generalny, operacyjny, finansowy, ds. ryzyka, ds. informatyki i ds. bezpieczeństwa informacji. CIO odpowiada też za planowanie, optymalizację zasobów i dostarczanie usług IT. Dyrektor ds. architektury odpowiada za proces architektury korporacyjnej, a dyrektor jednostki biznesowej – za działalność swojej jednostki lub spółki zależnej (s. 76).<\/p><p>Przykład: w sklepie z 15 pracownikami właścicielka jest CEO i właścicielką procesu sprzedaży. Kierownik IT pełni role dyrektora ds. rozwoju i dyrektora ds. operacji IT. Każda rola z Rysunku 33 istnieje, tylko nie jako osobny etat.<\/p>"},{"pt":"Sprawdź się","quiz":{"id":"q-enk-30-3","sylabus":["EN-02-13"],"tresc":"Bank powołuje komitet ds. strategii (wykonawczy IT), który ma dbać o zaangażowanie zarządu w najważniejsze decyzje o IT. Kto według Rysunku 33 zwykle przewodniczy takiemu komitetowi?","opcje":[{"t":"Członek zarządu","ok":true,"w":"Dobrze. Komitet tworzy zarząd, a przewodniczy mu zazwyczaj członek zarządu – dzięki temu zarząd jest blisko decyzji o IT."},{"t":"Dyrektor ds. finansowych (CFO)","w":"CFO odpowiada za zarządzanie finansami, ryzyko finansowe i rachunkowość, a nie za prowadzenie komitetu IT."},{"t":"Dyrektor ds. informatyki (CIO)","w":"To typowa pułapka. Podręcznik zaznacza, że przewodniczącym jest zwykle członek zarządu, a nie CIO."},{"t":"Dyrektor ds. architektury","w":"Dyrektor ds. architektury odpowiada za proces architektury korporacyjnej; wytyczne architektoniczne daje Rada ds. Architektury."}],"src":"COBIT 5 Framework (PL), s. 76","pomoc":{"t":"Pytanie dotyczy lekcji 2.30 „Role z Rysunku 33 – zarząd i najwyższa kadra (CEO, CFO, COO, CRO, CIO, CISO)”. Cel lekcji: Potrafię dopasować role zarządu, CEO, CFO, COO, CRO, CIO i CISO do ich odpowiedzialności.","k":["role-organizacyjne"]}}},{"lekcje":["en-k31-komitety-biura","en-k32-pozostale-role"],"pt":"Lekcje 2.31–2.32","h":"Komitetowi ds. strategii przewodniczy członek zarządu, nie CIO","b":"<ul><li><b>Komitety<\/b> decydują: ds. strategii (portfele IT), sterujące (projekty), Rada ds. Architektury, ds. ryzyka.<\/li><li><b>Biura<\/b> wspierają: PMO (projekty), VMO (wartość, <w k=\"it-portfel\">portfel<\/w>).<\/li><li><b>Właściciel procesu biznesowego<\/b> – sprawność i doskonalenie procesu.<\/li><\/ul>","c":"Komitet decyduje, biuro pomaga, a właściciel procesu pilnuje jednego procesu.","s":"COBIT 5 Framework (PL), s. 76–77, Ilustracja 33","ctx":"<p>Komitet ds. strategii (wykonawczy IT) angażuje zarząd w decyzje o IT. Jest rozliczany za portfele inwestycji, usług i zasobów IT. Komitety sterujące dają wytyczne programom i projektom oraz przydzielają im zasoby. Komitet ds. zarządzania ryzykiem w przedsiębiorstwie uzgadnia stanowisko w sprawie ERM (<span class=\"en\">Enterprise Risk Management<\/span>, zarządzanie ryzykiem w przedsiębiorstwie). PMO (<span class=\"en\">Project Management Office<\/span>) wspiera kierowników projektów i raportuje. VMO (<span class=\"en\">Value Management Office<\/span>) jest sekretariatem portfela inwestycji i usług.<\/p><p>Właściciel procesu biznesowego dba o realizację celów procesu, dąży do jego doskonalenia i zatwierdza zmiany. Inne role z Rysunku 33: zgodność (wymogi prawne i umowne), audyt (audyty wewnętrzne), kierownik ds. ciągłości działania (funkcje krytyczne po zakłóceniach), dyrektor ds. prywatności (ochrony danych).<\/p><p>Przykład z urzędu marszałkowskiego: komitet wybiera projekty informatyczne na kolejny rok. Biuro zbiera raporty z tych projektów i pomaga kierownikom.<\/p><p>Kierownik ds. bezpieczeństwa informacji prowadzi codzienne zarządzanie bezpieczeństwem. Kierownik ds. usług odpowiada za rozwój i ocenę usług, kierownik ciągłości za utrzymanie i odtworzenie krytycznych funkcji, a dyrektor ds. prywatności za nadzór nad wymaganiami i ryzykiem ochrony danych osobowych.<\/p>"},{"pt":"Sprawdź się","quiz":{"id":"q-enk-31-3","sylabus":["EN-02-13"],"tresc":"Kto zazwyczaj <b>przewodniczy<\/b> komitetowi ds. strategii (wykonawczemu IT)?","opcje":[{"t":"Dyrektor ds. bezpieczeństwa informacji","w":"CISO odpowiada za bezpieczeństwo informacji."},{"t":"Członek zarządu","ok":true,"w":"Dobrze. Podręcznik mówi: członek zarządu, nie zaś CIO."},{"t":"Kierownik biura PMO","w":"PMO wspiera projekty, a nie prowadzi komitetu strategii."},{"t":"Dyrektor ds. informatyki (CIO)","w":"Podręcznik wyraźnie mówi, że zazwyczaj nie CIO."}],"src":"COBIT 5 Framework (PL), s. 76","pomoc":{"t":"Pytanie dotyczy lekcji 2.31 „Komitety i biura z Rysunku 33 – kto decyduje, a kto wspiera”. Cel lekcji: Potrafię odróżnić komitety z Rysunku 33 i wiem, czym różni się PMO od VMO.","k":[]}}},{"pt":"Sprawdź się","quiz":{"id":"q-enk-32-3","sylabus":["EN-02-13"],"tresc":"Która rola z Rysunku 33 odpowiada za <b>proces<\/b> związany z architekturą korporacyjną?","opcje":[{"t":"Dyrektor ds. rozwoju rozwiązań IT","w":"Odpowiada za procesy rozwoju rozwiązań IT."},{"t":"CIO","w":"CIO odpowiada za dopasowanie strategii IT i biznesowej."},{"t":"Dyrektor ds. architektury","ok":true,"w":"Dobrze. Tak opisuje tę rolę podręcznik na s. 76."},{"t":"Rada ds. Architektury","w":"Rada daje wytyczne oraz tworzy polityki i standardy architektury."}],"src":"COBIT 5 Framework (PL), s. 76","pomoc":{"t":"Pytanie dotyczy lekcji 2.32 „Właściciel procesu i pozostałe role z Rysunku 33”. Cel lekcji: Potrafię rozpoznać właściciela procesu biznesowego i pozostałe role z Rysunku 33 po ich odpowiedzialności.","k":[]}}},{"pt":"Arkusz próbny","sp1":"sp1-17","lekcja":"2.32","temat":"Właściciel procesu i pozostałe role z Rysunku 33","k":[]}]};</script>
