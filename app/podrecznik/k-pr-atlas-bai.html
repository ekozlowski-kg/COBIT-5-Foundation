<script>window.DECK={"id":"k-pr-atlas-bai","rozdzial":"Rozdział 6 · Zasada 5: Oddzielenie Ładu od Zarządzania · s. 31–33","tytul":"Atlas procesów: BAI","prev":"k-pr-atlas-apo.html","next":"k-pr-atlas-dss-mea.html","T":{"proc-bai04":{"t":"BAI04 Zarządzanie dostępnością i pojemnością","eg":"BAI04 Zarządzanie dostępnością i pojemnością","pd":"BAI04 Zarządzanie dostępnością i pojemnością","en":"BAI04 Manage Availability and Capacity","wyj":"Planujesz z wyprzedzeniem, żeby system wytrzymał tłok i działał wtedy, kiedy jest potrzebny.\n\nZapewnienie odpowiedniej dostępności i pojemności przez analizę wymagań, prognozy, planowanie i monitorowanie.\n\nŻeby systemy wytrzymały tłok i działały, kiedy są potrzebne. I żeby nie przepłacać za zbędny zapas mocy.","zycie":"Na komunię przychodzi 30 osób, a masz stół na 8. Tydzień wcześniej pożyczasz stoły i krzesła, a w kuchni sprawdzasz, czy piekarnik pomieści dwie blachy. Planujesz pojemność, zanim goście staną w drzwiach.","firma":"Sklep internetowy już we wrześniu sprawdza, ile zamówień wytrzyma serwer, i dokupuje moc na Black Friday.","urzad":"Urzędy skarbowe wiedzą, że w ostatnim tygodniu kwietnia wpływa kilka razy więcej zeznań podatkowych niż w zwykłym miesiącu. Dlatego już zimą informatycy administracji skarbowej sprawdzają, ile deklaracji na godzinę wytrzyma system e-deklaracji, i zwiększają jego moc. W kwietniu codziennie patrzą na obciążenie, żeby zareagować, zanim system zwolni.","it":"Praktyki BAI04: bazowa ocena dostępności i pojemności, ocena wpływu na biznes, planowanie nowych wymagań, monitorowanie i usuwanie problemów.","egz":"Słowa-klucze: capacity, availability, wydajność, prognoza obciążenia, „wytrzyma szczyt” → BAI04. Katastrofa, plan awaryjny, odtworzenie → DSS04. Podręcznik: „BAI04 Zarządzanie dostępnością i pojemnością”. Na egzaminie nazwa procesu może brzmieć inaczej niż w podręczniku. Egzamin PL tłumaczy po swojemu, często trybem rozkazującym (np. domena „Twórz, Nabywaj i Wdrażaj” zamiast „Budowanie, nabywanie i wdrażanie”). Egzaminacyjnej nazwy tego procesu nie potwierdziliśmy, dlatego rozpoznawaj go po kodzie i angielskim słowie kluczowym: Availability and Capacity. Il. 39 (s. 88) wymienia umiejętność „Zarządzanie pojemnością” przy BAI, a „Zarządzanie dostępnością” przy DSS. To kategorie umiejętności, a nie procesy: proces BAI04 obejmuje oba tematy. Nie myl z: DSS04 Zarządzanie ciągłością – BAI04 planuje moc i niezawodność w zwykłych i szczytowych warunkach. DSS04 przygotowuje przetrwanie poważnego zakłócenia, np. zalania serwerowni.; APO09 Zarządzanie umowami o świadczenie usług – APO09 uzgadnia z odbiorcą, ile dostępności się obiecuje (umowa o poziomie usług). BAI04 planuje, jak tę obietnicę spełnić.; DSS01 Zarządzanie eksploatacją – DSS01 na bieżąco pilnuje infrastruktury i dostarcza dane. BAI04 na ich podstawie prognozuje i planuje.","src":"COBIT 5: Enabling Processes, sekcja BAI04 — Process Description / Purpose / Practices"},"proc-bai06":{"t":"BAI06 Zarządzanie zmianami","eg":"BAI06 Zarządzanie zmianami","pd":"BAI06 Zarządzanie zmianami","en":"BAI06 Manage Changes","wyj":"Każdą poprawkę w systemach najpierw zgłaszasz, oceniasz i zatwierdzasz, a dopiero potem wprowadzasz i zapisujesz.\n\nKontrolowanie zmian, w tym oceny, priorytetów, autoryzacji, śledzenia, zamknięcia i zmian awaryjnych.\n\nŻeby żadna zmiana w systemach nie zaskoczyła użytkowników i nie zepsuła usługi. Każda zmiana jest oceniona, zatwierdzona i zapisana.","zycie":"Wspólnota mieszkaniowa chce wymienić domofon. Administrator zgłasza pomysł, zarząd sprawdza koszt i wpływ na mieszkańców, wyznacza termin i ogłasza go na klatce. Po wymianie aktualizuje spis kodów. Nikt nie wymienia domofonu „na dziko” w nocy.","firma":"Programista sklepu zgłasza zmianę liczenia rabatów, kierownik ocenia ryzyko i zmiana wchodzi we wtorek o 6:00.","urzad":"Dostawca systemu elektronicznego zarządzania dokumentacją (EZD) w starostwie zgłasza aktualizację. Komitet zmian – kierownik informatyki, sekretarz powiatu i kierowniczka kancelarii – ocenia ryzyko i przesuwa wdrożenie z czwartku na sobotę, gdy urząd nie przyjmuje interesantów. Po aktualizacji informatyk zamyka wniosek o zmianę i opisuje, co zmieniono.","it":"Praktyki BAI06: ocena, priorytet i autoryzacja wniosków o zmianę, zmiany awaryjne, śledzenie statusu oraz zamknięcie i dokumentacja. Opis zmienionych elementów aktualizujesz w BAI10.","egz":"Słowa-klucze: wniosek o zmianę, ocena wpływu, autoryzacja, rada ds. zmian, zmiana awaryjna → BAI06. Nie myl z BAI05 (ludzie) i BAI07 (odbiór i przejście). Podręcznik: „BAI06 Zarządzanie zmianami”. Na egzaminie nazwa procesu może brzmieć inaczej niż w podręczniku. Egzamin PL tłumaczy po swojemu, często trybem rozkazującym (np. domena „Twórz, Nabywaj i Wdrażaj” zamiast „Budowanie, nabywanie i wdrażanie”). Egzaminacyjnej nazwy tego procesu nie potwierdziliśmy, dlatego rozpoznawaj go po kodzie i angielskim słowie kluczowym: Manage Changes. Najgroźniejsza pułapka w BAI: krótka nazwa „Zarządzanie zmianami” kusi przy pytaniach o opór ludzi (to BAI05) albo o odbiór i uruchomienie (to BAI07). Nie myl z: BAI05 Zarządzanie wdrażaniem zmian organizacyjnych – BAI05 to ludzka strona zmiany: opór, komunikacja, nawyki. BAI06 to kontrola zmiany w systemach i procesach.; BAI07 Zarządzanie procesem akceptacji zmian i przejścia – BAI06 decyduje, czy i kiedy zmianę wolno wprowadzić. BAI07 ją odbiera (testy akceptacyjne) i przenosi do eksploatacji.; BAI10 Zarządzanie konfiguracją – BAI06 kontroluje zmianę. BAI10 utrzymuje aktualny opis tego, jak system wygląda po zmianie.; DSS02 Zarządzanie zgłoszeniami serwisowymi i incydentami – DSS02 przywraca usługę po incydencie. Jeśli do tego trzeba coś zmienić w systemie, to zmiana awaryjna podlega BAI06.","src":"COBIT 5: Enabling Processes, sekcja BAI06 — Process Description / Purpose / Practices"},"proc-bai05":{"t":"BAI05 Zarządzanie wdrażaniem zmian organizacyjnych","eg":"BAI05 Zarządzanie wdrażaniem zmian organizacyjnych","pd":"BAI05 Zarządzanie wdrażaniem zmian organizacyjnych","en":"BAI05 Manage Organisational Change Enablement","wyj":"Przygotowujesz ludzi na nowy sposób pracy, żeby go zrozumieli, przyjęli i nie wrócili do starych nawyków.\n\nPrzygotowanie ludzi i organizacji do zmiany oraz utrwalenie nowych zachowań i sposobów pracy.\n\nŻeby ludzie przyjęli zmianę, a nie tylko dostali nowe narzędzie. Bez tego zmiana zostaje na papierze.","zycie":"Babcia dostaje smartfon zamiast starej komórki. Wnuczka nie tylko daje jej telefon. Tłumaczy, po co jej wideorozmowy, uczy po kawałku, chwali za pierwszy wysłany SMS i przez miesiąc dzwoni z pytaniem, jak idzie. To BAI05 w domowej skali.","firma":"Hurtownia przechodzi na skanery: kierowniczka pyta magazynierów o obawy i robi ze sceptyka ambasadora.","urzad":"Gmina przechodzi z papierowych dzienników korespondencji na elektroniczny obieg dokumentów. Sekretarz gminy najpierw tłumaczy 45 urzędnikom, po co ta zmiana, a w każdym referacie wyznacza osobę, która pomaga innym. Szkoli w małych grupach, chwali referaty, które pierwsze przeszły na nowy obieg, i po pół roku wycofuje papierowe dzienniki, żeby nikt nie wrócił do starych nawyków.","it":"Siedem praktyk BAI05 to m.in. ustanowienie chęci zmiany, komunikowanie wizji, umożliwienie działania i użytkowania oraz utrzymanie zmian.","egz":"Słowa-klucze: opór, kultura, zachowania, komunikacja zmiany, „ludzie nie korzystają”, szybkie sukcesy → BAI05. Ocena i autoryzacja zmiany w systemie → BAI06. Odbiór i uruchomienie → BAI07. Podręcznik: „BAI05 Zarządzanie wdrażaniem zmian organizacyjnych”. Na egzaminie nazwa procesu może brzmieć inaczej niż w podręczniku. Egzamin PL tłumaczy po swojemu, często trybem rozkazującym (np. domena „Twórz, Nabywaj i Wdrażaj” zamiast „Budowanie, nabywanie i wdrażanie”). Egzaminacyjnej nazwy tego procesu nie potwierdziliśmy, dlatego rozpoznawaj go po kodzie i angielskim słowie kluczowym: Organisational Change Enablement. Uwaga na podobne nazwy: BAI06 „Zarządzanie zmianami” to kontrola zmian w systemach, a nie zmiana nawyków ludzi. Słowo enablement egzamin tłumaczy w module wdrożenia jako „Aktywowanie / Aktywacja zmiany” (podręcznik: „Umożliwienie zmian”), więc w nazwie BAI05 na egzaminie może pojawić się podobne słowo. Nie myl z: BAI06 Zarządzanie zmianami – BAI06 ocenia, zatwierdza i kontroluje zmiany w systemach. BAI05 dba, żeby ludzie przyjęli nowy sposób pracy.; BAI07 Zarządzanie procesem akceptacji zmian i przejścia – BAI07 odbiera rozwiązanie i przenosi je do eksploatacji. BAI05 sprawia, że po przeniesieniu ludzie z niego naprawdę korzystają.; Aktywowanie zmiany – Pierścień „Umożliwienie zmian” to element cyklu wdrażania COBIT w organizacji. BAI05 to proces, który robi to samo dla każdej zmiany wspieranej przez IT.","src":"COBIT 5: Enabling Processes, sekcja BAI05 — Process Description / Purpose / Practices"},"proc-bai10":{"t":"BAI10 Zarządzanie konfiguracją","eg":"BAI10 Zarządzanie konfiguracją","pd":"BAI10 Zarządzanie konfiguracją","en":"BAI10 Manage Configuration","wyj":"Prowadzisz aktualną mapę: z jakich części składa się system, jak są ustawione i co od czego zależy.\n\nUtrzymanie informacji o elementach konfiguracji i ich relacjach, stanach bazowych oraz zgodności modelu z rzeczywistością.\n\nŻeby wiedzieć, z jakich elementów składa się usługa i co od czego zależy. Wtedy zmiany i naprawy są bezpieczniejsze.","zycie":"Masz w szafce schemat instalacji elektrycznej: który bezpiecznik obsługuje kuchnię, a który łazienkę. Gdy elektryk dołoży gniazdko, dopisujesz je na schemacie. Przy awarii od razu wiesz, co wyłączyć.","firma":"Administrator sklepu ma opis: sklep na serwerze A, baza na B, płatności przez operatora C.","urzad":"Informatyk starostwa powiatowego prowadzi spis konfiguracji (repozytorium): który z 80 komputerów ma jaką wersję systemu i programów i z którym serwerem się łączy. Gdy producent ogłasza lukę w jednej wersji programu, informatyk w pięć minut wie, których stanowisk to dotyczy. Raz na kwartał sprawdza, czy zapisy zgadzają się ze stanem faktycznym.","it":"Praktyki BAI10 obejmują m.in. model konfiguracji, repozytorium z wersją bazową, raporty stanu i weryfikację integralności. Przed każdą zmianą w BAI06 sprawdzasz zależności w repozytorium.","egz":"Słowa-klucze: element konfiguracji, repozytorium konfiguracji (CMDB), wersja bazowa, powiązania między elementami, weryfikacja zapisu → BAI10. Podręcznik: „BAI10 Zarządzanie konfiguracją”. Na egzaminie nazwa procesu może brzmieć inaczej niż w podręczniku. Egzamin PL tłumaczy po swojemu, często trybem rozkazującym (np. domena „Twórz, Nabywaj i Wdrażaj” zamiast „Budowanie, nabywanie i wdrażanie”). Egzaminacyjnej nazwy tego procesu nie potwierdziliśmy, dlatego rozpoznawaj go po kodzie i angielskim słowie kluczowym: Configuration. Nie myl z: BAI09 Zarządzanie zasobami – BAI09 prowadzi aktywa jako majątek (koszt, licencja, cykl życia). BAI10 opisuje elementy konfiguracji (ustawienia, wersje, powiązania).; BAI06 Zarządzanie zmianami – BAI06 decyduje, czy zmianę wolno wprowadzić. BAI10 pamięta, jak system wygląda teraz – także po zmianie.; BAI08 Zarządzanie wiedzą – BAI08 utrzymuje wiedzę: instrukcje, obejścia, wnioski. BAI10 – opis tego, z czego system się składa.","src":"COBIT 5: Enabling Processes, sekcja BAI10 — Process Description / Purpose / Practices"},"proc-bai02":{"t":"BAI02 Zarządzanie definiowaniem wymagań","eg":"BAI02 Zarządzanie definiowaniem wymagań","pd":"BAI02 Zarządzanie definiowaniem wymagań","en":"BAI02 Manage Requirements Definition","wyj":"Zanim coś kupisz albo zbudujesz, spisujesz dokładnie, czego potrzebujesz i po czym poznasz, że działa.\n\nZdefiniowanie i uzgodnienie wymagań biznesowych oraz technicznych, w tym wykonalności i kryteriów akceptacji.\n\nŻeby kupić albo zbudować to, czego naprawdę potrzebujesz. Wymagania zatwierdza biznes, a nie sprzedawca.","zycie":"Kupujesz samochód dla rodziny. Zanim pójdziesz do salonu, spisujesz: 7 miejsc, duży bagażnik, spalanie poniżej 7 litrów, cena do 90 tysięcy. Ta kartka to wymagania. Sprzedawca pokaże Ci potem auta, które je spełniają albo nie.","firma":"Piekarnia przed otwarciem sklepu internetowego spisuje z załogą: zamówienia do 22:00, BLIK, alergeny.","urzad":"Starostwo przed przetargiem na nowy system dla wydziału geodezji zbiera wymagania od trzech wydziałów, zamiast przepisywać folder jednego dostawcy. Naczelnicy spisują m.in.: praca 40 urzędników naraz, wnioski przez internet, przechowywanie map przez 10 lat. Informatyk ocenia dwa warianty – zakup gotowego programu albo rozbudowę obecnego – a naczelnik geodezji i sekretarz powiatu zatwierdzają listę wymagań przed ogłoszeniem przetargu.","it":"Praktyki BAI02: definiowanie wymagań, studium wykonalności z wariantami, zarządzanie ryzykiem wymagań i zatwierdzenie wymagań. Wynik przechodzi do BAI03.","egz":"Słowa-klucze: wymagania, studium wykonalności, warianty rozwiązania, zatwierdzenie przez sponsora → BAI02. FW-PL (s. 60) wiąże BAI02 z projektowaniem aplikacji pod obsługę przez wsparcie i użytkowników. Podręcznik: „BAI02 Zarządzanie definiowaniem wymagań”. Na egzaminie nazwa procesu może brzmieć inaczej niż w podręczniku. Egzamin PL tłumaczy po swojemu, często trybem rozkazującym (np. domena „Twórz, Nabywaj i Wdrażaj” zamiast „Budowanie, nabywanie i wdrażanie”). Egzaminacyjnej nazwy tego procesu nie potwierdziliśmy, dlatego rozpoznawaj go po kodzie i angielskim słowie kluczowym: Requirements Definition. Nie myl z: BAI03 Zarządzanie identyfikacją i budowaniem rozwiązań – BAI02 mówi CO i PO CO (wymagania, warianty, wykonalność). BAI03 mówi JAK: projektuje, buduje albo kupuje i testuje rozwiązanie.; BAI07 Zarządzanie procesem akceptacji zmian i przejścia – BAI07 sprawdza w testach akceptacyjnych, czy rozwiązanie spełnia wymagania z BAI02. Samo spisanie wymagań to BAI02.","src":"COBIT 5: Enabling Processes, sekcja BAI02 — Process Description / Purpose / Practices"},"proc-bai08":{"t":"BAI08 Zarządzanie wiedzą","eg":"BAI08 Zarządzanie wiedzą","pd":"BAI08 Zarządzanie wiedzą","en":"BAI08 Manage Knowledge","wyj":"Dbasz, żeby potrzebna wiedza była spisana, aktualna i łatwa do znalezienia, a nie tylko w czyjejś głowie.\n\nIdentyfikowanie, utrzymywanie i udostępnianie wiedzy potrzebnej ludziom, w tym wiedzy jawnej i ukrytej.\n\nŻeby wiedza potrzebna do pracy nie siedziała tylko w czyjejś głowie. Ma być aktualna i łatwa do znalezienia.","zycie":"Dziadek jako jedyny wie, jak odpowietrzyć piec w domu. Wnuk nagrywa go telefonem, spisuje kroki na kartce i przykleja ją przy piecu. Gdy piec się zmieni, kartkę wymienia. Wiedza przestaje być w jednej głowie.","firma":"Infolinia firmy kurierskiej ma bazę odpowiedzi, którą konsultantki uzupełniają, a kierownik co miesiąc czyści.","urzad":"Kierowniczka urzędu stanu cywilnego w urzędzie miasta za rok przechodzi na emeryturę. Razem z dwiema młodszymi koleżankami spisuje nietypowe przypadki, np. ślub z cudzoziemcem albo przeniesienie zagranicznego aktu urodzenia do polskiego rejestru, i zapisuje instrukcje we wspólnym folderze. Co pół roku zespół przegląda wpisy i usuwa te, które zdezaktualizowały się po zmianie przepisów.","it":"Praktyki BAI08: kultura dzielenia się wiedzą, źródła informacji, porządkowanie wiedzy, jej użycie oraz ocena i wycofanie. Rejestr znanych błędów z DSS03 to przykład takiej wiedzy.","egz":"Słowa-klucze: baza wiedzy, dzielenie się wiedzą, aktualność instrukcji, wycofanie nieaktualnej wiedzy → BAI08. FW-PL (s. 60) łączy BAI08 z BAI05: razem dają użytkownikom możliwość efektywnego korzystania z systemów. Podręcznik: „BAI08 Zarządzanie wiedzą”. Na egzaminie nazwa procesu może brzmieć inaczej niż w podręczniku. Egzamin PL tłumaczy po swojemu, często trybem rozkazującym (np. domena „Twórz, Nabywaj i Wdrażaj” zamiast „Budowanie, nabywanie i wdrażanie”). Egzaminacyjnej nazwy tego procesu nie potwierdziliśmy, dlatego rozpoznawaj go po kodzie i angielskim słowie kluczowym: Manage Knowledge. Nie myl z: BAI10 Zarządzanie konfiguracją – BAI10 opisuje, z czego składa się system i jak elementy są połączone. BAI08 mówi, jak z nim pracować i czego się nauczyliśmy.; APO07 Zarządzanie zasobami ludzkimi – APO07 dba o ludzi i ich kompetencje (zatrudnienie, szkolenia, zastępstwa). BAI08 dba o to, żeby wiedza była spisana i dostępna niezależnie od jednej osoby.; Informacja – Informacja to aktywator. BAI08 to proces, który zarządza szczególną informacją – wiedzą potrzebną do pracy i decyzji.","src":"COBIT 5: Enabling Processes, sekcja BAI08 — Process Description / Purpose / Practices"},"proc-bai01":{"t":"BAI01 Zarządzanie programami i projektami","eg":"BAI01 Zarządzanie programami i projektami","pd":"BAI01 Zarządzanie programami i projektami","en":"BAI01 Manage Programmes and Projects","wyj":"Prowadzisz przedsięwzięcia z początkiem i końcem tak, żeby skończyły się na czas, w budżecie i dały obiecany efekt.\n\nZarządzanie programami i projektami, w tym interesariuszami, zakresem, kosztami, terminami i monitorowaniem korzyści.\n\nŻeby programy i projekty kończyły się na czas, w budżecie i dawały obiecane korzyści.","zycie":"Budujesz dom. Kierownik budowy ma harmonogram, kosztorys i listę etapów. Co tydzień sprawdza, czy ekipy nie mają opóźnień, i od razu reaguje. Po odbiorze siadacie i spisujecie, co poszło źle. Tak działa BAI01.","firma":"Hurtownia wdraża system magazynowy z planem, budżetem i komitetem sterującym, a po starcie sprawdza czas wysyłek.","urzad":"Urząd miasta prowadzi program „e-Urząd” z trzech projektów: e-rezerwacja wizyt, e-płatności i nowa strona. Każdy projekt ma plan, budżet i kierownika, a komitet sterujący co miesiąc sprawdza postęp i ryzyko. Po zamknięciu urząd sprawdza, czy kolejki naprawdę się skróciły.","it":"Praktyki BAI01 obejmują m.in. inicjowanie programu, planowanie projektów, zarządzanie ryzykiem projektu i zamknięcie programu. Wspierają pierścień Zarządzanie programem.","egz":"Słowa-klucze: programme, project, harmonogram, budżet projektu, zamknięcie projektu, PMO → BAI01. Wybór i priorytety inwestycji → APO05 (portfel). Podręcznik: „BAI01 Zarządzanie programami i projektami”. Na egzaminie nazwa procesu może brzmieć inaczej niż w podręczniku. Egzamin PL tłumaczy po swojemu, często trybem rozkazującym (np. domena „Twórz, Nabywaj i Wdrażaj” zamiast „Budowanie, nabywanie i wdrażanie”). Egzaminacyjnej nazwy tego procesu nie potwierdziliśmy, dlatego rozpoznawaj go po kodzie i angielskim słowie kluczowym: Programmes and Projects. Nie myl z: APO05 Zarządzanie Portfelem – APO05 (portfel) wybiera, które inwestycje i projekty w ogóle realizować, i ustala priorytety. BAI01 prowadzi projekty, które już zatwierdzono.; Projekt – „Projekt” to pojęcie: przedsięwzięcie z początkiem i końcem. BAI01 to proces, który takimi projektami zarządza.; BAI03 Zarządzanie identyfikacją i budowaniem rozwiązań – BAI03 to sama praca nad rozwiązaniem (projekt techniczny, budowa, testy). BAI01 tę pracę planuje i kontroluje.","src":"COBIT 5: Enabling Processes, sekcja BAI01 — Process Description / Purpose / Practices"},"proc-bai03":{"t":"BAI03 Zarządzanie identyfikacją i budowaniem rozwiązań","eg":"BAI03 Zarządzanie identyfikacją i budowaniem rozwiązań","pd":"BAI03 Zarządzanie identyfikacją i budowaniem rozwiązań","en":"BAI03 Manage Solutions Identification and Build","wyj":"Projektujesz, kupujesz albo budujesz rozwiązanie i sprawdzasz testami, że robi to, co zapisano.\n\nIdentyfikacja, projektowanie, nabywanie lub budowa, konfiguracja i testowanie rozwiązań spełniających wymagania.\n\nŻeby powstało rozwiązanie zgodne z wymaganiami i sprawdzone testami. Obojętne, czy je budujesz, czy kupujesz.","zycie":"Masz projekt kuchni i listę wymagań. Stolarz rysuje szafki, kupuje płyty i okucia, składa i montuje. Na koniec sprawdza, czy szuflady się domykają. To budowa rozwiązania – BAI03.","firma":"Software house buduje dla sieci aptek aplikację do rezerwacji i testuje każdą funkcję.","urzad":"Gmina kupuje gotowy system podatkowy według listy wymagań z przetargu. Dostawca konfiguruje go pod lokalne stawki podatku od nieruchomości i łączy z programem księgowym urzędu. Zanim system trafi do odbioru, informatyk gminy i dostawca testują, czy naliczenia dla 50 przykładowych nieruchomości zgadzają się z wyliczeniami z ubiegłego roku.","it":"Praktyki BAI03 obejmują m.in. projekt ogólny i szczegółowy, pozyskanie komponentów, zapewnienie jakości i testy rozwiązania. Wymagania przychodzą z BAI02.","egz":"Słowa-klucze: projekt rozwiązania, programowanie, zakup komponentów, integracja, testy systemowe → BAI03. Testy akceptacyjne i przejście do eksploatacji → BAI07. Podręcznik: „BAI03 Zarządzanie identyfikacją i budowaniem rozwiązań”. Na egzaminie nazwa procesu może brzmieć inaczej niż w podręczniku. Egzamin PL tłumaczy po swojemu, często trybem rozkazującym (np. domena „Twórz, Nabywaj i Wdrażaj” zamiast „Budowanie, nabywanie i wdrażanie”). Egzaminacyjnej nazwy tego procesu nie potwierdziliśmy, dlatego rozpoznawaj go po kodzie i angielskim słowie kluczowym: Solutions Identification and Build. Nie myl z: BAI02 Zarządzanie definiowaniem wymagań – BAI02 ustala, co rozwiązanie ma robić. BAI03 projektuje i buduje, jak to zrobić.; BAI07 Zarządzanie procesem akceptacji zmian i przejścia – Testy są w obu. BAI03 sprawdza, czy rozwiązanie zbudowano poprawnie. BAI07 sprawdza, czy użytkownicy je przyjmują, i przenosi je do eksploatacji.; APO10 Zarządzanie dostawcami – APO10 wybiera dostawców i pilnuje umów z nimi. BAI03 korzysta z dostawcy, żeby zbudować lub kupić konkretne rozwiązanie.","src":"COBIT 5: Enabling Processes, sekcja BAI03 — Process Description / Purpose / Practices"},"proc-bai09":{"t":"BAI09 Zarządzanie zasobami","eg":"BAI09 Zarządzanie zasobami","pd":"BAI09 Zarządzanie zasobami","en":"BAI09 Manage Assets","wyj":"Prowadzisz spis sprzętu i licencji: co masz, gdzie to jest, ile kosztuje i kiedy wymienić.\n\nZarządzanie aktywami IT przez cały cykl życia, z kontrolą wartości, wykorzystania, kosztów i zobowiązań licencyjnych.\n\nŻeby wiedzieć, jaki sprzęt i licencje masz, ile kosztują i kiedy je wymienić. Policzone aktywa łatwiej chronić.","zycie":"Masz w domu teczkę: kiedy kupiłeś pralkę, do kiedy jest gwarancja, ile lat ma laptop i kiedy odnowić antywirusa. Gdy laptop się zestarzeje, kasujesz dane i oddajesz go do elektrośmieci. To zarządzanie aktywami.","firma":"Biuro rachunkowe pilnuje, żeby licencji nie było mniej niż stanowisk, i planuje wymianę laptopów.","urzad":"W starostwie każdy komputer i każda licencja ma numer inwentarzowy, datę zakupu i osobę odpowiedzialną. Informatyk co roku sprawdza, czy licencji na program biurowy nie jest mniej niż 120 stanowisk, i planuje wymianę najstarszych komputerów. Przy likwidacji sprzętu dysk niszczy się protokolarnie, żeby dane mieszkańców nie wyszły poza urząd.","it":"Praktyki BAI09: identyfikacja i ewidencja aktywów, aktywa krytyczne, cykl życia, optymalizacja kosztów i zarządzanie licencjami.","egz":"Tłumacz z angielskiego: Assets → BAI09, Configuration → BAI10, Human Resources → APO07, Resource Optimisation → EDM04. Słowa-klucze BAI09: ewidencja, licencje, cykl życia sprzętu, wycofanie. Podręcznik: „BAI09 Zarządzanie zasobami”. Na egzaminie nazwa procesu może brzmieć inaczej niż w podręczniku. Egzamin PL tłumaczy po swojemu, często trybem rozkazującym (np. domena „Twórz, Nabywaj i Wdrażaj” zamiast „Budowanie, nabywanie i wdrażanie”). Egzaminacyjnej nazwy tego procesu nie potwierdziliśmy, dlatego rozpoznawaj go po kodzie i angielskim słowie kluczowym: Assets. „Zasoby” to tu assets, czyli aktywa (sprzęt, oprogramowanie, licencje). To NIE są zasoby ludzkie (APO07 Human Resources) ani optymalizacja zasobów (EDM04 Resource Optimisation). Nie myl z: BAI10 Zarządzanie konfiguracją – BAI09 patrzy na rzecz jak na majątek: koszt, właściciel, gwarancja, licencja, wymiana. BAI10 patrzy na nią jak na element systemu: ustawienia, wersja i powiązania z usługą.; APO07 Zarządzanie zasobami ludzkimi – APO07 to zasoby LUDZKIE (Human Resources). BAI09 to aktywa – rzeczy i licencje.; EDM04 Zapewnienie optymalizacji zasobów – EDM04 to decyzja Ładu, czy zasoby (ludzie, pieniądze, sprzęt) są wystarczające i dobrze użyte. BAI09 to codzienne prowadzenie aktywów IT.; Zasób – „Zasób” (resource) w COBIT to wszystko, co pomaga osiągnąć cele. Aktywa z BAI09 to tylko część zasobów.","src":"COBIT 5: Enabling Processes, sekcja BAI09 — Process Description / Purpose / Practices"},"proc-bai07":{"t":"BAI07 Zarządzanie procesem akceptacji zmian i przejścia","eg":"BAI07 Zarządzanie procesem akceptacji zmian i przejścia","pd":"BAI07 Zarządzanie procesem akceptacji zmian i przejścia","en":"BAI07 Manage Change Acceptance and Transitioning","wyj":"Zanim nowe rozwiązanie zacznie działać naprawdę, użytkownicy je sprawdzają i odbierają, a potem bezpiecznie się przełączasz.\n\nFormalna akceptacja i przejście zmian do eksploatacji, z przygotowaniem wydania, wczesnym wsparciem i przeglądem.\n\nŻeby użytkownicy odebrali nowe rozwiązanie, zanim zacznie działać naprawdę. I żeby przejście było bezpieczne.","zycie":"Kupujesz mieszkanie od dewelopera. Na odbiorze chodzisz z listą usterek, odkręcasz krany i sprawdzasz okna. Podpisujesz protokół, przenosisz meble, a przez pierwszy miesiąc deweloper szybciej reaguje na zgłoszenia. To odbiór i przejście.","firma":"Kasjerki z jednego sklepu testują nowe kasy, potem jest nocne przełączenie i technik na miejscu w poniedziałek.","urzad":"Gmina sprawdza nowy system podatkowy na kopii prawdziwych danych. Przez dwa tygodnie trzy pracownice referatu podatków wystawiają w nim próbne decyzje i porównują je ze starym systemem. Dopiero po podpisaniu protokołu odbioru dane zostają przeniesione, a stary system wyłączony. Przez pierwszy miesiąc dostawca szybciej odpowiada na zgłoszenia urzędu.","it":"Praktyki BAI07 obejmują m.in. plan konwersji danych, środowisko testowe, testy akceptacyjne, wydanie do produkcji i przegląd po wdrożeniu.","egz":"Słowa-klucze: testy akceptacyjne, odbiór, migracja danych, wydanie, przejście do eksploatacji, wsparcie po uruchomieniu → BAI07. Podręcznik: „BAI07 Zarządzanie procesem akceptacji zmian i przejścia”. Na egzaminie nazwa procesu może brzmieć inaczej niż w podręczniku. Egzamin PL tłumaczy po swojemu, często trybem rozkazującym (np. domena „Twórz, Nabywaj i Wdrażaj” zamiast „Budowanie, nabywanie i wdrażanie”). Egzaminacyjnej nazwy tego procesu nie potwierdziliśmy, dlatego rozpoznawaj go po kodzie i angielskim słowie kluczowym: Change Acceptance and Transitioning. W nazwie jest słowo „zmian”, więc łatwo pomylić BAI07 z BAI06. Słowem-kluczem BAI07 jest acceptance (odbiór) i transitioning (przejście do eksploatacji). Nie myl z: BAI03 Zarządzanie identyfikacją i budowaniem rozwiązań – BAI03 testuje, czy rozwiązanie zbudowano poprawnie. BAI07 prowadzi testy akceptacyjne z użytkownikami i decyduje o uruchomieniu.; BAI06 Zarządzanie zmianami – BAI06 zatwierdza i kontroluje zmianę. BAI07 ją odbiera i przenosi do eksploatacji.; DSS01 Zarządzanie eksploatacją – BAI07 kończy się, gdy rozwiązanie jest przyjęte i przekazane. Od tej chwili codzienne działanie to DSS01.","src":"COBIT 5: Enabling Processes, sekcja BAI07 — Process Description / Purpose / Practices"}},"S":[{"lekcje":["pr-k65-bai01-bai02","pr-k66-bai03-bai04"],"pt":"Lekcje 1.65–1.66","h":"BAI01–BAI04: projekt, wymagania, budowa i moc","b":"<ul><li><b><w k=\"proc-bai01\">BAI01 Manage Programmes and Projects</w></b>: zarządzanie programami i projektami, w tym interesariuszami, zakresem, kosztami, terminami i monitorowaniem korzyści.</li><li><b><w k=\"proc-bai02\">BAI02 Manage Requirements Definition</w></b>: zdefiniowanie i uzgodnienie wymagań biznesowych oraz technicznych, w tym wykonalności i kryteriów akceptacji.</li><li><b><w k=\"proc-bai03\">BAI03 Manage Solutions Identification and Build</w></b>: identyfikacja, projektowanie, nabywanie lub budowa, konfiguracja i testowanie rozwiązań spełniających wymagania.</li><li><b><w k=\"proc-bai04\">BAI04 Manage Availability and Capacity</w></b>: zapewnienie odpowiedniej dostępności i pojemności przez analizę wymagań, prognozy, planowanie i monitorowanie.</li></ul>","c":"Angielska nazwa i cel procesu rozstrzygają znaczenie. Polskie nazwy są opisowym przekładem kursu.","s":"ISACA, COBIT 5: Enabling Processes (2012), opisy BAI01, BAI02, BAI03, BAI04","ctx":"<p>Procesy dobieramy według celu i mandatu działania. Ich zakresy się stykają i współpracują; nie są rozłącznymi szufladkami.</p><p><b>BAI01:</b> Sponsor i kierownik prowadzą program wdrożenia, kontrolują harmonogram oraz budżet i monitorują korzyści programu.</p><p><b>BAI02:</b> Analitycy uzgadniają potrzeby użytkowników i wsparcia, oceniają wykonalność oraz zatwierdzają wymagania rozwiązania.</p><p><b>BAI03:</b> Zespół projektuje, nabywa lub buduje rozwiązanie, konfiguruje je i testuje zgodność z wymaganiami.</p><p><b>BAI04:</b> Zespół analizuje wymagania dostępności, prognozuje obciążenie i planuje zasoby potrzebne do utrzymania usług.</p>"},{"pt":"Sprawdź się","quiz":{"id":"q-fin-pliki-29","sylabus":["PR-02-06","PR-01-04"],"tresc":"Na posiedzeniu Rady ds. Informatyki dyrektor IT mówi: „Naszym priorytetem jest cel związany z Informatyką 04, czyli zarządzanie ryzykiem biznesowym związanym z IT. Skoro 04, to wdrażamy proces APO04”. Na czym polega błąd?","opcje":[{"t":"Numery celów i procesów to osobne katalogi; APO04 to Zarządzanie innowacjami.","ok":true,"w":"Cel 04 pochodzi z listy 17 celów związanych z Informatyką (Rysunek 6). APO04 pochodzi z listy 37 procesów (Rysunek 16). Procesy dla celu 04 odczytuje się dopiero z Rysunku 23, a i tak trzeba je dostosować do organizacji."},{"t":"Nic – numer celu związanego z Informatyką zawsze wskazuje proces APO o tym samym numerze.","ok":false,"w":"Takiej reguły nie ma. Na przykład APO13 wspiera w przykładzie 8 cele 02, 04, 06, 10, 14, 07 i 08, a nie cel 13."},{"t":"Cel 04 należy do wymiaru Klient karty IT BSC, więc trzeba wybrać proces z domeny DSS.","ok":false,"w":"Cel 04 należy do wymiaru Finanse (Rysunek 6). Wymiar karty wyników nie wskazuje domeny procesów."},{"t":"Wystarczy zamienić APO04 na APO12 Zarządzanie ryzykiem i na tym poprzestać, bo jeden proces wystarczy.","ok":false,"w":"Nazwa APO12 rzeczywiście dotyczy ryzyka. Ale cel związany z Informatyką wspiera wiele procesów i inne aktywatory, nie jeden proces."}],"src":"COBIT 5 Framework (EN), sekcja rozdział 2; załącznik C, rysunek 23","pomoc":{"t":"Pytanie dotyczy lekcji 1.65 „BAI01 i BAI02: prowadzenie projektu i definiowanie wymagań”. Cel lekcji: Potrafię odróżnić prowadzenie wybranego projektu (BAI01) od jego wyboru (APO05) i spisanie wymagań (BAI02) od budowy rozwiązania (BAI03).","k":["proc-bai01","proc-bai02"]},"kurs":"Cel 04 pochodzi z listy 17 celów związanych z Informatyką (Rysunek 6). APO04 pochodzi z listy 37 procesów (Rysunek 16). Procesy dla celu 04 odczytuje się dopiero z Rysunku 23, a i tak trzeba je dostosować do organizacji.","kontekst":""}},{"pt":"Sprawdź się","quiz":{"id":"q-fin-pliki-29","sylabus":["PR-02-06","PR-01-04"],"tresc":"Na posiedzeniu Rady ds. Informatyki dyrektor IT mówi: „Naszym priorytetem jest cel związany z Informatyką 04, czyli zarządzanie ryzykiem biznesowym związanym z IT. Skoro 04, to wdrażamy proces APO04”. Na czym polega błąd?","opcje":[{"t":"Nic – numer celu związanego z Informatyką zawsze wskazuje proces APO o tym samym numerze.","ok":false,"w":"Takiej reguły nie ma. Na przykład APO13 wspiera w przykładzie 8 cele 02, 04, 06, 10, 14, 07 i 08, a nie cel 13."},{"t":"Numery celów i procesów to osobne katalogi; APO04 to Zarządzanie innowacjami.","ok":true,"w":"Cel 04 pochodzi z listy 17 celów związanych z Informatyką (Rysunek 6). APO04 pochodzi z listy 37 procesów (Rysunek 16). Procesy dla celu 04 odczytuje się dopiero z Rysunku 23, a i tak trzeba je dostosować do organizacji."},{"t":"Cel 04 należy do wymiaru Klient karty IT BSC, więc trzeba wybrać proces z domeny DSS.","ok":false,"w":"Cel 04 należy do wymiaru Finanse (Rysunek 6). Wymiar karty wyników nie wskazuje domeny procesów."},{"t":"Wystarczy zamienić APO04 na APO12 Zarządzanie ryzykiem i na tym poprzestać, bo jeden proces wystarczy.","ok":false,"w":"Nazwa APO12 rzeczywiście dotyczy ryzyka. Ale cel związany z Informatyką wspiera wiele procesów i inne aktywatory, nie jeden proces."}],"src":"COBIT 5 Framework (EN), sekcja rozdział 2; załącznik C, rysunek 23","pomoc":{"t":"Pytanie dotyczy lekcji 1.66 „BAI03 i BAI04: budowa rozwiązania oraz dostępność i pojemność”. Cel lekcji: Potrafię odróżnić budowę i testy rozwiązania (BAI03) od planowania mocy na szczyt (BAI04) oraz BAI04 od przetrwania katastrofy (DSS04).","k":["proc-bai03","proc-bai04"]},"kurs":"Cel 04 pochodzi z listy 17 celów związanych z Informatyką (Rysunek 6). APO04 pochodzi z listy 37 procesów (Rysunek 16). Procesy dla celu 04 odczytuje się dopiero z Rysunku 23, a i tak trzeba je dostosować do organizacji.","kontekst":""}},{"lekcje":["pr-k67-bai05-bai07","pr-k68-bai08-bai10"],"pt":"Lekcje 1.67–1.68","h":"BAI05–BAI10: trzy razy „zmiana” i trzy rodzaje informacji o systemach","b":"<ul><li><b><w k=\"proc-bai05\">BAI05 Manage Organisational Change Enablement</w></b>: przygotowanie ludzi i organizacji do zmiany oraz utrwalenie nowych zachowań i sposobów pracy.</li><li><b>BAI06 Manage Changes</b>: kontrolowanie zmian, w tym oceny, priorytetów, autoryzacji, śledzenia, zamknięcia i zmian awaryjnych.</li><li><b><w k=\"proc-bai07\">BAI07 Manage Change Acceptance and Transitioning</w></b>: formalna akceptacja i przejście zmian do eksploatacji, z przygotowaniem wydania, wczesnym wsparciem i przeglądem.</li><li><b><w k=\"proc-bai08\">BAI08 Manage Knowledge</w></b>: identyfikowanie, utrzymywanie i udostępnianie wiedzy potrzebnej ludziom, w tym wiedzy jawnej i ukrytej.</li><li><b>BAI09 Manage Assets</b>: zarządzanie aktywami IT przez cały cykl życia, z kontrolą wartości, wykorzystania, kosztów i zobowiązań licencyjnych.</li><li><b><w k=\"proc-bai10\">BAI10 Manage Configuration</w></b>: utrzymanie informacji o elementach konfiguracji i ich relacjach, stanach bazowych oraz zgodności modelu z rzeczywistością.</li></ul>","c":"Angielska nazwa i cel procesu rozstrzygają znaczenie. Polskie nazwy są opisowym przekładem kursu.","s":"ISACA, COBIT 5: Enabling Processes (2012), opisy BAI05, BAI06, BAI07, BAI08, BAI09, BAI10","ctx":"<p>Procesy dobieramy według celu i mandatu działania. Ich zakresy się stykają i współpracują; nie są rozłącznymi szufladkami.</p><p><b>BAI05:</b> Organizacja buduje poparcie liderów, komunikuje nowe role i szkoli pracowników, by przyjęli nowy sposób pracy.</p><p><b>BAI06:</b> Zespół rejestruje wniosek o zmianę zapory, ocenia wpływ i ryzyko, uzyskuje właściwą zgodę oraz śledzi i zamyka zmianę.</p><p><b>BAI07:</b> Użytkownicy wykonują testy akceptacyjne, zespół przygotowuje wydanie, przejście do eksploatacji i wczesne wsparcie po uruchomieniu.</p><p><b>BAI08:</b> Organizacja identyfikuje wiedzę potrzebną do obsługi systemów, ułatwia jej dzielenie i zapewnia zastępowalność ekspertów.</p><p><b>BAI09:</b> Organizacja śledzi wykorzystanie i koszty licencji oraz urządzeń od pozyskania do wycofania, aby utrzymać ich wartość.</p><p><b>BAI10:</b> Zespół utrzymuje wiarygodny model elementów konfiguracji, ich wersji oraz zależności między usługą, aplikacją i serwerami.</p>"},{"pt":"Sprawdź się","quiz":{"id":"q-fin-pliki-29","sylabus":["PR-02-06","PR-01-04"],"tresc":"Na posiedzeniu Rady ds. Informatyki dyrektor IT mówi: „Naszym priorytetem jest cel związany z Informatyką 04, czyli zarządzanie ryzykiem biznesowym związanym z IT. Skoro 04, to wdrażamy proces APO04”. Na czym polega błąd?","opcje":[{"t":"Nic – numer celu związanego z Informatyką zawsze wskazuje proces APO o tym samym numerze.","ok":false,"w":"Takiej reguły nie ma. Na przykład APO13 wspiera w przykładzie 8 cele 02, 04, 06, 10, 14, 07 i 08, a nie cel 13."},{"t":"Cel 04 należy do wymiaru Klient karty IT BSC, więc trzeba wybrać proces z domeny DSS.","ok":false,"w":"Cel 04 należy do wymiaru Finanse (Rysunek 6). Wymiar karty wyników nie wskazuje domeny procesów."},{"t":"Numery celów i procesów to osobne katalogi; APO04 to Zarządzanie innowacjami.","ok":true,"w":"Cel 04 pochodzi z lis
