<script>window.DECK={"id":"k-pr-atlas-bai","rozdzial":"Rozdział 6 · Zasada 5: Oddzielenie Ładu od Zarządzania · s. 31–33","tytul":"Atlas procesów: BAI","prev":"k-pr-atlas-apo.html","next":"k-pr-atlas-dss-mea.html","T":{"proc-bai04":{"t":"BAI04 Zarządzanie dostępnością i pojemnością","eg":"BAI04 Zarządzanie dostępnością i pojemnością","pd":"BAI04 Zarządzanie dostępnością i pojemnością","en":"BAI04 Manage Availability and Capacity","wyj":"Planujesz z wyprzedzeniem, żeby system wytrzymał tłok i działał wtedy, kiedy jest potrzebny.\n\nOceniasz obecną dostępność, wydajność i pojemność. Szacujesz wpływ na biznes i prognozujesz przyszłe potrzeby. Planujesz zmiany, monitorujesz i usuwasz problemy, zanim zabraknie mocy.\n\nŻeby systemy wytrzymały tłok i działały, kiedy są potrzebne. I żeby nie przepłacać za zbędny zapas mocy.","zycie":"Na komunię przychodzi 30 osób, a masz stół na 8. Tydzień wcześniej pożyczasz stoły i krzesła, a w kuchni sprawdzasz, czy piekarnik pomieści dwie blachy. Planujesz pojemność, zanim goście staną w drzwiach.","firma":"Sklep internetowy już we wrześniu sprawdza, ile zamówień wytrzyma serwer, i dokupuje moc na Black Friday.","urzad":"Urzędy skarbowe wiedzą, że w ostatnim tygodniu kwietnia wpływa kilka razy więcej zeznań podatkowych niż w zwykłym miesiącu. Dlatego już zimą informatycy administracji skarbowej sprawdzają, ile deklaracji na godzinę wytrzyma system e-deklaracji, i zwiększają jego moc. W kwietniu codziennie patrzą na obciążenie, żeby zareagować, zanim system zwolni.","it":"Praktyki BAI04: bazowa ocena dostępności i pojemności, ocena wpływu na biznes, planowanie nowych wymagań, monitorowanie i usuwanie problemów.","egz":"Słowa-klucze: capacity, availability, wydajność, prognoza obciążenia, „wytrzyma szczyt” → BAI04. Katastrofa, plan awaryjny, odtworzenie → DSS04. Podręcznik: „BAI04 Zarządzanie dostępnością i pojemnością”. Na egzaminie nazwa procesu może brzmieć inaczej niż w podręczniku. Egzamin PL tłumaczy po swojemu, często trybem rozkazującym (np. domena „Twórz, Nabywaj i Wdrażaj” zamiast „Budowanie, nabywanie i wdrażanie”). Egzaminacyjnej nazwy tego procesu nie potwierdziliśmy, dlatego rozpoznawaj go po kodzie i angielskim słowie kluczowym: Availability and Capacity. Il. 39 (s. 88) wymienia umiejętność „Zarządzanie pojemnością” przy BAI, a „Zarządzanie dostępnością” przy DSS. To kategorie umiejętności, a nie procesy: proces BAI04 obejmuje oba tematy. Nie myl z: DSS04 Zarządzanie ciągłością – BAI04 planuje moc i niezawodność w zwykłych i szczytowych warunkach. DSS04 przygotowuje przetrwanie poważnego zakłócenia, np. zalania serwerowni.; APO09 Zarządzanie umowami o świadczenie usług – APO09 uzgadnia z odbiorcą, ile dostępności się obiecuje (umowa o poziomie usług). BAI04 planuje, jak tę obietnicę spełnić.; DSS01 Zarządzanie eksploatacją – DSS01 na bieżąco pilnuje infrastruktury i dostarcza dane. BAI04 na ich podstawie prognozuje i planuje.","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; COBIT 5 Framework (PL), s. 88, Ilustracja 39"},"proc-bai06":{"t":"BAI06 Zarządzanie zmianami","eg":"BAI06 Zarządzanie zmianami","pd":"BAI06 Zarządzanie zmianami","en":"BAI06 Manage Changes","wyj":"Każdą poprawkę w systemach najpierw zgłaszasz, oceniasz i zatwierdzasz, a dopiero potem wprowadzasz i zapisujesz.\n\nOceniasz wpływ zmiany, nadajesz jej priorytet i ją autoryzujesz. Zmiany awaryjne mają osobną, szybką ścieżkę. Śledzisz status, a po wdrożeniu zamykasz i dokumentujesz zmianę.\n\nŻeby żadna zmiana w systemach nie zaskoczyła użytkowników i nie zepsuła usługi. Każda zmiana jest oceniona, zatwierdzona i zapisana.","zycie":"Wspólnota mieszkaniowa chce wymienić domofon. Administrator zgłasza pomysł, zarząd sprawdza koszt i wpływ na mieszkańców, wyznacza termin i ogłasza go na klatce. Po wymianie aktualizuje spis kodów. Nikt nie wymienia domofonu „na dziko” w nocy.","firma":"Programista sklepu zgłasza zmianę liczenia rabatów, kierownik ocenia ryzyko i zmiana wchodzi we wtorek o 6:00.","urzad":"Dostawca systemu elektronicznego zarządzania dokumentacją (EZD) w starostwie zgłasza aktualizację. Komitet zmian – kierownik informatyki, sekretarz powiatu i kierowniczka kancelarii – ocenia ryzyko i przesuwa wdrożenie z czwartku na sobotę, gdy urząd nie przyjmuje interesantów. Po aktualizacji informatyk zamyka wniosek o zmianę i opisuje, co zmieniono.","it":"Praktyki BAI06: ocena, priorytet i autoryzacja wniosków o zmianę, zmiany awaryjne, śledzenie statusu oraz zamknięcie i dokumentacja. Opis zmienionych elementów aktualizujesz w BAI10.","egz":"Słowa-klucze: wniosek o zmianę, ocena wpływu, autoryzacja, rada ds. zmian, zmiana awaryjna → BAI06. Nie myl z BAI05 (ludzie) i BAI07 (odbiór i przejście). Podręcznik: „BAI06 Zarządzanie zmianami”. Na egzaminie nazwa procesu może brzmieć inaczej niż w podręczniku. Egzamin PL tłumaczy po swojemu, często trybem rozkazującym (np. domena „Twórz, Nabywaj i Wdrażaj” zamiast „Budowanie, nabywanie i wdrażanie”). Egzaminacyjnej nazwy tego procesu nie potwierdziliśmy, dlatego rozpoznawaj go po kodzie i angielskim słowie kluczowym: Manage Changes. Najgroźniejsza pułapka w BAI: krótka nazwa „Zarządzanie zmianami” kusi przy pytaniach o opór ludzi (to BAI05) albo o odbiór i uruchomienie (to BAI07). Nie myl z: BAI05 Zarządzanie wdrażaniem zmian organizacyjnych – BAI05 to ludzka strona zmiany: opór, komunikacja, nawyki. BAI06 to kontrola zmiany w systemach i procesach.; BAI07 Zarządzanie procesem akceptacji zmian i przejścia – BAI06 decyduje, czy i kiedy zmianę wolno wprowadzić. BAI07 ją odbiera (testy akceptacyjne) i przenosi do eksploatacji.; BAI10 Zarządzanie konfiguracją – BAI06 kontroluje zmianę. BAI10 utrzymuje aktualny opis tego, jak system wygląda po zmianie.; DSS02 Zarządzanie zgłoszeniami serwisowymi i incydentami – DSS02 przywraca usługę po incydencie. Jeśli do tego trzeba coś zmienić w systemie, to zmiana awaryjna podlega BAI06.","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; COBIT 5 Framework (PL), s. 60"},"proc-bai05":{"t":"BAI05 Zarządzanie wdrażaniem zmian organizacyjnych","eg":"BAI05 Zarządzanie wdrażaniem zmian organizacyjnych","pd":"BAI05 Zarządzanie wdrażaniem zmian organizacyjnych","en":"BAI05 Manage Organisational Change Enablement","wyj":"Przygotowujesz ludzi na nowy sposób pracy, żeby go zrozumieli, przyjęli i nie wrócili do starych nawyków.\n\nBudzisz chęć zmiany i tworzysz zespół wdrożeniowy. Komunikujesz wizję, dajesz ludziom uprawnienia i pokazujesz szybkie sukcesy. Wspierasz pracę po nowemu, osadzasz nowe podejścia i utrwalasz zmianę.\n\nŻeby ludzie przyjęli zmianę, a nie tylko dostali nowe narzędzie. Bez tego zmiana zostaje na papierze.","zycie":"Babcia dostaje smartfon zamiast starej komórki. Wnuczka nie tylko daje jej telefon. Tłumaczy, po co jej wideorozmowy, uczy po kawałku, chwali za pierwszy wysłany SMS i przez miesiąc dzwoni z pytaniem, jak idzie. To BAI05 w domowej skali.","firma":"Hurtownia przechodzi na skanery: kierowniczka pyta magazynierów o obawy i robi ze sceptyka ambasadora.","urzad":"Gmina przechodzi z papierowych dzienników korespondencji na elektroniczny obieg dokumentów. Sekretarz gminy najpierw tłumaczy 45 urzędnikom, po co ta zmiana, a w każdym referacie wyznacza osobę, która pomaga innym. Szkoli w małych grupach, chwali referaty, które pierwsze przeszły na nowy obieg, i po pół roku wycofuje papierowe dzienniki, żeby nikt nie wrócił do starych nawyków.","it":"Siedem praktyk BAI05 to m.in. ustanowienie chęci zmiany, komunikowanie wizji, umożliwienie działania i użytkowania oraz utrzymanie zmian.","egz":"Słowa-klucze: opór, kultura, zachowania, komunikacja zmiany, „ludzie nie korzystają”, szybkie sukcesy → BAI05. Ocena i autoryzacja zmiany w systemie → BAI06. Odbiór i uruchomienie → BAI07. Podręcznik: „BAI05 Zarządzanie wdrażaniem zmian organizacyjnych”. Na egzaminie nazwa procesu może brzmieć inaczej niż w podręczniku. Egzamin PL tłumaczy po swojemu, często trybem rozkazującym (np. domena „Twórz, Nabywaj i Wdrażaj” zamiast „Budowanie, nabywanie i wdrażanie”). Egzaminacyjnej nazwy tego procesu nie potwierdziliśmy, dlatego rozpoznawaj go po kodzie i angielskim słowie kluczowym: Organisational Change Enablement. Uwaga na podobne nazwy: BAI06 „Zarządzanie zmianami” to kontrola zmian w systemach, a nie zmiana nawyków ludzi. Słowo enablement egzamin tłumaczy w module wdrożenia jako „Aktywowanie / Aktywacja zmiany” (podręcznik: „Umożliwienie zmian”), więc w nazwie BAI05 na egzaminie może pojawić się podobne słowo. Nie myl z: BAI06 Zarządzanie zmianami – BAI06 ocenia, zatwierdza i kontroluje zmiany w systemach. BAI05 dba, żeby ludzie przyjęli nowy sposób pracy.; BAI07 Zarządzanie procesem akceptacji zmian i przejścia – BAI07 odbiera rozwiązanie i przenosi je do eksploatacji. BAI05 sprawia, że po przeniesieniu ludzie z niego naprawdę korzystają.; Aktywowanie zmiany – Pierścień „Umożliwienie zmian” to element cyklu wdrażania COBIT w organizacji. BAI05 to proces, który robi to samo dla każdej zmiany wspieranej przez IT.","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; COBIT 5 Framework (PL), s. 60; COBIT 5 Framework (PL), s. 37; materiały Altkom"},"proc-bai10":{"t":"BAI10 Zarządzanie konfiguracją","eg":"BAI10 Zarządzanie konfiguracją","pd":"BAI10 Zarządzanie konfiguracją","en":"BAI10 Manage Configuration","wyj":"Prowadzisz aktualną mapę: z jakich części składa się system, jak są ustawione i co od czego zależy.\n\nUstalasz model konfiguracji i repozytorium z wersjami bazowymi. Utrzymujesz elementy konfiguracji i ich powiązania. Raportujesz stan i sprawdzasz, czy repozytorium zgadza się z rzeczywistością.\n\nŻeby wiedzieć, z jakich elementów składa się usługa i co od czego zależy. Wtedy zmiany i naprawy są bezpieczniejsze.","zycie":"Masz w szafce schemat instalacji elektrycznej: który bezpiecznik obsługuje kuchnię, a który łazienkę. Gdy elektryk dołoży gniazdko, dopisujesz je na schemacie. Przy awarii od razu wiesz, co wyłączyć.","firma":"Administrator sklepu ma opis: sklep na serwerze A, baza na B, płatności przez operatora C.","urzad":"Informatyk starostwa powiatowego prowadzi spis konfiguracji (repozytorium): który z 80 komputerów ma jaką wersję systemu i programów i z którym serwerem się łączy. Gdy producent ogłasza lukę w jednej wersji programu, informatyk w pięć minut wie, których stanowisk to dotyczy. Raz na kwartał sprawdza, czy zapisy zgadzają się ze stanem faktycznym.","it":"Praktyki BAI10 obejmują m.in. model konfiguracji, repozytorium z wersją bazową, raporty stanu i weryfikację integralności. Przed każdą zmianą w BAI06 sprawdzasz zależności w repozytorium.","egz":"Słowa-klucze: element konfiguracji, repozytorium konfiguracji (CMDB), wersja bazowa, powiązania między elementami, weryfikacja zapisu → BAI10. Podręcznik: „BAI10 Zarządzanie konfiguracją”. Na egzaminie nazwa procesu może brzmieć inaczej niż w podręczniku. Egzamin PL tłumaczy po swojemu, często trybem rozkazującym (np. domena „Twórz, Nabywaj i Wdrażaj” zamiast „Budowanie, nabywanie i wdrażanie”). Egzaminacyjnej nazwy tego procesu nie potwierdziliśmy, dlatego rozpoznawaj go po kodzie i angielskim słowie kluczowym: Configuration. Nie myl z: BAI09 Zarządzanie zasobami – BAI09 prowadzi aktywa jako majątek (koszt, licencja, cykl życia). BAI10 opisuje elementy konfiguracji (ustawienia, wersje, powiązania).; BAI06 Zarządzanie zmianami – BAI06 decyduje, czy zmianę wolno wprowadzić. BAI10 pamięta, jak system wygląda teraz – także po zmianie.; BAI08 Zarządzanie wiedzą – BAI08 utrzymuje wiedzę: instrukcje, obejścia, wnioski. BAI10 – opis tego, z czego system się składa.","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16"},"proc-bai02":{"t":"BAI02 Zarządzanie definiowaniem wymagań","eg":"BAI02 Zarządzanie definiowaniem wymagań","pd":"BAI02 Zarządzanie definiowaniem wymagań","en":"BAI02 Manage Requirements Definition","wyj":"Zanim coś kupisz albo zbudujesz, spisujesz dokładnie, czego potrzebujesz i po czym poznasz, że działa.\n\nZbierasz i spisujesz wymagania funkcjonalne i techniczne. Badasz wykonalność, warianty rozwiązania i ryzyko wymagań. Na końcu strona biznesowa zatwierdza wymagania i wybrane rozwiązanie.\n\nŻeby kupić albo zbudować to, czego naprawdę potrzebujesz. Wymagania zatwierdza biznes, a nie sprzedawca.","zycie":"Kupujesz samochód dla rodziny. Zanim pójdziesz do salonu, spisujesz: 7 miejsc, duży bagażnik, spalanie poniżej 7 litrów, cena do 90 tysięcy. Ta kartka to wymagania. Sprzedawca pokaże Ci potem auta, które je spełniają albo nie.","firma":"Piekarnia przed otwarciem sklepu internetowego spisuje z załogą: zamówienia do 22:00, BLIK, alergeny.","urzad":"Starostwo przed przetargiem na nowy system dla wydziału geodezji zbiera wymagania od trzech wydziałów, zamiast przepisywać folder jednego dostawcy. Naczelnicy spisują m.in.: praca 40 urzędników naraz, wnioski przez internet, przechowywanie map przez 10 lat. Informatyk ocenia dwa warianty – zakup gotowego programu albo rozbudowę obecnego – a naczelnik geodezji i sekretarz powiatu zatwierdzają listę wymagań przed ogłoszeniem przetargu.","it":"Praktyki BAI02: definiowanie wymagań, studium wykonalności z wariantami, zarządzanie ryzykiem wymagań i zatwierdzenie wymagań. Wynik przechodzi do BAI03.","egz":"Słowa-klucze: wymagania, studium wykonalności, warianty rozwiązania, zatwierdzenie przez sponsora → BAI02. FW-PL (s. 60) wiąże BAI02 z projektowaniem aplikacji pod obsługę przez wsparcie i użytkowników. Podręcznik: „BAI02 Zarządzanie definiowaniem wymagań”. Na egzaminie nazwa procesu może brzmieć inaczej niż w podręczniku. Egzamin PL tłumaczy po swojemu, często trybem rozkazującym (np. domena „Twórz, Nabywaj i Wdrażaj” zamiast „Budowanie, nabywanie i wdrażanie”). Egzaminacyjnej nazwy tego procesu nie potwierdziliśmy, dlatego rozpoznawaj go po kodzie i angielskim słowie kluczowym: Requirements Definition. Nie myl z: BAI03 Zarządzanie identyfikacją i budowaniem rozwiązań – BAI02 mówi CO i PO CO (wymagania, warianty, wykonalność). BAI03 mówi JAK: projektuje, buduje albo kupuje i testuje rozwiązanie.; BAI07 Zarządzanie procesem akceptacji zmian i przejścia – BAI07 sprawdza w testach akceptacyjnych, czy rozwiązanie spełnia wymagania z BAI02. Samo spisanie wymagań to BAI02.","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; COBIT 5 Framework (PL), s. 60; COBIT 5 Framework (PL), s. 88, Ilustracja 39"},"proc-bai09":{"t":"BAI09 Zarządzanie zasobami","eg":"BAI09 Zarządzanie zasobami","pd":"BAI09 Zarządzanie zasobami","en":"BAI09 Manage Assets","wyj":"Prowadzisz spis sprzętu i licencji: co masz, gdzie to jest, ile kosztuje i kiedy wymienić.\n\nRozpoznajesz i ewidencjonujesz aktywa IT. Szczególnie dbasz o aktywa krytyczne. Prowadzisz je przez cykl życia, optymalizujesz koszty i pilnujesz licencji.\n\nŻeby wiedzieć, jaki sprzęt i licencje masz, ile kosztują i kiedy je wymienić. Policzone aktywa łatwiej chronić.","zycie":"Masz w domu teczkę: kiedy kupiłeś pralkę, do kiedy jest gwarancja, ile lat ma laptop i kiedy odnowić antywirusa. Gdy laptop się zestarzeje, kasujesz dane i oddajesz go do elektrośmieci. To zarządzanie aktywami.","firma":"Biuro rachunkowe pilnuje, żeby licencji nie było mniej niż stanowisk, i planuje wymianę laptopów.","urzad":"W starostwie każdy komputer i każda licencja ma numer inwentarzowy, datę zakupu i osobę odpowiedzialną. Informatyk co roku sprawdza, czy licencji na program biurowy nie jest mniej niż 120 stanowisk, i planuje wymianę najstarszych komputerów. Przy likwidacji sprzętu dysk niszczy się protokolarnie, żeby dane mieszkańców nie wyszły poza urząd.","it":"Praktyki BAI09: identyfikacja i ewidencja aktywów, aktywa krytyczne, cykl życia, optymalizacja kosztów i zarządzanie licencjami.","egz":"Tłumacz z angielskiego: Assets → BAI09, Configuration → BAI10, Human Resources → APO07, Resource Optimisation → EDM04. Słowa-klucze BAI09: ewidencja, licencje, cykl życia sprzętu, wycofanie. Podręcznik: „BAI09 Zarządzanie zasobami”. Na egzaminie nazwa procesu może brzmieć inaczej niż w podręczniku. Egzamin PL tłumaczy po swojemu, często trybem rozkazującym (np. domena „Twórz, Nabywaj i Wdrażaj” zamiast „Budowanie, nabywanie i wdrażanie”). Egzaminacyjnej nazwy tego procesu nie potwierdziliśmy, dlatego rozpoznawaj go po kodzie i angielskim słowie kluczowym: Assets. „Zasoby” to tu assets, czyli aktywa (sprzęt, oprogramowanie, licencje). To NIE są zasoby ludzkie (APO07 Human Resources) ani optymalizacja zasobów (EDM04 Resource Optimisation). Nie myl z: BAI10 Zarządzanie konfiguracją – BAI09 patrzy na rzecz jak na majątek: koszt, właściciel, gwarancja, licencja, wymiana. BAI10 patrzy na nią jak na element systemu: ustawienia, wersja i powiązania z usługą.; APO07 Zarządzanie zasobami ludzkimi – APO07 to zasoby LUDZKIE (Human Resources). BAI09 to aktywa – rzeczy i licencje.; EDM04 Zapewnienie optymalizacji zasobów – EDM04 to decyzja Ładu, czy zasoby (ludzie, pieniądze, sprzęt) są wystarczające i dobrze użyte. BAI09 to codzienne prowadzenie aktywów IT.; Zasób – „Zasób” (resource) w COBIT to wszystko, co pomaga osiągnąć cele. Aktywa z BAI09 to tylko część zasobów.","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; COBIT 5 Framework (PL), s. 93"},"it-hardware":{"t":"Sprzęt komputerowy","eg":"Sprzęt komputerowy","pd":"sprzęt","en":"Hardware","wyj":"Wszystkie części komputera, które można dotknąć: obudowa, ekran, klawiatura, myszka.\n\nKlawiatura i myszka przekazują Twoje polecenia. Procesor wykonuje je według programu. Wynik pojawia się na ekranie albo wychodzi z drukarki. Dysk przechowuje to, co zapiszesz.\n\nŻeby było na czym wykonywać pracę: liczyć, zapisywać, wyświetlać i drukować. Bez sprzętu żaden program nie ma gdzie działać.","zycie":"Telefon w Twojej dłoni: ekran, przyciski, bateria i aparat to sprzęt. Gdy upuścisz telefon i pęknie ekran, uszkodziłeś sprzęt – zdjęcia w środku mogą być całe.","firma":"Firma kurierska kupuje kierowcom 200 skanerów do paczek i 20 drukarek etykiet. To wydatek na sprzęt, osobny od opłaty za program do śledzenia przesyłek.","urzad":"Urząd miasta kupuje 50 nowych komputerów i 10 drukarek. W budżecie to pozycja „sprzęt komputerowy”, osobna od opłat za programy.","it":"W COBIT 5 sprzęt należy do infrastruktury technicznej w aktywatorze Usługi, infrastruktura i aplikacje (FW-PL s. 86).","egz":"Słowo „hardware” nie jest terminem egzaminu COBIT 5. Przyda się przy aktywatorze Usługi, infrastruktura i aplikacje: sprzęt jest tam częścią infrastruktury technicznej (FW-PL s. 86). Nie myl z: Oprogramowanie – Sprzęt można dotknąć. Oprogramowanie to polecenia zapisane w sprzęcie – nie da się ich dotknąć.; Infrastruktura IT – Infrastruktura to szersze pojęcie: sprzęt, sieć i oprogramowanie systemowe razem, cała „podstawa” informatyki organizacji.","src":"COBIT 5 Framework (PL), s. 86"},"projekt":{"t":"Projekt","eg":"Projekt","pd":"Projekt","en":"Project","wyj":"Jednorazowe przedsięwzięcie z początkiem i końcem, np. przeprowadzka biura do nowej siedziby.\n\nProjekt (project) ma początek, koniec, cel, budżet i zespół. Tworzy rezultat (output), np. nowy system, który po zakończeniu przechodzi do procesów, czyli do codziennej pracy. Kilka powiązanych projektów tworzy program (programme), a w COBIT 5 programami i projektami zarządza proces BAI01 (Zarządzanie programami i projektami).\n\nŻeby jednorazową zmianę, np. wdrożenie nowego systemu, przeprowadzić w ustalonym czasie, budżecie i zakresie, a jej efekt przekazać do codziennej pracy.","zycie":"Remontujecie łazienkę: budżet 20 tys. zł, ekipa wchodzi w marcu, w kwietniu odbieracie robotę i remont się kończy. Codzienne sprzątanie tej łazienki to już nie projekt, tylko proces. Projekt ma koniec, proces się powtarza.","firma":"Piekarnia otwiera drugi punkt sprzedaży: trzeba wynająć lokal, kupić ladę, zatrudnić dwie osoby i ruszyć przed świętami. W dniu otwarcia projekt się kończy. Codzienna sprzedaż w nowym punkcie to już zwykła praca.","urzad":"Starostwo buduje portal do zapisów na rejestrację pojazdów: jest harmonogram, budżet z dotacji i termin odbioru. Po uruchomieniu portalu projekt zostaje zamknięty. Codzienna obsługa zapisów przechodzi do wydziału komunikacji.","it":"Wdrożenie nowego systemu kadrowego to projekt prowadzony w procesie BAI01 (Zarządzanie programami i projektami). Po odbiorze system przechodzi do codziennej eksploatacji w DSS01 (Zarządzanie eksploatacją), a projekt zostaje zamknięty.","egz":"Na egzaminie częściej spotkasz „program” (Zarządzanie programem) niż „projekt”. Powielające się projekty to przykład punktu zapalnego (s. 37). Nie myl z: Proces – Proces się powtarza i trwa; projekt się kończy.","src":"materiały kursu"},"proc-bai08":{"t":"BAI08 Zarządzanie wiedzą","eg":"BAI08 Zarządzanie wiedzą","pd":"BAI08 Zarządzanie wiedzą","en":"BAI08 Manage Knowledge","wyj":"Dbasz, żeby potrzebna wiedza była spisana, aktualna i łatwa do znalezienia, a nie tylko w czyjejś głowie.\n\nBudujesz kulturę dzielenia się wiedzą. Rozpoznajesz źródła informacji, porządkujesz je w wiedzę i udostępniasz. Okresowo oceniasz wiedzę i wycofujesz nieaktualną.\n\nŻeby wiedza potrzebna do pracy nie siedziała tylko w czyjejś głowie. Ma być aktualna i łatwa do znalezienia.","zycie":"Dziadek jako jedyny wie, jak odpowietrzyć piec w domu. Wnuk nagrywa go telefonem, spisuje kroki na kartce i przykleja ją przy piecu. Gdy piec się zmieni, kartkę wymienia. Wiedza przestaje być w jednej głowie.","firma":"Infolinia firmy kurierskiej ma bazę odpowiedzi, którą konsultantki uzupełniają, a kierownik co miesiąc czyści.","urzad":"Kierowniczka urzędu stanu cywilnego w urzędzie miasta za rok przechodzi na emeryturę. Razem z dwiema młodszymi koleżankami spisuje nietypowe przypadki, np. ślub z cudzoziemcem albo przeniesienie zagranicznego aktu urodzenia do polskiego rejestru, i zapisuje instrukcje we wspólnym folderze. Co pół roku zespół przegląda wpisy i usuwa te, które zdezaktualizowały się po zmianie przepisów.","it":"Praktyki BAI08: kultura dzielenia się wiedzą, źródła informacji, porządkowanie wiedzy, jej użycie oraz ocena i wycofanie. Rejestr znanych błędów z DSS03 to przykład takiej wiedzy.","egz":"Słowa-klucze: baza wiedzy, dzielenie się wiedzą, aktualność instrukcji, wycofanie nieaktualnej wiedzy → BAI08. FW-PL (s. 60) łączy BAI08 z BAI05: razem dają użytkownikom możliwość efektywnego korzystania z systemów. Podręcznik: „BAI08 Zarządzanie wiedzą”. Na egzaminie nazwa procesu może brzmieć inaczej niż w podręczniku. Egzamin PL tłumaczy po swojemu, często trybem rozkazującym (np. domena „Twórz, Nabywaj i Wdrażaj” zamiast „Budowanie, nabywanie i wdrażanie”). Egzaminacyjnej nazwy tego procesu nie potwierdziliśmy, dlatego rozpoznawaj go po kodzie i angielskim słowie kluczowym: Manage Knowledge. Nie myl z: BAI10 Zarządzanie konfiguracją – BAI10 opisuje, z czego składa się system i jak elementy są połączone. BAI08 mówi, jak z nim pracować i czego się nauczyliśmy.; APO07 Zarządzanie zasobami ludzkimi – APO07 dba o ludzi i ich kompetencje (zatrudnienie, szkolenia, zastępstwa). BAI08 dba o to, żeby wiedza była spisana i dostępna niezależnie od jednej osoby.; Informacja – Informacja to aktywator. BAI08 to proces, który zarządza szczególną informacją – wiedzą potrzebną do pracy i decyzji.","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; COBIT 5 Framework (PL), s. 60"},"proc-bai01":{"t":"BAI01 Zarządzanie programami i projektami","eg":"BAI01 Zarządzanie programami i projektami","pd":"BAI01 Zarządzanie programami i projektami","en":"BAI01 Manage Programmes and Projects","wyj":"Prowadzisz przedsięwzięcia z początkiem i końcem tak, żeby skończyły się na czas, w budżecie i dały obiecany efekt.\n\nUruchamiasz program i projekty według jednego podejścia. Planujesz, kontrolujesz postęp, jakość i ryzyko. Na końcu zamykasz projekt i sprawdzasz, czy korzyści się pojawiły.\n\nŻeby programy i projekty kończyły się na czas, w budżecie i dawały obiecane korzyści.","zycie":"Budujesz dom. Kierownik budowy ma harmonogram, kosztorys i listę etapów. Co tydzień sprawdza, czy ekipy nie mają opóźnień, i od razu reaguje. Po odbiorze siadacie i spisujecie, co poszło źle. Tak działa BAI01.","firma":"Hurtownia wdraża system magazynowy z planem, budżetem i komitetem sterującym, a po starcie sprawdza czas wysyłek.","urzad":"Urząd miasta prowadzi program „e-Urząd” z trzech projektów: e-rezerwacja wizyt, e-płatności i nowa strona. Każdy projekt ma plan, budżet i kierownika, a komitet sterujący co miesiąc sprawdza postęp i ryzyko. Po zamknięciu urząd sprawdza, czy kolejki naprawdę się skróciły.","it":"Praktyki BAI01 obejmują m.in. inicjowanie programu, planowanie projektów, zarządzanie ryzykiem projektu i zamknięcie programu. Wspierają pierścień Zarządzanie programem.","egz":"Słowa-klucze: programme, project, harmonogram, budżet projektu, zamknięcie projektu, PMO → BAI01. Wybór i priorytety inwestycji → APO05 (portfel). Podręcznik: „BAI01 Zarządzanie programami i projektami”. Na egzaminie nazwa procesu może brzmieć inaczej niż w podręczniku. Egzamin PL tłumaczy po swojemu, często trybem rozkazującym (np. domena „Twórz, Nabywaj i Wdrażaj” zamiast „Budowanie, nabywanie i wdrażanie”). Egzaminacyjnej nazwy tego procesu nie potwierdziliśmy, dlatego rozpoznawaj go po kodzie i angielskim słowie kluczowym: Programmes and Projects. Nie myl z: APO05 Zarządzanie Portfelem – APO05 (portfel) wybiera, które inwestycje i projekty w ogóle realizować, i ustala priorytety. BAI01 prowadzi projekty, które już zatwierdzono.; Projekt – „Projekt” to pojęcie: przedsięwzięcie z początkiem i końcem. BAI01 to proces, który takimi projektami zarządza.; BAI03 Zarządzanie identyfikacją i budowaniem rozwiązań – BAI03 to sama praca nad rozwiązaniem (projekt techniczny, budowa, testy). BAI01 tę pracę planuje i kontroluje.","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; COBIT 5 Framework (PL), s. 77, Ilustracja 33; COBIT 5 Framework (PL), s. 61"},"proc-bai03":{"t":"BAI03 Zarządzanie identyfikacją i budowaniem rozwiązań","eg":"BAI03 Zarządzanie identyfikacją i budowaniem rozwiązań","pd":"BAI03 Zarządzanie identyfikacją i budowaniem rozwiązań","en":"BAI03 Manage Solutions Identification and Build","wyj":"Projektujesz, kupujesz albo budujesz rozwiązanie i sprawdzasz testami, że robi to, co zapisano.\n\nProjektujesz rozwiązanie najpierw ogólnie, potem szczegółowo. Budujesz albo kupujesz komponenty i łączysz je w całość. Przygotowujesz i prowadzisz testy, a potem utrzymujesz rozwiązanie.\n\nŻeby powstało rozwiązanie zgodne z wymaganiami i sprawdzone testami. Obojętne, czy je budujesz, czy kupujesz.","zycie":"Masz projekt kuchni i listę wymagań. Stolarz rysuje szafki, kupuje płyty i okucia, składa i montuje. Na koniec sprawdza, czy szuflady się domykają. To budowa rozwiązania – BAI03.","firma":"Software house buduje dla sieci aptek aplikację do rezerwacji i testuje każdą funkcję.","urzad":"Gmina kupuje gotowy system podatkowy według listy wymagań z przetargu. Dostawca konfiguruje go pod lokalne stawki podatku od nieruchomości i łączy z programem księgowym urzędu. Zanim system trafi do odbioru, informatyk gminy i dostawca testują, czy naliczenia dla 50 przykładowych nieruchomości zgadzają się z wyliczeniami z ubiegłego roku.","it":"Praktyki BAI03 obejmują m.in. projekt ogólny i szczegółowy, pozyskanie komponentów, zapewnienie jakości i testy rozwiązania. Wymagania przychodzą z BAI02.","egz":"Słowa-klucze: projekt rozwiązania, programowanie, zakup komponentów, integracja, testy systemowe → BAI03. Testy akceptacyjne i przejście do eksploatacji → BAI07. Podręcznik: „BAI03 Zarządzanie identyfikacją i budowaniem rozwiązań”. Na egzaminie nazwa procesu może brzmieć inaczej niż w podręczniku. Egzamin PL tłumaczy po swojemu, często trybem rozkazującym (np. domena „Twórz, Nabywaj i Wdrażaj” zamiast „Budowanie, nabywanie i wdrażanie”). Egzaminacyjnej nazwy tego procesu nie potwierdziliśmy, dlatego rozpoznawaj go po kodzie i angielskim słowie kluczowym: Solutions Identification and Build. Nie myl z: BAI02 Zarządzanie definiowaniem wymagań – BAI02 ustala, co rozwiązanie ma robić. BAI03 projektuje i buduje, jak to zrobić.; BAI07 Zarządzanie procesem akceptacji zmian i przejścia – Testy są w obu. BAI03 sprawdza, czy rozwiązanie zbudowano poprawnie. BAI07 sprawdza, czy użytkownicy je przyjmują, i przenosi je do eksploatacji.; APO10 Zarządzanie dostawcami – APO10 wybiera dostawców i pilnuje umów z nimi. BAI03 korzysta z dostawcy, żeby zbudować lub kupić konkretne rozwiązanie.","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; COBIT 5 Framework (PL), s. 61; COBIT 5 Framework (PL), s. 88, Ilustracja 39"},"it-dostepnosc":{"t":"Dostępność","eg":"Dostępność","pd":"dostępność","en":"Availability","wyj":"Usługa albo informacja działa i można z niej skorzystać wtedy, gdy jest potrzebna.\n\nOrganizacja ustala, kiedy i jak niezawodnie usługa ma działać. Informatycy dobierają infrastrukturę (np. zapasowy serwer), pilnują, by starczyło mocy, i mierzą przerwy. Gdy dostępność spada, szukają przyczyn.\n\nŻeby ludzie mogli pracować wtedy, kiedy muszą, a nie tylko wtedy, gdy system akurat działa.","zycie":"Bankomat pod blokiem działa całą dobę – to dobra dostępność. Gdy co weekend jest „nieczynny”, dostępność jest słaba, choć pieniądze w banku są.","firma":"Sklep internetowy przed świętami dokupuje serwery, żeby strona nie padała przy tłumie klientów.","urzad":"ZUS (Zakład Ubezpieczeń Społecznych) ustala, że portal dla firm ma działać całą dobę, a zwłaszcza w dniach, gdy mija termin wysyłania deklaracji składkowych. Na te dni informatycy dokładają mocy serwerów, a przerwy techniczne planują tylko w nocy z soboty na niedzielę. Co miesiąc mierzą, ile minut portal nie działał.","it":"BAI04 Zarządzanie dostępnością i pojemnością; cel organizacji 7 i kryterium jakości informacji „dostępność/terminowość” (FW-PL s. 19, 33, 82).","egz":"BAI04 Zarządzanie dostępnością i pojemnością (Manage Availability and Capacity); dostępność to też kryterium jakości informacji (FW-PL s. 82). Nie myl z: Ciągłość działania – Dostępność to codzienne „działa, gdy trzeba”. Ciągłość to przygotowanie na poważne zakłócenia.; Dostęp i Bezpieczeństwo – Kategoria jakości informacji „Dostęp i Bezpieczeństwo” obejmuje dostępność, ale też ograniczenie dostępu dla nieuprawnionych.","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; COBIT 5 Framework (PL), s. 82; COBIT 5 Framework (PL), s. 19"},"proc-bai07":{"t":"BAI07 Zarządzanie procesem akceptacji zmian i przejścia","eg":"BAI07 Zarządzanie procesem akceptacji zmian i przejścia","pd":"BAI07 Zarządzanie procesem akceptacji zmian i przejścia","en":"BAI07 Manage Change Acceptance and Transitioning","wyj":"Zanim nowe rozwiązanie zacznie działać naprawdę, użytkownicy je sprawdzają i odbierają, a potem bezpiecznie się przełączasz.\n\nPlanujesz wdrożenie i przeniesienie danych. Użytkownicy robią testy akceptacyjne w środowisku testowym. Potem przenosisz rozwiązanie do eksploatacji, wspierasz start i robisz przegląd po wdrożeniu.\n\nŻeby użytkownicy odebrali nowe rozwiązanie, zanim zacznie działać naprawdę. I żeby przejście było bezpieczne.","zycie":"Kupujesz mieszkanie od dewelopera. Na odbiorze chodzisz z listą usterek, odkręcasz krany i sprawdzasz okna. Podpisujesz protokół, przenosisz meble, a przez pierwszy miesiąc deweloper szybciej reaguje na zgłoszenia. To odbiór i przejście.","firma":"Kasjerki z jednego sklepu testują nowe kasy, potem jest nocne przełączenie i technik na miejscu w poniedziałek.","urzad":"Gmina sprawdza nowy system podatkowy na kopii prawdziwych danych. Przez dwa tygodnie trzy pracownice referatu podatków wystawiają w nim próbne decyzje i porównują je ze starym systemem. Dopiero po podpisaniu protokołu odbioru dane zostają przeniesione, a stary system wyłączony. Przez pierwszy miesiąc dostawca szybciej odpowiada na zgłoszenia urzędu.","it":"Praktyki BAI07 obejmują m.in. plan konwersji danych, środowisko testowe, testy akceptacyjne, wydanie do produkcji i przegląd po wdrożeniu.","egz":"Słowa-klucze: testy akceptacyjne, odbiór, migracja danych, wydanie, przejście do eksploatacji, wsparcie po uruchomieniu → BAI07. Podręcznik: „BAI07 Zarządzanie procesem akceptacji zmian i przejścia”. Na egzaminie nazwa procesu może brzmieć inaczej niż w podręczniku. Egzamin PL tłumaczy po swojemu, często trybem rozkazującym (np. domena „Twórz, Nabywaj i Wdrażaj” zamiast „Budowanie, nabywanie i wdrażanie”). Egzaminacyjnej nazwy tego procesu nie potwierdziliśmy, dlatego rozpoznawaj go po kodzie i angielskim słowie kluczowym: Change Acceptance and Transitioning. W nazwie jest słowo „zmian”, więc łatwo pomylić BAI07 z BAI06. Słowem-kluczem BAI07 jest acceptance (odbiór) i transitioning (przejście do eksploatacji). Nie myl z: BAI03 Zarządzanie identyfikacją i budowaniem rozwiązań – BAI03 testuje, czy rozwiązanie zbudowano poprawnie. BAI07 prowadzi testy akceptacyjne z użytkownikami i decyduje o uruchomieniu.; BAI06 Zarządzanie zmianami – BAI06 zatwierdza i kontroluje zmianę. BAI07 ją odbiera i przenosi do eksploatacji.; DSS01 Zarządzanie eksploatacją – BAI07 kończy się, gdy rozwiązanie jest przyjęte i przekazane. Od tej chwili codzienne działanie to DSS01.","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16"}},"S":[{"lekcje":["pr-k65-bai01-bai02","pr-k66-bai03-bai04"],"pt":"Lekcje 1.65–1.66","h":"BAI01–BAI04: projekt, wymagania, budowa i moc","b":"<ul><li><w k=\"proc-bai01\">BAI01<\/w> – prowadzi wybrany <w k=\"projekt\">projekt<\/w>: termin, budżet, korzyści<\/li><li><w k=\"proc-bai02\">BAI02<\/w> – wymagania: CO ma działać<\/li><li><w k=\"proc-bai03\">BAI03<\/w> – JAK: projekt, budowa lub zakup, testy<\/li><li><w k=\"proc-bai04\">BAI04<\/w> – <w k=\"it-dostepnosc\">dostępność<\/w> i pojemność na szczyt<\/li><\/ul>","c":"Wybór projektu to APO05, jego prowadzenie BAI01; „co” to BAI02, „jak” to BAI03; tłok to BAI04, katastrofa DSS04.","s":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; s. 60–61","ctx":"<p>Nazwy angielskie: <span class=\"en\">Manage Programmes and Projects<\/span>, <span class=\"en\">Requirements Definition<\/span>, <span class=\"en\">Solutions Identification and Build<\/span>, <span class=\"en\">Availability and Capacity<\/span> (egzaminacyjne niepotwierdzone). Podręcznik łączy z BAI01 metodykę PRINCE2, a BAI02 ma uwzględniać także potrzeby użytkowników i pracowników wsparcia.<\/p><p>Pary: testy zespołu budującego to BAI03, odbiór przez użytkowników – BAI07. BAI03 obejmuje też nabywanie gotowego rozwiązania, ale kontrakt i ocena dostawcy to APO10. BAI04 patrzy w przyszłość: prognoza obciążenia i rozbudowa; gdy pada centrum danych i trzeba przenieść system w inne miejsce, to już ciągłość z DSS04. Słowa-klucze BAI01: harmonogram, kierownik projektu; BAI02: kryteria akceptacji.<\/p><p>Przykład: uczelnia buduje i testuje formularz rekrutacji (BAI03), a przed lipcowym szczytem 20 tysięcy kandydatów prognozuje ruch i dokłada serwery (BAI04).<\/p>"},{"pt":"Sprawdź się","quiz":{"id":"q-prc-65-3","sylabus":["PR-01-04"],"tresc":"Który proces COBIT 5 według podręcznika ułatwia projektowanie aplikacji tak, żeby spełniały wymagania obsługi przez pracowników wsparcia i użytkowania?","opcje":[{"t":"BAI02 Zarządzanie definiowaniem wymagań","ok":true,"w":"Dobrze. Podręcznik wprost wskazuje BAI02 w kontekście wymagań wsparcia i użytkowania."},{"t":"BAI03 Zarządzanie identyfikacją i budowaniem rozwiązań","w":"BAI03 projektuje i buduje, ale według wymagań. Spisuje je BAI02."},{"t":"APO03 Zarządzanie architekturą korporacyjną","w":"APO03 opisuje całość i zasady budowy, a nie wymagania jednej aplikacji."},{"t":"BAI08 Zarządzanie wiedzą","w":"BAI08 dba o spisaną wiedzę. Wymagania obsługi i użytkowania to BAI02."}],"src":"COBIT 5 Framework (PL), s. 60","pomoc":{"t":"Pytanie dotyczy lekcji 1.65 „BAI01 i BAI02: prowadzenie projektu i definiowanie wymagań”. Cel lekcji: Potrafię odróżnić prowadzenie wybranego projektu (BAI01) od jego wyboru (APO05) i spisanie wymagań (BAI02) od budowy rozwiązania (BAI03).","k":["proc-bai01","proc-bai02"]}}},{"pt":"Sprawdź się","quiz":{"id":"q-prc-66-2","sylabus":["PR-01-04"],"tresc":"Zespół programistów sklepu internetowego buduje nowy koszyk i testuje, czy działa zgodnie z wymaganiami. Który proces?","opcje":[{"t":"BAI07 Zarządzanie procesem akceptacji zmian i przejścia","w":"BAI07 to odbiór przez użytkowników i przełączenie. Tu testuje zespół, który buduje."},{"t":"BAI03 Zarządzanie identyfikacją i budowaniem rozwiązań","ok":true,"w":"Dobrze. Budowa i testy zespołu budującego to BAI03."},{"t":"BAI02 Zarządzanie definiowaniem wymagań","w":"Wymagania już są. Teraz rozwiązanie powstaje i jest sprawdzane."},{"t":"BAI06 Zarządzanie zmianami","w":"BAI06 zatwierdza zmiany w działających systemach. Budowa i testy to BAI03."}],"src":"COBIT 5 Framework (PL), s. 33","pomoc":{"t":"Pytanie dotyczy lekcji 1.66 „BAI03 i BAI04: budowa rozwiązania oraz dostępność i pojemność”. Cel lekcji: Potrafię odróżnić budowę i testy rozwiązania (BAI03) od planowania mocy na szczyt (BAI04) oraz BAI04 od przetrwania katastrofy (DSS04).","k":["proc-bai03","proc-bai04"]}}},{"lekcje":["pr-k67-bai05-bai07","pr-k68-bai08-bai10"],"pt":"Lekcje 1.67–1.68","h":"BAI05–BAI10: trzy razy „zmiana” i trzy rodzaje informacji o systemach","b":"<ul><li><w k=\"proc-bai05\">BAI05<\/w> – ludzie przyjmują zmianę<\/li><li><w k=\"proc-bai06\">BAI06<\/w> – zgoda na zmianę w systemie<\/li><li><w k=\"proc-bai07\">BAI07<\/w> – odbiór i przejście<\/li><li><w k=\"proc-bai08\">BAI08<\/w> – wiedza: jak to zrobić<\/li><li><w k=\"proc-bai09\">BAI09<\/w> – aktywa: <w k=\"it-hardware\">sprzęt<\/w>, licencje<\/li><li><w k=\"proc-bai10\">BAI10<\/w> – konfiguracja: elementy i powiązania<\/li><\/ul>","c":"Przy „zmianie” pytaj: ludzie, zgoda czy odbiór; przy informacji o systemie: instrukcja, majątek czy budowa.","s":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; s. 58, 60","ctx":"<p>Nazwy z podręcznika: BAI05 Zarządzanie wdrażaniem zmian organizacyjnych <span class=\"en\">Organisational Change Enablement<\/span>; BAI06 Zarządzanie zmianami <span class=\"en\">Changes<\/span> – tylko ta krótka nazwa to BAI06, także dla zmian awaryjnych; BAI07 Zarządzanie procesem akceptacji zmian i przejścia <span class=\"en\">Change Acceptance and Transitioning<\/span>. BAI05 razem z BAI08 pozwala użytkownikom efektywnie korzystać z systemów.<\/p><p>Pułapka: BAI09 w podręczniku to „Zarządzanie zasobami”, ale oryginał <span class=\"en\">Manage Assets<\/span> oznacza aktywa – nie EDM04 i nie APO07. BAI10 <span class=\"en\">Configuration<\/span> opisuje wersje, ustawienia i zależności, aktualizowane po każdej zmianie z BAI06; model całości to APO03.<\/p><p>Przykład: ubezpieczyciel wdraża portal. Komitet zmian zatwierdza termin (BAI06), agenci testują i podpisują odbiór (BAI07), a gdy po miesiącu połowa nadal pisze maile, firma organizuje szkolenia i liderów zmiany (BAI05).<\/p>"},{"pt":"Sprawdź się","quiz":{"id":"q-prc-67-3","sylabus":["PR-01-04"],"tresc":"Który proces COBIT 5 obejmuje ocenę wpływu, zatwierdzenie i zapis każdej zmiany w aplikacjach i infrastrukturze, także zmiany awaryjnej?","opcje":[{"t":"DSS02 Zarządzanie zgłoszeniami serwisowymi i incydentami","w":"DSS02 przywraca usługę. Zmiana w systemie, nawet awaryjna, przechodzi przez BAI06."},{"t":"BAI07 Zarządzanie procesem akceptacji zmian i przejścia","w":"BAI07 odbiera i uruchamia rozwiązanie. Zatwierdzanie zmian to BAI06."},{"t":"BAI06 Zarządzanie zmianami","ok":true,"w":"Dobrze. Kontrolowana zmiana w systemach, także awaryjna, to BAI06 (<em>Manage Changes<\/em>)."},{"t":"BAI05 Zarządzanie wdrażaniem zmian organizacyjnych","w":"Słowo „zmiana” kusi, ale BAI05 dotyczy ludzi i ich nawyków, a nie zmian w systemach."}],"src":"COBIT 5 Framework (PL), s. 33","pomoc":{"t":"Pytanie dotyczy lekcji 1.67 „BAI05–BAI07: trzy procesy o „zmianie” – ludzie, zgoda i odbiór”. Cel lekcji: Potrafię przypisać sytuację ze słowem „zmiana” do właściwego procesu: ludzie (BAI05), zgoda na zmianę w systemie (BAI06) albo odbiór i przejście (BAI07).","k":["proc-bai05","proc-bai06","proc-bai07"]}}},{"pt":"Sprawdź się","quiz":{"id":"q-prc-68-3","sylabus":["PR-01-04"],"tresc":"Pytanie mówi o „zarządzaniu zasobami”: spisie laptopów i licencji z datami zakupu i wymiany. Który proces COBIT 5 opisuje?","opcje":[{"t":"BAI10 Zarządzanie konfiguracją","w":"Konfiguracja opisuje wersje i powiązania. Daty zakupu i wymiany to majątek, czyli BAI09."},{"t":"APO07 Zarządzanie zasobami ludzkimi","w":"„Zasoby” w APO07 to ludzie (<em>Human Resources<\/em>). Laptopy i licencje to aktywa."},{"t":"EDM04 Zapewnienie optymalizacji zasobów","w":"EDM04 to Ład i kierunek dla wszystkich zasobów (<em>Resource<\/em>). Spis aktywów to BAI09."},{"t":"BAI09 Zarządzanie zasobami","ok":true,"w":"Dobrze. W BAI09 „zasoby” to aktywa (<em>Assets<\/em>): sprzęt i licencje."}],"src":"COBIT 5 Framework (PL), s. 33","pomoc":{"t":"Pytanie dotyczy lekcji 1.68 „BAI08–BAI10: wiedza, zasoby (aktywa) i konfiguracja”. Cel lekcji: Potrafię odróżnić wiedzę (BAI08), majątek IT (BAI09) i opis konfiguracji (BAI10) oraz rozpoznać, które „zasoby” to BAI09.","k":["proc-bai08","proc-bai09","proc-bai10"]}}}]};</script>
