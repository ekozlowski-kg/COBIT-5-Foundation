<script>window.DECK={"id":"k-ex-powtorka","rozdzial":"Poza podręcznikiem · Egzamin","tytul":"Powtórka przed egzaminem","prev":"03-czytanie-pytan.html","next":"k-mt-lad-kaskada.html","T":{"dostep-i-bezpieczenstwo":{"t":"Dostęp i Bezpieczeństwo","eg":"Dostęp i Bezpieczeństwo","pd":"Dostęp i bezpieczeństwo / Dostępność i bezpieczeństwo","en":"Accessibility and security","wyj":"Informacja ma być dostępna dla tych, którzy jej potrzebują, i schowana przed tymi, którzy nie powinni jej mieć.\n\nTo trzecia kategoria celów aktywatora (enabler goals), obok jakości wewnętrznej (intrinsic quality) i jakości kontekstowej (contextual quality). Sprawdza dwie rzeczy: czy aktywator jest dostępny w razie potrzeby (accessibility) i czy jego wyniki są zabezpieczone, czyli dostępne tylko dla uprawnionych (security). Dla aktywatora Informacja odpowiadają temu kryteria dostępności i ograniczonego dostępu.\n\nŻeby aktywatory i ich wyniki były dostępne wtedy, gdy są potrzebne, i chronione przed tymi, którzy nie powinni mieć do nich dostępu.","zycie":"Dziecko rozcina kolano, a Ty po 10 sekundach masz apteczkę w ręku, bo zawsze stoi w tej samej szafce. Ta szafka jest wysoko i zamknięta, więc młodsze dziecko nie dobierze się do leków. Pod ręką, kiedy trzeba, i poza zasięgiem niepowołanych – to dostęp i bezpieczeństwo.","firma":"W ostatni dzień miesiąca księgowa warsztatu zamyka rozliczenia, a program księgowy po prostu działa. Jednocześnie listę płac widzi tylko ona i właściciel, mechanicy nie mają do niej wglądu. Dostępne, gdy trzeba, i chronione przed niepowołanymi – to dostęp i bezpieczeństwo.","urzad":"Mieszkaniec przychodzi do urzędu o 15:30, a urzędniczka od ręki sprawdza jego dane w rejestrze. Stażysta widzi w tym samym rejestrze tylko sprawy, które sam prowadzi, a nikt z zewnątrz nie ma do niego dostępu. Tak wygląda cel „dostęp i bezpieczeństwo” dla rejestru.","it":"Dla aktywatora Informacja, czyli bazy danych klientów w systemie CRM, cel dostępu i bezpieczeństwa brzmi: baza działa w każdej chwili, gdy konsultant obsługuje klienta, a dane osobowe widzą tylko uprawnieni. Zabezpieczenia techniczne zapewnia proces DSS05 Zarządzanie usługami bezpieczeństwa.","egz":"„Dostępne kiedy potrzebne” i „wyniki zabezpieczone” → Dostęp i Bezpieczeństwo (s. 29). Nie myl z: Bezpieczeństwo informacji (APO13/DSS05) – To procesy. Tu chodzi o kategorię celu każdego aktywatora.","src":"COBIT 5 Framework (PL), s. 28, 29"},"dobre-praktyki":{"t":"Dobre praktyki","eg":"Dobre praktyki","pd":"Dobre praktyki","en":"Good practices","wyj":"Sprawdzone sposoby robienia czegoś, które zadziałały u innych, więc nie trzeba wymyślać od nowa.\n\nDobre praktyki (good practices) to jeden z czterech wymiarów każdego aktywatora, obok interesariuszy, celów i cyklu życia. Podają przykłady lub sugestie, jak najlepiej wdrożyć aktywator, oraz wymagane produkty działań (work products), czyli dane wejściowe i wyniki (inputs and outputs). Dla procesów COBIT 5 podaje je w publikacji „Procesy umożliwiające” (Enabling Processes), a dla innych aktywatorów odsyła też do innych standardów.\n\nŻeby nie wymyślać wszystkiego od nowa, tylko korzystać ze sposobów, które sprawdziły się w wielu organizacjach. Dobre praktyki wspierają osiąganie celów aktywatora.","zycie":"Babcia lepi pierogi zawsze tak samo: mąka, woda i jajko, ciasto odpoczywa pół godziny, farsz robi się dzień wcześniej. Dostajesz od niej kartkę z listą składników (wejścia) i opisem, jak mają wyglądać gotowe pierogi (wynik). Ten sprawdzony przez lata sposób to dobra praktyka.","firma":"Sieć trzech sklepów rowerowych ma jedną checklistę otwarcia: włączyć kasę, przeliczyć gotówkę, uruchomić terminal, wystawić rowery testowe. Na wejściu jest raport z zamknięcia z poprzedniego dnia, na wyjściu podpisana lista. Sposób sprawdzony we wszystkich punktach to dobra praktyka.","urzad":"Nowy pracownik urzędu dostaje skargę mieszkańca i nie wie, co z nią zrobić. Kierowniczka daje mu wzorcową procedurę: rejestracja w EZD, przekazanie do właściwego wydziału, odpowiedź w ciągu miesiąca zgodnie z KPA. Na wejściu jest skarga, na wyjściu pismo z odpowiedzią – to dobra praktyka z gotowymi produktami działań.","it":"Dla procesu DSS02 Zarządzanie zgłoszeniami serwisowymi i incydentami publikacja „Procesy umożliwiające” podaje praktyki, np. rejestrowanie, klasyfikowanie i nadawanie priorytetu zgłoszeniom, wraz z wejściami i wyjściami, np. raportami o zgłoszeniach. To dobre praktyki aktywatora Procesy.","egz":"„Czy stosowane są dobre praktyki?” → mierzone wskaźnikiem wiodącym (s. 29). Nie myl z: Czynnik wpływający na potrzeby interesariuszy – Dobre praktyki to wymiar aktywatora. Nie wpływają na potrzeby interesariuszy.","src":"COBIT 5 Framework (PL), s. 29, 91"},"wskaznik-wiodacy":{"t":"Wskaźnik wiodący","eg":"Wskaźnik wiodący","pd":"Wskaźnik wyprzedzający","en":"Lead indicator","wyj":"Liczba, która ostrzega wcześniej, czy idziemy w dobrą stronę, np. ile godzin się uczysz.\n\nDwa ostatnie z czterech pytań zarządzania wydajnością aktywatora (enabler performance management) dotyczą jego funkcjonowania: czy cykl życia aktywatora jest zarządzany i czy stosowane są dobre praktyki. Mierniki, które na nie odpowiadają, to wskaźniki wiodące (lead indicators). Przewidują przyszły wynik, który potem pokażą wskaźniki opóźnione (lag indicators).\n\nŻeby wcześnie, zanim pojawi się wynik, zobaczyć, czy aktywator działa jak trzeba, i zdążyć to poprawić.","zycie":"Za trzy miesiące biegniesz półmaraton. Co tydzień sprawdzasz, czy zrobiłeś zaplanowane cztery treningi. Jeśli od miesiąca wychodzą dwa, już wiesz, że wynik będzie słaby, i możesz to jeszcze zmienić – to wskaźnik wiodący.","firma":"Właściciel warsztatu samochodowego sprawdza, czy mechanicy wypełniają listę kontrolną przy każdym aucie. Jeśli połowa ją pomija, spodziewa się reklamacji, zanim te przyjdą, i od razu reaguje – to wskaźnik wiodący.","urzad":"Tydzień przed wejściem nowej procedury w urzędzie gminy sekretarz sprawdza, ilu urzędników przeszło szkolenie. Jest 60%, więc wie, że będą kłopoty, zanim wpłynie pierwsza skarga – to wskaźnik wiodący.","it":"W BAI06 (Zarządzanie zmianami) odsetek zmian wdrażanych po zatwierdzeniu i z planem wycofania to wskaźnik wiodący. Gdy spada, można przewidzieć więcej incydentów w DSS02 (Zarządzanie zgłoszeniami serwisowymi i incydentami), zanim one wystąpią.","egz":"Wskaźnik wiodący mierzy, czy cykl życia jest zarządzany i czy stosowane są dobre praktyki. Osiągnięcie celów i uwzględnienie potrzeb mierzą wskaźniki opóźnione (s. 29). Egzamin: „Wskaźniki wiodące”. Podręcznik: „Wskaźniki wyprzedzające”. Nie myl z: Wskaźnik opóźniony – Opóźniony mierzy wynik, czyli osiągnięcie celów i zaspokojenie potrzeb.","src":"COBIT 5 Framework (PL), s. 29"},"pierscien-program":{"t":"Zarządzanie programem","eg":"Zarządzanie programem","pd":"Zarządzanie programem (krąg zewnętrzny)","en":"Programme management (outer ring)","wyj":"Pilnowanie całego przedsięwzięcia: kto prowadzi, ile kosztuje, jakie terminy i czy przyniosło obiecany zysk.\n\nPierścień zewnętrzny ma swoje działanie w każdej z siedmiu faz. Zaczyna od Inicjowania programu, potem definiuje problemy i okazje, mapę drogową i plan. Na końcu realizuje plan, rozlicza korzyści i robi przegląd skuteczności.\n\nŻeby wdrożenie miało sponsora, budżet i terminy. I żeby ktoś na końcu rozliczył, czy dało obiecane korzyści.","zycie":"Organizujesz wesele siostry. Trzymasz listę zadań, budżet i terminy, a po weselu sprawdzasz, czy zmieściliście się w kosztach. To Ty zarządzasz programem, choć nie pieczesz tortu ani nie grasz w zespole.","firma":"Sieć piekarni wdraża wspólny system zamówień: wspólnik pilnuje harmonogramu, budżetu i mniejszych strat pieczywa.","urzad":"Sekretarz powiatu prowadzi program e-rezerwacji wizyt w starostwie. Pilnuje budżetu, harmonogramu i kilku projektów naraz: nowej strony, szkoleń i biletomatów. Po pół roku rozlicza, czy kolejki się skróciły, czyli czy program dał obiecane korzyści.","it":"Proces BAI01 (Zarządzanie programami i projektami) daje praktyki dla tego pierścienia, od inicjowania do zamknięcia programu. Korzyści monitoruje Ład w EDM02.","egz":"Pierścień zewnętrzny = Zarządzanie programem. Jego działania z arkusza PL: Inicjowanie programu (1), Definiowanie problemów i okazji (2), Definiowanie mapy drogowej (3), Planowanie programu (4). Aspekty behawioralne i kulturowe to nie ten pierścień, tylko Aktywowanie zmiany. Nie myl z: Projekt – Program obejmuje kilka powiązanych projektów i działań, które razem mają dać korzyści. Projekt ma jeden konkretny wynik i koniec.; Główny cykl życia ciągłego doskonalenia – Program pilnuje terminów, budżetu i korzyści. Pierścień wewnętrzny dotyczy samego ulepszania aktywatorów (ocena stanu, usprawnienia, pomiar).","src":"COBIT 5 Framework (PL), s. 36, 37, 38, 39"},"atrybuty-procesu":{"t":"Atrybuty procesu","eg":"Atrybuty procesu","pd":"Atrybuty potencjału procesu","en":"Process attributes (PA)","wyj":"Dziewięć rzeczy, które sprawdza oceniający, żeby powiedzieć, jak dobrze coś robimy, od „robimy” po „ciągle poprawiamy”.\n\nModel zdolności procesu COBIT 5 (oparty na ISO/IEC 15504) ma 9 atrybutów procesu (process attributes, PA): PA 1.1 na poziomie 1 i po dwa na poziomach 2–5. Każdy atrybut ocenia się w skali N/C/W/P: nieosiągnięty, częściowy, większościowy, pełny (N/P/L/F). Poziom jest osiągnięty, gdy jego atrybuty mają co najmniej W, a wszystkie atrybuty niższych poziomów mają P.\n\nŻeby ocena zdolności procesu opierała się na konkretnych, mierzalnych cechach, a nie na wrażeniu oceniającego. Atrybuty mówią, co dokładnie trzeba sprawdzić na każdym poziomie.","zycie":"Pieczesz sernik. Najpierw liczy się, czy w ogóle wyszedł (PA 1.1), potem czy planujesz czas i zakupy (PA 2.1) i czy przepis jest zapisany i poprawiany (PA 2.2). Dalej: czy cała rodzina piecze z tej samej spisanej wersji (PA 3.1, 3.2), czy mierzycie wynik i reagujecie, gdy coś odbiega od normy (PA 4.1, 4.2), i czy szukacie lepszego przepisu i go wprowadzacie (PA 5.1, 5.2). Każde z tych pytań to jeden atrybut procesu.","firma":"Audytor przychodzi do warsztatu samochodowego i ocenia przyjmowanie aut do naprawy. Sprawdza po kolei: czy auta są przyjmowane i naprawiane (PA 1.1), czy ktoś planuje terminy i pilnuje, kto co robi (PA 2.1), czy karta zlecenia ma wzór i jest sprawdzana (PA 2.2). Każde takie pytanie to osobny atrybut, a ich oceny dają poziom zdolności.","urzad":"Szkoła ocenia proces zapisów do pierwszej klasy. Zapisy się odbywają (PA 1.1), dyrektor planuje terminy i wyznacza osoby (PA 2.1), formularze mają jeden wzór i są sprawdzane (PA 2.2), ale każda sekretarka przyjmuje je trochę inaczej, więc PA 3.1 i 3.2 wypadają słabo. Atrybuty pokazują, na którym poziomie proces się zatrzymał.","it":"Audytor ocenia proces DSS02 Zarządzanie zgłoszeniami serwisowymi i incydentami: PA 1.1 = P, PA 2.1 = W, PA 2.2 = W, PA 3.1 = C. Proces osiąga poziom 2, bo PA 1.1 jest pełny, a atrybuty poziomu 2 mają co najmniej W; poziom 3 wymagałby P na PA 2.1 i PA 2.2.","egz":"Do zapamiętania: 9 atrybutów, 1 + 2 + 2 + 2 + 2. Pytanie o atrybut poziomu 4 → pomiar (miara) i kontrola procesu. Poziom 2 → zarządzanie wydajnością i zarządzanie produktami pracy. Nazwy atrybutów różnią się: podręcznik PA 1.1 „Sprawność procesu”, PA 2.1 „Zarządzanie sprawnością”, PA 2.2 „Zarządzanie produktami działań”, PA 4.1 „Pomiar procesu”. Na egzaminie: „Zarządzanie wydajnością” (2.1), „Miara procesu” (4.1).","src":"COBIT 5 Framework (PL), s. 42, 93"},"uzasadnienie-biznesowe":{"t":"Uzasadnienie biznesowe","eg":"Uzasadnienie biznesowe","pd":"Uzasadnienie biznesowe","en":"Business case","wyj":"Kartka „dlaczego warto”: ile kosztuje, co da, co może pójść źle, aktualizowana po drodze.\n\nUzasadnienie biznesowe (business case) zawiera co najmniej: docelowe korzyści i ich beneficjentów, wymagane zmiany biznesowe, inwestycje, bieżące koszty, oczekiwane korzyści, ryzyko, role i odpowiedzialności oraz sposób monitorowania. Nie jest jednorazowym dokumentem, tylko dynamicznym narzędziem operacyjnym, aktualizowanym w pełnym cyklu życia ekonomicznego inwestycji. Inicjatywa ma sponsora, a kierownictwo za pomocą uzasadnienia ukierunkowuje tworzenie wartości (value creation).\n\nŻeby decyzję o inwestycji oprzeć na spisanych korzyściach, kosztach i ryzyku, a potem przez całe życie inwestycji sprawdzać, czy wartość naprawdę powstaje.","zycie":"Zastanawiacie się z partnerem nad fotowoltaiką. Spisujecie, ile zaoszczędzicie na prądzie, ile kosztuje instalacja i serwis, że pranie trzeba przestawić na dzień, co będzie, jeśli zmienią się zasady rozliczeń, i kto pilnuje formalności. Co roku przy rozliczeniu prądu wracacie do tej kartki i ją poprawiacie – to jest uzasadnienie biznesowe.","firma":"Właściciel piekarni chce kupić drugi piec. Liczy, o ile więcej chleba upiecze, ile kosztuje piec i prąd, że trzeba zatrudnić piekarza na noc i co, jeśli zamówień nie przybędzie. Co kwartał sprawdza z księgową, czy liczby się zgadzają, i poprawia wyliczenia – ta żywa kartka to uzasadnienie biznesowe.","urzad":"Sekretarz gminy chce wprowadzić elektroniczny obieg dokumentów. Opisuje wójtowi, co się poprawi, co zmieni się w pracy wydziałów, ile kosztuje system i szkolenia, jakie są ryzyka i kto prowadzi projekt. Po wdrożeniu co pół roku sprawdzają, czy obiecane efekty przyszły, i aktualizują dokument – to jest uzasadnienie biznesowe.","it":"W EDM02 (Zapewnienie realizacji korzyści) Ład ocenia inwestycje IT i ich spodziewaną wartość, a APO05 (Zarządzanie portfelem projektów) prowadzi je w portfelu i aktualizuje ich uzasadnienia biznesowe. Gdy koszt modernizacji systemu rośnie, a korzyść maleje, zaktualizowane uzasadnienie może skłonić do zatrzymania programu.","egz":"Narzędzie biznesowe do uzasadnienia inwestycji → uzasadnienie biznesowe. Jest dynamiczne, a nie jednorazowe. W fazie 4 cyklu wdrożenia projekty są wspierane przez uzasadnienia biznesowe. Nie myl z: Cele biznesowe – Cele biznesowe to cele organizacji. Uzasadnienie biznesowe to narzędzie uzasadnienia inwestycji.","src":"COBIT 5 Framework (PL), s. 39"},"mea":{"t":"Monitoruj, Oszacuj i Oceń (MEA)","eg":"Monitoruj, Oszacuj i Oceń (MEA)","pd":"Monitorowanie, ocena i oszacowanie (MEA)","en":"Monitor, Evaluate and Assess (MEA)","wyj":"Szuflada zadań „kontrola”: sprawdzać wyniki, przestrzeganie przepisów i to, czy kontrole wewnętrzne działają.\n\nMEA (Monitor, Evaluate and Assess) to domena Zarządzania z trzema procesami. MEA01 monitoruje wydajność i zgodność (performance and conformance), MEA02 system kontroli wewnętrznej (system of internal control), a MEA03 zgodność z wymogami zewnętrznymi (external requirements), np. przepisami. Wyniki trafiają do Ładu, który w EDM monitoruje, czy organizacja trzyma się wyznaczonego kierunku.\n\nŻeby Zarządzanie wiedziało, jak naprawdę idzie: czy cele są osiągane, czy mechanizmy kontrolne działają i czy organizacja spełnia wymogi zewnętrzne, i mogło to rzetelnie zaraportować Ładowi.","zycie":"Pod koniec miesiąca siadasz z wyciągiem z konta: czy zmieściliście się w budżecie, czy zlecenie stałe na czynsz naprawdę się wykonało i czy żaden rachunek nie umknął. Raz w roku sprawdzasz jeszcze, czy PIT rozliczyłeś zgodnie z przepisami. Sprawdzanie wyników, własnych zabezpieczeń i zgodności z przepisami to w domowej skali domena MEA.","firma":"Właścicielka sklepu internetowego co kwartał patrzy na liczbę zwrotów i czas wysyłki (MEA01), sprawdza, czy pracownicy naprawdę robią kopie zapasowe tak, jak każe procedura (MEA02), i czy regulamin sklepu jest zgodny z nowymi przepisami konsumenckimi (MEA03). Te trzy rodzaje sprawdzania to trzy procesy domeny MEA.","urzad":"Sekretarz gminy co pół roku zbiera raport, ile spraw załatwiono w terminie (MEA01), zleca audytorowi wewnętrznemu sprawdzenie, czy kontrola zarządcza działa (MEA02), a informatyk przygotowuje urząd do kontroli zgodności z KRI (MEA03). Mierzenie wyników, sprawdzanie własnych mechanizmów kontrolnych i zgodności z przepisami – to domena MEA.","it":"W MEA03 (Monitorowanie, ocena i oszacowanie zgodności z wymogami zewnętrznymi) dział IT co pół roku sprawdza, czy przetwarzanie danych osobowych spełnia wymogi RODO, i raportuje wynik zarządowi. Zarząd w EDM monitoruje na tej podstawie, czy organizacja trzyma się kierunku.","egz":"MEA to Zarządzanie, nie Ład. „Monitoruj, Oszacuj i Oceń” (MEA) ≠ „Oszacuj, Kieruj i Monitoruj” (EDM). W przepływie: Oszacuj → Kieruj → Planuj → … → Monitoruj (MEA) → Monitoruj (EDM). Egzamin: „Monitoruj, Oszacuj i Oceń (MEA)”. Podręcznik: „Monitorowanie, ocena i oszacowanie (MEA)”. Nazwy procesów na egzaminie mogą brzmieć inaczej niż w podręczniku. Rozpoznawaj je po kodzie i angielskim słowie kluczowym.","src":"COBIT 5 Framework (PL), s. 33"},"jakosc-kontekstowa":{"t":"Jakość kontekstowa","eg":"Jakość kontekstowa","pd":"Jakość kontekstowa","en":"Contextual quality","wyj":"Informacja przydaje się temu, kto jej teraz potrzebuje: jest na temat, aktualna, kompletna i w zrozumiałej formie.\n\nPatrzysz na aktywator i jego rezultaty oczami użytkownika w konkretnym kontekście: czy są istotne (relevant), kompletne (complete), aktualne (current), w odpowiedniej ilości, spójnie i zwięźle przedstawione, zrozumiałe i łatwe w użyciu. Ta sama poprawna informacja może mieć wysoką jakość wewnętrzną, a niską kontekstową, gdy jest nie na temat, niekompletna, nieaktualna albo w nieczytelnej formie. Informacja, która przychodzi za późno, to inny problem: dostępność/terminowość, czyli jakość dostępu i bezpieczeństwa (s. 82). Dla procesów oznacza to dopasowanie do sytuacji organizacji.\n\nŻeby oceniać nie tylko, czy wynik jest poprawny, ale czy przydaje się temu, kto go używa, w jego sytuacji.","zycie":"Kupujesz z drugiej ręki szafę, a poprzedni właściciel daje Ci instrukcję montażu – bardzo dokładną, tyle że po szwedzku i z 50 stronami o modelach, których nie masz. Nic w niej nie jest błędne, ale Tobie się nie przyda. Brakuje jej jakości kontekstowej, czyli dopasowania do Twojej sytuacji.","firma":"Właściciel warsztatu samochodowego dostaje od księgowej 40-stronicowy raport z każdą fakturą z kwartału. Liczby są poprawne, ale on chciał tylko wiedzieć, czy stać go na nowy podnośnik, i tego z raportu nie wyczyta. Raport ma dobrą jakość wewnętrzną, ale słabą kontekstową.","urzad":"Wójt prosi o zestawienie, ile dzieci gmina dowozi do szkół, bo jutro sesja rady o budżecie. Urzędnik przysyła na czas bezbłędny raport, ale z danymi z poprzedniego roku szkolnego i bez dwóch nowych tras. Dane są poprawne, tylko nieaktualne i niekompletne dla tego zadania – brakuje im jakości kontekstowej. Gdyby raport przyszedł dopiero po sesji, zawiodłaby dostępność/terminowość, czyli jakość dostępu i bezpieczeństwa (s. 82).","it":"W DSS02 (Zarządzanie zgłoszeniami serwisowymi i incydentami) raport dla zarządu zawiera tylko pięć głównych wskaźników i trend, a pełna lista zgłoszeń trafia do zespołu wsparcia. Te same dane podane w formie dopasowanej do odbiorcy to cel kontekstowy aktywatora Informacja.","egz":"„Rezultaty właściwe, kompletne, aktualne, zrozumiałe” → jakość kontekstowa. „Dostępne kiedy potrzeba” i „zabezpieczone” → dostęp i bezpieczeństwo (s. 29). Nie myl z: Jakość wewnętrzna – Wewnętrzna: czy dokładne. Kontekstowa: czy przydatne tu i teraz.","src":"COBIT 5 Framework (PL), s. 29"},"it-zmiana":{"t":"Zmiana","eg":"Zmiana","pd":"zmiana","en":"Change","wyj":"Zaplanowana przeróbka w sprzęcie, programie albo ustawieniach, zrobiona tak, żeby niczego nie zepsuć.\n\nKtoś składa wniosek o zmianę. Specjaliści oceniają, co może pójść źle. Osoba odpowiedzialna zatwierdza. Zmianę testuje się, wdraża w ustalonym czasie i sprawdza. Gdy coś nie działa, wraca się do poprzedniej wersji.\n\nŻeby ulepszać systemy, nie psując tego, co działa.","zycie":"Telefon pyta: „Zainstalować aktualizację dziś o 2:00 w nocy?”. To zaplanowana zmiana w porze, gdy nie korzystasz z telefonu.","firma":"Bank zmienia system kont. Najpierw testuje go miesiąc na kopii danych, potem wdraża w długi weekend.","urzad":"Urząd marszałkowski chce zainstalować nową wersję systemu do obsługi dotacji unijnych. Kierownik informatyki ocenia ryzyko, a dyrektor wydziału zatwierdza termin. Zmianę testuje się tydzień na kopii danych, wdraża w sobotę, a na wypadek kłopotów jest gotowy plan powrotu do starej wersji.","it":"Zmianami w IT zarządza proces BAI06 Zarządzanie zmianami (FW-PL s. 33).","egz":"BAI06 Zarządzanie zmianami (Manage Changes). Nie myl z pierścieniem „Aktywowanie zmiany” (change enablement) we wdrożeniu (dzień 4). Nie myl z: Aktywowanie zmiany – „Aktywowanie zmiany” we wdrożeniu COBIT 5 dotyczy ludzi i ich zachowań. Zmiana w tym haśle to modyfikacja systemu IT.; Problem – Problem to przyczyna awarii. Zmiana to często sposób, by tę przyczynę usunąć.","src":"COBIT 5 Framework (PL), s. 33, 38"},"jakosc-wewnetrzna":{"t":"Jakość wewnętrzna","eg":"Jakość wewnętrzna","pd":"Jakość rzeczywista","en":"Intrinsic quality","wyj":"Informacja jest sama w sobie dobra: prawdziwa, dokładna, z pewnego źródła.\n\nOceniasz aktywator niezależnie od tego, kto i do czego go używa: czy działa dokładnie (accurately) i obiektywnie (objectively) oraz czy daje dokładne, obiektywne i wiarygodne wyniki (believable results). Dla informacji to dokładność, obiektywność, wiarygodność i reputacja. Dla procesów cele wewnętrzne obejmują też zgodność z dobrą praktyką oraz z regułami wewnętrznymi i zewnętrznymi.\n\nŻeby sprawdzić, czy aktywator sam w sobie działa poprawnie i daje prawdziwe, obiektywne wyniki, zanim zapytamy, czy pasuje do sytuacji.","zycie":"Kupujesz w markecie kilogram jabłek, a w domu kuchenna waga pokazuje 870 gramów. Któraś z wag kłamie – a waga ma pokazywać prawdę bez względu na to, kto i co na niej kładzie. To jest jakość wewnętrzna: wynik dokładny i obiektywny sam w sobie.","firma":"W piekarni kasa fiskalna nalicza VAT według przepisów i drukuje paragon zgodny z tym, co klient kupił. Nieważne, czy przy kasie stoi właściciel, czy uczeń na pierwszej zmianie – suma ma się zgadzać. Dokładność i zgodność z regułami to jakość wewnętrzna.","urzad":"Mieszkanka przychodzi do urzędu gminy po zaświadczenie o zameldowaniu, a w rejestrze wciąż figuruje jej stary adres, bo ktoś nie wprowadził zmiany. Zaświadczenie jest czytelne i wydane od ręki, ale nieprawdziwe. Zawodzi jakość wewnętrzna: dane w rejestrze nie są dokładne.","it":"Audytor w MEA02 (Monitorowanie, ocena i oszacowanie systemu kontroli wewnętrznej) sprawdza, czy raport uprawnień z systemu kadrowego pokazuje rzeczywiste konta, bez pominięć i przekłamań. Badanie dokładności i obiektywności tego raportu to ocena jakości wewnętrznej aktywatora Informacja.","egz":"„Dokładne, obiektywne, wiarygodne wyniki” → jakość wewnętrzna, a nie kontekstowa (s. 29). Egzamin: „Jakość wewnętrzna” / „Cel wewnętrzny”. Podręcznik: „Jakość rzeczywista”. EN: intrinsic quality. Nie myl z: Jakość kontekstowa – Kontekstowa ocenia, czy wynik jest przydatny w danej sytuacji: aktualny, kompletny, zrozumiały.; Jakość wewnętrzna jako „wewnątrz organizacji” – „Wewnętrzna” = intrinsic = sama w sobie. Nie chodzi o „wewnątrz firmy”.","src":"COBIT 5 Framework (PL), s. 29"},"edm":{"t":"Oszacuj, Kieruj i Monitoruj (EDM)","eg":"Oszacuj, Kieruj i Monitoruj (EDM)","pd":"Ocena, kierowanie i monitorowanie (EDM)","en":"Evaluate, Direct and Monitor (EDM)","wyj":"Trzy obowiązki szefostwa: ocenić sytuację, wskazać kierunek i sprawdzać, czy idziemy w dobrą stronę.\n\nEDM to jedyna domena Ładu i ma 5 procesów (EDM01–EDM05). W każdym są praktyki Oszacuj (Evaluate), Kieruj (Direct) i Monitoruj (Monitor): organ Ładu ocenia potrzeby i możliwości, kieruje przez priorytety i decyzje, a potem monitoruje wyniki i zgodność względem wyznaczonego kierunku. EDM02–EDM04 odpowiadają trzem składnikom Celu Ładu: korzyściom, ryzyku i zasobom.\n\nŻeby organ Ładu miał uporządkowane procesy do oceny potrzeb, wyznaczania kierunku i sprawdzania, czy kierunek jest realizowany. Dzięki temu Ład jest oddzielony od codziennego Zarządzania.","zycie":"Raz na kwartał siadacie z partnerem przy kuchennym stole. Patrzycie, jak wygląda sytuacja w domu (Oszacuj), ustalacie, że w tym roku priorytetem jest remont, a nie nowe auto (Kieruj), i po trzech miesiącach sprawdzacie, czy remont idzie zgodnie z planem (Monitoruj). Sami nie kładziecie płytek – od tego jest ekipa. To jest EDM, czyli Ład.","firma":"Wspólnicy sklepu internetowego spotykają się raz na kwartał. Oceniają, czy sklep się opłaca i czy ryzyko wycieku danych jest pod kontrolą, postanawiają, że w tym roku stawiają na aplikację mobilną, a po trzech miesiącach sprawdzają, jak kierownik ją wdraża. Nie konfigurują serwerów – wyznaczają kierunek i go pilnują, czyli działają w domenie EDM.","urzad":"Rada gminy uchwala strategię cyfryzacji, a po roku słucha sprawozdania wójta i ocenia, czy pieniądze na e-usługi dały efekt. Radni nie wdrażają systemów – oceniają, kierują i monitorują. To jest rola EDM.","it":"EDM03 Zapewnienie optymalizacji ryzyka: zarząd banku ocenia ryzyko przestoju bankowości internetowej, ustala, że przestój nie może przekroczyć 4 godzin w roku, i co kwartał sprawdza raport CIO. Codzienne rozpoznawanie i analizę ryzyka prowadzi Zarządzanie w APO12 Zarządzanie ryzykiem.","egz":"„Oszacuj, Kieruj i Monitoruj” to praktyki każdego procesu Ładu, a nie komponent Podejścia do Ładu. EDM05 bywa nazywany „Zapewnienie Transparentności Interesariuszy”. Egzamin: „Oszacuj, Kieruj i Monitoruj”. Podręcznik: „Ocena, kierowanie i monitorowanie”. Nie myl z MEA: „Monitoruj, Oszacuj i Oceń”. Nie myl z: Monitoruj, Oszacuj i Oceń (MEA) – MEA to domena ZARZĄDZANIA (monitorowanie wydajności, kontroli wewnętrznej i zgodności). EDM to domena ŁADU.","src":"COBIT 5 Framework (PL), s. 32, 33"},"pierscien-zmiana":{"t":"Aktywowanie zmiany","eg":"Aktywowanie zmiany","pd":"Umożliwienie zmian (krąg środkowy)","en":"Change enablement (middle ring)","wyj":"Przekonanie ludzi do nowego sposobu pracy: wyjaśnić, wysłuchać obaw, znaleźć liderów i utrwalić nowe nawyki.\n\nPierścień środkowy prowadzi ludzi przez siedem faz. Najpierw budzi chęć zmiany i tworzy zespół wdrożeniowy. Potem komunikuje rezultat, wskazuje odtwórców ról i wspiera użytkowanie. Na końcu osadza nowe podejścia i utrzymuje zmianę.\n\nŻeby ludzie naprawdę przyjęli nowy sposób pracy. Samo nowe narzędzie bez ludzi niczego nie zmienia.","zycie":"Rodzina przechodzi na segregację śmieci. Mama tłumaczy dzieciom, po co to jest, starszy syn pilnuje młodszego, a po miesiącu nikt już nie wrzuca szkła do plastiku. To aktywowanie zmiany: chodzi o ludzi i nawyki, nie o kosze.","firma":"Warsztat przechodzi z zeszytu na tablet: właściciel wysłuchuje obaw starszego mechanika i robi z najmłodszego „lidera tabletu”.","urzad":"Gmina wprowadza e-dziennik w swoich szkołach. W szkole podstawowej wicedyrektorka wysłuchuje obaw starszych nauczycieli i organizuje dla nich cotygodniowe godziny pomocy. Najsprawniejsza nauczycielka zostaje „liderką e-dziennika”, aż papierowy dziennik znika.","it":"Proces BAI05 (Zarządzanie wdrażaniem zmian organizacyjnych) ma praktyki odpowiadające działaniom tego pierścienia: od chęci zmiany po jej utrzymanie.","egz":"Komponent cyklu wdrożenia, który dotyczy aspektów behawioralnych i kulturowych → Aktywowanie zmiany (pierścień środkowy). W arkuszu PL widać jego działania: Komunikowanie rezultatu (faza 3) i Identyfikacja odtwórców ról (faza 4). Egzamin: „Aktywowanie zmiany”. Podręcznik: „Umożliwienie zmian” (il. 17), a na s. 37 także „Wdrożenie zmiany”. To ten sam pierścień środkowy. Nie myl go z „Aktywatorem” (enabler) – to inne pojęcie o podobnym brzmieniu. Nie myl z: Aktywator – Aktywator to jeden z siedmiu czynników, które pomagają w Ładzie i Zarządzaniu. Aktywowanie zmiany to pierścień wdrożenia, który zajmuje się ludźmi i kulturą.; Kultura, Etyka i Zachowanie – „Kultura, etyka i zachowanie” to stały aktywator organizacji. Aktywowanie zmiany to praca z ludźmi podczas konkretnego wdrożenia.","src":"COBIT 5 Framework (PL), s. 37, 38"},"projekt":{"t":"Projekt","eg":"Projekt","pd":"Projekt","en":"Project","wyj":"Jednorazowe przedsięwzięcie z początkiem i końcem, np. przeprowadzka biura do nowej siedziby.\n\nProjekt (project) ma początek, koniec, cel, budżet i zespół. Tworzy rezultat (output), np. nowy system, który po zakończeniu przechodzi do procesów, czyli do codziennej pracy. Kilka powiązanych projektów tworzy program (programme), a w COBIT 5 programami i projektami zarządza proces BAI01 (Zarządzanie programami i projektami).\n\nŻeby jednorazową zmianę, np. wdrożenie nowego systemu, przeprowadzić w ustalonym czasie, budżecie i zakresie, a jej efekt przekazać do codziennej pracy.","zycie":"Remontujecie łazienkę: budżet 20 tys. zł, ekipa wchodzi w marcu, w kwietniu odbieracie robotę i remont się kończy. Codzienne sprzątanie tej łazienki to już nie projekt, tylko proces. Projekt ma koniec, proces się powtarza.","firma":"Piekarnia otwiera drugi punkt sprzedaży: trzeba wynająć lokal, kupić ladę, zatrudnić dwie osoby i ruszyć przed świętami. W dniu otwarcia projekt się kończy. Codzienna sprzedaż w nowym punkcie to już zwykła praca.","urzad":"Starostwo buduje portal do zapisów na rejestrację pojazdów: jest harmonogram, budżet z dotacji i termin odbioru. Po uruchomieniu portalu projekt zostaje zamknięty. Codzienna obsługa zapisów przechodzi do wydziału komunikacji.","it":"Wdrożenie nowego systemu kadrowego to projekt prowadzony w procesie BAI01 (Zarządzanie programami i projektami). Po odbiorze system przechodzi do codziennej eksploatacji w DSS01 (Zarządzanie eksploatacją), a projekt zostaje zamknięty.","egz":"Na egzaminie częściej spotkasz „program” (Zarządzanie programem) niż „projekt”. Powielające się projekty to przykład punktu zapalnego (s. 37). Nie myl z: Proces – Proces się powtarza i trwa; projekt się kończy.","src":"materiały kursu"},"zdarzenia-wyzwalajace":{"t":"Zdarzenia wyzwalające","eg":"Zdarzenia wyzwalające","pd":"Zdarzenia inicjujące","en":"Trigger events","wyj":"Iskra, która sprawia, że zmiana rusza teraz, np. nowy szef, kontrola albo nowy przepis.\n\nZdarzenia wyzwalające (trigger events) zachodzą w środowisku wewnętrznym albo zewnętrznym, np. fuzja lub przejęcie, nowe regulacje, istotna zmiana technologii, nowy CEO, CFO lub CIO, audyt zewnętrzny, nowa strategia. Razem z punktami zapalnymi (pain points) pokazują w fazie 1 wdrożenia („Jakie są wyznaczniki?”), że zmiana jest potrzebna. Mogą też być podstawą uzasadnienia biznesowego inicjatywy.\n\nŻeby rozpoznać moment, w którym organizacja ma okazję i powód, by wreszcie zająć się Ładem i Zarządzaniem IT.","zycie":"Przez lata nikt w rodzinie nie myślał o hasłach i kopiach zdjęć. Potem tata przechodzi na emeryturę i zostaje „domowym informatykiem”, a teściowie wprowadzają się do Was z własnymi laptopami. Te zmiany są impulsem, żeby uporządkować domowe IT – to zdarzenia wyzwalające.","firma":"Piekarnia przejmuje sąsiednią cukiernię razem z jej kasami i programem do zamówień. W tym samym roku wchodzi obowiązek e-faktur. Przejęcie i nowe przepisy to zdarzenia wyzwalające, które skłaniają właściciela, żeby wziąć się za IT na poważnie.","urzad":"Do urzędu gminy przychodzi nowy sekretarz, a jednocześnie wchodzi obowiązek e-Doręczeń. Na dodatek audyt zewnętrzny wytyka braki w zabezpieczeniach. Każde z tych wydarzeń to zdarzenie wyzwalające, po którym urząd bierze się za Ład i Zarządzanie IT.","it":"Nowe wymogi prawne to zdarzenie wyzwalające: organizacja uruchamia inicjatywę wdrożenia COBIT 5 od fazy 1. W kolejnych fazach ocenia i usprawnia m.in. MEA03 (Monitorowanie, ocena i oszacowanie zgodności z wymogami zewnętrznymi) i APO13 (Zarządzanie bezpieczeństwem).","egz":"„Fuzje i przejęcia”, „nowe regulacje”, „nowy CIO”, „audyt zewnętrzny”, „istotna zmiana technologii” → zdarzenia wyzwalające. Egzamin: „Zdarzenia wyzwalające”. Podręcznik: „Zdarzenia inicjujące”. Nie myl z: Punkty zapalne – Punkt zapalny to trwający problem. Zdarzenie wyzwalające to zmiana.","src":"COBIT 5 Framework (PL), s. 36, 37"}},"S":[{"pt":"Lekcje 9.17–9.18","h":"5 · 7 · 4 · 3 · 37 – szkielet zasad i aktywatorów","b":"<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>Liczba<\/th><th>Co<\/th><\/tr><tr><td>5<\/td><td>zasady<\/td><\/tr><tr><td>7<\/td><td>aktywatory<\/td><\/tr><tr><td>4<\/td><td>wymiary: interesariusze, cele, cykl życia, <w k=\"dobre-praktyki\">dobre praktyki<\/w><\/td><\/tr><tr><td>3<\/td><td>kategorie celów: <w k=\"jakosc-wewnetrzna\">jakość wewnętrzna<\/w>, <w k=\"jakosc-kontekstowa\">jakość kontekstowa<\/w>, <w k=\"dostep-i-bezpieczenstwo\">dostęp i bezpieczeństwo<\/w><\/td><\/tr><tr><td>37<\/td><td>procesy: EDM 5, APO 13, BAI 10, DSS 6, MEA 3<\/td><\/tr><\/table><\/div>","c":"Zakryj tabelę i odtwórz ją z pamięci – te dwa obszary to ponad połowa pytań.","s":"COBIT 5 Framework (PL), s. 14, 27–29, 33","ctx":"<p>Zasady (nazwy z egzaminu): Realizacja potrzeb interesariusza; Pokrycie całej organizacji; Zastosowanie Pojedynczej Zintegrowanej Struktury Ramowej; Aktywacja holistycznego podejścia; Oddzielenie Ładu od Zarządzania. Aktywatory: Zasady, Polityki i Struktury ramowe; Procesy; Struktury organizacyjne; Kultura, Etyka i Zachowanie; Informacja; Usługi, Infrastruktura i Aplikacje; Ludzie, Umiejętności i Kompetencje.<\/p><p>Pułapki: kategorie celów leżą wewnątrz wymiaru Cele; „jakość rzeczywista” to forma podręcznikowa <w k=\"jakosc-wewnetrzna\">jakości wewnętrznej<\/w>. Osiągnięcie celów mierzą wskaźniki opóźnione, a cykl życia i dobre praktyki – wiodące (s. 28–29). „Oszacuj” jest w dwóch domenach: <w k=\"edm\">Oszacuj, Kieruj i Monitoruj<\/w> (<span class=\"en\">Evaluate, Direct and Monitor<\/span>, Ład) – na początku; <w k=\"mea\">Monitoruj, Oszacuj i Oceń<\/w> (Zarządzanie) – w środku. 37 = 5 procesów Ładu + 32 Zarządzania.<\/p>"},{"pt":"Sprawdź się","quiz":{"tresc":"Jak brzmi nazwa zasady 2 COBIT 5 na polskim egzaminie?","opcje":[{"t":"Pokrycie całej organizacji","ok":true,"w":"Dobrze. To nazwa egzaminacyjna zasady 2 (<em>Covering the Enterprise End-to-End<\/em>)."},{"t":"Realizacja potrzeb interesariusza","w":"To zasada 1."},{"t":"Uwzględnienie wszystkich aspektów działania przedsiębiorstwa","w":"To nazwa z polskiego podręcznika. Egzamin: Pokrycie całej organizacji."},{"t":"Aktywacja holistycznego podejścia","w":"To zasada 4."}],"src":"COBIT 5 Framework (PL), s. 14; materiały Altkom","pomoc":{"t":"Pytanie dotyczy lekcji 9.17 „Powtórka – 5 zasad i 7 aktywatorów”. Cel lekcji: Potrafię z pamięci podać 5 zasad i 7 aktywatorów COBIT 5 w nazwach z egzaminu.","k":[]}}},{"pt":"Sprawdź się","quiz":{"tresc":"Czym jest „Dostęp i Bezpieczeństwo” w modelu aktywatora COBIT 5?","opcje":[{"t":"Inną nazwą jakości rzeczywistej","w":"„Jakość rzeczywista” to podręcznikowa nazwa jakości wewnętrznej, czyli innej kategorii."},{"t":"Kategorią celów w wymiarze Cele","ok":true,"w":"Dobrze. To trzecia kategoria celów aktywatora, obok jakości wewnętrznej i kontekstowej."},{"t":"Aktywatorem obok Informacji","w":"To nie aktywator. Aktywatorów jest siedem i ten nie jest na liście."},{"t":"Piątym wymiarem aktywatora","w":"Wymiary są tylko cztery. Kategorie celów leżą wewnątrz wymiaru Cele."}],"src":"COBIT 5 Framework (PL), s. 29","pomoc":{"t":"Pytanie dotyczy lekcji 9.18 „Powtórka – 4 wymiary, 3 kategorie celów, 37 procesów”. Cel lekcji: Potrafię z pamięci podać 4 wymiary aktywatora, 3 kategorie celów i podział 37 procesów na domeny.","k":[]}}},{"pt":"Lekcja 9.19","h":"Wdrożenie: pierścienie działają naraz, fazy idą po kolei","b":"<ul><li><b>Zewnętrzny<\/b>: <w k=\"pierscien-program\">zarządzanie programem<\/w>.<\/li><li><b>Środkowy<\/b>: <w k=\"pierscien-zmiana\">Aktywowanie zmiany<\/w> – ludzie i kultura.<\/li><li><b>Wewnętrzny<\/b>: ciągłe doskonalenie – nie <w k=\"projekt\">projekt<\/w> jednorazowy.<\/li><\/ul><p>Warunek → czynnik środowiskowy; ból → punkt zapalny; <w k=\"it-zmiana\">zmiana<\/w> → zdarzenie wyzwalające.<\/p>","c":"Fazy mówią, co robisz po kolei, pierścienie – czego pilnujesz cały czas.","s":"COBIT 5 Framework (PL), s. 37–39","ctx":"<p>Siedem faz: 1 Jakie są wyznaczniki? 2 Gdzie jesteśmy teraz? 3 Dokąd chcemy dojść? 4 Co trzeba zrobić? 5 Jak się tam dostaniemy? 6 Czy dotarliśmy do celu? 7 Jak utrzymać motywację do działania? Najczęstsze fakty: ocena stanu obecnego – faza 2, stan docelowy – 3, projekty wspierane <w k=\"uzasadnienie-biznesowe\">uzasadnieniami biznesowymi<\/w> – 4, wdrażanie usprawnień – 5. Inicjatywa dłuższa niż 6 miesięcy grozi utratą dynamiki (reguła dotyczy całej inicjatywy, nie fazy).<\/p><p>Pytanie o aspekty behawioralne i kulturowe to pierścień środkowy. Uzasadnienie biznesowe jest dokumentem dynamicznym, aktualizowanym przez cały cykl. Przykład czynników: obowiązujące przepisy – warunek; powtarzające się złe wyniki audytu – ból; fuzja albo nowy dyrektor IT – zmiana. Wdrożenie i zdolność to razem ok. 14 z 50 pytań – schematycznych, więc łatwych do zdobycia.<\/p>"},{"pt":"Sprawdź się","quiz":{"tresc":"Zespół szpitala przekształca usprawnienia zbudowane w poprzedniej fazie w praktyczne działania (wdraża je). W której fazie cyklu wdrożenia jest teraz zespół?","opcje":[{"t":"W fazie 6 – Czy dotarliśmy do celu?","w":"W fazie 6 używa się nowych rozwiązań i mierzy korzyści."},{"t":"W fazie 4 – Co trzeba zrobić?","w":"W fazie 4 usprawnienia się buduje, a nie wdraża."},{"t":"W fazie 5 – Jak się tam dostaniemy?","ok":true,"w":"Dobrze. W fazie 5 proponowane rozwiązania przekształca się w praktyczne działania (s. 38)."},{"t":"W fazie 3 – Dokąd chcemy dojść?","w":"W fazie 3 definiuje się stan docelowy."}],"src":"COBIT 5 Framework (PL), s. 38","pomoc":{"t":"Pytanie dotyczy lekcji 9.19 „Powtórka – wdrożenie na jednej stronie”. Cel lekcji: Potrafię z pamięci podać 3 pierścienie, 7 faz i trzy rodzaje czynników, od których zaczyna się wdrożenie.","k":[]}}},{"pt":"Lekcja 9.20","h":"Poziom: jego atrybuty W lub P, wszystkie niższe P","b":"<p>Poziomy: 0 niekompletny, 1 wykonywany, 2 zarządzany, 3 ustanowiony, 4 przewidywalny, 5 zoptymalizowany.<\/p><p>Skala: N 0–15%, C &gt;15–50%, W &gt;50–85%, P &gt;85–100%.<\/p><p>Bez średniej – każdy atrybut osobno.<\/p>","c":"Jedna ocena W na niższym poziomie blokuje wszystkie wyższe.","s":"COBIT 5 Framework (PL), s. 42, 45","ctx":"<p>Poziom 1 ma jeden atrybut (sprawność procesu, PA 1.1), poziomy 2–5 po dwa – razem 9 <w k=\"atrybuty-procesu\">atrybutów<\/w>. Podręcznik pisze „potencjał” zamiast egzaminacyjnej „zdolności” i „optymalizujący” zamiast „zoptymalizowany”:<\/p><blockquote>„Każdy z poziomów potencjału może zostać osiągnięty tylko wtedy, gdy w pełni uzyskano niższy poziom”<\/blockquote><p>Przykład z helpdesku: PA 1.1 = P, 2.1 = P, 2.2 = W, 3.1 = P, 3.2 = P. Poziom 2 jest osiągnięty (jego atrybuty co najmniej W, PA 1.1 = P), poziom 3 nie, bo PA 2.2 ma tylko W. Wynik: 2.<\/p>"},{"pt":"Sprawdź się","quiz":{"tresc":"Co oznacza litera <b>P<\/b> na skali ocen na polskim egzaminie?","opcje":[{"t":"Większościowy (&gt;50–85%)","w":"To litera W (<em>Largely<\/em>)."},{"t":"Przewidywalny","w":"To nazwa poziomu 4, a nie ocena na skali."},{"t":"Częściowy (&gt;15–50%)","w":"Tak P czyta się w angielskiej skali (<em>Partially<\/em>) i w podręczniku. Egzamin PL: C = Częściowy."},{"t":"Pełny (&gt;85–100%)","ok":true,"w":"Dobrze. Egzamin PL: N – C – W – P, gdzie P = Pełny (<em>Fully<\/em>)."}],"src":"COBIT 5 Framework (PL), s. 45; materiały Altkom","pomoc":{"t":"Pytanie dotyczy lekcji 9.20 „Powtórka – poziomy zdolności i skala N/C/W/P”. Cel lekcji: Potrafię z pamięci podać 6 poziomów zdolności, skalę N/C/W/P z progami i regułę osiągnięcia poziomu.","k":[]}}},{"pt":"Lekcje 9.21–9.22","h":"Ostatnie zamiany nazw i spokojny poranek","b":"<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>Podręcznik PL<\/th><th>Egzamin PL<\/th><\/tr><tr><td>ilustracja<\/td><td>Rysunek<\/td><\/tr><tr><td><w k=\"wskaznik-wiodacy\">wskaźnik wyprzedzający<\/w> / następujący<\/td><td>wiodący / opóźniony<\/td><\/tr><tr><td><w k=\"jakosc-wewnetrzna\">jakość rzeczywista<\/w><\/td><td>jakość wewnętrzna<\/td><\/tr><tr><td>zdarzenia inicjujące<\/td><td><w k=\"zdarzenia-wyzwalajace\">zdarzenia wyzwalające<\/w><\/td><\/tr><tr><td>plan działań<\/td><td>mapa drogowa<\/td><\/tr><\/table><\/div><p>Rano: dokument tożsamości i 15 minut zapasu.<\/p>","c":"Gdy obok siebie stoją nazwa z podręcznika i z egzaminu, wybierasz egzaminacyjną.","s":"Zestawienie nazw ALTKOM; sylabus egzaminu","ctx":"<p>Numer rysunku na egzaminie jest taki sam jak numer ilustracji w podręczniku. Do listy dochodzi „ocena, kierowanie i monitorowanie” → Oszacuj, Kieruj i Monitoruj. Pary podstawowe (Ład, Aktywator, Struktura ramowa, Organizacja, P = Pełny) zebrano na początku tego rozdziału.<\/p><p>Egzamin przeprowadza organizacja egzaminacyjna PeopleCert – online z nadzorem przez kamerę albo w centrum egzaminacyjnym; ISACA jest autorem COBIT 5, nie organizatorem egzaminu (wiedza ogólna). Dzień przed: lekka powtórka bez nowego materiału, test komputera, kamery i internetu albo dojazdu, wcześnie spać. Przed startem powtórz w myślach: słowo-klucz, temat, eliminacja.<\/p>"},{"pt":"Sprawdź się","quiz":{"tresc":"Która para nazw (podręcznik PL → egzamin PL) jest poprawna?","opcje":[{"t":"Plan działań → Mapa drogowa","ok":true,"w":"Dobrze. <em>Road map<\/em>: podręcznik „plan działań”, egzamin „mapa drogowa”."},{"t":"Jakość wewnętrzna → Jakość rzeczywista","w":"Odwrotnie. „Jakość rzeczywista” jest w podręczniku, „jakość wewnętrzna” na egzaminie."},{"t":"Ład → Nadzór","w":"Odwrotnie. Podręcznik pisze „nadzór”, a egzamin „Ład”."},{"t":"Zdarzenia wyzwalające → Zdarzenia inicjujące","w":"Odwrotnie. „Zdarzenia inicjujące” to forma podręcznika."}],"src":"materiały Altkom","pomoc":{"t":"Pytanie dotyczy lekcji 9.21 „Dziesięć nazw z podręcznika, które dają złą odpowiedź”. Cel lekcji: Potrafię zamienić najczęstsze nazwy z polskiego podręcznika na nazwy z polskiego egzaminu.","k":[]}}},{"pt":"Sprawdź się","quiz":{"tresc":"Jaki jest próg zaliczenia egzaminu COBIT 5 Foundation?","opcje":[{"t":"65%","w":"Fałsz. Próg to 50%."},{"t":"50%, czyli 25 z 50","ok":true,"w":"Dobrze. Sylabus podaje próg 50%; przy 50 pytaniach to 25 poprawnych."},{"t":"35 z 50, czyli 70% poprawnych","w":"To cel treningowy kursu, a nie próg zaliczenia."},{"t":"40 z 50","w":"Fałsz. Wystarczy połowa."}],"src":"sylabus PeopleCert","pomoc":{"t":"Pytanie dotyczy lekcji 9.22 „Dzień egzaminu – przebieg i lista kontrolna”. Cel lekcji: Potrafię powiedzieć, jak przebiega egzamin COBIT 5 Foundation, i przygotować się do niego dzień wcześniej i rano.","k":[]}}}]};</script>
