<script>window.DECK={"id":"k-ex-powtorka","rozdzial":"Poza podręcznikiem · Egzamin","tytul":"Powtórka przed egzaminem","prev":"03-czytanie-pytan.html","next":"k-mt-lad-kaskada.html","T":{"cobit-5":{"t":"COBIT 5","eg":"COBIT 5","pd":"COBIT 5","en":"COBIT 5","wyj":"Zbiór sprawdzonych reguł z 2012 roku, jak mądrze decydować o informatyce i nią kierować.\n\nCOBIT 5 (ISACA, 2012) opiera się na 5 zasadach (principles), 7 kategoriach aktywatorów (enablers) i modelu referencyjnym 37 procesów: 5 Ładu w domenie EDM i 32 Zarządzania w domenach APO, BAI, DSS i MEA. Kaskada celów przekłada potrzeby interesariuszy na cele organizacji, cele związane z IT i cele aktywatorów. Integruje wcześniejsze wytyczne ISACA (COBIT 4.1, Val IT, Risk IT) i jest spójny z innymi standardami, np. ITIL i ISO/IEC 27001.\n\nŻeby organizacja mogła mądrze kierować informatyką i nią zarządzać: osiągać korzyści przy rozsądnym ryzyku i zużyciu zasobów. Daje jedną, spójną strukturę ramową zamiast wielu luźnych wskazówek.","zycie":"Rodzina ma coraz więcej sprzętu i kont: telefony, laptop, router, bank, zdjęcia w chmurze. Ustalacie, kto decyduje o zakupach, kto pilnuje haseł i kopii, i co miesiąc sprawdzacie, czy wszystko działa i czy nie przepłacacie. COBIT 5 to taki „regulamin domu” dla informatyki, tylko spisany dla firm i urzędów.","firma":"Właściciel warsztatu kupił program do rezerwacji, kasę online i monitoring, ale nie wie, czy to się opłaca i kto za co odpowiada. COBIT 5 podpowiada, jak to poukładać: kto wyznacza kierunek, kto prowadzi codzienne sprawy, jak mierzyć efekty i ryzyko. To gotowa rama, a nie program do zainstalowania.","urzad":"Burmistrz słyszy, że urząd wydaje na informatykę coraz więcej, a mieszkańcy dalej stoją w kolejkach. Sięga po COBIT 5, żeby ustalić, czego chce od systemów, kto w urzędzie za nie odpowiada i jak co roku sprawdzać, czy przynoszą korzyści. COBIT 5 służy tu do uporządkowania Ładu i Zarządzania IT.","it":"Bank po poważnej awarii bankowości internetowej porządkuje IT według COBIT 5: zarząd przejmuje 5 procesów Ładu (EDM01–EDM05), CIO 32 procesy Zarządzania, np. DSS04 Zarządzanie ciągłością, a audyt wewnętrzny ocenia zdolność procesów.","egz":"Liczby do zapamiętania: 5 zasad, 7 aktywatorów, 37 procesów (EDM 5 + APO 13 + BAI 10 + DSS 6 + MEA 3), 6 poziomów zdolności (0–5). Nie myl z: COBIT 2019 – Nowsza wersja (2018/2019) – inne pojęcia (komponenty, 40 celów, czynniki projektowe). Egzamin COBIT 5 Foundation dotyczy COBIT 5.; ITIL – ITIL to dobre praktyki zarządzania usługami IT – jak dostarczać usługi. COBIT patrzy szerzej: Ład i Zarządzanie całością IT w organizacji.; ISO/IEC 27001 – ISO/IEC 27001 to norma bezpieczeństwa informacji z certyfikacją; COBIT 5 to struktura ramowa Ładu i Zarządzania IT.","src":"COBIT 5 Framework (PL), s. 90"},"pierscien-zmiana":{"t":"Aktywowanie zmiany","eg":"Aktywowanie zmiany","pd":"Umożliwienie zmian (krąg środkowy)","en":"Change enablement (middle ring)","wyj":"Przekonanie ludzi do nowego sposobu pracy: wyjaśnić, wysłuchać obaw, znaleźć liderów i utrwalić nowe nawyki.\n\nPierścień środkowy prowadzi ludzi przez siedem faz. Najpierw budzi chęć zmiany i tworzy zespół wdrożeniowy. Potem komunikuje rezultat, wskazuje odtwórców ról i wspiera użytkowanie. Na końcu osadza nowe podejścia i utrzymuje zmianę.\n\nŻeby ludzie naprawdę przyjęli nowy sposób pracy. Samo nowe narzędzie bez ludzi niczego nie zmienia.","zycie":"Rodzina przechodzi na segregację śmieci. Mama tłumaczy dzieciom, po co to jest, starszy syn pilnuje młodszego, a po miesiącu nikt już nie wrzuca szkła do plastiku. To aktywowanie zmiany: chodzi o ludzi i nawyki, nie o kosze.","firma":"Warsztat przechodzi z zeszytu na tablet: właściciel wysłuchuje obaw starszego mechanika i robi z najmłodszego „lidera tabletu”.","urzad":"Gmina wprowadza e-dziennik w swoich szkołach. W szkole podstawowej wicedyrektorka wysłuchuje obaw starszych nauczycieli i organizuje dla nich cotygodniowe godziny pomocy. Najsprawniejsza nauczycielka zostaje „liderką e-dziennika”, aż papierowy dziennik znika.","it":"Proces BAI05 (Zarządzanie wdrażaniem zmian organizacyjnych) ma praktyki odpowiadające działaniom tego pierścienia: od chęci zmiany po jej utrzymanie.","egz":"Komponent cyklu wdrożenia, który dotyczy aspektów behawioralnych i kulturowych → Aktywowanie zmiany (pierścień środkowy). W arkuszu PL widać jego działania: Komunikowanie rezultatu (faza 3) i Identyfikacja odtwórców ról (faza 4). Egzamin: „Aktywowanie zmiany”. Podręcznik: „Umożliwienie zmian” (il. 17), a na s. 37 także „Wdrożenie zmiany”. To ten sam pierścień środkowy. Nie myl go z „Aktywatorem” (enabler) – to inne pojęcie o podobnym brzmieniu. Nie myl z: Aktywator – Aktywator to jeden z siedmiu czynników, które pomagają w Ładzie i Zarządzaniu. Aktywowanie zmiany to pierścień wdrożenia, który zajmuje się ludźmi i kulturą.; Kultura, Etyka i Zachowanie – „Kultura, etyka i zachowanie” to stały aktywator organizacji. Aktywowanie zmiany to praca z ludźmi podczas konkretnego wdrożenia.","src":"COBIT 5 Framework (PL), s. 37; COBIT 5 Framework (PL), s. 38, Ilustracja 17; materiały Altkom"},"pierscien-program":{"t":"Zarządzanie programem","eg":"Zarządzanie programem","pd":"Zarządzanie programem (krąg zewnętrzny)","en":"Programme management (outer ring)","wyj":"Pilnowanie całego przedsięwzięcia: kto prowadzi, ile kosztuje, jakie terminy i czy przyniosło obiecany zysk.\n\nPierścień zewnętrzny ma swoje działanie w każdej z siedmiu faz. Zaczyna od Inicjowania programu, potem definiuje problemy i okazje, mapę drogową i plan. Na końcu realizuje plan, rozlicza korzyści i robi przegląd skuteczności.\n\nŻeby wdrożenie miało sponsora, budżet i terminy. I żeby ktoś na końcu rozliczył, czy dało obiecane korzyści.","zycie":"Organizujesz wesele siostry. Trzymasz listę zadań, budżet i terminy, a po weselu sprawdzasz, czy zmieściliście się w kosztach. To Ty zarządzasz programem, choć nie pieczesz tortu ani nie grasz w zespole.","firma":"Sieć piekarni wdraża wspólny system zamówień: wspólnik pilnuje harmonogramu, budżetu i mniejszych strat pieczywa.","urzad":"Sekretarz powiatu prowadzi program e-rezerwacji wizyt w starostwie. Pilnuje budżetu, harmonogramu i kilku projektów naraz: nowej strony, szkoleń i biletomatów. Po pół roku rozlicza, czy kolejki się skróciły, czyli czy program dał obiecane korzyści.","it":"Proces BAI01 (Zarządzanie programami i projektami) daje praktyki dla tego pierścienia, od inicjowania do zamknięcia programu. Korzyści monitoruje Ład w EDM02.","egz":"Pierścień zewnętrzny = Zarządzanie programem. Jego działania z arkusza PL: Inicjowanie programu (1), Definiowanie problemów i okazji (2), Definiowanie mapy drogowej (3), Planowanie programu (4). Aspekty behawioralne i kulturowe to nie ten pierścień, tylko Aktywowanie zmiany. Nie myl z: Projekt – Program obejmuje kilka powiązanych projektów i działań, które razem mają dać korzyści. Projekt ma jeden konkretny wynik i koniec.; Główny cykl życia ciągłego doskonalenia – Program pilnuje terminów, budżetu i korzyści. Pierścień wewnętrzny dotyczy samego ulepszania aktywatorów (ocena stanu, usprawnienia, pomiar).","src":"COBIT 5 Framework (PL), s. 37; COBIT 5 Framework (PL), s. 38, Ilustracja 17; COBIT 5 Framework (PL), s. 36; COBIT 5 Framework (PL), s. 39"},"atrybuty-procesu":{"t":"Atrybuty procesu","eg":"Atrybuty procesu","pd":"Atrybuty potencjału procesu","en":"Process attributes (PA)","wyj":"Dziewięć rzeczy, które sprawdza oceniający, żeby powiedzieć, jak dobrze coś robimy, od „robimy” po „ciągle poprawiamy”.\n\nModel zdolności procesu COBIT 5 (oparty na ISO/IEC 15504) ma 9 atrybutów procesu (process attributes, PA): PA 1.1 na poziomie 1 i po dwa na poziomach 2–5. Każdy atrybut ocenia się w skali N/C/W/P: nieosiągnięty, częściowy, większościowy, pełny (N/P/L/F). Poziom jest osiągnięty, gdy jego atrybuty mają co najmniej W, a wszystkie atrybuty niższych poziomów mają P.\n\nŻeby ocena zdolności procesu opierała się na konkretnych, mierzalnych cechach, a nie na wrażeniu oceniającego. Atrybuty mówią, co dokładnie trzeba sprawdzić na każdym poziomie.","zycie":"Pieczesz sernik. Najpierw liczy się, czy w ogóle wyszedł (PA 1.1), potem czy planujesz czas i zakupy (PA 2.1) i czy przepis jest zapisany i poprawiany (PA 2.2). Dalej: czy cała rodzina piecze z tej samej spisanej wersji (PA 3.1, 3.2), czy mierzycie wynik i reagujecie, gdy coś odbiega od normy (PA 4.1, 4.2), i czy szukacie lepszego przepisu i go wprowadzacie (PA 5.1, 5.2). Każde z tych pytań to jeden atrybut procesu.","firma":"Audytor przychodzi do warsztatu samochodowego i ocenia przyjmowanie aut do naprawy. Sprawdza po kolei: czy auta są przyjmowane i naprawiane (PA 1.1), czy ktoś planuje terminy i pilnuje, kto co robi (PA 2.1), czy karta zlecenia ma wzór i jest sprawdzana (PA 2.2). Każde takie pytanie to osobny atrybut, a ich oceny dają poziom zdolności.","urzad":"Szkoła ocenia proces zapisów do pierwszej klasy. Zapisy się odbywają (PA 1.1), dyrektor planuje terminy i wyznacza osoby (PA 2.1), formularze mają jeden wzór i są sprawdzane (PA 2.2), ale każda sekretarka przyjmuje je trochę inaczej, więc PA 3.1 i 3.2 wypadają słabo. Atrybuty pokazują, na którym poziomie proces się zatrzymał.","it":"Audytor ocenia proces DSS02 Zarządzanie zgłoszeniami serwisowymi i incydentami: PA 1.1 = P, PA 2.1 = W, PA 2.2 = W, PA 3.1 = C. Proces osiąga poziom 2, bo PA 1.1 jest pełny, a atrybuty poziomu 2 mają co najmniej W; poziom 3 wymagałby P na PA 2.1 i PA 2.2.","egz":"Do zapamiętania: 9 atrybutów, 1 + 2 + 2 + 2 + 2. Pytanie o atrybut poziomu 4 → pomiar (miara) i kontrola procesu. Poziom 2 → zarządzanie wydajnością i zarządzanie produktami pracy. Nazwy atrybutów różnią się: podręcznik PA 1.1 „Sprawność procesu”, PA 2.1 „Zarządzanie sprawnością”, PA 2.2 „Zarządzanie produktami działań”, PA 4.1 „Pomiar procesu”. Na egzaminie: „Zarządzanie wydajnością” (2.1), „Miara procesu” (4.1).","src":"COBIT 5 Framework (PL), s. 93; COBIT 5 Framework (PL), s. 42, Ilustracja 19"},"uzasadnienie-biznesowe":{"t":"Uzasadnienie biznesowe","eg":"Uzasadnienie biznesowe","pd":"Uzasadnienie biznesowe","en":"Business case","wyj":"Kartka „dlaczego warto”: ile kosztuje, co da, co może pójść źle, aktualizowana po drodze.\n\nUzasadnienie biznesowe (business case) zawiera co najmniej: docelowe korzyści i ich beneficjentów, wymagane zmiany biznesowe, inwestycje, bieżące koszty, oczekiwane korzyści, ryzyko, role i odpowiedzialności oraz sposób monitorowania. Nie jest jednorazowym dokumentem, tylko dynamicznym narzędziem operacyjnym, aktualizowanym w pełnym cyklu życia ekonomicznego inwestycji. Inicjatywa ma sponsora, a kierownictwo za pomocą uzasadnienia ukierunkowuje tworzenie wartości (value creation).\n\nŻeby decyzję o inwestycji oprzeć na spisanych korzyściach, kosztach i ryzyku, a potem przez całe życie inwestycji sprawdzać, czy wartość naprawdę powstaje.","zycie":"Zastanawiacie się z partnerem nad fotowoltaiką. Spisujecie, ile zaoszczędzicie na prądzie, ile kosztuje instalacja i serwis, że pranie trzeba przestawić na dzień, co będzie, jeśli zmienią się zasady rozliczeń, i kto pilnuje formalności. Co roku przy rozliczeniu prądu wracacie do tej kartki i ją poprawiacie – to jest uzasadnienie biznesowe.","firma":"Właściciel piekarni chce kupić drugi piec. Liczy, o ile więcej chleba upiecze, ile kosztuje piec i prąd, że trzeba zatrudnić piekarza na noc i co, jeśli zamówień nie przybędzie. Co kwartał sprawdza z księgową, czy liczby się zgadzają, i poprawia wyliczenia – ta żywa kartka to uzasadnienie biznesowe.","urzad":"Sekretarz gminy chce wprowadzić elektroniczny obieg dokumentów. Opisuje wójtowi, co się poprawi, co zmieni się w pracy wydziałów, ile kosztuje system i szkolenia, jakie są ryzyka i kto prowadzi projekt. Po wdrożeniu co pół roku sprawdzają, czy obiecane efekty przyszły, i aktualizują dokument – to jest uzasadnienie biznesowe.","it":"W EDM02 (Zapewnienie realizacji korzyści) Ład ocenia inwestycje IT i ich spodziewaną wartość, a APO05 (Zarządzanie portfelem projektów) prowadzi je w portfelu i aktualizuje ich uzasadnienia biznesowe. Gdy koszt modernizacji systemu rośnie, a korzyść maleje, zaktualizowane uzasadnienie może skłonić do zatrzymania programu.","egz":"Narzędzie biznesowe do uzasadnienia inwestycji → uzasadnienie biznesowe. Jest dynamiczne, a nie jednorazowe. W fazie 4 cyklu wdrożenia projekty są wspierane przez uzasadnienia biznesowe. Nie myl z: Cele biznesowe – Cele biznesowe to cele organizacji. Uzasadnienie biznesowe to narzędzie uzasadnienia inwestycji.","src":"COBIT 5 Framework (PL), s. 39"},"projekt":{"t":"Projekt","eg":"Projekt","pd":"Projekt","en":"Project","wyj":"Jednorazowe przedsięwzięcie z początkiem i końcem, np. przeprowadzka biura do nowej siedziby.\n\nProjekt (project) ma początek, koniec, cel, budżet i zespół. Tworzy rezultat (output), np. nowy system, który po zakończeniu przechodzi do procesów, czyli do codziennej pracy. Kilka powiązanych projektów tworzy program (programme), a w COBIT 5 programami i projektami zarządza proces BAI01 (Zarządzanie programami i projektami).\n\nŻeby jednorazową zmianę, np. wdrożenie nowego systemu, przeprowadzić w ustalonym czasie, budżecie i zakresie, a jej efekt przekazać do codziennej pracy.","zycie":"Remontujecie łazienkę: budżet 20 tys. zł, ekipa wchodzi w marcu, w kwietniu odbieracie robotę i remont się kończy. Codzienne sprzątanie tej łazienki to już nie projekt, tylko proces. Projekt ma koniec, proces się powtarza.","firma":"Piekarnia otwiera drugi punkt sprzedaży: trzeba wynająć lokal, kupić ladę, zatrudnić dwie osoby i ruszyć przed świętami. W dniu otwarcia projekt się kończy. Codzienna sprzedaż w nowym punkcie to już zwykła praca.","urzad":"Starostwo buduje portal do zapisów na rejestrację pojazdów: jest harmonogram, budżet z dotacji i termin odbioru. Po uruchomieniu portalu projekt zostaje zamknięty. Codzienna obsługa zapisów przechodzi do wydziału komunikacji.","it":"Wdrożenie nowego systemu kadrowego to projekt prowadzony w procesie BAI01 (Zarządzanie programami i projektami). Po odbiorze system przechodzi do codziennej eksploatacji w DSS01 (Zarządzanie eksploatacją), a projekt zostaje zamknięty.","egz":"Na egzaminie częściej spotkasz „program” (Zarządzanie programem) niż „projekt”. Powielające się projekty to przykład punktu zapalnego (s. 37). Nie myl z: Proces – Proces się powtarza i trwa; projekt się kończy.","src":"materiały kursu"},"it-zmiana":{"t":"Zmiana","eg":"Zmiana","pd":"zmiana","en":"Change","wyj":"Zaplanowana przeróbka w sprzęcie, programie albo ustawieniach, zrobiona tak, żeby niczego nie zepsuć.\n\nKtoś składa wniosek o zmianę. Specjaliści oceniają, co może pójść źle. Osoba odpowiedzialna zatwierdza. Zmianę testuje się, wdraża w ustalonym czasie i sprawdza. Gdy coś nie działa, wraca się do poprzedniej wersji.\n\nŻeby ulepszać systemy, nie psując tego, co działa.","zycie":"Telefon pyta: „Zainstalować aktualizację dziś o 2:00 w nocy?”. To zaplanowana zmiana w porze, gdy nie korzystasz z telefonu.","firma":"Bank zmienia system kont. Najpierw testuje go miesiąc na kopii danych, potem wdraża w długi weekend.","urzad":"Urząd marszałkowski chce zainstalować nową wersję systemu do obsługi dotacji unijnych. Kierownik informatyki ocenia ryzyko, a dyrektor wydziału zatwierdza termin. Zmianę testuje się tydzień na kopii danych, wdraża w sobotę, a na wypadek kłopotów jest gotowy plan powrotu do starej wersji.","it":"Zmianami w IT zarządza proces BAI06 Zarządzanie zmianami (FW-PL s. 33).","egz":"BAI06 Zarządzanie zmianami (Manage Changes). Nie myl z pierścieniem „Aktywowanie zmiany” (change enablement) we wdrożeniu (dzień 4). Nie myl z: Aktywowanie zmiany – „Aktywowanie zmiany” we wdrożeniu COBIT 5 dotyczy ludzi i ich zachowań. Zmiana w tym haśle to modyfikacja systemu IT.; Problem – Problem to przyczyna awarii. Zmiana to często sposób, by tę przyczynę usunąć.","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; COBIT 5 Framework (PL), s. 38"}},"S":[{"lekcje":["ex-k17-powtorka-zasady-aktywatory","ex-k18-powtorka-wymiary-procesy"],"pt":"Lekcje 9.17–9.18","h":"Rozumiej pojęcie mimo różnic tłumaczenia","b":"<p>Różne polskie odpowiedniki mogą opisywać to samo pojęcie <w k=\"cobit-5\">COBIT 5</w>. Porównuj znaczenie i angielski termin, a nie samą formę słowa.</p>","c":"Poprawny synonim nie jest sam w sobie błędną odpowiedzią.","s":"COBIT 5 Framework (PL), s. 14, 27–29, 33","ctx":"<p>Stopień osiągnięcia PA ocenia się jako N 0–15%, P ponad 15–50%, L ponad 50–85%, F ponad 85–100%. Litery dotyczą skali angielskiej. Każdy atrybut ocenia się osobno, bez średniej.</p><p><b>Przykład:</b> 85% oznacza L; dopiero wynik ponad 85% mieści się w F. To stopień osiągnięcia atrybutu, nie odsetek poprawnych dokumentów.</p><p><b>Uwaga:</b> Kursowe tłumaczenie N/C/W/P może pomylić literę P z angielskim Partially. Zawsze określ legendę.</p><p>Ład i nadzór mogą być przekładami governance; metodyka i struktura ramowa przekładami framework. Aktualne brzmienie egzaminu ustala operator.</p>"},{"lekcje":["ex-k19-powtorka-wdrozenie"],"pt":"Lekcja 9.19","h":"Wdrożenie: pierścienie działają naraz, fazy idą po kolei","b":"<ul><li><b>Zewnętrzny</b>: <w k=\"pierscien-program\">zarządzanie programem</w>.</li><li><b>Środkowy</b>: <w k=\"pierscien-zmiana\">Aktywowanie zmiany</w> – ludzie i kultura.</li><li><b>Wewnętrzny</b>: ciągłe doskonalenie – nie <w k=\"projekt\">projekt</w> jednorazowy.</li></ul><p>Warunek → czynnik środowiskowy; ból → punkt zapalny; <w k=\"it-zmiana\">zmiana</w> → zdarzenie wyzwalające.</p>","c":"Fazy mówią, co robisz po kolei, pierścienie – czego pilnujesz cały czas.","s":"COBIT 5 Framework (PL), s. 37–39","ctx":"<p>Siedem faz: 1 Jakie są wyznaczniki? 2 Gdzie jesteśmy teraz? 3 Dokąd chcemy dojść? 4 Co trzeba zrobić? 5 Jak się tam dostaniemy? 6 Czy dotarliśmy do celu? 7 Jak utrzymać motywację do działania? Najczęstsze fakty: ocena stanu obecnego – faza 2, stan docelowy – 3, projekty wspierane <w k=\"uzasadnienie-biznesowe\">uzasadnieniami biznesowymi</w> – 4, wdrażanie usprawnień – 5. Inicjatywa dłuższa niż 6 miesięcy grozi utratą dynamiki (reguła dotyczy całej inicjatywy, nie fazy).</p><p>Pytanie o aspekty behawioralne i kulturowe to pierścień środkowy. Uzasadnienie biznesowe jest dokumentem dynamicznym, aktualizowanym przez cały cykl. Przykład czynników: obowiązujące przepisy – warunek; powtarzające się złe wyniki audytu – ból; fuzja albo nowy dyrektor IT – zmiana. Wdrożenie i zdolność to razem ok. 14 z 50 pytań – schematycznych, więc łatwych do zdobycia.</p>"},{"lekcje":["ex-k20-powtorka-zdolnosc"],"pt":"Lekcja 9.20","h":"Poziom: jego atrybuty W lub P, wszystkie niższe P","b":"<p>Poziomy: 0 niekompletny, 1 wykonywany, 2 zarządzany, 3 ustanowiony, 4 przewidywalny, 5 zoptymalizowany.</p><p>Skala: N 0–15%, C &gt;15–50%, W &gt;50–85%, P &gt;85–100%.</p><p>Bez średniej – każdy atrybut osobno.</p>","c":"Jedna ocena W na niższym poziomie blokuje wszystkie wyższe.","s":"COBIT 5 Framework (PL), s. 42, 45","ctx":"<p>Poziom 1 ma jeden atrybut (sprawność procesu, PA 1.1), poziomy 2–5 po dwa – razem 9 <w k=\"atrybuty-procesu\">atrybutów</w>. Podręcznik pisze „potencjał” zamiast egzaminacyjnej „zdolności” i „optymalizujący” zamiast „zoptymalizowany”:</p><blockquote>„Każdy z poziomów potencjału może zostać osiągnięty tylko wtedy, gdy w pełni uzyskano niższy poziom”</blockquote><p>Przykład z helpdesku: PA 1.1 = P, 2.1 = P, 2.2 = W, 3.1 = P, 3.2 = P. Poziom 2 jest osiągnięty (jego atrybuty co najmniej W, PA 1.1 = P), poziom 3 nie, bo PA 2.2 ma tylko W. Wynik: 2.</p>"},{"lekcje":["ex-k21-nazwy-egzaminacyjne","ex-k22-dzien-egzaminu"],"pt":"Lekcje 9.21–9.22","h":"Rozumiej pojęcie mimo różnic tłumaczenia","b":"<p>Różne polskie odpowiedniki mogą opisywać to samo pojęcie <w k=\"cobit-5\">COBIT 5</w>. Porównuj znaczenie i angielski termin, a nie samą formę słowa.</p>","c":"Poprawny synonim nie jest sam w sobie błędną odpowiedzią.","s":"Zestawienie nazw ALTKOM; sylabus egzaminu","ctx":"<p>Stopień osiągnięcia PA ocenia się jako N 0–15%, P ponad 15–50%, L ponad 50–85%, F ponad 85–100%. Litery dotyczą skali angielskiej. Każdy atrybut ocenia się osobno, bez średniej.</p><p><b>Przykład:</b> 85% oznacza L; dopiero wynik ponad 85% mieści się w F. To stopień osiągnięcia atrybutu, nie odsetek poprawnych dokumentów.</p><p><b>Uwaga:</b> Kursowe tłumaczenie N/C/W/P może pomylić literę P z angielskim Partially. Zawsze określ legendę.</p><p>Ład i nadzór mogą być przekładami governance; metodyka i struktura ramowa przekładami framework. Aktualne brzmienie egzaminu ustala operator.</p>"}],"bankRevision":"4f53cda18c2baa0c","legacySp1Order":[null,null,null,null,null,null,null,null,null,null]};</script>
