<script>window.DECK={"id":"k-ex-strategia","rozdzial":"Poza podręcznikiem · Egzamin","tytul":"Strategia: jak czytać pytania","prev":"k-m0-egzamin.html","next":"03-czytanie-pytan.html","T":{"dostep-i-bezpieczenstwo":{"t":"Dostęp i Bezpieczeństwo","eg":"Dostęp i Bezpieczeństwo","pd":"Dostęp i bezpieczeństwo / Dostępność i bezpieczeństwo","en":"Accessibility and security","wyj":"Informacja ma być dostępna dla tych, którzy jej potrzebują, i schowana przed tymi, którzy nie powinni jej mieć.\n\nTo trzecia kategoria celów aktywatora (enabler goals), obok jakości wewnętrznej (intrinsic quality) i jakości kontekstowej (contextual quality). Sprawdza dwie rzeczy: czy aktywator jest dostępny w razie potrzeby (accessibility) i czy jego wyniki są zabezpieczone, czyli dostępne tylko dla uprawnionych (security). Dla aktywatora Informacja odpowiadają temu kryteria dostępności i ograniczonego dostępu.\n\nŻeby aktywatory i ich wyniki były dostępne wtedy, gdy są potrzebne, i chronione przed tymi, którzy nie powinni mieć do nich dostępu.","zycie":"Dziecko rozcina kolano, a Ty po 10 sekundach masz apteczkę w ręku, bo zawsze stoi w tej samej szafce. Ta szafka jest wysoko i zamknięta, więc młodsze dziecko nie dobierze się do leków. Pod ręką, kiedy trzeba, i poza zasięgiem niepowołanych – to dostęp i bezpieczeństwo.","firma":"W ostatni dzień miesiąca księgowa warsztatu zamyka rozliczenia, a program księgowy po prostu działa. Jednocześnie listę płac widzi tylko ona i właściciel, mechanicy nie mają do niej wglądu. Dostępne, gdy trzeba, i chronione przed niepowołanymi – to dostęp i bezpieczeństwo.","urzad":"Mieszkaniec przychodzi do urzędu o 15:30, a urzędniczka od ręki sprawdza jego dane w rejestrze. Stażysta widzi w tym samym rejestrze tylko sprawy, które sam prowadzi, a nikt z zewnątrz nie ma do niego dostępu. Tak wygląda cel „dostęp i bezpieczeństwo” dla rejestru.","it":"Dla aktywatora Informacja, czyli bazy danych klientów w systemie CRM, cel dostępu i bezpieczeństwa brzmi: baza działa w każdej chwili, gdy konsultant obsługuje klienta, a dane osobowe widzą tylko uprawnieni. Zabezpieczenia techniczne zapewnia proces DSS05 Zarządzanie usługami bezpieczeństwa.","egz":"„Dostępne kiedy potrzebne” i „wyniki zabezpieczone” → Dostęp i Bezpieczeństwo (s. 29). Nie myl z: Bezpieczeństwo informacji (APO13/DSS05) – To procesy. Tu chodzi o kategorię celu każdego aktywatora.","src":"COBIT 5 Framework (PL), s. 28, 29"},"dobre-praktyki":{"t":"Dobre praktyki","eg":"Dobre praktyki","pd":"Dobre praktyki","en":"Good practices","wyj":"Sprawdzone sposoby robienia czegoś, które zadziałały u innych, więc nie trzeba wymyślać od nowa.\n\nDobre praktyki (good practices) to jeden z czterech wymiarów każdego aktywatora, obok interesariuszy, celów i cyklu życia. Podają przykłady lub sugestie, jak najlepiej wdrożyć aktywator, oraz wymagane produkty działań (work products), czyli dane wejściowe i wyniki (inputs and outputs). Dla procesów COBIT 5 podaje je w publikacji „Procesy umożliwiające” (Enabling Processes), a dla innych aktywatorów odsyła też do innych standardów.\n\nŻeby nie wymyślać wszystkiego od nowa, tylko korzystać ze sposobów, które sprawdziły się w wielu organizacjach. Dobre praktyki wspierają osiąganie celów aktywatora.","zycie":"Babcia lepi pierogi zawsze tak samo: mąka, woda i jajko, ciasto odpoczywa pół godziny, farsz robi się dzień wcześniej. Dostajesz od niej kartkę z listą składników (wejścia) i opisem, jak mają wyglądać gotowe pierogi (wynik). Ten sprawdzony przez lata sposób to dobra praktyka.","firma":"Sieć trzech sklepów rowerowych ma jedną checklistę otwarcia: włączyć kasę, przeliczyć gotówkę, uruchomić terminal, wystawić rowery testowe. Na wejściu jest raport z zamknięcia z poprzedniego dnia, na wyjściu podpisana lista. Sposób sprawdzony we wszystkich punktach to dobra praktyka.","urzad":"Nowy pracownik urzędu dostaje skargę mieszkańca i nie wie, co z nią zrobić. Kierowniczka daje mu wzorcową procedurę: rejestracja w EZD, przekazanie do właściwego wydziału, odpowiedź w ciągu miesiąca zgodnie z KPA. Na wejściu jest skarga, na wyjściu pismo z odpowiedzią – to dobra praktyka z gotowymi produktami działań.","it":"Dla procesu DSS02 Zarządzanie zgłoszeniami serwisowymi i incydentami publikacja „Procesy umożliwiające” podaje praktyki, np. rejestrowanie, klasyfikowanie i nadawanie priorytetu zgłoszeniom, wraz z wejściami i wyjściami, np. raportami o zgłoszeniach. To dobre praktyki aktywatora Procesy.","egz":"„Czy stosowane są dobre praktyki?” → mierzone wskaźnikiem wiodącym (s. 29). Nie myl z: Czynnik wpływający na potrzeby interesariuszy – Dobre praktyki to wymiar aktywatora. Nie wpływają na potrzeby interesariuszy.","src":"COBIT 5 Framework (PL), s. 29, 91"},"wskaznik-wiodacy":{"t":"Wskaźnik wiodący","eg":"Wskaźnik wiodący","pd":"Wskaźnik wyprzedzający","en":"Lead indicator","wyj":"Liczba, która ostrzega wcześniej, czy idziemy w dobrą stronę, np. ile godzin się uczysz.\n\nDwa ostatnie z czterech pytań zarządzania wydajnością aktywatora (enabler performance management) dotyczą jego funkcjonowania: czy cykl życia aktywatora jest zarządzany i czy stosowane są dobre praktyki. Mierniki, które na nie odpowiadają, to wskaźniki wiodące (lead indicators). Przewidują przyszły wynik, który potem pokażą wskaźniki opóźnione (lag indicators).\n\nŻeby wcześnie, zanim pojawi się wynik, zobaczyć, czy aktywator działa jak trzeba, i zdążyć to poprawić.","zycie":"Za trzy miesiące biegniesz półmaraton. Co tydzień sprawdzasz, czy zrobiłeś zaplanowane cztery treningi. Jeśli od miesiąca wychodzą dwa, już wiesz, że wynik będzie słaby, i możesz to jeszcze zmienić – to wskaźnik wiodący.","firma":"Właściciel warsztatu samochodowego sprawdza, czy mechanicy wypełniają listę kontrolną przy każdym aucie. Jeśli połowa ją pomija, spodziewa się reklamacji, zanim te przyjdą, i od razu reaguje – to wskaźnik wiodący.","urzad":"Tydzień przed wejściem nowej procedury w urzędzie gminy sekretarz sprawdza, ilu urzędników przeszło szkolenie. Jest 60%, więc wie, że będą kłopoty, zanim wpłynie pierwsza skarga – to wskaźnik wiodący.","it":"W BAI06 (Zarządzanie zmianami) odsetek zmian wdrażanych po zatwierdzeniu i z planem wycofania to wskaźnik wiodący. Gdy spada, można przewidzieć więcej incydentów w DSS02 (Zarządzanie zgłoszeniami serwisowymi i incydentami), zanim one wystąpią.","egz":"Wskaźnik wiodący mierzy, czy cykl życia jest zarządzany i czy stosowane są dobre praktyki. Osiągnięcie celów i uwzględnienie potrzeb mierzą wskaźniki opóźnione (s. 29). Egzamin: „Wskaźniki wiodące”. Podręcznik: „Wskaźniki wyprzedzające”. Nie myl z: Wskaźnik opóźniony – Opóźniony mierzy wynik, czyli osiągnięcie celów i zaspokojenie potrzeb.","src":"COBIT 5 Framework (PL), s. 29"},"zasada-4":{"t":"Zasada 4: Aktywacja holistycznego podejścia","eg":"Zasada 4: Aktywacja holistycznego podejścia","pd":"Zasada 4: Wdrożenie podejścia całościowego","en":"Principle 4: Enabling a Holistic Approach","wyj":"Patrz na całość: sukces zależy od wielu rzeczy naraz, nie tylko od sprzętu.\n\nCOBIT 5 wyróżnia 7 kategorii aktywatorów (enablers), m.in. procesy, struktury organizacyjne, informację oraz ludzi, umiejętności i kompetencje. Aktywatory indywidualnie i kolektywnie decydują o tym, czy Ład i Zarządzanie działają: każdy potrzebuje wejść od innych i dostarcza im wyników. Wszystkie mają cztery wspólne wymiary (interesariusze, cele, cykl życia, dobre praktyki), a ich wydajność mierzą wskaźniki wiodące i opóźnione.\n\nŻeby Ład i Zarządzanie IT budować na wszystkich współpracujących aktywatorach, a nie tylko na technologii czy na pojedynczym procesie.","zycie":"Kupujesz dziecku biurko i lampkę, żeby lepiej się uczyło. Nic się nie zmienia, dopóki nie ustalicie planu dnia, zasady „najpierw lekcje, potem gry”, a Ty sam nie odłożysz telefonu przy kolacji. Dopiero wszystkie te elementy razem dają efekt – to Zasada 4.","firma":"Sklep spożywczy stawia kasę samoobsługową, ale kolejki się nie skracają. Nikt nie pilnuje kasy, kasjerki nie umieją pomóc klientom, a klienci nie wiedzą, że wolno z niej korzystać. Sam sprzęt nie wystarczy, potrzebne są też ludzie, procedury i nawyki – to Zasada 4.","urzad":"Starostwo wdraża elektroniczne zarządzanie dokumentacją. System działa, ale urzędnicy dalej drukują pisma, bo nie ma instrukcji kancelaryjnej ani szkoleń, a kierownik sam woli papier. Bez procesów, ludzi, struktur i kultury system zostaje pustą skorupą – to Zasada 4.","it":"APO13 (Zarządzanie bezpieczeństwem) działa dopiero razem z polityką bezpieczeństwa, strukturą odpowiedzialną za bezpieczeństwo, kulturą zgłaszania incydentów, przeszkolonymi ludźmi, informacją i narzędziami. Przykład 4 z FW-PL: procesy i procedury bezpieczeństwa informacji nie będą skuteczne, jeśli kultura i etyka są nieodpowiednie.","egz":"Liczba 7 aktywatorów i 4 wymiary aktywatora to tematy Zasady 4. Pytania o „jakość kontekstową”, „wskaźniki wiodące” i „cykl życia aktywatora” też należą do Zasady 4. Egzamin (uzasadnienia SP1): „Aktywacja holistycznego podejścia” – „aktywacja”, bo egzamin tłumaczy enabler jako „aktywator”. Podręcznik: „Wdrożenie podejścia całościowego”. Rozpoznawaj po słowach: holistyczne / całościowe / aktywatory. Nie myl z: Zasada 2: Pokrycie całej organizacji – Zasada 2: CAŁA organizacja (zakres). Zasada 4: WSZYSTKIE rodzaje aktywatorów (całościowe podejście).","src":"COBIT 5 Framework (PL), s. 27, 28"},"ryzyko":{"t":"Ryzyko","eg":"Ryzyko","pd":"Ryzyko","en":"Risk","wyj":"Coś może pójść źle; liczy się, jak bardzo jest to prawdopodobne i jak bardzo zaboli.\n\nRyzyko (risk) to połączenie prawdopodobieństwa zdarzenia i jego konsekwencji. Dotyczy przyszłości. Dopowiedzenie kursu (interpretacja, nie definicja z s. 93): gdy zdarzenie już nastąpiło, mówimy raczej o problemie albo incydencie. Ład ustala apetyt na ryzyko (risk appetite), czyli ile ryzyka organizacja jest gotowa przyjąć (EDM03, Zapewnienie optymalizacji ryzyka), a Zarządzanie identyfikuje, ocenia i ogranicza ryzyka w tych granicach (APO12, Zarządzanie ryzykiem).\n\nŻeby z wyprzedzeniem widzieć, co może pójść źle i jak bardzo by zaszkodziło, i świadomie decydować, czemu zapobiegać, a co zaakceptować.","zycie":"Planujecie wesele w ogrodzie w lipcu. Deszcz jest dość prawdopodobny, a skutek byłby duży – goście mokną, tort się rozpływa – więc rezerwujecie namiot. Ryzyko to ta możliwość deszczu razem z jej skutkami; jeśli w dniu wesela leje, macie już problem, a nie ryzyko.","firma":"W biurze rachunkowym tylko pani Ewa umie obsługiwać program do płac. Jeśli zachoruje w ostatnim tygodniu miesiąca, pensje u klientów się spóźnią. Szef ocenia, że to mało prawdopodobne, ale bolesne, więc każe przeszkolić drugą osobę – tak wygląda praca z ryzykiem.","urzad":"Nabór wniosków o dopłaty do wymiany pieców w urzędzie gminy zamyka się w piątek o 15:00, a wszystko idzie przez jeden serwer. Awaria akurat w piątek jest mało prawdopodobna, ale skutek byłby fatalny, więc informatyk robi kopię i ma tego dnia dyżur. To ryzyko: możliwość zdarzenia plus jego skutki.","it":"W procesie APO12 (Zarządzanie ryzykiem) dział IT prowadzi rejestr ryzyk: np. „awaria serwerowni” ma ocenione prawdopodobieństwo i skutki. Dla ryzyk powyżej apetytu ustalonego przez Ład w EDM03 (Zapewnienie optymalizacji ryzyka) planuje się działania, np. zapasowe centrum danych.","egz":"Na egzaminie ryzyko pojawia się głównie jako „optymalizacja ryzyka” (cel Ładu) i „apetyt na ryzyko” (czynnik środowiskowy we wdrożeniu). Nie myl z: Issue / problem / incydent – Problem już zaistniał; ryzyko jest możliwością w przyszłości.; Zagrożenie – Zagrożenie to źródło (np. powódź); ryzyko łączy prawdopodobieństwo z konsekwencjami.","src":"COBIT 5 Framework (PL), s. 93"},"interesariusz":{"t":"Interesariusz","eg":"Interesariusz","pd":"Interesariusz","en":"Stakeholder","wyj":"Każdy, kogo dana sprawa obchodzi, bo coś na niej zyska albo straci.\n\nSpisuje się wszystkich, którzy mają wobec organizacji oczekiwania, odpowiadają za nią albo ponoszą skutki jej działań (stakeholders). Dzieli się ich na wewnętrznych (internal: zarząd, kierownictwo, właściciele procesów, użytkownicy, audyt wewnętrzny) i zewnętrznych (external: klienci, dostawcy, regulatorzy, audytorzy zewnętrzni, udziałowcy). Ich potrzeby (stakeholder needs) Ład ocenia i przekłada na cele organizacji.\n\nŻeby organizacja wiedziała, czyje potrzeby ma zaspokajać i przed kim się rozlicza. Od interesariuszy zaczyna się cała kaskada celów COBIT 5.","zycie":"Wspólnota w bloku decyduje o wymianie windy. Pani z parteru zapłaci tyle samo co inni, choć z windy nie korzysta, starszy pan z dziesiątego piętra bez niej nie wyjdzie z domu, a zarządca chce zamknąć temat przed zimą. Każde z nich coś na tej decyzji zyskuje albo traci – wszyscy są interesariuszami, także ci, którzy windą nie jeżdżą.","firma":"Właściciel piekarni kupuje na kredyt nowy piec. Piekarze martwią się, czy ogarną nową obsługę, klienci liczą na świeże bułki od szóstej, bank pyta o spłatę rat, a sanepid przyjdzie sprawdzić, czy wszystko jest zgodnie z przepisami. Każdy z nich coś zyska albo straci na tej decyzji: piekarze to interesariusze wewnętrzni, klienci, bank i sanepid – zewnętrzni.","urzad":"Urząd gminy przenosi zapisy do przedszkoli do internetu. Rodzice chcą zapisać dziecko z telefonu, dyrektorki przedszkoli boją się bałaganu na listach, a babcia, która wychowuje wnuka, nie ma komputera i pyta, czy dalej może przyjść z papierem. Wszyscy oni są interesariuszami tej zmiany – również babcia, która z systemu nigdy nie skorzysta.","it":"W EDM05 (Zapewnienie przejrzystości dotyczącej interesariuszy) zarząd ustala, którym interesariuszom i jak raportuje wyniki IT, np. udziałowcom raport kwartalny, a regulatorowi wymagane sprawozdania. Relacje z interesariuszami biznesowymi wewnątrz organizacji prowadzi APO08 (Zarządzanie relacjami).","egz":"Rozróżniaj interesariuszy wewnętrznych (kierownictwo, zarząd, CIO, właściciele procesów, audyt wewnętrzny) i zewnętrznych (klienci, partnerzy biznesowi, regulatorzy, dostawcy, audytorzy zewnętrzni). Źródło: Ilustracja 7 (s. 22); por. s. 69 (il. 29). Nie myl z: Shareholder – udziałowiec / akcjonariusz – Udziałowiec to tylko jeden z interesariuszy – ten, który ma udziały. Interesariuszem jest też np. klient czy regulator, choć nie ma żadnych udziałów.; Użytkownik systemu – Użytkownik jest interesariuszem, ale interesariuszem może być też ktoś, kto z systemu w ogóle nie korzysta (np. pacjent czekający na wynik badania).; Decydent – Interesariusz nie musi podejmować decyzji – wystarczy, że decyzja na niego wpływa.","src":"COBIT 5 Framework (PL), s. 22, 93"},"tworzenie-wartosci":{"t":"Tworzenie Wartości – Cel Ładu","eg":"Tworzenie Wartości – Cel Ładu","pd":"Tworzenie wartości – cel nadzoru","en":"Value Creation (governance objective)","wyj":"Pożytek większy niż koszt i ryzyko: dostajemy korzyści, nie przepłacając i nie narażając się bez potrzeby.\n\nTworzenie wartości (value creation) to cel Ładu wynikający z potrzeb interesariuszy. Składa się z trzech elementów: realizacji korzyści (benefits realisation), optymalizacji ryzyka (risk optimisation) i optymalizacji zasobów (resource optimisation). Ład równoważy je przy każdej decyzji, pytając, kto odnosi korzyści, kto ponosi ryzyko i jakie zasoby są potrzebne; w procesach odpowiadają za to EDM02, EDM03 i EDM04.\n\nŻeby każdą decyzję o IT oceniać nie tylko po korzyściach, ale też po ryzyku i zużytych zasobach, bo dopiero ich równowaga daje interesariuszom wartość.","zycie":"Zastanawiasz się nad rowerem do dojazdów. Liczysz: 300 zł miesięcznie mniej na paliwo i pół godziny mniej w korkach (korzyść), ryzyko kradzieży i wypadku (kupujesz zapięcie i kask), cena 2500 zł i miejsce w piwnicy (zasoby). Kupujesz, bo te trzy rzeczy się bilansują – to jest tworzenie wartości.","firma":"Właściciel warsztatu rozważa program do rezerwacji wizyt online. Zyska więcej klientów i mniej telefonów, ale ryzykuje wyciek danych klientów, a do tego płaci 150 zł abonamentu i traci dwa dni na szkolenie. Decyduje się, gdy znajduje dostawcę z dobrymi zabezpieczeniami – korzyść, ryzyko i koszt są w równowadze.","urzad":"Starostwo wdraża elektroniczny obieg dokumentów. Sprawy idą o tydzień szybciej (korzyść), ale trzeba robić kopie zapasowe, żeby awaria nie zgubiła akt (ryzyko), i kupić licencje oraz oddelegować dwie osoby do wdrożenia (zasoby). Gdyby system był szybki, ale zawodny albo za drogi, nie byłoby z niego wartości.","it":"W procesach EDM02 (Zapewnienie realizacji korzyści), EDM03 (Zapewnienie optymalizacji ryzyka) i EDM04 (Zapewnienie optymalizacji zasobów) zarząd ocenia inwestycję w usługi chmurowe: jakie korzyści da, czy ryzyko mieści się w apetycie na ryzyko i czy wystarczy ludzi i pieniędzy. Wartość jest dopiero przy równowadze tych trzech ocen.","egz":"Cel Ładu „Tworzenie Wartości” realizuje się przez wszystkie trzy składniki naraz. Odpowiedź z jednym składnikiem jest niepełna (pułapka „zbyt wąskie”). Egzamin: „Cel Ładu”. Podręcznik: „Cel nadzoru”. To ten sam cel – tworzenie wartości. Nie myl z: Zysk – Zysk to tylko jedna postać korzyści. W sektorze publicznym korzyścią są usługi publiczne.; Realizacja korzyści – Realizacja korzyści to tylko jeden z trzech składników tworzenia wartości.","src":"COBIT 5 Framework (PL), s. 17, 93"}},"S":[{"pt":"Lekcje 9.10–9.11","h":"Trzy kroki: słowo-klucz, temat, eliminacja","b":"<ol><li><b>Słowo-klucz<\/b>: NIE, NAJLEPIEJ, GŁÓWNY?<\/li><li><b>Temat<\/b>: z jakiej szuflady ma być odpowiedź?<\/li><li><b>Eliminacja<\/b>: odrzuć fałszywe, nie na temat i zbyt wąskie.<\/li><\/ol><p>Dobra odpowiedź jest prawdziwa <b>i<\/b> odpowiada na to pytanie w całości.<\/p>","c":"Prawda to warunek konieczny, ale nie wystarczający.","s":"COBIT 5 Framework (PL), s. 14, 93","ctx":"<p>Wiele punktów traci się przez pośpieszne czytanie, nie przez niewiedzę. Przykład: „Kto <b>NIE<\/b> jest interesariuszem nowego systemu sklepu internetowego?” – klient, dostawca płatności i zarząd mają oczekiwania; serwer to rzecz, więc to on jest odpowiedzią.<\/p><p>Najtrudniej odrzucić odpowiedzi prawdziwe. <b>Nie na temat<\/b>: na pytanie o definicję <w k=\"ryzyko\">ryzyka<\/w> odpowiedź „organizacja powinna zarządzać ryzykiem IT” jest prawdą, ale nie definicją (definicja: połączenie prawdopodobieństwa zdarzenia i jego skutków, s. 93). Sygnał: „powinno”, „należy” w odpowiedzi na „czym jest…”. <b>Zbyt wąskie<\/b>: „realizacja korzyści” przegrywa z pełnym celem Ładu – korzyściami przy optymalizacji ryzyka i zasobów (s. 14).<\/p><p>Test: gdy dwie odpowiedzi brzmią dobrze, a jedna zawiera drugą, wybierz pełniejszą. Pytanie kontrolne przy każdej kuszącej opcji: czy to odpowiedź właśnie na to pytanie?<\/p>"},{"pt":"Sprawdź się","quiz":{"tresc":"Co jest <b>GŁÓWNYM<\/b> zadaniem Ładu (<em>Governance<\/em>) w COBIT 5?","opcje":[{"t":"Ocena potrzeb, wyznaczanie kierunku i monitorowanie","ok":true,"w":"Dobrze. Ład ocenia potrzeby, ukierunkowuje przez priorytety i decyzje oraz monitoruje sprawność i zgodność."},{"t":"Zarząd pod przywództwem prezesa","w":"To prawda, ale odpowiada na pytanie „kto”, a nie „co jest zadaniem”."},{"t":"Monitorowanie zgodności z kierunkiem","w":"To prawda, ale tylko jedna z trzech czynności Ładu."},{"t":"Planowanie, budowanie, realizacja i monitorowanie działań","w":"To opis Zarządzania (<em>Management<\/em>), czyli innej szuflady."}],"src":"COBIT 5 Framework (PL), s. 14","pomoc":{"t":"Pytanie dotyczy lekcji 9.10 „Trzy kroki czytania pytania”. Cel lekcji: Potrafię przeczytać pytanie egzaminacyjne w trzech krokach: słowo-klucz, temat, eliminacja.","k":[]}}},{"pt":"Sprawdź się","quiz":{"tresc":"Pytanie: „Jak COBIT 5 definiuje ryzyko?”. Która odpowiedź jest dobra?","opcje":[{"t":"Zagrożenie, czyli samo źródło możliwej szkody dla organizacji","w":"Zagrożenie to tylko część ryzyka. Brakuje prawdopodobieństwa i skutków."},{"t":"Połączenie prawdopodobieństwa zdarzenia i jego skutków","ok":true,"w":"Dobrze. To definicja ze słowniczka – i odpowiada właśnie na pytanie o definicję."},{"t":"Zdarzenie, które już się wydarzyło","w":"Odwrotnie. To, co już się wydarzyło, jest problemem, a ryzyko dotyczy przyszłości."},{"t":"Organizacja powinna zarządzać ryzykiem IT","w":"Prawda, ale to zdanie o tym, co robić z ryzykiem, a nie definicja."}],"src":"COBIT 5 Framework (PL), s. 93","pomoc":{"t":"Pytanie dotyczy lekcji 9.11 „Prawdziwe zdanie, zła odpowiedź – nie na temat i zbyt wąskie”. Cel lekcji: Potrafię odrzucić odpowiedź, która jest prawdziwa, ale nie odpowiada na pytanie albo mówi tylko część prawdy.","k":[]}}},{"pt":"Lekcje 9.12–9.13","h":"Słowo-klucz zmienia zadanie","b":"<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>Słowo<\/th><th>Co robisz<\/th><\/tr><tr><td>NIE<\/td><td>trzy pasują – zaznacz czwartą<\/td><\/tr><tr><td>NAJLEPIEJ<\/td><td>wybierz najpełniejszą<\/td><\/tr><tr><td>GŁÓWNY<\/td><td>szukaj sedna, nie szczegółu<\/td><\/tr><tr><td>ZAWSZE, MUSI, WSZYSTKIE<\/td><td>sygnał ostrzegawczy – sprawdź z modelem<\/td><\/tr><\/table><\/div>","c":"Słowa-klucza szukasz, zanim przeczytasz odpowiedzi, a odpowiadasz według modelu COBIT 5, nie swojej firmy.","s":"COBIT 5 Framework (PL), s. 14, 20, 32","ctx":"<p>Przy NIE najczęstszy błąd to zaznaczenie pierwszej poprawnej opcji z przyzwyczajenia („Który <b>NIE<\/b> jest aktywatorem?” – Budżet IT, bo to zasób, a nie jedna z 7 kategorii). Przy NAJLEPIEJ i GŁÓWNY wygrywa odpowiedź, która obejmuje pozostałe: <w k=\"interesariusz\">interesariusz<\/w> to „każdy, kto ma oczekiwania, udział lub odpowiedzialność”, a nie tylko „użytkownik systemu”; głównym celem Ładu jest <w k=\"tworzenie-wartosci\">tworzenie wartości<\/w>, a nie zatwierdzanie budżetu IT.<\/p><p>Słowa absolutne każą się zatrzymać, ale nie są wyrokiem. Model procesów nie jest jedynym możliwym (s. 32), więc „organizacja musi wdrożyć wszystkie 37 procesów” to fałsz. Za to „pierwszą czynnością przy kaskadzie celów jest <b>zawsze<\/b> dostosowanie mapowania” to prawda (s. 20). Reguła: zdanie przeciw dostosowaniu jest prawie zawsze fałszywe.<\/p><p>Pułapka doświadczonych: w Twojej firmie budżet IT zatwierdza dyrektor IT, ale według modelu za Ład odpowiada zarząd pod przywództwem prezesa (s. 14).<\/p>"},{"pt":"Sprawdź się","quiz":{"tresc":"Co <b>NAJLEPIEJ<\/b> opisuje interesariusza (<em>Stakeholder<\/em>)?","opcje":[{"t":"Udziałowiec organizacji (<em>Shareholder<\/em>)","w":"Udziałowiec jest interesariuszem, ale tylko jednym z wielu. Uwaga na podobne angielskie słowa."},{"t":"Użytkownik systemu IT","w":"Użytkownik to tylko jeden rodzaj interesariusza. Odpowiedź jest zbyt wąska."},{"t":"Każdy, kto ma oczekiwania, udział lub odpowiedzialność","ok":true,"w":"Dobrze. To najpełniejsza odpowiedź – obejmuje udziałowców, użytkowników, regulatora i innych."},{"t":"Każdy zasób, który wspiera osiąganie celów całej organizacji","w":"To opis zasobu, czyli innej szuflady. Rzecz nie ma oczekiwań."}],"src":"COBIT 5 Framework (PL), s. 93","pomoc":{"t":"Pytanie dotyczy lekcji 9.12 „Słowa NIE i NAJLEPIEJ”. Cel lekcji: Potrafię zmienić sposób wyboru odpowiedzi, gdy w pytaniu stoi NIE albo NAJLEPIEJ.","k":[]}}},{"pt":"Sprawdź się","quiz":{"tresc":"W Twojej firmie Ładem IT zajmuje się dyrektor IT. Pytanie: „Kto według COBIT 5 w większości organizacji odpowiada za Ład?”. Co zaznaczysz?","opcje":[{"t":"Dyrektor IT (CIO), bo tak jest u mnie","w":"Praktyka Twojej firmy może być inna, ale egzamin pyta o model COBIT 5."},{"t":"Kadra zarządzająca z dyrektorem generalnym","w":"Kadra pod przywództwem dyrektora generalnego odpowiada za Zarządzanie, a nie za Ład."},{"t":"Audyt wewnętrzny","w":"Audyt ocenia i doradza, ale nie odpowiada za Ład."},{"t":"Zarząd pod przywództwem prezesa","ok":true,"w":"Dobrze. Tak mówi podręcznik. Odpowiadasz według modelu, a nie według swojej firmy."}],"src":"COBIT 5 Framework (PL), s. 14","pomoc":{"t":"Pytanie dotyczy lekcji 9.13 „GŁÓWNY, ZAWSZE i model COBIT 5 zamiast własnej praktyki”. Cel lekcji: Potrafię czytać słowa GŁÓWNY i ZAWSZE w pytaniu i odpowiadam według modelu COBIT 5, a nie według praktyki mojej organizacji.","k":[]}}},{"pt":"Lekcje 9.14–9.15","h":"Każdą złą odpowiedź da się nazwać – najczęściej to inna szuflada","b":"<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>Typ<\/th><th>Objaw<\/th><\/tr><tr><td>inna kategoria<\/td><td>prawda z innej szuflady<\/td><\/tr><tr><td>zbyt wąskie<\/td><td>część pełnej odpowiedzi<\/td><\/tr><tr><td>nie na temat<\/td><td>dobre zdanie o czymś innym<\/td><\/tr><tr><td>forma podręcznikowa<\/td><td>nazwa z podręcznika<\/td><\/tr><tr><td>fałsz<\/td><td>np. zła liczba<\/td><\/tr><tr><td>odwrócone<\/td><td>para zamieniona miejscami<\/td><\/tr><\/table><\/div>","c":"Nazwany typ błędnej odpowiedzi odrzucasz w sekundę.","s":"COBIT 5 Framework (PL), s. 14, 28, 33","ctx":"<p>Technika szuflady: przy każdej opcji pytasz, z jakiej kategorii jest – zasada, aktywator, wymiar, proces, faza, poziom. Na pytanie o <b>zasadę<\/b> „Procesy” i „Kultura, Etyka i Zachowanie” to aktywatory, a zasadą jest Oddzielenie Ładu od Zarządzania. Aktywator 1 „Zasady, Polityki i Struktury ramowe” ma „zasady” w nazwie, ale zasadą nie jest; <w k=\"zasada-4\">zasada 4<\/w> mówi o aktywatorach, ale sama jest zasadą.<\/p><p>Uważaj na szuflady zagnieżdżone: <w k=\"dostep-i-bezpieczenstwo\">dostęp i bezpieczeństwo<\/w> to kategoria celów wewnątrz wymiaru Cele, a nie wymiar (wymiary: interesariusze, cele, cykl życia, <w k=\"dobre-praktyki\">dobre praktyki<\/w>, s. 28). Odwrócone: „<w k=\"wskaznik-wiodacy\">wskaźnik wiodący<\/w> mierzy wynik po fakcie” – to opisuje wskaźnik opóźniony. Fałsz: „COBIT 5 ma 40 procesów” – ma 37 (s. 33).<\/p><p>Po każdym egzaminie próbnym zanotuj, który typ kosztował Cię najwięcej, i wróć do tego tematu.<\/p>"},{"pt":"Sprawdź się","quiz":{"tresc":"Co jest <b>wymiarem<\/b> aktywatora w COBIT 5?","opcje":[{"t":"Dobre praktyki","ok":true,"w":"Dobrze. Wymiary są cztery: interesariusze, cele, cykl życia i dobre praktyki."},{"t":"Struktury organizacyjne","w":"To aktywator, a nie wymiar aktywatora."},{"t":"Dostęp i Bezpieczeństwo","w":"To kategoria celów wewnątrz wymiaru Cele, a nie osobny wymiar."},{"t":"Czynnik umożliwiający","w":"To podręcznikowa nazwa samego aktywatora (<em>Enabler<\/em>), a nie jego wymiar."}],"src":"COBIT 5 Framework (PL), s. 28","pomoc":{"t":"Pytanie dotyczy lekcji 9.14 „Najczęstsza pułapka – prawda z innej kategorii”. Cel lekcji: Potrafię odrzucić odpowiedź prawdziwą, ale z innej kategorii COBIT 5 niż ta, o którą pyta pytanie.","k":[]}}},{"pt":"Sprawdź się","quiz":{"tresc":"Pytanie: „Jak brzmi zasada 5 COBIT 5?”. Odpowiedź: „Oddzielenie nadzoru od zarządzania”. Jaki to typ dystraktora na polskim egzaminie?","opcje":[{"t":"Inna kategoria (prawda z innej szuflady)","w":"To ta sama zasada, z tej samej szuflady."},{"t":"Forma podręcznikowa","ok":true,"w":"Dobrze. Treść się zgadza, ale to nazwa z podręcznika. Egzamin: Oddzielenie Ładu od Zarządzania."},{"t":"Fałsz","w":"Treść zasady jest prawdziwa. Zła jest tylko forma nazwy."},{"t":"Zbyt wąskie","w":"Nazwa jest pełna. Różni się tylko tłumaczeniem."}],"src":"COBIT 5 Framework (PL), s. 14; materiały Altkom","pomoc":{"t":"Pytanie dotyczy lekcji 9.15 „Sześć typów błędnych odpowiedzi”. Cel lekcji: Potrafię nazwać typ każdej błędnej odpowiedzi i dzięki temu szybciej ją odrzucić.","k":[]}}},{"pt":"Lekcja 9.16","h":"Tempo: dwa przejścia, kontrola, zero pustych pól","b":"<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>Minuty<\/th><th>Co robisz<\/th><\/tr><tr><td>0–25<\/td><td>pewne od razu, trudne oznacz<\/td><\/tr><tr><td>25–35<\/td><td>wracasz do oznaczonych<\/td><\/tr><tr><td>35–40<\/td><td>puste pola; jeszcze raz NIE i NAJLEPIEJ<\/td><\/tr><\/table><\/div><p>Nie ma punktów ujemnych – nie zostawiaj pustych odpowiedzi.<\/p>","c":"Średnio 48 sekund na pytanie wystarczy, jeśli trudne odkładasz na drugie przejście.","s":"Sylabus egzaminu COBIT 5 Foundation","ctx":"<p>2400 sekund na 50 pytań to ok. 48 s, a większość pytań rozwiązuje się w 20–30 s. Plan 25 + 10 + 5 to propozycja kursu, nie przepis. Każde pytanie jest warte tyle samo, więc po około minucie zaznacz najlepszą opcję, oznacz pytanie i idź dalej – inne pytanie często przypomni odpowiedź.<\/p><p>Puste pole to pewne zero; strzał daje 25%, a po wyeliminowaniu dwóch opcji 50%. „Wszystkie powyższe” nie jest z góry pułapką: odpada dopiero wtedy, gdy choć jedna opcja jest fałszywa albo z innej szuflady. Przećwicz plan na egzaminie próbnym z zegarem.<\/p>"},{"pt":"Sprawdź się","quiz":{"tresc":"Zostały 2 minuty, a 3 pytania są bez odpowiedzi. Co robisz?","opcje":[{"t":"Odpowiadam tylko na jedno, ale starannie","w":"Zbyt mało. Zaznacz wszystkie trzy."},{"t":"Zostawiam puste, żeby nie stracić punktów","w":"Odwrotnie. Puste pole daje zawsze zero."},{"t":"Zaznaczam coś w każdym","ok":true,"w":"Dobrze. Za błędną odpowiedź nie ma punktów ujemnych, a strzał daje co najmniej 25% szans."},{"t":"Poprawiam wcześniejsze odpowiedzi","w":"Najpierw uzupełnij puste pola – to pewny zysk szans."}],"src":"pytanie autorskie kursu","pomoc":{"t":"Pytanie dotyczy lekcji 9.16 „Tempo – 40 minut, dwa przejścia i kontrola”. Cel lekcji: Potrafię rozplanować 40 minut egzaminu tak, żeby nie utknąć na jednym pytaniu i nie zostawić pustych odpowiedzi.","k":[]}}}]};</script>
