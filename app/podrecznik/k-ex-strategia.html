<script>window.DECK={"id":"k-ex-strategia","rozdzial":"Poza podręcznikiem · Egzamin","tytul":"Strategia: jak czytać pytania","prev":"k-m0-egzamin.html","next":"03-czytanie-pytan.html","T":{"ryzyko":{"t":"Ryzyko","eg":"Ryzyko","pd":"Ryzyko","en":"Risk","wyj":"Coś może pójść źle; liczy się, jak bardzo jest to prawdopodobne i jak bardzo zaboli.\n\nRyzyko to połączenie prawdopodobieństwa zdarzenia i jego konsekwencji. Zaistniałe przerwanie usługi jest incydentem; problem w zarządzaniu usługami oznacza przyczynę jednego lub wielu incydentów. Zdarzenie nie usuwa ryzyka jego nawrotu lub dalszych skutków. Ład ustala apetyt i tolerancję, a Zarządzanie identyfikuje, analizuje i obsługuje ryzyko w tych granicach.\n\nŻeby z wyprzedzeniem widzieć, co może pójść źle i jak bardzo by zaszkodziło, i świadomie decydować, czemu zapobiegać, a co zaakceptować.","zycie":"Planujecie wesele w ogrodzie w lipcu. Deszcz jest dość prawdopodobny, a skutek byłby duży – goście mokną, tort się rozpływa – więc rezerwujecie namiot. Ryzyko to ta możliwość deszczu razem z jej skutkami; jeśli w dniu wesela leje, macie już problem, a nie ryzyko.","firma":"W biurze rachunkowym tylko pani Ewa umie obsługiwać program do płac. Jeśli zachoruje w ostatnim tygodniu miesiąca, pensje u klientów się spóźnią. Szef ocenia, że to mało prawdopodobne, ale bolesne, więc każe przeszkolić drugą osobę – tak wygląda praca z ryzykiem.","urzad":"Nabór wniosków o dopłaty do wymiany pieców w urzędzie gminy zamyka się w piątek o 15:00, a wszystko idzie przez jeden serwer. Awaria akurat w piątek jest mało prawdopodobna, ale skutek byłby fatalny, więc informatyk robi kopię i ma tego dnia dyżur. To ryzyko: możliwość zdarzenia plus jego skutki.","it":"W procesie APO12 (Zarządzanie ryzykiem) dział IT prowadzi rejestr ryzyk: np. „awaria serwerowni” ma ocenione prawdopodobieństwo i skutki. Dla ryzyk powyżej apetytu ustalonego przez Ład w EDM03 (Zapewnienie optymalizacji ryzyka) planuje się działania, np. zapasowe centrum danych.","egz":"Na egzaminie ryzyko pojawia się głównie jako „optymalizacja ryzyka” (cel Ładu) i „apetyt na ryzyko” (czynnik środowiskowy we wdrożeniu). Nie myl z: Issue / problem / incydent – Problem już zaistniał; ryzyko jest możliwością w przyszłości.; Zagrożenie – Zagrożenie to źródło (np. powódź); ryzyko łączy prawdopodobieństwo z konsekwencjami.","src":"COBIT 5 Framework (PL), s. 93"},"cobit-5":{"t":"COBIT 5","eg":"COBIT 5","pd":"COBIT 5","en":"COBIT 5","wyj":"Zbiór sprawdzonych reguł z 2012 roku, jak mądrze decydować o informatyce i nią kierować.\n\nCOBIT 5 (ISACA, 2012) opiera się na 5 zasadach (principles), 7 kategoriach aktywatorów (enablers) i modelu referencyjnym 37 procesów: 5 Ładu w domenie EDM i 32 Zarządzania w domenach APO, BAI, DSS i MEA. Kaskada celów przekłada potrzeby interesariuszy na cele organizacji, cele związane z IT i cele aktywatorów. Integruje wcześniejsze wytyczne ISACA (COBIT 4.1, Val IT, Risk IT) i jest spójny z innymi standardami, np. ITIL i ISO/IEC 27001.\n\nŻeby organizacja mogła mądrze kierować informatyką i nią zarządzać: osiągać korzyści przy rozsądnym ryzyku i zużyciu zasobów. Daje jedną, spójną strukturę ramową zamiast wielu luźnych wskazówek.","zycie":"Rodzina ma coraz więcej sprzętu i kont: telefony, laptop, router, bank, zdjęcia w chmurze. Ustalacie, kto decyduje o zakupach, kto pilnuje haseł i kopii, i co miesiąc sprawdzacie, czy wszystko działa i czy nie przepłacacie. COBIT 5 to taki „regulamin domu” dla informatyki, tylko spisany dla firm i urzędów.","firma":"Właściciel warsztatu kupił program do rezerwacji, kasę online i monitoring, ale nie wie, czy to się opłaca i kto za co odpowiada. COBIT 5 podpowiada, jak to poukładać: kto wyznacza kierunek, kto prowadzi codzienne sprawy, jak mierzyć efekty i ryzyko. To gotowa rama, a nie program do zainstalowania.","urzad":"Burmistrz słyszy, że urząd wydaje na informatykę coraz więcej, a mieszkańcy dalej stoją w kolejkach. Sięga po COBIT 5, żeby ustalić, czego chce od systemów, kto w urzędzie za nie odpowiada i jak co roku sprawdzać, czy przynoszą korzyści. COBIT 5 służy tu do uporządkowania Ładu i Zarządzania IT.","it":"Bank po poważnej awarii bankowości internetowej porządkuje IT według COBIT 5: zarząd przejmuje 5 procesów Ładu (EDM01–EDM05), CIO 32 procesy Zarządzania, np. DSS04 Zarządzanie ciągłością, a audyt wewnętrzny ocenia zdolność procesów.","egz":"Liczby do zapamiętania: 5 zasad, 7 aktywatorów, 37 procesów (EDM 5 + APO 13 + BAI 10 + DSS 6 + MEA 3), 6 poziomów zdolności (0–5). Nie myl z: COBIT 2019 – Nowsza wersja (2018/2019) – inne pojęcia (komponenty, 40 celów, czynniki projektowe). Egzamin COBIT 5 Foundation dotyczy COBIT 5.; ITIL – ITIL to dobre praktyki zarządzania usługami IT – jak dostarczać usługi. COBIT patrzy szerzej: Ład i Zarządzanie całością IT w organizacji.; ISO/IEC 27001 – ISO/IEC 27001 to norma bezpieczeństwa informacji z certyfikacją; COBIT 5 to struktura ramowa Ładu i Zarządzania IT.","src":"COBIT 5 Framework (PL), s. 90"}},"S":[{"lekcje":["ex-k10-trzy-kroki","ex-k11-prawdziwe-ale-zle"],"pt":"Lekcje 9.10–9.11","h":"Trzy kroki: słowo-klucz, temat, eliminacja","b":"<ol><li><b>Słowo-klucz</b>: NIE, NAJLEPIEJ, GŁÓWNY?</li><li><b>Temat</b>: z jakiej szuflady ma być odpowiedź?</li><li><b>Eliminacja</b>: odrzuć fałszywe, nie na temat i zbyt wąskie.</li></ol><p>Dobra odpowiedź jest prawdziwa <b>i</b> odpowiada na to pytanie w całości.</p>","c":"Prawda to warunek konieczny, ale nie wystarczający.","s":"COBIT 5 Framework (PL), s. 14, 93","ctx":"<p>Wiele punktów traci się przez pośpieszne czytanie, nie przez niewiedzę. Przykład: „Kto <b>NIE</b> jest interesariuszem nowego systemu sklepu internetowego?” – klient, dostawca płatności i zarząd mają oczekiwania; serwer to rzecz, więc to on jest odpowiedzią.</p><p>Najtrudniej odrzucić odpowiedzi prawdziwe. <b>Nie na temat</b>: na pytanie o definicję <w k=\"ryzyko\">ryzyka</w> odpowiedź „organizacja powinna zarządzać ryzykiem IT” jest prawdą, ale nie definicją (definicja: połączenie prawdopodobieństwa zdarzenia i jego skutków, s. 93). Sygnał: „powinno”, „należy” w odpowiedzi na „czym jest…”. <b>Zbyt wąskie</b>: „realizacja korzyści” przegrywa z pełnym celem Ładu – korzyściami przy optymalizacji ryzyka i zasobów (s. 14).</p><p>Test: gdy dwie odpowiedzi brzmią dobrze, a jedna zawiera drugą, wybierz pełniejszą. Pytanie kontrolne przy każdej kuszącej opcji: czy to odpowiedź właśnie na to pytanie?</p>"},{"lekcje":["ex-k12-nie-najlepiej","ex-k13-glowny-zawsze"],"pt":"Lekcje 9.12–9.13","h":"Słowo-klucz zmienia zadanie","b":"<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>Słowo</th><th>Co robisz</th></tr><tr><td>NIE</td><td>trzy pasują – zaznacz czwartą</td></tr><tr><td>NAJLEPIEJ</td><td>wybierz najpełniejszą</td></tr><tr><td>GŁÓWNY</td><td>szukaj sedna, nie szczegółu</td></tr><tr><td>ZAWSZE, MUSI, WSZYSTKIE</td><td>sygnał ostrzegawczy – sprawdź z modelem</td></tr></table></div>","c":"Słowa-klucza szukasz, zanim przeczytasz odpowiedzi, a odpowiadasz według modelu COBIT 5, nie swojej firmy.","s":"COBIT 5 Framework (PL), s. 14, 20, 32","ctx":"<p>Ład ocenia potrzeby i warianty, wyznacza kierunek i monitoruje wyniki (EDM). Zarządzanie planuje, buduje, prowadzi i monitoruje działania (PBRM) zgodnie z tym kierunkiem.</p><p><b>Przykład:</b> Ta sama osoba w małej firmie może działać w obu funkcjach, lecz jej mandaty i odpowiedzialności trzeba rozróżnić.</p><p><b>Uwaga:</b> Zarządzanie też podejmuje decyzje, a obie funkcje monitorują. Board/chairperson nie należy automatycznie utożsamiać z polskim zarządem/prezesem.</p><p>Odpowiedź musi być prawdziwa i odpowiadać dokładnie zakresowi pytania. Jej długość ani słowo „zawsze” nie zastępują sprawdzenia sensu.</p>"},{"lekcje":["ex-k14-inna-kategoria","ex-k15-szesc-pulapek"],"pt":"Lekcje 9.14–9.15","h":"Rozumiej pojęcie mimo różnic tłumaczenia","b":"<p>Różne polskie odpowiedniki mogą opisywać to samo pojęcie <w k=\"cobit-5\">COBIT 5</w>. Porównuj znaczenie i angielski termin, a nie samą formę słowa.</p>","c":"Poprawny synonim nie jest sam w sobie błędną odpowiedzią.","s":"COBIT 5 Framework (PL), s. 14, 28, 33","ctx":"<p>Stopień osiągnięcia PA ocenia się jako N 0–15%, P ponad 15–50%, L ponad 50–85%, F ponad 85–100%. Litery dotyczą skali angielskiej. Każdy atrybut ocenia się osobno, bez średniej.</p><p><b>Przykład:</b> 85% oznacza L; dopiero wynik ponad 85% mieści się w F. To stopień osiągnięcia atrybutu, nie odsetek poprawnych dokumentów.</p><p><b>Uwaga:</b> Kursowe tłumaczenie N/C/W/P może pomylić literę P z angielskim Partially. Zawsze określ legendę.</p><p>Ład i nadzór mogą być przekładami governance; metodyka i struktura ramowa przekładami framework. Aktualne brzmienie egzaminu ustala operator.</p>"},{"lekcje":["ex-k16-tempo"],"pt":"Lekcja 9.16","h":"Tempo: dwa przejścia, kontrola, zero pustych pól","b":"<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>Minuty</th><th>Co robisz</th></tr><tr><td>0–25</td><td>pewne od razu, trudne oznacz</td></tr><tr><td>25–35</td><td>wracasz do oznaczonych</td></tr><tr><td>35–40</td><td>puste pola; jeszcze raz NIE i NAJLEPIEJ</td></tr></table></div><p>Nie ma punktów ujemnych – nie zostawiaj pustych odpowiedzi.</p>","c":"Średnio 48 sekund na pytanie wystarczy, jeśli trudne odkładasz na drugie przejście.","s":"Sylabus egzaminu COBIT 5 Foundation","ctx":"<p>2400 sekund na 50 pytań to ok. 48 s, a większość pytań rozwiązuje się w 20–30 s. Plan 25 + 10 + 5 to propozycja kursu, nie przepis. Każde pytanie jest warte tyle samo, więc po około minucie zaznacz najlepszą opcję, oznacz pytanie i idź dalej – inne pytanie często przypomni odpowiedź.</p><p>Puste pole to pewne zero; strzał daje 25%, a po wyeliminowaniu dwóch opcji 50%. „Wszystkie powyższe” nie jest z góry pułapką: odpada dopiero wtedy, gdy choć jedna opcja jest fałszywa albo z innej szuflady. Przećwicz plan na egzaminie próbnym z zegarem.</p>"}],"bankRevision":"4f53cda18c2baa0c","legacySp1Order":[null,null,null,null,null,null,null,null,null,null,null]};</script>
