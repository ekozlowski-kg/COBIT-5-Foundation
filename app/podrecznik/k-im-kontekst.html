<script>window.DECK={"id":"k-im-kontekst","rozdzial":"Rozdział 7 · Wdrożenie · s. 35–39","tytul":"Kontekst wdrożenia, punkty zapalne, zdarzenia wyzwalające","prev":"k-pr-atlas-dss-mea.html","next":"k-im-cykl.html","T":{"cobit-5":{"t":"COBIT 5","eg":"COBIT 5","pd":"COBIT 5","en":"COBIT 5","wyj":"Zbiór sprawdzonych reguł z 2012 roku, jak mądrze decydować o informatyce i nią kierować.\n\nCOBIT 5 (ISACA, 2012) opiera się na 5 zasadach (principles), 7 kategoriach aktywatorów (enablers) i modelu referencyjnym 37 procesów: 5 Ładu w domenie EDM i 32 Zarządzania w domenach APO, BAI, DSS i MEA. Kaskada celów przekłada potrzeby interesariuszy na cele organizacji, cele związane z IT i cele aktywatorów. Integruje wcześniejsze wytyczne ISACA (COBIT 4.1, Val IT, Risk IT) i jest spójny z innymi standardami, np. ITIL i ISO/IEC 27001.\n\nŻeby organizacja mogła mądrze kierować informatyką i nią zarządzać: osiągać korzyści przy rozsądnym ryzyku i zużyciu zasobów. Daje jedną, spójną strukturę ramową zamiast wielu luźnych wskazówek.","zycie":"Rodzina ma coraz więcej sprzętu i kont: telefony, laptop, router, bank, zdjęcia w chmurze. Ustalacie, kto decyduje o zakupach, kto pilnuje haseł i kopii, i co miesiąc sprawdzacie, czy wszystko działa i czy nie przepłacacie. COBIT 5 to taki „regulamin domu” dla informatyki, tylko spisany dla firm i urzędów.","firma":"Właściciel warsztatu kupił program do rezerwacji, kasę online i monitoring, ale nie wie, czy to się opłaca i kto za co odpowiada. COBIT 5 podpowiada, jak to poukładać: kto wyznacza kierunek, kto prowadzi codzienne sprawy, jak mierzyć efekty i ryzyko. To gotowa rama, a nie program do zainstalowania.","urzad":"Burmistrz słyszy, że urząd wydaje na informatykę coraz więcej, a mieszkańcy dalej stoją w kolejkach. Sięga po COBIT 5, żeby ustalić, czego chce od systemów, kto w urzędzie za nie odpowiada i jak co roku sprawdzać, czy przynoszą korzyści. COBIT 5 służy tu do uporządkowania Ładu i Zarządzania IT.","it":"Bank po poważnej awarii bankowości internetowej porządkuje IT według COBIT 5: zarząd przejmuje 5 procesów Ładu (EDM01–EDM05), CIO 32 procesy Zarządzania, np. DSS04 Zarządzanie ciągłością, a audyt wewnętrzny ocenia zdolność procesów.","egz":"Liczby do zapamiętania: 5 zasad, 7 aktywatorów, 37 procesów (EDM 5 + APO 13 + BAI 10 + DSS 6 + MEA 3), 6 poziomów zdolności (0–5). Nie myl z: COBIT 2019 – Nowsza wersja (2018/2019) – inne pojęcia (komponenty, 40 celów, czynniki projektowe). Egzamin COBIT 5 Foundation dotyczy COBIT 5.; ITIL – ITIL to dobre praktyki zarządzania usługami IT – jak dostarczać usługi. COBIT patrzy szerzej: Ład i Zarządzanie całością IT w organizacji.; ISO/IEC 27001 – ISO/IEC 27001 to norma bezpieczeństwa informacji z certyfikacją; COBIT 5 to struktura ramowa Ładu i Zarządzania IT.","src":"COBIT 5 Framework (PL), s. 90"},"punkty-zapalne":{"t":"Punkty zapalne","eg":"Punkty zapalne","pd":"Punkty zapalne","en":"Pain points","wyj":"To, co już boli i wszyscy się skarżą, np. częste awarie albo przekroczone budżety.\n\nPunkty zapalne (pain points) to trwające problemy, np. nieudane projekty, powtarzające się uwagi audytu, ukryte wydatki na IT czy kłopoty z outsourcingiem. Organizacja rozpoznaje je na początku wdrożenia (faza 1 „Jakie są wyznaczniki?”) i wiąże z nimi uzasadnienie biznesowe (business case) oraz cele inicjatywy. Rozwiązanie widocznego problemu daje szybkie korzyści (quick wins) i poparcie kierownictwa.\n\nŻeby problemy, które wszyscy już odczuwają, wykorzystać jako bodziec i argument do rozpoczęcia wdrożenia albo poprawy Ładu i Zarządzania IT.","zycie":"Co miesiąc, tydzień przed wypłatą, konto jest puste i trzeba pożyczać od rodziców. Wszyscy w domu to czują i wszyscy mają dość kłótni o pieniądze. To punkt zapalny – trwający ból, który w końcu skłania do ułożenia domowego budżetu.","firma":"W sklepie internetowym trzeci raz w miesiącu pada strona w czasie promocji, a klienci piszą złe opinie. Do tego firma płaci za dwa programy do faktur, bo każdy wspólnik kupił swój. Te powtarzające się problemy to punkty zapalne – argument, żeby wreszcie uporządkować IT.","urzad":"Audyt wewnętrzny drugi rok z rzędu pisze w raporcie to samo: konta byłych pracowników urzędu gminy nadal mają dostęp do systemów. Wójt ma dość tłumaczenia się radzie. Powtarzające się złe wyniki audytu to klasyczny punkt zapalny.","it":"Audyt trzeci rok z rzędu wskazuje brak przeglądów uprawnień, a dwa działy utrzymują osobne, zdublowane systemy zgłoszeń. Te punkty zapalne uzasadniają inicjatywę wdrożenia, w której organizacja poprawia m.in. DSS05 (Zarządzanie usługami bezpieczeństwa) i APO05 (Zarządzanie portfelem projektów).","egz":"„Zduplikowane projekty”, „ukryte wydatki na IT”, „powtarzające się złe wyniki audytu”, „złożone modele operacyjne IT” → punkty zapalne. „Fuzje i przejęcia” → zdarzenie wyzwalające. Nie myl z: Zdarzenia wyzwalające – Punkt zapalny to TRWAJĄCY problem (ból). Zdarzenie wyzwalające to ZMIANA w otoczeniu (fuzja, nowe przepisy, nowy CIO).","src":"COBIT 5 Framework (PL), s. 36; COBIT 5 Framework (PL), s. 37"},"czynniki-srodowiskowe":{"t":"Czynniki środowiskowe (kontekst organizacji)","eg":"Czynniki środowiskowe (kontekst organizacji)","pd":"Czynniki związane ze środowiskiem wewnętrznym i zewnętrznym","en":"Internal and external environment factors","wyj":"Wszystko wokół, co pomaga albo przeszkadza: przepisy, budżet, nastawienie ludzi, sytuacja w kraju.\n\nPrzed wdrożeniem trzeba uwzględnić czynniki wewnętrzne i zewnętrzne (internal and external environment factors): m.in. etykę i kulturę, przepisy i regulacje, misję i wartości, polityki i praktyki Ładu, plan biznesowy, model operacyjny i poziom dojrzałości, styl zarządzania, apetyt na ryzyko (risk appetite), potencjał i zasoby oraz praktyki branżowe. Od nich zależy, jak duży ma być program, w jakim tempie iść i od czego zacząć.\n\nŻeby każda organizacja dopasowała plan wdrożenia COBIT 5 do własnych warunków, bo Ład i Zarządzanie IT nie odbywają się w próżni.","zycie":"Dwie rodziny chcą wprowadzić domowy budżet. W pierwszej rodzice ustalają wszystko razem i lubią tabelki, w drugiej decyduje jedna osoba, dochody są nieregularne, a każda rozmowa o pieniądzach kończy się kłótnią. Ten sam pomysł trzeba więc wprowadzić u nich zupełnie inaczej. Zwyczaje, sposób decydowania i pieniądze w domu to czynniki środowiskowe.","firma":"Rodzinna piekarnia z jednym laptopem i właścicielem, który decyduje o wszystkim, porządkuje informatykę zupełnie inaczej niż sieć 20 sklepów z działem IT, audytorem i danymi tysięcy klientów karty lojalnościowej. Inna kultura, styl zarządzania, przepisy i budżet oznaczają inny plan. To czynniki środowiskowe, które kształtują plan wdrożenia.","urzad":"Gmina chce uporządkować zarządzanie IT. Musi brać pod uwagę KPA i KRI, styl zarządzania wójta, napięty budżet, dwóch informatyków na cały urząd i to, co sprawdziło się w sąsiednich gminach. Te warunki to czynniki środowiskowe, więc planu nie da się skopiować z korporacji.","it":"Urząd wojewódzki wdraża COBIT 5 inaczej niż prywatna firma: wiążą go przepisy, nadzór ministerstwa i mały dział informatyki, a apetyt na ryzyko przestoju systemów obsługi obywateli jest bardzo niski. Dlatego plan zaczyna od procesu DSS04 Zarządzanie ciągłością, a nie od APO04 Zarządzanie innowacjami.","egz":"Czynnik środowiskowy, który trzeba uwzględnić przy planie wdrożenia, to np. obowiązujące prawa i regulacje, styl zarządzania albo apetyt na ryzyko. „Ukryte wydatki na IT” i „złożone modele operacyjne IT” to punkty zapalne, a „audyt zewnętrzny” to zdarzenie wyzwalające, czyli inne kategorie. Nie myl z: Punkty zapalne – Czynniki środowiskowe to kontekst, który trzeba UWZGLĘDNIĆ. Punkty zapalne to problemy, które WYWOŁUJĄ potrzebę wdrożenia.; Czynnik wpływający na potrzeby interesariuszy – Wyznaczniki zmieniają potrzeby interesariuszy (kaskada). Czynniki środowiskowe to kontekst wdrożenia (IM).","src":"COBIT 5 Framework (PL), s. 35"},"ryzyko":{"t":"Ryzyko","eg":"Ryzyko","pd":"Ryzyko","en":"Risk","wyj":"Coś może pójść źle; liczy się, jak bardzo jest to prawdopodobne i jak bardzo zaboli.\n\nRyzyko to połączenie prawdopodobieństwa zdarzenia i jego konsekwencji. Zaistniałe przerwanie usługi jest incydentem; problem w zarządzaniu usługami oznacza przyczynę jednego lub wielu incydentów. Zdarzenie nie usuwa ryzyka jego nawrotu lub dalszych skutków. Ład ustala apetyt i tolerancję, a Zarządzanie identyfikuje, analizuje i obsługuje ryzyko w tych granicach.\n\nŻeby z wyprzedzeniem widzieć, co może pójść źle i jak bardzo by zaszkodziło, i świadomie decydować, czemu zapobiegać, a co zaakceptować.","zycie":"Planujecie wesele w ogrodzie w lipcu. Deszcz jest dość prawdopodobny, a skutek byłby duży – goście mokną, tort się rozpływa – więc rezerwujecie namiot. Ryzyko to ta możliwość deszczu razem z jej skutkami; jeśli w dniu wesela leje, macie już problem, a nie ryzyko.","firma":"W biurze rachunkowym tylko pani Ewa umie obsługiwać program do płac. Jeśli zachoruje w ostatnim tygodniu miesiąca, pensje u klientów się spóźnią. Szef ocenia, że to mało prawdopodobne, ale bolesne, więc każe przeszkolić drugą osobę – tak wygląda praca z ryzykiem.","urzad":"Nabór wniosków o dopłaty do wymiany pieców w urzędzie gminy zamyka się w piątek o 15:00, a wszystko idzie przez jeden serwer. Awaria akurat w piątek jest mało prawdopodobna, ale skutek byłby fatalny, więc informatyk robi kopię i ma tego dnia dyżur. To ryzyko: możliwość zdarzenia plus jego skutki.","it":"W procesie APO12 (Zarządzanie ryzykiem) dział IT prowadzi rejestr ryzyk: np. „awaria serwerowni” ma ocenione prawdopodobieństwo i skutki. Dla ryzyk powyżej apetytu ustalonego przez Ład w EDM03 (Zapewnienie optymalizacji ryzyka) planuje się działania, np. zapasowe centrum danych.","egz":"Na egzaminie ryzyko pojawia się głównie jako „optymalizacja ryzyka” (cel Ładu) i „apetyt na ryzyko” (czynnik środowiskowy we wdrożeniu). Nie myl z: Issue / problem / incydent – Problem już zaistniał; ryzyko jest możliwością w przyszłości.; Zagrożenie – Zagrożenie to źródło (np. powódź); ryzyko łączy prawdopodobieństwo z konsekwencjami.","src":"COBIT 5 Framework (PL), s. 93"},"zdarzenia-wyzwalajace":{"t":"Zdarzenia wyzwalające","eg":"Zdarzenia wyzwalające","pd":"Zdarzenia inicjujące","en":"Trigger events","wyj":"Iskra, która sprawia, że zmiana rusza teraz, np. nowy szef, kontrola albo nowy przepis.\n\nZdarzenia wyzwalające (trigger events) zachodzą w środowisku wewnętrznym albo zewnętrznym, np. fuzja lub przejęcie, nowe regulacje, istotna zmiana technologii, nowy CEO, CFO lub CIO, audyt zewnętrzny, nowa strategia. Razem z punktami zapalnymi (pain points) pokazują w fazie 1 wdrożenia („Jakie są wyznaczniki?”), że zmiana jest potrzebna. Mogą też być podstawą uzasadnienia biznesowego inicjatywy.\n\nŻeby rozpoznać moment, w którym organizacja ma okazję i powód, by wreszcie zająć się Ładem i Zarządzaniem IT.","zycie":"Przez lata nikt w rodzinie nie myślał o hasłach i kopiach zdjęć. Potem tata przechodzi na emeryturę i zostaje „domowym informatykiem”, a teściowie wprowadzają się do Was z własnymi laptopami. Te zmiany są impulsem, żeby uporządkować domowe IT – to zdarzenia wyzwalające.","firma":"Piekarnia przejmuje sąsiednią cukiernię razem z jej kasami i programem do zamówień. W tym samym roku wchodzi obowiązek e-faktur. Przejęcie i nowe przepisy to zdarzenia wyzwalające, które skłaniają właściciela, żeby wziąć się za IT na poważnie.","urzad":"Do urzędu gminy przychodzi nowy sekretarz, a jednocześnie wchodzi obowiązek e-Doręczeń. Na dodatek audyt zewnętrzny wytyka braki w zabezpieczeniach. Każde z tych wydarzeń to zdarzenie wyzwalające, po którym urząd bierze się za Ład i Zarządzanie IT.","it":"Nowe wymogi prawne to zdarzenie wyzwalające: organizacja uruchamia inicjatywę wdrożenia COBIT 5 od fazy 1. W kolejnych fazach ocenia i usprawnia m.in. MEA03 (Monitorowanie, ocena i oszacowanie zgodności z wymogami zewnętrznymi) i APO13 (Zarządzanie bezpieczeństwem).","egz":"„Fuzje i przejęcia”, „nowe regulacje”, „nowy CIO”, „audyt zewnętrzny”, „istotna zmiana technologii” → zdarzenia wyzwalające. Egzamin: „Zdarzenia wyzwalające”. Podręcznik: „Zdarzenia inicjujące”. Nie myl z: Punkty zapalne – Punkt zapalny to trwający problem. Zdarzenie wyzwalające to zmiana.","src":"COBIT 5 Framework (PL), s. 36; COBIT 5 Framework (PL), s. 37; materiały Altkom"},"kluczowe-czynniki-sukcesu":{"t":"Kluczowe czynniki sukcesu wdrożenia","eg":"Kluczowe czynniki sukcesu wdrożenia","pd":"Kluczowe czynniki sukcesu","en":"Critical success factors for implementation","wyj":"Rzeczy, bez których zmiana się nie uda, np. szef ją popiera, a ludzie rozumieją, po co jest.\n\nCOBIT 5 (s. 35–36) wymienia kluczowe czynniki sukcesu wdrożenia (critical success factors): wytyczne, mandat oraz widoczne i ciągłe wsparcie kierownictwa najwyższego szczebla; zrozumienie celów biznesowych i celów IT przez wszystkie strony; skuteczną komunikację i umożliwienie zmian; dostosowanie COBIT i innych standardów do kontekstu organizacji; skupienie na szybkich korzyściach (quick wins) i priorytetach. Inicjatywy dzieli się na krótkie iteracje, bo długie tracą dynamikę.\n\nŻeby z góry wiedzieć, bez czego wdrożenie Ładu IT zwykle się nie udaje, i zadbać o te warunki, zanim pojawią się kłopoty.","zycie":"Rodzina postanawia, że od września dzieci same sprzątają swoje pokoje. Udaje się, bo rodzice sami pilnują i chwalą, każdy wie, po co to (więcej czasu na wspólne wyjścia), plan omawiacie co niedzielę, zasady są dopasowane do wieku, a pierwsza nagroda – kino – przychodzi już po dwóch tygodniach. Wsparcie z góry, zrozumiały cel, rozmowa, dopasowanie i szybki efekt to kluczowe czynniki sukcesu.","firma":"Właściciel warsztatu wprowadza elektroniczne zlecenia zamiast karteczek. Sam codziennie z nich korzysta, mechanikom tłumaczy, że chodzi o mniej zgubionych części, na porannej odprawie mówi, co się poprawiło, system jest prosty i pasuje do małego warsztatu, a już po miesiącu nikt nie szuka zleceń po szafkach. Tych pięć rzeczy sprawia, że zmiana się przyjmuje.","urzad":"Burmistrz chce uporządkować informatykę w urzędzie według COBIT. Projekt ma szansę, bo burmistrz osobiście otwiera spotkania, naczelnicy rozumieją cel (krótsze kolejki mieszkańców), co miesiąc idzie krótka informacja o postępach, z COBIT wzięto tylko to, co pasuje do małego urzędu, a na start naprawiono najbardziej uciążliwą rzecz – zawieszający się system kancelaryjny. To kluczowe czynniki sukcesu w praktyce.","it":"Program wdrożenia COBIT 5 ma sponsora z zarządu, który co miesiąc pyta o postępy, a pierwszą iterację ogranicza do usprawnienia DSS02 (Zarządzanie zgłoszeniami serwisowymi i incydentami), bo da szybko widoczny efekt. Komunikację i przygotowanie ludzi prowadzi się w BAI05 (Zarządzanie wdrażaniem zmian organizacyjnych).","egz":"Inicjatywy trwające dłużej niż 6 miesięcy grożą utratą dynamiki, koncentracji i akceptacji. Trzeba je dzielić na iteracje (s. 38).","src":"COBIT 5 Framework (PL), s. 36; COBIT 5 Framework (PL), s. 38"}},"S":[{"lekcje":["im-k10-kontekst"],"pt":"Lekcja 3.10","h":"Każda organizacja projektuje własny plan wdrożenia","b":"<p><w k=\"czynniki-srodowiskowe\">Czynniki środowiskowe</w> <span class=\"en\">Internal and external environment factors</span> to warunki, które plan musi uwzględnić:</p><ul><li>wewnątrz: kultura, styl zarządzania, apetyt na <w k=\"ryzyko\">ryzyko</w>, zasoby,</li><li>z zewnątrz: przepisy, praktyki branży.</li></ul>","c":"Odpowiedź „wszyscy wdrażają COBIT 5 według jednego planu” jest zawsze błędna.","s":"COBIT 5 Framework (PL), s. 35","ctx":"<p>Podręcznik: optymalne podejście do Ładu i Zarządzania IT „będzie inne w każdym przedsiębiorstwie”, więc każda organizacja projektuje własny plan wdrożenia lub mapę działań i rozwija aktywatory, które już ma. Lista ma dziesięć pozycji: etyka i kultura; przepisy, regulacje i polityki; misja, wizja i wartości; polityki i praktyki nadzoru; plan biznesowy; model operacyjny i poziom dojrzałości; styl zarządzania; apetyt na ryzyko; potencjał i zasoby; praktyki branży. Podział „wewnątrz / z zewnątrz” jest nasz. Egzamin mówi krótko „czynniki środowiskowe”, podręcznik – „czynniki związane ze środowiskiem wewnętrznym i zewnętrznym”.</p><p>Pułapka: czynnik środowiskowy to stały warunek (może pomagać albo przeszkadzać), punkt zapalny – trwający problem, zdarzenie wyzwalające – nowa zmiana. Przykład: bank z regulatorem i niskim apetytem na ryzyko wdraża ostrożnie i krok po kroku, mały sklep internetowy – szybko, od najważniejszych spraw. Ten sam COBIT 5, dwa różne plany.</p>"},{"pt":"Sprawdź się","quiz":{"id":"q-im-01-02","sylabus":["IM-02-01"],"tresc":"Który element jest w COBIT 5 wymieniony jako przykład czynnika środowiskowego uwzględnianego przy projektowaniu wdrożenia?","opcje":[{"t":"Styl zarządzania w organizacji","ok":true,"w":"Plan wdrożenia dopasowuje się do otoczenia, strategii, ryzyka, kultury i stylu zarządzania. Sukces wspierają widoczne zaangażowanie kierownictwa, własność biznesowa, komunikacja i szybkie korzyści. Wskazana odpowiedź odpowiada właśnie temu elementowi modelu."},{"t":"Zduplikowane projekty IT","ok":false,"w":"Powielające się projekty są wymienionym punktem zapalnym: sygnalizują problem, który może uzasadnić inicjatywę doskonalenia."},{"t":"Fuzja z inną organizacją","ok":false,"w":"Fuzja jest przykładem zdarzenia wyzwalającego zmianę. Po jej wystąpieniu zmienione otoczenie także trzeba uwzględnić."},{"t":"Wyniki oceny zdolności procesów","ok":false,"w":"Wynik oceny jest informacją diagnostyczną przy ustalaniu stanu obecnego. Pytanie dotyczy konkretnego przykładu z listy czynników środowiskowych, nie zakazuje użycia diagnozy do planowania."}],"src":"COBIT 5 Framework (EN), sekcja rozdział 7, Considering the Enterprise Context / Creating the Appropriate Environment","pomoc":{"t":"Pytanie dotyczy lekcji 3.10 „Każda organizacja ma własny plan wdrożenia”. Cel lekcji: Potrafię wskazać czynniki środowiskowe, które organizacja musi uwzględnić w swoim planie wdrożenia COBIT 5.","k":["czynniki-srodowiskowe"]},"kurs":"Plan wdrożenia dopasowuje się do otoczenia, strategii, ryzyka, kultury i stylu zarządzania. Sukces wspierają widoczne zaangażowanie kierownictwa, własność biznesowa, komunikacja i szybkie korzyści. Wskazana odpowiedź odpowiada właśnie temu elementowi modelu.","kontekst":""}},{"lekcje":["im-k11-czynniki-sukcesu"],"pt":"Lekcja 3.11","h":"Pięć kluczowych czynników sukcesu wdrożenia","b":"<p><w k=\"kluczowe-czynniki-sukcesu\">Kluczowe czynniki sukcesu</w> <span class=\"en\">Critical success factors</span>:</p><ol><li>widoczne i <b>ciągłe</b> wsparcie kierownictwa,</li><li>zrozumienie celów biznesowych i celów IT,</li><li>komunikacja i gotowość do zmian,</li><li><b>dostosowanie</b> <w k=\"cobit-5\">COBIT 5</w> do organizacji,</li><li>najpierw <b>szybkie korzyści</b>.</li></ol>","c":"Błędna odpowiedź zwykle odwraca czynnik: jednorazowa decyzja, kopiowanie podręcznika, wszystko naraz.","s":"COBIT 5 Framework (PL), s. 35–36","ctx":"<p>Kierownictwo najwyższego szczebla daje wytyczne i uprawnienia, a jego zaangażowanie jest widoczne i ciągłe – jeden podpis na starcie to za mało. Podręcznik dodaje, że ważne inicjatywy IT często upadają z braku ukierunkowania, wsparcia i nadzoru. Czwarty czynnik to odpowiedź na czynniki środowiskowe (dopasuj, nie kopiuj), piąty każe zaczynać od usprawnień najłatwiejszych i najbardziej opłacalnych.</p><p>Pułapka „odwrócone”: „wystarczy jednorazowa decyzja zarządu” przeczy wsparciu ciągłemu, „stosuj COBIT dokładnie jak w podręczniku” – dostosowaniu, „wdrażaj wszystko naraz” – szybkim korzyściom. Przykład: uczelnia wdraża system ERP – rektor co miesiąc mówi o projekcie na senacie, a zespół zaczyna od elektronicznych wniosków studentów, których efekt widać od razu.</p>"},{"pt":"Sprawdź się","quiz":{"id":"q-im-01-02","sylabus":["IM-02-01"],"tresc":"Który element jest w COBIT 5 wymieniony jako przykład czynnika środowiskowego uwzględnianego przy projektowaniu wdrożenia?","opcje":[{"t":"Zduplikowane projekty IT","ok":false,"w":"Powielające się projekty są wymienionym punktem zapalnym: sygnalizują problem, który może uzasadnić inicjatywę doskonalenia."},{"t":"Styl zarządzania w organizacji","ok":true,"w":"Plan wdrożenia dopasowuje się do otoczenia, strategii, ryzyka, kultury i stylu zarządzania. Sukces wspierają widoczne zaangażowanie kierownictwa, własność biznesowa, komunikacja i szybkie korzyści. Wskazana odpowiedź odpowiada właśnie temu elementowi modelu."},{"t":"Fuzja z inną organizacją","ok":false,"w":"Fuzja jest przykładem zdarzenia wyzwalającego zmianę. Po jej wystąpieniu zmienione otoczenie także trzeba uwzględnić."},{"t":"Wyniki oceny zdolności procesów","ok":false,"w":"Wynik oceny jest informacją diagnostyczną przy ustalaniu stanu obecnego. Pytanie dotyczy konkretnego przykładu z listy czynników środowiskowych, nie zakazuje użycia diagnozy do planowania."}],"src":"COBIT 5 Framework (EN), sekcja rozdział 7, Considering the Enterprise Context / Creating the Appropriate Environment","pomoc":{"t":"Pytanie dotyczy lekcji 3.11 „Kluczowe czynniki sukcesu wdrożenia”. Cel lekcji: Potrafię wymienić kluczowe czynniki sukcesu wdrożenia COBIT 5 i odrzucić odpowiedzi, które im przeczą.","k":["kluczowe-czynniki-sukcesu"]},"kurs":"Plan wdrożenia dopasowuje się do otoczenia, strategii, ryzyka, kultury i stylu zarządzania. Sukces wspierają widoczne zaangażowanie kierownictwa, własność biznesowa, komunikacja i szybkie korzyści. Wskazana odpowiedź odpowiada właśnie temu elementowi modelu.","kontekst":""}},{"lekcje":["im-k12-punkty-zapalne","im-k13-zdarzenia-wyzwalajace"],"pt":"Lekcje 3.12–3.13","h":"Punkt zapalny trwa, zdarzenie wyzwalające właśnie nastąpiło","b":"<p><w k=\"punkty-zapalne\">Punkty zapalne</w> <span class=\"en\">Pain points</span> – trwające problemy. <w k=\"zdarzenia-wyzwalajace\">Zdarzenia wyzwalające</w> <span class=\"en\">Trigger events</span> – nowe zmiany.</p><div class=\"tblwrap\"><table class=\"tbl\"><tr><th>Zdanie</th><th>Kategoria</th></tr><tr><td>obowiązujące przepisy</td><td>czynnik środowiskowy</td></tr><tr><td><b>niespełnione</b> wymagania regulacyjne</td><td>punkt zapalny</td></tr><tr><td><b>nowe</b> wymagania regulacyjne</td><td>zdarzenie wyzwalające</td></tr></table></div>","c":"Rozstrzyga jedno słowo: obowiązujące – warunek, niespełnione – ból, nowe – zmiana.","s":"COBIT 5 Framework (PL), s. 35–37","ctx":"<p>Punkty zapalne to np. regularnie złe wyniki audytu, ukryte wydatki na IT, dublujące się projekty, poważne incydenty, dostawca stale łamiący umowę, złożone modele operacyjne IT. Zaczynanie od nich daje akceptację zmiany, poczucie pilności i szybkie korzyści, a uzasadnienie biznesowe opiera się wtedy na codziennych problemach. Zdarzenia wyzwalające to np. fuzja lub przejęcie, nowe wymagania regulacyjne, istotna zmiana technologii, nowy dyrektor generalny, finansowy lub ds. informatyki (CEO, CFO, CIO), audyt zewnętrzny, nowa strategia. Oba bodźce wracają w fazie 1 cyklu wdrożenia.</p><p>Pułapka nazw: podręcznik pisze „zdarzenia inicjujące” (w fazie 1 nawet „czynniki inicjujące”), egzamin – zdarzenia wyzwalające. Pierwszy raport z audytu zewnętrznego to zdarzenie, te same uwagi powtarzane co roku – już punkt zapalny. Przykład: ubezpieczyciela od lat obowiązuje ustawa o ochronie danych (czynnik), audytor od pół roku wpisuje te same uwagi o kopiach zapasowych (punkt zapalny), a za rok wejdą nowe przepisy o odporności cyfrowej (zdarzenie).</p>"},{"pt":"Sprawdź się","quiz":{"id":"q-fn-w-53","sylabus":["IM-02-02","IM-02-06"],"tresc":"W której fazie cyklu życia wdrożenia COBIT 5 identyfikuje się aktualne punkty zapalne i zdarzenia wyzwalające?","opcje":[{"t":"Faza 3: Dokąd chcemy dojść?","ok":false,"w":"W fazie 3 określa się cel doskonalenia i szuka luk."},{"t":"Faza 2: Gdzie jesteśmy teraz?","ok":false,"w":"W fazie 2 ustala się zakres i ocenia stan obecny."},{"t":"Faza 1: Jakie są wyznaczniki?","ok":true,"w":"S. 38: w fazie 1 identyfikuje się aktualne punkty zapalne i czynniki inicjujące oraz potrzebę zmian."},{"t":"Faza 7: Jak utrzymać motywację do działania?","ok":false,"w":"Faza 7 weryfikuje sukces i wzmacnia potrzebę ciągłego doskonalenia."}],"src":"COBIT 5 Framework (EN), sekcja rozdział 7, Recognising Pain Points and Trigger Events; WWW","pomoc":{"t":"Pytanie dotyczy lekcji 3.12 „Punkty zapalne – problemy, które bolą od dawna”. Cel lekcji: Potrafię rozpoznać punkt zapalny, czyli trwający problem organizacji, i wyjaśnić, po co zaczyna się od niego wdrożenie.","k":["punkty-zapalne"]},"kurs":"S. 38: w fazie 1 identyfikuje się aktualne punkty zapalne i czynniki inicjujące oraz potrzebę zmian.","kontekst":""}},{"pt":"Sprawdź się","quiz":{"id":"q-fn-w-53","sylabus":["IM-02-02","IM-02-06"],"tresc":"W której fazie cyklu życia wdrożenia COBIT 5 identyfikuje się aktualne punkty zapalne i zdarzenia wyzwalające?","opcje":[{"t":"Faza 3: Dokąd chcemy dojść?","ok":false,"w":"W fazie 3 określa się cel doskonalenia i szuka luk."},{"t":"Faza 2: Gdzie jesteśmy teraz?","ok":false,"w":"W fazie 2 ustala się zakres i ocenia stan obecny."},{"t":"Faza 7: Jak utrzymać motywację do działania?","ok":false,"w":"Faza 7 weryfikuje sukces i wzmacnia potrzebę ciągłego doskonalenia."},{"t":"Faza 1: Jakie są wyznaczniki?","ok":true,"w":"S. 38: w fazie 1 identyfikuje się aktualne punkty zapalne i czynniki inicjujące oraz potrzebę zmian."}],"src":"COBIT 5 Framework (EN), sekcja rozdział 7, Recognising Pain Points and Trigger Events; WWW","pomoc":{"t":"Pytanie dotyczy lekcji 3.13 „Zdarzenia wyzwalające – zmiany, które popychają do działania”. Cel lekcji: Potrafię odróżnić zdarzenie wyzwalające od punktu zapalnego i od czynnika środowiskowego.","k":["zdarzenia-wyzwalajace"]},"kurs":"S. 38: w fazie 1 identyfikuje się aktualne punkty zapalne i czynniki inicjujące oraz potrzebę zmian.","kontekst":""}},{"pt":"Arkusz próbny","sp1":"sp1-21","lekcja":"3.13","temat":"Zdarzenia wyzwalające – zmiany, które popychają do działania","k":["zdarzenia-wyzwalajace"]},{"pt":"Arkusz próbny","sp1":"sp1-40","lekcja":"3.13","temat":"Zdarzenia wyzwalające – zmiany, które popychają do działania","k":["zdarzenia-wyzwalajace"]}],"bankRevision":"b4fa252ae741762b","legacySp1Order":[null,null,null,null,null,null,null,{"sp1":"sp1-21"},{"sp1":"sp1-40"}]};</script>
