<script>window.DECK={"id":"k-en-zasady","rozdzial":"Załącznik G · Aktywatory szczegółowo · s. 65–88","tytul":"Zasady, Polityki i Struktury ramowe","prev":"k-pc-iso.html","next":"k-en-procesy.html","T":{"cechy-dobrej-polityki":{"t":"Cechy dobrej polityki: skuteczna, wydajna, nieinwazyjna","eg":"Cechy dobrej polityki: skuteczna, wydajna, nieinwazyjna","pd":"Dobre polityki są: skuteczne, wydajne, nieingerencyjne","en":"Good policy characteristics (effective, efficient, non-intrusive)","wyj":"Dobra reguła działa, nie kosztuje za dużo i ludzie uważają ją za rozsądną.\n\nKażdą politykę sprawdzasz trzema pytaniami. Czy osiąga cel (skuteczna)? Czy robi to bez zbędnych kosztów (wydajna)? Czy ludzie uważają ją za logiczną i jej nie obchodzą (nieinwazyjna)? Brak jednej cechy zwykle psuje pozostałe.\n\nŻeby spisane reguły naprawdę działały, a nie zostały na papierze albo nie były obchodzone.","zycie":"Rodzice chcą, żeby nastolatek wracał bezpiecznie. Reguła „SMS po dotarciu do domu” jest skuteczna, tania i rozsądna. Reguła „telefon co 15 minut” też coś daje, ale męczy wszystkich i syn zaczyna kłamać. Pierwsza jest dobrą polityką, druga jest inwazyjna.","firma":"Hurtownia chce ograniczyć kradzieże z magazynu. Kamera przy wyjściu i comiesięczny spis z natury działają i kosztują rozsądnie. Codzienna rewizja kieszeni każdego pracownika też by zadziałała, ale budzi bunt. Dobra polityka łączy skuteczność, wydajność i nieinwazyjność.","urzad":"Urząd miasta wprowadza politykę czystego biurka. Wersja „chowaj dokumenty z danymi przed wyjściem” jest skuteczna i prosta. Wersja „zero przedmiotów na biurku, także kubków i zdjęć” budzi opór i urzędnicy ją lekceważą. Druga wersja nie jest nieinwazyjna.","it":"W procesie APO13 (Zarządzanie bezpieczeństwem) powstaje polityka haseł. Zespół sprawdza ją pod kątem skuteczności (mniej przejęć kont), wydajności (koszt resetów haseł) i nieinwazyjności (czy użytkownicy nie zapisują haseł na kartkach).","egz":"Trzy cechy dobrej polityki: skuteczna, wydajna, nieinwazyjna. Dystraktory: „ograniczona liczba”, „prosty język”, „wyraża podstawowe wartości” (to ZASADY) oraz „kompleksowa, otwarta i elastyczna” (to STRUKTURY RAMOWE). Egzamin: „nieinwazyjna”. Podręcznik: „nieingerencyjna”. To ta sama cecha (non-intrusive). „Ograniczona liczba” i „prosty język” to cechy ZASAD, a nie polityk. Nie myl z: Zasady, Polityki i Struktury ramowe – Zasady (principles) mają być nieliczne, proste i wyrażać wartości. Polityki mają być skuteczne, wydajne i nieinwazyjne. Struktury ramowe: kompleksowe, otwarte i elastyczne, aktualne, dostępne.; Struktura ramowa polityki – Cechy mówią, JAKA ma być pojedyncza polityka. Struktura ramowa mówi, jakie elementy muszą zostać opisane w ramach struktury polityk (zakres, konsekwencje, wyjątki, kontrola zgodności; s. 68).","src":"COBIT 5 Framework (PL), s. 67; COBIT 5 Framework (PL), s. 67, Ilustracja 28"},"zasady-polityki-struktury":{"t":"Zasady, Polityki i Struktury ramowe","eg":"Zasady, Polityki i Struktury ramowe","pd":"Zasady, polityki i metodyki","en":"Principles, Policies and Frameworks (enabler 1)","wyj":"Spisane reguły i wskazówki, które mówią ludziom, jak mają postępować na co dzień.\n\nTo aktywator 1 (Principles, Policies and Frameworks). Zasady to niewiele prostych zdań o podstawowych wartościach organizacji. Polityki to bardziej szczegółowe wytyczne, jak te zasady stosować; dobra polityka jest skuteczna, wydajna i nieinwazyjna. Struktury ramowe dają strukturę i narzędzia, a polityki realizuje się przede wszystkim przez praktyki procesów.\n\nŻeby przekazać ludziom wytyczne i instrukcje organu Ładu i kierownictwa: co jest ważne, jak postępować na co dzień i z jakich narzędzi korzystać.","zycie":"Rodzice ustalają zasadę domu: „Szanujemy wspólny czas”. Z niej wynika polityka: telefony odkładamy przy kolacji, wyjątek to dyżur pod telefonem w pracy, kto złamie, zmywa naczynia, a w niedzielę sprawdzamy, jak nam idzie. Zasada jest krótka i ogólna, polityka mówi, jak ją stosować.","firma":"Właścicielka sklepu internetowego ma zasadę: „Klient zawsze wie, za co płaci”. Spisuje politykę zwrotów: 14 dni, wyjątek dla rzeczy szytych na zamówienie, raz w miesiącu sprawdza, czy pracownicy jej przestrzegają. Zasada mówi, co jest ważne, polityka – jak to robić.","urzad":"Wójt ogłasza zasadę: „Urząd działa jawnie”. Sekretarz przygotowuje politykę udostępniania informacji publicznej: czego dotyczy, w jakim terminie odpowiadamy, kiedy odmawiamy (np. tajemnica przedsiębiorstwa) i kto pilnuje terminów. Zasada jest krótka, polityka szczegółowa.","it":"APO01 (Zarządzanie metodyką zarządzania IT) obejmuje przekazywanie celów i kierunku zarządzania oraz utrzymywanie polityk IT. Polityka bezpieczeństwa informacji z APO13 (Zarządzanie bezpieczeństwem) działa dopiero wtedy, gdy realizują ją praktyki procesów, np. w DSS05 (Zarządzanie usługami bezpieczeństwa).","egz":"Na egzaminie: zasady = podstawowe wartości (mało, prosto); polityki = szczegółowe wytyczne stosowania zasad; struktury ramowe = otwarte i elastyczne. Cechy dobrej polityki: skuteczna, wydajna, nieinwazyjna. Najważniejszy nośnik wykonywania polityk to praktyki procesu. Egzamin: „Zasady, Polityki i Struktury ramowe” (czasem „modele ramowe”). Podręcznik: „Zasady, polityki i metodyki”. „Zasady” w tym aktywatorze (principles organizacji) ≠ 5 zasad COBIT 5. Nie myl z: Pięć zasad COBIT 5 – Pięć zasad COBIT 5 to fundament samej metodyki. Zasady w aktywatorze 1 to wartości TWOJEJ organizacji.; Procedura – Procedura opisuje kroki. Polityka mówi, co i dlaczego ma obowiązywać.","src":"COBIT 5 Framework (PL), s. 67; COBIT 5 Framework (PL), s. 67, Ilustracja 28; COBIT 5 Framework (PL), s. 68"},"struktury-organizacyjne":{"t":"Struktury organizacyjne","eg":"Struktury organizacyjne","pd":"Struktury organizacyjne","en":"Organisational Structures (enabler 3)","wyj":"Zespoły, komisje i stanowiska, które podejmują decyzje, np. narada kierownictwa czy komisja przetargowa.\n\nStruktury organizacyjne (organisational structures) to kluczowe jednostki decyzyjne, np. zarząd, komitet ds. strategii IT czy komitet sterujący. Każda ma mandat, skład i zasady działania, a dobre praktyki obejmują też zakres kontroli (span of control), poziom uprawnień (level of authority), delegowanie uprawnień i procedury eskalacji. Wynikiem ich pracy są decyzje, a tabele RACI łączą je z praktykami procesów.\n\nŻeby było wiadomo, które zespoły i gremia podejmują jakie decyzje, z jakim umocowaniem i według jakich zasad.","zycie":"Trójka rodzeństwa opiekuje się starszym tatą i umawia się: każdy wydatek powyżej 1000 zł na leczenie czy remont jego mieszkania zatwierdzają we trójkę, na rozmowie w niedzielę. Drobne zakupy robi ten, kto akurat jest u taty. Ta niedzielna „rada” to struktura organizacyjna – ma skład, mandat i zasady podejmowania decyzji.","firma":"W rodzinnej stolarni powstaje komitet inwestycyjny: właściciel, jego córka i księgowa. Raz w miesiącu decydują o zakupach maszyn powyżej 20 tys. zł, a mniejsze wydatki zatwierdza sam kierownik warsztatu. Komitet to struktura organizacyjna z określonym zakresem uprawnień.","urzad":"Wójt zarządzeniem powołuje komisję przetargową do zakupu komputerów dla szkół. Zarządzenie mówi, kto w niej zasiada, co ocenia i kiedy kończy pracę – po podpisaniu umowy. To struktura organizacyjna z mandatem i cyklem życia.","it":"Komitet sterujący programu wdrożenia nowego systemu zatwierdza zmiany zakresu i budżetu w procesie BAI01 (Zarządzanie programami i projektami), a sprawy przekraczające jego uprawnienia eskaluje do komitetu ds. strategii IT. To aktywator „Struktury organizacyjne” w działaniu: mandat, poziom uprawnień i eskalacja.","egz":"Produkt działań struktury to decyzje. Pytania o „zasady operacyjne”, „zakres kontroli”, „poziom uprawnień”, „delegowanie” i „eskalację” dotyczą tego aktywatora. Nie myl z: Role i struktury organizacyjne – Struktura to jednostka (np. komitet), a rola to funkcja osoby (np. CIO). Ilustracja 33 zawiera i jedne, i drugie.","src":"COBIT 5 Framework (PL), s. 27; COBIT 5 Framework (PL), s. 75, Ilustracja 32"},"kultura-etyka-zachowanie":{"t":"Kultura, Etyka i Zachowanie","eg":"Kultura, Etyka i Zachowanie","pd":"Kultura, etyka i zachowanie","en":"Culture, Ethics and Behaviour (enabler 4)","wyj":"Jak ludzie naprawdę się zachowują, gdy nikt nie patrzy, i co uważają za uczciwe.\n\nAktywator obejmuje trzy poziomy: etykę organizacyjną (organisational ethics: wartości, według których organizacja chce działać), etykę indywidualną (individual ethics: osobiste wartości pracownika) i zachowania indywidualne (individual behaviour), które razem tworzą kulturę. Pożądane zachowania wspiera się dobrymi praktykami: komunikowaniem wartości, przykładem kierownictwa i osobami wspierającymi (champions), zachętami i środkami zniechęcającymi oraz regułami i normami. Ważnym mechanizmem komunikowania wartości są zasady i polityki.\n\nŻeby zasady, procesy i decyzje naprawdę były stosowane, bo bez odpowiednich zachowań ludzi najlepsze procedury zostają na papierze.","zycie":"Rodzice zakazują telefonów przy stole, ale sami co chwilę zerkają w ekran. Po tygodniu dzieci robią to samo, bo bardziej patrzą na przykład niż na zakaz. Kultura i zachowanie biorą się z tego, co ludzie widzą u innych, zwłaszcza u tych „na górze”.","firma":"Właściciel firmy robiącej strony internetowe płaci premie tylko za oddanie projektu w terminie. Programiści szybko uczą się pomijać testy, bo za błędy nikt nie rozlicza, a za spóźnienie tak. Zachęty ukształtowały zachowanie – to właśnie aktywator Kultura, Etyka i Zachowanie (podobny przypadek opisuje Przykład 11 w podręczniku).","urzad":"W urzędzie gminy kierownik za każdy błąd robi publiczną awanturę. Urzędniczka, która przez pomyłkę wysłała dane mieszkańca pod zły adres, nikomu o tym nie mówi, więc nikt nie reaguje na czas. Procedura zgłaszania incydentów istnieje, ale kultura obwiniania sprawia, że jest martwa.","it":"W DSS03 (Zarządzanie problemami) zespół analizuje awarie bez szukania winnych, więc informatycy zgłaszają także własne pomyłki. Zachowanie „uczymy się zamiast obwiniać” należy do aktywatora Kultura, Etyka i Zachowanie i decyduje, czy proces dostaje prawdziwe dane.","egz":"„Wartości, w oparciu o które organizacja chce działać” → etyka organizacyjna. Dobra praktyka promowania zachowań → np. wskazywanie czempionów (osób wspierających), komunikacja, zachęty, reguły i normy. Mechanizm komunikowania wartości i pożądanego zachowania → zasady i polityki. Nie myl z: Etyka organizacyjna vs indywidualna – Organizacyjna to wartości, w oparciu o które ORGANIZACJA chce działać. Indywidualna to osobiste wartości pracownika (religia, pochodzenie, doświadczenia).","src":"COBIT 5 Framework (PL), s. 79; COBIT 5 Framework (PL), s. 79, Ilustracja 34; COBIT 5 Framework (PL), s. 80"},"proces":{"t":"Proces","eg":"Proces","pd":"Proces","en":"Process","wyj":"Coś, co robimy regularnie i zawsze w podobny sposób, np. przyjmowanie każdego zgłoszenia.\n\nProces (process) przyjmuje wejścia (inputs), przetwarza je przez praktyki i działania ukierunkowane przez polityki i procedury i daje wyniki (outputs), np. produkt albo usługę. Ma właściciela, role i mierniki, a wynik jednego procesu bywa wejściem innego. W COBIT 5 procesy są jednym z siedmiu aktywatorów, a Referencyjny Model Procesu opisuje ich 37.\n\nŻeby powtarzalną pracę wykonywać za każdym razem tak samo dobrze, niezależnie od tego, kto ją akurat robi, i żeby dało się ją mierzyć i poprawiać.","zycie":"Co sobotę rano sprawdzasz lodówkę, piszesz listę, jedziesz do sklepu, rozpakowujesz i odhaczasz, czego zabrakło. Za tydzień wszystko powtarza się od nowa. To proces: stałe kroki, wejście (pusta lodówka i lista) i wynik (pełna lodówka).","firma":"W sklepie internetowym z herbatą przychodzi zamówienie, pracownik pakuje paczkę, drukuje etykietę i fakturę, a kurier odbiera paczki o 15:00. Tak samo dzieje się z każdym zamówieniem, codziennie. To proces – powtarzalny, z wejściem (zamówienie) i wynikiem (paczka u klienta).","urzad":"Do urzędu gminy wpływa wniosek o wycinkę drzewa. Kancelaria go rejestruje, kierownik przydziela go referentowi, ten jedzie na oględziny i wydaje decyzję. Każdy kolejny wniosek idzie tą samą ścieżką – to jest proces.","it":"DSS02 (Zarządzanie zgłoszeniami serwisowymi i incydentami) to proces: każde zgłoszenie (wejście) jest rejestrowane, klasyfikowane, rozwiązywane i zamykane (praktyki), a wynikiem jest przywrócona usługa i wpis w rejestrze. Działa codziennie i tak samo dla każdego zgłoszenia.","egz":"Opis „zbiór praktyk ukierunkowanych politykami i procedurami, który przetwarza wejścia w wyniki” to Proces (Załącznik H). Nie myl z: Projekt – Projekt jest jednorazowy, ma początek i koniec (np. wdrożenie systemu). Proces trwa i się powtarza (np. obsługa zgłoszeń w tym systemie).","src":"COBIT 5 Framework (PL), s. 93"},"cykl-zycia-polityki":{"t":"Cykl życia polityki","eg":"Cykl życia polityki","pd":"Cykl życia polityki","en":"Policy life cycle","wyj":"Reguła rodzi się, działa, jest sprawdzana, poprawiana, a w końcu wyrzucana, gdy przestaje pasować.\n\nPolityka przechodzi fazy jak każdy aktywator: planowanie, projekt, wdrożenie, stosowanie, ocena, aktualizacja albo wycofanie. Polityki trzeba regularnie przedłużać lub aktualizować. Przy zmianie trzeba poinformować ludzi i usunąć stare wersje.\n\nŻeby polityka nie zestarzała się po cichu i żeby ludzie zawsze mieli pod ręką aktualną wersję.","zycie":"Gdy dziecko idzie do przedszkola, rodzice ustalają regułę: bajka tylko po kolacji. Po roku dziecko idzie do szkoły i reguła przestaje pasować, więc ją zmieniacie: bajka po odrobieniu lekcji. Starą kartkę zdejmujecie z lodówki, żeby nikt się na nią nie powoływał.","firma":"Kwiaciarnia ma starą politykę zwrotów. Właścicielka raz w roku ją przegląda i skraca termin z 7 do 3 dni, bo kwiaty szybko więdną. Nową wersję wiesza przy kasie, a starą usuwa z folderu, żeby sprzedawczynie nie drukowały złej.","urzad":"Urząd gminy ma politykę haseł sprzed lat, która każe je zmieniać co 30 dni. Przy przeglądzie informatyk proponuje dłuższe hasła i rzadsze zmiany. Sekretarz zatwierdza nową wersję, ogłasza ją w intranecie (wewnętrznej stronie urzędu) i archiwizuje starą.","it":"Polityka bezpieczeństwa informacji w procesie APO13 ma datę przeglądu. Po wdrożeniu chmury zespół aktualizuje ją, ogłasza zmiany i archiwizuje poprzednią wersję, żeby nikt nie korzystał z nieaktualnych reguł.","egz":"Polityki mają cykl życia i muszą być regularnie aktualizowane. Odpowiedź „raz zatwierdzona polityka obowiązuje bez zmian” jest błędna. Ważne: świadomość zmian, dostęp do najnowszej wersji, archiwizacja starych. Nie myl z: Cykl życia aktywatora – Cykl życia aktywatora to ogólny wzór faz dla każdego aktywatora. Cykl życia polityki to ten wzór zastosowany do polityki, z naciskiem na aktualność.; Struktura ramowa polityki – Struktura mówi, gdzie polityka leży i co zawiera. Cykl życia mówi, jak polityka zmienia się w czasie.","src":"COBIT 5 Framework (PL), s. 68; COBIT 5 Framework (PL), s. 67, Ilustracja 28"},"polityka":{"t":"Polityka","eg":"Polityka","pd":"Polityka","en":"Policy","wyj":"Spisane reguły: co wolno, czego nie wolno, kogo to dotyczy i co grozi za złamanie.\n\nKierownictwo formalnie zatwierdza politykę (policy), czyli szczegółowe wytyczne, jak w praktyce stosować zasady (principles). Polityka musi być dostępna dla interesariuszy, a dobra polityka jest skuteczna, wydajna i nieinwazyjna. Ma cykl życia: powstaje, jest stosowana, przeglądana i aktualizowana. W COBIT 5 należy do aktywatora „Zasady, Polityki i Struktury ramowe”.\n\nŻeby ogólne zasady organizacji przełożyć na konkretne reguły postępowania, które każdy zna i stosuje w codziennej pracy.","zycie":"Rodzice mają ogólną zasadę: dzieci uczą się rozsądnie wydawać pieniądze. Żeby to działało, wieszają na lodówce kartkę: 50 zł kieszonkowego co poniedziałek, bez zaliczek, za skoszenie trawy dodatkowe 20 zł. Ta kartka to polityka – przekłada ogólną zasadę na konkretne reguły.","firma":"Właściciel biura rachunkowego powtarza: „dane klientów chronimy”. Pracownicy dostają od niego jedną stronę reguł: hasło co najmniej 12 znaków, blokada ekranu przy odejściu od biurka, żadnych plików klientów na prywatnym pendrivie. To polityka – szczegółowa, zatwierdzona przez szefa i dostępna dla każdego.","urzad":"Wójt zatwierdza politykę bezpieczeństwa informacji urzędu: kto ma dostęp do których rejestrów, jak zgłosić zgubiony telefon służbowy, jak niszczyć wydruki z danymi. Urzędnicy mają ją w intranecie, a raz w roku sekretarz ją przegląda i aktualizuje. Tak działa polityka: spisana przez kierownictwo, znana wszystkim i żywa.","it":"W procesie APO13 (Zarządzanie bezpieczeństwem) kierownictwo zatwierdza politykę bezpieczeństwa informacji z konkretnymi regułami, np. o hasłach, dostępie zdalnym i klasyfikacji danych. Przekłada ona zasady bezpieczeństwa organizacji na codzienne postępowanie i jest częścią aktywatora „Zasady, Polityki i Struktury ramowe”.","egz":"Cechy dobrej polityki: skuteczna, wydajna, nieinwazyjna. Odpowiedzi typu „inwazyjna”, „ograniczona liczbowo” (to cecha ZASAD) czy „wyraża główne wartości” (też ZASADY) są błędne. Nie myl z: Zasady, Polityki i Struktury ramowe – Polityka to element aktywatora 1, a nie cały aktywator.","src":"COBIT 5 Framework (PL), s. 92; COBIT 5 Framework (PL), s. 67"},"organ-ladu":{"t":"Organ Ładu i nadzoru","eg":"Organ Ładu i nadzoru","pd":"Organ nadzorujący","en":"Governing body","wyj":"Szef albo grupa na samej górze, np. zarząd, rada nadzorcza czy dyrektor urzędu, którzy decydują o kierunku.\n\nNa Ilustracji 9 właściciele i interesariusze delegują (delegate) uprawnienia organowi Ładu (governing body), a ten jest przed nimi rozliczany (accountable). Organ Ładu wyznacza kierunek (set direction) kierownictwu (management). Kierownictwo instruuje i dopasowuje (instruct and align) role operacyjne, które raportują (report) do kierownictwa (FW-PL s. 24, Il. 9). Strzałka monitorowania (monitor) łączy kierownictwo z organem Ładu; według uzasadnień egzaminacyjnych to kierownictwo odpowiada wykonawczo za monitorowanie. Sam organ Ładu też monitoruje, ale wyniki względem kierunku, który wyznaczył (EDM).\n\nŻeby było jasne, kto w imieniu właścicieli i interesariuszy sprawuje Ład: wyznacza kierunek kierownictwu i odpowiada za wyniki.","zycie":"Właściciele mieszkań na zebraniu wspólnoty wybierają zarząd i powierzają mu dbanie o budynek. Zarząd wyznacza kierunek – w tym roku dach – i każe administratorowi to załatwić, a administrator raportuje postępy. Na następnym zebraniu zarząd rozlicza się przed właścicielami: to on jest organem Ładu.","firma":"Właściciele rodzinnej sieci piekarni powołują radę, która raz na kwartał ustala, dokąd firma zmierza: otwieramy dwa nowe punkty, nie wchodzimy w catering. Dyrektor zarządzający dostaje ten kierunek i sam układa plan, a rada sprawdza wyniki i odpowiada przed właścicielami. Ta rada to organ Ładu.","urzad":"Mieszkańcy w wyborach powierzają radzie gminy pilnowanie spraw gminy. Rada uchwala strategię i budżet, wyznacza kierunek wójtowi i urzędowi, a potem rozlicza ich z wykonania; sama odpowiada przed mieszkańcami przy kolejnych wyborach. W tej scenie rada gminy pełni rolę organu Ładu.","it":"Zarząd jako organ Ładu w EDM01 (Zapewnienie i utrzymanie ładu korporacyjnego) ustala zasady podejmowania decyzji o IT, a w EDM05 (Zapewnienie przejrzystości dotyczącej interesariuszy) raportuje udziałowcom i regulatorom, jak IT realizuje cele. Plany i kierowanie pracą zespołów zostawia kierownictwu IT (APO, BAI, DSS, MEA).","egz":"Według uzasadnień egzaminacyjnych organ Ładu i nadzoru jest odpowiedzialny decyzyjnie (rozliczany) i wyznacza kierunek. Za monitorowanie osiągania celów odpowiada wykonawczo kierownictwo. Egzamin: „Organ Ładu i nadzoru”. Podręcznik: „Organ nadzorujący”. Nie myl z: Kierownictwo (management) – Kierownictwo realizuje kierunek, instruuje i dopasowuje role operacyjne i odpowiada wykonawczo za monitorowanie osiągania celów; organ Ładu wyznacza kierunek i jest rozliczany przed interesariuszami.","src":"COBIT 5 Framework (PL), s. 24, Ilustracja 9"},"dzialanie-procesu":{"t":"Działania","eg":"Działania","pd":"Działania","en":"Activities","wyj":"Konkretne kroki, które trzeba wykonać, żeby duży punkt planu został zrobiony.\n\nDziałania to konieczne i wystarczające kroki do realizacji praktyki. Uwzględniają wejścia i wyjścia oraz ułatwiają przypisanie ról. Nie są normatywne, więc organizacja przerabia je na własne procedury. Gdy są za ogólne, dokłada się szczegółowe działania z innych standardów.\n\nŻeby rozpisać praktykę na konkretne kroki, przy których łatwo wskazać, kto co robi i co wchodzi oraz wychodzi.","zycie":"Praktyka: „Przygotuj dziecko do szkoły”. Działania: kup podręczniki, podpisz zeszyty, sprawdź plan lekcji. To wystarczy, żeby praktyka była wykonana. Każda rodzina zrobi to po swojemu i to jest w porządku.","firma":"W warsztacie samochodowym praktyka brzmi: „Przyjmij auto do naprawy”. Działania: spisz usterki z klientem, zrób zdjęcia, ustal termin, wydaj potwierdzenie. Właściciel zamienia je na własną kartę przyjęcia z rubrykami. Działania z wzoru stały się procedurą warsztatu.","urzad":"W urzędzie praktyka brzmi: „Zarządzaj uprawnieniami użytkowników”. Działania to: przyjmij wniosek kierownika, nadaj dostęp, raz w roku przejrzyj listę. Informatyk dopisuje do nich szczegóły z normy ISO 27001 (międzynarodowej normy o bezpieczeństwie informacji) – to już szczegółowe działania.","it":"W DSS02 działania pod praktyką rejestrowania incydentów obejmują zapisanie zgłoszenia, klasyfikację i nadanie priorytetu. Zespół uzupełnia je szczegółowymi działaniami z ITIL (szczegóły procesu: uproszczenie kursu).","egz":"Działania: konieczne i wystarczające kroki, uwzględniają wejścia i wyjścia, ułatwiają wyznaczenie ról, nie są normatywne. Dystraktor „są obowiązkowe dla każdej organizacji” jest fałszywy. Nie myl z: Praktyka nadzoru / zarządzania – Praktyka to ogólny wymóg (CO). Działania to kroki do jej realizacji (JAK).; Procedura – Działania COBIT 5 nie są normatywne. Procedura to konkretna, obowiązująca wersja działań, napisana przez organizację.","src":"COBIT 5 Framework (PL), s. 89; COBIT 5 Framework (PL), s. 70"},"struktura-ramowa-polityki":{"t":"Struktura ramowa polityki","eg":"Struktura ramowa polityki","pd":"Struktura polityk / metodyka dotycząca polityk","en":"Policy framework (scope and validity, consequences of non-compliance, exception handling, compliance monitoring)","wyj":"Segregator na wszystkie reguły: każda ma swoje miejsce, a cały segregator mówi, kogo reguły dotyczą, co grozi i jakie są wyjątki.\n\nPolityki układa się w hierarchię, w której każda odwołuje się do zasad organizacji. W ramach struktury polityk opisuje się zakres i ważność, konsekwencje złamania, obsługę wyjątków i sposób kontroli zgodności (s. 68: wymóg dotyczy struktury polityk). Treść dopasowuje się do apetytu na ryzyko.\n\nŻeby polityki nie leżały luzem, nie przeczyły sobie i żeby struktura polityk opisywała komplet: zakres, konsekwencje, wyjątki i kontrolę.","zycie":"Rodzina ma segregator „Zasady domu”. Kartka o kieszonkowym mówi: dotyczy dzieci od 10 lat (zakres), za kłamstwo tydzień bez kieszonkowego (konsekwencje), w urodziny wolno wziąć zaliczkę (wyjątek), w niedzielę tata sprawdza skarbonki (kontrola). Każda kartka w segregatorze ma ten sam układ.","firma":"Sieć trzech kawiarni zbiera regulaminy w jednym folderze. Polityka napiwków mówi, kogo dotyczy, co grozi za ukrywanie napiwków, kiedy wolno podzielić je inaczej i kto co tydzień sprawdza rozliczenie. Nowa polityka o mediach społecznościowych trafia do tego samego folderu, w tym samym układzie.","urzad":"Starostwo porządkuje zarządzenia o informatyce. Każde ma teraz te same punkty: zakres, sankcje, tryb udzielania wyjątków i sposób kontroli. Zarządzenie o przenośnych pamięciach (pendrive'ach) odwołuje się do zasady „chronimy dane mieszkańców” i ma swoje miejsce w spisie polityk bezpieczeństwa.","it":"Proces APO01 (Zarządzanie metodyką zarządzania IT) utrzymuje aktywatory, w tym polityki IT, i dba o zgodność z nimi. To tu zespół IT pilnuje, żeby każda polityka miała swoje miejsce w spisie i komplet czterech elementów (szczegóły procesu: uproszczenie kursu).","egz":"Struktura polityk musi opisywać: zakres i ważność, konsekwencje niezgodności, obsługę wyjątków, sposób monitorowania zgodności. Dystraktory: „podstawowe wartości” (zasady), „tabela RACI” (opis procesu), „autor polityki”. Framework egzamin tłumaczy jako „struktura ramowa”, a podręcznik jako „metodyka” albo „struktura”. Pierwszy element podręcznik nazywa „zakres i prawidłowość” (scope and validity). W materiałach kursu spotkasz też „zakres i ważność”. Nie myl z: Struktura ramowa – Struktura ramowa (framework) w ogólnym sensie to np. sam COBIT 5. Struktura ramowa polityki to dobra praktyka porządkowania polityk w jednej organizacji.; Cechy dobrej polityki: skuteczna, wydajna, nieinwazyjna – Cechy (skuteczna, wydajna, nieinwazyjna) oceniają jakość polityki. Struktura mówi, jakie elementy polityka musi zawierać.; Cykl życia polityki – Struktura porządkuje polityki w przestrzeni (gdzie która leży). Cykl życia porządkuje je w czasie (od projektu do wycofania).","src":"COBIT 5 Framework (PL), s. 68"},"struktura-ramowa":{"t":"Struktura ramowa","eg":"Struktura ramowa","pd":"Metodyka","en":"Framework","wyj":"Gotowy, uporządkowany zbiór reguł i dobrych praktyk, z którego korzystamy zamiast wymyślać od zera.\n\nStruktura ramowa (framework) daje model, pojęcia, zasady, role i dobre praktyki, ale nie szczegółową instrukcję krok po kroku. Organizacja dostosowuje ją do swojej wielkości i potrzeb. COBIT 5 jest strukturą ramową dla Ładu i Zarządzania IT w organizacji i łączy w jedną całość inne standardy i struktury, np. ITIL i ISO/IEC 27001.\n\nŻeby organizacja nie wymyślała od zera, jak podejść do złożonego obszaru, tylko korzystała z gotowego, sprawdzonego zestawu pojęć, zasad i praktyk i dopasowywała go do siebie.","zycie":"Dietetyk daje Ci zasadę talerza: połowa warzywa, ćwierć białko, ćwierć węglowodany. Nie mówi, co jutro zjesz – to układasz sam, pod swoje smaki i portfel. Zasada talerza to struktura ramowa, a Twój plan posiłków to już jej dopasowanie do siebie.","firma":"Właściciel otwiera kawiarnię we franczyzie i dostaje księgę standardów: wygląd lokalu, receptury, sposób obsługi gości. Grafik pracy i lokalnych dostawców ustala już sam. Księga to rama, w której dopasowuje szczegóły do swojego miasta.","urzad":"Dyrektor szkoły dostaje standardy kontroli zarządczej dla sektora finansów publicznych. Mówią, co ma być pod kontrolą – cele, ryzyka, dokumentacja – ale nie mówią, jak dokładnie prowadzić rejestr ryzyk w tej szkole. To struktura ramowa: wspólna dla wszystkich jednostek, a szczegóły ustala szkoła.","it":"Organizacja przyjmuje COBIT 5 jako strukturę ramową i w procesie APO01 (Zarządzanie metodyką zarządzania IT) ustala, jak wpiąć w nią ITIL dla obsługi usług i ISO/IEC 27001 dla bezpieczeństwa. Zgodnie z zasadą 3 powstaje jeden spójny system zamiast kilku osobnych.","egz":"W pytaniach: „Zastosowanie Pojedynczej Zintegrowanej Struktury Ramowej” (Zasada 3), „Zasady, Polityki i Struktury ramowe” (aktywator 1). Egzamin: „Struktura ramowa”. Podręcznik: „Metodyka”. EN: Framework. „COBIT 5 jest zintegrowaną strukturą ramową” = „COBIT 5 jest zintegrowaną metodyką”. Nie myl z: Norma / standard (np. ISO/IEC 27001) – Norma ma wymagania, z którymi można certyfikować zgodność. COBIT 5 jest strukturą ramową – nie certyfikuje się organizacji „na COBIT”.; Procedura – Procedura to szczegółowy przepis wykonania; struktura ramowa jest ogólniejsza.","src":"COBIT 5 Framework (PL), s. 91; materiały Altkom"}},"S":[{"lekcje":["en-k10-po-co-zasady-polityki","en-k11-zasada-a-polityka"],"pt":"Lekcje 2.10–2.11","h":"Zasada mówi, co cenimy; polityka – jak to robimy","b":"<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>Warstwa<\/th><th>Co mówi<\/th><\/tr><tr><td><b>Zasada<\/b><\/td><td>co cenimy – mało, prostym językiem<\/td><\/tr><tr><td><b><w k=\"polityka\">Polityka<\/w><\/b><\/td><td>jak to stosujemy na co dzień<\/td><\/tr><tr><td><b><w k=\"struktura-ramowa\">Struktura ramowa<\/w><\/b><\/td><td>jak wszystko się łączy<\/td><\/tr><\/table><\/div><p><w k=\"cechy-dobrej-polityki\">Dobra polityka<\/w>: <b>skuteczna, wydajna, nieinwazyjna<\/b>.<\/p>","c":"Pierwszy aktywator to mechanizm komunikacji: przekłada pożądane zachowanie na praktyczne wytyczne.","s":"COBIT 5 Framework (PL), s. 27, 67–68","ctx":"<p><w k=\"zasady-polityki-struktury\">Zasady, Polityki i Struktury ramowe<\/w> (<span class=\"en\">Principles, Policies and Frameworks<\/span>) to według podręcznika mechanizm komunikacji, którym <w k=\"organ-ladu\">Organ Ładu i nadzoru<\/w> i kierownictwo przekazują ludziom wytyczne. Zasad ma być niewiele i mają wyrażać podstawowe wartości. <w k=\"polityka\">Polityki<\/w> (<span class=\"en\">Policies<\/span>) podają szczegóły ich stosowania. Struktura ramowa porządkuje całość. Sam COBIT 5 jest przykładem takiej struktury.<\/p><p>Pułapki. Podręcznik pisze „zasady, polityki i metodyki” i „nieingerencyjne”, a egzamin – „Struktury ramowe” i „nieinwazyjne”. „Zasady” w nazwie aktywatora to wartości Twojej organizacji, a nie pięć zasad COBIT 5. Cechy się nie mieszają. „Ograniczona liczba” opisuje zasady. „Skuteczna i wydajna” opisuje polityki. „Kompleksowa, otwarta i elastyczna, aktualna, dostępna” opisuje strukturę ramową. Skuteczna znaczy, że polityka osiąga cel. Wydajna – że robi to najmniejszym kosztem. Nieinwazyjna – że ludziom wydaje się logiczna.<\/p><p>Przykład: bank każe zmieniać hasło co tydzień. Pracownicy zapisują hasła na karteczkach. Polityka budzi opór, więc nie jest nieinwazyjna, i w efekcie przestaje być skuteczna. Surowsza polityka nie zawsze jest lepsza.<\/p>"},{"pt":"Sprawdź się","quiz":{"id":"q-enk-10-3","sylabus":["EN-02-01"],"tresc":"Jak COBIT 5 opisuje rolę <b>zasad i polityk<\/b>?","opcje":[{"t":"Mechanizmy komunikacji, które przekazują wytyczne organu Ładu i kierownictwa","ok":true,"w":"Dobrze. Tak mówi podręcznik na s. 67."},{"t":"Zbiór zachowań indywidualnych i zbiorowych w organizacji","w":"Tak COBIT 5 opisuje Kulturę, Etykę i Zachowanie."},{"t":"Kluczowe jednostki odpowiedzialne za podejmowanie decyzji w organizacji","w":"Tak COBIT 5 opisuje Struktury organizacyjne."},{"t":"Uporządkowany zbiór praktyk i działań, który przetwarza dane wejściowe w wyniki","w":"To opis aktywatora Procesy."}],"src":"COBIT 5 Framework (PL), s. 67","pomoc":{"t":"Pytanie dotyczy lekcji 2.10 „Aktywator 1 – po co są Zasady, Polityki i Struktury ramowe”. Cel lekcji: Potrafię powiedzieć, po co organizacji pierwszy aktywator i czym różnią się jego trzy warstwy.","k":["zasady-polityki-struktury"]}}},{"pt":"Sprawdź się","quiz":{"id":"q-enk-11-3","sylabus":["EN-02-02","EN-02-03"],"tresc":"Które kryteria COBIT 5 stawia <b>zasadom<\/b> organizacji?","opcje":[{"t":"Kompleksowe, otwarte i elastyczne, aktualne oraz dostępne","w":"To cechy struktur ramowych (metodyk)."},{"t":"Ograniczona liczba, prosty język i podstawowe wartości","ok":true,"w":"Dobrze. Tak opisuje zasady podręcznik na s. 67."},{"t":"Szczegółowe wytyczne stosowania w praktyce","w":"Tak opisuje się polityki, a nie zasady."},{"t":"Skuteczne, wydajne i nieinwazyjne","w":"To cechy dobrych polityk."}],"src":"COBIT 5 Framework (PL), s. 67","pomoc":{"t":"Pytanie dotyczy lekcji 2.11 „Zasada a polityka – i trzy cechy dobrej polityki”. Cel lekcji: Potrafię odróżnić zasadę od polityki i wymienić trzy cechy dobrej polityki.","k":["polityka","cechy-dobrej-polityki"]}}},{"pt":"Arkusz próbny","sp1":"sp1-34","lekcja":"2.11","temat":"Zasada a polityka – i trzy cechy dobrej polityki","k":["polityka","cechy-dobrej-polityki"]},{"lekcje":["en-k12-struktura-polityk"],"pt":"Lekcja 2.12","h":"Każda polityka mówi: kogo dotyczy, co grozi, kiedy wyjątek, jak sprawdzamy","b":"<p>W <w k=\"struktura-ramowa-polityki\">strukturze polityk<\/w> (<span class=\"en\"><w k=\"polityka\">Policy<\/w> <w k=\"struktura-ramowa\">framework<\/w><\/span>) opisuje się:<\/p><ol><li>zakres i ważność,<\/li><li>konsekwencje nieprzestrzegania,<\/li><li>obsługę wyjątków,<\/li><li>kontrolę i pomiar zgodności.<\/li><\/ol>","c":"Organizacja niechętna ryzyku ma bardziej restrykcyjne polityki, a każda polityka ma cykl życia.","s":"COBIT 5 Framework (PL), s. 68","ctx":"<p>Po angielsku te elementy to <span class=\"en\">scope and validity, consequences of non-compliance, exception handling, compliance monitoring<\/span>. Podręcznik pisze „zakres i prawidłowość”, ale chodzi o ważność, czyli o to, od kiedy i jak długo polityka obowiązuje. Najczęściej brakuje dwóch elementów: obsługi wyjątków i kontroli zgodności.<\/p><p>Polityki dopasowuje się do apetytu na ryzyko. Organizacja niechętna ryzyku ma polityki <b>bardziej<\/b> restrykcyjne niż ta, która ryzykuje agresywnie. Polityki mają też <w k=\"cykl-zycia-polityki\">cykl życia<\/w> (<span class=\"en\">Policy life cycle<\/span>). Trzeba je regularnie przeglądać i aktualizować, informować ludzi o nowej wersji i archiwizować stare wersje.<\/p><p>Przykład: polityka zwrotów w sklepie internetowym. Zakres: wszyscy klienci, obowiązuje od 1 marca. Konsekwencja: bez dowodu zakupu nie ma zwrotu. Wyjątek: towar szyty na miarę. Kontrola: dział jakości co miesiąc sprawdza losowo wybrane zwroty.<\/p>"},{"pt":"Sprawdź się","quiz":{"id":"q-enk-12-3","sylabus":["EN-02-04","EN-02-05"],"tresc":"Bank bardzo niechętnie podejmuje ryzyko. Co według COBIT 5 wynika z tego dla jego polityk?","opcje":[{"t":"Polityki banku zatwierdza wtedy regulator zamiast zarządu.","w":"COBIT 5 nic takiego nie mówi."},{"t":"Apetyt na ryzyko wpływa tylko na zasady, a nie na polityki.","w":"Podręcznik mówi wprost, że polityki dopasowuje się do apetytu na ryzyko."},{"t":"Powinny być bardziej restrykcyjne niż w organizacji skłonnej do ryzyka.","ok":true,"w":"Dobrze. Polityki odzwierciedlają apetyt na ryzyko (s. 68)."},{"t":"Powinny być łagodniejsze, bo każda dobra polityka musi być nieinwazyjna.","w":"Nieinwazyjność nie znaczy łagodności. Ostrożna organizacja ma surowsze polityki."}],"src":"COBIT 5 Framework (PL), s. 68","pomoc":{"t":"Pytanie dotyczy lekcji 2.12 „Struktura polityk – cztery elementy, apetyt na ryzyko i cykl życia”. Cel lekcji: Potrafię wymienić cztery elementy, które opisuje struktura polityk, i wyjaśnić, po co polityce cykl życia.","k":["struktura-ramowa-polityki","cykl-zycia-polityki"]}}},{"pt":"Arkusz próbny","sp1":"sp1-11","lekcja":"2.12","temat":"Struktura polityk – cztery elementy, apetyt na ryzyko i cykl życia","k":["struktura-ramowa-polityki","cykl-zycia-polityki"]},{"pt":"Arkusz próbny","sp1":"sp1-30","lekcja":"2.12","temat":"Struktura polityk – cztery elementy, apetyt na ryzyko i cykl życia","k":["struktura-ramowa-polityki","cykl-zycia-polityki"]},{"lekcje":["en-k13-polityki-a-inne-aktywatory"],"pt":"Lekcja 2.13","h":"Politykę realizują przede wszystkim praktyki i działania procesów","b":"<blockquote>„Praktyki i <w k=\"dzialanie-procesu\">działania<\/w> dotyczące procesów są najistotniejszym środkiem realizacji polityk”<\/blockquote><p><w k=\"polityka\">Polityka<\/w> mówi <b>co i dlaczego<\/b>, <w k=\"proces\">proces<\/w> – <b>kto, kiedy i w jakich krokach<\/b>.<\/p>","c":"Polityka, której nie wpisano w kroki procesu, zostaje dokumentem w szafie.","s":"COBIT 5 Framework (PL), s. 68, Przykład 9","ctx":"<p>Podręcznik wymienia cztery powiązania polityk. Odzwierciedlają one <w k=\"kultura-etyka-zachowanie\">kulturę<\/w> i promują pożądane zachowanie. Realizują je procesy. <w k=\"struktury-organizacyjne\">Struktury organizacyjne<\/w> definiują je i wdrażają w swoim zakresie kontroli. Same polityki są informacją, więc muszą być aktualne i dostępne.<\/p><p>Pułapka: polityka to nie proces. Polityka ustala reguły, a proces je wykonuje. To dwa różne aktywatory. Zmiana jednej polityki porusza też inne aktywatory. W Przykładzie 9 firma pozwala korzystać z mediów społecznościowych na służbowych laptopach. Ludzie muszą przyswoić nowe zachowania i umiejętności, a procesy i ustawienia bezpieczeństwa trzeba zmienić.<\/p><p>Przykład z urzędu: polityka „pliki z danymi osobowymi szyfrujemy” przez rok niczego nie zmieniła. Zadziałała dopiero wtedy, gdy do procedury wysyłki dopisano krok „zaszyfruj plik”.<\/p>"},{"pt":"Sprawdź się","quiz":{"id":"q-enk-13-2","sylabus":["EN-02-06"],"tresc":"Firma ubezpieczeniowa przyjęła politykę szyfrowania dokumentów, ale nikt jej nie stosuje. Co COBIT 5 wskazuje jako <b>najistotniejszy środek realizacji polityk<\/b>?","opcje":[{"t":"Struktury organizacyjne w swoim zakresie kontroli","w":"Struktury definiują i wdrażają polityki, ale najistotniejszym środkiem są procesy."},{"t":"Podpis prezesa pod dokumentem","w":"Podpis nie zmienia codziennej pracy."},{"t":"Aktywator Kultura, Etyka i Zachowanie","w":"Polityki odzwierciedlają kulturę, ale wykonuje się je przez procesy."},{"t":"Praktyki i działania procesów","ok":true,"w":"Dobrze. Politykę trzeba wpisać w kroki procesów (s. 68)."}],"src":"COBIT 5 Framework (PL), s. 68","pomoc":{"t":"Pytanie dotyczy lekcji 2.13 „Polityki a inne aktywatory – kto naprawdę wykonuje politykę”. Cel lekcji: Potrafię wskazać, z którymi aktywatorami współpracują polityki i co jest najważniejszym środkiem ich realizacji.","k":[]}}},{"pt":"Arkusz próbny","sp1":"sp1-19","lekcja":"2.13","temat":"Polityki a inne aktywatory – kto naprawdę wykonuje politykę","k":[]}]};</script>
