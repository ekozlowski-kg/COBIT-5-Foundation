<script>window.DECK={"id":"k-m0-lad","rozdzial":"Rozdział 6 · Zasada 5: Oddzielenie Ładu od Zarządzania · s. 31–33","tytul":"Ład a Zarządzanie – intuicja","prev":"k-pr-wydajnosc.html","next":"k-pr-zasada-5.html","T":{"organ-ladu":{"t":"Organ Ładu i nadzoru","eg":"Organ Ładu i nadzoru","pd":"Organ nadzorujący","en":"Governing body","wyj":"Szef albo grupa na samej górze, np. zarząd, rada nadzorcza czy dyrektor urzędu, którzy decydują o kierunku.\n\nNa Ilustracji 9 właściciele i interesariusze delegują (delegate) uprawnienia organowi Ładu (governing body), a ten jest przed nimi rozliczany (accountable). Organ Ładu wyznacza kierunek (set direction) kierownictwu (management). Kierownictwo instruuje i dopasowuje (instruct and align) role operacyjne, które raportują (report) do kierownictwa (FW-PL s. 24, Il. 9). Strzałka monitorowania (monitor) łączy kierownictwo z organem Ładu; według uzasadnień egzaminacyjnych to kierownictwo odpowiada wykonawczo za monitorowanie. Sam organ Ładu też monitoruje, ale wyniki względem kierunku, który wyznaczył (EDM).\n\nŻeby było jasne, kto w imieniu właścicieli i interesariuszy sprawuje Ład: wyznacza kierunek kierownictwu i odpowiada za wyniki.","zycie":"Właściciele mieszkań na zebraniu wspólnoty wybierają zarząd i powierzają mu dbanie o budynek. Zarząd wyznacza kierunek – w tym roku dach – i każe administratorowi to załatwić, a administrator raportuje postępy. Na następnym zebraniu zarząd rozlicza się przed właścicielami: to on jest organem Ładu.","firma":"Właściciele rodzinnej sieci piekarni powołują radę, która raz na kwartał ustala, dokąd firma zmierza: otwieramy dwa nowe punkty, nie wchodzimy w catering. Dyrektor zarządzający dostaje ten kierunek i sam układa plan, a rada sprawdza wyniki i odpowiada przed właścicielami. Ta rada to organ Ładu.","urzad":"Mieszkańcy w wyborach powierzają radzie gminy pilnowanie spraw gminy. Rada uchwala strategię i budżet, wyznacza kierunek wójtowi i urzędowi, a potem rozlicza ich z wykonania; sama odpowiada przed mieszkańcami przy kolejnych wyborach. W tej scenie rada gminy pełni rolę organu Ładu.","it":"Zarząd jako organ Ładu w EDM01 (Zapewnienie i utrzymanie ładu korporacyjnego) ustala zasady podejmowania decyzji o IT, a w EDM05 (Zapewnienie przejrzystości dotyczącej interesariuszy) raportuje udziałowcom i regulatorom, jak IT realizuje cele. Plany i kierowanie pracą zespołów zostawia kierownictwu IT (APO, BAI, DSS, MEA).","egz":"Według uzasadnień egzaminacyjnych organ Ładu i nadzoru jest odpowiedzialny decyzyjnie (rozliczany) i wyznacza kierunek. Za monitorowanie osiągania celów odpowiada wykonawczo kierownictwo. Egzamin: „Organ Ładu i nadzoru”. Podręcznik: „Organ nadzorujący”. Nie myl z: Kierownictwo (management) – Kierownictwo realizuje kierunek, instruuje i dopasowuje role operacyjne i odpowiada wykonawczo za monitorowanie osiągania celów; organ Ładu wyznacza kierunek i jest rozliczany przed interesariuszami.","src":"COBIT 5 Framework (PL), s. 24"},"zarzadzanie":{"t":"Zarządzanie","eg":"Zarządzanie","pd":"Zarządzanie","en":"Management","wyj":"Kierownicy planują i wykonują pracę w kierunku, który wyznaczyło szefostwo.\n\nKierownictwo pod przewodnictwem CEO planuje, tworzy, wykonuje i monitoruje działania (Plan, Build, Run, Monitor) zgodnie z kierunkiem wskazanym przez Ład. W COBIT 5 to cztery domeny: APO, BAI, DSS i MEA, razem 32 procesy. Wyniki i informacje zwrotne wracają do Ładu, który je ocenia i w razie potrzeby koryguje kierunek.\n\nŻeby kierunek wyznaczony przez Ład zamienić w zaplanowaną, wykonaną i sprawdzoną pracę, która prowadzi do celów organizacji.","zycie":"Rodzina ustaliła: „oszczędzamy na wakacje” (to Ład). Ty robisz plan zakupów, porównujesz ceny, co miesiąc przelewasz 1000 zł na lokatę i sprawdzasz, czy kwota rośnie. Ta codzienna robota to Zarządzanie.","firma":"Właściciel restauracji ustalił, że w weekendy ma być nowe menu. Kierownik zmiany układa grafik, zamawia towar, pilnuje jakości dań i w poniedziałek raportuje właścicielowi, jak poszło. Praca kierownika to Zarządzanie.","urzad":"Wójt zdecydował, że mieszkańcy mają załatwiać sprawy przez internet. Sekretarz gminy i kierownik informatyki planują projekt, wybierają dostawcę, wdrażają e-usługi i co miesiąc raportują wójtowi. Ich praca to Zarządzanie.","it":"W dziale IT szpitala APO09 (Zarządzanie umowami o świadczenie usług) planuje poziomy usług, BAI03 (Zarządzanie identyfikacją i budowaniem rozwiązań) buduje nowy moduł rejestracji, DSS01 (Zarządzanie eksploatacją) utrzymuje go w ruchu, a MEA01 (Monitorowanie, ocena i oszacowanie wydajności i zgodności) mierzy wyniki i raportuje je do Ładu.","egz":"Zarządzanie działa zgodnie z kierunkiem wyznaczonym przez organ Ładu, aby osiągnąć cele organizacji (definicja, s. 31). Nie myl z: Ład – Ład ocenia, kieruje i monitoruje; Zarządzanie planuje, tworzy, wykonuje i monitoruje. Oba „monitorują”, ale Ład monitoruje kierunek i cele, a Zarządzanie – realizację działań.","src":"COBIT 5 Framework (PL), s. 14, 92"},"rola-kierownictwo":{"t":"Kierownictwo","eg":"Kierownictwo","pd":"Zarządzanie (podpis roli na Ilustracji 9)","en":"Management","wyj":"Kierownicy, którzy dostają kierunek od szefostwa, rozdzielają pracę ludziom i pilnują, czy organizacja osiąga cele.\n\nKierownictwo dostaje kierunek od organu Ładu. Instruuje i dopasowuje role operacyjne i odbiera ich raporty – między kierownictwem a rolami operacyjnymi są tylko te dwie relacje (FW-PL s. 24, Il. 9). Strzałka monitorowania łączy kierownictwo z organem Ładu; według uzasadnień egzaminacyjnych to kierownictwo odpowiada wykonawczo za monitorowanie. Swoją pracę prowadzi w obszarze Planuj, Twórz, Wykonuj i Monitoruj.\n\nŻeby kierunek od organu Ładu zamienił się w konkretne zadania i żeby ktoś pilnował ich wykonania.","zycie":"Zarząd wspólnoty postanawia: w tym roku remont dachu. Administrator budynku wybiera firmę i ustala jej harmonogram. Firma raportuje administratorowi postępy, a on co miesiąc mówi zarządowi, czy remont idzie zgodnie z planem. Administrator to kierownictwo: instruuje i dopasowuje.","firma":"Rada spółki ustala: otwieramy czwarty sklep bez kredytu. Dyrektor zarządzający układa plan, rozdziela zadania kierownikom i co tydzień patrzy na raporty sprzedaży. To kierownictwo z Ilustracji 9.","urzad":"Rada gminy uchwala strategię e-usług. Sekretarz gminy rozdziela zadania wydziałom, dopasowuje grafik informatyków i co miesiąc zdaje radzie gminy relację z postępów. Sekretarz działa jako kierownictwo.","it":"Kierownictwo IT mierzy, czy IT osiąga cele, m.in. w procesie MEA01 (Monitorowanie, ocena i oszacowanie wydajności i zgodności) z domeny MEA, i raportuje wyniki organowi Ładu.","egz":"„Kto instruuje i dopasowuje role operacyjne?” → Kierownictwo. Kto odpowiada wykonawczo za monitorowanie w rolach z Ilustracji 9? Według uzasadnień egzaminacyjnych także Kierownictwo, a nie organ Ładu. Podręcznikowy podpis „Zarządzanie” na Ilustracji 9 to ta sama rola. Na Ilustracji 9 podręcznik podpisuje tę rolę „Zarządzanie”, a egzamin mówi „Kierownictwo” (tę formę podręcznik ma też w nagłówku na s. 31). W uzasadnieniach egzaminacyjnych to kierownictwo odpowiada wykonawczo za monitorowanie, a nie organ Ładu. Nie myl z: Organ Ładu i nadzoru – Organ Ładu wyznacza kierunek i jest rozliczany przed interesariuszami. Kierownictwo realizuje kierunek, instruuje i dopasowuje role operacyjne i odpowiada wykonawczo za monitorowanie osiągania celów.; Zarządzanie – Zarządzanie to obszar działań (PBRM, 32 procesy). Kierownictwo to rola z Ilustracji 9, czyli ludzie, którzy te działania prowadzą.; Oszacuj, Kieruj i Monitoruj (EDM) – „Monitoruj” w EDM to praktyka procesów Ładu: Ład monitoruje sprawność i zgodność względem kierunku (s. 14). W pytaniu o role z Ilustracji 9 egzamin wiąże monitorowanie z kierownictwem.","src":"COBIT 5 Framework (PL), s. 14, 24, 31"},"lad":{"t":"Ład","eg":"Ład","pd":"Nadzór","en":"Governance","wyj":"Szefostwo decyduje, po co i co robimy, i pilnuje, czy idziemy w dobrą stronę.\n\nOrgan Ładu, zwykle zarząd pod przewodnictwem prezesa, ocenia potrzeby, warunki i opcje interesariuszy (Evaluate), ustala priorytety i podejmuje decyzje (Direct), a potem monitoruje sprawność i zgodność z wyznaczonym kierunkiem (Monitor). Wyniki z Zarządzania wracają do Ładu i cykl się powtarza.\n\nŻeby informatyka robiła to, czego potrzebuje cała organizacja, a nie tylko to, co umieją informatycy.","zycie":"Wspólnota mieszkaniowa na zebraniu rocznym ocenia stan budynku i decyduje: w tym roku najpierw dach, elewacja dopiero za dwa lata, a zarządca co kwartał pokazuje wydatki. Wyboru dekarza i pilnowania ekipy zebranie już nie robi – to robota zarządcy. Ocenić, wyznaczyć kierunek, monitorować: to jest Ład.","firma":"Właścicielka restauracji raz na kwartał siada z wynikami i decyduje: celujemy w rodziny z dziećmi, marża ma wynosić co najmniej 20%, a za trzy miesiące sprawdzamy, czy to działa. Co i jak gotować każdego dnia, ustala już szef kuchni. Ona sprawuje Ład, on zarządza.","urzad":"Rada gminy przyjmuje strategię cyfryzacji: najpierw e-usługi dla mieszkańców, potem nowy system księgowy. Ustala na to budżet i co pół roku każe sobie przedstawić, co zrobiono. Wybór dostawcy i prowadzenie wdrożenia zostawia urzędowi – rada sprawuje Ład, a nie zarządza projektem.","it":"W EDM03 (Zapewnienie optymalizacji ryzyka) zarząd ocenia ryzyko IT, ustala apetyt na ryzyko i monitoruje, czy organizacja go nie przekracza.","egz":"Zapamiętaj czasowniki: Ład = Oszacuj, Kieruj, Monitoruj (EDM); odpowiada zarząd pod przewodnictwem prezesa (EN: chairperson – przewodniczący rady/zarządu, nie CEO). Zarządzanie = Planuj, Twórz, Wykonuj, Monitoruj; odpowiada kierownictwo pod przewodnictwem CEO. Egzamin PL: „Ład”. Podręcznik PL: „Nadzór”. EN: Governance. To jedno i to samo pojęcie. Słowo „nadzór” w pytaniu egzaminacyjnym może też pojawić się w zbitce „ład i nadzór”. Nie myl z: Zarządzanie – Zarządzanie (management) planuje, buduje, uruchamia i monitoruje działania ZGODNIE z kierunkiem wyznaczonym przez Ład.; Nadzór w znaczeniu kontroli / inspekcji – Polskie „nadzór” kojarzy się z kontrolą. W COBIT to coś szerszego: także wyznaczanie kierunku i ustalanie priorytetów.; Ład korporacyjny (enterprise governance) – Ład nad IT w organizacji (GEIT) jest CZĘŚCIĄ ładu korporacyjnego (Zasada 2).","src":"COBIT 5 Framework (PL), s. 14, 91"},"zasada-5":{"t":"Zasada 5: Oddzielenie Ładu od Zarządzania","eg":"Zasada 5: Oddzielenie Ładu od Zarządzania","pd":"Zasada 5: Oddzielenie nadzoru od zarządzania","en":"Principle 5: Separating Governance From Management","wyj":"Kto innego decyduje o kierunku, a kto inny wykonuje pracę; to dwie różne role.\n\nŁad (Governance) ocenia, kieruje i monitoruje (Evaluate, Direct, Monitor; domena EDM, 5 procesów); odpowiada zarząd pod przewodnictwem prezesa. Zarządzanie (Management) planuje, tworzy, wykonuje i monitoruje (Plan, Build, Run, Monitor; domeny APO, BAI, DSS, MEA, 32 procesy); odpowiada kierownictwo pod przewodnictwem CEO. Ład wyznacza kierunek i monitoruje, czy jest realizowany, a Zarządzanie działa zgodnie z nim i przekazuje Ładowi informacje zwrotne.\n\nŻeby rozdzielić decydowanie o kierunku od wykonywania pracy, bo to działania o innym charakterze, wymagające innych struktur i służące innym celom.","zycie":"Raz w miesiącu rodzina siada przy stole i ustala budżet: na co wydajemy, na co oszczędzamy. Potem Ty robisz zakupy, płacisz rachunki i pilnujesz wydatków. Na kolejnej naradzie pokazujesz wyniki, a rodzina koryguje plan – narada to Ład, codzienne pilnowanie to Zarządzanie.","firma":"Właścicielka piekarni ustala, że w tym roku rozwijają sprzedaż przez internet i ile może to kosztować, a co kwartał ocenia wyniki. Kierownik zakładu wybiera system zamówień, uczy ludzi i co miesiąc raportuje, jak idzie. Ona wyznacza kierunek i ocenia (Ład), on planuje i wykonuje (Zarządzanie).","urzad":"Rada gminy z wójtem decydują, że gmina cyfryzuje obsługę mieszkańców, i co pół roku oceniają postępy. Sekretarz i kierownicy wydziałów planują wdrożenie, wybierają systemy i pilnują codziennej pracy. Decyzja i nadzór to Ład, wykonanie to Zarządzanie.","it":"W EDM03 (Zapewnienie optymalizacji ryzyka) zarząd ustala apetyt na ryzyko IT i monitoruje, czy nie jest przekraczany. W APO12 (Zarządzanie ryzykiem) kierownictwo identyfikuje, analizuje i obsługuje konkretne ryzyka w tych granicach i raportuje wyniki do Ładu.","egz":"Kolejność: Oszacuj → Kieruj → Planuj → Twórz → Wykonuj → Monitoruj (MEA) → Monitoruj (EDM) (Ilustracja 15). Zarządzanie działa zgodnie z kierunkiem organu Ładu, aby osiągnąć cele organizacji. Egzamin: „Oddzielenie Ładu od Zarządzania”. Podręcznik: „Oddzielenie nadzoru od zarządzania”. Nie myl z: Ład – Ład to jedna ze stron rozdziału.; Zarządzanie – Zarządzanie to druga strona.","src":"COBIT 5 Framework (PL), s. 31, 32"}},"S":[{"pt":"Lekcje 0.25–0.26","h":"Ład wyznacza kierunek, Zarządzanie go realizuje","b":"<div class=\"tblwrap\"><table class=\"tbl\"><tr><th><\/th><th><w k=\"lad\">Ład<\/w> <span class=\"en\">Governance<\/span><\/th><th><w k=\"zarzadzanie\">Zarządzanie<\/w> <span class=\"en\"><w k=\"rola-kierownictwo\">Management<\/w><\/span><\/th><\/tr><tr><td>pyta<\/td><td>co i po co?<\/td><td>jak i kiedy?<\/td><\/tr><tr><td>robi<\/td><td>Oszacuj, Kieruj, Monitoruj<\/td><td>Planuj, Twórz, Wykonuj, Monitoruj<\/td><\/tr><tr><td>kto<\/td><td>zarząd z prezesem<\/td><td>kadra zarządzająca z dyrektorem generalnym<\/td><\/tr><\/table><\/div>","c":"Ład decyduje, dokąd organizacja zmierza, i sprawdza, czy tam dochodzi; Zarządzanie planuje i wykonuje pracę w tym kierunku.","s":"COBIT 5 Framework (PL), s. 31–32","ctx":"<p>Podręcznik opisuje Ład trzema krokami: ocenia potrzeby, warunki i opcje interesariuszy, ukierunkowuje działania przez priorytety i decyzje, a potem monitoruje sprawność i zgodność z uzgodnionym kierunkiem. Zarządzanie planuje, buduje, realizuje i monitoruje działania „w sposób spójny z kierunkiem wskazanym przez organ nadzorujący” – na egzaminie: <w k=\"organ-ladu\">Organ Ładu i nadzoru<\/w>. Dyrektor IT (CIO, <span class=\"en\">Chief Information Officer<\/span>) należy do kadry zarządzającej, nie do Ładu.<\/p><p>Pułapka nazw: podręcznik pisze „nadzór”, egzamin – <b>Ład<\/b>. „Monitoruj” jest po obu stronach: w Ładzie dotyczy kierunku, w Zarządzaniu bieżących wyników. Waga decyzji niczego nie przesądza – wybór dostawcy za miliony to nadal „jak”, czyli Zarządzanie.<\/p><p>Przykład: zarząd banku ustala, że w tym roku priorytetem są klienci mobilni (Ład). Wybór firmy, która napisze aplikację, harmonogram testów i codzienne kopie zapasowe to Zarządzanie.<\/p>"},{"pt":"Sprawdź się","quiz":{"tresc":"Kto według COBIT 5 w większości organizacji odpowiada za <b>Ład<\/b>?","opcje":[{"t":"Zarząd pod przywództwem prezesa","ok":true,"w":"Dobrze. Podręcznik: w większości przedsiębiorstw za nadzór (na egzaminie: Ład) odpowiada zarząd pod przywództwem prezesa."},{"t":"Audyt zewnętrzny, bo nadzór oznacza kontrolę","w":"„Nadzór” to podręcznikowa nazwa Ładu, a nie kontrola. Audyt nie wyznacza kierunku."},{"t":"Kadra zarządzająca z dyrektorem generalnym (CEO)","w":"Kadra z dyrektorem generalnym odpowiada za Zarządzanie, a nie za Ład."},{"t":"Dział IT z dyrektorem IT (CIO) na czele","w":"Za wąsko i nie ta rola. Dyrektor IT należy do kadry zarządzającej."}],"src":"COBIT 5 Framework (PL), s. 14; materiały Altkom","pomoc":{"t":"Pytanie dotyczy lekcji 0.25 „Ład a Zarządzanie – kto decyduje, a kto wykonuje”. Cel lekcji: Potrafię odróżnić Ład (co i po co) od Zarządzania (jak i kiedy) i powiedzieć, kto w organizacji za nie odpowiada.","k":["lad","zarzadzanie"]}}},{"pt":"Sprawdź się","quiz":{"tresc":"Na egzaminie pojawia się czynność „Oszacuj” (<em>Evaluate<\/em>). Do której dziedziny należy i jak nazywa ją polski podręcznik?","opcje":[{"t":"Do Zarządzania; w podręczniku: planowanie","w":"Planowanie (na egzaminie: Planuj) to czynność Zarządzania, a „Oszacuj” należy do Ładu."},{"t":"Do Ładu; w podręczniku: ocena","ok":true,"w":"Dobrze. „Oszacuj” to pierwsza czynność Ładu. Podręcznik pisze o ocenie, kierowaniu i monitorowaniu."},{"t":"Do Zarządzania; w podręczniku: monitorowanie","w":"Monitorowanie występuje po obu stronach, ale „Oszacuj” to ocena po stronie Ładu."},{"t":"Do Ładu; w podręczniku: nadzór","w":"Dziedzina się zgadza, ale „nadzór” to podręcznikowa nazwa całego Ładu, a nie jego czynności."}],"src":"COBIT 5 Framework (PL), s. 32; materiały Altkom","pomoc":{"t":"Pytanie dotyczy lekcji 0.26 „Trzy czynności Ładu, cztery czynności Zarządzania”. Cel lekcji: Potrafię wymienić egzaminacyjne nazwy czynności Ładu (Oszacuj, Kieruj, Monitoruj) i Zarządzania (Planuj, Twórz, Wykonuj, Monitoruj).","k":[]}}},{"pt":"Lekcje 0.27–0.36","h":"Ład to osobna dziedzina – nie audyt i nie najwyższe piętro Zarządzania","b":"<ul><li><b>≠ audyt<\/b> – audyt sprawdza zgodność, Ład też wyznacza kierunek<\/li><li><b>≠ wyższy szczebel<\/b> ani synonim Zarządzania<\/li><li>decyduje <b>czynność<\/b>, nie stanowisko<\/li><li>„<w k=\"rola-kierownictwo\">Kierownictwo<\/w>” na egzaminie = <span class=\"en\">Management<\/span>, czyli <w k=\"zarzadzanie\">Zarządzanie<\/w><\/li><\/ul>","c":"O roli decyduje to, co ktoś robi: kto ocenia, kieruje i monitoruje kierunek, sprawuje Ład; kto planuje i prowadzi pracę, zarządza.","s":"COBIT 5 Framework (PL), s. 31","ctx":"<p>Podręcznik podkreśla, że Ład i Zarządzanie obejmują „działania o odmiennym charakterze”, wymagają innych struktur organizacyjnych i służą innym celom. To treść <w k=\"zasada-5\">Zasady 5<\/w>. Wyniki audytu są dla Ładu źródłem informacji przy monitorowaniu, ale go nie zastępują.<\/p><p>Pułapka językowa: rola <span class=\"en\">Management<\/span> ma na egzaminie nazwę <w k=\"rola-kierownictwo\">Kierownictwo<\/w> – brzmi jak „szefowie, którzy decydują”, a oznacza Zarządzanie. Podręcznik mówi też, że struktura należy do Ładu albo Zarządzania zależnie od składu i zakresu decyzji, więc jedna osoba może działać po obu stronach.<\/p><p>Przykład: wójt małej gminy zatwierdza z radnymi strategię cyfryzacji (Ład), a nazajutrz sam ustala z informatykiem harmonogram wymiany komputerów (Zarządzanie). Rozdział ról chroni przed sytuacją, w której ten sam dyrektor IT ustala priorytety, wykonuje pracę i sam ocenia swój sukces.<\/p>"},{"pt":"Sprawdź się","quiz":{"tresc":"Jak brzmi Zasada 5 COBIT 5 w nazwie z polskiego egzaminu?","opcje":[{"t":"Połączenie Ładu i Zarządzania w jedną dziedzinę","w":"Odwrotnie: zasada mówi o rozróżnieniu obu dziedzin."},{"t":"Ład jako najwyższy szczebel Zarządzania","w":"Fałsz. Ład to osobna dziedzina, a nie szczebel Zarządzania."},{"t":"Oddzielenie Ładu od Zarządzania","ok":true,"w":"Dobrze. Tak brzmi nazwa egzaminacyjna (<em>Separating Governance From Management<\/em>)."},{"t":"Oddzielenie nadzoru od zarządzania","w":"To nazwa z polskiego podręcznika. Na egzaminie: Oddzielenie Ładu od Zarządzania."}],"src":"COBIT 5 Framework (PL), s. 14","pomoc":{"t":"Pytanie dotyczy lekcji 0.27 „Czym Ład nie jest”. Cel lekcji: Potrafię powiedzieć, że Ład to osobna dziedzina, a nie audyt, wyższy szczebel Zarządzania ani jego synonim.","k":[]}}},{"pt":"Sprawdź się","quiz":{"tresc":"W pytaniu czytasz: „Kierownictwo planuje i realizuje działania zgodnie z kierunkiem wyznaczonym przez zarząd”. Którą rolę opisuje to zdanie?","opcje":[{"t":"Ład (<em>Governance<\/em>), bo kierownictwo to szefowie","w":"To pułapka językowa. Kierownictwo to przekład słowa Management."},{"t":"Interesariuszy zewnętrznych","w":"Kierownictwo to rola wewnątrz organizacji."},{"t":"Nadzór, czyli Ład w wersji z podręcznika","w":"Nadzór to podręcznikowa nazwa Ładu, a zdanie opisuje Zarządzanie."},{"t":"Zarządzanie (<em>Management<\/em>)","ok":true,"w":"Tak. Planowanie i realizacja działań w kierunku od Ładu to Zarządzanie."}],"src":"COBIT 5 Framework (PL), s. 31","pomoc":{"t":"Pytanie dotyczy lekcji 0.36 „Ład to kierunek, kierownictwo to Zarządzanie”. Cel lekcji: Potrafię wyjaśnić, że Ład na egzaminie to wyznaczanie kierunku, a słowo „kierownictwo” wskazuje zwykle Zarządzanie.","k":[]}}}]};</script>
