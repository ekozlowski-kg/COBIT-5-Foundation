<script>window.DECK={"id":"k-m0-lad","rozdzial":"Rozdział 6 · Zasada 5: Oddzielenie Ładu od Zarządzania · s. 31–33","tytul":"Ład a Zarządzanie – intuicja","prev":"k-pr-wydajnosc.html","next":"k-pr-zasada-5.html","T":{"rola-kierownictwo":{"t":"Kierownictwo","eg":"Kierownictwo","pd":"Zarządzanie (podpis roli na Ilustracji 9)","en":"Management","wyj":"Kierownicy, którzy dostają kierunek od szefostwa, rozdzielają pracę ludziom i pilnują, czy organizacja osiąga cele.\n\nKierownictwo dostaje kierunek od organu Ładu. Instruuje i dopasowuje role operacyjne i odbiera ich raporty – między kierownictwem a rolami operacyjnymi są tylko te dwie relacje (FW-PL s. 24, Il. 9). Strzałka monitorowania łączy kierownictwo z organem Ładu; według uzasadnień egzaminacyjnych to kierownictwo odpowiada wykonawczo za monitorowanie. Swoją pracę prowadzi w obszarze Planuj, Twórz, Wykonuj i Monitoruj.\n\nŻeby kierunek od organu Ładu zamienił się w konkretne zadania i żeby ktoś pilnował ich wykonania.","zycie":"Zarząd wspólnoty postanawia: w tym roku remont dachu. Administrator budynku wybiera firmę i ustala jej harmonogram. Firma raportuje administratorowi postępy, a on co miesiąc mówi zarządowi, czy remont idzie zgodnie z planem. Administrator to kierownictwo: instruuje i dopasowuje.","firma":"Rada spółki ustala: otwieramy czwarty sklep bez kredytu. Dyrektor zarządzający układa plan, rozdziela zadania kierownikom i co tydzień patrzy na raporty sprzedaży. To kierownictwo z Ilustracji 9.","urzad":"Rada gminy uchwala strategię e-usług. Sekretarz gminy rozdziela zadania wydziałom, dopasowuje grafik informatyków i co miesiąc zdaje radzie gminy relację z postępów. Sekretarz działa jako kierownictwo.","it":"Kierownictwo IT mierzy, czy IT osiąga cele, m.in. w procesie MEA01 (Monitorowanie, ocena i oszacowanie wydajności i zgodności) z domeny MEA, i raportuje wyniki organowi Ładu.","egz":"„Kto instruuje i dopasowuje role operacyjne?” → Kierownictwo. Kto odpowiada wykonawczo za monitorowanie w rolach z Ilustracji 9? Według uzasadnień egzaminacyjnych także Kierownictwo, a nie organ Ładu. Podręcznikowy podpis „Zarządzanie” na Ilustracji 9 to ta sama rola. Na Ilustracji 9 podręcznik podpisuje tę rolę „Zarządzanie”, a egzamin mówi „Kierownictwo” (tę formę podręcznik ma też w nagłówku na s. 31). W uzasadnieniach egzaminacyjnych to kierownictwo odpowiada wykonawczo za monitorowanie, a nie organ Ładu. Nie myl z: Organ Ładu i nadzoru – Organ Ładu wyznacza kierunek i jest rozliczany przed interesariuszami. Kierownictwo realizuje kierunek, instruuje i dopasowuje role operacyjne i odpowiada wykonawczo za monitorowanie osiągania celów.; Zarządzanie – Zarządzanie to obszar działań (PBRM, 32 procesy). Kierownictwo to rola z Ilustracji 9, czyli ludzie, którzy te działania prowadzą.; Oszacuj, Kieruj i Monitoruj (EDM) – „Monitoruj” w EDM to praktyka procesów Ładu: Ład monitoruje sprawność i zgodność względem kierunku (s. 14). W pytaniu o role z Ilustracji 9 egzamin wiąże monitorowanie z kierownictwem.","src":"COBIT 5 Framework (PL), s. 24, Ilustracja 9; COBIT 5 Framework (PL), s. 31; COBIT 5 Framework (PL), s. 14"},"lad":{"t":"Ład","eg":"Ład","pd":"Nadzór","en":"Governance","wyj":"Szefostwo decyduje, po co i co robimy, i pilnuje, czy idziemy w dobrą stronę.\n\nŁad ocenia potrzeby i warianty, wyznacza kierunek i monitoruje wyniki (EDM). Zarządzanie planuje, buduje, prowadzi i monitoruje działania (PBRM) zgodnie z tym kierunkiem. W oryginale COBIT 5 Ład zwykle sprawuje board pod przewodnictwem chairperson, a Zarządzanie executive management pod kierownictwem CEO. Polski podział kompetencji trzeba przypisać według rzeczywistego mandatu; nie wolno automatycznie utożsamiać board z zarządem pod prezesem.\n\nŻeby informatyka robiła to, czego potrzebuje cała organizacja, a nie tylko to, co umieją informatycy.","zycie":"Wspólnota mieszkaniowa na zebraniu rocznym ocenia stan budynku i decyduje: w tym roku najpierw dach, elewacja dopiero za dwa lata, a zarządca co kwartał pokazuje wydatki. Wyboru dekarza i pilnowania ekipy zebranie już nie robi – to robota zarządcy. Ocenić, wyznaczyć kierunek, monitorować: to jest Ład.","firma":"Właścicielka restauracji raz na kwartał siada z wynikami i decyduje: celujemy w rodziny z dziećmi, marża ma wynosić co najmniej 20%, a za trzy miesiące sprawdzamy, czy to działa. Co i jak gotować każdego dnia, ustala już szef kuchni. Ona sprawuje Ład, on zarządza.","urzad":"Rada gminy przyjmuje strategię cyfryzacji: najpierw e-usługi dla mieszkańców, potem nowy system księgowy. Ustala na to budżet i co pół roku każe sobie przedstawić, co zrobiono. Wybór dostawcy i prowadzenie wdrożenia zostawia urzędowi – rada sprawuje Ład, a nie zarządza projektem.","it":"W EDM03 (Zapewnienie optymalizacji ryzyka) zarząd ocenia ryzyko IT, ustala apetyt na ryzyko i monitoruje, czy organizacja go nie przekracza.","egz":"Zapamiętaj czasowniki: Ład = Oszacuj, Kieruj, Monitoruj (EDM); odpowiada zarząd pod przewodnictwem prezesa (EN: chairperson – przewodniczący rady/zarządu, nie CEO). Zarządzanie = Planuj, Twórz, Wykonuj, Monitoruj; odpowiada kierownictwo pod przewodnictwem CEO. Egzamin PL: „Ład”. Podręcznik PL: „Nadzór”. EN: Governance. To jedno i to samo pojęcie. Słowo „nadzór” w pytaniu egzaminacyjnym może też pojawić się w zbitce „ład i nadzór”. Nie myl z: Zarządzanie – Zarządzanie (management) planuje, buduje, uruchamia i monitoruje działania ZGODNIE z kierunkiem wyznaczonym przez Ład.; Nadzór w znaczeniu kontroli / inspekcji – Polskie „nadzór” kojarzy się z kontrolą. W COBIT to coś szerszego: także wyznaczanie kierunku i ustalanie priorytetów.; Ład korporacyjny (enterprise governance) – Ład nad IT w organizacji (GEIT) jest CZĘŚCIĄ ładu korporacyjnego (Zasada 2).","src":"COBIT 5 Framework (EN), sekcja rozdział 6; Key Differences Between Governance and Management"},"zarzadzanie":{"t":"Zarządzanie","eg":"Zarządzanie","pd":"Zarządzanie","en":"Management","wyj":"Kierownicy planują i wykonują pracę w kierunku, który wyznaczyło szefostwo.\n\nKierownictwo pod przewodnictwem CEO planuje, tworzy, wykonuje i monitoruje działania (Plan, Build, Run, Monitor) zgodnie z kierunkiem wskazanym przez Ład. W COBIT 5 to cztery domeny: APO, BAI, DSS i MEA, razem 32 procesy. Wyniki i informacje zwrotne wracają do Ładu, który je ocenia i w razie potrzeby koryguje kierunek.\n\nŻeby kierunek wyznaczony przez Ład zamienić w zaplanowaną, wykonaną i sprawdzoną pracę, która prowadzi do celów organizacji.","zycie":"Rodzina ustaliła: „oszczędzamy na wakacje” (to Ład). Ty robisz plan zakupów, porównujesz ceny, co miesiąc przelewasz 1000 zł na lokatę i sprawdzasz, czy kwota rośnie. Ta codzienna robota to Zarządzanie.","firma":"Właściciel restauracji ustalił, że w weekendy ma być nowe menu. Kierownik zmiany układa grafik, zamawia towar, pilnuje jakości dań i w poniedziałek raportuje właścicielowi, jak poszło. Praca kierownika to Zarządzanie.","urzad":"Wójt zdecydował, że mieszkańcy mają załatwiać sprawy przez internet. Sekretarz gminy i kierownik informatyki planują projekt, wybierają dostawcę, wdrażają e-usługi i co miesiąc raportują wójtowi. Ich praca to Zarządzanie.","it":"W dziale IT szpitala APO09 (Zarządzanie umowami o świadczenie usług) planuje poziomy usług, BAI03 (Zarządzanie identyfikacją i budowaniem rozwiązań) buduje nowy moduł rejestracji, DSS01 (Zarządzanie eksploatacją) utrzymuje go w ruchu, a MEA01 (Monitorowanie, ocena i oszacowanie wydajności i zgodności) mierzy wyniki i raportuje je do Ładu.","egz":"Zarządzanie działa zgodnie z kierunkiem wyznaczonym przez organ Ładu, aby osiągnąć cele organizacji (definicja, s. 31). Nie myl z: Ład – Ład ocenia, kieruje i monitoruje; Zarządzanie planuje, tworzy, wykonuje i monitoruje. Oba „monitorują”, ale Ład monitoruje kierunek i cele, a Zarządzanie – realizację działań.","src":"COBIT 5 Framework (EN), sekcja rozdział 6; Key Differences Between Governance and Management"}},"S":[{"lekcje":["m0-25-lad-zarzadzanie","m0-26-czynnosci-ladu-zarzadzania"],"pt":"Lekcje 0.25–0.26","h":"Ład wyznacza kierunek, Zarządzanie go realizuje","b":"<div class=\"tblwrap\"><table class=\"tbl\"><tr><th></th><th><w k=\"lad\">Ład</w> <span class=\"en\">Governance</span></th><th><w k=\"zarzadzanie\">Zarządzanie</w> <span class=\"en\"><w k=\"rola-kierownictwo\">Management</w></span></th></tr><tr><td>pyta</td><td>co i po co?</td><td>jak i kiedy?</td></tr><tr><td>robi</td><td>Oszacuj, Kieruj, Monitoruj</td><td>Planuj, Twórz, Wykonuj, Monitoruj</td></tr><tr><td>kto</td><td>organ Ładu z przewodniczącym</td><td>kadra zarządzająca z dyrektorem generalnym</td></tr></table></div>","c":"Zarządzanie też podejmuje decyzje, a obie funkcje monitorują. Board/chairperson nie należy automatycznie utożsamiać z polskim zarządem/prezesem.","s":"COBIT 5 Framework (PL), s. 31–32","ctx":"<p>Ład ocenia potrzeby i warianty, wyznacza kierunek i monitoruje wyniki (EDM). Zarządzanie planuje, buduje, prowadzi i monitoruje działania (PBRM) zgodnie z tym kierunkiem.</p><p><b>Przykład:</b> Ta sama osoba w małej firmie może działać w obu funkcjach, lecz jej mandaty i odpowiedzialności trzeba rozróżnić.</p><p><b>Uwaga:</b> Zarządzanie też podejmuje decyzje, a obie funkcje monitorują. Board/chairperson nie należy automatycznie utożsamiać z polskim zarządem/prezesem.</p>"},{"pt":"Sprawdź się","quiz":{"id":"q-fn-w-05","sylabus":["PR-02-01","PR-02-14"],"tresc":"Konsultanci call center chcą prostego systemu, inspektor ochrony danych – bezpiecznego, a księgowa – taniego. Jaka jest rola Ładu wobec tych sprzecznych oczekiwań?","opcje":[{"t":"Negocjować i decydować, biorąc pod uwagę oczekiwania wszystkich stron","ok":true,"w":"Tworzenie wartości polega na osiąganiu korzyści przy optymalizacji ryzyka i kosztu zasobów. Równowagę ustala się wobec potrzeb różnych interesariuszy, także w sektorze publicznym. Wskazana odpowiedź odpowiada właśnie temu elementowi modelu."},{"t":"Zawsze wybierać rozwiązanie najtańsze, bo optymalizuje zasoby","ok":false,"w":"Optymalizacja zasobów to tylko jeden z trzech składników wartości."},{"t":"Wybrać oczekiwania najważniejszego interesariusza i jemu podporządkować resztę","ok":false,"w":"Ład waży interesy wszystkich, a nie jednego."},{"t":"Przekazać decyzję dostawcy systemu jako najlepszemu ekspertowi","ok":false,"w":"To oddanie Ładu stronie zewnętrznej."}],"src":"COBIT 5 Framework (EN), sekcja rozdział 2, rysunek 3; WWW","pomoc":{"t":"Pytanie dotyczy lekcji 0.25 „Ład a Zarządzanie – kto decyduje, a kto wykonuje”. Cel lekcji: Potrafię odróżnić Ład (co i po co) od Zarządzania (jak i kiedy) i powiedzieć, kto w organizacji za nie odpowiada.","k":["lad","zarzadzanie"]},"kurs":"Tworzenie wartości polega na osiąganiu korzyści przy optymalizacji ryzyka i kosztu zasobów. Równowagę ustala się wobec potrzeb różnych interesariuszy, także w sektorze publicznym. Wskazana odpowiedź odpowiada właśnie temu elementowi modelu.","kontekst":""}},{"pt":"Sprawdź się","quiz":{"id":"q-fn-w-05","sylabus":["PR-02-01","PR-02-14"],"tresc":"Konsultanci call center chcą prostego systemu, inspektor ochrony danych – bezpiecznego, a księgowa – taniego. Jaka jest rola Ładu wobec tych sprzecznych oczekiwań?","opcje":[{"t":"Zawsze wybierać rozwiązanie najtańsze, bo optymalizuje zasoby","ok":false,"w":"Optymalizacja zasobów to tylko jeden z trzech składników wartości."},{"t":"Negocjować i decydować, biorąc pod uwagę oczekiwania wszystkich stron","ok":true,"w":"Tworzenie wartości polega na osiąganiu korzyści przy optymalizacji ryzyka i kosztu zasobów. Równowagę ustala się wobec potrzeb różnych interesariuszy, także w sektorze publicznym. Wskazana odpowiedź odpowiada właśnie temu elementowi modelu."},{"t":"Wybrać oczekiwania najważniejszego interesariusza i jemu podporządkować resztę","ok":false,"w":"Ład waży interesy wszystkich, a nie jednego."},{"t":"Przekazać decyzję dostawcy systemu jako najlepszemu ekspertowi","ok":false,"w":"To oddanie Ładu stronie zewnętrznej."}],"src":"COBIT 5 Framework (EN), sekcja rozdział 2, rysunek 3; WWW","pomoc":{"t":"Pytanie dotyczy lekcji 0.26 „Trzy czynności Ładu, cztery czynności Zarządzania”. Cel lekcji: Potrafię wymienić egzaminacyjne nazwy czynności Ładu (Oszacuj, Kieruj, Monitoruj) i Zarządzania (Planuj, Twórz, Wykonuj, Monitoruj).","k":[]},"kurs":"Tworzenie wartości polega na osiąganiu korzyści przy optymalizacji ryzyka i kosztu zasobów. Równowagę ustala się wobec potrzeb różnych interesariuszy, także w sektorze publicznym. Wskazana odpowiedź odpowiada właśnie temu elementowi modelu.","kontekst":""}},{"lekcje":["m0-27-lad-czym-nie-jest","m0-36-lad-a-kierownictwo"],"pt":"Lekcje 0.27–0.36","h":"Ład to osobna dziedzina – nie audyt i nie najwyższe piętro Zarządzania","b":"<ul><li><b>≠ audyt</b> – audyt sprawdza zgodność, Ład też wyznacza kierunek</li><li><b>≠ wyższy szczebel</b> ani synonim Zarządzania</li><li>decyduje <b>czynność</b>, nie stanowisko</li><li>„<w k=\"rola-kierownictwo\">Kierownictwo</w>” na egzaminie = <span class=\"en\">Management</span>, czyli <w k=\"zarzadzanie\">Zarządzanie</w></li></ul>","c":"Zarządzanie też podejmuje decyzje, a obie funkcje monitorują. Board/chairperson nie należy automatycznie utożsamiać z polskim zarządem/prezesem.","s":"COBIT 5 Framework (PL), s. 31","ctx":"<p>Ład ocenia potrzeby i warianty, wyznacza kierunek i monitoruje wyniki (EDM). Zarządzanie planuje, buduje, prowadzi i monitoruje działania (PBRM) zgodnie z tym kierunkiem.</p><p><b>Przykład:</b> Ta sama osoba w małej firmie może działać w obu funkcjach, lecz jej mandaty i odpowiedzialności trzeba rozróżnić.</p><p><b>Uwaga:</b> Zarządzanie też podejmuje decyzje, a obie funkcje monitorują. Board/chairperson nie należy automatycznie utożsamiać z polskim zarządem/prezesem.</p>"},{"pt":"Sprawdź się","quiz":{"id":"q-fn-w-05","sylabus":["PR-02-01","PR-02-14"],"tresc":"Konsultanci call center chcą prostego systemu, inspektor ochrony danych – bezpiecznego, a księgowa – taniego. Jaka jest rola Ładu wobec tych sprzecznych oczekiwań?","opcje":[{"t":"Zawsze wybierać rozwiązanie najtańsze, bo optymalizuje zasoby","ok":false,"w":"Optymalizacja zasobów to tylko jeden z trzech składników wartości."},{"t":"Wybrać oczekiwania najważniejszego interesariusza i jemu podporządkować resztę","ok":false,"w":"Ład waży interesy wszystkich, a nie jednego."},{"t":"Negocjować i decydować, biorąc pod uwagę oczekiwania wszystkich stron","ok":true,"w":"Tworzenie wartości polega na osiąganiu korzyści przy optymalizacji ryzyka i kosztu zasobów. Równowagę ustala się wobec potrzeb różnych interesariuszy, także w sektorze publicznym. Wskazana odpowiedź odpowiada właśnie temu elementowi modelu."},{"t":"Przekazać decyzję dostawcy systemu jako najlepszemu ekspertowi","ok":false,"w":"To oddanie Ładu stronie zewnętrznej."}],"src":"COBIT 5 Framework (EN), sekcja rozdział 2, rysunek 3; WWW","pomoc":{"t":"Pytanie dotyczy lekcji 0.27 „Czym Ład nie jest”. Cel lekcji: Potrafię powiedzieć, że Ład to osobna dziedzina, a nie audyt, wyższy szczebel Zarządzania ani jego synonim.","k":[]},"kurs":"Tworzenie wartości polega na osiąganiu korzyści przy optymalizacji ryzyka i kosztu zasobów. Równowagę ustala się wobec potrzeb różnych interesariuszy, także w sektorze publicznym. Wskazana odpowiedź odpowiada właśnie temu elementowi modelu.","kontekst":""}}],"bankRevision":"e48da040792a7a9d","legacySp1Order":[null,null,null,null,null,null]};</script>
