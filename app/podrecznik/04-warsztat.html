<script>window.DECK={"id":"04-warsztat","rozdzial":"Poza podręcznikiem · Warsztat i materiały","tytul":"Od potrzeb do dowodów","prev":"k-fn-final.html","next":null,"T":{},"S":[{"pt":"Warsztat autorski · poza obowiązkowym zakresem aplikacyjnym Foundation","h":"Od potrzeby do dowodów","b":"<p>Firma chce szybszej obsługi klientów bez zwiększenia ryzyka ujawnienia danych. Najpierw uzgodnij potrzeby, potem cele przedsiębiorstwa, cele IT i cele aktywatorów.<\/p>","c":"Korzyści, ryzyko i zasoby trzeba rozpatrywać razem.","s":"COBIT 5 Framework, rozdział 2, ilustracja 4","ctx":"<p>Ćwiczenie: zapisz jedną potrzebę, jedną korzyść i jedno ograniczenie ryzyka. Następnie dobierz cele i sprawdź relacje w tabelach kaskady. Samodzielne dopasowanie nie jest oficjalną macierzą P/S.<\/p><p>Porównaj odpowiedź ze źródłem wskazanym pod slajdem. Przykład ćwiczeniowy nie zastępuje kryteriów ani tabel frameworka.<\/p>"},{"pt":"Warsztat autorski","h":"Integracja praktyk","b":"<p>Polityki bezpieczeństwa, praktyki zarządzania usługami i zasady inwestowania powinny wspierać wspólne cele. COBIT 5 pomaga powiązać je w całość.<\/p>","c":"Przeczytaj przypadek Dubai Customs z katalogu materiałów.","s":"COBIT 5 Framework, rozdział 4; artykuł ISACA o Dubai Customs (2016)","ctx":"<p>Ćwiczenie: wskaż, jakiego rodzaju szczegóły zapewnia ITIL, jakie ISO/IEC 27001, a jaką rolę pełni COBIT. To porównanie funkcji, nie lista identycznych procesów.<\/p><p>Porównaj odpowiedź ze źródłem wskazanym pod slajdem. Przykład ćwiczeniowy nie zastępuje kryteriów ani tabel frameworka.<\/p>"},{"pt":"Warsztat autorski","h":"Rezultat, działanie i dowód","b":"<p>Przeznaczenie mówi, po co istnieje proces. Rezultat opisuje oczekiwane osiągnięcie. Praktyka bazowa pomaga je uzyskać. Produkt pracy może dostarczyć dowodu.<\/p>","c":"Rezultat może obejmować artefakt. Sam dokument nie dowodzi całego poziomu zdolności.","s":"PAM §1.7; ISO/IEC/IEEE 24765:2010, s. 271","ctx":"<p>Ćwiczenie: oczekujemy zatwierdzonej specyfikacji dostępnej zespołowi. Jak sprawdzisz zatwierdzenie, aktualność i dostępność? Wskaż dowód oraz to, czego sam dowód jeszcze nie pokazuje.<\/p><p>Porównaj odpowiedź ze źródłem wskazanym pod slajdem. Przykład ćwiczeniowy nie zastępuje kryteriów ani tabel frameworka.<\/p>"},{"pt":"Warsztat autorski","h":"Ocena potrzebuje zakresu i kryteriów","b":"<p>Jeden rejestr i jeden raport to punkty wyjścia do zbierania dowodów. Ocena PA dotyczy osiągnięcia jego rezultatów w uzgodnionym zakresie procesu.<\/p>","c":"F oznacza ponad 85% do 100% osiągnięcia atrybutu; poziom wymaga też odpowiednich ocen pozostałych PA.","s":"COBIT 5 PAM §2.5 i rozdział 4","ctx":"<p>Ćwiczenie: dla dowodu określ zakres (jedna jednostka czy cała organizacja), okres, kompletność i powiązanie z kryteriami PA. Nie obliczaj procentu atrybutu z liczby dokumentów.<\/p><p>Porównaj odpowiedź ze źródłem wskazanym pod slajdem. Przykład ćwiczeniowy nie zastępuje kryteriów ani tabel frameworka.<\/p>"},{"pt":"Sprawdź się · pytanie autorskie","quiz":{"id":"q-warsztat-prm-pomiar","sylabus":["PC-02-03"],"tresc":"Który wniosek o PRM i zdolności procesu jest uzasadniony?","opcje":[{"t":"Raportowanie w procesie nie przyznaje mu automatycznie poziomu 4.","ok":true,"w":"DSS02.07 obejmuje monitorowanie i raportowanie. PA 4.1 dotyczy ilościowego zarządzania przewidywalnością, a sam raport nie dowodzi spełnienia atrybutów."},{"t":"DSS02 należy usunąć z PRM, bo opis procesu nie może dotyczyć pomiaru.","w":"PRM nie powinien narzucać wymaganego poziomu zdolności powyżej 1 w przeznaczeniu i rezultatach. Nie jest to zakaz pomiarów w treści procesów."},{"t":"Każdy raport liczbowy oznacza pełne osiągnięcie PA 4.1.","w":"Do oceny atrybutu potrzebny jest zestaw dowodów względem jego kryteriów; jedna miara nie wystarcza."},{"t":"Raportowanie sprawia, że DSS02 staje się procesem Ładu EDM.","w":"DSS02 jest procesem Zarządzania. Samo monitorowanie nie przenosi procesu do EDM."}],"src":"ENPROC, s. 180; PAM, sekcja 2.4","kontekst":"Opis DSS02 przewiduje raportowanie trendów obsługi zgłoszeń.","pomoc":{"t":"Oddziel fakty w opisie od wniosku, o który pyta ostatnie zdanie. Sprawdź, czy odpowiedź nie przypisuje jednemu dowodowi więcej, niż wynika ze scenariusza."}}},{"pt":"Sprawdź się · pytanie autorskie","quiz":{"id":"q-warsztat-outcome-artefakt","sylabus":["PC-01-04"],"tresc":"Jak interpretować te dowody?","opcje":[{"t":"Dokument nigdy nie może świadczyć o rezultacie procesu.","w":"To zbyt wąskie rozumienie outcome. Rezultat może obejmować artefakt lub zmianę stanu."},{"t":"Specyfikacja może być produktem pracy i dowodem rezultatu.","ok":true,"w":"Rezultat procesu może obejmować powstanie artefaktu. Produkt pracy wspiera ocenę rezultatu, jeżeli spełnia wymagania; nazwy nie wykluczają się."},{"t":"Każda specyfikacja wystarcza, nawet nieaktualna i bez zatwierdzenia.","w":"Dowód musi odpowiadać oczekiwanemu rezultatowi. Tu wymagane są zatwierdzenie i dostępność aktualnej wersji."},{"t":"Sam dokument dowodzi poziomu 3 dla całego procesu.","w":"Dokument nie dowodzi osiągnięcia wszystkich atrybutów potrzebnych do poziomu 3."}],"src":"ISO-VOC, s. 271; PAM, sekcja 1.7","kontekst":"Oczekiwany rezultat procesu brzmi: zatwierdzona specyfikacja jest dostępna dla zespołu. Zespół pokazuje aktualną specyfikację i zapis zatwierdzenia.","pomoc":{"t":"Oddziel fakty w opisie od wniosku, o który pyta ostatnie zdanie. Sprawdź, czy odpowiedź nie przypisuje jednemu dowodowi więcej, niż wynika ze scenariusza."}}},{"pt":"Sprawdź się · pytanie autorskie","quiz":{"id":"q-warsztat-dwa-wymiary","sylabus":["PC-02-04"],"tresc":"Które przyporządkowanie do wymiarów modelu jest poprawne?","opcje":[{"t":"PA 1.1 jest poza wymiarem zdolności, bo ten zaczyna się od poziomu 2.","w":"Wymiar zdolności obejmuje także poziom 1 i PA 1.1."},{"t":"PA 2.1 jest specyficzne tylko dla DSS02.","w":"PA 2.1 opisuje ogólne zarządzanie wykonywaniem procesu, niezależnie od jego nazwy."},{"t":"Oba PA należą do wymiaru zdolności.","ok":true,"w":"Wymiar zdolności obejmuje poziomy 0–5 i PA 1.1–5.2. Wskaźniki wymiaru procesu (praktyki bazowe i produkty pracy) wspierają ocenę wykonania na poziomie 1."},{"t":"Dla poziomu 0 trzeba dodatkowo ocenić PA 0.1.","w":"Poziom 0 nie ma odrębnego atrybutu PA 0.1."}],"src":"PAM, sekcja 2.4; SYL","kontekst":"Oceniający bada PA 1.1 i następnie PA 2.1.","pomoc":{"t":"Oddziel fakty w opisie od wniosku, o który pyta ostatnie zdanie. Sprawdź, czy odpowiedź nie przypisuje jednemu dowodowi więcej, niż wynika ze scenariusza."}}},{"pt":"Sprawdź się · pytanie autorskie","quiz":{"id":"q-warsztat-dowody-pa22","sylabus":["PC-02-06"],"tresc":"Czy ten fakt wystarcza do nadania PA 2.2 oceny F (Fully achieved)?","opcje":[{"t":"Tak, numer wersji zawsze oznacza ponad 85% osiągnięcia PA 2.2.","w":"Oceny nie wylicza się z obecności jednego pola metadanych."},{"t":"Nie, ponieważ PA 2.2 wolno oceniać dopiero przy poziomie 4.","w":"PA 2.2 należy do poziomu 2 i dotyczy zarządzania produktami pracy."},{"t":"Tak, jeśli tytuł rejestru zawiera nazwę COBIT.","w":"Nazwa dokumentu nie jest kryterium osiągnięcia atrybutu."},{"t":"Nie; trzeba ocenić spełnienie kryteriów atrybutu w całym uzgodnionym zakresie i zebrać odpowiednie dowody.","ok":true,"w":"Pojedynczy rejestr nie pokazuje stopnia osiągnięcia wszystkich rezultatów atrybutu. F oznacza ponad 85% do 100% osiągnięcia i brak istotnych słabości."}],"src":"PAM, sekcja 2.5; 4.2","kontekst":"Audytor zobaczył jeden rejestr z numerem wersji i datą przeglądu.","pomoc":{"t":"Oddziel fakty w opisie od wniosku, o który pyta ostatnie zdanie. Sprawdź, czy odpowiedź nie przypisuje jednemu dowodowi więcej, niż wynika ze scenariusza."}}},{"pt":"Sprawdź się · pytanie autorskie","quiz":{"id":"q-warsztat-interesariusze","sylabus":["PR-02-09"],"tresc":"Które stwierdzenie najlepiej opisuje ich relację do Ładu w COBIT 5?","opcje":[{"t":"Wszyscy mogą być interesariuszami; nie wszyscy są właścicielami.","ok":true,"w":"Krąg interesariuszy jest szerszy niż właścicieli. Uproszczony schemat delegowania na ilustracji 9 nie opisuje wszystkich form udziału każdego interesariusza."},{"t":"Tylko właściciele mogą być interesariuszami.","w":"Interesariusze mogą być wewnętrzni lub zewnętrzni i nie muszą mieć udziałów."},{"t":"Każdy klient sam nadaje uprawnienia organowi nadzorczemu.","w":"Schemat delegowania nie oznacza, że każdy zewnętrzny interesariusz formalnie powołuje organ Ładu."},{"t":"Potrzeby pracowników uwzględnia się dopiero po wybraniu narzędzia IT.","w":"Potrzeby interesariuszy stanowią punkt wyjścia kaskady celów, a nie dopisek do gotowej technologii."}],"src":"FW-PL, s. 24; FW-PL, s. 17","kontekst":"Klienci, pracownicy i właściciele mają różne oczekiwania wobec e-usługi.","pomoc":{"t":"Oddziel fakty w opisie od wniosku, o który pyta ostatnie zdanie. Sprawdź, czy odpowiedź nie przypisuje jednemu dowodowi więcej, niż wynika ze scenariusza."}}},{"pt":"Sprawdź się · pytanie autorskie","quiz":{"id":"q-warsztat-integracja","sylabus":["PR-02-11"],"tresc":"Co najlepiej odpowiada zasadzie jednej zintegrowanej metodyki COBIT 5?","opcje":[{"t":"Zastąpić wszystkie szczegółowe praktyki jedną listą nazw procesów COBIT.","w":"Integracja nie polega na usunięciu potrzebnych szczegółowych praktyk z innych źródeł."},{"t":"Powiązać praktyki wspólnym podejściem i celami.","ok":true,"w":"COBIT 5 pełni rolę nadrzędnego podejścia integrującego inne standardy i dobre praktyki; konkretne sposoby wdrożenia dobiera się do organizacji."},{"t":"Utrzymać całkowicie odrębne cele i odpowiedzialności dla każdej metodyki.","w":"Rozdzielone cele i brak powiązań utrudniają zintegrowane podejście."},{"t":"Uznać każdy dokument ISO za proces EDM.","w":"Dokument lub standard nie jest automatycznie procesem Ładu."}],"src":"FW-PL, s. 25","kontekst":"Organizacja ma praktyki ITIL i polityki oparte na ISO/IEC 27001. Chce objąć je wspólnym nadzorem.","pomoc":{"t":"Oddziel fakty w opisie od wniosku, o który pyta ostatnie zdanie. Sprawdź, czy odpowiedź nie przypisuje jednemu dowodowi więcej, niż wynika ze scenariusza."}}},{"pt":"Sprawdź się · pytanie autorskie","quiz":{"id":"q-warsztat-kaskada-scenariusz","sylabus":["PR-02-03"],"tresc":"Jaki powinien być punkt wyjścia do użycia kaskady celów?","opcje":[{"t":"Zakup platformy, a następnie dopisanie uzasadnienia do wybranego produktu.","w":"To odwraca punkt wyjścia kaskady: technologia powinna wspierać potrzeby i cele."},{"t":"Nadanie wszystkim 37 procesom jednakowego priorytetu.","w":"Kaskada wspiera dopasowanie i priorytetyzację, nie jednakowy priorytet wszystkich procesów."},{"t":"Uzgodnienie potrzeb interesariuszy oraz oczekiwanej równowagi korzyści, ryzyka i zasobów.","ok":true,"w":"Kaskada przekłada potrzeby interesariuszy na cele przedsiębiorstwa, cele IT i cele aktywatorów. Dopasowania należy dobrać do sytuacji i sprawdzić w tabelach frameworka."},{"t":"Zastąpienie potrzeb interesariuszy samą liczbą serwerów.","w":"Liczba zasobów nie zastępuje oczekiwanych korzyści i akceptowalnego ryzyka."}],"src":"FW-PL, s. 17","kontekst":"Firma chce przyspieszyć obsługę klientów, ale nie zaakceptuje większego ryzyka ujawnienia danych.","pomoc":{"t":"Oddziel fakty w opisie od wniosku, o który pyta ostatnie zdanie. Sprawdź, czy odpowiedź nie przypisuje jednemu dowodowi więcej, niż wynika ze scenariusza."}}},{"pt":"Wniosek z filmu ISACA · transkrypcja EN","h":"Dwie różne listy po pięć","b":"<p>Film omawia pięć obszarów GEIT: dopasowanie strategiczne, zarządzanie ryzykiem, dostarczanie wartości, zarządzanie zasobami i pomiar wyników.<\/p>","c":"To inna lista niż pięć zasad COBIT 5.","s":"ISACA HQ, Introduction to COBIT Video Series (2016), 1:11–1:26; 5:45–6:04","ctx":"<p>Pięć zasad COBIT 5 to: spełnianie potrzeb interesariuszy, objęcie całego przedsiębiorstwa, jedna zintegrowana metodyka, podejście całościowe oraz oddzielenie Ładu od Zarządzania.<\/p><p>Ćwiczenie: przyporządkuj nazwę do właściwej listy. Dalszy fragment filmu przypomina o dopasowaniu zakresu i szczegółowości wdrożenia do potrzeb. Wniosek opracowano z automatycznej transkrypcji; nie kopiowano narracji.<\/p>"},{"pt":"Materiały uzupełniające","h":"Bazy pytań, kursy i źródła","b":"<p><a href=\"../materialy.html\">Otwórz katalog z wyszukiwaniem i filtrami →<\/a><\/p>","c":"Każda pozycja ma datę, zakres sprawdzenia oraz ocenę przydatności.","s":"Przegląd źródeł z 2026-11-09","ctx":"<p>Zewnętrzne banki są podlinkowane. Pytania w tym warsztacie są autorskie. Liczby z ofert dostawców nie oznaczają potwierdzenia unikalności i jakości każdego zadania.<\/p><p>Porównaj odpowiedź ze źródłem wskazanym pod slajdem. Przykład ćwiczeniowy nie zastępuje kryteriów ani tabel frameworka.<\/p>"}]};</script>
