<script>window.DECK={"id":"k-pr-wymiary","rozdzial":"Rozdział 5 · Zasada 4: Aktywacja holistycznego podejścia · s. 27–30","tytul":"Wymiary, cykl życia i cele aktywatora","prev":"k-pr-aktywatory.html","next":"k-pr-wydajnosc.html","T":{"cykl-faza-3":{"t":"Budowanie/nabywanie/tworzenie/wdrażanie","eg":"Budowanie/nabywanie/tworzenie/wdrażanie","pd":"Budowanie/nabywanie/tworzenie/wdrażanie","en":"Build/acquire/create/implement (enabler life-cycle phase 3)","wyj":"Zamieniasz projekt w rzecz: budujesz ją, kupujesz albo piszesz i uruchamiasz u siebie.\n\nAktywator możesz zbudować, kupić gotowy, stworzyć, np. politykę, i wdrożyć. Wdrożenie obejmuje uruchomienie i przygotowanie ludzi. Gdy aktywator działa na co dzień, zaczyna się faza 4.\n\nŻeby projekt stał się działającą rzeczą: zbudowaną, kupioną albo napisaną.","zycie":"Wybraliście i zaprojektowaliście kompostownik. Teraz zbijacie go z desek albo kupujecie gotowy w markecie. Stawiacie go w ogrodzie i pokazujecie dzieciom, co tam wrzucać. To faza 3.","firma":"Sklep podpisuje umowę z operatorem bramki płatności, informatyk podłącza ją do koszyka, a obsługa przechodzi szkolenie. Nabywanie i wdrażanie to jedna faza 3.","urzad":"Gmina kupuje system zapisów, konfiguruje go i szkoli urzędników. Równocześnie sekretarz gminy pisze zarządzenie o jego używaniu. Kupno, stworzenie zarządzenia i uruchomienie należą do fazy 3.","it":"Dla rozwiązań IT tę fazę wspierają m.in. procesy BAI03 (Zarządzanie identyfikacją i budowaniem rozwiązań) i BAI07 (Zarządzanie procesem akceptacji zmian i przejścia) (interpretacja kursu).","egz":"Faza 3 obejmuje budowanie, nabywanie, tworzenie i wdrażanie. Kupno gotowego aktywatora też jest fazą 3. Nie myl jej z domeną BAI. Egzaminacyjnej nazwy PL faz cyklu życia aktywatora nie potwierdziliśmy (brak w SP1 i w zestawieniu Altkom). Używamy nazwy z FW-PL (s. 29, il. 13). Faza 3 brzmi jak domena BAI („Twórz, Nabywaj i Wdrażaj”), ale BAI to domena procesów, a faza 3 to etap życia aktywatora. Egzaminacyjnej nazwy PL faz cyklu życia aktywatora nie potwierdziliśmy (brak w SP1 i w zestawieniu Altkom). Używamy nazwy z FW-PL (s. 29, il. 13). Nie myl z: Twórz, Nabywaj i Wdrażaj (BAI) – BAI (Twórz, Nabywaj i Wdrażaj) to domena 10 procesów Zarządzania. Faza 3 to etap życia każdego aktywatora, także polityki czy struktury.; Użytkowanie/eksploatacja – Wdrożenie kończy fazę 3. Codzienne używanie to faza 4.; Faza 5 wdrożenia „Jak się tam dostaniemy?” (Wdrażanie usprawnień) – To faza programu wdrożenia COBIT 5. Faza 3 dotyczy jednego aktywatora.","src":"COBIT 5 Framework (PL), s. 29; COBIT 5 Framework (PL), s. 28, Ilustracja 13"},"jakosc-kontekstowa":{"t":"Jakość kontekstowa","eg":"Jakość kontekstowa","pd":"Jakość kontekstowa","en":"Contextual quality","wyj":"Informacja przydaje się temu, kto jej teraz potrzebuje: jest na temat, aktualna, kompletna i w zrozumiałej formie.\n\nPatrzysz na aktywator i jego rezultaty oczami użytkownika w konkretnym kontekście: czy są istotne (relevant), kompletne (complete), aktualne (current), w odpowiedniej ilości, spójnie i zwięźle przedstawione, zrozumiałe i łatwe w użyciu. Ta sama poprawna informacja może mieć wysoką jakość wewnętrzną, a niską kontekstową, gdy jest nie na temat, niekompletna, nieaktualna albo w nieczytelnej formie. Informacja, która przychodzi za późno, to inny problem: dostępność/terminowość, czyli jakość dostępu i bezpieczeństwa (s. 82). Dla procesów oznacza to dopasowanie do sytuacji organizacji.\n\nŻeby oceniać nie tylko, czy wynik jest poprawny, ale czy przydaje się temu, kto go używa, w jego sytuacji.","zycie":"Kupujesz z drugiej ręki szafę, a poprzedni właściciel daje Ci instrukcję montażu – bardzo dokładną, tyle że po szwedzku i z 50 stronami o modelach, których nie masz. Nic w niej nie jest błędne, ale Tobie się nie przyda. Brakuje jej jakości kontekstowej, czyli dopasowania do Twojej sytuacji.","firma":"Właściciel warsztatu samochodowego dostaje od księgowej 40-stronicowy raport z każdą fakturą z kwartału. Liczby są poprawne, ale on chciał tylko wiedzieć, czy stać go na nowy podnośnik, i tego z raportu nie wyczyta. Raport ma dobrą jakość wewnętrzną, ale słabą kontekstową.","urzad":"Wójt prosi o zestawienie, ile dzieci gmina dowozi do szkół, bo jutro sesja rady o budżecie. Urzędnik przysyła na czas bezbłędny raport, ale z danymi z poprzedniego roku szkolnego i bez dwóch nowych tras. Dane są poprawne, tylko nieaktualne i niekompletne dla tego zadania – brakuje im jakości kontekstowej. Gdyby raport przyszedł dopiero po sesji, zawiodłaby dostępność/terminowość, czyli jakość dostępu i bezpieczeństwa (s. 82).","it":"W DSS02 (Zarządzanie zgłoszeniami serwisowymi i incydentami) raport dla zarządu zawiera tylko pięć głównych wskaźników i trend, a pełna lista zgłoszeń trafia do zespołu wsparcia. Te same dane podane w formie dopasowanej do odbiorcy to cel kontekstowy aktywatora Informacja.","egz":"„Rezultaty właściwe, kompletne, aktualne, zrozumiałe” → jakość kontekstowa. „Dostępne kiedy potrzeba” i „zabezpieczone” → dostęp i bezpieczeństwo (s. 29). Nie myl z: Jakość wewnętrzna – Wewnętrzna: czy dokładne. Kontekstowa: czy przydatne tu i teraz.","src":"COBIT 5 Framework (PL), s. 29"},"wyznacznik":{"t":"Czynnik wpływający na potrzeby interesariuszy","eg":"Czynnik wpływający na potrzeby interesariuszy","pd":"Wyznacznik","en":"Driver / Stakeholder drivers","wyj":"Coś, co sprawia, że ludzie zaczynają czegoś potrzebować, np. nowy przepis, awaria albo nowa technologia.\n\nWyznaczniki (stakeholder drivers) to czynniki zewnętrzne i wewnętrzne, np. zmiany strategii, otoczenia biznesowego i regulacyjnego oraz nowe technologie. Wpływają na potrzeby interesariuszy (stakeholder needs). To krok 1 kaskady celów (goals cascade): potem potrzeby przekłada się na cele organizacji, cele związane z IT i cele aktywatorów.\n\nŻeby wiedzieć, skąd biorą się i dlaczego zmieniają się potrzeby interesariuszy, od których zaczyna się kaskada celów.","zycie":"Rodzi się Wam dziecko. Nagle potrzebujecie większego auta, innego budżetu i elastycznych godzin pracy. Samo dziecko nie jest potrzebą – to wyznacznik, który zmienia Wasze potrzeby.","firma":"Wchodzi przepis o kasach fiskalnych online. Właściciel małego sklepu spożywczego musi wymienić kasę i nauczyć sprzedawczynie nowej obsługi. Przepis to wyznacznik, który tworzy w sklepie nową potrzebę.","urzad":"Ustawa o doręczeniach elektronicznych nakłada na urzędy nowy obowiązek. Urząd gminy musi założyć skrzynkę do e-Doręczeń i zmienić pracę kancelarii. Ustawa to zewnętrzny wyznacznik, który zmienia potrzeby urzędu.","it":"Nowa regulacja o cyberbezpieczeństwie to wyznacznik. Zmienia potrzeby interesariuszy, a kaskada celów prowadzi od nich do celów związanych z IT (bezpieczeństwo informacji, zgodność) i do procesów APO13 (Zarządzanie bezpieczeństwem) oraz MEA03 (Monitorowanie, ocena i oszacowanie zgodności z wymogami zewnętrznymi).","egz":"Wyznacznikami są zmiany strategii, otoczenia biznesowego i regulacyjnego oraz nowe technologie (s. 17). Dobre praktyki, jakość kontekstowa i wskaźniki to pojęcia z modelu aktywatora, czyli inna kategoria. Podręcznik używa słowa „wyznacznik”. Na egzaminie pytanie bywa opisowe: „czynnik wpływający na potrzeby interesariuszy”. Nie myl tego słowa „czynnik” z „czynnikiem umożliwiającym” (aktywatorem). Nie myl z: Aktywator – Aktywator (czynnik umożliwiający) POMAGA osiągnąć cele – np. proces czy struktura. Wyznacznik WYWOŁUJE zmianę potrzeb.; Zdarzenie wyzwalające (trigger event) – Pojęcie z wdrożenia (IM): zdarzenie, które uruchamia program usprawnień, np. fuzja. Podobne w duchu, ale inny obszar sylabusa.","src":"COBIT 5 Framework (PL), s. 91; COBIT 5 Framework (PL), s. 17"},"cykl-zycia-aktywatora":{"t":"Cykl życia aktywatora","eg":"Cykl życia aktywatora","pd":"Cykl życia (czynnika umożliwiającego)","en":"Enabler life cycle","wyj":"Każda „część układanki” rodzi się, działa, jest poprawiana i kiedyś odchodzi, jak samochód we flocie firmy.\n\nCykl życia to jeden z czterech wymiarów aktywatora. Ma 6 faz: planowanie (plan), projektowanie (design), budowanie/nabywanie/tworzenie/wdrażanie (build/acquire/create/implement), użytkowanie/eksploatacja (use/operate), ocena/monitorowanie (evaluate/monitor) oraz aktualizacja/pozbywanie się (update/dispose). Wynik oceny może prowadzić do poprawek, więc fazy się powtarzają.\n\nŻeby każdy aktywator był świadomie zaplanowany, utrzymywany, oceniany i w porę zmieniany albo wycofany, a nie zostawiony sam sobie po wdrożeniu.","zycie":"Gdy córka dostaje pierwszy telefon, ustalacie zasady: bez telefonu przy stole i po 21. Spisujecie je, wieszacie na lodówce i stosujecie, a po miesiącu rozmawiacie, co się sprawdza. Gdy córka idzie do liceum, zmieniacie albo znosicie zasady. Od pomysłu do wycofania – to cykl życia aktywatora.","firma":"Sklep internetowy przygotowuje nowy regulamin zwrotów. Właściciel go planuje, prawnik pisze treść, regulamin trafia na stronę i klienci z niego korzystają, a po pół roku właściciel sprawdza, ile było sporów. Potem regulamin jest poprawiany albo zastępowany nowym – to cykl życia aktywatora.","urzad":"Wydział w urzędzie gminy projektuje nowy formularz wniosku o wycinkę drzewa. Formularz trafia na stronę i do BIP, mieszkańcy go wypełniają, a po roku urzędnicy sprawdzają, które pola sprawiają kłopot. Po zmianie przepisów stary wzór jest wycofywany i zastępowany nowym. To pełny cykl życia aktywatora.","it":"Proces DSS04 Zarządzanie ciągłością też ma cykl życia: bank planuje i projektuje plan ciągłości dla bankowości internetowej, wdraża go, stosuje, ocenia po teście awaryjnym i aktualizuje. Gdy system zastąpi inny, część procedur zostanie wycofana.","egz":"„Czy cykl życia aktywatora jest zarządzany?” to jedno z 4 pytań zarządzania wydajnością. Mierzy się je wskaźnikiem wiodącym. Nie myl z: Cykl życia wdrożenia (IM) – Cykl życia wdrożenia (7 faz, 3 pierścienie) dotyczy programu wdrażania COBIT, a nie pojedynczego aktywatora.; Cykl informacji – Cykl informacji to szczegółowy cykl aktywatora Informacja (dzień 3).","src":"COBIT 5 Framework (PL), s. 29"},"cykl-wdrozenia":{"t":"Cykl Życia Wdrożenia","eg":"Cykl Życia Wdrożenia","pd":"Cykl życia wdrożenia","en":"Implementation life cycle","wyj":"Plan wprowadzania zmian krok po kroku, który się powtarza, bo poprawiać trzeba stale, nie raz.\n\nCykl ma trzy pierścienie: zewnętrzny – zarządzanie programem (programme management), środkowy – aktywowanie zmiany (change enablement), czyli strona ludzka i kulturowa, i wewnętrzny – cykl ciągłego doskonalenia (continual improvement life cycle). Wszystkie trzy przechodzą razem przez 7 faz, od „Jakie są wyznaczniki?” do „Jak utrzymać motywację do działania?”. Po fazie 7 cykl rusza od nowa, bo realizuje się go iteracyjnie.\n\nŻeby wdrażanie COBIT 5 było stałym doskonaleniem, a nie jednorazowym projektem, i żeby obok techniki zadbać o ludzi i o zarządzanie całym programem.","zycie":"Rodzina postanawia zdrowiej jeść. Ktoś musi to poprowadzić: plan, zakupy, budżet (zarządzanie programem). Trzeba też przekonać dzieci, które kochają frytki (aktywowanie zmiany), a po miesiącu sprawdzić, co działa, i poprawić plan posiłków (ciągłe doskonalenie). Te trzy rzeczy dzieją się równolegle, a pętla rusza od nowa przy kolejnym celu – to cykl życia wdrożenia.","firma":"Warsztat przechodzi z zeszytu na program do zleceń. Właściciel pilnuje harmonogramu i kosztów, rozmawia ze starszym mechanikiem, który nie chce „klikać”, i po kwartale poprawia to, co nie działa. Program, ludzie i doskonalenie to trzy pierścienie, które biegną razem przez wszystkie siedem faz.","urzad":"Szkoła wprowadza dziennik elektroniczny. Dyrektor prowadzi to jako program z planem i budżetem, wicedyrektor oswaja nauczycieli, którzy wolą papier, a po pierwszym semestrze zespół poprawia ustawienia i zasady. Program, zmiana w ludziach i ciągłe doskonalenie idą równolegle przez cały cykl życia wdrożenia.","it":"Bank wdraża COBIT 5 po awarii bankowości internetowej: CIO prowadzi program, rozmowy z pracownikami i nowa kultura zgłaszania błędów to aktywowanie zmiany (wspiera je BAI05 Zarządzanie wdrażaniem zmian organizacyjnych), a kolejne usprawnienia procesu DSS02 Zarządzanie zgłoszeniami serwisowymi i incydentami to ciągłe doskonalenie.","egz":"Komponent dotyczący behawioralnych i kulturowych aspektów wdrożenia → Aktywowanie zmiany (pierścień środkowy). Nie myl z: Cykl życia aktywatora – Cykl życia aktywatora (6 faz: planowanie… pozbywanie się) dotyczy pojedynczego aktywatora. Cykl życia wdrożenia dotyczy programu wdrażania COBIT.","src":"COBIT 5 Framework (PL), s. 37; COBIT 5 Framework (PL), s. 38, Ilustracja 17; materiały Altkom"},"dostep-i-bezpieczenstwo":{"t":"Dostęp i Bezpieczeństwo","eg":"Dostęp i Bezpieczeństwo","pd":"Dostęp i bezpieczeństwo / Dostępność i bezpieczeństwo","en":"Accessibility and security","wyj":"Informacja ma być dostępna dla tych, którzy jej potrzebują, i schowana przed tymi, którzy nie powinni jej mieć.\n\nTo trzecia kategoria celów aktywatora (enabler goals), obok jakości wewnętrznej (intrinsic quality) i jakości kontekstowej (contextual quality). Sprawdza dwie rzeczy: czy aktywator jest dostępny w razie potrzeby (accessibility) i czy jego wyniki są zabezpieczone, czyli dostępne tylko dla uprawnionych (security). Dla aktywatora Informacja odpowiadają temu kryteria dostępności i ograniczonego dostępu.\n\nŻeby aktywatory i ich wyniki były dostępne wtedy, gdy są potrzebne, i chronione przed tymi, którzy nie powinni mieć do nich dostępu.","zycie":"Dziecko rozcina kolano, a Ty po 10 sekundach masz apteczkę w ręku, bo zawsze stoi w tej samej szafce. Ta szafka jest wysoko i zamknięta, więc młodsze dziecko nie dobierze się do leków. Pod ręką, kiedy trzeba, i poza zasięgiem niepowołanych – to dostęp i bezpieczeństwo.","firma":"W ostatni dzień miesiąca księgowa warsztatu zamyka rozliczenia, a program księgowy po prostu działa. Jednocześnie listę płac widzi tylko ona i właściciel, mechanicy nie mają do niej wglądu. Dostępne, gdy trzeba, i chronione przed niepowołanymi – to dostęp i bezpieczeństwo.","urzad":"Mieszkaniec przychodzi do urzędu o 15:30, a urzędniczka od ręki sprawdza jego dane w rejestrze. Stażysta widzi w tym samym rejestrze tylko sprawy, które sam prowadzi, a nikt z zewnątrz nie ma do niego dostępu. Tak wygląda cel „dostęp i bezpieczeństwo” dla rejestru.","it":"Dla aktywatora Informacja, czyli bazy danych klientów w systemie CRM, cel dostępu i bezpieczeństwa brzmi: baza działa w każdej chwili, gdy konsultant obsługuje klienta, a dane osobowe widzą tylko uprawnieni. Zabezpieczenia techniczne zapewnia proces DSS05 Zarządzanie usługami bezpieczeństwa.","egz":"„Dostępne kiedy potrzebne” i „wyniki zabezpieczone” → Dostęp i Bezpieczeństwo (s. 29). Nie myl z: Bezpieczeństwo informacji (APO13/DSS05) – To procesy. Tu chodzi o kategorię celu każdego aktywatora.","src":"COBIT 5 Framework (PL), s. 28; COBIT 5 Framework (PL), s. 29"},"wymiar-cykl-zycia":{"t":"Cykl życia (wymiar aktywatora)","eg":"Cykl życia (wymiar aktywatora)","pd":"Cykl życia (wymiar czynnika umożliwiającego)","en":"Life cycle (enabler dimension)","wyj":"Każda procedura czy system się rodzi, działa, jest sprawdzany i poprawiany, a w końcu odchodzi.\n\nKażdy aktywator przechodzi 6 faz: od planowania po aktualizację albo pozbycie się. Pytasz, czy ktoś tym cyklem zarządza. Odpowiedź mierzy wskaźnik wiodący, który ostrzega przed złym wynikiem.\n\nŻeby dbać o aktywator przez całe jego życie, a nie tylko w chwili wdrożenia.","zycie":"Domowy regulamin korzystania z telefonu ma swoje życie. Wymyślacie go, spisujecie, wieszacie na lodówce i stosujecie. Po miesiącu sprawdzacie, czy działa. Gdy dziecko dorasta, zmieniacie go albo znosicie.","firma":"Formularz zamówienia w hurtowni zaczyna się od pomysłu, potem grafik go projektuje, a informatyk wstawia na stronę. Klienci go używają, a kierownik co kwartał sprawdza, które pola sprawiają kłopot. W końcu formularz zastępuje aplikacja.","urzad":"Procedura przyjmowania skarg w urzędzie miasta zostaje zaplanowana, napisana i wprowadzona zarządzeniem prezydenta. Urzędnicy ją stosują, a audytor raz w roku ją ocenia. Po zmianie przepisów stara wersja zostaje uchylona i zastąpiona nową.","it":"Przykład 5 z FW-PL: proces trzeba utworzyć, realizować, monitorować i dostosowywać, a w końcu przestaje istnieć. Po drodze można podnosić jego zdolność według Modelu potencjału procesu (s. 30).","egz":"Cykl życia aktywatora ma 6 faz (nie 7). „Czy zadbano o zarządzanie cyklem życia?” → wskaźnik wiodący. 7 faz ma cykl życia wdrożenia (obszar IM). „Cykl życia” w COBIT 5 to kilka różnych rzeczy: wymiar aktywatora (6 faz), cykl życia wdrożenia (7 faz) i cykl informacji. Nie mieszaj ich. Nie myl z: Cykl Życia Wdrożenia – Cykl życia wdrożenia ma 7 faz i 3 pierścienie i dotyczy programu wdrażania COBIT 5. Wymiar ma 6 faz i dotyczy jednego aktywatora.; Cykl informacji – Cykl informacji opisuje drogę od danych do wartości w aktywatorze Informacja. Wymiar cyklu życia jest wspólny dla wszystkich 7 aktywatorów.; Cykl życia aktywatora – Hasło-rodzic opisuje fazy. Ten atom opisuje cykl życia jako jeden z czterech wymiarów i sposób jego pomiaru.; Model Zdolności Procesu – Poziomy zdolności 0–5 mierzą, jak dobrze działa proces. Fazy cyklu życia mówią, na jakim etapie życia jest aktywator.","src":"COBIT 5 Framework (PL), s. 29; COBIT 5 Framework (PL), s. 30"},"wymiar-cele":{"t":"Cele (wymiar aktywatora)","eg":"Cele (wymiar aktywatora)","pd":"Cele (wymiar czynnika umożliwiającego)","en":"Goals (enabler dimension)","wyj":"Co konkretnie dana procedura, system czy zespół ma dawać i po czym poznasz, że to daje.\n\nCele opisujesz przez oczekiwane wyniki albo przez samo stosowanie aktywatora. Dzielisz je na trzy kategorie: jakość wewnętrzna, jakość kontekstowa oraz dostęp i bezpieczeństwo. Osiągnięcie celów mierzy wskaźnik opóźniony.\n\nŻeby dla aktywatora wiedzieć, co dokładnie ma osiągać i jak sprawdzić, czy to osiąga.","zycie":"Domowa apteczka ma cele. Leki mają być prawdziwe i nieprzeterminowane (jakość wewnętrzna). Mają pasować do tego, na co choruje rodzina (jakość kontekstowa). Apteczka ma być pod ręką, ale poza zasięgiem małych dzieci (dostęp i bezpieczeństwo).","firma":"Cennik w sklepie internetowym ma podawać prawdziwe ceny (jakość wewnętrzna). Ma być aktualny i zrozumiały dla klienta (jakość kontekstowa). Ma działać także w nocy, ale zmieniać go może tylko kierowniczka (dostęp i bezpieczeństwo).","urzad":"Rejestr mieszkańców w urzędzie gminy ma zawierać dane zgodne z dokumentami (jakość wewnętrzna). Ma być kompletny, aktualny i zrozumiały dla urzędników, którzy wydają zaświadczenia (jakość kontekstowa). Ma być dostępny w godzinach pracy, ale tylko dla uprawnionych osób (dostęp i bezpieczeństwo).","it":"Dla procesu APO08 (Zarządzanie relacjami) FW-PL podaje przykładowy cel: dobre relacje między przedsiębiorstwem a działem IT. Miernik to wyniki badań zadowolenia użytkowników i personelu IT (Przykład 5, s. 30).","egz":"Trzy kategorie celów aktywatora: jakość wewnętrzna, jakość kontekstowa, dostęp i bezpieczeństwo. „Aktualne” i „kompletne” to jakość kontekstowa, a nie wewnętrzna. „Czy osiągnięto cele?” → wskaźnik opóźniony. Kategorie celów: egzamin „Jakość wewnętrzna”, podręcznik „Jakość rzeczywista”. Ilustracja 13 pisze „Dostępność i bezpieczeństwo”, a tekst na s. 29 „Dostęp i bezpieczeństwo”. Nie myl z: Cele aktywatora – To ten sam poziom: cele aktywatora to ostatni etap kaskady. Hasło kaskady pokazuje, skąd cele się biorą; wymiar pokazuje, jak je opisać (3 kategorie).; Cele związane z informatyką – Cele związane z informatyką to poziom wyżej w kaskadzie (17 celów). Wymiar „Cele” dotyczy jednego aktywatora.; Jakość wewnętrzna – „Wewnętrzna” znaczy „sama w sobie” (dokładność, obiektywność), a nie „wewnątrz organizacji”.","src":"COBIT 5 Framework (PL), s. 29; COBIT 5 Framework (PL), s. 28, Ilustracja 13"},"dobre-praktyki":{"t":"Dobre praktyki","eg":"Dobre praktyki","pd":"Dobre praktyki","en":"Good practices","wyj":"Sprawdzone sposoby robienia czegoś, które zadziałały u innych, więc nie trzeba wymyślać od nowa.\n\nDobre praktyki (good practices) to jeden z czterech wymiarów każdego aktywatora, obok interesariuszy, celów i cyklu życia. Podają przykłady lub sugestie, jak najlepiej wdrożyć aktywator, oraz wymagane produkty działań (work products), czyli dane wejściowe i wyniki (inputs and outputs). Dla procesów COBIT 5 podaje je w publikacji „Procesy umożliwiające” (Enabling Processes), a dla innych aktywatorów odsyła też do innych standardów.\n\nŻeby nie wymyślać wszystkiego od nowa, tylko korzystać ze sposobów, które sprawdziły się w wielu organizacjach. Dobre praktyki wspierają osiąganie celów aktywatora.","zycie":"Babcia lepi pierogi zawsze tak samo: mąka, woda i jajko, ciasto odpoczywa pół godziny, farsz robi się dzień wcześniej. Dostajesz od niej kartkę z listą składników (wejścia) i opisem, jak mają wyglądać gotowe pierogi (wynik). Ten sprawdzony przez lata sposób to dobra praktyka.","firma":"Sieć trzech sklepów rowerowych ma jedną checklistę otwarcia: włączyć kasę, przeliczyć gotówkę, uruchomić terminal, wystawić rowery testowe. Na wejściu jest raport z zamknięcia z poprzedniego dnia, na wyjściu podpisana lista. Sposób sprawdzony we wszystkich punktach to dobra praktyka.","urzad":"Nowy pracownik urzędu dostaje skargę mieszkańca i nie wie, co z nią zrobić. Kierowniczka daje mu wzorcową procedurę: rejestracja w EZD, przekazanie do właściwego wydziału, odpowiedź w ciągu miesiąca zgodnie z KPA. Na wejściu jest skarga, na wyjściu pismo z odpowiedzią – to dobra praktyka z gotowymi produktami działań.","it":"Dla procesu DSS02 Zarządzanie zgłoszeniami serwisowymi i incydentami publikacja „Procesy umożliwiające” podaje praktyki, np. rejestrowanie, klasyfikowanie i nadawanie priorytetu zgłoszeniom, wraz z wejściami i wyjściami, np. raportami o zgłoszeniach. To dobre praktyki aktywatora Procesy.","egz":"„Czy stosowane są dobre praktyki?” → mierzone wskaźnikiem wiodącym (s. 29). Nie myl z: Czynnik wpływający na potrzeby interesariuszy – Dobre praktyki to wymiar aktywatora. Nie wpływają na potrzeby interesariuszy.","src":"COBIT 5 Framework (PL), s. 91; COBIT 5 Framework (PL), s. 29"},"cykl-faza-2":{"t":"Projektowanie","eg":"Projektowanie","pd":"Projektowanie","en":"Design (enabler life-cycle phase 2)","wyj":"Rozrysowujesz szczegóły wybranego pomysłu, zanim zaczniesz go budować albo kupować.\n\nBierzesz wybraną koncepcję i rozpisujesz szczegóły. Dla procesu określasz odpowiedzialność, praktyki, działania oraz wejścia i wyniki. Gotowy projekt przechodzi do fazy 3.\n\nŻeby przed budową lub zakupem wiedzieć dokładnie, jak aktywator ma działać.","zycie":"Wybraliście remont łazienki z prysznicem zamiast wanny. Teraz rysujecie plan: gdzie odpływ, jakie płytki, ile gniazdek. Nic jeszcze nie kujecie. To faza projektowania.","firma":"Sklep wybrał bramkę płatności. Informatyk projektuje, jak będzie wyglądał koszyk, kto zatwierdza zwroty i jakie dane trafią do księgowości. To projektowanie aktywatora.","urzad":"Urząd miasta wybrał zapisy przez Internet. Kierownik projektuje formularz, godziny wizyt i to, kto potwierdza rezerwacje. Nikt jeszcze nie kupił systemu. To faza projektowania.","it":"Projektując proces, korzystasz z modelu opisu procesu z przewodnika Procesy umożliwiające: cele, praktyki, działania, wejścia i wyjścia oraz RACI.","egz":"Faza 2 = Projektowanie. Dla procesu: zdefiniowanie odpowiedzialności, praktyk, działań i produktów działań (Przykład 5, s. 30). Egzaminacyjnej nazwy PL faz cyklu życia aktywatora nie potwierdziliśmy (brak w SP1 i w zestawieniu Altkom). Używamy nazwy z FW-PL (s. 29, il. 13). Nie myl z: Budowanie/nabywanie/tworzenie/wdrażanie – Projektowanie kończy się projektem. Budowanie, nabywanie, tworzenie i wdrażanie zamienia projekt w działający aktywator.; Elementy opisu procesu (Przewodnik Procesy umożliwiające) – Model opisu procesu (cele, praktyki, wejścia i wyjścia, RACI) to narzędzie używane przy projektowaniu procesu, a nie sama faza.; Faza 3 wdrożenia „Dokąd chcemy dojść?” – To określenie stanu docelowego całego programu wdrożenia. Projektowanie dotyczy jednego aktywatora.","src":"COBIT 5 Framework (PL), s. 29; COBIT 5 Framework (PL), s. 30; COBIT 5 Framework (PL), s. 28, Ilustracja 13"},"wymiary-aktywatora":{"t":"Wymiary aktywatora","eg":"Wymiary aktywatora","pd":"Wymiary czynnika umożliwiającego","en":"Enabler dimensions","wyj":"Cztery pytania o każdą część układanki: kogo dotyczy, po co jest, jak żyje, jak ją dobrze robić.\n\nKażdy aktywator ma cztery wspólne wymiary (enabler dimensions): interesariusze (stakeholders), cele (goals), cykl życia (life cycle) i dobre praktyki (good practice). Cele dzielą się na jakość wewnętrzną, jakość kontekstową oraz dostęp i bezpieczeństwo. Do wymiarów dochodzi zarządzanie wydajnością aktywatora: wskaźniki opóźnione mierzą interesariuszy i cele, a wskaźniki wiodące cykl życia i dobre praktyki.\n\nŻeby każdy z 7 aktywatorów opisywać i ulepszać tymi samymi czterema pytaniami, w sposób typowy, prosty i uporządkowany.","zycie":"Rodzina prowadzi domowy budżet w arkuszu. Korzystają z niego rodzice, a nastolatek sprawdza swoje kieszonkowe; budżet ma pokazać, czy starczy na wakacje; w styczniu zakładacie nowy, co miesiąc go uzupełniacie, a stary archiwizujecie; podpatrzyliście metodę kopertową. Kto, po co, jak żyje i jak robić dobrze – to cztery wymiary aktywatora.","firma":"Sklep internetowy z butami ma procedurę reklamacji. Dotyczy klienta i pracownika magazynu, ma dać odpowiedź w 14 dni, ktoś ją napisał, wdrożył i raz w roku przegląda, a oparto ją na wzorze z branżowego poradnika. Te same cztery wymiary – interesariusze, cele, cykl życia, dobre praktyki – opisują każdy aktywator.","urzad":"Szkoła wprowadza zgłaszanie nieobecności przez dziennik elektroniczny. Dotyczy rodziców, wychowawców i sekretariatu; usprawiedliwienie ma trafić w 7 dni; procedurę opracowano, przeszkolono nauczycieli i poprawia się ją po zmianie statutu; wzorowano się na sprawdzonym rozwiązaniu z sąsiedniej szkoły. To cztery wymiary aktywatora.","it":"Proces DSS02 (Zarządzanie zgłoszeniami serwisowymi i incydentami) opisany wymiarami: interesariusze to użytkownicy i dział wsparcia, cel to przywracanie usług w uzgodnionym czasie, cykl życia to zaprojektowanie, wdrożenie i przeglądy procesu, a dobre praktyki to praktyki procesu z wejściami i wyjściami.","egz":"Cztery wymiary to Interesariusze, Cele, Cykl życia, Dobre praktyki. „Dobre praktyki” to wymiar aktywatora, a nie wyznacznik potrzeb (s. 28). Egzamin: „Wymiar aktywatora”. Podręcznik: „Wymiar czynnika umożliwiającego”. Nie myl z: Aktywator – Aktywatorów jest 7 kategorii. Wymiary (4) są wspólne dla każdego z nich.; Wymiar procesu / wymiar zdolności (ISO 15504) – To wymiary modelu oceny procesów (PAM), a nie modelu aktywatora.","src":"COBIT 5 Framework (PL), s. 28; COBIT 5 Framework (PL), s. 28, Ilustracja 13"},"jakosc-wewnetrzna":{"t":"Jakość wewnętrzna","eg":"Jakość wewnętrzna","pd":"Jakość rzeczywista","en":"Intrinsic quality","wyj":"Informacja jest sama w sobie dobra: prawdziwa, dokładna, z pewnego źródła.\n\nOceniasz aktywator niezależnie od tego, kto i do czego go używa: czy działa dokładnie (accurately) i obiektywnie (objectively) oraz czy daje dokładne, obiektywne i wiarygodne wyniki (believable results). Dla informacji to dokładność, obiektywność, wiarygodność i reputacja. Dla procesów cele wewnętrzne obejmują też zgodność z dobrą praktyką oraz z regułami wewnętrznymi i zewnętrznymi.\n\nŻeby sprawdzić, czy aktywator sam w sobie działa poprawnie i daje prawdziwe, obiektywne wyniki, zanim zapytamy, czy pasuje do sytuacji.","zycie":"Kupujesz w markecie kilogram jabłek, a w domu kuchenna waga pokazuje 870 gramów. Któraś z wag kłamie – a waga ma pokazywać prawdę bez względu na to, kto i co na niej kładzie. To jest jakość wewnętrzna: wynik dokładny i obiektywny sam w sobie.","firma":"W piekarni kasa fiskalna nalicza VAT według przepisów i drukuje paragon zgodny z tym, co klient kupił. Nieważne, czy przy kasie stoi właściciel, czy uczeń na pierwszej zmianie – suma ma się zgadzać. Dokładność i zgodność z regułami to jakość wewnętrzna.","urzad":"Mieszkanka przychodzi do urzędu gminy po zaświadczenie o zameldowaniu, a w rejestrze wciąż figuruje jej stary adres, bo ktoś nie wprowadził zmiany. Zaświadczenie jest czytelne i wydane od ręki, ale nieprawdziwe. Zawodzi jakość wewnętrzna: dane w rejestrze nie są dokładne.","it":"Audytor w MEA02 (Monitorowanie, ocena i oszacowanie systemu kontroli wewnętrznej) sprawdza, czy raport uprawnień z systemu kadrowego pokazuje rzeczywiste konta, bez pominięć i przekłamań. Badanie dokładności i obiektywności tego raportu to ocena jakości wewnętrznej aktywatora Informacja.","egz":"„Dokładne, obiektywne, wiarygodne wyniki” → jakość wewnętrzna, a nie kontekstowa (s. 29). Egzamin: „Jakość wewnętrzna” / „Cel wewnętrzny”. Podręcznik: „Jakość rzeczywista”. EN: intrinsic quality. Nie myl z: Jakość kontekstowa – Kontekstowa ocenia, czy wynik jest przydatny w danej sytuacji: aktualny, kompletny, zrozumiały.; Jakość wewnętrzna jako „wewnątrz organizacji” – „Wewnętrzna” = intrinsic = sama w sobie. Nie chodzi o „wewnątrz firmy”.","src":"COBIT 5 Framework (PL), s. 29"},"cykl-faza-1":{"t":"Planowanie","eg":"Planowanie","pd":"Planowanie (obejmuje opracowanie oraz wybór koncepcji)","en":"Plan (enabler life-cycle phase 1)","wyj":"Pierwszy krok w życiu rzeczy: wymyślasz kilka pomysłów i wybierasz ten, który zrobisz.\n\nOpracowujesz kilka koncepcji aktywatora. Porównujesz je z celem, np. z korzyścią, ryzykiem i kosztem. Wybierasz jedną i dopiero wtedy przechodzisz do projektowania.\n\nŻeby aktywator powstał z przemyślanego wyboru, a nie z przypadku.","zycie":"Rodzina chce psa. Najpierw rozważacie: duży czy mały, ze schroniska czy z hodowli, kto będzie go wyprowadzał. Wybieracie małego psa ze schroniska. To faza planowania: pomysły i wybór.","firma":"Właściciel sklepu chce przyjmować płatności BLIK. Porównuje trzy rozwiązania: terminal, bramkę płatności w sklepie internetowym, aplikację. Wybiera bramkę. To faza planowania aktywatora.","urzad":"Urząd miasta chce skrócić kolejki w wydziale komunikacji. Kierownik rozważa system numerków, zapisy przez Internet albo dodatkowe okienko. Wybiera zapisy przez Internet. Ten wybór koncepcji to faza planowania.","it":"Przy nowym systemie kierownictwo IT porównuje warianty: budowa, zakup albo usługa w chmurze. Takie decyzje inwestycyjne wspiera m.in. APO05 (Zarządzanie portfelem projektów) (interpretacja kursu).","egz":"Faza 1 = Planowanie: opracowanie i wybór koncepcji. Egzaminacyjnej nazwy PL faz cyklu życia aktywatora nie potwierdziliśmy (brak w SP1 i w zestawieniu Altkom). Używamy nazwy z FW-PL (s. 29, il. 13). „Planowanie” aktywatora to nie domena APO („Dostosuj, Planuj i Organizuj”) ani „Planuj” z PBRM, ani faza 4 wdrożenia (Planowanie programu). Egzaminacyjnej nazwy PL faz cyklu życia aktywatora nie potwierdziliśmy (brak w SP1 i w zestawieniu Altkom). Używamy nazwy z FW-PL (s. 29, il. 13). Nie myl z: Dostosuj, Planuj i Organizuj (APO) – APO (Dostosuj, Planuj i Organizuj) to domena procesów Zarządzania. Faza 1 to etap życia jednego aktywatora.; Planuj, Twórz, Wykonuj i Monitoruj – „Planuj” w Planuj, Twórz, Wykonuj i Monitoruj to obszar działań Zarządzania, a nie faza życia aktywatora.; Faza 4 wdrożenia „Co trzeba zrobić?” (Planowanie programu) – To faza programu wdrażania COBIT 5 (7 faz). Faza 1 cyklu życia aktywatora to wybór koncepcji jednego aktywatora.","src":"COBIT 5 Framework (PL), s. 29; COBIT 5 Framework (PL), s. 28, Ilustracja 13"},"wymiar-interesariusze":{"t":"Interesariusze (wymiar aktywatora)","eg":"Interesariusze (wymiar aktywatora)","pd":"Interesariusze (wymiar czynnika umożliwiającego)","en":"Stakeholders (enabler dimension)","wyj":"Kto korzysta z danej procedury, systemu czy zespołu albo czuje skutki jego działania, z firmy i spoza niej.\n\nDla aktywatora wypisujesz strony z aktywną rolą i strony tylko zainteresowane. Dzielisz je na wewnętrzne i zewnętrzne. Potem sprawdzasz, czy ich potrzeby uwzględniono, i mierzysz to wskaźnikiem opóźnionym.\n\nŻeby przy każdym aktywatorze wiedzieć, kto w nim uczestniczy i czyje potrzeby ma spełniać.","zycie":"Domowy grafik sprzątania ma swoich interesariuszy. Dzieci i rodzice sprzątają według niego, a babcia, która przychodzi w niedzielę, cieszy się z porządku. Sąsiad z dołu chce, żeby odkurzać po 8 rano. Wszyscy oni to interesariusze tego jednego „aktywatora”.","firma":"Procedura zwrotów w sklepie internetowym ma interesariuszy wewnętrznych: magazyn, księgowość, obsługę klienta. Ma też zewnętrznych: klientów i firmę kurierską. Każdy chce czego innego: klient szybkiego zwrotu, księgowa porządku w papierach.","urzad":"System kolejkowy w urzędzie miasta ma interesariuszy wewnętrznych: urzędników przy 8 okienkach i kierownika sali obsługi. Ma też zewnętrznych: mieszkańców, którzy biorą bilet z numerkiem, i firmę serwisującą. Mieszkańcy są interesariuszami, choć nie mają konta w systemie.","it":"Interesariuszy procesu DSS02 wskazuje tabela RACI: pomoc techniczna, właściciel procesu, użytkownicy. Tak FW-PL opisuje interesariuszy procesów w Przykładzie 5 (s. 30).","egz":"Wymiar Interesariusze: wewnętrzni i zewnętrzni. Pytanie wydajności „Czy uwzględniono potrzeby interesariuszy?” mierzy wskaźnik opóźniony (wynik), a nie wiodący. „Interesariusze” to w COBIT 5 trzy różne miejsca: Zasada 1, rola z Ilustracji 9 i wymiar aktywatora. Tu chodzi o wymiar, czyli interesariuszy jednego aktywatora. Nie myl z: Interesariusze (właściciele) – delegują – Rola z Ilustracji 9 deleguje władzę organowi Ładu. Wymiar pyta, kto ma rolę lub interes w jednym aktywatorze.; Interesariusz – Hasło ogólne (Zasada 1) dotyczy całej organizacji. Wymiar dotyczy konkretnego aktywatora, np. procesu albo listy numerów.; Diagram RACI – RACI to narzędzie, którym opisujesz interesariuszy procesu. Wymiar istnieje dla każdego z 7 aktywatorów, nie tylko dla procesów.","src":"COBIT 5 Framework (PL), s. 28, Ilustracja 13; COBIT 5 Framework (PL), s. 29; COBIT 5 Framework (PL), s. 30"},"raci":{"t":"Diagram RACI","eg":"Diagram RACI","pd":"Tabela RACI","en":"RACI chart","wyj":"Tabela, która dla każdego zadania mówi: kto robi, kto odpowiada, kogo pytamy, kogo informujemy.\n\nDiagram RACI (RACI chart; w podręczniku: tabela RACI) ma w wierszach praktyki procesu, a w kolumnach role i struktury organizacyjne. W każdej komórce stoi litera: R (Responsible) – wykonuje, A (Accountable) – odpowiada za sukces, C (Consulted) – dostarcza wejścia, komunikacja dwukierunkowa, I (Informed) – otrzymuje informacje, komunikacja jednokierunkowa. Przy jednej praktyce powinien być tylko jeden A (praktyka tabel RACI – interpretacja kursu; FW-PL nie formułuje tej reguły).\n\nŻeby przy każdej czynności było jasne, kto ją wykonuje, kto ostatecznie za nią odpowiada, kogo trzeba zapytać i kogo poinformować, i żeby żadne zadanie nie zostało bez właściciela.","zycie":"Przy remoncie mieszkania ekipa kładzie płytki (R), a Ty jako inwestor płacisz i odpowiadasz za cały remont (A). Przed kuciem ścian uzgadniasz godziny z sąsiadem zza ściany (C), a administratora budynku tylko zawiadamiasz, kiedy będzie hałas (I). Tak wygląda RACI: jeden robi, jeden odpowiada, z jednym rozmawiasz, drugiemu dajesz znać.","firma":"Sklep internetowy przygotowuje promocję na Black Friday. Grafik robi banery (R), kierowniczka marketingu odpowiada za wynik akcji (A), księgowa mówi, jakie rabaty się opłacają (C). Magazyn dostaje maila z terminem, żeby przygotował towar (I).","urzad":"W wydziale budownictwa starostwa inspektor przygotowuje decyzję (R), a naczelnik wydziału ją podpisuje i za nią odpowiada (A). Radca prawny wcześniej opiniuje projekt (C), a wójt gminy, na której terenie ma stanąć budynek, dostaje kopię do wiadomości (I).","it":"COBIT 5 podaje dla każdej praktyki wzorcową tabelę RACI, którą organizacja dostosowuje. Dla praktyki DSS02.05 (rozwiązywanie incydentów i przywracanie usług) organizacja może wpisać: kierownik ds. usług IT – A, zespół wsparcia – R, właściciel procesu biznesowego – C, użytkownicy – I.","egz":"„Ktoś, kto dostaje zadanie do wykonania” → R (odpowiedzialny wykonawczo). „Odpowiada za sukces” → A (odpowiedzialny decyzyjnie). „Dostarcza wejścia” → C (rola konsultanta). „Otrzymuje informacje” → I. R po polsku na egzaminie to „Odpowiedzialny wykonawczo”, czyli ten, kto wykonuje. A to „Odpowiedzialny decyzyjnie”, czyli ten, kto odpowiada za sukces. Obie nazwy zaczynają się od „odpowiedzialny” – rozróżnia je drugie słowo. Podręcznik: „strona odpowiedzialna” (R) i „strona rozliczana” (A). Nie myl z: Role, działania i relacje – Ilustracja 9 to ogólne relacje w systemie Ładu. RACI przypisuje role do konkretnych praktyk procesu.","src":"COBIT 5 Framework (PL), s. 89; COBIT 5 Framework (PL), s. 90; COBIT 5 Framework (PL), s. 92; COBIT 5 Framework (PL), s. 93"},"aktywator":{"t":"Aktywator","eg":"Aktywator","pd":"Czynnik umożliwiający","en":"Enabler","wyj":"Wszystko, co musi zagrać, żeby informatyka działała dobrze: ludzie, reguły, narzędzia, informacje.\n\nCOBIT 5 dzieli aktywatory (enablers) na 7 kategorii, od Zasad, polityk i struktur ramowych (Principles, Policies and Frameworks) po Ludzi, umiejętności i kompetencje (People, Skills and Competencies). Kaskada celów wyznacza, czego oczekujemy od każdego aktywatora (cele aktywatora). Aktywatory są od siebie zależne i dostarczają sobie wejść, np. proces potrzebuje informacji i przeszkolonych ludzi. Każdy opisuje się w 4 wymiarach: interesariusze, cele, cykl życia, dobre praktyki.\n\nŻeby organizacja widziała wszystko, co musi zagrać, by osiągnąć cele, a nie tylko technologię. Aktywatory to elementy, przez które Ład i Zarządzanie realnie wpływają na wynik.","zycie":"Chcesz, żeby dzieci same odrabiały lekcje. Ustalacie zasadę „najpierw zadania, potem tablet”, stałą godzinę po obiedzie, kupujecie biurko z lampką, a Ty w tym czasie też siadasz z książką zamiast z telefonem. Zasada, stała pora, biurko i Twój przykład to różne aktywatory – działają dopiero razem.","firma":"Właścicielka kawiarni chce, żeby kawa smakowała tak samo na każdej zmianie. Spisuje recepturę, ustala kolejność parzenia, szkoli nowego baristę i oddaje ekspres do serwisu. Receptura, sposób parzenia, umiejętności baristy i ekspres to aktywatory – brak jednego psuje całość.","urzad":"Urząd gminy chce wydawać decyzje w terminie. Ma instrukcję kancelaryjną, ustalony obieg wniosku, wydział, który za sprawę odpowiada, system EZD i urzędników po szkoleniu z KPA. Każdy z tych elementów to aktywator innej kategorii.","it":"Proces DSS04 Zarządzanie ciągłością to aktywator z kategorii Procesy, ale działa tylko razem z innymi: polityką ciągłości (Zasady, polityki i struktury ramowe), aktualnym planem awaryjnym (Informacja), stanowiskiem zapasowym (Usługi, infrastruktura i aplikacje) i przećwiczonym zespołem (Ludzie, umiejętności i kompetencje).","egz":"Pułapka terminologiczna nr 1 obok Ład/Nadzór. Liczba kategorii: 7. Liczba zasad: 5. Liczba procesów: 37. Egzamin: „Aktywator”. Podręcznik: „Czynnik umożliwiający”. EN: Enabler. W pytaniach egzaminacyjnych prawie zawsze pada „Aktywator”. Nie myl z: Czynnik wpływający na potrzeby interesariuszy – Wyznacznik zmienia potrzeby; aktywator pomaga je zaspokoić.; Komponent (COBIT 2019) – W COBIT 2019 aktywatory nazwano „komponentami systemu ładu”. Na egzaminie COBIT 5 używaj „aktywator”.","src":"COBIT 5 Framework (PL), s. 14; COBIT 5 Framework (PL), s. 91; materiały Altkom"}},"S":[{"lekcje":["pr-k36-wymiary-aktywatora"],"pt":"Lekcja 1.36","h":"Każdy aktywator opisują te same cztery wymiary","b":"<p><w k=\"wymiary-aktywatora\">Wymiary aktywatora</w> <span class=\"en\"><w k=\"aktywator\">Enabler</w> dimensions</span>, Ilustracja 13:</p><div class=\"tblwrap\"><table class=\"tbl\"><tr><th>Wymiar</th><th>Zawiera</th></tr><tr><td><w k=\"wymiar-interesariusze\">Interesariusze</w></td><td>wewnętrzni, zewnętrzni</td></tr><tr><td><w k=\"wymiar-cele\">Cele</w></td><td>trzy kategorie celów</td></tr><tr><td><w k=\"wymiar-cykl-zycia\">Cykl życia</w></td><td>sześć faz</td></tr><tr><td><w k=\"dobre-praktyki\">Dobre praktyki</w> <span class=\"en\">Good practices</span></td><td>praktyki, produkty działań (wejścia i wyniki)</td></tr></table></div>","c":"Wymiary to cztery rubryki opisu każdego z siedmiu aktywatorów, a nie kolejne aktywatory.","s":"COBIT 5 Framework (PL), s. 28–30, Ilustracja 13, Przykład 5","ctx":"<p>Wspólne wymiary pozwalają używać aktywatorów w sposób typowy, prosty i uporządkowany oraz zarządzać ich złożonymi powiązaniami. Interesariusze to strony aktywne lub zainteresowane aktywatorem; Cele to ostatni etap Kaskady Celów; Dobre praktyki to sugestie optymalnego wdrożenia plus wymagane wejścia i wyniki. COBIT 5 podaje dobre praktyki tylko dla niektórych aktywatorów (np. procesów); dla innych sięga się po inne standardy.</p><p>Pułapki: <b>dobre</b>, a nie „najlepsze” praktyki <span class=\"en\">best practices</span>; dobre praktyki to wymiar, a nie <w k=\"wyznacznik\">wyznacznik</w>; wymiary aktywatora to coś innego niż wymiar procesu i wymiar zdolności z oceny procesów.</p><p>Przykład 5: kierownicy ds. procesów opisują proces wymiarami – interesariuszy wskazuje tabela <w k=\"raci\">RACI</w>, cele i mierniki podano dla APO08 Zarządzanie relacjami, cykl życia to zaprojektowanie, realizacja, monitorowanie i dostosowanie, a dobre praktyki daje przewodnik „COBIT 5: Procesy umożliwiające”.</p>"},{"pt":"Sprawdź się","quiz":{"id":"q-fn-m-14","sylabus":["PR-02-12"],"tresc":"Do którego wymiaru aktywatora należą „produkty pracy (wejścia i wyjścia)”?","opcje":[{"t":"Dobre praktyki","ok":true,"w":"Il. 13 i s. 29: dobre praktyki obejmują praktyki oraz produkty pracy (wejścia i wyjścia); w podręczniku: „produkty działań”."},{"t":"Cykl życia","ok":false,"w":"Cykl życia to fazy: od planowania do pozbywania się."},{"t":"Interesariusze","ok":false,"w":"Interesariusze to strony wewnętrzne i zewnętrzne."},{"t":"Cele","ok":false,"w":"Wyniki brzmią jak cele, ale na Rysunku 13 produkty pracy są w dobrych praktykach."}],"src":"COBIT 5 Framework (EN), sekcja rozdział 5, rysunek 13","pomoc":{"t":"Pytanie dotyczy lekcji 1.36 „Cztery wymiary aktywatora”. Cel lekcji: Potrafię opisać dowolny aktywator czterema wymiarami: Interesariusze, Cele, Cykl życia i Dobre praktyki.","k":["wymiary-aktywatora","dobre-praktyki","wymiar-interesariusze","wymiar-cele"]},"kurs":"Il. 13 i s. 29: dobre praktyki obejmują praktyki oraz produkty pracy (wejścia i wyjścia); w podręczniku: „produkty działań”.","kontekst":""}},{"lekcje":["pr-k37-cykl-zycia"],"pt":"Lekcja 1.37","h":"Cykl życia aktywatora: sześć faz – nie kończy się na wdrożeniu","b":"<p><w k=\"cykl-zycia-aktywatora\">Cykl życia</w> <span class=\"en\">Life cycle</span> ma każdy <w k=\"aktywator\">aktywator</w>:</p><ol><li><w k=\"cykl-faza-1\">Planowanie</w></li><li><w k=\"cykl-faza-2\">Projektowanie</w></li><li>Budowanie / nabywanie / tworzenie / wdrażanie</li><li>Użytkowanie / eksploatacja</li><li>Ocena / monitorowanie</li><li>Aktualizacja / pozbywanie się</li></ol>","c":"Każdy aktywator – także polityka czy komitet – przechodzi sześć faz; po wdrożeniu są jeszcze użytkowanie, ocena i aktualizacja.","s":"COBIT 5 Framework (PL), s. 28–29, Ilustracja 13","ctx":"<p>Cykl prowadzi od rozpoczęcia, przez okres funkcjonowania, do wycofania i dotyczy informacji, struktur, procesów, polityk – nie tylko systemów IT. Planowanie obejmuje opracowanie i wybór koncepcji. Fazę 4 tekst podręcznika nazywa „Użytkowanie/obsługa”, Ilustracja 13 – „Użytkowanie/eksploatacja”; to ta sama faza. Najwięcej problemów bierze się z zaniedbania dwóch ostatnich faz.</p><p>Pułapka: cykl życia aktywatora to nie <w k=\"cykl-wdrozenia\">cykl życia wdrożenia COBIT 5</w>. Pierwszy opisuje jedną rzecz i ma sześć faz; drugi to program wprowadzania COBIT 5 w organizacji – siedem faz i pierścienie. Liczba faz w pytaniu podpowiada, o który chodzi.</p><p>Przykład z urzędu: wykaz osób upoważnionych do przetwarzania danych osobowych przygotowano i wdrożono, ale nikt go nie przegląda (faza 5) ani nie usuwa osób, które odeszły (faza 6) – formalnie działa, a celów już nie spełnia.</p>"},{"pt":"Sprawdź się","quiz":{"id":"q-fn-m-14","sylabus":["PR-02-12"],"tresc":"Do którego wymiaru aktywatora należą „produkty pracy (wejścia i wyjścia)”?","opcje":[{"t":"Cykl życia","ok":false,"w":"Cykl życia to fazy: od planowania do pozbywania się."},{"t":"Dobre praktyki","ok":true,"w":"Il. 13 i s. 29: dobre praktyki obejmują praktyki oraz produkty pracy (wejścia i wyjścia); w podręczniku: „produkty działań”."},{"t":"Interesariusze","ok":false,"w":"Interesariusze to strony wewnętrzne i zewnętrzne."},{"t":"Cele","ok":false,"w":"Wyniki brzmią jak cele, ale na Rysunku 13 produkty pracy są w dobrych praktykach."}],"src":"COBIT 5 Framework (EN), sekcja rozdział 5, rysunek 13","pomoc":{"t":"Pytanie dotyczy lekcji 1.37 „Cykl życia aktywatora – sześć faz”. Cel lekcji: Potrafię wymienić sześć faz cyklu życia aktywatora w kolejności i rozpoznać fazę w opisie.","k":["cykl-zycia-aktywatora","cykl-faza-1","cykl-faza-2","cykl-faza-3"]},"kurs":"Il. 13 i s. 29: dobre praktyki obejmują praktyki oraz produkty pracy (wejścia i wyjścia); w podręczniku: „produkty działań”.","kontekst":""}},{"lekcje":["pr-k38-kategorie-celow","pr-k39-kategorie-rozpoznaj"],"pt":"Lekcje 1.38–1.39","h":"Trzy kategorie celów: czy prawdziwy, czy przydatny, czy dostępny i chroniony","b":"<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>Kategoria</th><th>Słowa-klucze</th></tr><tr><td><w k=\"jakosc-wewnetrzna\">Jakość wewnętrzna</w> <span class=\"en\">Intrinsic quality</span></td><td>dokładne, obiektywne, uznane</td></tr><tr><td><w k=\"jakosc-kontekstowa\">Jakość kontekstowa</w> <span class=\"en\">Contextual quality</span></td><td>istotne, kompletne, aktualne, zrozumiałe, łatwe w użyciu</td></tr><tr><td><w k=\"dostep-i-bezpieczenstwo\">Dostęp i Bezpieczeństwo</w> <span class=\"en\">Accessibility and security</span></td><td>dostępne w razie potrzeby, tylko dla uprawnionych</td></tr></table></div>","c":"Kategorię rozpoznajesz po słowie-kluczu; „wewnętrzna” znaczy „sama w sobie”, a nie „wewnątrz organizacji”.","s":"COBIT 5 Framework (PL), s. 28–29, Ilustracja 13","ctx":"<p>Jakość wewnętrzna: czy aktywator działa dokładnie i obiektywnie i daje dokładne, obiektywne, uznane wyniki. Jakość kontekstowa: czy aktywator i jego wyniki pasują do celu w danej sytuacji. Dostęp i Bezpieczeństwo: czy jest dostępny, gdy trzeba, a wyniki są „dostępne jedynie dla osób uprawnionych i potrzebujących takiego dostępu”. Dokładny raport, który przychodzi za późno, ma dobrą jakość wewnętrzną i złą kontekstową.</p><p>Pułapki: podręcznik pisze „jakość rzeczywista” (egzamin: wewnętrzna), a na Ilustracji 13 „Dostępność i bezpieczeństwo”. „Wewnętrzna” to cecha samej rzeczy – kategorii „jakość zewnętrzna” nie ma. <b>Kompletne</b> to jakość kontekstowa, nie wewnętrzna, bo kompletność zależy od potrzeb odbiorcy.</p><p>Przykład z banku: „kursy walut zgodne z notowaniami” → wewnętrzna; „wyciąg zawiera wszystkie operacje i jest czytelny” → kontekstowa; „aplikacja działa całą dobę, a dane widzi tylko właściciel konta” → dostęp i bezpieczeństwo.</p>"},{"pt":"Sprawdź się","quiz":{"id":"q-pra-36-3","sylabus":["PR-02-12"],"tresc":"Które cztery wymiary ma każdy aktywator w COBIT 5 (<em>Enabler dimensions</em>)?","opcje":[{"t":"Wymiar procesu, wymiar zdolności, cele i praktyki","ok":false,"w":"Wymiar procesu i zdolności to pojęcia z oceny procesów."},{"t":"Interesariusze, Cele, Cykl życia, Najlepsze praktyki","ok":false,"w":"COBIT 5 mówi o dobrych, a nie najlepszych praktykach."},{"t":"Interesariusze, Cele, Cykl życia, Dobre praktyki","ok":true,"w":"Dobrze. Tak pokazuje to Ilustracja 13."},{"t":"Finanse, Klient, Obszar wewnętrzny, Szkolenie i rozwój","ok":false,"w":"To wymiary zrównoważonej karty wyników."}],"src":"COBIT 5 Framework (EN), sekcja rozdział 5, rysunek 13","pomoc":{"t":"Pytanie dotyczy lekcji 1.38 „Trzy kategorie celów aktywatora”. Cel lekcji: Potrafię wymienić trzy kategorie celów aktywatora i powiedzieć, o co pyta każda z nich.","k":["jakosc-wewnetrzna","jakosc-kontekstowa","dostep-i-bezpieczenstwo"]},"kurs":"Dobrze. Tak pokazuje to Ilustracja 13.","kontekst":""}},{"pt":"Sprawdź się","quiz":{"id":"q-fn-m-14","sylabus":["PR-02-12"],"tresc":"Do którego wymiaru aktywatora należą „produkty pracy (wejścia i wyjścia)”?","opcje":[{"t":"Cykl życia","ok":false,"w":"Cykl życia to fazy: od planowania do pozbywania się."},{"t":"Interesariusze","ok":false,"w":"Interesariusze to strony wewnętrzne i zewnętrzne."},{"t":"Cele","ok":false,"w":"Wyniki brzmią jak cele, ale na Rysunku 13 produkty pracy są w dobrych praktykach."},{"t":"Dobre praktyki","ok":true,"w":"Il. 13 i s. 29: dobre praktyki obejmują praktyki oraz produkty pracy (wejścia i wyjścia); w podręczniku: „produkty działań”."}],"src":"COBIT 5 Framework (EN), sekcja rozdział 5, rysunek 13","pomoc":{"t":"Pytanie dotyczy lekcji 1.39 „Kategorie celów aktywatora – słowa-klucze i pułapka „wewnętrzna””. Cel lekcji: Potrafię przypisać wymaganie do kategorii celów aktywatora po słowach-kluczach i nie mylę „wewnętrznej” z „wewnątrz organizacji”.","k":[]},"kurs":"Il. 13 i s. 29: dobre praktyki obejmują praktyki oraz produkty pracy (wejścia i wyjścia); w podręczniku: „produkty działań”.","kontekst":""}},{"pt":"Arkusz próbny","sp1":"sp1-06","lekcja":"1.39","temat":"Kategorie celów aktywatora – słowa-klucze i pułapka „wewnętrzna”","k":[]}],"bankRevision":"433f7d6785684a80","legacySp1Order":[null,null,null,null,null,null,null,{"sp1":"sp1-06"}]};</script>
