<script>window.DECK={"id":"k-en-ludzie","rozdzial":"Załącznik G · Aktywatory szczegółowo · s. 65–88","tytul":"Ludzie, Umiejętności i Kompetencje","prev":"k-en-uslugi.html","next":"k-m0-egzamin.html","T":{"proc-apo07":{"t":"APO07 Zarządzanie zasobami ludzkimi","eg":"APO07 Zarządzanie zasobami ludzkimi","pd":"APO07 Zarządzanie zasobami ludzkimi","en":"APO07 Manage Human Resources","wyj":"Dbanie o ludzi w informatyce: kogo zatrudnić, czego ich nauczyć, kto kogo zastąpi i jak ich oceniać.\n\nZapewnienie odpowiednich ludzi i kompetencji, przez planowanie zatrudnienia, rozwój oraz utrzymanie personelu.\n\nŻeby w IT pracowali właściwi ludzie z właściwymi umiejętnościami i żeby nic nie zależało od jednej osoby.","zycie":"W rodzinnej piekarni tylko dziadek umie zrobić zakwas. Gdy zachoruje, nie ma chleba. Rodzina postanawia: wnuczka uczy się od dziadka i co tydzień piecze z nim. Dbanie o umiejętności i zastępstwa to APO07.","firma":"W firmie transportowej jeden informatyk zna system rozliczeń kierowców. Kierownik IT planuje szkolenie drugiej osoby i ocenia kompetencje zespołu. Raz w roku rozmawia z każdym o celach. To APO07.","urzad":"Sekretarz powiatu widzi, że informatyk odchodzi na emeryturę. Planuje nabór, wdrożenie następcy i szkolenia. Ustala też zasady pracy firmy zewnętrznej, która pomaga w serwisie. To APO07.","it":"Kierownik IT ma plan sukcesji dla administratora bazy danych i matrycę kompetencji zespołu. To APO07. Spisana instrukcja administratora to już BAI08.","egz":"Słowa-klucze: obsada, kompetencje, szkolenia, ocena pracowników, zależność od kluczowych osób, personel zewnętrzny → APO07 Human Resources. Nie EDM04 i nie BAI09. Nazwa egzaminacyjna PL niepotwierdzona: na egzaminie nazwa może brzmieć inaczej niż w podręczniku. Egzamin używa własnych tłumaczeń, w domenach trybu rozkazującego (np. „Dostosuj, Planuj i Organizuj”). Rozpoznawaj proces po kodzie APO07 i słowie kluczowym EN Human Resources. Pułapka „zasoby”: APO07 to Human Resources (tylko ludzie). EDM04 to Resource (wszystkie zasoby, Ład). BAI09 to Assets (aktywa). Nie myl z: EDM04 Zapewnienie optymalizacji zasobów – EDM04 (Ład) ocenia i kieruje wykorzystaniem wszystkich zasobów. APO07 (Zarządzanie) zajmuje się ludźmi: obsadą, kompetencjami, szkoleniami.; BAI09 Zarządzanie zasobami – BAI09 Assets to sprzęt i licencje. W podręczniku też „zasoby”, ale nie ludzie.; BAI08 Zarządzanie wiedzą – BAI08 utrzymuje wiedzę: instrukcje, bazy wiedzy. APO07 dba o ludzi i ich umiejętności.; Ludzie, Umiejętności i Kompetencje – To aktywator, czyli kategoria „czego potrzebujemy”. APO07 to proces, który ludźmi zarządza.","src":"COBIT 5: Enabling Processes, sekcja APO07 — Process Description / Purpose / Practices"},"ludzie-umiejetnosci-kompetencje":{"t":"Ludzie, Umiejętności i Kompetencje","eg":"Ludzie, Umiejętności i Kompetencje","pd":"Ludzie, umiejętności i kompetencje","en":"People, Skills and Competencies (enabler 7)","wyj":"Właściwi ludzie z właściwą wiedzą na właściwych miejscach.\n\nDla każdej roli określa się wymagane umiejętności i kompetencje (skills and competencies), przypisane do kategorii umiejętności w domenach procesów. W cyklu życia planuje się bazę umiejętności, rozwija ją szkoleniami albo pozyskuje z zewnątrz, wykorzystuje w rolach, okresowo ocenia i wygasza umiejętności, które przestają być potrzebne. Cele obejmują m.in. wykształcenie i umiejętności techniczne (jakość wewnętrzna) oraz doświadczenie, wiedzę i dostępność ludzi (jakość kontekstowa).\n\nŻeby w każdej roli byli ludzie z wiedzą i umiejętnościami potrzebnymi do wykonania pracy, podejmowania decyzji i naprawiania błędów.","zycie":"Babcia zostaje sama po śmierci dziadka, który zawsze płacił rachunki. Wnuczka przez kilka niedziel uczy ją bankowości w telefonie, po miesiącu sprawdza, czy babcia radzi sobie sama, a rozliczenie podatku zleca znajomej księgowej, bo tego babcia uczyć się nie musi. Ustalić, jakie umiejętności są potrzebne, a potem je wyćwiczyć albo wziąć z zewnątrz – tego dotyczy ten aktywator.","firma":"Piekarnia kupuje piec sterowany z panelu dotykowego. Właściciel spisuje, co musi umieć piekarz na nocnej zmianie, jednego pracownika wysyła na szkolenie u producenta, a gdy drugi odchodzi, przyjmuje kogoś, kto takie piece już obsługiwał. Po pół roku sprawdza, kto sobie radzi, a ręczne pilnowanie temperatury przestaje być umiejętnością, której trzeba uczyć – to cały cykl życia aktywatora Ludzie, Umiejętności i Kompetencje.","urzad":"Szkoła przechodzi na e-dziennik. Dyrektor ustala, co musi umieć każdy nauczyciel i sekretarka, organizuje szkolenie, a konfigurację systemu zleca informatykowi z gminy, zamiast uczyć tego kogoś na miejscu. Na koniec semestru sprawdza, kto jeszcze potrzebuje pomocy – właściwi ludzie z właściwymi umiejętnościami we właściwych rolach to sedno tego aktywatora.","it":"W APO07 (Zarządzanie zasobami ludzkimi) dział IT ustala, że administrator kopii zapasowych musi umieć odtworzyć bazę danych, a na nocnej zmianie zawsze jest ktoś z tą umiejętnością. Brakujące kompetencje uzupełnia szkoleniem albo umową z firmą zewnętrzną.","egz":"Dobra praktyka: wymagania umiejętności dla każdej roli + mapowanie kategorii umiejętności na domeny procesów + zewnętrzne źródła (SFIA). Nie myl z: APO07 Zarządzanie zasobami ludzkimi – APO07 to proces. Ludzie, umiejętności i kompetencje to aktywator.","src":"COBIT 5 Framework (PL), s. 87; COBIT 5 Framework (PL), s. 87, Ilustracja 38"},"dss":{"t":"Dostarczaj, Obsługuj i Wspieraj (DSS)","eg":"Dostarczaj, Obsługuj i Wspieraj (DSS)","pd":"Dostarczanie, obsługa i wsparcie (DSS)","en":"Deliver, Service and Support (DSS)","wyj":"Szuflada zadań „codzienna praca”: żeby systemy chodziły, awarie były usuwane, a dane bezpieczne.\n\nDSS to domena Zarządzania odpowiadająca obszarowi Wykonuj (Run) w cyklu Planuj, Twórz, Wykonuj, Monitoruj. Ma 6 procesów: eksploatacja (DSS01), zgłoszenia serwisowe i incydenty (DSS02), problemy (DSS03), ciągłość (DSS04), usługi bezpieczeństwa (DSS05) i mechanizmy kontrolne procesów biznesowych (DSS06). Przejmuje od BAI gotowe rozwiązania i utrzymuje je w codziennym działaniu.\n\nŻeby usługi IT działały dziś i jutro: były dostarczane, obsługiwane, naprawiane i chronione zgodnie z tym, co zaplanowano i wdrożono.","zycie":"W poniedziałek rano pada router, więc go restartujesz i dzwonisz do operatora (incydent). Gdy pada trzeci raz w miesiącu, szukasz przyczyny i wymieniasz zasilacz (problem). Zapasowy klucz leży u sąsiada, a zdjęcia mają kopię na dysku (ciągłość). Codzienne utrzymanie, żeby dom działał, to DSS.","firma":"W sobotę rano w piekarni przestaje działać terminal płatniczy. Sprzedawczyni zgłasza awarię, serwis przywraca terminal w godzinę, a do tego czasu klienci płacą gotówką według spisanej instrukcji awaryjnej. Codzienna obsługa, usuwanie awarii i plan na czarną godzinę to DSS.","urzad":"Urzędniczka w starostwie nie może zalogować się do EZD i dzwoni do informatyka (zgłoszenie). Informatyk przywraca dostęp, w nocy system robi kopię zapasową, a raz w roku urząd ćwiczy, co robić, gdy padnie serwerownia. To codzienna praca IT w domenie DSS.","it":"W nocy system bankowości internetowej przestaje wysyłać SMS-y z kodami do klientów. Administrator przywraca wysyłkę według procedury obsługi incydentu (DSS02), a potem zespół szuka przyczyny i ustala, że bramka SMS miała błędną konfigurację po aktualizacji (DSS03 Zarządzanie problemami).","egz":"Odróżniaj APO13 (Zarządzanie bezpieczeństwem, czyli planowanie systemu bezpieczeństwa) od DSS05 (Zarządzanie usługami bezpieczeństwa, czyli codzienna ochrona). Ciągłość działania to DSS04. Egzamin: „Dostarczaj, Obsługuj i Wspieraj (DSS)”. Podręcznik: „Dostarczanie, obsługa i wsparcie (DSS)”. Nazwy procesów na egzaminie mogą brzmieć inaczej niż w podręczniku. Rozpoznawaj je po kodzie i angielskim słowie kluczowym.","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; materiały Altkom"},"mea":{"t":"Monitoruj, Oszacuj i Oceń (MEA)","eg":"Monitoruj, Oszacuj i Oceń (MEA)","pd":"Monitorowanie, ocena i oszacowanie (MEA)","en":"Monitor, Evaluate and Assess (MEA)","wyj":"Szuflada zadań „kontrola”: sprawdzać wyniki, przestrzeganie przepisów i to, czy kontrole wewnętrzne działają.\n\nMEA (Monitor, Evaluate and Assess) to domena Zarządzania z trzema procesami. MEA01 monitoruje wydajność i zgodność (performance and conformance), MEA02 system kontroli wewnętrznej (system of internal control), a MEA03 zgodność z wymogami zewnętrznymi (external requirements), np. przepisami. Wyniki trafiają do Ładu, który w EDM monitoruje, czy organizacja trzyma się wyznaczonego kierunku.\n\nŻeby Zarządzanie wiedziało, jak naprawdę idzie: czy cele są osiągane, czy mechanizmy kontrolne działają i czy organizacja spełnia wymogi zewnętrzne, i mogło to rzetelnie zaraportować Ładowi.","zycie":"Pod koniec miesiąca siadasz z wyciągiem z konta: czy zmieściliście się w budżecie, czy zlecenie stałe na czynsz naprawdę się wykonało i czy żaden rachunek nie umknął. Raz w roku sprawdzasz jeszcze, czy PIT rozliczyłeś zgodnie z przepisami. Sprawdzanie wyników, własnych zabezpieczeń i zgodności z przepisami to w domowej skali domena MEA.","firma":"Właścicielka sklepu internetowego co kwartał patrzy na liczbę zwrotów i czas wysyłki (MEA01), sprawdza, czy pracownicy naprawdę robią kopie zapasowe tak, jak każe procedura (MEA02), i czy regulamin sklepu jest zgodny z nowymi przepisami konsumenckimi (MEA03). Te trzy rodzaje sprawdzania to trzy procesy domeny MEA.","urzad":"Sekretarz gminy co pół roku zbiera raport, ile spraw załatwiono w terminie (MEA01), zleca audytorowi wewnętrznemu sprawdzenie, czy kontrola zarządcza działa (MEA02), a informatyk przygotowuje urząd do kontroli zgodności z KRI (MEA03). Mierzenie wyników, sprawdzanie własnych mechanizmów kontrolnych i zgodności z przepisami – to domena MEA.","it":"W MEA03 (Monitorowanie, ocena i oszacowanie zgodności z wymogami zewnętrznymi) dział IT co pół roku sprawdza, czy przetwarzanie danych osobowych spełnia wymogi RODO, i raportuje wynik zarządowi. Zarząd w EDM monitoruje na tej podstawie, czy organizacja trzyma się kierunku.","egz":"MEA to Zarządzanie, nie Ład. „Monitoruj, Oszacuj i Oceń” (MEA) ≠ „Oszacuj, Kieruj i Monitoruj” (EDM). W przepływie: Oszacuj → Kieruj → Planuj → … → Monitoruj (MEA) → Monitoruj (EDM). Egzamin: „Monitoruj, Oszacuj i Oceń (MEA)”. Podręcznik: „Monitorowanie, ocena i oszacowanie (MEA)”. Nazwy procesów na egzaminie mogą brzmieć inaczej niż w podręczniku. Rozpoznawaj je po kodzie i angielskim słowie kluczowym.","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; materiały Altkom"},"jakosc-kontekstowa":{"t":"Jakość kontekstowa","eg":"Jakość kontekstowa","pd":"Jakość kontekstowa","en":"Contextual quality","wyj":"Informacja przydaje się temu, kto jej teraz potrzebuje: jest na temat, aktualna, kompletna i w zrozumiałej formie.\n\nPatrzysz na aktywator i jego rezultaty oczami użytkownika w konkretnym kontekście: czy są istotne (relevant), kompletne (complete), aktualne (current), w odpowiedniej ilości, spójnie i zwięźle przedstawione, zrozumiałe i łatwe w użyciu. Ta sama poprawna informacja może mieć wysoką jakość wewnętrzną, a niską kontekstową, gdy jest nie na temat, niekompletna, nieaktualna albo w nieczytelnej formie. Informacja, która przychodzi za późno, to inny problem: dostępność/terminowość, czyli jakość dostępu i bezpieczeństwa (s. 82). Dla procesów oznacza to dopasowanie do sytuacji organizacji.\n\nŻeby oceniać nie tylko, czy wynik jest poprawny, ale czy przydaje się temu, kto go używa, w jego sytuacji.","zycie":"Kupujesz z drugiej ręki szafę, a poprzedni właściciel daje Ci instrukcję montażu – bardzo dokładną, tyle że po szwedzku i z 50 stronami o modelach, których nie masz. Nic w niej nie jest błędne, ale Tobie się nie przyda. Brakuje jej jakości kontekstowej, czyli dopasowania do Twojej sytuacji.","firma":"Właściciel warsztatu samochodowego dostaje od księgowej 40-stronicowy raport z każdą fakturą z kwartału. Liczby są poprawne, ale on chciał tylko wiedzieć, czy stać go na nowy podnośnik, i tego z raportu nie wyczyta. Raport ma dobrą jakość wewnętrzną, ale słabą kontekstową.","urzad":"Wójt prosi o zestawienie, ile dzieci gmina dowozi do szkół, bo jutro sesja rady o budżecie. Urzędnik przysyła na czas bezbłędny raport, ale z danymi z poprzedniego roku szkolnego i bez dwóch nowych tras. Dane są poprawne, tylko nieaktualne i niekompletne dla tego zadania – brakuje im jakości kontekstowej. Gdyby raport przyszedł dopiero po sesji, zawiodłaby dostępność/terminowość, czyli jakość dostępu i bezpieczeństwa (s. 82).","it":"W DSS02 (Zarządzanie zgłoszeniami serwisowymi i incydentami) raport dla zarządu zawiera tylko pięć głównych wskaźników i trend, a pełna lista zgłoszeń trafia do zespołu wsparcia. Te same dane podane w formie dopasowanej do odbiorcy to cel kontekstowy aktywatora Informacja.","egz":"„Rezultaty właściwe, kompletne, aktualne, zrozumiałe” → jakość kontekstowa. „Dostępne kiedy potrzeba” i „zabezpieczone” → dostęp i bezpieczeństwo (s. 29). Nie myl z: Jakość wewnętrzna – Wewnętrzna: czy dokładne. Kontekstowa: czy przydatne tu i teraz.","src":"COBIT 5 Framework (PL), s. 29"},"bai":{"t":"Twórz, Nabywaj i Wdrażaj (BAI)","eg":"Twórz, Nabywaj i Wdrażaj (BAI)","pd":"Budowanie, nabywanie i wdrażanie (BAI)","en":"Build, Acquire and Implement (BAI)","wyj":"Szuflada zadań „budowa i zmiany”: kupić, zbudować, wdrożyć i bezpiecznie zmieniać systemy.\n\nBAI to domena Zarządzania odpowiadająca obszarowi Twórz (Build) w cyklu Planuj, Twórz, Wykonuj, Monitoruj. Ma 10 procesów: od programów i projektów (BAI01) przez wymagania, budowę rozwiązań, zmiany i ich akceptację po wiedzę, aktywa i konfigurację (BAI08–BAI10). Realizuje to, co zaplanowano w APO, i przekazuje gotowe rozwiązania do codziennej eksploatacji w DSS.\n\nŻeby nowe rozwiązania i zmiany w IT powstawały lub były kupowane zgodnie z wymaganiami i wchodziły do użytku w kontrolowany sposób, bez psucia tego, co już działa.","zycie":"Remontujecie kuchnię. Spisujecie, czego potrzebujecie, wybieracie ekipę, kupujecie szafki, montujecie, a na koniec sprawdzacie, czy wszystko działa, zanim zapłacicie ostatnią ratę. Instrukcje i gwarancje lądują w jednej teczce. Plan, zakup, montaż, odbiór i spis tego, co macie, to obszar BAI.","firma":"Piekarnia uruchamia sklep internetowy z dowozem. Właścicielka spisuje wymagania, wybiera gotową platformę, testuje zamówienia na rodzinie, szkoli sprzedawczynie i dopiero potem włącza sklep dla klientów. Budowa lub zakup i wdrożenie zmiany to domena BAI.","urzad":"Starostwo wdraża EZD. Najpierw spisuje wymagania i ogłasza przetarg, potem dostawca konfiguruje system, urzędnicy przechodzą szkolenia, a papierowy obieg jest wygaszany dopiero po odbiorze. Cały ten projekt zmiany mieści się w BAI.","it":"BAI06 Zarządzanie zmianami: administrator chce zaktualizować oprogramowanie serwera systemu CRM. Zmiana dostaje wniosek, ocenę skutków i zgodę, jest testowana w środowisku testowym, a po wdrożeniu nową wersję zapisuje się w bazie konfiguracji (BAI10 Zarządzanie konfiguracją).","egz":"Uwaga: BAI09 „Zarządzanie zasobami” to po angielsku Assets, czyli aktywa (sprzęt, licencje). To NIE jest optymalizacja zasobów (EDM04) ani zasoby ludzkie (APO07). Egzamin: „Twórz, Nabywaj i Wdrażaj (BAI)”. Podręcznik: „Budowanie, nabywanie i wdrażanie (BAI)”. Nazwy procesów na egzaminie mogą brzmieć inaczej niż w podręczniku. Rozpoznawaj je po kodzie i angielskim słowie kluczowym.","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; materiały Altkom"},"kategorie-umiejetnosci":{"t":"Kategorie umiejętności","eg":"Kategorie umiejętności","pd":"Kategorie umiejętności w ramach metodyki COBIT 5","en":"Skill categories per process domain (Figure 39)","wyj":"Jakie umiejętności są potrzebne do jakich zadań, np. planista do planowania, serwisant do napraw.\n\nCOBIT 5 (Ilustracja 39) przypisuje przykładowe kategorie umiejętności (skill categories) do pięciu domen procesów. EDM: Ład nad IT; APO: m.in. strategia IT, architektura korporacyjna, zarządzanie portfelami; BAI: m.in. analiza biznesowa, zarządzanie projektami, zarządzanie pojemnością; DSS: m.in. zarządzanie dostępnością, Service Desk i incydenty, administracja bezpieczeństwa; MEA: weryfikacja zgodności, monitorowanie sprawności, audyt mechanizmów kontrolnych. To dobra praktyka aktywatora Ludzie, Umiejętności i Kompetencje.\n\nŻeby wiedzieć, jakich umiejętności trzeba w każdym obszarze pracy IT, i planować rekrutację oraz szkolenia według domen procesów, a nie na wyczucie.","zycie":"Planujecie remont mieszkania. Ktoś musi zdecydować, czy w ogóle w to wchodzicie i ile najwyżej wydacie (EDM), ktoś ułożyć plan i budżet (APO), ktoś kierować ekipą i pilnować prac (BAI), ktoś potem naprawiać usterki (DSS), a ktoś na końcu sprawdzić, czy wyszło zgodnie z planem i fakturami (MEA). Każde z tych zadań wymaga innych umiejętności – tak COBIT układa kategorie umiejętności według domen.","firma":"W sklepie internetowym właścicielka decyduje, czy w ogóle inwestować w nowy system (EDM), wspólnik liczy budżet i wybiera kierunek rozwoju IT (APO), zewnętrzny programista wdraża nowy koszyk (BAI), pracownik odbiera zgłoszenia klientów, że strona nie działa (DSS), a księgowa sprawdza, czy przestrzegano zasad (MEA). Każda z tych osób potrzebuje innych umiejętności, przypisanych do innej domeny.","urzad":"W starostwie zarząd powiatu nadzoruje informatykę jako całość (EDM), naczelnik wydziału IT układa strategię i budżet (APO), informatyk wdraża nowy system obiegu dokumentów i zbiera wymagania od urzędników (BAI), administrator odbiera zgłoszenia i przywraca dostęp do sieci (DSS), a audytor wewnętrzny sprawdza mechanizmy kontrolne (MEA). Każda z tych ról wymaga innego zestawu umiejętności z innej domeny procesów.","it":"W APO07 (Zarządzanie zasobami ludzkimi) dział IT przypisuje role do domen: kierownik projektów (BAI, zarządzanie projektami), analityk pojemności (BAI, zarządzanie pojemnością), konsultant Service Desk (DSS), audytor IT (MEA, audyt mechanizmów kontrolnych). Na tej podstawie planuje szkolenia, np. według SFIA.","egz":"Portfel i architektura korporacyjna → APO; projekty, wymagania, pojemność → BAI; dostępność, Service Desk, incydenty → DSS; zgodność i audyt → MEA. Nie myl z: Pułapka: pojemność vs dostępność – Na Ilustracji 39 zarządzanie POJEMNOŚCIĄ jest w BAI, a zarządzanie DOSTĘPNOŚCIĄ w DSS, choć proces BAI04 obejmuje oba.; Pułapka: projekty vs portfel – Zarządzanie PROJEKTAMI to BAI, a zarządzanie PORTFELAMI projektów to APO.","src":"COBIT 5 Framework (PL), s. 88, Ilustracja 39"},"jakosc-wewnetrzna":{"t":"Jakość wewnętrzna","eg":"Jakość wewnętrzna","pd":"Jakość rzeczywista","en":"Intrinsic quality","wyj":"Informacja jest sama w sobie dobra: prawdziwa, dokładna, z pewnego źródła.\n\nOceniasz aktywator niezależnie od tego, kto i do czego go używa: czy działa dokładnie (accurately) i obiektywnie (objectively) oraz czy daje dokładne, obiektywne i wiarygodne wyniki (believable results). Dla informacji to dokładność, obiektywność, wiarygodność i reputacja. Dla procesów cele wewnętrzne obejmują też zgodność z dobrą praktyką oraz z regułami wewnętrznymi i zewnętrznymi.\n\nŻeby sprawdzić, czy aktywator sam w sobie działa poprawnie i daje prawdziwe, obiektywne wyniki, zanim zapytamy, czy pasuje do sytuacji.","zycie":"Kupujesz w markecie kilogram jabłek, a w domu kuchenna waga pokazuje 870 gramów. Któraś z wag kłamie – a waga ma pokazywać prawdę bez względu na to, kto i co na niej kładzie. To jest jakość wewnętrzna: wynik dokładny i obiektywny sam w sobie.","firma":"W piekarni kasa fiskalna nalicza VAT według przepisów i drukuje paragon zgodny z tym, co klient kupił. Nieważne, czy przy kasie stoi właściciel, czy uczeń na pierwszej zmianie – suma ma się zgadzać. Dokładność i zgodność z regułami to jakość wewnętrzna.","urzad":"Mieszkanka przychodzi do urzędu gminy po zaświadczenie o zameldowaniu, a w rejestrze wciąż figuruje jej stary adres, bo ktoś nie wprowadził zmiany. Zaświadczenie jest czytelne i wydane od ręki, ale nieprawdziwe. Zawodzi jakość wewnętrzna: dane w rejestrze nie są dokładne.","it":"Audytor w MEA02 (Monitorowanie, ocena i oszacowanie systemu kontroli wewnętrznej) sprawdza, czy raport uprawnień z systemu kadrowego pokazuje rzeczywiste konta, bez pominięć i przekłamań. Badanie dokładności i obiektywności tego raportu to ocena jakości wewnętrznej aktywatora Informacja.","egz":"„Dokładne, obiektywne, wiarygodne wyniki” → jakość wewnętrzna, a nie kontekstowa (s. 29). Egzamin: „Jakość wewnętrzna” / „Cel wewnętrzny”. Podręcznik: „Jakość rzeczywista”. EN: intrinsic quality. Nie myl z: Jakość kontekstowa – Kontekstowa ocenia, czy wynik jest przydatny w danej sytuacji: aktualny, kompletny, zrozumiały.; Jakość wewnętrzna jako „wewnątrz organizacji” – „Wewnętrzna” = intrinsic = sama w sobie. Nie chodzi o „wewnątrz firmy”.","src":"COBIT 5 Framework (PL), s. 29"},"apo":{"t":"Dostosuj, Planuj i Organizuj (APO)","eg":"Dostosuj, Planuj i Organizuj (APO)","pd":"Dopasowanie, planowanie i organizacja (APO)","en":"Align, Plan and Organise (APO)","wyj":"Szuflada zadań „planowanie”: ustalić, w co inwestujemy, jak się organizujemy i czego nam trzeba.\n\nAPO to pierwsza z czterech domen Zarządzania i odpowiada obszarowi Planuj w cyklu Planuj, Twórz, Wykonuj, Monitoruj (Plan, Build, Run, Monitor). Ma 13 procesów, od APO01 Zarządzanie metodyką zarządzania IT do APO13 Zarządzanie bezpieczeństwem. Obejmuje strategię, architekturę, innowacje, portfel, budżet, ludzi, relacje, umowy, dostawców, jakość, ryzyko i bezpieczeństwo.\n\nŻeby działania IT były zaplanowane, zorganizowane i dopasowane do kierunku wyznaczonego przez Ład, zanim cokolwiek się zbuduje lub uruchomi.","zycie":"W styczniu siadacie z partnerem i planujecie rok: ile odłożyć na wakacje, czy wymieniać auto, kto przejmuje opłaty, a kto szuka tańszego internetu. Zanim cokolwiek kupicie, wiecie, po co i za ile. To jest APO: planowanie i organizacja, zanim coś się zbuduje albo uruchomi.","firma":"Właściciel sklepu internetowego postanawia, że w tym roku zacznie sprzedawać do Czech. Liczy budżet na nową wersję sklepu, wybiera firmę kurierską, sprawdza, kto w zespole zna czeski, i zastanawia się, co będzie, jeśli padnie bramka płatności. Strategia, budżet, ludzie, dostawcy i ryzyko to właśnie obszar APO.","urzad":"Sekretarz starostwa przygotowuje plan cyfryzacji na trzy lata. Ustala, które e-usługi idą najpierw, ile pieniędzy zaplanować w budżecie, z kim podpisać umowę serwisową i jak chronić dane mieszkańców. To planowanie i organizowanie IT – domena APO.","it":"APO06 Zarządzanie budżetem i kosztami: CIO układa budżet IT firmy na rok, przypisuje koszty do usług (np. utrzymanie systemu ERP) i co kwartał porównuje plan z wykonaniem. Decyzja, ile w ogóle przeznaczyć na IT i na co postawić, należy do Ładu (EDM04 Zapewnienie optymalizacji zasobów).","egz":"Kategorie umiejętności zarządzanie portfelami projektów i architektura korporacyjna należą do domeny APO (Ilustracja 39). Egzamin: „Dostosuj, Planuj i Organizuj (APO)”. Podręcznik: „Dopasowanie, planowanie i organizacja (APO)”. Nazwy procesów na egzaminie mogą brzmieć inaczej niż w podręczniku. Rozpoznawaj je po kodzie i angielskim słowie kluczowym.","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; materiały Altkom"},"edm":{"t":"Oszacuj, Kieruj i Monitoruj (EDM)","eg":"Oszacuj, Kieruj i Monitoruj (EDM)","pd":"Ocena, kierowanie i monitorowanie (EDM)","en":"Evaluate, Direct and Monitor (EDM)","wyj":"Trzy obowiązki szefostwa: ocenić sytuację, wskazać kierunek i sprawdzać, czy idziemy w dobrą stronę.\n\nEDM to jedyna domena Ładu i ma 5 procesów (EDM01–EDM05). W każdym są praktyki Oszacuj (Evaluate), Kieruj (Direct) i Monitoruj (Monitor): organ Ładu ocenia potrzeby i możliwości, kieruje przez priorytety i decyzje, a potem monitoruje wyniki i zgodność względem wyznaczonego kierunku. EDM02–EDM04 odpowiadają trzem składnikom Celu Ładu: korzyściom, ryzyku i zasobom.\n\nŻeby organ Ładu miał uporządkowane procesy do oceny potrzeb, wyznaczania kierunku i sprawdzania, czy kierunek jest realizowany. Dzięki temu Ład jest oddzielony od codziennego Zarządzania.","zycie":"Raz na kwartał siadacie z partnerem przy kuchennym stole. Patrzycie, jak wygląda sytuacja w domu (Oszacuj), ustalacie, że w tym roku priorytetem jest remont, a nie nowe auto (Kieruj), i po trzech miesiącach sprawdzacie, czy remont idzie zgodnie z planem (Monitoruj). Sami nie kładziecie płytek – od tego jest ekipa. To jest EDM, czyli Ład.","firma":"Wspólnicy sklepu internetowego spotykają się raz na kwartał. Oceniają, czy sklep się opłaca i czy ryzyko wycieku danych jest pod kontrolą, postanawiają, że w tym roku stawiają na aplikację mobilną, a po trzech miesiącach sprawdzają, jak kierownik ją wdraża. Nie konfigurują serwerów – wyznaczają kierunek i go pilnują, czyli działają w domenie EDM.","urzad":"Rada gminy uchwala strategię cyfryzacji, a po roku słucha sprawozdania wójta i ocenia, czy pieniądze na e-usługi dały efekt. Radni nie wdrażają systemów – oceniają, kierują i monitorują. To jest rola EDM.","it":"EDM03 Zapewnienie optymalizacji ryzyka: zarząd banku ocenia ryzyko przestoju bankowości internetowej, ustala, że przestój nie może przekroczyć 4 godzin w roku, i co kwartał sprawdza raport CIO. Codzienne rozpoznawanie i analizę ryzyka prowadzi Zarządzanie w APO12 Zarządzanie ryzykiem.","egz":"„Oszacuj, Kieruj i Monitoruj” to praktyki każdego procesu Ładu, a nie komponent Podejścia do Ładu. EDM05 bywa nazywany „Zapewnienie Transparentności Interesariuszy”. Egzamin: „Oszacuj, Kieruj i Monitoruj”. Podręcznik: „Ocena, kierowanie i monitorowanie”. Nie myl z MEA: „Monitoruj, Oszacuj i Oceń”. Nie myl z: Monitoruj, Oszacuj i Oceń (MEA) – MEA to domena ZARZĄDZANIA (monitorowanie wydajności, kontroli wewnętrznej i zgodności). EDM to domena ŁADU.","src":"COBIT 5 Framework (PL), s. 32; COBIT 5 Framework (PL), s. 33, Ilustracja 16; materiały Altkom"},"lad":{"t":"Ład","eg":"Ład","pd":"Nadzór","en":"Governance","wyj":"Szefostwo decyduje, po co i co robimy, i pilnuje, czy idziemy w dobrą stronę.\n\nŁad ocenia potrzeby i warianty, wyznacza kierunek i monitoruje wyniki (EDM). Zarządzanie planuje, buduje, prowadzi i monitoruje działania (PBRM) zgodnie z tym kierunkiem. W oryginale COBIT 5 Ład zwykle sprawuje board pod przewodnictwem chairperson, a Zarządzanie executive management pod kierownictwem CEO. Polski podział kompetencji trzeba przypisać według rzeczywistego mandatu; nie wolno automatycznie utożsamiać board z zarządem pod prezesem.\n\nŻeby informatyka robiła to, czego potrzebuje cała organizacja, a nie tylko to, co umieją informatycy.","zycie":"Wspólnota mieszkaniowa na zebraniu rocznym ocenia stan budynku i decyduje: w tym roku najpierw dach, elewacja dopiero za dwa lata, a zarządca co kwartał pokazuje wydatki. Wyboru dekarza i pilnowania ekipy zebranie już nie robi – to robota zarządcy. Ocenić, wyznaczyć kierunek, monitorować: to jest Ład.","firma":"Właścicielka restauracji raz na kwartał siada z wynikami i decyduje: celujemy w rodziny z dziećmi, marża ma wynosić co najmniej 20%, a za trzy miesiące sprawdzamy, czy to działa. Co i jak gotować każdego dnia, ustala już szef kuchni. Ona sprawuje Ład, on zarządza.","urzad":"Rada gminy przyjmuje strategię cyfryzacji: najpierw e-usługi dla mieszkańców, potem nowy system księgowy. Ustala na to budżet i co pół roku każe sobie przedstawić, co zrobiono. Wybór dostawcy i prowadzenie wdrożenia zostawia urzędowi – rada sprawuje Ład, a nie zarządza projektem.","it":"W EDM03 (Zapewnienie optymalizacji ryzyka) zarząd ocenia ryzyko IT, ustala apetyt na ryzyko i monitoruje, czy organizacja go nie przekracza.","egz":"Zapamiętaj czasowniki: Ład = Oszacuj, Kieruj, Monitoruj (EDM); odpowiada zarząd pod przewodnictwem prezesa (EN: chairperson – przewodniczący rady/zarządu, nie CEO). Zarządzanie = Planuj, Twórz, Wykonuj, Monitoruj; odpowiada kierownictwo pod przewodnictwem CEO. Egzamin PL: „Ład”. Podręcznik PL: „Nadzór”. EN: Governance. To jedno i to samo pojęcie. Słowo „nadzór” w pytaniu egzaminacyjnym może też pojawić się w zbitce „ład i nadzór”. Nie myl z: Zarządzanie – Zarządzanie (management) planuje, buduje, uruchamia i monitoruje działania ZGODNIE z kierunkiem wyznaczonym przez Ład.; Nadzór w znaczeniu kontroli / inspekcji – Polskie „nadzór” kojarzy się z kontrolą. W COBIT to coś szerszego: także wyznaczanie kierunku i ustalanie priorytetów.; Ład korporacyjny (enterprise governance) – Ład nad IT w organizacji (GEIT) jest CZĘŚCIĄ ładu korporacyjnego (Zasada 2).","src":"COBIT 5 Framework (EN), sekcja rozdział 6; Key Differences Between Governance and Management"},"it-dostepnosc":{"t":"Dostępność","eg":"Dostępność","pd":"dostępność","en":"Availability","wyj":"Usługa albo informacja działa i można z niej skorzystać wtedy, gdy jest potrzebna.\n\nOrganizacja ustala, kiedy i jak niezawodnie usługa ma działać. Informatycy dobierają infrastrukturę (np. zapasowy serwer), pilnują, by starczyło mocy, i mierzą przerwy. Gdy dostępność spada, szukają przyczyn.\n\nŻeby ludzie mogli pracować wtedy, kiedy muszą, a nie tylko wtedy, gdy system akurat działa.","zycie":"Bankomat pod blokiem działa całą dobę – to dobra dostępność. Gdy co weekend jest „nieczynny”, dostępność jest słaba, choć pieniądze w banku są.","firma":"Sklep internetowy przed świętami dokupuje serwery, żeby strona nie padała przy tłumie klientów.","urzad":"ZUS (Zakład Ubezpieczeń Społecznych) ustala, że portal dla firm ma działać całą dobę, a zwłaszcza w dniach, gdy mija termin wysyłania deklaracji składkowych. Na te dni informatycy dokładają mocy serwerów, a przerwy techniczne planują tylko w nocy z soboty na niedzielę. Co miesiąc mierzą, ile minut portal nie działał.","it":"BAI04 Zarządzanie dostępnością i pojemnością; cel organizacji 7 i kryterium jakości informacji „dostępność/terminowość” (FW-PL s. 19, 33, 82).","egz":"BAI04 Zarządzanie dostępnością i pojemnością (Manage Availability and Capacity); dostępność to też kryterium jakości informacji (FW-PL s. 82). Nie myl z: Ciągłość działania – Dostępność to codzienne „działa, gdy trzeba”. Ciągłość to przygotowanie na poważne zakłócenia.; Dostęp i Bezpieczeństwo – Kategoria jakości informacji „Dostęp i Bezpieczeństwo” obejmuje dostępność, ale też ograniczenie dostępu dla nieuprawnionych.","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; COBIT 5 Framework (PL), s. 82; COBIT 5 Framework (PL), s. 19"}},"S":[{"lekcje":["en-k50-ludzie-cele","en-k51-cykl-zycia-umiejetnosci"],"pt":"Lekcje 2.50–2.51","h":"Cele ludzi: kwalifikacje to jakość wewnętrzna, doświadczenie i rotacja – kontekstowa","b":"<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>Podwymiar</th><th>Cele (Rysunek 38)</th></tr><tr><td><w k=\"jakosc-wewnetrzna\">Jakość wewnętrzna</w></td><td>wykształcenie i kwalifikacje, umiejętności techniczne</td></tr><tr><td><w k=\"jakosc-kontekstowa\">Jakość kontekstowa</w></td><td>doświadczenie, wiedza, umiejętności behawioralne, <w k=\"it-dostepnosc\">dostępność</w>, rotacja</td></tr></table></div>","c":"Umiejętnościami zarządza się w cyklu życia – od wglądu w obecną bazę po pozbycie się umiejętności.","s":"COBIT 5 Framework (PL), s. 27, 87–88, Ilustracja 38","ctx":"<p><w k=\"ludzie-umiejetnosci-kompetencje\">Ludzie, Umiejętności i Kompetencje</w> (<span class=\"en\">People, Skills and Competencies</span>) są potrzebni do realizacji działań, podejmowania decyzji i działań naprawczych. Cykl życia umiejętności wygląda tak: wgląd w obecną bazę i planowanie według strategii, rozwijanie (szkolenia) albo pozyskiwanie (rekrutacja), wdrażanie w rolach, okresowa ocena (np. raz w roku), a w razie potrzeby pozbycie się umiejętności po automatyzacji lub outsourcingu.</p><p>Dobra praktyka: wymagania umiejętności definiuje się <b>dla każdej roli</b>, a nie dla osoby, poziomami w kategoriach umiejętności. Zewnętrzne źródło to SFIA (<span class=\"en\">Skills Framework for the Information Age</span>). Pułapka: ten aktywator to nie proces <w k=\"proc-apo07\">APO07</w> Zarządzanie zasobami ludzkimi. Proces APO07 jedynie wspiera cykl życia umiejętności. Podręcznik pisze „jakość rzeczywista”.</p><p>Przykład z urzędu: zespół helpdesku ma certyfikaty ITIL (jakość wewnętrzna). Połowa zespołu odchodzi jednak co roku, a w piątki po południu nikt nie odbiera telefonu – to problemy z rotacją i dostępnością.</p>"},{"pt":"Sprawdź się","quiz":{"id":"q-enk-50-3","sylabus":["EN-02-22"],"tresc":"Które cele Rysunek 38 przypisuje <b>jakości wewnętrznej</b> w aktywatorze Ludzie, Umiejętności i Kompetencje?","opcje":[{"t":"Wykształcenie i kwalifikacje oraz umiejętności techniczne","ok":true,"w":"Dobrze. Tak podaje Ilustracja 38 w podręczniku."},{"t":"Doświadczenie, wiedza i umiejętności behawioralne pracowników","ok":false,"w":"To cele jakości kontekstowej."},{"t":"Dostępność personelu i wskaźnik rotacji","ok":false,"w":"To też cele jakości kontekstowej."},{"t":"Okres przechowywania i status","ok":false,"w":"To atrybuty modelu informacji."}],"src":"COBIT 5 Framework (EN), sekcja załącznik G, aktywator 7, rysunek 38","pomoc":{"t":"Pytanie dotyczy lekcji 2.50 „Aktywator 7 – Ludzie, Umiejętności i Kompetencje: po co i jakie cele”. Cel lekcji: Potrafię powiedzieć, po co jest aktywator Ludzie, Umiejętności i Kompetencje i jakie ma cele.","k":["ludzie-umiejetnosci-kompetencje"]},"kurs":"Dobrze. Tak podaje Ilustracja 38 w podręczniku.","kontekst":""}},{"pt":"Sprawdź się","quiz":{"id":"q-en-09-02","sylabus":["EN-02-22"],"tresc":"Która z poniższych jest dobrą praktyką aktywatora Ludzie, Umiejętności i Kompetencje?","opcje":[{"t":"Określenie zakresu kontroli komitetu","ok":false,"w":"To praktyka struktur."},{"t":"Zdefiniowanie wymagań umiejętności dla każdej roli","ok":true,"w":"Wymagania umiejętności dla każdej roli pozwalają określić potrzeby, oceniać luki i planować rozwój ludzi. To dobra praktyka tego aktywatora."},{"t":"Wskazanie czempionów pożądanych zachowań w organizacji","ok":false,"w":"To praktyka aktywatora Kultura."},{"t":"Zdefiniowanie pryncypiów architektury","ok":false,"w":"To praktyka aktywatora Usługi."}],"src":"COBIT 5 Framework (EN), sekcja załącznik G, aktywator 7, rysunek 38","pomoc":{"t":"Pytanie dotyczy lekcji 2.51 „Cykl życia umiejętności i wymagania dla każdej roli”. Cel lekcji: Potrafię opisać cykl życia umiejętności i dobrą praktykę wymagań umiejętności dla każdej roli.","k":[]},"kurs":"Wymagania umiejętności dla każdej roli pozwalają określić potrzeby, oceniać luki i planować rozwój ludzi. To dobra praktyka tego aktywatora.","kontekst":""}},{"lekcje":["en-k52-kategorie-umiejetnosci"],"pt":"Lekcja 2.52","h":"Rysunek 39: APO planuje, BAI buduje, DSS obsługuje, MEA sprawdza","b":"<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>Domena</th><th>Przykładowe umiejętności</th></tr><tr><td><w k=\"edm\">EDM</w></td><td><w k=\"lad\">nadzór</w> nad IT</td></tr><tr><td><w k=\"apo\">APO</w></td><td>strategia IT, architektura korporacyjna, portfele projektów</td></tr><tr><td><w k=\"bai\">BAI</w></td><td>analiza biznesowa, projekty, pojemność</td></tr><tr><td><w k=\"dss\">DSS</w></td><td><w k=\"it-dostepnosc\">dostępność</w>, Service Desk, bezpieczeństwo</td></tr><tr><td><w k=\"mea\">MEA</w></td><td>zgodność, audyt mechanizmów kontrolnych</td></tr></table></div>","c":"Portfele projektów i architektura to APO, projekty i pojemność – BAI, dostępność – DSS.","s":"COBIT 5 Framework (PL), s. 88, Ilustracja 39","ctx":"<p>Domeny to: Oszacuj, Kieruj i Monitoruj (EDM); Dostosuj, Planuj i Organizuj (APO); Twórz, Nabywaj i Wdrażaj (BAI); Dostarczaj, Obsługuj i Wspieraj (DSS); Monitoruj, Oszacuj i Oceń (MEA). Pełna lista <w k=\"kategorie-umiejetnosci\">kategorii umiejętności</w>: APO – polityka IT, strategia, architektura korporacyjna, innowacje, finanse, portfele projektów. BAI – analiza biznesowa, zarządzanie projektami, ocena użyteczności, wymagania, programowanie, ergonomia, wycofanie oprogramowania, pojemność. DSS – dostępność, problemy, Service Desk i incydenty, administracja bezpieczeństwa, eksploatacja IT, bazy danych. MEA – weryfikacja zgodności, monitorowanie sprawności, audyt mechanizmów kontrolnych.</p><p>Pułapka: decyduje jedno słowo. Wybór projektów (portfel) to planowanie, czyli APO. Prowadzenie jednego projektu to budowanie, czyli BAI. Architekt korporacyjny należy do APO, a audytor IT do MEA. Powiązania z innymi aktywatorami: procesy i struktury wymagają umiejętności, umiejętności behawioralne łączą się z kulturą, a definicje umiejętności są informacją.</p>"},{"pt":"Sprawdź się","quiz":{"id":"q-en-09-03","sylabus":["EN-02-23"],"tresc":"Do której domeny procesów należy kategoria umiejętności <b>zarządzanie dostępnością</b> według Rysunku 39?","opcje":[{"t":"BAI","ok":false,"w":"Proces BAI04 obejmuje zarówno dostępność, jak i pojemność, ale pytanie rozstrzyga Rysunek 39 (s. 88): zarządzanie dostępnością stoi tam przy DSS, a zarządzanie pojemnością przy BAI."},{"t":"MEA","ok":false,"w":"MEA to monitorowanie."},{"t":"DSS","ok":true,"w":"Rysunek 39 ilustruje kategorie umiejętności według domen: np. portfele w APO, pojemność w BAI, dostępność w DSS, audyt i weryfikacja zgodności w MEA. Wskazana odpowiedź odpowiada właśnie temu elementowi modelu."},{"t":"APO","ok":false,"w":"APO to planowanie."}],"src":"COBIT 5 Framework (EN), sekcja załącznik G, rysunek 39","pomoc":{"t":"Pytanie dotyczy lekcji 2.52 „Kategorie umiejętności według domen (Rysunek 39)”. Cel lekcji: Potrafię przypisać kategorie umiejętności z Rysunku 39 do domen EDM, APO, BAI, DSS i MEA.","k":["kategorie-umiejetnosci"]},"kurs":"Rysunek 39 ilustruje kategorie umiejętności według domen: np. portfele w APO, pojemność w BAI, dostępność w DSS, audyt i weryfikacja zgodności w MEA. Wskazana odpowiedź odpowiada właśnie temu elementowi modelu.","kontekst":""}},{"pt":"Arkusz próbny","sp1":"sp1-14","lekcja":"2.52","temat":"Kategorie umiejętności według domen (Rysunek 39)","k":["kategorie-umiejetnosci"]},{"pt":"Arkusz próbny","sp1":"sp1-24","lekcja":"2.52","temat":"Kategorie umiejętności według domen (Rysunek 39)","k":["kategorie-umiejetnosci"]}],"bankRevision":"9e64267b9fd35238","legacySp1Order":[null,null,null,null,null,{"sp1":"sp1-14"},{"sp1":"sp1-24"}]};</script>
