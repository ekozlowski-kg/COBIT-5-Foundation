<script>window.DECK={"id":"k-m0-egzamin","rozdzial":"Poza podręcznikiem · Egzamin","tytul":"Egzamin w liczbach i pułapki nazw","prev":"k-en-ludzie.html","next":"k-ex-strategia.html","T":{"zasob":{"t":"Zasób","eg":"Zasób","pd":"Zasób","en":"Resource","wyj":"To, czym dysponujemy: ludzie, pieniądze, sprzęt, czas i informacje.\n\nZasób (resource) to każdy zasób organizacji, który pomaga jej osiągnąć cele, np. ludzie, finanse, sprzęt, infrastruktura i informacja. Zasoby są ograniczone, więc przy każdej decyzji pyta się, jakie są potrzebne. Optymalizacja zasobów (resource optimisation) to jeden z trzech składników Celu Ładu, obok realizacji korzyści i optymalizacji ryzyka.\n\nŻeby wiedzieć, czym organizacja dysponuje, aby osiągnąć cele: ludźmi, pieniędzmi, sprzętem, infrastrukturą i informacją.","zycie":"W sobotę masz przeprowadzkę. Masz do dyspozycji 2000 zł, samochód brata, trzech kolegów do pomocy i jeden dzień. Pieniądze, auto, ludzie i czas to Twoje zasoby – od tego, jak je rozdzielisz, zależy, czy zdążysz.","firma":"Właściciel warsztatu dostaje duże zlecenie na serwis floty aut. Sprawdza, czy ma wolnych mechaników, podnośniki, pieniądze na części i aktualną bazę klientów z historią napraw. Ludzie, sprzęt, pieniądze i informacje to zasoby warsztatu.","urzad":"Dyrektor szkoły układa plan na nowy rok. Ma określoną liczbę etatów nauczycieli, budżet z gminy, pracownię komputerową z siecią i dane uczniów w dzienniku. To wszystko są zasoby szkoły.","it":"EDM04 (Zapewnienie optymalizacji zasobów) pilnuje, by zasoby IT (ludzie, procesy, technologie) były wystarczające i optymalnie wykorzystane. Szczegółami zajmuje się Zarządzanie, np. APO07 (Zarządzanie zasobami ludzkimi) ludźmi, a APO06 (Zarządzanie budżetem i kosztami) pieniędzmi.","egz":"Pojawia się w „optymalizacji zasobów” i w pytaniu „Jakie zasoby są wymagane?” przy każdej decyzji (s. 17). Nie myl z: Aktywator – Aktywator to szersze pojęcie – obejmuje też np. procesy, kulturę czy polityki. Zasoby (np. ludzie, infrastruktura) są ujęte w niektórych kategoriach aktywatorów.","src":"COBIT 5 Framework (PL), s. 13, 93"},"ocena-c":{"t":"C – Częściowy","eg":"C – Częściowy","pd":"P – częściowo osiągnięto","en":"P – Partially achieved (>15–50%)","wyj":"Trochę: coś się dzieje, ale nieregularnie i z dużymi brakami.\n\nGdy osiągnięcie wynosi powyżej 15% do 50%, asesor wpisuje C – Częściowy. Są pewne dowody, ale część aspektów jest nieprzewidywalna. Dokładnie 50% to jeszcze C (konwencja ISO/IEC 15504-2, nie tekst FW-PL).\n\nŻeby oznaczyć atrybut osiągnięty tylko częściowo. To za mało, żeby proces osiągnął poziom, którego dotyczy atrybut.","zycie":"Syn sprząta pokój, ale tylko wtedy, gdy mu przypomnisz, i nie zawsze. Mniej więcej co trzeci raz jest porządek. To C: coś jest, ale bez systemu.","firma":"W warsztacie kartę naprawy ma około 40% zleceń. Ocena to C.","urzad":"Kontrola w urzędzie miasta sprawdza 100 decyzji podatkowych. Komplet podpisów ma około 45% z nich. Dowody są, ale z dużymi brakami, więc ocena to C – Częściowy.","it":"Incydenty w DSS02 rejestruje tylko jedna zmiana serwisu. Asesor znajduje dowody w około 30% przypadków i daje C na PA 1.1.","egz":"C = Częściowy, >15–50% (zapis „>” – konwencja ISO/IEC 15504-2; FW-PL s. 45: „15–50%”). W angielskim arkuszu ta sama ocena to P – Partially. Ocena C na atrybucie danego poziomu = poziom nieosiągnięty. Na egzaminie PL „Częściowy” ma literę C. Po angielsku i w podręczniku ta sama ocena ma literę P (Partially). A „P” na egzaminie PL to Pełny! Nie myl z: P – Pełny – Na egzaminie PL P to Pełny (>85–100%). Częściowy to C. W EN to odwrotnie: P = Partially.; W – Większościowy – C to >15–50% i nie wystarcza do osiągnięcia poziomu. W to >50–85% i już wystarcza dla atrybutów tego poziomu.","src":"COBIT 5 Framework (PL), s. 45"},"ryzyko":{"t":"Ryzyko","eg":"Ryzyko","pd":"Ryzyko","en":"Risk","wyj":"Coś może pójść źle; liczy się, jak bardzo jest to prawdopodobne i jak bardzo zaboli.\n\nRyzyko (risk) to połączenie prawdopodobieństwa zdarzenia i jego konsekwencji. Dotyczy przyszłości. Dopowiedzenie kursu (interpretacja, nie definicja z s. 93): gdy zdarzenie już nastąpiło, mówimy raczej o problemie albo incydencie. Ład ustala apetyt na ryzyko (risk appetite), czyli ile ryzyka organizacja jest gotowa przyjąć (EDM03, Zapewnienie optymalizacji ryzyka), a Zarządzanie identyfikuje, ocenia i ogranicza ryzyka w tych granicach (APO12, Zarządzanie ryzykiem).\n\nŻeby z wyprzedzeniem widzieć, co może pójść źle i jak bardzo by zaszkodziło, i świadomie decydować, czemu zapobiegać, a co zaakceptować.","zycie":"Planujecie wesele w ogrodzie w lipcu. Deszcz jest dość prawdopodobny, a skutek byłby duży – goście mokną, tort się rozpływa – więc rezerwujecie namiot. Ryzyko to ta możliwość deszczu razem z jej skutkami; jeśli w dniu wesela leje, macie już problem, a nie ryzyko.","firma":"W biurze rachunkowym tylko pani Ewa umie obsługiwać program do płac. Jeśli zachoruje w ostatnim tygodniu miesiąca, pensje u klientów się spóźnią. Szef ocenia, że to mało prawdopodobne, ale bolesne, więc każe przeszkolić drugą osobę – tak wygląda praca z ryzykiem.","urzad":"Nabór wniosków o dopłaty do wymiany pieców w urzędzie gminy zamyka się w piątek o 15:00, a wszystko idzie przez jeden serwer. Awaria akurat w piątek jest mało prawdopodobna, ale skutek byłby fatalny, więc informatyk robi kopię i ma tego dnia dyżur. To ryzyko: możliwość zdarzenia plus jego skutki.","it":"W procesie APO12 (Zarządzanie ryzykiem) dział IT prowadzi rejestr ryzyk: np. „awaria serwerowni” ma ocenione prawdopodobieństwo i skutki. Dla ryzyk powyżej apetytu ustalonego przez Ład w EDM03 (Zapewnienie optymalizacji ryzyka) planuje się działania, np. zapasowe centrum danych.","egz":"Na egzaminie ryzyko pojawia się głównie jako „optymalizacja ryzyka” (cel Ładu) i „apetyt na ryzyko” (czynnik środowiskowy we wdrożeniu). Nie myl z: Issue / problem / incydent – Problem już zaistniał; ryzyko jest możliwością w przyszłości.; Zagrożenie – Zagrożenie to źródło (np. powódź); ryzyko łączy prawdopodobieństwo z konsekwencjami.","src":"COBIT 5 Framework (PL), s. 93"},"ocena-p":{"t":"P – Pełny","eg":"P – Pełny","pd":"F – w pełni osiągnięto","en":"F – Fully achieved (>85–100%)","wyj":"W pełni: działa kompletnie i systematycznie, bez poważnych słabych punktów.\n\nGdy osiągnięcie wynosi powyżej 85% do 100%, asesor wpisuje P – Pełny. Dowody pokazują kompletne i systematyczne osiągnięcie, bez istotnych słabości.\n\nŻeby oznaczyć atrybut osiągnięty kompletnie i systematycznie. Tylko P na niższych poziomach otwiera drogę wyżej.","zycie":"Przez cały rok córka sama odrabia lekcje i pakuje plecak. Raz zapomniała linijki, ale to drobiazg. To P: w pełni, bez istotnych wpadek.","firma":"W warsztacie każde zlecenie ma kartę, termin i podpis odbioru. Ocena to P – Pełny.","urzad":"W starostwie każda skarga mieszkańca ma datę wpływu i datę odpowiedzi. Kontrola sprawdza 50 skarg i znajduje jedną drobną pomyłkę. Bez istotnych słabości, więc ocena to P – Pełny.","it":"Żeby DSS02 osiągnął poziom 3, PA 1.1, PA 2.1 i PA 2.2 muszą mieć P. PA 3.1 i PA 3.2 potrzebują co najmniej W.","egz":"P (egzamin PL) = Pełny, >85–100% (EN: F – Fully). Wszystkie atrybuty niższych poziomów muszą mieć P, żeby proces osiągnął wyższy poziom. PUŁAPKA NR 1: na egzaminie PL P = Pełny (Fully). Po angielsku i w podręczniku P = Partially, czyli częściowy, a Pełny to F. Ta sama litera, przeciwne znaczenie. Nie myl z: C – Częściowy – Polskie C to angielskie P (Partially, >15–50%). Polskie P to angielskie F (Fully, >85–100%).; W – Większościowy – W wystarcza dla atrybutów ocenianego poziomu. P jest wymagane na wszystkich niższych poziomach.; Relacja P na Ilustracji 5 – Na il. 5 litera P oznacza relację podstawową (cele organizacji). To nie jest ocena atrybutu.","src":"COBIT 5 Framework (PL), s. 42, 45"},"organizacja":{"t":"Organizacja","eg":"Organizacja","pd":"Przedsiębiorstwo","en":"Enterprise","wyj":"Firma, urząd, szkoła czy szpital: ludzie, którzy razem robią coś w jakimś celu.\n\nW COBIT 5 organizacja (enterprise) to podmiot, który ma interesariuszy, ich potrzeby i własne cele (enterprise goals). Ład i Zarządzanie IT służą temu, by organizacja te cele osiągała. Podręcznik tłumaczy enterprise jako „przedsiębiorstwo”, a egzamin jako „organizacja”, ale chodzi o to samo, także o sektor publiczny i not-for-profit.\n\nŻeby jednym słowem mówić o każdej zorganizowanej całości z celami: firmie, urzędzie, szpitalu czy uczelni, bo COBIT 5 stosuje się do wszystkich, nie tylko do biznesu.","zycie":"Klub szachowy przy osiedlowym domu kultury ma skarbnika, składki i wspólny cel: utrzymać salę i co roku zorganizować turniej. Nikt na tym nie zarabia, a mimo to są pieniądze, ludzie i decyzje do podjęcia. Dla COBIT 5 to też organizacja – nie trzeba być firmą, żeby z niego korzystać.","firma":"Pani Ania prowadzi jednoosobowy sklep internetowy z ceramiką, a jej brat spółkę z 200 pracownikami. Oboje mają swoje cele, pieniądze i informatykę, od której zależą. Dla COBIT 5 obie firmy są organizacjami, bez względu na wielkość.","urzad":"Szpital powiatowy, urząd gminy i szkoła podstawowa nie zarabiają dla właścicieli, ale mają budżet, ludzi, systemy i cele do osiągnięcia. COBIT 5 wprost mówi, że nadaje się też dla sektora publicznego i not-for-profit. Każda z tych instytucji jest więc organizacją w rozumieniu egzaminu.","it":"Gdy szpital publiczny realizuje APO02 (Zarządzanie strategią), też jest organizacją (enterprise) w rozumieniu COBIT 5: jego cele, np. ciągłość opieki nad pacjentami, są w kaskadzie celów celami organizacji, choć szpital nie działa dla zysku.","egz":"Gdy w pytaniu widzisz „organizacja”, w podręczniku szukaj „przedsiębiorstwo”. Podręcznik: „przedsiębiorstwo”, egzamin: „organizacja”. Chodzi o każdą organizację – także urząd czy szpital publiczny, nie tylko firmę. Nie myl z: Firma komercyjna – „Przedsiębiorstwo” w COBIT ≠ tylko firma nastawiona na zysk.","src":"COBIT 5 Framework (PL), s. 13"},"skala-ocen":{"t":"Skala ocen N / C / W / P","eg":"Skala ocen N / C / W / P","pd":"Skala ocen N / P / L / F","en":"Rating scale N/P/L/F","wyj":"Cztery stopnie: nic, trochę, w większości, w pełni, czyli N, C, W, P.\n\nKażdy atrybut procesu (np. PA 1.1, PA 2.1) asesor ocenia na podstawie dowodów w czterostopniowej skali: N – nieosiągnięty (Not achieved, 0–15%), C – częściowy (Partially, >15–50%), W – większościowy (Largely, >50–85%), P – pełny (Fully, >85–100%). Proces osiąga dany poziom, gdy atrybuty tego poziomu mają W lub P, a wszystkie atrybuty niższych poziomów mają P.\n\nŻeby asesor mógł ocenić, w jakim stopniu atrybut procesu jest osiągnięty, a nie tylko „tak albo nie”, i żeby oceny różnych asesorów były porównywalne.","zycie":"Przez miesiąc patrzysz, jak syn sprząta swój pokój. Prawie nigdy – N; czasem, gdy mu przypomnisz – C; zwykle tak, ale zdarzają się wpadki – W; zawsze i bez przypominania – P. Tak samo asesor ocenia atrybut procesu: czterema stopniami, od braku do pełnego.","firma":"Asesor sprawdza w warsztacie, czy praca jest planowana i pilnowana (PA 2.1). Plany są, ale w co trzecim zleceniu nikt nie sprawdził terminu – ocena W. Jeśli PA 1.1 ma P, a PA 2.2 co najmniej W, warsztat ma poziom 2; do poziomu 3 musi najpierw dociągnąć PA 2.1 i PA 2.2 do P.","urzad":"Asesor ocenia w urzędzie gminy proces kopii zapasowych. Kopie się robią, ale tylko kilka z nich ktoś kiedykolwiek próbnie odtworzył, więc PA 1.1 dostaje C. Przy C urząd nie ma nawet poziomu 1, bo do niego PA 1.1 musi mieć co najmniej W.","it":"Asesor ocenia BAI06 (Zarządzanie zmianami): PA 1.1 = P, PA 2.1 = P, PA 2.2 = C, bo tylko część wniosków o zmianę jest kontrolowana. Proces ma poziom 1, bo na poziomie 2 atrybut PA 2.2 musi mieć co najmniej W.","egz":"Żeby pozytywnie przejść ocenę danego poziomu, wystarczy W (większościowy) lub P (pełny). Ocena C (częściowy) to za mało. Niższe poziomy muszą mieć P. NAJWIĘKSZA PUŁAPKA: na egzaminie PL litera P oznacza PEŁNY (Fully). W podręczniku i po angielsku P to Partially, czyli częściowy. Egzamin: N – Nieosiągnięty, C – Częściowy, W – Większościowy, P – Pełny. Nie myl z: Relacja P na Ilustracji 5 – Na Ilustracji 5 (cele organizacji) P oznacza relację PODSTAWOWĄ. To coś zupełnie innego niż ocena atrybutu.","src":"COBIT 5 Framework (PL), s. 45"},"struktura-ramowa":{"t":"Struktura ramowa","eg":"Struktura ramowa","pd":"Metodyka","en":"Framework","wyj":"Gotowy, uporządkowany zbiór reguł i dobrych praktyk, z którego korzystamy zamiast wymyślać od zera.\n\nStruktura ramowa (framework) daje model, pojęcia, zasady, role i dobre praktyki, ale nie szczegółową instrukcję krok po kroku. Organizacja dostosowuje ją do swojej wielkości i potrzeb. COBIT 5 jest strukturą ramową dla Ładu i Zarządzania IT w organizacji i łączy w jedną całość inne standardy i struktury, np. ITIL i ISO/IEC 27001.\n\nŻeby organizacja nie wymyślała od zera, jak podejść do złożonego obszaru, tylko korzystała z gotowego, sprawdzonego zestawu pojęć, zasad i praktyk i dopasowywała go do siebie.","zycie":"Dietetyk daje Ci zasadę talerza: połowa warzywa, ćwierć białko, ćwierć węglowodany. Nie mówi, co jutro zjesz – to układasz sam, pod swoje smaki i portfel. Zasada talerza to struktura ramowa, a Twój plan posiłków to już jej dopasowanie do siebie.","firma":"Właściciel otwiera kawiarnię we franczyzie i dostaje księgę standardów: wygląd lokalu, receptury, sposób obsługi gości. Grafik pracy i lokalnych dostawców ustala już sam. Księga to rama, w której dopasowuje szczegóły do swojego miasta.","urzad":"Dyrektor szkoły dostaje standardy kontroli zarządczej dla sektora finansów publicznych. Mówią, co ma być pod kontrolą – cele, ryzyka, dokumentacja – ale nie mówią, jak dokładnie prowadzić rejestr ryzyk w tej szkole. To struktura ramowa: wspólna dla wszystkich jednostek, a szczegóły ustala szkoła.","it":"Organizacja przyjmuje COBIT 5 jako strukturę ramową i w procesie APO01 (Zarządzanie metodyką zarządzania IT) ustala, jak wpiąć w nią ITIL dla obsługi usług i ISO/IEC 27001 dla bezpieczeństwa. Zgodnie z zasadą 3 powstaje jeden spójny system zamiast kilku osobnych.","egz":"W pytaniach: „Zastosowanie Pojedynczej Zintegrowanej Struktury Ramowej” (Zasada 3), „Zasady, Polityki i Struktury ramowe” (aktywator 1). Egzamin: „Struktura ramowa”. Podręcznik: „Metodyka”. EN: Framework. „COBIT 5 jest zintegrowaną strukturą ramową” = „COBIT 5 jest zintegrowaną metodyką”. Nie myl z: Norma / standard (np. ISO/IEC 27001) – Norma ma wymagania, z którymi można certyfikować zgodność. COBIT 5 jest strukturą ramową – nie certyfikuje się organizacji „na COBIT”.; Procedura – Procedura to szczegółowy przepis wykonania; struktura ramowa jest ogólniejsza.","src":"COBIT 5 Framework (PL), s. 91"},"lad":{"t":"Ład","eg":"Ład","pd":"Nadzór","en":"Governance","wyj":"Szefostwo decyduje, po co i co robimy, i pilnuje, czy idziemy w dobrą stronę.\n\nOrgan Ładu, zwykle zarząd pod przewodnictwem prezesa, ocenia potrzeby, warunki i opcje interesariuszy (Evaluate), ustala priorytety i podejmuje decyzje (Direct), a potem monitoruje sprawność i zgodność z wyznaczonym kierunkiem (Monitor). Wyniki z Zarządzania wracają do Ładu i cykl się powtarza.\n\nŻeby informatyka robiła to, czego potrzebuje cała organizacja, a nie tylko to, co umieją informatycy.","zycie":"Wspólnota mieszkaniowa na zebraniu rocznym ocenia stan budynku i decyduje: w tym roku najpierw dach, elewacja dopiero za dwa lata, a zarządca co kwartał pokazuje wydatki. Wyboru dekarza i pilnowania ekipy zebranie już nie robi – to robota zarządcy. Ocenić, wyznaczyć kierunek, monitorować: to jest Ład.","firma":"Właścicielka restauracji raz na kwartał siada z wynikami i decyduje: celujemy w rodziny z dziećmi, marża ma wynosić co najmniej 20%, a za trzy miesiące sprawdzamy, czy to działa. Co i jak gotować każdego dnia, ustala już szef kuchni. Ona sprawuje Ład, on zarządza.","urzad":"Rada gminy przyjmuje strategię cyfryzacji: najpierw e-usługi dla mieszkańców, potem nowy system księgowy. Ustala na to budżet i co pół roku każe sobie przedstawić, co zrobiono. Wybór dostawcy i prowadzenie wdrożenia zostawia urzędowi – rada sprawuje Ład, a nie zarządza projektem.","it":"W EDM03 (Zapewnienie optymalizacji ryzyka) zarząd ocenia ryzyko IT, ustala apetyt na ryzyko i monitoruje, czy organizacja go nie przekracza.","egz":"Zapamiętaj czasowniki: Ład = Oszacuj, Kieruj, Monitoruj (EDM); odpowiada zarząd pod przewodnictwem prezesa (EN: chairperson – przewodniczący rady/zarządu, nie CEO). Zarządzanie = Planuj, Twórz, Wykonuj, Monitoruj; odpowiada kierownictwo pod przewodnictwem CEO. Egzamin PL: „Ład”. Podręcznik PL: „Nadzór”. EN: Governance. To jedno i to samo pojęcie. Słowo „nadzór” w pytaniu egzaminacyjnym może też pojawić się w zbitce „ład i nadzór”. Nie myl z: Zarządzanie – Zarządzanie (management) planuje, buduje, uruchamia i monitoruje działania ZGODNIE z kierunkiem wyznaczonym przez Ład.; Nadzór w znaczeniu kontroli / inspekcji – Polskie „nadzór” kojarzy się z kontrolą. W COBIT to coś szerszego: także wyznaczanie kierunku i ustalanie priorytetów.; Ład korporacyjny (enterprise governance) – Ład nad IT w organizacji (GEIT) jest CZĘŚCIĄ ładu korporacyjnego (Zasada 2).","src":"COBIT 5 Framework (PL), s. 14, 91"},"aktywator":{"t":"Aktywator","eg":"Aktywator","pd":"Czynnik umożliwiający","en":"Enabler","wyj":"Wszystko, co musi zagrać, żeby informatyka działała dobrze: ludzie, reguły, narzędzia, informacje.\n\nCOBIT 5 dzieli aktywatory (enablers) na 7 kategorii, od Zasad, polityk i struktur ramowych (Principles, Policies and Frameworks) po Ludzi, umiejętności i kompetencje (People, Skills and Competencies). Kaskada celów wyznacza, czego oczekujemy od każdego aktywatora (cele aktywatora). Aktywatory są od siebie zależne i dostarczają sobie wejść, np. proces potrzebuje informacji i przeszkolonych ludzi. Każdy opisuje się w 4 wymiarach: interesariusze, cele, cykl życia, dobre praktyki.\n\nŻeby organizacja widziała wszystko, co musi zagrać, by osiągnąć cele, a nie tylko technologię. Aktywatory to elementy, przez które Ład i Zarządzanie realnie wpływają na wynik.","zycie":"Chcesz, żeby dzieci same odrabiały lekcje. Ustalacie zasadę „najpierw zadania, potem tablet”, stałą godzinę po obiedzie, kupujecie biurko z lampką, a Ty w tym czasie też siadasz z książką zamiast z telefonem. Zasada, stała pora, biurko i Twój przykład to różne aktywatory – działają dopiero razem.","firma":"Właścicielka kawiarni chce, żeby kawa smakowała tak samo na każdej zmianie. Spisuje recepturę, ustala kolejność parzenia, szkoli nowego baristę i oddaje ekspres do serwisu. Receptura, sposób parzenia, umiejętności baristy i ekspres to aktywatory – brak jednego psuje całość.","urzad":"Urząd gminy chce wydawać decyzje w terminie. Ma instrukcję kancelaryjną, ustalony obieg wniosku, wydział, który za sprawę odpowiada, system EZD i urzędników po szkoleniu z KPA. Każdy z tych elementów to aktywator innej kategorii.","it":"Proces DSS04 Zarządzanie ciągłością to aktywator z kategorii Procesy, ale działa tylko razem z innymi: polityką ciągłości (Zasady, polityki i struktury ramowe), aktualnym planem awaryjnym (Informacja), stanowiskiem zapasowym (Usługi, infrastruktura i aplikacje) i przećwiczonym zespołem (Ludzie, umiejętności i kompetencje).","egz":"Pułapka terminologiczna nr 1 obok Ład/Nadzór. Liczba kategorii: 7. Liczba zasad: 5. Liczba procesów: 37. Egzamin: „Aktywator”. Podręcznik: „Czynnik umożliwiający”. EN: Enabler. W pytaniach egzaminacyjnych prawie zawsze pada „Aktywator”. Nie myl z: Czynnik wpływający na potrzeby interesariuszy – Wyznacznik zmienia potrzeby; aktywator pomaga je zaspokoić.; Komponent (COBIT 2019) – W COBIT 2019 aktywatory nazwano „komponentami systemu ładu”. Na egzaminie COBIT 5 używaj „aktywator”.","src":"COBIT 5 Framework (PL), s. 14, 91"}},"S":[{"pt":"Lekcja 0.33","h":"Egzamin: 50 pytań, 40 minut, próg 50%, bez notatek","b":"<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>Co<\/th><th>Ile<\/th><\/tr><tr><td>Pytania<\/td><td><b>50<\/b>, jedna dobra z 4<\/td><\/tr><tr><td>Czas<\/td><td><b>40 minut<\/b> (+10 w języku obcym)<\/td><\/tr><tr><td>Próg<\/td><td><b>50%<\/b>, czyli 25 z 50<\/td><\/tr><tr><td>Materiały<\/td><td><b>żadnych<\/b> (<span class=\"en\">closed book<\/span>)<\/td><\/tr><tr><td>Obszary<\/td><td>zasady, aktywatory, wdrożenie, zdolność procesu<\/td><\/tr><\/table><\/div>","c":"Egzamin sprawdza znajomość i rozumienie pojęć, a nie umiejętność wdrożenia COBIT 5.","s":"Sylabus egzaminu COBIT 5 Foundation","ctx":"<p>40 minut na 50 pytań to średnio <b>48 sekund<\/b> na pytanie. Sylabus celuje w dwa najniższe poziomy taksonomii Blooma: znać i rozumieć – pojęcia muszą siedzieć w pamięci, nikt nie poprosi o plan wdrożenia.<\/p><p>Sylabus PeopleCert podaje próg 50%, a w nawiasie „20 or more marks” – to niespójność w samym dokumencie; licz na co najmniej 25 z 50.<\/p><p>Każde pytanie ma kod obszaru: PR – zasady (<span class=\"en\">Principles<\/span>), EN – aktywatory (<span class=\"en\">Enablers<\/span>), IM – wdrożenie (<span class=\"en\">Implementation<\/span>), PC – zdolność procesu (<span class=\"en\">Process Capability<\/span>). W oficjalnym arkuszu próbnym rozkład wynosi 15 / 21 / 7 / 7, więc aktywatory to największy obszar. Kurs celuje w <b>35 z 50<\/b> na próbach – w stresie wynik zwykle spada o kilka punktów.<\/p><p>Przykład: specjalistka ds. informatyki w starostwie, mając miesiąc na naukę, zaczyna od aktywatorów i list nazw, które da się rozpoznać w kilka sekund.<\/p>"},{"pt":"Sprawdź się","quiz":{"tresc":"Który opis egzaminu COBIT 5 Foundation jest poprawny?","opcje":[{"t":"50 pytań, 40 minut, próg 50%, bez materiałów","ok":true,"w":"Tak. To cztery liczby egzaminu z sylabusa."},{"t":"50 pytań, 40 minut, ocena praktycznego wdrożenia COBIT 5","w":"Egzamin sprawdza wiedzę i rozumienie, a nie umiejętność wdrożenia."},{"t":"50 pytań, 40 minut, próg 65%, z podręcznikiem","w":"Próg to 50%, a materiały są zakazane."},{"t":"40 pytań, 50 minut, próg 50%, bez materiałów","w":"Liczby pytań i minut zamienione miejscami."}],"src":"sylabus PeopleCert","pomoc":{"t":"Pytanie dotyczy lekcji 0.33 „Egzamin COBIT 5 Foundation w liczbach”. Cel lekcji: Potrafię opisać egzamin COBIT 5 Foundation: liczbę pytań, czas, próg zaliczenia i cztery obszary pytań.","k":[]}}},{"pt":"Lekcje 0.34–0.37","h":"Zaznaczasz nazwę z egzaminu, a P znaczy Pełny","b":"<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>EN<\/th><th>Podręcznik PL<\/th><th>Egzamin PL<\/th><\/tr><tr><td>Governance<\/td><td>nadzór<\/td><td><b><w k=\"lad\">Ład<\/w><\/b><\/td><\/tr><tr><td>Enabler<\/td><td>czynnik umożliwiający<\/td><td><b><w k=\"aktywator\">Aktywator<\/w><\/b><\/td><\/tr><tr><td>Framework<\/td><td>metodyka<\/td><td><b><w k=\"struktura-ramowa\">Struktura ramowa<\/w><\/b><\/td><\/tr><tr><td>Enterprise<\/td><td>przedsiębiorstwo<\/td><td><b><w k=\"organizacja\">Organizacja<\/w><\/b><\/td><\/tr><tr><td>F – Fully<\/td><td>F – w pełni<\/td><td><b><w k=\"ocena-p\">P – Pełny<\/w><\/b><\/td><\/tr><tr><td>P – Partially<\/td><td>P – częściowo<\/td><td><b><w k=\"ocena-c\">C – Częściowy<\/w><\/b><\/td><\/tr><\/table><\/div>","c":"Angielski oryginał łączy obie polskie nazwy; na arkuszu wybierasz egzaminacyjną, a skalę czytasz N – C – W – P.","s":"COBIT 5 Framework (PL), s. 45; zestawienie nazw ALTKOM","ctx":"<p>Podręcznik i egzamin tłumaczono osobno, więc forma podręcznikowa jest częstym dystraktorem: z odpowiedzi „Nadzór ocenia potrzeby interesariuszy” i „Ład ocenia potrzeby interesariuszy” wybierasz drugą. Dziwne słowo rozbrajasz w trzech krokach: zwykły sens → nazwa z egzaminu → oryginał (Oszacuj – <span class=\"en\">Evaluate<\/span>, czyli „oceń”). Słowo po ludzku to most, nie zamiennik: <w k=\"ryzyko\">ryzyko<\/w> to coś, co <b>może<\/b> pójść źle, a nie awaria; <w k=\"zasob\">zasób<\/w> to nie to samo co aktywator. Odpowiadasz według modelu COBIT 5, nie praktyki swojej firmy.<\/p><p><w k=\"skala-ocen\">Skala ocen<\/w> w podręczniku zachowała litery angielskie N, P, L, F z progami 0–15, 15–50, 50–85 i 85–100% (s. 45); tam P znaczy „częściowo”. Na egzaminie PL jest N – C – W – P i P to ocena najwyższa.<\/p><p>Przykład: pracownik banku przepisuje z angielskiego raportu audytora literę „P” do polskiego raportu – i proces oceniony „częściowo” wygląda na wzorowy. Zawsze zapisuj, z której skali pochodzi litera.<\/p>"},{"pt":"Sprawdź się","quiz":{"tresc":"Który zestaw par „termin angielski → nazwa na egzaminie PL” jest w całości poprawny?","opcje":[{"t":"Enabler → Czynnik umożliwiający; Framework → Metodyka","w":"Obie nazwy pochodzą z podręcznika, a nie z egzaminu."},{"t":"Enabler → Aktywator; Framework → Struktura ramowa","ok":true,"w":"Tak. Obie pary to nazwy z egzaminu PL."},{"t":"Governance → Zarządzanie; Enterprise → Przedsiębiorstwo","w":"Governance to Ład, a Przedsiębiorstwo to forma z podręcznika."},{"t":"Enterprise → Organizacja; Governance → Nadzór","w":"Pierwsza para jest dobra, ale Nadzór to forma z podręcznika."}],"src":"materiały Altkom, s. 1","pomoc":{"t":"Pytanie dotyczy lekcji 0.34 „Trzy nazwy jednego terminu”. Cel lekcji: Potrafię rozpoznać nazwę z egzaminu, gdy znam tylko nazwę z podręcznika albo angielską.","k":[]}}},{"pt":"Sprawdź się","quiz":{"tresc":"Jaka jest kolejność ocen w skali z polskiego egzaminu, od najniższej do najwyższej?","opcje":[{"t":"P – W – C – N","w":"Kolejność odwrócona: od najwyższej do najniższej."},{"t":"N – W – C – P","w":"C i W są zamienione. Częściowy jest niżej niż Większościowy."},{"t":"N – C – W – P","ok":true,"w":"Tak: Nieosiągnięty, Częściowy, Większościowy, Pełny."},{"t":"N – P – L – F","w":"To litery z podręcznika i wersji angielskiej, a nie z egzaminu PL."}],"src":"materiały Altkom, s. 2","pomoc":{"t":"Pytanie dotyczy lekcji 0.35 „Litera P – największa pułapka egzaminu”. Cel lekcji: Potrafię odczytać polską skalę ocen N / C / W / P i wiem, że na egzaminie PL litera P oznacza Pełny.","k":[]}}},{"pt":"Sprawdź się","quiz":{"tresc":"W pytaniu pojawia się słowo „Oszacuj” i brzmi obco. Co warto zrobić najpierw?","opcje":[{"t":"Odpowiedzieć tak, jak robi się to w mojej firmie","w":"Egzamin pyta o model COBIT 5, a nie o praktykę Twojej organizacji."},{"t":"Szukać odpowiedzi z nazwą z podręcznika („Ocena”)","w":"Na egzaminie w odpowiedziach stoją nazwy egzaminacyjne, a nie podręcznikowe."},{"t":"Uznać słowo za błąd tłumaczenia i pominąć pytanie","w":"To nie błąd. „Oszacuj” to nazwa egzaminacyjna angielskiego Evaluate."},{"t":"Przetłumaczyć je na <em>Evaluate<\/em>, czyli „oceń”","ok":true,"w":"Tak. Angielski oryginał odsłania znane pojęcie."}],"src":"materiały Altkom, s. 1","pomoc":{"t":"Pytanie dotyczy lekcji 0.37 „Dziwne słowo to prosta rzecz”. Cel lekcji: Potrafię przetłumaczyć dziwne słowo z COBIT 5 na zwykły język i wybrać odpowiedź według modelu COBIT 5, a nie praktyki swojej organizacji.","k":[]}}}]};</script>
