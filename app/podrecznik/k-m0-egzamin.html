<script>window.DECK={"id":"k-m0-egzamin","rozdzial":"Poza podręcznikiem · Egzamin","tytul":"Egzamin w liczbach i pułapki nazw","prev":"k-en-ludzie.html","next":"k-ex-strategia.html","T":{"cobit-5":{"t":"COBIT 5","eg":"COBIT 5","pd":"COBIT 5","en":"COBIT 5","wyj":"Zbiór sprawdzonych reguł z 2012 roku, jak mądrze decydować o informatyce i nią kierować.\n\nCOBIT 5 (ISACA, 2012) opiera się na 5 zasadach (principles), 7 kategoriach aktywatorów (enablers) i modelu referencyjnym 37 procesów: 5 Ładu w domenie EDM i 32 Zarządzania w domenach APO, BAI, DSS i MEA. Kaskada celów przekłada potrzeby interesariuszy na cele organizacji, cele związane z IT i cele aktywatorów. Integruje wcześniejsze wytyczne ISACA (COBIT 4.1, Val IT, Risk IT) i jest spójny z innymi standardami, np. ITIL i ISO/IEC 27001.\n\nŻeby organizacja mogła mądrze kierować informatyką i nią zarządzać: osiągać korzyści przy rozsądnym ryzyku i zużyciu zasobów. Daje jedną, spójną strukturę ramową zamiast wielu luźnych wskazówek.","zycie":"Rodzina ma coraz więcej sprzętu i kont: telefony, laptop, router, bank, zdjęcia w chmurze. Ustalacie, kto decyduje o zakupach, kto pilnuje haseł i kopii, i co miesiąc sprawdzacie, czy wszystko działa i czy nie przepłacacie. COBIT 5 to taki „regulamin domu” dla informatyki, tylko spisany dla firm i urzędów.","firma":"Właściciel warsztatu kupił program do rezerwacji, kasę online i monitoring, ale nie wie, czy to się opłaca i kto za co odpowiada. COBIT 5 podpowiada, jak to poukładać: kto wyznacza kierunek, kto prowadzi codzienne sprawy, jak mierzyć efekty i ryzyko. To gotowa rama, a nie program do zainstalowania.","urzad":"Burmistrz słyszy, że urząd wydaje na informatykę coraz więcej, a mieszkańcy dalej stoją w kolejkach. Sięga po COBIT 5, żeby ustalić, czego chce od systemów, kto w urzędzie za nie odpowiada i jak co roku sprawdzać, czy przynoszą korzyści. COBIT 5 służy tu do uporządkowania Ładu i Zarządzania IT.","it":"Bank po poważnej awarii bankowości internetowej porządkuje IT według COBIT 5: zarząd przejmuje 5 procesów Ładu (EDM01–EDM05), CIO 32 procesy Zarządzania, np. DSS04 Zarządzanie ciągłością, a audyt wewnętrzny ocenia zdolność procesów.","egz":"Liczby do zapamiętania: 5 zasad, 7 aktywatorów, 37 procesów (EDM 5 + APO 13 + BAI 10 + DSS 6 + MEA 3), 6 poziomów zdolności (0–5). Nie myl z: COBIT 2019 – Nowsza wersja (2018/2019) – inne pojęcia (komponenty, 40 celów, czynniki projektowe). Egzamin COBIT 5 Foundation dotyczy COBIT 5.; ITIL – ITIL to dobre praktyki zarządzania usługami IT – jak dostarczać usługi. COBIT patrzy szerzej: Ład i Zarządzanie całością IT w organizacji.; ISO/IEC 27001 – ISO/IEC 27001 to norma bezpieczeństwa informacji z certyfikacją; COBIT 5 to struktura ramowa Ładu i Zarządzania IT.","src":"COBIT 5 Framework (PL), s. 90"}},"S":[{"lekcje":["m0-33-egzamin-w-liczbach"],"pt":"Lekcja 0.33","h":"Egzamin: 50 pytań, 40 minut, próg 50%, bez notatek","b":"<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>Co</th><th>Ile</th></tr><tr><td>Pytania</td><td><b>50</b>, jedna dobra z 4</td></tr><tr><td>Czas</td><td><b>40 minut</b> (+10 w języku obcym)</td></tr><tr><td>Próg</td><td><b>50%</b>, czyli 25 z 50</td></tr><tr><td>Materiały</td><td><b>żadnych</b> (<span class=\"en\">closed book</span>)</td></tr><tr><td>Obszary</td><td>zasady, aktywatory, wdrożenie, zdolność procesu</td></tr></table></div>","c":"Egzamin sprawdza znajomość i rozumienie pojęć, a nie umiejętność wdrożenia COBIT 5.","s":"Sylabus egzaminu COBIT 5 Foundation","ctx":"<p>40 minut na 50 pytań to średnio <b>48 sekund</b> na pytanie. Sylabus celuje w dwa najniższe poziomy taksonomii Blooma: znać i rozumieć – pojęcia muszą siedzieć w pamięci, nikt nie poprosi o plan wdrożenia.</p><p>Sylabus PeopleCert podaje próg 50%, a w nawiasie „20 or more marks” – to niespójność w samym dokumencie; licz na co najmniej 25 z 50.</p><p>Każde pytanie ma kod obszaru: PR – zasady (<span class=\"en\">Principles</span>), EN – aktywatory (<span class=\"en\">Enablers</span>), IM – wdrożenie (<span class=\"en\">Implementation</span>), PC – zdolność procesu (<span class=\"en\">Process Capability</span>). W oficjalnym arkuszu próbnym rozkład wynosi 15 / 21 / 7 / 7, więc aktywatory to największy obszar. Kurs celuje w <b>35 z 50</b> na próbach – w stresie wynik zwykle spada o kilka punktów.</p><p>Przykład: specjalistka ds. informatyki w starostwie, mając miesiąc na naukę, zaczyna od aktywatorów i list nazw, które da się rozpoznać w kilka sekund.</p>"},{"lekcje":["m0-34-trzy-nazwy-terminu","m0-35-litera-p","m0-37-dziwne-slowa"],"pt":"Lekcje 0.34–0.37","h":"Rozumiej pojęcie mimo różnic tłumaczenia","b":"<p>Różne polskie odpowiedniki mogą opisywać to samo pojęcie <w k=\"cobit-5\">COBIT 5</w>. Porównuj znaczenie i angielski termin, a nie samą formę słowa.</p>","c":"Poprawny synonim nie jest sam w sobie błędną odpowiedzią.","s":"COBIT 5 Framework (PL), s. 45; zestawienie nazw ALTKOM","ctx":"<p>Stopień osiągnięcia PA ocenia się jako N 0–15%, P ponad 15–50%, L ponad 50–85%, F ponad 85–100%. Litery dotyczą skali angielskiej. Każdy atrybut ocenia się osobno, bez średniej.</p><p><b>Przykład:</b> 85% oznacza L; dopiero wynik ponad 85% mieści się w F. To stopień osiągnięcia atrybutu, nie odsetek poprawnych dokumentów.</p><p><b>Uwaga:</b> Kursowe tłumaczenie N/C/W/P może pomylić literę P z angielskim Partially. Zawsze określ legendę.</p><p>Ład i nadzór mogą być przekładami governance; metodyka i struktura ramowa przekładami framework. Aktualne brzmienie egzaminu ustala operator.</p>"}],"bankRevision":"4f53cda18c2baa0c","legacySp1Order":[null,null,null,null,null,null]};</script>
