<script>window.DECK={"id":"k-m0-wartosc","rozdzial":"Rozdział 2 · Zasada 1: Realizacja potrzeb interesariusza · s. 17–22","tytul":"Rezultat, korzyść, wartość, ryzyko i zasoby","prev":"k-m0-interesariusze.html","next":"02a-zasada-1.html","T":{"zasob":{"t":"Zasób","eg":"Zasób","pd":"Zasób","en":"Resource","wyj":"To, czym dysponujemy: ludzie, pieniądze, sprzęt, czas i informacje.\n\nZasób (resource) to każdy zasób organizacji, który pomaga jej osiągnąć cele, np. ludzie, finanse, sprzęt, infrastruktura i informacja. Zasoby są ograniczone, więc przy każdej decyzji pyta się, jakie są potrzebne. Optymalizacja zasobów (resource optimisation) to jeden z trzech składników Celu Ładu, obok realizacji korzyści i optymalizacji ryzyka.\n\nŻeby wiedzieć, czym organizacja dysponuje, aby osiągnąć cele: ludźmi, pieniędzmi, sprzętem, infrastrukturą i informacją.","zycie":"W sobotę masz przeprowadzkę. Masz do dyspozycji 2000 zł, samochód brata, trzech kolegów do pomocy i jeden dzień. Pieniądze, auto, ludzie i czas to Twoje zasoby – od tego, jak je rozdzielisz, zależy, czy zdążysz.","firma":"Właściciel warsztatu dostaje duże zlecenie na serwis floty aut. Sprawdza, czy ma wolnych mechaników, podnośniki, pieniądze na części i aktualną bazę klientów z historią napraw. Ludzie, sprzęt, pieniądze i informacje to zasoby warsztatu.","urzad":"Dyrektor szkoły układa plan na nowy rok. Ma określoną liczbę etatów nauczycieli, budżet z gminy, pracownię komputerową z siecią i dane uczniów w dzienniku. To wszystko są zasoby szkoły.","it":"EDM04 (Zapewnienie optymalizacji zasobów) pilnuje, by zasoby IT (ludzie, procesy, technologie) były wystarczające i optymalnie wykorzystane. Szczegółami zajmuje się Zarządzanie, np. APO07 (Zarządzanie zasobami ludzkimi) ludźmi, a APO06 (Zarządzanie budżetem i kosztami) pieniędzmi.","egz":"Pojawia się w „optymalizacji zasobów” i w pytaniu „Jakie zasoby są wymagane?” przy każdej decyzji (s. 17). Nie myl z: Aktywator – Aktywator to szersze pojęcie – obejmuje też np. procesy, kulturę czy polityki. Zasoby (np. ludzie, infrastruktura) są ujęte w niektórych kategoriach aktywatorów.","src":"COBIT 5 Framework (PL), s. 93; COBIT 5 Framework (PL), s. 13"},"optymalizacja-zasobow":{"t":"Optymalizacja zasobów","eg":"Optymalizacja zasobów","pd":"Optymalizacja zasobów","en":"Resource Optimisation","wyj":"Mądre korzystanie z ludzi, pieniędzy i sprzętu: ani za mało, ani na wyrost.\n\nŁad w EDM04 (Zapewnienie optymalizacji zasobów) ocenia, jakich zasobów (resources) organizacja potrzebuje teraz i w przyszłości, kieruje ich przydziałem i monitoruje, czy są dobrze wykorzystane. Zasoby mają być użyte skutecznie (effective), wydajnie (efficient) i odpowiedzialnie (responsible). Czasem optymalizacja oznacza wydanie więcej, np. na szkolenie, bez którego drogi system stoi nieużywany.\n\nŻeby ludzie, pieniądze, sprzęt i infrastruktura były wykorzystane skutecznie, wydajnie i odpowiedzialnie: wystarczyło ich na to, co ważne, i nic się nie marnowało.","zycie":"Rodzina ma dwa samochody, ale drugi stoi pod blokiem sześć dni w tygodniu i tylko kosztuje. Sprzedaje go, mąż dostaje bilet miesięczny, a część pieniędzy idzie na drugi fotelik do pierwszego auta, żeby dzieci mógł wozić każdy z rodziców. Mniej marnowania, a codzienne sprawy dalej załatwione – to optymalizacja zasobów.","firma":"W pizzerii od 11 do 22 stało pięciu kucharzy, choć tłok jest tylko w porze obiadu i wieczorem. Właściciel układa grafik pod godziny ruchu, a zaoszczędzone pieniądze wydaje na szkolenie dwóch osób z obsługi nowego pieca, który dotąd pracował na pół gwizdka. Optymalizacja zasobów to nie samo cięcie kosztów, tylko lepsze wykorzystanie ludzi i sprzętu.","urzad":"Trzy sąsiednie gminy miały każda własną serwerownię i jednego informatyka, którego nikt nie mógł zastąpić na urlopie. Teraz utrzymują jedną wspólną serwerownię i zespół trzech informatyków, którzy nawzajem się zastępują. Mniej dublowania, a obsługa pewniejsza – to optymalizacja zasobów.","it":"W EDM04 (Zapewnienie optymalizacji zasobów) zarząd decyduje, że wydziały zamiast trzech serwerowni korzystają z jednej, a zaoszczędzone pieniądze idą na drugiego administratora, bo jeden był wąskim gardłem. Zatrudnienie i rozwój tej osoby prowadzi kierownictwo IT w APO07 (Zarządzanie zasobami ludzkimi).","egz":"Jeden z trzech składników celu Ładu. SP1: „Skuteczne użycie wszystkich Zasobów (Optymalizacja Zasobów) jest Celem Ładu”. Nie myl z: Cięcie kosztów – Najtańsza opcja nie zawsze jest optymalna – liczy się skuteczność i wydajność, nie sama cena.; Zasób – Zasób to rzecz (ludzie, pieniądze, sprzęt); optymalizacja zasobów to cel Ładu dotyczący ich wykorzystania.","src":"COBIT 5 Framework (PL), s. 93"},"ryzyko":{"t":"Ryzyko","eg":"Ryzyko","pd":"Ryzyko","en":"Risk","wyj":"Coś może pójść źle; liczy się, jak bardzo jest to prawdopodobne i jak bardzo zaboli.\n\nRyzyko to połączenie prawdopodobieństwa zdarzenia i jego konsekwencji. Zaistniałe przerwanie usługi jest incydentem; problem w zarządzaniu usługami oznacza przyczynę jednego lub wielu incydentów. Zdarzenie nie usuwa ryzyka jego nawrotu lub dalszych skutków. Ład ustala apetyt i tolerancję, a Zarządzanie identyfikuje, analizuje i obsługuje ryzyko w tych granicach.\n\nŻeby z wyprzedzeniem widzieć, co może pójść źle i jak bardzo by zaszkodziło, i świadomie decydować, czemu zapobiegać, a co zaakceptować.","zycie":"Planujecie wesele w ogrodzie w lipcu. Deszcz jest dość prawdopodobny, a skutek byłby duży – goście mokną, tort się rozpływa – więc rezerwujecie namiot. Ryzyko to ta możliwość deszczu razem z jej skutkami; jeśli w dniu wesela leje, macie już problem, a nie ryzyko.","firma":"W biurze rachunkowym tylko pani Ewa umie obsługiwać program do płac. Jeśli zachoruje w ostatnim tygodniu miesiąca, pensje u klientów się spóźnią. Szef ocenia, że to mało prawdopodobne, ale bolesne, więc każe przeszkolić drugą osobę – tak wygląda praca z ryzykiem.","urzad":"Nabór wniosków o dopłaty do wymiany pieców w urzędzie gminy zamyka się w piątek o 15:00, a wszystko idzie przez jeden serwer. Awaria akurat w piątek jest mało prawdopodobna, ale skutek byłby fatalny, więc informatyk robi kopię i ma tego dnia dyżur. To ryzyko: możliwość zdarzenia plus jego skutki.","it":"W procesie APO12 (Zarządzanie ryzykiem) dział IT prowadzi rejestr ryzyk: np. „awaria serwerowni” ma ocenione prawdopodobieństwo i skutki. Dla ryzyk powyżej apetytu ustalonego przez Ład w EDM03 (Zapewnienie optymalizacji ryzyka) planuje się działania, np. zapasowe centrum danych.","egz":"Na egzaminie ryzyko pojawia się głównie jako „optymalizacja ryzyka” (cel Ładu) i „apetyt na ryzyko” (czynnik środowiskowy we wdrożeniu). Nie myl z: Issue / problem / incydent – Problem już zaistniał; ryzyko jest możliwością w przyszłości.; Zagrożenie – Zagrożenie to źródło (np. powódź); ryzyko łączy prawdopodobieństwo z konsekwencjami.","src":"COBIT 5 Framework (PL), s. 93"},"rezultat":{"t":"Rezultat / wynik","eg":"Rezultat / wynik","pd":"Wynik","en":"Output","wyj":"Konkretny produkt pracy, np. raport, działający program albo podpisana umowa.\n\nRezultat (output) to bezpośredni produkt pracy procesu albo projektu, np. wdrożony system, raport czy przeprowadzone szkolenie. W COBIT 5 wyjścia (outputs) praktyk jednego procesu bywają wejściami innych praktyk i procesów. Korzyść (benefit) pojawia się dopiero wtedy, gdy rezultat realnie coś poprawia u interesariuszy.\n\nŻeby odróżnić to, co praca bezpośrednio wytworzyła, od korzyści, którą ma przynieść, i nie uznawać samego dostarczenia za sukces.","zycie":"Kupujesz bieżnię i stawiasz ją w sypialni – bieżnia to rezultat. Jeśli po pół roku służy za wieszak na ubrania, rezultat jest, a korzyści, czyli lepszej kondycji, nie ma.","firma":"Warsztat zamawia stronę internetową z rezerwacją wizyt i od poniedziałku strona działa – to rezultat. Czy przyniesie korzyść, okaże się, gdy właściciel policzy, ile osób naprawdę się przez nią umówiło.","urzad":"Szkoła robi dla rodziców szkolenie z e-dziennika: 80 osób na sali, lista obecności podpisana. To rezultat. Korzyść będzie wtedy, gdy rodzice przestaną dzwonić do sekretariatu po oceny.","it":"Projekt w BAI03 (Zarządzanie identyfikacją i budowaniem rozwiązań) dostarcza nową aplikację – to rezultat (output). Czy powstała korzyść, sprawdza się później, np. w EDM02 (Zapewnienie realizacji korzyści), porównując efekty z uzasadnieniem biznesowym.","egz":"Pytania o „sukces projektu”: dostarczenie zgodnie z umową (rezultat) NIE oznacza jeszcze wartości dla interesariuszy (korzyść). Nie myl z: Realizacja korzyści – Korzyść = zmiana na lepsze dzięki rezultatowi.; Rezultat procesu w ISO/IEC 15504 (outcome) – Tu „rezultat” to output – konkretny produkt pracy (raport, działający system). W ocenie zdolności (ISO/IEC 15504) „rezultat” to outcome – obserwowalny skutek osiągnięcia przeznaczenia procesu. To dwa różne angielskie słowa przetłumaczone tak samo.","src":"COBIT 5 Framework (PL), s. 92"},"it-incydent":{"t":"Incydent","eg":"Incydent","pd":"incydent","en":"Incident","wyj":"Nagła przerwa albo pogorszenie działania usługi, które trzeba szybko naprawić.\n\nKtoś zauważa, że coś nie działa, i zgłasza to. Pomoc techniczna zapisuje zgłoszenie i ustala, jak pilne. Technik przywraca działanie albo stosuje obejście. Zgłaszający potwierdza, że już działa.\n\nŻeby jak najszybciej przywrócić ludziom działającą usługę.","zycie":"W domu nagle znika Internet. Wyłączasz i włączasz router i po dwóch minutach działa. To był incydent.","firma":"W sklepie internetowym przez godzinę nie działa płatność kartą. Klienci nie mogą kupować – sklep traci pieniądze.","urzad":"O 10:00 w wydziale komunikacji urzędu miasta przestaje działać system do rejestracji samochodów. Przy okienkach czeka 30 osób, więc urzędniczka zgłasza awarię do pomocy technicznej. Informatyk o 10:40 przywraca działanie systemu i obsługa rusza dalej – incydent zamknięty.","it":"Incydentami zarządza proces DSS02 Zarządzanie zgłoszeniami serwisowymi i incydentami (FW-PL s. 33).","egz":"DSS02 Zarządzanie zgłoszeniami serwisowymi i incydentami (Manage Service Requests and Incidents). Odróżniaj incydent (już się stało) od ryzyka (może się stać) i od problemu (przyczyna). Nie myl z: Problem – Incydent to objaw, który gasimy szybko. Problem to ukryta przyczyna, którą szukamy i usuwamy, żeby incydenty nie wracały.; Ryzyko – Ryzyko dotyczy tego, co MOŻE się zdarzyć. Incydent już się dzieje.","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; COBIT 5 Framework (PL), s. 36"},"optymalizacja-ryzyka":{"t":"Optymalizacja ryzyka","eg":"Optymalizacja ryzyka","pd":"Optymalizacja ryzyka","en":"Risk Optimisation","wyj":"Pilnowanie, żeby zagrożeń nie było więcej, niż szefostwo jest gotowe znieść.\n\nRyzyko się rozpoznaje, szacuje jego wpływ i prawdopodobieństwo, a potem wybiera strategię: unikanie (avoidance), ograniczanie (mitigation) albo transfer (transfer), i zarządza nim w kontekście apetytu na ryzyko (risk appetite). Apetyt na ryzyko ustala i monitoruje Ład w EDM03 (Zapewnienie optymalizacji ryzyka), a bieżące zarządzanie ryzykiem prowadzi Zarządzanie w APO12 (Zarządzanie ryzykiem). Razem z realizacją korzyści i optymalizacją zasobów tworzy cel Ładu: tworzenie wartości.\n\nŻeby ryzyko związane z IT utrzymać na akceptowalnym poziomie, czyli w granicach apetytu na ryzyko, a nie próbować go wyeliminować, co zablokowałoby działanie.","zycie":"Codziennie jeździsz samochodem do pracy, choć wiesz, że może zdarzyć się stłuczka. Zapinasz pasy (ograniczasz skutki), kupujesz AC (przerzucasz koszt na ubezpieczyciela), a po weselu kuzyna nie siadasz za kierownicę (unikasz). Ryzyko nie spada do zera, ale jest na poziomie, z którym możesz żyć – to optymalizacja ryzyka.","firma":"Sklep internetowy mógłby w ogóle nie przyjmować kart, żeby nie ryzykować wycieku, ale wtedy mało kto by coś kupił. Właścicielka oddaje więc płatności operatorowi i nie trzyma numerów kart u siebie (unikanie), robi codzienne kopie zapasowe (ograniczanie) i wykupuje ubezpieczenie od cyberataku (transfer). Ryzyko zostaje, ale w granicach, na które ją stać.","urzad":"Urząd gminy mógłby odłączyć się od internetu, żeby nikt się nie włamał, ale mieszkańcy straciliby e-usługi. Wójt akceptuje, że jakieś ryzyko zostaje, i każe wprowadzić to, co ma sens przy tych danych: kopie zapasowe, aktualizacje, szkolenie z rozpoznawania fałszywych maili. Zabezpieczenia na miarę zagrożenia, a nie za wszelką cenę – to optymalizacja ryzyka.","it":"W EDM03 (Zapewnienie optymalizacji ryzyka) zarząd ustala apetyt na ryzyko: przestój systemu sprzedaży najwyżej 4 godziny w roku. W APO12 (Zarządzanie ryzykiem) dział IT ocenia scenariusze i dobiera zabezpieczenia tak, by zmieścić się w tej granicy.","egz":"Jeden z trzech składników celu Ładu. Pułapka w odpowiedziach: „wyeliminowanie ryzyka” jest zawsze błędne. Poprawnie: „utrzymanie ryzyka na akceptowalnym poziomie / w granicach apetytu na ryzyko”. Nie myl z: Eliminacja ryzyka – Optymalizacja ≠ eliminacja. Usunięcie każdego ryzyka zwykle zabija też korzyści.; Ryzyko – Ryzyko to sama możliwość zdarzenia; optymalizacja ryzyka to cel Ładu dotyczący zarządzania nim.","src":"COBIT 5 Framework (PL), s. 93; COBIT 5 Framework (PL), s. 13"},"realizacja-korzysci":{"t":"Realizacja korzyści","eg":"Realizacja korzyści","pd":"Realizacja korzyści","en":"Benefits Realisation","wyj":"Pilnowanie, żeby z wydanych pieniędzy naprawdę był pożytek, a nie tylko faktury.\n\nRealizacja korzyści (Benefits Realisation) obejmuje trzy działania: uzyskiwanie nowych korzyści, utrzymanie i rozszerzanie istniejących oraz eliminowanie inicjatyw i zasobów, które nie dają wystarczającej wartości. Korzyść mierzy się poprawą u interesariuszy, a nie samym rezultatem (output). Razem z optymalizacją ryzyka i optymalizacją zasobów tworzy cel Ładu, czyli tworzenie wartości, a w procesach Ładu odpowiada za nią EDM02 (Zapewnienie realizacji korzyści).\n\nŻeby inwestycje w IT naprawdę przynosiły organizacji pożytek, a nie kończyły się na zakupie albo wdrożeniu.","zycie":"Kupujecie zmywarkę, żeby wieczorem nie stać przy zlewie, ale przez miesiąc i tak zmywacie ręcznie, „bo szkoda prądu”. Korzyść pojawia się dopiero, gdy zmywarka chodzi codziennie, a Wy macie wolny wieczór. Rezygnacja z drugiego, nieoglądanego serwisu streamingowego to też realizacja korzyści – przestajecie płacić za coś, co nic nie daje.","firma":"Kawiarnia kupuje terminal płatniczy, bo klienci odchodzili, gdy nie mogli zapłacić kartą. Po trzech miesiącach właściciel sprawdza: kolejka krótsza, utarg wyższy o 15%. Dopiero to jest zrealizowana korzyść – sam terminal na ladzie nią nie był.","urzad":"Gmina wdraża elektroniczny obieg dokumentów, żeby sprawy szły szybciej. Pół roku później okazuje się, że urzędnicy i tak drukują każde pismo i noszą je do podpisu. System jest, ale korzyści nie ma – dopóki ludzie nie zmienią sposobu pracy.","it":"W procesie EDM02 (Zapewnienie realizacji korzyści) Ład ocenia portfel inwestycji IT, kieruje środki tam, gdzie korzyści są największe, i monitoruje, czy korzyści zapowiedziane w uzasadnieniu biznesowym naprawdę się pojawiają. Zarządzanie realizuje to m.in. w APO05 (Zarządzanie portfelem projektów).","egz":"Jeden z trzech składników celu Ładu. Zapamiętaj trzy działania: uzyskiwać nowe korzyści, utrzymywać istniejące, eliminować to, co nie daje wartości. Nie myl z: Rezultat / wynik – Rezultat (output) to bezpośredni produkt działania – np. wdrożony system. Korzyść (benefit) to poprawa, którą ten produkt przynosi – np. szybsza obsługa.; Tworzenie Wartości – Cel Ładu – Tworzenie wartości = korzyści + ryzyko + zasoby w równowadze. Realizacja korzyści to tylko jeden składnik.","src":"COBIT 5 Framework (PL), s. 89; COBIT 5 Framework (PL), s. 17, Ilustracja 3"},"it-infrastruktura":{"t":"Infrastruktura IT","eg":"Infrastruktura IT","pd":"infrastruktura","en":"IT infrastructure","wyj":"Podstawa, na której działa cała informatyka: sprzęt, sieć, serwery i oprogramowanie systemowe.\n\nSerwery stoją w serwerowni z zasilaniem i chłodzeniem. Sieć łączy je z komputerami użytkowników. Systemy operacyjne na serwerach uruchamiają aplikacje, z których korzystają ludzie.\n\nŻeby aplikacje i usługi miały na czym działać – niezawodnie i bezpiecznie.","zycie":"W bloku wspólne są: instalacja elektryczna, wodociąg i winda. To infrastruktura budynku – mieszkańcy z niej korzystają, ale rzadko o niej myślą.","firma":"Bank ma dwie serwerownie w różnych miastach, każdą z własnym zasilaniem. Gdy jedna zawiedzie, druga przejmuje pracę.","urzad":"Urząd wojewódzki ma serwerownię z zasilaniem awaryjnym i klimatyzacją, sieć łączącą siedzibę z delegaturami w trzech miastach i systemy operacyjne na serwerach. Na tej podstawie działają aplikacje, na przykład do wydawania paszportów. Urzędnicy korzystają z aplikacji, a infrastrukturą zajmuje się wydział informatyki.","it":"Infrastruktura techniczna i fizyczna to część aktywatora Usługi, infrastruktura i aplikacje (FW-PL s. 86).","egz":"Infrastruktura to część aktywatora Usługi, infrastruktura i aplikacje (Services, Infrastructure and Applications). To jeden z trzech aktywatorów, które są też zasobami. Nie myl z: Aplikacja – Aplikacja działa na infrastrukturze. Infrastruktura to podstawa, aplikacja to narzędzie dla człowieka.; Usługi, Infrastruktura i Aplikacje – Aktywator COBIT 5 łączy usługi, infrastrukturę i aplikacje. Infrastruktura to tylko jedna jego część.","src":"COBIT 5 Framework (PL), s. 86; COBIT 5 Framework (PL), s. 27"},"it-hardware":{"t":"Sprzęt komputerowy","eg":"Sprzęt komputerowy","pd":"sprzęt","en":"Hardware","wyj":"Wszystkie części komputera, które można dotknąć: obudowa, ekran, klawiatura, myszka.\n\nKlawiatura i myszka przekazują Twoje polecenia. Procesor wykonuje je według programu. Wynik pojawia się na ekranie albo wychodzi z drukarki. Dysk przechowuje to, co zapiszesz.\n\nŻeby było na czym wykonywać pracę: liczyć, zapisywać, wyświetlać i drukować. Bez sprzętu żaden program nie ma gdzie działać.","zycie":"Telefon w Twojej dłoni: ekran, przyciski, bateria i aparat to sprzęt. Gdy upuścisz telefon i pęknie ekran, uszkodziłeś sprzęt – zdjęcia w środku mogą być całe.","firma":"Firma kurierska kupuje kierowcom 200 skanerów do paczek i 20 drukarek etykiet. To wydatek na sprzęt, osobny od opłaty za program do śledzenia przesyłek.","urzad":"Urząd miasta kupuje 50 nowych komputerów i 10 drukarek. W budżecie to pozycja „sprzęt komputerowy”, osobna od opłat za programy.","it":"W COBIT 5 sprzęt należy do infrastruktury technicznej w aktywatorze Usługi, infrastruktura i aplikacje (FW-PL s. 86).","egz":"Słowo „hardware” nie jest terminem egzaminu COBIT 5. Przyda się przy aktywatorze Usługi, infrastruktura i aplikacje: sprzęt jest tam częścią infrastruktury technicznej (FW-PL s. 86). Nie myl z: Oprogramowanie – Sprzęt można dotknąć. Oprogramowanie to polecenia zapisane w sprzęcie – nie da się ich dotknąć.; Infrastruktura IT – Infrastruktura to szersze pojęcie: sprzęt, sieć i oprogramowanie systemowe razem, cała „podstawa” informatyki organizacji.","src":"COBIT 5 Framework (PL), s. 86"},"informacja":{"t":"Informacja","eg":"Informacja","pd":"Informacje","en":"Information (enabler 5)","wyj":"Wszystko, co wiemy i zapisujemy, od numeru telefonu po raport, i co komuś do czegoś służy.\n\nInformacja (Information) to piąty z 7 aktywatorów i obejmuje wszystkie informacje w organizacji, nie tylko te w systemach. Ma interesariuszy w rolach wytwórcy (producer), opiekuna (custodian) i konsumenta (consumer), własny cykl życia i kryteria jakości: wewnętrznej, kontekstowej oraz bezpieczeństwa i dostępności. Opisuje się ją też w 6 warstwach atrybutów, od fizycznej po społeczną.\n\nŻeby organizacja traktowała informację jak zasób, o który trzeba dbać: wytwarzać ją, przechowywać, chronić i udostępniać tym, którzy jej potrzebują.","zycie":"Mama dzwoni, że w czwartek nie odbierze dzieci ze szkoły, na lodówce wisi plan lekcji, a szkoła przysyła SMS o skróconych zajęciach. Żadna z tych wiadomości nie siedzi w komputerze, a mimo to wszystkie są informacją, od której zależy, kto i o której jedzie po dzieci. Jeśli nikt jej nie przeczyta i nie zareaguje, nic z niej nie wynika – to cecha aktywatora Informacja.","firma":"Piekarz zapisuje w zeszycie, ile chleba zostało wieczorem, kasa drukuje raport sprzedaży, a sprzedawczyni mówi, o co pytali klienci. Z tego wszystkiego właścicielka planuje jutrzejszy wypiek. Piekarz informację tworzy, zeszyt i kasa ją przechowują, a właścicielka z niej korzysta – to role wokół aktywatora Informacja.","urzad":"W szkole sekretarka prowadzi rejestr uczniów, wychowawca wpisuje oceny do dziennika, a dyrektor na radzie pedagogicznej słyszy ustnie o kłopotach w klasie 3b. Wszystko to jest informacja, także to, czego nie ma w żadnym systemie. Coś z niej wynika dopiero wtedy, gdy dyrektor na tej podstawie organizuje pomoc dla klasy.","it":"Dane kontaktowe klientów w systemie CRM to aktywator Informacja: klient podaje je przy zakładaniu konta (wytwórca), administrator utrzymuje bazę (opiekun), a konsultant korzysta z niej przy obsłudze (konsument). Nieaktualny numer to błąd jakości informacji, przez który powiadomienie nie dotarło.","egz":"Informacja jest jedną ze zdolności do świadczenia usług, a zdolności te wykorzystuje się poprzez procesy, by świadczyć usługi (s. 86). Procesy wymagają informacji jako wejścia i wytwarzają ją jako wyjście (s. 71). Nie myl z: Dane – Dane to surowe fakty. Informacja to dane przetworzone i mające znaczenie.","src":"COBIT 5 Framework (PL), s. 81; COBIT 5 Framework (PL), s. 86"},"it-problem":{"t":"Problem","eg":"Problem","pd":"problem","en":"Problem","wyj":"Ukryta przyczyna awarii, która sprawia, że te same kłopoty wracają.\n\nKtoś zauważa, że incydenty się powtarzają albo jeden był bardzo poważny. Otwiera się problem. Specjaliści zbierają fakty i szukają przyczyny. Gdy ją znajdą, planują jej usunięcie.\n\nŻeby nie gasić w kółko tych samych awarii, tylko usunąć ich źródło.","zycie":"Co zimę zamarza Ci rura w garażu. Za każdym razem ją rozmrażasz (incydent). W końcu ocieplasz rurę (usuwasz problem).","firma":"System sprzedaży zawiesza się co poniedziałek rano. Analiza pokazuje, że w poniedziałki loguje się naraz zbyt wiele osób. Firma rozbudowuje serwer.","urzad":"W szpitalu wojewódzkim system rejestracji pacjentów zawiesza się kilka razy w tygodniu około 7:30. Za każdym razem informatyk go restartuje (incydent). W końcu analizuje zdarzenia i odkrywa, że o tej porze wciąż trwa nocna kopia zapasowa. Przesunięcie kopii na wcześniejszą godzinę usuwa problem.","it":"Przyczynami incydentów zajmuje się proces DSS03 Zarządzanie problemami (FW-PL s. 33).","egz":"DSS03 Manage Problems dotyczy przyczyn jednego lub wielu incydentów. Incydent jest zakłóceniem usługi. Sam fakt, że zdarzenie już nastąpiło, nie jest definicją problemu. Nie myl z: Incydent – Incydent: objaw, gasimy szybko. Problem: przyczyna, szukamy jej i usuwamy.; Ryzyko – Ryzyko to możliwość przyszłego zdarzenia. Problem to przyczyna zdarzeń, które już nastąpiły.","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16"}},"S":[{"lekcje":["m0-16-rezultat-korzysc"],"pt":"Lekcja 0.16","h":"Rezultat to jeszcze nie korzyść","b":"<ul><li><w k=\"rezultat\">Rezultat</w> <span class=\"en\">Output</span>: co powstało – wdrożony system, odbyte szkolenie.</li><li>Korzyść: co się poprawiło dzięki rezultatowi.</li><li>W urzędzie korzyścią są usługi publiczne, nie zysk.</li></ul>","c":"Wyłączenie systemu, który nic nie daje, też jest realizacją korzyści.","s":"COBIT 5 Framework (PL), s. 17, 89","ctx":"<p>Słowniczek opisuje <w k=\"realizacja-korzysci\">realizację korzyści</w> jako jeden z celów nadzoru: uzyskiwanie nowych korzyści, utrzymanie i rozszerzenie istniejących oraz „wyeliminowanie inicjatyw i zasobów, które nie generują wystarczającej wartości”. Trzecia część to pułapka: rezygnacja z nieopłacalnego systemu brzmi jak strata, a jest realizacją korzyści.</p><p>Rezultat może istnieć bez korzyści: szkolenie odbyte, certyfikaty rozdane, a pracownicy klikają w fałszywe wiadomości tak samo często. Odpowiedź „korzyść, bo projekt odebrano” myli rezultat z korzyścią. Uwaga: w ocenie zdolności procesu „rezultat” tłumaczy inne słowo – <em>outcome</em>.</p><p>Przykład: gmina uruchamia e-wnioski. Rezultat – działający formularz. Korzyść – krótsze kolejki i szybsze załatwianie spraw.</p>"},{"lekcje":["m0-17-wartosc","m0-18-optymalizacja","m0-22-zasob"],"pt":"Lekcje 0.17–0.22","h":"Optymalizacja to najlepszy rozsądny poziom, nie minimum","b":"<ul><li><w k=\"optymalizacja-zasobow\">Optymalizacja zasobów</w>: skuteczne, wydajne i odpowiedzialne użycie – nie „najtaniej”.</li><li><w k=\"optymalizacja-ryzyka\">Optymalizacja ryzyka</w>: w granicach apetytu na <w k=\"ryzyko\">ryzyko</w> – nie „zero”.</li><li><w k=\"zasob\">Zasoby</w>: ludzie, finanse, <w k=\"it-hardware\">sprzęt</w>, <w k=\"it-infrastruktura\">infrastruktura</w>… i <w k=\"informacja\">informacja</w>.</li></ul>","c":"Wartość jest dopiero wtedy, gdy korzyści, ryzyko i zasoby są w równowadze.","s":"COBIT 5 Framework (PL), s. 13, 17, 93","ctx":"<p>Tworzenie wartości to osiąganie korzyści „w sposób maksymalnie oszczędny” przy zoptymalizowanym ryzyku – łatwo to odczytać jako „najtaniej”, ale składnik nazywa się optymalizacja, nie minimalizacja. Za tanio: kopie zapasowe niepełne, korzyść znika. Za drogo: funkcje, których nikt nie używa. Odpowiedź z jednym składnikiem („tylko realizacja korzyści”) jest za wąska.</p><p>Zasób to w słowniczku „każdy zasób przedsiębiorstwa, który ułatwia organizacji osiągnięcie jej celów” – lista jest otwarta („itd.”), a streszczenie zaczyna się od zdania, że informacje są kluczowym zasobem. Pułapka: „możliwość wycieku danych” to ryzyko, nie zasób.</p><p>Przykład: urząd wybiera usługę chmurową. Najtańsza oferta nie ma kopii (ryzyko za duże), najdroższa ma dziesiątki zbędnych funkcji (zasoby zmarnowane) – optymalna jest środkowa.</p>"},{"lekcje":["m0-20-ryzyko","m0-21-postepowanie-z-ryzykiem"],"pt":"Lekcje 0.20–0.21","h":"Ryzyko to przyszłe zdarzenie – zarządza się nim, nie usuwa do zera","b":"<blockquote>„Połączenie prawdopodobieństwa zdarzenia i jego konsekwencji”</blockquote><ul><li><w k=\"ryzyko\">Ryzyko</w> ≠ <w k=\"it-incydent\">incydent</w> (zakłócenie usługi); <w k=\"it-problem\">problem</w> to przyczyna incydentów ≠ zagrożenie (samo źródło).</li><li>Strategie: unikanie, ograniczanie, transfer (i świadoma akceptacja).</li></ul>","c":"„Wyeliminować ryzyko” to na egzaminie prawie zawsze zła odpowiedź.","s":"COBIT 5 Framework (PL), s. 13, 93","ctx":"<p>Ryzyko ocenia się dwiema miarami: jak łatwo się zdarzy i jak bardzo zaszkodzi – rzadki wyciek danych klientów z ogromnym skutkiem to duże ryzyko. Zdanie o ryzyku ma budowę „jeśli…, to…”. Awaria, która trwa teraz, jest problemem, a „hakerzy atakują sklepy” – samym zagrożeniem.</p><p>Streszczenie mówi o dążeniu do „utrzymania ryzyka związanego z IT na akceptowalnym poziomie” (s. 13). Słowniczek wymienia unikanie, ograniczanie negatywnego wpływu i transfer; resztą zarządza się w granicach apetytu na ryzyko. Świadomą akceptację kurs dodaje za ogólną praktyką (wiedza ogólna). Słowa „całkowicie”, „zero”, „wyeliminować” sygnalizują dystraktor.</p><p>Przykład: bank buduje zapasowe centrum danych w innym mieście – to ograniczanie (mniejsze skutki awarii). Ubezpieczenie od skutków awarii byłoby transferem.</p>"}],"bankRevision":"4f53cda18c2baa0c","legacySp1Order":[null,null,null,null,null,null,null,null,null]};</script>
