<script>window.DECK={"id":"k-pr-aktywatory","rozdzial":"Rozdział 5 · Zasada 4: Aktywacja holistycznego podejścia · s. 27–30","tytul":"Aktywatory i siedem kategorii","prev":"k-pr-zasada-3.html","next":"k-pr-wymiary.html","T":{"zasob":{"t":"Zasób","eg":"Zasób","pd":"Zasób","en":"Resource","wyj":"To, czym dysponujemy: ludzie, pieniądze, sprzęt, czas i informacje.\n\nZasób (resource) to każdy zasób organizacji, który pomaga jej osiągnąć cele, np. ludzie, finanse, sprzęt, infrastruktura i informacja. Zasoby są ograniczone, więc przy każdej decyzji pyta się, jakie są potrzebne. Optymalizacja zasobów (resource optimisation) to jeden z trzech składników Celu Ładu, obok realizacji korzyści i optymalizacji ryzyka.\n\nŻeby wiedzieć, czym organizacja dysponuje, aby osiągnąć cele: ludźmi, pieniędzmi, sprzętem, infrastrukturą i informacją.","zycie":"W sobotę masz przeprowadzkę. Masz do dyspozycji 2000 zł, samochód brata, trzech kolegów do pomocy i jeden dzień. Pieniądze, auto, ludzie i czas to Twoje zasoby – od tego, jak je rozdzielisz, zależy, czy zdążysz.","firma":"Właściciel warsztatu dostaje duże zlecenie na serwis floty aut. Sprawdza, czy ma wolnych mechaników, podnośniki, pieniądze na części i aktualną bazę klientów z historią napraw. Ludzie, sprzęt, pieniądze i informacje to zasoby warsztatu.","urzad":"Dyrektor szkoły układa plan na nowy rok. Ma określoną liczbę etatów nauczycieli, budżet z gminy, pracownię komputerową z siecią i dane uczniów w dzienniku. To wszystko są zasoby szkoły.","it":"EDM04 (Zapewnienie optymalizacji zasobów) pilnuje, by zasoby IT (ludzie, procesy, technologie) były wystarczające i optymalnie wykorzystane. Szczegółami zajmuje się Zarządzanie, np. APO07 (Zarządzanie zasobami ludzkimi) ludźmi, a APO06 (Zarządzanie budżetem i kosztami) pieniędzmi.","egz":"Pojawia się w „optymalizacji zasobów” i w pytaniu „Jakie zasoby są wymagane?” przy każdej decyzji (s. 17). Nie myl z: Aktywator – Aktywator to szersze pojęcie – obejmuje też np. procesy, kulturę czy polityki. Zasoby (np. ludzie, infrastruktura) są ujęte w niektórych kategoriach aktywatorów.","src":"COBIT 5 Framework (PL), s. 93; COBIT 5 Framework (PL), s. 13"},"zasady-polityki-struktury":{"t":"Zasady, Polityki i Struktury ramowe","eg":"Zasady, Polityki i Struktury ramowe","pd":"Zasady, polityki i metodyki","en":"Principles, Policies and Frameworks (enabler 1)","wyj":"Spisane reguły i wskazówki, które mówią ludziom, jak mają postępować na co dzień.\n\nTo aktywator 1 (Principles, Policies and Frameworks). Zasady to niewiele prostych zdań o podstawowych wartościach organizacji. Polityki to bardziej szczegółowe wytyczne, jak te zasady stosować; dobra polityka jest skuteczna, wydajna i nieinwazyjna. Struktury ramowe dają strukturę i narzędzia, a polityki realizuje się przede wszystkim przez praktyki procesów.\n\nŻeby przekazać ludziom wytyczne i instrukcje organu Ładu i kierownictwa: co jest ważne, jak postępować na co dzień i z jakich narzędzi korzystać.","zycie":"Rodzice ustalają zasadę domu: „Szanujemy wspólny czas”. Z niej wynika polityka: telefony odkładamy przy kolacji, wyjątek to dyżur pod telefonem w pracy, kto złamie, zmywa naczynia, a w niedzielę sprawdzamy, jak nam idzie. Zasada jest krótka i ogólna, polityka mówi, jak ją stosować.","firma":"Właścicielka sklepu internetowego ma zasadę: „Klient zawsze wie, za co płaci”. Spisuje politykę zwrotów: 14 dni, wyjątek dla rzeczy szytych na zamówienie, raz w miesiącu sprawdza, czy pracownicy jej przestrzegają. Zasada mówi, co jest ważne, polityka – jak to robić.","urzad":"Wójt ogłasza zasadę: „Urząd działa jawnie”. Sekretarz przygotowuje politykę udostępniania informacji publicznej: czego dotyczy, w jakim terminie odpowiadamy, kiedy odmawiamy (np. tajemnica przedsiębiorstwa) i kto pilnuje terminów. Zasada jest krótka, polityka szczegółowa.","it":"APO01 (Zarządzanie metodyką zarządzania IT) obejmuje przekazywanie celów i kierunku zarządzania oraz utrzymywanie polityk IT. Polityka bezpieczeństwa informacji z APO13 (Zarządzanie bezpieczeństwem) działa dopiero wtedy, gdy realizują ją praktyki procesów, np. w DSS05 (Zarządzanie usługami bezpieczeństwa).","egz":"Na egzaminie: zasady = podstawowe wartości (mało, prosto); polityki = szczegółowe wytyczne stosowania zasad; struktury ramowe = otwarte i elastyczne. Cechy dobrej polityki: skuteczna, wydajna, nieinwazyjna. Najważniejszy nośnik wykonywania polityk to praktyki procesu. Egzamin: „Zasady, Polityki i Struktury ramowe” (czasem „modele ramowe”). Podręcznik: „Zasady, polityki i metodyki”. „Zasady” w tym aktywatorze (principles organizacji) ≠ 5 zasad COBIT 5. Nie myl z: Pięć zasad COBIT 5 – Pięć zasad COBIT 5 to fundament samej metodyki. Zasady w aktywatorze 1 to wartości TWOJEJ organizacji.; Procedura – Procedura opisuje kroki. Polityka mówi, co i dlaczego ma obowiązywać.","src":"COBIT 5 Framework (PL), s. 67; COBIT 5 Framework (PL), s. 67, Ilustracja 28; COBIT 5 Framework (PL), s. 68"},"struktury-organizacyjne":{"t":"Struktury organizacyjne","eg":"Struktury organizacyjne","pd":"Struktury organizacyjne","en":"Organisational Structures (enabler 3)","wyj":"Zespoły, komisje i stanowiska, które podejmują decyzje, np. narada kierownictwa czy komisja przetargowa.\n\nStruktury organizacyjne (organisational structures) to kluczowe jednostki decyzyjne, np. zarząd, komitet ds. strategii IT czy komitet sterujący. Każda ma mandat, skład i zasady działania, a dobre praktyki obejmują też zakres kontroli (span of control), poziom uprawnień (level of authority), delegowanie uprawnień i procedury eskalacji. Wynikiem ich pracy są decyzje, a tabele RACI łączą je z praktykami procesów.\n\nŻeby było wiadomo, które zespoły i gremia podejmują jakie decyzje, z jakim umocowaniem i według jakich zasad.","zycie":"Trójka rodzeństwa opiekuje się starszym tatą i umawia się: każdy wydatek powyżej 1000 zł na leczenie czy remont jego mieszkania zatwierdzają we trójkę, na rozmowie w niedzielę. Drobne zakupy robi ten, kto akurat jest u taty. Ta niedzielna „rada” to struktura organizacyjna – ma skład, mandat i zasady podejmowania decyzji.","firma":"W rodzinnej stolarni powstaje komitet inwestycyjny: właściciel, jego córka i księgowa. Raz w miesiącu decydują o zakupach maszyn powyżej 20 tys. zł, a mniejsze wydatki zatwierdza sam kierownik warsztatu. Komitet to struktura organizacyjna z określonym zakresem uprawnień.","urzad":"Wójt zarządzeniem powołuje komisję przetargową do zakupu komputerów dla szkół. Zarządzenie mówi, kto w niej zasiada, co ocenia i kiedy kończy pracę – po podpisaniu umowy. To struktura organizacyjna z mandatem i cyklem życia.","it":"Komitet sterujący programu wdrożenia nowego systemu zatwierdza zmiany zakresu i budżetu w procesie BAI01 (Zarządzanie programami i projektami), a sprawy przekraczające jego uprawnienia eskaluje do komitetu ds. strategii IT. To aktywator „Struktury organizacyjne” w działaniu: mandat, poziom uprawnień i eskalacja.","egz":"Produkt działań struktury to decyzje. Pytania o „zasady operacyjne”, „zakres kontroli”, „poziom uprawnień”, „delegowanie” i „eskalację” dotyczą tego aktywatora. Nie myl z: Role i struktury organizacyjne – Struktura to jednostka (np. komitet), a rola to funkcja osoby (np. CIO). Ilustracja 33 zawiera i jedne, i drugie.","src":"COBIT 5 Framework (PL), s. 27; COBIT 5 Framework (PL), s. 75, Ilustracja 32"},"ludzie-umiejetnosci-kompetencje":{"t":"Ludzie, Umiejętności i Kompetencje","eg":"Ludzie, Umiejętności i Kompetencje","pd":"Ludzie, umiejętności i kompetencje","en":"People, Skills and Competencies (enabler 7)","wyj":"Właściwi ludzie z właściwą wiedzą na właściwych miejscach.\n\nDla każdej roli określa się wymagane umiejętności i kompetencje (skills and competencies), przypisane do kategorii umiejętności w domenach procesów. W cyklu życia planuje się bazę umiejętności, rozwija ją szkoleniami albo pozyskuje z zewnątrz, wykorzystuje w rolach, okresowo ocenia i wygasza umiejętności, które przestają być potrzebne. Cele obejmują m.in. wykształcenie i umiejętności techniczne (jakość wewnętrzna) oraz doświadczenie, wiedzę i dostępność ludzi (jakość kontekstowa).\n\nŻeby w każdej roli byli ludzie z wiedzą i umiejętnościami potrzebnymi do wykonania pracy, podejmowania decyzji i naprawiania błędów.","zycie":"Babcia zostaje sama po śmierci dziadka, który zawsze płacił rachunki. Wnuczka przez kilka niedziel uczy ją bankowości w telefonie, po miesiącu sprawdza, czy babcia radzi sobie sama, a rozliczenie podatku zleca znajomej księgowej, bo tego babcia uczyć się nie musi. Ustalić, jakie umiejętności są potrzebne, a potem je wyćwiczyć albo wziąć z zewnątrz – tego dotyczy ten aktywator.","firma":"Piekarnia kupuje piec sterowany z panelu dotykowego. Właściciel spisuje, co musi umieć piekarz na nocnej zmianie, jednego pracownika wysyła na szkolenie u producenta, a gdy drugi odchodzi, przyjmuje kogoś, kto takie piece już obsługiwał. Po pół roku sprawdza, kto sobie radzi, a ręczne pilnowanie temperatury przestaje być umiejętnością, której trzeba uczyć – to cały cykl życia aktywatora Ludzie, Umiejętności i Kompetencje.","urzad":"Szkoła przechodzi na e-dziennik. Dyrektor ustala, co musi umieć każdy nauczyciel i sekretarka, organizuje szkolenie, a konfigurację systemu zleca informatykowi z gminy, zamiast uczyć tego kogoś na miejscu. Na koniec semestru sprawdza, kto jeszcze potrzebuje pomocy – właściwi ludzie z właściwymi umiejętnościami we właściwych rolach to sedno tego aktywatora.","it":"W APO07 (Zarządzanie zasobami ludzkimi) dział IT ustala, że administrator kopii zapasowych musi umieć odtworzyć bazę danych, a na nocnej zmianie zawsze jest ktoś z tą umiejętnością. Brakujące kompetencje uzupełnia szkoleniem albo umową z firmą zewnętrzną.","egz":"Dobra praktyka: wymagania umiejętności dla każdej roli + mapowanie kategorii umiejętności na domeny procesów + zewnętrzne źródła (SFIA). Nie myl z: APO07 Zarządzanie zasobami ludzkimi – APO07 to proces. Ludzie, umiejętności i kompetencje to aktywator.","src":"COBIT 5 Framework (PL), s. 87; COBIT 5 Framework (PL), s. 87, Ilustracja 38"},"rezultat":{"t":"Rezultat / wynik","eg":"Rezultat / wynik","pd":"Wynik","en":"Output","wyj":"Konkretny produkt pracy, np. raport, działający program albo podpisana umowa.\n\nRezultat (output) to bezpośredni produkt pracy procesu albo projektu, np. wdrożony system, raport czy przeprowadzone szkolenie. W COBIT 5 wyjścia (outputs) praktyk jednego procesu bywają wejściami innych praktyk i procesów. Korzyść (benefit) pojawia się dopiero wtedy, gdy rezultat realnie coś poprawia u interesariuszy.\n\nŻeby odróżnić to, co praca bezpośrednio wytworzyła, od korzyści, którą ma przynieść, i nie uznawać samego dostarczenia za sukces.","zycie":"Kupujesz bieżnię i stawiasz ją w sypialni – bieżnia to rezultat. Jeśli po pół roku służy za wieszak na ubrania, rezultat jest, a korzyści, czyli lepszej kondycji, nie ma.","firma":"Warsztat zamawia stronę internetową z rezerwacją wizyt i od poniedziałku strona działa – to rezultat. Czy przyniesie korzyść, okaże się, gdy właściciel policzy, ile osób naprawdę się przez nią umówiło.","urzad":"Szkoła robi dla rodziców szkolenie z e-dziennika: 80 osób na sali, lista obecności podpisana. To rezultat. Korzyść będzie wtedy, gdy rodzice przestaną dzwonić do sekretariatu po oceny.","it":"Projekt w BAI03 (Zarządzanie identyfikacją i budowaniem rozwiązań) dostarcza nową aplikację – to rezultat (output). Czy powstała korzyść, sprawdza się później, np. w EDM02 (Zapewnienie realizacji korzyści), porównując efekty z uzasadnieniem biznesowym.","egz":"Pytania o „sukces projektu”: dostarczenie zgodnie z umową (rezultat) NIE oznacza jeszcze wartości dla interesariuszy (korzyść). Nie myl z: Realizacja korzyści – Korzyść = zmiana na lepsze dzięki rezultatowi.; Rezultat procesu w ISO/IEC 15504 (outcome) – Tu „rezultat” to output – konkretny produkt pracy (raport, działający system). W ocenie zdolności (ISO/IEC 15504) „rezultat” to outcome – obserwowalny skutek osiągnięcia przeznaczenia procesu. To dwa różne angielskie słowa przetłumaczone tak samo.","src":"COBIT 5 Framework (PL), s. 92"},"kultura-etyka-zachowanie":{"t":"Kultura, Etyka i Zachowanie","eg":"Kultura, Etyka i Zachowanie","pd":"Kultura, etyka i zachowanie","en":"Culture, Ethics and Behaviour (enabler 4)","wyj":"Jak ludzie naprawdę się zachowują, gdy nikt nie patrzy, i co uważają za uczciwe.\n\nAktywator obejmuje trzy poziomy: etykę organizacyjną (organisational ethics: wartości, według których organizacja chce działać), etykę indywidualną (individual ethics: osobiste wartości pracownika) i zachowania indywidualne (individual behaviour), które razem tworzą kulturę. Pożądane zachowania wspiera się dobrymi praktykami: komunikowaniem wartości, przykładem kierownictwa i osobami wspierającymi (champions), zachętami i środkami zniechęcającymi oraz regułami i normami. Ważnym mechanizmem komunikowania wartości są zasady i polityki.\n\nŻeby zasady, procesy i decyzje naprawdę były stosowane, bo bez odpowiednich zachowań ludzi najlepsze procedury zostają na papierze.","zycie":"Rodzice zakazują telefonów przy stole, ale sami co chwilę zerkają w ekran. Po tygodniu dzieci robią to samo, bo bardziej patrzą na przykład niż na zakaz. Kultura i zachowanie biorą się z tego, co ludzie widzą u innych, zwłaszcza u tych „na górze”.","firma":"Właściciel firmy robiącej strony internetowe płaci premie tylko za oddanie projektu w terminie. Programiści szybko uczą się pomijać testy, bo za błędy nikt nie rozlicza, a za spóźnienie tak. Zachęty ukształtowały zachowanie – to właśnie aktywator Kultura, Etyka i Zachowanie (podobny przypadek opisuje Przykład 11 w podręczniku).","urzad":"W urzędzie gminy kierownik za każdy błąd robi publiczną awanturę. Urzędniczka, która przez pomyłkę wysłała dane mieszkańca pod zły adres, nikomu o tym nie mówi, więc nikt nie reaguje na czas. Procedura zgłaszania incydentów istnieje, ale kultura obwiniania sprawia, że jest martwa.","it":"W DSS03 (Zarządzanie problemami) zespół analizuje awarie bez szukania winnych, więc informatycy zgłaszają także własne pomyłki. Zachowanie „uczymy się zamiast obwiniać” należy do aktywatora Kultura, Etyka i Zachowanie i decyduje, czy proces dostaje prawdziwe dane.","egz":"„Wartości, w oparciu o które organizacja chce działać” → etyka organizacyjna. Dobra praktyka promowania zachowań → np. wskazywanie czempionów (osób wspierających), komunikacja, zachęty, reguły i normy. Mechanizm komunikowania wartości i pożądanego zachowania → zasady i polityki. Nie myl z: Etyka organizacyjna vs indywidualna – Organizacyjna to wartości, w oparciu o które ORGANIZACJA chce działać. Indywidualna to osobiste wartości pracownika (religia, pochodzenie, doświadczenia).","src":"COBIT 5 Framework (PL), s. 79; COBIT 5 Framework (PL), s. 79, Ilustracja 34; COBIT 5 Framework (PL), s. 80"},"proces":{"t":"Proces","eg":"Proces","pd":"Proces","en":"Process","wyj":"Coś, co robimy regularnie i zawsze w podobny sposób, np. przyjmowanie każdego zgłoszenia.\n\nProces (process) przyjmuje wejścia (inputs), przetwarza je przez praktyki i działania ukierunkowane przez polityki i procedury i daje wyniki (outputs), np. produkt albo usługę. Ma właściciela, role i mierniki, a wynik jednego procesu bywa wejściem innego. W COBIT 5 procesy są jednym z siedmiu aktywatorów, a Referencyjny Model Procesu opisuje ich 37.\n\nŻeby powtarzalną pracę wykonywać za każdym razem tak samo dobrze, niezależnie od tego, kto ją akurat robi, i żeby dało się ją mierzyć i poprawiać.","zycie":"Co sobotę rano sprawdzasz lodówkę, piszesz listę, jedziesz do sklepu, rozpakowujesz i odhaczasz, czego zabrakło. Za tydzień wszystko powtarza się od nowa. To proces: stałe kroki, wejście (pusta lodówka i lista) i wynik (pełna lodówka).","firma":"W sklepie internetowym z herbatą przychodzi zamówienie, pracownik pakuje paczkę, drukuje etykietę i fakturę, a kurier odbiera paczki o 15:00. Tak samo dzieje się z każdym zamówieniem, codziennie. To proces – powtarzalny, z wejściem (zamówienie) i wynikiem (paczka u klienta).","urzad":"Do urzędu gminy wpływa wniosek o wycinkę drzewa. Kancelaria go rejestruje, kierownik przydziela go referentowi, ten jedzie na oględziny i wydaje decyzję. Każdy kolejny wniosek idzie tą samą ścieżką – to jest proces.","it":"DSS02 (Zarządzanie zgłoszeniami serwisowymi i incydentami) to proces: każde zgłoszenie (wejście) jest rejestrowane, klasyfikowane, rozwiązywane i zamykane (praktyki), a wynikiem jest przywrócona usługa i wpis w rejestrze. Działa codziennie i tak samo dla każdego zgłoszenia.","egz":"Opis „zbiór praktyk ukierunkowanych politykami i procedurami, który przetwarza wejścia w wyniki” to Proces (Załącznik H). Nie myl z: Projekt – Projekt jest jednorazowy, ma początek i koniec (np. wdrożenie systemu). Proces trwa i się powtarza (np. obsługa zgłoszeń w tym systemie).","src":"COBIT 5 Framework (PL), s. 93"},"kaskada-celow":{"t":"Kaskada Celów","eg":"Kaskada Celów","pd":"Kaskada celów","en":"Goals Cascade","wyj":"Schodzenie od ogólnego „czego chcemy” do konkretnych zadań, jak rozpisanie wesela na listę rzeczy do załatwienia.\n\nWyznaczniki (stakeholder drivers) wpływają na potrzeby interesariuszy (stakeholder needs). Potrzeby przekłada się na cele organizacji (enterprise goals, 17 w wymiarach BSC), te na cele związane z informatyką (IT-related goals, 17 w wymiarach IT BSC), a te na cele aktywatorów (enabler goals), np. cele procesów. Każda organizacja dostosowuje kaskadę do siebie, bo nie jest ona uniwersalną prawdą.\n\nŻeby ogólne potrzeby interesariuszy przełożyć na konkretne, mierzalne cele na każdym poziomie, aż po cele procesów i innych aktywatorów, i wiedzieć, które z nich są priorytetem.","zycie":"Rodzice chcą, żeby za dwa lata stać ich było na mieszkanie. Ustalają cel domu: odkładać 1500 zł miesięcznie, a z niego cel dla domowej „informatyki”: aplikacja bankowa ma sama przelewać pieniądze na oszczędności w dniu wypłaty. Na końcu są zadania dla konkretnych „narzędzi”: zlecenie stałe, wspólny arkusz wydatków i zasada, że co miesiąc siadają razem nad liczbami – każdy krok wynika z poprzedniego, to jest kaskada celów.","firma":"Właściciel sklepu internetowego z zabawkami chce stabilnego zysku. Przekłada to na cel firmy „wracający klienci”, z niego wychodzi cel IT „sklep działa bez przerw w sezonie świątecznym”, a z tego cele aktywatorów: procedura reagowania na awarie, przeszkolony pracownik i umowa z firmą hostingową na szybką pomoc. Od ogólnej potrzeby do konkretnych zadań, krok po kroku – to kaskada celów.","urzad":"Mieszkańcy skarżą się, że na każdą sprawę w urzędzie muszą brać wolne. Gmina zapisuje cel: najważniejsze sprawy da się załatwić bez wizyty, informatyk przekłada go na cel IT: bezpieczne i stale dostępne e-usługi, a z tego wynikają cele aktywatorów: proces obsługi e-wniosków, polityka bezpieczeństwa i przeszkoleni urzędnicy. To kaskada celów: od skargi mieszkańca do konkretnego zadania w urzędzie.","it":"Potrzeba „działamy zgodnie z prawem” prowadzi do celu organizacji „zgodność z zewnętrznymi przepisami i regulacjami”, ten do celu związanego z informatyką „zgodność IT z zewnętrznymi przepisami i wsparcie zgodności biznesu”, a ten do celów procesu MEA03 (Monitorowanie, ocena i oszacowanie zgodności z wymogami zewnętrznymi).","egz":"„Do czego służy Kaskada Celów?”: do wspierania dopasowania potrzeb organizacji do rozwiązań i usług IT i do przełożenia potrzeb na konkretne cele (s. 17). RACI, architektura korporacyjna oraz wejścia i wyjścia procesu to inne kategorie. Nie myl z: Hierarchia służbowa – Kaskada dotyczy CELÓW, nie ludzi – nie mylić ze strukturą organizacyjną.; Zrównoważona karta wyników (BSC) – BSC to narzędzie, którego wymiary (finanse, klient, obszar wewnętrzny, szkolenie i rozwój) porządkują cele organizacji w kaskadzie. Nie jest samą kaskadą.","src":"COBIT 5 Framework (PL), s. 17; COBIT 5 Framework (PL), s. 18, Ilustracja 4; COBIT 5 Framework (PL), s. 20"},"zasada-4":{"t":"Zasada 4: Aktywacja holistycznego podejścia","eg":"Zasada 4: Aktywacja holistycznego podejścia","pd":"Zasada 4: Wdrożenie podejścia całościowego","en":"Principle 4: Enabling a Holistic Approach","wyj":"Patrz na całość: sukces zależy od wielu rzeczy naraz, nie tylko od sprzętu.\n\nCOBIT 5 wyróżnia 7 kategorii aktywatorów (enablers), m.in. procesy, struktury organizacyjne, informację oraz ludzi, umiejętności i kompetencje. Aktywatory indywidualnie i kolektywnie decydują o tym, czy Ład i Zarządzanie działają: każdy potrzebuje wejść od innych i dostarcza im wyników. Wszystkie mają cztery wspólne wymiary (interesariusze, cele, cykl życia, dobre praktyki), a ich wydajność mierzą wskaźniki wiodące i opóźnione.\n\nŻeby Ład i Zarządzanie IT budować na wszystkich współpracujących aktywatorach, a nie tylko na technologii czy na pojedynczym procesie.","zycie":"Kupujesz dziecku biurko i lampkę, żeby lepiej się uczyło. Nic się nie zmienia, dopóki nie ustalicie planu dnia, zasady „najpierw lekcje, potem gry”, a Ty sam nie odłożysz telefonu przy kolacji. Dopiero wszystkie te elementy razem dają efekt – to Zasada 4.","firma":"Sklep spożywczy stawia kasę samoobsługową, ale kolejki się nie skracają. Nikt nie pilnuje kasy, kasjerki nie umieją pomóc klientom, a klienci nie wiedzą, że wolno z niej korzystać. Sam sprzęt nie wystarczy, potrzebne są też ludzie, procedury i nawyki – to Zasada 4.","urzad":"Starostwo wdraża elektroniczne zarządzanie dokumentacją. System działa, ale urzędnicy dalej drukują pisma, bo nie ma instrukcji kancelaryjnej ani szkoleń, a kierownik sam woli papier. Bez procesów, ludzi, struktur i kultury system zostaje pustą skorupą – to Zasada 4.","it":"APO13 (Zarządzanie bezpieczeństwem) działa dopiero razem z polityką bezpieczeństwa, strukturą odpowiedzialną za bezpieczeństwo, kulturą zgłaszania incydentów, przeszkolonymi ludźmi, informacją i narzędziami. Przykład 4 z FW-PL: procesy i procedury bezpieczeństwa informacji nie będą skuteczne, jeśli kultura i etyka są nieodpowiednie.","egz":"Liczba 7 aktywatorów i 4 wymiary aktywatora to tematy Zasady 4. Pytania o „jakość kontekstową”, „wskaźniki wiodące” i „cykl życia aktywatora” też należą do Zasady 4. Egzamin (uzasadnienia SP1): „Aktywacja holistycznego podejścia” – „aktywacja”, bo egzamin tłumaczy enabler jako „aktywator”. Podręcznik: „Wdrożenie podejścia całościowego”. Rozpoznawaj po słowach: holistyczne / całościowe / aktywatory. Nie myl z: Zasada 2: Pokrycie całej organizacji – Zasada 2: CAŁA organizacja (zakres). Zasada 4: WSZYSTKIE rodzaje aktywatorów (całościowe podejście).","src":"COBIT 5 Framework (PL), s. 27; COBIT 5 Framework (PL), s. 27, Ilustracja 12; COBIT 5 Framework (PL), s. 28"},"aktywator":{"t":"Aktywator","eg":"Aktywator","pd":"Czynnik umożliwiający","en":"Enabler","wyj":"Wszystko, co musi zagrać, żeby informatyka działała dobrze: ludzie, reguły, narzędzia, informacje.\n\nCOBIT 5 dzieli aktywatory (enablers) na 7 kategorii, od Zasad, polityk i struktur ramowych (Principles, Policies and Frameworks) po Ludzi, umiejętności i kompetencje (People, Skills and Competencies). Kaskada celów wyznacza, czego oczekujemy od każdego aktywatora (cele aktywatora). Aktywatory są od siebie zależne i dostarczają sobie wejść, np. proces potrzebuje informacji i przeszkolonych ludzi. Każdy opisuje się w 4 wymiarach: interesariusze, cele, cykl życia, dobre praktyki.\n\nŻeby organizacja widziała wszystko, co musi zagrać, by osiągnąć cele, a nie tylko technologię. Aktywatory to elementy, przez które Ład i Zarządzanie realnie wpływają na wynik.","zycie":"Chcesz, żeby dzieci same odrabiały lekcje. Ustalacie zasadę „najpierw zadania, potem tablet”, stałą godzinę po obiedzie, kupujecie biurko z lampką, a Ty w tym czasie też siadasz z książką zamiast z telefonem. Zasada, stała pora, biurko i Twój przykład to różne aktywatory – działają dopiero razem.","firma":"Właścicielka kawiarni chce, żeby kawa smakowała tak samo na każdej zmianie. Spisuje recepturę, ustala kolejność parzenia, szkoli nowego baristę i oddaje ekspres do serwisu. Receptura, sposób parzenia, umiejętności baristy i ekspres to aktywatory – brak jednego psuje całość.","urzad":"Urząd gminy chce wydawać decyzje w terminie. Ma instrukcję kancelaryjną, ustalony obieg wniosku, wydział, który za sprawę odpowiada, system EZD i urzędników po szkoleniu z KPA. Każdy z tych elementów to aktywator innej kategorii.","it":"Proces DSS04 Zarządzanie ciągłością to aktywator z kategorii Procesy, ale działa tylko razem z innymi: polityką ciągłości (Zasady, polityki i struktury ramowe), aktualnym planem awaryjnym (Informacja), stanowiskiem zapasowym (Usługi, infrastruktura i aplikacje) i przećwiczonym zespołem (Ludzie, umiejętności i kompetencje).","egz":"Pułapka terminologiczna nr 1 obok Ład/Nadzór. Liczba kategorii: 7. Liczba zasad: 5. Liczba procesów: 37. Egzamin: „Aktywator”. Podręcznik: „Czynnik umożliwiający”. EN: Enabler. W pytaniach egzaminacyjnych prawie zawsze pada „Aktywator”. Nie myl z: Czynnik wpływający na potrzeby interesariuszy – Wyznacznik zmienia potrzeby; aktywator pomaga je zaspokoić.; Komponent (COBIT 2019) – W COBIT 2019 aktywatory nazwano „komponentami systemu ładu”. Na egzaminie COBIT 5 używaj „aktywator”.","src":"COBIT 5 Framework (PL), s. 14; COBIT 5 Framework (PL), s. 91; materiały Altkom"},"projekt":{"t":"Projekt","eg":"Projekt","pd":"Projekt","en":"Project","wyj":"Jednorazowe przedsięwzięcie z początkiem i końcem, np. przeprowadzka biura do nowej siedziby.\n\nProjekt (project) ma początek, koniec, cel, budżet i zespół. Tworzy rezultat (output), np. nowy system, który po zakończeniu przechodzi do procesów, czyli do codziennej pracy. Kilka powiązanych projektów tworzy program (programme), a w COBIT 5 programami i projektami zarządza proces BAI01 (Zarządzanie programami i projektami).\n\nŻeby jednorazową zmianę, np. wdrożenie nowego systemu, przeprowadzić w ustalonym czasie, budżecie i zakresie, a jej efekt przekazać do codziennej pracy.","zycie":"Remontujecie łazienkę: budżet 20 tys. zł, ekipa wchodzi w marcu, w kwietniu odbieracie robotę i remont się kończy. Codzienne sprzątanie tej łazienki to już nie projekt, tylko proces. Projekt ma koniec, proces się powtarza.","firma":"Piekarnia otwiera drugi punkt sprzedaży: trzeba wynająć lokal, kupić ladę, zatrudnić dwie osoby i ruszyć przed świętami. W dniu otwarcia projekt się kończy. Codzienna sprzedaż w nowym punkcie to już zwykła praca.","urzad":"Starostwo buduje portal do zapisów na rejestrację pojazdów: jest harmonogram, budżet z dotacji i termin odbioru. Po uruchomieniu portalu projekt zostaje zamknięty. Codzienna obsługa zapisów przechodzi do wydziału komunikacji.","it":"Wdrożenie nowego systemu kadrowego to projekt prowadzony w procesie BAI01 (Zarządzanie programami i projektami). Po odbiorze system przechodzi do codziennej eksploatacji w DSS01 (Zarządzanie eksploatacją), a projekt zostaje zamknięty.","egz":"Na egzaminie częściej spotkasz „program” (Zarządzanie programem) niż „projekt”. Powielające się projekty to przykład punktu zapalnego (s. 37). Nie myl z: Proces – Proces się powtarza i trwa; projekt się kończy.","src":"materiały kursu"},"informacja":{"t":"Informacja","eg":"Informacja","pd":"Informacje","en":"Information (enabler 5)","wyj":"Wszystko, co wiemy i zapisujemy, od numeru telefonu po raport, i co komuś do czegoś służy.\n\nInformacja (Information) to piąty z 7 aktywatorów i obejmuje wszystkie informacje w organizacji, nie tylko te w systemach. Ma interesariuszy w rolach wytwórcy (producer), opiekuna (custodian) i konsumenta (consumer), własny cykl życia i kryteria jakości: wewnętrznej, kontekstowej oraz bezpieczeństwa i dostępności. Opisuje się ją też w 6 warstwach atrybutów, od fizycznej po społeczną.\n\nŻeby organizacja traktowała informację jak zasób, o który trzeba dbać: wytwarzać ją, przechowywać, chronić i udostępniać tym, którzy jej potrzebują.","zycie":"Mama dzwoni, że w czwartek nie odbierze dzieci ze szkoły, na lodówce wisi plan lekcji, a szkoła przysyła SMS o skróconych zajęciach. Żadna z tych wiadomości nie siedzi w komputerze, a mimo to wszystkie są informacją, od której zależy, kto i o której jedzie po dzieci. Jeśli nikt jej nie przeczyta i nie zareaguje, nic z niej nie wynika – to cecha aktywatora Informacja.","firma":"Piekarz zapisuje w zeszycie, ile chleba zostało wieczorem, kasa drukuje raport sprzedaży, a sprzedawczyni mówi, o co pytali klienci. Z tego wszystkiego właścicielka planuje jutrzejszy wypiek. Piekarz informację tworzy, zeszyt i kasa ją przechowują, a właścicielka z niej korzysta – to role wokół aktywatora Informacja.","urzad":"W szkole sekretarka prowadzi rejestr uczniów, wychowawca wpisuje oceny do dziennika, a dyrektor na radzie pedagogicznej słyszy ustnie o kłopotach w klasie 3b. Wszystko to jest informacja, także to, czego nie ma w żadnym systemie. Coś z niej wynika dopiero wtedy, gdy dyrektor na tej podstawie organizuje pomoc dla klasy.","it":"Dane kontaktowe klientów w systemie CRM to aktywator Informacja: klient podaje je przy zakładaniu konta (wytwórca), administrator utrzymuje bazę (opiekun), a konsultant korzysta z niej przy obsłudze (konsument). Nieaktualny numer to błąd jakości informacji, przez który powiadomienie nie dotarło.","egz":"Informacja jest jedną ze zdolności do świadczenia usług, a zdolności te wykorzystuje się poprzez procesy, by świadczyć usługi (s. 86). Procesy wymagają informacji jako wejścia i wytwarzają ją jako wyjście (s. 71). Nie myl z: Dane – Dane to surowe fakty. Informacja to dane przetworzone i mające znaczenie.","src":"COBIT 5 Framework (PL), s. 81; COBIT 5 Framework (PL), s. 86"},"cele-aktywatorow":{"t":"Cele aktywatora","eg":"Cele aktywatora","pd":"Cele czynników umożliwiających","en":"Enabler goals","wyj":"Konkretne, sprawdzalne cele dla każdej „części układanki”, np. dla danych: mają być aktualne.\n\nTo czwarty krok kaskady celów (goals cascade): potrzeby interesariuszy → cele organizacji → cele związane z IT → cele aktywatora. Dla każdego aktywatora określa się cele, które wspierają cele związane z IT; najczęściej są to cele procesów, a mapowanie celów IT na procesy podaje Załącznik C. Cele są też jednym z czterech wymiarów aktywatora i dzielą się na kategorie: jakość wewnętrzna, jakość kontekstowa oraz dostęp i bezpieczeństwo.\n\nŻeby cel związany z IT przełożyć na konkretne, sprawdzalne oczekiwania wobec każdego aktywatora: procesu, polityki, struktury, informacji czy ludzi.","zycie":"Chcesz, żeby zdjęcia rodzinne nie zginęły, gdy padnie laptop. Ustalasz konkretnie: kopia na dysk zewnętrzny pierwszego dnia miesiąca (cel dla procesu) i każdy domownik umie odzyskać zdjęcie z kopii (cel dla ludzi). Takie małe, sprawdzalne cele dla poszczególnych „narzędzi” to cele aktywatorów.","firma":"Sklep internetowy ma cel IT: system zamówień ma działać. Właściciel rozpisuje go na kawałki: awaria usunięta w 2 godziny (cel dla procesu), dwie osoby umieją zrestartować serwer (cel dla ludzi), instrukcja awaryjna jest aktualna i wisi przy komputerze (cel dla informacji). Każdy z tych celów dotyczy innego aktywatora.","urzad":"Gmina chce chronić dane mieszkańców. Sekretarz ustala: polityka haseł obowiązuje każdego pracownika, nowe konto zakłada się tylko na pisemny wniosek kierownika, a wszyscy urzędnicy raz w roku przechodzą szkolenie. Polityka, proces nadawania uprawnień i ludzie dostają własne cele – to cele aktywatorów.","it":"Cel związany z IT 10 (bezpieczeństwo informacji) zamienia się w cele aktywatorów: dla procesu DSS05 Zarządzanie usługami bezpieczeństwa „konto odchodzącego pracownika zablokowane tego samego dnia”, a dla aktywatora Ludzie, umiejętności i kompetencje „każdy pracownik raz w roku przechodzi szkolenie z phishingu”.","egz":"Ostatni poziom kaskady: Cele związane z informatyką → Cele aktywatora. Egzamin: „Cele aktywatora”. Podręcznik: „Cele czynników umożliwiających”. Nie myl z: Cele związane z informatyką – Cele aktywatorów są jeszcze bardziej szczegółowe – dotyczą konkretnego procesu, struktury itd.","src":"COBIT 5 Framework (PL), s. 18; COBIT 5 Framework (PL), s. 21"},"cele-zwiazane-z-it":{"t":"Cele związane z informatyką","eg":"Cele związane z informatyką","pd":"Cele związane z IT","en":"IT-related goals","wyj":"Siedemnaście typowych celów dla informatyki, np. systemy działają, dane są bezpieczne, projekty kończą się na czas.\n\nTo trzeci krok kaskady celów: cele organizacji przekłada się na cele związane z IT (IT-related goals), czyli rezultaty związane z IT. COBIT 5 podaje ich 17 w wymiarach IT BSC; mapowanie na cele organizacji jest w Załączniku B, a na procesy w Załączniku C. „Związane z IT” oznacza informację i powiązaną technologię w całej organizacji, a nie tylko dział IT.\n\nŻeby wiedzieć, co informacja i technologia muszą zapewnić, aby udały się cele organizacji. Dzięki temu IT nie wyznacza sobie celów w oderwaniu od reszty organizacji.","zycie":"Rodzina chce bezpiecznie odkładać pieniądze. Żeby się udało, w domu musi działać bankowość w telefonie, hasła muszą być w menedżerze haseł, a skany umów mieć kopię zapasową. Te wymagania wobec domowej technologii to cele związane z IT.","firma":"Sklep internetowy chce zadowolonych klientów. Z tego wynika, że strona ma działać także w Black Friday, płatności mają przechodzić bez błędów, a adresy klientów nie mogą wyciec (cele IT 07 i 10). To cele związane z IT – to, co technologia musi dać, żeby udał się cel sklepu.","urzad":"Gmina chce, żeby mieszkańcy załatwiali sprawy przez internet. Do tego e-usługi muszą działać, dane osobowe muszą być chronione, a rejestry aktualne. To nie są cele informatyka dla niego samego, tylko cele związane z IT, które wynikają z celu gminy.","it":"Cel związany z IT 10 „Bezpieczeństwo informacji, infrastruktury przetwarzania i aplikacji” (wymiar Obszar wewnętrzny) to rezultat, który w banku muszą zapewnić m.in. procesy APO13 Zarządzanie bezpieczeństwem i DSS05 Zarządzanie usługami bezpieczeństwa.","egz":"Opis „rezultaty związane z IT, wymagane do osiągnięcia celów organizacji” to Cele związane z informatyką (s. 18). Egzamin: „Cele związane z informatyką”. Podręcznik: „Cele związane z IT”. Nie myl z: Cele organizacji – Krok wcześniej: cele organizacji dotyczą całej działalności.; Cele aktywatora – Krok później: cele konkretnych aktywatorów (np. procesów), które pozwalają osiągnąć cele związane z informatyką.","src":"COBIT 5 Framework (PL), s. 18; COBIT 5 Framework (PL), s. 19, Ilustracja 6; materiały Altkom"},"uslugi-infrastruktura-aplikacje":{"t":"Usługi, Infrastruktura i Aplikacje","eg":"Usługi, Infrastruktura i Aplikacje","pd":"Usługi, infrastruktura i aplikacje","en":"Services, Infrastructure and Applications (enabler 6)","wyj":"Sprzęt, sieć, programy i usługi, na których stoi cała informatyka.\n\nBaseline architecture to architektura bazowa opisująca stan obecny. Docelowa opisuje przyszły stan, a przejściowa etapy pośrednie. Reference architecture jest wzorcem referencyjnym i nie jest synonimem architektury bazowej.\n\nŻeby nazwać i świadomie prowadzić techniczną podstawę IT: sprzęt, sieć, programy i usługi, z których korzystają procesy organizacji.","zycie":"W domu masz router, laptopa i aplikację, która sama wrzuca zdjęcia z telefonu do chmury. Router i laptop to infrastruktura, aplikacja do zdjęć to aplikacja, a „zdjęcia same się zapisują i każdy w rodzinie je widzi” to usługa. Gdy planujecie wymianę routera, macie stan obecny i docelowy – to już myślenie architekturą.","firma":"Sklep internetowy z rękodziełem stoi na wynajętym serwerze, działa na gotowej platformie sklepowej i korzysta z bramki płatności. Właścicielka umawia się z firmą hostingową, że sklep ma działać 99,9% czasu. Serwer to infrastruktura, platforma to aplikacja, a działający sklep z umówioną dostępnością to usługa z poziomem usług.","urzad":"Szkoła podstawowa ma pracownię komputerową, szkolne Wi-Fi i dziennik elektroniczny. Dyrektor ustala z firmą serwisową, że awarię dziennika usuwa się w ciągu jednego dnia roboczego. Komputery i sieć to infrastruktura, dziennik to aplikacja, a działający dziennik z gwarantowanym czasem naprawy to usługa z poziomem usług.","it":"APO03 (Zarządzanie architekturą korporacyjną) opisuje obecną i docelową architekturę serwerów, sieci i aplikacji, a APO09 (Zarządzanie umowami o świadczenie usług) ustala poziomy usług, np. dostępność systemu 99,9%. DSS01 (Zarządzanie eksploatacją) utrzymuje tę infrastrukturę w codziennym działaniu.","egz":"Informacja jest jedną ze zdolności do świadczenia usług (zdolności usługowych), a zdolności te wykorzystuje się poprzez procesy, by świadczyć usługi wewnętrzne i zewnętrzne (s. 86). Egzamin: „Zdolność usługowa”. Podręcznik: „Zdolność do świadczenia usług” (service capabilities). Nie myl z: zdolnosc-procesu – Zdolność usługowa opisuje zasoby do świadczenia usług, a zdolność procesu określa model PAM.","src":"COBIT 5 Framework (EN), sekcja załącznik G, aktywator 6: Good Practices"}},"S":[{"lekcje":["pr-k33-zasada-4-aktywator"],"pt":"Lekcja 1.33","h":"Aktywator pomaga osiągnąć cele – ale nie działa w pojedynkę","b":"<p><w k=\"aktywator\">Aktywator</w> <span class=\"en\">Enabler</span>: ludzie, zasady, procesy, <w k=\"informacja\">informacje</w>, technologia.</p><p><w k=\"zasada-4\">Zasada 4: Aktywacja holistycznego podejścia</w> <span class=\"en\">Enabling a Holistic Approach</span> – aktywatory działają <b>indywidualnie i kolektywnie</b>, a ich cele wynikają z <w k=\"kaskada-celow\">Kaskady Celów</w>.</p>","c":"Jeden aktywator nie wystarczy – liczy się każdy osobno i wszystkie razem.","s":"COBIT 5 Framework (PL), s. 14, 27–28, Przykład 3","ctx":"<p>Pojęcie jest celowo szerokie: obejmuje „wszystko, co może ułatwić osiągnięcie celów przedsiębiorstwa” – także kulturę, procedury i zespoły decyzyjne, nie tylko narzędzia IT. <w k=\"cele-zwiazane-z-it\">Cele związane z Informatyką</w> określają, co mają osiągnąć poszczególne aktywatory; stąd <w k=\"cele-aktywatorow\">Cele aktywatora</w>.</p><p>Przykład 3: usługi IT dla użytkowników wymagają naraz infrastruktury i aplikacji, ludzi z umiejętnościami (także behawioralnymi), procesów realizacji usług i struktur organizacyjnych. Helpdesk z najlepszym programem nie pomoże bez przeszkolonych ludzi i jasnego procesu.</p><p>Pułapka nazw: podręcznik pisze „czynnik umożliwiający” i „Wdrożenie podejścia całościowego”; na egzaminie – aktywator i Aktywacja holistycznego podejścia. Gdy pytanie opisuje jeden wdrożony element, który nic nie zmienił, szukaj odpowiedzi o brakujących pozostałych aktywatorach.</p>"},{"pt":"Sprawdź się","quiz":{"id":"q-fn-m-27","sylabus":["PR-01-02","EN-02-16"],"tresc":"Który przykład NAJLEPIEJ pokazuje systemowy charakter aktywatorów (zasada 4)?","opcje":[{"t":"Procedury bezpieczeństwa nie działają, bo kultura ich nie wspiera","ok":true,"w":"Siedem aktywatorów to zasady/polityki/ramy; procesy; struktury; kultura/etyka/zachowanie; informacja; usługi/infrastruktura/aplikacje; ludzie/umiejętności/kompetencje. Wspólnie umożliwiają osiąganie celów. Wskazana odpowiedź odpowiada właśnie temu elementowi modelu."},{"t":"Polityka bezpieczeństwa jest formalnie zatwierdzona przez zarząd banku","ok":false,"w":"Zdanie prawdziwe, ale nie pokazuje zależności między aktywatorami."},{"t":"Procesy dzielą się na procesy Ładu i Zarządzania","ok":false,"w":"Podział na procesy Ładu i Zarządzania ilustruje zasadę 5. Pytanie dotyczy natomiast współzależności różnych aktywatorów w zasadzie 4."},{"t":"Każdy aktywator ma własny cykl życia od planowania do wycofania","ok":false,"w":"Zdanie prawdziwe, ale dotyczy wymiarów, a nie zależności."}],"src":"COBIT 5 Framework (EN), sekcja rozdział 5, rysunki 12–13","pomoc":{"t":"Pytanie dotyczy lekcji 1.33 „Zasada 4 – aktywator i podejście holistyczne”. Cel lekcji: Potrafię wyjaśnić, czym jest aktywator i dlaczego według zasady 4 jeden aktywator nie wystarczy.","k":["aktywator"]},"kurs":"Siedem aktywatorów to zasady/polityki/ramy; procesy; struktury; kultura/etyka/zachowanie; informacja; usługi/infrastruktura/aplikacje; ludzie/umiejętności/kompetencje. Wspólnie umożliwiają osiąganie celów. Wskazana odpowiedź odpowiada właśnie temu elementowi modelu.","kontekst":""}},{"lekcje":["pr-k34-siedem-aktywatorow"],"pt":"Lekcja 1.34","h":"Siedem kategorii aktywatorów – procesy to tylko jedna z nich","b":"<p>Ilustracja 12 (egzamin: Rysunek 12):</p><ol><li><w k=\"zasady-polityki-struktury\">Zasady, Polityki i Struktury ramowe</w></li><li>Procesy</li><li><w k=\"struktury-organizacyjne\">Struktury organizacyjne</w></li><li><w k=\"kultura-etyka-zachowanie\">Kultura, Etyka i Zachowanie</w></li><li><w k=\"informacja\">Informacja</w></li><li><w k=\"uslugi-infrastruktura-aplikacje\">Usługi, Infrastruktura i Aplikacje</w></li><li><w k=\"ludzie-umiejetnosci-kompetencje\">Ludzie, Umiejętności i Kompetencje</w></li></ol>","c":"Siedem kategorii w stałej kolejności z Ilustracji 12 – pytania odwołują się do numerów.","s":"COBIT 5 Framework (PL), s. 27, Ilustracja 12","ctx":"<p>Sens kategorii: zasady i polityki przekładają pożądane zachowanie na praktyczne wytyczne; procesy to uporządkowane praktyki prowadzące do celów; struktury organizacyjne to kluczowe jednostki decyzyjne; kultura, etyka i zachowanie to często niedoceniany czynnik sukcesu; informacja to wszystkie informacje organizacji; usługi, infrastruktura i aplikacje dają przetwarzanie i usługi IT; ludzie, umiejętności i kompetencje są potrzebni do działań i decyzji.</p><p>Przypisuj według tego, czym element jest z natury. Helpdesk: regulamin → 1, proces obsługi zgłoszeń → 2, kierownik i komitet zmian → 3 (decydują), życzliwość wobec klienta → 4, baza wiedzy → 5 (choć leży w systemie), system zgłoszeń → 6, przeszkoleni konsultanci → 7.</p><p>Pułapki: „Zasady” w nazwie aktywatora 1 to zasady działania organizacji, a nie pięć zasad COBIT 5 (zasad jest 5, kategorii 7). Podręcznik pisze „Zasady, polityki i metodyki” oraz „Informacje”.</p>"},{"pt":"Sprawdź się","quiz":{"id":"q-fn-m-27","sylabus":["PR-01-02","EN-02-16"],"tresc":"Który przykład NAJLEPIEJ pokazuje systemowy charakter aktywatorów (zasada 4)?","opcje":[{"t":"Polityka bezpieczeństwa jest formalnie zatwierdzona przez zarząd banku","ok":false,"w":"Zdanie prawdziwe, ale nie pokazuje zależności między aktywatorami."},{"t":"Procedury bezpieczeństwa nie działają, bo kultura ich nie wspiera","ok":true,"w":"Siedem aktywatorów to zasady/polityki/ramy; procesy; struktury; kultura/etyka/zachowanie; informacja; usługi/infrastruktura/aplikacje; ludzie/umiejętności/kompetencje. Wspólnie umożliwiają osiąganie celów. Wskazana odpowiedź odpowiada właśnie temu elementowi modelu."},{"t":"Procesy dzielą się na procesy Ładu i Zarządzania","ok":false,"w":"Podział na procesy Ładu i Zarządzania ilustruje zasadę 5. Pytanie dotyczy natomiast współzależności różnych aktywatorów w zasadzie 4."},{"t":"Każdy aktywator ma własny cykl życia od planowania do wycofania","ok":false,"w":"Zdanie prawdziwe, ale dotyczy wymiarów, a nie zależności."}],"src":"COBIT 5 Framework (EN), sekcja rozdział 5, rysunki 12–13","pomoc":{"t":"Pytanie dotyczy lekcji 1.34 „Siedem kategorii aktywatorów”. Cel lekcji: Potrafię wymienić siedem kategorii aktywatorów w kolejności z Ilustracji 12 i przypisać przykład do kategorii.","k":[]},"kurs":"Siedem aktywatorów to zasady/polityki/ramy; procesy; struktury; kultura/etyka/zachowanie; informacja; usługi/infrastruktura/aplikacje; ludzie/umiejętności/kompetencje. Wspólnie umożliwiają osiąganie celów. Wskazana odpowiedź odpowiada właśnie temu elementowi modelu.","kontekst":""}},{"pt":"Arkusz próbny","sp1":"sp1-15","lekcja":"1.34","temat":"Siedem kategorii aktywatorów","k":[]},{"lekcje":["pr-k35-aktywatory-zasoby"],"pt":"Lekcja 1.35","h":"Aktywatory 5, 6 i 7 są też zasobami – a wszystkie zależą od siebie","b":"<p><w k=\"zasob\">Zasoby</w> <span class=\"en\">Resources</span>: <w k=\"informacja\">informacja</w>; <w k=\"uslugi-infrastruktura-aplikacje\">usługi, infrastruktura i aplikacje</w>; <w k=\"ludzie-umiejetnosci-kompetencje\">ludzie, umiejętności i kompetencje</w>.</p><p>Każdy aktywator potrzebuje <b>wejść</b> od innych i daje im <b>wyniki</b>.</p><blockquote>„procesy wymagają informacji, <w k=\"struktury-organizacyjne\">struktury organizacyjne</w> wymagają umiejętności i zachowania”</blockquote>","c":"Zasoby to informacja, technologia i ludzie; słabe ogniwo osłabia cały system aktywatorów.","s":"COBIT 5 Framework (PL), s. 27–28, Ilustracja 12, Przykład 4","ctx":"<p>Na Ilustracji 12 trzy ostatnie kategorie podpisano jako zasoby, które też wymagają zarządzania i nadzoru. Pułapki: procesy i struktury to nie zasoby; zasoby to nie „tylko technologia”; nie wszystkie siedem aktywatorów to zasoby. Bezpieczna odpowiedź: 5, 6, 7.</p><p>Zależność działa w obie strony: procesy wymagają informacji i same ją wytwarzają; umiejętności i zachowanie zwiększają efektywność procesów. Dobre decyzje wymagają uwzględnienia tego systemowego charakteru i wsparcia najwyższego kierownictwa.</p><p>Przykład 4 w szpitalu: polityka i procedury bezpieczeństwa są spisane, ale lekarze dzielą się hasłami, „bo tak szybciej”. Zawodzi aktywator 4 – kultura i etyka – więc procesy i procedury nie są skuteczne. Lekarstwem nie jest kolejna procedura, lecz praca nad kulturą.</p>"},{"pt":"Sprawdź się","quiz":{"id":"q-fn-m-27","sylabus":["PR-01-02","EN-02-16"],"tresc":"Który przykład NAJLEPIEJ pokazuje systemowy charakter aktywatorów (zasada 4)?","opcje":[{"t":"Polityka bezpieczeństwa jest formalnie zatwierdzona przez zarząd banku","ok":false,"w":"Zdanie prawdziwe, ale nie pokazuje zależności między aktywatorami."},{"t":"Procesy dzielą się na procesy Ładu i Zarządzania","ok":false,"w":"Podział na procesy Ładu i Zarządzania ilustruje zasadę 5. Pytanie dotyczy natomiast współzależności różnych aktywatorów w zasadzie 4."},{"t":"Procedury bezpieczeństwa nie działają, bo kultura ich nie wspiera","ok":true,"w":"Siedem aktywatorów to zasady/polityki/ramy; procesy; struktury; kultura/etyka/zachowanie; informacja; usługi/infrastruktura/aplikacje; ludzie/umiejętności/kompetencje. Wspólnie umożliwiają osiąganie celów. Wskazana odpowiedź odpowiada właśnie temu elementowi modelu."},{"t":"Każdy aktywator ma własny cykl życia od planowania do wycofania","ok":false,"w":"Zdanie prawdziwe, ale dotyczy wymiarów, a nie zależności."}],"src":"COBIT 5 Framework (EN), sekcja rozdział 5, rysunki 12–13","pomoc":{"t":"Pytanie dotyczy lekcji 1.35 „Aktywatory, które są zasobami, i ich wzajemne powiązania”. Cel lekcji: Potrafię wskazać trzy aktywatory, które są też zasobami, i wyjaśnić, że aktywatory potrzebują wzajemnie swoich wejść i wyników.","k":[]},"kurs":"Siedem aktywatorów to zasady/polityki/ramy; procesy; struktury; kultura/etyka/zachowanie; informacja; usługi/infrastruktura/aplikacje; ludzie/umiejętności/kompetencje. Wspólnie umożliwiają osiąganie celów. Wskazana odpowiedź odpowiada właśnie temu elementowi modelu.","kontekst":""}},{"lekcje":["m0-23-proces-projekt","m0-24-proces-w-cobit"],"pt":"Lekcje 0.23–0.24","h":"Proces się powtarza i zamienia wejścia w wyniki; projekt ma koniec","b":"<div class=\"tblwrap\"><table class=\"tbl\"><tr><th></th><th><w k=\"projekt\">Projekt</w> <span class=\"en\">Project</span></th><th><w k=\"proces\">Proces</w> <span class=\"en\">Process</span></th></tr><tr><td>czas</td><td>jednorazowy, ma koniec</td><td>powtarzalny, bez końca</td></tr><tr><td>cel</td><td>tworzy albo zmienia</td><td>utrzymuje działanie</td></tr><tr><td>budowa</td><td>budżet, harmonogram</td><td>wejście → praktyki → <w k=\"rezultat\">wynik</w>; właściciel, mierniki</td></tr></table></div>","c":"Zapytaj „czy ta praca ma datę końca?” – proces w COBIT 5 to praktyki zamieniające wejścia w wyniki, z właścicielem i miernikami.","s":"COBIT 5 Framework (PL), s. 93 (słowniczek), s. 33","ctx":"<p>Definicja: proces to „zbiór praktyk ukierunkowanych przez polityki i procedury przedsiębiorstwa”, który przetwarza dane wejściowe z różnych źródeł (także z innych procesów) i dostarcza wyniki – produkty, usługi. Do tego rozliczany właściciel, jasne role i zakresy odpowiedzialności oraz środki pomiaru sprawności. COBIT 5 opisuje wzorcowo 37 procesów, które organizacja dopasowuje do siebie.</p><p>Pułapki: projekt (jednorazowe przedsięwzięcie z budżetem), polityka (zasada spisana przez kierownictwo) i program komputerowy (narzędzie – inny aktywator) to nie procesy. Po zakończeniu projektu jego rezultat muszą przejąć procesy, inaczej korzyść znika.</p><p>Przykład z urzędu: wdrożenie systemu ERP (planowania zasobów organizacji) od marca do grudnia to projekt. Codzienna obsługa zgłoszeń to proces: wejście – zgłoszenie, praktyki – weryfikacja i reset hasła, wynik – działające konto, właściciel – kierownik helpdesku.</p>"},{"pt":"Sprawdź się","quiz":{"id":"q-sym-011","sylabus":["EN-01-01","EN-02-10"],"tresc":"Wejścia i wyjścia (produkty pracy) w modelu procesów COBIT 5:","opcje":[{"t":"Definiują role R, A, C, I","ok":false,"w":"Role i odpowiedzialności opisuje RACI. Wejście lub wyjście jest informacją bądź produktem pracy, a nie przypisaniem litery RACI."},{"t":"Zastępują praktyki zarządzania i opisują je szczegółowo krok po kroku","ok":false,"w":"Praktyki i działania opisują pracę do wykonania, a produkty pracy jej wejścia i wyjścia. Uzupełniają się, zamiast wzajemnie zastępować."},{"t":"Są wyłącznie dokumentami papierowymi","ok":false,"w":"Produkty pracy mogą mieć różne postacie, także elektroniczne dane, rejestry, decyzje i raporty. Model nie ogranicza ich do papieru."},{"t":"Wspierają decyzje i zapewniają ścieżkę rewizyjną działań procesu","ok":true,"w":"Wejścia i wyjścia wspierają podejmowanie decyzji oraz śledzenie wykonanych działań. Są zdefiniowane na poziomie kluczowych praktyk i mogą przepływać między procesami."}],"src":"COBIT 5 Framework (EN), sekcja załącznik G, aktywator 2: Processes","pomoc":{"t":"Pytanie dotyczy lekcji 0.23 „Proces a projekt”. Cel lekcji: Potrafię odróżnić proces (praca powtarzalna) od projektu (praca jednorazowa z końcem).","k":["proces","projekt"]},"kurs":"Wejścia i wyjścia wspierają podejmowanie decyzji oraz śledzenie wykonanych działań. Są zdefiniowane na poziomie kluczowych praktyk i mogą przepływać między procesami.","kontekst":""}},{"pt":"Sprawdź się","quiz":{"id":"q-sym-011","sylabus":["EN-0
