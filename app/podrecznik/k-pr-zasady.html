<script>window.DECK={"id":"k-pr-zasady","rozdzial":"Wstęp i Streszczenie · s. 11–14","tytul":"Pięć zasad COBIT 5 – mapa","prev":"k-m0-cobit.html","next":"01-dlaczego-cobit5.html","T":{"zasada-2":{"t":"Zasada 2: Pokrycie całej organizacji","eg":"Zasada 2: Pokrycie całej organizacji","pd":"Zasada 2: Uwzględnienie wszystkich aspektów działania przedsiębiorstwa","en":"Principle 2: Covering the Enterprise End-to-End","wyj":"Informatyka to sprawa całej firmy czy urzędu, a nie tylko działu informatyków.\n\nŁad nad IT w organizacji (governance of enterprise IT) jest częścią ładu korporacyjnego (enterprise governance). COBIT 5 obejmuje wszystkie funkcje i procesy, w których przetwarza się informacje, także zewnętrzne usługi i procesy. Zasada wprowadza Podejście do Ładu (governance approach) z czterema komponentami: Cel Ładu, aktywatory Ładu, zakres Ładu oraz role, działania i relacje.\n\nŻeby informację i technologię traktować jako sprawę całej organizacji, a Ład nad IT jako część ładu korporacyjnego, a nie wyłącznie zadanie działu IT.","zycie":"W domu z rodzinnego Wi-Fi i wspólnego konta z filmami korzystają dzieci, dziadek i partner. Hasło ustawione przez „domowego informatyka” na nic się zda, jeśli dziecko poda je kolegom. Zasady dotyczą całego domu, nie jednej osoby – to Zasada 2.","firma":"W sklepie internetowym dane klientów widzi sprzedawca przy pakowaniu, księgowa przy fakturach i kurier na etykiecie. Informatyk ustawi najlepsze zabezpieczenia, ale jeśli sprzedawca wyśle listę klientów prywatnym mailem, i tak jest wyciek. Dlatego zasady obejmują wszystkich, także firmę kurierską – to Zasada 2.","urzad":"W urzędzie gminy dane w ewidencji ludności wpisują urzędnicy wydziału spraw obywatelskich, a informatyk tylko utrzymuje system. Gdy ktoś wpisze zły adres, to problem całego urzędu, nie informatyka. Ład nad informacją obejmuje każdy wydział – to Zasada 2.","it":"APO10 (Zarządzanie dostawcami) obejmuje usługi świadczone z zewnątrz, a DSS06 (Zarządzanie mechanizmami kontrolnymi procesów biznesowych) kontrolę informacji w procesach biznesowych, np. w fakturowaniu. Zasięg COBIT 5 wychodzi więc poza dział IT.","egz":"Według uzasadnień egzaminacyjnych „ujednolicenie z najnowszymi poglądami na temat Ładu” to kluczowy aspekt zasady „Pokrycie całej organizacji” (s. 23). Egzamin (uzasadnienie SP1): „Pokrycie całej organizacji”. Podręcznik: „Uwzględnienie wszystkich aspektów działania przedsiębiorstwa”. Nie myl z: Zasada 3: Zastosowanie Pojedynczej Zintegrowanej Struktury Ramowej – Zasada 3 dotyczy integracji z INNYMI standardami. Zasada 2 dotyczy objęcia CAŁEJ organizacji.","src":"COBIT 5 Framework (PL), s. 23; COBIT 5 Framework (PL), s. 23, Ilustracja 8"},"zasada-3":{"t":"Zasada 3: Zastosowanie Pojedynczej Zintegrowanej Struktury Ramowej","eg":"Zasada 3: Zastosowanie Pojedynczej Zintegrowanej Struktury Ramowej","pd":"Zasada 3: Stosowanie jednej zintegrowanej metodyki","en":"Principle 3: Applying a Single Integrated Framework","wyj":"Jedne spójne reguły, w które da się wpiąć inne normy, zamiast pięciu osobnych instrukcji.\n\nCOBIT 5 jest pojedynczą zintegrowaną strukturą ramową (single integrated framework) z czterech powodów: jest spójny z innymi standardami (np. ITIL, ISO 27001, TOGAF), obejmuje całą organizację, ma prostą architekturę i łączy wiedzę rozproszoną wcześniej w metodykach ISACA (np. Val IT, Risk IT). Ta wiedza trafia do bazy wiedzy COBIT 5, z której powstaje rodzina produktów. COBIT 5 może działać z innymi standardami, ale nie musi.\n\nŻeby organizacja korzystała z jednej spójnej ramy, w którą da się wpiąć inne standardy i wytyczne, zamiast utrzymywać kilka osobnych.","zycie":"Mama prowadzi kalendarz szkolny dzieci, tata grafik treningów, a babcia karteczki z wizytami u lekarza. Rodzina przenosi wszystko do jednego wspólnego kalendarza w telefonie, w którym każdy widzi całość. Jeden kalendarz, do którego trafiają wszystkie źródła – to idea Zasady 3.","firma":"Restauracja musi spełniać wymagania sanepidu, BHP i franczyzodawcy. Zamiast trzech osobnych segregatorów właściciel tworzy jeden system jakości, w którym każde wymaganie ma swoje miejsce. Jedna rama, do której wpinają się inne normy – to Zasada 3.","urzad":"Informatyk starostwa ma na głowie KRI, RODO, ISO 27001 i praktyki ITIL. Zamiast pisać osobne procedury do każdego dokumentu, układa jedną politykę IT i przypisuje do niej wymagania z poszczególnych źródeł. To Zasada 3.","it":"APO01 (Zarządzanie metodyką zarządzania IT) ustala jedną ramę zarządzania IT. Praktyki ITIL podpina się w niej np. pod DSS02 (Zarządzanie zgłoszeniami serwisowymi i incydentami), a zabezpieczenia z ISO 27001 pod APO13 (Zarządzanie bezpieczeństwem).","egz":"Kluczowe aspekty: prosta architektura, spójność z innymi standardami, pokrycie całej organizacji, integracja wytycznych ISACA. Twierdzenie, że COBIT musi być stosowany z innymi standardami, jest fałszywe. Egzamin: „Zastosowanie Pojedynczej Zintegrowanej Struktury Ramowej”. Podręcznik: „Stosowanie jednej zintegrowanej metodyki”. Struktura ramowa = metodyka = framework. Nie myl z: Zasada 2: Pokrycie całej organizacji – Zasada 2 to zakres (cała organizacja). Zasada 3 to integracja wielu wytycznych w jedną ramę.","src":"COBIT 5 Framework (PL), s. 25; COBIT 5 Framework (PL), s. 25, Ilustracja 10; COBIT 5 Framework (PL), s. 26, Ilustracja 11"},"proces":{"t":"Proces","eg":"Proces","pd":"Proces","en":"Process","wyj":"Coś, co robimy regularnie i zawsze w podobny sposób, np. przyjmowanie każdego zgłoszenia.\n\nProces (process) przyjmuje wejścia (inputs), przetwarza je przez praktyki i działania ukierunkowane przez polityki i procedury i daje wyniki (outputs), np. produkt albo usługę. Ma właściciela, role i mierniki, a wynik jednego procesu bywa wejściem innego. W COBIT 5 procesy są jednym z siedmiu aktywatorów, a Referencyjny Model Procesu opisuje ich 37.\n\nŻeby powtarzalną pracę wykonywać za każdym razem tak samo dobrze, niezależnie od tego, kto ją akurat robi, i żeby dało się ją mierzyć i poprawiać.","zycie":"Co sobotę rano sprawdzasz lodówkę, piszesz listę, jedziesz do sklepu, rozpakowujesz i odhaczasz, czego zabrakło. Za tydzień wszystko powtarza się od nowa. To proces: stałe kroki, wejście (pusta lodówka i lista) i wynik (pełna lodówka).","firma":"W sklepie internetowym z herbatą przychodzi zamówienie, pracownik pakuje paczkę, drukuje etykietę i fakturę, a kurier odbiera paczki o 15:00. Tak samo dzieje się z każdym zamówieniem, codziennie. To proces – powtarzalny, z wejściem (zamówienie) i wynikiem (paczka u klienta).","urzad":"Do urzędu gminy wpływa wniosek o wycinkę drzewa. Kancelaria go rejestruje, kierownik przydziela go referentowi, ten jedzie na oględziny i wydaje decyzję. Każdy kolejny wniosek idzie tą samą ścieżką – to jest proces.","it":"DSS02 (Zarządzanie zgłoszeniami serwisowymi i incydentami) to proces: każde zgłoszenie (wejście) jest rejestrowane, klasyfikowane, rozwiązywane i zamykane (praktyki), a wynikiem jest przywrócona usługa i wpis w rejestrze. Działa codziennie i tak samo dla każdego zgłoszenia.","egz":"Opis „zbiór praktyk ukierunkowanych politykami i procedurami, który przetwarza wejścia w wyniki” to Proces (Załącznik H). Nie myl z: Projekt – Projekt jest jednorazowy, ma początek i koniec (np. wdrożenie systemu). Proces trwa i się powtarza (np. obsługa zgłoszeń w tym systemie).","src":"COBIT 5 Framework (PL), s. 93"},"zasada-5":{"t":"Zasada 5: Oddzielenie Ładu od Zarządzania","eg":"Zasada 5: Oddzielenie Ładu od Zarządzania","pd":"Zasada 5: Oddzielenie nadzoru od zarządzania","en":"Principle 5: Separating Governance From Management","wyj":"Kto innego decyduje o kierunku, a kto inny wykonuje pracę; to dwie różne role.\n\nŁad (Governance) ocenia, kieruje i monitoruje (Evaluate, Direct, Monitor; domena EDM, 5 procesów); odpowiada zarząd pod przewodnictwem prezesa. Zarządzanie (Management) planuje, tworzy, wykonuje i monitoruje (Plan, Build, Run, Monitor; domeny APO, BAI, DSS, MEA, 32 procesy); odpowiada kierownictwo pod przewodnictwem CEO. Ład wyznacza kierunek i monitoruje, czy jest realizowany, a Zarządzanie działa zgodnie z nim i przekazuje Ładowi informacje zwrotne.\n\nŻeby rozdzielić decydowanie o kierunku od wykonywania pracy, bo to działania o innym charakterze, wymagające innych struktur i służące innym celom.","zycie":"Raz w miesiącu rodzina siada przy stole i ustala budżet: na co wydajemy, na co oszczędzamy. Potem Ty robisz zakupy, płacisz rachunki i pilnujesz wydatków. Na kolejnej naradzie pokazujesz wyniki, a rodzina koryguje plan – narada to Ład, codzienne pilnowanie to Zarządzanie.","firma":"Właścicielka piekarni ustala, że w tym roku rozwijają sprzedaż przez internet i ile może to kosztować, a co kwartał ocenia wyniki. Kierownik zakładu wybiera system zamówień, uczy ludzi i co miesiąc raportuje, jak idzie. Ona wyznacza kierunek i ocenia (Ład), on planuje i wykonuje (Zarządzanie).","urzad":"Rada gminy z wójtem decydują, że gmina cyfryzuje obsługę mieszkańców, i co pół roku oceniają postępy. Sekretarz i kierownicy wydziałów planują wdrożenie, wybierają systemy i pilnują codziennej pracy. Decyzja i nadzór to Ład, wykonanie to Zarządzanie.","it":"W EDM03 (Zapewnienie optymalizacji ryzyka) zarząd ustala apetyt na ryzyko IT i monitoruje, czy nie jest przekraczany. W APO12 (Zarządzanie ryzykiem) kierownictwo identyfikuje, analizuje i obsługuje konkretne ryzyka w tych granicach i raportuje wyniki do Ładu.","egz":"Kolejność: Oszacuj → Kieruj → Planuj → Twórz → Wykonuj → Monitoruj (MEA) → Monitoruj (EDM) (Ilustracja 15). Zarządzanie działa zgodnie z kierunkiem organu Ładu, aby osiągnąć cele organizacji. Egzamin: „Oddzielenie Ładu od Zarządzania”. Podręcznik: „Oddzielenie nadzoru od zarządzania”. Nie myl z: Ład – Ład to jedna ze stron rozdziału.; Zarządzanie – Zarządzanie to druga strona.","src":"COBIT 5 Framework (PL), s. 31; COBIT 5 Framework (PL), s. 31, Ilustracja 14; COBIT 5 Framework (PL), s. 32, Ilustracja 15"},"zarzadzanie":{"t":"Zarządzanie","eg":"Zarządzanie","pd":"Zarządzanie","en":"Management","wyj":"Kierownicy planują i wykonują pracę w kierunku, który wyznaczyło szefostwo.\n\nKierownictwo pod przewodnictwem CEO planuje, tworzy, wykonuje i monitoruje działania (Plan, Build, Run, Monitor) zgodnie z kierunkiem wskazanym przez Ład. W COBIT 5 to cztery domeny: APO, BAI, DSS i MEA, razem 32 procesy. Wyniki i informacje zwrotne wracają do Ładu, który je ocenia i w razie potrzeby koryguje kierunek.\n\nŻeby kierunek wyznaczony przez Ład zamienić w zaplanowaną, wykonaną i sprawdzoną pracę, która prowadzi do celów organizacji.","zycie":"Rodzina ustaliła: „oszczędzamy na wakacje” (to Ład). Ty robisz plan zakupów, porównujesz ceny, co miesiąc przelewasz 1000 zł na lokatę i sprawdzasz, czy kwota rośnie. Ta codzienna robota to Zarządzanie.","firma":"Właściciel restauracji ustalił, że w weekendy ma być nowe menu. Kierownik zmiany układa grafik, zamawia towar, pilnuje jakości dań i w poniedziałek raportuje właścicielowi, jak poszło. Praca kierownika to Zarządzanie.","urzad":"Wójt zdecydował, że mieszkańcy mają załatwiać sprawy przez internet. Sekretarz gminy i kierownik informatyki planują projekt, wybierają dostawcę, wdrażają e-usługi i co miesiąc raportują wójtowi. Ich praca to Zarządzanie.","it":"W dziale IT szpitala APO09 (Zarządzanie umowami o świadczenie usług) planuje poziomy usług, BAI03 (Zarządzanie identyfikacją i budowaniem rozwiązań) buduje nowy moduł rejestracji, DSS01 (Zarządzanie eksploatacją) utrzymuje go w ruchu, a MEA01 (Monitorowanie, ocena i oszacowanie wydajności i zgodności) mierzy wyniki i raportuje je do Ładu.","egz":"Zarządzanie działa zgodnie z kierunkiem wyznaczonym przez organ Ładu, aby osiągnąć cele organizacji (definicja, s. 31). Nie myl z: Ład – Ład ocenia, kieruje i monitoruje; Zarządzanie planuje, tworzy, wykonuje i monitoruje. Oba „monitorują”, ale Ład monitoruje kierunek i cele, a Zarządzanie – realizację działań.","src":"COBIT 5 Framework (PL), s. 92; COBIT 5 Framework (PL), s. 14"},"zasada-4":{"t":"Zasada 4: Aktywacja holistycznego podejścia","eg":"Zasada 4: Aktywacja holistycznego podejścia","pd":"Zasada 4: Wdrożenie podejścia całościowego","en":"Principle 4: Enabling a Holistic Approach","wyj":"Patrz na całość: sukces zależy od wielu rzeczy naraz, nie tylko od sprzętu.\n\nCOBIT 5 wyróżnia 7 kategorii aktywatorów (enablers), m.in. procesy, struktury organizacyjne, informację oraz ludzi, umiejętności i kompetencje. Aktywatory indywidualnie i kolektywnie decydują o tym, czy Ład i Zarządzanie działają: każdy potrzebuje wejść od innych i dostarcza im wyników. Wszystkie mają cztery wspólne wymiary (interesariusze, cele, cykl życia, dobre praktyki), a ich wydajność mierzą wskaźniki wiodące i opóźnione.\n\nŻeby Ład i Zarządzanie IT budować na wszystkich współpracujących aktywatorach, a nie tylko na technologii czy na pojedynczym procesie.","zycie":"Kupujesz dziecku biurko i lampkę, żeby lepiej się uczyło. Nic się nie zmienia, dopóki nie ustalicie planu dnia, zasady „najpierw lekcje, potem gry”, a Ty sam nie odłożysz telefonu przy kolacji. Dopiero wszystkie te elementy razem dają efekt – to Zasada 4.","firma":"Sklep spożywczy stawia kasę samoobsługową, ale kolejki się nie skracają. Nikt nie pilnuje kasy, kasjerki nie umieją pomóc klientom, a klienci nie wiedzą, że wolno z niej korzystać. Sam sprzęt nie wystarczy, potrzebne są też ludzie, procedury i nawyki – to Zasada 4.","urzad":"Starostwo wdraża elektroniczne zarządzanie dokumentacją. System działa, ale urzędnicy dalej drukują pisma, bo nie ma instrukcji kancelaryjnej ani szkoleń, a kierownik sam woli papier. Bez procesów, ludzi, struktur i kultury system zostaje pustą skorupą – to Zasada 4.","it":"APO13 (Zarządzanie bezpieczeństwem) działa dopiero razem z polityką bezpieczeństwa, strukturą odpowiedzialną za bezpieczeństwo, kulturą zgłaszania incydentów, przeszkolonymi ludźmi, informacją i narzędziami. Przykład 4 z FW-PL: procesy i procedury bezpieczeństwa informacji nie będą skuteczne, jeśli kultura i etyka są nieodpowiednie.","egz":"Liczba 7 aktywatorów i 4 wymiary aktywatora to tematy Zasady 4. Pytania o „jakość kontekstową”, „wskaźniki wiodące” i „cykl życia aktywatora” też należą do Zasady 4. Egzamin (uzasadnienia SP1): „Aktywacja holistycznego podejścia” – „aktywacja”, bo egzamin tłumaczy enabler jako „aktywator”. Podręcznik: „Wdrożenie podejścia całościowego”. Rozpoznawaj po słowach: holistyczne / całościowe / aktywatory. Nie myl z: Zasada 2: Pokrycie całej organizacji – Zasada 2: CAŁA organizacja (zakres). Zasada 4: WSZYSTKIE rodzaje aktywatorów (całościowe podejście).","src":"COBIT 5 Framework (PL), s. 27; COBIT 5 Framework (PL), s. 27, Ilustracja 12; COBIT 5 Framework (PL), s. 28"},"organizacja":{"t":"Organizacja","eg":"Organizacja","pd":"Przedsiębiorstwo","en":"Enterprise","wyj":"Firma, urząd, szkoła czy szpital: ludzie, którzy razem robią coś w jakimś celu.\n\nW COBIT 5 organizacja (enterprise) to podmiot, który ma interesariuszy, ich potrzeby i własne cele (enterprise goals). Ład i Zarządzanie IT służą temu, by organizacja te cele osiągała. Podręcznik tłumaczy enterprise jako „przedsiębiorstwo”, a egzamin jako „organizacja”, ale chodzi o to samo, także o sektor publiczny i not-for-profit.\n\nŻeby jednym słowem mówić o każdej zorganizowanej całości z celami: firmie, urzędzie, szpitalu czy uczelni, bo COBIT 5 stosuje się do wszystkich, nie tylko do biznesu.","zycie":"Klub szachowy przy osiedlowym domu kultury ma skarbnika, składki i wspólny cel: utrzymać salę i co roku zorganizować turniej. Nikt na tym nie zarabia, a mimo to są pieniądze, ludzie i decyzje do podjęcia. Dla COBIT 5 to też organizacja – nie trzeba być firmą, żeby z niego korzystać.","firma":"Pani Ania prowadzi jednoosobowy sklep internetowy z ceramiką, a jej brat spółkę z 200 pracownikami. Oboje mają swoje cele, pieniądze i informatykę, od której zależą. Dla COBIT 5 obie firmy są organizacjami, bez względu na wielkość.","urzad":"Szpital powiatowy, urząd gminy i szkoła podstawowa nie zarabiają dla właścicieli, ale mają budżet, ludzi, systemy i cele do osiągnięcia. COBIT 5 wprost mówi, że nadaje się też dla sektora publicznego i not-for-profit. Każda z tych instytucji jest więc organizacją w rozumieniu egzaminu.","it":"Gdy szpital publiczny realizuje APO02 (Zarządzanie strategią), też jest organizacją (enterprise) w rozumieniu COBIT 5: jego cele, np. ciągłość opieki nad pacjentami, są w kaskadzie celów celami organizacji, choć szpital nie działa dla zysku.","egz":"Gdy w pytaniu widzisz „organizacja”, w podręczniku szukaj „przedsiębiorstwo”. Podręcznik: „przedsiębiorstwo”, egzamin: „organizacja”. Chodzi o każdą organizację – także urząd czy szpital publiczny, nie tylko firmę. Nie myl z: Firma komercyjna – „Przedsiębiorstwo” w COBIT ≠ tylko firma nastawiona na zysk.","src":"COBIT 5 Framework (PL), s. 13"},"zasada-1":{"t":"Zasada 1: Realizacja potrzeb interesariusza","eg":"Zasada 1: Realizacja potrzeb interesariusza","pd":"Zasada 1: Spełnienie potrzeb interesariuszy","en":"Principle 1: Meeting Stakeholder Needs","wyj":"Wszystko robimy po to, żeby dać ludziom to, czego naprawdę potrzebują, z rozsądnym kosztem i ryzykiem.\n\nOrganizacja istnieje, by tworzyć wartość (value creation) dla interesariuszy: realizować korzyści przy optymalnym ryzyku i optymalnym wykorzystaniu zasobów. Potrzeby interesariuszy są różne i bywają sprzeczne, więc Ład je ocenia i równoważy. Kaskada celów (goals cascade) przekłada je na cele organizacji, cele związane z IT i cele aktywatorów.\n\nŻeby wszystko, co organizacja robi z IT, służyło tworzeniu wartości dla interesariuszy: korzyściom przy rozsądnym ryzyku i zużyciu zasobów.","zycie":"Planujecie remont mieszkania. Chcecie ładnej kuchni, ale bez ryzyka, że ekipa zniknie w połowie, i bez wydawania oszczędności na czarną godzinę. Zanim wybierzecie płytki, ustalacie, czego naprawdę potrzebuje każdy domownik – od tego zaczyna się Zasada 1.","firma":"Właścicielka sklepu internetowego myśli o nowej platformie sklepowej. Najpierw pyta, czego chcą klienci (szybka dostawa), wspólnik (zysk) i księgowa (porządek w fakturach), oraz ile może zaryzykować i wydać. Dopiero z tych potrzeb wyprowadza wymagania wobec IT – to Zasada 1.","urzad":"Urząd gminy wybiera nowy system do podatków lokalnych. Wójt chce wpływów na czas, mieszkańcy płatności przez internet, skarbnik zgodności z przepisami, a budżet jest ograniczony. System dobiera się tak, żeby zrównoważyć korzyści z ryzykiem i kosztem – to Zasada 1.","it":"EDM02 (Zapewnienie realizacji korzyści), EDM03 (Zapewnienie optymalizacji ryzyka) i EDM04 (Zapewnienie optymalizacji zasobów) odpowiadają trzem składnikom Celu Ładu z zasady 1. EDM05 (Zapewnienie przejrzystości dotyczącej interesariuszy) dba, by interesariusze wiedzieli, czy ich potrzeby są realizowane.","egz":"Znaj wszystkie 5 zasad po polsku i po angielsku (PR-01-01). Egzamin: „Realizacja potrzeb interesariusza”. Podręcznik: „Spełnienie potrzeb interesariuszy”.","src":"COBIT 5 Framework (PL), s. 13, Ilustracja 2; COBIT 5 Framework (PL), s. 14"},"aktywator":{"t":"Aktywator","eg":"Aktywator","pd":"Czynnik umożliwiający","en":"Enabler","wyj":"Wszystko, co musi zagrać, żeby informatyka działała dobrze: ludzie, reguły, narzędzia, informacje.\n\nCOBIT 5 dzieli aktywatory (enablers) na 7 kategorii, od Zasad, polityk i struktur ramowych (Principles, Policies and Frameworks) po Ludzi, umiejętności i kompetencje (People, Skills and Competencies). Kaskada celów wyznacza, czego oczekujemy od każdego aktywatora (cele aktywatora). Aktywatory są od siebie zależne i dostarczają sobie wejść, np. proces potrzebuje informacji i przeszkolonych ludzi. Każdy opisuje się w 4 wymiarach: interesariusze, cele, cykl życia, dobre praktyki.\n\nŻeby organizacja widziała wszystko, co musi zagrać, by osiągnąć cele, a nie tylko technologię. Aktywatory to elementy, przez które Ład i Zarządzanie realnie wpływają na wynik.","zycie":"Chcesz, żeby dzieci same odrabiały lekcje. Ustalacie zasadę „najpierw zadania, potem tablet”, stałą godzinę po obiedzie, kupujecie biurko z lampką, a Ty w tym czasie też siadasz z książką zamiast z telefonem. Zasada, stała pora, biurko i Twój przykład to różne aktywatory – działają dopiero razem.","firma":"Właścicielka kawiarni chce, żeby kawa smakowała tak samo na każdej zmianie. Spisuje recepturę, ustala kolejność parzenia, szkoli nowego baristę i oddaje ekspres do serwisu. Receptura, sposób parzenia, umiejętności baristy i ekspres to aktywatory – brak jednego psuje całość.","urzad":"Urząd gminy chce wydawać decyzje w terminie. Ma instrukcję kancelaryjną, ustalony obieg wniosku, wydział, który za sprawę odpowiada, system EZD i urzędników po szkoleniu z KPA. Każdy z tych elementów to aktywator innej kategorii.","it":"Proces DSS04 Zarządzanie ciągłością to aktywator z kategorii Procesy, ale działa tylko razem z innymi: polityką ciągłości (Zasady, polityki i struktury ramowe), aktualnym planem awaryjnym (Informacja), stanowiskiem zapasowym (Usługi, infrastruktura i aplikacje) i przećwiczonym zespołem (Ludzie, umiejętności i kompetencje).","egz":"Pułapka terminologiczna nr 1 obok Ład/Nadzór. Liczba kategorii: 7. Liczba zasad: 5. Liczba procesów: 37. Egzamin: „Aktywator”. Podręcznik: „Czynnik umożliwiający”. EN: Enabler. W pytaniach egzaminacyjnych prawie zawsze pada „Aktywator”. Nie myl z: Czynnik wpływający na potrzeby interesariuszy – Wyznacznik zmienia potrzeby; aktywator pomaga je zaspokoić.; Komponent (COBIT 2019) – W COBIT 2019 aktywatory nazwano „komponentami systemu ładu”. Na egzaminie COBIT 5 używaj „aktywator”.","src":"COBIT 5 Framework (PL), s. 14; COBIT 5 Framework (PL), s. 91; materiały Altkom"}},"S":[{"lekcje":["pr-k10-piec-zasad","pr-k11-zasady-1-3"],"pt":"Lekcje 1.10–1.11","h":"Pięć zasad rozpoznasz po słowach-kluczach","b":"<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>Zasada<\/th><th>Klucz<\/th><th>Sygnał w opisie<\/th><\/tr><tr><td><w k=\"zasada-1\">1<\/w><\/td><td>potrzeby<\/td><td>interesariusze, wartość<\/td><\/tr><tr><td><w k=\"zasada-2\">2<\/w><\/td><td>cała<\/td><td>ład korporacyjny, wszystkie funkcje<\/td><\/tr><tr><td><w k=\"zasada-3\">3<\/w><\/td><td>jedna<\/td><td>inne standardy, struktura nadrzędna<\/td><\/tr><tr><td><w k=\"zasada-4\">4<\/w><\/td><td>całość<\/td><td>współdziałające aktywatory<\/td><\/tr><tr><td><w k=\"zasada-5\">5<\/w><\/td><td>rozdzielenie<\/td><td>Ład ≠ <w k=\"zarzadzanie\">Zarządzanie<\/w><\/td><\/tr><\/table><\/div>","c":"Numer zasady to nie kolejność kroków – pięć zasad działa łącznie.","s":"COBIT 5 Framework (PL), s. 13–14, Ilustracja 2","ctx":"<p>Pytanie egzaminacyjne rzadko podaje numer zasady – opisuje sytuację. Szukaj słowa-klucza: potrzeby (1 – „po co”), cała organizacja (2 – „czego dotyczy”), jedna rama (3 – „skąd wzorce”), całość aktywatorów (4 – „czym to robimy”), rozdzielenie Ładu i Zarządzania (5 – „kto co robi”). Zaznaczasz nazwę egzaminacyjną, np. „Aktywacja holistycznego podejścia”, a nie podręcznikową „Wdrożenie podejścia całościowego”.<\/p><p>Podręcznik podkreśla, że pięć zasad „łącznie” pozwala stworzyć skuteczny system Ładu i Zarządzania. To nie etapy realizowane po kolei: organizacja stosuje je naraz, bo każda odpowiada na inne pytanie. Ilustracja 2 w podręczniku to Rysunek 2 na egzaminie.<\/p><p>Przykład: urząd uruchamia e-usługi. Ankietuje mieszkańców (1), włącza wydział podatków, archiwum i firmę hostingową (2), wpina praktyki ITIL pod jedną politykę IT (3), dba naraz o szkolenia, dane i procedury (4), a wójt z radą ustala priorytety, które wdrażają informatycy (5).<\/p>"},{"pt":"Sprawdź się","quiz":{"id":"q-pra-10-3","sylabus":["PR-01-01"],"tresc":"Jak brzmi nazwa egzaminacyjna zasady 2 COBIT 5 (<em>Covering the Enterprise End-to-End<\/em>)?","opcje":[{"t":"Pokrycie całej organizacji","ok":true,"w":"Dobrze. To nazwa z polskiego egzaminu."},{"t":"Aktywacja holistycznego podejścia","w":"To nazwa zasady 4, a nie zasady 2."},{"t":"Zastosowanie Pojedynczej Zintegrowanej Struktury Ramowej","w":"To nazwa zasady 3, a nie zasady 2."},{"t":"Uwzględnienie wszystkich aspektów działania przedsiębiorstwa","w":"To nazwa z podręcznika PL. Na egzaminie wybierasz formę egzaminacyjną."}],"src":"COBIT 5 Framework (PL), s. 13","pomoc":{"t":"Pytanie dotyczy lekcji 1.10 „Pięć zasad COBIT 5 – mapa”. Cel lekcji: Potrafię wymienić pięć zasad COBIT 5 w kolejności i nazwać je tak, jak na egzaminie.","k":[]}}},{"pt":"Sprawdź się","quiz":{"id":"q-pra-11-3","sylabus":["PR-01-01"],"tresc":"Co według zasady 3 COBIT 5 robi z innymi standardami, np. z ITIL?","opcje":[{"t":"Zastępuje je, więc organizacja może je wycofać","w":"COBIT 5 integruje inne standardy, a nie je zastępuje."},{"t":"Może być ramą nadrzędną, która je integruje","ok":true,"w":"Dobrze. COBIT 5 jest spójny z innymi standardami, więc może je łączyć jako rama nadrzędna."},{"t":"Musi być zawsze stosowany razem z nimi","w":"COBIT 5 może łączyć inne standardy, ale nie musi być z nimi stosowany."},{"t":"Obejmuje wszystkie funkcje organizacji, nie tylko IT","w":"To prawdziwy opis zasady 2, a nie zasady 3."}],"src":"COBIT 5 Framework (PL), s. 14; COBIT 5 Framework (PL), s. 25","pomoc":{"t":"Pytanie dotyczy lekcji 1.11 „Zasady 1–3 w jednym zdaniu”. Cel lekcji: Potrafię powiedzieć w jednym zdaniu, o czym są zasady 1, 2 i 3, i dobrać do każdej słowo-klucz.","k":["zasada-1","zasada-2","zasada-3"]}}},{"lekcje":["pr-k12-zasady-4-5","pr-k13-rozpoznaj-zasade"],"pt":"Lekcje 1.12–1.13","h":"Zasada 2 to zasięg, zasada 4 to składniki","b":"<ul><li><w k=\"zasada-2\">Zasada 2<\/w>: <b>kogo<\/b> dotyczy – cała <w k=\"organizacja\">organizacja<\/w>, nie tylko dział IT.<\/li><li><w k=\"zasada-4\">Zasada 4<\/w>: <b>z czego<\/b> się składa – współdziałające <w k=\"aktywator\">aktywatory<\/w>, nie jeden <w k=\"proces\">proces<\/w>.<\/li><li><w k=\"zasada-5\">Zasada 5<\/w>: Ład też monitoruje – kierunek, nie wykonanie.<\/li><\/ul>","c":"„Cała” i „całościowe” brzmią podobnie – pytaj: zasięg czy składniki?","s":"COBIT 5 Framework (PL), s. 14","ctx":"<p>Najczęstsza pomyłka wynika z nazwy podręcznikowej zasady 4: „Wdrożenie podejścia całościowego” brzmi jak „Uwzględnienie wszystkich aspektów działania przedsiębiorstwa” (zasada 2). Jeśli opis mówi, kogo sprawa dotyczy (Ład nad IT jako część ładu korporacyjnego, wszystkie funkcje), to zasada 2. Jeśli mówi, z czego rozwiązanie się składa (wiele wzajemnie oddziałujących komponentów – siedem kategorii aktywatorów), to zasada 4.<\/p><p>Dwa inne dystraktory: „wystarczy dopracować jeden proces” (proces to tylko jeden z aktywatorów) oraz „Ład tylko decyduje i niczego nie sprawdza” (Ład ocenia, kieruje i monitoruje, czy organizacja trzyma uzgodniony kierunek; Zarządzanie planuje, buduje, uruchamia i monitoruje pracę).<\/p><p>Przykład: firma kupiła system obsługi klientów, z którego po roku nikt nie korzysta – zabrakło szkoleń, procedur i czystych danych (zasada 4) oraz podziału: zarząd ustala priorytet i co kwartał sprawdza wyniki, dział IT wdraża i raportuje (zasada 5).<\/p>"},{"pt":"Sprawdź się","quiz":{"id":"q-pra-12-3","sylabus":["PR-01-01"],"tresc":"Jak nazywa się na egzaminie zasada 4 COBIT 5 (<em>Enabling a Holistic Approach<\/em>)?","opcje":[{"t":"Wdrożenie podejścia całościowego","w":"To nazwa z podręcznika PL, a nie z egzaminu."},{"t":"Pokrycie całej organizacji","w":"To nazwa zasady 2. Słowa „cała” i „całościowe” łatwo pomylić."},{"t":"Aktywacja holistycznego podejścia","ok":true,"w":"Dobrze. To nazwa egzaminacyjna."},{"t":"Zastosowanie podejścia procesowego","w":"Takiej zasady nie ma. Procesy to tylko jeden z aktywatorów."}],"src":"COBIT 5 Framework (PL), s. 14","pomoc":{"t":"Pytanie dotyczy lekcji 1.12 „Zasady 4 i 5 w jednym zdaniu”. Cel lekcji: Potrafię powiedzieć w jednym zdaniu, o czym są zasady 4 i 5, i odróżnić je od siebie.","k":["zasada-4","zasada-5"]}}},{"pt":"Sprawdź się","quiz":{"id":"q-pra-13-3","sylabus":["PR-01-01"],"tresc":"Pytanie egzaminacyjne mówi o „podejściu, które uwzględnia wiele wzajemnie oddziałujących komponentów”. Która to zasada?","opcje":[{"t":"Oddzielenie Ładu od Zarządzania","w":"Zasada 5 dotyczy rozróżnienia ról, a nie komponentów."},{"t":"Uwzględnienie wszystkich aspektów działania przedsiębiorstwa","w":"To podręcznikowa nazwa zasady 2, a opis dotyczy zasady 4."},{"t":"Pokrycie całej organizacji","w":"Zasada 2 mówi o zasięgu, a opis mówi o składnikach."},{"t":"Aktywacja holistycznego podejścia","ok":true,"w":"Dobrze. Wiele współdziałających komponentów to zasada 4."}],"src":"COBIT 5 Framework (PL), s. 14","pomoc":{"t":"Pytanie dotyczy lekcji 1.13 „Jak rozpoznać zasadę w opisie sytuacji”. Cel lekcji: Potrafię rozpoznać zasadę COBIT 5 po słowie-kluczu w opisie sytuacji i odróżnić zasadę 2 od zasady 4.","k":[]}}}]};</script>
