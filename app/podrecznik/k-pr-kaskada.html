<script>window.DECK={"id":"k-pr-kaskada","rozdzial":"Rozdział 2 · Zasada 1: Realizacja potrzeb interesariusza · s. 17–22","tytul":"Kaskada Celów krok po kroku","prev":"k-pr-wartosc.html","next":"02b-kaskada-schemat.html","T":{"raci":{"t":"Diagram RACI","eg":"Diagram RACI","pd":"Tabela RACI","en":"RACI chart","wyj":"Tabela, która dla każdego zadania mówi: kto robi, kto odpowiada, kogo pytamy, kogo informujemy.\n\nDiagram RACI (RACI chart; w podręczniku: tabela RACI) ma w wierszach praktyki procesu, a w kolumnach role i struktury organizacyjne. W każdej komórce stoi litera: R (Responsible) – wykonuje, A (Accountable) – odpowiada za sukces, C (Consulted) – dostarcza wejścia, komunikacja dwukierunkowa, I (Informed) – otrzymuje informacje, komunikacja jednokierunkowa. Przy jednej praktyce powinien być tylko jeden A (praktyka tabel RACI – interpretacja kursu; FW-PL nie formułuje tej reguły).\n\nŻeby przy każdej czynności było jasne, kto ją wykonuje, kto ostatecznie za nią odpowiada, kogo trzeba zapytać i kogo poinformować, i żeby żadne zadanie nie zostało bez właściciela.","zycie":"Przy remoncie mieszkania ekipa kładzie płytki (R), a Ty jako inwestor płacisz i odpowiadasz za cały remont (A). Przed kuciem ścian uzgadniasz godziny z sąsiadem zza ściany (C), a administratora budynku tylko zawiadamiasz, kiedy będzie hałas (I). Tak wygląda RACI: jeden robi, jeden odpowiada, z jednym rozmawiasz, drugiemu dajesz znać.","firma":"Sklep internetowy przygotowuje promocję na Black Friday. Grafik robi banery (R), kierowniczka marketingu odpowiada za wynik akcji (A), księgowa mówi, jakie rabaty się opłacają (C). Magazyn dostaje maila z terminem, żeby przygotował towar (I).","urzad":"W wydziale budownictwa starostwa inspektor przygotowuje decyzję (R), a naczelnik wydziału ją podpisuje i za nią odpowiada (A). Radca prawny wcześniej opiniuje projekt (C), a wójt gminy, na której terenie ma stanąć budynek, dostaje kopię do wiadomości (I).","it":"COBIT 5 podaje dla każdej praktyki wzorcową tabelę RACI, którą organizacja dostosowuje. Dla praktyki DSS02.05 (rozwiązywanie incydentów i przywracanie usług) organizacja może wpisać: kierownik ds. usług IT – A, zespół wsparcia – R, właściciel procesu biznesowego – C, użytkownicy – I.","egz":"„Ktoś, kto dostaje zadanie do wykonania” → R (odpowiedzialny wykonawczo). „Odpowiada za sukces” → A (odpowiedzialny decyzyjnie). „Dostarcza wejścia” → C (rola konsultanta). „Otrzymuje informacje” → I. R po polsku na egzaminie to „Odpowiedzialny wykonawczo”, czyli ten, kto wykonuje. A to „Odpowiedzialny decyzyjnie”, czyli ten, kto odpowiada za sukces. Obie nazwy zaczynają się od „odpowiedzialny” – rozróżnia je drugie słowo. Podręcznik: „strona odpowiedzialna” (R) i „strona rozliczana” (A). Nie myl z: Role, działania i relacje – Ilustracja 9 to ogólne relacje w systemie Ładu. RACI przypisuje role do konkretnych praktyk procesu.","src":"COBIT 5 Framework (PL), s. 89, 90, 92, 93"},"bsc":{"t":"Zrównoważona karta wyników","eg":"Zrównoważona karta wyników","pd":"Zrównoważona karta wyników (BSC)","en":"Balanced Scorecard (BSC)","wyj":"Patrzenie na wyniki z czterech stron naraz: pieniądze, klienci, sposób pracy, nauka i rozwój.\n\nBalanced Scorecard (Kaplan i Norton) ma cztery perspektywy: finanse (Financial), klient (Customer), obszar wewnętrzny (Internal) oraz szkolenie i rozwój (Learning and Growth). COBIT 5 grupuje według nich 17 celów organizacji, a według IT BSC 17 celów związanych z IT. BSC nie przekłada celów między poziomami, tylko porządkuje cele jednego poziomu.\n\nŻeby oceniać organizację nie tylko przez pieniądze, ale też przez klientów, sposób pracy oraz naukę i rozwój. W COBIT 5 służy do porządkowania typowych celów w cztery wymiary.","zycie":"Na koniec roku podsumowujesz, jak Ci poszło. Nie patrzysz tylko na konto: sprawdzasz też, jak układa się z bliskimi, czy dom działa bez ciągłych awarii i czego się nauczyłeś. Cztery osobne rubryki zamiast jednej liczby to właśnie idea BSC.","firma":"Właściciel warsztatu co miesiąc patrzy na cztery liczby: ile zarobił, ilu klientów wystawiło dobrą opinię, ile dni auto czeka na naprawę i ilu mechaników przeszło szkolenie z aut elektrycznych. Sam zysk mógłby wyglądać dobrze, a klienci i tak by odchodzili. Te cztery perspektywy to BSC.","urzad":"Burmistrz dostaje kwartalny raport: wykonanie budżetu, ankieta zadowolenia mieszkańców, średni czas załatwienia sprawy i liczba urzędników po szkoleniach. Każda z tych liczb to inna perspektywa BSC: finanse, klient, procesy wewnętrzne, szkolenie i rozwój.","it":"W IT BSC cel związany z IT 07 „Dostarczanie usług IT zgodnie z wymogami biznesowymi” należy do wymiaru Klient, a cel 10 „Bezpieczeństwo informacji, infrastruktury przetwarzania i aplikacji” do wymiaru Obszar wewnętrzny. Ten sam podział na cztery wymiary porządkuje też 17 celów organizacji (Ilustracje 5 i 6).","egz":"Relacja potrzeb interesariuszy do BSC jest tematem sylabusa (PR-02-03). Zapamiętaj 4 wymiary. Nie myl z: Kaskada Celów – BSC porządkuje cele w wymiary; kaskada przekłada cele między poziomami.","src":"COBIT 5 Framework (PL), s. 17"},"wyznacznik":{"t":"Czynnik wpływający na potrzeby interesariuszy","eg":"Czynnik wpływający na potrzeby interesariuszy","pd":"Wyznacznik","en":"Driver / Stakeholder drivers","wyj":"Coś, co sprawia, że ludzie zaczynają czegoś potrzebować, np. nowy przepis, awaria albo nowa technologia.\n\nWyznaczniki (stakeholder drivers) to czynniki zewnętrzne i wewnętrzne, np. zmiany strategii, otoczenia biznesowego i regulacyjnego oraz nowe technologie. Wpływają na potrzeby interesariuszy (stakeholder needs). To krok 1 kaskady celów (goals cascade): potem potrzeby przekłada się na cele organizacji, cele związane z IT i cele aktywatorów.\n\nŻeby wiedzieć, skąd biorą się i dlaczego zmieniają się potrzeby interesariuszy, od których zaczyna się kaskada celów.","zycie":"Rodzi się Wam dziecko. Nagle potrzebujecie większego auta, innego budżetu i elastycznych godzin pracy. Samo dziecko nie jest potrzebą – to wyznacznik, który zmienia Wasze potrzeby.","firma":"Wchodzi przepis o kasach fiskalnych online. Właściciel małego sklepu spożywczego musi wymienić kasę i nauczyć sprzedawczynie nowej obsługi. Przepis to wyznacznik, który tworzy w sklepie nową potrzebę.","urzad":"Ustawa o doręczeniach elektronicznych nakłada na urzędy nowy obowiązek. Urząd gminy musi założyć skrzynkę do e-Doręczeń i zmienić pracę kancelarii. Ustawa to zewnętrzny wyznacznik, który zmienia potrzeby urzędu.","it":"Nowa regulacja o cyberbezpieczeństwie to wyznacznik. Zmienia potrzeby interesariuszy, a kaskada celów prowadzi od nich do celów związanych z IT (bezpieczeństwo informacji, zgodność) i do procesów APO13 (Zarządzanie bezpieczeństwem) oraz MEA03 (Monitorowanie, ocena i oszacowanie zgodności z wymogami zewnętrznymi).","egz":"Wyznacznikami są zmiany strategii, otoczenia biznesowego i regulacyjnego oraz nowe technologie (s. 17). Dobre praktyki, jakość kontekstowa i wskaźniki to pojęcia z modelu aktywatora, czyli inna kategoria. Podręcznik używa słowa „wyznacznik”. Na egzaminie pytanie bywa opisowe: „czynnik wpływający na potrzeby interesariuszy”. Nie myl tego słowa „czynnik” z „czynnikiem umożliwiającym” (aktywatorem). Nie myl z: Aktywator – Aktywator (czynnik umożliwiający) POMAGA osiągnąć cele – np. proces czy struktura. Wyznacznik WYWOŁUJE zmianę potrzeb.; Zdarzenie wyzwalające (trigger event) – Pojęcie z wdrożenia (IM): zdarzenie, które uruchamia program usprawnień, np. fuzja. Podobne w duchu, ale inny obszar sylabusa.","src":"COBIT 5 Framework (PL), s. 17, 91"},"it-dostepnosc":{"t":"Dostępność","eg":"Dostępność","pd":"dostępność","en":"Availability","wyj":"Usługa albo informacja działa i można z niej skorzystać wtedy, gdy jest potrzebna.\n\nOrganizacja ustala, kiedy i jak niezawodnie usługa ma działać. Informatycy dobierają infrastrukturę (np. zapasowy serwer), pilnują, by starczyło mocy, i mierzą przerwy. Gdy dostępność spada, szukają przyczyn.\n\nŻeby ludzie mogli pracować wtedy, kiedy muszą, a nie tylko wtedy, gdy system akurat działa.","zycie":"Bankomat pod blokiem działa całą dobę – to dobra dostępność. Gdy co weekend jest „nieczynny”, dostępność jest słaba, choć pieniądze w banku są.","firma":"Sklep internetowy przed świętami dokupuje serwery, żeby strona nie padała przy tłumie klientów.","urzad":"ZUS (Zakład Ubezpieczeń Społecznych) ustala, że portal dla firm ma działać całą dobę, a zwłaszcza w dniach, gdy mija termin wysyłania deklaracji składkowych. Na te dni informatycy dokładają mocy serwerów, a przerwy techniczne planują tylko w nocy z soboty na niedzielę. Co miesiąc mierzą, ile minut portal nie działał.","it":"BAI04 Zarządzanie dostępnością i pojemnością; cel organizacji 7 i kryterium jakości informacji „dostępność/terminowość” (FW-PL s. 19, 33, 82).","egz":"BAI04 Zarządzanie dostępnością i pojemnością (Manage Availability and Capacity); dostępność to też kryterium jakości informacji (FW-PL s. 82). Nie myl z: Ciągłość działania – Dostępność to codzienne „działa, gdy trzeba”. Ciągłość to przygotowanie na poważne zakłócenia.; Dostęp i Bezpieczeństwo – Kategoria jakości informacji „Dostęp i Bezpieczeństwo” obejmuje dostępność, ale też ograniczenie dostępu dla nieuprawnionych.","src":"COBIT 5 Framework (PL), s. 19, 33, 82"},"kaskada-celow":{"t":"Kaskada Celów","eg":"Kaskada Celów","pd":"Kaskada celów","en":"Goals Cascade","wyj":"Schodzenie od ogólnego „czego chcemy” do konkretnych zadań, jak rozpisanie wesela na listę rzeczy do załatwienia.\n\nWyznaczniki (stakeholder drivers) wpływają na potrzeby interesariuszy (stakeholder needs). Potrzeby przekłada się na cele organizacji (enterprise goals, 17 w wymiarach BSC), te na cele związane z informatyką (IT-related goals, 17 w wymiarach IT BSC), a te na cele aktywatorów (enabler goals), np. cele procesów. Każda organizacja dostosowuje kaskadę do siebie, bo nie jest ona uniwersalną prawdą.\n\nŻeby ogólne potrzeby interesariuszy przełożyć na konkretne, mierzalne cele na każdym poziomie, aż po cele procesów i innych aktywatorów, i wiedzieć, które z nich są priorytetem.","zycie":"Rodzice chcą, żeby za dwa lata stać ich było na mieszkanie. Ustalają cel domu: odkładać 1500 zł miesięcznie, a z niego cel dla domowej „informatyki”: aplikacja bankowa ma sama przelewać pieniądze na oszczędności w dniu wypłaty. Na końcu są zadania dla konkretnych „narzędzi”: zlecenie stałe, wspólny arkusz wydatków i zasada, że co miesiąc siadają razem nad liczbami – każdy krok wynika z poprzedniego, to jest kaskada celów.","firma":"Właściciel sklepu internetowego z zabawkami chce stabilnego zysku. Przekłada to na cel firmy „wracający klienci”, z niego wychodzi cel IT „sklep działa bez przerw w sezonie świątecznym”, a z tego cele aktywatorów: procedura reagowania na awarie, przeszkolony pracownik i umowa z firmą hostingową na szybką pomoc. Od ogólnej potrzeby do konkretnych zadań, krok po kroku – to kaskada celów.","urzad":"Mieszkańcy skarżą się, że na każdą sprawę w urzędzie muszą brać wolne. Gmina zapisuje cel: najważniejsze sprawy da się załatwić bez wizyty, informatyk przekłada go na cel IT: bezpieczne i stale dostępne e-usługi, a z tego wynikają cele aktywatorów: proces obsługi e-wniosków, polityka bezpieczeństwa i przeszkoleni urzędnicy. To kaskada celów: od skargi mieszkańca do konkretnego zadania w urzędzie.","it":"Potrzeba „działamy zgodnie z prawem” prowadzi do celu organizacji „zgodność z zewnętrznymi przepisami i regulacjami”, ten do celu związanego z informatyką „zgodność IT z zewnętrznymi przepisami i wsparcie zgodności biznesu”, a ten do celów procesu MEA03 (Monitorowanie, ocena i oszacowanie zgodności z wymogami zewnętrznymi).","egz":"„Do czego służy Kaskada Celów?”: do wspierania dopasowania potrzeb organizacji do rozwiązań i usług IT i do przełożenia potrzeb na konkretne cele (s. 17). RACI, architektura korporacyjna oraz wejścia i wyjścia procesu to inne kategorie. Nie myl z: Hierarchia służbowa – Kaskada dotyczy CELÓW, nie ludzi – nie mylić ze strukturą organizacyjną.; Zrównoważona karta wyników (BSC) – BSC to narzędzie, którego wymiary (finanse, klient, obszar wewnętrzny, szkolenie i rozwój) porządkują cele organizacji w kaskadzie. Nie jest samą kaskadą.","src":"COBIT 5 Framework (PL), s. 17, 18, 20"},"it-klient":{"t":"Klient","eg":"Klient","pd":"—","en":"Client","wyj":"Urządzenie albo program, który prosi serwer o dane albo o wykonanie zadania.\n\nKlikasz w aplikacji „Pokaż saldo”. Aplikacja wysyła prośbę przez sieć do serwera. Czeka. Gdy przyjdzie odpowiedź, pokazuje ją na ekranie.\n\nŻeby urządzenie użytkownika mogło korzystać z danych i pracy innego komputera, nie trzymając wszystkiego u siebie.","zycie":"Przeglądarka w telefonie jest klientem: prosi serwer gazety o stronę z wiadomościami.","firma":"W banku 300 komputerów kasjerów to klienci jednego systemu bankowego na serwerach w centrali.","urzad":"W urzędzie marszałkowskim 120 komputerów urzędników to klienci jednego systemu obiegu dokumentów, który działa na serwerach w siedzibie urzędu. Gdy urzędnik otwiera sprawę, jego komputer wysyła prośbę do serwera i czeka na odpowiedź. Pismo pojawia się na ekranie dopiero wtedy, gdy serwer je odeśle.","it":"W COBIT 5 słowo „klient” oznacza głównie odbiorcę usług organizacji (np. perspektywa „Klient”, FW-PL s. 19), a nie urządzenie.","egz":"Na egzaminie „klient” występuje w znaczeniu biznesowym (np. perspektywa „Klient”). Znaczenie techniczne jest potrzebne tylko do zrozumienia usług IT. Nie myl z: Serwer – Klient prosi, serwer odpowiada.; Klient (odbiorca usług) – W biznesie i w COBIT 5 klient to człowiek albo firma korzystająca z usług organizacji, a nie urządzenie.","src":"COBIT 5 Framework (PL), s. 19"},"ocena-p":{"t":"P – Pełny","eg":"P – Pełny","pd":"F – w pełni osiągnięto","en":"F – Fully achieved (>85–100%)","wyj":"W pełni: działa kompletnie i systematycznie, bez poważnych słabych punktów.\n\nGdy osiągnięcie wynosi powyżej 85% do 100%, asesor wpisuje P – Pełny. Dowody pokazują kompletne i systematyczne osiągnięcie, bez istotnych słabości.\n\nŻeby oznaczyć atrybut osiągnięty kompletnie i systematycznie. Tylko P na niższych poziomach otwiera drogę wyżej.","zycie":"Przez cały rok córka sama odrabia lekcje i pakuje plecak. Raz zapomniała linijki, ale to drobiazg. To P: w pełni, bez istotnych wpadek.","firma":"W warsztacie każde zlecenie ma kartę, termin i podpis odbioru. Ocena to P – Pełny.","urzad":"W starostwie każda skarga mieszkańca ma datę wpływu i datę odpowiedzi. Kontrola sprawdza 50 skarg i znajduje jedną drobną pomyłkę. Bez istotnych słabości, więc ocena to P – Pełny.","it":"Żeby DSS02 osiągnął poziom 3, PA 1.1, PA 2.1 i PA 2.2 muszą mieć P. PA 3.1 i PA 3.2 potrzebują co najmniej W.","egz":"P (egzamin PL) = Pełny, >85–100% (EN: F – Fully). Wszystkie atrybuty niższych poziomów muszą mieć P, żeby proces osiągnął wyższy poziom. PUŁAPKA NR 1: na egzaminie PL P = Pełny (Fully). Po angielsku i w podręczniku P = Partially, czyli częściowy, a Pełny to F. Ta sama litera, przeciwne znaczenie. Nie myl z: C – Częściowy – Polskie C to angielskie P (Partially, >15–50%). Polskie P to angielskie F (Fully, >85–100%).; W – Większościowy – W wystarcza dla atrybutów ocenianego poziomu. P jest wymagane na wszystkich niższych poziomach.; Relacja P na Ilustracji 5 – Na il. 5 litera P oznacza relację podstawową (cele organizacji). To nie jest ocena atrybutu.","src":"COBIT 5 Framework (PL), s. 42, 45"},"informacja":{"t":"Informacja","eg":"Informacja","pd":"Informacje","en":"Information (enabler 5)","wyj":"Wszystko, co wiemy i zapisujemy, od numeru telefonu po raport, i co komuś do czegoś służy.\n\nInformacja (Information) to piąty z 7 aktywatorów i obejmuje wszystkie informacje w organizacji, nie tylko te w systemach. Ma interesariuszy w rolach wytwórcy (producer), opiekuna (custodian) i konsumenta (consumer), własny cykl życia i kryteria jakości: wewnętrznej, kontekstowej oraz bezpieczeństwa i dostępności. Opisuje się ją też w 6 warstwach atrybutów, od fizycznej po społeczną.\n\nŻeby organizacja traktowała informację jak zasób, o który trzeba dbać: wytwarzać ją, przechowywać, chronić i udostępniać tym, którzy jej potrzebują.","zycie":"Mama dzwoni, że w czwartek nie odbierze dzieci ze szkoły, na lodówce wisi plan lekcji, a szkoła przysyła SMS o skróconych zajęciach. Żadna z tych wiadomości nie siedzi w komputerze, a mimo to wszystkie są informacją, od której zależy, kto i o której jedzie po dzieci. Jeśli nikt jej nie przeczyta i nie zareaguje, nic z niej nie wynika – to cecha aktywatora Informacja.","firma":"Piekarz zapisuje w zeszycie, ile chleba zostało wieczorem, kasa drukuje raport sprzedaży, a sprzedawczyni mówi, o co pytali klienci. Z tego wszystkiego właścicielka planuje jutrzejszy wypiek. Piekarz informację tworzy, zeszyt i kasa ją przechowują, a właścicielka z niej korzysta – to role wokół aktywatora Informacja.","urzad":"W szkole sekretarka prowadzi rejestr uczniów, wychowawca wpisuje oceny do dziennika, a dyrektor na radzie pedagogicznej słyszy ustnie o kłopotach w klasie 3b. Wszystko to jest informacja, także to, czego nie ma w żadnym systemie. Coś z niej wynika dopiero wtedy, gdy dyrektor na tej podstawie organizuje pomoc dla klasy.","it":"Dane kontaktowe klientów w systemie CRM to aktywator Informacja: klient podaje je przy zakładaniu konta (wytwórca), administrator utrzymuje bazę (opiekun), a konsultant korzysta z niej przy obsłudze (konsument). Nieaktualny numer to błąd jakości informacji, przez który powiadomienie nie dotarło.","egz":"Informacja jest jedną ze zdolności do świadczenia usług, a zdolności te wykorzystuje się poprzez procesy, by świadczyć usługi (s. 86). Procesy wymagają informacji jako wejścia i wytwarzają ją jako wyjście (s. 71). Nie myl z: Dane – Dane to surowe fakty. Informacja to dane przetworzone i mające znaczenie.","src":"COBIT 5 Framework (PL), s. 81, 86"},"cele-aktywatorow":{"t":"Cele aktywatora","eg":"Cele aktywatora","pd":"Cele czynników umożliwiających","en":"Enabler goals","wyj":"Konkretne, sprawdzalne cele dla każdej „części układanki”, np. dla danych: mają być aktualne.\n\nTo czwarty krok kaskady celów (goals cascade): potrzeby interesariuszy → cele organizacji → cele związane z IT → cele aktywatora. Dla każdego aktywatora określa się cele, które wspierają cele związane z IT; najczęściej są to cele procesów, a mapowanie celów IT na procesy podaje Załącznik C. Cele są też jednym z czterech wymiarów aktywatora i dzielą się na kategorie: jakość wewnętrzna, jakość kontekstowa oraz dostęp i bezpieczeństwo.\n\nŻeby cel związany z IT przełożyć na konkretne, sprawdzalne oczekiwania wobec każdego aktywatora: procesu, polityki, struktury, informacji czy ludzi.","zycie":"Chcesz, żeby zdjęcia rodzinne nie zginęły, gdy padnie laptop. Ustalasz konkretnie: kopia na dysk zewnętrzny pierwszego dnia miesiąca (cel dla procesu) i każdy domownik umie odzyskać zdjęcie z kopii (cel dla ludzi). Takie małe, sprawdzalne cele dla poszczególnych „narzędzi” to cele aktywatorów.","firma":"Sklep internetowy ma cel IT: system zamówień ma działać. Właściciel rozpisuje go na kawałki: awaria usunięta w 2 godziny (cel dla procesu), dwie osoby umieją zrestartować serwer (cel dla ludzi), instrukcja awaryjna jest aktualna i wisi przy komputerze (cel dla informacji). Każdy z tych celów dotyczy innego aktywatora.","urzad":"Gmina chce chronić dane mieszkańców. Sekretarz ustala: polityka haseł obowiązuje każdego pracownika, nowe konto zakłada się tylko na pisemny wniosek kierownika, a wszyscy urzędnicy raz w roku przechodzą szkolenie. Polityka, proces nadawania uprawnień i ludzie dostają własne cele – to cele aktywatorów.","it":"Cel związany z IT 10 (bezpieczeństwo informacji) zamienia się w cele aktywatorów: dla procesu DSS05 Zarządzanie usługami bezpieczeństwa „konto odchodzącego pracownika zablokowane tego samego dnia”, a dla aktywatora Ludzie, umiejętności i kompetencje „każdy pracownik raz w roku przechodzi szkolenie z phishingu”.","egz":"Ostatni poziom kaskady: Cele związane z informatyką → Cele aktywatora. Egzamin: „Cele aktywatora”. Podręcznik: „Cele czynników umożliwiających”. Nie myl z: Cele związane z informatyką – Cele aktywatorów są jeszcze bardziej szczegółowe – dotyczą konkretnego procesu, struktury itd.","src":"COBIT 5 Framework (PL), s. 18, 21"},"cele-organizacji":{"t":"Cele organizacji","eg":"Cele organizacji","pd":"Cele przedsiębiorstwa","en":"Enterprise goals","wyj":"Siedemnaście typowych celów, które ma każda firma czy urząd, np. zadowoleni klienci, zgodność z przepisami.\n\nTo drugi krok kaskady celów: potrzeby interesariuszy (stakeholder needs) przekłada się na cele organizacji (enterprise goals). COBIT 5 podaje 17 typowych celów w 4 wymiarach BSC: finanse, klient, obszar wewnętrzny, szkolenie i rozwój. Ilustracja 5 pokazuje, z którymi składnikami Celu Ładu (realizacja korzyści, optymalizacja ryzyka, optymalizacja zasobów) cel ma relację podstawową (P) lub wspierającą (S).\n\nŻeby potrzeby interesariuszy zamienić w konkretne cele całej organizacji, z których dopiero wynikają cele dla IT. Bez tego IT nie wie, czemu ma służyć.","zycie":"Na początku roku rodzina ustala, na czym jej najbardziej zależy: odłożyć na wkład własny, żeby dzieci dobrze zaczęły nową szkołę i żeby wszyscy byli zdrowi. Nikt jeszcze nie mówi o laptopach czy internecie. To cele „całego domu” – odpowiednik celów organizacji.","firma":"Właścicielka piekarni mówi: w tym roku chcę, żeby klienci wracali, żeby sanepid nie miał uwag i żeby firma była na plusie. To cele całej piekarni, a dopiero z nich wyniknie, czego potrzeba od kasy fiskalnej czy sklepu online. Tak wyglądają cele organizacji.","urzad":"Wójt na sesji rady gminy zapowiada: decyzje wydawane w terminie, sprawy do załatwienia przez internet i jawne wydatki. Te zamierzenia dotyczą całego urzędu, nie działu informatyki. To cele organizacji, od których zaczyna się kaskada.","it":"Cel organizacji 7 „Ciągłość i dostępność usług biznesowych” (wymiar Klient) w kaskadzie prowadzi m.in. do celu związanego z IT 07 „Dostarczanie usług IT zgodnie z wymogami biznesowymi”, a dalej m.in. do procesu DSS04 Zarządzanie ciągłością.","egz":"Potrzeby interesariuszy → Cele organizacji (krok 2). 17 celów, 4 wymiary BSC, relacje P/S. Nie musisz znać wszystkich 17 na pamięć – rozpoznawaj wymiary i logikę P/S. Egzamin: „Cele organizacji”. Podręcznik: „Cele przedsiębiorstwa”. Słownik podręcznika odsyła do „Cel biznesowy”. Nie myl z: Cele związane z informatyką – Cele organizacji dotyczą całej działalności; cele związane z informatyką opisują, co musi zapewnić IT, aby te cele wspierać.","src":"COBIT 5 Framework (PL), s. 19, 91"},"cele-zwiazane-z-it":{"t":"Cele związane z informatyką","eg":"Cele związane z informatyką","pd":"Cele związane z IT","en":"IT-related goals","wyj":"Siedemnaście typowych celów dla informatyki, np. systemy działają, dane są bezpieczne, projekty kończą się na czas.\n\nTo trzeci krok kaskady celów: cele organizacji przekłada się na cele związane z IT (IT-related goals), czyli rezultaty związane z IT. COBIT 5 podaje ich 17 w wymiarach IT BSC; mapowanie na cele organizacji jest w Załączniku B, a na procesy w Załączniku C. „Związane z IT” oznacza informację i powiązaną technologię w całej organizacji, a nie tylko dział IT.\n\nŻeby wiedzieć, co informacja i technologia muszą zapewnić, aby udały się cele organizacji. Dzięki temu IT nie wyznacza sobie celów w oderwaniu od reszty organizacji.","zycie":"Rodzina chce bezpiecznie odkładać pieniądze. Żeby się udało, w domu musi działać bankowość w telefonie, hasła muszą być w menedżerze haseł, a skany umów mieć kopię zapasową. Te wymagania wobec domowej technologii to cele związane z IT.","firma":"Sklep internetowy chce zadowolonych klientów. Z tego wynika, że strona ma działać także w Black Friday, płatności mają przechodzić bez błędów, a adresy klientów nie mogą wyciec (cele IT 07 i 10). To cele związane z IT – to, co technologia musi dać, żeby udał się cel sklepu.","urzad":"Gmina chce, żeby mieszkańcy załatwiali sprawy przez internet. Do tego e-usługi muszą działać, dane osobowe muszą być chronione, a rejestry aktualne. To nie są cele informatyka dla niego samego, tylko cele związane z IT, które wynikają z celu gminy.","it":"Cel związany z IT 10 „Bezpieczeństwo informacji, infrastruktury przetwarzania i aplikacji” (wymiar Obszar wewnętrzny) to rezultat, który w banku muszą zapewnić m.in. procesy APO13 Zarządzanie bezpieczeństwem i DSS05 Zarządzanie usługami bezpieczeństwa.","egz":"Opis „rezultaty związane z IT, wymagane do osiągnięcia celów organizacji” to Cele związane z informatyką (s. 18). Egzamin: „Cele związane z informatyką”. Podręcznik: „Cele związane z IT”. Nie myl z: Cele organizacji – Krok wcześniej: cele organizacji dotyczą całej działalności.; Cele aktywatora – Krok później: cele konkretnych aktywatorów (np. procesów), które pozwalają osiągnąć cele związane z informatyką.","src":"COBIT 5 Framework (PL), s. 18, 19"}},"S":[{"pt":"Lekcje 1.17–1.18","h":"Poziomy kaskady: kolejność stała, nazwy z egzaminu","b":"<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>Egzamin<\/th><th>Podręcznik (pułapka)<\/th><\/tr><tr><td><w k=\"wyznacznik\">Wyznaczniki<\/w><\/td><td>wyznaczniki dotyczące interesariuszy<\/td><\/tr><tr><td>Potrzeby interesariuszy<\/td><td>potrzeby interesariuszy<\/td><\/tr><tr><td><w k=\"cele-organizacji\">Cele organizacji<\/w><\/td><td>cele przedsiębiorstwa<\/td><\/tr><tr><td><w k=\"cele-zwiazane-z-it\">Cele związane z Informatyką<\/w><\/td><td>cele związane z IT<\/td><\/tr><tr><td><w k=\"cele-aktywatorow\">Cele aktywatora<\/w><\/td><td>cele czynników umożliwiających<\/td><\/tr><\/table><\/div>","c":"Potrzeby przekłada się najpierw na cele całej organizacji, dopiero potem na cele IT.","s":"COBIT 5 Framework (PL), s. 17–18, Ilustracja 4","ctx":"<p><w k=\"kaskada-celow\">Kaskada Celów<\/w> (Rysunek 4) to pięć poziomów połączonych czterema krokami, od ogółu („po co”) do szczegółu („co robimy”). Egzamin każe układać elementy w kolejności – najwięcej błędów rodzi zamiana wyznacznika z potrzebą (zmiana w otoczeniu to wyznacznik, oczekiwanie ludzi – potrzeba) i przeskoczenie celów organizacji: potrzeby nie trafiają od razu do informatyków.<\/p><p>Podręcznik dodaje, czego nie widać na schemacie: każda organizacja działa w innym kontekście – zewnętrznym (rynek, branża, sytuacja geopolityczna) i wewnętrznym (kultura, organizacja, apetyt na ryzyko) – i system Ładu trzeba do niego dostosować. Lista 17 celów organizacji nie jest wyczerpująca, ale większość konkretnych celów da się przypisać do jednego lub kilku z nich.<\/p><p>Przykład: nowe przepisy o ochronie danych (wyznacznik) → klienci i regulator chcą pewności, że dane są bezpieczne (potrzeba) → cel organizacji 4 „Zgodność z przepisami prawa i regulacjami” → dopiero teraz pytanie, co musi zapewnić IT.<\/p>"},{"pt":"Sprawdź się","quiz":{"tresc":"Jaka jest poprawna kolejność poziomów Kaskady Celów (<em>Goals Cascade<\/em>)?","opcje":[{"t":"Wyznaczniki → Potrzeby → Cele organizacji → Cele związane z informatyką → Cele aktywatora","ok":true,"w":"Dobrze. Tak pokazuje to Ilustracja 4."},{"t":"Wyznaczniki → Cele organizacji → Potrzeby → Cele związane z informatyką → Cele aktywatora","w":"Potrzeby interesariuszy są przed celami organizacji, a nie po nich."},{"t":"Potrzeby → Wyznaczniki → Cele organizacji → Cele aktywatora → Cele związane z informatyką","w":"Wyznaczniki są na samej górze, a cele aktywatora na samym dole."},{"t":"Wyznaczniki → Potrzeby → Cele związane z informatyką → Cele organizacji → Cele aktywatora","w":"Potrzeby trafiają najpierw do celów organizacji, a dopiero potem do celów IT."}],"src":"COBIT 5 Framework (PL), s. 18","pomoc":{"t":"Pytanie dotyczy lekcji 1.17 „Kaskada Celów – pięć poziomów”. Cel lekcji: Potrafię ułożyć pięć poziomów Kaskady Celów w kolejności od wyznaczników do celów aktywatora.","k":["kaskada-celow"]}}},{"pt":"Sprawdź się","quiz":{"tresc":"Dokąd w kroku 2 Kaskady Celów trafiają potrzeby interesariuszy?","opcje":[{"t":"Do celów czynników umożliwiających","w":"To podręcznikowa nazwa celów aktywatora, czyli najniższego poziomu."},{"t":"Do celów organizacji","ok":true,"w":"Dobrze. Potrzeby przekładają się najpierw na cele organizacji."},{"t":"Z powrotem do wyznaczników","w":"Wyznaczniki są wyżej. Kaskada schodzi w dół, a nie w górę."},{"t":"Od razu do celów związanych z informatyką","w":"Potrzeby nie trafiają od razu do IT. Najpierw są cele organizacji."}],"src":"COBIT 5 Framework (PL), s. 17; COBIT 5 Framework (PL), s. 18","pomoc":{"t":"Pytanie dotyczy lekcji 1.18 „Kroki 1–2 kaskady – od wyznaczników do celów organizacji”. Cel lekcji: Potrafię opisać kroki 1 i 2 Kaskady Celów i wskazać, że potrzeby trafiają najpierw do celów organizacji.","k":["cele-organizacji"]}}},{"pt":"Arkusz próbny","sp1":"sp1-18","lekcja":"1.18","temat":"Kroki 1–2 kaskady – od wyznaczników do celów organizacji","k":["cele-organizacji"]},{"pt":"Arkusz próbny","sp1":"sp1-33","lekcja":"1.18","temat":"Kroki 1–2 kaskady – od wyznaczników do celów organizacji","k":["cele-organizacji"]},{"pt":"Lekcje 1.19–1.20","h":"„Związane z Informatyką” to nie „działu IT” – na dole są wszystkie aktywatory","b":"<blockquote>„Związane z IT oznacza <w k=\"informacja\">informacje<\/w> i powiązaną technologię”<\/blockquote><ul><li><w k=\"cele-aktywatorow\">Cele aktywatora<\/w>: procesy, struktury, kultura, ludzie… – nie same procesy.<\/li><li>Kaskada porządkuje cele, nie ludzi – to nie hierarchia ani <w k=\"raci\">RACI<\/w>.<\/li><\/ul>","c":"Tabele podpowiadają, ale priorytety wybiera organizacja – w Przykładzie 1 cztery z siedmiu celów IT.","s":"COBIT 5 Framework (PL), s. 18, 21","ctx":"<p>Krok 3 (s. 18): cele organizacji wymagają określonych rezultatów związanych z IT, a reprezentują je właśnie cele związane z Informatyką – 17 celów uporządkowanych według zrównoważonej karty wyników IT (IT BSC). Cele aktywatora tylko je wspierają. Cel związany z Informatyką może dotyczyć księgowości czy sprzedaży, jeśli opiera się na danych i systemach. Przypis na s. 18 dodaje: rezultaty IT nie są jedynymi pośrednimi korzyściami potrzebnymi do celów organizacji – wpływają na nie też finanse czy marketing – ale COBIT 5 uwzględnia tylko działania i cele związane z IT.<\/p><p>Odpowiedź „cele aktywatora to cele procesów” jest za wąska: Załącznik C mapuje cele IT tylko na procesy, ale podręcznik zaznacza, że „same procesy jednak nie wystarczą” – kultura, struktury organizacyjne i umiejętności też potrzebują jasnych celów. Kaskada nie mówi, kto jest czyim przełożonym ani kto za co odpowiada – to zadanie ról i diagramów RACI.<\/p><p>W Przykładzie 1 Załącznik B podsuwa siedem celów IT z relacją P, a firma „weryfikuje tę listę” i za priorytetowe uznaje pierwsze cztery (01, 04, 07, 09). Urząd postępuje tak samo: z podpowiedzi wybiera to, co dla niego najważniejsze.<\/p>"},{"pt":"Sprawdź się","quiz":{"tresc":"Bank zapisuje: „proces zarządzania uprawnieniami działa co tydzień, a pracownicy przechodzą szkolenie”. Który to poziom kaskady?","opcje":[{"t":"To poziom potrzeb interesariuszy","w":"Potrzeba to oczekiwanie klientów czy regulatora, a nie zadanie dla procesu."},{"t":"To poziom celów organizacji","w":"Cel organizacji byłby jeszcze ogólniejszy, np. zgodność z przepisami."},{"t":"To poziom celów aktywatora","ok":true,"w":"Dobrze. To konkretne cele dla procesu i dla ludzi, czyli dla aktywatorów."},{"t":"To poziom celów związanych z IT","w":"Cel IT byłby ogólniejszy, np. bezpieczeństwo informacji."}],"src":"COBIT 5 Framework (PL), s. 18","pomoc":{"t":"Pytanie dotyczy lekcji 1.19 „Kroki 3–4 kaskady – cele związane z informatyką i cele aktywatora”. Cel lekcji: Potrafię opisać kroki 3 i 4 Kaskady Celów i wyjaśnić, że cele aktywatora dotyczą wszystkich aktywatorów, nie tylko procesów.","k":["cele-zwiazane-z-it","cele-aktywatorow"]}}},{"pt":"Arkusz próbny","sp1":"sp1-26","lekcja":"1.19","temat":"Kroki 3–4 kaskady – cele związane z informatyką i cele aktywatora","k":["cele-zwiazane-z-it","cele-aktywatorow"]},{"pt":"Sprawdź się","quiz":{"tresc":"Które zdanie o Kaskadzie Celów jest prawdziwe?","opcje":[{"t":"Na samym dole obejmuje wyłącznie procesy","w":"Na dole są cele wszystkich aktywatorów."},{"t":"Jest hierarchią służbową organizacji","w":"Kaskada dotyczy celów, a nie podległości służbowej."},{"t":"Jej tabele stosuje się zawsze bez zmian","w":"Tabele to wytyczna, którą trzeba dostosować."},{"t":"Porządkuje cele, a nie ludzi i role","ok":true,"w":"Dobrze. Kaskada mówi, z czego wynika zadanie, a nie kto komu podlega."}],"src":"COBIT 5 Framework (PL), s. 20; COBIT 5 Framework (PL), s. 21","pomoc":{"t":"Pytanie dotyczy lekcji 1.20 „Kaskada Celów w praktyce – Przykład 1 z podręcznika”. Cel lekcji: Potrafię przejść całą Kaskadę Celów na przykładzie z podręcznika i powiedzieć, czym kaskada nie jest.","k":[]}}},{"pt":"Lekcje 1.21–1.22","h":"Wymiar karty wyników rozpoznasz po sensie celu","b":"<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>Cel organizacji<\/th><th>Wymiar <w k=\"bsc\">BSC<\/w><\/th><\/tr><tr><td>4. Zgodność z przepisami prawa<\/td><td>Finanse<\/td><\/tr><tr><td>7. Ciągłość i <w k=\"it-dostepnosc\">dostępność<\/w> usług<\/td><td><w k=\"it-klient\">Klient<\/w><\/td><\/tr><tr><td>15. Zgodność z politykami wewnętrznymi<\/td><td>Obszar wewnętrzny<\/td><\/tr><tr><td>16. Wykwalifikowany personel<\/td><td>Szkolenie i rozwój<\/td><\/tr><\/table><\/div>","c":"„Optymalizacja zasobów” to składnik Celu Ładu, nie wymiar BSC – taka odpowiedź odpada od razu.","s":"COBIT 5 Framework (PL), s. 17–19, Ilustracja 5","ctx":"<p>Zrównoważona karta wyników (<em>Balanced Scorecard<\/em>; Kaplan i Norton) ma cztery wymiary: Finanse, Klient, Obszar wewnętrzny, Szkolenie i rozwój. Każdy z 17 celów organizacji leży w dokładnie jednym; 17 celów związanych z Informatyką ułożono według analogicznej karty IT BSC. Cele układa się według BSC, a nie według pięciu zasad.<\/p><p>Pułapki: dwie „zgodności” leżą w różnych wymiarach (prawo – Finanse, polityki wewnętrzne – Obszar wewnętrzny); ludzie i innowacje to zawsze Szkolenie i rozwój; wymiar Klient działa też tam, gdzie nikt nie płaci wprost – w urzędzie klientem jest mieszkaniec. Odpowiedź spoza czterech wymiarów („Optymalizacja zasobów”, „Ryzyko”) odrzucasz od razu.<\/p><p>Przykład: urząd chce, by mieszkańcy załatwiali sprawy przez internet bez przerw (cel 7 – Klient), wnioski krążyły między wydziałami bez zgubień (Obszar wewnętrzny), a urzędnicy umieli obsłużyć nowy system (cel 16 – Szkolenie i rozwój).<\/p>"},{"pt":"Sprawdź się","quiz":{"tresc":"Według czego COBIT 5 porządkuje 17 celów organizacji?","opcje":[{"t":"Według czterech wymiarów BSC","ok":true,"w":"Dobrze. Cele organizacji opracowano na podstawie wymiarów zrównoważonej karty wyników."},{"t":"Według siedmiu kategorii aktywatorów","w":"Aktywatory to inna kategoria pojęć."},{"t":"Według trzech składników Celu Ładu","w":"Składniki Celu Ładu łączą się z celami przez relacje P i S, ale nie porządkują ich."},{"t":"Według pięciu zasad COBIT 5","w":"Zasady nie służą do porządkowania celów organizacji."}],"src":"COBIT 5 Framework (PL), s. 17; COBIT 5 Framework (PL), s. 18","pomoc":{"t":"Pytanie dotyczy lekcji 1.21 „Zrównoważona karta wyników – cztery wymiary”. Cel lekcji: Potrafię wymienić cztery wymiary zrównoważonej karty wyników i powiedzieć, że według nich COBIT 5 układa cele organizacji.","k":["bsc"]}}},{"pt":"Sprawdź się","quiz":{"tresc":"W którym wymiarze karty wyników leży cel organizacji „Zgodność z przepisami prawa i regulacjami”?","opcje":[{"t":"Optymalizacja ryzyka","w":"To składnik Celu Ładu, a nie wymiar karty wyników."},{"t":"Finanse","ok":true,"w":"Dobrze. Na Ilustracji 5 to cel nr 4 w wymiarze Finanse."},{"t":"Obszar wewnętrzny","w":"Tam leży cel 15, „Zgodność z politykami wewnętrznymi” – to inna zgodność."},{"t":"Klient","w":"Wymiar Klient dotyczy odbiorców usług."}],"src":"COBIT 5 Framework (PL), s. 19","pomoc":{"t":"Pytanie dotyczy lekcji 1.22 „Gdzie leży cel organizacji – wymiar karty po sensie celu”. Cel lekcji: Potrafię przypisać cel organizacji do właściwego wymiaru zrównoważonej karty wyników po jego sensie.","k":[]}}},{"pt":"Lekcja 1.23","h":"P i S: jak mocno cel organizacji wiąże się z korzyściami, ryzykiem i zasobami","b":"<ul><li><b>P<\/b> – relacja podstawowa; <b>S<\/b> – wspierająca, słabsza; puste pole – brak związku.<\/li><li>S ≠ „mniej ważny cel”.<\/li><li>P tutaj ≠ <w k=\"ocena-p\">ocena „Pełny”<\/w> w ocenie procesu.<\/li><\/ul>","c":"Na egzaminie wystarczy logika P/S, nie cała tabela.","s":"COBIT 5 Framework (PL), s. 18–19, Ilustracja 5","ctx":"<p>Kolumny Rysunku 5 to trzy składniki Celu Ładu. Kilka wzorców ułatwia rozumowanie: cel 9 „Świadome podejmowanie decyzji strategicznych na podstawie informacji” jako jedyny ma P przy wszystkich trzech; cele 4 (zgodność z przepisami), 7 (ciągłość i dostępność usług) i 15 (zgodność z politykami wewnętrznymi) mają tylko P przy ryzyku; cel 17 (kultura innowacji) – tylko P przy korzyściach; cel 16 (personel) jako jedyny ma S przy korzyściach.<\/p><p>Te same litery stoją w Załącznikach B i C (cele organizacji → cele IT → procesy) – też tylko dwa stopnie, choć w rzeczywistości powiązania są płynne. W skali ocen atrybutów procesu litera P znaczy „Pełny” – zupełnie inne pojęcie.<\/p><p>Przykład: bank, który łamie przepisy, ryzykuje kary i utratę licencji – dlatego zgodność z prawem (cel 4) ma P przy optymalizacji ryzyka, a nie przy korzyściach.<\/p>"},{"pt":"Sprawdź się","quiz":{"tresc":"Co oznacza litera <b>S<\/b> przy celach organizacji na Rysunku 5?","opcje":[{"t":"Cel z wymiaru Szkolenie i rozwój","w":"Litera S nie oznacza wymiaru karty wyników."},{"t":"Relację strategiczną, czyli najsilniejszą","w":"Najsilniejsza jest relacja P. S jest słabsza."},{"t":"Relację wspierającą, czyli słabszą","ok":true,"w":"Dobrze. Tak podręcznik opisuje literę S."},{"t":"Cel mniej ważny dla organizacji","w":"S mówi o sile związku, a nie o ważności celu."}],"src":"COBIT 5 Framework (PL), s. 18","pomoc":{"t":"Pytanie dotyczy lekcji 1.23 „Litery P i S przy celach organizacji”. Cel lekcji: Potrafię wyjaśnić, że P to relacja podstawowa, a S wspierająca, i że łączą one cele organizacji z trzema składnikami Celu Ładu.","k":[]}}}]};</script>
