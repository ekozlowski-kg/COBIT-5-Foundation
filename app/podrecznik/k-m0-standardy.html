<script>window.DECK={"id":"k-m0-standardy","rozdzial":"Rozdział 1 · Przegląd COBIT 5 · s. 15–16","tytul":"COBIT 5 na tle innych standardów","prev":"01-dlaczego-cobit5.html","next":"k-m0-interesariusze.html","T":{"cobit-5":{"t":"COBIT 5","eg":"COBIT 5","pd":"COBIT 5","en":"COBIT 5","wyj":"Zbiór sprawdzonych reguł z 2012 roku, jak mądrze decydować o informatyce i nią kierować.\n\nCOBIT 5 (ISACA, 2012) opiera się na 5 zasadach (principles), 7 kategoriach aktywatorów (enablers) i modelu referencyjnym 37 procesów: 5 Ładu w domenie EDM i 32 Zarządzania w domenach APO, BAI, DSS i MEA. Kaskada celów przekłada potrzeby interesariuszy na cele organizacji, cele związane z IT i cele aktywatorów. Integruje wcześniejsze wytyczne ISACA (COBIT 4.1, Val IT, Risk IT) i jest spójny z innymi standardami, np. ITIL i ISO/IEC 27001.\n\nŻeby organizacja mogła mądrze kierować informatyką i nią zarządzać: osiągać korzyści przy rozsądnym ryzyku i zużyciu zasobów. Daje jedną, spójną strukturę ramową zamiast wielu luźnych wskazówek.","zycie":"Rodzina ma coraz więcej sprzętu i kont: telefony, laptop, router, bank, zdjęcia w chmurze. Ustalacie, kto decyduje o zakupach, kto pilnuje haseł i kopii, i co miesiąc sprawdzacie, czy wszystko działa i czy nie przepłacacie. COBIT 5 to taki „regulamin domu” dla informatyki, tylko spisany dla firm i urzędów.","firma":"Właściciel warsztatu kupił program do rezerwacji, kasę online i monitoring, ale nie wie, czy to się opłaca i kto za co odpowiada. COBIT 5 podpowiada, jak to poukładać: kto wyznacza kierunek, kto prowadzi codzienne sprawy, jak mierzyć efekty i ryzyko. To gotowa rama, a nie program do zainstalowania.","urzad":"Burmistrz słyszy, że urząd wydaje na informatykę coraz więcej, a mieszkańcy dalej stoją w kolejkach. Sięga po COBIT 5, żeby ustalić, czego chce od systemów, kto w urzędzie za nie odpowiada i jak co roku sprawdzać, czy przynoszą korzyści. COBIT 5 służy tu do uporządkowania Ładu i Zarządzania IT.","it":"Bank po poważnej awarii bankowości internetowej porządkuje IT według COBIT 5: zarząd przejmuje 5 procesów Ładu (EDM01–EDM05), CIO 32 procesy Zarządzania, np. DSS04 Zarządzanie ciągłością, a audyt wewnętrzny ocenia zdolność procesów.","egz":"Liczby do zapamiętania: 5 zasad, 7 aktywatorów, 37 procesów (EDM 5 + APO 13 + BAI 10 + DSS 6 + MEA 3), 6 poziomów zdolności (0–5). Nie myl z: COBIT 2019 – Nowsza wersja (2018/2019) – inne pojęcia (komponenty, 40 celów, czynniki projektowe). Egzamin COBIT 5 Foundation dotyczy COBIT 5.; ITIL – ITIL to dobre praktyki zarządzania usługami IT – jak dostarczać usługi. COBIT patrzy szerzej: Ład i Zarządzanie całością IT w organizacji.; ISO/IEC 27001 – ISO/IEC 27001 to norma bezpieczeństwa informacji z certyfikacją; COBIT 5 to struktura ramowa Ładu i Zarządzania IT.","src":"COBIT 5 Framework (PL), s. 90"},"itil":{"t":"ITIL","eg":"ITIL","pd":"ITIL (Information Technology Infrastructure Library)","en":"ITIL","wyj":"Zbiór dobrych praktyk o tym, jak na co dzień prowadzić usługi informatyczne, np. pomoc dla użytkowników.\n\nITIL opisuje dobre praktyki zarządzania usługami IT (IT Service Management), np. obsługi incydentów (incident management), problemów (problem management) i zmian (change management). Dział IT dopasowuje te praktyki do siebie. COBIT 5 jest z ITIL dopasowany i patrzy wyżej: czy usługi IT wspierają cele organizacji i kto za to odpowiada.\n\nŻeby dział IT świadczył usługi przewidywalnie: wiedział, jak przyjmować zgłoszenia, usuwać awarie i wprowadzać zmiany bez chaosu.","zycie":"W domu ciągle coś się psuje, a każdy dzwoni z tym do taty w pracy. W końcu ustalacie: usterkę zapisujesz na kartce na lodówce, pilne (cieknie woda) naprawia się od razu, reszta czeka do soboty, a po naprawie się ją odhacza. Taki porządek w obsłudze usterek to w pigułce to, co ITIL opisuje dla usług IT.","firma":"W sklepie internetowym pracownik zgłasza, że nie działa drukarka etykiet. Dostaje numer zgłoszenia, informatyk wie, że „nie da się wysłać paczek” ma pierwszeństwo przed „wolno działa poczta”, a po naprawie sprawdza, dlaczego drukarka pada co tydzień. Te reguły przyjmowania zgłoszeń, ustalania priorytetów i szukania przyczyn to praktyki ITIL.","urzad":"Urzędniczka w wydziale komunikacji starostwa nie może zalogować się do systemu, a w kolejce stoi dziesięć osób. Dzwoni pod wewnętrzny numer pomocy, zgłoszenie dostaje priorytet „pilne”, bo stoi obsługa mieszkańców, i informatyk oddzwania w kwadrans. Takie ułożenie obsługi zgłoszeń i priorytetów to dobre praktyki ITIL.","it":"DSS02 (Zarządzanie zgłoszeniami serwisowymi i incydentami) organizacja realizuje według praktyk ITIL dla incydentów, a DSS03 (Zarządzanie problemami) według praktyk zarządzania problemami. COBIT 5 dokłada do tego cele, mierniki i odpowiedzialności RACI.","egz":"Na egzaminie ITIL pojawia się tylko jako przykład standardu integrowanego przez COBIT 5 (Zasada 3). Nie myl z: COBIT 5 – COBIT: Ład i Zarządzanie IT w całej organizacji; ITIL: zarządzanie usługami IT.","src":"COBIT 5 Framework (PL), s. 15"},"iso-27001":{"t":"ISO/IEC 27001","eg":"ISO/IEC 27001","pd":"ISO/IEC serii 27000","en":"ISO/IEC 27001","wyj":"Międzynarodowa norma o tym, jak chronić informacje przed wyciekiem, utratą i zniszczeniem.\n\nNorma opisuje system zarządzania bezpieczeństwem informacji (ISMS, Information Security Management System): organizacja ocenia ryzyka dla informacji, dobiera zabezpieczenia (controls), wdraża je, regularnie sprawdza i poprawia. Niezależna jednostka certyfikująca audytuje ten system i wydaje certyfikat. COBIT 5 certyfikatu nie daje, ale jest z ISO/IEC 27001 dopasowany (Zasada 3).\n\nŻeby organizacja miała uporządkowany, sprawdzalny sposób chronienia informacji i mogła to potwierdzić certyfikatem przed klientami i partnerami.","zycie":"Po kradzieży roweru z piwnicy rodzina siada i spisuje zasady: kto ma klucze, gdzie leżą dokumenty, co robimy, gdy ktoś zgubi klucz, a raz w roku sprawdzamy, czy to działa. To domowy system zarządzania bezpieczeństwem – ISO 27001 opisuje jego wersję dla firm i urzędów.","firma":"Biuro rachunkowe trzyma PIT-y i listy płac setek klientów. Właścicielka wprowadza zasady: hasła, szyfrowane laptopy, zamykana szafa na dokumenty, procedura na wypadek wycieku, a raz w roku przychodzi audytor i potwierdza certyfikat ISO 27001. Klient widzi certyfikat i wie, że jego dane są chronione według uznanej normy.","urzad":"Urząd gminy trzyma w systemach dane meldunkowe, podatkowe i dane o pomocy społecznej. Sekretarz wprowadza politykę: kto ma dostęp do czego, co robić po zgubieniu pendrive’a, jak zgłosić incydent, i co roku ją przegląda. KRI każe opierać takie zasady na normach z rodziny ISO 27000 – to właśnie system zarządzania bezpieczeństwem informacji.","it":"W APO13 (Zarządzanie bezpieczeństwem) organizacja ustanawia i utrzymuje ISMS, a szczegółowe zabezpieczenia dobiera według ISO/IEC 27001. COBIT 5 mówi, po co i kto odpowiada, a norma podaje szczegóły.","egz":"Tylko jako przykład normy, z którą COBIT 5 jest zgodny (integrator). Nie myl z: COBIT 5 – ISO/IEC 27001 – bezpieczeństwo informacji, certyfikacja. COBIT 5 – całościowy Ład i Zarządzanie IT.","src":"COBIT 5 Framework (PL), s. 15; COBIT 5 Framework (PL), s. 60"},"it-usluga-it":{"t":"Usługa IT","eg":"Usługa IT","pd":"Usługi IT","en":"IT service","wyj":"To, co informatyka daje ludziom do pracy, np. „poczta działa”, „płatność przechodzi”.\n\nInformatycy łączą sprzęt, sieć, serwery i aplikacje. Ustalają, kiedy usługa ma działać i kto pomaga przy kłopotach. Użytkownik po prostu korzysta, a gdy coś nie działa, zgłasza to.\n\nŻeby ludzie mogli robić swoją pracę, nie znając się na komputerach.","zycie":"Bankowość internetowa to usługa: możesz zapłacić rachunek o północy. Nie musisz wiedzieć, gdzie stoją serwery banku.","firma":"Uczelnia daje studentom usługę „poczta i oceny w Internecie”. Za nią stoją serwery, aplikacje i dział informatyki.","urzad":"Zakład Ubezpieczeń Społecznych (ZUS) daje klientom usługę: przez Platformę Usług Elektronicznych można sprawdzić swoje składki i wysłać wniosek, także wieczorem. Za tą usługą stoją serwery, aplikacje, sieć i infolinia pomocy technicznej. Klienta nie interesuje, który serwer go obsługuje – ważne, że wniosek da się wysłać.","it":"FW-PL definiuje usługi IT jako codzienne zapewnianie infrastruktury, aplikacji i wsparcia (s. 92); są częścią aktywatora Usługi, infrastruktura i aplikacje.","egz":"Usługi IT to część aktywatora Usługi, infrastruktura i aplikacje (FW-PL s. 27, 85). Na egzaminie pamiętaj: usługa to efekt dla użytkownika, a infrastruktura i aplikacje to jej składniki. Nie myl z: Aplikacja – Aplikacja to narzędzie. Usługa to efekt dla użytkownika z aplikacji, sprzętu i wsparcia razem.; Usługi, Infrastruktura i Aplikacje – Aktywator COBIT 5 obejmuje usługi oraz infrastrukturę i aplikacje, które je tworzą. To hasło opisuje samą usługę.","src":"COBIT 5 Framework (PL), s. 92; COBIT 5 Framework (PL), s. 27"},"cobit-2019":{"t":"COBIT 2019","eg":"COBIT 2019","pd":"—","en":"COBIT 2019","wyj":"Nowsza wersja COBIT z innymi nazwami; nie myl jej z COBIT 5, z którego jest egzamin.\n\nCOBIT 2019 zastępuje aktywatory komponentami systemu ładu (components), zamiast 37 procesów ma 40 celów Ładu i Zarządzania (governance and management objectives) i dodaje czynniki projektowe (design factors). Nowe cele to m.in. APO14 (dane), BAI11 (projekty) i MEA04 (zapewnienie). Gdy w odpowiedzi pada „komponent”, „40 celów” albo „czynnik projektowy”, odpowiedź nie dotyczy COBIT 5.\n\nTo hasło ostrzegawcze: pomaga rozpoznać pojęcia z nowszej wersji, które na egzaminie COBIT 5 Foundation są błędnymi odpowiedziami.","zycie":"Kupujesz używany samochód i dostajesz instrukcję do nowszego modelu. Przyciski są podobne, ale część nazw i funkcji się różni, więc instrukcja myli zamiast pomagać. Tak działa nauka do egzaminu COBIT 5 z materiałów o COBIT 2019.","firma":"Bank zatrudnia konsultanta do przygotowania pracowników do egzaminu COBIT 5 Foundation. Konsultant uczy z najnowszych materiałów i mówi o „celach Ładu i Zarządzania” zamiast o 37 procesach. Na egzaminie część osób wybiera odpowiedzi w języku COBIT 2019 i traci punkty, choć znała temat.","urzad":"Urząd marszałkowski zamawia audyt informatyki oparty na COBIT 5. Audytor przysyła raport pełen „komponentów”, „40 celów Ładu i Zarządzania” i „czynników projektowych”. Kierowniczka wydziału informatyki odsyła raport do poprawy, bo to słownictwo COBIT 2019, a nie wersji z zamówienia.","it":"W COBIT 5 zarządzanie ryzykiem to proces APO12 Zarządzanie ryzykiem, a w COBIT 2019 to cel zarządczy APO12 Managed Risk. Na egzaminie COBIT 5 poprawne jest słowo „proces”, a nie „cel zarządczy” (management objective).","egz":"Jeśli odpowiedź mówi o „40 celach”, „komponentach systemu ładu” albo „czynnikach projektowych”, to jest COBIT 2019, a więc zła odpowiedź. Materiały o COBIT 2019 są w internecie częstsze niż o COBIT 5. Nie ucz się z nich: inne pojęcia (40 celów, „komponenty”, czynniki projektowe) dają złe odpowiedzi na egzaminie COBIT 5. Nie myl z: COBIT 5 – COBIT 5: 5 zasad, 7 aktywatorów, 37 procesów.","src":"WWW"},"proces":{"t":"Proces","eg":"Proces","pd":"Proces","en":"Process","wyj":"Coś, co robimy regularnie i zawsze w podobny sposób, np. przyjmowanie każdego zgłoszenia.\n\nProces (process) przyjmuje wejścia (inputs), przetwarza je przez praktyki i działania ukierunkowane przez polityki i procedury i daje wyniki (outputs), np. produkt albo usługę. Ma właściciela, role i mierniki, a wynik jednego procesu bywa wejściem innego. W COBIT 5 procesy są jednym z siedmiu aktywatorów, a Referencyjny Model Procesu opisuje ich 37.\n\nŻeby powtarzalną pracę wykonywać za każdym razem tak samo dobrze, niezależnie od tego, kto ją akurat robi, i żeby dało się ją mierzyć i poprawiać.","zycie":"Co sobotę rano sprawdzasz lodówkę, piszesz listę, jedziesz do sklepu, rozpakowujesz i odhaczasz, czego zabrakło. Za tydzień wszystko powtarza się od nowa. To proces: stałe kroki, wejście (pusta lodówka i lista) i wynik (pełna lodówka).","firma":"W sklepie internetowym z herbatą przychodzi zamówienie, pracownik pakuje paczkę, drukuje etykietę i fakturę, a kurier odbiera paczki o 15:00. Tak samo dzieje się z każdym zamówieniem, codziennie. To proces – powtarzalny, z wejściem (zamówienie) i wynikiem (paczka u klienta).","urzad":"Do urzędu gminy wpływa wniosek o wycinkę drzewa. Kancelaria go rejestruje, kierownik przydziela go referentowi, ten jedzie na oględziny i wydaje decyzję. Każdy kolejny wniosek idzie tą samą ścieżką – to jest proces.","it":"DSS02 (Zarządzanie zgłoszeniami serwisowymi i incydentami) to proces: każde zgłoszenie (wejście) jest rejestrowane, klasyfikowane, rozwiązywane i zamykane (praktyki), a wynikiem jest przywrócona usługa i wpis w rejestrze. Działa codziennie i tak samo dla każdego zgłoszenia.","egz":"Opis „zbiór praktyk ukierunkowanych politykami i procedurami, który przetwarza wejścia w wyniki” to Proces (Załącznik H). Nie myl z: Projekt – Projekt jest jednorazowy, ma początek i koniec (np. wdrożenie systemu). Proces trwa i się powtarza (np. obsługa zgłoszeń w tym systemie).","src":"COBIT 5 Framework (PL), s. 93"},"aktywator":{"t":"Aktywator","eg":"Aktywator","pd":"Czynnik umożliwiający","en":"Enabler","wyj":"Wszystko, co musi zagrać, żeby informatyka działała dobrze: ludzie, reguły, narzędzia, informacje.\n\nCOBIT 5 dzieli aktywatory (enablers) na 7 kategorii, od Zasad, polityk i struktur ramowych (Principles, Policies and Frameworks) po Ludzi, umiejętności i kompetencje (People, Skills and Competencies). Kaskada celów wyznacza, czego oczekujemy od każdego aktywatora (cele aktywatora). Aktywatory są od siebie zależne i dostarczają sobie wejść, np. proces potrzebuje informacji i przeszkolonych ludzi. Każdy opisuje się w 4 wymiarach: interesariusze, cele, cykl życia, dobre praktyki.\n\nŻeby organizacja widziała wszystko, co musi zagrać, by osiągnąć cele, a nie tylko technologię. Aktywatory to elementy, przez które Ład i Zarządzanie realnie wpływają na wynik.","zycie":"Chcesz, żeby dzieci same odrabiały lekcje. Ustalacie zasadę „najpierw zadania, potem tablet”, stałą godzinę po obiedzie, kupujecie biurko z lampką, a Ty w tym czasie też siadasz z książką zamiast z telefonem. Zasada, stała pora, biurko i Twój przykład to różne aktywatory – działają dopiero razem.","firma":"Właścicielka kawiarni chce, żeby kawa smakowała tak samo na każdej zmianie. Spisuje recepturę, ustala kolejność parzenia, szkoli nowego baristę i oddaje ekspres do serwisu. Receptura, sposób parzenia, umiejętności baristy i ekspres to aktywatory – brak jednego psuje całość.","urzad":"Urząd gminy chce wydawać decyzje w terminie. Ma instrukcję kancelaryjną, ustalony obieg wniosku, wydział, który za sprawę odpowiada, system EZD i urzędników po szkoleniu z KPA. Każdy z tych elementów to aktywator innej kategorii.","it":"Proces DSS04 Zarządzanie ciągłością to aktywator z kategorii Procesy, ale działa tylko razem z innymi: polityką ciągłości (Zasady, polityki i struktury ramowe), aktualnym planem awaryjnym (Informacja), stanowiskiem zapasowym (Usługi, infrastruktura i aplikacje) i przećwiczonym zespołem (Ludzie, umiejętności i kompetencje).","egz":"Pułapka terminologiczna nr 1 obok Ład/Nadzór. Liczba kategorii: 7. Liczba zasad: 5. Liczba procesów: 37. Egzamin: „Aktywator”. Podręcznik: „Czynnik umożliwiający”. EN: Enabler. W pytaniach egzaminacyjnych prawie zawsze pada „Aktywator”. Nie myl z: Czynnik wpływający na potrzeby interesariuszy – Wyznacznik zmienia potrzeby; aktywator pomaga je zaspokoić.; Komponent (COBIT 2019) – W COBIT 2019 aktywatory nazwano „komponentami systemu ładu”. Na egzaminie COBIT 5 używaj „aktywator”.","src":"COBIT 5 Framework (PL), s. 14; COBIT 5 Framework (PL), s. 91; materiały Altkom"}},"S":[{"lekcje":["m0-30-cobit-laczy-standardy","m0-31-itil-iso-27001"],"pt":"Lekcje 0.30–0.31","h":"COBIT 5 spina inne standardy – nie zastępuje ich","b":"<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>Standard<\/th><th>Odpowiada na pytanie<\/th><\/tr><tr><td><w k=\"cobit-5\">COBIT 5<\/w><\/td><td>Czy IT daje wartość i kto decyduje?<\/td><\/tr><tr><td><w k=\"itil\">ITIL<\/w><\/td><td>Jak świadczyć <w k=\"it-usluga-it\">usługi IT<\/w>?<\/td><\/tr><tr><td><w k=\"iso-27001\">ISO/IEC 27001<\/w><\/td><td>Jak chronić informację?<\/td><\/tr><\/table><\/div><p>Organizacji nie certyfikuje się „na COBIT 5”.<\/p>","c":"COBIT 5 integruje – dystraktor mówi „zastępuje”.","s":"COBIT 5 Framework (PL), s. 14, 25, 60","ctx":"<p>Zasada 3: COBIT 5 jest spójny z innymi standardami, więc organizacja może go wykorzystać jako „nadrzędną strukturę nadzoru” nad IT, „umożliwiającą integrację innych metodyk” (s. 25). Integrować znaczy łączyć – każdy standard zostaje w swoim obszarze, a COBIT 5 pokazuje, gdzie pasuje (mapowanie na domeny omawia rozdział 1).<\/p><p>Pułapki: ITIL to nie inna nazwa COBIT 5, tylko węższy zbiór praktyk zarządzania usługami IT. Certyfikat zgodności z ISO/IEC 27001 może uzyskać organizacja (wiedza ogólna), COBIT 5 takiego certyfikatu dla organizacji nie przewiduje. ISACA oferuje cztery certyfikaty dla specjalistów – CGEIT, CISA, CISM, CRISC (s. 60); certyfikat COBIT 5 Foundation też dostaje osoba.<\/p><p>Przykład: bank dalej obsługuje zgłoszenia według ITIL i chroni dane według ISO/IEC 27001. COBIT 5 dokłada odpowiedź, po co to robi i kto za całość odpowiada.<\/p><p>W kursach z internetu obok COBIT pojawiają się też inne ramy (wiedza ogólna, poza egzaminem): COSO (kontrola wewnętrzna), CMMI (dojrzałość procesów), FAIR (ilościowa analiza ryzyka informacyjnego) i australijska norma AS 8015-2005 o ładzie korporacyjnym w obszarze ICT, na której oparto ISO/IEC 38500. Na egzaminie wystarczy wiedzieć, że COBIT 5 jest strukturą nadrzędną, która takie standardy porządkuje, a nie zastępuje.<\/p>"},{"pt":"Sprawdź się","quiz":{"id":"q-m0k-30-2","sylabus":["M0-00-07"],"tresc":"Firma ubezpieczeniowa od lat stosuje metodykę prowadzenia projektów i normę ochrony danych. Teraz przyjmuje COBIT 5. Co powinna zrobić z dotychczasowymi standardami?","opcje":[{"t":"Dalej je stosować, a COBIT 5 połączy je w jedną ramę","ok":true,"w":"Tak. COBIT 5 jest strukturą nadrzędną, która umożliwia integrację innych metodyk."},{"t":"Odłożyć COBIT 5, dopóki stare standardy nie wygasną","w":"Nie ma takiej potrzeby. COBIT 5 współgra z innymi standardami."},{"t":"Wycofać je, bo COBIT 5 zastępuje inne standardy","w":"To odwrócenie prawdy. COBIT 5 integruje standardy, a nie je zastępuje."},{"t":"Stosować je tylko w dziale IT, a COBIT 5 tylko w zarządzie","w":"COBIT 5 obejmuje całą organizację. Nie dzieli się go w ten sposób."}],"src":"COBIT 5 Framework (PL), s. 25","pomoc":{"t":"Pytanie dotyczy lekcji 0.30 „COBIT 5 łączy inne standardy”. Cel lekcji: Potrafię wyjaśnić, że COBIT 5 łączy inne standardy w jedną ramę, a nie je zastępuje.","k":[]}}},{"pt":"Sprawdź się","quiz":{"id":"q-m0k-31-2","sylabus":["M0-00-07"],"tresc":"Sklep internetowy chce uzyskać certyfikat, który potwierdzi, że dobrze chroni dane klientów. Zgodność z czym może potwierdzić taki certyfikat?","opcje":[{"t":"Z sylabusem COBIT 5 Foundation","w":"Sylabus to spis tematów egzaminu dla osób, a nie norma dla firm."},{"t":"Z normą <w k=\"iso-27001\">ISO/IEC 27001<\/w>","ok":true,"w":"Tak. To norma bezpieczeństwa informacji, z którą organizacja może się certyfikować."},{"t":"Z COBIT 5","w":"COBIT 5 nie przewiduje certyfikatu dla organizacji. Certyfikaty ISACA dotyczą osób."},{"t":"Z ITIL jako normą bezpieczeństwa danych","w":"ITIL dotyczy usług IT, a nie bezpieczeństwa informacji."}],"src":"COBIT 5 Framework (PL), s. 60","pomoc":{"t":"Pytanie dotyczy lekcji 0.31 „ITIL i ISO/IEC 27001 obok COBIT 5”. Cel lekcji: Potrafię odróżnić COBIT 5 od ITIL i ISO/IEC 27001 i powiedzieć, na jakie pytanie odpowiada każdy z nich.","k":["itil","iso-27001"]}}},{"lekcje":["m0-32-liczby-cobit-5"],"pt":"Lekcja 0.32","h":"5 – 7 – 37: po tych liczbach poznasz COBIT 5","b":"<ul><li><b>5<\/b> zasad<\/li><li><b>7<\/b> kategorii <w k=\"aktywator\">aktywatorów<\/w> <span class=\"en\">Enablers<\/span><\/li><li><b>37<\/b> <w k=\"proces\">procesów<\/w> (5 Ładu + 32 Zarządzania)<\/li><\/ul><p>„40 celów” albo „czynniki projektowe” <span class=\"en\">design factors<\/span> = <w k=\"cobit-2019\">COBIT 2019<\/w> – zła odpowiedź.<\/p>","c":"Egzamin Foundation dotyczy wyłącznie COBIT 5.","s":"COBIT 5 Framework (PL), s. 14, 33","ctx":"<p>Strona 14 podręcznika wymienia pięć zasad i siedem kategorii czynników umożliwiających (na egzaminie: aktywatorów), a s. 33 – pełny zestaw 37 procesów. Te trzy liczby to najszybszy test, czy materiał, z którego się uczysz, dotyczy właściwej wersji.<\/p><p>COBIT 2019 to nowsza wersja ramy ISACA z innym słownictwem: 40 celów Ładu i Zarządzania, komponenty systemu ładu, czynniki projektowe (wiedza ogólna). Na egzaminie COBIT 5 takie pojęcia są dystraktorami, nawet jeśli brzmią nowocześnie.<\/p><p>Przykład: dział szkoleń firmy kupuje kurs „COBIT w pigułce”, a pracownicy uczą się listy 40 celów. Wystarczyło przed zakupem sprawdzić spis treści: brak 37 procesów oznacza inną wersję.<\/p>"},{"pt":"Sprawdź się","quiz":{"id":"q-m0k-32-3","sylabus":["M0-00-07"],"tresc":"Ile procesów Ładu i Zarządzania opisuje COBIT 5?","opcje":[{"t":"40","w":"40 celów Ładu i Zarządzania to pojęcie z COBIT 2019."},{"t":"5","w":"Tyle jest procesów Ładu (albo zasad). Wszystkich procesów jest więcej."},{"t":"37","ok":true,"w":"Tak. COBIT 5 ma pełny zestaw 37 procesów: 5 Ładu i 32 Zarządzania."},{"t":"32","w":"To tylko procesy Zarządzania. Brakuje 5 procesów Ładu."}],"src":"COBIT 5 Framework (PL), s. 33; COBIT 5 Framework (PL), s. 60","pomoc":{"t":"Pytanie dotyczy lekcji 0.32 „Liczby COBIT 5 i pułapka COBIT 2019”. Cel lekcji: Potrafię podać liczby COBIT 5 (5 zasad, 7 kategorii aktywatorów, 37 procesów) i rozpoznać materiał o COBIT 2019.","k":["cobit-2019"]}}}]};</script>
