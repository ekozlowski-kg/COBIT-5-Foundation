<script>window.DECK={"id":"k-pr-wydajnosc","rozdzial":"Rozdział 5 · Zasada 4: Aktywacja holistycznego podejścia · s. 27–30","tytul":"Wydajność aktywatora i wskaźniki","prev":"k-pr-wymiary.html","next":"k-m0-lad.html","T":{"dobre-praktyki":{"t":"Dobre praktyki","eg":"Dobre praktyki","pd":"Dobre praktyki","en":"Good practices","wyj":"Sprawdzone sposoby robienia czegoś, które zadziałały u innych, więc nie trzeba wymyślać od nowa.\n\nDobre praktyki (good practices) to jeden z czterech wymiarów każdego aktywatora, obok interesariuszy, celów i cyklu życia. Podają przykłady lub sugestie, jak najlepiej wdrożyć aktywator, oraz wymagane produkty działań (work products), czyli dane wejściowe i wyniki (inputs and outputs). Dla procesów COBIT 5 podaje je w publikacji „Procesy umożliwiające” (Enabling Processes), a dla innych aktywatorów odsyła też do innych standardów.\n\nŻeby nie wymyślać wszystkiego od nowa, tylko korzystać ze sposobów, które sprawdziły się w wielu organizacjach. Dobre praktyki wspierają osiąganie celów aktywatora.","zycie":"Babcia lepi pierogi zawsze tak samo: mąka, woda i jajko, ciasto odpoczywa pół godziny, farsz robi się dzień wcześniej. Dostajesz od niej kartkę z listą składników (wejścia) i opisem, jak mają wyglądać gotowe pierogi (wynik). Ten sprawdzony przez lata sposób to dobra praktyka.","firma":"Sieć trzech sklepów rowerowych ma jedną checklistę otwarcia: włączyć kasę, przeliczyć gotówkę, uruchomić terminal, wystawić rowery testowe. Na wejściu jest raport z zamknięcia z poprzedniego dnia, na wyjściu podpisana lista. Sposób sprawdzony we wszystkich punktach to dobra praktyka.","urzad":"Nowy pracownik urzędu dostaje skargę mieszkańca i nie wie, co z nią zrobić. Kierowniczka daje mu wzorcową procedurę: rejestracja w EZD, przekazanie do właściwego wydziału, odpowiedź w ciągu miesiąca zgodnie z KPA. Na wejściu jest skarga, na wyjściu pismo z odpowiedzią – to dobra praktyka z gotowymi produktami działań.","it":"Dla procesu DSS02 Zarządzanie zgłoszeniami serwisowymi i incydentami publikacja „Procesy umożliwiające” podaje praktyki, np. rejestrowanie, klasyfikowanie i nadawanie priorytetu zgłoszeniom, wraz z wejściami i wyjściami, np. raportami o zgłoszeniach. To dobre praktyki aktywatora Procesy.","egz":"„Czy stosowane są dobre praktyki?” → mierzone wskaźnikiem wiodącym (s. 29). Nie myl z: Czynnik wpływający na potrzeby interesariuszy – Dobre praktyki to wymiar aktywatora. Nie wpływają na potrzeby interesariuszy.","src":"COBIT 5 Framework (PL), s. 29, 91"},"wskaznik-wiodacy":{"t":"Wskaźnik wiodący","eg":"Wskaźnik wiodący","pd":"Wskaźnik wyprzedzający","en":"Lead indicator","wyj":"Liczba, która ostrzega wcześniej, czy idziemy w dobrą stronę, np. ile godzin się uczysz.\n\nDwa ostatnie z czterech pytań zarządzania wydajnością aktywatora (enabler performance management) dotyczą jego funkcjonowania: czy cykl życia aktywatora jest zarządzany i czy stosowane są dobre praktyki. Mierniki, które na nie odpowiadają, to wskaźniki wiodące (lead indicators). Przewidują przyszły wynik, który potem pokażą wskaźniki opóźnione (lag indicators).\n\nŻeby wcześnie, zanim pojawi się wynik, zobaczyć, czy aktywator działa jak trzeba, i zdążyć to poprawić.","zycie":"Za trzy miesiące biegniesz półmaraton. Co tydzień sprawdzasz, czy zrobiłeś zaplanowane cztery treningi. Jeśli od miesiąca wychodzą dwa, już wiesz, że wynik będzie słaby, i możesz to jeszcze zmienić – to wskaźnik wiodący.","firma":"Właściciel warsztatu samochodowego sprawdza, czy mechanicy wypełniają listę kontrolną przy każdym aucie. Jeśli połowa ją pomija, spodziewa się reklamacji, zanim te przyjdą, i od razu reaguje – to wskaźnik wiodący.","urzad":"Tydzień przed wejściem nowej procedury w urzędzie gminy sekretarz sprawdza, ilu urzędników przeszło szkolenie. Jest 60%, więc wie, że będą kłopoty, zanim wpłynie pierwsza skarga – to wskaźnik wiodący.","it":"W BAI06 (Zarządzanie zmianami) odsetek zmian wdrażanych po zatwierdzeniu i z planem wycofania to wskaźnik wiodący. Gdy spada, można przewidzieć więcej incydentów w DSS02 (Zarządzanie zgłoszeniami serwisowymi i incydentami), zanim one wystąpią.","egz":"Wskaźnik wiodący mierzy, czy cykl życia jest zarządzany i czy stosowane są dobre praktyki. Osiągnięcie celów i uwzględnienie potrzeb mierzą wskaźniki opóźnione (s. 29). Egzamin: „Wskaźniki wiodące”. Podręcznik: „Wskaźniki wyprzedzające”. Nie myl z: Wskaźnik opóźniony – Opóźniony mierzy wynik, czyli osiągnięcie celów i zaspokojenie potrzeb.","src":"COBIT 5 Framework (PL), s. 29"},"wskaznik-opozniony":{"t":"Wskaźnik opóźniony","eg":"Wskaźnik opóźniony","pd":"Wskaźnik następujący","en":"Lag indicator","wyj":"Liczba, którą widać dopiero po fakcie i która mówi, czy cel się udał, np. wynik sprawdzianu.\n\nZarządzanie wydajnością aktywatora (enabler performance management) zadaje cztery pytania. Dwa pierwsze dotyczą wyniku: czy potrzeby interesariuszy są uwzględnione i czy cele aktywatora są osiągane. Mierniki, które na nie odpowiadają, to wskaźniki opóźnione (lag indicators). Pokazują to, co już się stało, więc służą do rozliczenia i wniosków na przyszłość.\n\nŻeby po fakcie sprawdzić, czy aktywator dał to, co miał dać: czy cele osiągnięto i czy potrzeby interesariuszy są uwzględnione.","zycie":"Miesiąc temu zacząłeś dietę. Dziś stajesz na wadze i widzisz minus 3 kg. Waga nie powie Ci, co robić jutro, tylko pokazuje, co już się stało – to wskaźnik opóźniony.","firma":"Właścicielka sklepu internetowego na koniec kwartału otwiera raport: przychód wzrósł o 10%. Na ten wynik nic już nie poradzi, może tylko wyciągnąć wnioski na następny kwartał – to wskaźnik opóźniony.","urzad":"W styczniu kierownik wydziału komunikacji w starostwie liczy, ile rejestracji pojazdów załatwiono w zeszłym roku w terminie. Wynik pokazuje, czy ubiegłoroczny cel osiągnięto, ale niczego w tamtym roku już nie zmieni – to wskaźnik opóźniony.","it":"W DSS02 (Zarządzanie zgłoszeniami serwisowymi i incydentami) odsetek incydentów rozwiązanych za kwartał w uzgodnionym czasie to wskaźnik opóźniony: mówi, czy cel osiągnięto. Taki wynik raportuje się m.in. w MEA01 (Monitorowanie, ocena i oszacowanie wydajności i zgodności).","egz":"Pytania o osiągnięcie celów i uwzględnienie potrzeb → wskaźniki opóźnione. Egzamin: „Wskaźniki opóźnione”. Podręcznik: „Wskaźniki następujące”. Nie myl z: Wskaźnik wiodący – Wiodący mierzy, czy aktywator działa właściwie: cykl życia i dobre praktyki. Przewiduje wynik.","src":"COBIT 5 Framework (PL), s. 29"},"zarzadzanie-wydajnoscia-aktywatora":{"t":"Zarządzanie wydajnością aktywatora","eg":"Zarządzanie wydajnością aktywatora","pd":"Zarządzanie sprawnością czynnika umożliwiającego","en":"Enabler performance management","wyj":"Sprawdzanie liczbami, czy dana część układanki działa i czy zmierza w dobrą stronę.\n\nZarządzanie wydajnością aktywatora (enabler performance management) to regularne odpowiadanie na cztery pytania: czy potrzeby interesariuszy są uwzględnione, czy cele aktywatora są osiągane, czy cykl życia jest zarządzany i czy stosowane są dobre praktyki. Pytania 1–2 dotyczą wyniku i mierzą je wskaźniki opóźnione (lag indicators). Pytania 3–4 dotyczą funkcjonowania aktywatora i mierzą je wskaźniki wiodące (lead indicators).\n\nŻeby regularnie sprawdzać, czy aktywator działa i daje wynik, zamiast zakładać, że skoro go wdrożono, to działa.","zycie":"Od trzech miesięcy rodzina je według nowego planu posiłków. Pytacie: czy wszyscy są zadowoleni, czy tata schudł zakładane 5 kg, czy plan jest co tydzień aktualizowany i czy trzymacie się zaleceń dietetyka. Dwa pierwsze pytania sprawdzają wynik, dwa ostatnie – samo działanie.","firma":"Właścicielka kawiarni po pół roku ocenia kartę lojalnościową. Sprawdza, czy klienci ją lubią, czy wracają częściej, czy oferta na karcie jest odświeżana i czy program działa tak jak w sprawdzonych kawiarniach. Te cztery pytania to zarządzanie wydajnością aktywatora.","urzad":"Urząd gminy po roku przegląda e-usługę zgłaszania dzikich wysypisk. Pyta mieszkańców o zadowolenie, liczy sprawy załatwione online, sprawdza, czy usługę regularnie poprawiano, i czy spełnia wytyczne dostępności. Wynik i działanie sprawdza się tymi samymi czterema pytaniami.","it":"Dla procesu DSS02 (Zarządzanie zgłoszeniami serwisowymi i incydentami) zadowolenie użytkowników i odsetek incydentów rozwiązanych w terminie to wskaźniki opóźnione. Regularny przegląd procesu i rejestrowanie każdego zgłoszenia według procedury to wskaźniki wiodące.","egz":"Znaj cztery pytania dosłownie (s. 29). Pytania o bezpieczeństwo, efektywność czy „zarządzanie ładem” nie należą do modelu. „Performance” to w podręczniku „sprawność”, a na egzaminie „wydajność”. Nie myl z: Zarządzanie wydajnością (PA 2.1) – Atrybut procesu na poziomie zdolności 2 (dzień 4). Nazwa podobna, ale inny model.","src":"COBIT 5 Framework (PL), s. 28, 29"},"cele-aktywatorow":{"t":"Cele aktywatora","eg":"Cele aktywatora","pd":"Cele czynników umożliwiających","en":"Enabler goals","wyj":"Konkretne, sprawdzalne cele dla każdej „części układanki”, np. dla danych: mają być aktualne.\n\nTo czwarty krok kaskady celów (goals cascade): potrzeby interesariuszy → cele organizacji → cele związane z IT → cele aktywatora. Dla każdego aktywatora określa się cele, które wspierają cele związane z IT; najczęściej są to cele procesów, a mapowanie celów IT na procesy podaje Załącznik C. Cele są też jednym z czterech wymiarów aktywatora i dzielą się na kategorie: jakość wewnętrzna, jakość kontekstowa oraz dostęp i bezpieczeństwo.\n\nŻeby cel związany z IT przełożyć na konkretne, sprawdzalne oczekiwania wobec każdego aktywatora: procesu, polityki, struktury, informacji czy ludzi.","zycie":"Chcesz, żeby zdjęcia rodzinne nie zginęły, gdy padnie laptop. Ustalasz konkretnie: kopia na dysk zewnętrzny pierwszego dnia miesiąca (cel dla procesu) i każdy domownik umie odzyskać zdjęcie z kopii (cel dla ludzi). Takie małe, sprawdzalne cele dla poszczególnych „narzędzi” to cele aktywatorów.","firma":"Sklep internetowy ma cel IT: system zamówień ma działać. Właściciel rozpisuje go na kawałki: awaria usunięta w 2 godziny (cel dla procesu), dwie osoby umieją zrestartować serwer (cel dla ludzi), instrukcja awaryjna jest aktualna i wisi przy komputerze (cel dla informacji). Każdy z tych celów dotyczy innego aktywatora.","urzad":"Gmina chce chronić dane mieszkańców. Sekretarz ustala: polityka haseł obowiązuje każdego pracownika, nowe konto zakłada się tylko na pisemny wniosek kierownika, a wszyscy urzędnicy raz w roku przechodzą szkolenie. Polityka, proces nadawania uprawnień i ludzie dostają własne cele – to cele aktywatorów.","it":"Cel związany z IT 10 (bezpieczeństwo informacji) zamienia się w cele aktywatorów: dla procesu DSS05 Zarządzanie usługami bezpieczeństwa „konto odchodzącego pracownika zablokowane tego samego dnia”, a dla aktywatora Ludzie, umiejętności i kompetencje „każdy pracownik raz w roku przechodzi szkolenie z phishingu”.","egz":"Ostatni poziom kaskady: Cele związane z informatyką → Cele aktywatora. Egzamin: „Cele aktywatora”. Podręcznik: „Cele czynników umożliwiających”. Nie myl z: Cele związane z informatyką – Cele aktywatorów są jeszcze bardziej szczegółowe – dotyczą konkretnego procesu, struktury itd.","src":"COBIT 5 Framework (PL), s. 18, 21"},"rola-kierownictwo":{"t":"Kierownictwo","eg":"Kierownictwo","pd":"Zarządzanie (podpis roli na Ilustracji 9)","en":"Management","wyj":"Kierownicy, którzy dostają kierunek od szefostwa, rozdzielają pracę ludziom i pilnują, czy organizacja osiąga cele.\n\nKierownictwo dostaje kierunek od organu Ładu. Instruuje i dopasowuje role operacyjne i odbiera ich raporty – między kierownictwem a rolami operacyjnymi są tylko te dwie relacje (FW-PL s. 24, Il. 9). Strzałka monitorowania łączy kierownictwo z organem Ładu; według uzasadnień egzaminacyjnych to kierownictwo odpowiada wykonawczo za monitorowanie. Swoją pracę prowadzi w obszarze Planuj, Twórz, Wykonuj i Monitoruj.\n\nŻeby kierunek od organu Ładu zamienił się w konkretne zadania i żeby ktoś pilnował ich wykonania.","zycie":"Zarząd wspólnoty postanawia: w tym roku remont dachu. Administrator budynku wybiera firmę i ustala jej harmonogram. Firma raportuje administratorowi postępy, a on co miesiąc mówi zarządowi, czy remont idzie zgodnie z planem. Administrator to kierownictwo: instruuje i dopasowuje.","firma":"Rada spółki ustala: otwieramy czwarty sklep bez kredytu. Dyrektor zarządzający układa plan, rozdziela zadania kierownikom i co tydzień patrzy na raporty sprzedaży. To kierownictwo z Ilustracji 9.","urzad":"Rada gminy uchwala strategię e-usług. Sekretarz gminy rozdziela zadania wydziałom, dopasowuje grafik informatyków i co miesiąc zdaje radzie gminy relację z postępów. Sekretarz działa jako kierownictwo.","it":"Kierownictwo IT mierzy, czy IT osiąga cele, m.in. w procesie MEA01 (Monitorowanie, ocena i oszacowanie wydajności i zgodności) z domeny MEA, i raportuje wyniki organowi Ładu.","egz":"„Kto instruuje i dopasowuje role operacyjne?” → Kierownictwo. Kto odpowiada wykonawczo za monitorowanie w rolach z Ilustracji 9? Według uzasadnień egzaminacyjnych także Kierownictwo, a nie organ Ładu. Podręcznikowy podpis „Zarządzanie” na Ilustracji 9 to ta sama rola. Na Ilustracji 9 podręcznik podpisuje tę rolę „Zarządzanie”, a egzamin mówi „Kierownictwo” (tę formę podręcznik ma też w nagłówku na s. 31). W uzasadnieniach egzaminacyjnych to kierownictwo odpowiada wykonawczo za monitorowanie, a nie organ Ładu. Nie myl z: Organ Ładu i nadzoru – Organ Ładu wyznacza kierunek i jest rozliczany przed interesariuszami. Kierownictwo realizuje kierunek, instruuje i dopasowuje role operacyjne i odpowiada wykonawczo za monitorowanie osiągania celów.; Zarządzanie – Zarządzanie to obszar działań (PBRM, 32 procesy). Kierownictwo to rola z Ilustracji 9, czyli ludzie, którzy te działania prowadzą.; Oszacuj, Kieruj i Monitoruj (EDM) – „Monitoruj” w EDM to praktyka procesów Ładu: Ład monitoruje sprawność i zgodność względem kierunku (s. 14). W pytaniu o role z Ilustracji 9 egzamin wiąże monitorowanie z kierownictwem.","src":"COBIT 5 Framework (PL), s. 14, 24, 31"},"zarzadzanie":{"t":"Zarządzanie","eg":"Zarządzanie","pd":"Zarządzanie","en":"Management","wyj":"Kierownicy planują i wykonują pracę w kierunku, który wyznaczyło szefostwo.\n\nKierownictwo pod przewodnictwem CEO planuje, tworzy, wykonuje i monitoruje działania (Plan, Build, Run, Monitor) zgodnie z kierunkiem wskazanym przez Ład. W COBIT 5 to cztery domeny: APO, BAI, DSS i MEA, razem 32 procesy. Wyniki i informacje zwrotne wracają do Ładu, który je ocenia i w razie potrzeby koryguje kierunek.\n\nŻeby kierunek wyznaczony przez Ład zamienić w zaplanowaną, wykonaną i sprawdzoną pracę, która prowadzi do celów organizacji.","zycie":"Rodzina ustaliła: „oszczędzamy na wakacje” (to Ład). Ty robisz plan zakupów, porównujesz ceny, co miesiąc przelewasz 1000 zł na lokatę i sprawdzasz, czy kwota rośnie. Ta codzienna robota to Zarządzanie.","firma":"Właściciel restauracji ustalił, że w weekendy ma być nowe menu. Kierownik zmiany układa grafik, zamawia towar, pilnuje jakości dań i w poniedziałek raportuje właścicielowi, jak poszło. Praca kierownika to Zarządzanie.","urzad":"Wójt zdecydował, że mieszkańcy mają załatwiać sprawy przez internet. Sekretarz gminy i kierownik informatyki planują projekt, wybierają dostawcę, wdrażają e-usługi i co miesiąc raportują wójtowi. Ich praca to Zarządzanie.","it":"W dziale IT szpitala APO09 (Zarządzanie umowami o świadczenie usług) planuje poziomy usług, BAI03 (Zarządzanie identyfikacją i budowaniem rozwiązań) buduje nowy moduł rejestracji, DSS01 (Zarządzanie eksploatacją) utrzymuje go w ruchu, a MEA01 (Monitorowanie, ocena i oszacowanie wydajności i zgodności) mierzy wyniki i raportuje je do Ładu.","egz":"Zarządzanie działa zgodnie z kierunkiem wyznaczonym przez organ Ładu, aby osiągnąć cele organizacji (definicja, s. 31). Nie myl z: Ład – Ład ocenia, kieruje i monitoruje; Zarządzanie planuje, tworzy, wykonuje i monitoruje. Oba „monitorują”, ale Ład monitoruje kierunek i cele, a Zarządzanie – realizację działań.","src":"COBIT 5 Framework (PL), s. 14, 92"}},"S":[{"pt":"Lekcja 1.40","h":"Wydajność aktywatora: cztery pytania, regularnie i miernikami","b":"<p><w k=\"zarzadzanie-wydajnoscia-aktywatora\">Zarządzanie wydajnością aktywatora<\/w> <span class=\"en\">Enabler performance <w k=\"rola-kierownictwo\">management<\/w><\/span>:<\/p><ol><li>Czy uwzględniono potrzeby interesariuszy?<\/li><li>Czy osiągnięto <w k=\"cele-aktywatorow\">cele aktywatora<\/w>?<\/li><li>Czy zadbano o <w k=\"zarzadzanie\">zarządzanie<\/w> cyklem życia?<\/li><li>Czy stosowane są <w k=\"dobre-praktyki\">dobre praktyki<\/w>?<\/li><\/ol>","c":"Cztery pytania to cztery wymiary aktywatora zamienione w pytania kontrolne, na które odpowiada się miernikami.","s":"COBIT 5 Framework (PL), s. 28–29, Ilustracja 13","ctx":"<p>Podręcznik wymaga „regularnego monitorowania i udzielania odpowiedzi na poniższe pytania — na podstawie mierników”. To nie jednorazowy odbiór po wdrożeniu i nie tylko pomiar procesów – dotyczy każdego z siedmiu aktywatorów. Na Ilustracji 13 pytania stoją pod wymiarami, którym odpowiadają.<\/p><p>Pułapki: pytania „czy aktywator jest tani?” albo „czy wdrożono go szybko?” brzmią rozsądnie, ale nie należą do modelu. Podręcznik pisze „sprawność” – na egzaminie <b>wydajność<\/b> (<span class=\"en\">performance<\/span>).<\/p><p>Przykład ze szpitala dla polityki haseł: czy lekarze szybko się logują? czy spadła liczba nieuprawnionych logowań? czy politykę co roku się przegląda? czy jest zgodna z dobrymi praktykami bezpieczeństwa?<\/p>"},{"pt":"Sprawdź się","quiz":{"tresc":"Dyrektor IT układa listę kontrolną do przeglądu aktywatorów. Które pytanie z jego listy <b>NIE<\/b> pochodzi z zarządzania wydajnością aktywatora (<em>enabler performance management<\/em>)?","opcje":[{"t":"Czy aktywator wdrożono najniższym kosztem?","ok":true,"w":"Dobrze. Koszt wdrożenia brzmi rozsądnie, ale nie należy do czterech pytań z FW-PL s. 29."},{"t":"Czy osiągnięto cele czynników umożliwiających?","w":"To drugie pytanie w brzmieniu podręcznika: „czynnik umożliwiający” to aktywator. Należy do modelu."},{"t":"Czy potrzeby interesariuszy zostały uwzględnione?","w":"To pierwsze z czterech pytań, więc należy do modelu."},{"t":"Czy aktywator korzysta z dobrych praktyk?","w":"To czwarte z czterech pytań, więc należy do modelu."}],"src":"COBIT 5 Framework (PL), s. 29","pomoc":{"t":"Pytanie dotyczy lekcji 1.40 „Zarządzanie wydajnością aktywatora – cztery pytania”. Cel lekcji: Potrafię wymienić cztery pytania, na które odpowiada zarządzanie wydajnością aktywatora.","k":["zarzadzanie-wydajnoscia-aktywatora"]}}},{"pt":"Arkusz próbny","sp1":"sp1-01","lekcja":"1.40","temat":"Zarządzanie wydajnością aktywatora – cztery pytania","k":["zarzadzanie-wydajnoscia-aktywatora"]},{"pt":"Lekcja 1.41","h":"Pytania 1–2 mierzy wskaźnik opóźniony, pytania 3–4 – wiodący","b":"<div class=\"tblwrap\"><table class=\"tbl\"><tr><th><\/th><th>Pytania 1–2<\/th><th>Pytania 3–4<\/th><\/tr><tr><td>dotyczą<\/td><td>wyniku (potrzeby, cele)<\/td><td>funkcjonowania (cykl życia, praktyki)<\/td><\/tr><tr><td>egzamin<\/td><td><w k=\"wskaznik-opozniony\">wskaźnik opóźniony<\/w> <span class=\"en\">Lag indicator<\/span><\/td><td><w k=\"wskaznik-wiodacy\">wskaźnik wiodący<\/w> <span class=\"en\">Lead indicator<\/span><\/td><\/tr><tr><td>podręcznik<\/td><td>następujący<\/td><td>wyprzedzający<\/td><\/tr><\/table><\/div>","c":"Opóźniony potwierdza wynik po fakcie, wiodący ostrzega wcześniej – „wiodący” znaczy „idący przodem”, nie „najważniejszy”.","s":"COBIT 5 Framework (PL), s. 28–29, Ilustracja 13","ctx":"<p>Podręcznik: pierwsze dwa punkty „dotyczą rzeczywistego wyniku”, ostatnie dwa – „rzeczywistego funkcjonowania samego czynnika umożliwiającego”. Na Ilustracji 13 to „mierniki realizacji celów” i „mierniki stosowania praktyk”. O typie decyduje to, co wskaźnik mierzy, a nie waga tematu: zadowolenie interesariuszy jest ważne, ale to wynik, więc wskaźnik opóźniony.<\/p><p>Typowa pułapka to zamiana typów: pytanie poprawne, ale przypisane do złego wskaźnika. Dobry zestaw łączy oba: same opóźnione alarmują za późno, same wiodące mogą wyglądać dobrze, choć wyniku nie ma.<\/p><p>Przykład (kursu, nie z podręcznika): ubezpieczyciel raz w roku mierzy satysfakcję klientów z likwidacji szkód – wskaźnik opóźniony. Co tydzień liczy odsetek szkód z odpowiedzią w 24 godziny – wskaźnik wiodący; gdy spada, roczna satysfakcja też spadnie.<\/p>"},{"pt":"Sprawdź się","quiz":{"tresc":"Które pytania zarządzania wydajnością aktywatora mierzy się <b>wskaźnikami opóźnionymi<\/b> (<em>lag indicators<\/em>)?","opcje":[{"t":"O cele aktywatora i o dobre praktyki","w":"Pół na pół: cele mierzy wskaźnik opóźniony, ale dobre praktyki – wiodący."},{"t":"O potrzeby interesariuszy i o cele aktywatora","ok":true,"w":"Dobrze. Pierwsze dwa pytania dotyczą wyniku, a mierniki wyniku to wskaźniki opóźnione (w podręczniku: następujące)."},{"t":"Wszystkie cztery, bo każdy pomiar jest po fakcie","w":"Fałsz. Pytania 3–4 mierzy się wskaźnikami wiodącymi, które zapowiadają wynik."},{"t":"O cykl życia i o dobre praktyki","w":"Te pytania dotyczą funkcjonowania aktywatora, więc mierzą je wskaźniki wiodące."}],"src":"COBIT 5 Framework (PL), s. 29","pomoc":{"t":"Pytanie dotyczy lekcji 1.41 „Wskaźnik opóźniony i wskaźnik wiodący”. Cel lekcji: Potrafię odróżnić wskaźnik opóźniony od wiodącego i przypisać każdy do właściwych pytań o wydajność aktywatora.","k":["wskaznik-opozniony","wskaznik-wiodacy"]}}},{"pt":"Arkusz próbny","sp1":"sp1-49","lekcja":"1.41","temat":"Wskaźnik opóźniony i wskaźnik wiodący","k":["wskaznik-opozniony","wskaznik-wiodacy"]}]};</script>
