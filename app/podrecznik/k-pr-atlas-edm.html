<script>window.DECK={"id":"k-pr-atlas-edm","rozdzial":"Rozdział 6 · Zasada 5: Oddzielenie Ładu od Zarządzania · s. 31–33","tytul":"Atlas procesów: EDM (Ład)","prev":"k-pr-prm.html","next":"k-pr-atlas-apo.html","T":{"optymalizacja-zasobow":{"t":"Optymalizacja zasobów","eg":"Optymalizacja zasobów","pd":"Optymalizacja zasobów","en":"Resource Optimisation","wyj":"Mądre korzystanie z ludzi, pieniędzy i sprzętu: ani za mało, ani na wyrost.\n\nŁad w EDM04 (Zapewnienie optymalizacji zasobów) ocenia, jakich zasobów (resources) organizacja potrzebuje teraz i w przyszłości, kieruje ich przydziałem i monitoruje, czy są dobrze wykorzystane. Zasoby mają być użyte skutecznie (effective), wydajnie (efficient) i odpowiedzialnie (responsible). Czasem optymalizacja oznacza wydanie więcej, np. na szkolenie, bez którego drogi system stoi nieużywany.\n\nŻeby ludzie, pieniądze, sprzęt i infrastruktura były wykorzystane skutecznie, wydajnie i odpowiedzialnie: wystarczyło ich na to, co ważne, i nic się nie marnowało.","zycie":"Rodzina ma dwa samochody, ale drugi stoi pod blokiem sześć dni w tygodniu i tylko kosztuje. Sprzedaje go, mąż dostaje bilet miesięczny, a część pieniędzy idzie na drugi fotelik do pierwszego auta, żeby dzieci mógł wozić każdy z rodziców. Mniej marnowania, a codzienne sprawy dalej załatwione – to optymalizacja zasobów.","firma":"W pizzerii od 11 do 22 stało pięciu kucharzy, choć tłok jest tylko w porze obiadu i wieczorem. Właściciel układa grafik pod godziny ruchu, a zaoszczędzone pieniądze wydaje na szkolenie dwóch osób z obsługi nowego pieca, który dotąd pracował na pół gwizdka. Optymalizacja zasobów to nie samo cięcie kosztów, tylko lepsze wykorzystanie ludzi i sprzętu.","urzad":"Trzy sąsiednie gminy miały każda własną serwerownię i jednego informatyka, którego nikt nie mógł zastąpić na urlopie. Teraz utrzymują jedną wspólną serwerownię i zespół trzech informatyków, którzy nawzajem się zastępują. Mniej dublowania, a obsługa pewniejsza – to optymalizacja zasobów.","it":"W EDM04 (Zapewnienie optymalizacji zasobów) zarząd decyduje, że wydziały zamiast trzech serwerowni korzystają z jednej, a zaoszczędzone pieniądze idą na drugiego administratora, bo jeden był wąskim gardłem. Zatrudnienie i rozwój tej osoby prowadzi kierownictwo IT w APO07 (Zarządzanie zasobami ludzkimi).","egz":"Jeden z trzech składników celu Ładu. SP1: „Skuteczne użycie wszystkich Zasobów (Optymalizacja Zasobów) jest Celem Ładu”. Nie myl z: Cięcie kosztów – Najtańsza opcja nie zawsze jest optymalna – liczy się skuteczność i wydajność, nie sama cena.; Zasób – Zasób to rzecz (ludzie, pieniądze, sprzęt); optymalizacja zasobów to cel Ładu dotyczący ich wykorzystania.","src":"COBIT 5 Framework (PL), s. 93"},"zasob":{"t":"Zasób","eg":"Zasób","pd":"Zasób","en":"Resource","wyj":"To, czym dysponujemy: ludzie, pieniądze, sprzęt, czas i informacje.\n\nZasób (resource) to każdy zasób organizacji, który pomaga jej osiągnąć cele, np. ludzie, finanse, sprzęt, infrastruktura i informacja. Zasoby są ograniczone, więc przy każdej decyzji pyta się, jakie są potrzebne. Optymalizacja zasobów (resource optimisation) to jeden z trzech składników Celu Ładu, obok realizacji korzyści i optymalizacji ryzyka.\n\nŻeby wiedzieć, czym organizacja dysponuje, aby osiągnąć cele: ludźmi, pieniędzmi, sprzętem, infrastrukturą i informacją.","zycie":"W sobotę masz przeprowadzkę. Masz do dyspozycji 2000 zł, samochód brata, trzech kolegów do pomocy i jeden dzień. Pieniądze, auto, ludzie i czas to Twoje zasoby – od tego, jak je rozdzielisz, zależy, czy zdążysz.","firma":"Właściciel warsztatu dostaje duże zlecenie na serwis floty aut. Sprawdza, czy ma wolnych mechaników, podnośniki, pieniądze na części i aktualną bazę klientów z historią napraw. Ludzie, sprzęt, pieniądze i informacje to zasoby warsztatu.","urzad":"Dyrektor szkoły układa plan na nowy rok. Ma określoną liczbę etatów nauczycieli, budżet z gminy, pracownię komputerową z siecią i dane uczniów w dzienniku. To wszystko są zasoby szkoły.","it":"EDM04 (Zapewnienie optymalizacji zasobów) pilnuje, by zasoby IT (ludzie, procesy, technologie) były wystarczające i optymalnie wykorzystane. Szczegółami zajmuje się Zarządzanie, np. APO07 (Zarządzanie zasobami ludzkimi) ludźmi, a APO06 (Zarządzanie budżetem i kosztami) pieniędzmi.","egz":"Pojawia się w „optymalizacji zasobów” i w pytaniu „Jakie zasoby są wymagane?” przy każdej decyzji (s. 17). Nie myl z: Aktywator – Aktywator to szersze pojęcie – obejmuje też np. procesy, kulturę czy polityki. Zasoby (np. ludzie, infrastruktura) są ujęte w niektórych kategoriach aktywatorów.","src":"COBIT 5 Framework (PL), s. 93; COBIT 5 Framework (PL), s. 13"},"ryzyko":{"t":"Ryzyko","eg":"Ryzyko","pd":"Ryzyko","en":"Risk","wyj":"Coś może pójść źle; liczy się, jak bardzo jest to prawdopodobne i jak bardzo zaboli.\n\nRyzyko (risk) to połączenie prawdopodobieństwa zdarzenia i jego konsekwencji. Dotyczy przyszłości. Dopowiedzenie kursu (interpretacja, nie definicja z s. 93): gdy zdarzenie już nastąpiło, mówimy raczej o problemie albo incydencie. Ład ustala apetyt na ryzyko (risk appetite), czyli ile ryzyka organizacja jest gotowa przyjąć (EDM03, Zapewnienie optymalizacji ryzyka), a Zarządzanie identyfikuje, ocenia i ogranicza ryzyka w tych granicach (APO12, Zarządzanie ryzykiem).\n\nŻeby z wyprzedzeniem widzieć, co może pójść źle i jak bardzo by zaszkodziło, i świadomie decydować, czemu zapobiegać, a co zaakceptować.","zycie":"Planujecie wesele w ogrodzie w lipcu. Deszcz jest dość prawdopodobny, a skutek byłby duży – goście mokną, tort się rozpływa – więc rezerwujecie namiot. Ryzyko to ta możliwość deszczu razem z jej skutkami; jeśli w dniu wesela leje, macie już problem, a nie ryzyko.","firma":"W biurze rachunkowym tylko pani Ewa umie obsługiwać program do płac. Jeśli zachoruje w ostatnim tygodniu miesiąca, pensje u klientów się spóźnią. Szef ocenia, że to mało prawdopodobne, ale bolesne, więc każe przeszkolić drugą osobę – tak wygląda praca z ryzykiem.","urzad":"Nabór wniosków o dopłaty do wymiany pieców w urzędzie gminy zamyka się w piątek o 15:00, a wszystko idzie przez jeden serwer. Awaria akurat w piątek jest mało prawdopodobna, ale skutek byłby fatalny, więc informatyk robi kopię i ma tego dnia dyżur. To ryzyko: możliwość zdarzenia plus jego skutki.","it":"W procesie APO12 (Zarządzanie ryzykiem) dział IT prowadzi rejestr ryzyk: np. „awaria serwerowni” ma ocenione prawdopodobieństwo i skutki. Dla ryzyk powyżej apetytu ustalonego przez Ład w EDM03 (Zapewnienie optymalizacji ryzyka) planuje się działania, np. zapasowe centrum danych.","egz":"Na egzaminie ryzyko pojawia się głównie jako „optymalizacja ryzyka” (cel Ładu) i „apetyt na ryzyko” (czynnik środowiskowy we wdrożeniu). Nie myl z: Issue / problem / incydent – Problem już zaistniał; ryzyko jest możliwością w przyszłości.; Zagrożenie – Zagrożenie to źródło (np. powódź); ryzyko łączy prawdopodobieństwo z konsekwencjami.","src":"COBIT 5 Framework (PL), s. 93"},"tworzenie-wartosci":{"t":"Tworzenie Wartości – Cel Ładu","eg":"Tworzenie Wartości – Cel Ładu","pd":"Tworzenie wartości – cel nadzoru","en":"Value Creation (governance objective)","wyj":"Pożytek większy niż koszt i ryzyko: dostajemy korzyści, nie przepłacając i nie narażając się bez potrzeby.\n\nTworzenie wartości (value creation) to cel Ładu wynikający z potrzeb interesariuszy. Składa się z trzech elementów: realizacji korzyści (benefits realisation), optymalizacji ryzyka (risk optimisation) i optymalizacji zasobów (resource optimisation). Ład równoważy je przy każdej decyzji, pytając, kto odnosi korzyści, kto ponosi ryzyko i jakie zasoby są potrzebne; w procesach odpowiadają za to EDM02, EDM03 i EDM04.\n\nŻeby każdą decyzję o IT oceniać nie tylko po korzyściach, ale też po ryzyku i zużytych zasobach, bo dopiero ich równowaga daje interesariuszom wartość.","zycie":"Zastanawiasz się nad rowerem do dojazdów. Liczysz: 300 zł miesięcznie mniej na paliwo i pół godziny mniej w korkach (korzyść), ryzyko kradzieży i wypadku (kupujesz zapięcie i kask), cena 2500 zł i miejsce w piwnicy (zasoby). Kupujesz, bo te trzy rzeczy się bilansują – to jest tworzenie wartości.","firma":"Właściciel warsztatu rozważa program do rezerwacji wizyt online. Zyska więcej klientów i mniej telefonów, ale ryzykuje wyciek danych klientów, a do tego płaci 150 zł abonamentu i traci dwa dni na szkolenie. Decyduje się, gdy znajduje dostawcę z dobrymi zabezpieczeniami – korzyść, ryzyko i koszt są w równowadze.","urzad":"Starostwo wdraża elektroniczny obieg dokumentów. Sprawy idą o tydzień szybciej (korzyść), ale trzeba robić kopie zapasowe, żeby awaria nie zgubiła akt (ryzyko), i kupić licencje oraz oddelegować dwie osoby do wdrożenia (zasoby). Gdyby system był szybki, ale zawodny albo za drogi, nie byłoby z niego wartości.","it":"W procesach EDM02 (Zapewnienie realizacji korzyści), EDM03 (Zapewnienie optymalizacji ryzyka) i EDM04 (Zapewnienie optymalizacji zasobów) zarząd ocenia inwestycję w usługi chmurowe: jakie korzyści da, czy ryzyko mieści się w apetycie na ryzyko i czy wystarczy ludzi i pieniędzy. Wartość jest dopiero przy równowadze tych trzech ocen.","egz":"Cel Ładu „Tworzenie Wartości” realizuje się przez wszystkie trzy składniki naraz. Odpowiedź z jednym składnikiem jest niepełna (pułapka „zbyt wąskie”). Egzamin: „Cel Ładu”. Podręcznik: „Cel nadzoru”. To ten sam cel – tworzenie wartości. Nie myl z: Zysk – Zysk to tylko jedna postać korzyści. W sektorze publicznym korzyścią są usługi publiczne.; Realizacja korzyści – Realizacja korzyści to tylko jeden z trzech składników tworzenia wartości.","src":"COBIT 5 Framework (PL), s. 17, Ilustracja 3; COBIT 5 Framework (PL), s. 93"},"optymalizacja-ryzyka":{"t":"Optymalizacja ryzyka","eg":"Optymalizacja ryzyka","pd":"Optymalizacja ryzyka","en":"Risk Optimisation","wyj":"Pilnowanie, żeby zagrożeń nie było więcej, niż szefostwo jest gotowe znieść.\n\nRyzyko się rozpoznaje, szacuje jego wpływ i prawdopodobieństwo, a potem wybiera strategię: unikanie (avoidance), ograniczanie (mitigation) albo transfer (transfer), i zarządza nim w kontekście apetytu na ryzyko (risk appetite). Apetyt na ryzyko ustala i monitoruje Ład w EDM03 (Zapewnienie optymalizacji ryzyka), a bieżące zarządzanie ryzykiem prowadzi Zarządzanie w APO12 (Zarządzanie ryzykiem). Razem z realizacją korzyści i optymalizacją zasobów tworzy cel Ładu: tworzenie wartości.\n\nŻeby ryzyko związane z IT utrzymać na akceptowalnym poziomie, czyli w granicach apetytu na ryzyko, a nie próbować go wyeliminować, co zablokowałoby działanie.","zycie":"Codziennie jeździsz samochodem do pracy, choć wiesz, że może zdarzyć się stłuczka. Zapinasz pasy (ograniczasz skutki), kupujesz AC (przerzucasz koszt na ubezpieczyciela), a po weselu kuzyna nie siadasz za kierownicę (unikasz). Ryzyko nie spada do zera, ale jest na poziomie, z którym możesz żyć – to optymalizacja ryzyka.","firma":"Sklep internetowy mógłby w ogóle nie przyjmować kart, żeby nie ryzykować wycieku, ale wtedy mało kto by coś kupił. Właścicielka oddaje więc płatności operatorowi i nie trzyma numerów kart u siebie (unikanie), robi codzienne kopie zapasowe (ograniczanie) i wykupuje ubezpieczenie od cyberataku (transfer). Ryzyko zostaje, ale w granicach, na które ją stać.","urzad":"Urząd gminy mógłby odłączyć się od internetu, żeby nikt się nie włamał, ale mieszkańcy straciliby e-usługi. Wójt akceptuje, że jakieś ryzyko zostaje, i każe wprowadzić to, co ma sens przy tych danych: kopie zapasowe, aktualizacje, szkolenie z rozpoznawania fałszywych maili. Zabezpieczenia na miarę zagrożenia, a nie za wszelką cenę – to optymalizacja ryzyka.","it":"W EDM03 (Zapewnienie optymalizacji ryzyka) zarząd ustala apetyt na ryzyko: przestój systemu sprzedaży najwyżej 4 godziny w roku. W APO12 (Zarządzanie ryzykiem) dział IT ocenia scenariusze i dobiera zabezpieczenia tak, by zmieścić się w tej granicy.","egz":"Jeden z trzech składników celu Ładu. Pułapka w odpowiedziach: „wyeliminowanie ryzyka” jest zawsze błędne. Poprawnie: „utrzymanie ryzyka na akceptowalnym poziomie / w granicach apetytu na ryzyko”. Nie myl z: Eliminacja ryzyka – Optymalizacja ≠ eliminacja. Usunięcie każdego ryzyka zwykle zabija też korzyści.; Ryzyko – Ryzyko to sama możliwość zdarzenia; optymalizacja ryzyka to cel Ładu dotyczący zarządzania nim.","src":"COBIT 5 Framework (PL), s. 93; COBIT 5 Framework (PL), s. 13"},"proces":{"t":"Proces","eg":"Proces","pd":"Proces","en":"Process","wyj":"Coś, co robimy regularnie i zawsze w podobny sposób, np. przyjmowanie każdego zgłoszenia.\n\nProces (process) przyjmuje wejścia (inputs), przetwarza je przez praktyki i działania ukierunkowane przez polityki i procedury i daje wyniki (outputs), np. produkt albo usługę. Ma właściciela, role i mierniki, a wynik jednego procesu bywa wejściem innego. W COBIT 5 procesy są jednym z siedmiu aktywatorów, a Referencyjny Model Procesu opisuje ich 37.\n\nŻeby powtarzalną pracę wykonywać za każdym razem tak samo dobrze, niezależnie od tego, kto ją akurat robi, i żeby dało się ją mierzyć i poprawiać.","zycie":"Co sobotę rano sprawdzasz lodówkę, piszesz listę, jedziesz do sklepu, rozpakowujesz i odhaczasz, czego zabrakło. Za tydzień wszystko powtarza się od nowa. To proces: stałe kroki, wejście (pusta lodówka i lista) i wynik (pełna lodówka).","firma":"W sklepie internetowym z herbatą przychodzi zamówienie, pracownik pakuje paczkę, drukuje etykietę i fakturę, a kurier odbiera paczki o 15:00. Tak samo dzieje się z każdym zamówieniem, codziennie. To proces – powtarzalny, z wejściem (zamówienie) i wynikiem (paczka u klienta).","urzad":"Do urzędu gminy wpływa wniosek o wycinkę drzewa. Kancelaria go rejestruje, kierownik przydziela go referentowi, ten jedzie na oględziny i wydaje decyzję. Każdy kolejny wniosek idzie tą samą ścieżką – to jest proces.","it":"DSS02 (Zarządzanie zgłoszeniami serwisowymi i incydentami) to proces: każde zgłoszenie (wejście) jest rejestrowane, klasyfikowane, rozwiązywane i zamykane (praktyki), a wynikiem jest przywrócona usługa i wpis w rejestrze. Działa codziennie i tak samo dla każdego zgłoszenia.","egz":"Opis „zbiór praktyk ukierunkowanych politykami i procedurami, który przetwarza wejścia w wyniki” to Proces (Załącznik H). Nie myl z: Projekt – Projekt jest jednorazowy, ma początek i koniec (np. wdrożenie systemu). Proces trwa i się powtarza (np. obsługa zgłoszeń w tym systemie).","src":"COBIT 5 Framework (PL), s. 93"},"proc-edm03":{"t":"EDM03 Zapewnienie optymalizacji ryzyka","eg":"EDM03 Zapewnienie optymalizacji ryzyka","pd":"EDM03 Zapewnienie optymalizacji ryzyka","en":"EDM03 Ensure Risk Optimisation","wyj":"Szefostwo ustala, ile niepewności jest gotowe znieść, i pilnuje, żeby tej granicy nie przekraczać.\n\nOrgan Ładu ocenia ryzyko IT na tle celów organizacji. Ustala apetyt i tolerancję na ryzyko oraz zasady zarządzania ryzykiem. Monitoruje, czy profil ryzyka mieści się w granicy, i decyduje o ryzykach ponad nią.\n\nŻeby organizacja świadomie wiedziała, ile ryzyka związanego z IT akceptuje, i żeby tej granicy pilnowano.","zycie":"Rodzice ustalają: dziecko może samo jeździć rowerem po osiedlu, ale nie po drodze krajowej. Nie pilnują każdej przejażdżki. Ustalają granicę i co jakiś czas sprawdzają, czy jest przestrzegana. To jest EDM03.","firma":"Zarząd sklepu internetowego decyduje: przerwa w sprzedaży dłuższa niż 4 godziny jest nie do przyjęcia. Dział IT sam ocenia konkretne zagrożenia i dobiera zabezpieczenia. Zarząd co kwartał sprawdza, czy ryzyko mieści się w tej granicy.","urzad":"Wójt ustala, że dane mieszkańców nie mogą wyjść poza urząd, a przerwa w obsłudze interesantów nie może trwać dłużej niż jeden dzień roboczy. Informatyk analizuje konkretne zagrożenia i proponuje zabezpieczenia. Wójt nie dobiera zabezpieczeń, tylko ustala granicę i co kwartał rozlicza, czy ryzyko się w niej mieści. To EDM03.","it":"Zarząd banku zatwierdza deklarację apetytu na ryzyko IT, np. „przestój bankowości internetowej najwyżej 4 godziny rocznie”. To EDM03. Analizę ryzyk i reakcje prowadzi APO12 Zarządzanie ryzykiem.","egz":"Słowa „apetyt na ryzyko”, „tolerancja”, „zarząd ustala akceptowalny poziom ryzyka” → EDM03. Słowa „rejestr ryzyk”, „analiza scenariuszy”, „profil ryzyka”, „plan reakcji” → APO12. Nazwa egzaminacyjna PL niepotwierdzona: na egzaminie nazwa może brzmieć inaczej niż w podręczniku. Egzamin używa własnych tłumaczeń, w domenach trybu rozkazującego (np. „Dostosuj, Planuj i Organizuj”). Rozpoznawaj proces po kodzie EDM03 i słowie kluczowym EN Risk Optimisation. Słowo „ryzyko” ma też APO12 Zarządzanie ryzykiem. EDM03 to Ład (apetyt na ryzyko, kierunek), a APO12 to Zarządzanie (rozpoznanie, analiza, reakcja). Nie myl z: APO12 Zarządzanie ryzykiem – APO12 (Zarządzanie) zbiera dane o ryzyku, analizuje je, utrzymuje profil ryzyka i reaguje. EDM03 (Ład) ustala apetyt na ryzyko i rozlicza, czy go przestrzegamy.; Optymalizacja ryzyka – Optymalizacja ryzyka to składnik Celu Ładu (pojęcie). EDM03 to proces Ładu, który go zapewnia.; APO13 Zarządzanie bezpieczeństwem – APO13 organizuje system zarządzania bezpieczeństwem informacji. Ryzyko bezpieczeństwa to tylko część ryzyka IT, którym kieruje EDM03.","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; COBIT 5 Framework (PL), s. 93; COBIT 5 Framework (PL), s. 31; COBIT 5 Framework (PL), s. 60"},"realizacja-korzysci":{"t":"Realizacja korzyści","eg":"Realizacja korzyści","pd":"Realizacja korzyści","en":"Benefits Realisation","wyj":"Pilnowanie, żeby z wydanych pieniędzy naprawdę był pożytek, a nie tylko faktury.\n\nRealizacja korzyści (Benefits Realisation) obejmuje trzy działania: uzyskiwanie nowych korzyści, utrzymanie i rozszerzanie istniejących oraz eliminowanie inicjatyw i zasobów, które nie dają wystarczającej wartości. Korzyść mierzy się poprawą u interesariuszy, a nie samym rezultatem (output). Razem z optymalizacją ryzyka i optymalizacją zasobów tworzy cel Ładu, czyli tworzenie wartości, a w procesach Ładu odpowiada za nią EDM02 (Zapewnienie realizacji korzyści).\n\nŻeby inwestycje w IT naprawdę przynosiły organizacji pożytek, a nie kończyły się na zakupie albo wdrożeniu.","zycie":"Kupujecie zmywarkę, żeby wieczorem nie stać przy zlewie, ale przez miesiąc i tak zmywacie ręcznie, „bo szkoda prądu”. Korzyść pojawia się dopiero, gdy zmywarka chodzi codziennie, a Wy macie wolny wieczór. Rezygnacja z drugiego, nieoglądanego serwisu streamingowego to też realizacja korzyści – przestajecie płacić za coś, co nic nie daje.","firma":"Kawiarnia kupuje terminal płatniczy, bo klienci odchodzili, gdy nie mogli zapłacić kartą. Po trzech miesiącach właściciel sprawdza: kolejka krótsza, utarg wyższy o 15%. Dopiero to jest zrealizowana korzyść – sam terminal na ladzie nią nie był.","urzad":"Gmina wdraża elektroniczny obieg dokumentów, żeby sprawy szły szybciej. Pół roku później okazuje się, że urzędnicy i tak drukują każde pismo i noszą je do podpisu. System jest, ale korzyści nie ma – dopóki ludzie nie zmienią sposobu pracy.","it":"W procesie EDM02 (Zapewnienie realizacji korzyści) Ład ocenia portfel inwestycji IT, kieruje środki tam, gdzie korzyści są największe, i monitoruje, czy korzyści zapowiedziane w uzasadnieniu biznesowym naprawdę się pojawiają. Zarządzanie realizuje to m.in. w APO05 (Zarządzanie portfelem projektów).","egz":"Jeden z trzech składników celu Ładu. Zapamiętaj trzy działania: uzyskiwać nowe korzyści, utrzymywać istniejące, eliminować to, co nie daje wartości. Nie myl z: Rezultat / wynik – Rezultat (output) to bezpośredni produkt działania – np. wdrożony system. Korzyść (benefit) to poprawa, którą ten produkt przynosi – np. szybsza obsługa.; Tworzenie Wartości – Cel Ładu – Tworzenie wartości = korzyści + ryzyko + zasoby w równowadze. Realizacja korzyści to tylko jeden składnik.","src":"COBIT 5 Framework (PL), s. 89; COBIT 5 Framework (PL), s. 17, Ilustracja 3"},"proc-edm04":{"t":"EDM04 Zapewnienie optymalizacji zasobów","eg":"EDM04 Zapewnienie optymalizacji zasobów","pd":"EDM04 Zapewnienie optymalizacji zasobów","en":"EDM04 Ensure Resource Optimisation","wyj":"Szefostwo pilnuje, żeby ludzi, pieniędzy i sprzętu do informatyki było tyle, ile trzeba, i żeby ich nie marnować.\n\nOrgan Ładu ocenia, czy zasoby IT wystarczają i czy są dobrze używane. Ustala zasady ich zdobywania i podziału oraz priorytety. Monitoruje, czy zasoby są wykorzystywane optymalnie, i koryguje kierunek.\n\nŻeby IT miało dość ludzi, pieniędzy i technologii do realizacji celów i żeby tych zasobów nie marnować.","zycie":"Planujesz przeprowadzkę. Sprawdzasz, czy wystarczy rąk do noszenia, pieniędzy na auto i czasu. Sam nie nosisz kartonów. Decydujesz, ile czego potrzeba i czy niczego nie marnujesz. To EDM04.","firma":"Zarząd firmy kurierskiej widzi, że dwóch programistów obsługuje dziesięć systemów, a serwery stoją w połowie puste. Każe przesunąć pieniądze ze sprzętu na ludzi. Dyrektor IT wykonuje to w swoich procesach. Zarząd sprawdza efekt po kwartale.","urzad":"Starosta widzi, że każdy wydział kupuje własne skanery i programy, a część sprzętu stoi nieużywana. Decyduje: jeden wspólny zakup i jeden informatyk na trzy wydziały. Potem sprawdza, czy zasoby nie leżą odłogiem. To EDM04.","it":"Zarząd ocenia, że dział IT ma za mało specjalistów od chmury i za dużo nieużywanych licencji. Ustala kierunek: mniej licencji, więcej szkoleń. Wykonują to APO07 Zarządzanie zasobami ludzkimi i BAI09.","egz":"Trzy „zasoby”: EDM04 Resource Optimisation (Ład, wszystkie zasoby), APO07 Human Resources (Zarządzanie, ludzie), BAI09 Assets (Zarządzanie, aktywa). W pytaniu szukaj poziomu (kierunek czy wykonanie) i rodzaju zasobu. Nazwa egzaminacyjna PL niepotwierdzona: na egzaminie nazwa może brzmieć inaczej niż w podręczniku. Egzamin używa własnych tłumaczeń, w domenach trybu rozkazującego (np. „Dostosuj, Planuj i Organizuj”). Rozpoznawaj proces po kodzie EDM04 i słowie kluczowym EN Resource Optimisation. Pułapka tłumaczenia „zasoby”: EDM04 to Resource (wszystkie zasoby, Ład), APO07 to Human Resources (zasoby ludzkie), a BAI09 to Assets (aktywa, w podręczniku też „Zarządzanie zasobami”). Po polsku trzy razy „zasoby”, po angielsku trzy różne słowa. Nie myl z: APO07 Zarządzanie zasobami ludzkimi – APO07 (Zarządzanie) zajmuje się tylko ludźmi: role, kompetencje, szkolenia, zastępstwa. EDM04 (Ład) patrzy na wszystkie zasoby i ustala kierunek.; BAI09 Zarządzanie zasobami – BAI09 Manage Assets to aktywa: sprzęt i licencje w cyklu życia. Podręcznik nazywa go „Zarządzanie zasobami”, ale to nie EDM04.; Optymalizacja zasobów – Optymalizacja zasobów to składnik Celu Ładu (pojęcie). EDM04 to proces Ładu, który go zapewnia.","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; COBIT 5 Framework (PL), s. 93; COBIT 5 Framework (PL), s. 61; materiały Altkom"},"proc-edm01":{"t":"EDM01 Zapewnienie i utrzymanie ładu korporacyjnego","eg":"EDM01 Zapewnienie i utrzymanie ładu korporacyjnego","pd":"EDM01 Zapewnienie i utrzymanie ładu korporacyjnego","en":"EDM01 Ensure Governance Framework Setting and Maintenance","wyj":"Szefostwo ustala, kto i jak decyduje o informatyce, i pilnuje, żeby te zasady działały.\n\nOrgan Ładu ocenia, jak dziś zapadają decyzje o IT i czego oczekują interesariusze. Potem ustala zasady, struktury i uprawnienia decyzyjne. Na koniec monitoruje, czy ten układ działa, i go poprawia.\n\nŻeby było jasne, kto i jak decyduje o informatyce, zanim ktokolwiek zacznie wydawać pieniądze i budować systemy.","zycie":"Wspólnota mieszkaniowa uchwala regulamin: o wydatkach do 5 tys. zł decyduje zarząd wspólnoty, powyżej decyduje zebranie. Raz w roku sprawdzacie, czy ten podział się sprawdza. Niczego nie remontujecie, tylko ustalacie, kto o czym decyduje. To jest EDM01.","firma":"Zarząd spółki powołuje komitet ds. IT i spisuje, o czym komitet decyduje sam, a co trafia do zarządu. Po roku zarząd ocenia, czy decyzje zapadają szybko i we właściwym gronie. Tak działa EDM01.","urzad":"Burmistrz zarządzeniem ustala, że o zakupach systemów informatycznych decyduje zespół do spraw cyfryzacji, a strategię cyfryzacji zatwierdza rada miasta. Co rok sprawdza, czy wydziały nie kupują programów z pominięciem zespołu. Sam nie wybiera programów – ustala, kto i jak o nich decyduje. To jest EDM01.","it":"Komitet strategiczny ds. IT dostaje od zarządu uprawnienia i zasady eskalacji. To ustala EDM01. Role i procesy działu IT, które z tego wynikają, porządkuje APO01 Zarządzanie metodyką zarządzania IT.","egz":"EDM01 jest w domenie EDM, czyli w Ładzie. Słowo-klucz EN: Governance Framework. Pytanie o to, kto i jak decyduje o IT na samej górze → EDM01. Pytanie o role, polityki i procesy zarządzania IT → APO01. Nazwa egzaminacyjna PL niepotwierdzona: na egzaminie nazwa może brzmieć inaczej niż w podręczniku. Egzamin używa własnych tłumaczeń, w domenach trybu rozkazującego (np. „Dostosuj, Planuj i Organizuj”). Rozpoznawaj proces po kodzie EDM01 i słowie kluczowym EN Governance Framework. Uwaga na słowa: podręcznik mówi „ład korporacyjny”, a EN mówi o strukturze ramowej Ładu nad IT. Nie myl z APO01, który ma w nazwie „metodykę zarządzania IT”. Nie myl z: APO01 Zarządzanie metodyką zarządzania IT – APO01 to Zarządzanie: kierownik IT buduje i utrzymuje system zarządzania IT (role, polityki, procesy). EDM01 to Ład: organ Ładu ustala zasady decydowania i ocenia, czy działają.; Podejście do Ładu – Podejście do Ładu to model pojęciowy z Frameworka (cel, aktywatory, zakres, role). EDM01 to proces, w którym organ Ładu ten system faktycznie ustanawia i utrzymuje.","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; COBIT 5 Framework (PL), s. 32; COBIT 5 Framework (PL), s. 31; COBIT 5 Framework (PL), s. 91"},"proc-edm05":{"t":"EDM05 Zapewnienie Transparentności Interesariuszy","eg":"EDM05 Zapewnienie Transparentności Interesariuszy","pd":"EDM05 Zapewnienie przejrzystości dotyczącej interesariuszy","en":"EDM05 Ensure Stakeholder Transparency","wyj":"Szefostwo mówi uczciwie wszystkim zainteresowanym, jak idzie informatyce: wyniki, koszty i kłopoty.\n\nOrgan Ładu ocenia, jakich informacji potrzebują interesariusze. Ustala zasady raportowania: co, komu, jak często i z jakimi miernikami. Monitoruje, czy raporty są wiarygodne, kompletne i terminowe.\n\nŻeby interesariusze dostawali rzetelny, zrozumiały obraz tego, jak IT spełnia ich oczekiwania, i mogli to ocenić.","zycie":"Skarbnik komitetu rodzicielskiego co semestr pokazuje rodzicom: ile zebrano, na co wydano, co się nie udało. Rodzice akceptują plan na kolejny semestr. Uczciwy, zrozumiały obraz dla wszystkich zainteresowanych to EDM05.","firma":"Zarząd spółki w raporcie rocznym pokazuje akcjonariuszom wyniki IT: dostępność sklepu, koszty, incydenty i plan poprawy. Wcześniej uzgodnił z radą nadzorczą, jakie mierniki pokaże. Tak działa EDM05.","urzad":"Burmistrz publikuje roczny raport o e-usługach: ile spraw załatwiono przez internet, ile było awarii i ile to kosztowało. Rada miasta i mieszkańcy widzą prawdziwy obraz, także porażki. Wcześniej burmistrz ustalił z radą, które liczby raport ma zawsze zawierać. To EDM05.","it":"Rada nadzorcza zatwierdza, które mierniki IT trafią do raportu rocznego dla akcjonariuszy i regulatora. To EDM05. Dane dostarcza MEA01 Monitorowanie, ocena i oszacowanie wydajności i zgodności.","egz":"Na egzaminie: „Zapewnienie Transparentności Interesariuszy”. Komunikacja z interesariuszami i raportowanie na poziomie Ładu → EDM05. Zbieranie i ocena mierników przez kierownictwo → MEA01. Egzamin: „Zapewnienie Transparentności Interesariuszy”. Podręcznik: „Zapewnienie przejrzystości dotyczącej interesariuszy”. To ten sam EDM05. Nie myl z MEA01, który też dotyczy wyników i raportów, ale na poziomie Zarządzania. Nie myl z: MEA01 Monitorowanie, ocena i oszacowanie wydajności i zgodności – MEA01 (Zarządzanie) zbiera i ocenia dane o wynikach i zgodności i raportuje je w górę. EDM05 (Ład) decyduje, co i jak raportujemy interesariuszom, i odpowiada za przejrzystość.; Monitoruj, Oszacuj i Oceń (MEA) – Domena MEA monitoruje na poziomie Zarządzania. EDM05 to monitorowanie i komunikacja na poziomie Ładu.","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; COBIT 5 Framework (PL), s. 57; COBIT 5 Framework (PL), s. 59"},"proc-edm02":{"t":"EDM02 Zapewnienie realizacji korzyści","eg":"EDM02 Zapewnienie realizacji korzyści","pd":"EDM02 Zapewnienie realizacji korzyści","en":"EDM02 Ensure Benefits Delivery","wyj":"Szefostwo pilnuje, żeby pieniądze wydane na informatykę dały prawdziwy pożytek, a nie tylko nowe urządzenia.\n\nOrgan Ładu ocenia, jakiej wartości oczekuje od inwestycji i usług IT. Kieruje priorytetami i wymaga uzasadnień biznesowych. Monitoruje, czy korzyści przyszły, i decyduje: kontynuować, poprawić albo zakończyć.\n\nŻeby pieniądze wydane na IT dawały organizacji prawdziwą korzyść, a nie kończyły się na zakupie i wdrożeniu.","zycie":"Kupiliście robota sprzątającego za 1500 zł. Po trzech miesiącach pytacie: czy naprawdę mamy więcej wolnego czasu? Jeśli robot stoi w szafie, korzyści nie ma, choć zakup się „udał”. Pilnowanie tej różnicy to EDM02.","firma":"Zarząd sklepu internetowego zatwierdził nową bramkę płatności, bo miała zmniejszyć porzucanie koszyków. Pół roku po wdrożeniu zarząd sprawdza, czy porzuceń jest mniej. Nie liczy, czy projekt skończył się w terminie. Liczy, czy przyszła korzyść.","urzad":"Rada powiatu dała pieniądze na e-rejestrację pojazdów. Po roku pyta starostę: o ile skróciły się kolejki w wydziale komunikacji? Gdy korzyści brak, rada każe poprawić usługę albo przestać na nią wydawać. To EDM02.","it":"Rada nadzorcza przegląda portfel inwestycji IT z mierzonymi korzyściami (np. czas obsługi klienta). Ocenę wartości i decyzje o dalszym finansowaniu podejmuje w EDM02, a portfel układa APO05 Zarządzanie Portfelem.","egz":"EDM02 = Ład + korzyści i wartość. Razem z EDM03 Zapewnienie optymalizacji ryzyka i EDM04 Zapewnienie optymalizacji zasobów odpowiada trzem składnikom Celu Ładu: korzyści, ryzyko, zasoby. Słowa „wartość inwestycji”, „uzasadnienie biznesowe” na poziomie organu Ładu → EDM02. Nazwa egzaminacyjna PL niepotwierdzona: na egzaminie nazwa może brzmieć inaczej niż w podręczniku. Egzamin używa własnych tłumaczeń, w domenach trybu rozkazującego (np. „Dostosuj, Planuj i Organizuj”). Rozpoznawaj proces po kodzie EDM02 i słowie kluczowym EN Benefits. Nie myl z BAI01 (doprowadzenie projektu do końca) ani z APO05 (portfel). „Realizacja” znaczy tu, że korzyść ma się naprawdę pojawić, a nie że projekt ma się zakończyć. Nie myl z: APO05 Zarządzanie Portfelem – APO05 (Zarządzanie) wybiera i równoważy inwestycje w portfelu. EDM02 (Ład) ustala, jakiej wartości oczekujemy, i ocenia, czy ją dostajemy.; BAI01 Zarządzanie programami i projektami – BAI01 dowozi projekt: zakres, termin, budżet. EDM02 pyta, czy z dowiezionego projektu jest pożytek.; Realizacja korzyści – Realizacja korzyści to składnik Celu Ładu (pojęcie). EDM02 to proces, który ten składnik zapewnia.","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; COBIT 5 Framework (PL), s. 58; COBIT 5 Framework (PL), s. 89"}},"S":[{"lekcje":["pr-k53-atlas-edm01-edm03","pr-k54-atlas-edm04-edm05"],"pt":"Lekcje 1.53–1.54","h":"Pięć procesów Ładu – każdy ma sobowtóra w Zarządzaniu","b":"<ul><li><w k=\"proc-edm01\">EDM01<\/w> rama Ładu: kto i jak decyduje ≠ APO01<\/li><li><w k=\"proc-edm02\">EDM02<\/w> czy inwestycje dały korzyści ≠ APO05<\/li><li><w k=\"proc-edm03\">EDM03<\/w> apetyt na <w k=\"ryzyko\">ryzyko<\/w> ≠ APO12<\/li><li><w k=\"proc-edm04\">EDM04<\/w> dość zasobów, bez marnowania ≠ APO07, BAI09<\/li><li><w k=\"proc-edm05\">EDM05<\/w> rzetelny obraz IT dla interesariuszy ≠ MEA01<\/li><\/ul>","c":"Zasady decydowania, wartość, granica ryzyka, zasoby i rozliczenie z interesariuszami należą do Ładu; praca w tych ramach – do Zarządzania.","s":"COBIT 5 Framework (PL), s. 31, 33, Ilustracja 16","ctx":"<p>Nazwy z podręcznika (egzaminacyjne niepotwierdzone, poza EDM05): EDM01 Zapewnienie i utrzymanie ładu korporacyjnego <span class=\"en\">Ensure Governance Framework Setting and Maintenance<\/span>; EDM02 Zapewnienie realizacji korzyści <span class=\"en\">Benefits Delivery<\/span>; EDM03 Zapewnienie optymalizacji ryzyka; EDM04 Zapewnienie optymalizacji zasobów; EDM05 na egzaminie „Zapewnienie Transparentności Interesariuszy” (podręcznik: „przejrzystości dotyczącej interesariuszy”). Opisy „po co” to wyjaśnienia kursu.<\/p><p>Rozróżnienia: „realizacja korzyści” w EDM02 to osiągnięcie wartości, nie przeprowadzenie projektu. Optymalizacja ryzyka to nie ryzyko zerowe, lecz trzymanie się akceptowanej granicy; rejestr ryzyk i reakcje to APO12. MEA01 raportuje w górę, do Ładu; EDM05 decyduje, co trafia na zewnątrz. Procesy Ładu zaczynają się od „Zapewnienie”, procesy Zarządzania od „Zarządzanie”.<\/p><p>Przykład: rada nadzorcza banku zatwierdza, że bank akceptuje najwyżej jedną poważną awarię systemu płatności rocznie (EDM03), a kierownik bezpieczeństwa aktualizuje mapę ryzyk po incydencie (APO12).<\/p>"},{"pt":"Sprawdź się","quiz":{"id":"q-prb-53-3","sylabus":["PR-01-03"],"tresc":"Kto i w którym procesie ustala <b>apetyt na ryzyko<\/b> organizacji?","opcje":[{"t":"Ład, w EDM03 Zapewnienie optymalizacji ryzyka","ok":true,"w":"Dobrze. Określanie apetytu na ryzyko to decyzja struktur Ładu (FW-PL s. 31), a proces Ładu dla ryzyka to EDM03."},{"t":"Zarządzanie, w MEA02 przy ocenie kontroli","w":"MEA02 ocenia system kontroli wewnętrznej, a nie ustala apetytu na ryzyko."},{"t":"Ład, w EDM04 Zapewnienie optymalizacji zasobów","w":"EDM04 dotyczy zasobów. Ryzyko to EDM03."},{"t":"Zarządzanie, w APO12 Zarządzanie ryzykiem","w":"APO12 pracuje w granicach apetytu: prowadzi rejestr ryzyk i reakcje. Granicę ustala Ład."}],"src":"COBIT 5 Framework (PL), s. 31; COBIT 5 Framework (PL), s. 33","pomoc":{"t":"Pytanie dotyczy lekcji 1.53 „Atlas: EDM01–EDM03 – rama Ładu, korzyści i ryzyko”. Cel lekcji: Potrafię rozpoznać EDM01, EDM02 i EDM03 i odróżnić każdy od jego sąsiada z Zarządzania: APO01, APO05 i APO12.","k":["proc-edm01","proc-edm02","proc-edm03"]}}},{"pt":"Sprawdź się","quiz":{"id":"q-prb-54-3","sylabus":["PR-01-03"],"tresc":"Czym różni się EDM05 (<em>Ensure Stakeholder Transparency<\/em>) od MEA01?","opcje":[{"t":"EDM05 dotyczy tylko finansów, a MEA01 tylko techniki","w":"Fałsz. Oba procesy nie dzielą się według finansów i techniki."},{"t":"EDM05 to raport Ładu dla interesariuszy, MEA01 – kierownictwa dla Ładu","ok":true,"w":"Dobrze. MEA01 zbiera wyniki w górę, a EDM05 decyduje, co i komu organizacja raportuje, i odpowiada za rzetelność."},{"t":"Niczym – to jeden proces w dwóch tłumaczeniach","w":"Fałsz. „Transparentność” i „przejrzystość” to dwie nazwy EDM05, ale MEA01 to inny proces."},{"t":"EDM05 to raport kierownictwa dla Ładu, MEA01 – Ładu dla interesariuszy","w":"Role są odwrócone. EDM05 to Ład, a MEA01 to Zarządzanie."}],"src":"COBIT 5 Framework (PL), s. 33","pomoc":{"t":"Pytanie dotyczy lekcji 1.54 „Atlas: EDM04 i EDM05 – zasoby i przejrzystość wobec interesariuszy”. Cel lekcji: Potrafię rozpoznać EDM04 i EDM05 i odróżnić EDM04 od APO07 i BAI09, a EDM05 od MEA01.","k":["proc-edm04","proc-edm05"]}}},{"lekcje":["pr-k55-edm-cel-ladu"],"pt":"Lekcja 1.55","h":"EDM02–EDM04 to Cel Ładu zamieniony w procesy","b":"<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>składnik Celu Ładu<\/th><th><w k=\"proces\">proces<\/w><\/th><\/tr><tr><td><w k=\"realizacja-korzysci\">realizacja korzyści<\/w><\/td><td>EDM02 <span class=\"en\">Benefits<\/span><\/td><\/tr><tr><td><w k=\"optymalizacja-ryzyka\">optymalizacja ryzyka<\/w><\/td><td>EDM03 <span class=\"en\"><w k=\"ryzyko\">Risk<\/w><\/span><\/td><\/tr><tr><td><w k=\"optymalizacja-zasobow\">optymalizacja zasobów<\/w><\/td><td>EDM04 <span class=\"en\"><w k=\"zasob\">Resource<\/w><\/span><\/td><\/tr><\/table><\/div><p>EDM01 daje ramę, EDM05 – rozliczenie.<\/p>","c":"Domena Ładu w całości: rama (EDM01), trzy składniki tworzenia wartości (EDM02–EDM04) i rozliczenie z interesariuszami (EDM05).","s":"COBIT 5 Framework (PL), s. 17, 71","ctx":"<p>Podręcznik: procesy nadzoru odnoszą się do celów wobec interesariuszy – „dostarczania wartości, optymalizacji ryzyka oraz optymalizacji zasobów”. Na egzaminie to <w k=\"tworzenie-wartosci\">Cel Ładu (Tworzenie Wartości)<\/w>, w podręczniku „cel nadzoru”. Przypisanie składnika do jednego procesu po słowie angielskim to ułatwienie kursu; w praktyce procesy się przenikają.<\/p><p>Schemat „rama → trzy składniki → rozliczenie” jest pamięciowy, nie pochodzi z ilustracji. Trzy pytania z zasady 1 – kto odnosi korzyści, kto ponosi ryzyko, jakie zasoby są wymagane – pasują do EDM02, EDM03 i EDM04.<\/p><p>Przykład: zarząd szpitala decyduje o systemie dokumentacji. Komitet z lekarzami decyduje (EDM01), sprawdza, czy obsługa przyspieszyła (EDM02), uznaje przestój ponad godzinę za niedopuszczalny (EDM03), ocenia budżet i obsadę (EDM04) i składa raport radzie (EDM05). Nikt tu nie instaluje systemu – to praca Zarządzania.<\/p><p>Przewodnik „COBIT 5: Procesy umożliwiające” rozpisuje <w k=\"proc-edm02\">EDM02<\/w> na trzy praktyki zgodne z cyklem Ładu (wiedza ogólna, poza zakresem egzaminu): EDM02.01 ocena optymalizacji wartości, EDM02.02 kierowanie optymalizacją wartości i EDM02.03 monitorowanie optymalizacji wartości. Ten sam wzór – oceń, ukierunkuj, monitoruj – powtarza się w każdym procesie EDM.<\/p>"},{"pt":"Sprawdź się","quiz":{"id":"q-prb-55-3","sylabus":["PR-01-03"],"tresc":"Do jakich celów według COBIT 5 odnoszą się procesy Ładu (<em>governance processes<\/em>)?","opcje":[{"t":"Zgodności z wymogami zewnętrznymi i kontroli wewnętrznej","w":"To tematy procesów MEA w Zarządzaniu."},{"t":"Planowania, budowania, uruchamiania i monitorowania","w":"To czynności Zarządzania (PBRM)."},{"t":"Dostarczania wartości, optymalizacji ryzyka i zasobów","ok":true,"w":"Dobrze. FW-PL s. 71: procesy nadzoru odnoszą się do dostarczania wartości, optymalizacji ryzyka oraz optymalizacji zasobów."},{"t":"Jakości rzeczywistej, kontekstowej, dostępu i bezpieczeństwa","w":"To kategorie celów aktywatora, a nie cele procesów Ładu."}],"src":"COBIT 5 Framework (PL), s. 71","pomoc":{"t":"Pytanie dotyczy lekcji 1.55 „Procesy EDM a Cel Ładu – domena Ładu w całości”. Cel lekcji: Potrafię pokazać, że EDM02, EDM03 i EDM04 odpowiadają trzem składnikom Celu Ładu, a EDM01 i EDM05 je otaczają.","k":[]}}}]};</script>
