<script>window.DECK={"id":"k-pr-atlas-edm","rozdzial":"Rozdział 6 · Zasada 5: Oddzielenie Ładu od Zarządzania · s. 31–33","tytul":"Atlas procesów: EDM (Ład)","prev":"k-pr-prm.html","next":"k-pr-atlas-apo.html","T":{"proc-edm03":{"t":"EDM03 Zapewnienie optymalizacji ryzyka","eg":"EDM03 Zapewnienie optymalizacji ryzyka","pd":"EDM03 Zapewnienie optymalizacji ryzyka","en":"EDM03 Ensure Risk Optimisation","wyj":"Szefostwo ustala, ile niepewności jest gotowe znieść, i pilnuje, żeby tej granicy nie przekraczać.\n\nZapewnienie zrozumienia i optymalizacji ryzyka związanego z IT, zgodnie z apetytem i tolerancją przedsiębiorstwa.\n\nŻeby organizacja świadomie wiedziała, ile ryzyka związanego z IT akceptuje, i żeby tej granicy pilnowano.","zycie":"Rodzice ustalają: dziecko może samo jeździć rowerem po osiedlu, ale nie po drodze krajowej. Nie pilnują każdej przejażdżki. Ustalają granicę i co jakiś czas sprawdzają, czy jest przestrzegana. To jest EDM03.","firma":"Zarząd sklepu internetowego decyduje: przerwa w sprzedaży dłuższa niż 4 godziny jest nie do przyjęcia. Dział IT sam ocenia konkretne zagrożenia i dobiera zabezpieczenia. Zarząd co kwartał sprawdza, czy ryzyko mieści się w tej granicy.","urzad":"Wójt ustala, że dane mieszkańców nie mogą wyjść poza urząd, a przerwa w obsłudze interesantów nie może trwać dłużej niż jeden dzień roboczy. Informatyk analizuje konkretne zagrożenia i proponuje zabezpieczenia. Wójt nie dobiera zabezpieczeń, tylko ustala granicę i co kwartał rozlicza, czy ryzyko się w niej mieści. To EDM03.","it":"Zarząd banku zatwierdza deklarację apetytu na ryzyko IT, np. „przestój bankowości internetowej najwyżej 4 godziny rocznie”. To EDM03. Analizę ryzyk i reakcje prowadzi APO12 Zarządzanie ryzykiem.","egz":"Słowa „apetyt na ryzyko”, „tolerancja”, „zarząd ustala akceptowalny poziom ryzyka” → EDM03. Słowa „rejestr ryzyk”, „analiza scenariuszy”, „profil ryzyka”, „plan reakcji” → APO12. Nazwa egzaminacyjna PL niepotwierdzona: na egzaminie nazwa może brzmieć inaczej niż w podręczniku. Egzamin używa własnych tłumaczeń, w domenach trybu rozkazującego (np. „Dostosuj, Planuj i Organizuj”). Rozpoznawaj proces po kodzie EDM03 i słowie kluczowym EN Risk Optimisation. Słowo „ryzyko” ma też APO12 Zarządzanie ryzykiem. EDM03 to Ład (apetyt na ryzyko, kierunek), a APO12 to Zarządzanie (rozpoznanie, analiza, reakcja). Nie myl z: APO12 Zarządzanie ryzykiem – APO12 (Zarządzanie) zbiera dane o ryzyku, analizuje je, utrzymuje profil ryzyka i reaguje. EDM03 (Ład) ustala apetyt na ryzyko i rozlicza, czy go przestrzegamy.; Optymalizacja ryzyka – Optymalizacja ryzyka to składnik Celu Ładu (pojęcie). EDM03 to proces Ładu, który go zapewnia.; APO13 Zarządzanie bezpieczeństwem – APO13 organizuje system zarządzania bezpieczeństwem informacji. Ryzyko bezpieczeństwa to tylko część ryzyka IT, którym kieruje EDM03.","src":"COBIT 5: Enabling Processes, sekcja EDM03 — Process Description / Purpose / Practices"},"proc-edm04":{"t":"EDM04 Zapewnienie optymalizacji zasobów","eg":"EDM04 Zapewnienie optymalizacji zasobów","pd":"EDM04 Zapewnienie optymalizacji zasobów","en":"EDM04 Ensure Resource Optimisation","wyj":"Szefostwo pilnuje, żeby ludzi, pieniędzy i sprzętu do informatyki było tyle, ile trzeba, i żeby ich nie marnować.\n\nZapewnienie odpowiednich zasobów IT i ich optymalnego wykorzystania do wspierania celów przedsiębiorstwa.\n\nŻeby IT miało dość ludzi, pieniędzy i technologii do realizacji celów i żeby tych zasobów nie marnować.","zycie":"Planujesz przeprowadzkę. Sprawdzasz, czy wystarczy rąk do noszenia, pieniędzy na auto i czasu. Sam nie nosisz kartonów. Decydujesz, ile czego potrzeba i czy niczego nie marnujesz. To EDM04.","firma":"Zarząd firmy kurierskiej widzi, że dwóch programistów obsługuje dziesięć systemów, a serwery stoją w połowie puste. Każe przesunąć pieniądze ze sprzętu na ludzi. Dyrektor IT wykonuje to w swoich procesach. Zarząd sprawdza efekt po kwartale.","urzad":"Starosta widzi, że każdy wydział kupuje własne skanery i programy, a część sprzętu stoi nieużywana. Decyduje: jeden wspólny zakup i jeden informatyk na trzy wydziały. Potem sprawdza, czy zasoby nie leżą odłogiem. To EDM04.","it":"Zarząd ocenia, że dział IT ma za mało specjalistów od chmury i za dużo nieużywanych licencji. Ustala kierunek: mniej licencji, więcej szkoleń. Wykonują to APO07 Zarządzanie zasobami ludzkimi i BAI09.","egz":"Trzy „zasoby”: EDM04 Resource Optimisation (Ład, wszystkie zasoby), APO07 Human Resources (Zarządzanie, ludzie), BAI09 Assets (Zarządzanie, aktywa). W pytaniu szukaj poziomu (kierunek czy wykonanie) i rodzaju zasobu. Nazwa egzaminacyjna PL niepotwierdzona: na egzaminie nazwa może brzmieć inaczej niż w podręczniku. Egzamin używa własnych tłumaczeń, w domenach trybu rozkazującego (np. „Dostosuj, Planuj i Organizuj”). Rozpoznawaj proces po kodzie EDM04 i słowie kluczowym EN Resource Optimisation. Pułapka tłumaczenia „zasoby”: EDM04 to Resource (wszystkie zasoby, Ład), APO07 to Human Resources (zasoby ludzkie), a BAI09 to Assets (aktywa, w podręczniku też „Zarządzanie zasobami”). Po polsku trzy razy „zasoby”, po angielsku trzy różne słowa. Nie myl z: APO07 Zarządzanie zasobami ludzkimi – APO07 (Zarządzanie) zajmuje się tylko ludźmi: role, kompetencje, szkolenia, zastępstwa. EDM04 (Ład) patrzy na wszystkie zasoby i ustala kierunek.; BAI09 Zarządzanie zasobami – BAI09 Manage Assets to aktywa: sprzęt i licencje w cyklu życia. Podręcznik nazywa go „Zarządzanie zasobami”, ale to nie EDM04.; Optymalizacja zasobów – Optymalizacja zasobów to składnik Celu Ładu (pojęcie). EDM04 to proces Ładu, który go zapewnia.","src":"COBIT 5: Enabling Processes, sekcja EDM04 — Process Description / Purpose / Practices"},"proc-edm01":{"t":"EDM01 Zapewnienie i utrzymanie ładu korporacyjnego","eg":"EDM01 Zapewnienie i utrzymanie ładu korporacyjnego","pd":"EDM01 Zapewnienie i utrzymanie ładu korporacyjnego","en":"EDM01 Ensure Governance Framework Setting and Maintenance","wyj":"Szefostwo ustala, kto i jak decyduje o informatyce, i pilnuje, żeby te zasady działały.\n\nUstanowienie i utrzymanie spójnych mechanizmów Ładu, odpowiedzialności oraz uprawnień decyzyjnych.\n\nŻeby było jasne, kto i jak decyduje o informatyce, zanim ktokolwiek zacznie wydawać pieniądze i budować systemy.","zycie":"Wspólnota mieszkaniowa uchwala regulamin: o wydatkach do 5 tys. zł decyduje zarząd wspólnoty, powyżej decyduje zebranie. Raz w roku sprawdzacie, czy ten podział się sprawdza. Niczego nie remontujecie, tylko ustalacie, kto o czym decyduje. To jest EDM01.","firma":"Zarząd spółki powołuje komitet ds. IT i spisuje, o czym komitet decyduje sam, a co trafia do zarządu. Po roku zarząd ocenia, czy decyzje zapadają szybko i we właściwym gronie. Tak działa EDM01.","urzad":"Burmistrz zarządzeniem ustala, że o zakupach systemów informatycznych decyduje zespół do spraw cyfryzacji, a strategię cyfryzacji zatwierdza rada miasta. Co rok sprawdza, czy wydziały nie kupują programów z pominięciem zespołu. Sam nie wybiera programów – ustala, kto i jak o nich decyduje. To jest EDM01.","it":"Komitet strategiczny ds. IT dostaje od zarządu uprawnienia i zasady eskalacji. To ustala EDM01. Role i procesy działu IT, które z tego wynikają, porządkuje APO01 Zarządzanie metodyką zarządzania IT.","egz":"EDM01 jest w domenie EDM, czyli w Ładzie. Słowo-klucz EN: Governance Framework. Pytanie o to, kto i jak decyduje o IT na samej górze → EDM01. Pytanie o role, polityki i procesy zarządzania IT → APO01. Nazwa egzaminacyjna PL niepotwierdzona: na egzaminie nazwa może brzmieć inaczej niż w podręczniku. Egzamin używa własnych tłumaczeń, w domenach trybu rozkazującego (np. „Dostosuj, Planuj i Organizuj”). Rozpoznawaj proces po kodzie EDM01 i słowie kluczowym EN Governance Framework. Uwaga na słowa: podręcznik mówi „ład korporacyjny”, a EN mówi o strukturze ramowej Ładu nad IT. Nie myl z APO01, który ma w nazwie „metodykę zarządzania IT”. Nie myl z: APO01 Zarządzanie metodyką zarządzania IT – APO01 to Zarządzanie: kierownik IT buduje i utrzymuje system zarządzania IT (role, polityki, procesy). EDM01 to Ład: organ Ładu ustala zasady decydowania i ocenia, czy działają.; Podejście do Ładu – Podejście do Ładu to model pojęciowy z Frameworka (cel, aktywatory, zakres, role). EDM01 to proces, w którym organ Ładu ten system faktycznie ustanawia i utrzymuje.","src":"COBIT 5: Enabling Processes, sekcja EDM01 — Process Description / Purpose / Practices"},"proc-edm05":{"t":"EDM05 Zapewnienie Transparentności Interesariuszy","eg":"EDM05 Zapewnienie Transparentności Interesariuszy","pd":"EDM05 Zapewnienie przejrzystości dotyczącej interesariuszy","en":"EDM05 Ensure Stakeholder Transparency","wyj":"Szefostwo mówi uczciwie wszystkim zainteresowanym, jak idzie informatyce: wyniki, koszty i kłopoty.\n\nZapewnienie przejrzystości pomiaru i raportowania oraz skutecznej komunikacji z interesariuszami.\n\nŻeby interesariusze dostawali rzetelny, zrozumiały obraz tego, jak IT spełnia ich oczekiwania, i mogli to ocenić.","zycie":"Skarbnik komitetu rodzicielskiego co semestr pokazuje rodzicom: ile zebrano, na co wydano, co się nie udało. Rodzice akceptują plan na kolejny semestr. Uczciwy, zrozumiały obraz dla wszystkich zainteresowanych to EDM05.","firma":"Zarząd spółki w raporcie rocznym pokazuje akcjonariuszom wyniki IT: dostępność sklepu, koszty, incydenty i plan poprawy. Wcześniej uzgodnił z radą nadzorczą, jakie mierniki pokaże. Tak działa EDM05.","urzad":"Burmistrz publikuje roczny raport o e-usługach: ile spraw załatwiono przez internet, ile było awarii i ile to kosztowało. Rada miasta i mieszkańcy widzą prawdziwy obraz, także porażki. Wcześniej burmistrz ustalił z radą, które liczby raport ma zawsze zawierać. To EDM05.","it":"Rada nadzorcza zatwierdza, które mierniki IT trafią do raportu rocznego dla akcjonariuszy i regulatora. To EDM05. Dane dostarcza MEA01 Monitorowanie, ocena i oszacowanie wydajności i zgodności.","egz":"Na egzaminie: „Zapewnienie Transparentności Interesariuszy”. Komunikacja z interesariuszami i raportowanie na poziomie Ładu → EDM05. Zbieranie i ocena mierników przez kierownictwo → MEA01. Egzamin: „Zapewnienie Transparentności Interesariuszy”. Podręcznik: „Zapewnienie przejrzystości dotyczącej interesariuszy”. To ten sam EDM05. Nie myl z MEA01, który też dotyczy wyników i raportów, ale na poziomie Zarządzania. Nie myl z: MEA01 Monitorowanie, ocena i oszacowanie wydajności i zgodności – MEA01 (Zarządzanie) zbiera i ocenia dane o wynikach i zgodności i raportuje je w górę. EDM05 (Ład) decyduje, co i jak raportujemy interesariuszom, i odpowiada za przejrzystość.; Monitoruj, Oszacuj i Oceń (MEA) – Domena MEA monitoruje na poziomie Zarządzania. EDM05 to monitorowanie i komunikacja na poziomie Ładu.","src":"COBIT 5: Enabling Processes, sekcja EDM05 — Process Description / Purpose / Practices"},"proc-edm02":{"t":"EDM02 Zapewnienie realizacji korzyści","eg":"EDM02 Zapewnienie realizacji korzyści","pd":"EDM02 Zapewnienie realizacji korzyści","en":"EDM02 Ensure Benefits Delivery","wyj":"Szefostwo pilnuje, żeby pieniądze wydane na informatykę dały prawdziwy pożytek, a nie tylko nowe urządzenia.\n\nZapewnienie wartości z inwestycji, usług i aktywów IT przez ocenę, kierowanie i monitorowanie realizacji korzyści.\n\nŻeby pieniądze wydane na IT dawały organizacji prawdziwą korzyść, a nie kończyły się na zakupie i wdrożeniu.","zycie":"Kupiliście robota sprzątającego za 1500 zł. Po trzech miesiącach pytacie: czy naprawdę mamy więcej wolnego czasu? Jeśli robot stoi w szafie, korzyści nie ma, choć zakup się „udał”. Pilnowanie tej różnicy to EDM02.","firma":"Zarząd sklepu internetowego zatwierdził nową bramkę płatności, bo miała zmniejszyć porzucanie koszyków. Pół roku po wdrożeniu zarząd sprawdza, czy porzuceń jest mniej. Nie liczy, czy projekt skończył się w terminie. Liczy, czy przyszła korzyść.","urzad":"Rada powiatu dała pieniądze na e-rejestrację pojazdów. Po roku pyta starostę: o ile skróciły się kolejki w wydziale komunikacji? Gdy korzyści brak, rada każe poprawić usługę albo przestać na nią wydawać. To EDM02.","it":"Rada nadzorcza przegląda portfel inwestycji IT z mierzonymi korzyściami (np. czas obsługi klienta). Ocenę wartości i decyzje o dalszym finansowaniu podejmuje w EDM02, a portfel układa APO05 Zarządzanie Portfelem.","egz":"EDM02 = Ład + korzyści i wartość. Razem z EDM03 Zapewnienie optymalizacji ryzyka i EDM04 Zapewnienie optymalizacji zasobów odpowiada trzem składnikom Celu Ładu: korzyści, ryzyko, zasoby. Słowa „wartość inwestycji”, „uzasadnienie biznesowe” na poziomie organu Ładu → EDM02. Nazwa egzaminacyjna PL niepotwierdzona: na egzaminie nazwa może brzmieć inaczej niż w podręczniku. Egzamin używa własnych tłumaczeń, w domenach trybu rozkazującego (np. „Dostosuj, Planuj i Organizuj”). Rozpoznawaj proces po kodzie EDM02 i słowie kluczowym EN Benefits. Nie myl z BAI01 (doprowadzenie projektu do końca) ani z APO05 (portfel). „Realizacja” znaczy tu, że korzyść ma się naprawdę pojawić, a nie że projekt ma się zakończyć. Nie myl z: APO05 Zarządzanie Portfelem – APO05 (Zarządzanie) wybiera i równoważy inwestycje w portfelu. EDM02 (Ład) ustala, jakiej wartości oczekujemy, i ocenia, czy ją dostajemy.; BAI01 Zarządzanie programami i projektami – BAI01 dowozi projekt: zakres, termin, budżet. EDM02 pyta, czy z dowiezionego projektu jest pożytek.; Realizacja korzyści – Realizacja korzyści to składnik Celu Ładu (pojęcie). EDM02 to proces, który ten składnik zapewnia.","src":"COBIT 5: Enabling Processes, sekcja EDM02 — Process Description / Purpose / Practices"}},"S":[{"lekcje":["pr-k53-atlas-edm01-edm03","pr-k54-atlas-edm04-edm05"],"pt":"Lekcje 1.53–1.54","h":"Pięć procesów Ładu – każdy ma sobowtóra w Zarządzaniu","b":"<ul><li><b><w k=\"proc-edm01\">EDM01 Ensure Governance Framework Setting and Maintenance</w></b>: ustanowienie i utrzymanie spójnych mechanizmów Ładu, odpowiedzialności oraz uprawnień decyzyjnych.</li><li><b><w k=\"proc-edm02\">EDM02 Ensure Benefits Delivery</w></b>: zapewnienie wartości z inwestycji, usług i aktywów IT przez ocenę, kierowanie i monitorowanie realizacji korzyści.</li><li><b>EDM03 Ensure Risk Optimisation</b>: zapewnienie zrozumienia i optymalizacji ryzyka związanego z IT, zgodnie z apetytem i tolerancją przedsiębiorstwa.</li><li><b><w k=\"proc-edm04\">EDM04 Ensure Resource Optimisation</w></b>: zapewnienie odpowiednich zasobów IT i ich optymalnego wykorzystania do wspierania celów przedsiębiorstwa.</li><li><b><w k=\"proc-edm05\">EDM05 Ensure Stakeholder Transparency</w></b>: zapewnienie przejrzystości pomiaru i raportowania oraz skutecznej komunikacji z interesariuszami.</li></ul>","c":"Angielska nazwa i cel procesu rozstrzygają znaczenie. Polskie nazwy są opisowym przekładem kursu.","s":"ISACA, COBIT 5: Enabling Processes (2012), opisy EDM01, EDM02, EDM03, EDM04, EDM05","ctx":"<p>Procesy dobieramy według celu i mandatu działania. Ich zakresy się stykają i współpracują; nie są rozłącznymi szufladkami.</p><p><b>EDM01:</b> Organ Ładu ocenia zasady podejmowania decyzji o IT, ustala odpowiedzialności i nadzoruje skuteczność systemu Ładu.</p><p><b>EDM02:</b> Organ Ładu ocenia, czy portfel inwestycji i usług IT zapewnia oczekiwane korzyści oraz wartość dla interesariuszy.</p><p><b>EDM03:</b> Organ Ładu ustala apetyt na ryzyko IT i monitoruje, czy istotne ryzyka pozostają w przyjętych granicach tolerancji.</p><p><b>EDM04:</b> Organ Ładu ocenia, czy organizacja ma odpowiednich ludzi, informacje i technologię do realizacji celów oraz czy wykorzystuje je optymalnie.</p><p><b>EDM05:</b> Organ Ładu określa wymagania komunikacji z interesariuszami i nadzoruje przejrzystość raportowania wyników oraz zgodności.</p>"},{"pt":"Sprawdź się","quiz":{"id":"q-prb-46-3","sylabus":["PR-01-03"],"tresc":"Ile procesów ma Referencyjny Model Procesu COBIT 5 (<em>Process Reference Model</em>) i jak się dzielą?","opcje":[{"t":"37: 5 procesów Ładu i 32 procesy Zarządzania","ok":true,"w":"Dobrze. Ilustracja 16 pokazuje 37 procesów: EDM ma 5, a APO, BAI, DSS i MEA razem 32."},{"t":"32: po 8 procesów w
