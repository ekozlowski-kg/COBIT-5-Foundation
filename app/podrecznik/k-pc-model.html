<script>window.DECK={"id":"k-pc-model","rozdzial":"Rozdział 8 · Model zdolności procesu · s. 41–45","tytul":"Model zdolności procesu a model dojrzałości","prev":"k-im-uzasadnienie.html","next":"k-pc-poziomy.html","T":{"cobit-5":{"t":"COBIT 5","eg":"COBIT 5","pd":"COBIT 5","en":"COBIT 5","wyj":"Zbiór sprawdzonych reguł z 2012 roku, jak mądrze decydować o informatyce i nią kierować.\n\nCOBIT 5 (ISACA, 2012) opiera się na 5 zasadach (principles), 7 kategoriach aktywatorów (enablers) i modelu referencyjnym 37 procesów: 5 Ładu w domenie EDM i 32 Zarządzania w domenach APO, BAI, DSS i MEA. Kaskada celów przekłada potrzeby interesariuszy na cele organizacji, cele związane z IT i cele aktywatorów. Integruje wcześniejsze wytyczne ISACA (COBIT 4.1, Val IT, Risk IT) i jest spójny z innymi standardami, np. ITIL i ISO/IEC 27001.\n\nŻeby organizacja mogła mądrze kierować informatyką i nią zarządzać: osiągać korzyści przy rozsądnym ryzyku i zużyciu zasobów. Daje jedną, spójną strukturę ramową zamiast wielu luźnych wskazówek.","zycie":"Rodzina ma coraz więcej sprzętu i kont: telefony, laptop, router, bank, zdjęcia w chmurze. Ustalacie, kto decyduje o zakupach, kto pilnuje haseł i kopii, i co miesiąc sprawdzacie, czy wszystko działa i czy nie przepłacacie. COBIT 5 to taki „regulamin domu” dla informatyki, tylko spisany dla firm i urzędów.","firma":"Właściciel warsztatu kupił program do rezerwacji, kasę online i monitoring, ale nie wie, czy to się opłaca i kto za co odpowiada. COBIT 5 podpowiada, jak to poukładać: kto wyznacza kierunek, kto prowadzi codzienne sprawy, jak mierzyć efekty i ryzyko. To gotowa rama, a nie program do zainstalowania.","urzad":"Burmistrz słyszy, że urząd wydaje na informatykę coraz więcej, a mieszkańcy dalej stoją w kolejkach. Sięga po COBIT 5, żeby ustalić, czego chce od systemów, kto w urzędzie za nie odpowiada i jak co roku sprawdzać, czy przynoszą korzyści. COBIT 5 służy tu do uporządkowania Ładu i Zarządzania IT.","it":"Bank po poważnej awarii bankowości internetowej porządkuje IT według COBIT 5: zarząd przejmuje 5 procesów Ładu (EDM01–EDM05), CIO 32 procesy Zarządzania, np. DSS04 Zarządzanie ciągłością, a audyt wewnętrzny ocenia zdolność procesów.","egz":"Liczby do zapamiętania: 5 zasad, 7 aktywatorów, 37 procesów (EDM 5 + APO 13 + BAI 10 + DSS 6 + MEA 3), 6 poziomów zdolności (0–5). Nie myl z: COBIT 2019 – Nowsza wersja (2018/2019) – inne pojęcia (komponenty, 40 celów, czynniki projektowe). Egzamin COBIT 5 Foundation dotyczy COBIT 5.; ITIL – ITIL to dobre praktyki zarządzania usługami IT – jak dostarczać usługi. COBIT patrzy szerzej: Ład i Zarządzanie całością IT w organizacji.; ISO/IEC 27001 – ISO/IEC 27001 to norma bezpieczeństwa informacji z certyfikacją; COBIT 5 to struktura ramowa Ładu i Zarządzania IT.","src":"COBIT 5 Framework (PL), s. 90"},"przeznaczenie-procesu":{"t":"Przeznaczenie procesu","eg":"Przeznaczenie procesu","pd":"Cel procesu","en":"Process purpose","wyj":"Jedno zdanie o tym, po co w ogóle ta robota istnieje.\n\nOpis każdego procesu zaczyna się od zdania o przeznaczeniu. Z niego wynikają rezultaty, a z rezultatów praktyki. Na poziomie 1 asesor sprawdza, czy proces osiąga swoje przeznaczenie.\n\nŻeby każdy wiedział, po co dany proces w ogóle istnieje, zanim zacznie oceniać jego kroki.","zycie":"Przeznaczenie porannego gotowania: rodzina wychodzi z domu najedzona. Nie chodzi o to, ile jajek usmażysz, tylko po co w ogóle wstajesz wcześniej.","firma":"Przeznaczenie procesu reklamacji w sklepie: klient z wadliwym towarem szybko dostaje uczciwe rozwiązanie. Z tego zdania wynikają rezultaty, kroki i dokumenty.","urzad":"Przeznaczenie procesu wydawania dowodów osobistych w urzędzie gminy: mieszkaniec dostaje ważny dokument bez zbędnej zwłoki. To jedno zdanie, od którego zaczyna się opis procesu. Z niego wynikają rezultaty, np. „dowód gotowy do odbioru w ustawowym terminie”, i kroki: przyjęcie wniosku, sprawdzenie danych, wydanie.","it":"Każdy z 37 procesów w COBIT 5: Procesy umożliwiające ma opis i deklarację przeznaczenia. Dla DSS02 brzmi ona w skrócie: szybko przywrócić normalne działanie usług po incydencie.","egz":"„Po co proces istnieje” → przeznaczenie procesu (process purpose). W podręczniku: „cel procesu”. Egzamin: „Przeznaczenie procesu”. Podręcznik (rozdział 8): „cel procesu”. Uwaga: w aktywatorze Procesy „cel procesu” to process goal, czyli coś innego, bliższego rezultatowi. Nie myl z: Rezultat procesu – Rezultat to obserwowalny efekt osiągnięcia przeznaczenia. Przeznaczenie to ogólne „po co”.; Kategorie celów procesu – Cele procesu (wewnętrzne, kontekstowe, dostępności) należą do aktywatora Procesy. To process goals, a nie przeznaczenie.; Cele związane z informatyką – Cele związane z IT pochodzą z kaskady celów. Przeznaczenie dotyczy jednego procesu.","src":"COBIT 5 Framework (PL), s. 43"},"model-zdolnosci":{"t":"Model Zdolności Procesu","eg":"Model Zdolności Procesu","pd":"Model potencjału procesu COBIT 5","en":"COBIT 5 Process Capability Model (ISO/IEC 15504)","wyj":"Szkolna skala od 0 do 5, która mówi, jak dobrze robimy konkretną rzecz.\n\nModel Zdolności Procesu (Process Capability Model) opiera się na ISO/IEC 15504. Proces ocenia się na sześciu poziomach, od 0 (Niekompletny, incomplete) do 5 (Zoptymalizowany, optimising), a o poziomach decyduje 9 atrybutów procesu (process attributes). Atrybuty ocenia się skalą N/C/W/P: proces osiąga poziom, gdy atrybuty tego poziomu mają W lub P, a wszystkie atrybuty niższych poziomów mają P (Pełny).\n\nŻeby ocenić, jak dobrze działa i jak jest zarządzany konkretny proces, w sposób porównywalny i powtarzalny, i wiedzieć, co poprawić, by wejść poziom wyżej.","zycie":"Rodzina ocenia swoje domowe sprawy tą samą skalą 0–5: płacenie rachunków, sprzątanie, gotowanie. Wychodzi, że rachunki są na poziomie 3 (wszyscy robią to według jednej ustalonej procedury), a sprzątanie ledwie na 1 (jakoś się robi, ale bez planu). Jedna skala do porównania różnych procesów – to model zdolności procesu.","firma":"Warsztat samochodowy przez lata oceniał się starą skalą i wychodziło mu „trzy na pięć”. Po przejściu na nową, gdzie każdy poziom trzeba udowodnić konkretnymi atrybutami (np. czy przyjmowanie aut jest planowane, a dokumenty pod kontrolą), wychodzi poziom 1. Warsztat nie stał się gorszy – skala jest bardziej wymagająca, tak jak model zdolności COBIT 5 wobec modelu dojrzałości COBIT 4.1.","urzad":"Audytor ocenia w starostwie trzy procesy IT: obsługa zgłoszeń wychodzi na poziom 2 (zarządzany), kopie zapasowe na 1 (wykonywany), a zarządzanie zmianami na 0 (niekompletny). O strukturach, ludziach czy kulturze urzędu ta ocena nic nie mówi. Model zdolności mierzy procesy, czyli jeden z siedmiu aktywatorów, a nie cały Ład IT.","it":"Audytor ocenia DSS02 (Zarządzanie zgłoszeniami serwisowymi i incydentami): PA 1.1 dostaje P, a PA 2.1 i PA 2.2 dostają W, więc proces osiąga poziom 2. Ocena dotyczy tylko DSS02, a nie całego IT.","egz":"Model zdolności COBIT 5 opiera się na ISO/IEC 15504. Ocena procesów nie daje pełnego obrazu stanu Ładu, bo procesy to tylko jeden z 7 aktywatorów. Egzamin: „zdolność procesu”, „Ocena Zdolności Procesu”. Podręcznik: „potencjał procesu”, „ocena potencjału procesu”. Nie myl z: Model dojrzałości COBIT 4.1 – Poziomy dojrzałości 0–5 (nie istnieje… zoptymalizowany) ≠ poziomy zdolności ISO 15504. Nie da się ich prosto porównać.","src":"COBIT 5 Framework (PL), s. 41, 43"},"proces":{"t":"Proces","eg":"Proces","pd":"Proces","en":"Process","wyj":"Coś, co robimy regularnie i zawsze w podobny sposób, np. przyjmowanie każdego zgłoszenia.\n\nProces (process) przyjmuje wejścia (inputs), przetwarza je przez praktyki i działania ukierunkowane przez polityki i procedury i daje wyniki (outputs), np. produkt albo usługę. Ma właściciela, role i mierniki, a wynik jednego procesu bywa wejściem innego. W COBIT 5 procesy są jednym z siedmiu aktywatorów, a Referencyjny Model Procesu opisuje ich 37.\n\nŻeby powtarzalną pracę wykonywać za każdym razem tak samo dobrze, niezależnie od tego, kto ją akurat robi, i żeby dało się ją mierzyć i poprawiać.","zycie":"Co sobotę rano sprawdzasz lodówkę, piszesz listę, jedziesz do sklepu, rozpakowujesz i odhaczasz, czego zabrakło. Za tydzień wszystko powtarza się od nowa. To proces: stałe kroki, wejście (pusta lodówka i lista) i wynik (pełna lodówka).","firma":"W sklepie internetowym z herbatą przychodzi zamówienie, pracownik pakuje paczkę, drukuje etykietę i fakturę, a kurier odbiera paczki o 15:00. Tak samo dzieje się z każdym zamówieniem, codziennie. To proces – powtarzalny, z wejściem (zamówienie) i wynikiem (paczka u klienta).","urzad":"Do urzędu gminy wpływa wniosek o wycinkę drzewa. Kancelaria go rejestruje, kierownik przydziela go referentowi, ten jedzie na oględziny i wydaje decyzję. Każdy kolejny wniosek idzie tą samą ścieżką – to jest proces.","it":"DSS02 (Zarządzanie zgłoszeniami serwisowymi i incydentami) to proces: każde zgłoszenie (wejście) jest rejestrowane, klasyfikowane, rozwiązywane i zamykane (praktyki), a wynikiem jest przywrócona usługa i wpis w rejestrze. Działa codziennie i tak samo dla każdego zgłoszenia.","egz":"Opis „zbiór praktyk ukierunkowanych politykami i procedurami, który przetwarza wejścia w wyniki” to Proces (Załącznik H). Nie myl z: Projekt – Projekt jest jednorazowy, ma początek i koniec (np. wdrożenie systemu). Proces trwa i się powtarza (np. obsługa zgłoszeń w tym systemie).","src":"COBIT 5 Framework (PL), s. 93"},"aktywator":{"t":"Aktywator","eg":"Aktywator","pd":"Czynnik umożliwiający","en":"Enabler","wyj":"Wszystko, co musi zagrać, żeby informatyka działała dobrze: ludzie, reguły, narzędzia, informacje.\n\nCOBIT 5 dzieli aktywatory (enablers) na 7 kategorii, od Zasad, polityk i struktur ramowych (Principles, Policies and Frameworks) po Ludzi, umiejętności i kompetencje (People, Skills and Competencies). Kaskada celów wyznacza, czego oczekujemy od każdego aktywatora (cele aktywatora). Aktywatory są od siebie zależne i dostarczają sobie wejść, np. proces potrzebuje informacji i przeszkolonych ludzi. Każdy opisuje się w 4 wymiarach: interesariusze, cele, cykl życia, dobre praktyki.\n\nŻeby organizacja widziała wszystko, co musi zagrać, by osiągnąć cele, a nie tylko technologię. Aktywatory to elementy, przez które Ład i Zarządzanie realnie wpływają na wynik.","zycie":"Chcesz, żeby dzieci same odrabiały lekcje. Ustalacie zasadę „najpierw zadania, potem tablet”, stałą godzinę po obiedzie, kupujecie biurko z lampką, a Ty w tym czasie też siadasz z książką zamiast z telefonem. Zasada, stała pora, biurko i Twój przykład to różne aktywatory – działają dopiero razem.","firma":"Właścicielka kawiarni chce, żeby kawa smakowała tak samo na każdej zmianie. Spisuje recepturę, ustala kolejność parzenia, szkoli nowego baristę i oddaje ekspres do serwisu. Receptura, sposób parzenia, umiejętności baristy i ekspres to aktywatory – brak jednego psuje całość.","urzad":"Urząd gminy chce wydawać decyzje w terminie. Ma instrukcję kancelaryjną, ustalony obieg wniosku, wydział, który za sprawę odpowiada, system EZD i urzędników po szkoleniu z KPA. Każdy z tych elementów to aktywator innej kategorii.","it":"Proces DSS04 Zarządzanie ciągłością to aktywator z kategorii Procesy, ale działa tylko razem z innymi: polityką ciągłości (Zasady, polityki i struktury ramowe), aktualnym planem awaryjnym (Informacja), stanowiskiem zapasowym (Usługi, infrastruktura i aplikacje) i przećwiczonym zespołem (Ludzie, umiejętności i kompetencje).","egz":"Pułapka terminologiczna nr 1 obok Ład/Nadzór. Liczba kategorii: 7. Liczba zasad: 5. Liczba procesów: 37. Egzamin: „Aktywator”. Podręcznik: „Czynnik umożliwiający”. EN: Enabler. W pytaniach egzaminacyjnych prawie zawsze pada „Aktywator”. Nie myl z: Czynnik wpływający na potrzeby interesariuszy – Wyznacznik zmienia potrzeby; aktywator pomaga je zaspokoić.; Komponent (COBIT 2019) – W COBIT 2019 aktywatory nazwano „komponentami systemu ładu”. Na egzaminie COBIT 5 używaj „aktywator”.","src":"COBIT 5 Framework (PL), s. 14, 91"}},"S":[{"pt":"Lekcje 4.10–4.11","h":"Model zdolności ocenia osobno każdy proces według ISO/IEC 15504","b":"<p><w k=\"model-zdolnosci\">Model zdolności procesu<\/w> <span class=\"en\">Process Capability Model<\/span> mierzy procesy Ładu i Zarządzania i wskazuje usprawnienia.<\/p><ul><li>każdy <w k=\"proces\">proces<\/w> ma własny poziom – nie ma „poziomu organizacji”,<\/li><li>procesy to 1 z 7 <w k=\"aktywator\">aktywatorów<\/w>, więc to nie pełny obraz Ładu.<\/li><\/ul>","c":"„Zdolność” i podręcznikowy „potencjał” to jedno pojęcie; „dojrzałość” należy do COBIT 4.1.","s":"COBIT 5 Framework (PL), s. 41, 43","ctx":"<p>Model opiera się na normie ISO/IEC 15504 (ocena procesów) i obejmuje 37 procesów: Ładu z domeny Oszacuj, Kieruj i Monitoruj <span class=\"en\">EDM – Evaluate, Direct and Monitor<\/span> oraz Zarządzania (Planuj, Twórz, Wykonuj i Monitoruj, <span class=\"en\">PBRM – Plan, Build, Run and Monitor<\/span>). Każdy proces ocenia się według dziewięciu atrybutów; wyników się nie uśrednia, bo średnia ukryłaby najsłabszy proces. Ocena procesów „nie zapewni pełnego obrazu stanu nadzoru” – kultura czy struktury organizacyjne wymagają osobnej oceny.<\/p><p>Pułapka nazw: podręcznik mówi „model potencjału” i „procesy nadzoru”, egzamin – zdolność i Ład. Przykład: bank dostaje trzy wyniki – obsługa zgłoszeń 2, zarządzanie ryzykiem 1, kopie zapasowe 3 – i od razu widzi, gdzie wydać pieniądze. Odpowiedź „organizacja osiągnęła poziom 3” jest błędna.<\/p>"},{"pt":"Sprawdź się","quiz":{"tresc":"Jak na egzaminie PL nazywa się model, który podręcznik PL nazywa „modelem potencjału procesu” (<em>Process Capability Model<\/em>)?","opcje":[{"t":"Model zdolności procesu","ok":true,"w":"Dobrze. Egzamin PL: zdolność procesu. Podręcznik: potencjał procesu. To ten sam model."},{"t":"Referencyjny Model Procesu","w":"To model opisu procesów (PRM), a nie model ich oceny."},{"t":"Model potencjału procesu","w":"To forma z podręcznika. Na egzaminie PL wybieraj „model zdolności procesu”."},{"t":"Model dojrzałości procesu","w":"Dojrzałość (<em>maturity<\/em>) to inny, starszy model z COBIT 4.1."}],"src":"COBIT 5 Framework (PL), s. 41; materiały Altkom","pomoc":{"t":"Pytanie dotyczy lekcji 4.10 „Model zdolności procesu – miara dla każdego procesu”. Cel lekcji: Potrafię powiedzieć, co mierzy model zdolności procesu i na jakiej normie się opiera.","k":["model-zdolnosci"]}}},{"pt":"Sprawdź się","quiz":{"tresc":"Ubezpieczyciel ocenił wszystkie procesy na wysokim poziomie. Dlaczego według COBIT 5 nie może z tego wnioskować, że jego Ład jest w pełni dobry?","opcje":[{"t":"Model zdolności ocenia tylko procesy Zarządzania, a pomija procesy Ładu EDM","w":"Model obejmuje procesy Ładu (EDM) i Zarządzania (PBRM)."},{"t":"Procesy to tylko jeden z siedmiu aktywatorów","ok":true,"w":"Dobrze. Ocena procesów nie daje pełnego obrazu Ładu, więc trzeba ocenić też pozostałe aktywatory."},{"t":"Ład ocenia się wyłącznie modelem dojrzałości COBIT 4.1","w":"COBIT 5 nie każe oceniać Ładu starym modelem dojrzałości."},{"t":"Wysoki poziom procesów oznacza zawsze dobry Ład","w":"Podręcznik mówi wprost, że ocena procesów nie zapewni pełnego obrazu."}],"src":"COBIT 5 Framework (PL), s. 41","pomoc":{"t":"Pytanie dotyczy lekcji 4.11 „Ocena dotyczy jednego procesu, nie całego Ładu”. Cel lekcji: Potrafię wyjaśnić, że ocena zdolności dotyczy pojedynczego procesu i nie daje pełnego obrazu Ładu.","k":[]}}},{"pt":"Lekcje 4.12–4.13","h":"Zdolność COBIT 5 to surowsza miara niż dojrzałość COBIT 4.1","b":"<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>Cecha<\/th><th>COBIT 4.1<\/th><th><w k=\"cobit-5\">COBIT 5<\/w><\/th><\/tr><tr><td>podstawa<\/td><td>własny model<\/td><td>ISO/IEC 15504<\/td><\/tr><tr><td>atrybuty<\/td><td>6 atrybutów dojrzałości<\/td><td>9 atrybutów procesu<\/td><\/tr><tr><td>poziom 1<\/td><td>działanie doraźne<\/td><td>osiągnięty <w k=\"przeznaczenie-procesu\">cel procesu<\/w><\/td><\/tr><\/table><\/div>","c":"Wyniki w COBIT 5 są zwykle niższe, a wyników obu modeli nie porównuje się wprost.","s":"COBIT 5 Framework (PL), s. 41–45, Ilustracja 20","ctx":"<p>Podręcznik: „Zasadniczo w przypadku modelu potencjału procesu w ramach metodyki COBIT 5 wyniki będą niższe”. Proces z dawnym poziomem 1 lub 2 może dostać 0 lub 1, bo od poziomu 1 liczy się osiąganie celu procesu. COBIT 5 nie ma osobnego modelu dla każdego procesu – opis daje Referencyjny Model Procesu, skala jest wspólna. Pięć korzyści: skupienie na celu procesu, uproszczenie (bez powielania treści), większa niezawodność i powtarzalność ocen, podstawa formalnej oceny, zgodność z uznanym standardem.<\/p><p>Pułapka: „Zarządzane i mierzalne” to poziom 4 dojrzałości COBIT 4.1, a „Proces zarządzany” – poziom 2 zdolności COBIT 5; „Nieistniejące” (4.1) to nie „Proces niekompletny” (5). Przykład: ubezpieczyciel miał obsługę szkód na poziomie 3 dojrzałości, nowa ocena daje 1 – zmieniła się miara, nie praca.<\/p>"},{"pt":"Sprawdź się","quiz":{"tresc":"W raporcie COBIT 4.1 proces miał „poziom 4 – zarządzany i mierzalny”. Na którym szczeblu skali 0–5 COBIT 5 leży „Proces zarządzany”?","opcje":[{"t":"Piąty","w":"Poziom 5 w COBIT 5 to Proces zoptymalizowany."},{"t":"Czwarty","w":"Numer pochodzi z modelu dojrzałości COBIT 4.1. Nie przenoś go razem ze słowem."},{"t":"Drugi","ok":true,"w":"Dobrze. W COBIT 5 Proces zarządzany to poziom 2. Słowo jest podobne, numer inny."},{"t":"Trzeci","w":"Poziom 3 w COBIT 5 to Proces ustanowiony."}],"src":"COBIT 5 Framework (PL), s. 44","pomoc":{"t":"Pytanie dotyczy lekcji 4.12 „Model dojrzałości COBIT 4.1 a model zdolności COBIT 5”. Cel lekcji: Potrafię wymienić różnice między modelem dojrzałości COBIT 4.1 a modelem zdolności COBIT 5.","k":[]}}},{"pt":"Sprawdź się","quiz":{"tresc":"Która z odpowiedzi jest korzyścią modelu zdolności COBIT 5 w porównaniu z modelami dojrzałości COBIT 4.1?","opcje":[{"t":"Wyższe wyniki, które łatwiej pokazać zarządowi","w":"Wyniki są zwykle niższe, a nie wyższe."},{"t":"Osobny, szczegółowy model dojrzałości dla każdego procesu","w":"To cecha COBIT 4.1, z której COBIT 5 zrezygnował."},{"t":"Pełny obraz Ładu z samej oceny procesów","w":"Ocena procesów nie daje pełnego obrazu Ładu."},{"t":"Większa niezawodność i powtarzalność ocen","ok":true,"w":"Dobrze. To jedna z pięciu korzyści: mniej sporów między interesariuszami o wynik oceny."}],"src":"COBIT 5 Framework (PL), s. 44; COBIT 5 Framework (PL), s. 45","pomoc":{"t":"Pytanie dotyczy lekcji 4.13 „Dlaczego wyniki są niższe i co daje nowy model”. Cel lekcji: Potrafię wyjaśnić, dlaczego wyniki w COBIT 5 są zwykle niższe, i wymienić korzyści modelu zdolności.","k":[]}}}]};</script>
