<script>window.DECK={"id":"k-mt-zdolnosc","rozdzial":"Poza podręcznikiem · Mentor i finał","tytul":"Mentor: zdolność, wdrożenie, prowadzenie zajęć","prev":"k-mt-aktywatory.html","next":"k-fn-final.html","T":{"dzialanie-procesu":{"t":"Działania","eg":"Działania","pd":"Działania","en":"Activities","wyj":"Konkretne kroki, które trzeba wykonać, żeby duży punkt planu został zrobiony.\n\nDziałania to konieczne i wystarczające kroki do realizacji praktyki. Uwzględniają wejścia i wyjścia oraz ułatwiają przypisanie ról. Nie są normatywne, więc organizacja przerabia je na własne procedury. Gdy są za ogólne, dokłada się szczegółowe działania z innych standardów.\n\nŻeby rozpisać praktykę na konkretne kroki, przy których łatwo wskazać, kto co robi i co wchodzi oraz wychodzi.","zycie":"Praktyka: „Przygotuj dziecko do szkoły”. Działania: kup podręczniki, podpisz zeszyty, sprawdź plan lekcji. To wystarczy, żeby praktyka była wykonana. Każda rodzina zrobi to po swojemu i to jest w porządku.","firma":"W warsztacie samochodowym praktyka brzmi: „Przyjmij auto do naprawy”. Działania: spisz usterki z klientem, zrób zdjęcia, ustal termin, wydaj potwierdzenie. Właściciel zamienia je na własną kartę przyjęcia z rubrykami. Działania z wzoru stały się procedurą warsztatu.","urzad":"W urzędzie praktyka brzmi: „Zarządzaj uprawnieniami użytkowników”. Działania to: przyjmij wniosek kierownika, nadaj dostęp, raz w roku przejrzyj listę. Informatyk dopisuje do nich szczegóły z normy ISO 27001 (międzynarodowej normy o bezpieczeństwie informacji) – to już szczegółowe działania.","it":"W DSS02 działania pod praktyką rejestrowania incydentów obejmują zapisanie zgłoszenia, klasyfikację i nadanie priorytetu. Zespół uzupełnia je szczegółowymi działaniami z ITIL (szczegóły procesu: uproszczenie kursu).","egz":"Działania: konieczne i wystarczające kroki, uwzględniają wejścia i wyjścia, ułatwiają wyznaczenie ról, nie są normatywne. Dystraktor „są obowiązkowe dla każdej organizacji” jest fałszywy. Nie myl z: Praktyka nadzoru / zarządzania – Praktyka to ogólny wymóg (CO). Działania to kroki do jej realizacji (JAK).; Procedura – Działania COBIT 5 nie są normatywne. Procedura to konkretna, obowiązująca wersja działań, napisana przez organizację.","src":"COBIT 5 Framework (PL), s. 89; COBIT 5 Framework (PL), s. 70"},"raci-a":{"t":"Odpowiedzialny decyzyjnie (A)","eg":"Odpowiedzialny decyzyjnie (A)","pd":"Strona rozliczana","en":"Accountable (A)","wyj":"Jedna osoba, która na końcu odpowiada głową za to, czy zadanie się udało.\n\nW tabeli RACI przy działaniu wpisujesz A jednej roli, ostatecznie odpowiedzialnej za wynik. A nie musi wykonywać pracy. A zawsze powinien dostawać informacje o realizacji, żeby nadzorować zadanie.\n\nŻeby przy każdym działaniu była jedna osoba, która odpowiada za jego powodzenie.","zycie":"Organizujecie wesele. Pomaga wiele osób: kucharze, DJ, świadkowie. Ale to para młoda odpowiada za całość i to ją rozliczą goście i rodzice. Para młoda jest A.","firma":"W firmie budowlanej kierownik budowy odpowiada za oddanie domu w terminie. Murarze i elektrycy wykonują pracę (R). Gdy dom jest opóźniony, inwestor rozlicza kierownika budowy. On jest A.","urzad":"Burmistrz zleca remont szkoły podstawowej. Sprawę prowadzi wydział inwestycji, a jego naczelnik odpowiada przed burmistrzem za termin i budżet. Firma remontowa wykonuje pracę, więc jest R. Naczelnik wydziału jest A – to jego burmistrz rozliczy, gdy remont się opóźni.","it":"W tabelach RACI COBIT 5 przy praktykach EDM literę A ma zwykle zarząd. Przy praktykach zarządzania A często ma CIO albo właściciel procesu biznesowego (przykład kursu, nie cytat z tabeli).","egz":"„Kto odpowiada za powodzenie / sukces zadania”, „odpowiedzialny decyzyjnie” → A. „Ostatecznie odpowiedzialny” → A. „Wykonuje”, „odpowiedzialny wykonawczo” → R. Przy jednym działaniu jeden A. Podręcznik: „strona rozliczana”. Egzamin: „odpowiedzialny decyzyjnie” (A), w parze z „odpowiedzialny wykonawczo” (R). Rozróżnia je drugie słowo: decyzyjnie = odpowiada za sukces, wykonawczo = wykonuje. Nie myl z: Odpowiedzialny wykonawczo (R) – A (odpowiedzialny decyzyjnie) odpowiada za powodzenie. R (odpowiedzialny wykonawczo) wykonuje. Pracę może robić kilku R, ale A jest jeden. Różnicę niesie drugie słowo nazwy.; Informowany (I) – A zawsze powinien dostawać informacje o realizacji, ale nie staje się przez to rolą I. Informacje są mu potrzebne do nadzoru.","src":"COBIT 5 Framework (PL), s. 89; COBIT 5 Framework (PL), s. 92"},"atrybuty-procesu":{"t":"Atrybuty procesu","eg":"Atrybuty procesu","pd":"Atrybuty potencjału procesu","en":"Process attributes (PA)","wyj":"Dziewięć rzeczy, które sprawdza oceniający, żeby powiedzieć, jak dobrze coś robimy, od „robimy” po „ciągle poprawiamy”.\n\nModel zdolności procesu COBIT 5 (oparty na ISO/IEC 15504) ma 9 atrybutów procesu (process attributes, PA): PA 1.1 na poziomie 1 i po dwa na poziomach 2–5. Każdy atrybut ocenia się w skali N/C/W/P: nieosiągnięty, częściowy, większościowy, pełny (N/P/L/F). Poziom jest osiągnięty, gdy jego atrybuty mają co najmniej W, a wszystkie atrybuty niższych poziomów mają P.\n\nŻeby ocena zdolności procesu opierała się na konkretnych, mierzalnych cechach, a nie na wrażeniu oceniającego. Atrybuty mówią, co dokładnie trzeba sprawdzić na każdym poziomie.","zycie":"Pieczesz sernik. Najpierw liczy się, czy w ogóle wyszedł (PA 1.1), potem czy planujesz czas i zakupy (PA 2.1) i czy przepis jest zapisany i poprawiany (PA 2.2). Dalej: czy cała rodzina piecze z tej samej spisanej wersji (PA 3.1, 3.2), czy mierzycie wynik i reagujecie, gdy coś odbiega od normy (PA 4.1, 4.2), i czy szukacie lepszego przepisu i go wprowadzacie (PA 5.1, 5.2). Każde z tych pytań to jeden atrybut procesu.","firma":"Audytor przychodzi do warsztatu samochodowego i ocenia przyjmowanie aut do naprawy. Sprawdza po kolei: czy auta są przyjmowane i naprawiane (PA 1.1), czy ktoś planuje terminy i pilnuje, kto co robi (PA 2.1), czy karta zlecenia ma wzór i jest sprawdzana (PA 2.2). Każde takie pytanie to osobny atrybut, a ich oceny dają poziom zdolności.","urzad":"Szkoła ocenia proces zapisów do pierwszej klasy. Zapisy się odbywają (PA 1.1), dyrektor planuje terminy i wyznacza osoby (PA 2.1), formularze mają jeden wzór i są sprawdzane (PA 2.2), ale każda sekretarka przyjmuje je trochę inaczej, więc PA 3.1 i 3.2 wypadają słabo. Atrybuty pokazują, na którym poziomie proces się zatrzymał.","it":"Audytor ocenia proces DSS02 Zarządzanie zgłoszeniami serwisowymi i incydentami: PA 1.1 = P, PA 2.1 = W, PA 2.2 = W, PA 3.1 = C. Proces osiąga poziom 2, bo PA 1.1 jest pełny, a atrybuty poziomu 2 mają co najmniej W; poziom 3 wymagałby P na PA 2.1 i PA 2.2.","egz":"Do zapamiętania: 9 atrybutów, 1 + 2 + 2 + 2 + 2. Pytanie o atrybut poziomu 4 → pomiar (miara) i kontrola procesu. Poziom 2 → zarządzanie wydajnością i zarządzanie produktami pracy. Nazwy atrybutów różnią się: podręcznik PA 1.1 „Sprawność procesu”, PA 2.1 „Zarządzanie sprawnością”, PA 2.2 „Zarządzanie produktami działań”, PA 4.1 „Pomiar procesu”. Na egzaminie: „Zarządzanie wydajnością” (2.1), „Miara procesu” (4.1).","src":"COBIT 5 Framework (PL), s. 93; COBIT 5 Framework (PL), s. 42, Ilustracja 19"},"cykl-wdrozenia":{"t":"Cykl Życia Wdrożenia","eg":"Cykl Życia Wdrożenia","pd":"Cykl życia wdrożenia","en":"Implementation life cycle","wyj":"Plan wprowadzania zmian krok po kroku, który się powtarza, bo poprawiać trzeba stale, nie raz.\n\nCykl ma trzy pierścienie: zewnętrzny – zarządzanie programem (programme management), środkowy – aktywowanie zmiany (change enablement), czyli strona ludzka i kulturowa, i wewnętrzny – cykl ciągłego doskonalenia (continual improvement life cycle). Wszystkie trzy przechodzą razem przez 7 faz, od „Jakie są wyznaczniki?” do „Jak utrzymać motywację do działania?”. Po fazie 7 cykl rusza od nowa, bo realizuje się go iteracyjnie.\n\nŻeby wdrażanie COBIT 5 było stałym doskonaleniem, a nie jednorazowym projektem, i żeby obok techniki zadbać o ludzi i o zarządzanie całym programem.","zycie":"Rodzina postanawia zdrowiej jeść. Ktoś musi to poprowadzić: plan, zakupy, budżet (zarządzanie programem). Trzeba też przekonać dzieci, które kochają frytki (aktywowanie zmiany), a po miesiącu sprawdzić, co działa, i poprawić plan posiłków (ciągłe doskonalenie). Te trzy rzeczy dzieją się równolegle, a pętla rusza od nowa przy kolejnym celu – to cykl życia wdrożenia.","firma":"Warsztat przechodzi z zeszytu na program do zleceń. Właściciel pilnuje harmonogramu i kosztów, rozmawia ze starszym mechanikiem, który nie chce „klikać”, i po kwartale poprawia to, co nie działa. Program, ludzie i doskonalenie to trzy pierścienie, które biegną razem przez wszystkie siedem faz.","urzad":"Szkoła wprowadza dziennik elektroniczny. Dyrektor prowadzi to jako program z planem i budżetem, wicedyrektor oswaja nauczycieli, którzy wolą papier, a po pierwszym semestrze zespół poprawia ustawienia i zasady. Program, zmiana w ludziach i ciągłe doskonalenie idą równolegle przez cały cykl życia wdrożenia.","it":"Bank wdraża COBIT 5 po awarii bankowości internetowej: CIO prowadzi program, rozmowy z pracownikami i nowa kultura zgłaszania błędów to aktywowanie zmiany (wspiera je BAI05 Zarządzanie wdrażaniem zmian organizacyjnych), a kolejne usprawnienia procesu DSS02 Zarządzanie zgłoszeniami serwisowymi i incydentami to ciągłe doskonalenie.","egz":"Komponent dotyczący behawioralnych i kulturowych aspektów wdrożenia → Aktywowanie zmiany (pierścień środkowy). Nie myl z: Cykl życia aktywatora – Cykl życia aktywatora (6 faz: planowanie… pozbywanie się) dotyczy pojedynczego aktywatora. Cykl życia wdrożenia dotyczy programu wdrażania COBIT.","src":"COBIT 5 Framework (PL), s. 37; COBIT 5 Framework (PL), s. 38, Ilustracja 17; materiały Altkom"},"raci-r":{"t":"Odpowiedzialny wykonawczo (R)","eg":"Odpowiedzialny wykonawczo (R)","pd":"Strona odpowiedzialna","en":"Responsible (R)","wyj":"Ten, kto własnymi rękami robi daną robotę.\n\nW tabeli RACI przy działaniu wpisujesz R tym rolom, które zajmują się realizacją zadania. Przy jednym działaniu może być kilka ról R (A zwykle jest jeden – praktyka tabel RACI, interpretacja kursu, nie FW-PL). R uwzględnia wejścia od C i w razie potrzeby eskaluje problem.\n\nŻeby przy każdym działaniu było jasne, kto wykonuje pracę.","zycie":"Przy przeprowadzce kolega z bratem noszą kartony do auta. Oni są R: wykonują pracę. Ty decydujesz i odpowiadasz za całą przeprowadzkę, więc jesteś A.","firma":"W biurze podróży konsultantka rezerwuje klientowi hotel i bilety. Jest R, bo wykonuje zadanie. Kierowniczka biura, która odpowiada za zadowolenie klienta, jest A.","urzad":"W urzędzie miasta inspektor przygotowuje projekt decyzji o dodatku mieszkaniowym: sprawdza dochody i liczy kwotę. Jest R, bo wykonuje zadanie. Kierownik działu, który decyzję podpisuje i odpowiada za jej poprawność, jest A.","it":"W tabeli RACI procesu DSS02 przy rozwiązywaniu incydentów literę R mają zwykle role operacyjne, np. kierownik usług IT i zespoły wsparcia (przykład kursu, nie cytat z tabeli).","egz":"„Kto wykonuje zadanie / zajmuje się jego realizacją” → R. Uwaga na podręcznikowe „strona odpowiedzialna”: to R, a nie A. Podręcznik: „strona odpowiedzialna”. Po polsku „odpowiedzialny” brzmi jak ten, kto odpowiada za wynik, a to jest A. Egzamin pisze „odpowiedzialny wykonawczo”: R wykonuje. A to „odpowiedzialny decyzyjnie” – różni je drugie słowo. Nie myl z: Odpowiedzialny decyzyjnie (A) – R wykonuje zadanie. A odpowiada za jego powodzenie i jest z niego rozliczany.; Konsultant (C) – R robi robotę. C tylko dostarcza wejścia (opinie, dane) w dwukierunkowej rozmowie.","src":"COBIT 5 Framework (PL), s. 93; COBIT 5 Framework (PL), s. 90"},"zdarzenia-wyzwalajace":{"t":"Zdarzenia wyzwalające","eg":"Zdarzenia wyzwalające","pd":"Zdarzenia inicjujące","en":"Trigger events","wyj":"Iskra, która sprawia, że zmiana rusza teraz, np. nowy szef, kontrola albo nowy przepis.\n\nZdarzenia wyzwalające (trigger events) zachodzą w środowisku wewnętrznym albo zewnętrznym, np. fuzja lub przejęcie, nowe regulacje, istotna zmiana technologii, nowy CEO, CFO lub CIO, audyt zewnętrzny, nowa strategia. Razem z punktami zapalnymi (pain points) pokazują w fazie 1 wdrożenia („Jakie są wyznaczniki?”), że zmiana jest potrzebna. Mogą też być podstawą uzasadnienia biznesowego inicjatywy.\n\nŻeby rozpoznać moment, w którym organizacja ma okazję i powód, by wreszcie zająć się Ładem i Zarządzaniem IT.","zycie":"Przez lata nikt w rodzinie nie myślał o hasłach i kopiach zdjęć. Potem tata przechodzi na emeryturę i zostaje „domowym informatykiem”, a teściowie wprowadzają się do Was z własnymi laptopami. Te zmiany są impulsem, żeby uporządkować domowe IT – to zdarzenia wyzwalające.","firma":"Piekarnia przejmuje sąsiednią cukiernię razem z jej kasami i programem do zamówień. W tym samym roku wchodzi obowiązek e-faktur. Przejęcie i nowe przepisy to zdarzenia wyzwalające, które skłaniają właściciela, żeby wziąć się za IT na poważnie.","urzad":"Do urzędu gminy przychodzi nowy sekretarz, a jednocześnie wchodzi obowiązek e-Doręczeń. Na dodatek audyt zewnętrzny wytyka braki w zabezpieczeniach. Każde z tych wydarzeń to zdarzenie wyzwalające, po którym urząd bierze się za Ład i Zarządzanie IT.","it":"Nowe wymogi prawne to zdarzenie wyzwalające: organizacja uruchamia inicjatywę wdrożenia COBIT 5 od fazy 1. W kolejnych fazach ocenia i usprawnia m.in. MEA03 (Monitorowanie, ocena i oszacowanie zgodności z wymogami zewnętrznymi) i APO13 (Zarządzanie bezpieczeństwem).","egz":"„Fuzje i przejęcia”, „nowe regulacje”, „nowy CIO”, „audyt zewnętrzny”, „istotna zmiana technologii” → zdarzenia wyzwalające. Egzamin: „Zdarzenia wyzwalające”. Podręcznik: „Zdarzenia inicjujące”. Nie myl z: Punkty zapalne – Punkt zapalny to trwający problem. Zdarzenie wyzwalające to zmiana.","src":"COBIT 5 Framework (PL), s. 36; COBIT 5 Framework (PL), s. 37; materiały Altkom"}},"S":[{"lekcje":["mt-k19-skala-i-regula-poziomu","mt-k20-profile-graniczne"],"pt":"Lekcje MT.19–MT.20","h":"Granica należy do niższej oceny, a profil czytasz od dołu","b":"<ul><li>Dokładnie 15% → N, 50% → C, 85% → W.<\/li><li>Swój poziom: co najmniej W; wszystko niżej: P.<\/li><li>Raport angielski: F → P, L → W, P → C.<\/li><\/ul>","c":"Pierwszy atrybut bez P od dołu zatrzymuje wynik, niezależnie od ocen wyżej.","s":"COBIT 5 Framework (PL), s. 42, 45","ctx":"<p>Podręcznik podaje przedziały 0–15, 15–50, 50–85, 85–100% bez „powyżej”; przypisanie granicy do niższej oceny to interpretacja kursu według ISO/IEC 15504. „85% dowodów dla PA 2.2 – czyli Pełny?” Nie, W. Raport PA 1.1 = F, 2.1 = L, 2.2 = P po zamianie słów daje P, W, C – więc poziom 1, nie 2.<\/p><p>Profile graniczne (PA 1.1/2.1/2.2/3.1/3.2): W/P/P/P/P → 1; P/P/W/P/P → 2; P/W/W/N/N → 2 (N blokuje tylko poziom 3); P/P/P/W/W → 3; C na PA 1.1 → 0. Profil to nie średnia ani najlepsza ocena; literę dostaje <w k=\"atrybuty-procesu\">atrybut<\/w>, a poziom 0–5 – proces.<\/p><p>„Poziom 1 to wstyd”? Nie: proces osiąga swój cel, co podręcznik nazywa ważnym osiągnięciem (s. 42); ambicją wielu przedsiębiorstw jest poziom 1 we wszystkich procesach (s. 45). Dawny „poziom 2 dojrzałości” z COBIT 4.1 może dać w COBIT 5 poziom 1 – zmienił się model, nie praca.<\/p>"},{"pt":"Sprawdź się","quiz":{"id":"q-mtk-19-3","sylabus":["PC-01-02","PC-01-03"],"tresc":"Raport po angielsku podaje: PA 1.1 = F, PA 2.1 = L, PA 2.2 = P. Jaki poziom zdolności ma proces?","opcje":[{"t":"Poziom 1","ok":true,"w":"Dobrze. Po zamianie: P, W, C. PA 2.2 = C łamie regułę poziomu 2, więc proces ma poziom 1."},{"t":"Poziom 2, bo P oznacza Pełny","w":"Angielskie P to Partially, czyli polskie C."},{"t":"Poziom 3, bo żaden atrybut nie ma oceny N","w":"Brak ocen N nie daje poziomu 3."},{"t":"Poziom 0, bo PA 2.2 jest tylko częściowy","w":"Poziom 1 zależy od PA 1.1, a ten ma F, czyli P."}],"src":"COBIT 5 Framework (PL), s. 45; COBIT 5 Framework (PL), s. 42","pomoc":{"t":"Pytanie dotyczy lekcji MT.19 „Ocena zdolności od kuchni – skala na progu i reguła poziomu”. Cel lekcji: Potrafię przypisać ocenę N/C/W/P na samym progu i wyjaśnić kursantowi regułę osiągnięcia poziomu zdolności.","k":[]}}},{"pt":"Sprawdź się","quiz":{"id":"q-mtk-20-3","sylabus":["PC-01-02","PC-02-06"],"tresc":"Zarząd słyszy, że proces ma poziom 1 zdolności, i mówi: „Prawie zero”. Co mówi o tym podręcznik COBIT 5?","opcje":[{"t":"Poziom 1 to najniższy możliwy wynik oceny","w":"Najniższy jest poziom 0."},{"t":"Poziom 1 to ważne osiągnięcie: proces osiąga cel","ok":true,"w":"Dobrze. Podręcznik nazywa poziom 1 ważnym osiągnięciem i fundamentem wyższych poziomów."},{"t":"Poziom 1 to dawny poziom 1 dojrzałości z COBIT 4.1","w":"Skale COBIT 4.1 i COBIT 5 nie przekładają się jeden do jednego."},{"t":"Poziom 1 oznacza proces niekompletny","w":"Proces niekompletny to poziom 0."}],"src":"COBIT 5 Framework (PL), s. 42; COBIT 5 Framework (PL), s. 45","pomoc":{"t":"Pytanie dotyczy lekcji MT.20 „Profile ocen, które mylą zaawansowanych – i „poziom 1 to wstyd””. Cel lekcji: Potrafię wyznaczyć poziom zdolności z profilu granicznego i wytłumaczyć zarządowi, że poziom 1 to fundament, a nie porażka.","k":[]}}},{"lekcje":["mt-k21-wdrozenie-21-dzialan","mt-k22-wdrozenie-w-kalendarzu"],"pt":"Lekcje MT.21–MT.22","h":"Wdrożenie to koło: trzy pierścienie naraz, iteracja do pół roku","b":"<ul><li>Każda faza: trzy <w k=\"dzialanie-procesu\">działania<\/w> równolegle (7 × 3 = 21).<\/li><li>Po fazie 7 cykl wraca do fazy 1.<\/li><li>Iteracja dłuższa niż 6 miesięcy grozi utratą dynamiki.<\/li><li>Audyt zewnętrzny to impuls, nie cel.<\/li><\/ul>","c":"Cel wdrożenia wynika z potrzeb interesariuszy, a nie z terminu audytu.","s":"COBIT 5 Framework (PL), s. 37–39, Ilustracja 17","ctx":"<p>Plan „kwiecień – program, czerwiec – ludzie, wrzesień – usprawnienia, październik – koniec” ma dwa błędy: <w k=\"cykl-wdrozenia\">pierścienie<\/w> idą po kolei, a wdrożenie ma koniec. W fazie 2 w tym samym tygodniu: Definiowanie problemów i okazji (program), Utworzenie zespołu wdrożeniowego (zmiana), Ocena stanu obecnego (doskonalenie). Ocena zdolności wraca w fazie 2 (stan obecny) i 6 (pomiar).<\/p><p>Pułapki nazw: Aktywowanie zmiany (<span class=\"en\">Change enablement<\/span>) to pierścień, a nie aktywator; Monitorowanie i szacowanie (faza 7) to działanie cyklu, a nie domena MEA; mapa drogowa powstaje w fazie 3, w fazie 4 jest planowanie programu. Audyt zewnętrzny to <w k=\"zdarzenia-wyzwalajace\">zdarzenie wyzwalające<\/w> (s. 37), a uzasadnienie biznesowe „nie jest jednorazowym statycznym dokumentem” (s. 39).<\/p><p>Przykład: bank dzieli plan na 14 miesięcy na dwie iteracje – najpierw bankowość mobilna (kwiecień–wrzesień), potem bezpieczeństwo i kopie zapasowe; każda przechodzi wszystkie fazy.<\/p>"},{"pt":"Sprawdź się","quiz":{"id":"q-mtk-21-3","sylabus":["IM-02-02","IM-02-05","IM-02-03"],"tresc":"Do czego w COBIT 5 należy „Monitorowanie i szacowanie” w fazie 7?","opcje":[{"t":"Do pierścienia Aktywowanie zmiany","w":"W tym pierścieniu faza 7 ma działanie „Utrzymanie”."},{"t":"Do siódmego aktywatora COBIT 5","w":"Aktywatory to inny model niż cykl wdrożenia."},{"t":"Do cyklu życia ciągłego doskonalenia","ok":true,"w":"Dobrze. To działanie pierścienia wewnętrznego w fazie 7, a nie domena procesów."},{"t":"Do domeny MEA – Monitoruj, Oszacuj i Oceń","w":"MEA to domena trzech procesów Zarządzania."}],"src":"COBIT 5 Framework (PL), s. 38; materiały Altkom","pomoc":{"t":"Pytanie dotyczy lekcji MT.21 „Wdrożenie – 7 faz × 3 pierścienie działają naraz”. Cel lekcji: Potrafię wyjaśnić kursantowi, że trzy pierścienie wdrożenia działają równolegle w każdej z siedmiu faz, a cykl wraca do fazy 1.","k":[]}}},{"pt":"Sprawdź się","quiz":{"id":"q-mtk-22-2","sylabus":["IM-02-02","IM-02-05","IM-02-06"],"tresc":"Dyrektor IT banku planuje jedną iterację wdrożenia na 14 miesięcy. Co doradza mentor, opierając się na COBIT 5?","opcje":[{"t":"Pominąć fazy 6 i 7, żeby skrócić cały plan","w":"Fazy 6 i 7 sprawdzają korzyści i otwierają kolejną iterację."},{"t":"Wydłużyć iterację, żeby wdrożyć wszystko starannie","w":"Dłuższa iteracja zwiększa ryzyko utraty dynamiki."},{"t":"Zostawić plan, bo długość iteracji jest bez znaczenia","w":"Podręcznik wprost ostrzega przed iteracją dłuższą niż pół roku."},{"t":"Kilka iteracji, każda do około pół roku","ok":true,"w":"Dobrze. Przy inicjatywie dłuższej niż sześć miesięcy rośnie ryzyko utraty dynamiki, koncentracji i akceptacji."}],"src":"COBIT 5 Framework (PL), s. 38","pomoc":{"t":"Pytanie dotyczy lekcji MT.22 „Wdrożenie w kalendarzu – iteracja do sześciu miesięcy, audyt jako impuls”. Cel lekcji: Potrafię rozpisać jedną iterację wdrożenia na kalendarz i wyjaśnić regułę sześciu miesięcy oraz rolę audytu jako zdarzenia wyzwalającego.","k":[]}}},{"lekcje":["mt-k23-karta-prowadzacego","mt-k24-bledne-zalozenie"],"pt":"Lekcje MT.23–MT.24","h":"Mini-szkolenie: jeden atom w 15 minut, poprawka w czterech ruchach","b":"<ul><li>Jeden atom, jeden cel, jedna reguła, pytanie kontrolne na końcu.<\/li><li>Błędne założenie: uznaj intencję → popraw założenie → daj regułę → sprawdź nowym przypadkiem.<\/li><\/ul>","c":"Zrozumienie widać przy nowym przypadku, a nie przy recytacji definicji.","s":"COBIT 5 Framework (PL), s. 89","ctx":"<p>Karta prowadzącego (metodyka kursu, nie COBIT 5): cel, rozgrzewka, po ludzku z przykładem z życia, przykład z organizacji, typowa pomyłka, nazwa EN i PL, pytania kursanta, pytanie kontrolne. Atom <w k=\"raci-a\">A – Odpowiedzialny decyzyjnie<\/w>: „Kto odpowiada za powodzenie zadania?” (s. 89); w banku kierownik działu – A, analityk aktualizujący dane – <w k=\"raci-r\">R – Odpowiedzialny wykonawczo<\/w>. Obie nazwy zaczynają się od „odpowiedzialny”, co kusi, by wpisać R zamiast A – różni je drugie słowo (wykonawczo – R, decyzyjnie – A).<\/p><p>„Dajmy A dwóm osobom, będzie bezpieczniej”. Złe odpowiedzi: żargon, fałszywe uproszczenie („A to szef”), przytaknięcie, odpowiedź nie na temat. Dobra: „Dobrze, że myślisz o bezpieczeństwie. Przy dwóch A każdy liczy na drugiego. Przy zadaniu jest jedno A – drugą osobę oznacz C albo I”. Gdy nie znasz odpowiedzi, sprawdź źródło razem z kursantem.<\/p><p>Ocena odpowiedzi na „Kierownik sam w nocy aktualizuje dane – czy zmienia się jego litera?”: sama definicja – Nie mam; „nadal A” – Częściowo; „nadal A, bo literę wyznacza rola przy zadaniu” – Mam to.<\/p>"},{"pt":"Sprawdź się","quiz":{"id":"q-mtk-23-z1","sylabus":["EN-02-25","PR-02-14"],"tresc":"Jak egzamin COBIT 5 PL nazywa rolę Accountable z tabeli RACI?","opcje":[{"t":"Odpowiedzialny decyzyjnie","ok":true,"w":"Dobrze. Accountable na egzaminie PL to „odpowiedzialny decyzyjnie” (w parze z „odpowiedzialny wykonawczo” – R), w podręczniku – „strona rozliczana”."},{"t":"Odpowiedzialny wykonawczo","w":"To rola Responsible (R)."},{"t":"Strona rozliczana","w":"To nazwa podręcznikowa."},{"t":"Konsultant","w":"To rola Consulted (C)."}],"src":"COBIT 5 Framework (PL), s. 89; materiały Altkom","pomoc":{"t":"Pytanie dotyczy lekcji MT.23 „Mini-szkolenie – jeden atom w 15 minut według karty prowadzącego”. Cel lekcji: Potrafię zbudować 15-minutowe mini-szkolenie o jednym atomie według ośmiu części karty prowadzącego.","k":[]}}},{"pt":"Sprawdź się","quiz":{"id":"q-mtk-24-2","sylabus":["EN-02-25","PR-02-14"],"tresc":"Nowy audytor pyta: „Wpiszemy A i kierownikowi, i dyrektorowi, żeby było bezpieczniej?”. Która odpowiedź mentora jest najlepsza?","opcje":[{"t":"„Rozliczalność przypisuje się jednoznacznie pojedynczej roli w macierzy RACI, zgodnie z dobrymi praktykami.”","w":"Prawda, ale w żargonie, który niczego nie wyjaśnia."},{"t":"„Rozumiem intencję, ale przy dwóch A każdy liczy na drugiego. Wybierz jedną osobę.”","ok":true,"w":"Dobrze. Uznaje intencję, prostuje założenie i daje regułę: przy zadaniu jest jedno A."},{"t":"„A to po prostu szef, więc wpisz tylko dyrektora.”","w":"Fałszywe uproszczenie: A nie musi być szefem."},{"t":"„Tak, dwie osoby z literą A to podwójna kontrola.”","w":"To przytaknięcie błędowi."}],"src":"COBIT 5 Framework (PL), s. 89","pomoc":{"t":"Pytanie dotyczy lekcji MT.24 „Pytanie z błędnym założeniem i ocena odpowiedzi kursanta”. Cel lekcji: Potrafię odpowiedzieć na pytanie z błędnym założeniem czterema ruchami i ocenić odpowiedź kursanta na pytanie kontrolne.","k":[]}}}]};</script>
