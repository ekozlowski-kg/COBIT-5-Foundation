<script>window.DECK={"id":"k-pc-atrybuty","rozdzial":"Rozdział 8 · Model zdolności procesu · s. 41–45","tytul":"Atrybuty procesu PA 1.1 – PA 5.2","prev":"k-pc-poziomy.html","next":"k-pc-oceny.html","T":{"pa-1-1":{"t":"PA 1.1 Wykonanie procesu","eg":"PA 1.1 Wykonanie procesu","pd":"PA 1.1 Sprawność procesu","en":"PA 1.1 Process performance","wyj":"Czy robota daje efekt, po który ją robimy: wcale, trochę, w większości czy w pełni.\n\nAsesor bierze rezultaty z opisu procesu i ocenia, w jakim stopniu są osiągane. Dowodami są praktyki bazowe i produkty pracy. Ocena N lub C daje poziom 0, a W lub P poziom 1.\n\nŻeby sprawdzić najważniejsze: czy proces w ogóle daje efekt, po który istnieje.","zycie":"Odprowadzasz dziecko do szkoły. PA 1.1 pyta tylko o jedno: czy dziecko codziennie jest w szkole na czas. Nie pyta, czy masz plan dojazdu ani grafik z sąsiadką.","firma":"Asesor w warsztacie sprawdza 30 losowych zleceń. W 27 auto było naprawione i oddane w terminie. To 90%, więc PA 1.1 = P. O grafiki i wzory dokumentów zapyta dopiero przy PA 2.1 i PA 2.2.","urzad":"Kontrola w urzędzie miasta sprawdza wydawanie dowodów osobistych. W 70% spraw dowód jest wydany w terminie i bez błędów. PA 1.1 = W: proces ma poziom 1, ale na poziom 2 jeszcze nie wejdzie.","it":"Proces DSS02: asesor sprawdza, czy incydenty są rejestrowane, klasyfikowane i rozwiązywane, a usługi przywracane. Jeśli dzieje się to w 70% przypadków, PA 1.1 = W, a proces ma poziom 1 bez szans na poziom 2.","egz":"Poziom 1 ma jeden atrybut: PA 1.1. Ocena W lub P daje poziom 1. Do wyższych poziomów PA 1.1 musi mieć P. Podręcznik: „Sprawność procesu”. Kurs: „Wykonanie procesu” (nazwy stosowane w kursiej nie potwierdziliśmy w arkuszu). „Sprawność” nie oznacza tu szybkości ani oszczędności, tylko osiąganie rezultatów procesu. Nie myl z: PA 2.1 Zarządzanie wydajnością – PA 2.1 pyta, czy wykonanie jest planowane i pilnowane. PA 1.1 pyta tylko, czy efekt jest.; Poziom 1 – Proces wykonywany – Poziom 1 to wynik procesu, a PA 1.1 to atrybut, którego ocena ten wynik wyznacza.; Wydajność (szybkość, koszt) – PA 1.1 nie mierzy tempa ani kosztów, tylko osiąganie rezultatów procesu.","src":"COBIT 5 Framework (PL), s. 42, Ilustracja 19; COBIT 5 Framework (PL), s. 45"},"pa-5-1":{"t":"PA 5.1 Innowacja procesu","eg":"PA 5.1 Innowacja procesu","pd":"PA 5.1 Innowacje procesowe","en":"PA 5.1 Process innovation","wyj":"Czy szukasz lepszych sposobów robienia tej roboty, na podstawie danych i nowych pomysłów.\n\nOrganizacja ustala cele doskonalenia wynikające z celów biznesowych. Analizuje dane z pomiarów i przegląda nowe podejścia i technologie. Wybiera zmiany i planuje ich wprowadzenie.\n\nŻeby proces nie stał w miejscu, gdy zmieniają się cele organizacji i pojawiają się nowe możliwości.","zycie":"Co tydzień robisz zakupy. Analizujesz paragony z trzech miesięcy i widzisz, że zawsze wyrzucasz chleb. Szukasz pomysłów: mrożenie, mniejsze bochenki. Wybór zmiany na podstawie danych to PA 5.1.","firma":"Firma kurierska analizuje dane o opóźnieniach i sprawdza, jakich skanerów używają inni. Zespół wybiera dwie zmiany do próby: nowe trasy i skanery w telefonach. To innowacja procesu.","urzad":"Urząd gminy analizuje dane o czasie obsługi wniosków i sprawdza, jak e-doręczenia (elektroniczne wysyłanie pism z mocą listu poleconego) działają w innych gminach. Wybiera jeden pomysł do pilotażu. To PA 5.1.","it":"Proces BAI08 (zarządzanie wiedzą): dane pokazują, że te same incydenty wracają, więc zespół wybiera do pilotażu bazę gotowych rozwiązań. Wybór zmiany na podstawie danych to PA 5.1.","egz":"Poziom 5: innowacja procesu (PA 5.1) i optymalizacja procesu (PA 5.2). Innowacja nie należy do poziomu 4 ani 2. Egzamin: „Innowacja procesu”. Podręcznik: „Innowacje procesowe” (Il. 19) i „Innowacja procesowa” (Il. 21). Chodzi o szukanie i wybór zmian w procesie, a nie o wymyślanie nowych produktów. Nie myl z: PA 5.2 Optymalizacja procesu – PA 5.2 wprowadza wybrane zmiany i sprawdza ich efekt. PA 5.1 je znajduje i wybiera.; PA 4.2 Kontrola procesu – PA 4.2 koryguje odchylenia, żeby utrzymać proces w limitach. PA 5.1 szuka zmian, które przesuną same limity na lepsze.","src":"COBIT 5 Framework (PL), s. 42, Ilustracja 19; COBIT 5 Framework (PL), s. 44, Ilustracja 21"},"pa-3-1":{"t":"PA 3.1 Definicja procesu","eg":"PA 3.1 Definicja procesu","pd":"PA 3.1 Definicja procesu","en":"PA 3.1 Process definition","wyj":"Czy jest jeden spisany, wspólny sposób robienia tej roboty i czy ktoś go aktualizuje.\n\nOrganizacja tworzy i utrzymuje standardowy proces: kroki, role, kompetencje, potrzebną infrastrukturę i zasady dopasowania. Asesor ocenia sam wzorzec, a jego stosowanie ocenia PA 3.2.\n\nŻeby organizacja miała jeden sprawdzony wzorzec procesu, z którego korzystają wszystkie zespoły.","zycie":"Rodzina spisuje jeden „plan świąt”: kto kupuje choinkę, kto gotuje, w jakiej kolejności. Po świętach co roku go poprawiacie. Sam spisany i aktualizowany plan to PA 3.1.","firma":"Sieć kawiarni ma jedną instrukcję otwierania lokalu, z wariantem dla małych punktów na dworcach. Dział jakości przegląda ją co pół roku. To definicja procesu.","urzad":"Powiat tworzy jeden wzorcowy regulamin obsługi skarg dla wszystkich swoich jednostek. Regulamin zawiera kroki, role, wymagane kompetencje i zasady dopasowania. Sekretarz powiatu co roku go przegląda. To PA 3.1.","it":"Proces APO07 (zarządzanie zasobami ludzkimi): organizacja ma jeden standard przyjmowania informatyków, z rolami, kompetencjami i zasadami dopasowania dla działów. Sam wzorzec ocenia się w PA 3.1.","egz":"Poziom 3 (ustanowiony) ma atrybuty definicja procesu (PA 3.1) i wdrożenie procesu (PA 3.2). „Definicja procesu” to atrybut PA 3.1. Nie myl go z „Zdefiniowanym procesem”, czyli nazwą poziomu 3 w COBIT 4.1, ani z opisem procesu w PRM, który nie może zawierać cech powyżej poziomu 1. Nie myl z: PA 3.2 Wdrożenie procesu – PA 3.2 sprawdza, czy standard jest stosowany w każdym wykonaniu. PA 3.1 sprawdza sam standard.; Elementy opisu procesu (Przewodnik Procesy umożliwiające) – Szablon opisu procesu z COBIT 5: Procesy umożliwiające, wspólny dla 37 procesów. PA 3.1 to standard, który organizacja tworzy sama.; PA 2.2 Zarządzanie produktami pracy – PA 2.2 to porządek w produktach pracy jednego procesu. PA 3.1 to wzorzec całego procesu dla organizacji.","src":"COBIT 5 Framework (PL), s. 42, Ilustracja 19; COBIT 5 Framework (PL), s. 43; COBIT 5 Framework (PL), s. 44, Ilustracja 21"},"proces":{"t":"Proces","eg":"Proces","pd":"Proces","en":"Process","wyj":"Coś, co robimy regularnie i zawsze w podobny sposób, np. przyjmowanie każdego zgłoszenia.\n\nProces (process) przyjmuje wejścia (inputs), przetwarza je przez praktyki i działania ukierunkowane przez polityki i procedury i daje wyniki (outputs), np. produkt albo usługę. Ma właściciela, role i mierniki, a wynik jednego procesu bywa wejściem innego. W COBIT 5 procesy są jednym z siedmiu aktywatorów, a Referencyjny Model Procesu opisuje ich 37.\n\nŻeby powtarzalną pracę wykonywać za każdym razem tak samo dobrze, niezależnie od tego, kto ją akurat robi, i żeby dało się ją mierzyć i poprawiać.","zycie":"Co sobotę rano sprawdzasz lodówkę, piszesz listę, jedziesz do sklepu, rozpakowujesz i odhaczasz, czego zabrakło. Za tydzień wszystko powtarza się od nowa. To proces: stałe kroki, wejście (pusta lodówka i lista) i wynik (pełna lodówka).","firma":"W sklepie internetowym z herbatą przychodzi zamówienie, pracownik pakuje paczkę, drukuje etykietę i fakturę, a kurier odbiera paczki o 15:00. Tak samo dzieje się z każdym zamówieniem, codziennie. To proces – powtarzalny, z wejściem (zamówienie) i wynikiem (paczka u klienta).","urzad":"Do urzędu gminy wpływa wniosek o wycinkę drzewa. Kancelaria go rejestruje, kierownik przydziela go referentowi, ten jedzie na oględziny i wydaje decyzję. Każdy kolejny wniosek idzie tą samą ścieżką – to jest proces.","it":"DSS02 (Zarządzanie zgłoszeniami serwisowymi i incydentami) to proces: każde zgłoszenie (wejście) jest rejestrowane, klasyfikowane, rozwiązywane i zamykane (praktyki), a wynikiem jest przywrócona usługa i wpis w rejestrze. Działa codziennie i tak samo dla każdego zgłoszenia.","egz":"Opis „zbiór praktyk ukierunkowanych politykami i procedurami, który przetwarza wejścia w wyniki” to Proces (Załącznik H). Nie myl z: Projekt – Projekt jest jednorazowy, ma początek i koniec (np. wdrożenie systemu). Proces trwa i się powtarza (np. obsługa zgłoszeń w tym systemie).","src":"COBIT 5 Framework (PL), s. 93"},"pa-4-1":{"t":"PA 4.1 Miara procesu","eg":"PA 4.1 Miara procesu","pd":"PA 4.1 Pomiar procesu","en":"PA 4.1 Process measurement","wyj":"Czy mierzysz tę robotę liczbami i sprawdzasz, czy wyniki są takie, jak zaplanowano.\n\nPA 4.1 bada, czy cele ilościowe procesu wynikają z potrzeb biznesowych, pomiary są zdefiniowane i realizowane, a wyniki służą zrozumieniu osiągów oraz zmienności procesu.\n\nŻeby o procesie mówiły liczby, a nie wrażenia.","zycie":"Zespół ma ilościowe cele dotyczące czasu obsługi, dobiera wiarygodne pomiary i analizuje ich rozkład oraz zmienność, by oceniać przewidywalność procesu. To przykład wsparcia oceny PA, a nie gotowy dowód pełnego osiągnięcia.","firma":"Zespół ma ilościowe cele dotyczące czasu obsługi, dobiera wiarygodne pomiary i analizuje ich rozkład oraz zmienność, by oceniać przewidywalność procesu. To przykład wsparcia oceny PA, a nie gotowy dowód pełnego osiągnięcia.","urzad":"Zespół ma ilościowe cele dotyczące czasu obsługi, dobiera wiarygodne pomiary i analizuje ich rozkład oraz zmienność, by oceniać przewidywalność procesu. To przykład wsparcia oceny PA, a nie gotowy dowód pełnego osiągnięcia.","it":"Zespół ma ilościowe cele dotyczące czasu obsługi, dobiera wiarygodne pomiary i analizuje ich rozkład oraz zmienność, by oceniać przewidywalność procesu. To przykład wsparcia oceny PA, a nie gotowy dowód pełnego osiągnięcia.","egz":"Atrybuty procesu przewidywalnego (poziom 4): Miara procesu (podręcznik: pomiar) i Kontrola procesu. Egzamin: „Miara procesu”. Podręcznik (Il. 19 i 21): „Pomiar procesu”. To ten sam atrybut poziomu 4. Nie myl go z monitorowaniem wykonania z PA 2.1. Nie myl z: PA 4.2 Kontrola procesu – PA 4.2 to reakcja na odchylenia od limitów. PA 4.1 dostarcza liczb, na których ta reakcja się opiera.; PA 2.1 Zarządzanie wydajnością – PA 2.1 pilnuje wykonania według planu. PA 4.1 mierzy proces ilościowo względem jego celów.; Wskaźnik opóźniony – Wskaźniki wiodące i opóźnione należą do modelu aktywatora. PA 4.1 to atrybut w ocenie zdolności procesu.","src":"COBIT 5 Framework (EN), sekcja rozdział 8, rysunek 19; PAM, atrybuty procesu"},"cykl-faza-1":{"t":"Planowanie","eg":"Planowanie","pd":"Planowanie (obejmuje opracowanie oraz wybór koncepcji)","en":"Plan (enabler life-cycle phase 1)","wyj":"Pierwszy krok w życiu rzeczy: wymyślasz kilka pomysłów i wybierasz ten, który zrobisz.\n\nOpracowujesz kilka koncepcji aktywatora. Porównujesz je z celem, np. z korzyścią, ryzykiem i kosztem. Wybierasz jedną i dopiero wtedy przechodzisz do projektowania.\n\nŻeby aktywator powstał z przemyślanego wyboru, a nie z przypadku.","zycie":"Rodzina chce psa. Najpierw rozważacie: duży czy mały, ze schroniska czy z hodowli, kto będzie go wyprowadzał. Wybieracie małego psa ze schroniska. To faza planowania: pomysły i wybór.","firma":"Właściciel sklepu chce przyjmować płatności BLIK. Porównuje trzy rozwiązania: terminal, bramkę płatności w sklepie internetowym, aplikację. Wybiera bramkę. To faza planowania aktywatora.","urzad":"Urząd miasta chce skrócić kolejki w wydziale komunikacji. Kierownik rozważa system numerków, zapisy przez Internet albo dodatkowe okienko. Wybiera zapisy przez Internet. Ten wybór koncepcji to faza planowania.","it":"Przy nowym systemie kierownictwo IT porównuje warianty: budowa, zakup albo usługa w chmurze. Takie decyzje inwestycyjne wspiera m.in. APO05 (Zarządzanie portfelem projektów) (interpretacja kursu).","egz":"Faza 1 = Planowanie: opracowanie i wybór koncepcji. Egzaminacyjnej nazwy PL faz cyklu życia aktywatora nie potwierdziliśmy (brak w SP1 i w zestawieniu Altkom). Używamy nazwy z FW-PL (s. 29, il. 13). „Planowanie” aktywatora to nie domena APO („Dostosuj, Planuj i Organizuj”) ani „Planuj” z PBRM, ani faza 4 wdrożenia (Planowanie programu). Egzaminacyjnej nazwy PL faz cyklu życia aktywatora nie potwierdziliśmy (brak w SP1 i w zestawieniu Altkom). Używamy nazwy z FW-PL (s. 29, il. 13). Nie myl z: Dostosuj, Planuj i Organizuj (APO) – APO (Dostosuj, Planuj i Organizuj) to domena procesów Zarządzania. Faza 1 to etap życia jednego aktywatora.; Planuj, Twórz, Wykonuj i Monitoruj – „Planuj” w Planuj, Twórz, Wykonuj i Monitoruj to obszar działań Zarządzania, a nie faza życia aktywatora.; Faza 4 wdrożenia „Co trzeba zrobić?” (Planowanie programu) – To faza programu wdrażania COBIT 5 (7 faz). Faza 1 cyklu życia aktywatora to wybór koncepcji jednego aktywatora.","src":"COBIT 5 Framework (PL), s. 29; COBIT 5 Framework (PL), s. 28, Ilustracja 13"},"pa-5-2":{"t":"PA 5.2 Optymalizacja procesu","eg":"PA 5.2 Optymalizacja procesu","pd":"PA 5.2 Optymalizacja procesu","en":"PA 5.2 Process optimisation","wyj":"Czy wprowadzasz wybrane ulepszenia w życie i sprawdzasz, czy naprawdę coś poprawiły.\n\nOrganizacja wprowadza zmiany w zaplanowany sposób, np. przez pilotaż i szkolenie. Mierzy skutek wobec celów doskonalenia i porównuje stan przed i po. Wnioski trafiają do kolejnych zmian.\n\nŻeby wybrane ulepszenia naprawdę trafiły do procesu i żeby wiadomo było, czy pomogły.","zycie":"Po analizie paragonów zaczynasz mrozić połowę chleba. Po miesiącu sprawdzasz: wyrzucasz mniej i wydajesz mniej. Wprowadzenie zmiany i sprawdzenie efektu to PA 5.2.","firma":"Firma kurierska wprowadza nowe trasy w jednym mieście i mierzy czasy dostaw przed i po. Dopiero potem rozszerza zmianę na cały kraj. To optymalizacja procesu.","urzad":"Gmina wprowadza e-doręczenia (elektroniczne wysyłanie pism) najpierw w jednym wydziale. Po kwartale porównuje czas obsługi przed i po, a potem wdraża rozwiązanie w całym urzędzie. To PA 5.2.","it":"Proces BAI08: baza rozwiązań działa w pilotażu w jednym zespole wsparcia, a liczba powtórnych incydentów spada o 30%. Organizacja rozszerza ją na wszystkie zespoły. To PA 5.2.","egz":"Drugi atrybut poziomu 5: optymalizacja procesu. Nie myl z optymalizacją ryzyka i zasobów z Celu Ładu. „Optymalizacja procesu” (PA 5.2) to wprowadzanie wybranych zmian i sprawdzanie ich efektu. Nie myl jej z optymalizacją ryzyka i optymalizacją zasobów (Cel Ładu, EDM03, EDM04) ani z nazwą poziomu 5. Nie myl z: PA 5.1 Innowacja procesu – PA 5.1 znajduje i wybiera zmiany. PA 5.2 je wprowadza i ocenia ich skutek.; Optymalizacja zasobów – Element Celu Ładu (EDM04). Nie jest atrybutem oceny zdolności procesu.; Optymalizacja ryzyka – Element Celu Ładu (EDM03). Nie jest atrybutem oceny zdolności procesu.","src":"COBIT 5 Framework (PL), s. 42, Ilustracja 19; COBIT 5 Framework (PL), s. 44, Ilustracja 21"},"pa-4-2":{"t":"PA 4.2 Kontrola procesu","eg":"PA 4.2 Kontrola procesu","pd":"PA 4.2 Kontrola procesu","en":"PA 4.2 Process control","wyj":"Czy gdy liczby pokazują, że robota wyjeżdża poza normę, ktoś szybko to wyłapuje i naprawia.\n\nPA 4.2 bada ilościowe sterowanie procesem przy użyciu odpowiednich technik analizy i kontroli. Granice zmienności są określone, przyczyny specjalne analizowane, a po korektach potwierdza się stabilność procesu.\n\nŻeby proces, który już mierzymy, faktycznie trzymał się ustalonych granic.","zycie":"Zespół wykorzystuje techniki statystyczne do określenia granic zmienności czasu obsługi, wykrywa przyczyny specjalne i potwierdza stabilność po działaniach korygujących. To przykład wsparcia oceny PA, a nie gotowy dowód pełnego osiągnięcia.","firma":"Zespół wykorzystuje techniki statystyczne do określenia granic zmienności czasu obsługi, wykrywa przyczyny specjalne i potwierdza stabilność po działaniach korygujących. To przykład wsparcia oceny PA, a nie gotowy dowód pełnego osiągnięcia.","urzad":"Zespół wykorzystuje techniki statystyczne do określenia granic zmienności czasu obsługi, wykrywa przyczyny specjalne i potwierdza stabilność po działaniach korygujących. To przykład wsparcia oceny PA, a nie gotowy dowód pełnego osiągnięcia.","it":"Zespół wykorzystuje techniki statystyczne do określenia granic zmienności czasu obsługi, wykrywa przyczyny specjalne i potwierdza stabilność po działaniach korygujących. To przykład wsparcia oceny PA, a nie gotowy dowód pełnego osiągnięcia.","egz":"Poziom 4 (przewidywalny): miara i kontrola procesu. Słowo-klucz poziomu: zdefiniowane limity. „Kontrola procesu” (PA 4.2) to trzymanie procesu w limitach na podstawie pomiarów. Nie myl jej z kontrolą wewnętrzną (MEA02), z mechanizmami kontrolnymi procesów z COBIT 4.1 ani z inspekcją z zewnątrz. Nie myl z: PA 4.1 Miara procesu – PA 4.1 mierzy. PA 4.2 reaguje na wyniki pomiaru i trzyma proces w limitach.; Monitoruj, Oszacuj i Oceń (MEA) – MEA02 to proces monitorowania systemu kontroli wewnętrznej. PA 4.2 to atrybut oceny zdolności dowolnego procesu.; Mechanizmy kontrolne procesów (COBIT 4.1) – Typowe cele kontrolne z COBIT 4.1. W COBIT 5 ich treść przeszła do atrybutów poziomów 2–5, a nie wyłącznie do PA 4.2.","src":"COBIT 5 Framework (EN), sekcja rozdział 8, rysunek 19; PAM, atrybuty procesu"},"pa-3-2":{"t":"PA 3.2 Wdrożenie procesu","eg":"PA 3.2 Wdrożenie procesu","pd":"PA 3.2 Wdrożenie procesu","en":"PA 3.2 Process deployment","wyj":"Czy wszyscy naprawdę robią tę robotę wspólnym sposobem i mają do tego ludzi oraz sprzęt.\n\nAsesor sprawdza, czy każde wykonanie opiera się na standardzie, czy role są przydzielone, ludzie mają kompetencje i infrastrukturę. Sprawdza też, czy zbiera się dane o tym, jak standard działa.\n\nŻeby standard działał w praktyce, a nie tylko na papierze.","zycie":"Rodzina ma spisaną listę rzeczy na wakacje (PA 3.1). PA 3.2 sprawdza, czy każdy naprawdę pakuje się według niej i czy ma do tego walizkę. Lista w szufladzie, której nikt nie czyta, nie jest wdrożeniem.","firma":"Sieć kawiarni ma instrukcję otwierania lokalu. Kontrolerka sprawdza w pięciu kawiarniach, czy pracownicy ją znają, przeszli szkolenie i mają potrzebny sprzęt. W dwóch nikt o instrukcji nie słyszał, więc PA 3.2 wypada słabo.","urzad":"Powiat ma wzorcowy regulamin skarg. Kontrola sprawdza, czy każda jednostka, np. powiatowy urząd pracy, go stosuje, czy wyznaczyła osoby i czy te osoby przeszły szkolenie. To PA 3.2.","it":"Proces DSS02: asesor pyta pracowników wsparcia z każdej zmiany, jak obsługują incydent krytyczny, i sprawdza, czy mają szkolenie i dostęp do narzędzia. To ocena PA 3.2.","egz":"PA 3.2 Wdrożenie procesu to drugi atrybut poziomu 3 (ustanowionego). Nie myl go z fazami wdrożenia COBIT 5. „Wdrożenie procesu” (PA 3.2) nie znaczy „uruchomienie procesu po raz pierwszy” ani „wdrożenie COBIT 5” w 7 fazach. To stosowanie standardu w każdym wykonaniu procesu. Nie myl z: PA 3.1 Definicja procesu – PA 3.1 ocenia sam standard (wzorzec). PA 3.2 ocenia, czy wzorzec jest stosowany w praktyce.; Siedem faz cyklu życia wdrożenia – 7 faz to cykl wdrażania COBIT 5 w organizacji. PA 3.2 to atrybut oceny jednego procesu.","src":"COBIT 5 Framework (PL), s. 42, Ilustracja 19; COBIT 5 Framework (PL), s. 44, Ilustracja 21"},"pa-2-2":{"t":"PA 2.2 Zarządzanie produktami pracy","eg":"PA 2.2 Zarządzanie produktami pracy","pd":"PA 2.2 Zarządzanie produktami działań","en":"PA 2.2 Work product management","wyj":"Czy papiery i pliki z tej roboty mają wzór, są sprawdzane i trzymane w porządku.\n\nAsesor sprawdza wymagania wobec produktów pracy, zasady ich dokumentowania i kontroli oraz to, czy są oznaczone, przeglądane i poprawiane. Ocena co najmniej W, razem z PA 2.1 i P na PA 1.1, daje poziom 2.\n\nŻeby dokumenty i pliki procesu były wiarygodne: wiadomo, co mają zawierać, która wersja jest aktualna i kto je sprawdził.","zycie":"Prowadzisz domowy segregator: każdy rachunek ma swoją przegródkę, umowy są w wersji podpisanej, a stare papiery co roku przeglądasz. Dokumenty są pod kontrolą. To PA 2.2.","firma":"W biurze rachunkowym każdy raport dla klienta ma wzór, numer wersji i podpis osoby, która go sprawdziła. Poprawki trafiają do nowej wersji, a stara zostaje w archiwum. Tak wygląda zarządzanie produktami pracy.","urzad":"W starostwie decyzje mają jeden wzór, każdą sprawdza radca prawny, a w systemie widać, która wersja jest ostateczna. Poprawki trafiają do nowej wersji. To PA 2.2.","it":"Proces BAI06: wnioski o zmianę mają jeden wzór, numer, status i zatwierdzającego, a historia zmian jest w narzędziu. To dowody dla PA 2.2.","egz":"Drugi atrybut poziomu 2: zarządzanie produktami pracy. Słowa-klucze: produkty pracy określone, kontrolowane, utrzymywane. Podręcznik: „Zarządzanie produktami działań”. Kurs: „Zarządzanie produktami pracy” (nazwy stosowane w kursiej nie potwierdziliśmy w arkuszu). „Produkt” nie oznacza tu towaru dla klienta, tylko dokument lub plik z pracy procesu. Nie myl z: Produkt pracy – Produkt pracy to sam artefakt (np. lista). PA 2.2 to atrybut, który sprawdza, czy takie artefakty są pod kontrolą.; PA 2.1 Zarządzanie wydajnością – PA 2.1 zarządza wykonaniem procesu (plan, pilnowanie). PA 2.2 zarządza jego dokumentami i plikami.; PA 3.1 Definicja procesu – PA 3.1 to wspólny standard procesu dla organizacji. PA 2.2 to porządek w produktach pracy jednego procesu.","src":"COBIT 5 Framework (PL), s. 42, Ilustracja 19"},"pa-2-1":{"t":"PA 2.1 Zarządzanie wydajnością","eg":"PA 2.1 Zarządzanie wydajnością","pd":"PA 2.1 Zarządzanie sprawnością","en":"PA 2.1 Performance management","wyj":"Czy ktoś tę robotę planuje, pilnuje i poprawia plan, gdy coś idzie nie tak.\n\nAsesor sprawdza cele wykonania, plan, monitorowanie i korekty oraz przypisane obowiązki i zasoby. Ocena co najmniej W, razem z PA 2.2 i P na PA 1.1, daje poziom 2.\n\nŻeby wykonanie procesu ktoś prowadził: wyznaczał cele, planował, pilnował i poprawiał, zamiast liczyć na to, że samo wyjdzie.","zycie":"Pielęgnujesz ogród: ustalasz, kiedy podlewać i przycinać, zapisujesz to w kalendarzu i sprawdzasz, czy się udało. Gdy przychodzi upał, podlewasz częściej. Plan, pilnowanie i korekta to PA 2.1.","firma":"Kierowniczka infolinii planuje grafik konsultantów na każdy dzień. Patrzy na długość kolejki i ściąga ludzi z przerwy, gdy dzwoni więcej klientów. Każdy wie, za co odpowiada. Zarządzanie wydajnością działa.","urzad":"Kierownik wydziału podatków i opłat w urzędzie miasta planuje, kto obsługuje wnioski w szczycie. Co tydzień sprawdza zaległości i dokłada osobę, gdy rośnie kolejka. To PA 2.1.","it":"Proces BAI03 (budowa rozwiązań): kierownik zespołu ma plan prac, co tydzień porównuje postęp z planem i przesuwa ludzi między zadaniami. To dowody dla PA 2.1.","egz":"Atrybut poziomu 2: Zarządzanie wydajnością (podręcznik: Zarządzanie sprawnością). Słowa-klucze: planowanie, monitorowanie, dostosowanie. Egzamin: „Zarządzanie wydajnością”. Podręcznik: „Zarządzanie sprawnością”. „Wydajność” nie znaczy tu „szybciej i taniej”, tylko zarządzanie wykonaniem procesu: plan, pilnowanie, korekta. Nie myl z „Zarządzaniem wydajnością aktywatora”. Nie myl z: PA 2.2 Zarządzanie produktami pracy – PA 2.2 dotyczy produktów pracy (dokumentów, plików). PA 2.1 dotyczy wykonania procesu: planu, pilnowania i korekty.; PA 4.1 Miara procesu – PA 4.1 to ilościowy pomiar procesu względem jego celów, na bazie standardu. PA 2.1 to pilnowanie wykonania względem planu.; Zarządzanie wydajnością aktywatora – Wymiar modelu aktywatora (czy osiągamy cele aktywatora, wskaźniki wiodące i opóźnione). Nie jest atrybutem oceny zdolności.","src":"COBIT 5 Framework (PL), s. 42, Ilustracja 19"}},"S":[{"lekcje":["pc-k30-pa-1-1","pc-k31-pa-2-1-pa-2-2"],"pt":"Lekcje 4.30–4.31","h":"PA 1.1 pyta o efekt, PA 2.1 o zarządzanie pracą, PA 2.2 o jej produkty","b":"<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>Atrybut</th><th>Sprawdza</th></tr><tr><td><w k=\"pa-1-1\">PA 1.1 Wykonanie procesu</w></td><td>czy <w k=\"proces\">proces</w> osiąga cel</td></tr><tr><td><w k=\"pa-2-1\">PA 2.1 Zarządzanie wydajnością</w></td><td><w k=\"cykl-faza-1\">planowanie</w>, monitorowanie, dostosowanie pracy</td></tr><tr><td><w k=\"pa-2-2\">PA 2.2 Zarządzanie produktami pracy</w></td><td>produkty określone, kontrolowane, utrzymywane</td></tr></table></div>","c":"PA 1.1 to jedyny atrybut poziomu 1; „wydajność” w PA 2.1 nie znaczy „szybciej”.","s":"COBIT 5 Framework (PL), s. 42, Ilustracja 19","ctx":"<p>EN: <span class=\"en\">Process performance</span>, <span class=\"en\">Performance management</span>, <span class=\"en\">Work product management</span>; podręcznik: Sprawność procesu, Zarządzanie sprawnością, Zarządzanie produktami działań. Poziom 1 wymaga PA 1.1 osiągniętego „w znacznym stopniu” – dowodem są wyniki procesu, nie plany. PA 2.1 to plan, grafik, odpowiedzialności i korekta; PA 2.2 – wzór, wersja, właściciel i przegląd dokumentów i rejestrów (produkty działań to wejścia i wyjścia procesów). Do poziomu 2 potrzebne są oba.</p><p>Nie myl PA 2.1 z zarządzaniem wydajnością aktywatora ani z oceną pracowników. Przykład – helpdesk z systemem do obsługi klientów (CRM): kierownik układa grafik i dokłada ludzi w szczycie (PA 2.1), a szablon zgłoszenia ma wersję zatwierdzaną przez właściciela (PA 2.2).</p>"},{"pt":"Sprawdź się","quiz":{"id":"q-pck-24-3","sylabus":["PC-01-01","PC-01-02"],"tresc":"Które zdanie poprawnie opisuje rozkład atrybutów procesu (Rysunek 19)?","opcje":[{"t":"Poziom 1 ma jeden atrybut, a poziomy 2–5 po dwa","ok":true,"w":"Dobrze. Razem dziewięć atrybutów procesu."},{"t":"Poziom 1 ma dwa atrybuty, a poziomy 2–5 po jednym","ok":false,"w":"Liczby są zamienione."},{"t":"Atrybuty są tylko na poziomach 2–5, a poziom 1 ocenia się bez atrybutu","ok":false,"w":"Poziom 1 też ma atrybut: PA 1.1 Wykonanie procesu."},{"t":"Każdy poziom od 0 do 5 ma po dwa atrybuty","ok":false,"w":"Poziom 0 nie ma atrybutów, a poziom 1 ma jeden."}],"src":"COBIT 5 Framework (EN), sekcja rozdział 8, rysunki 18–20","pomoc":{"t":"Pytanie dotyczy lekcji 4.30 „PA 1.1 Wykonanie procesu – czy proces osiąga cel”. Cel lekcji: Potrafię wyjaśnić, co sprawdza atrybut PA 1.1, i rozpoznać go pod różnymi nazwami.","k":["pa-1-1"]},"kurs":"Dobrze. Razem dziewięć atrybutów procesu.","kontekst":""}},{"pt":"Sprawdź się","quiz":{"id":"q-pck-24-3","sylabus":["PC-01-01","PC-01-02"],"tresc":"Które zdanie poprawnie opisuje rozkład atrybutów procesu (Rysunek 19)?","opcje":[{"t":"Poziom 1 ma dwa atrybuty, a poziomy 2–5 po jednym","ok":false,"w":"Liczby są zamienione."},{"t":"Poziom 1 ma jeden atrybut, a poziomy 2–5 po dwa","ok":true,"w":"Dobrze. Razem dziewięć atrybutów procesu."},{"t":"Atrybuty są tylko na poziomach 2–5, a poziom 1 ocenia się bez atrybutu","ok":false,"w":"Poziom 1 też ma atrybut: PA 1.1 Wykonanie procesu."},{"t":"Każdy poziom od 0 do 5 ma po dwa atrybuty","ok":false,"w":"Poziom 0 nie ma atrybutów, a poziom 1 ma jeden."}],"src":"COBIT 5 Framework (EN), sekcja rozdział 8, rysunki 18–20","pomoc":{"t":"Pytanie dotyczy lekcji 4.31 „PA 2.1 i PA 2.2 – zarządzanie pracą i jej produktami”. Cel lekcji: Potrafię odróżnić PA 2.1 Zarządzanie wydajnością od PA 2.2 Zarządzanie produktami pracy.","k":["pa-2-1","pa-2-2"]},"kurs":"Dobrze. Razem dziewięć atrybutów procesu.","kontekst":""}},{"lekcje":["pc-k32-pa-3-1-pa-3-2"],"pt":"Lekcja 4.32","h":"PA 3.1 – standard spisany, PA 3.2 – standard stosowany","b":"<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>Atrybut</th><th>Sprawdza</th></tr><tr><td><w k=\"pa-3-1\">PA 3.1 Definicja procesu</w> <span class=\"en\"><w k=\"proces\">Process</w> definition</span></td><td>czy jest jeden opisany proces dla organizacji</td></tr><tr><td><w k=\"pa-3-2\">PA 3.2 Wdrożenie procesu</w> <span class=\"en\">Process deployment</span></td><td>czy wszyscy według niego pracują</td></tr></table></div>","c":"Procedura w szufladzie nie daje poziomu 3.","s":"COBIT 5 Framework (PL), s. 42","ctx":"<p>Opis atrybutów to streszczenie normy ISO/IEC 15504 – podręcznik podaje tylko nazwy i regułę, że poziom 3 „wymaga zdefiniowania procesu oraz osiągnięcia (w znacznym stopniu) atrybutów wdrożenia”. Wdrożenie obejmuje też szkolenia, kompetencje i zasoby, więc oceniający sprawdza codzienną pracę, nie tylko dokument.</p><p>Dwie typowe słabości: brak wspólnego standardu (uczelnia ma na trzech wydziałach trzy sposoby zakładania kont studentom – słaby PA 3.1) i standard, którego nikt nie stosuje (centrala banku spisała procedurę reklamacji, a nieprzeszkolone oddziały pracują po swojemu – słaby PA 3.2). „Każdy zespół planuje i pilnuje terminów” to poziom 2, „wyniki mierzone i trzymane w limicie” – poziom 4.</p>"},{"pt":"Sprawdź się","quiz":{"id":"q-pck-24-3","sylabus":["PC-01-01","PC-01-02"],"tresc":"Które zdanie poprawnie opisuje rozkład atrybutów procesu (Rysunek 19)?","opcje":[{"t":"Poziom 1 ma dwa atrybuty, a poziomy 2–5 po jednym","ok":false,"w":"Liczby są zamienione."},{"t":"Atrybuty są tylko na poziomach 2–5, a poziom 1 ocenia się bez atrybutu","ok":false,"w":"Poziom 1 też ma atrybut: PA 1.1 Wykonanie procesu."},{"t":"Poziom 1 ma jeden atrybut, a poziomy 2–5 po dwa","ok":true,"w":"Dobrze. Razem dziewięć atrybutów procesu."},{"t":"Każdy poziom od 0 do 5 ma po dwa atrybuty","ok":false,"w":"Poziom 0 nie ma atrybutów, a poziom 1 ma jeden."}],"src":"COBIT 5 Framework (EN), sekcja rozdział 8, rysunki 18–20","pomoc":{"t":"Pytanie dotyczy lekcji 4.32 „PA 3.1 i PA 3.2 – standard spisany i standard stosowany”. Cel lekcji: Potrafię odróżnić brak wspólnego standardu (słaby PA 3.1) od standardu, którego nikt nie stosuje (słaby PA 3.2).","k":["pa-3-1","pa-3-2"]},"kurs":"Dobrze. Razem dziewięć atrybutów procesu.","kontekst":""}},{"lekcje":["pc-k33-pa-4-1-pa-4-2","pc-k34-pa-5-1-pa-5-2"],"pt":"Lekcje 4.33–4.34","h":"Poziom 4 mierzy i pilnuje granic, poziom 5 ulepsza","b":"<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>Atrybut</th><th>Sprawdza</th></tr><tr><td><w k=\"pa-4-1\">PA 4.1 Miara procesu</w></td><td>wyniki mierzone względem celów</td></tr><tr><td><w k=\"pa-4-2\">PA 4.2 Kontrola procesu</w></td><td>odchylenia od limitów korygowane</td></tr><tr><td><w k=\"pa-5-1\">PA 5.1 Innowacja procesu</w></td><td>wybór ulepszenia pod cele biznesowe</td></tr><tr><td><w k=\"pa-5-2\">PA 5.2 Optymalizacja procesu</w></td><td>wdrożenie zmiany i ocena efektu</td></tr></table></div>","c":"Liczby bez reakcji to słaby PA 4.2; wskazanie zmiany to PA 5.1, jej wdrożenie z oceną efektu – PA 5.2.","s":"COBIT 5 Framework (PL), s. 42, Ilustracja 19","ctx":"<p>EN: <span class=\"en\">Process measurement, Process control, Process innovation, Process optimisation</span>. Podręcznik pisze „Pomiar procesu” i „Innowacje procesowe”; opis atrybutów to streszczenie normy ISO/IEC 15504. „Kontrola” w PA 4.2 to sterowanie procesem w granicach, nie inspekcja ludzi. Różnica wobec PA 2.1: poziom 2 sprawdza, czy praca idzie zgodnie z planem, poziom 4 mierzy liczbowo wyniki procesu względem celów.</p><p>Przykład – dostawca chmury: cel to 95% usług przywróconych w ciągu godziny (PA 4.1); gdy tygodniowy wynik spada do 80%, zespół szuka przyczyny i ją usuwa (PA 4.2). Sklep internetowy: analiza wskazuje automatyczne zwroty (PA 5.1), zmiana działa najpierw w jednym magazynie, a po pomiarze efektu – wszędzie (PA 5.2).</p>"},{"pt":"Sprawdź się","quiz":{"id":"q-pck-24-3","sylabus":["PC-01-01","PC-01-02"],"tresc":"Które zdanie poprawnie opisuje rozkład atrybutów procesu (Rysunek 19)?","opcje":[{"t":"Poziom 1 ma dwa atrybuty, a poziomy 2–5 po jednym","ok":false,"w":"Liczby są zamienione."},{"t":"Atrybuty są tylko na poziomach 2–5, a poziom 1 ocenia się bez atrybutu","ok":false,"w":"Poziom 1 też ma atrybut: PA 1.1 Wykonanie procesu."},{"t":"Każdy poziom od 0 do 5 ma po dwa atrybuty","ok":false,"w":"Poziom 0 nie ma atrybutów, a poziom 1 ma jeden."},{"t":"Poziom 1 ma jeden atrybut, a poziomy 2–5 po dwa","ok":true,"w":"Dobrze. Razem dziewięć atrybutów procesu."}],"src":"COBIT 5 Framework (EN), sekcja rozdział 8, rysunki 18–20","pomoc":{"t":"Pytanie dotyczy lekcji 4.33 „PA 4.1 i PA 4.2 – mierzenie i trzymanie w granicach”. Cel lekcji: Potrafię odróżnić PA 4.1 Miara procesu od PA 4.2 Kontrola procesu.","k":["pa-4-1
