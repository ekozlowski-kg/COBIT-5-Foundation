<script>window.DECK={"id":"k-en-raci","rozdzial":"Załącznik G · Aktywatory szczegółowo · s. 65–88","tytul":"Opis procesu i diagram RACI","prev":"k-en-procesy.html","next":"k-en-struktury.html","T":{"cobit-5":{"t":"COBIT 5","eg":"COBIT 5","pd":"COBIT 5","en":"COBIT 5","wyj":"Zbiór sprawdzonych reguł z 2012 roku, jak mądrze decydować o informatyce i nią kierować.\n\nCOBIT 5 (ISACA, 2012) opiera się na 5 zasadach (principles), 7 kategoriach aktywatorów (enablers) i modelu referencyjnym 37 procesów: 5 Ładu w domenie EDM i 32 Zarządzania w domenach APO, BAI, DSS i MEA. Kaskada celów przekłada potrzeby interesariuszy na cele organizacji, cele związane z IT i cele aktywatorów. Integruje wcześniejsze wytyczne ISACA (COBIT 4.1, Val IT, Risk IT) i jest spójny z innymi standardami, np. ITIL i ISO/IEC 27001.\n\nŻeby organizacja mogła mądrze kierować informatyką i nią zarządzać: osiągać korzyści przy rozsądnym ryzyku i zużyciu zasobów. Daje jedną, spójną strukturę ramową zamiast wielu luźnych wskazówek.","zycie":"Rodzina ma coraz więcej sprzętu i kont: telefony, laptop, router, bank, zdjęcia w chmurze. Ustalacie, kto decyduje o zakupach, kto pilnuje haseł i kopii, i co miesiąc sprawdzacie, czy wszystko działa i czy nie przepłacacie. COBIT 5 to taki „regulamin domu” dla informatyki, tylko spisany dla firm i urzędów.","firma":"Właściciel warsztatu kupił program do rezerwacji, kasę online i monitoring, ale nie wie, czy to się opłaca i kto za co odpowiada. COBIT 5 podpowiada, jak to poukładać: kto wyznacza kierunek, kto prowadzi codzienne sprawy, jak mierzyć efekty i ryzyko. To gotowa rama, a nie program do zainstalowania.","urzad":"Burmistrz słyszy, że urząd wydaje na informatykę coraz więcej, a mieszkańcy dalej stoją w kolejkach. Sięga po COBIT 5, żeby ustalić, czego chce od systemów, kto w urzędzie za nie odpowiada i jak co roku sprawdzać, czy przynoszą korzyści. COBIT 5 służy tu do uporządkowania Ładu i Zarządzania IT.","it":"Bank po poważnej awarii bankowości internetowej porządkuje IT według COBIT 5: zarząd przejmuje 5 procesów Ładu (EDM01–EDM05), CIO 32 procesy Zarządzania, np. DSS04 Zarządzanie ciągłością, a audyt wewnętrzny ocenia zdolność procesów.","egz":"Liczby do zapamiętania: 5 zasad, 7 aktywatorów, 37 procesów (EDM 5 + APO 13 + BAI 10 + DSS 6 + MEA 3), 6 poziomów zdolności (0–5). Nie myl z: COBIT 2019 – Nowsza wersja (2018/2019) – inne pojęcia (komponenty, 40 celów, czynniki projektowe). Egzamin COBIT 5 Foundation dotyczy COBIT 5.; ITIL – ITIL to dobre praktyki zarządzania usługami IT – jak dostarczać usługi. COBIT patrzy szerzej: Ład i Zarządzanie całością IT w organizacji.; ISO/IEC 27001 – ISO/IEC 27001 to norma bezpieczeństwa informacji z certyfikacją; COBIT 5 to struktura ramowa Ładu i Zarządzania IT.","src":"COBIT 5 Framework (PL), s. 90"},"raci-i":{"t":"Informowany (I)","eg":"Informowany (I)","pd":"Strona informowana","en":"Informed (I)","wyj":"Ktoś, komu dajesz znać, co się stało, ale nie pytasz go o zdanie.\n\nW tabeli RACI przy działaniu wpisujesz I rolom, które otrzymują informacje o postępach i efektach. Komunikacja jest jednokierunkowa. A też dostaje informacje, ale pozostaje A.\n\nŻeby osoby, których dotyczy wynik, wiedziały o postępach i efektach zadania.","zycie":"Po wymianie zamków w drzwiach wysyłasz rodzicom SMS: „Zmieniłem zamki, nowy klucz jest u sąsiadki”. Nie pytasz ich o zdanie, tylko dajesz znać. Rodzice są I.","firma":"Firma kurierska zmienia godziny odbioru paczek. Klienci dostają maila z nowymi godzinami. Nikt ich nie pyta o opinię. Klienci są I przy tej zmianie.","urzad":"Wójt podpisuje nowy regulamin organizacyjny urzędu. Wszystkich 60 pracowników dostaje go do zapoznania się i potwierdza odbiór podpisem. Są I: dostają informację, ale nie współtworzą treści.","it":"Przy wdrażaniu zmiany w BAI06 (Zarządzanie zmianami) użytkowników zwykle tylko się informuje o terminie i skutkach zmiany. Mają wtedy rolę I (przykład kursu, nie cytat z tabeli).","egz":"„Kto otrzymuje informacje / kogo powiadamiamy o efektach” → I. Słowo-klucz: jednokierunkowa komunikacja. Nie myl z: Konsultant (C) – I tylko dostaje informacje (jednokierunkowo). C dostarcza wejścia i rozmowa idzie w obie strony.; Odpowiedzialny decyzyjnie (A) – A też dostaje informacje, ale po to, by nadzorować zadanie i odpowiadać za wynik. I nie odpowiada za wynik.","src":"COBIT 5 Framework (PL), s. 92"},"przeznaczenie-procesu":{"t":"Przeznaczenie procesu","eg":"Przeznaczenie procesu","pd":"Cel procesu","en":"Process purpose","wyj":"Jedno zdanie o tym, po co w ogóle ta robota istnieje.\n\nOpis każdego procesu zaczyna się od zdania o przeznaczeniu. Z niego wynikają rezultaty, a z rezultatów praktyki. Na poziomie 1 asesor sprawdza, czy proces osiąga swoje przeznaczenie.\n\nŻeby każdy wiedział, po co dany proces w ogóle istnieje, zanim zacznie oceniać jego kroki.","zycie":"Przeznaczenie porannego gotowania: rodzina wychodzi z domu najedzona. Nie chodzi o to, ile jajek usmażysz, tylko po co w ogóle wstajesz wcześniej.","firma":"Przeznaczenie procesu reklamacji w sklepie: klient z wadliwym towarem szybko dostaje uczciwe rozwiązanie. Z tego zdania wynikają rezultaty, kroki i dokumenty.","urzad":"Przeznaczenie procesu wydawania dowodów osobistych w urzędzie gminy: mieszkaniec dostaje ważny dokument bez zbędnej zwłoki. To jedno zdanie, od którego zaczyna się opis procesu. Z niego wynikają rezultaty, np. „dowód gotowy do odbioru w ustawowym terminie”, i kroki: przyjęcie wniosku, sprawdzenie danych, wydanie.","it":"Każdy z 37 procesów w COBIT 5: Procesy umożliwiające ma opis i deklarację przeznaczenia. Dla DSS02 brzmi ona w skrócie: szybko przywrócić normalne działanie usług po incydencie.","egz":"„Po co proces istnieje” → przeznaczenie procesu (process purpose). W podręczniku: „cel procesu”. Egzamin: „Przeznaczenie procesu”. Podręcznik (rozdział 8): „cel procesu”. Uwaga: w aktywatorze Procesy „cel procesu” to process goal, czyli coś innego, bliższego rezultatowi. Nie myl z: Rezultat procesu – Rezultat to obserwowalny efekt osiągnięcia przeznaczenia. Przeznaczenie to ogólne „po co”.; Kategorie celów procesu – Cele procesu (wewnętrzne, kontekstowe, dostępności) należą do aktywatora Procesy. To process goals, a nie przeznaczenie.; Cele związane z informatyką – Cele związane z IT pochodzą z kaskady celów. Przeznaczenie dotyczy jednego procesu.","src":"COBIT 5 Framework (PL), s. 43"},"raci-a":{"t":"Odpowiedzialny decyzyjnie (A)","eg":"Odpowiedzialny decyzyjnie (A)","pd":"Strona rozliczana","en":"Accountable (A)","wyj":"Jedna osoba, która na końcu odpowiada głową za to, czy zadanie się udało.\n\nW tabeli RACI przy działaniu wpisujesz A jednej roli, ostatecznie odpowiedzialnej za wynik. A nie musi wykonywać pracy. A zawsze powinien dostawać informacje o realizacji, żeby nadzorować zadanie.\n\nŻeby przy każdym działaniu była jedna osoba, która odpowiada za jego powodzenie.","zycie":"Organizujecie wesele. Pomaga wiele osób: kucharze, DJ, świadkowie. Ale to para młoda odpowiada za całość i to ją rozliczą goście i rodzice. Para młoda jest A.","firma":"W firmie budowlanej kierownik budowy odpowiada za oddanie domu w terminie. Murarze i elektrycy wykonują pracę (R). Gdy dom jest opóźniony, inwestor rozlicza kierownika budowy. On jest A.","urzad":"Burmistrz zleca remont szkoły podstawowej. Sprawę prowadzi wydział inwestycji, a jego naczelnik odpowiada przed burmistrzem za termin i budżet. Firma remontowa wykonuje pracę, więc jest R. Naczelnik wydziału jest A – to jego burmistrz rozliczy, gdy remont się opóźni.","it":"W tabelach RACI COBIT 5 przy praktykach EDM literę A ma zwykle zarząd. Przy praktykach zarządzania A często ma CIO albo właściciel procesu biznesowego (przykład kursu, nie cytat z tabeli).","egz":"„Kto odpowiada za powodzenie / sukces zadania”, „odpowiedzialny decyzyjnie” → A. „Ostatecznie odpowiedzialny” → A. „Wykonuje”, „odpowiedzialny wykonawczo” → R. Przy jednym działaniu jeden A. Podręcznik: „strona rozliczana”. Egzamin: „odpowiedzialny decyzyjnie” (A), w parze z „odpowiedzialny wykonawczo” (R). Rozróżnia je drugie słowo: decyzyjnie = odpowiada za sukces, wykonawczo = wykonuje. Nie myl z: Odpowiedzialny wykonawczo (R) – A (odpowiedzialny decyzyjnie) odpowiada za powodzenie. R (odpowiedzialny wykonawczo) wykonuje. Pracę może robić kilku R, ale A jest jeden. Różnicę niesie drugie słowo nazwy.; Informowany (I) – A zawsze powinien dostawać informacje o realizacji, ale nie staje się przez to rolą I. Informacje są mu potrzebne do nadzoru.","src":"COBIT 5 Framework (PL), s. 89, 92"},"proces":{"t":"Proces","eg":"Proces","pd":"Proces","en":"Process","wyj":"Coś, co robimy regularnie i zawsze w podobny sposób, np. przyjmowanie każdego zgłoszenia.\n\nProces (process) przyjmuje wejścia (inputs), przetwarza je przez praktyki i działania ukierunkowane przez polityki i procedury i daje wyniki (outputs), np. produkt albo usługę. Ma właściciela, role i mierniki, a wynik jednego procesu bywa wejściem innego. W COBIT 5 procesy są jednym z siedmiu aktywatorów, a Referencyjny Model Procesu opisuje ich 37.\n\nŻeby powtarzalną pracę wykonywać za każdym razem tak samo dobrze, niezależnie od tego, kto ją akurat robi, i żeby dało się ją mierzyć i poprawiać.","zycie":"Co sobotę rano sprawdzasz lodówkę, piszesz listę, jedziesz do sklepu, rozpakowujesz i odhaczasz, czego zabrakło. Za tydzień wszystko powtarza się od nowa. To proces: stałe kroki, wejście (pusta lodówka i lista) i wynik (pełna lodówka).","firma":"W sklepie internetowym z herbatą przychodzi zamówienie, pracownik pakuje paczkę, drukuje etykietę i fakturę, a kurier odbiera paczki o 15:00. Tak samo dzieje się z każdym zamówieniem, codziennie. To proces – powtarzalny, z wejściem (zamówienie) i wynikiem (paczka u klienta).","urzad":"Do urzędu gminy wpływa wniosek o wycinkę drzewa. Kancelaria go rejestruje, kierownik przydziela go referentowi, ten jedzie na oględziny i wydaje decyzję. Każdy kolejny wniosek idzie tą samą ścieżką – to jest proces.","it":"DSS02 (Zarządzanie zgłoszeniami serwisowymi i incydentami) to proces: każde zgłoszenie (wejście) jest rejestrowane, klasyfikowane, rozwiązywane i zamykane (praktyki), a wynikiem jest przywrócona usługa i wpis w rejestrze. Działa codziennie i tak samo dla każdego zgłoszenia.","egz":"Opis „zbiór praktyk ukierunkowanych politykami i procedurami, który przetwarza wejścia w wyniki” to Proces (Załącznik H). Nie myl z: Projekt – Projekt jest jednorazowy, ma początek i koniec (np. wdrożenie systemu). Proces trwa i się powtarza (np. obsługa zgłoszeń w tym systemie).","src":"COBIT 5 Framework (PL), s. 93"},"proc-apo12":{"t":"APO12 Zarządzanie ryzykiem","eg":"APO12 Zarządzanie ryzykiem","pd":"APO12 Zarządzanie ryzykiem","en":"APO12 Manage Risk","wyj":"Ciągłe wyszukiwanie, co może pójść źle w informatyce, ocenianie tego i przygotowanie, co wtedy zrobimy.\n\nKierownictwo IT zbiera dane o ryzyku i analizuje je. Utrzymuje profil ryzyka i informuje o nim. Dobiera reakcje: unikanie, ograniczanie, przeniesienie albo akceptację, w granicach apetytu ustalonego przez Ład.\n\nŻeby ryzyko IT było stale rozpoznawane, oceniane i ograniczane do poziomu, który organizacja akceptuje.","zycie":"Przed wyjazdem na wakacje spisujesz, co może pójść źle: kradzież, zalanie, zgubiony paszport. Oceniasz, co najgroźniejsze. Kupujesz ubezpieczenie, prosisz sąsiada o zaglądanie i robisz kopię paszportu. To APO12.","firma":"Kierownik ryzyka IT w banku prowadzi rejestr ryzyk: awaria centrum danych, wyciek danych, odejście kluczowych ludzi. Co miesiąc aktualizuje oceny i postęp działań. Raport trafia do zarządu. To APO12.","urzad":"Informatyk starostwa analizuje: co, jeśli wirus zaszyfruje dane? Ocenia prawdopodobieństwo i skutki. Proponuje kopie zapasowe poza budynkiem i szkolenie pracowników. To APO12.","it":"Kierownik ryzyka IT prowadzi rejestr ryzyk z oceną prawdopodobieństwa i skutków oraz plan reakcji. To APO12. Ryzyka ponad apetyt eskaluje do EDM03 Zapewnienie optymalizacji ryzyka. (interpretacja kursu: eskalacja)","egz":"Słowa-klucze: rejestr ryzyk, profil ryzyka, analiza scenariuszy, reakcja na ryzyko → APO12. Apetyt na ryzyko, kierunek zarządu → EDM03. Nazwa egzaminacyjna PL niepotwierdzona: na egzaminie nazwa może brzmieć inaczej niż w podręczniku. Egzamin używa własnych tłumaczeń, w domenach trybu rozkazującego (np. „Dostosuj, Planuj i Organizuj”). Rozpoznawaj proces po kodzie APO12 i słowie kluczowym EN Manage Risk. Nie myl z EDM03 Zapewnienie optymalizacji ryzyka (Ład). APO12 to codzienna praca z ryzykiem w Zarządzaniu. Nie myl z: EDM03 Zapewnienie optymalizacji ryzyka – EDM03 (Ład) ustala apetyt na ryzyko i rozlicza, czy go przestrzegamy. APO12 (Zarządzanie) rozpoznaje, analizuje i obsługuje ryzyko w tych granicach.; APO13 Zarządzanie bezpieczeństwem – APO13 prowadzi system zarządzania bezpieczeństwem informacji. APO12 obejmuje całe ryzyko IT, nie tylko bezpieczeństwo.; DSS04 Zarządzanie ciągłością – DSS04 przygotowuje i ćwiczy plany ciągłości działania. APO12 ocenia ryzyka, z których te plany wynikają.; Ryzyko – Ryzyko to pojęcie: prawdopodobieństwo i skutek. APO12 to proces, który ryzykiem zarządza.","src":"COBIT 5 Framework (PL), s. 22, 33, 60, 93"},"informacja":{"t":"Informacja","eg":"Informacja","pd":"Informacje","en":"Information (enabler 5)","wyj":"Wszystko, co wiemy i zapisujemy, od numeru telefonu po raport, i co komuś do czegoś służy.\n\nInformacja (Information) to piąty z 7 aktywatorów i obejmuje wszystkie informacje w organizacji, nie tylko te w systemach. Ma interesariuszy w rolach wytwórcy (producer), opiekuna (custodian) i konsumenta (consumer), własny cykl życia i kryteria jakości: wewnętrznej, kontekstowej oraz bezpieczeństwa i dostępności. Opisuje się ją też w 6 warstwach atrybutów, od fizycznej po społeczną.\n\nŻeby organizacja traktowała informację jak zasób, o który trzeba dbać: wytwarzać ją, przechowywać, chronić i udostępniać tym, którzy jej potrzebują.","zycie":"Mama dzwoni, że w czwartek nie odbierze dzieci ze szkoły, na lodówce wisi plan lekcji, a szkoła przysyła SMS o skróconych zajęciach. Żadna z tych wiadomości nie siedzi w komputerze, a mimo to wszystkie są informacją, od której zależy, kto i o której jedzie po dzieci. Jeśli nikt jej nie przeczyta i nie zareaguje, nic z niej nie wynika – to cecha aktywatora Informacja.","firma":"Piekarz zapisuje w zeszycie, ile chleba zostało wieczorem, kasa drukuje raport sprzedaży, a sprzedawczyni mówi, o co pytali klienci. Z tego wszystkiego właścicielka planuje jutrzejszy wypiek. Piekarz informację tworzy, zeszyt i kasa ją przechowują, a właścicielka z niej korzysta – to role wokół aktywatora Informacja.","urzad":"W szkole sekretarka prowadzi rejestr uczniów, wychowawca wpisuje oceny do dziennika, a dyrektor na radzie pedagogicznej słyszy ustnie o kłopotach w klasie 3b. Wszystko to jest informacja, także to, czego nie ma w żadnym systemie. Coś z niej wynika dopiero wtedy, gdy dyrektor na tej podstawie organizuje pomoc dla klasy.","it":"Dane kontaktowe klientów w systemie CRM to aktywator Informacja: klient podaje je przy zakładaniu konta (wytwórca), administrator utrzymuje bazę (opiekun), a konsultant korzysta z niej przy obsłudze (konsument). Nieaktualny numer to błąd jakości informacji, przez który powiadomienie nie dotarło.","egz":"Informacja jest jedną ze zdolności do świadczenia usług, a zdolności te wykorzystuje się poprzez procesy, by świadczyć usługi (s. 86). Procesy wymagają informacji jako wejścia i wytwarzają ją jako wyjście (s. 71). Nie myl z: Dane – Dane to surowe fakty. Informacja to dane przetworzone i mające znaczenie.","src":"COBIT 5 Framework (PL), s. 81, 86"},"raci-c":{"t":"Konsultant (C)","eg":"Konsultant (C)","pd":"Strona konsultowana","en":"Consulted (C)","wyj":"Ktoś, kogo pytasz o zdanie przed zrobieniem zadania i z kim naprawdę rozmawiasz.\n\nW tabeli RACI przy działaniu wpisujesz C rolom, które zapewniają dane wejściowe. Komunikacja jest dwukierunkowa. R i A muszą uwzględnić wejścia od C i w razie potrzeby eskalować sprawę.\n\nŻeby przed decyzją albo w trakcie pracy zebrać wiedzę od osób, które ją mają.","zycie":"Przed kupnem auta dzwonisz do szwagra mechanika i pytasz, na co uważać. On zadaje ci pytania, ty odpowiadasz, on doradza. Szwagier jest C: rozmawiacie w obie strony.","firma":"Agencja reklamowa przed drukiem katalogu pyta prawnika o zgody na zdjęcia. Prawnik odsyła uwagi, a grafik je wprowadza. Prawnik jest C przy tym zadaniu.","urzad":"Przed zmianą organizacji ruchu przy szkole urząd gminy pyta o opinię dyrekcję szkoły i zarząd dróg powiatowych. Dyrektorka proponuje przejście dla pieszych bliżej bramy, a zarząd dróg zgłasza uwagi do oznakowania. Ich uwagi trafiają do projektu. Dyrekcja i zarząd dróg są C: rozmowa idzie w obie strony.","it":"Przy praktykach APO12 (Zarządzanie ryzykiem) rolę C pełnią np. właściciele procesów biznesowych. Dostarczają wiedzę o tym, co ryzyko IT oznacza dla ich obszaru (przykład kursu, nie cytat z tabeli).","egz":"„Kto zapewnia dane wejściowe / kogo pytamy o opinię” → C. Słowo-klucz: dwukierunkowa komunikacja. Nie myl z: Informowany (I) – C dostarcza wejścia i rozmowa idzie w obie strony. I tylko otrzymuje informacje, w jedną stronę.; Odpowiedzialny wykonawczo (R) – C doradza, ale nie wykonuje zadania. Wykonuje R.","src":"COBIT 5 Framework (PL), s. 90"},"raci-r":{"t":"Odpowiedzialny wykonawczo (R)","eg":"Odpowiedzialny wykonawczo (R)","pd":"Strona odpowiedzialna","en":"Responsible (R)","wyj":"Ten, kto własnymi rękami robi daną robotę.\n\nW tabeli RACI przy działaniu wpisujesz R tym rolom, które zajmują się realizacją zadania. Przy jednym działaniu może być kilka ról R (A zwykle jest jeden – praktyka tabel RACI, interpretacja kursu, nie FW-PL). R uwzględnia wejścia od C i w razie potrzeby eskaluje problem.\n\nŻeby przy każdym działaniu było jasne, kto wykonuje pracę.","zycie":"Przy przeprowadzce kolega z bratem noszą kartony do auta. Oni są R: wykonują pracę. Ty decydujesz i odpowiadasz za całą przeprowadzkę, więc jesteś A.","firma":"W biurze podróży konsultantka rezerwuje klientowi hotel i bilety. Jest R, bo wykonuje zadanie. Kierowniczka biura, która odpowiada za zadowolenie klienta, jest A.","urzad":"W urzędzie miasta inspektor przygotowuje projekt decyzji o dodatku mieszkaniowym: sprawdza dochody i liczy kwotę. Jest R, bo wykonuje zadanie. Kierownik działu, który decyzję podpisuje i odpowiada za jej poprawność, jest A.","it":"W tabeli RACI procesu DSS02 przy rozwiązywaniu incydentów literę R mają zwykle role operacyjne, np. kierownik usług IT i zespoły wsparcia (przykład kursu, nie cytat z tabeli).","egz":"„Kto wykonuje zadanie / zajmuje się jego realizacją” → R. Uwaga na podręcznikowe „strona odpowiedzialna”: to R, a nie A. Podręcznik: „strona odpowiedzialna”. Po polsku „odpowiedzialny” brzmi jak ten, kto odpowiada za wynik, a to jest A. Egzamin pisze „odpowiedzialny wykonawczo”: R wykonuje. A to „odpowiedzialny decyzyjnie” – różni je drugie słowo. Nie myl z: Odpowiedzialny decyzyjnie (A) – R wykonuje zadanie. A odpowiada za jego powodzenie i jest z niego rozliczany.; Konsultant (C) – R robi robotę. C tylko dostarcza wejścia (opinie, dane) w dwukierunkowej rozmowie.","src":"COBIT 5 Framework (PL), s. 90, 93"},"raci":{"t":"Diagram RACI","eg":"Diagram RACI","pd":"Tabela RACI","en":"RACI chart","wyj":"Tabela, która dla każdego zadania mówi: kto robi, kto odpowiada, kogo pytamy, kogo informujemy.\n\nDiagram RACI (RACI chart; w podręczniku: tabela RACI) ma w wierszach praktyki procesu, a w kolumnach role i struktury organizacyjne. W każdej komórce stoi litera: R (Responsible) – wykonuje, A (Accountable) – odpowiada za sukces, C (Consulted) – dostarcza wejścia, komunikacja dwukierunkowa, I (Informed) – otrzymuje informacje, komunikacja jednokierunkowa. Przy jednej praktyce powinien być tylko jeden A (praktyka tabel RACI – interpretacja kursu; FW-PL nie formułuje tej reguły).\n\nŻeby przy każdej czynności było jasne, kto ją wykonuje, kto ostatecznie za nią odpowiada, kogo trzeba zapytać i kogo poinformować, i żeby żadne zadanie nie zostało bez właściciela.","zycie":"Przy remoncie mieszkania ekipa kładzie płytki (R), a Ty jako inwestor płacisz i odpowiadasz za cały remont (A). Przed kuciem ścian uzgadniasz godziny z sąsiadem zza ściany (C), a administratora budynku tylko zawiadamiasz, kiedy będzie hałas (I). Tak wygląda RACI: jeden robi, jeden odpowiada, z jednym rozmawiasz, drugiemu dajesz znać.","firma":"Sklep internetowy przygotowuje promocję na Black Friday. Grafik robi banery (R), kierowniczka marketingu odpowiada za wynik akcji (A), księgowa mówi, jakie rabaty się opłacają (C). Magazyn dostaje maila z terminem, żeby przygotował towar (I).","urzad":"W wydziale budownictwa starostwa inspektor przygotowuje decyzję (R), a naczelnik wydziału ją podpisuje i za nią odpowiada (A). Radca prawny wcześniej opiniuje projekt (C), a wójt gminy, na której terenie ma stanąć budynek, dostaje kopię do wiadomości (I).","it":"COBIT 5 podaje dla każdej praktyki wzorcową tabelę RACI, którą organizacja dostosowuje. Dla praktyki DSS02.05 (rozwiązywanie incydentów i przywracanie usług) organizacja może wpisać: kierownik ds. usług IT – A, zespół wsparcia – R, właściciel procesu biznesowego – C, użytkownicy – I.","egz":"„Ktoś, kto dostaje zadanie do wykonania” → R (odpowiedzialny wykonawczo). „Odpowiada za sukces” → A (odpowiedzialny decyzyjnie). „Dostarcza wejścia” → C (rola konsultanta). „Otrzymuje informacje” → I. R po polsku na egzaminie to „Odpowiedzialny wykonawczo”, czyli ten, kto wykonuje. A to „Odpowiedzialny decyzyjnie”, czyli ten, kto odpowiada za sukces. Obie nazwy zaczynają się od „odpowiedzialny” – rozróżnia je drugie słowo. Podręcznik: „strona odpowiedzialna” (R) i „strona rozliczana” (A). Nie myl z: Role, działania i relacje – Ilustracja 9 to ogólne relacje w systemie Ładu. RACI przypisuje role do konkretnych praktyk procesu.","src":"COBIT 5 Framework (PL), s. 89, 90, 92, 93"},"opis-procesu":{"t":"Elementy opisu procesu (Przewodnik Procesy umożliwiające)","eg":"Elementy opisu procesu (Przewodnik Procesy umożliwiające)","pd":"COBIT 5: Procesy umożliwiające","en":"Process description components (COBIT 5: Enabling Processes)","wyj":"Wzór karty, na której opisuje się każdą pracę: cel, kroki, kto co robi, co wchodzi i wychodzi.\n\nPrzewodnik COBIT 5: Procesy umożliwiające (Enabling Processes) opisuje każdy proces według stałego szablonu: identyfikacja (kod, nazwa, obszar, domena), opis procesu (process description: co proces robi), przeznaczenie procesu (process purpose statement: po co istnieje), powiązane cele związane z informatyką z kaskady celów i ich mierniki, cele i miary procesu, tabela RACI, praktyki z wejściami, wyjściami i działaniami oraz powiązane wytyczne z innych standardów.\n\nŻeby każdy z 37 procesów COBIT 5 był opisany w tym samym układzie, więc łatwo go znaleźć, porównać, dopasować i ocenić.","zycie":"W rodzinnej książce kucharskiej każdy przepis ma ten sam układ: nazwa, na jaką okazję, składniki, kto co robi, kroki i jak sprawdzić, że wyszło (ciasto wyrosło). Dzięki temu nawet nowy przepis od cioci czyta się bez szukania, gdzie co jest. Tak samo każdy proces COBIT 5 opisany jest według jednego szablonu.","firma":"Właściciel warsztatu spisuje swoje procedury na jednym wzorze: numer i nazwa (P-03 Przyjęcie auta), co się dzieje, po co, po czym poznać, że dobrze (auto oddane w terminie), kto wykonuje, a kto odpowiada, oraz kroki z dokumentami na wejściu i wyjściu. Nowy mechanik w każdej procedurze od razu wie, gdzie szukać. Taki stały szablon ma każdy proces w przewodniku COBIT 5: Procesy umożliwiające.","urzad":"Sekretarz gminy wprowadza jeden wzór karty dla każdej procedury w urzędzie: numer i nazwa, opis, cel, mierniki (np. odsetek spraw załatwionych w terminie), tabela, kto za co odpowiada, i kroki z dokumentami wejściowymi i wyjściowymi. Kiedy urzędniczka zastępuje koleżankę, każdą kartę czyta tak samo. COBIT 5 robi to samo dla swoich 37 procesów.","it":"Opis APO12 (Zarządzanie ryzykiem) w przewodniku Procesy umożliwiające ma te same części co pozostałe 36 procesów: przeznaczenie, powiązane cele związane z informatyką, mierniki, tabelę RACI oraz praktyki APO12.01–APO12.06 z wejściami i wyjściami.","egz":"„Opis procesu” = przegląd tego, co wykonuje proces. „Przeznaczenie procesu” = po co proces istnieje. Tabela RACI jest częścią opisu procesu. Przewodnik COBIT 5: Enabling Processes bywa po polsku nazywany „Procesy umożliwiające” albo „Przewodnik Aktywacji”. Nie myl z: Przeznaczenie procesu (ISO 15504) – W PAM „przeznaczenie procesu” to element wymiaru procesu. W opisie procesu jest osobnym polem, obok „opisu procesu”.","src":"materiały kursu"}},"S":[{"pt":"Lekcja 2.20","h":"Każdy z 37 procesów ma ten sam szablon opisu","b":"<p>Przewodnik Procesy umożliwiające (<span class=\"en\"><w k=\"cobit-5\">COBIT 5<\/w>: Enabling Processes<\/span>):<\/p><ul><li>identyfikacja: kod, nazwa, obszar, domena,<\/li><li>opis – <b>co<\/b> <w k=\"proces\">proces<\/w> robi,<\/li><li><w k=\"przeznaczenie-procesu\">przeznaczenie<\/w> – <b>po co<\/b> istnieje,<\/li><li>cele i miary, RACI, praktyki, wytyczne.<\/li><\/ul>","c":"Przeznaczenie procesu (w podręczniku: „cel procesu”) to nie to samo co cele procesu z miernikami.","s":"COBIT 5 Framework (PL), s. 76; części opisu wg sylabusa","ctx":"<p>Pełny <w k=\"opis-procesu\">opis procesu<\/w> ma osiem części. Są to: identyfikacja, opis, przeznaczenie, informacje z kaskady celów (cele związane z Informatyką i ich mierniki), cele i miary procesu, diagram RACI, praktyki (wejścia, wyjścia i działania) oraz powiązane wytyczne. Kolejność prowadzi od ogółu do szczegółu. Nazwy „Przewodnik Aktywacji” nie potwierdziliśmy w oficjalnym arkuszu.<\/p><p>Pułapka: angielskie <span class=\"en\">process purpose<\/span> podręcznik tłumaczy jako „cel procesu”, a egzamin jako „przeznaczenie procesu”. „Cele procesu” to osobna część opisu, z miernikami. Przykład identyfikacji: <w k=\"proc-apo12\">APO12<\/w> Zarządzanie ryzykiem, obszar Zarządzanie, domena Dostosuj, Planuj i Organizuj (<span class=\"en\">Align, Plan and Organise<\/span>). Dalej idą praktyki APO12.01–APO12.06. Obszar mówi, czy proces należy do Ładu czy do Zarządzania, a domena – do której z pięciu grup procesów.<\/p>"},{"pt":"Sprawdź się","quiz":{"tresc":"Fragment opisu: „APO12, Zarządzanie ryzykiem, obszar: Zarządzanie, domena: Dostosuj, Planuj i Organizuj”. Którą częścią <b>opisu procesu<\/b> jest ten fragment?","opcje":[{"t":"Identyfikacją procesu","ok":true,"w":"Dobrze. Kod, nazwa, obszar i domena to identyfikacja."},{"t":"Opisem procesu","w":"Opis mówi, co proces robi."},{"t":"Przeznaczeniem procesu","w":"Przeznaczenie mówi, po co proces istnieje."},{"t":"Informacjami z kaskady celów","w":"Tam są powiązane cele związane z informatyką i mierniki."}],"src":"sylabus PeopleCert","pomoc":{"t":"Pytanie dotyczy lekcji 2.20 „Opis procesu w przewodniku Procesy umożliwiające”. Cel lekcji: Potrafię wymienić części opisu procesu w przewodniku Procesy umożliwiające i odróżnić opis procesu od jego przeznaczenia.","k":["opis-procesu"]}}},{"pt":"Arkusz próbny","sp1":"sp1-28","lekcja":"2.20","temat":"Opis procesu w przewodniku Procesy umożliwiające","k":["opis-procesu"]},{"pt":"Lekcja 2.21","h":"RACI: kto wykonuje, kto odpowiada, kogo pytamy, kogo informujemy","b":"<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>Litera<\/th><th>Egzamin PL<\/th><th>Pytanie<\/th><\/tr><tr><td>R<\/td><td><w k=\"raci-r\">Odpowiedzialny wykonawczo<\/w><\/td><td>kto wykonuje?<\/td><\/tr><tr><td>A<\/td><td><w k=\"raci-a\">Odpowiedzialny decyzyjnie<\/w><\/td><td>kto odpowiada za sukces?<\/td><\/tr><tr><td>C<\/td><td><w k=\"raci-c\">Konsultant<\/w><\/td><td>kto daje wejścia?<\/td><\/tr><tr><td>I<\/td><td><w k=\"raci-i\">Informowany<\/w><\/td><td>kto dostaje informację?<\/td><\/tr><\/table><\/div>","c":"Literę daje rola przy konkretnej praktyce, a nie stanowisko.","s":"COBIT 5 Framework (PL), s. 75, 89–93","ctx":"<p><w k=\"raci\">Diagram RACI<\/w> (<span class=\"en\">RACI chart<\/span>) wiąże działania procesów ze strukturami organizacyjnymi i rolami. Jest w opisie każdego z 37 procesów i opisuje wymiar interesariuszy procesu. Rozwinięcie liter: <span class=\"en\">Responsible, Accountable, Consulted, Informed<\/span>.<\/p><p>RACI nie jest schematem organizacyjnym, bo nie pokazuje, kto komu podlega. Nie jest też Rysunkiem 9, który pokazuje ogólne role w systemie Ładu. Ta sama osoba może mieć R w jednym procesie, a C w innym.<\/p><p>Przykład: praktyka rozwiązywania incydentów w sklepie internetowym. Zespół wsparcia ma R, kierownik ds. usług IT ma A. Właściciel procesu sprzedaży ma C, bo mówi, co jest najpilniejsze. Klienci mają I, bo dostają komunikat, że sklep działa (przykład kursu, nie cytat z DSS02).<\/p>"},{"pt":"Sprawdź się","quiz":{"tresc":"Które nazwy ról RACI są nazwami z <b>polskiego egzaminu<\/b>?","opcje":[{"t":"Odpowiedzialny wykonawczo, Odpowiedzialny decyzyjnie, Kontrolujący, Informowany","w":"C to Konsultant (rola konsultanta), a nie Kontrolujący."},{"t":"Odpowiedzialny wykonawczo, Odpowiedzialny decyzyjnie, Konsultant, Informowany","ok":true,"w":"Dobrze. To nazwy egzaminacyjne R, A, C, I. R i A różni drugie słowo: wykonawczo – wykonuje, decyzyjnie – odpowiada za sukces."},{"t":"Raportujący, Akceptujący, Kontrolujący, Inicjujący","w":"Takich ról RACI nie ma."},{"t":"Strona odpowiedzialna, Strona rozliczana, Strona konsultowana, Strona informowana","w":"To nazwy z podręcznika (FW-PL s. 89–93), a nie z egzaminu. Egzamin: odpowiedzialny wykonawczo (R), odpowiedzialny decyzyjnie (A), konsultant (C), informowany (I)."}],"src":"pytanie autorskie kursu","pomoc":{"t":"Pytanie dotyczy lekcji 2.21 „Tabela RACI – cztery role przy każdej praktyce”. Cel lekcji: Potrafię wyjaśnić, po co jest tabela RACI i co oznaczają jej cztery litery.","k":["raci"]}}},{"pt":"Lekcje 2.22–2.23","h":"„Strona odpowiedzialna” to R, nie A; C rozmawia, I tylko słucha","b":"<ul><li><b>R<\/b> wykonuje (może być kilku); <b>A<\/b> jest <b>ostatecznie<\/b> odpowiedzialny za sukces.<\/li><li><b>C<\/b> – komunikacja <b>dwukierunkowa<\/b>; <b>I<\/b> – <b>jednokierunkowa<\/b>.<\/li><li>A też dostaje <w k=\"informacja\">informacje<\/w>, ale nie jest I.<\/li><\/ul>","c":"W pytaniu decyduje czasownik i kierunek rozmowy: „wykonuje” to R, „ostatecznie odpowiada” to A, „zasięga opinii” to C.","s":"COBIT 5 Framework (PL), s. 89–90, 92–93","ctx":"<p>Pułapka nazw. Podręcznik pisze „strona odpowiedzialna” (R) i „strona rozliczana” (A). Egzamin pisze „Odpowiedzialny wykonawczo” (R) i „Odpowiedzialny decyzyjnie” (A). Obie nazwy zaczynają się tak samo – różni je drugie słowo: wykonawczo = wykonuje, decyzyjnie = odpowiada za sukces. Regułę „przy jednym zadaniu jeden A” znamy z praktyki diagramów RACI. Słowniczek mówi o stronie ostatecznie odpowiedzialnej.<\/p><p>Uwagi C to nie grzeczność. R i A powinni uwzględnić dane wejściowe od stron konsultowanych. Gdy tego nie robią, sprawę można przekazać właścicielowi procesu albo komitetowi sterującemu. Rola A zawsze dostaje informacje, żeby nadzorować zadanie.<\/p><p>Przykład: ubezpieczyciel zmienia CRM. Dział sprzedaży zgłasza wymagania przed zmianą, więc ma C. Agenci dostają e-mail „od poniedziałku nowy ekran”, więc mają I. Programista i tester mają R, a kierownik projektu ma A.<\/p>"},{"pt":"Sprawdź się","quiz":{"tresc":"W banku dyrektor ds. IT odpowiada przed zarządem za udane wdrożenie aplikacji mobilnej. Kod piszą trzy zespoły. Jaką rolę RACI ma dyrektor?","opcje":[{"t":"R – Odpowiedzialny wykonawczo","w":"R mają zespoły, które piszą kod."},{"t":"I – Informowany","w":"Dyrektor dostaje informacje, ale przede wszystkim odpowiada za sukces."},{"t":"A – Odpowiedzialny decyzyjnie","ok":true,"w":"Dobrze. Odpowiada za sukces, choć sam nie programuje."},{"t":"C – Konsultant","w":"Dyrektor nie tylko doradza, ale odpowiada za wynik."}],"src":"COBIT 5 Framework (PL), s. 89","pomoc":{"t":"Pytanie dotyczy lekcji 2.22 „R czy A – kto wykonuje, a kto odpowiada za sukces”. Cel lekcji: Potrafię odróżnić rolę R (wykonuje) od roli A (odpowiada za sukces zadania).","k":["raci-r","raci-a"]}}},{"pt":"Arkusz próbny","sp1":"sp1-32","lekcja":"2.22","temat":"R czy A – kto wykonuje, a kto odpowiada za sukces","k":["raci-r","raci-a"]},{"pt":"Sprawdź się","quiz":{"tresc":"Która rola RACI wiąże się z komunikacją <b>dwukierunkową<\/b>?","opcje":[{"t":"Informowany (<em>Informed<\/em>)","w":"Informowany ma komunikację jednokierunkową."},{"t":"Odpowiedzialny wykonawczo (<em>Responsible<\/em>)","w":"R wykonuje zadanie."},{"t":"Odpowiedzialny decyzyjnie (<em>Accountable<\/em>)","w":"A odpowiada za sukces zadania."},{"t":"Konsultant (<em>Consulted<\/em>)","ok":true,"w":"Dobrze. Słowniczek podręcznika mówi wprost o komunikacji dwukierunkowej."}],"src":"COBIT 5 Framework (PL), s. 90","pomoc":{"t":"Pytanie dotyczy lekcji 2.23 „C czy I – kogo pytamy, a kogo tylko informujemy”. Cel lekcji: Potrafię odróżnić rolę C (rozmowa w obie strony) od roli I (tylko wiadomość).","k":["raci-c","raci-i"]}}}]};</script>
