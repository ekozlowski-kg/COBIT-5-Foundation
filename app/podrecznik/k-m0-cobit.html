<body>
<script>window.DECK={"id":"k-m0-cobit","rozdzial":"Wstęp i Streszczenie · s. 11–14","tytul":"COBIT 5 – organizacja, struktura ramowa i czym COBIT nie jest","prev":"00-wstep.html","next":"k-pr-zasady.html","T":{"organizacja":{"t":"Organizacja","eg":"Organizacja","pd":"Przedsiębiorstwo","en":"Enterprise","wyj":"Firma, urząd, szkoła czy szpital: ludzie, którzy razem robią coś w jakimś celu.\n\nW COBIT 5 organizacja (enterprise) to podmiot, który ma interesariuszy, ich potrzeby i własne cele (enterprise goals). Ład i Zarządzanie IT służą temu, by organizacja te cele osiągała. Podręcznik tłumaczy enterprise jako „przedsiębiorstwo”, a egzamin jako „organizacja”, ale chodzi o to samo, także o sektor publiczny i not-for-profit.\n\nŻeby jednym słowem mówić o każdej zorganizowanej całości z celami: firmie, urzędzie, szpitalu czy uczelni, bo COBIT 5 stosuje się do wszystkich, nie tylko do biznesu.","zycie":"Klub szachowy przy osiedlowym domu kultury ma skarbnika, składki i wspólny cel: utrzymać salę i co roku zorganizować turniej. Nikt na tym nie zarabia, a mimo to są pieniądze, ludzie i decyzje do podjęcia. Dla COBIT 5 to też organizacja – nie trzeba być firmą, żeby z niego korzystać.","firma":"Pani Ania prowadzi jednoosobowy sklep internetowy z ceramiką, a jej brat spółkę z 200 pracownikami. Oboje mają swoje cele, pieniądze i informatykę, od której zależą. Dla COBIT 5 obie firmy są organizacjami, bez względu na wielkość.","urzad":"Szpital powiatowy, urząd gminy i szkoła podstawowa nie zarabiają dla właścicieli, ale mają budżet, ludzi, systemy i cele do osiągnięcia. COBIT 5 wprost mówi, że nadaje się też dla sektora publicznego i not-for-profit. Każda z tych instytucji jest więc organizacją w rozumieniu egzaminu.","it":"Gdy szpital publiczny realizuje APO02 (Zarządzanie strategią), też jest organizacją (enterprise) w rozumieniu COBIT 5: jego cele, np. ciągłość opieki nad pacjentami, są w kaskadzie celów celami organizacji, choć szpital nie działa dla zysku.","egz":"Gdy w pytaniu widzisz „organizacja”, w podręczniku szukaj „przedsiębiorstwo”. Podręcznik: „przedsiębiorstwo”, egzamin: „organizacja”. Chodzi o każdą organizację – także urząd czy szpital publiczny, nie tylko firmę. Nie myl z: Firma komercyjna – „Przedsiębiorstwo” w COBIT ≠ tylko firma nastawiona na zysk.","src":"COBIT 5 Framework (PL), s. 13"},"cobit-5":{"t":"COBIT 5","eg":"COBIT 5","pd":"COBIT 5","en":"COBIT 5","wyj":"Zbiór sprawdzonych reguł z 2012 roku, jak mądrze decydować o informatyce i nią kierować.\n\nCOBIT 5 (ISACA, 2012) opiera się na 5 zasadach (principles), 7 kategoriach aktywatorów (enablers) i modelu referencyjnym 37 procesów: 5 Ładu w domenie EDM i 32 Zarządzania w domenach APO, BAI, DSS i MEA. Kaskada celów przekłada potrzeby interesariuszy na cele organizacji, cele związane z IT i cele aktywatorów. Integruje wcześniejsze wytyczne ISACA (COBIT 4.1, Val IT, Risk IT) i jest spójny z innymi standardami, np. ITIL i ISO/IEC 27001.\n\nŻeby organizacja mogła mądrze kierować informatyką i nią zarządzać: osiągać korzyści przy rozsądnym ryzyku i zużyciu zasobów. Daje jedną, spójną strukturę ramową zamiast wielu luźnych wskazówek.","zycie":"Rodzina ma coraz więcej sprzętu i kont: telefony, laptop, router, bank, zdjęcia w chmurze. Ustalacie, kto decyduje o zakupach, kto pilnuje haseł i kopii, i co miesiąc sprawdzacie, czy wszystko działa i czy nie przepłacacie. COBIT 5 to taki „regulamin domu” dla informatyki, tylko spisany dla firm i urzędów.","firma":"Właściciel warsztatu kupił program do rezerwacji, kasę online i monitoring, ale nie wie, czy to się opłaca i kto za co odpowiada. COBIT 5 podpowiada, jak to poukładać: kto wyznacza kierunek, kto prowadzi codzienne sprawy, jak mierzyć efekty i ryzyko. To gotowa rama, a nie program do zainstalowania.","urzad":"Burmistrz słyszy, że urząd wydaje na informatykę coraz więcej, a mieszkańcy dalej stoją w kolejkach. Sięga po COBIT 5, żeby ustalić, czego chce od systemów, kto w urzędzie za nie odpowiada i jak co roku sprawdzać, czy przynoszą korzyści. COBIT 5 służy tu do uporządkowania Ładu i Zarządzania IT.","it":"Bank po poważnej awarii bankowości internetowej porządkuje IT według COBIT 5: zarząd przejmuje 5 procesów Ładu (EDM01–EDM05), CIO 32 procesy Zarządzania, np. DSS04 Zarządzanie ciągłością, a audyt wewnętrzny ocenia zdolność procesów.","egz":"Liczby do zapamiętania: 5 zasad, 7 aktywatorów, 37 procesów (EDM 5 + APO 13 + BAI 10 + DSS 6 + MEA 3), 6 poziomów zdolności (0–5). Nie myl z: COBIT 2019 – Nowsza wersja (2018/2019) – inne pojęcia (komponenty, 40 celów, czynniki projektowe). Egzamin COBIT 5 Foundation dotyczy COBIT 5.; ITIL – ITIL to dobre praktyki zarządzania usługami IT – jak dostarczać usługi. COBIT patrzy szerzej: Ład i Zarządzanie całością IT w organizacji.; ISO/IEC 27001 – ISO/IEC 27001 to norma bezpieczeństwa informacji z certyfikacją; COBIT 5 to struktura ramowa Ładu i Zarządzania IT.","src":"COBIT 5 Framework (PL), s. 90"},"struktura-ramowa":{"t":"Struktura ramowa","eg":"Struktura ramowa","pd":"Metodyka","en":"Framework","wyj":"Gotowy, uporządkowany zbiór reguł i dobrych praktyk, z którego korzystamy zamiast wymyślać od zera.\n\nStruktura ramowa (framework) daje model, pojęcia, zasady, role i dobre praktyki, ale nie szczegółową instrukcję krok po kroku. Organizacja dostosowuje ją do swojej wielkości i potrzeb. COBIT 5 jest strukturą ramową dla Ładu i Zarządzania IT w organizacji i łączy w jedną całość inne standardy i struktury, np. ITIL i ISO/IEC 27001.\n\nŻeby organizacja nie wymyślała od zera, jak podejść do złożonego obszaru, tylko korzystała z gotowego, sprawdzonego zestawu pojęć, zasad i praktyk i dopasowywała go do siebie.","zycie":"Dietetyk daje Ci zasadę talerza: połowa warzywa, ćwierć białko, ćwierć węglowodany. Nie mówi, co jutro zjesz – to układasz sam, pod swoje smaki i portfel. Zasada talerza to struktura ramowa, a Twój plan posiłków to już jej dopasowanie do siebie.","firma":"Właściciel otwiera kawiarnię we franczyzie i dostaje księgę standardów: wygląd lokalu, receptury, sposób obsługi gości. Grafik pracy i lokalnych dostawców ustala już sam. Księga to rama, w której dopasowuje szczegóły do swojego miasta.","urzad":"Dyrektor szkoły dostaje standardy kontroli zarządczej dla sektora finansów publicznych. Mówią, co ma być pod kontrolą – cele, ryzyka, dokumentacja – ale nie mówią, jak dokładnie prowadzić rejestr ryzyk w tej szkole. To struktura ramowa: wspólna dla wszystkich jednostek, a szczegóły ustala szkoła.","it":"Organizacja przyjmuje COBIT 5 jako strukturę ramową i w procesie APO01 (Zarządzanie metodyką zarządzania IT) ustala, jak wpiąć w nią ITIL dla obsługi usług i ISO/IEC 27001 dla bezpieczeństwa. Zgodnie z zasadą 3 powstaje jeden spójny system zamiast kilku osobnych.","egz":"W pytaniach: „Zastosowanie Pojedynczej Zintegrowanej Struktury Ramowej” (Zasada 3), „Zasady, Polityki i Struktury ramowe” (aktywator 1). Egzamin: „Struktura ramowa”. Podręcznik: „Metodyka”. EN: Framework. „COBIT 5 jest zintegrowaną strukturą ramową” = „COBIT 5 jest zintegrowaną metodyką”. Nie myl z: Norma / standard (np. ISO/IEC 27001) – Norma ma wymagania, z którymi można certyfikować zgodność. COBIT 5 jest strukturą ramową – nie certyfikuje się organizacji „na COBIT”.; Procedura – Procedura to szczegółowy przepis wykonania; struktura ramowa jest ogólniejsza.","src":"COBIT 5 Framework (PL), s. 91; materiały Altkom"},"it-program":{"t":"Program","eg":"Program","pd":"program","en":"Programme","wyj":"Kilka powiązanych projektów prowadzonych razem, żeby osiągnąć jeden większy cel.\n\nKierownictwo wyznacza cel, np. „usługa zawsze dostępna dla klientów”. Kierownik programu dzieli go na projekty, ustala kolejność i budżet. Co jakiś czas sprawdza, czy projekty razem zbliżają organizację do celu.\n\nŻeby wiele projektów nie szło w różne strony, tylko razem dało jedną korzyść.","zycie":"Remont całego domu: projekt „nowy dach”, projekt „ocieplenie”, projekt „nowe okna”. Razem dają program „ciepły dom”.","firma":"Sieć hoteli prowadzi dwuletni program „gość bez kolejki”: projekt aplikacji do zameldowania, projekt elektronicznych kluczy do pokoi i szkolenia recepcji. Każdy projekt ma własny budżet, ale wszystkie służą jednemu celowi.","urzad":"Miasto prowadzi przez trzy lata program „urząd przez Internet”: kilka projektów nowych aplikacji i szkolenia urzędników. Pełnomocnik prezydenta miasta pilnuje kolejności projektów i sprawdza, czy razem przybliżają cel: większość spraw do załatwienia bez wizyty w urzędzie.","it":"Programami i projektami zarządza BAI01 Zarządzanie programami i projektami (FW-PL s. 33); wdrożenie COBIT 5 to program (s. 37).","egz":"BAI01 Zarządzanie programami i projektami (Manage Programmes and Projects) i pierścień „Zarządzanie programem” we wdrożeniu (dzień 4). Uwaga na dwuznaczność słowa „program”. Nie myl z: Projekt – Projekt to jedno przedsięwzięcie z początkiem i końcem. Program łączy kilka projektów dla wspólnej korzyści.; Oprogramowanie – „Program komputerowy” to oprogramowanie. Program w tym haśle to grupa projektów.; Zarządzanie programem – „Zarządzanie programem” we wdrożeniu COBIT 5 to pierścień zewnętrzny cyklu wdrożenia – szczególny przypadek programu.","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; COBIT 5 Framework (PL), s. 37"}},"S":[{"lekcje":["m0-00-organizacja-cel","m0-01-ramy-cobit","m0-02-cobit-czym-nie-jest"],"pt":"Lekcje 0.0–0.2","h":"COBIT 5 to ogólna struktura ramowa – dopasowujesz ją, nie instalujesz","b":"<ul><li><w k=\"struktura-ramowa\">Struktura ramowa<\/w> <span class=\"en\">Framework<\/span> = sprawdzony porządek zasad i praktyk.<\/li><li>Dla każdej <w k=\"organizacja\">organizacji<\/w> <span class=\"en\">Enterprise<\/span>: firmy, urzędu, szpitala.<\/li><li>≠ <w k=\"it-program\">program<\/w>, ≠ ustawa, ≠ instrukcja dla samego działu IT.<\/li><\/ul><blockquote>„metodyka <w k=\"cobit-5\">COBIT 5<\/w> nie koncentruje się tylko na funkcji IT”<\/blockquote>","c":"Najpierw cel organizacji, potem informatyka – IT jest narzędziem, nie celem.","s":"COBIT 5 Framework (PL), s. 13–14, 91","ctx":"<p>Organizacja (podręcznik: przedsiębiorstwo) to ludzie działający razem w jakimś celu, z podziałem pracy i kierownictwem – także urząd, szpital i fundacja. Według słowniczka metodyka (na egzaminie: struktura ramowa) to „podstawowa struktura koncepcyjna wykorzystywana do rozwiązywania lub uwzględniania złożonych problemów”: daje porządek, a decyzje wkłada w niego sama organizacja. Dlatego podręcznik pisze o dostosowaniu COBIT 5 „do kontekstu danej organizacji”.<\/p><p>Pułapki: COBIT 5 nie da się zainstalować (to nie program), nikt nie nakazuje go stosować (to nie przepis) i nie dotyczy samego działu IT, tylko całej organizacji. Odpowiedź, która stawia technologię ponad cel organizacji, zwykle jest błędna. Uważaj też na materiały o COBIT 2019 – egzamin dotyczy COBIT 5.<\/p><p>Przykład: urząd miasta przyjmuje COBIT 5 jako wspólne ramy. Nie kupuje „systemu COBIT”, tylko ustala, kto decyduje o wydatkach na IT, kto prowadzi systemy i jak raportuje wyniki.<\/p>"},{"pt":"Sprawdź się","quiz":{"id":"q-m0k-00-3","sylabus":["M0-00-07"],"tresc":"Dla jakich organizacji, według COBIT 5, przeznaczona jest ta <w k=\"struktura-ramowa\">struktura ramowa<\/w>?","opcje":[{"t":"Dla organizacji każdej wielkości: komercyjnych, not-for-profit i publicznych","ok":true,"w":"Tak mówi streszczenie COBIT 5 (FW-PL s. 13)."},{"t":"Tylko dla dużych firm notowanych na giełdzie","w":"Za wąsko. Podręcznik mówi o przedsiębiorstwach każdej wielkości."},{"t":"Tylko dla działów IT w urzędach","w":"COBIT 5 dotyczy całych organizacji, nie tylko działów IT, i nie tylko urzędów."},{"t":"Tylko dla przedsiębiorstw komercyjnych, bo podręcznik mówi o „przedsiębiorstwie”","w":"„Przedsiębiorstwo” to podręcznikowy przekład słowa Enterprise. Na egzaminie to „Organizacja” każdego rodzaju."}],"src":"COBIT 5 Framework (PL), s. 13","pomoc":{"t":"Pytanie dotyczy lekcji 0.0 „Organizacja i jej cel”. Cel lekcji: Potrafię powiedzieć, czym jest organizacja i dlaczego informatyka jest jej narzędziem, a nie celem.","k":["organizacja"]}}},{"pt":"Sprawdź się","quiz":{"id":"q-m0k-01-3","sylabus":["M0-00-07"],"tresc":"Analityk uczy się z polskiego podręcznika, w którym COBIT 5 (<em>Framework<\/em>) to „metodyka”. Jakiego określenia ma szukać w odpowiedziach na egzaminie?","opcje":[{"t":"Aktywator COBIT 5","w":"Aktywator to przekład słowa Enabler, a nie Framework."},{"t":"Struktura ramowa COBIT 5","ok":true,"w":"Tak. Framework to na egzaminie PL „Struktura ramowa”."},{"t":"Metodyka COBIT 5","w":"To nazwa z polskiego podręcznika. Na egzaminie stoi „Struktura ramowa”."},{"t":"Referencyjny model procesów COBIT 5","w":"Model procesów to tylko część COBIT 5, a nie nazwa całej ramy."}],"src":"materiały Altkom, s. 1; COBIT 5 Framework (PL), s. 91","pomoc":{"t":"Pytanie dotyczy lekcji 0.1 „Struktura ramowa – po co organizacji COBIT 5”. Cel lekcji: Potrafię wyjaśnić, czym jest struktura ramowa i dlaczego COBIT 5 nią jest.","k":["struktura-ramowa","cobit-5"]}}},{"pt":"Sprawdź się","quiz":{"id":"q-m0k-02-2","sylabus":["M0-00-07"],"tresc":"Zarząd urzędu chce, żeby COBIT 5 stosował wyłącznie dział IT. Jak to ocenić?","opcje":[{"t":"To błąd, bo COBIT 5 dotyczy tylko zarządu","w":"Za wąsko w drugą stronę. COBIT 5 obejmuje całą organizację."},{"t":"Słusznie, bo urzędy muszą stosować COBIT 5 z mocy ustawy","w":"COBIT 5 nie jest ustawą. Stosuje się go dobrowolnie."},{"t":"To błąd, bo COBIT 5 dotyczy całej organizacji","ok":true,"w":"Tak. COBIT 5 obejmuje zarząd, użytkowników, księgowość i dostawców, a nie tylko IT."},{"t":"Słusznie, bo COBIT 5 to instrukcja dla informatyków","w":"To odwrócenie prawdy. Podręcznik mówi, że COBIT 5 nie koncentruje się tylko na funkcji IT."}],"src":"COBIT 5 Framework (PL), s. 14","pomoc":{"t":"Pytanie dotyczy lekcji 0.2 „Czym COBIT 5 nie jest”. Cel lekcji: Potrafię powiedzieć, że COBIT 5 to dobrowolne ramy dla całej organizacji, a nie program, ustawa ani instrukcja tylko dla działu IT.","k":[]}}}]};</script>
