<script>window.DECK={"id":"k-im-uzasadnienie","rozdzial":"Rozdział 7 · Wdrożenie · s. 35–39","tytul":"Uzasadnienie biznesowe","prev":"k-im-cykl.html","next":"k-pc-model.html","T":{"uzasadnienie-biznesowe":{"t":"Uzasadnienie biznesowe","eg":"Uzasadnienie biznesowe","pd":"Uzasadnienie biznesowe","en":"Business case","wyj":"Kartka „dlaczego warto”: ile kosztuje, co da, co może pójść źle, aktualizowana po drodze.\n\nUzasadnienie biznesowe (business case) zawiera co najmniej: docelowe korzyści i ich beneficjentów, wymagane zmiany biznesowe, inwestycje, bieżące koszty, oczekiwane korzyści, ryzyko, role i odpowiedzialności oraz sposób monitorowania. Nie jest jednorazowym dokumentem, tylko dynamicznym narzędziem operacyjnym, aktualizowanym w pełnym cyklu życia ekonomicznego inwestycji. Inicjatywa ma sponsora, a kierownictwo za pomocą uzasadnienia ukierunkowuje tworzenie wartości (value creation).\n\nŻeby decyzję o inwestycji oprzeć na spisanych korzyściach, kosztach i ryzyku, a potem przez całe życie inwestycji sprawdzać, czy wartość naprawdę powstaje.","zycie":"Zastanawiacie się z partnerem nad fotowoltaiką. Spisujecie, ile zaoszczędzicie na prądzie, ile kosztuje instalacja i serwis, że pranie trzeba przestawić na dzień, co będzie, jeśli zmienią się zasady rozliczeń, i kto pilnuje formalności. Co roku przy rozliczeniu prądu wracacie do tej kartki i ją poprawiacie – to jest uzasadnienie biznesowe.","firma":"Właściciel piekarni chce kupić drugi piec. Liczy, o ile więcej chleba upiecze, ile kosztuje piec i prąd, że trzeba zatrudnić piekarza na noc i co, jeśli zamówień nie przybędzie. Co kwartał sprawdza z księgową, czy liczby się zgadzają, i poprawia wyliczenia – ta żywa kartka to uzasadnienie biznesowe.","urzad":"Sekretarz gminy chce wprowadzić elektroniczny obieg dokumentów. Opisuje wójtowi, co się poprawi, co zmieni się w pracy wydziałów, ile kosztuje system i szkolenia, jakie są ryzyka i kto prowadzi projekt. Po wdrożeniu co pół roku sprawdzają, czy obiecane efekty przyszły, i aktualizują dokument – to jest uzasadnienie biznesowe.","it":"W EDM02 (Zapewnienie realizacji korzyści) Ład ocenia inwestycje IT i ich spodziewaną wartość, a APO05 (Zarządzanie portfelem projektów) prowadzi je w portfelu i aktualizuje ich uzasadnienia biznesowe. Gdy koszt modernizacji systemu rośnie, a korzyść maleje, zaktualizowane uzasadnienie może skłonić do zatrzymania programu.","egz":"Narzędzie biznesowe do uzasadnienia inwestycji → uzasadnienie biznesowe. Jest dynamiczne, a nie jednorazowe. W fazie 4 cyklu wdrożenia projekty są wspierane przez uzasadnienia biznesowe. Nie myl z: Cele biznesowe – Cele biznesowe to cele organizacji. Uzasadnienie biznesowe to narzędzie uzasadnienia inwestycji.","src":"COBIT 5 Framework (PL), s. 39"},"ryzyko":{"t":"Ryzyko","eg":"Ryzyko","pd":"Ryzyko","en":"Risk","wyj":"Coś może pójść źle; liczy się, jak bardzo jest to prawdopodobne i jak bardzo zaboli.\n\nRyzyko to połączenie prawdopodobieństwa zdarzenia i jego konsekwencji. Zaistniałe przerwanie usługi jest incydentem; problem w zarządzaniu usługami oznacza przyczynę jednego lub wielu incydentów. Zdarzenie nie usuwa ryzyka jego nawrotu lub dalszych skutków. Ład ustala apetyt i tolerancję, a Zarządzanie identyfikuje, analizuje i obsługuje ryzyko w tych granicach.\n\nŻeby z wyprzedzeniem widzieć, co może pójść źle i jak bardzo by zaszkodziło, i świadomie decydować, czemu zapobiegać, a co zaakceptować.","zycie":"Planujecie wesele w ogrodzie w lipcu. Deszcz jest dość prawdopodobny, a skutek byłby duży – goście mokną, tort się rozpływa – więc rezerwujecie namiot. Ryzyko to ta możliwość deszczu razem z jej skutkami; jeśli w dniu wesela leje, macie już problem, a nie ryzyko.","firma":"W biurze rachunkowym tylko pani Ewa umie obsługiwać program do płac. Jeśli zachoruje w ostatnim tygodniu miesiąca, pensje u klientów się spóźnią. Szef ocenia, że to mało prawdopodobne, ale bolesne, więc każe przeszkolić drugą osobę – tak wygląda praca z ryzykiem.","urzad":"Nabór wniosków o dopłaty do wymiany pieców w urzędzie gminy zamyka się w piątek o 15:00, a wszystko idzie przez jeden serwer. Awaria akurat w piątek jest mało prawdopodobna, ale skutek byłby fatalny, więc informatyk robi kopię i ma tego dnia dyżur. To ryzyko: możliwość zdarzenia plus jego skutki.","it":"W procesie APO12 (Zarządzanie ryzykiem) dział IT prowadzi rejestr ryzyk: np. „awaria serwerowni” ma ocenione prawdopodobieństwo i skutki. Dla ryzyk powyżej apetytu ustalonego przez Ład w EDM03 (Zapewnienie optymalizacji ryzyka) planuje się działania, np. zapasowe centrum danych.","egz":"Na egzaminie ryzyko pojawia się głównie jako „optymalizacja ryzyka” (cel Ładu) i „apetyt na ryzyko” (czynnik środowiskowy we wdrożeniu). Nie myl z: Issue / problem / incydent – Problem już zaistniał; ryzyko jest możliwością w przyszłości.; Zagrożenie – Zagrożenie to źródło (np. powódź); ryzyko łączy prawdopodobieństwo z konsekwencjami.","src":"COBIT 5 Framework (PL), s. 93"}},"S":[{"lekcje":["im-k20-uzasadnienie-biznesowe"],"pt":"Lekcja 3.20","h":"Uzasadnienie biznesowe pozwala kierownictwu kierować wartością","b":"<p><w k=\"uzasadnienie-biznesowe\">Uzasadnienie biznesowe</w> <span class=\"en\">Business case</span>: po co, ile kosztuje, jakie korzyści i <w k=\"ryzyko\">ryzyko</w>.</p><ul><li>inicjatywą kieruje <b>sponsor</b>,</li><li>wspiera projekty w <b>fazie 4</b>.</li></ul>","c":"To narzędzie decyzji o wartości, a nie projekt techniczny ani raport z oceny procesu.","s":"COBIT 5 Framework (PL), s. 39","ctx":"<p>Podręcznik: uzasadnienie biznesowe to „cenne narzędzie, za pomocą którego kierownictwo może ukierunkować sposób tworzenia wartości biznesowej”. Najpierw organizacja musi uznać potrzebę działania – „dzwonek alarmowy” oparty na punktach zapalnych albo komunikat o szansie – a kluczowi interesariusze powinni znać ryzyko niepodjęcia działań. Inicjatywa ma sponsora, obejmuje kluczowych interesariuszy i opiera się na uzasadnieniu.</p><p>Czym nie jest: projektem technicznym (dokument specjalistów), listą celów organizacji (to Kaskada Celów), oceną zdolności procesu (diagnoza z fazy 2 – uzasadnienie tylko korzysta z jej wyników). Przykład: członkini zarządu banku jako sponsorka przedstawia aplikację mobilną – punkt zapalny (odpływ klientów), koszt 4 mln zł, oczekiwane 50 tys. nowych klientów, ryzyko opóźnienia dostawcy.</p>"},{"pt":"Sprawdź się","quiz":{"id":"q-im-05-04","sylabus":["IM-02-03"],"tresc":"Do czego według COBIT 5 kierownictwo wykorzystuje uzasadnienie biznesowe?","opcje":[{"t":"Do ukierunkowania tworzenia wartości biznesowej","ok":true,"w":"Business case jest narzędziem kierownictwa do ukierunkowania tworzenia wartości i śledzenia opłacalności inicjatywy w całym cyklu ekonomicznym."},{"t":"Do oceny poziomu zdolności procesów w skali od 0 do 5","ok":false,"w":"Ocena zdolności korzysta z PAM, skali PA i dowodów. Business case może wykorzystywać jej wyniki, ale nie jest modelem oceny."},{"t":"Do przypisania ról RACI","ok":false,"w":"RACI przypisuje odpowiedzialności. Business case może opisywać role, lecz jego główną funkcją jest uzasadnienie i prowadzenie tworzenia wartości."},{"t":"Do zastąpienia mapy drogowej","ok":false,"w":"Mapa drogowa wskazuje drogę do stanu docelowego. Business case uzasadnia inwestycję i jej korzyści; dokumenty się uzupełniają."}],"src":"COBIT 5 Framework (EN), sekcja rozdział 7, Getting Started: Making the Business Case","pomoc":{"t":"Pytanie dotyczy lekcji 3.20 „Uzasadnienie biznesowe – po co i kto za nie odpowiada”. Cel lekcji: Potrafię wyjaśnić, czym jest uzasadnienie biznesowe, komu służy i dlaczego inicjatywa potrzebuje sponsora.","k":["uzasadnienie-biznesowe"]},"kurs":"Business case jest narzędziem kierownictwa do ukierunkowania tworzenia wartości i śledzenia opłacalności inicjatywy w całym cyklu ekonomicznym.","kontekst":""}},{"pt":"Arkusz próbny","sp1":"sp1-44","lekcja":"3.20","temat":"Uzasadnienie biznesowe – po co i kto za nie odpowiada","k":["uzasadnienie-biznesowe"]},{"lekcje":["im-k21-elementy-uzasadnienia"],"pt":"Lekcja 3.21","h":"Osiem elementów minimum – w dokumencie, który żyje","b":"<ol><li>korzyści i beneficjenci</li><li>zmiany biznesowe</li><li>inwestycje</li><li>bieżące koszty</li><li>korzyści po zmianie</li><li>ryzyka</li><li>role i rozliczalność</li><li><b>sposób monitorowania</b></li></ol><p>Aktualizowane stale, nie raz na starcie.</p>","c":"Uzasadnienie to dynamiczne narzędzie operacyjne; najczęściej pomijany element to sposób monitorowania.","s":"COBIT 5 Framework (PL), s. 39","ctx":"<p>Pełniej: docelowe korzyści, ich zgodność ze strategią i beneficjenci; zmiany biznesowe (co w zakresie, co poza nim); inwestycje; bieżące koszty IT i biznesowe; oczekiwane korzyści; ryzyka, ograniczenia i zależności; role, odpowiedzialność i rozliczalność; sposób monitorowania wartości przez pełny cykl życia ekonomicznego i mierniki. Liczy się tylko korzyści realistyczne i możliwe do osiągnięcia. Podręcznik: uzasadnienie „nie jest jednorazowym statycznym dokumentem, ale dynamicznym narzędziem operacyjnym, które musi być stale aktualizowane”.</p><p>Pułapki: „pisze się raz, na starcie” – fałsz; „liczy tylko pieniądze” – za wąsko; „raport końcowy z fazy 7” – fałsz, wspiera projekty od fazy 4. Przykład: urząd zakładał zwrot systemu e-usług w trzy lata; po podwyżce opłat dostawcy aktualizuje uzasadnienie (zwrot w pięć lat) i decyduje, czy ograniczyć projekt.</p>"},{"pt":"Sprawdź się","quiz":{"id":"q-im-05-01","sylabus":["IM-02-04"],"tresc":"Który element <b>musi</b> zawierać uzasadnienie biznesowe według COBIT 5?","opcje":[{"t":"Szczegółowy kod źródłowy rozwiązania","ok":false,"w":"Kod jest elementem budowy rozwiązania. Nie jest minimalnym wymaganym składnikiem uzasadnienia biznesowego."},{"t":"Sposób monitorowania inwestycji w pełnym cyklu życia ekonomicznego","ok":true,"w":"Business case powinien określać, jak monitorować inwestycję i tworzenie wartości w całym jej ekonomicznym cyklu życia, a nie tylko do zakończenia wdrożenia."},{"t":"Listę wszystkich 37 procesów","ok":false,"w":"Zakres dobiera się do potrzeb. Business case nie wymaga wykazu wszystkich 37 procesów ani wdrożenia każdego z nich."},{"t":"Ocenę zdolności i kompetencji każdego pracownika zaangażowanego we wdrożenie","ok":false,"w":"Ocena każdej osoby nie jest minimalnym wymaganym elementem business case. Zasoby i odpowiedzialności planuje się odpowiednio do inicjatywy."}],"src":"COBIT 5 Framework (EN), sekcja rozdział 7, Getting Started: Making the Business Case","pomoc":{"t":"Pytanie dotyczy lekcji 3.21 „Co zawiera uzasadnienie biznesowe i dlaczego żyje”. Cel lekcji: Potrafię sprawdzić, czy uzasadnienie biznesowe ma minimalne elementy z COBIT 5, i wyjaśnić, dlaczego trzeba je stale aktualizować.","k":[]},"kurs":"Business case powinien określać, jak monitorować inwestycję i tworzenie wartości w całym jej ekonomicznym cyklu życia, a nie tylko do zakończenia wdrożenia.","kontekst":""}}],"bankRevision":"46e83821c9fccb36","legacySp1Order":[null,null,{"sp1":"sp1-44"},null,null]};</script>
