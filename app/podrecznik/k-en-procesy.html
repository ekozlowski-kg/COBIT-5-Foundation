<script>window.DECK={"id":"k-en-procesy","rozdzial":"Załącznik G · Aktywatory szczegółowo · s. 65–88","tytul":"Procesy: cele, praktyki, działania","prev":"k-en-zasady.html","next":"k-en-raci.html","T":{"wskaznik-wiodacy":{"t":"Wskaźnik wiodący","eg":"Wskaźnik wiodący","pd":"Wskaźnik wyprzedzający","en":"Lead indicator","wyj":"Liczba, która ostrzega wcześniej, czy idziemy w dobrą stronę, np. ile godzin się uczysz.\n\nDwa ostatnie z czterech pytań zarządzania wydajnością aktywatora (enabler performance management) dotyczą jego funkcjonowania: czy cykl życia aktywatora jest zarządzany i czy stosowane są dobre praktyki. Mierniki, które na nie odpowiadają, to wskaźniki wiodące (lead indicators). Przewidują przyszły wynik, który potem pokażą wskaźniki opóźnione (lag indicators).\n\nŻeby wcześnie, zanim pojawi się wynik, zobaczyć, czy aktywator działa jak trzeba, i zdążyć to poprawić.","zycie":"Za trzy miesiące biegniesz półmaraton. Co tydzień sprawdzasz, czy zrobiłeś zaplanowane cztery treningi. Jeśli od miesiąca wychodzą dwa, już wiesz, że wynik będzie słaby, i możesz to jeszcze zmienić – to wskaźnik wiodący.","firma":"Właściciel warsztatu samochodowego sprawdza, czy mechanicy wypełniają listę kontrolną przy każdym aucie. Jeśli połowa ją pomija, spodziewa się reklamacji, zanim te przyjdą, i od razu reaguje – to wskaźnik wiodący.","urzad":"Tydzień przed wejściem nowej procedury w urzędzie gminy sekretarz sprawdza, ilu urzędników przeszło szkolenie. Jest 60%, więc wie, że będą kłopoty, zanim wpłynie pierwsza skarga – to wskaźnik wiodący.","it":"W BAI06 (Zarządzanie zmianami) odsetek zmian wdrażanych po zatwierdzeniu i z planem wycofania to wskaźnik wiodący. Gdy spada, można przewidzieć więcej incydentów w DSS02 (Zarządzanie zgłoszeniami serwisowymi i incydentami), zanim one wystąpią.","egz":"Wskaźnik wiodący mierzy, czy cykl życia jest zarządzany i czy stosowane są dobre praktyki. Osiągnięcie celów i uwzględnienie potrzeb mierzą wskaźniki opóźnione (s. 29). Egzamin: „Wskaźniki wiodące”. Podręcznik: „Wskaźniki wyprzedzające”. Nie myl z: Wskaźnik opóźniony – Opóźniony mierzy wynik, czyli osiągnięcie celów i zaspokojenie potrzeb.","src":"COBIT 5 Framework (PL), s. 29; materiały Altkom"},"praktyki-dzialania":{"t":"Praktyki, działania, wejścia i wyjścia procesu","eg":"Praktyki, działania, wejścia i wyjścia procesu","pd":"Praktyki, działania, szczegółowe działania, dane wejściowe i wyniki","en":"Process practices, activities, inputs and outputs","wyj":"Praca rozpisana na kroki i drobne czynności, z tym, co do niej wchodzi i co z niej wychodzi.\n\nKażdy proces COBIT 5 ma praktyki (governance/management practices), czyli to, co trzeba robić, np. DSS02.02. Każda praktyka ma działania (activities), czyli konieczne i wystarczające kroki, jak to robić, oraz wejścia i wyjścia (inputs and outputs), czyli dokumenty, które do niej trafiają i z niej wychodzą. Praktyki trzeba dostosować do organizacji, działania nie są normatywne, a wejścia i wyjścia tworzą ścieżkę rewizyjną (audit trail).\n\nŻeby ogólny proces rozpisać na konkretne wymagania i czynności, przypisać do nich role i zostawić ślad w dokumentach, z którego da się rozliczyć pracę.","zycie":"Praktyka: „Dbaj o rodzinny samochód”. Działania: raz w roku przegląd, co miesiąc sprawdzenie opon, zapisanie przebiegu w zeszycie. Wejście to SMS z warsztatu o terminie przeglądu, a wyjście to pieczątka w książce serwisowej. Praktyka mówi co, działania jak, a wejścia i wyjścia zostawiają ślad.","firma":"W piekarni praktyka brzmi: „Zarządzaj dostawcami”. Działania: co kwartał porównać ceny mąki w dwóch hurtowniach, sprawdzić, czy dostawy przychodziły na czas, podpisać aneks. Wejście to faktury i notatki o spóźnieniach, wyjście to podpisana umowa – po roku widać z tych papierów, dlaczego zmieniono dostawcę.","urzad":"W starostwie praktyka brzmi: „Rejestruj i klasyfikuj zgłoszenia”. Gdy urzędniczka dzwoni, że drukarka nie drukuje, informatyk wykonuje działania: zapisuje zgłoszenie, nadaje mu priorytet, naprawia i zamyka sprawę. Wejście to telefon urzędniczki, wyjście to zamknięte zgłoszenie w rejestrze.","it":"Proces DSS02 (Zarządzanie zgłoszeniami serwisowymi i incydentami) ma m.in. praktykę DSS02.02, czyli rejestrowanie, klasyfikowanie i ustalanie priorytetów zgłoszeń i incydentów. Jej działania to np. zapisanie zgłoszenia i nadanie mu priorytetu, a wyjściem jest sklasyfikowane zgłoszenie w rejestrze, z którego korzystają kolejne praktyki.","egz":"Działania: kroki konieczne i wystarczające, uwzględniają wejścia i wyjścia, wspierają role i odpowiedzialności, nie są normatywne. Odpowiedź „określa działania przynoszące korzyści” nie opisuje działania procesu. Nie myl z: Praktyka bazowa (PAM) – W modelu oceny (PAM) odpowiednikiem praktyk zarządzania są praktyki bazowe (dzień 4).","src":"COBIT 5 Framework (PL), s. 70; COBIT 5 Framework (PL), s. 89"},"cel-kontekstowy-procesu":{"t":"Cele kontekstowe (procesu)","eg":"Cele kontekstowe (procesu)","pd":"Cele dotyczące zgodności z kontekstem","en":"Contextual goals (process goals)","wyj":"Czy sposób pracy pasuje do naszej sytuacji i czy ludzie łatwo go rozumieją i stosują.\n\nPytasz, czy proces jest dostosowany do sytuacji organizacji, odpowiedni, zrozumiały i łatwy do zastosowania. Ten sam wzorcowy proces może pasować do dużej firmy i nie pasować do małej. Wtedy cel wewnętrzny jest spełniony, a kontekstowy nie.\n\nŻeby proces nie był tylko poprawny, ale też pasował do tej konkretnej organizacji i jej ludzi.","zycie":"Przyjaciółka daje ci plan treningowy maratończyka: sześć dni biegania w tygodniu. Plan jest poprawny, ale ty masz małe dzieci i godzinę wolną dziennie. Nie pasuje do twojej sytuacji. Cel kontekstowy pyta właśnie o to dopasowanie.","firma":"Mała piekarnia kopiuje procedurę reklamacji z sieci supermarketów: trzy formularze i dwa podpisy. Procedura jest zgodna z prawem, ale ekspedientki jej nie rozumieją i klienci czekają. Nie spełnia celu kontekstowego, bo nie pasuje do małej firmy.","urzad":"Gmina wiejska bierze instrukcję kancelaryjną dużego miasta z dziesięcioma referatami. W urzędzie pracuje pięć osób, więc połowy kroków nie ma kto wykonać. Instrukcja jest zgodna z przepisami, ale nie jest dopasowana do kontekstu.","it":"Organizacja wdraża DSS02 (Zarządzanie zgłoszeniami serwisowymi i incydentami) według wzorca dla dużego centrum wsparcia. Ma jednego informatyka, więc upraszcza praktyki. Dopasowanie do skali to cel kontekstowy procesu.","egz":"Słowa-klucze celu kontekstowego: dostosowany, dopasowany do sytuacji, zrozumiały, łatwy do zastosowania. Uwaga na podręcznikowe „zgodność z kontekstem”: to nie jest zgodność z przepisami. Podręcznik: „cele dotyczące zgodności z kontekstem”. Słowo „zgodność” NIE oznacza tu zgodności z przepisami (to cel wewnętrzny). Chodzi o dopasowanie do sytuacji organizacji. Nie myl z: Cele wewnętrzne (procesu) – Wewnętrzny: zgodność z regułami i dobrą praktyką. Kontekstowy: dopasowanie do sytuacji i zrozumiałość dla ludzi.; Jakość kontekstowa – Jakość kontekstowa to ogólna kategoria celów aktywatora (np. informacja istotna, kompletna, aktualna). Cel kontekstowy procesu to jej wersja dla procesu.","src":"COBIT 5 Framework (PL), s. 69"},"praktyka-procesu":{"t":"Praktyka nadzoru / zarządzania","eg":"Praktyka nadzoru / zarządzania","pd":"Praktyka nadzoru/zarządzania","en":"Governance / management practice (GP / MP)","wyj":"Jeden duży punkt planu pracy: co trzeba zrobić, bez rozpisywania na drobne kroki.\n\nKażdy proces COBIT 5 ma kilka praktyk nadzoru (EDM) albo zarządzania (APO, BAI, DSS, MEA). Praktyka mówi, co trzeba robić. Kierownictwo wybiera praktyki, dopasowuje je i akceptuje ryzyko tych, których nie wdraża. Pod każdą praktyką są działania oraz wejścia i wyjścia.\n\nŻeby podzielić proces na kilka ogólnych wymogów, które da się wybrać, dopasować i przypisać ludziom.","zycie":"Plan „Dbaj o zdrowie rodziny” ma kilka dużych punktów: szczepienia, regularne badania, zdrowe jedzenie. Każdy punkt to praktyka: mówi, co robić, ale jeszcze nie jak. Szczegóły, np. „w marcu umów cytologię”, to już działania.","firma":"Właściciel sklepu internetowego bierze z COBIT 5 praktykę „Zarządzaj dostawcami”. Nie wdraża jej słowo w słowo: ma tylko dwóch dostawców, więc upraszcza ją do jednego przeglądu rocznie. Praktyki są typowe, więc wolno, a nawet trzeba je dopasować.","urzad":"Informatyk starostwa powiatowego przegląda praktyki procesu kopii zapasowych i ciągłości działania. Jedną praktykę starosta świadomie pomija, bo urząd nie ma drugiej serwerowni. Zapisuje to jako zaakceptowane ryzyko – tak COBIT 5 każe postępować z praktykami, których się nie wdraża.","it":"Proces APO12 (Zarządzanie ryzykiem) dzieli się na praktyki, np. zbieranie danych o ryzyku, analiza ryzyka, reagowanie na ryzyko. Organizacja dopasowuje je do swojej wielkości, a pominięcie którejś akceptuje kierownictwo.","egz":"Praktyki są typowe i trzeba je dostosować. Organizacja może nie wdrożyć praktyki, ale wtedy akceptuje ryzyko. Praktyki procesów Ładu (EDM) to praktyki nadzoru, pozostałe to praktyki zarządzania. Podręcznik: „praktyka nadzoru/zarządzania” (GP/MP). Egzamin tłumaczy governance jako „Ład”, więc możesz spotkać „praktyka Ładu”. To ten sam element. Nie myl z „praktyką bazową” z modelu oceny zdolności. Nie myl z: Działania – Praktyka mówi CO (ogólny wymóg). Działanie mówi JAK (konieczne i wystarczające kroki).; Przeznaczenie procesu, rezultat, praktyka bazowa, produkt pracy – Praktyka bazowa w modelu oceny (PAM) służy do oceny poziomu 1. Praktyka nadzoru/zarządzania to element opisu procesu w COBIT 5.","src":"COBIT 5 Framework (PL), s. 70; COBIT 5 Framework (PL), s. 91"},"cel-dostepnosci-procesu":{"t":"Cele dostępności i bezpieczeństwa (procesu)","eg":"Cele dostępności i bezpieczeństwa (procesu)","pd":"Cele dotyczące dostępności i bezpieczeństwa","en":"Accessibility and security goals (process goals)","wyj":"Czy ci, którzy mają pracować według instrukcji, mogą ją znaleźć, a obcy nie mogą.\n\nSprawdzasz dwie strony. Czy osoby, które potrzebują procesu, wiedzą o nim i mają do niego dostęp? Czy proces jest poufny tam, gdzie jest to wymagane? Kategorię wyznacza to pytanie, a nie temat procesu.\n\nŻeby proces znali ci, którzy mają według niego pracować, a jego wrażliwe szczegóły nie trafiły do obcych.","zycie":"Rodzina ma spisaną listę telefonów awaryjnych i instrukcję, co robić przy awarii prądu. Każdy domownik ją zna, a kartka wisi w przedpokoju (dostępność). Kod do sejfu z dokumentami znają tylko rodzice (poufność). Obie rzeczy razem to cel dostępności i bezpieczeństwa.","firma":"Bank ma procedurę na wypadek napadu. Kasjerki znają ją na pamięć i mają ją w szufladzie. Szczegóły, np. sygnał dla ochrony, są poufne, żeby nie poznał ich przestępca. Procedura jest dostępna dla potrzebujących i poufna dla innych.","urzad":"Urząd gminy ma procedurę przyjmowania wniosków o świadczenia. Leży w intranecie (wewnętrznej stronie urzędu), więc zna ją każda urzędniczka. Procedurę nadawania haseł do systemu świadczeń znają tylko dwie osoby z działu informatyki. Obie procedury spełniają cel dostępności i bezpieczeństwa.","it":"Procedura reagowania na incydent bezpieczeństwa w DSS05 (Zarządzanie usługami bezpieczeństwa) jest znana administratorom i pracownikom helpdesku. Jej szczegóły techniczne są poufne dla reszty firmy.","egz":"Słowa-klucze: znany i dostępny dla tych, którzy go potrzebują, poufny, gdy jest to wymagane. „Proces jest zgodny z polityką bezpieczeństwa” to cel wewnętrzny (zgodność z regułami). W ogólnym modelu aktywatora ta kategoria to „Dostęp i Bezpieczeństwo”. Dla procesu pyta, czy sam proces jest znany i dostępny dla potrzebujących, a poufny, gdy trzeba. Nie chodzi o bezpieczeństwo systemu, który proces obsługuje. Nie myl z: Dostęp i Bezpieczeństwo – Dostęp i Bezpieczeństwo to ogólna kategoria celów każdego aktywatora (np. informacji). Cel dostępności procesu dotyczy tego, kto zna sam proces i ma do niego dostęp.; Cele wewnętrzne (procesu) – Zgodność z polityką bezpieczeństwa to cel wewnętrzny (zgodność z regułami). Cel dostępności pyta, kto zna proces i czy jest poufny, gdy trzeba.","src":"COBIT 5 Framework (PL), s. 69; COBIT 5 Framework (PL), s. 29"},"kaskada-celow":{"t":"Kaskada Celów","eg":"Kaskada Celów","pd":"Kaskada celów","en":"Goals Cascade","wyj":"Schodzenie od ogólnego „czego chcemy” do konkretnych zadań, jak rozpisanie wesela na listę rzeczy do załatwienia.\n\nWyznaczniki (stakeholder drivers) wpływają na potrzeby interesariuszy (stakeholder needs). Potrzeby przekłada się na cele organizacji (enterprise goals, 17 w wymiarach BSC), te na cele związane z informatyką (IT-related goals, 17 w wymiarach IT BSC), a te na cele aktywatorów (enabler goals), np. cele procesów. Każda organizacja dostosowuje kaskadę do siebie, bo nie jest ona uniwersalną prawdą.\n\nŻeby ogólne potrzeby interesariuszy przełożyć na konkretne, mierzalne cele na każdym poziomie, aż po cele procesów i innych aktywatorów, i wiedzieć, które z nich są priorytetem.","zycie":"Rodzice chcą, żeby za dwa lata stać ich było na mieszkanie. Ustalają cel domu: odkładać 1500 zł miesięcznie, a z niego cel dla domowej „informatyki”: aplikacja bankowa ma sama przelewać pieniądze na oszczędności w dniu wypłaty. Na końcu są zadania dla konkretnych „narzędzi”: zlecenie stałe, wspólny arkusz wydatków i zasada, że co miesiąc siadają razem nad liczbami – każdy krok wynika z poprzedniego, to jest kaskada celów.","firma":"Właściciel sklepu internetowego z zabawkami chce stabilnego zysku. Przekłada to na cel firmy „wracający klienci”, z niego wychodzi cel IT „sklep działa bez przerw w sezonie świątecznym”, a z tego cele aktywatorów: procedura reagowania na awarie, przeszkolony pracownik i umowa z firmą hostingową na szybką pomoc. Od ogólnej potrzeby do konkretnych zadań, krok po kroku – to kaskada celów.","urzad":"Mieszkańcy skarżą się, że na każdą sprawę w urzędzie muszą brać wolne. Gmina zapisuje cel: najważniejsze sprawy da się załatwić bez wizyty, informatyk przekłada go na cel IT: bezpieczne i stale dostępne e-usługi, a z tego wynikają cele aktywatorów: proces obsługi e-wniosków, polityka bezpieczeństwa i przeszkoleni urzędnicy. To kaskada celów: od skargi mieszkańca do konkretnego zadania w urzędzie.","it":"Potrzeba „działamy zgodnie z prawem” prowadzi do celu organizacji „zgodność z zewnętrznymi przepisami i regulacjami”, ten do celu związanego z informatyką „zgodność IT z zewnętrznymi przepisami i wsparcie zgodności biznesu”, a ten do celów procesu MEA03 (Monitorowanie, ocena i oszacowanie zgodności z wymogami zewnętrznymi).","egz":"„Do czego służy Kaskada Celów?”: do wspierania dopasowania potrzeb organizacji do rozwiązań i usług IT i do przełożenia potrzeb na konkretne cele (s. 17). RACI, architektura korporacyjna oraz wejścia i wyjścia procesu to inne kategorie. Nie myl z: Hierarchia służbowa – Kaskada dotyczy CELÓW, nie ludzi – nie mylić ze strukturą organizacyjną.; Zrównoważona karta wyników (BSC) – BSC to narzędzie, którego wymiary (finanse, klient, obszar wewnętrzny, szkolenie i rozwój) porządkują cele organizacji w kaskadzie. Nie jest samą kaskadą.","src":"COBIT 5 Framework (PL), s. 17; COBIT 5 Framework (PL), s. 18, Ilustracja 4; COBIT 5 Framework (PL), s. 20"},"dzialanie-procesu":{"t":"Działania","eg":"Działania","pd":"Działania","en":"Activities","wyj":"Konkretne kroki, które trzeba wykonać, żeby duży punkt planu został zrobiony.\n\nDziałania to konieczne i wystarczające kroki do realizacji praktyki. Uwzględniają wejścia i wyjścia oraz ułatwiają przypisanie ról. Nie są normatywne, więc organizacja przerabia je na własne procedury. Gdy są za ogólne, dokłada się szczegółowe działania z innych standardów.\n\nŻeby rozpisać praktykę na konkretne kroki, przy których łatwo wskazać, kto co robi i co wchodzi oraz wychodzi.","zycie":"Praktyka: „Przygotuj dziecko do szkoły”. Działania: kup podręczniki, podpisz zeszyty, sprawdź plan lekcji. To wystarczy, żeby praktyka była wykonana. Każda rodzina zrobi to po swojemu i to jest w porządku.","firma":"W warsztacie samochodowym praktyka brzmi: „Przyjmij auto do naprawy”. Działania: spisz usterki z klientem, zrób zdjęcia, ustal termin, wydaj potwierdzenie. Właściciel zamienia je na własną kartę przyjęcia z rubrykami. Działania z wzoru stały się procedurą warsztatu.","urzad":"W urzędzie praktyka brzmi: „Zarządzaj uprawnieniami użytkowników”. Działania to: przyjmij wniosek kierownika, nadaj dostęp, raz w roku przejrzyj listę. Informatyk dopisuje do nich szczegóły z normy ISO 27001 (międzynarodowej normy o bezpieczeństwie informacji) – to już szczegółowe działania.","it":"W DSS02 działania pod praktyką rejestrowania incydentów obejmują zapisanie zgłoszenia, klasyfikację i nadanie priorytetu. Zespół uzupełnia je szczegółowymi działaniami z ITIL (szczegóły procesu: uproszczenie kursu).","egz":"Polskie nazwy mogą się różnić między przekładami. Porównuj sens i angielski oryginał; poprawny synonim nie staje się błędny przez samą formę tłumaczenia. Kurs nie potwierdza tu aktualnego brzmienia polskiego arkusza operatora. Nie myl z: Praktyka nadzoru / zarządzania – Praktyka to ogólny wymóg (CO). Działania to kroki do jej realizacji (JAK).; Procedura – Działania COBIT 5 nie są normatywne. Procedura to konkretna, obowiązująca wersja działań, napisana przez organizację.","src":"COBIT 5 Framework (PL), s. 89; COBIT 5 Framework (PL), s. 70"},"itil":{"t":"ITIL","eg":"ITIL","pd":"ITIL (Information Technology Infrastructure Library)","en":"ITIL","wyj":"Zbiór dobrych praktyk o tym, jak na co dzień prowadzić usługi informatyczne, np. pomoc dla użytkowników.\n\nITIL opisuje dobre praktyki zarządzania usługami IT (IT Service Management), np. obsługi incydentów (incident management), problemów (problem management) i zmian (change management). Dział IT dopasowuje te praktyki do siebie. COBIT 5 jest z ITIL dopasowany i patrzy wyżej: czy usługi IT wspierają cele organizacji i kto za to odpowiada.\n\nŻeby dział IT świadczył usługi przewidywalnie: wiedział, jak przyjmować zgłoszenia, usuwać awarie i wprowadzać zmiany bez chaosu.","zycie":"W domu ciągle coś się psuje, a każdy dzwoni z tym do taty w pracy. W końcu ustalacie: usterkę zapisujesz na kartce na lodówce, pilne (cieknie woda) naprawia się od razu, reszta czeka do soboty, a po naprawie się ją odhacza. Taki porządek w obsłudze usterek to w pigułce to, co ITIL opisuje dla usług IT.","firma":"W sklepie internetowym pracownik zgłasza, że nie działa drukarka etykiet. Dostaje numer zgłoszenia, informatyk wie, że „nie da się wysłać paczek” ma pierwszeństwo przed „wolno działa poczta”, a po naprawie sprawdza, dlaczego drukarka pada co tydzień. Te reguły przyjmowania zgłoszeń, ustalania priorytetów i szukania przyczyn to praktyki ITIL.","urzad":"Urzędniczka w wydziale komunikacji starostwa nie może zalogować się do systemu, a w kolejce stoi dziesięć osób. Dzwoni pod wewnętrzny numer pomocy, zgłoszenie dostaje priorytet „pilne”, bo stoi obsługa mieszkańców, i informatyk oddzwania w kwadrans. Takie ułożenie obsługi zgłoszeń i priorytetów to dobre praktyki ITIL.","it":"DSS02 (Zarządzanie zgłoszeniami serwisowymi i incydentami) organizacja realizuje według praktyk ITIL dla incydentów, a DSS03 (Zarządzanie problemami) według praktyk zarządzania problemami. COBIT 5 dokłada do tego cele, mierniki i odpowiedzialności RACI.","egz":"Na egzaminie ITIL pojawia się tylko jako przykład standardu integrowanego przez COBIT 5 (Zasada 3). Nie myl z: COBIT 5 – COBIT: Ład i Zarządzanie IT w całej organizacji; ITIL: zarządzanie usługami IT.","src":"COBIT 5 Framework (PL), s. 15"},"ryzyko":{"t":"Ryzyko","eg":"Ryzyko","pd":"Ryzyko","en":"Risk","wyj":"Coś może pójść źle; liczy się, jak bardzo jest to prawdopodobne i jak bardzo zaboli.\n\nRyzyko to połączenie prawdopodobieństwa zdarzenia i jego konsekwencji. Zaistniałe przerwanie usługi jest incydentem; problem w zarządzaniu usługami oznacza przyczynę jednego lub wielu incydentów. Zdarzenie nie usuwa ryzyka jego nawrotu lub dalszych skutków. Ład ustala apetyt i tolerancję, a Zarządzanie identyfikuje, analizuje i obsługuje ryzyko w tych granicach.\n\nŻeby z wyprzedzeniem widzieć, co może pójść źle i jak bardzo by zaszkodziło, i świadomie decydować, czemu zapobiegać, a co zaakceptować.","zycie":"Planujecie wesele w ogrodzie w lipcu. Deszcz jest dość prawdopodobny, a skutek byłby duży – goście mokną, tort się rozpływa – więc rezerwujecie namiot. Ryzyko to ta możliwość deszczu razem z jej skutkami; jeśli w dniu wesela leje, macie już problem, a nie ryzyko.","firma":"W biurze rachunkowym tylko pani Ewa umie obsługiwać program do płac. Jeśli zachoruje w ostatnim tygodniu miesiąca, pensje u klientów się spóźnią. Szef ocenia, że to mało prawdopodobne, ale bolesne, więc każe przeszkolić drugą osobę – tak wygląda praca z ryzykiem.","urzad":"Nabór wniosków o dopłaty do wymiany pieców w urzędzie gminy zamyka się w piątek o 15:00, a wszystko idzie przez jeden serwer. Awaria akurat w piątek jest mało prawdopodobna, ale skutek byłby fatalny, więc informatyk robi kopię i ma tego dnia dyżur. To ryzyko: możliwość zdarzenia plus jego skutki.","it":"W procesie APO12 (Zarządzanie ryzykiem) dział IT prowadzi rejestr ryzyk: np. „awaria serwerowni” ma ocenione prawdopodobieństwo i skutki. Dla ryzyk powyżej apetytu ustalonego przez Ład w EDM03 (Zapewnienie optymalizacji ryzyka) planuje się działania, np. zapasowe centrum danych.","egz":"Na egzaminie ryzyko pojawia się głównie jako „optymalizacja ryzyka” (cel Ładu) i „apetyt na ryzyko” (czynnik środowiskowy we wdrożeniu). Nie myl z: Issue / problem / incydent – Problem już zaistniał; ryzyko jest możliwością w przyszłości.; Zagrożenie – Zagrożenie to źródło (np. powódź); ryzyko łączy prawdopodobieństwo z konsekwencjami.","src":"COBIT 5 Framework (PL), s. 93"},"wejscia-wyjscia":{"t":"Wejścia i wyjścia","eg":"Wejścia i wyjścia","pd":"Dane wejściowe i wyniki","en":"Inputs and outputs (work products)","wyj":"Papiery i dane, które trafiają do pracy, i te, które z niej wychodzą jako ślad.\n\nKażda kluczowa praktyka ma wejścia (np. zgłoszenie, plan) i wyjścia (np. raport, decyzja, wpis w rejestrze). Wyjście jednego procesu często jest wejściem innego. Wejścia i wyjścia tworzą ścieżkę rewizyjną, a lista COBIT 5 jest przykładowa.\n\nŻeby było wiadomo, czego praktyka potrzebuje i co wytwarza, i żeby po fakcie dało się odtworzyć, co się stało.","zycie":"Idziesz do lekarza ze skierowaniem (wejście). Wychodzisz z receptą i wpisem w karcie (wyjścia). Recepta staje się wejściem dla apteki. Gdy coś pójdzie nie tak, wpis w karcie pokaże, co lekarz zalecił.","firma":"Drukarnia dostaje od klienta plik i zamówienie (wejścia). Wydaje gotowe ulotki i protokół odbioru (wyjścia). Gdy klient reklamuje kolory, protokół z podpisem pokazuje, co zaakceptował.","urzad":"Starostwo przyjmuje wniosek o pozwolenie na budowę (wejście). Wydaje decyzję i zostawia akta sprawy (wyjścia). Kopia decyzji jest wejściem dla nadzoru budowlanego. Akta to ścieżka rewizyjna na wypadek skargi.","it":"W BAI06 (Zarządzanie zmianami) wniosek o zmianę jest wejściem, a zatwierdzona zmiana i wpis w rejestrze zmian są wyjściami. Rejestr staje się wejściem m.in. dla BAI10 (Zarządzanie konfiguracją) (szczegóły procesu: uproszczenie kursu).","egz":"Wejścia i wyjścia: produkty działań, podstawa decyzji, ścieżka rewizyjna, weryfikacja po incydencie. Definiuje się je na poziomie praktyk. Lista COBIT 5 nie jest wyczerpująca. Egzamin: „wejścia i wyjścia”. Podręcznik: „dane wejściowe i wyniki”, a same rzeczy nazywa „produktami działań” albo „pozostałościami”. To ten sam element. Nie myl z: Działania – Działania uwzględniają wejścia i wyjścia, ale same wejścia i wyjścia definiuje się na poziomie praktyk.; Informacja – Informacja to osobny aktywator. W procesie bywa wejściem lub wyjściem, ale wejścia i wyjścia to szersza kategoria produktów działań.","src":"COBIT 5 Framework (PL), s. 70; COBIT 5 Framework (PL), s. 92; COBIT 5 Framework (PL), s. 71"},"proces":{"t":"Proces","eg":"Proces","pd":"Proces","en":"Process","wyj":"Coś, co robimy regularnie i zawsze w podobny sposób, np. przyjmowanie każdego zgłoszenia.\n\nProces (process) przyjmuje wejścia (inputs), przetwarza je przez praktyki i działania ukierunkowane przez polityki i procedury i daje wyniki (outputs), np. produkt albo usługę. Ma właściciela, role i mierniki, a wynik jednego procesu bywa wejściem innego. W COBIT 5 procesy są jednym z siedmiu aktywatorów, a Referencyjny Model Procesu opisuje ich 37.\n\nŻeby powtarzalną pracę wykonywać za każdym razem tak samo dobrze, niezależnie od tego, kto ją akurat robi, i żeby dało się ją mierzyć i poprawiać.","zycie":"Co sobotę rano sprawdzasz lodówkę, piszesz listę, jedziesz do sklepu, rozpakowujesz i odhaczasz, czego zabrakło. Za tydzień wszystko powtarza się od nowa. To proces: stałe kroki, wejście (pusta lodówka i lista) i wynik (pełna lodówka).","firma":"W sklepie internetowym z herbatą przychodzi zamówienie, pracownik pakuje paczkę, drukuje etykietę i fakturę, a kurier odbiera paczki o 15:00. Tak samo dzieje się z każdym zamówieniem, codziennie. To proces – powtarzalny, z wejściem (zamówienie) i wynikiem (paczka u klienta).","urzad":"Do urzędu gminy wpływa wniosek o wycinkę drzewa. Kancelaria go rejestruje, kierownik przydziela go referentowi, ten jedzie na oględziny i wydaje decyzję. Każdy kolejny wniosek idzie tą samą ścieżką – to jest proces.","it":"DSS02 (Zarządzanie zgłoszeniami serwisowymi i incydentami) to proces: każde zgłoszenie (wejście) jest rejestrowane, klasyfikowane, rozwiązywane i zamykane (praktyki), a wynikiem jest przywrócona usługa i wpis w rejestrze. Działa codziennie i tak samo dla każdego zgłoszenia.","egz":"Opis „zbiór praktyk ukierunkowanych politykami i procedurami, który przetwarza wejścia w wyniki” to Proces (Załącznik H). Nie myl z: Projekt – Projekt jest jednorazowy, ma początek i koniec (np. wdrożenie systemu). Proces trwa i się powtarza (np. obsługa zgłoszeń w tym systemie).","src":"COBIT 5 Framework (PL), s. 93"},"kategorie-celow-procesu":{"t":"Kategorie celów procesu","eg":"Kategorie celów procesu","pd":"Kategorie celów procesu","en":"Process goal categories","wyj":"Trzy pytania o każdą pracę: czy robimy ją porządnie, czy komuś się przydaje, czy jest bezpieczna.\n\nCel procesu (process goal) to stwierdzenie opisujące pożądany wynik procesu. COBIT 5 grupuje cele procesu w trzy kategorie: wewnętrzne (intrinsic: jakość rzeczywista, zgodność z dobrą praktyką oraz z regułami wewnętrznymi i zewnętrznymi), kontekstowe (contextual: dopasowanie do sytuacji organizacji, zrozumiałość, łatwość zastosowania) oraz dostępności i bezpieczeństwa (accessibility and security: poufność, gdy trzeba, i dostępność dla potrzebujących). Do każdego celu dobiera się mierniki SMART.\n\nŻeby cele każdego procesu ustalać kompletnie: nie tylko „czy robimy to porządnie”, ale też „czy to pasuje do nas” i „czy jest dostępne i bezpieczne”.","zycie":"Rodzina ma swój poranny sposób na wyprawienie dziecka do szkoły. Ma działać i trzymać się zasad – śniadanie zjedzone, zimą nikt nie wychodzi bez kurtki (wewnętrzny), ma pasować do tej rodziny i być zrozumiały dla siedmiolatka (kontekstowy), a plan wisi na lodówce, choć kod do furtki zna tylko rodzina (dostępność i bezpieczeństwo). Tak wyglądają trzy kategorie celów procesu.","firma":"Piekarnia ma proces przyjmowania zamówień na torty. Zgodnie z przepisami pyta o alergeny (wewnętrzny), formularz jest prosty i dopasowany do małego zakładu, a nie skopiowany z sieci cukierni (kontekstowy), a wzór zamówienia ma każda ekspedientka, tylko numery telefonów klientów są chronione (dostępność i bezpieczeństwo). Każdy z tych trzech warunków to inna kategoria celów procesu.","urzad":"Urząd gminy wydaje decyzje o dodatku mieszkaniowym. Procedura musi być zgodna z KPA i ustawą (wewnętrzny), dopasowana do małej gminy z dwiema urzędniczkami i dla nich zrozumiała (kontekstowy), a przy tym dostępna na każdym stanowisku i chroniąca dane o dochodach wnioskodawców (dostępność i bezpieczeństwo). To trzy kategorie celów jednego procesu.","it":"Dla BAI06 (Zarządzanie zmianami) organizacja zapisuje trzy cele: każda zmiana zatwierdzona zgodnie z polityką (wewnętrzny), procedura dopasowana do małego zespołu IT (kontekstowy), rejestr zmian dostępny dla uprawnionych i chroniony przed modyfikacją (dostępność i bezpieczeństwo).","egz":"Zgodność z regułami zewnętrznymi (przepisy) to cel wewnętrzny procesu, nie kontekstowy. Kontekstowe = dopasowanie do sytuacji organizacji. Cele „wewnętrzne” procesu to intrinsic (jakość sama w sobie, zgodność z regułami), a nie „cele wnętrza organizacji”. Nie myl z: Cele aktywatora – To te same trzy kategorie co w ogólnym modelu aktywatora, zastosowane do procesu.","src":"COBIT 5 Framework (PL), s. 69; COBIT 5 Framework (PL), s. 69, Ilustracja 29"},"wskaznik-opozniony":{"t":"Wskaźnik opóźniony","eg":"Wskaźnik opóźniony","pd":"Wskaźnik następujący","en":"Lag indicator","wyj":"Liczba, którą widać dopiero po fakcie i która mówi, czy cel się udał, np. wynik sprawdzianu.\n\nZarządzanie wydajnością aktywatora (enabler performance management) zadaje cztery pytania. Dwa pierwsze dotyczą wyniku: czy potrzeby interesariuszy są uwzględnione i czy cele aktywatora są osiągane. Mierniki, które na nie odpowiadają, to wskaźniki opóźnione (lag indicators). Pokazują to, co już się stało, więc służą do rozliczenia i wniosków na przyszłość.\n\nŻeby po fakcie sprawdzić, czy aktywator dał to, co miał dać: czy cele osiągnięto i czy potrzeby interesariuszy są uwzględnione.","zycie":"Miesiąc temu zacząłeś dietę. Dziś stajesz na wadze i widzisz minus 3 kg. Waga nie powie Ci, co robić jutro, tylko pokazuje, co już się stało – to wskaźnik opóźniony.","firma":"Właścicielka sklepu internetowego na koniec kwartału otwiera raport: przychód wzrósł o 10%. Na ten wynik nic już nie poradzi, może tylko wyciągnąć wnioski na następny kwartał – to wskaźnik opóźniony.","urzad":"W styczniu kierownik wydziału komunikacji w starostwie liczy, ile rejestracji pojazdów załatwiono w zeszłym roku w terminie. Wynik pokazuje, czy ubiegłoroczny cel osiągnięto, ale niczego w tamtym roku już nie zmieni – to wskaźnik opóźniony.","it":"W DSS02 (Zarządzanie zgłoszeniami serwisowymi i incydentami) odsetek incydentów rozwiązanych za kwartał w uzgodnionym czasie to wskaźnik opóźniony: mówi, czy cel osiągnięto. Taki wynik raportuje się m.in. w MEA01 (Monitorowanie, ocena i oszacowanie wydajności i zgodności).","egz":"Pytania o osiągnięcie celów i uwzględnienie potrzeb → wskaźniki opóźnione. Egzamin: „Wskaźniki opóźnione”. Podręcznik: „Wskaźniki następujące”. Nie myl z: Wskaźnik wiodący – Wiodący mierzy, czy aktywator działa właściwie: cykl życia i dobre praktyki. Przewiduje wynik.","src":"COBIT 5 Framework (PL), s. 29; materiały Altkom"},"zdolnosc-uslugowa":{"t":"Zdolność usługowa","eg":"Zdolność usługowa","pd":"Zdolność do świadczenia usług","en":"Service capabilities","wyj":"Wszystko, na czym stoją usługi informatyczne: sprzęt, sieć, programy i same usługi.\n\nBaseline architecture to architektura bazowa opisująca stan obecny; target to docelowa, a transition to przejściowa. Reference architecture jest pojęciem wzorca referencyjnego i nie jest automatycznym synonimem baseline.\n\nŻeby nazwać wszystko, na czym stoją usługi IT, i móc tym świadomie zarządzać.","zycie":"Wieczorny film w domu zależy od routera, telewizora i aplikacji z filmami. Razem dają usługę „oglądamy film”. Router i telewizor to infrastruktura, a aplikacja to aplikacja. Całość to zdolność usługowa twojego domu.","firma":"Przychodnia umawia wizyty przez internet. Potrzebuje serwera, systemu rejestracji, łącza i aktualnej listy lekarzy. Wszystko to razem jest zdolnością usługową, dzięki której pacjent zapisze się o północy.","urzad":"Gmina oferuje e-płatności za odbiór śmieci. Działa to dzięki serwerom, systemowi podatkowemu, bramce płatności i bazie mieszkańców. Te zasoby razem, łącznie z informacją w bazie, tworzą zdolność usługową gminy.","it":"Proces BAI04 (Zarządzanie dostępnością i pojemnością) dba, żeby infrastruktura i aplikacje udźwignęły potrzebne usługi. APO09 (Zarządzanie umowami o świadczenie usług) zapisuje uzgodnione poziomy usług. Oba procesy zarządzają zdolnością usługową.","egz":"Zdolność usługowa = usługi, infrastruktura i aplikacje łącznie. Informacja jest jedną ze zdolności usługowych (s. 86). Procesy zapewniają i wymagają zdolności usługowych. Egzamin: „zdolność usługowa”, podręcznik: „zdolność do świadczenia usług”. Nie myl ze „zdolnością procesu” (poziomy 0–5 z modelu oceny). To zupełnie inne pojęcie. Nie myl z: Model Zdolności Procesu – Zdolność procesu (poziomy 0–5) mierzy, jak dobrze działa proces. Zdolność usługowa to zasoby: aplikacje, infrastruktura, usługi.; Usługi, Infrastruktura i Aplikacje – Usługi, Infrastruktura i Aplikacje to nazwa całego aktywatora 6. Zdolność usługowa to termin na to, co ten aktywator obejmuje.","src":"COBIT 5 Framework (PL), s. 85; COBIT 5 Framework (PL), s. 86; COBIT 5 Framework (PL), s. 71"},"cele-zwiazane-z-it":{"t":"Cele związane z informatyką","eg":"Cele związane z informatyką","pd":"Cele związane z IT","en":"IT-related goals","wyj":"Siedemnaście typowych celów dla informatyki, np. systemy działają, dane są bezpieczne, projekty kończą się na czas.\n\nTo trzeci krok kaskady celów: cele organizacji przekłada się na cele związane z IT (IT-related goals), czyli rezultaty związane z IT. COBIT 5 podaje ich 17 w wymiarach IT BSC; mapowanie na cele organizacji jest w Załączniku B, a na procesy w Załączniku C. „Związane z IT” oznacza informację i powiązaną technologię w całej organizacji, a nie tylko dział IT.\n\nŻeby wiedzieć, co informacja i technologia muszą zapewnić, aby udały się cele organizacji. Dzięki temu IT nie wyznacza sobie celów w oderwaniu od reszty organizacji.","zycie":"Rodzina chce bezpiecznie odkładać pieniądze. Żeby się udało, w domu musi działać bankowość w telefonie, hasła muszą być w menedżerze haseł, a skany umów mieć kopię zapasową. Te wymagania wobec domowej technologii to cele związane z IT.","firma":"Sklep internetowy chce zadowolonych klientów. Z tego wynika, że strona ma działać także w Black Friday, płatności mają przechodzić bez błędów, a adresy klientów nie mogą wyciec (cele IT 07 i 10). To cele związane z IT – to, co technologia musi dać, żeby udał się cel sklepu.","urzad":"Gmina chce, żeby mieszkańcy załatwiali sprawy przez internet. Do tego e-usługi muszą działać, dane osobowe muszą być chronione, a rejestry aktualne. To nie są cele informatyka dla niego samego, tylko cele związane z IT, które wynikają z celu gminy.","it":"Cel związany z IT 10 „Bezpieczeństwo informacji, infrastruktury przetwarzania i aplikacji” (wymiar Obszar wewnętrzny) to rezultat, który w banku muszą zapewnić m.in. procesy APO13 Zarządzanie bezpieczeństwem i DSS05 Zarządzanie usługami bezpieczeństwa.","egz":"Opis „rezultaty związane z IT, wymagane do osiągnięcia celów organizacji” to Cele związane z informatyką (s. 18). Egzamin: „Cele związane z informatyką”. Podręcznik: „Cele związane z IT”. Nie myl z: Cele organizacji – Krok wcześniej: cele organizacji dotyczą całej działalności.; Cele aktywatora – Krok później: cele konkretnych aktywatorów (np. procesów), które pozwalają osiągnąć cele związane z informatyką.","src":"COBIT 5 Framework (PL), s. 18; COBIT 5 Framework (PL), s. 19, Ilustracja 6; materiały Altkom"},"cel-wewnetrzny-procesu":{"t":"Cele wewnętrzne (procesu)","eg":"Cele wewnętrzne (procesu)","pd":"Cele wewnętrzne","en":"Intrinsic goals (process goals)","wyj":"Czy praca jest zrobiona porządnie i zgodnie z regułami, niezależnie od tego, kto z niej korzysta.\n\nPatrzysz na sam proces i zadajesz trzy pytania. Czy ma jakość rzeczywistą? Czy jest zgodny z dobrą praktyką? Czy przestrzega reguł wewnętrznych i zewnętrznych? Wszystko, co dotyczy zgodności z regułami, trafia do tej kategorii.\n\nŻeby sprawdzić jakość procesu samego w sobie: czy jest poprawny, zgodny z dobrą praktyką i z regułami.","zycie":"Pieczesz ciasto według przepisu babci. Cel wewnętrzny pyta: czy ciasto wyszło, czy trzymałaś się sprawdzonego przepisu i czy nie złamałaś zasad higieny. Nie pyta, czy goście lubią sernik, bo to inna kategoria.","firma":"Biuro rachunkowe rozlicza podatki klientów. Cel wewnętrzny: rozliczenia są poprawne, zgodne z ustawą o VAT i z wewnętrzną instrukcją biura. To, że przepis pochodzi z zewnątrz, nie zmienia kategorii.","urzad":"Urząd gminy wydaje dowody osobiste. Cel wewnętrzny procesu to poprawne dane i zgodność z ustawą oraz z regulaminem urzędu. Zgodność z ustawą to cel wewnętrzny, choć ustawę napisał Sejm, a nie urząd.","it":"W procesie MEA03 (Monitorowanie, ocena i oszacowanie zgodności z wymogami zewnętrznymi) organizacja sprawdza, czy procesy spełniają przepisy. Z perspektywy każdego z tych procesów taka zgodność to cel wewnętrzny.","egz":"Zgodność z regułami zewnętrznymi (przepisy, regulacje) = cel WEWNĘTRZNY procesu. Słowo „zewnętrzne” w odpowiedzi nie oznacza celu kontekstowego. „Wewnętrzne” to intrinsic, czyli „sam w sobie”. Nie chodzi o wnętrze organizacji. Dlatego zgodność z przepisami ZEWNĘTRZNYMI też jest celem wewnętrznym. Nie myl z: Cele kontekstowe (procesu) – Wewnętrzny: czy proces jest poprawny i zgodny z regułami. Kontekstowy: czy pasuje do TEJ organizacji i jest zrozumiały dla jej ludzi.; Jakość wewnętrzna – Jakość wewnętrzna to kategoria celów każdego aktywatora (np. informacji). Cel wewnętrzny procesu to ta sama idea zastosowana do procesu.","src":"COBIT 5 Framework (PL), s. 69; COBIT 5 Framework (PL), s. 69, Ilustracja 29"}},"S":[{"lekcje":["en-k15-proces-aktywator","en-k18-procesy-a-inne-aktywatory"],"pt":"Lekcje 2.15–2.18","h":"Proces zamienia wejścia w wyniki – i zapewnia oraz wymaga innych aktywatorów","b":"<p><w k=\"proces\">Proces</w> (<span class=\"en\">Process</span>) to zbiór praktyk ukierunkowanych przez polityki i procedury: wejścia → przetwarzanie → wyniki.</p><ul><li>Potrzebuje i wytwarza <b>informację</b>.</li><li><b>Zapewnia i wymaga</b> zdolności usługowych.</li><li>O skuteczności decyduje <b>kultura</b>.</li></ul>","c":"Udziałowcy, klienci i regulatorzy to interesariusze zewnętrzni procesu.","s":"COBIT 5 Framework (PL), s. 69–71","ctx":"<p>Interesariusze procesu są wewnętrzni (zarząd, kierownictwo, pracownicy, wolontariusze) i zewnętrzni (klienci, partnerzy biznesowi, udziałowcy, organy regulacyjne). Ich role zapisuje diagram RACI. Cykl życia procesu: definiowanie, tworzenie, obsługa, monitorowanie, a potem dostosowanie albo wycofanie. Proces potrzebuje też ról z diagramów RACI, innych procesów oraz polityk i procedur.</p><p>Pułapka: proces korzysta z <w k=\"zdolnosc-uslugowa\">zdolności usługowych</w> (infrastruktury i aplikacji), ale też je zapewnia. Pytania o interesariuszy i cele mierzą wynik procesu, czyli <w k=\"wskaznik-opozniony\">wskaźniki opóźnione</w>. Pytania o cykl życia i dobre praktyki mierzą jego działanie, czyli <w k=\"wskaznik-wiodacy\">wskaźniki wiodące</w>. Podręcznik nazywa je „następującymi” i „wyprzedzającymi”.</p><p>Przykład: sklep ma świetnie opisany proces wysyłki. Mimo to magazyn nie dostaje danych, nikt nie wie, kto zatwierdza zwroty, a system kuriera często nie działa. Każdy z tych braków to inny aktywator. Poprawianie samego opisu procesu nic tu nie da.</p>"},{"pt":"Sprawdź się","quiz":{"id":"q-sym-011","sylabus":["EN-01-01","EN-02-10"],"tresc":"Wejścia i wyjścia (produkty pracy) w modelu procesów COBIT 5:","opcje":[{"t":"Wspierają decyzje i zapewniają ścieżkę rewizyjną działań procesu","ok":true,"w":"Wejścia i wyjścia wspierają podejmowanie decyzji oraz śledzenie wykonanych działań. Są zdefiniowane na poziomie kluczowych praktyk i mogą przepływać między procesami."},{"t":"Definiują role R, A, C, I","ok":false,"w":"Role i odpowiedzialności opisuje RACI. Wejście lub wyjście jest informacją bądź produktem pracy, a nie przypisaniem litery RACI."},{"t":"Zastępują praktyki zarządzania i opisują je szczegółowo krok po kroku","ok":false,"w":"Praktyki i działania opisują pracę do wykonania, a produkty pracy jej wejścia i wyjścia. Uzupełniają się, zamiast wzajemnie zastępować."},{"t":"Są wyłącznie dokumentami papierowymi","ok":false,"w":"Produkty pracy mogą mieć różne postacie, także elektroniczne dane, rejestry, decyzje i raporty. Model nie ogranicza ich do papieru."}],"src":"COBIT 5 Framework (EN), sekcja załącznik G, aktywator 2: Processes","pomoc":{"t":"Pytanie dotyczy lekcji 2.15 „Aktywator 2 – Procesy: definicja, interesariusze i cykl życia”. Cel lekcji: Potrafię podać definicję procesu, wskazać jego interesariuszy wewnętrznych i zewnętrznych oraz fazy cyklu życia procesu.","k":[]},"kurs":"Wejścia i wyjścia wspierają podejmowanie decyzji oraz śledzenie wykonanych działań. Są zdefiniowane na poziomie kluczowych praktyk i mogą przepływać między procesami.","kontekst":""}},{"pt":"Arkusz próbny","sp1":"sp1-27","lekcja":"2.15","temat":"Aktywator 2 – Procesy: definicja, interesariusze i cykl życia","k":[]},{"pt":"Arkusz próbny","sp1":"sp1-38","lekcja":"2.15","temat":"Aktywator 2 – Procesy: definicja, interesariusze i cykl życia","k":[]},{"pt":"Sprawdź się","quiz":{"id":"q-spr-en-12","sylabus":["EN-02-16","EN-02-11"],"tresc":"Bank ma dobrze opisaną procedurę zgłaszania błędów w systemie transakcyjnym. Pracownicy jednak ukrywają pomyłki, bo za każdą dostają naganę. Jaki mechanizm opisuje tu COBIT 5?","opcje":[{"t":"To problem wyłącznie aktywatora Ludzie, Umiejętności i Kompetencje, więc wystarczy przeszkolić pracowników.","ok":false,"w":"Pracownicy umieją zgłaszać. Problemem jest system kar, czyli kultura i zachowanie, a nie same umiejętności."},{"t":"Zachowanie i kultura decydują o skuteczności procesu; bez zmiany zachęt procedura nie da wyników.","ok":true,"w":"Tak. Proces może być doskonały, ale gdy interesariusze nie chcą wykonywać działań właściwie, wyników nie będzie. Zachęty i środki zniechęcające to dobra praktyka kultury."},{"t":"Do procedury trzeba dopisać więcej kroków kontrolnych, bo błąd leży w samym opisie procesu.","ok":false,"w":"Opis jest dobry. Więcej kroków nie zmieni zachowania, które wywołują nagany."},{"t":"Procedura jest dobrze zaprojektowana, więc wyniki procesu zostaną osiągnięte bez względu na zachowania.","ok":false,"w":"Podręcznik zaznacza, że nawet doskonale zaprojektowany proces nie da wyników, jeśli uczestnicy nie chcą działać właściwie (s. 80)."}],"src":"COBIT 5 Framework (EN), sekcja załącznik G, aktywator 4: Relationships","pomoc":{"t":"Pytanie dotyczy lekcji 2.18 „Procesy a inne aktywatory”. Cel lekcji: Potrafię opisać, czego proces potrzebuje od innych aktywatorów i co im daje.","k":[]},"kurs":"Tak. Proces może być doskonały, ale gdy interesariusze nie chcą wykonywać działań właściwie, wyników nie będzie. Zachęty i środki zniechęcające to dobra praktyka kultury.","kontekst":""}},{"pt":"Arkusz próbny","sp1":"sp1-13","lekcja":"2.18","temat":"Procesy a inne aktywatory","k":[]},{"lekcje":["en-k16-kategorie-celow-procesu"],"pt":"Lekcja 2.16","h":"Cele procesu: wewnętrzne, kontekstowe, dostępności i bezpieczeństwa","b":"<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>Kategoria</th><th>Pytanie</th></tr><tr><td><w k=\"cel-wewnetrzny-procesu\">Wewnętrzne</w> (<span class=\"en\">Intrinsic</span>)</td><td>dobry sam w sobie, zgodny z regułami wewnętrznymi <b>i zewnętrznymi</b>?</td></tr><tr><td><w k=\"cel-kontekstowy-procesu\">Kontekstowe</w> (<span class=\"en\">Contextual</span>)</td><td>dopasowany, zrozumiały, łatwy w użyciu?</td></tr><tr><td><w k=\"cel-dostepnosci-procesu\">Dostępności i bezpieczeństwa</w></td><td>poufny, gdy trzeba, i znany potrzebującym?</td></tr></table></div>","c":"Zgodność z przepisami zewnętrznymi to cel wewnętrzny, bo „wewnętrzny” znaczy tu „jakość sama w sobie”.","s":"COBIT 5 Framework (PL), s. 69","ctx":"<p>Cel procesu to według podręcznika „stwierdzenie opisujące pożądany wynik procesu”. Ma mierniki zgodne z kryteriami SMART. Cele procesu wspierają <w k=\"cele-zwiazane-z-it\">cele związane z Informatyką</w>, a te wspierają cele organizacji (<w k=\"kaskada-celow\">Kaskada Celów</w>). Trzy <w k=\"kategorie-celow-procesu\">kategorie celów procesu</w> odpowiadają ogólnym kategoriom celów aktywatora: jakość wewnętrzna, jakość kontekstowa, dostęp i bezpieczeństwo.</p><p>Pułapka: angielskie <span class=\"en\">intrinsic</span> to nie <span class=\"en\">internal</span>. Zgodność z dowolnym przepisem, nawet unijnym, jest cechą samego procesu, więc to cel wewnętrzny. Podręcznik nazywa cele kontekstowe „celami dotyczącymi zgodności z kontekstem”.</p><p>Przykład: proces reklamacji w banku. Zgodność z ustawą o reklamacjach to cel wewnętrzny. Łatwe stosowanie w małych oddziałach to cel kontekstowy. Procedurę zna każdy konsultant, a dane klientów widzą tylko uprawnieni – to cel dostępności i bezpieczeństwa.</p>"},{"pt":"Sprawdź się","quiz":{"id":"q-enk-16-3","sylabus":["EN-02-08"],"tresc":"Proces udzielania kredytów musi być zgodny z rozporządzeniem regulatora. Do której <b>kategorii celów procesu</b> należy ten cel?","opcje":[{"t":"Cele dostępności i bezpieczeństwa","ok":false,"w":"Ta kategoria dotyczy poufności i dostępności procesu."},{"t":"Cele kontekstowe, bo przepis pochodzi spoza banku","ok":false,"w":"„Wewnętrzny” znaczy tu „jakość sama w sobie”, nie „wewnątrz organizacji”."},{"t":"Cele wewnętrzne","ok":true,"w":"Dobrze. Zgodność z regułami wewnętrznymi i zewnętrznymi to cel wewnętrzny (<em>intrinsic</em>)."},{"t":"Cele związane z informatyką","ok":false,"w":"To wyższy poziom kaskady celów, a nie kategoria celów procesu."}],"src":"COBIT 5 Framework (EN), sekcja załącznik G, aktywator 2: Goals","pomoc":{"t":"Pytanie dotyczy lekcji 2.16 „Trzy kategorie celów procesu”. Cel lekcji: Potrafię przypisać cel procesu do jednej z trzech kategorii: wewnętrzne, kontekstowe, dostępności i bezpieczeństwa.","k":["kategorie-celow-procesu","cel-wewnetrzny-procesu","cel-kontekstowy-procesu","cel-dostepnosci-procesu"]},"kurs":"Dobrze. Zgodność z regułami wewnętrznymi i zewnętrznymi to cel wewnętrzny (<em>intrinsic</em>).","kontekst":""}},{"pt":"Arkusz próbny","sp1":"sp1-02","lekcja":"2.16","temat":"Trzy kategorie celów procesu","k":["kategorie-celow-procesu","cel-wewnetrzny-procesu","cel-kontekstowy-procesu","cel-dostepnosci-procesu"]},{"lekcje":["en-k17-praktyki-dzialania"],"pt":"Lekcja 2.17","h":"Praktyka mówi „co”, działanie – „jak”, a działania nie są normatywne","b":"<div class=\"tblwrap\"><table class=\"tbl\"><tr><th><w k=\"praktyka-procesu\">Praktyka</w> – „co”</th><th><w k=\"dzialanie-procesu\">Działanie</w> – „jak”</th></tr><tr><td>deklaracja działań dających korzyści i optymalizujących <w k=\"ryzyko\">ryzyko</w> oraz zasoby</td><td>konieczne i wystarczające kroki wdrożenia praktyki</td></tr><tr><td>typowa – do dostosowania</td><td>uwzględnia <w k=\"wejscia-wyjscia\">wejścia i wyjścia</w>, ułatwia wyznaczenie ról; <b>nienormatywne</b></td></tr></table></div>","c":"Działania COBIT 5 to wzór do przerobienia na własne procedury, a nie przepis do wykonania słowo w słowo.","s":"COBIT 5 Framework (PL), s. 70","ctx":"<p>Praktyki nadzoru i zarządzania (<span class=\"en\">Governance / Management practices</span>) to katalog, a nie obowiązek. Kierownictwo wybiera praktyki i decyduje, jak je wdrożyć. Może też świadomie zaakceptować ryzyko, że jakiejś praktyki nie wdroży. Szczegółowe działania COBIT 5 odsyła do innych standardów, np. <w k=\"itil\">ITIL</w>, ISO/IEC 27000 i PRINCE2 (metodyka zarządzania projektami). <w k=\"wejscia-wyjscia\">Wejścia i wyjścia</w> dają rejestr i ścieżkę rewizyjną działań; wyjście jednego procesu często jest wejściem innego.</p><p>Podręcznik (s. 70) wylicza cechy obu poziomów osobno. Praktyki nadzoru i zarządzania: są deklaracjami działań, które mają przynieść korzyści oraz zoptymalizować ryzyko i wykorzystanie zasobów; są zgodne z uznanymi normami; są typowe, więc trzeba je dopasować; obejmują role biznesu i IT. Działania (<span class=\"en\">Activities</span>): opisują konieczne i wystarczające kroki wdrożenia praktyki, uwzględniają dane wejściowe i wyniki procesu, ułatwiają ustalenie ról i odpowiedzialności, nie są normatywne. Pułapka: zdanie o korzyściach, ryzyku i zasobach (czyli o Tworzeniu Wartości) opisuje <b>praktykę</b>; zdania o krokach, wejściach i wyjściach oraz rolach – <b>działanie</b>.</p><p>Przykład: firma zmienia ERP (zintegrowany system do zarządzania firmą). Praktyka: zarządzaj zmianami. Działanie: oceń wpływ zmiany i uzyskaj zgodę. Wejście: wniosek o zmianę. Wyjście: zatwierdzona zmiana i wpis w rejestrze zmian. To firma ustala, kto zatwierdza zmianę i w jakim narzędziu.</p>"},{"pt":"Sprawdź się","quiz":{"id":"q-sk-wejscia-wyjscia-1","sylabus":["EN-02-10"],"tresc":"Na jakim poziomie COBIT 5 definiuje wejścia i wyjścia procesu?","opcje":[{"t":"Na poziomie celów związanych z IT w kaskadzie celów.","ok":false,"w":"Kaskada celów łączy cele, a nie produkty działań. To inny element modelu."},{"t":"Na poziomie każdego działania, bo to działania uwzględniają wejścia i wyjścia.","ok":false,"w":"Prawda, że działania je uwzględniają, ale definiuje się je na poziomie praktyk."},{"t":"Nigdzie, bo lista COBIT 5 jest zamknięta i organizacja jej nie zmienia.","ok":false,"w":"Lista przykładowych wejść i wyjść nie jest wyczerpująca. Organizacja może dodać własne przepływy."},{"t":"Na poziomie kluczowych praktyk Ładu i Zarządzania.","ok":true,"w":"Tak. Wejścia i wyjścia definiuje się na poziomie kluczowych praktyk (s. 70)."}],"src":"COBIT 5 Framework (EN), sekcja załącznik G, aktywator 2: Good Practices","pomoc":{"t":"Pytanie dotyczy lekcji 2.17 „Praktyki, działania, wejścia i wyjścia procesu”. Cel lekcji: Potrafię odróżnić praktykę, działanie oraz wejścia i wyjścia procesu i wiem, że działania nie są normatywne.","k":["praktyki-dzialania","praktyka-procesu","dzialanie-procesu","wejscia-wyjscia"]},"kurs":"Tak. Wejścia i wyjścia definiuje się na poziomie kluczowych praktyk (s. 70).","kontekst":""}},{"pt":"Arkusz próbny","sp1":"sp1-41","lekcja":"2.17","temat":"Praktyki, działania, wejścia i wyjścia procesu","k":["praktyki-dzialania","praktyka-procesu","dzialanie-procesu","wejscia-wyjscia"]}],"bankRevision":"8a8975438d700592","legacySp1Order":[null,null,{"sp1":"sp1-27"},{"sp1":"sp1-38"},null,{"sp1":"sp1-13"},null,null,{"sp1":"sp1-02"},null,null,{"sp1":"sp1-41"}]};</script>
