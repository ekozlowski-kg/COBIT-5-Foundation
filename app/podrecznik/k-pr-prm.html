<script>window.DECK={"id":"k-pr-prm","rozdzial":"Rozdział 6 · Zasada 5: Oddzielenie Ładu od Zarządzania · s. 31–33","tytul":"Referencyjny Model Procesu – 37 procesów","prev":"k-pr-zasada-5.html","next":"k-pr-atlas-edm.html","T":{"zasob":{"t":"Zasób","eg":"Zasób","pd":"Zasób","en":"Resource","wyj":"To, czym dysponujemy: ludzie, pieniądze, sprzęt, czas i informacje.\n\nZasób (resource) to każdy zasób organizacji, który pomaga jej osiągnąć cele, np. ludzie, finanse, sprzęt, infrastruktura i informacja. Zasoby są ograniczone, więc przy każdej decyzji pyta się, jakie są potrzebne. Optymalizacja zasobów (resource optimisation) to jeden z trzech składników Celu Ładu, obok realizacji korzyści i optymalizacji ryzyka.\n\nŻeby wiedzieć, czym organizacja dysponuje, aby osiągnąć cele: ludźmi, pieniędzmi, sprzętem, infrastrukturą i informacją.","zycie":"W sobotę masz przeprowadzkę. Masz do dyspozycji 2000 zł, samochód brata, trzech kolegów do pomocy i jeden dzień. Pieniądze, auto, ludzie i czas to Twoje zasoby – od tego, jak je rozdzielisz, zależy, czy zdążysz.","firma":"Właściciel warsztatu dostaje duże zlecenie na serwis floty aut. Sprawdza, czy ma wolnych mechaników, podnośniki, pieniądze na części i aktualną bazę klientów z historią napraw. Ludzie, sprzęt, pieniądze i informacje to zasoby warsztatu.","urzad":"Dyrektor szkoły układa plan na nowy rok. Ma określoną liczbę etatów nauczycieli, budżet z gminy, pracownię komputerową z siecią i dane uczniów w dzienniku. To wszystko są zasoby szkoły.","it":"EDM04 (Zapewnienie optymalizacji zasobów) pilnuje, by zasoby IT (ludzie, procesy, technologie) były wystarczające i optymalnie wykorzystane. Szczegółami zajmuje się Zarządzanie, np. APO07 (Zarządzanie zasobami ludzkimi) ludźmi, a APO06 (Zarządzanie budżetem i kosztami) pieniędzmi.","egz":"Pojawia się w „optymalizacji zasobów” i w pytaniu „Jakie zasoby są wymagane?” przy każdej decyzji (s. 17). Nie myl z: Aktywator – Aktywator to szersze pojęcie – obejmuje też np. procesy, kulturę czy polityki. Zasoby (np. ludzie, infrastruktura) są ujęte w niektórych kategoriach aktywatorów.","src":"COBIT 5 Framework (PL), s. 13, 93"},"prm":{"t":"Referencyjny Model Procesu","eg":"Referencyjny Model Procesu","pd":"Model referencyjny procesu COBIT 5","en":"Process Reference Model (PRM)","wyj":"Gotowa lista 37 typowych zadań informatyki w każdej firmie czy urzędzie, podzielona na pięć szuflad.\n\nReferencyjny Model Procesu (Process Reference Model) ma 37 procesów w dwóch obszarach: Ład (domena EDM, Evaluate, Direct and Monitor, 5 procesów) i Zarządzanie (4 domeny PBRM: APO 13, BAI 10, DSS 6, MEA 3, razem 32). Każdy proces ma opis, cele, praktyki, działania, wejścia i wyjścia oraz tabelę RACI. Model nie jest normatywny: organizacja dopasowuje go do siebie, a w ocenie zdolności tworzy on wymiar procesu.\n\nŻeby każda organizacja miała kompletny wzorzec procesów Ładu i Zarządzania IT, z którym może porównać swoją praktykę i znaleźć luki, zamiast wymyślać wszystko od zera.","zycie":"Młodzi po ślubie dostają od rodziców listę „co trzeba ogarniać w domu”: rachunki, zakupy, sprzątanie, naprawy, ubezpieczenia. U nich rachunkami i ubezpieczeniami zajmuje się jedna osoba w jeden wieczór w miesiącu, a napraw prawie nie ma, bo mieszkanie jest nowe. Lista od rodziców jest jak PRM – wzorzec, który każdy dopasowuje do siebie.","firma":"Właściciel warsztatu czyta listę 37 procesów COBIT i łapie się za głowę. Konsultant tłumaczy: to wzorzec, nie obowiązek – u Ciebie jedna osoba może zajmować się i dostawcami, i umowami, i sprzętem. Ważne tylko, żeby żaden istotny obszar nie został bez opieki.","urzad":"Informatyk w urzędzie gminy kładzie obok siebie listę procesów PRM i to, co urząd faktycznie robi. Kopie zapasowe i obsługę zgłoszeń mają, ale nikt nie pilnuje umów z dostawcami oprogramowania. PRM posłużył jako wzorzec do znalezienia luki, a nie jako 37 procedur do napisania.","it":"Organizacja porównuje swoją pracę z PRM i widzi, że ma kopie zapasowe (DSS04) i obsługę incydentów (DSS02), ale nikt nie prowadzi APO10 (Zarządzanie dostawcami). Luka trafia do planu doskonalenia, a pozostałe procesy organizacja łączy i przycina według swojej wielkości.","egz":"Liczby: 5 + 32 = 37 (EDM 5, APO 13, BAI 10, DSS 6, MEA 3). W ocenie zdolności PRM tworzy wymiar procesu. Nie myl z: Model oceny procesu (PAM) – PAM ocenia zdolność procesów z PRM. PRM to sam zestaw procesów (wymiar procesu).","src":"COBIT 5 Framework (PL), s. 32, 33"},"dss":{"t":"Dostarczaj, Obsługuj i Wspieraj (DSS)","eg":"Dostarczaj, Obsługuj i Wspieraj (DSS)","pd":"Dostarczanie, obsługa i wsparcie (DSS)","en":"Deliver, Service and Support (DSS)","wyj":"Szuflada zadań „codzienna praca”: żeby systemy chodziły, awarie były usuwane, a dane bezpieczne.\n\nDSS to domena Zarządzania odpowiadająca obszarowi Wykonuj (Run) w cyklu Planuj, Twórz, Wykonuj, Monitoruj. Ma 6 procesów: eksploatacja (DSS01), zgłoszenia serwisowe i incydenty (DSS02), problemy (DSS03), ciągłość (DSS04), usługi bezpieczeństwa (DSS05) i mechanizmy kontrolne procesów biznesowych (DSS06). Przejmuje od BAI gotowe rozwiązania i utrzymuje je w codziennym działaniu.\n\nŻeby usługi IT działały dziś i jutro: były dostarczane, obsługiwane, naprawiane i chronione zgodnie z tym, co zaplanowano i wdrożono.","zycie":"W poniedziałek rano pada router, więc go restartujesz i dzwonisz do operatora (incydent). Gdy pada trzeci raz w miesiącu, szukasz przyczyny i wymieniasz zasilacz (problem). Zapasowy klucz leży u sąsiada, a zdjęcia mają kopię na dysku (ciągłość). Codzienne utrzymanie, żeby dom działał, to DSS.","firma":"W sobotę rano w piekarni przestaje działać terminal płatniczy. Sprzedawczyni zgłasza awarię, serwis przywraca terminal w godzinę, a do tego czasu klienci płacą gotówką według spisanej instrukcji awaryjnej. Codzienna obsługa, usuwanie awarii i plan na czarną godzinę to DSS.","urzad":"Urzędniczka w starostwie nie może zalogować się do EZD i dzwoni do informatyka (zgłoszenie). Informatyk przywraca dostęp, w nocy system robi kopię zapasową, a raz w roku urząd ćwiczy, co robić, gdy padnie serwerownia. To codzienna praca IT w domenie DSS.","it":"W nocy system bankowości internetowej przestaje wysyłać SMS-y z kodami do klientów. Administrator przywraca wysyłkę według procedury obsługi incydentu (DSS02), a potem zespół szuka przyczyny i ustala, że bramka SMS miała błędną konfigurację po aktualizacji (DSS03 Zarządzanie problemami).","egz":"Odróżniaj APO13 (Zarządzanie bezpieczeństwem, czyli planowanie systemu bezpieczeństwa) od DSS05 (Zarządzanie usługami bezpieczeństwa, czyli codzienna ochrona). Ciągłość działania to DSS04. Egzamin: „Dostarczaj, Obsługuj i Wspieraj (DSS)”. Podręcznik: „Dostarczanie, obsługa i wsparcie (DSS)”. Nazwy procesów na egzaminie mogą brzmieć inaczej niż w podręczniku. Rozpoznawaj je po kodzie i angielskim słowie kluczowym.","src":"COBIT 5 Framework (PL), s. 33"},"ryzyko":{"t":"Ryzyko","eg":"Ryzyko","pd":"Ryzyko","en":"Risk","wyj":"Coś może pójść źle; liczy się, jak bardzo jest to prawdopodobne i jak bardzo zaboli.\n\nRyzyko (risk) to połączenie prawdopodobieństwa zdarzenia i jego konsekwencji. Dotyczy przyszłości. Dopowiedzenie kursu (interpretacja, nie definicja z s. 93): gdy zdarzenie już nastąpiło, mówimy raczej o problemie albo incydencie. Ład ustala apetyt na ryzyko (risk appetite), czyli ile ryzyka organizacja jest gotowa przyjąć (EDM03, Zapewnienie optymalizacji ryzyka), a Zarządzanie identyfikuje, ocenia i ogranicza ryzyka w tych granicach (APO12, Zarządzanie ryzykiem).\n\nŻeby z wyprzedzeniem widzieć, co może pójść źle i jak bardzo by zaszkodziło, i świadomie decydować, czemu zapobiegać, a co zaakceptować.","zycie":"Planujecie wesele w ogrodzie w lipcu. Deszcz jest dość prawdopodobny, a skutek byłby duży – goście mokną, tort się rozpływa – więc rezerwujecie namiot. Ryzyko to ta możliwość deszczu razem z jej skutkami; jeśli w dniu wesela leje, macie już problem, a nie ryzyko.","firma":"W biurze rachunkowym tylko pani Ewa umie obsługiwać program do płac. Jeśli zachoruje w ostatnim tygodniu miesiąca, pensje u klientów się spóźnią. Szef ocenia, że to mało prawdopodobne, ale bolesne, więc każe przeszkolić drugą osobę – tak wygląda praca z ryzykiem.","urzad":"Nabór wniosków o dopłaty do wymiany pieców w urzędzie gminy zamyka się w piątek o 15:00, a wszystko idzie przez jeden serwer. Awaria akurat w piątek jest mało prawdopodobna, ale skutek byłby fatalny, więc informatyk robi kopię i ma tego dnia dyżur. To ryzyko: możliwość zdarzenia plus jego skutki.","it":"W procesie APO12 (Zarządzanie ryzykiem) dział IT prowadzi rejestr ryzyk: np. „awaria serwerowni” ma ocenione prawdopodobieństwo i skutki. Dla ryzyk powyżej apetytu ustalonego przez Ład w EDM03 (Zapewnienie optymalizacji ryzyka) planuje się działania, np. zapasowe centrum danych.","egz":"Na egzaminie ryzyko pojawia się głównie jako „optymalizacja ryzyka” (cel Ładu) i „apetyt na ryzyko” (czynnik środowiskowy we wdrożeniu). Nie myl z: Issue / problem / incydent – Problem już zaistniał; ryzyko jest możliwością w przyszłości.; Zagrożenie – Zagrożenie to źródło (np. powódź); ryzyko łączy prawdopodobieństwo z konsekwencjami.","src":"COBIT 5 Framework (PL), s. 93"},"mea":{"t":"Monitoruj, Oszacuj i Oceń (MEA)","eg":"Monitoruj, Oszacuj i Oceń (MEA)","pd":"Monitorowanie, ocena i oszacowanie (MEA)","en":"Monitor, Evaluate and Assess (MEA)","wyj":"Szuflada zadań „kontrola”: sprawdzać wyniki, przestrzeganie przepisów i to, czy kontrole wewnętrzne działają.\n\nMEA (Monitor, Evaluate and Assess) to domena Zarządzania z trzema procesami. MEA01 monitoruje wydajność i zgodność (performance and conformance), MEA02 system kontroli wewnętrznej (system of internal control), a MEA03 zgodność z wymogami zewnętrznymi (external requirements), np. przepisami. Wyniki trafiają do Ładu, który w EDM monitoruje, czy organizacja trzyma się wyznaczonego kierunku.\n\nŻeby Zarządzanie wiedziało, jak naprawdę idzie: czy cele są osiągane, czy mechanizmy kontrolne działają i czy organizacja spełnia wymogi zewnętrzne, i mogło to rzetelnie zaraportować Ładowi.","zycie":"Pod koniec miesiąca siadasz z wyciągiem z konta: czy zmieściliście się w budżecie, czy zlecenie stałe na czynsz naprawdę się wykonało i czy żaden rachunek nie umknął. Raz w roku sprawdzasz jeszcze, czy PIT rozliczyłeś zgodnie z przepisami. Sprawdzanie wyników, własnych zabezpieczeń i zgodności z przepisami to w domowej skali domena MEA.","firma":"Właścicielka sklepu internetowego co kwartał patrzy na liczbę zwrotów i czas wysyłki (MEA01), sprawdza, czy pracownicy naprawdę robią kopie zapasowe tak, jak każe procedura (MEA02), i czy regulamin sklepu jest zgodny z nowymi przepisami konsumenckimi (MEA03). Te trzy rodzaje sprawdzania to trzy procesy domeny MEA.","urzad":"Sekretarz gminy co pół roku zbiera raport, ile spraw załatwiono w terminie (MEA01), zleca audytorowi wewnętrznemu sprawdzenie, czy kontrola zarządcza działa (MEA02), a informatyk przygotowuje urząd do kontroli zgodności z KRI (MEA03). Mierzenie wyników, sprawdzanie własnych mechanizmów kontrolnych i zgodności z przepisami – to domena MEA.","it":"W MEA03 (Monitorowanie, ocena i oszacowanie zgodności z wymogami zewnętrznymi) dział IT co pół roku sprawdza, czy przetwarzanie danych osobowych spełnia wymogi RODO, i raportuje wynik zarządowi. Zarząd w EDM monitoruje na tej podstawie, czy organizacja trzyma się kierunku.","egz":"MEA to Zarządzanie, nie Ład. „Monitoruj, Oszacuj i Oceń” (MEA) ≠ „Oszacuj, Kieruj i Monitoruj” (EDM). W przepływie: Oszacuj → Kieruj → Planuj → … → Monitoruj (MEA) → Monitoruj (EDM). Egzamin: „Monitoruj, Oszacuj i Oceń (MEA)”. Podręcznik: „Monitorowanie, ocena i oszacowanie (MEA)”. Nazwy procesów na egzaminie mogą brzmieć inaczej niż w podręczniku. Rozpoznawaj je po kodzie i angielskim słowie kluczowym.","src":"COBIT 5 Framework (PL), s. 33"},"bai":{"t":"Twórz, Nabywaj i Wdrażaj (BAI)","eg":"Twórz, Nabywaj i Wdrażaj (BAI)","pd":"Budowanie, nabywanie i wdrażanie (BAI)","en":"Build, Acquire and Implement (BAI)","wyj":"Szuflada zadań „budowa i zmiany”: kupić, zbudować, wdrożyć i bezpiecznie zmieniać systemy.\n\nBAI to domena Zarządzania odpowiadająca obszarowi Twórz (Build) w cyklu Planuj, Twórz, Wykonuj, Monitoruj. Ma 10 procesów: od programów i projektów (BAI01) przez wymagania, budowę rozwiązań, zmiany i ich akceptację po wiedzę, aktywa i konfigurację (BAI08–BAI10). Realizuje to, co zaplanowano w APO, i przekazuje gotowe rozwiązania do codziennej eksploatacji w DSS.\n\nŻeby nowe rozwiązania i zmiany w IT powstawały lub były kupowane zgodnie z wymaganiami i wchodziły do użytku w kontrolowany sposób, bez psucia tego, co już działa.","zycie":"Remontujecie kuchnię. Spisujecie, czego potrzebujecie, wybieracie ekipę, kupujecie szafki, montujecie, a na koniec sprawdzacie, czy wszystko działa, zanim zapłacicie ostatnią ratę. Instrukcje i gwarancje lądują w jednej teczce. Plan, zakup, montaż, odbiór i spis tego, co macie, to obszar BAI.","firma":"Piekarnia uruchamia sklep internetowy z dowozem. Właścicielka spisuje wymagania, wybiera gotową platformę, testuje zamówienia na rodzinie, szkoli sprzedawczynie i dopiero potem włącza sklep dla klientów. Budowa lub zakup i wdrożenie zmiany to domena BAI.","urzad":"Starostwo wdraża EZD. Najpierw spisuje wymagania i ogłasza przetarg, potem dostawca konfiguruje system, urzędnicy przechodzą szkolenia, a papierowy obieg jest wygaszany dopiero po odbiorze. Cały ten projekt zmiany mieści się w BAI.","it":"BAI06 Zarządzanie zmianami: administrator chce zaktualizować oprogramowanie serwera systemu CRM. Zmiana dostaje wniosek, ocenę skutków i zgodę, jest testowana w środowisku testowym, a po wdrożeniu nową wersję zapisuje się w bazie konfiguracji (BAI10 Zarządzanie konfiguracją).","egz":"Uwaga: BAI09 „Zarządzanie zasobami” to po angielsku Assets, czyli aktywa (sprzęt, licencje). To NIE jest optymalizacja zasobów (EDM04) ani zasoby ludzkie (APO07). Egzamin: „Twórz, Nabywaj i Wdrażaj (BAI)”. Podręcznik: „Budowanie, nabywanie i wdrażanie (BAI)”. Nazwy procesów na egzaminie mogą brzmieć inaczej niż w podręczniku. Rozpoznawaj je po kodzie i angielskim słowie kluczowym.","src":"COBIT 5 Framework (PL), s. 33"},"proces":{"t":"Proces","eg":"Proces","pd":"Proces","en":"Process","wyj":"Coś, co robimy regularnie i zawsze w podobny sposób, np. przyjmowanie każdego zgłoszenia.\n\nProces (process) przyjmuje wejścia (inputs), przetwarza je przez praktyki i działania ukierunkowane przez polityki i procedury i daje wyniki (outputs), np. produkt albo usługę. Ma właściciela, role i mierniki, a wynik jednego procesu bywa wejściem innego. W COBIT 5 procesy są jednym z siedmiu aktywatorów, a Referencyjny Model Procesu opisuje ich 37.\n\nŻeby powtarzalną pracę wykonywać za każdym razem tak samo dobrze, niezależnie od tego, kto ją akurat robi, i żeby dało się ją mierzyć i poprawiać.","zycie":"Co sobotę rano sprawdzasz lodówkę, piszesz listę, jedziesz do sklepu, rozpakowujesz i odhaczasz, czego zabrakło. Za tydzień wszystko powtarza się od nowa. To proces: stałe kroki, wejście (pusta lodówka i lista) i wynik (pełna lodówka).","firma":"W sklepie internetowym z herbatą przychodzi zamówienie, pracownik pakuje paczkę, drukuje etykietę i fakturę, a kurier odbiera paczki o 15:00. Tak samo dzieje się z każdym zamówieniem, codziennie. To proces – powtarzalny, z wejściem (zamówienie) i wynikiem (paczka u klienta).","urzad":"Do urzędu gminy wpływa wniosek o wycinkę drzewa. Kancelaria go rejestruje, kierownik przydziela go referentowi, ten jedzie na oględziny i wydaje decyzję. Każdy kolejny wniosek idzie tą samą ścieżką – to jest proces.","it":"DSS02 (Zarządzanie zgłoszeniami serwisowymi i incydentami) to proces: każde zgłoszenie (wejście) jest rejestrowane, klasyfikowane, rozwiązywane i zamykane (praktyki), a wynikiem jest przywrócona usługa i wpis w rejestrze. Działa codziennie i tak samo dla każdego zgłoszenia.","egz":"Opis „zbiór praktyk ukierunkowanych politykami i procedurami, który przetwarza wejścia w wyniki” to Proces (Załącznik H). Nie myl z: Projekt – Projekt jest jednorazowy, ma początek i koniec (np. wdrożenie systemu). Proces trwa i się powtarza (np. obsługa zgłoszeń w tym systemie).","src":"COBIT 5 Framework (PL), s. 93"},"apo":{"t":"Dostosuj, Planuj i Organizuj (APO)","eg":"Dostosuj, Planuj i Organizuj (APO)","pd":"Dopasowanie, planowanie i organizacja (APO)","en":"Align, Plan and Organise (APO)","wyj":"Szuflada zadań „planowanie”: ustalić, w co inwestujemy, jak się organizujemy i czego nam trzeba.\n\nAPO to pierwsza z czterech domen Zarządzania i odpowiada obszarowi Planuj w cyklu Planuj, Twórz, Wykonuj, Monitoruj (Plan, Build, Run, Monitor). Ma 13 procesów, od APO01 Zarządzanie metodyką zarządzania IT do APO13 Zarządzanie bezpieczeństwem. Obejmuje strategię, architekturę, innowacje, portfel, budżet, ludzi, relacje, umowy, dostawców, jakość, ryzyko i bezpieczeństwo.\n\nŻeby działania IT były zaplanowane, zorganizowane i dopasowane do kierunku wyznaczonego przez Ład, zanim cokolwiek się zbuduje lub uruchomi.","zycie":"W styczniu siadacie z partnerem i planujecie rok: ile odłożyć na wakacje, czy wymieniać auto, kto przejmuje opłaty, a kto szuka tańszego internetu. Zanim cokolwiek kupicie, wiecie, po co i za ile. To jest APO: planowanie i organizacja, zanim coś się zbuduje albo uruchomi.","firma":"Właściciel sklepu internetowego postanawia, że w tym roku zacznie sprzedawać do Czech. Liczy budżet na nową wersję sklepu, wybiera firmę kurierską, sprawdza, kto w zespole zna czeski, i zastanawia się, co będzie, jeśli padnie bramka płatności. Strategia, budżet, ludzie, dostawcy i ryzyko to właśnie obszar APO.","urzad":"Sekretarz starostwa przygotowuje plan cyfryzacji na trzy lata. Ustala, które e-usługi idą najpierw, ile pieniędzy zaplanować w budżecie, z kim podpisać umowę serwisową i jak chronić dane mieszkańców. To planowanie i organizowanie IT – domena APO.","it":"APO06 Zarządzanie budżetem i kosztami: CIO układa budżet IT firmy na rok, przypisuje koszty do usług (np. utrzymanie systemu ERP) i co kwartał porównuje plan z wykonaniem. Decyzja, ile w ogóle przeznaczyć na IT i na co postawić, należy do Ładu (EDM04 Zapewnienie optymalizacji zasobów).","egz":"Kategorie umiejętności zarządzanie portfelami projektów i architektura korporacyjna należą do domeny APO (Ilustracja 39). Egzamin: „Dostosuj, Planuj i Organizuj (APO)”. Podręcznik: „Dopasowanie, planowanie i organizacja (APO)”. Nazwy procesów na egzaminie mogą brzmieć inaczej niż w podręczniku. Rozpoznawaj je po kodzie i angielskim słowie kluczowym.","src":"COBIT 5 Framework (PL), s. 33"},"edm":{"t":"Oszacuj, Kieruj i Monitoruj (EDM)","eg":"Oszacuj, Kieruj i Monitoruj (EDM)","pd":"Ocena, kierowanie i monitorowanie (EDM)","en":"Evaluate, Direct and Monitor (EDM)","wyj":"Trzy obowiązki szefostwa: ocenić sytuację, wskazać kierunek i sprawdzać, czy idziemy w dobrą stronę.\n\nEDM to jedyna domena Ładu i ma 5 procesów (EDM01–EDM05). W każdym są praktyki Oszacuj (Evaluate), Kieruj (Direct) i Monitoruj (Monitor): organ Ładu ocenia potrzeby i możliwości, kieruje przez priorytety i decyzje, a potem monitoruje wyniki i zgodność względem wyznaczonego kierunku. EDM02–EDM04 odpowiadają trzem składnikom Celu Ładu: korzyściom, ryzyku i zasobom.\n\nŻeby organ Ładu miał uporządkowane procesy do oceny potrzeb, wyznaczania kierunku i sprawdzania, czy kierunek jest realizowany. Dzięki temu Ład jest oddzielony od codziennego Zarządzania.","zycie":"Raz na kwartał siadacie z partnerem przy kuchennym stole. Patrzycie, jak wygląda sytuacja w domu (Oszacuj), ustalacie, że w tym roku priorytetem jest remont, a nie nowe auto (Kieruj), i po trzech miesiącach sprawdzacie, czy remont idzie zgodnie z planem (Monitoruj). Sami nie kładziecie płytek – od tego jest ekipa. To jest EDM, czyli Ład.","firma":"Wspólnicy sklepu internetowego spotykają się raz na kwartał. Oceniają, czy sklep się opłaca i czy ryzyko wycieku danych jest pod kontrolą, postanawiają, że w tym roku stawiają na aplikację mobilną, a po trzech miesiącach sprawdzają, jak kierownik ją wdraża. Nie konfigurują serwerów – wyznaczają kierunek i go pilnują, czyli działają w domenie EDM.","urzad":"Rada gminy uchwala strategię cyfryzacji, a po roku słucha sprawozdania wójta i ocenia, czy pieniądze na e-usługi dały efekt. Radni nie wdrażają systemów – oceniają, kierują i monitorują. To jest rola EDM.","it":"EDM03 Zapewnienie optymalizacji ryzyka: zarząd banku ocenia ryzyko przestoju bankowości internetowej, ustala, że przestój nie może przekroczyć 4 godzin w roku, i co kwartał sprawdza raport CIO. Codzienne rozpoznawanie i analizę ryzyka prowadzi Zarządzanie w APO12 Zarządzanie ryzykiem.","egz":"„Oszacuj, Kieruj i Monitoruj” to praktyki każdego procesu Ładu, a nie komponent Podejścia do Ładu. EDM05 bywa nazywany „Zapewnienie Transparentności Interesariuszy”. Egzamin: „Oszacuj, Kieruj i Monitoruj”. Podręcznik: „Ocena, kierowanie i monitorowanie”. Nie myl z MEA: „Monitoruj, Oszacuj i Oceń”. Nie myl z: Monitoruj, Oszacuj i Oceń (MEA) – MEA to domena ZARZĄDZANIA (monitorowanie wydajności, kontroli wewnętrznej i zgodności). EDM to domena ŁADU.","src":"COBIT 5 Framework (PL), s. 32, 33"},"it-hardware":{"t":"Sprzęt komputerowy","eg":"Sprzęt komputerowy","pd":"sprzęt","en":"Hardware","wyj":"Wszystkie części komputera, które można dotknąć: obudowa, ekran, klawiatura, myszka.\n\nKlawiatura i myszka przekazują Twoje polecenia. Procesor wykonuje je według programu. Wynik pojawia się na ekranie albo wychodzi z drukarki. Dysk przechowuje to, co zapiszesz.\n\nŻeby było na czym wykonywać pracę: liczyć, zapisywać, wyświetlać i drukować. Bez sprzętu żaden program nie ma gdzie działać.","zycie":"Telefon w Twojej dłoni: ekran, przyciski, bateria i aparat to sprzęt. Gdy upuścisz telefon i pęknie ekran, uszkodziłeś sprzęt – zdjęcia w środku mogą być całe.","firma":"Firma kurierska kupuje kierowcom 200 skanerów do paczek i 20 drukarek etykiet. To wydatek na sprzęt, osobny od opłaty za program do śledzenia przesyłek.","urzad":"Urząd miasta kupuje 50 nowych komputerów i 10 drukarek. W budżecie to pozycja „sprzęt komputerowy”, osobna od opłat za programy.","it":"W COBIT 5 sprzęt należy do infrastruktury technicznej w aktywatorze Usługi, infrastruktura i aplikacje (FW-PL s. 86).","egz":"Słowo „hardware” nie jest terminem egzaminu COBIT 5. Przyda się przy aktywatorze Usługi, infrastruktura i aplikacje: sprzęt jest tam częścią infrastruktury technicznej (FW-PL s. 86). Nie myl z: Oprogramowanie – Sprzęt można dotknąć. Oprogramowanie to polecenia zapisane w sprzęcie – nie da się ich dotknąć.; Infrastruktura IT – Infrastruktura to szersze pojęcie: sprzęt, sieć i oprogramowanie systemowe razem, cała „podstawa” informatyki organizacji.","src":"COBIT 5 Framework (PL), s. 86"}},"S":[{"pt":"Lekcje 1.46–1.47","h":"Referencyjny Model Procesu: 37 procesów = 5 Ładu + 32 Zarządzania","b":"<ul><li><w k=\"prm\">Referencyjny Model Procesu<\/w> <span class=\"en\"><w k=\"proces\">Process<\/w> Reference Model<\/span> – wzorcowa lista procesów IT<\/li><li><b>wzorzec, nie przepis<\/b>: układ dowolny, cele obowiązkowe<\/li><li>następca COBIT 4.1, łączy <w k=\"ryzyko\">Risk<\/w> IT i Val IT<\/li><\/ul>","c":"Model daje kompletny wzorzec i wspólny język, ale organizacja może układać procesy po swojemu, byle pokryła wszystkie konieczne cele.","s":"COBIT 5 Framework (PL), s. 32–33, Ilustracja 16","ctx":"<p>Podręcznik: COBIT 5 „nie ma charakteru normatywnego”. Przedsiębiorstwo organizuje procesy, jak uznaje za stosowne, „o ile obejmują one wszystkie konieczne cele w zakresie nadzoru i zarządzania”. Model jest kompletny, ale „nie jest to jedyny możliwy model procesów”. Daje wspólny język dla IT, biznesu, audytu i dostawców.<\/p><p>Pułapki egzaminacyjne: „organizacja musi wdrożyć wszystkie 37 procesów” – fałsz; „może pominąć dowolny cel” – też fałsz. Pochodzenie: następca modelu procesów COBIT 4.1, łączy modele procesów Risk IT (ryzyko) i Val IT (wartość) – obie ramy wydała ISACA. Pełna lista to Ilustracja 16 (na egzaminie Rysunek 16).<\/p><p>Przykład: biuro rachunkowe z 20 osobami łączy kilka procesów w jeden, a duży bank dzieli jeden proces między kilka zespołów. Oba podejścia są zgodne z COBIT 5.<\/p>"},{"pt":"Sprawdź się","quiz":{"tresc":"Ile procesów ma Referencyjny Model Procesu COBIT 5 (<em>Process Reference Model<\/em>) i jak się dzielą?","opcje":[{"t":"37: 5 procesów Ładu i 32 procesy Zarządzania","ok":true,"w":"Dobrze. Ilustracja 16 pokazuje 37 procesów: EDM ma 5, a APO, BAI, DSS i MEA razem 32."},{"t":"32: po 8 procesów w każdej z czterech domen","w":"Domeny mają różną liczbę procesów, a do 32 dochodzi 5 procesów Ładu."},{"t":"34: tyle samo, ile miał model COBIT 4.1","w":"Model COBIT 5 ma 37 procesów."},{"t":"37: 32 procesy Ładu i 5 procesów Zarządzania","w":"Liczby są zamienione. Ład ma 5 procesów, a Zarządzanie 32."}],"src":"COBIT 5 Framework (PL), s. 32; COBIT 5 Framework (PL), s. 33","pomoc":{"t":"Pytanie dotyczy lekcji 1.46 „Referencyjny Model Procesu – 37 procesów”. Cel lekcji: Potrafię powiedzieć, ile procesów ma Referencyjny Model Procesu i jak dzielą się między Ład a Zarządzanie.","k":["prm"]}}},{"pt":"Sprawdź się","quiz":{"tresc":"Które zdanie o Referencyjnym Modelu Procesu COBIT 5 jest <b>prawdziwe<\/b>?","opcje":[{"t":"Jest normą, według której organizacja uzyskuje certyfikat","w":"Model nie jest normą. Podręcznik mówi wprost o braku charakteru normatywnego."},{"t":"Nie jest normatywny ani jedynym możliwym modelem","ok":true,"w":"Dobrze. FW-PL s. 32: metodyka nie ma charakteru normatywnego, a model nie jest jedynym możliwym modelem procesów."},{"t":"Jest jedynym modelem procesów zgodnym z COBIT 5","w":"Fałsz. Model jest kompletny, ale nie jest jedynym możliwym."},{"t":"Pozwala pominąć cele procesów, których firma nie chce","w":"Swoboda dotyczy układu procesów, a nie pomijania koniecznych celów."}],"src":"COBIT 5 Framework (PL), s. 32","pomoc":{"t":"Pytanie dotyczy lekcji 1.47 „Model procesów to wzorzec, a nie przepis”. Cel lekcji: Potrafię wyjaśnić, dlaczego Referencyjny Model Procesu nie jest normatywny i czego mimo to wymaga od organizacji.","k":[]}}},{"pt":"Lekcje 1.48–1.49","h":"Jedna domena Ładu i cztery domeny Zarządzania","b":"<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>domena (egzamin PL)<\/th><th>procesy<\/th><\/tr><tr><td><w k=\"edm\">EDM<\/w> Oszacuj, Kieruj i Monitoruj<\/td><td>5<\/td><\/tr><tr><td><w k=\"apo\">APO<\/w> Dostosuj, Planuj i Organizuj<\/td><td>13<\/td><\/tr><tr><td><w k=\"bai\">BAI<\/w> Twórz, Nabywaj i Wdrażaj<\/td><td>10<\/td><\/tr><tr><td><w k=\"dss\">DSS<\/w> Dostarczaj, Obsługuj i Wspieraj<\/td><td>6<\/td><\/tr><tr><td><w k=\"mea\">MEA<\/w> Monitoruj, Oszacuj i Oceń<\/td><td>3<\/td><\/tr><\/table><\/div>","c":"Zapamiętaj 5 + 13 + 10 + 6 + 3 = 37 i to, że MEA należy do Zarządzania.","s":"COBIT 5 Framework (PL), s. 32–33, Ilustracja 16","ctx":"<p>Angielskie nazwy: <span class=\"en\">Evaluate, Direct and Monitor<\/span>; <span class=\"en\">Align, Plan and Organise<\/span>; <span class=\"en\">Build, Acquire and Implement<\/span>; <span class=\"en\">Deliver, Service and Support<\/span>; <span class=\"en\">Monitor, Evaluate and Assess<\/span>. Podręcznik używa rzeczowników („Dopasowanie, planowanie i organizacja”, „Budowanie, nabywanie i wdrażanie”, „Monitorowanie, ocena i oszacowanie”) – to tylko pułapka, na egzaminie tryb rozkazujący.<\/p><p>Pułapka: EDM i MEA mają oba „Oszacuj” i „Monitoruj”, ale EDM zaczyna się od „Oszacuj” i jest Ładem, a MEA ma je w środku i jest Zarządzaniem. W każdym procesie EDM są praktyki Oszacuj, Kieruj, Monitoruj – „Monitoruj” to praktyka, nie szósty proces Ładu.<\/p><p>Przykład: zarząd sklepu internetowego może zlecić prawie wszystko, ale nie oddaje pięciu spraw: zasad decydowania o IT, rozliczenia korzyści, granicy ryzyka, wystarczalności zasobów i rzetelnej informacji dla interesariuszy. To pięć procesów EDM.<\/p>"},{"pt":"Sprawdź się","quiz":{"tresc":"Ile procesów ma domena Ładu i jakie praktyki zdefiniowano w każdym z nich?","opcje":[{"t":"6 procesów: EDM01–EDM05 i osobny proces Monitoruj","w":"Monitoruj to praktyka w każdym procesie, a nie szósty proces."},{"t":"5 procesów; w każdym praktyki Planuj, Twórz, Wykonuj, Monitoruj","w":"To czynności Zarządzania (PBRM), a nie Ładu."},{"t":"5 procesów; w każdym praktyki Oszacuj, Kieruj i Monitoruj","ok":true,"w":"Dobrze. FW-PL s. 32: pięć procesów, w każdym praktyki oceny, kierowania i monitorowania."},{"t":"3 procesy: Oszacuj, Kieruj i Monitoruj","w":"Oszacuj, Kieruj i Monitoruj to praktyki, a nie procesy."}],"src":"COBIT 5 Framework (PL), s. 32; COBIT 5 Framework (PL), s. 33","pomoc":{"t":"Pytanie dotyczy lekcji 1.48 „Pięć procesów Ładu – EDM01–EDM05 w skrócie”. Cel lekcji: Potrafię wymienić pięć procesów domeny Ładu po kodzie i słowie-kluczu.","k":[]}}},{"pt":"Sprawdź się","quiz":{"tresc":"Ile procesów mają domeny Zarządzania w Referencyjnym Modelu Procesu?","opcje":[{"t":"APO 10, BAI 13, DSS 6, MEA 3","w":"Liczby APO i BAI są zamienione."},{"t":"APO 13, BAI 10, DSS 5, MEA 4","w":"DSS ma 6 procesów, a MEA 3."},{"t":"Po 8 procesów w każdej domenie","w":"Domeny mają różną liczbę procesów."},{"t":"APO 13, BAI 10, DSS 6, MEA 3","ok":true,"w":"Dobrze. Razem 32 procesy (Ilustracja 16)."}],"src":"COBIT 5 Framework (PL), s. 33","pomoc":{"t":"Pytanie dotyczy lekcji 1.49 „Cztery domeny Zarządzania – 32 procesy”. Cel lekcji: Potrafię wymienić cztery domeny Zarządzania z egzaminacyjną nazwą i liczbą procesów.","k":[]}}},{"pt":"Lekcje 1.50–1.51","h":"Proces trafia do domeny według głównego obszaru pracy","b":"<ul><li>planujemy, organizujemy → <b>APO<\/b><\/li><li>coś powstaje lub się zmienia → <b>BAI<\/b><\/li><li>coś działa na co dzień → <b>DSS<\/b><\/li><li>sprawdzamy i oceniamy → <b>MEA<\/b><\/li><\/ul>","c":"Przy pytaniu o proces najpierw ustal etap pracy – to wskaże domenę.","s":"COBIT 5 Framework (PL), s. 33","ctx":"<p>Prawie każdy proces trochę planuje, wdraża, działa i mierzy, ale podręcznik umieszcza go w domenie „odpowiadającej zasadniczo najwłaściwszemu obszarowi działania”. Dlatego bezpieczeństwo jest w dwóch miejscach: plan w APO13, codzienna ochrona w DSS05. Domeny nie działają jedna po drugiej – wszystkie procesy biegną równolegle.<\/p><p>Pary do odróżnienia: APO05 portfel (wybór inwestycji) ≠ BAI01 (prowadzenie projektu); BAI05 zmiana organizacyjna (ludzie) ≠ BAI06 zmiany (systemy); DSS02 incydent (przywróć teraz) ≠ DSS03 problem (usuń przyczynę); DSS04 ciągłość (katastrofa) ≠ BAI04 pojemność (szczyt ruchu); MEA (Zarządzanie mierzy pracę) ≠ EDM (Ład sprawdza kierunek).<\/p><p>Przykład ze sklepu internetowego: strategia IT i wybór dostawców – APO; nowa bramka płatności – BAI; codzienna obsługa i helpdesk – DSS; raport zgodności z przepisami o ochronie danych – MEA (przypisanie to interpretacja kursu).<\/p>"},{"pt":"Sprawdź się","quiz":{"tresc":"Który proces należy do domeny APO (<em>Align, Plan and Organise<\/em>)?","opcje":[{"t":"Zarządzanie dostawcami","ok":true,"w":"Dobrze. To APO10 (Ilustracja 16)."},{"t":"Zarządzanie problemami","w":"To DSS03, w domenie Dostarczaj, Obsługuj i Wspieraj."},{"t":"Zarządzanie konfiguracją","w":"To BAI10, w domenie Twórz, Nabywaj i Wdrażaj."},{"t":"Zarządzanie wiedzą","w":"To BAI08, w domenie Twórz, Nabywaj i Wdrażaj."}],"src":"COBIT 5 Framework (PL), s. 33","pomoc":{"t":"Pytanie dotyczy lekcji 1.50 „APO i BAI – planowanie oraz budowanie zmian”. Cel lekcji: Potrafię rozpoznać, czy zadanie należy do domeny APO, czy BAI, i podać przykładowe procesy każdej z nich.","k":["apo","bai"]}}},{"pt":"Sprawdź się","quiz":{"tresc":"Centrum danych banku traci zasilanie. Bank przełącza usługi do zapasowego ośrodka i działa dalej. Który to proces?","opcje":[{"t":"BAI04 Zarządzanie dostępnością i pojemnością","w":"BAI04 planuje, czy system udźwignie obciążenie. Nie dotyczy pracy po katastrofie."},{"t":"DSS04 Zarządzanie ciągłością","ok":true,"w":"Dobrze. Ciągłość to utrzymanie działania mimo poważnej awarii."},{"t":"DSS02 Zarządzanie zgłoszeniami serwisowymi i incydentami","w":"Pojedynczy incydent to za mało. Przełączenie całego ośrodka to ciągłość działania."},{"t":"MEA01 Monitorowanie wydajności i zgodności","w":"MEA01 mierzy i raportuje, a nie przełącza usługi."}],"src":"COBIT 5 Framework (PL), s. 33","pomoc":{"t":"Pytanie dotyczy lekcji 1.51 „DSS i MEA – codzienne działanie oraz monitorowanie”. Cel lekcji: Potrafię rozpoznać, czy zadanie należy do domeny DSS, czy MEA, i podać ich procesy.","k":["dss","mea"]}}},{"pt":"Lekcja 1.52","h":"Podobne polskie nazwy rozróżniaj po angielskim słowie","b":"<div class=\"tblwrap\"><table class=\"tbl\"><tr><td>EDM04 <span class=\"en\"><w k=\"zasob\">Resource<\/w><\/span><\/td><td>APO07 <span class=\"en\">Human Resources<\/span><\/td><td>BAI09 <span class=\"en\">Assets<\/span><\/td><\/tr><tr><td>wszystkie zasoby (Ład)<\/td><td>ludzie<\/td><td><w k=\"it-hardware\">sprzęt<\/w>, licencje<\/td><\/tr><tr><td>APO13 plan bezpieczeństwa<\/td><td>DSS05 codzienna ochrona<\/td><td>MEA02 ocena kontroli<\/td><\/tr><\/table><\/div>","c":"Słowo „zasoby” czy „bezpieczeństwo” nie wskazuje procesu – wskazuje go domena i angielski oryginał.","s":"COBIT 5 Framework (PL), s. 33, Ilustracja 16","ctx":"<p>Trzy pytania kontrolne: (1) Ład czy Zarządzanie – kierunek i granice to EDM, praca to APO, BAI, DSS, MEA; (2) który etap – plan, budowa, codzienne działanie czy sprawdzanie; (3) jakie słowo angielskie – <span class=\"en\">Resource<\/span>, <span class=\"en\">Human Resources<\/span>, <span class=\"en\">Assets<\/span>.<\/p><p>Najbardziej myląca jest podręcznikowa nazwa BAI09 „Zarządzanie zasobami” – chodzi o aktywa, nie o wszystkie zasoby. Kontrola też występuje dwa razy: DSS06 stosuje mechanizmy kontrolne w codziennej pracy, a MEA02 sprawdza, czy działają.<\/p><p>Przykład: sklep przed świętami sprawdza, czy serwery udźwigną trzy razy większy ruch – BAI04, nie DSS04. Zalane centrum danych i praca z zapasowego – DSS04. Plan bezpieczeństwa informacji na trzy lata – APO13; codzienna aktualizacja ochrony antywirusowej – DSS05.<\/p>"},{"pt":"Sprawdź się","quiz":{"tresc":"Który proces odpowiada za codzienną ochronę systemów, np. aktualizację ochrony antywirusowej?","opcje":[{"t":"EDM03 Zapewnienie optymalizacji ryzyka","w":"EDM03 to Ład: granica ryzyka, a nie praca operacyjna."},{"t":"APO13 Zarządzanie bezpieczeństwem","w":"APO13 planuje system zarządzania bezpieczeństwem. Codzienna ochrona to DSS05."},{"t":"DSS05 Zarządzanie usługami bezpieczeństwa","ok":true,"w":"Dobrze. DSS05 to codzienna ochrona w domenie Dostarczaj, Obsługuj i Wspieraj."},{"t":"MEA02 – monitorowanie systemu kontroli wewnętrznej","w":"MEA02 ocenia, czy kontrole działają. Nie prowadzi codziennej ochrony."}],"src":"COBIT 5 Framework (PL), s. 33","pomoc":{"t":"Pytanie dotyczy lekcji 1.52 „Procesy o podobnych nazwach – jak ich nie pomylić”. Cel lekcji: Potrafię rozróżnić procesy o podobnych nazwach (zasoby, bezpieczeństwo, kontrola) po tym, czego dotyczą.","k":[]}}}]};</script>
