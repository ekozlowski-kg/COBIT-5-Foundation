<script>window.DECK={"id":"01-rozdzial-1","rozdzial":"Rozdział 1 · Przegląd metodyki COBIT 5 · s. 15–16","tytul":"Dlaczego powstał COBIT 5","prev":"k-pr-zasady.html","next":"k-m0-standardy.html","T":{"wyzr":{"t":"Wyznaczniki rozwoju COBIT 5","eg":"niepotwierdzona – na egzaminie opisowo: „powody / czynniki powstania COBIT 5” (ang. drivers)","pd":"najważniejsze wyznaczniki rozwoju metodyki COBIT 5","en":"Key drivers for the development of COBIT 5","wyj":"To lista powodów, dla których ISACA w 2012 roku wydała nową wersję COBIT, zamiast dalej poprawiać COBIT 4.1. Rozdział 1 podręcznika podaje je jako „konieczności”: dać interesariuszom więcej wpływu, uwzględnić zależność od dostawców, poradzić sobie z ogromem informacji, wpleść IT w całą działalność, wesprzeć innowacje, objąć pełną odpowiedzialność biznesu i IT, opanować IT „robione” przez samych użytkowników, zapewnić wartość i zgodność, dopasować się do innych standardów i połączyć metodyki ISACA.\n\nKażdy z tych powodów ma swoją „odpowiedź” w dalszej części metodyki. Interesariusze – zasada 1 i kaskada celów; dostawcy i pełna odpowiedzialność – zasada 2 (pokrycie całej organizacji); wiele standardów – zasada 3 (jedna zintegrowana struktura ramowa); struktury, polityki, kultura, informacja – zasada 4 (aktywatory).\n\nDlatego warto traktować tę listę nie jako coś do wykucia, ale jako mapę: jaki problem świata IT rozwiązuje który element COBIT 5.","zycie":"Masz stary samochód, który wciąż jeździ, ale rodzina się powiększyła, do pracy dojeżdżasz 60 km, a w mieście wprowadzono strefę czystego transportu. Auto się nie zepsuło – po prostu świat wokół się zmienił. Lista tych zmian to Twoje „wyznaczniki” zakupu nowego auta.","firma":"Bank w 2008 roku miał serwerownię w piwnicy i oddział w każdym mieście. Kilka lat później połowa klientów loguje się tylko przez aplikację, karty obsługuje zewnętrzny operator płatności, a dane analityczne leżą w chmurze. Dawne zasady pisane „dla działu IT” nie obejmowały dostawców ani decyzji biznesu o technologii – właśnie takie zmiany opisuje lista wyznaczników.","urzad":"Gmina, która kiedyś miała jeden program do podatków na komputerze w referacie, dziś przyjmuje wnioski przez ePUAP (elektroniczną Platformę Usług Administracji Publicznej), płatności przez bramkę operatora, a stronę BIP (Biuletynu Informacji Publicznej) utrzymuje zewnętrzna firma. Wójt, skarbnik i mieszkańcy mają przy tym różne oczekiwania. Takie zmiany – w skali całego świata – skłoniły ISACA do napisania COBIT 5 od nowa.","egz":"Nie myl z „wyznacznikami” w kaskadzie celów (stakeholder drivers – zmiany strategii, otoczenia i technologii, które wpływają na potrzeby interesariuszy, zasada 1). Tu chodzi o powody powstania samej metodyki. Typowe złe odpowiedzi: „COBIT 5 powstał, żeby zastąpić ITIL i normy ISO” – nieprawda: miał się z nimi łączyć i być nad nimi nadrzędną strukturą ramową.","src":"FW-PL s. 15; rok wydania COBIT 5 (2012) – wiedza ogólna"},"isaca":{"t":"ISACA","eg":"ISACA","pd":"ISACA","en":"ISACA (dawniej Information Systems Audit and Control Association – Stowarzyszenie ds. Audytu i Kontroli Systemów Informatycznych)","wyj":"ISACA to międzynarodowe stowarzyszenie non-profit założone w 1969 roku, które skupia specjalistów od audytu IT, bezpieczeństwa informacji, ryzyka i ładu IT – według podręcznika ok. 95 tysięcy członków w 160 krajach. Pierwotnie nazwa była skrótem od Information Systems Audit and Control Association; dziś organizacja używa już tylko skrótu.\n\nISACA jest autorem i właścicielem COBIT – od pierwszej wersji z 1996 roku (wtedy głównie narzędzia audytorów) po COBIT 5, który objął Ład i Zarządzanie IT w całej organizacji. Wydaje też certyfikaty CISA (audytor systemów informatycznych), CISM (kierownik bezpieczeństwa informacji), CGEIT (Certified in the Governance of Enterprise IT – ład IT w organizacji) i CRISC (ryzyko i kontrola systemów informatycznych); ich korpus wiedzy w dużej części trafił do COBIT 5.\n\nWażne na egzamin: ISACA nie jest autorem ITIL, TOGAF, PRINCE2, PMBOK, COSO ani norm ISO – to standardy innych organizacji, z którymi COBIT 5 jest tylko dopasowany.","zycie":"ISACA dla specjalistów IT jest trochę jak izba lekarska, która wydaje standardy postępowania: sama nie leczy pacjentów, ale pisze zasady, szkoli i sprawdza wiedzę. Kto ma jej certyfikat, ten zdał egzamin i potwierdził doświadczenie zawodowe.","firma":"Audytor wewnętrzny banku ma certyfikat CISA i sprawdza, czy kontrole w systemie kredytowym działają. Kierownik bezpieczeństwa sklepu internetowego ma CISM, a dyrektor ryzyka ubezpieczyciela – CRISC. Wszyscy trzej korzystają z publikacji ISACA, w tym z COBIT 5.","urzad":"Audytor wewnętrzny w ministerstwie planuje audyt systemu obsługi dotacji i sięga po COBIT 5 jako listę procesów IT do sprawdzenia. Informatyk starostwa zdaje CISA, żeby lepiej rozmawiać z audytorami i osobami odpowiedzialnymi za kontrolę zarządczą.","egz":"COBIT 5 łączy „ponad 15 lat” doświadczeń użytkowników COBIT z różnych środowisk: biznesu, IT, ryzyka, bezpieczeństwa i audytu. Pułapka: „ISACA opracowała ITIL” – fałsz. Druga pułapka: dystraktory z COBIT 2019 (np. czynniki projektowe, cele ładu i zarządzania) – to późniejsza wersja ISACA, nie COBIT 5.","src":"FW-PL s. 2, 15, 60; rok pierwszego COBIT (1996) i rozwinięcie nazwy – wiedza ogólna"},"inter":{"t":"Interesariusze","eg":"Interesariusze","pd":"Interesariusze","en":"Stakeholders","wyj":"Interesariusz to każdy, kogo obchodzi, jak organizacja korzysta z informacji i technologii – bo na tym zyskuje, traci albo za to odpowiada. Są interesariusze wewnętrzni (zarząd, kierownicy działów, pracownicy, dział IT, audyt wewnętrzny) i zewnętrzni (klienci, udziałowcy, regulatorzy, dostawcy, audytorzy zewnętrzni).\n\nPierwszy powód powstania COBIT 5: interesariusze chcą mieć więcej wpływu na to, czego oczekują od IT – jakich korzyści, przy jakim akceptowalnym poziomie ryzyka i za jaki koszt. Ich oczekiwania bywają sprzeczne: jedni chcą szybkiego zwrotu z inwestycji, inni zrównoważonego rozwoju; jedni akceptują wysokie ryzyko, inni nie. Do tego chcą przejrzystości – widzieć, jak działania są prowadzone i co dały.\n\nCOBIT 5 odpowiada na to zasadą 1 „Realizacja potrzeb interesariusza”: potrzeby przekłada się przez kaskadę celów na cele organizacji, cele związane z Informatyką i cele aktywatora, a Ład godzi sprzeczne oczekiwania.","zycie":"Wspólnota mieszkaniowa decyduje o remoncie windy. Pani z parteru nie chce płacić, bo nie korzysta; rodzina z 10. piętra chce najszybszej windy; zarządca chce rozwiązania bezpiecznego i z gwarancją. Wszyscy chcą też wiedzieć, na co poszły pieniądze – to ten sam problem sprzecznych oczekiwań i przejrzystości.","firma":"Sklep internetowy planuje nową platformę sprzedażową. Fundusz-udziałowiec chce zwrotu w rok, założyciel – stabilnego rozwoju przez 5 lat, dyrektor finansowy – kosztu poniżej 2 mln zł, a inspektor ochrony danych – zero kompromisów przy danych klientów. Każdy z nich chce co miesiąc raportu z postępów.","urzad":"Gmina wdraża e-usługę płatności podatku lokalnego. Mieszkańcy chcą płacić telefonem, skarbnik pilnuje budżetu, rada gminy pyta o efekty, a regionalna izba obrachunkowa – o zgodność z przepisami. Wójt musi pokazać wszystkim, co zrobiono i z jakim skutkiem.","egz":"Nazwa zasady 1 na egzaminie: „Realizacja potrzeb interesariusza” (podręcznik: „Spełnienie potrzeb interesariuszy”). Trzy elementy oczekiwań – korzyści, ryzyko, koszt – to później Cel Ładu: Tworzenie Wartości (realizacja korzyści, optymalizacja ryzyka, optymalizacja zasobów). Pułapka: „minimalizacja ryzyka” – w COBIT 5 zawsze „akceptowalny poziom” / „optymalizacja”.","src":"FW-PL s. 15, 17"},"outs":{"t":"Strony zewnętrzne","eg":"niepotwierdzona – zwykle „strony zewnętrzne” / „dostawcy zewnętrzni”","pd":"strony zewnętrzne","en":"External parties","wyj":"Strony zewnętrzne to firmy i osoby spoza organizacji, od których zależy jej sukces: podmioty świadczące outsourcing, dostawcy, konsultanci, klienci, dostawcy usług w chmurze i inni usługodawcy. Podręcznik podkreśla, że ta zależność dotyczy zarówno działalności biznesowej, jak i IT.\n\nKiedyś „IT organizacji” oznaczało własną serwerownię i własnych informatyków. Dziś kluczowe systemy działają w cudzym centrum danych, a helpdesk – w innym mieście. Gdyby metodyka obejmowała tylko to, co „u nas”, duża część ryzyka i kosztów leżałaby poza jej zasięgiem – dlatego to jeden z powodów powstania COBIT 5.\n\nOdpowiedzią jest zasada 2 („Pokrycie całej organizacji”): COBIT 5 uwzględnia wszystkie istotne wewnętrzne i zewnętrzne usługi IT oraz procesy biznesowe. Wykonanie można zlecić, ale odpowiedzialności za wynik – nie.","zycie":"Wynajmujesz ekipę do remontu łazienki, a płytki dowozi hurtownia. Jeśli płytki przyjadą złe, a ekipa położy je krzywo, to i tak Ty masz krzywą łazienkę. Trzeba więc ustalić wymagania, sprawdzać postępy i odebrać pracę – nawet jeśli fizycznie nic sam nie robisz.","firma":"Szpital przeniósł elektroniczną dokumentację medyczną do chmury dostawcy, a obsługę sieci zlecił firmie zewnętrznej. Gdy w nocy system przestaje działać, pacjenci czekają na izbie przyjęć – i to dyrekcja szpitala odpowiada przed pacjentami i NFZ (Narodowym Funduszem Zdrowia), nie dostawca. Dlatego szpital potrzebuje umowy z poziomami usług (SLA – Service Level Agreement), monitorowania jej wykonania i planu awaryjnego.","urzad":"Starostwo powiatowe prowadzi ewidencję gruntów i budynków w systemie dostawcy, serwis sprzętu zleciło lokalnej firmie, a stronę BIP utrzymuje zewnętrzny hosting. Starosta nadal odpowiada za dane mieszkańców i ciągłość usług, więc wymagania wobec dostawców muszą być w umowach i regularnie sprawdzane.","egz":"Typowa pułapka: „usługi zlecone na zewnątrz są poza zakresem COBIT 5” – fałsz. Podręcznik wymienia wśród stron zewnętrznych także klientów i dostawców usług w chmurze. Sama zależność to wyznacznik rozwoju (rozdział 1); rozwiązanie – zasada 2 i aktywatory, które obejmują „wszystkich i wszystko” wewnątrz organizacji i poza nią.","src":"FW-PL s. 15, 23"},"model":{"t":"Model informacji","eg":"niepotwierdzona – zwykle „model informacji”","pd":"model informacji","en":"Information model","wyj":"Organizacje gromadzą dziś ogromne ilości danych, ale do decyzji potrzeba tylko części z nich – tych istotnych i wiarygodnych. Podręcznik pyta wprost, jak wybrać informacje, które zapewnią skuteczne i wydajne podejmowanie decyzji biznesowych, i odpowiada, że może w tym pomóc efektywny model informacji.\n\nModel informacji to uporządkowany sposób opisywania informacji: kto ją tworzy i kto z niej korzysta (interesariusze), jaka ma być (jakość, aktualność, dostępność, bezpieczeństwo), jak żyje od pozyskania przez przechowywanie i wykorzystanie aż po zniszczenie (cykl życia) oraz jakie są dobre praktyki jej obsługi.\n\nW COBIT 5 informacja jest jednym z siedmiu aktywatorów (zasada 4), a model informacji to jej szczegółowy opis. Załącznik F porównuje go z kryteriami informacji z COBIT 4.1.","zycie":"W domowej skrzynce mailowej masz 20 tysięcy wiadomości, ale gdy trzeba znaleźć gwarancję pralki, liczy się tylko jedna. Jeśli ustalisz, które dokumenty zapisujesz w folderze „Gwarancje”, jak je nazywasz i kiedy usuwasz po wygaśnięciu – masz własny, mały model informacji.","firma":"Ubezpieczyciel ma dane o szkodach w trzech systemach i każdy raport pokazuje inną liczbę szkód po gradobiciu. Model informacji ustala, który system jest źródłem prawdy, kto odpowiada za poprawność danych, jak często są aktualizowane i jak długo przechowywane po zamknięciu szkody. Dopiero wtedy zarząd może oprzeć na tych liczbach decyzję o wysokości składek.","urzad":"Gmina ma dane mieszkańców w ewidencji ludności, systemie podatkowym i systemie opłat za odpady. Model informacji określa, który rejestr jest wiodący dla adresu, kto poprawia błędy, kto ma dostęp i kiedy dokumenty trafiają do archiwum zakładowego. Dzięki temu referat podatków i referat odpadów nie wysyłają decyzji pod różne adresy.","egz":"Informacja = jeden z 7 aktywatorów (zasada 4). Pułapka: model informacji ≠ „model zdolności procesu” (rozdział 8, ocena procesów) i ≠ „kryteria informacji” z COBIT 4.1 (Załącznik F je porównuje). W rozdziale 1 model informacji pojawia się przy powodzie „znacznie większa ilość informacji”.","src":"FW-PL s. 15, 16, 82–83"},"cio":{"t":"CIO – dyrektor ds. informatyki","eg":"niepotwierdzona – zwykle po prostu „CIO”","pd":"dyrektor ds. informatyki (CIO)","en":"Chief Information Officer (CIO)","wyj":"CIO to osoba kierująca informatyką w całej organizacji – w banku członek zarządu albo dyrektor departamentu, w urzędzie zwykle kierownik wydziału lub referatu informatyki. Tradycyjnie odpowiadał za to, żeby „systemy działały”.\n\nPodręcznik wskazuje, że rola CIO i całej funkcji IT ewoluuje. IT musi być częścią projektów biznesowych, struktur, zarządzania ryzykiem, polityk i umiejętności, a coraz więcej osób z biznesu ma kompetencje informatyczne i współdecyduje o IT. Oddzielenie IT od biznesu – nawet przy dobrym „dopasowaniu” – przestało być optymalne.\n\nDlatego COBIT 5 nie jest podręcznikiem tylko dla CIO: Ład należy do organu Ładu (np. zarządu lub rady), a odpowiedzialność za IT dzielą biznes i informatyka – widać to w tabelach RACI procesów.","zycie":"Kiedyś w rodzinie jedna osoba „znała się na komputerach” i o wszystkim decydowała. Dziś każdy ma smartfon, sam instaluje aplikacje i płaci telefonem – „rodzinny informatyk” bardziej doradza i pilnuje bezpieczeństwa, niż sam wszystko robi.","firma":"W banku CIO siedzi przy stole zarządu, gdy zapada decyzja o nowej aplikacji mobilnej, bo bez niej bank nie zdobędzie młodych klientów. Dyrektor sprzedaży sam definiuje wymagania i zatwierdza priorytety, a CIO odpowiada za architekturę, bezpieczeństwo i dostawców.","urzad":"W starostwie kierownik informatyki współpracuje z wydziałem geodezji przy e-usługach dla geodetów, a decyzję o zakupie podejmuje starosta po rozmowie z naczelnikami wydziałów. Informatyk przestaje być „człowiekiem od drukarek” i staje się partnerem wydziałów merytorycznych.","egz":"„IT” w podręczniku = „Informatyka” na egzaminie (np. „cele związane z Informatyką”). Pułapka: „za Ład IT odpowiada CIO” – w COBIT 5 Ład należy do organu Ładu (zarząd, rada), a CIO działa głównie w Zarządzaniu. Wyznacznik z rozdziału 1: konieczna lepsza integracja funkcji biznesowej oraz IT.","src":"FW-PL s. 15, 23–24"},"user":{"t":"Rozwiązania IT tworzone przez użytkowników","eg":"niepotwierdzona – rozpoznaj po opisie (ang. user-initiated / user-controlled IT)","pd":"rozwiązania IT inicjowane i kontrolowane przez użytkowników","en":"User-initiated and user-controlled IT solutions","wyj":"To systemy i narzędzia, które pracownicy działów biznesowych sami zakładają, kupują lub budują – bez udziału działu IT: rozbudowane arkusze kalkulacyjne z makrami, aplikacje w chmurze kupione kartą służbową, bazy danych „na boku”. Zjawisko to często nazywa się „shadow IT” (IT w cieniu).\n\nPowstają, bo są szybkie i wygodne, a dział IT bywa zbyt wolny. Kłopot w tym, że nikt nie robi kopii zapasowych, nie kontroluje dostępu, nie sprawdza zgodności z przepisami o danych osobowych, a gdy autor arkusza odchodzi z pracy, wiedza znika razem z nim.\n\nCOBIT 5 nie zakazuje takich rozwiązań – jednym z powodów jego powstania była potrzeba uzyskania nad nimi większej kontroli. Pomagają w tym zasady i polityki, jasne role oraz objęcie Ładem całej organizacji, a nie tylko działu IT.","zycie":"Klub sportowy dzieci prowadzi listę wpłat w prywatnym arkuszu jednego z rodziców. Działa świetnie – do dnia, w którym ten rodzic przeprowadza się do innego miasta, nikt nie zna hasła, a połowa historii składek „znika”.","firma":"W sklepie internetowym dział marketingu sam wykupił narzędzie do newsletterów w chmurze i wgrał do niego 200 tysięcy adresów klientów. Dział IT i inspektor ochrony danych dowiadują się o tym dopiero po skardze klienta do organu ochrony danych osobowych. Teraz trzeba ustalić umowę powierzenia danych, właściciela narzędzia i zasady dostępu.","urzad":"Referat gospodarki odpadami w gminie prowadzi rejestr deklaracji w arkuszu na prywatnym dysku w chmurze jednej urzędniczki. Podczas kontroli okazuje się, że nie ma historii zmian, a kopii zapasowej nikt nie robił. Wójt wydaje zarządzenie: rejestry z danymi mieszkańców tylko w systemach zatwierdzonych przez informatyka.","egz":"Słowa klucze w pytaniu: „inicjowane i kontrolowane przez użytkowników”, „poza działem IT”. Odpowiedź COBIT 5: „większa kontrola” – nie „całkowity zakaz” i nie „przekazanie wszystkiego działowi IT”. Termin „shadow IT” nie występuje w podręczniku.","src":"FW-PL s. 15; „shadow IT” – wiedza ogólna"},"itil":{"t":"ITIL","eg":"ITIL","pd":"Information Technology Infrastructure Library (ITIL®)","en":"IT Infrastructure Library (ITIL)","wyj":"ITIL (Information Technology Infrastructure Library – dosłownie „biblioteka infrastruktury informatycznej”) to zbiór dobrych praktyk zarządzania usługami IT: jak prowadzić helpdesk, obsługiwać incydenty i problemy, wprowadzać zmiany, ustalać umowy o poziomie usług. Powstał na zlecenie rządu brytyjskiego; nie jest produktem ISACA.\n\nITIL mówi szczegółowo, JAK świadczyć usługi IT. COBIT 5 mówi szerzej, CO organizacja ma osiągać i jak to nadzorować – od Ładu po monitorowanie. Dlatego te podejścia się uzupełniają, a nie konkurują.\n\nWedług Załącznika E ITIL V3 2011 (razem z normą ISO/IEC 20000) obejmuje podzbiór procesów domeny DSS (Dostarczaj, Obsługuj i Wspieraj), podzbiór procesów BAI (Twórz, Nabywaj i Wdrażaj) oraz niektóre procesy APO (Dostosuj, Planuj i Organizuj). COBIT 5 może być nad ITIL nadrzędną strukturą ramową.","zycie":"COBIT 5 to jak regulamin i budżet domu: co ma działać, kto decyduje, ile wydajemy. ITIL to szczegółowa instrukcja hydraulika: jak przyjąć zgłoszenie o cieknącym kranie, jak go naprawić i jak zapisać, co zrobiono. Potrzebne są oba.","firma":"Ubezpieczyciel prowadzi obsługę zgłoszeń IT według ITIL: każdy incydent ma numer, priorytet i czas reakcji. COBIT 5 dodaje warstwę wyżej: zarząd ustala, jakie poziomy usług są potrzebne dla likwidacji szkód, a audyt wewnętrzny sprawdza, czy proces DSS02 (obsługa wniosków o usługi i incydentów) rzeczywiście działa.","urzad":"Ministerstwo ma helpdesk dla 2 tysięcy pracowników zorganizowany według ITIL. Dyrektor generalny chce jednak wiedzieć, czy IT wspiera cele ministerstwa i czy ryzyko jest pod kontrolą – tego ITIL nie obejmuje, a COBIT 5 tak.","egz":"Najczęstsze złe odpowiedzi: „COBIT 5 zastępuje ITIL” albo „ITIL jest jedną z metodyk ISACA zintegrowanych w COBIT 5”. Poprawnie: COBIT 5 jest z ITIL powiązany i dopasowany, może być ramą nadrzędną. Zintegrowane (połączone) zostały tylko metodyki ISACA: Val IT, Risk IT itd. Domeny ITIL w Załączniku E: DSS, BAI, część APO.","src":"FW-PL s. 15, 25, 60; pochodzenie ITIL – wiedza ogólna"},"togaf":{"t":"TOGAF","eg":"TOGAF","pd":"The Open Group Architecture Forum (TOGAF®) – tak w polskim podręczniku","en":"The Open Group Architecture Framework (TOGAF)","wyj":"TOGAF (The Open Group Architecture Framework – „struktura ramowa architektury konsorcjum The Open Group”) to metodyka architektury korporacyjnej: jak opisać i zaplanować, w jaki sposób procesy biznesowe, dane, aplikacje i technologia mają do siebie pasować teraz i w przyszłości.\n\nRdzeniem TOGAF jest cykl ADM (Architecture Development Method – metoda rozwoju architektury), czyli kolejne fazy od wizji architektury po plan wdrożenia. Załącznik E podręcznika COBIT 5 wskazuje, że fazy ADM odpowiadają praktykom procesu architektury korporacyjnej w domenie APO, a Rada ds. Architektury i nadzór nad architekturą – procesom zasobów w domenie EDM (optymalizacja zasobów).\n\nTOGAF nie jest produktem ISACA – COBIT 5 jest z nim dopasowany, a nie go zastępuje.","zycie":"Planujesz dom na lata: najpierw rysujesz, gdzie będą pokoje i instalacje i jak dobudujesz piętro, gdy urosną dzieci. Bez takiego planu każdy fachowiec robi „po swojemu”, a za 5 lat trzeba kuć ściany. TOGAF to taki plan dla systemów organizacji.","firma":"Bank po przejęciu innego banku ma dwa systemy kont, trzy aplikacje mobilne i dwa systemy obsługi klienta. Zespół architektury według TOGAF opisuje stan obecny, stan docelowy i plan przejścia w kilku etapach. COBIT 5 pilnuje, żeby ta praca była powiązana z celami banku i zasobami (proces APO03 Zarządzanie architekturą korporacyjną).","urzad":"Gmina chce połączyć system podatkowy, system opłat za odpady i e-usługi tak, żeby mieszkaniec podawał swoje dane tylko raz. Architekt opisuje według TOGAF, które dane i usługi mają być wspólne i w jakiej kolejności je wdrażać, a wójt zatwierdza plan w ramach budżetu na trzy lata.","egz":"Pułapka tłumaczenia: polski podręcznik rozwija TOGAF jako „Architecture Forum”, poprawnie jest „Architecture Framework”. Na egzaminie wystarczy rozpoznać TOGAF jako standard architektury korporacyjnej, z którym COBIT 5 jest dopasowany. Domeny w Załączniku E: EDM (zasoby) i APO (architektura korporacyjna).","src":"FW-PL s. 15, 61; rozwinięcie skrótu – wiedza ogólna"},"proj":{"t":"PMBOK i PRINCE2","eg":"PMBOK, PRINCE2","pd":"Project Management Body of Knowledge (PMBOK®), PRojects IN Controlled Environments 2 (PRINCE2®)","en":"Project Management Body of Knowledge (PMBOK); PRojects IN Controlled Environments 2 (PRINCE2)","wyj":"To dwa najpopularniejsze standardy zarządzania projektami. PMBOK (Project Management Body of Knowledge – „kompendium wiedzy o zarządzaniu projektami”) wydaje amerykański PMI (Project Management Institute); opisuje obszary wiedzy, takie jak zakres, harmonogram, koszt i ryzyko. PRINCE2 (PRojects IN Controlled Environments – „projekty w kontrolowanych środowiskach”) to brytyjska metodyka z jasnym podziałem ról (komitet sterujący, kierownik projektu) i etapami zarządczymi.\n\nCOBIT 5 nie uczy, jak prowadzić pojedynczy projekt krok po kroku – wymaga, żeby programy i projekty były zarządzane, powiązane z portfelem inwestycji i z celami organizacji. Szczegóły „jak” można brać z PMBOK lub PRINCE2.\n\nWedług Załącznika E PRINCE2 obejmuje procesy portfela w domenie APO oraz procesy zarządzania programami i projektami w domenie BAI. Na Ilustracji 25 PRINCE2 i PMBOK stoją razem przy APO i BAI.","zycie":"Organizujesz wesele: masz budżet, termin, listę zadań, podwykonawców i ryzyko deszczu. PMBOK albo PRINCE2 to sprawdzone „przepisy”, jak takie przedsięwzięcie poprowadzić, żeby się nie rozjechało.","firma":"Szpital wdraża nowy system rejestracji pacjentów jako projekt według PRINCE2: jest komitet sterujący z dyrektorem medycznym, kierownik projektu i przegląd na koniec każdego etapu. COBIT 5 dodaje pytanie wyżej: czy ten projekt jest w portfelu priorytetów szpitala i czy przyniesie zakładane korzyści.","urzad":"Gmina realizuje projekt unijny „e-urząd” prowadzony według PMBOK: harmonogram, rejestr ryzyk, budżet. Na poziomie COBIT 5 rada gminy i wójt patrzą na cały portfel projektów i decydują, które dają mieszkańcom najwięcej wartości.","egz":"Oba to standardy spoza ISACA – COBIT 5 jest z nimi dopasowany, nie zastępuje ich i ich nie „wchłonął”. Domeny: APO (portfel) i BAI (programy i projekty). Pułapka: „PRINCE2 odpowiada domenie DSS” – nie, DSS to głównie ITIL i ISO/IEC 20000.","src":"FW-PL s. 15, 61; wydawcy i tłumaczenia nazw – wiedza ogólna"},"coso":{"t":"COSO","eg":"COSO","pd":"metodyka opracowana przez Komitet Organizacji Sponsorujących Komisję Treadwaya (COSO)","en":"Committee of Sponsoring Organizations of the Treadway Commission (COSO)","wyj":"COSO (Committee of Sponsoring Organizations of the Treadway Commission – Komitet Organizacji Sponsorujących Komisję Treadwaya) to amerykańska inicjatywa kilku organizacji księgowych i audytorskich. Jej najbardziej znane produkty to model kontroli wewnętrznej (Internal Control – Integrated Framework) i model zarządzania ryzykiem w przedsiębiorstwie (ERM – Enterprise Risk Management).\n\nModel kontroli wewnętrznej COSO opisuje, jak organizacja zapewnia skuteczne działanie, wiarygodne sprawozdania i przestrzeganie prawa: przez środowisko kontroli, ocenę ryzyka, działania kontrolne, informację i komunikację oraz monitorowanie.\n\nCOBIT 5 wymienia COSO wśród metodyk, z którymi miał być powiązany i dopasowany. W praktyce COBIT często służy do „przełożenia” COSO na świat IT: opisuje kontrole i procesy informatyczne, które wspierają ogólny system kontroli wewnętrznej.","zycie":"W domu kontrolą wewnętrzną jest np. zasada, że dwie osoby sprawdzają rachunek przed dużym przelewem, a raz w miesiącu porównujecie wydatki z budżetem. COSO opisuje takie mechanizmy dla całych organizacji.","firma":"Bank notowany na giełdzie buduje system kontroli wewnętrznej według COSO, bo oczekują tego nadzór i biegły rewident. Kontrole IT – kto ma dostęp do systemu księgowego, jak zatwierdza się zmiany w oprogramowaniu – opisuje i ocenia według COBIT 5.","urzad":"W polskim sektorze publicznym obowiązuje kontrola zarządcza (ustawa o finansach publicznych), oparta na podobnych założeniach co COSO. Skarbnik gminy i audytor wewnętrzny oceniają ryzyka i kontrole, a część z nich dotyczy systemów IT – tu pomaga COBIT 5.","egz":"COSO nie jest metodyką ISACA, więc nie został „zintegrowany” w COBIT 5 – tylko „dopasowany”. Nie ma go na Ilustracji 25 (mapowanie na domeny). Pułapka: pomylenie COSO z normami ISO albo z Risk IT.","src":"FW-PL s. 15; opis COSO i kontroli zarządczej – wiedza ogólna"},"iso":{"t":"Normy ISO","eg":"normy ISO","pd":"normy ISO (Międzynarodowa Organizacja Normalizacyjna)","en":"International Organization for Standardization (ISO); International Electrotechnical Commission (IEC)","wyj":"ISO (International Organization for Standardization – Międzynarodowa Organizacja Normalizacyjna) wydaje normy międzynarodowe; normy informatyczne często powstają wspólnie z IEC (International Electrotechnical Commission – Międzynarodowa Komisja Elektrotechniczna), stąd zapis „ISO/IEC”. Normę można wdrożyć i często certyfikować – niezależny audytor potwierdza zgodność.\n\nNajważniejsze normy w kontekście COBIT 5: ISO/IEC 38500 – ład korporacyjny w obszarze IT (ocena, kierowanie, monitorowanie); seria ISO/IEC 27000 – bezpieczeństwo informacji; ISO 31000 (w podręczniku „ISO/IEC 31000”) – zarządzanie ryzykiem; ISO/IEC 20000 – zarządzanie usługami IT; ISO/IEC 15504 – ocena procesów, na której oparto ocenę zdolności procesu w COBIT 5.\n\nCOBIT 5 jest z tymi normami dopasowany i może być nad nimi nadrzędną strukturą ramową; Załącznik E pokazuje, którym domenom odpowiadają.","zycie":"Normy ISO to coś jak wspólne miary na całym świecie – dzięki nim karta płatnicza z jednego kraju działa w terminalu w innym. Certyfikat ISO mówi: „niezależny audytor sprawdził, że robimy to według uzgodnionego wzorca”.","firma":"Sklep internetowy ma certyfikat ISO/IEC 27001 dla systemu zarządzania bezpieczeństwem informacji, bo wymagają go duzi partnerzy handlowi. Zarząd używa COBIT 5, żeby widzieć bezpieczeństwo jako część całości: obok wartości, kosztów i ryzyka biznesowego.","urzad":"Ministerstwo wdraża system zarządzania bezpieczeństwem informacji na wzór ISO/IEC 27001, a ryzyko ocenia według ISO 31000. COBIT 5 porządkuje to w jedną ramę: Ład (EDM) wyznacza kierunek, a procesy APO, DSS i MEA wykonują i sprawdzają.","egz":"Kluczowe mapowanie: ISO/IEC 38500 ↔ EDM (Oszacuj, Kieruj i Monitoruj). ISO/IEC 27000 ↔ bezpieczeństwo i ryzyko w EDM, APO, DSS + monitorowanie w MEA. ISO 31000 ↔ ryzyko w EDM i APO. ISO/IEC 20000 ↔ jak ITIL (DSS, BAI, część APO). ISO/IEC 15504 ↔ ocena zdolności procesu. Pułapka: „COBIT 5 zastępuje normy ISO” – fałsz.","src":"FW-PL s. 15, 59–61; rozwinięcie IEC – wiedza ogólna"},"cmmi":{"t":"CMMI","eg":"CMMI","pd":"Capability Maturity Model Integration (CMMI) (rozwój)","en":"Capability Maturity Model Integration (CMMI) for Development","wyj":"CMMI (Capability Maturity Model Integration – „zintegrowany model dojrzałości zdolności”) to model doskonalenia procesów, opracowany w amerykańskim Software Engineering Institute przy Carnegie Mellon University. Wersja „for Development” (rozwój) dotyczy wytwarzania oprogramowania i produktów: wymagań, projektowania, testów, zarządzania jakością.\n\nZałącznik E wskazuje, że CMMI obejmuje procesy budowania aplikacji i nabywania w domenie BAI (Twórz, Nabywaj i Wdrażaj) oraz niektóre procesy organizacyjne i związane z jakością w domenie APO.\n\nNie myl CMMI z modelem dojrzałości z COBIT 4.1 ani z modelem zdolności procesu COBIT 5 – ten ostatni oparto na normie ISO/IEC 15504, nie na CMMI.","zycie":"CMMI przypomina system pasów w sztukach walki, tylko dla zespołów programistów: opisuje, czego trzeba się nauczyć i stale stosować, żeby przejść od „robimy, jak wyjdzie” do „robimy przewidywalnie i ciągle się poprawiamy”.","firma":"Software house, który pisze system polis dla ubezpieczyciela, ma ocenę CMMI na poziomie 3 – ubezpieczyciel postawił taki warunek w przetargu. Po stronie ubezpieczyciela współpracę obejmują procesy BAI (np. BAI03 – budowa rozwiązań) i APO10 Zarządzanie dostawcami.","urzad":"Ministerstwo zamawia budowę systemu obsługi wniosków i w specyfikacji wymaga od wykonawcy dojrzałych procesów wytwórczych, np. potwierdzonych oceną CMMI. Odbiór i wdrożenie systemu ministerstwo prowadzi już w swoich procesach BAI według COBIT 5.","egz":"CMMI na Ilustracji 25 (na egzaminie „Rysunek”) stoi przy APO i BAI. Pułapka: „model zdolności procesu COBIT 5 oparto na CMMI” – fałsz, oparto go na ISO/IEC 15504. W czasie wydania COBIT 5 CMMI nie był produktem ISACA (od 2016 r. CMMI Institute należy do ISACA – wiedza ogólna); dla egzaminu COBIT 5 to standard zewnętrzny, z którym COBIT 5 jest dopasowany (Załącznik E).","src":"FW-PL s. 59, 61; pochodzenie CMMI – wiedza ogólna"},"isacafw":{"t":"Struktury ramowe ISACA połączone w COBIT 5 (w podręczniku: metodyki)","eg":"Val IT, Risk IT, BMIS, ITAF, Board Briefing, TGF (nazwy własne bez tłumaczenia)","pd":"COBIT, Val IT, Risk IT, BMIS, ITAF, Board Briefing on IT Governance, Taking Governance Forward (TGF)","en":"COBIT, Val IT, Risk IT, Business Model for Information Security (BMIS), IT Assurance Framework (ITAF), Board Briefing on IT Governance, Taking Governance Forward (TGF)","wyj":"Przed COBIT 5 ISACA miała kilka osobnych publikacji, z których każda patrzyła na IT z innej strony: COBIT 4.1 – procesy i kontrole IT; Val IT – wartość z inwestycji w IT; Risk IT – ryzyko związane z IT; BMIS (Business Model for Information Security – model biznesowy bezpieczeństwa informacji); ITAF (IT Assurance Framework – struktura ramowa audytu i zapewnienia w IT); Board Briefing on IT Governance (informator o ładzie IT dla zarządów i rad); TGF (Taking Governance Forward – „rozwijanie ładu”, internetowy zasób o pojęciach ładu).\n\nKto chciał stosować je razem, musiał godzić różne słowniki i struktury. COBIT 5 połączył je w jedną strukturę ramową – podręcznik wymienia „w szczególności COBIT, Val IT oraz Risk IT”. To jest integracja: te publikacje stały się częścią COBIT 5.\n\nInaczej niż ITIL, TOGAF czy normy ISO – te należą do innych organizacji, więc COBIT 5 jest z nimi tylko dopasowany. TGF po włączeniu jego pojęć do COBIT 5 wycofano jako osobny zasób (przypis 4 na s. 23).","zycie":"Masz w kuchni pięć zeszytów z przepisami: od babci, z kursu, z gazety, od sąsiadki i własne notatki – każdy z innymi miarami („szklanka”, „gram”, „łyżka”). W końcu przepisujesz wszystko do jednej książki z jednolitymi miarami, a stare zeszyty chowasz do szuflady. Tak COBIT 5 zrobił z publikacjami ISACA.","firma":"Ubezpieczyciel używał COBIT 4.1 w audycie, Val IT przy ocenie inwestycji i Risk IT w dziale ryzyka – trzy zespoły, trzy słowniki, trzy różne listy. Po przejściu na COBIT 5 komitet inwestycyjny, dział ryzyka i audyt mówią tym samym językiem: korzyści, ryzyko, zasoby i te same procesy.","urzad":"Biuro audytu wewnętrznego ministerstwa miało w programach audytu odwołania do COBIT 4.1, ITAF i Risk IT. Po przejściu na COBIT 5 wystarcza jedno źródło, a programy audytu odwołują się do tych samych procesów i celów co plany departamentu informatyki.","egz":"Pewniak egzaminacyjny: COBIT 5 zintegrował (połączył) COBIT, Val IT i Risk IT. Złe odpowiedzi: „zintegrował ITIL i TOGAF” (to dopasowanie, nie integracja), „zintegrował COBIT 2019” (COBIT 2019 to późniejszy następca COBIT 5). TGF – pojęcia włączono, zasób wycofano.","src":"FW-PL s. 15, 23 (przypis 4); opisy BMIS, ITAF, Board Briefing, TGF – wiedza ogólna"},"baza":{"t":"Baza wiedzy COBIT 5","eg":"niepotwierdzona – zwykle „baza wiedzy COBIT 5”","pd":"główna baza wiedzy COBIT 5","en":"COBIT 5 core knowledge base","wyj":"Baza wiedzy COBIT 5 to wspólny rdzeń treści – zasady, aktywatory, model procesów, kaskada celów – z którego ISACA tworzy kolejne publikacje. Dzięki temu każdy przewodnik używa tych samych pojęć i nie przeczy pozostałym.\n\nNa tej podstawie powstają produkty dla różnych interesariuszy: przewodniki aktywatorów (np. COBIT 5: Enabling Processes – w podręczniku „Procesy umożliwiające”, opis wszystkich procesów) oraz przewodniki zawodowe, np. COBIT 5 – Wdrożenie, COBIT 5 for Information Security (bezpieczeństwo informacji), COBIT 5 for Assurance (audyt i zapewnienie), COBIT 5 for Risk (ryzyko).\n\nPonieważ produkty dochodzą z czasem, podręcznik nazywa architekturę produktów COBIT 5 „żywym dokumentem”; aktualną wersję ISACA publikuje na swojej stronie.","zycie":"To jak podstawowa książka kucharska, do której wydawnictwo dokłada kolejne tomy: „Kuchnia wegetariańska”, „Ciasta”, „Przetwory”. Każdy tom używa tych samych miar i podstawowych technik z tomu głównego.","firma":"W banku dział ryzyka korzysta z COBIT 5 for Risk, zespół bezpieczeństwa z COBIT 5 for Information Security, a audyt wewnętrzny z COBIT 5 for Assurance. Ponieważ wszystkie wychodzą z tej samej bazy wiedzy, rozmawiają o tych samych procesach, np. APO12 Zarządzanie ryzykiem.","urzad":"Audytor wewnętrzny starostwa sięga po przewodnik o audycie, a informatyk – po przewodnik wdrożeniowy. Obaj odwołują się do tych samych zasad i procesów, więc wyniki audytu łatwo przełożyć na plan prac informatyki na kolejny rok.","egz":"„Żywy dokument” = architektura produktów COBIT 5, która rośnie z czasem (nie: „każda organizacja przepisuje strukturę ramową”, nie: „co roku nowy numer wersji”). Egzaminacyjna nazwa przewodnika procesów niepotwierdzona (spotyka się „Przewodnik Aktywacji”).","src":"FW-PL s. 16; tytuły przewodników zawodowych – wiedza ogólna"},"mapa":{"t":"Mapa podręcznika COBIT 5","eg":"nie dotyczy – struktura publikacji (rozdziały 2–8, załączniki A–H)","pd":"Przeglądowe informacje na temat niniejszej publikacji","en":"Overview of this publication","wyj":"Po rozdziale 1 (przegląd) podręcznik ma jeszcze siedem rozdziałów. Rozdziały 2–6 to pięć zasad, po jednym na zasadę: 2 – zasada 1 i kaskada celów; 3 – zasada 2 (cała organizacja); 4 – zasada 3 (jedna zintegrowana struktura ramowa); 5 – zasada 4 (aktywatory); 6 – zasada 5 (oddzielenie Ładu od Zarządzania) z modelem referencyjnym procesów.\n\nRozdział 7 wprowadza do wdrożenia: środowisko, punkty zapalne, zdarzenia wyzwalające, cykl życia wdrożenia (szczegóły w publikacji COBIT 5 – Wdrożenie). Rozdział 8 opisuje model zdolności procesu (program COBIT Assessment Programme) i różnice wobec oceny dojrzałości z COBIT 4.1.\n\nZałączniki A–H to materiały referencyjne: A – źródła, B – mapowanie celów organizacji na cele IT, C – celów IT na procesy, D – potrzeby interesariuszy a cele organizacji, E – porównanie z innymi standardami, F – model informacji a kryteria informacji COBIT 4.1, G – szczegółowy opis aktywatorów, H – terminologia.","zycie":"To jak spis treści przewodnika turystycznego: najpierw „dlaczego warto jechać”, potem rozdziały o regionach, na końcu „jak zaplanować podróż” i mapy w załącznikach. Wiesz, gdzie szukać, zanim zaczniesz czytać.","firma":"W szpitalu dyrekcja czyta rozdziały 2–6, żeby zrozumieć zasady i swoją rolę w Ładzie; kierownik IT i pełnomocnik ds. jakości – rozdział 7, bo przygotowują wdrożenie; audytor wewnętrzny – rozdział 8 i Załącznik C, bo będzie oceniał procesy.","urzad":"Sekretarz gminy zaczyna od rozdziałów 2–6, informatyk od rozdziału 7 i Załącznika G, a audytor – od rozdziału 8. Gdy wójt pyta, które procesy wspierają cel „sprawne e-usługi”, odpowiedź jest w Załącznikach B i C.","egz":"Nazwy egzaminacyjne: „model zdolności procesu” (podręcznik: „model potencjału procesu”), „Rysunek” (podręcznik: „Ilustracja”). Zasady na egzaminie: Realizacja potrzeb interesariusza, Pokrycie całej organizacji, Zastosowanie Pojedynczej Zintegrowanej Struktury Ramowej, Aktywacja holistycznego podejścia, Oddzielenie Ładu od Zarządzania. Pułapka: rozdział 6 zawiera model referencyjny procesów, ale ocena zdolności procesu jest w rozdziale 8.","src":"FW-PL s. 16"}},"S":[{"pt":"Rozdział 1 · Wprowadzenie","h":"Po co nowa wersja COBIT?","b":"<p>COBIT 5 to najnowsze wytyczne <w k=\"isaca\">ISACA</w> o Ładzie i Zarządzaniu IT w organizacji. Łączy ponad 15 lat doświadczeń organizacji i użytkowników wcześniejszych wersji – z biznesu, IT, ryzyka, bezpieczeństwa i audytu.</p><p>Rozdział 1 wymienia <w k=\"wyzr\">powody powstania</w> COBIT 5. Da się je zebrać w 6 grup – każda ma później swoją „odpowiedź” w jednej z pięciu zasad.<span class=\"en\">Key drivers for the development of COBIT 5</span></p>","c":"Świat IT się zmienił – struktura ramowa musiała nadążyć.","s":"COBIT 5 Framework (PL), s. 15. Przykłady z firmy i urzędu – kursu.","ctx":"<p>COBIT nie powstał od razu jako struktura ramowa Ładu. Pierwsza wersja z 1996 roku była przede wszystkim narzędziem audytorów. Potem przyszły COBIT 2 (1998, praktyki kontrolne), COBIT 3 (2000, wytyczne zarządcze), COBIT 4 (2005) i COBIT 4.1 (2007), który opisywał głównie procesy IT, cele kontrolne i modele dojrzałości (wiedza ogólna). COBIT 5, wydany w 2012 roku (wiedza ogólna), zmienia perspektywę: z „jak działa dział IT” na „jak cała organizacja korzysta z informacji i technologii”.</p><p>Lista <w k=\"wyzr\">wyznaczników rozwoju</w> to diagnoza: co zmieniło się w otoczeniu organizacji, że dawne wytyczne przestały wystarczać. Na kolejnych slajdach zobaczysz każdy powód osobno, a w rozdziałach 2–6 – jego odpowiedź w postaci jednej z pięciu zasad.</p><p>Przykład: bank kiedyś pytał tylko, czy systemy działają. Dziś zarząd pyta, czy aplikacja mobilna przynosi korzyści, jakie ryzyko niesie zewnętrzny operator kart i czy przetwarzanie danych klientów jest zgodne z przepisami. To pytania o Ład, nie o technikę.</p><p>Częste nieporozumienie: COBIT 5 to nie „COBIT 4.1 z poprawkami” ani narzędzie wyłącznie dla działu IT. Podręcznik powołuje się na doświadczenia biznesu, IT, ryzyka, bezpieczeństwa i audytu – wszystkie te grupy są jego adresatami.</p>"},{"pt":"Powód 1 z 6","h":"Interesariusze chcą więcej wpływu<span class=\"en\">Give more stakeholders a say in what they expect from information and related technology</span>","b":"<p><w k=\"inter\">Interesariusze</w> chcą decydować, czego oczekują od IT: jakich korzyści, przy jakim akceptowalnym poziomie ryzyka i za ile.</p><div class=\"cards\"><div><b>Firma</b>Jedni udziałowcy chcą szybkiego zwrotu z inwestycji, inni zrównoważonego rozwoju; jedni akceptują wysokie ryzyko, inni nie.</div><div><b>Urząd</b>Mieszkańcy chcą wygody, skarbnik – oszczędności, rada – efektów.</div></div><p>Do tego chcą <b>przejrzystości</b>: widzieć, jak działania są prowadzone i co dały.</p>","c":"Sprzeczne oczekiwania trzeba umieć pogodzić – to zadanie zasady 1.","s":"COBIT 5 Framework (PL), s. 15. Przykłady z firmy i urzędu – kursu.","ctx":"<p>Pierwszy wyznacznik rozwoju jest fundamentem całego COBIT 5. Wyrasta z niego zasada 1 „Realizacja potrzeb interesariusza” i kaskada celów: potrzeby interesariuszy przekłada się na cele organizacji, cele związane z Informatyką i Cele aktywatora.</p><p>Trzy elementy oczekiwań – korzyści, ryzyko, koszt – wracają jako Cel Ładu: Tworzenie Wartości, czyli realizacja korzyści, optymalizacja ryzyka i optymalizacja zasobów (s. 23, Ilustracja 8). Ład ma rozbieżne oczekiwania ważyć i godzić, a nie wybierać jednego zwycięzcę.<span class=\"en\">Governance objective: value creation – benefits realisation, risk optimisation, resource optimisation</span></p><p>Przykład: szpital planuje elektroniczną rejestrację pacjentów. Dyrektor chce krótszych kolejek, główna księgowa – zmieszczenia się w budżecie, inspektor ochrony danych – bezpieczeństwa danych medycznych, a pacjenci – prostej obsługi. Wszyscy oczekują też raportów: co zrobiono i z jakim skutkiem.</p><p>Pułapka egzaminacyjna: „minimalizacja ryzyka” brzmi dobrze, ale COBIT 5 mówi o akceptowalnym poziomie ryzyka i jego optymalizacji. Drugi błąd: zawężanie interesariuszy do zarządu – podręcznik mówi o „większej liczbie interesariuszy”, także zewnętrznych.</p>"},{"pt":"Powód 2 z 6","h":"Coraz więcej zależy od innych<span class=\"en\">Increasing dependency of enterprise success on external business and IT parties</span>","b":"<p>Sukces organizacji coraz bardziej zależy od <w k=\"outs\">stron zewnętrznych</w> – zarówno w biznesie, jak i w IT: outsourcingu, dostawców, konsultantów, klientów, usług w chmurze.</p><div class=\"cards\"><div><b>Firma</b>Szpital trzyma dokumentację medyczną w chmurze, a sieć obsługuje firma zewnętrzna.</div><div><b>Urząd</b>Starostwo prowadzi ewidencję gruntów w systemie dostawcy, a BIP na zewnętrznym hostingu.</div></div>","c":"Wykonanie można zlecić, odpowiedzialności – nie. Trzeba kierować także tym, co robią inni.","s":"COBIT 5 Framework (PL), s. 15, 23. Przykłady z firmy i urzędu – kursu.","ctx":"<p>Drugi wyznacznik dotyczy granic organizacji. Gdy kluczowe usługi świadczą inni – dostawca chmury, firma outsourcingowa, konsultanci – metodyka obejmująca tylko „własne” IT pomijałaby dużą część ryzyka i kosztów. Podręcznik wymienia wśród stron zewnętrznych nawet klientów, a obok nich – wewnętrzne środki i mechanizmy, od których zależy uzyskanie wartości.</p><p>Odpowiedzią jest zasada 2 „Pokrycie całej organizacji”: COBIT 5 uwzględnia wszystkie istotne wewnętrzne i zewnętrzne usługi IT oraz procesy biznesowe, a aktywatory obejmują „wszystkich i wszystko” wewnątrz organizacji i poza nią (s. 23).</p><p>Przykład: sklep internetowy ma platformę u dostawcy chmury, płatności przez zewnętrznego operatora i dostawy przez firmę kurierską. Gdy w szczycie sprzedaży bramka płatności przestaje działać, klienci mają pretensje do sklepu, nie do operatora. Sklep musi więc znać to ryzyko, mieć umowę z poziomami usług (SLA – Service Level Agreement, umowa o poziomie usług) i monitorować jej wykonanie.</p><p>Częsty błąd: „zlecamy, więc to problem dostawcy”. Wykonanie można przekazać, odpowiedzialności za wynik – nie.</p>"},{"pt":"Powód 3 z 6","h":"Informacji jest dużo więcej<span class=\"en\">Deal with a much larger amount of information</span>","b":"<p>Organizacje mają ogromne ilości danych. Trzeba wybrać te istotne i wiarygodne, żeby decyzje biznesowe były skuteczne i wydajne – i trzeba wydajnie zarządzać samą informacją.</p><p>Pomaga w tym <w k=\"model\">model informacji</w> – uporządkowany sposób opisywania, jaka informacja jest potrzebna, jakiej ma być jakości i jak żyje od powstania do zniszczenia.</p>","c":"Liczy się nie ilość danych, tylko ich jakość i porządek.","s":"COBIT 5 Framework (PL), s. 15. Przykłady z firmy i urzędu – kursu.","ctx":"<p>Trzeci wyznacznik to paradoks: danych przybywa, a trafnych decyzji wcale nie jest więcej. Podręcznik pyta, jak wybrać informacje istotne i wiarygodne, i wskazuje dwa zadania – dobór informacji do decyzji biznesowych oraz wydajne zarządzanie samą informacją.</p><p>W dalszej części COBIT 5 informacja staje się jednym z aktywatorów (zasada 4). Model, na którym opisano aktywatory, pozwala każdemu interesariuszowi określić wymagania wobec informacji i jej cyklu życia – i w ten sposób łączy potrzeby biznesu z pracą IT (s. 23). Załącznik F porównuje model informacji z kryteriami informacji z COBIT 4.1.</p><p>Przykład: gmina wysyła decyzje podatkowe, a część z nich wraca z adnotacją „adresat nieznany”, bo referat podatków i referat odpadów mają różne adresy tych samych mieszkańców. Problemem nie jest brak danych, tylko brak ustaleń: który rejestr jest wiodący i kto odpowiada za poprawki.</p><p>Pułapka: <w k=\"model\">model informacji</w> to nie model zdolności procesu z rozdziału 8 ani kaskada celów – to opis samej informacji: kto jej potrzebuje, jakiej jakości i jak żyje od powstania do zniszczenia.</p>"},{"pt":"Powód 4 z 6","h":"IT jest częścią całej działalności<span class=\"en\">Deal with much more pervasive IT – an integral part of the business</span>","b":"<p>Oddzielenie IT od biznesu – nawet przy dobrym dopasowaniu – nie jest już optymalne. IT musi być częścią projektów biznesowych, struktur, zarządzania ryzykiem, polityk, umiejętności i procesów.</p><p>Zmienia się rola <w k=\"cio\">dyrektora ds. informatyki (CIO)</w>, a coraz więcej osób z biznesu ma umiejętności IT i współdecyduje o technologii. Pojawiają się <w k=\"user\">rozwiązania IT inicjowane i kontrolowane przez samych użytkowników</w> – nad nimi trzeba mieć większą kontrolę.</p><div class=\"chips\"><span>Dyrektor ds. informatyki (CIO)<span class=\"en\">Chief Information Officer</span></span><span>Rozwiązania IT inicjowane i kontrolowane przez użytkowników<span class=\"en\">User-initiated and user-controlled IT solutions</span></span></div><div class=\"cards\"><div><b>Innowacje</b>COBIT 5 miał też dać wytyczne o innowacjach i nowych technologiach: nowe produkty, nowi klienci, szybsze dostarczanie na rynek.<span class=\"en\">Innovation and emerging technologies</span></div></div>","c":"Biznes i IT muszą działać razem – nie obok siebie.","s":"COBIT 5 Framework (PL), s. 15. Przykłady z firmy i urzędu – kursu.","ctx":"<p>W kursie ta grupa łączy trzy osobne punkty listy z s. 15: IT jako integralna część działalności, wytyczne o innowacjach i nowych technologiach oraz kontrola nad rozwiązaniami IT tworzonymi przez użytkowników. Wspólny mianownik: technologia przestała być sprawą jednego działu.</p><p>Skoro osoby z biznesu mają umiejętności IT i współdecydują o technologii, rola CIO (Chief Information Officer – dyrektor ds. informatyki) przesuwa się od „utrzymania systemów” do partnerstwa z biznesem. Prowadzi to do zasady 5: Ład należy do organu Ładu (np. zarządu lub rady), a Zarządzanie – do kierownictwa, w tym CIO.</p><p>Przykład: w ubezpieczycielu dział likwidacji szkód sam zamawia aplikację do przesyłania zdjęć szkody z telefonu klienta. To innowacja, która skraca obsługę – ale bez udziału IT nikt nie sprawdził, gdzie trafiają zdjęcia i kto ma do nich dostęp.</p><p>Częste nieporozumienie: COBIT 5 nie każe zakazywać takich rozwiązań ani oddawać wszystkiego działowi IT. Celem jest większa kontrola i lepsza integracja funkcji biznesowej z IT.</p>"},{"pt":"Powód 5 z 6","h":"Pełna odpowiedzialność i jasne efekty<span class=\"en\">Cover the full end-to-end business and IT functional responsibilities</span>","b":"<p>COBIT 5 miał objąć pełny zakres odpowiedzialności <b>i biznesu, i IT</b> oraz wszystkie elementy skutecznego Ładu i Zarządzania: struktury organizacyjne, polityki, kulturę i procesy – nie tylko procesy, jak wcześniej.</p><p><b>Oczekiwane efekty w organizacji:</b></p><div class=\"chips\"><span>Tworzenie wartości z IT<span class=\"en\">Value creation through effective and innovative use of enterprise IT</span></span><span>Zadowolenie użytkowników biznesowych z usług IT<span class=\"en\">Business user satisfaction with IT engagement and services</span></span><span>Zgodność z przepisami, regulacjami, umowami i politykami wewnętrznymi<span class=\"en\">Compliance with relevant laws, regulations, contractual agreements and internal policies</span></span><span>Lepsze relacje między potrzebami biznesu a celami IT<span class=\"en\">Improved relationship between business needs and IT objectives</span></span></div>","c":"Nie tylko procesy – cała organizacja i mierzalne efekty.","s":"COBIT 5 Framework (PL), s. 15. Przykłady z firmy i urzędu – kursu.","ctx":"<p>Ta grupa poszerza zakres metodyki. Podręcznik mówi o pełnym zakresie odpowiedzialności funkcji biznesowej i IT oraz o wszystkich aspektach skutecznego Ładu i Zarządzania: strukturach organizacyjnych, politykach, kulturze i procesach. W COBIT 4.1 osią były procesy IT (wiedza ogólna); w COBIT 5 procesy są tylko jednym z siedmiu aktywatorów (zasada 4).</p><p>Cztery oczekiwane efekty – wartość, zadowolenie użytkowników biznesowych, zgodność oraz lepsze relacje między potrzebami biznesu a celami IT – to miara, czy Ład działa. Zgodność wraca później m.in. w procesie MEA03, dotyczącym monitorowania zgodności z wymogami zewnętrznymi (s. 59).</p><p>Przykład: ministerstwo ma dobrze opisane procedury obsługi zgłoszeń IT, ale brak w nim polityki, kto zatwierdza nowe systemy, a departamenty nie ufają informatykom. Same procesy nie wystarczą – brakuje struktur, polityk i kultury współpracy.</p><p>Pułapka: „COBIT 5 to zbiór 37 procesów (s. 33) i nic więcej” – procesy to tylko część obrazu. Druga: zgodność w COBIT 5 to nie tylko przepisy, ale też zobowiązania umowne i polityki wewnętrzne.</p>"},{"pt":"Powód 6 z 6","h":"Jedna rama zamiast wielu<span class=\"en\">Connect to and align with other frameworks and standards; integrate all major ISACA frameworks</span>","b":"<p>COBIT 5 miał spełnić dwa różne zadania – i na egzaminie trzeba je odróżniać:</p><p><b>Dopasowanie – standardy innych organizacji.</b> COBIT 5 się z nimi łączy, ale ich nie zastępuje:</p><div class=\"chips\"><span><w k=\"itil\">ITIL</w><span class=\"en\">Information Technology Infrastructure Library</span></span><span><w k=\"togaf\">TOGAF</w><span class=\"en\">The Open Group Architecture Framework</span></span><span><w k=\"proj\">PMBOK</w><span class=\"en\">Project Management Body of Knowledge</span></span><span><w k=\"proj\">PRINCE2</w><span class=\"en\">PRojects IN Controlled Environments 2</span></span><span><w k=\"coso\">COSO</w><span class=\"en\">Committee of Sponsoring Organizations of the Treadway Commission</span></span><span><w k=\"iso\">normy ISO</w><span class=\"en\">International Organization for Standardization standards</span></span></div><p><b>Integracja – metodyki ISACA.</b> Weszły w skład COBIT 5 – jedna struktura ramowa:</p><div class=\"chips\"><span>COBIT (do wersji 4.1)<span class=\"en\">COBIT 4.1</span></span><span><w k=\"isacafw\">Val IT</w> – wartość z inwestycji w IT<span class=\"en\">The Val IT Framework</span></span><span><w k=\"isacafw\">Risk IT</w> – ryzyko związane z IT<span class=\"en\">The Risk IT Framework</span></span><span>BMIS – model biznesowy bezpieczeństwa informacji<span class=\"en\">Business Model for Information Security</span></span><span>ITAF – struktura ramowa audytu i zapewnienia IT<span class=\"en\">IT Assurance Framework</span></span><span>Informator o ładzie IT dla zarządów<span class=\"en\">Board Briefing on IT Governance</span></span><span>TGF – zasób o pojęciach ładu (wycofany)<span class=\"en\">Taking Governance Forward</span></span></div><p>Dzięki temu COBIT 5 może być <b>nadrzędną strukturą ramową</b> Ładu i Zarządzania IT dla całej organizacji (zasada 3).</p>","c":"Inne standardy – dopasowane; metodyki ISACA – połączone.","s":"COBIT 5 Framework (PL), s. 15, 23 (przypis 4), 25. Przykłady z firmy i urzędu – kursu.","ctx":"<p>Ta grupa to dwa ostatnie punkty listy z s. 15 i bezpośrednie źródło zasady 3 (na egzaminie: „Zastosowanie Pojedynczej Zintegrowanej Struktury Ramowej”). Organizacje rzadko stosują jeden standard – zwykle mają ITIL w obsłudze usług, normę ISO w bezpieczeństwie i PRINCE2 w projektach. Brakowało ramy, która pokaże, jak te części do siebie pasują.</p><p>Rozdział 4 (s. 25) dodaje, że jedna nadrzędna struktura ma być spójnym źródłem wytycznych pisanych językiem zrozumiałym dla osób bez specjalistycznej wiedzy technicznej. Ilustracja 10 pokazuje, że bazę wiedzy COBIT 5 zasilają dotychczasowe wytyczne ISACA, nowe materiały ISACA oraz inne standardy i metodyki.</p><p>Przykład: ubezpieczyciel ma certyfikat ISO/IEC 27001, obsługę zgłoszeń według ITIL i projekty według PRINCE2. COBIT 5 nie każe niczego wyrzucać – porządkuje całość w domenach i pokazuje zarządowi jeden obraz.</p><p>Pułapka egzaminacyjna: integracja dotyczy tylko <w k=\"isacafw\">metodyk ISACA</w> (COBIT, Val IT, Risk IT i pozostałych), a dopasowanie – standardów innych organizacji, np. <w k=\"itil\">ITIL</w> czy <w k=\"coso\">COSO</w>.<span class=\"en\">Integrate ISACA frameworks · align with other standards</span></p>"},{"pt":"Załącznik E · s. 60–61","h":"Gdzie inne standardy „pasują” do COBIT 5?","b":"<p>Załącznik E i <b>Ilustracja 25</b> (na egzaminie: „Rysunek”) pokazują, w których domenach COBIT 5 inne standardy dają szczegółowe wytyczne.<span class=\"en\">Appendix E · Figure 25</span></p><div class=\"tblwrap\"><table class=\"tbl\"><tr><th>Domena COBIT 5 (nazwa z egzaminu)</th><th>Standardy</th></tr><tr><td>EDM – Oszacuj, Kieruj i Monitoruj<span class=\"en\">Evaluate, Direct and Monitor</span></td><td><w k=\"iso\">ISO/IEC 38500</w> – ład korporacyjny IT; także ryzyko (ISO 31000), bezpieczeństwo (ISO/IEC 27000), zasoby (<w k=\"togaf\">TOGAF 9</w>)<span class=\"en\">Corporate governance of IT · Risk management · Information security · The Open Group Architecture Framework</span></td></tr><tr><td>APO – Dostosuj, Planuj i Organizuj<span class=\"en\">Align, Plan and Organise</span></td><td>ISO 31000, TOGAF 9, ISO/IEC 27000, <w k=\"proj\">PRINCE2/PMBOK</w>, <w k=\"cmmi\">CMMI</w>; niektóre procesy z ITIL<span class=\"en\">Capability Maturity Model Integration · Information Technology Infrastructure Library</span></td></tr><tr><td>BAI – Twórz, Nabywaj i Wdrażaj<span class=\"en\">Build, Acquire and Implement</span></td><td>PRINCE2/PMBOK, CMMI; część <w k=\"itil\">ITIL V3 2011</w> i ISO/IEC 20000 (zarządzanie usługami IT)<span class=\"en\">IT service management</span></td></tr><tr><td>DSS – Dostarczaj, Obsługuj i Wspieraj<span class=\"en\">Deliver, Service and Support</span></td><td>ITIL V3 2011 i ISO/IEC 20000; bezpieczeństwo z ISO/IEC 27000<span class=\"en\">IT service management · Information security management</span></td></tr><tr><td>MEA – Monitoruj, Oszacuj i Oceń<span class=\"en\">Monitor, Evaluate and Assess</span></td><td>ISO/IEC 27000 (działania monitorujące i oceniające)<span class=\"en\">Information security management</span></td></tr></table></div><p>Mapowanie proces po procesie zawiera przewodnik COBIT 5: Procesy umożliwiające.<span class=\"en\">COBIT 5: Enabling Processes</span></p>","c":"COBIT 5 daje całość, inne standardy – szczegóły w swoich domenach.","s":"COBIT 5 Framework (PL), s. 60–61, Ilustracja 25. Nazwy domen – egzamin PL.","ctx":"<p>Załącznik E to praktyczne przełożenie zasady 3: skoro COBIT 5 ma być nadrzędną strukturą ramową, trzeba pokazać, w których domenach inne standardy dają szczegóły. COBIT 5 odpowiada na pytanie „co i dlaczego”, a standardy szczegółowe – „jak dokładnie”.</p><p>Warto zapamiętać dwa uzupełnienia z s. 59–60. Domena EDM to według podręcznika podstawowe miejsce w COBIT 5, w którym zdefiniowano działania Ładu – stąd jej związek z ISO/IEC 38500. Z kolei ocenę zdolności procesu oparto na normie ISO/IEC 15504, a nie na <w k=\"cmmi\">CMMI</w>.</p><p>Przykład: audytor wewnętrzny banku planuje przegląd obsługi incydentów. Cele i zakres audytu bierze z procesów domeny DSS w COBIT 5, a szczegółowe kryteria dobrej praktyki – z ITIL, według którego bank pracuje na co dzień.</p><p>Pułapka: nazwy EDM (Oszacuj, Kieruj i Monitoruj) i MEA (Monitoruj, Oszacuj i Oceń) brzmią podobnie – EDM to Ład, MEA to Zarządzanie. Seria ISO/IEC 27000 pojawia się w kilku domenach (EDM, APO, DSS, MEA), więc nie przypisuj jej tylko jednej.</p>"},{"pt":"Rodzina produktów","h":"COBIT 5 będzie rósł","b":"<p>Z jednej <w k=\"baza\">głównej bazy wiedzy COBIT 5</w> powstają kolejne produkty i wytyczne dla różnych interesariuszy – np. o procesach, wdrożeniu, ryzyku, bezpieczeństwie, audycie.</p><p>Dlatego podręcznik nazywa architekturę produktów COBIT 5 <b>„żywym dokumentem”</b>; jej aktualną wersję ISACA publikuje na swojej stronie.<span class=\"en\">COBIT 5 product architecture – a living document</span></p><p>Przykłady produktów z rodziny COBIT 5:</p><div class=\"chips\"><span>Główna baza wiedzy COBIT 5<span class=\"en\">COBIT 5 knowledge base</span></span><span>Procesy umożliwiające<span class=\"en\">COBIT 5: Enabling Processes</span></span><span>Wdrożenie<span class=\"en\">COBIT 5 Implementation</span></span><span>Bezpieczeństwo informacji<span class=\"en\">COBIT 5 for Information Security</span></span><span>Audyt i zapewnienie<span class=\"en\">COBIT 5 for Assurance</span></span><span>Ryzyko<span class=\"en\">COBIT 5 for Risk</span></span></div>","c":"Rdzeń jest stały, przewodniki dochodzą z czasem.","s":"COBIT 5 Framework (PL), s. 16; tytuły przewodników zawodowych – wiedza ogólna. Przykłady z firmy i urzędu – kursu.","ctx":"<p>Baza wiedzy to odpowiedź na problem, który COBIT 5 sam zdiagnozował: rozproszone publikacje z różnymi słownikami. Zamiast kolejnych niezależnych książek ISACA ma jeden rdzeń i z niego „wycina” produkty dla różnych interesariuszy. Ilustracja 10 (s. 25) pokazuje ten mechanizm jako filtr zawartości dla bazy wiedzy.</p><p>Rodzina produktów ma kilka warstw: sam COBIT 5 (ta struktura ramowa), przewodniki dotyczące aktywatorów, przewodniki specjalistyczne (zawodowe) oraz środowisko sieciowe oparte na współpracy.<span class=\"en\">COBIT 5 enabler guides · professional guides · online collaborative environment</span> W chwili wydania podręcznika część z nich była dopiero planowana – Załącznik E wspomina np. o „planowanym przewodniku” o audycie (s. 59).</p><p>Przykład: w szpitalu kierownik bezpieczeństwa sięga po przewodnik o bezpieczeństwie informacji, a audytor wewnętrzny – po przewodnik o audycie. Obaj mówią o tych samych procesach i aktywatorach, więc ich raporty da się zestawić.</p><p>Pułapka: „żywy dokument” nie znaczy, że ISACA co roku wydaje nową wersję COBIT, ani że organizacja przepisuje strukturę ramową. Rośnie architektura produktów, a rdzeń pozostaje wspólny.</p>"},{"pt":"Mapa podręcznika","h":"Co jest w kolejnych rozdziałach?","b":"<div class=\"cards\"><div><b>Rozdziały 2–6</b>Pięć zasad – po jednym rozdziale na zasadę (rozdz. 6 zawiera też model referencyjny procesów).<span class=\"en\">Principles 1–5 · Process Reference Model</span></div><div><b>Rozdział 7</b>Wprowadzenie do wdrożenia – szczegóły w publikacji COBIT 5 – Wdrożenie.<span class=\"en\">Introduction to Implementation Guidance · COBIT 5 Implementation</span></div><div><b>Rozdział 8</b>Model zdolności procesu i różnice wobec oceny dojrzałości z COBIT 4.1.<span class=\"en\">The COBIT 5 Process Capability Model · COBIT Assessment Programme</span></div><div><b>Załączniki A–H</b>Źródła, mapowania celów (B, C), potrzeby interesariuszy (D), inne standardy (E), model informacji (F), aktywatory (G), terminologia (H).<span class=\"en\">Appendices A–H: References · Mappings · Related standards · Information model · Enablers · Glossary</span></div></div><p>To ta sama kolejność co w <w k=\"mapa\">mapie głównej</w> kursu.</p>","c":"Zasady → wdrożenie → ocena, a w załącznikach szczegóły.","s":"COBIT 5 Framework (PL), s. 16. Przykłady z firmy i urzędu – kursu.","ctx":"<p>Przegląd rozdziałów na s. 16 to dobra ściąga do całego kursu: pięć zasad, potem wdrożenie, potem ocena procesów. Kurs idzie tą samą drogą, więc po tym rozdziale przechodzisz do zasady 1 i kaskady celów.</p><p>Uwaga na nazewnictwo. Polski podręcznik używa innych słów niż egzamin: „nadzór” to na egzaminie Ład, „czynniki umożliwiające” – aktywatory, „metodyka” – struktura ramowa, „Model potencjału procesu” – model zdolności procesu, „Ilustracja” – Rysunek. Nazwy zasad też się różnią, np. podręcznikowe „Spełnienie potrzeb interesariuszy” to egzaminacyjna „Realizacja potrzeb interesariusza”.</p><p>Przykład: informatyk starostwa przygotowuje wdrożenie. Zaczyna od rozdziału 7 (punkty zapalne i zdarzenia inicjujące wdrożenie), a gdy potrzebuje przykładów aktywatorów – sięga do Załącznika G, który rozwija rozdział 5.</p><p>Pułapka: rozdział 6 podaje model referencyjny procesów (jakie procesy istnieją), a rozdział 8 – sposób oceny ich zdolności. Pytania o skalę oceny i migrację z COBIT 4.1 dotyczą rozdziału 8.</p>"},{"pt":"Podsumowanie","h":"Na egzamin","b":"<p>• COBIT 5 powstał, bo interesariusze chcą więcej wpływu i przejrzystości, organizacje zależą od dostawców i chmury, informacji jest coraz więcej, a IT stało się częścią całej działalności.</p><p>• COBIT 5 <b>połączył</b> metodyki ISACA: COBIT, <b>Val IT</b> i <b>Risk IT</b> (oraz BMIS, ITAF, Board Briefing, TGF – ten ostatni wycofano).</p><p>• COBIT 5 jest <b>dopasowany</b> do ITIL, TOGAF, PMBOK, PRINCE2, COSO i norm ISO – nie zastępuje ich i może być nad nimi strukturą nadrzędną.</p><p>• Załącznik E: ISO/IEC 38500 ↔ EDM; ITIL i ISO/IEC 20000 ↔ DSS, BAI, część APO; PRINCE2/PMBOK ↔ APO i BAI.</p>","c":"Zła odpowiedź: „COBIT 5 zastępuje ITIL i normy ISO”.","s":"COBIT 5 Framework (PL), s. 15–16, 23, 60–61. Przykłady z firmy i urzędu – kursu.","ctx":"<p>Ten rozdział nie wprowadza jeszcze modeli ani list procesów – daje „dlaczego”. Pytania z tej części sprawdzają głównie dwie rzeczy: czy rozpoznajesz powód powstania metodyki w opisanej sytuacji oraz czy odróżniasz integrację metodyk ISACA od dopasowania do standardów innych organizacji.</p><p>Dobry sposób powtórki: przy każdym powodzie dopisz zasadę, która na niego odpowiada. Interesariusze – zasada 1; strony zewnętrzne i pełna odpowiedzialność – zasada 2; wiele standardów i metodyk – zasada 3; struktury, polityki, kultura i informacja – zasada 4 (aktywatory); zmiana roli CIO i podział ról między organ Ładu a kierownictwo – zasada 5.</p><p>Przykład do sprawdzenia siebie: gmina zleca system podatkowy zewnętrznemu dostawcy, a radni żądają raportów o efektach e-usług. Potrafisz wskazać dwa wyznaczniki rozwoju i dwie zasady, których to dotyczy? Jeśli tak – możesz przejść do zasady 1.</p>"},{"pt":"Sprawdź się · wspólna pula kursu","quiz":{"id":"q-warsztat-integracja","sylabus":["PR-02-11"],"tresc":"Co najlepiej odpowiada zasadzie jednej zintegrowanej metodyki COBIT 5?","kontekst":"Organizacja ma praktyki ITIL i polityki oparte na ISO/IEC 27001. Chce objąć je wspólnym nadzorem.","opcje":[{"t":"Zastąpić wszystkie szczegółowe praktyki jedną listą nazw procesów COBIT.","ok":false,"w":"Integracja nie polega na usunięciu potrzebnych szczegółowych praktyk z innych źródeł."},{"t":"Powiązać praktyki wspólnym podejściem i celami.","ok":true,"w":"COBIT 5 pełni rolę nadrzędnego podejścia integrującego inne standardy i dobre praktyki; konkretne sposoby wdrożenia dobiera się do organizacji."},{"t":"Utrzymać całkowicie odrębne cele i odpowiedzialności dla każdej metodyki.","ok":false,"w":"Rozdzielone cele i brak powiązań utrudniają zintegrowane podejście."},{"t":"Uznać każdy dokument ISO za proces EDM.","ok":false,"w":"Dokument lub standard nie jest automatycznie procesem Ładu."}],"kurs":"COBIT 5 pełni rolę nadrzędnego podejścia integrującego inne standardy i dobre praktyki; konkretne sposoby wdrożenia dobiera się do organizacji.","src":"FW-EN, rozdział 4","pomoc":{"t":"Odpowiadaj według celu i mandatu opisanego w pytaniu, nie według samego stanowiska lub nazwy dokumentu."}}},{"pt":"Sprawdź się · wspólna pula kursu","quiz":{"id":"q-prb-46-z1","sylabus":["PR-01-03"],"tresc":"Model procesów COBIT 5 jest następcą modelu COBIT 4.1. Jakie modele procesów jeszcze w sobie łączy?","kontekst":"","opcje":[{"t":"ITIL i ISO/IEC 27001","ok":false,"w":"COBIT 5 współgra z tymi standardami, ale nie łączy ich modeli procesów w sobie."},{"t":"Risk IT i Val IT","ok":true,"w":"Dobrze. FW-PL s. 33: model łączy w sobie również modele procesów Risk IT oraz Val IT."},{"t":"ISO/IEC 38500 i ISO/IEC 15504","ok":false,"w":"COBIT 5 korzysta z koncepcji tych norm, ale model procesów łączy Risk IT i Val IT."},{"t":"PRINCE2 i TOGAF","ok":false,"w":"Te ramy nie są częścią modelu procesów COBIT 5."}],"kurs":"Dobrze. FW-PL s. 33: model łączy w sobie również modele procesów Risk IT oraz Val IT.","src":"FW-EN, rozdział 6, rysunki 15–16","pomoc":{"t":"Odpowiadaj według celu i mandatu opisanego w pytaniu, nie według
