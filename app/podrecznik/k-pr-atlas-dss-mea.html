<script>window.DECK={"id":"k-pr-atlas-dss-mea","rozdzial":"Rozdział 6 · Zasada 5: Oddzielenie Ładu od Zarządzania · s. 31–33","tytul":"Atlas procesów: DSS i MEA","prev":"k-pr-atlas-bai.html","next":"k-im-kontekst.html","T":{"proc-mea01":{"t":"MEA01 Monitorowanie, ocena i oszacowanie wydajności i zgodności","eg":"MEA01 Monitorowanie, ocena i oszacowanie wydajności i zgodności","pd":"MEA01 Monitorowanie, ocena i oszacowanie wydajności i zgodności","en":"MEA01 Monitor, Evaluate and Assess Performance and Conformance","wyj":"Zbierasz liczby o tym, jak idzie praca, porównujesz je z celami i raportujesz, co trzeba poprawić.\n\nMonitorowanie wyników i zgodności z uzgodnionymi celami, wraz z raportowaniem oraz działaniami korygującymi.\n\nŻeby wiedzieć, czy procesy osiągają cele wydajności i zgodności. I żeby szybko uruchomić poprawki.","zycie":"Postanowiłeś schudnąć 5 kg do wakacji. Co niedzielę stajesz na wadze i zapisujesz wynik w tabelce. Gdy przez dwa tygodnie waga stoi, zmieniasz plan treningów. Mierzenie, porównywanie z celem i korekta to MEA01.","firma":"Kierowniczka sklepu co tydzień porównuje czas wysyłki i zwroty z celami i zleca poprawki.","urzad":"Sekretarz gminy ustala cel: 95% spraw załatwionych w ustawowym terminie. Co kwartał zbiera dane z systemu obiegu dokumentów, porównuje je z celem i raportuje wójtowi, w których referatach są zaległości. Proponuje działania, np. zastępstwo w referacie podatków, i po kolejnym kwartale sprawdza, czy pomogły.","it":"Praktyki MEA01: podejście do monitorowania, cele wydajności i zgodności, zbieranie danych, analiza i raport oraz działania korygujące. Raporty trafiają do Ładu, który monitoruje w EDM.","egz":"Słowa-klucze: mierniki, cele wydajności, raportowanie wyników, działania korygujące → MEA01. Kto mierzy i raportuje → MEA01 (Zarządzanie). Kto ocenia raport względem kierunku → EDM (Ład). „Zgodność” w MEA01 to conformance, a w MEA03 compliance. Podręcznik: „MEA01 Monitorowanie, ocena i oszacowanie wydajności i zgodności”. Na egzaminie nazwa procesu może brzmieć inaczej niż w podręczniku. Egzamin PL tłumaczy po swojemu, często trybem rozkazującym (np. domena „Twórz, Nabywaj i Wdrażaj” zamiast „Budowanie, nabywanie i wdrażanie”). Egzaminacyjnej nazwy tego procesu nie potwierdziliśmy, dlatego rozpoznawaj go po kodzie i angielskim słowie kluczowym: Performance and Conformance. Domena MEA na egzaminie to „Monitoruj, Oszacuj i Oceń”, więc nazwy procesów MEA mogą tam brzmieć np. trybem rozkazującym. Uwaga na słowo „zgodność”: w MEA01 to conformance (zgodność z uzgodnionymi celami i ustaleniami), a w MEA03 to compliance (zgodność z wymogami zewnętrznymi). Nie myl z: Oszacuj, Kieruj i Monitoruj (EDM) – MEA01 to Zarządzanie: kierownictwo mierzy, ocenia i raportuje. „Monitoruj” w EDM to Ład: organ Ładu sprawdza na podstawie tych raportów, czy kierunek został wcielony w życie.; MEA03 Monitorowanie, ocena i oszacowanie zgodności z wymogami zewnętrznymi – MEA01 sprawdza wydajność i zgodność z uzgodnionymi celami i ustaleniami (conformance). MEA03 – zgodność z wymogami zewnętrznymi: prawem, regulacjami, umowami (compliance).; MEA02 Monitorowanie, ocena i oszacowanie systemu kontroli wewnętrznej – MEA01 mierzy wyniki procesów. MEA02 ocenia, czy działają mechanizmy kontroli wewnętrznej.","src":"COBIT 5: Enabling Processes, sekcja MEA01 — Process Description / Purpose / Practices"},"proc-dss01":{"t":"DSS01 Zarządzanie eksploatacją","eg":"DSS01 Zarządzanie eksploatacją","pd":"DSS01 Zarządzanie eksploatacją","en":"DSS01 Manage Operations","wyj":"Codzienna, rutynowa robota, dzięki której systemy chodzą: zaplanowane zadania, pilnowanie sprzętu, prądu i serwerowni.\n\nKoordynacja i wykonywanie codziennych czynności operacyjnych potrzebnych do dostarczania usług IT.\n\nŻeby usługi IT działały dzień po dniu. To rutyna, dzięki której systemy po prostu chodzą.","zycie":"W domu masz rutynę: w niedzielę wynosisz śmieci, co miesiąc czyścisz filtr w okapie, zimą sprawdzasz ciśnienie w piecu. Nic się nie psuje, a dom działa. Ta codzienna, zaplanowana obsługa to eksploatacja.","firma":"Informatyk hurtowni co rano sprawdza nocne zadania, klimatyzację serwerowni i komunikaty dostawcy chmury.","urzad":"W urzędzie gminy informatyk co rano sprawdza, czy nocna kopia zapasowa się wykonała i czy w serwerowni jest właściwa temperatura. Raz w miesiącu testuje zasilacz awaryjny serwera. Pilnuje też firmy, która prowadzi gminie pocztę elektroniczną: czyta jej komunikaty i sprawdza, czy wykonuje zaplanowane prace.","it":"Praktyki DSS01: procedury operacyjne, usługi zlecone na zewnątrz, monitorowanie infrastruktury, środowisko i pomieszczenia. Przykład: kontrola, czy nocna kopia zapasowa się wykonała.","egz":"Słowa-klucze: procedury operacyjne, harmonogram zadań, monitorowanie infrastruktury, środowisko i pomieszczenia IT, eksploatacja usług zleconych na zewnątrz → DSS01. Podręcznik: „DSS01 Zarządzanie eksploatacją”. Na egzaminie nazwa procesu może brzmieć inaczej niż w podręczniku. Egzamin PL tłumaczy po swojemu, często trybem rozkazującym (np. domena „Twórz, Nabywaj i Wdrażaj” zamiast „Budowanie, nabywanie i wdrażanie”). Egzaminacyjnej nazwy tego procesu nie potwierdziliśmy, dlatego rozpoznawaj go po kodzie i angielskim słowie kluczowym: Manage Operations. Nie myl z: DSS02 Zarządzanie zgłoszeniami serwisowymi i incydentami – DSS01 to zaplanowana rutyna i monitorowanie. Gdy usługa zostaje przerwana albo pogorszona, obsługa tego zdarzenia przechodzi do DSS02 jako incydent.; APO10 Zarządzanie dostawcami – APO10 wybiera dostawców i zarządza umowami z nimi. DSS01 pilnuje codziennej eksploatacji usług, które dostawca dla nas prowadzi.; BAI04 Zarządzanie dostępnością i pojemnością – DSS01 zbiera dane o obciążeniu na bieżąco. BAI04 na ich podstawie planuje pojemność na przyszłość.","src":"COBIT 5: Enabling Processes, sekcja DSS01 — Process Description / Purpose / Practices"},"proc-dss06":{"t":"DSS06 Zarządzanie mechanizmami kontrolnymi procesów biznesowych","eg":"DSS06 Zarządzanie mechanizmami kontrolnymi procesów biznesowych","pd":"DSS06 Zarządzanie mechanizmami kontrolnymi procesów biznesowych","en":"DSS06 Manage Business Process Controls","wyj":"Wbudowane w codzienną pracę zabezpieczenia, które pilnują, żeby dane były kompletne, poprawne i zatwierdzone przez właściwą osobę.\n\nDefiniowanie i utrzymanie kontroli w procesach biznesowych, aby zapewniać poprawne i uprawnione przetwarzanie informacji.\n\nŻeby dane w procesach biznesowych były kompletne, poprawne i zatwierdzone przez właściwą osobę. Kontrola jest wbudowana w codzienną pracę.","zycie":"W domowym budżecie ustaliliście: przelew powyżej 1000 zł wymaga zgody drugiej osoby, a każdy paragon ląduje w pudełku. Bank sam blokuje przelew, jeśli brakuje numeru konta. Te zabezpieczenia działają w trakcie wydawania pieniędzy, a nie po fakcie.","firma":"Hurtownia nie przyjmie faktury bez numeru zamówienia, a zamówienie powyżej 10 tysięcy zatwierdza kierownik.","urzad":"W urzędzie gminy decyzję o dodatku mieszkaniowym przygotowuje inspektor, a zatwierdza kierownik referatu. System nie pozwoli jednej osobie wykonać obu kroków ani wydać decyzji bez wymaganych pól, np. dochodu i powierzchni lokalu. Każde odrzucenie wniosku zostaje zapisane w historii sprawy.","it":"Praktyki DSS06 obejmują m.in. kontrolę przetwarzania informacji, role i uprawnienia, obsługę błędów i wyjątków oraz śledzenie zdarzeń. Ich skuteczność ocenia MEA02.","egz":"Słowa-klucze: kontrole aplikacyjne, kompletność i poprawność danych, rozdział obowiązków, autoryzacja transakcji, właściciel procesu biznesowego → DSS06. Ocena skuteczności całego systemu kontroli → MEA02. Podręcznik: „DSS06 Zarządzanie mechanizmami kontrolnymi procesów biznesowych”. Na egzaminie nazwa procesu może brzmieć inaczej niż w podręczniku. Egzamin PL tłumaczy po swojemu, często trybem rozkazującym (np. domena „Twórz, Nabywaj i Wdrażaj” zamiast „Budowanie, nabywanie i wdrażanie”). Egzaminacyjnej nazwy tego procesu nie potwierdziliśmy, dlatego rozpoznawaj go po kodzie i angielskim słowie kluczowym: Business Process Controls. Nie myl z: MEA02 Monitorowanie, ocena i oszacowanie systemu kontroli wewnętrznej – DSS06 to kontrola działająca w procesie, na bieżąco. MEA02 monitoruje i ocenia, czy cały system kontroli wewnętrznej (także kontrole z DSS06) jest skuteczny.; DSS05 Zarządzanie usługami bezpieczeństwa – DSS05 technicznie zarządza kontami i dostępem. DSS06 ustala, kto w procesie biznesowym może co robić i zatwierdzać.; Proces – Proces (aktywator) to zestaw praktyk. DSS06 to jeden z 37 procesów, który dba o kontrole w procesach biznesowych organizacji.","src":"COBIT 5: Enabling Processes, sekcja DSS06 — Process Description / Purpose / Practices"},"proc-mea03":{"t":"MEA03 Monitorowanie, ocena i oszacowanie zgodności z wymogami zewnętrznymi","eg":"MEA03 Monitorowanie, ocena i oszacowanie zgodności z wymogami zewnętrznymi","pd":"MEA03 Monitorowanie, ocena i oszacowanie zgodności z wymogami zewnętrznymi","en":"MEA03 Monitor, Evaluate and Assess Compliance with External Requirements","wyj":"Ustalasz, jakie przepisy i umowy z zewnątrz musisz spełniać, i sprawdzasz, czy naprawdę je spełniasz.\n\nIdentyfikowanie i ocenianie zgodności z zewnętrznymi wymaganiami prawnymi, regulacyjnymi i kontraktowymi.\n\nŻeby organizacja spełniała prawo, regulacje i umowy, które dotyczą IT. I żeby umiała to wykazać.","zycie":"Wynajmujesz mieszkanie. Sprawdzasz, co mówią przepisy (zgłoszenie najmu, podatek) i co jest w umowie z najemcą (kaucja, termin wypowiedzenia). Raz w roku sprawdzasz, czy wszystko się zgadza, zanim przyjdzie urząd skarbowy.","firma":"Sklep internetowy prowadzi listę przepisów, m.in. RODO i prawa konsumenta, a prawniczka co roku szuka luk.","urzad":"Przed kontrolą zgodności z rozporządzeniem w sprawie Krajowych Ram Interoperacyjności (KRI) informatyk gminy spisuje wymogi tego przepisu, m.in. dotyczące bezpieczeństwa informacji i szkoleń pracowników. Sprawdza, które z nich urząd już spełnia, a które nie. Listę braków przekazuje sekretarzowi gminy, który ustala terminy ich usunięcia.","it":"Praktyki MEA03: identyfikacja wymogów zewnętrznych, optymalizacja odpowiedzi na nie, potwierdzenie zgodności i uzyskanie zapewnienia. Przykład: wymogi RODO dla systemów z danymi osobowymi.","egz":"Słowa-klucze: prawo, regulacje, umowy, regulator, wymogi zewnętrzne, compliance → MEA03. Nasze mechanizmy kontrolne → MEA02. Nasze cele i ustalenia → MEA01. Podręcznik: „MEA03 Monitorowanie, ocena i oszacowanie zgodności z wymogami zewnętrznymi”. Na egzaminie nazwa procesu może brzmieć inaczej niż w podręczniku. Egzamin PL tłumaczy po swojemu, często trybem rozkazującym (np. domena „Twórz, Nabywaj i Wdrażaj” zamiast „Budowanie, nabywanie i wdrażanie”). Egzaminacyjnej nazwy tego procesu nie potwierdziliśmy, dlatego rozpoznawaj go po kodzie i angielskim słowie kluczowym: Compliance with External Requirements. Domena MEA na egzaminie to „Monitoruj, Oszacuj i Oceń”, więc nazwy procesów MEA mogą tam brzmieć np. trybem rozkazującym. „Zgodność” w MEA03 to compliance (prawo, regulacje, umowy), a nie conformance z MEA01. Nie myl z: MEA02 Monitorowanie, ocena i oszacowanie systemu kontroli wewnętrznej – MEA02 ocenia, czy działają nasze mechanizmy kontrolne. MEA03 rozpoznaje wymogi zewnętrzne i sprawdza, czy je spełniamy.; MEA01 Monitorowanie, ocena i oszacowanie wydajności i zgodności – MEA01: zgodność z uzgodnionymi celami i ustaleniami (conformance). MEA03: zgodność z wymogami zewnętrznymi (compliance).; Zasada 5: Oddzielenie Ładu od Zarządzania – Zasada 5 oddziela Ład od Zarządzania. MEA03 jest w Zarządzaniu, choć wytyczne co do zgodności wyznacza organ Ładu.","src":"COBIT 5: Enabling Processes, sekcja MEA03 — Process Description / Purpose / Practices"},"proc-mea02":{"t":"MEA02 Monitorowanie, ocena i oszacowanie systemu kontroli wewnętrznej","eg":"MEA02 Monitorowanie, ocena i oszacowanie systemu kontroli wewnętrznej","pd":"MEA02 Monitorowanie, ocena i oszacowanie systemu kontroli wewnętrznej","en":"MEA02 Monitor, Evaluate and Assess the System of Internal Control","wyj":"Sprawdzasz, czy wszystkie zabezpieczenia i zasady kontroli w organizacji naprawdę działają, a nie tylko są na papierze.\n\nOcena adekwatności i skuteczności systemu kontroli wewnętrznej oraz zapewnienia dotyczącego kontroli.\n\nŻeby wiedzieć, czy mechanizmy kontrolne naprawdę działają, a nie tylko istnieją na papierze. Słabości trzeba wykryć i naprawić.","zycie":"Masz w domu zasadę: gaz zakręcony przed wyjazdem, czujnik dymu sprawdzany co miesiąc. Raz w roku robisz przegląd: wciskasz test czujnika i odkrywasz, że bateria padła pół roku temu. Sprawdzasz, czy Twoje zabezpieczenia naprawdę działają.","firma":"Wspólnik biura rachunkowego co kwartał sprawdza drugi podpis na 20 losowych przelewach, a raz w roku przychodzi niezależny audytor.","urzad":"Audytor wewnętrzny starostwa raz w roku sprawdza, czy działają zasady nadawania i odbierania uprawnień do systemów. Bierze 20 losowych wniosków o uprawnienia i listę osób, które odeszły z pracy, i porównuje je z kontami w systemie. Znajduje dwa niezablokowane konta byłych pracowników i opisuje tę słabość w raporcie dla starosty.","it":"Praktyki MEA02 obejmują m.in. monitorowanie kontroli, samoocenę, raport o słabościach oraz planowanie i wykonanie przeglądów zapewnienia (assurance). Wykonawca przeglądu musi być niezależny i kompetentny.","egz":"Słowa-klucze: kontrola wewnętrzna, samoocena kontroli, skuteczność mechanizmów kontrolnych, audyt wewnętrzny, słabości kontroli → MEA02. FW-PL (s. 59): MEA02 pozwala dyrektorom oszacować, czy mechanizmy kontrolne pozwalają spełnić wymogi zgodności. Podręcznik: „MEA02 Monitorowanie, ocena i oszacowanie systemu kontroli wewnętrznej”. Na egzaminie nazwa procesu może brzmieć inaczej niż w podręczniku. Egzamin PL tłumaczy po swojemu, często trybem rozkazującym (np. domena „Twórz, Nabywaj i Wdrażaj” zamiast „Budowanie, nabywanie i wdrażanie”). Egzaminacyjnej nazwy tego procesu nie potwierdziliśmy, dlatego rozpoznawaj go po kodzie i angielskim słowie kluczowym: System of Internal Control. Domena MEA na egzaminie to „Monitoruj, Oszacuj i Oceń”, więc nazwy procesów MEA mogą tam brzmieć np. trybem rozkazującym. Nie myl z: DSS06 Zarządzanie mechanizmami kontrolnymi procesów biznesowych – DSS06 to mechanizm kontrolny działający w procesie biznesowym. MEA02 monitoruje i ocenia, czy takie mechanizmy (cały system kontroli wewnętrznej) są skuteczne.; MEA03 Monitorowanie, ocena i oszacowanie zgodności z wymogami zewnętrznymi – MEA03 sprawdza zgodność z wymogami zewnętrznymi (prawo, regulacje, umowy). MEA02 sprawdza, czy działają nasze własne mechanizmy kontrolne – także te, które mają zapewnić zgodność.; MEA01 Monitorowanie, ocena i oszacowanie wydajności i zgodności – MEA01 mierzy wyniki procesów względem celów. MEA02 ocenia kontrole, nie wyniki.","src":"COBIT 5: Enabling Processes, sekcja MEA02 — Process Description / Purpose / Practices"},"proc-dss03":{"t":"DSS03 Zarządzanie problemami","eg":"DSS03 Zarządzanie problemami","pd":"DSS03 Zarządzanie problemami","en":"DSS03 Manage Problems","wyj":"Gdy ta sama usterka wraca, szukasz jej prawdziwej przyczyny i usuwasz ją na dobre.\n\nIdentyfikowanie i zarządzanie przyczynami incydentów, znanymi błędami i obejściami, by ograniczać wpływ i nawroty.\n\nŻeby te same awarie nie wracały. Szukasz przyczyny źródłowej i usuwasz ją trwale.","zycie":"Bezpiecznik w łazience wybija trzeci raz w tygodniu. Zamiast znowu go podnosić, wołasz elektryka. Ten znajduje przyczynę: stara suszarka ma uszkodzony kabel. Wyrzucasz suszarkę i bezpiecznik przestaje wybijać.","firma":"Sklep odkrywa, że płatności padają w piątki przez cotygodniową kopię bazy, i przenosi kopię na noc.","urzad":"Starostwo widzi w rejestrze zgłoszeń, że system elektronicznego zarządzania dokumentacją (EZD) od trzech miesięcy zwalnia zawsze w tej samej filii, w drugim mieście powiatu. Zamiast co tydzień restartować komputery, informatyk szuka przyczyny i znajduje stary, przeciążony przełącznik sieciowy. Do czasu wymiany zapisuje obejście w rejestrze znanych błędów, a samą wymianę przeprowadza jako zaplanowaną zmianę.","it":"Praktyki DSS03: identyfikacja i klasyfikacja problemów, diagnoza, rejestr znanych błędów, rozwiązanie i proaktywne zarządzanie problemami. Trwała poprawka przechodzi przez BAI06.","egz":"Słowa-klucze: przyczyna źródłowa (root cause), znany błąd, obejście, powtarzające się incydenty, proaktywna analiza trendów → DSS03. Szybkie przywrócenie usługi → DSS02. Podręcznik: „DSS03 Zarządzanie problemami”. Na egzaminie nazwa procesu może brzmieć inaczej niż w podręczniku. Egzamin PL tłumaczy po swojemu, często trybem rozkazującym (np. domena „Twórz, Nabywaj i Wdrażaj” zamiast „Budowanie, nabywanie i wdrażanie”). Egzaminacyjnej nazwy tego procesu nie potwierdziliśmy, dlatego rozpoznawaj go po kodzie i angielskim słowie kluczowym: Manage Problems. Potoczne „mamy problem z systemem” zwykle oznacza incydent (DSS02). W COBIT „problem” to nieznana przyczyna jednego lub wielu incydentów. Nie myl z: DSS02 Zarządzanie zgłoszeniami serwisowymi i incydentami – DSS02 przywraca usługę szybko. DSS03 szuka przyczyny źródłowej i trwałego rozwiązania.; BAI06 Zarządzanie zmianami – DSS03 znajduje przyczynę i proponuje rozwiązanie. Samą poprawkę w systemie wprowadza się jako zmianę przez BAI06.; APO12 Zarządzanie ryzykiem – APO12 zarządza ryzykiem, czyli tym, co może się zdarzyć. DSS03 zajmuje się przyczynami tego, co już się zdarza albo zaraz zdarzy (incydenty).","src":"COBIT 5: Enabling Processes, sekcja DSS03 — Process Description / Purpose / Practices"},"proc-dss02":{"t":"DSS02 Zarządzanie zgłoszeniami serwisowymi i incydentami","eg":"DSS02 Zarządzanie zgłoszeniami serwisowymi i incydentami","pd":"DSS02 Zarządzanie zgłoszeniami serwisowymi i incydentami","en":"DSS02 Manage Service Requests and Incidents","wyj":"Gdy coś przestaje działać albo ktoś prosi o pomoc, szybko przywracasz działanie i załatwiasz prośbę.\n\nObsługa wniosków usługowych i incydentów, w tym rejestracja, diagnoza, przywrócenie usługi oraz raportowanie.\n\nŻeby po awarii szybko przywrócić normalne działanie usługi. I żeby prośby użytkowników były sprawnie załatwiane.","zycie":"W niedzielę wieczorem pada internet, a dziecko ma jutro lekcje zdalne. Restartujesz router i internet wraca. Nie wiesz, dlaczego padł, ale teraz najważniejsze, żeby działał. To obsługa incydentu.","firma":"Serwis zdalnie odblokowuje drukarkę w biurze księgowej, a tego samego dnia zakłada konto stażystce.","urzad":"Urzędniczka wydziału komunikacji w starostwie zgłasza, że nie może zalogować się do systemu elektronicznego zarządzania dokumentacją (EZD), a przy okienku czeka pięciu interesantów. Informatyk rejestruje zgłoszenie, nadaje mu wysoki priorytet i w 10 minut odblokowuje konto. Potem zamyka zgłoszenie z opisem, co zrobił.","it":"Praktyki DSS02 obejmują m.in. klasyfikację, rejestrację i priorytet, realizację zgłoszeń serwisowych, diagnozę i rozwiązanie incydentów oraz raporty.","egz":"Słowa-klucze: incydent, przywrócenie usługi, service desk, zgłoszenie, prośba użytkownika, eskalacja → DSS02. Przyczyna źródłowa, znany błąd, powtarzające się incydenty → DSS03. Podręcznik: „DSS02 Zarządzanie zgłoszeniami serwisowymi i incydentami”. Na egzaminie nazwa procesu może brzmieć inaczej niż w podręczniku. Egzamin PL tłumaczy po swojemu, często trybem rozkazującym (np. domena „Twórz, Nabywaj i Wdrażaj” zamiast „Budowanie, nabywanie i wdrażanie”). Egzaminacyjnej nazwy tego procesu nie potwierdziliśmy, dlatego rozpoznawaj go po kodzie i angielskim słowie kluczowym: Service Requests and Incidents. Nie myl z: DSS03 Zarządzanie problemami – DSS02 przywraca usługę szybko, nawet jeśli przyczyna jest nieznana. DSS03 szuka przyczyny źródłowej, żeby incydenty nie wracały.; DSS04 Zarządzanie ciągłością – DSS02 obsługuje zwykłe przerwy w usługach. DSS04 przygotowuje przetrwanie poważnego zakłócenia, gdy normalna obsługa nie wystarczy.; BAI06 Zarządzanie zmianami – Jeśli przywrócenie usługi wymaga zmiany w systemie, ta zmiana idzie ścieżką zmian awaryjnych BAI06.","src":"COBIT 5: Enabling Processes, sekcja DSS02 — Process Description / Purpose / Practices"},"proc-dss05":{"t":"DSS05 Zarządzanie usługami bezpieczeństwa","eg":"DSS05 Zarządzanie usługami bezpieczeństwa","pd":"DSS05 Zarządzanie usługami bezpieczeństwa","en":"DSS05 Manage Security Services","wyj":"Codzienna ochrona: antywirus, hasła, uprawnienia, zamknięte drzwi i pilnowanie, czy ktoś się nie włamuje.\n\nOperacyjne zapewnianie bezpieczeństwa usług, w tym dostępu, sieci, urządzeń, ochrony przed złośliwym kodem i monitorowania.\n\nŻeby na co dzień chronić informacje i trzymać ryzyko bezpieczeństwa na akceptowalnym poziomie, zgodnie z polityką bezpieczeństwa.","zycie":"Codziennie zamykasz drzwi na klucz, w telefonie masz blokadę ekranu, a w banku podwójne logowanie. Gdy dostajesz dziwnego SMS-a z linkiem, nie klikasz. Gdy zgubisz klucze, wymieniasz zamek. To codzienna ochrona.","firma":"W biurze rachunkowym administrator aktualizuje antywirusa, odbiera dostęp byłym pracownikom i przegląda logi.","urzad":"W starostwie informatyk nadaje uprawnienia do systemów tylko na podstawie wniosku podpisanego przez naczelnika wydziału. Gdy urzędnik odchodzi z pracy, kadry tego samego dnia zgłaszają to informatykowi, a ten blokuje konto i odbiera kartę wejścia do serwerowni. Codziennie rano informatyk przegląda ostrzeżenia zapory sieciowej i antywirusa.","it":"Praktyki DSS05: ochrona przed złośliwym oprogramowaniem, sieć, urządzenia końcowe, tożsamość i dostęp, dostęp fizyczny, dokumenty wrażliwe i monitorowanie zdarzeń.","egz":"APO13 = organizuje bezpieczeństwo (system zarządzania bezpieczeństwem). DSS05 = wykonuje ochronę (antywirus, konta, uprawnienia, monitorowanie). Ocena, czy kontrole działają → MEA02. Podręcznik: „DSS05 Zarządzanie usługami bezpieczeństwa”. Na egzaminie nazwa procesu może brzmieć inaczej niż w podręczniku. Egzamin PL tłumaczy po swojemu, często trybem rozkazującym (np. domena „Twórz, Nabywaj i Wdrażaj” zamiast „Budowanie, nabywanie i wdrażanie”). Egzaminacyjnej nazwy tego procesu nie potwierdziliśmy, dlatego rozpoznawaj go po kodzie i angielskim słowie kluczowym: Security Services. Nie myl z APO13 „Zarządzanie bezpieczeństwem” (Manage Security). Słowo „usługi” (services) w DSS05 wskazuje na codzienną, operacyjną ochronę. Nie myl z: APO13 Zarządzanie bezpieczeństwem – APO13 ustanawia, utrzymuje i doskonali system zarządzania bezpieczeństwem informacji (plan, zasady, organizacja). DSS05 realizuje ochronę na co dzień.; DSS06 Zarządzanie mechanizmami kontrolnymi procesów biznesowych – DSS06 ustala, kto w procesie biznesowym może co zatwierdzać (rozdział obowiązków). DSS05 technicznie zarządza tożsamością, kontami i dostępem.; Dostęp i Bezpieczeństwo – „Dostęp i bezpieczeństwo” to kategoria jakości informacji. DSS05 to proces, który na co dzień tę kategorię chroni.","src":"COBIT 5: Enabling Processes, sekcja DSS05 — Process Description / Purpose / Practices"},"proc-dss04":{"t":"DSS04 Zarządzanie ciągłością","eg":"DSS04 Zarządzanie ciągłością","pd":"DSS04 Zarządzanie ciągłością","en":"DSS04 Manage Continuity","wyj":"Masz plan na czarną godzinę: co robisz, gdy padnie wszystko, żeby najważniejsze sprawy dalej działały.\n\nUstanowienie i utrzymanie ciągłości działania oraz odtwarzania usług przy zakłóceniach, na podstawie potrzeb biznesu.\n\nŻeby najważniejsze sprawy działały nawet po poważnym zakłóceniu. Plan powstaje, zanim coś się stanie.","zycie":"Masz w szafce latarkę, zapas wody, powerbank i listę telefonów na kartce. Zapasowy klucz leży u sąsiada, a zdjęcia rodzinne mają kopię w chmurze. Raz w roku sprawdzasz, czy latarka świeci. To plan ciągłości w domowej skali.","firma":"Piekarnia ma agregat, papierowe zamówienia i umowę z drugą piekarnią, a raz w roku robi próbę.","urzad":"Urząd gminy trzyma kopię danych w drugim budynku, w szkole po drugiej stronie miasta, i ma papierowe wzory najważniejszych zaświadczeń. Raz w roku sekretarz gminy z informatykiem ćwiczą scenariusz „zalana serwerownia”: sprawdzają, w ile godzin da się wznowić wydawanie dokumentów. Po ćwiczeniu poprawiają plan, np. dopisują brakujące telefony do dostawców.","it":"Praktyki DSS04 obejmują m.in. strategię ciągłości, plan reagowania, testy planu, szkolenia, kopie zapasowe i przegląd po wznowieniu działania.","egz":"Słowa-klucze: ciągłość działania, plan awaryjny, odtwarzanie po katastrofie, kopie zapasowe, ćwiczenie planu, funkcje krytyczne → DSS04. Szczyt obciążenia → BAI04. Podręcznik: „DSS04 Zarządzanie ciągłością”. Na egzaminie nazwa procesu może brzmieć inaczej niż w podręczniku. Egzamin PL tłumaczy po swojemu, często trybem rozkazującym (np. domena „Twórz, Nabywaj i Wdrażaj” zamiast „Budowanie, nabywanie i wdrażanie”). Egzaminacyjnej nazwy tego procesu nie potwierdziliśmy, dlatego rozpoznawaj go po kodzie i angielskim słowie kluczowym: Manage Continuity. Nie myl z: BAI04 Zarządzanie dostępnością i pojemnością – BAI04 planuje dostępność i pojemność w zwykłym działaniu i w szczycie. DSS04 przygotowuje przetrwanie poważnego zakłócenia lub katastrofy.; DSS02 Zarządzanie zgłoszeniami serwisowymi i incydentami – DSS02 obsługuje zwykły incydent. Gdy zakłócenie jest tak poważne, że normalna obsługa nie wystarcza, uruchamia się plan z DSS04.; APO12 Zarządzanie ryzykiem – APO12 ocenia ryzyko, także ryzyko katastrofy. DSS04 przygotowuje konkretną odpowiedź na takie zdarzenie.","src":"COBIT 5: Enabling Processes, sekcja DSS04 — Process Description / Purpose / Practices"}},"S":[{"lekcje":["pr-k69-dss01-dss03","pr-k70-dss04-dss06"],"pt":"Lekcje 1.69–1.70","h":"DSS01–DSS06: codzienne działanie i ochrona","b":"<ul><li><b><w k=\"proc-dss01\">DSS01 Manage Operations</w></b>: koordynacja i wykonywanie codziennych czynności operacyjnych potrzebnych do dostarczania usług IT.</li><li><b><w k=\"proc-dss02\">DSS02 Manage Service Requests and Incidents</w></b>: obsługa wniosków usługowych i incydentów, w tym rejestracja, diagnoza, przywrócenie usługi oraz raportowanie.</li><li><b>DSS03 Manage Problems</b>: identyfikowanie i zarządzanie przyczynami incydentów, znanymi błędami i obejściami, by ograniczać wpływ i nawroty.</li><li><b>DSS04 Manage Continuity</b>: ustanowienie i utrzymanie ciągłości działania oraz odtwarzania usług przy zakłóceniach, na podstawie potrzeb biznesu.</li><li><b><w k=\"proc-dss05\">DSS05 Manage Security Services</w></b>: operacyjne zapewnianie bezpieczeństwa usług, w tym dostępu, sieci, urządzeń, ochrony przed złośliwym kodem i monitorowania.</li><li><b><w k=\"proc-dss06\">DSS06 Manage Business Process Controls</w></b>: definiowanie i utrzymanie kontroli w procesach biznesowych, aby zapewniać poprawne i uprawnione przetwarzanie informacji.</li></ul>","c":"Angielska nazwa i cel procesu rozstrzygają znaczenie. Polskie nazwy są opisowym przekładem kursu.","s":"ISACA, COBIT 5: Enabling Processes (2012), opisy DSS01, DSS02, DSS03, DSS04, DSS05, DSS06","ctx":"<p>Procesy dobieramy według celu i mandatu działania. Ich zakresy się stykają i współpracują; nie są rozłącznymi szufladkami.</p><p><b>DSS01:</b> Operatorzy wykonują zaplanowane zadania wsadowe, sprawdzają ich dzienniki i nadzorują codzienną pracę środowiska IT.</p><p><b>DSS02:</b> Helpdesk rejestruje przerwę w działaniu poczty, prowadzi wstępną diagnozę i przywraca usługę; przyjmuje też standardowe prośby użytkowników.</p><p><b>DSS03:</b> Po poważnej awarii zespół analizuje przyczynę źródłową, dokumentuje znany błąd i obejście oraz proponuje trwałe rozwiązanie.</p><p><b>DSS04:</b> Organizacja ustala wymagania ciągłości, przygotowuje i testuje plany odtworzenia oraz utrzymuje zdolność działania podczas zakłóceń.</p><p><b>DSS05:</b> Administratorzy blokują konto odchodzącego pracownika, utrzymują ochronę przed złośliwym kodem i analizują alerty bezpieczeństwa.</p><p><b>DSS06:</b> System wymaga drugiego zatwierdzenia dużego zwrotu i sprawdza kompletność oraz poprawność danych transakcji.</p>"},{"pt":"Sprawdź się","quiz":{"id":"q-fin-pliki-29","sylabus":["PR-02-06","PR-01-04"],"tresc":"Na posiedzeniu Rady ds. Informatyki dyrektor IT mówi: „Naszym priorytetem jest cel związany z Informatyką 04, czyli zarządzanie ryzykiem biznesowym związanym z IT. Skoro 04, to wdrażamy proces APO04”. Na czym polega błąd?","opcje":[{"t":"Numery celów i procesów to osobne katalogi; APO04 to Zarządzanie innowacjami.","ok":true,"w":"Cel 04 pochodzi z listy 17 celów związanych z Informatyką (Rysunek 6). APO04 pochodzi z listy 37 procesów (Rysunek 16). Procesy dla celu 04 odczytuje się dopiero z Rysunku 23, a i tak trzeba je dostosować do organizacji."},{"t":"Nic – numer celu związanego z Informatyką zawsze wskazuje proces APO o tym samym numerze.","ok":false,"w":"Takiej reguły nie ma. Na przykład APO13 wspiera w przykładzie 8 cele 02, 04, 06, 10, 14, 07 i 08, a nie cel 13."},{"t":"Cel 04 należy do wymiaru Klient karty IT BSC, więc trzeba wybrać proces z domeny DSS.","ok":false,"w":"Cel 04 należy do wymiaru Finanse (Rysunek 6). Wymiar karty wyników nie wskazuje domeny procesów."},{"t":"Wystarczy zamienić APO04 na APO12 Zarządzanie ryzykiem i na tym poprzestać, bo jeden proces wystarczy.","ok":false,"w":"Nazwa APO12 rzeczywiście dotyczy ryzyka. Ale cel związany z Informatyką wspiera wiele procesów i inne aktywatory, nie jeden proces."}],"src":"COBIT 5 Framework (EN), sekcja rozdział 2; załącznik C, rysunek 23","pomoc":{"t":"Pytanie dotyczy lekcji 1.69 „DSS01–DSS03: eksploatacja, incydenty i problemy”. Cel lekcji: Potrafię odróżnić codzienną eksploatację (DSS01), szybkie przywracanie usługi (DSS02) i usuwanie przyczyny (DSS03).","k":["proc-dss01","proc-dss02","proc-dss03"]},"kurs":"Cel 04 pochodzi z listy 17 celów związanych z Informatyką (Rysunek 6). APO04 pochodzi z listy 37 procesów (Rysunek 16). Procesy dla celu 04 odczytuje się dopiero z Rysunku 23, a i tak trzeba je dostosować do organizacji.","kontekst":""}},{"pt":"Sprawdź się","quiz":{"id":"q-fin-pliki-29","sylabus":["PR-02-06","PR-01-04"],"tresc":"Na posiedzeniu Rady ds. Informatyki dyrektor IT mówi: „Naszym priorytetem jest cel związany z Informatyką 04, czyli zarządzanie ryzykiem biznesowym związanym z IT. Skoro 04, to wdrażamy proces APO04”. Na czym polega błąd?","opcje":[{"t":"Nic – numer celu związanego z Informatyką zawsze wskazuje proces APO o tym samym numerze.","ok":false,"w":"Takiej reguły nie ma. Na przykład APO13 wspiera w przykładzie 8 cele 02, 04, 06, 10, 14, 07 i 08, a nie cel 13."},{"t":"Numery celów i procesów to osobne katalogi; APO04 to Zarządzanie innowacjami.","ok":true,"w":"Cel 04 pochodzi z listy 17 celów związanych z Informatyką (Rysunek 6). APO04 pochodzi z listy 37 procesów (Rysunek 16). Procesy dla celu 04 odczytuje się dopiero z Rysunku 23, a i tak trzeba je dostosować do organizacji."},{"t":"Cel 04 należy do wymiaru Klient karty IT BSC, więc trzeba wybrać proces z domeny DSS.","ok":false,"w":"Cel 04 należy do wymiaru Finanse (Rysunek 6). Wymiar karty wyników nie wskazuje domeny procesów."},{"t":"Wystarczy zamienić APO04 na APO12 Zarządzanie ryzykiem i na tym poprzestać, bo jeden proces wystarczy.","ok":false,"w":"Nazwa APO12 rzeczywiście dotyczy ryzyka. Ale cel związany z Informatyką wspiera wiele procesów i inne aktywatory, nie jeden proces."}],"src":"COBIT 5 Framework (EN), sekcja rozdział 2; załącznik C, rysunek 23","pomoc":{"t":"Pytanie dotyczy lekcji 1.70 „DSS04–DSS06: ciągłość, usługi bezpieczeństwa i mechanizmy kontrolne procesów”. Cel lekcji: Potrafię odróżnić ciągłość (DSS04) od pojemności (BAI04), codzienną ochronę (DSS05) od systemu bezpieczeństwa (APO13) i kontrole w procesie (DSS06) od ich oceny (MEA02).","k":["proc-dss04","proc-dss05","proc-dss06"]},"kurs":"Cel 04 pochodzi z listy 17 celów związanych z Informatyką (Rysunek 6). APO04 pochodzi z listy 37 procesów (Rysunek 16). Procesy dla celu 04 odczytuje się dopiero z Rysunku 23, a i tak trzeba je dostosować do organizacji.","kontekst":""}},{"lekcje":["pr-k71-mea01-mea03"],"pt":"Lekcja 1.71","h":"MEA01–MEA03: co sprawdzamy – wyniki, kontrole czy wymogi z zewnątrz","b":"<ul><li><b><w k=
