<script>window.DECK={"id":"k-pr-atlas-dss-mea","rozdzial":"Rozdział 6 · Zasada 5: Oddzielenie Ładu od Zarządzania · s. 31–33","tytul":"Atlas procesów: DSS i MEA","prev":"k-pr-atlas-bai.html","next":"k-im-kontekst.html","T":{"proc-mea01":{"t":"MEA01 Monitorowanie, ocena i oszacowanie wydajności i zgodności","eg":"MEA01 Monitorowanie, ocena i oszacowanie wydajności i zgodności","pd":"MEA01 Monitorowanie, ocena i oszacowanie wydajności i zgodności","en":"MEA01 Monitor, Evaluate and Assess Performance and Conformance","wyj":"Zbierasz liczby o tym, jak idzie praca, porównujesz je z celami i raportujesz, co trzeba poprawić.\n\nUstalasz podejście do monitorowania i cele. Zbierasz dane, analizujesz je i raportujesz. Pilnujesz, żeby działania korygujące zostały wykonane.\n\nŻeby wiedzieć, czy procesy osiągają cele wydajności i zgodności. I żeby szybko uruchomić poprawki.","zycie":"Postanowiłeś schudnąć 5 kg do wakacji. Co niedzielę stajesz na wadze i zapisujesz wynik w tabelce. Gdy przez dwa tygodnie waga stoi, zmieniasz plan treningów. Mierzenie, porównywanie z celem i korekta to MEA01.","firma":"Kierowniczka sklepu co tydzień porównuje czas wysyłki i zwroty z celami i zleca poprawki.","urzad":"Sekretarz gminy ustala cel: 95% spraw załatwionych w ustawowym terminie. Co kwartał zbiera dane z systemu obiegu dokumentów, porównuje je z celem i raportuje wójtowi, w których referatach są zaległości. Proponuje działania, np. zastępstwo w referacie podatków, i po kolejnym kwartale sprawdza, czy pomogły.","it":"Praktyki MEA01: podejście do monitorowania, cele wydajności i zgodności, zbieranie danych, analiza i raport oraz działania korygujące. Raporty trafiają do Ładu, który monitoruje w EDM.","egz":"Słowa-klucze: mierniki, cele wydajności, raportowanie wyników, działania korygujące → MEA01. Kto mierzy i raportuje → MEA01 (Zarządzanie). Kto ocenia raport względem kierunku → EDM (Ład). „Zgodność” w MEA01 to conformance, a w MEA03 compliance. Podręcznik: „MEA01 Monitorowanie, ocena i oszacowanie wydajności i zgodności”. Na egzaminie nazwa procesu może brzmieć inaczej niż w podręczniku. Egzamin PL tłumaczy po swojemu, często trybem rozkazującym (np. domena „Twórz, Nabywaj i Wdrażaj” zamiast „Budowanie, nabywanie i wdrażanie”). Egzaminacyjnej nazwy tego procesu nie potwierdziliśmy, dlatego rozpoznawaj go po kodzie i angielskim słowie kluczowym: Performance and Conformance. Domena MEA na egzaminie to „Monitoruj, Oszacuj i Oceń”, więc nazwy procesów MEA mogą tam brzmieć np. trybem rozkazującym. Uwaga na słowo „zgodność”: w MEA01 to conformance (zgodność z uzgodnionymi celami i ustaleniami), a w MEA03 to compliance (zgodność z wymogami zewnętrznymi). Nie myl z: Oszacuj, Kieruj i Monitoruj (EDM) – MEA01 to Zarządzanie: kierownictwo mierzy, ocenia i raportuje. „Monitoruj” w EDM to Ład: organ Ładu sprawdza na podstawie tych raportów, czy kierunek został wcielony w życie.; MEA03 Monitorowanie, ocena i oszacowanie zgodności z wymogami zewnętrznymi – MEA01 sprawdza wydajność i zgodność z uzgodnionymi celami i ustaleniami (conformance). MEA03 – zgodność z wymogami zewnętrznymi: prawem, regulacjami, umowami (compliance).; MEA02 Monitorowanie, ocena i oszacowanie systemu kontroli wewnętrznej – MEA01 mierzy wyniki procesów. MEA02 ocenia, czy działają mechanizmy kontroli wewnętrznej.","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; COBIT 5 Framework (PL), s. 59; COBIT 5 Framework (PL), s. 32; COBIT 5 Framework (PL), s. 88, Ilustracja 39"},"proc-dss05":{"t":"DSS05 Zarządzanie usługami bezpieczeństwa","eg":"DSS05 Zarządzanie usługami bezpieczeństwa","pd":"DSS05 Zarządzanie usługami bezpieczeństwa","en":"DSS05 Manage Security Services","wyj":"Codzienna ochrona: antywirus, hasła, uprawnienia, zamknięte drzwi i pilnowanie, czy ktoś się nie włamuje.\n\nChronisz przed złośliwym oprogramowaniem, zabezpieczasz sieć i urządzenia końcowe. Zarządzasz tożsamością oraz dostępem logicznym i fizycznym. Monitorujesz infrastrukturę pod kątem zdarzeń bezpieczeństwa.\n\nŻeby na co dzień chronić informacje i trzymać ryzyko bezpieczeństwa na akceptowalnym poziomie, zgodnie z polityką bezpieczeństwa.","zycie":"Codziennie zamykasz drzwi na klucz, w telefonie masz blokadę ekranu, a w banku podwójne logowanie. Gdy dostajesz dziwnego SMS-a z linkiem, nie klikasz. Gdy zgubisz klucze, wymieniasz zamek. To codzienna ochrona.","firma":"W biurze rachunkowym administrator aktualizuje antywirusa, odbiera dostęp byłym pracownikom i przegląda logi.","urzad":"W starostwie informatyk nadaje uprawnienia do systemów tylko na podstawie wniosku podpisanego przez naczelnika wydziału. Gdy urzędnik odchodzi z pracy, kadry tego samego dnia zgłaszają to informatykowi, a ten blokuje konto i odbiera kartę wejścia do serwerowni. Codziennie rano informatyk przegląda ostrzeżenia zapory sieciowej i antywirusa.","it":"Praktyki DSS05: ochrona przed złośliwym oprogramowaniem, sieć, urządzenia końcowe, tożsamość i dostęp, dostęp fizyczny, dokumenty wrażliwe i monitorowanie zdarzeń.","egz":"APO13 = organizuje bezpieczeństwo (system zarządzania bezpieczeństwem). DSS05 = wykonuje ochronę (antywirus, konta, uprawnienia, monitorowanie). Ocena, czy kontrole działają → MEA02. Podręcznik: „DSS05 Zarządzanie usługami bezpieczeństwa”. Na egzaminie nazwa procesu może brzmieć inaczej niż w podręczniku. Egzamin PL tłumaczy po swojemu, często trybem rozkazującym (np. domena „Twórz, Nabywaj i Wdrażaj” zamiast „Budowanie, nabywanie i wdrażanie”). Egzaminacyjnej nazwy tego procesu nie potwierdziliśmy, dlatego rozpoznawaj go po kodzie i angielskim słowie kluczowym: Security Services. Nie myl z APO13 „Zarządzanie bezpieczeństwem” (Manage Security). Słowo „usługi” (services) w DSS05 wskazuje na codzienną, operacyjną ochronę. Nie myl z: APO13 Zarządzanie bezpieczeństwem – APO13 ustanawia, utrzymuje i doskonali system zarządzania bezpieczeństwem informacji (plan, zasady, organizacja). DSS05 realizuje ochronę na co dzień.; DSS06 Zarządzanie mechanizmami kontrolnymi procesów biznesowych – DSS06 ustala, kto w procesie biznesowym może co zatwierdzać (rozdział obowiązków). DSS05 technicznie zarządza tożsamością, kontami i dostępem.; Dostęp i Bezpieczeństwo – „Dostęp i bezpieczeństwo” to kategoria jakości informacji. DSS05 to proces, który na co dzień tę kategorię chroni.","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; COBIT 5 Framework (PL), s. 88, Ilustracja 39; COBIT 5 Framework (PL), s. 60"},"proc-dss06":{"t":"DSS06 Zarządzanie mechanizmami kontrolnymi procesów biznesowych","eg":"DSS06 Zarządzanie mechanizmami kontrolnymi procesów biznesowych","pd":"DSS06 Zarządzanie mechanizmami kontrolnymi procesów biznesowych","en":"DSS06 Manage Business Process Controls","wyj":"Wbudowane w codzienną pracę zabezpieczenia, które pilnują, żeby dane były kompletne, poprawne i zatwierdzone przez właściwą osobę.\n\nDopasowujesz mechanizmy kontrolne do celów organizacji. Kontrolujesz przetwarzanie informacji i rozdzielasz role oraz uprawnienia. Obsługujesz błędy i wyjątki, zapewniasz ślad działań i chronisz zasoby informacyjne.\n\nŻeby dane w procesach biznesowych były kompletne, poprawne i zatwierdzone przez właściwą osobę. Kontrola jest wbudowana w codzienną pracę.","zycie":"W domowym budżecie ustaliliście: przelew powyżej 1000 zł wymaga zgody drugiej osoby, a każdy paragon ląduje w pudełku. Bank sam blokuje przelew, jeśli brakuje numeru konta. Te zabezpieczenia działają w trakcie wydawania pieniędzy, a nie po fakcie.","firma":"Hurtownia nie przyjmie faktury bez numeru zamówienia, a zamówienie powyżej 10 tysięcy zatwierdza kierownik.","urzad":"W urzędzie gminy decyzję o dodatku mieszkaniowym przygotowuje inspektor, a zatwierdza kierownik referatu. System nie pozwoli jednej osobie wykonać obu kroków ani wydać decyzji bez wymaganych pól, np. dochodu i powierzchni lokalu. Każde odrzucenie wniosku zostaje zapisane w historii sprawy.","it":"Praktyki DSS06 obejmują m.in. kontrolę przetwarzania informacji, role i uprawnienia, obsługę błędów i wyjątków oraz śledzenie zdarzeń. Ich skuteczność ocenia MEA02.","egz":"Słowa-klucze: kontrole aplikacyjne, kompletność i poprawność danych, rozdział obowiązków, autoryzacja transakcji, właściciel procesu biznesowego → DSS06. Ocena skuteczności całego systemu kontroli → MEA02. Podręcznik: „DSS06 Zarządzanie mechanizmami kontrolnymi procesów biznesowych”. Na egzaminie nazwa procesu może brzmieć inaczej niż w podręczniku. Egzamin PL tłumaczy po swojemu, często trybem rozkazującym (np. domena „Twórz, Nabywaj i Wdrażaj” zamiast „Budowanie, nabywanie i wdrażanie”). Egzaminacyjnej nazwy tego procesu nie potwierdziliśmy, dlatego rozpoznawaj go po kodzie i angielskim słowie kluczowym: Business Process Controls. Nie myl z: MEA02 Monitorowanie, ocena i oszacowanie systemu kontroli wewnętrznej – DSS06 to kontrola działająca w procesie, na bieżąco. MEA02 monitoruje i ocenia, czy cały system kontroli wewnętrznej (także kontrole z DSS06) jest skuteczny.; DSS05 Zarządzanie usługami bezpieczeństwa – DSS05 technicznie zarządza kontami i dostępem. DSS06 ustala, kto w procesie biznesowym może co robić i zatwierdzać.; Proces – Proces (aktywator) to zestaw praktyk. DSS06 to jeden z 37 procesów, który dba o kontrole w procesach biznesowych organizacji.","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; COBIT 5 Framework (PL), s. 89; COBIT 5 Framework (PL), s. 76, Ilustracja 33"},"proc-mea02":{"t":"MEA02 Monitorowanie, ocena i oszacowanie systemu kontroli wewnętrznej","eg":"MEA02 Monitorowanie, ocena i oszacowanie systemu kontroli wewnętrznej","pd":"MEA02 Monitorowanie, ocena i oszacowanie systemu kontroli wewnętrznej","en":"MEA02 Monitor, Evaluate and Assess the System of Internal Control","wyj":"Sprawdzasz, czy wszystkie zabezpieczenia i zasady kontroli w organizacji naprawdę działają, a nie tylko są na papierze.\n\nMonitorujesz kontrole wewnętrzne i przeglądasz skuteczność kontroli w procesach. Prowadzisz samooceny i zgłaszasz słabości. Planujesz i prowadzisz niezależne przeglądy, np. audyt.\n\nŻeby wiedzieć, czy mechanizmy kontrolne naprawdę działają, a nie tylko istnieją na papierze. Słabości trzeba wykryć i naprawić.","zycie":"Masz w domu zasadę: gaz zakręcony przed wyjazdem, czujnik dymu sprawdzany co miesiąc. Raz w roku robisz przegląd: wciskasz test czujnika i odkrywasz, że bateria padła pół roku temu. Sprawdzasz, czy Twoje zabezpieczenia naprawdę działają.","firma":"Wspólnik biura rachunkowego co kwartał sprawdza drugi podpis na 20 losowych przelewach, a raz w roku przychodzi niezależny audytor.","urzad":"Audytor wewnętrzny starostwa raz w roku sprawdza, czy działają zasady nadawania i odbierania uprawnień do systemów. Bierze 20 losowych wniosków o uprawnienia i listę osób, które odeszły z pracy, i porównuje je z kontami w systemie. Znajduje dwa niezablokowane konta byłych pracowników i opisuje tę słabość w raporcie dla starosty.","it":"Praktyki MEA02 obejmują m.in. monitorowanie kontroli, samoocenę, raport o słabościach oraz planowanie i wykonanie przeglądów zapewnienia (assurance). Wykonawca przeglądu musi być niezależny i kompetentny.","egz":"Słowa-klucze: kontrola wewnętrzna, samoocena kontroli, skuteczność mechanizmów kontrolnych, audyt wewnętrzny, słabości kontroli → MEA02. FW-PL (s. 59): MEA02 pozwala dyrektorom oszacować, czy mechanizmy kontrolne pozwalają spełnić wymogi zgodności. Podręcznik: „MEA02 Monitorowanie, ocena i oszacowanie systemu kontroli wewnętrznej”. Na egzaminie nazwa procesu może brzmieć inaczej niż w podręczniku. Egzamin PL tłumaczy po swojemu, często trybem rozkazującym (np. domena „Twórz, Nabywaj i Wdrażaj” zamiast „Budowanie, nabywanie i wdrażanie”). Egzaminacyjnej nazwy tego procesu nie potwierdziliśmy, dlatego rozpoznawaj go po kodzie i angielskim słowie kluczowym: System of Internal Control. Domena MEA na egzaminie to „Monitoruj, Oszacuj i Oceń”, więc nazwy procesów MEA mogą tam brzmieć np. trybem rozkazującym. Nie myl z: DSS06 Zarządzanie mechanizmami kontrolnymi procesów biznesowych – DSS06 to mechanizm kontrolny działający w procesie biznesowym. MEA02 monitoruje i ocenia, czy takie mechanizmy (cały system kontroli wewnętrznej) są skuteczne.; MEA03 Monitorowanie, ocena i oszacowanie zgodności z wymogami zewnętrznymi – MEA03 sprawdza zgodność z wymogami zewnętrznymi (prawo, regulacje, umowy). MEA02 sprawdza, czy działają nasze własne mechanizmy kontrolne – także te, które mają zapewnić zgodność.; MEA01 Monitorowanie, ocena i oszacowanie wydajności i zgodności – MEA01 mierzy wyniki procesów względem celów. MEA02 ocenia kontrole, nie wyniki.","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; COBIT 5 Framework (PL), s. 59; COBIT 5 Framework (PL), s. 93; COBIT 5 Framework (PL), s. 88, Ilustracja 39"},"proc-mea03":{"t":"MEA03 Monitorowanie, ocena i oszacowanie zgodności z wymogami zewnętrznymi","eg":"MEA03 Monitorowanie, ocena i oszacowanie zgodności z wymogami zewnętrznymi","pd":"MEA03 Monitorowanie, ocena i oszacowanie zgodności z wymogami zewnętrznymi","en":"MEA03 Monitor, Evaluate and Assess Compliance with External Requirements","wyj":"Ustalasz, jakie przepisy i umowy z zewnątrz musisz spełniać, i sprawdzasz, czy naprawdę je spełniasz.\n\nRozpoznajesz wymogi zewnętrzne: prawo, regulacje, umowy. Dostosowujesz do nich polityki i procesy. Potwierdzasz zgodność, uzyskujesz na nią zapewnienie i raportujesz wynik.\n\nŻeby organizacja spełniała prawo, regulacje i umowy, które dotyczą IT. I żeby umiała to wykazać.","zycie":"Wynajmujesz mieszkanie. Sprawdzasz, co mówią przepisy (zgłoszenie najmu, podatek) i co jest w umowie z najemcą (kaucja, termin wypowiedzenia). Raz w roku sprawdzasz, czy wszystko się zgadza, zanim przyjdzie urząd skarbowy.","firma":"Sklep internetowy prowadzi listę przepisów, m.in. RODO i prawa konsumenta, a prawniczka co roku szuka luk.","urzad":"Przed kontrolą zgodności z rozporządzeniem w sprawie Krajowych Ram Interoperacyjności (KRI) informatyk gminy spisuje wymogi tego przepisu, m.in. dotyczące bezpieczeństwa informacji i szkoleń pracowników. Sprawdza, które z nich urząd już spełnia, a które nie. Listę braków przekazuje sekretarzowi gminy, który ustala terminy ich usunięcia.","it":"Praktyki MEA03: identyfikacja wymogów zewnętrznych, optymalizacja odpowiedzi na nie, potwierdzenie zgodności i uzyskanie zapewnienia. Przykład: wymogi RODO dla systemów z danymi osobowymi.","egz":"Słowa-klucze: prawo, regulacje, umowy, regulator, wymogi zewnętrzne, compliance → MEA03. Nasze mechanizmy kontrolne → MEA02. Nasze cele i ustalenia → MEA01. Podręcznik: „MEA03 Monitorowanie, ocena i oszacowanie zgodności z wymogami zewnętrznymi”. Na egzaminie nazwa procesu może brzmieć inaczej niż w podręczniku. Egzamin PL tłumaczy po swojemu, często trybem rozkazującym (np. domena „Twórz, Nabywaj i Wdrażaj” zamiast „Budowanie, nabywanie i wdrażanie”). Egzaminacyjnej nazwy tego procesu nie potwierdziliśmy, dlatego rozpoznawaj go po kodzie i angielskim słowie kluczowym: Compliance with External Requirements. Domena MEA na egzaminie to „Monitoruj, Oszacuj i Oceń”, więc nazwy procesów MEA mogą tam brzmieć np. trybem rozkazującym. „Zgodność” w MEA03 to compliance (prawo, regulacje, umowy), a nie conformance z MEA01. Nie myl z: MEA02 Monitorowanie, ocena i oszacowanie systemu kontroli wewnętrznej – MEA02 ocenia, czy działają nasze mechanizmy kontrolne. MEA03 rozpoznaje wymogi zewnętrzne i sprawdza, czy je spełniamy.; MEA01 Monitorowanie, ocena i oszacowanie wydajności i zgodności – MEA01: zgodność z uzgodnionymi celami i ustaleniami (conformance). MEA03: zgodność z wymogami zewnętrznymi (compliance).; Zasada 5: Oddzielenie Ładu od Zarządzania – Zasada 5 oddziela Ład od Zarządzania. MEA03 jest w Zarządzaniu, choć wytyczne co do zgodności wyznacza organ Ładu.","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; COBIT 5 Framework (PL), s. 59; COBIT 5 Framework (PL), s. 76, Ilustracja 33"},"proc-dss03":{"t":"DSS03 Zarządzanie problemami","eg":"DSS03 Zarządzanie problemami","pd":"DSS03 Zarządzanie problemami","en":"DSS03 Manage Problems","wyj":"Gdy ta sama usterka wraca, szukasz jej prawdziwej przyczyny i usuwasz ją na dobre.\n\nRozpoznajesz i klasyfikujesz problemy, a potem badasz ich przyczyny źródłowe. Zapisujesz znane błędy i obejścia. Rozwiązujesz i zamykasz problem, a najlepiej wykrywasz go, zanim wywoła incydent.\n\nŻeby te same awarie nie wracały. Szukasz przyczyny źródłowej i usuwasz ją trwale.","zycie":"Bezpiecznik w łazience wybija trzeci raz w tygodniu. Zamiast znowu go podnosić, wołasz elektryka. Ten znajduje przyczynę: stara suszarka ma uszkodzony kabel. Wyrzucasz suszarkę i bezpiecznik przestaje wybijać.","firma":"Sklep odkrywa, że płatności padają w piątki przez cotygodniową kopię bazy, i przenosi kopię na noc.","urzad":"Starostwo widzi w rejestrze zgłoszeń, że system elektronicznego zarządzania dokumentacją (EZD) od trzech miesięcy zwalnia zawsze w tej samej filii, w drugim mieście powiatu. Zamiast co tydzień restartować komputery, informatyk szuka przyczyny i znajduje stary, przeciążony przełącznik sieciowy. Do czasu wymiany zapisuje obejście w rejestrze znanych błędów, a samą wymianę przeprowadza jako zaplanowaną zmianę.","it":"Praktyki DSS03: identyfikacja i klasyfikacja problemów, diagnoza, rejestr znanych błędów, rozwiązanie i proaktywne zarządzanie problemami. Trwała poprawka przechodzi przez BAI06.","egz":"Słowa-klucze: przyczyna źródłowa (root cause), znany błąd, obejście, powtarzające się incydenty, proaktywna analiza trendów → DSS03. Szybkie przywrócenie usługi → DSS02. Podręcznik: „DSS03 Zarządzanie problemami”. Na egzaminie nazwa procesu może brzmieć inaczej niż w podręczniku. Egzamin PL tłumaczy po swojemu, często trybem rozkazującym (np. domena „Twórz, Nabywaj i Wdrażaj” zamiast „Budowanie, nabywanie i wdrażanie”). Egzaminacyjnej nazwy tego procesu nie potwierdziliśmy, dlatego rozpoznawaj go po kodzie i angielskim słowie kluczowym: Manage Problems. Potoczne „mamy problem z systemem” zwykle oznacza incydent (DSS02). W COBIT „problem” to nieznana przyczyna jednego lub wielu incydentów. Nie myl z: DSS02 Zarządzanie zgłoszeniami serwisowymi i incydentami – DSS02 przywraca usługę szybko. DSS03 szuka przyczyny źródłowej i trwałego rozwiązania.; BAI06 Zarządzanie zmianami – DSS03 znajduje przyczynę i proponuje rozwiązanie. Samą poprawkę w systemie wprowadza się jako zmianę przez BAI06.; APO12 Zarządzanie ryzykiem – APO12 zarządza ryzykiem, czyli tym, co może się zdarzyć. DSS03 zajmuje się przyczynami tego, co już się zdarza albo zaraz zdarzy (incydenty).","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; COBIT 5 Framework (PL), s. 88, Ilustracja 39; COBIT 5 Framework (PL), s. 60"},"zarzadzanie":{"t":"Zarządzanie","eg":"Zarządzanie","pd":"Zarządzanie","en":"Management","wyj":"Kierownicy planują i wykonują pracę w kierunku, który wyznaczyło szefostwo.\n\nKierownictwo pod przewodnictwem CEO planuje, tworzy, wykonuje i monitoruje działania (Plan, Build, Run, Monitor) zgodnie z kierunkiem wskazanym przez Ład. W COBIT 5 to cztery domeny: APO, BAI, DSS i MEA, razem 32 procesy. Wyniki i informacje zwrotne wracają do Ładu, który je ocenia i w razie potrzeby koryguje kierunek.\n\nŻeby kierunek wyznaczony przez Ład zamienić w zaplanowaną, wykonaną i sprawdzoną pracę, która prowadzi do celów organizacji.","zycie":"Rodzina ustaliła: „oszczędzamy na wakacje” (to Ład). Ty robisz plan zakupów, porównujesz ceny, co miesiąc przelewasz 1000 zł na lokatę i sprawdzasz, czy kwota rośnie. Ta codzienna robota to Zarządzanie.","firma":"Właściciel restauracji ustalił, że w weekendy ma być nowe menu. Kierownik zmiany układa grafik, zamawia towar, pilnuje jakości dań i w poniedziałek raportuje właścicielowi, jak poszło. Praca kierownika to Zarządzanie.","urzad":"Wójt zdecydował, że mieszkańcy mają załatwiać sprawy przez internet. Sekretarz gminy i kierownik informatyki planują projekt, wybierają dostawcę, wdrażają e-usługi i co miesiąc raportują wójtowi. Ich praca to Zarządzanie.","it":"W dziale IT szpitala APO09 (Zarządzanie umowami o świadczenie usług) planuje poziomy usług, BAI03 (Zarządzanie identyfikacją i budowaniem rozwiązań) buduje nowy moduł rejestracji, DSS01 (Zarządzanie eksploatacją) utrzymuje go w ruchu, a MEA01 (Monitorowanie, ocena i oszacowanie wydajności i zgodności) mierzy wyniki i raportuje je do Ładu.","egz":"Zarządzanie działa zgodnie z kierunkiem wyznaczonym przez organ Ładu, aby osiągnąć cele organizacji (definicja, s. 31). Nie myl z: Ład – Ład ocenia, kieruje i monitoruje; Zarządzanie planuje, tworzy, wykonuje i monitoruje. Oba „monitorują”, ale Ład monitoruje kierunek i cele, a Zarządzanie – realizację działań.","src":"COBIT 5 Framework (PL), s. 92; COBIT 5 Framework (PL), s. 14"},"proc-dss02":{"t":"DSS02 Zarządzanie zgłoszeniami serwisowymi i incydentami","eg":"DSS02 Zarządzanie zgłoszeniami serwisowymi i incydentami","pd":"DSS02 Zarządzanie zgłoszeniami serwisowymi i incydentami","en":"DSS02 Manage Service Requests and Incidents","wyj":"Gdy coś przestaje działać albo ktoś prosi o pomoc, szybko przywracasz działanie i załatwiasz prośbę.\n\nRejestrujesz, klasyfikujesz i priorytetyzujesz zgłoszenia oraz incydenty. Diagnozujesz, rozwiązujesz i przywracasz usługę. Zamykasz sprawę i raportujesz jej status.\n\nŻeby po awarii szybko przywrócić normalne działanie usługi. I żeby prośby użytkowników były sprawnie załatwiane.","zycie":"W niedzielę wieczorem pada internet, a dziecko ma jutro lekcje zdalne. Restartujesz router i internet wraca. Nie wiesz, dlaczego padł, ale teraz najważniejsze, żeby działał. To obsługa incydentu.","firma":"Serwis zdalnie odblokowuje drukarkę w biurze księgowej, a tego samego dnia zakłada konto stażystce.","urzad":"Urzędniczka wydziału komunikacji w starostwie zgłasza, że nie może zalogować się do systemu elektronicznego zarządzania dokumentacją (EZD), a przy okienku czeka pięciu interesantów. Informatyk rejestruje zgłoszenie, nadaje mu wysoki priorytet i w 10 minut odblokowuje konto. Potem zamyka zgłoszenie z opisem, co zrobił.","it":"Praktyki DSS02 obejmują m.in. klasyfikację, rejestrację i priorytet, realizację zgłoszeń serwisowych, diagnozę i rozwiązanie incydentów oraz raporty.","egz":"Słowa-klucze: incydent, przywrócenie usługi, service desk, zgłoszenie, prośba użytkownika, eskalacja → DSS02. Przyczyna źródłowa, znany błąd, powtarzające się incydenty → DSS03. Podręcznik: „DSS02 Zarządzanie zgłoszeniami serwisowymi i incydentami”. Na egzaminie nazwa procesu może brzmieć inaczej niż w podręczniku. Egzamin PL tłumaczy po swojemu, często trybem rozkazującym (np. domena „Twórz, Nabywaj i Wdrażaj” zamiast „Budowanie, nabywanie i wdrażanie”). Egzaminacyjnej nazwy tego procesu nie potwierdziliśmy, dlatego rozpoznawaj go po kodzie i angielskim słowie kluczowym: Service Requests and Incidents. Nie myl z: DSS03 Zarządzanie problemami – DSS02 przywraca usługę szybko, nawet jeśli przyczyna jest nieznana. DSS03 szuka przyczyny źródłowej, żeby incydenty nie wracały.; DSS04 Zarządzanie ciągłością – DSS02 obsługuje zwykłe przerwy w usługach. DSS04 przygotowuje przetrwanie poważnego zakłócenia, gdy normalna obsługa nie wystarczy.; BAI06 Zarządzanie zmianami – Jeśli przywrócenie usługi wymaga zmiany w systemie, ta zmiana idzie ścieżką zmian awaryjnych BAI06.","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; COBIT 5 Framework (PL), s. 88, Ilustracja 39; COBIT 5 Framework (PL), s. 60"},"it-problem":{"t":"Problem","eg":"Problem","pd":"problem","en":"Problem","wyj":"Ukryta przyczyna awarii, która sprawia, że te same kłopoty wracają.\n\nKtoś zauważa, że incydenty się powtarzają albo jeden był bardzo poważny. Otwiera się problem. Specjaliści zbierają fakty i szukają przyczyny. Gdy ją znajdą, planują jej usunięcie.\n\nŻeby nie gasić w kółko tych samych awarii, tylko usunąć ich źródło.","zycie":"Co zimę zamarza Ci rura w garażu. Za każdym razem ją rozmrażasz (incydent). W końcu ocieplasz rurę (usuwasz problem).","firma":"System sprzedaży zawiesza się co poniedziałek rano. Analiza pokazuje, że w poniedziałki loguje się naraz zbyt wiele osób. Firma rozbudowuje serwer.","urzad":"W szpitalu wojewódzkim system rejestracji pacjentów zawiesza się kilka razy w tygodniu około 7:30. Za każdym razem informatyk go restartuje (incydent). W końcu analizuje zdarzenia i odkrywa, że o tej porze wciąż trwa nocna kopia zapasowa. Przesunięcie kopii na wcześniejszą godzinę usuwa problem.","it":"Przyczynami incydentów zajmuje się proces DSS03 Zarządzanie problemami (FW-PL s. 33).","egz":"DSS03 Zarządzanie problemami (Manage Problems). Na egzaminie: problem ≠ incydent, a w pytaniach o ryzyko „problem” oznacza coś, co już zaistniało (zob. hasło „ryzyko”). Nie myl z: Incydent – Incydent: objaw, gasimy szybko. Problem: przyczyna, szukamy jej i usuwamy.; Ryzyko – Ryzyko to możliwość przyszłego zdarzenia. Problem to przyczyna zdarzeń, które już nastąpiły.","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16"},"proc-dss01":{"t":"DSS01 Zarządzanie eksploatacją","eg":"DSS01 Zarządzanie eksploatacją","pd":"DSS01 Zarządzanie eksploatacją","en":"DSS01 Manage Operations","wyj":"Codzienna, rutynowa robota, dzięki której systemy chodzą: zaplanowane zadania, pilnowanie sprzętu, prądu i serwerowni.\n\nWykonujesz zaplanowane procedury operacyjne. Pilnujesz usług zleconych na zewnątrz i monitorujesz infrastrukturę. Dbasz o środowisko i pomieszczenia: zasilanie, klimatyzację, serwerownię.\n\nŻeby usługi IT działały dzień po dniu. To rutyna, dzięki której systemy po prostu chodzą.","zycie":"W domu masz rutynę: w niedzielę wynosisz śmieci, co miesiąc czyścisz filtr w okapie, zimą sprawdzasz ciśnienie w piecu. Nic się nie psuje, a dom działa. Ta codzienna, zaplanowana obsługa to eksploatacja.","firma":"Informatyk hurtowni co rano sprawdza nocne zadania, klimatyzację serwerowni i komunikaty dostawcy chmury.","urzad":"W urzędzie gminy informatyk co rano sprawdza, czy nocna kopia zapasowa się wykonała i czy w serwerowni jest właściwa temperatura. Raz w miesiącu testuje zasilacz awaryjny serwera. Pilnuje też firmy, która prowadzi gminie pocztę elektroniczną: czyta jej komunikaty i sprawdza, czy wykonuje zaplanowane prace.","it":"Praktyki DSS01: procedury operacyjne, usługi zlecone na zewnątrz, monitorowanie infrastruktury, środowisko i pomieszczenia. Przykład: kontrola, czy nocna kopia zapasowa się wykonała.","egz":"Słowa-klucze: procedury operacyjne, harmonogram zadań, monitorowanie infrastruktury, środowisko i pomieszczenia IT, eksploatacja usług zleconych na zewnątrz → DSS01. Podręcznik: „DSS01 Zarządzanie eksploatacją”. Na egzaminie nazwa procesu może brzmieć inaczej niż w podręczniku. Egzamin PL tłumaczy po swojemu, często trybem rozkazującym (np. domena „Twórz, Nabywaj i Wdrażaj” zamiast „Budowanie, nabywanie i wdrażanie”). Egzaminacyjnej nazwy tego procesu nie potwierdziliśmy, dlatego rozpoznawaj go po kodzie i angielskim słowie kluczowym: Manage Operations. Nie myl z: DSS02 Zarządzanie zgłoszeniami serwisowymi i incydentami – DSS01 to zaplanowana rutyna i monitorowanie. Gdy usługa zostaje przerwana albo pogorszona, obsługa tego zdarzenia przechodzi do DSS02 jako incydent.; APO10 Zarządzanie dostawcami – APO10 wybiera dostawców i zarządza umowami z nimi. DSS01 pilnuje codziennej eksploatacji usług, które dostawca dla nas prowadzi.; BAI04 Zarządzanie dostępnością i pojemnością – DSS01 zbiera dane o obciążeniu na bieżąco. BAI04 na ich podstawie planuje pojemność na przyszłość.","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; COBIT 5 Framework (PL), s. 88, Ilustracja 39; COBIT 5 Framework (PL), s. 92; COBIT 5 Framework (PL), s. 60"},"proc-dss04":{"t":"DSS04 Zarządzanie ciągłością","eg":"DSS04 Zarządzanie ciągłością","pd":"DSS04 Zarządzanie ciągłością","en":"DSS04 Manage Continuity","wyj":"Masz plan na czarną godzinę: co robisz, gdy padnie wszystko, żeby najważniejsze sprawy dalej działały.\n\nOkreślasz politykę, zakres i strategię ciągłości. Tworzysz plan reagowania i dbasz o kopie zapasowe. Ćwiczysz plan, szkolisz ludzi, a po zdarzeniu robisz przegląd i poprawiasz plan.\n\nŻeby najważniejsze sprawy działały nawet po poważnym zakłóceniu. Plan powstaje, zanim coś się stanie.","zycie":"Masz w szafce latarkę, zapas wody, powerbank i listę telefonów na kartce. Zapasowy klucz leży u sąsiada, a zdjęcia rodzinne mają kopię w chmurze. Raz w roku sprawdzasz, czy latarka świeci. To plan ciągłości w domowej skali.","firma":"Piekarnia ma agregat, papierowe zamówienia i umowę z drugą piekarnią, a raz w roku robi próbę.","urzad":"Urząd gminy trzyma kopię danych w drugim budynku, w szkole po drugiej stronie miasta, i ma papierowe wzory najważniejszych zaświadczeń. Raz w roku sekretarz gminy z informatykiem ćwiczą scenariusz „zalana serwerownia”: sprawdzają, w ile godzin da się wznowić wydawanie dokumentów. Po ćwiczeniu poprawiają plan, np. dopisują brakujące telefony do dostawców.","it":"Praktyki DSS04 obejmują m.in. strategię ciągłości, plan reagowania, testy planu, szkolenia, kopie zapasowe i przegląd po wznowieniu działania.","egz":"Słowa-klucze: ciągłość działania, plan awaryjny, odtwarzanie po katastrofie, kopie zapasowe, ćwiczenie planu, funkcje krytyczne → DSS04. Szczyt obciążenia → BAI04. Podręcznik: „DSS04 Zarządzanie ciągłością”. Na egzaminie nazwa procesu może brzmieć inaczej niż w podręczniku. Egzamin PL tłumaczy po swojemu, często trybem rozkazującym (np. domena „Twórz, Nabywaj i Wdrażaj” zamiast „Budowanie, nabywanie i wdrażanie”). Egzaminacyjnej nazwy tego procesu nie potwierdziliśmy, dlatego rozpoznawaj go po kodzie i angielskim słowie kluczowym: Manage Continuity. Nie myl z: BAI04 Zarządzanie dostępnością i pojemnością – BAI04 planuje dostępność i pojemność w zwykłym działaniu i w szczycie. DSS04 przygotowuje przetrwanie poważnego zakłócenia lub katastrofy.; DSS02 Zarządzanie zgłoszeniami serwisowymi i incydentami – DSS02 obsługuje zwykły incydent. Gdy zakłócenie jest tak poważne, że normalna obsługa nie wystarcza, uruchamia się plan z DSS04.; APO12 Zarządzanie ryzykiem – APO12 ocenia ryzyko, także ryzyko katastrofy. DSS04 przygotowuje konkretną odpowiedź na takie zdarzenie.","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; COBIT 5 Framework (PL), s. 89; COBIT 5 Framework (PL), s. 77, Ilustracja 33; COBIT 5 Framework (PL), s. 60"}},"S":[{"lekcje":["pr-k69-dss01-dss03","pr-k70-dss04-dss06"],"pt":"Lekcje 1.69–1.70","h":"DSS01–DSS06: codzienne działanie i ochrona","b":"<ul><li><w k=\"proc-dss01\">DSS01<\/w> – eksploatacja: zaplanowana rutyna<\/li><li><w k=\"proc-dss02\">DSS02<\/w> – incydenty i prośby: przywróć teraz<\/li><li><w k=\"proc-dss03\">DSS03<\/w> – problemy: usuń przyczynę<\/li><li><w k=\"proc-dss04\">DSS04<\/w> – ciągłość po katastrofie<\/li><li><w k=\"proc-dss05\">DSS05<\/w> – codzienna ochrona<\/li><li><w k=\"proc-dss06\">DSS06<\/w> – kontrole w procesach biznesowych<\/li><\/ul>","c":"DSS wykonuje pracę dzień po dniu; plan, budowę i ocenę tych samych spraw prowadzą inne domeny.","s":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; s. 88","ctx":"<p>Nazwy angielskie: <span class=\"en\">Operations<\/span>, <span class=\"en\">Service Requests and Incidents<\/span>, <span class=\"en\">Problems<\/span>, <span class=\"en\">Continuity<\/span>, <span class=\"en\">Security Services<\/span>, <span class=\"en\">Business Process Controls<\/span> (egzaminacyjne niepotwierdzone). DSS02 kończy się, gdy usługa znów działa, nawet bez znanej przyczyny; <w k=\"it-problem\">problem<\/w> to nieznana przyczyna jednego lub wielu incydentów. Trwała poprawka w systemie przechodzi przez BAI06.<\/p><p>Pary: DSS04 (katastrofa) ≠ BAI04 (szczyt ruchu); DSS05 (konta, antywirus, zapora) ≠ APO13 (system i plan); DSS06 (rozdział obowiązków, zatwierdzanie we dwoje) ≠ MEA02 (ocena, czy kontrole działają). Plan ciągłości, którego nikt nie przećwiczył, nie spełnia celu DSS04.<\/p><p>Przykład: w poniedziałek klienci banku nie mogą się zalogować – helpdesk restartuje serwer (DSS02). Sytuacja wraca co tydzień, więc zespół szuka błędu w aplikacji (DSS03).<\/p>"},{"pt":"Sprawdź się","quiz":{"id":"q-prc-69-3","sylabus":["PR-01-04"],"tresc":"Helpdesk szpitala zamyka 95% zgłoszeń w godzinę. Ale od pół roku co tydzień psuje się ta sama drukarka recept. Którego procesu brakuje?","opcje":[{"t":"DSS03 Zarządzanie problemami","ok":true,"w":"Dobrze. Powtarzające się incydenty wskazują nieznaną przyczynę, a jej szukanie to DSS03."},{"t":"DSS01 Zarządzanie eksploatacją","w":"Rutyna eksploatacji nie szuka przyczyny powtarzającej się usterki."},{"t":"DSS02 Zarządzanie zgłoszeniami serwisowymi i incydentami","w":"DSS02 działa dobrze, bo zgłoszenia są szybko zamykane. Brakuje usunięcia przyczyny."},{"t":"BAI04 Zarządzanie dostępnością i pojemnością","w":"BAI04 planuje moc na szczyt. Powtarzająca się usterka to problem."}],"src":"COBIT 5 Framework (PL), s. 33","pomoc":{"t":"Pytanie dotyczy lekcji 1.69 „DSS01–DSS03: eksploatacja, incydenty i problemy”. Cel lekcji: Potrafię odróżnić codzienną eksploatację (DSS01), szybkie przywracanie usługi (DSS02) i usuwanie przyczyny (DSS03).","k":["proc-dss01","proc-dss02","proc-dss03"]}}},{"pt":"Sprawdź się","quiz":{"id":"q-prc-70-3","sylabus":["PR-01-04"],"tresc":"W firmie ubezpieczeniowej wypłatę odszkodowania powyżej limitu musi zatwierdzić druga osoba. Raz w roku audyt sprawdza, czy ta zasada działa. Które procesy opisano, w kolejności?","opcje":[{"t":"MEA02, a potem DSS06","w":"Kolejność jest odwrócona. Najpierw kontrola działa w procesie, potem audyt ocenia jej skuteczność."},{"t":"DSS06, a potem MEA02","ok":true,"w":"Dobrze. Kontrola wbudowana w proces to DSS06, a ocena jej skuteczności to MEA02."},{"t":"DSS05, a potem MEA03","w":"Zatwierdzanie we dwoje to kontrola procesu (DSS06), a audyt zasady wewnętrznej to MEA02."},{"t":"APO13, a potem MEA01","w":"APO13 to system bezpieczeństwa informacji, a MEA01 mierzy wyniki. Tu chodzi o kontrolę procesu i jej ocenę."}],"src":"COBIT 5 Framework (PL), s. 33; COBIT 5 Framework (PL), s. 59","pomoc":{"t":"Pytanie dotyczy lekcji 1.70 „DSS04–DSS06: ciągłość, usługi bezpieczeństwa i mechanizmy kontrolne procesów”. Cel lekcji: Potrafię odróżnić ciągłość (DSS04) od pojemności (BAI04), codzienną ochronę (DSS05) od systemu bezpieczeństwa (APO13) i kontrole w procesie (DSS06) od ich oceny (MEA02).","k":["proc-dss04","proc-dss05","proc-dss06"]}}},{"lekcje":["pr-k71-mea01-mea03"],"pt":"Lekcja 1.71","h":"MEA01–MEA03: co sprawdzamy – wyniki, kontrole czy wymogi z zewnątrz","b":"<ul><li><w k=\"proc-mea01\">MEA01<\/w> – wyniki względem celów <span class=\"en\">Conformance<\/span><\/li><li><w k=\"proc-mea02\">MEA02<\/w> – czy kontrola wewnętrzna działa<\/li><li><w k=\"proc-mea03\">MEA03<\/w> – prawo, regulacje, umowy <span class=\"en\">Compliance<\/span><\/li><\/ul><p>MEA to <w k=\"zarzadzanie\">Zarządzanie<\/w>, nie Ład.<\/p>","c":"W MEA zawsze pytaj, co sprawdzamy: wyniki (MEA01), kontrole (MEA02) czy wymogi zewnętrzne (MEA03).","s":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; s. 59","ctx":"<p>Pełne nazwy zaczynają się od „Monitorowanie, ocena i oszacowanie”: wydajności i zgodności, systemu kontroli wewnętrznej, zgodności z wymogami zewnętrznymi. Pułapka: oba słowa „zgodność” to po angielsku co innego – <span class=\"en\">Conformance<\/span> w MEA01 (zgodność z naszymi celami) i <span class=\"en\">Compliance<\/span> w MEA03 (z prawem i umowami).<\/p><p>MEA01 zbiera mierniki, raportuje i inicjuje działania naprawcze; MEA02 według podręcznika pozwala ocenić, czy mechanizmy kontrolne spełniają wymogi zgodności – nie projektuje ich (DSS06). Ład też monitoruje, ale kierunek; MEA dostarcza mu danych.<\/p><p>Przykład: bank dostaje zalecenie urzędu nadzoru o chmurze. Ustalenie, co z niego wynika, i sprawdzenie zgodności – MEA03; ocena kontroli dostępu do chmury – MEA02; miesięczny raport dostępności dla zarządu – MEA01.<\/p>"},{"pt":"Sprawdź się","quiz":{"id":"q-prc-71-2","sylabus":["PR-01-04"],"tresc":"Dział IT banku co miesiąc zbiera mierniki dostępności usług, porównuje je z celami i raportuje zarządowi wraz z planem poprawek. Który proces?","opcje":[{"t":"APO11 Zarządzanie jakością","w":"APO11 ustala standard i doskonali procesy. Raport mierników dla zarządu to MEA01."},{"t":"EDM05 Zapewnienie Transparentności Interesariuszy","w":"EDM05 to Ład. Zbieranie i liczenie mierników to praca Zarządzania w MEA01."},{"t":"MEA01 Monitorowanie, ocena i oszacowanie wydajności i zgodności","ok":true,"w":"Dobrze. Zbieranie mierników, porównanie z celami i raport to MEA01."},{"t":"MEA03 Monitorowanie, ocena i oszacowanie zgodności z wymogami zewnętrznymi","w":"MEA03 sprawdza wymogi z zewnątrz. Tu porównujemy wyniki z naszymi celami."}],"src":"COBIT 5 Framework (PL), s. 33; COBIT 5 Framework (PL), s. 59","pomoc":{"t":"Pytanie dotyczy lekcji 1.71 „MEA01–MEA03: wyniki, kontrola wewnętrzna i wymogi zewnętrzne”. Cel lekcji: Potrafię rozpoznać MEA01, MEA02 i MEA03 po tym, co sprawdzamy: wyniki, mechanizmy kontrolne czy wymogi z zewnątrz.","k":["proc-mea01","proc-mea02","proc-mea03"]}}}]};</script>
