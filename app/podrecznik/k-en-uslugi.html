<script>window.DECK={"id":"k-en-uslugi","rozdzial":"Załącznik G · Aktywatory szczegółowo · s. 65–88","tytul":"Usługi, Infrastruktura i Aplikacje","prev":"k-en-informacja.html","next":"k-en-ludzie.html","T":{"it-infrastruktura":{"t":"Infrastruktura IT","eg":"Infrastruktura IT","pd":"infrastruktura","en":"IT infrastructure","wyj":"Podstawa, na której działa cała informatyka: sprzęt, sieć, serwery i oprogramowanie systemowe.\n\nSerwery stoją w serwerowni z zasilaniem i chłodzeniem. Sieć łączy je z komputerami użytkowników. Systemy operacyjne na serwerach uruchamiają aplikacje, z których korzystają ludzie.\n\nŻeby aplikacje i usługi miały na czym działać – niezawodnie i bezpiecznie.","zycie":"W bloku wspólne są: instalacja elektryczna, wodociąg i winda. To infrastruktura budynku – mieszkańcy z niej korzystają, ale rzadko o niej myślą.","firma":"Bank ma dwie serwerownie w różnych miastach, każdą z własnym zasilaniem. Gdy jedna zawiedzie, druga przejmuje pracę.","urzad":"Urząd wojewódzki ma serwerownię z zasilaniem awaryjnym i klimatyzacją, sieć łączącą siedzibę z delegaturami w trzech miastach i systemy operacyjne na serwerach. Na tej podstawie działają aplikacje, na przykład do wydawania paszportów. Urzędnicy korzystają z aplikacji, a infrastrukturą zajmuje się wydział informatyki.","it":"Infrastruktura techniczna i fizyczna to część aktywatora Usługi, infrastruktura i aplikacje (FW-PL s. 86).","egz":"Infrastruktura to część aktywatora Usługi, infrastruktura i aplikacje (Services, Infrastructure and Applications). To jeden z trzech aktywatorów, które są też zasobami. Nie myl z: Aplikacja – Aplikacja działa na infrastrukturze. Infrastruktura to podstawa, aplikacja to narzędzie dla człowieka.; Usługi, Infrastruktura i Aplikacje – Aktywator COBIT 5 łączy usługi, infrastrukturę i aplikacje. Infrastruktura to tylko jedna jego część.","src":"COBIT 5 Framework (PL), s. 86; COBIT 5 Framework (PL), s. 27"},"informacja":{"t":"Informacja","eg":"Informacja","pd":"Informacje","en":"Information (enabler 5)","wyj":"Wszystko, co wiemy i zapisujemy, od numeru telefonu po raport, i co komuś do czegoś służy.\n\nInformacja (Information) to piąty z 7 aktywatorów i obejmuje wszystkie informacje w organizacji, nie tylko te w systemach. Ma interesariuszy w rolach wytwórcy (producer), opiekuna (custodian) i konsumenta (consumer), własny cykl życia i kryteria jakości: wewnętrznej, kontekstowej oraz bezpieczeństwa i dostępności. Opisuje się ją też w 6 warstwach atrybutów, od fizycznej po społeczną.\n\nŻeby organizacja traktowała informację jak zasób, o który trzeba dbać: wytwarzać ją, przechowywać, chronić i udostępniać tym, którzy jej potrzebują.","zycie":"Mama dzwoni, że w czwartek nie odbierze dzieci ze szkoły, na lodówce wisi plan lekcji, a szkoła przysyła SMS o skróconych zajęciach. Żadna z tych wiadomości nie siedzi w komputerze, a mimo to wszystkie są informacją, od której zależy, kto i o której jedzie po dzieci. Jeśli nikt jej nie przeczyta i nie zareaguje, nic z niej nie wynika – to cecha aktywatora Informacja.","firma":"Piekarz zapisuje w zeszycie, ile chleba zostało wieczorem, kasa drukuje raport sprzedaży, a sprzedawczyni mówi, o co pytali klienci. Z tego wszystkiego właścicielka planuje jutrzejszy wypiek. Piekarz informację tworzy, zeszyt i kasa ją przechowują, a właścicielka z niej korzysta – to role wokół aktywatora Informacja.","urzad":"W szkole sekretarka prowadzi rejestr uczniów, wychowawca wpisuje oceny do dziennika, a dyrektor na radzie pedagogicznej słyszy ustnie o kłopotach w klasie 3b. Wszystko to jest informacja, także to, czego nie ma w żadnym systemie. Coś z niej wynika dopiero wtedy, gdy dyrektor na tej podstawie organizuje pomoc dla klasy.","it":"Dane kontaktowe klientów w systemie CRM to aktywator Informacja: klient podaje je przy zakładaniu konta (wytwórca), administrator utrzymuje bazę (opiekun), a konsultant korzysta z niej przy obsłudze (konsument). Nieaktualny numer to błąd jakości informacji, przez który powiadomienie nie dotarło.","egz":"Informacja jest jedną ze zdolności do świadczenia usług, a zdolności te wykorzystuje się poprzez procesy, by świadczyć usługi (s. 86). Procesy wymagają informacji jako wejścia i wytwarzają ją jako wyjście (s. 71). Nie myl z: Dane – Dane to surowe fakty. Informacja to dane przetworzone i mające znaczenie.","src":"COBIT 5 Framework (PL), s. 81; COBIT 5 Framework (PL), s. 86"},"zdolnosc-uslugowa":{"t":"Zdolność usługowa","eg":"Zdolność usługowa","pd":"Zdolność do świadczenia usług","en":"Service capabilities","wyj":"Wszystko, na czym stoją usługi informatyczne: sprzęt, sieć, programy i same usługi.\n\nZdolność usługowa obejmuje usługi, infrastrukturę i aplikacje, a także informację. Procesy z niej korzystają i ją dostarczają. Obecny stan opisuje architektura referencyjna, a przyszły architektura docelowa.\n\nŻeby nazwać wszystko, na czym stoją usługi IT, i móc tym świadomie zarządzać.","zycie":"Wieczorny film w domu zależy od routera, telewizora i aplikacji z filmami. Razem dają usługę „oglądamy film”. Router i telewizor to infrastruktura, a aplikacja to aplikacja. Całość to zdolność usługowa twojego domu.","firma":"Przychodnia umawia wizyty przez internet. Potrzebuje serwera, systemu rejestracji, łącza i aktualnej listy lekarzy. Wszystko to razem jest zdolnością usługową, dzięki której pacjent zapisze się o północy.","urzad":"Gmina oferuje e-płatności za odbiór śmieci. Działa to dzięki serwerom, systemowi podatkowemu, bramce płatności i bazie mieszkańców. Te zasoby razem, łącznie z informacją w bazie, tworzą zdolność usługową gminy.","it":"Proces BAI04 (Zarządzanie dostępnością i pojemnością) dba, żeby infrastruktura i aplikacje udźwignęły potrzebne usługi. APO09 (Zarządzanie umowami o świadczenie usług) zapisuje uzgodnione poziomy usług. Oba procesy zarządzają zdolnością usługową.","egz":"Zdolność usługowa = usługi, infrastruktura i aplikacje łącznie. Informacja jest jedną ze zdolności usługowych (s. 86). Procesy zapewniają i wymagają zdolności usługowych. Egzamin: „zdolność usługowa”, podręcznik: „zdolność do świadczenia usług”. Nie myl ze „zdolnością procesu” (poziomy 0–5 z modelu oceny). To zupełnie inne pojęcie. Nie myl z: Model Zdolności Procesu – Zdolność procesu (poziomy 0–5) mierzy, jak dobrze działa proces. Zdolność usługowa to zasoby: aplikacje, infrastruktura, usługi.; Usługi, Infrastruktura i Aplikacje – Usługi, Infrastruktura i Aplikacje to nazwa całego aktywatora 6. Zdolność usługowa to termin na to, co ten aktywator obejmuje.","src":"COBIT 5 Framework (PL), s. 85; COBIT 5 Framework (PL), s. 86; COBIT 5 Framework (PL), s. 71"},"zasady-architektury":{"t":"Zasady (pryncypia) architektury","eg":"Zasady (pryncypia) architektury","pd":"Pryncypia architektury","en":"Architecture principles","wyj":"Ogólne reguły budowania systemów, np. „używaj tego, co już mamy” albo „prosto jest lepiej”.\n\nZasady (pryncypia) architektury (architecture principles) to dobra praktyka aktywatora Usługi, Infrastruktura i Aplikacje. COBIT 5 podaje przykłady: ponowne wykorzystanie (reuse), nabywanie zamiast samodzielnego tworzenia (buy vs. build), prostota (simplicity), zwinność (agility) i otwartość (openness). Według nich wybiera się rozwiązania na drodze od architektury referencyjnej (stan obecny) do docelowej.\n\nŻeby decyzje o budowie, zakupie i zmianach IT opierały się na kilku wspólnych regułach, a nie na upodobaniach poszczególnych osób.","zycie":"Urządzacie nowe mieszkanie i ustalacie reguły: bierzemy meble z poprzedniego, kupujemy gotową szafę zamiast zamawiać stolarza, bez udziwnień, meble na kółkach, żeby łatwo przestawiać, i żarówki ze zwykłym gwintem, które kupisz wszędzie. To są zasady architektury: ponowne wykorzystanie, nabywanie, prostota, zwinność, otwartość.","firma":"Właściciel sklepu internetowego rozbudowuje sklep. Korzysta z tej samej bazy klientów w sklepie i w newsletterze, kupuje gotową wtyczkę płatności zamiast ją pisać, trzyma jeden prosty panel, wybiera moduły łatwe do wymiany i formaty plików, które obsłuży każda hurtownia. Tak wyglądają zasady architektury w praktyce.","urzad":"Szkoła wybiera system do zapisów na zajęcia dodatkowe. Dyrektor stawia warunki: logowanie kontami z dziennika, gotowe rozwiązanie zamiast pisanego na zamówienie, prosta obsługa dla rodziców, łatwe zmiany na nowy rok szkolny i eksport do zwykłego arkusza. To są zasady architektury.","it":"W APO03 (Zarządzanie architekturą korporacyjną) ustala się pryncypia architektury. Gdy bank wybiera moduł SMS do systemu powiadomień, zasada „nabywanie zamiast samodzielnego tworzenia” każe kupić gotową bramkę SMS, chyba że jest zatwierdzony powód, by pisać własną.","egz":"Pięć pryncypiów: ponowne wykorzystanie, nabywanie (kupuj, nie buduj), prostota, zwinność, otwartość. Podręcznik: „pryncypia architektury”. W pytaniach mogą wystąpić jako „zasady architektury”. Nie myl z 5 zasadami COBIT ani z aktywatorem Zasady/Polityki.","src":"COBIT 5 Framework (PL), s. 86; COBIT 5 Framework (PL), s. 85, Ilustracja 37"},"uslugi-infrastruktura-aplikacje":{"t":"Usługi, Infrastruktura i Aplikacje","eg":"Usługi, Infrastruktura i Aplikacje","pd":"Usługi, infrastruktura i aplikacje","en":"Services, Infrastructure and Applications (enabler 6)","wyj":"Sprzęt, sieć, programy i usługi, na których stoi cała informatyka.\n\nTo aktywator 6, który daje organizacji zdolności usługowe (service capabilities): infrastrukturę, aplikacje i usługi IT. Procesy korzystają z tych usług, a cel to usługi i poziomy usług (service levels) najbardziej ekonomiczne dla organizacji. Rozwój opisują architektury: referencyjna (baseline, stan obecny), przejściowa (transition) i docelowa (target), a kierują nim zasady architektury (architecture principles).\n\nŻeby nazwać i świadomie prowadzić techniczną podstawę IT: sprzęt, sieć, programy i usługi, z których korzystają procesy organizacji.","zycie":"W domu masz router, laptopa i aplikację, która sama wrzuca zdjęcia z telefonu do chmury. Router i laptop to infrastruktura, aplikacja do zdjęć to aplikacja, a „zdjęcia same się zapisują i każdy w rodzinie je widzi” to usługa. Gdy planujecie wymianę routera, macie stan obecny i docelowy – to już myślenie architekturą.","firma":"Sklep internetowy z rękodziełem stoi na wynajętym serwerze, działa na gotowej platformie sklepowej i korzysta z bramki płatności. Właścicielka umawia się z firmą hostingową, że sklep ma działać 99,9% czasu. Serwer to infrastruktura, platforma to aplikacja, a działający sklep z umówioną dostępnością to usługa z poziomem usług.","urzad":"Szkoła podstawowa ma pracownię komputerową, szkolne Wi-Fi i dziennik elektroniczny. Dyrektor ustala z firmą serwisową, że awarię dziennika usuwa się w ciągu jednego dnia roboczego. Komputery i sieć to infrastruktura, dziennik to aplikacja, a działający dziennik z gwarantowanym czasem naprawy to usługa z poziomem usług.","it":"APO03 (Zarządzanie architekturą korporacyjną) opisuje obecną i docelową architekturę serwerów, sieci i aplikacji, a APO09 (Zarządzanie umowami o świadczenie usług) ustala poziomy usług, np. dostępność systemu 99,9%. DSS01 (Zarządzanie eksploatacją) utrzymuje tę infrastrukturę w codziennym działaniu.","egz":"Informacja jest jedną ze zdolności do świadczenia usług (zdolności usługowych), a zdolności te wykorzystuje się poprzez procesy, by świadczyć usługi wewnętrzne i zewnętrzne (s. 86). Egzamin: „Zdolność usługowa”. Podręcznik: „Zdolność do świadczenia usług” (service capabilities). Nie myl z: Architektura referencyjna – Uwaga na nazwy: w podręczniku PL „architektura referencyjna” to architektura bazowa, czyli stan obecny.","src":"COBIT 5 Framework (PL), s. 85; COBIT 5 Framework (PL), s. 85, Ilustracja 37; COBIT 5 Framework (PL), s. 86"}},"S":[{"lekcje":["en-k45-uslugi-zdolnosc"],"pt":"Lekcja 2.45","h":"Usługi, infrastruktura i aplikacje razem tworzą zdolność usługową","b":"<p><w k=\"zdolnosc-uslugowa\">Zdolność usługowa<\/w> (<span class=\"en\">Service capabilities<\/span>) = usługi + <w k=\"it-infrastruktura\">infrastruktura<\/w> + aplikacje.<\/p><blockquote>„<w k=\"informacja\">Informacje<\/w> stanowią jedną ze zdolności do świadczenia usług, a zdolności te wykorzystuje się poprzez procesy”<\/blockquote>","c":"Na pytanie „co jest jedną ze zdolności usługowych?” odpowiedź brzmi: informacja.","s":"COBIT 5 Framework (PL), s. 27, 85–86","ctx":"<p><w k=\"uslugi-infrastruktura-aplikacje\">Usługi, Infrastruktura i Aplikacje<\/w> (<span class=\"en\">Services, Infrastructure and Applications<\/span>) dają organizacji przetwarzanie informacji i usługi IT. To jeden z trzech aktywatorów, które są też zasobami, obok Informacji oraz Ludzi, Umiejętności i Kompetencji. Usługi świadczy dział IT albo dostawca zewnętrzny. Potrzebna jest kultura nastawiona na usługi. Podręcznik pisze „zdolność do świadczenia usług”.<\/p><p>Przykład: bankowość mobilna. Centrum danych i sieć to infrastruktura. System transakcyjny i aplikacja w telefonie to aplikacje. „Przelew w 10 sekund przez całą dobę” to usługa, której poziom zapisano w umowie z dostawcą chmury. Klient widzi tylko przelew, a bank musi zadbać o każde ogniwo.<\/p>"},{"pt":"Sprawdź się","quiz":{"id":"q-enk-45-3","sylabus":["EN-02-21"],"tresc":"Co według COBIT 5 stanowi <b>jedną ze zdolności usługowych<\/b> (w podręczniku: zdolności do świadczenia usług)?","opcje":[{"t":"Informacja","ok":true,"w":"Dobrze. Podręcznik (s. 86): informacje stanowią jedną ze zdolności do świadczenia usług, czyli – w nazwie egzaminacyjnej – zdolności usługowych."},{"t":"Kultura organizacji","w":"Kultura to osobny aktywator."},{"t":"Polityka bezpieczeństwa informacji","w":"To dokument z aktywatora Zasady, polityki i struktury ramowe. Kieruje zachowaniem, ale nie jest zdolnością usługową."},{"t":"Cele procesu","w":"Cele procesu należą do wymiaru Cele aktywatora Procesy; nie są zdolnością usługową."}],"src":"COBIT 5 Framework (PL), s. 86; COBIT 5 Framework (PL), s. 28; COBIT 5 Framework (PL), s. 29","pomoc":{"t":"Pytanie dotyczy lekcji 2.45 „Aktywator 6 – Usługi, Infrastruktura i Aplikacje oraz zdolność usługowa”. Cel lekcji: Potrafię wyjaśnić, co daje aktywator Usługi, Infrastruktura i Aplikacje, czym jest zdolność usługowa i z czym się łączy.","k":["uslugi-infrastruktura-aplikacje","zdolnosc-uslugowa"]}}},{"pt":"Arkusz próbny","sp1":"sp1-48","lekcja":"2.45","temat":"Aktywator 6 – Usługi, Infrastruktura i Aplikacje oraz zdolność usługowa","k":["uslugi-infrastruktura-aplikacje","zdolnosc-uslugowa"]},{"lekcje":["en-k46-trzy-architektury","en-k47-pryncypia-architektury"],"pt":"Lekcje 2.46–2.47","h":"Architektura: dziś, cel i etapy; budujesz tylko z zatwierdzonego powodu","b":"<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>Architektura<\/th><th>Opisuje<\/th><\/tr><tr><td>Referencyjna (bazowa)<\/td><td>obecną zdolność usługową<\/td><\/tr><tr><td>Docelowa<\/td><td>przyszłą<\/td><\/tr><tr><td>Przejściowa<\/td><td>etapy pośrednie<\/td><\/tr><\/table><\/div><p><w k=\"zasady-architektury\">Pryncypia<\/w>: ponowne wykorzystanie, nabywanie zamiast budowania, prostota, zwinność, otwartość.<\/p>","c":"Pryncypia architektury to dobra praktyka aktywatora 6, a nie pięć zasad COBIT 5.","s":"COBIT 5 Framework (PL), s. 85–86","ctx":"<p>Inne dobre praktyki tego aktywatora to punkty widzenia architektury (modele, katalogi, macierze), repozytorium architektury i poziomy usług, które dostawcy muszą zdefiniować i osiągnąć. Źródła zewnętrzne to TOGAF (<span class=\"en\">The Open Group Architecture Framework<\/span>) i ITIL. Nabywanie zamiast budowania oznacza, że rozwiązania się kupuje, chyba że istnieje <b>zatwierdzony<\/b> powód, by je zbudować. Prostota nie znaczy „byle jak”.<\/p><p>Pułapki: architektura referencyjna to stan obecny. Nie myl jej z repozytorium ani z modelem referencyjnym architektury. „Zasady” w COBIT 5 to trzy różne rzeczy: pięć zasad COBIT 5, aktywator Zasady, Polityki i Struktury ramowe oraz pryncypia architektury. Egzamin nazywa je „zasady (pryncypia) architektury” (<span class=\"en\">reuse, buy vs. build, simplicity, agility, openness<\/span>).<\/p><p>Przykład: bank przenosi systemy do chmury. Po pół roku system kart działa już w chmurze, a system kredytów jeszcze nie – to architektura przejściowa.<\/p>"},{"pt":"Sprawdź się","quiz":{"id":"q-enk-46-2","sylabus":["EN-02-20"],"tresc":"Uczelnia opisuje serwery, aplikacje i sieć, z których korzysta dziś. Jaką architekturę opisuje?","opcje":[{"t":"Przejściową","w":"Przejściowa opisuje etapy w drodze do celu."},{"t":"Referencyjną (bazową)","ok":true,"w":"Dobrze. Architektura referencyjna opisuje obecną zdolność usługową."},{"t":"Punkt widzenia architektury","w":"Punkt widzenia to sposób przedstawienia architektury."},{"t":"Docelową","w":"Docelowa opisuje stan przyszły."}],"src":"COBIT 5 Framework (PL), s. 85","pomoc":{"t":"Pytanie dotyczy lekcji 2.46 „Architektura referencyjna, docelowa i przejściowa”. Cel lekcji: Potrafię odróżnić architekturę referencyjną, docelową i przejściową oraz wymienić dobre praktyki aktywatora Usługi, Infrastruktura i Aplikacje.","k":[]}}},{"pt":"Sprawdź się","quiz":{"id":"q-enk-47-3","sylabus":["EN-02-20"],"tresc":"Które pryncypium architektury mówi, że architektura korporacyjna powinna opierać się na <b>otwartych standardach branżowych<\/b>?","opcje":[{"t":"Zwinność","w":"Zwinność to szybka odpowiedź na zmieniające się potrzeby."},{"t":"Prostota","w":"Prostota to architektura możliwie najprostsza."},{"t":"Otwartość","ok":true,"w":"Dobrze. Tak opisuje je podręcznik na s. 86."},{"t":"Ponowne wykorzystanie","w":"Ponowne wykorzystanie to wspólne komponenty."}],"src":"COBIT 5 Framework (PL), s. 86","pomoc":{"t":"Pytanie dotyczy lekcji 2.47 „Pięć zasad (pryncypiów) architektury”. Cel lekcji: Potrafię wymienić pięć zasad (pryncypiów) architektury i rozpoznać je w opisie sytuacji.","k":["zasady-architektury"]}}}]};</script>
