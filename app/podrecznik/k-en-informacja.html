<script>window.DECK={"id":"k-en-informacja","rozdzial":"Załącznik G · Aktywatory szczegółowo · s. 65–88","tytul":"Informacja","prev":"k-en-kultura.html","next":"k-en-uslugi.html","T":{"dostep-i-bezpieczenstwo":{"t":"Dostęp i Bezpieczeństwo","eg":"Dostęp i Bezpieczeństwo","pd":"Dostęp i bezpieczeństwo / Dostępność i bezpieczeństwo","en":"Accessibility and security","wyj":"Informacja ma być dostępna dla tych, którzy jej potrzebują, i schowana przed tymi, którzy nie powinni jej mieć.\n\nTo trzecia kategoria celów aktywatora (enabler goals), obok jakości wewnętrznej (intrinsic quality) i jakości kontekstowej (contextual quality). Sprawdza dwie rzeczy: czy aktywator jest dostępny w razie potrzeby (accessibility) i czy jego wyniki są zabezpieczone, czyli dostępne tylko dla uprawnionych (security). Dla aktywatora Informacja odpowiadają temu kryteria dostępności i ograniczonego dostępu.\n\nŻeby aktywatory i ich wyniki były dostępne wtedy, gdy są potrzebne, i chronione przed tymi, którzy nie powinni mieć do nich dostępu.","zycie":"Dziecko rozcina kolano, a Ty po 10 sekundach masz apteczkę w ręku, bo zawsze stoi w tej samej szafce. Ta szafka jest wysoko i zamknięta, więc młodsze dziecko nie dobierze się do leków. Pod ręką, kiedy trzeba, i poza zasięgiem niepowołanych – to dostęp i bezpieczeństwo.","firma":"W ostatni dzień miesiąca księgowa warsztatu zamyka rozliczenia, a program księgowy po prostu działa. Jednocześnie listę płac widzi tylko ona i właściciel, mechanicy nie mają do niej wglądu. Dostępne, gdy trzeba, i chronione przed niepowołanymi – to dostęp i bezpieczeństwo.","urzad":"Mieszkaniec przychodzi do urzędu o 15:30, a urzędniczka od ręki sprawdza jego dane w rejestrze. Stażysta widzi w tym samym rejestrze tylko sprawy, które sam prowadzi, a nikt z zewnątrz nie ma do niego dostępu. Tak wygląda cel „dostęp i bezpieczeństwo” dla rejestru.","it":"Dla aktywatora Informacja, czyli bazy danych klientów w systemie CRM, cel dostępu i bezpieczeństwa brzmi: baza działa w każdej chwili, gdy konsultant obsługuje klienta, a dane osobowe widzą tylko uprawnieni. Zabezpieczenia techniczne zapewnia proces DSS05 Zarządzanie usługami bezpieczeństwa.","egz":"„Dostępne kiedy potrzebne” i „wyniki zabezpieczone” → Dostęp i Bezpieczeństwo (s. 29). Nie myl z: Bezpieczeństwo informacji (APO13/DSS05) – To procesy. Tu chodzi o kategorię celu każdego aktywatora.","src":"COBIT 5 Framework (PL), s. 28; COBIT 5 Framework (PL), s. 29"},"cobit-5":{"t":"COBIT 5","eg":"COBIT 5","pd":"COBIT 5","en":"COBIT 5","wyj":"Zbiór sprawdzonych reguł z 2012 roku, jak mądrze decydować o informatyce i nią kierować.\n\nCOBIT 5 (ISACA, 2012) opiera się na 5 zasadach (principles), 7 kategoriach aktywatorów (enablers) i modelu referencyjnym 37 procesów: 5 Ładu w domenie EDM i 32 Zarządzania w domenach APO, BAI, DSS i MEA. Kaskada celów przekłada potrzeby interesariuszy na cele organizacji, cele związane z IT i cele aktywatorów. Integruje wcześniejsze wytyczne ISACA (COBIT 4.1, Val IT, Risk IT) i jest spójny z innymi standardami, np. ITIL i ISO/IEC 27001.\n\nŻeby organizacja mogła mądrze kierować informatyką i nią zarządzać: osiągać korzyści przy rozsądnym ryzyku i zużyciu zasobów. Daje jedną, spójną strukturę ramową zamiast wielu luźnych wskazówek.","zycie":"Rodzina ma coraz więcej sprzętu i kont: telefony, laptop, router, bank, zdjęcia w chmurze. Ustalacie, kto decyduje o zakupach, kto pilnuje haseł i kopii, i co miesiąc sprawdzacie, czy wszystko działa i czy nie przepłacacie. COBIT 5 to taki „regulamin domu” dla informatyki, tylko spisany dla firm i urzędów.","firma":"Właściciel warsztatu kupił program do rezerwacji, kasę online i monitoring, ale nie wie, czy to się opłaca i kto za co odpowiada. COBIT 5 podpowiada, jak to poukładać: kto wyznacza kierunek, kto prowadzi codzienne sprawy, jak mierzyć efekty i ryzyko. To gotowa rama, a nie program do zainstalowania.","urzad":"Burmistrz słyszy, że urząd wydaje na informatykę coraz więcej, a mieszkańcy dalej stoją w kolejkach. Sięga po COBIT 5, żeby ustalić, czego chce od systemów, kto w urzędzie za nie odpowiada i jak co roku sprawdzać, czy przynoszą korzyści. COBIT 5 służy tu do uporządkowania Ładu i Zarządzania IT.","it":"Bank po poważnej awarii bankowości internetowej porządkuje IT według COBIT 5: zarząd przejmuje 5 procesów Ładu (EDM01–EDM05), CIO 32 procesy Zarządzania, np. DSS04 Zarządzanie ciągłością, a audyt wewnętrzny ocenia zdolność procesów.","egz":"Liczby do zapamiętania: 5 zasad, 7 aktywatorów, 37 procesów (EDM 5 + APO 13 + BAI 10 + DSS 6 + MEA 3), 6 poziomów zdolności (0–5). Nie myl z: COBIT 2019 – Nowsza wersja (2018/2019) – inne pojęcia (komponenty, 40 celów, czynniki projektowe). Egzamin COBIT 5 Foundation dotyczy COBIT 5.; ITIL – ITIL to dobre praktyki zarządzania usługami IT – jak dostarczać usługi. COBIT patrzy szerzej: Ład i Zarządzanie całością IT w organizacji.; ISO/IEC 27001 – ISO/IEC 27001 to norma bezpieczeństwa informacji z certyfikacją; COBIT 5 to struktura ramowa Ładu i Zarządzania IT.","src":"COBIT 5 Framework (PL), s. 90"},"jakosc-kontekstowa":{"t":"Jakość kontekstowa","eg":"Jakość kontekstowa","pd":"Jakość kontekstowa","en":"Contextual quality","wyj":"Informacja przydaje się temu, kto jej teraz potrzebuje: jest na temat, aktualna, kompletna i w zrozumiałej formie.\n\nPatrzysz na aktywator i jego rezultaty oczami użytkownika w konkretnym kontekście: czy są istotne (relevant), kompletne (complete), aktualne (current), w odpowiedniej ilości, spójnie i zwięźle przedstawione, zrozumiałe i łatwe w użyciu. Ta sama poprawna informacja może mieć wysoką jakość wewnętrzną, a niską kontekstową, gdy jest nie na temat, niekompletna, nieaktualna albo w nieczytelnej formie. Informacja, która przychodzi za późno, to inny problem: dostępność/terminowość, czyli jakość dostępu i bezpieczeństwa (s. 82). Dla procesów oznacza to dopasowanie do sytuacji organizacji.\n\nŻeby oceniać nie tylko, czy wynik jest poprawny, ale czy przydaje się temu, kto go używa, w jego sytuacji.","zycie":"Kupujesz z drugiej ręki szafę, a poprzedni właściciel daje Ci instrukcję montażu – bardzo dokładną, tyle że po szwedzku i z 50 stronami o modelach, których nie masz. Nic w niej nie jest błędne, ale Tobie się nie przyda. Brakuje jej jakości kontekstowej, czyli dopasowania do Twojej sytuacji.","firma":"Właściciel warsztatu samochodowego dostaje od księgowej 40-stronicowy raport z każdą fakturą z kwartału. Liczby są poprawne, ale on chciał tylko wiedzieć, czy stać go na nowy podnośnik, i tego z raportu nie wyczyta. Raport ma dobrą jakość wewnętrzną, ale słabą kontekstową.","urzad":"Wójt prosi o zestawienie, ile dzieci gmina dowozi do szkół, bo jutro sesja rady o budżecie. Urzędnik przysyła na czas bezbłędny raport, ale z danymi z poprzedniego roku szkolnego i bez dwóch nowych tras. Dane są poprawne, tylko nieaktualne i niekompletne dla tego zadania – brakuje im jakości kontekstowej. Gdyby raport przyszedł dopiero po sesji, zawiodłaby dostępność/terminowość, czyli jakość dostępu i bezpieczeństwa (s. 82).","it":"W DSS02 (Zarządzanie zgłoszeniami serwisowymi i incydentami) raport dla zarządu zawiera tylko pięć głównych wskaźników i trend, a pełna lista zgłoszeń trafia do zespołu wsparcia. Te same dane podane w formie dopasowanej do odbiorcy to cel kontekstowy aktywatora Informacja.","egz":"„Rezultaty właściwe, kompletne, aktualne, zrozumiałe” → jakość kontekstowa. „Dostępne kiedy potrzeba” i „zabezpieczone” → dostęp i bezpieczeństwo (s. 29). Nie myl z: Jakość wewnętrzna – Wewnętrzna: czy dokładne. Kontekstowa: czy przydatne tu i teraz.","src":"COBIT 5 Framework (PL), s. 29"},"jakosc-informacji":{"t":"Kryteria jakości informacji","eg":"Kryteria jakości informacji","pd":"Cele dotyczące informacji – podwymiary jakości","en":"Information quality criteria","wyj":"Lista cech dobrej informacji: prawdziwa, aktualna, przydatna, dostępna i bezpieczna.\n\nCOBIT 5 dzieli kryteria jakości informacji na trzy podwymiary celów aktywatora Informacja. Jakość wewnętrzna (intrinsic quality): dokładność, obiektywność, wiarygodność, reputacja. Jakość kontekstowa i reprezentacji (contextual and representational quality): m.in. istotność, kompletność, aktualność, zrozumiałość. Jakość bezpieczeństwa i dostępności (security/accessibility quality): dostępność w potrzebnym czasie i ograniczony dostęp dla nieuprawnionych.\n\nŻeby dało się sprawdzić, czy informacja naprawdę nadaje się do użytku, zamiast ogólnie mówić, że „dane są złe”.","zycie":"Mama zostawia opiekunce kartkę o lekach dziecka. Dawki muszą być prawdziwe (wewnętrzna), kartka aktualna i napisana zwykłymi słowami, a nie skrótami lekarza (kontekstowa i reprezentacji), i musi wisieć na lodówce, a nie leżeć w torebce mamy (bezpieczeństwo i dostępność). Jeśli zawiedzie choć jeden z tych trzech podwymiarów, informacja nie spełnia swojej roli.","firma":"Sklep internetowy pokazuje klientom stan magazynu. Liczba sztuk musi zgadzać się z półką (wewnętrzna), być aktualna i jasno podana jako „ostatnie 2 sztuki” (kontekstowa i reprezentacji), a widzieć ją ma klient, ale ceny zakupu od hurtowni już nie (bezpieczeństwo i dostępność). To trzy podwymiary jakości informacji.","urzad":"Urząd gminy publikuje harmonogram wywozu śmieci. Daty muszą być prawdziwe (wewnętrzna), aktualne na ten rok i podane w prostej tabeli dla każdej ulicy (kontekstowa i reprezentacji), a plik ma być na stronie cały czas, bez możliwości zmiany przez osoby z zewnątrz (bezpieczeństwo i dostępność). Wystarczy błąd w jednym z tych wymiarów, żeby mieszkańcy wystawili kosze w zły dzień.","it":"Przy zamawianiu systemu kadrowego zespół w BAI02 (Zarządzanie definiowaniem wymagań) zapisuje wymagania jakości danych: poprawne dane osobowe, aktualizacja w dniu zmiany, wgląd tylko dla kadr. Każde wymaganie odpowiada jednemu z trzech podwymiarów jakości informacji.","egz":"Kryterium, które spełnia wyłącznie potrzebę użytkownika informacji, to skuteczność (informacja pozwala wykonać zadanie, Załącznik F). Wiarygodność = uznawana za prawdziwą i godną zaufania. Nie myl z: Skuteczność (COBIT 4.1) – W COBIT 5 skuteczność informacji odpowiada celom: właściwa ilość, istotność, jasność, możliwość interpretacji, obiektywność.","src":"COBIT 5 Framework (PL), s. 82; COBIT 5 Framework (PL), s. 63; COBIT 5 Framework (PL), s. 63, Ilustracja 26"},"jakosc-wewnetrzna":{"t":"Jakość wewnętrzna","eg":"Jakość wewnętrzna","pd":"Jakość rzeczywista","en":"Intrinsic quality","wyj":"Informacja jest sama w sobie dobra: prawdziwa, dokładna, z pewnego źródła.\n\nOceniasz aktywator niezależnie od tego, kto i do czego go używa: czy działa dokładnie (accurately) i obiektywnie (objectively) oraz czy daje dokładne, obiektywne i wiarygodne wyniki (believable results). Dla informacji to dokładność, obiektywność, wiarygodność i reputacja. Dla procesów cele wewnętrzne obejmują też zgodność z dobrą praktyką oraz z regułami wewnętrznymi i zewnętrznymi.\n\nŻeby sprawdzić, czy aktywator sam w sobie działa poprawnie i daje prawdziwe, obiektywne wyniki, zanim zapytamy, czy pasuje do sytuacji.","zycie":"Kupujesz w markecie kilogram jabłek, a w domu kuchenna waga pokazuje 870 gramów. Któraś z wag kłamie – a waga ma pokazywać prawdę bez względu na to, kto i co na niej kładzie. To jest jakość wewnętrzna: wynik dokładny i obiektywny sam w sobie.","firma":"W piekarni kasa fiskalna nalicza VAT według przepisów i drukuje paragon zgodny z tym, co klient kupił. Nieważne, czy przy kasie stoi właściciel, czy uczeń na pierwszej zmianie – suma ma się zgadzać. Dokładność i zgodność z regułami to jakość wewnętrzna.","urzad":"Mieszkanka przychodzi do urzędu gminy po zaświadczenie o zameldowaniu, a w rejestrze wciąż figuruje jej stary adres, bo ktoś nie wprowadził zmiany. Zaświadczenie jest czytelne i wydane od ręki, ale nieprawdziwe. Zawodzi jakość wewnętrzna: dane w rejestrze nie są dokładne.","it":"Audytor w MEA02 (Monitorowanie, ocena i oszacowanie systemu kontroli wewnętrznej) sprawdza, czy raport uprawnień z systemu kadrowego pokazuje rzeczywiste konta, bez pominięć i przekłamań. Badanie dokładności i obiektywności tego raportu to ocena jakości wewnętrznej aktywatora Informacja.","egz":"„Dokładne, obiektywne, wiarygodne wyniki” → jakość wewnętrzna, a nie kontekstowa (s. 29). Egzamin: „Jakość wewnętrzna” / „Cel wewnętrzny”. Podręcznik: „Jakość rzeczywista”. EN: intrinsic quality. Nie myl z: Jakość kontekstowa – Kontekstowa ocenia, czy wynik jest przydatny w danej sytuacji: aktualny, kompletny, zrozumiały.; Jakość wewnętrzna jako „wewnątrz organizacji” – „Wewnętrzna” = intrinsic = sama w sobie. Nie chodzi o „wewnątrz firmy”.","src":"COBIT 5 Framework (PL), s. 29"},"model-informacji":{"t":"Model informacji","eg":"Model informacji","pd":"Model informacji","en":"Information Model (uses and attribute layers)","wyj":"Sposób opisu każdej informacji: kto jej potrzebuje, po co, jakiej jakości i jak długo żyje.\n\nModel informacji (Information Model) stosuje do informacji wymiary aktywatora: interesariuszy, cele (kryteria jakości), cykl życia (od planowania przez użytkowanie po pozbycie się) i dobre praktyki. Dobre praktyki to atrybuty w sześciu warstwach: fizycznej (nośnik), empirycznej (kanał dostępu), syntaktycznej (format), semantycznej (znaczenie), pragmatycznej (wykorzystanie, np. okres przechowywania) i społecznej (kontekst). Model służy m.in. do specyfikacji informacji dla nowych aplikacji, ustalania wymaganej ochrony i oceny jakości danych.\n\nŻeby każdą informację opisać jednolicie i kompletnie, a potem użyć tego opisu do specyfikacji, ochrony i oceny jakości danych.","zycie":"Robisz rodzinne archiwum zdjęć. Ustalasz, gdzie leżą pliki (dysk w szafie – fizyczna), jak się do nich dostać (aplikacja w telefonie – empiryczna), w jakim są formacie (JPG – syntaktyczna), co przedstawiają i z kiedy są (semantyczna), jak długo je trzymasz i które są ważne (pragmatyczna) oraz kto w rodzinie rozpozna ludzi na starych zdjęciach (społeczna). To sześć warstw atrybutów z modelu informacji.","firma":"Właściciel sklepu internetowego zamawia u programisty moduł faktur. Zamiast powiedzieć „mają być faktury”, opisuje je po kolei: gdzie są zapisane, jak klient je pobiera, w jakim formacie (PDF), co zawierają, ile lat trzeba je trzymać i kto je potem czyta (klient, księgowa, urząd skarbowy). Model informacji pomaga tak rozpisać informację, żeby powstała z niej porządna specyfikacja aplikacji.","urzad":"Urząd gminy zastanawia się, jak chronić skany wniosków o pomoc społeczną. Po rozpisaniu ich według modelu informacji widać, że to dane o zdrowiu i dochodach (znaczenie), trzymane latami (wykorzystanie) i dostępne przez system dziedzinowy z wielu stanowisk (kanał dostępu). Z tego od razu wynika, jakiej ochrony wymagają: ograniczony dostęp, szyfrowanie, rejestr wglądów.","it":"Przy zamawianiu systemu kadrowego zespół w BAI02 (Zarządzanie definiowaniem wymagań) opisuje dane pracowników według modelu informacji: interesariusze, wymagana jakość, okres przechowywania, format i poziom poufności. Ten sam opis służy potem w DSS05 (Zarządzanie usługami bezpieczeństwa) do ustalenia ochrony tych danych.","egz":"Zastosowania modelu informacji: specyfikacja informacji, ochrona informacji, ocena jakości i łatwości korzystania z danych.","src":"COBIT 5 Framework (PL), s. 84; COBIT 5 Framework (PL), s. 83"},"cykl-informacji":{"t":"Cykl informacji","eg":"Cykl informacji","pd":"Cykl informacji (metadane COBIT 5)","en":"Information cycle","wyj":"Droga od surowych danych przez informację i wiedzę do pożytku, np. odczyt licznika → rachunek → decyzja o oszczędzaniu.\n\nProcesy biznesowe, wspierane przez procesy IT, generują i przetwarzają dane (data). Dane przekształca się w informacje (information), informacje w wiedzę (knowledge), a z wiedzy powstaje wartość (value) dla organizacji (Ilustracja 35). Aktywator Informacja dotyczy głównie fazy informacji, ale COBIT 5 uwzględnia też dane i wiedzę.\n\nŻeby pokazać, że dane same w sobie nie dają pożytku: dopiero przetworzone w informacje i wiedzę tworzą wartość dla organizacji.","zycie":"Przez miesiąc wrzucasz paragony do pudełka (dane). Na koniec układasz je w tabelkę wydatków (informacja) i widzisz, że prawie połowa idzie na jedzenie na mieście (wiedza). Zaczynasz gotować w domu i odkładasz pieniądze – tu pojawia się wartość, koniec cyklu informacji.","firma":"Kasa w piekarni zapisuje każdą sprzedaż (dane). Właścicielka co tydzień dostaje zestawienie, co schodzi o której godzinie (informacja), i odkrywa, że po 17 zostaje połowa chleba (wiedza). Piecze mniej na wieczór i przestaje wyrzucać pieczywo – to wartość na końcu cyklu informacji.","urzad":"Urząd gminy rejestruje każdą sprawę w EZD z datą wpływu i załatwienia (dane). Z tego powstaje raport czasu obsługi w wydziałach (informacja), z którego wynika, że wnioski budowlane leżą najdłużej (wiedza). Sekretarz przesuwa jedną osobę do tego wydziału i kolejka maleje – to wartość.","it":"Proces DSS02 Zarządzanie zgłoszeniami serwisowymi i incydentami zapisuje każde zgłoszenie (dane). Raport pokazuje, że co tydzień pada ta sama usługa (informacja), analiza wskazuje przyczynę (wiedza), a DSS03 Zarządzanie problemami usuwa ją na stałe, więc przestojów jest mniej (wartość).","egz":"Kolejność: dane → informacje → wiedza → wartość. Wyznacznikiem cyklu są procesy biznesowe. Wniosek egzaminacyjny: procesy biznesowe przekształcają wiedzę, aby stworzyć wartość dla organizacji.","src":"COBIT 5 Framework (PL), s. 81; COBIT 5 Framework (PL), s. 81, Ilustracja 35"},"it-informacja":{"t":"Informacja","eg":"Informacja","pd":"Informacje","en":"Information","wyj":"Dane, które coś komuś mówią, bo wiadomo, czego dotyczą.\n\nKtoś zbiera dane i dodaje do nich wyjaśnienie. Odbiorca czyta i rozumie. Jeśli coś z tym zrobi – zadzwoni, zamówi towar, kupi – informacja przynosi pożytek.\n\nŻeby ludzie mogli zrozumieć sytuację i podjąć dobrą decyzję.","zycie":"SMS z przychodni: „Wizyta jutro 10:30, gabinet 12”. To informacja: wiesz kiedy, gdzie i po co.","firma":"Kierownik sklepu dostaje zestawienie: „chleb kończy się codziennie o 17”. Na tej podstawie zamawia więcej.","urzad":"Kierownik MOPS (miejskiego ośrodka pomocy społecznej) dostaje zestawienie: „w styczniu wnioski o dodatek mieszkaniowy złożyło 340 rodzin, dwa razy więcej niż rok temu”. Na tej podstawie przesuwa dwie pracownice do przyjmowania wniosków. Dane stały się informacją, bo coś mu powiedziały i pozwoliły podjąć decyzję.","it":"W COBIT 5 informacja to aktywator nr 5; słownik FW-PL nazywa ją zasobem niezbędnym do działalności (s. 92).","egz":"W COBIT 5 Informacja (Information) to aktywator nr 5. Zapamiętaj już teraz: informacja to nie tylko to, co w komputerze – także papier i rozmowa (FW-PL s. 92). Nie myl z: Dane – Dane to surowe zapisy; informacja ma znaczenie dla odbiorcy.; Informacja – Hasło „Informacja” (aktywator COBIT 5, dzień 3) opisuje informację jako jeden z 7 aktywatorów, z jej cyklem życia i jakością. To hasło opisuje tylko codzienne znaczenie.","src":"COBIT 5 Framework (PL), s. 92"},"informacja":{"t":"Informacja","eg":"Informacja","pd":"Informacje","en":"Information (enabler 5)","wyj":"Wszystko, co wiemy i zapisujemy, od numeru telefonu po raport, i co komuś do czegoś służy.\n\nInformacja (Information) to piąty z 7 aktywatorów i obejmuje wszystkie informacje w organizacji, nie tylko te w systemach. Ma interesariuszy w rolach wytwórcy (producer), opiekuna (custodian) i konsumenta (consumer), własny cykl życia i kryteria jakości: wewnętrznej, kontekstowej oraz bezpieczeństwa i dostępności. Opisuje się ją też w 6 warstwach atrybutów, od fizycznej po społeczną.\n\nŻeby organizacja traktowała informację jak zasób, o który trzeba dbać: wytwarzać ją, przechowywać, chronić i udostępniać tym, którzy jej potrzebują.","zycie":"Mama dzwoni, że w czwartek nie odbierze dzieci ze szkoły, na lodówce wisi plan lekcji, a szkoła przysyła SMS o skróconych zajęciach. Żadna z tych wiadomości nie siedzi w komputerze, a mimo to wszystkie są informacją, od której zależy, kto i o której jedzie po dzieci. Jeśli nikt jej nie przeczyta i nie zareaguje, nic z niej nie wynika – to cecha aktywatora Informacja.","firma":"Piekarz zapisuje w zeszycie, ile chleba zostało wieczorem, kasa drukuje raport sprzedaży, a sprzedawczyni mówi, o co pytali klienci. Z tego wszystkiego właścicielka planuje jutrzejszy wypiek. Piekarz informację tworzy, zeszyt i kasa ją przechowują, a właścicielka z niej korzysta – to role wokół aktywatora Informacja.","urzad":"W szkole sekretarka prowadzi rejestr uczniów, wychowawca wpisuje oceny do dziennika, a dyrektor na radzie pedagogicznej słyszy ustnie o kłopotach w klasie 3b. Wszystko to jest informacja, także to, czego nie ma w żadnym systemie. Coś z niej wynika dopiero wtedy, gdy dyrektor na tej podstawie organizuje pomoc dla klasy.","it":"Dane kontaktowe klientów w systemie CRM to aktywator Informacja: klient podaje je przy zakładaniu konta (wytwórca), administrator utrzymuje bazę (opiekun), a konsultant korzysta z niej przy obsłudze (konsument). Nieaktualny numer to błąd jakości informacji, przez który powiadomienie nie dotarło.","egz":"Informacja jest jedną ze zdolności do świadczenia usług, a zdolności te wykorzystuje się poprzez procesy, by świadczyć usługi (s. 86). Procesy wymagają informacji jako wejścia i wytwarzają ją jako wyjście (s. 71). Nie myl z: Dane – Dane to surowe fakty. Informacja to dane przetworzone i mające znaczenie.","src":"COBIT 5 Framework (PL), s. 81; COBIT 5 Framework (PL), s. 86"},"it-dane":{"t":"Dane","eg":"Dane","pd":"dane","en":"Data","wyj":"Zapisane liczby, słowa, znaki, zdjęcia czy dźwięki – jeszcze bez wyjaśnienia, co znaczą.\n\nKtoś wpisuje albo urządzenie zapisuje fakt, np. numer telefonu. Komputer przechowuje go jako dane. Gdy dane zestawimy z wyjaśnieniem („to numer klienta, który zgłosił reklamację”), powstaje informacja.\n\nŻeby zapisać fakty raz i móc z nich korzystać wiele razy: liczyć, porównywać, wysyłać.","zycie":"Na paragonie widzisz „4,99” i „12.05”. To dane. Informacją stają się, gdy wiesz: „4,99 zł zapłaciłam 12 maja za chleb”.","firma":"Sklep internetowy zbiera dane o zamówieniach: datę, kwotę, adres. Dopiero zestawione pokazują, co sprzedaje się najlepiej.","urzad":"Rachmistrze GUS (Głównego Urzędu Statystycznego) zbierają w spisie powszechnym odpowiedzi: wiek, wykształcenie, liczbę pokoi w mieszkaniu. Każda odpowiedź to pojedyncza dana. Dopiero zestawione i opisane pokazują na przykład, ile rodzin w województwie mieszka w ciasnych mieszkaniach.","it":"Dane są surowcem aktywatora Informacja; COBIT 5 mówi o kontekście danych: dokładności, dostępności, aktualności i jakości (FW-PL s. 91).","egz":"Odróżnienie danych od informacji pomaga zrozumieć aktywator Informacja i jakość informacji (dzień 3). Na egzaminie słowo „dane” rzadko pada samodzielnie. Nie myl z: Informacja – Dane to zapisane fakty. Informacja to dane, które coś komuś mówią w danej sytuacji.; Plik – Plik to „pojemnik” na dane w komputerze. Dane to jego zawartość.","src":"COBIT 5 Framework (PL), s. 91"},"it-dostepnosc":{"t":"Dostępność","eg":"Dostępność","pd":"dostępność","en":"Availability","wyj":"Usługa albo informacja działa i można z niej skorzystać wtedy, gdy jest potrzebna.\n\nOrganizacja ustala, kiedy i jak niezawodnie usługa ma działać. Informatycy dobierają infrastrukturę (np. zapasowy serwer), pilnują, by starczyło mocy, i mierzą przerwy. Gdy dostępność spada, szukają przyczyn.\n\nŻeby ludzie mogli pracować wtedy, kiedy muszą, a nie tylko wtedy, gdy system akurat działa.","zycie":"Bankomat pod blokiem działa całą dobę – to dobra dostępność. Gdy co weekend jest „nieczynny”, dostępność jest słaba, choć pieniądze w banku są.","firma":"Sklep internetowy przed świętami dokupuje serwery, żeby strona nie padała przy tłumie klientów.","urzad":"ZUS (Zakład Ubezpieczeń Społecznych) ustala, że portal dla firm ma działać całą dobę, a zwłaszcza w dniach, gdy mija termin wysyłania deklaracji składkowych. Na te dni informatycy dokładają mocy serwerów, a przerwy techniczne planują tylko w nocy z soboty na niedzielę. Co miesiąc mierzą, ile minut portal nie działał.","it":"BAI04 Zarządzanie dostępnością i pojemnością; cel organizacji 7 i kryterium jakości informacji „dostępność/terminowość” (FW-PL s. 19, 33, 82).","egz":"BAI04 Zarządzanie dostępnością i pojemnością (Manage Availability and Capacity); dostępność to też kryterium jakości informacji (FW-PL s. 82). Nie myl z: Ciągłość działania – Dostępność to codzienne „działa, gdy trzeba”. Ciągłość to przygotowanie na poważne zakłócenia.; Dostęp i Bezpieczeństwo – Kategoria jakości informacji „Dostęp i Bezpieczeństwo” obejmuje dostępność, ale też ograniczenie dostępu dla nieuprawnionych.","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; COBIT 5 Framework (PL), s. 82; COBIT 5 Framework (PL), s. 19"}},"S":[{"lekcje":["en-k40-informacja-cykl"],"pt":"Lekcja 2.40","h":"Informacja daje wartość dopiero wtedy, gdy ktoś z niej korzysta","b":"<p><w k=\"cykl-informacji\">Cykl informacji</w> (Rysunek 35):</p><p>procesy biznesowe → <b><w k=\"it-dane\">dane</w></b> → <b><w k=\"informacja\">informacje</w></b> → <b>wiedza</b> → <b>wartość</b></p><blockquote>„<w k=\"it-informacja\">informacje</w> nie mają wartości same w sobie”</blockquote>","c":"Aktywator Informacja obejmuje wszystkie informacje istotne dla organizacji, nie tylko zautomatyzowane.","s":"COBIT 5 Framework (PL), s. 81–82, 84, Ilustracja 35","ctx":"<p><w k=\"informacja\">Informacja</w> (<span class=\"en\">Information</span>) to piąty aktywator i jednocześnie zasób. Obejmuje informacje elektroniczne, papierowe i ustne. Procesy biznesowe generują i przetwarzają dane, a procesy IT je wspierają. Korzyść daje dopiero wykorzystanie informacji w organizacji albo jej sprzedaż.</p><p>Pułapka: cykl informacji to nie cykl życia informacji. Cykl informacji to droga do wartości. Cykl życia to wymiar aktywatora: planowanie, projektowanie, budowanie/nabywanie, użytkowanie, ocena/monitorowanie i aktualizacja/pozbywanie się. Ogólne role wobec informacji to wytwórca (tworzy ją), opiekun (przechowuje i utrzymuje) i konsument (korzysta).</p><p>Przykład: sklep latami zbiera dane o klientach, ale nikt ich nie analizuje. Dane nie dają korzyści, a kosztują miejsce na serwerach i ochronę.</p>"},{"pt":"Sprawdź się","quiz":{"id":"q-enk-40-3","sylabus":["EN-02-18"],"tresc":"Jaka jest kolejność w <b>cyklu informacji</b> COBIT 5 (Rysunek 35)?","opcje":[{"t":"Dane → informacje → wiedza → wartość","ok":true,"w":"Dobrze. Tak wygląda Ilustracja 35 w podręczniku."},{"t":"Informacje → dane → wiedza → wartość","ok":false,"w":"Dane i informacje są zamienione."},{"t":"Planowanie → projektowanie → budowanie → użytkowanie","ok":false,"w":"To początek cyklu życia informacji."},{"t":"Dane → wiedza → informacje → wartość","ok":false,"w":"Wiedza powstaje z informacji, nie odwrotnie."}],"src":"COBIT 5 Framework (EN), sekcja załącznik G, aktywator 5, rysunek 35","pomoc":{"t":"Pytanie dotyczy lekcji 2.40 „Aktywator 5 – Informacja i cykl informacji”. Cel lekcji: Potrafię opisać cykl informacji od danych do wartości i wiem, że informacja daje korzyść dopiero przez wykorzystanie.","k":["informacja","cykl-informacji"]},"kurs":"Dobrze. Tak wygląda Ilustracja 35 w podręczniku.","kontekst":""}},{"pt":"Arkusz próbny","sp1":"sp1-46","lekcja":"2.40","temat":"Aktywator 5 – Informacja i cykl informacji","k":["informacja","cykl-informacji"]},{"lekcje":["en-k41-jakosc-informacji"],"pt":"Lekcja 2.41","h":"Każde kryterium jakości informacji należy do jednego z trzech podwymiarów","b":"<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>Podwymiar</th><th>Kryteria</th></tr><tr><td><w k=\"jakosc-wewnetrzna\">Jakość wewnętrzna</w></td><td>dokładność, obiektywność, wiarygodność, reputacja</td></tr><tr><td><w k=\"jakosc-kontekstowa\">Jakość kontekstowa</w></td><td>istotność, kompletność, <b>aktualność</b>, ilość, przedstawienie…</td></tr><tr><td><w k=\"dostep-i-bezpieczenstwo\">Dostęp i bezpieczeństwo</w></td><td><w k=\"it-dostepnosc\">dostępność</w>/terminowość, ograniczony dostęp</td></tr></table></div><p>Siedem <b>kryteriów informacji</b> COBIT 4.1 ma w <w k=\"cobit-5\">COBIT 5</w> odpowiedniki wśród tych celów (Rysunek 26).</p>","c":"Aktualność to kryterium kontekstowe – nieaktualna informacja może nadal być dokładna.","s":"COBIT 5 Framework (PL), s. 82; s. 63 (Załącznik F, Ilustracja 26)","ctx":"<p><w k=\"jakosc-informacji\">Kryteria jakości informacji</w> (<span class=\"en\">intrinsic quality, contextual and representational quality, security/accessibility quality</span>) dzielą się na trzy podwymiary. Jakość kontekstowa i reprezentacji obejmuje: istotność, kompletność, aktualność, odpowiednią ilość, zwięzłe i spójne przedstawienie, możliwość interpretacji, jasność przekazu i łatwość posługiwania się. Jakość wewnętrzna nie zależy od tego, kto i kiedy używa informacji. Podręcznik pisze „jakość rzeczywista” i „jakość bezpieczeństwa/dostępności”.</p><p>Załącznik F (s. 63, Ilustracja 26 – na egzaminie Rysunek 26) zestawia siedem kryteriów informacji COBIT 4.1: skuteczność, wydajność, integralność, wiarygodność, dostępność, poufność, zgodność – z celami jakości COBIT 5. <b>Skuteczność</b> (<span class=\"en\">effectiveness</span>) patrzy na informację jak na produkt: wystarczy, że zaspokaja potrzeby odbiorcy, który wykonuje na jej podstawie swoje zadanie (cele: właściwa ilość, istotność, jasność przekazu, możliwość interpretacji, obiektywność). <b>Wydajność</b> (<span class=\"en\">efficiency</span>) patrzy na proces: potrzeby są spełnione <em>i</em> informację zdobywa się oraz wykorzystuje małym nakładem czasu, pieniędzy i wysiłku (cele: wiarygodność, dostępność, łatwość eksploatacji, reputacja).</p><p>Pozostałe kryteria: integralność to kompletność i dokładność; wiarygodność – informacja godna zaufania (ocena bardziej subiektywna niż integralność); dostępność i poufność (ograniczony dostęp) należą do dostępu i bezpieczeństwa; zgodność ze specyfikacjami mieści się w każdym celu, a zgodność z przepisami dotyczy raczej sposobu użycia informacji. Pułapka: podręcznik przy skuteczności pisze „efektywne”, a materiały egzaminacyjne nazywają wydajność „efektywnością”. Trzymaj się sedna: samo spełnienie potrzeby odbiorcy – skuteczność; spełnienie jej małym kosztem i wysiłkiem – wydajność.</p><p>Przykład: raport sprzedaży z błędnymi kwotami narusza dokładność. Raport, który przychodzi po zamknięciu kwartału, narusza aktualność. Gdy kierownik regionu nie może go otworzyć, cierpi dostępność. Gdy raport widzą osoby spoza firmy, naruszony jest ograniczony dostęp.</p>"},{"pt":"Sprawdź się","quiz":{"id":"q-enk-41-3","sylabus":["EN-02-17"],"tresc":"Do którego podwymiaru jakości informacji należą <b>dokładność, obiektywność, wiarygodność i reputacja</b>?","opcje":[{"t":"Jakość bezpieczeństwa i dostępności","ok":false,"w":"Tu należą dostępność i ograniczony dostęp."},{"t":"Jakość wewnętrzna","ok":true,"w":"Dobrze. W podręczniku: jakość rzeczywista."},{"t":"Jakość kontekstowa i reprezentacji","ok":false,"w":"Tu należą m.in. istotność, kompletność, aktualność."},{"t":"Warstwa semantyczna","ok":false,"w":"To warstwa modelu informacji, a nie podwymiar jakości."}],"src":"COBIT 5 Framework (EN), sekcja załącznik G, aktywator 5, rysunek 36","pomoc":{"t":"Pytanie dotyczy lekcji 2.41 „Kryteria jakości informacji – trzy podwymiary”. Cel lekcji: Potrafię przypisać kryterium jakości informacji do jednego z trzech podwymiarów.","k":["jakosc-informacji"]},"kurs":"Dobrze. W podręczniku: jakość rzeczywista.","kontekst":""}},{"pt":"Arkusz próbny","sp1":"sp1-50","lekcja":"2.41","temat":"Kryteria jakości informacji – trzy podwymiary","k":["jakosc-informacji"]},{"lekcje":["en-k42-model-informacji"],"pt":"Lekcja 2.42","h":"Model informacji opisuje informację w sześciu warstwach","b":"<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>Warstwa</th><th>Atrybut</th></tr><tr><td>Fizyczna</td><td>nośnik</td></tr><tr><td>Empiryczna</td><td>kanał dostępu</td></tr><tr><td>Syntaktyczna</td><td>język, format</td></tr><tr><td>Semantyczna</td><td>typ, aktualność, szczegółowość</td></tr><tr><td>Pragmatyczna</td><td>przechowywanie, status</td></tr><tr><td>Społeczna</td><td>kontekst</td></tr></table></div>","c":"Warstwy opisują właściwości informacji, a podwymiary jakości mówią, czy informacja jest dobra.","s":"COBIT 5 Framework (PL), s. 83–84, Przykłady 13–15","ctx":"<p><w k=\"model-informacji\">Model informacji</w> (<span class=\"en\">Information Model</span>) jest dobrą praktyką aktywatora Informacja. Warstwa pragmatyczna obejmuje też innowacyjność i zależność. Społeczna opisuje kontekst, np. umowę albo prawo. Model ma trzy zastosowania (Przykłady 13–15): specyfikację informacji dla nowej aplikacji, określenie wymaganej ochrony informacji i ocenę łatwości korzystania z danych, czyli ich jakości.</p><p>Pułapka: warstwa empiryczna to kanał dostępu, a dostępność to kryterium jakości. „Aktualność” występuje w obu miejscach: jako atrybut semantyczny i jako kryterium jakości kontekstowej. Przykład: zespół projektowy aplikacji bankowej pyta, gdzie trzymać dane (warstwa fizyczna), jak klient do nich dotrze (empiryczna), w jakim formacie je zapisać (syntaktyczna) i jak długo je przechowywać (pragmatyczna).</p>"},{"pt":"Sprawdź się","quiz":{"id":"q-enk-42-3","sylabus":["EN-02-19"],"tresc":"Która warstwa modelu informacji obejmuje atrybut <b>język i format</b>?","opcje":[{"t":"Semantyczna","ok":false,"w":"Semantyczna dotyczy znaczenia."},{"t":"Pragmatyczna","ok":false,"w":"Pragmatyczna dotyczy wykorzystania informacji."},{"t":"Syntaktyczna","ok":true,"w":"Dobrze. Składnia odnosi się do formy informacji."},{"t":"Empiryczna","ok":false,"w":"Empiryczna dotyczy kanału dostępu."}],"src":"COBIT 5 Framework (EN), sekcja załącznik G, aktywator 5: Information Attributes / Uses","pomoc":{"t":"Pytanie dotyczy lekcji 2.42 „Model informacji – sześć warstw i trzy zastosowania”. Cel lekcji: Potrafię wymienić sześć warstw atrybutów informacji i trzy zastosowania modelu informacji.","k":["model-informacji"]},"kurs":"Dobrze. Składnia odnosi się do formy informacji.","kontekst":""}}],"bankRevision":"d5364a80e3507638","legacySp1Order":[null,null,{"sp1":"sp1-46"},null,null,{"sp1":"sp1-50"},null,null]};</script>
