<script>window.DECK={"id":"k-m0-interesariusze","rozdzial":"Rozdział 2 · Zasada 1: Realizacja potrzeb interesariusza · s. 17–22","tytul":"Interesariusze, potrzeby i wyznaczniki","prev":"k-m0-standardy.html","next":"k-m0-wartosc.html","T":{"it-dane":{"t":"Dane","eg":"Dane","pd":"dane","en":"Data","wyj":"Zapisane liczby, słowa, znaki, zdjęcia czy dźwięki – jeszcze bez wyjaśnienia, co znaczą.\n\nKtoś wpisuje albo urządzenie zapisuje fakt, np. numer telefonu. Komputer przechowuje go jako dane. Gdy dane zestawimy z wyjaśnieniem („to numer klienta, który zgłosił reklamację”), powstaje informacja.\n\nŻeby zapisać fakty raz i móc z nich korzystać wiele razy: liczyć, porównywać, wysyłać.","zycie":"Na paragonie widzisz „4,99” i „12.05”. To dane. Informacją stają się, gdy wiesz: „4,99 zł zapłaciłam 12 maja za chleb”.","firma":"Sklep internetowy zbiera dane o zamówieniach: datę, kwotę, adres. Dopiero zestawione pokazują, co sprzedaje się najlepiej.","urzad":"Rachmistrze GUS (Głównego Urzędu Statystycznego) zbierają w spisie powszechnym odpowiedzi: wiek, wykształcenie, liczbę pokoi w mieszkaniu. Każda odpowiedź to pojedyncza dana. Dopiero zestawione i opisane pokazują na przykład, ile rodzin w województwie mieszka w ciasnych mieszkaniach.","it":"Dane są surowcem aktywatora Informacja; COBIT 5 mówi o kontekście danych: dokładności, dostępności, aktualności i jakości (FW-PL s. 91).","egz":"Odróżnienie danych od informacji pomaga zrozumieć aktywator Informacja i jakość informacji (dzień 3). Na egzaminie słowo „dane” rzadko pada samodzielnie. Nie myl z: Informacja – Dane to zapisane fakty. Informacja to dane, które coś komuś mówią w danej sytuacji.; Plik – Plik to „pojemnik” na dane w komputerze. Dane to jego zawartość.","src":"COBIT 5 Framework (PL), s. 91"},"wyznacznik":{"t":"Czynnik wpływający na potrzeby interesariuszy","eg":"Czynnik wpływający na potrzeby interesariuszy","pd":"Wyznacznik","en":"Driver / Stakeholder drivers","wyj":"Coś, co sprawia, że ludzie zaczynają czegoś potrzebować, np. nowy przepis, awaria albo nowa technologia.\n\nWyznaczniki (stakeholder drivers) to czynniki zewnętrzne i wewnętrzne, np. zmiany strategii, otoczenia biznesowego i regulacyjnego oraz nowe technologie. Wpływają na potrzeby interesariuszy (stakeholder needs). To krok 1 kaskady celów (goals cascade): potem potrzeby przekłada się na cele organizacji, cele związane z IT i cele aktywatorów.\n\nŻeby wiedzieć, skąd biorą się i dlaczego zmieniają się potrzeby interesariuszy, od których zaczyna się kaskada celów.","zycie":"Rodzi się Wam dziecko. Nagle potrzebujecie większego auta, innego budżetu i elastycznych godzin pracy. Samo dziecko nie jest potrzebą – to wyznacznik, który zmienia Wasze potrzeby.","firma":"Wchodzi przepis o kasach fiskalnych online. Właściciel małego sklepu spożywczego musi wymienić kasę i nauczyć sprzedawczynie nowej obsługi. Przepis to wyznacznik, który tworzy w sklepie nową potrzebę.","urzad":"Ustawa o doręczeniach elektronicznych nakłada na urzędy nowy obowiązek. Urząd gminy musi założyć skrzynkę do e-Doręczeń i zmienić pracę kancelarii. Ustawa to zewnętrzny wyznacznik, który zmienia potrzeby urzędu.","it":"Nowa regulacja o cyberbezpieczeństwie to wyznacznik. Zmienia potrzeby interesariuszy, a kaskada celów prowadzi od nich do celów związanych z IT (bezpieczeństwo informacji, zgodność) i do procesów APO13 (Zarządzanie bezpieczeństwem) oraz MEA03 (Monitorowanie, ocena i oszacowanie zgodności z wymogami zewnętrznymi).","egz":"Wyznacznikami są zmiany strategii, otoczenia biznesowego i regulacyjnego oraz nowe technologie (s. 17). Dobre praktyki, jakość kontekstowa i wskaźniki to pojęcia z modelu aktywatora, czyli inna kategoria. Podręcznik używa słowa „wyznacznik”. Na egzaminie pytanie bywa opisowe: „czynnik wpływający na potrzeby interesariuszy”. Nie myl tego słowa „czynnik” z „czynnikiem umożliwiającym” (aktywatorem). Nie myl z: Aktywator – Aktywator (czynnik umożliwiający) POMAGA osiągnąć cele – np. proces czy struktura. Wyznacznik WYWOŁUJE zmianę potrzeb.; Zdarzenie wyzwalające (trigger event) – Pojęcie z wdrożenia (IM): zdarzenie, które uruchamia program usprawnień, np. fuzja. Podobne w duchu, ale inny obszar sylabusa.","src":"COBIT 5 Framework (PL), s. 17, 91"},"interesariusz":{"t":"Interesariusz","eg":"Interesariusz","pd":"Interesariusz","en":"Stakeholder","wyj":"Każdy, kogo dana sprawa obchodzi, bo coś na niej zyska albo straci.\n\nSpisuje się wszystkich, którzy mają wobec organizacji oczekiwania, odpowiadają za nią albo ponoszą skutki jej działań (stakeholders). Dzieli się ich na wewnętrznych (internal: zarząd, kierownictwo, właściciele procesów, użytkownicy, audyt wewnętrzny) i zewnętrznych (external: klienci, dostawcy, regulatorzy, audytorzy zewnętrzni, udziałowcy). Ich potrzeby (stakeholder needs) Ład ocenia i przekłada na cele organizacji.\n\nŻeby organizacja wiedziała, czyje potrzeby ma zaspokajać i przed kim się rozlicza. Od interesariuszy zaczyna się cała kaskada celów COBIT 5.","zycie":"Wspólnota w bloku decyduje o wymianie windy. Pani z parteru zapłaci tyle samo co inni, choć z windy nie korzysta, starszy pan z dziesiątego piętra bez niej nie wyjdzie z domu, a zarządca chce zamknąć temat przed zimą. Każde z nich coś na tej decyzji zyskuje albo traci – wszyscy są interesariuszami, także ci, którzy windą nie jeżdżą.","firma":"Właściciel piekarni kupuje na kredyt nowy piec. Piekarze martwią się, czy ogarną nową obsługę, klienci liczą na świeże bułki od szóstej, bank pyta o spłatę rat, a sanepid przyjdzie sprawdzić, czy wszystko jest zgodnie z przepisami. Każdy z nich coś zyska albo straci na tej decyzji: piekarze to interesariusze wewnętrzni, klienci, bank i sanepid – zewnętrzni.","urzad":"Urząd gminy przenosi zapisy do przedszkoli do internetu. Rodzice chcą zapisać dziecko z telefonu, dyrektorki przedszkoli boją się bałaganu na listach, a babcia, która wychowuje wnuka, nie ma komputera i pyta, czy dalej może przyjść z papierem. Wszyscy oni są interesariuszami tej zmiany – również babcia, która z systemu nigdy nie skorzysta.","it":"W EDM05 (Zapewnienie przejrzystości dotyczącej interesariuszy) zarząd ustala, którym interesariuszom i jak raportuje wyniki IT, np. udziałowcom raport kwartalny, a regulatorowi wymagane sprawozdania. Relacje z interesariuszami biznesowymi wewnątrz organizacji prowadzi APO08 (Zarządzanie relacjami).","egz":"Rozróżniaj interesariuszy wewnętrznych (kierownictwo, zarząd, CIO, właściciele procesów, audyt wewnętrzny) i zewnętrznych (klienci, partnerzy biznesowi, regulatorzy, dostawcy, audytorzy zewnętrzni). Źródło: Ilustracja 7 (s. 22); por. s. 69 (il. 29). Nie myl z: Shareholder – udziałowiec / akcjonariusz – Udziałowiec to tylko jeden z interesariuszy – ten, który ma udziały. Interesariuszem jest też np. klient czy regulator, choć nie ma żadnych udziałów.; Użytkownik systemu – Użytkownik jest interesariuszem, ale interesariuszem może być też ktoś, kto z systemu w ogóle nie korzysta (np. pacjent czekający na wynik badania).; Decydent – Interesariusz nie musi podejmować decyzji – wystarczy, że decyzja na niego wpływa.","src":"COBIT 5 Framework (PL), s. 22, 93"},"potrzeba":{"t":"Potrzeba interesariusza","eg":"Potrzeba interesariusza","pd":"Potrzeba interesariusza","en":"Stakeholder need","wyj":"Czego ktoś naprawdę chce albo potrzebuje od tego, co robimy.\n\nInteresariusze (stakeholders) mają potrzeby (stakeholder needs), które zmieniają się pod wpływem wyznaczników (drivers), np. nowych przepisów albo technologii. Ład ocenia i równoważy te często sprzeczne potrzeby w kategoriach realizacji korzyści, optymalizacji ryzyka i optymalizacji zasobów. Kaskada celów przekłada je potem na cele organizacji, cele związane z IT i cele aktywatorów.\n\nŻeby wszystko, co robi organizacja i jej informatyka, wynikało z tego, czego naprawdę potrzebują interesariusze, a nie z gotowych pomysłów na rozwiązania.","zycie":"Mama mówi: „Kupmy nowy telefon, ten jest do niczego”. Przy kolacji okazuje się, że telefon pada o 15:00, a ona czeka wtedy na telefony ze szkoły. Potrzeba to bateria na cały dzień, a nie nowy model – wystarczy wymiana baterii za 150 zł.","firma":"Klientka cukierni prosi o „aplikację do zamawiania”. Właściciel dopytuje i słyszy, że chodzi o pewność, że tort urodzinowy będzie gotowy na sobotę na 14:00. Tę potrzebę spełnia zwykły formularz z potwierdzeniem SMS-em – aplikacja była tylko jej pomysłem na rozwiązanie.","urzad":"Kierownik wydziału architektury w starostwie żąda „nowego systemu”. Na spotkaniu wychodzi, że pozwolenia czekają 30 dni, a powinny najwyżej 14, bo teczki krążą między pokojami. Potrzeba to krótszy czas obsługi wniosku – nowy system to tylko jeden ze sposobów.","it":"Zarząd potrzebuje pewności, że organizacja przestrzega przepisów o ochronie danych. W kaskadzie celów ta potrzeba staje się celem organizacji „zgodność z zewnętrznymi przepisami”, potem celami związanymi z IT, a w procesach trafia m.in. do MEA03 (Monitorowanie, ocena i oszacowanie zgodności z wymogami zewnętrznymi).","egz":"W kaskadzie: wyznaczniki → potrzeby interesariuszy → cele organizacji (Ilustracja 4). Nie myl z: Oczekiwanie – Oczekiwanie to proponowany sposób; potrzeba to cel, który za nim stoi. COBIT zaczyna od potrzeb, nie od gotowych rozwiązań.; Czynnik wpływający na potrzeby interesariuszy – Wyznacznik (driver) to przyczyna zmiany potrzeby (np. nowa ustawa), a nie sama potrzeba.","src":"COBIT 5 Framework (PL), s. 17"},"polityka":{"t":"Polityka","eg":"Polityka","pd":"Polityka","en":"Policy","wyj":"Spisane reguły: co wolno, czego nie wolno, kogo to dotyczy i co grozi za złamanie.\n\nKierownictwo formalnie zatwierdza politykę (policy), czyli szczegółowe wytyczne, jak w praktyce stosować zasady (principles). Polityka musi być dostępna dla interesariuszy, a dobra polityka jest skuteczna, wydajna i nieinwazyjna. Ma cykl życia: powstaje, jest stosowana, przeglądana i aktualizowana. W COBIT 5 należy do aktywatora „Zasady, Polityki i Struktury ramowe”.\n\nŻeby ogólne zasady organizacji przełożyć na konkretne reguły postępowania, które każdy zna i stosuje w codziennej pracy.","zycie":"Rodzice mają ogólną zasadę: dzieci uczą się rozsądnie wydawać pieniądze. Żeby to działało, wieszają na lodówce kartkę: 50 zł kieszonkowego co poniedziałek, bez zaliczek, za skoszenie trawy dodatkowe 20 zł. Ta kartka to polityka – przekłada ogólną zasadę na konkretne reguły.","firma":"Właściciel biura rachunkowego powtarza: „dane klientów chronimy”. Pracownicy dostają od niego jedną stronę reguł: hasło co najmniej 12 znaków, blokada ekranu przy odejściu od biurka, żadnych plików klientów na prywatnym pendrivie. To polityka – szczegółowa, zatwierdzona przez szefa i dostępna dla każdego.","urzad":"Wójt zatwierdza politykę bezpieczeństwa informacji urzędu: kto ma dostęp do których rejestrów, jak zgłosić zgubiony telefon służbowy, jak niszczyć wydruki z danymi. Urzędnicy mają ją w intranecie, a raz w roku sekretarz ją przegląda i aktualizuje. Tak działa polityka: spisana przez kierownictwo, znana wszystkim i żywa.","it":"W procesie APO13 (Zarządzanie bezpieczeństwem) kierownictwo zatwierdza politykę bezpieczeństwa informacji z konkretnymi regułami, np. o hasłach, dostępie zdalnym i klasyfikacji danych. Przekłada ona zasady bezpieczeństwa organizacji na codzienne postępowanie i jest częścią aktywatora „Zasady, Polityki i Struktury ramowe”.","egz":"Cechy dobrej polityki: skuteczna, wydajna, nieinwazyjna. Odpowiedzi typu „inwazyjna”, „ograniczona liczbowo” (to cecha ZASAD) czy „wyraża główne wartości” (też ZASADY) są błędne. Nie myl z: Zasady, Polityki i Struktury ramowe – Polityka to element aktywatora 1, a nie cały aktywator.","src":"COBIT 5 Framework (PL), s. 67, 92"},"organizacja":{"t":"Organizacja","eg":"Organizacja","pd":"Przedsiębiorstwo","en":"Enterprise","wyj":"Firma, urząd, szkoła czy szpital: ludzie, którzy razem robią coś w jakimś celu.\n\nW COBIT 5 organizacja (enterprise) to podmiot, który ma interesariuszy, ich potrzeby i własne cele (enterprise goals). Ład i Zarządzanie IT służą temu, by organizacja te cele osiągała. Podręcznik tłumaczy enterprise jako „przedsiębiorstwo”, a egzamin jako „organizacja”, ale chodzi o to samo, także o sektor publiczny i not-for-profit.\n\nŻeby jednym słowem mówić o każdej zorganizowanej całości z celami: firmie, urzędzie, szpitalu czy uczelni, bo COBIT 5 stosuje się do wszystkich, nie tylko do biznesu.","zycie":"Klub szachowy przy osiedlowym domu kultury ma skarbnika, składki i wspólny cel: utrzymać salę i co roku zorganizować turniej. Nikt na tym nie zarabia, a mimo to są pieniądze, ludzie i decyzje do podjęcia. Dla COBIT 5 to też organizacja – nie trzeba być firmą, żeby z niego korzystać.","firma":"Pani Ania prowadzi jednoosobowy sklep internetowy z ceramiką, a jej brat spółkę z 200 pracownikami. Oboje mają swoje cele, pieniądze i informatykę, od której zależą. Dla COBIT 5 obie firmy są organizacjami, bez względu na wielkość.","urzad":"Szpital powiatowy, urząd gminy i szkoła podstawowa nie zarabiają dla właścicieli, ale mają budżet, ludzi, systemy i cele do osiągnięcia. COBIT 5 wprost mówi, że nadaje się też dla sektora publicznego i not-for-profit. Każda z tych instytucji jest więc organizacją w rozumieniu egzaminu.","it":"Gdy szpital publiczny realizuje APO02 (Zarządzanie strategią), też jest organizacją (enterprise) w rozumieniu COBIT 5: jego cele, np. ciągłość opieki nad pacjentami, są w kaskadzie celów celami organizacji, choć szpital nie działa dla zysku.","egz":"Gdy w pytaniu widzisz „organizacja”, w podręczniku szukaj „przedsiębiorstwo”. Podręcznik: „przedsiębiorstwo”, egzamin: „organizacja”. Chodzi o każdą organizację – także urząd czy szpital publiczny, nie tylko firmę. Nie myl z: Firma komercyjna – „Przedsiębiorstwo” w COBIT ≠ tylko firma nastawiona na zysk.","src":"COBIT 5 Framework (PL), s. 13"},"it-klient":{"t":"Klient","eg":"Klient","pd":"—","en":"Client","wyj":"Urządzenie albo program, który prosi serwer o dane albo o wykonanie zadania.\n\nKlikasz w aplikacji „Pokaż saldo”. Aplikacja wysyła prośbę przez sieć do serwera. Czeka. Gdy przyjdzie odpowiedź, pokazuje ją na ekranie.\n\nŻeby urządzenie użytkownika mogło korzystać z danych i pracy innego komputera, nie trzymając wszystkiego u siebie.","zycie":"Przeglądarka w telefonie jest klientem: prosi serwer gazety o stronę z wiadomościami.","firma":"W banku 300 komputerów kasjerów to klienci jednego systemu bankowego na serwerach w centrali.","urzad":"W urzędzie marszałkowskim 120 komputerów urzędników to klienci jednego systemu obiegu dokumentów, który działa na serwerach w siedzibie urzędu. Gdy urzędnik otwiera sprawę, jego komputer wysyła prośbę do serwera i czeka na odpowiedź. Pismo pojawia się na ekranie dopiero wtedy, gdy serwer je odeśle.","it":"W COBIT 5 słowo „klient” oznacza głównie odbiorcę usług organizacji (np. perspektywa „Klient”, FW-PL s. 19), a nie urządzenie.","egz":"Na egzaminie „klient” występuje w znaczeniu biznesowym (np. perspektywa „Klient”). Znaczenie techniczne jest potrzebne tylko do zrozumienia usług IT. Nie myl z: Serwer – Klient prosi, serwer odpowiada.; Klient (odbiorca usług) – W biznesie i w COBIT 5 klient to człowiek albo firma korzystająca z usług organizacji, a nie urządzenie.","src":"COBIT 5 Framework (PL), s. 19"},"lad":{"t":"Ład","eg":"Ład","pd":"Nadzór","en":"Governance","wyj":"Szefostwo decyduje, po co i co robimy, i pilnuje, czy idziemy w dobrą stronę.\n\nOrgan Ładu, zwykle zarząd pod przewodnictwem prezesa, ocenia potrzeby, warunki i opcje interesariuszy (Evaluate), ustala priorytety i podejmuje decyzje (Direct), a potem monitoruje sprawność i zgodność z wyznaczonym kierunkiem (Monitor). Wyniki z Zarządzania wracają do Ładu i cykl się powtarza.\n\nŻeby informatyka robiła to, czego potrzebuje cała organizacja, a nie tylko to, co umieją informatycy.","zycie":"Wspólnota mieszkaniowa na zebraniu rocznym ocenia stan budynku i decyduje: w tym roku najpierw dach, elewacja dopiero za dwa lata, a zarządca co kwartał pokazuje wydatki. Wyboru dekarza i pilnowania ekipy zebranie już nie robi – to robota zarządcy. Ocenić, wyznaczyć kierunek, monitorować: to jest Ład.","firma":"Właścicielka restauracji raz na kwartał siada z wynikami i decyduje: celujemy w rodziny z dziećmi, marża ma wynosić co najmniej 20%, a za trzy miesiące sprawdzamy, czy to działa. Co i jak gotować każdego dnia, ustala już szef kuchni. Ona sprawuje Ład, on zarządza.","urzad":"Rada gminy przyjmuje strategię cyfryzacji: najpierw e-usługi dla mieszkańców, potem nowy system księgowy. Ustala na to budżet i co pół roku każe sobie przedstawić, co zrobiono. Wybór dostawcy i prowadzenie wdrożenia zostawia urzędowi – rada sprawuje Ład, a nie zarządza projektem.","it":"W EDM03 (Zapewnienie optymalizacji ryzyka) zarząd ocenia ryzyko IT, ustala apetyt na ryzyko i monitoruje, czy organizacja go nie przekracza.","egz":"Zapamiętaj czasowniki: Ład = Oszacuj, Kieruj, Monitoruj (EDM); odpowiada zarząd pod przewodnictwem prezesa (EN: chairperson – przewodniczący rady/zarządu, nie CEO). Zarządzanie = Planuj, Twórz, Wykonuj, Monitoruj; odpowiada kierownictwo pod przewodnictwem CEO. Egzamin PL: „Ład”. Podręcznik PL: „Nadzór”. EN: Governance. To jedno i to samo pojęcie. Słowo „nadzór” w pytaniu egzaminacyjnym może też pojawić się w zbitce „ład i nadzór”. Nie myl z: Zarządzanie – Zarządzanie (management) planuje, buduje, uruchamia i monitoruje działania ZGODNIE z kierunkiem wyznaczonym przez Ład.; Nadzór w znaczeniu kontroli / inspekcji – Polskie „nadzór” kojarzy się z kontrolą. W COBIT to coś szerszego: także wyznaczanie kierunku i ustalanie priorytetów.; Ład korporacyjny (enterprise governance) – Ład nad IT w organizacji (GEIT) jest CZĘŚCIĄ ładu korporacyjnego (Zasada 2).","src":"COBIT 5 Framework (PL), s. 14, 91"},"aktywator":{"t":"Aktywator","eg":"Aktywator","pd":"Czynnik umożliwiający","en":"Enabler","wyj":"Wszystko, co musi zagrać, żeby informatyka działała dobrze: ludzie, reguły, narzędzia, informacje.\n\nCOBIT 5 dzieli aktywatory (enablers) na 7 kategorii, od Zasad, polityk i struktur ramowych (Principles, Policies and Frameworks) po Ludzi, umiejętności i kompetencje (People, Skills and Competencies). Kaskada celów wyznacza, czego oczekujemy od każdego aktywatora (cele aktywatora). Aktywatory są od siebie zależne i dostarczają sobie wejść, np. proces potrzebuje informacji i przeszkolonych ludzi. Każdy opisuje się w 4 wymiarach: interesariusze, cele, cykl życia, dobre praktyki.\n\nŻeby organizacja widziała wszystko, co musi zagrać, by osiągnąć cele, a nie tylko technologię. Aktywatory to elementy, przez które Ład i Zarządzanie realnie wpływają na wynik.","zycie":"Chcesz, żeby dzieci same odrabiały lekcje. Ustalacie zasadę „najpierw zadania, potem tablet”, stałą godzinę po obiedzie, kupujecie biurko z lampką, a Ty w tym czasie też siadasz z książką zamiast z telefonem. Zasada, stała pora, biurko i Twój przykład to różne aktywatory – działają dopiero razem.","firma":"Właścicielka kawiarni chce, żeby kawa smakowała tak samo na każdej zmianie. Spisuje recepturę, ustala kolejność parzenia, szkoli nowego baristę i oddaje ekspres do serwisu. Receptura, sposób parzenia, umiejętności baristy i ekspres to aktywatory – brak jednego psuje całość.","urzad":"Urząd gminy chce wydawać decyzje w terminie. Ma instrukcję kancelaryjną, ustalony obieg wniosku, wydział, który za sprawę odpowiada, system EZD i urzędników po szkoleniu z KPA. Każdy z tych elementów to aktywator innej kategorii.","it":"Proces DSS04 Zarządzanie ciągłością to aktywator z kategorii Procesy, ale działa tylko razem z innymi: polityką ciągłości (Zasady, polityki i struktury ramowe), aktualnym planem awaryjnym (Informacja), stanowiskiem zapasowym (Usługi, infrastruktura i aplikacje) i przećwiczonym zespołem (Ludzie, umiejętności i kompetencje).","egz":"Pułapka terminologiczna nr 1 obok Ład/Nadzór. Liczba kategorii: 7. Liczba zasad: 5. Liczba procesów: 37. Egzamin: „Aktywator”. Podręcznik: „Czynnik umożliwiający”. EN: Enabler. W pytaniach egzaminacyjnych prawie zawsze pada „Aktywator”. Nie myl z: Czynnik wpływający na potrzeby interesariuszy – Wyznacznik zmienia potrzeby; aktywator pomaga je zaspokoić.; Komponent (COBIT 2019) – W COBIT 2019 aktywatory nazwano „komponentami systemu ładu”. Na egzaminie COBIT 5 używaj „aktywator”.","src":"COBIT 5 Framework (PL), s. 14, 91"}},"S":[{"pt":"Lekcje 0.10–0.11","h":"Interesariuszem jest każdy, kogo sprawa obchodzi – grupę wyznacza przynależność","b":"<blockquote>„Każda osoba, na której spoczywa odpowiedzialność za <w k=\"organizacja\">przedsiębiorstwo<\/w>, mająca wobec niego oczekiwania lub jakiś udział w przedsiębiorstwie”<\/blockquote><ul><li><w k=\"interesariusz\">Interesariusz<\/w> wewnętrzny należy do organizacji, zewnętrzny – nie.<\/li><li>Częstość kontaktów nie ma znaczenia.<\/li><\/ul>","c":"Nie trzeba decydować ani korzystać z systemu – a rzecz, np. serwer, nigdy nie jest interesariuszem.","s":"COBIT 5 Framework (PL), s. 22 (Ilustracja 7), 93","ctx":"<p>Wystarczy jedna z trzech rzeczy: odpowiedzialność, oczekiwania albo udział. Odpowiedzi „interesariusz to użytkownik systemu”, „to decydent” albo „to udziałowiec” są za wąskie. <em>Stakeholder<\/em> (interesariusz) to nie <em>shareholder<\/em> (udziałowiec) – udziałowiec jest tylko jednym z wielu interesariuszy. Baza danych nie ma oczekiwań, więc jest zasobem.<\/p><p>Rysunek 7 dzieli interesariuszy na wewnętrznych i zewnętrznych. Pary, które egzamin lubi zamieniać: audyt wewnętrzny – wewnętrzny, audytorzy zewnętrzni i organy nadzorcze – zewnętrzni; zarząd – wewnętrzny, udziałowcy – zewnętrzni. Konsultanci i dostawcy są zewnętrzni, nawet jeśli rok pracują w siedzibie firmy.<\/p><p>Przykład: urząd skraca godziny obsługi telefonicznej po uruchomieniu e-wniosków. Starszy mieszkaniec bez internetu nie skorzysta z systemu, ale odczuje zmianę – jest interesariuszem, choć nie użytkownikiem.<\/p>"},{"pt":"Sprawdź się","quiz":{"tresc":"Które stwierdzenie najlepiej opisuje <b>interesariusza<\/b> (<em>Stakeholder<\/em>) w COBIT 5?","opcje":[{"t":"Każdy, kto ma wobec organizacji oczekiwania, udział lub odpowiedzialność","ok":true,"w":"Tak opisuje interesariusza słowniczek podręcznika (Załącznik H)."},{"t":"Użytkownik końcowy, który codziennie korzysta z systemów informatycznych","w":"Użytkownik jest interesariuszem, ale interesariusz nie musi korzystać z systemu."},{"t":"Członek zarządu, który podejmuje decyzje o inwestycjach w IT","w":"Decydent jest interesariuszem, ale nie jedynym. Decyzja może dotyczyć kogoś bez jego udziału."},{"t":"Udziałowiec (<em>Shareholder<\/em>), czyli właściciel akcji lub udziałów organizacji","w":"Pułapka językowa: shareholder to udziałowiec, a nie stakeholder. Udziałowiec jest tylko jednym z interesariuszy."}],"src":"COBIT 5 Framework (PL), s. 93","pomoc":{"t":"Pytanie dotyczy lekcji 0.10 „Kim jest interesariusz”. Cel lekcji: Potrafię wskazać interesariuszy sprawy, także tych, którzy o niej nie decydują i nie korzystają z systemu.","k":["interesariusz"]}}},{"pt":"Sprawdź się","quiz":{"tresc":"Która grupa zawiera <b>wyłącznie<\/b> interesariuszy zewnętrznych według COBIT 5?","opcje":[{"t":"Zarząd, klienci, dostawcy, konsultanci","w":"Zarząd to interesariusz wewnętrzny."},{"t":"Klienci, dostawcy, udziałowcy, audytorzy zewnętrzni","ok":true,"w":"Wszystkie te grupy są po stronie zewnętrznej Ilustracji 7 (na egzaminie: Rysunek 7)."},{"t":"Użytkownicy IT, organy nadzorcze, klienci","w":"Użytkownicy IT to interesariusze wewnętrzni."},{"t":"Audyt wewnętrzny, organy nadzorcze, partnerzy biznesowi","w":"Pułapka nazwy: audyt wewnętrzny jest wewnętrzny, choć kontroluje innych. Zewnętrzni są audytorzy zewnętrzni."}],"src":"COBIT 5 Framework (PL), s. 22, Ilustracja 7","pomoc":{"t":"Pytanie dotyczy lekcji 0.11 „Interesariusze wewnętrzni i zewnętrzni”. Cel lekcji: Potrafię zaliczyć interesariusza do grupy wewnętrznej albo zewnętrznej według Ilustracji 7 (na egzaminie: Rysunek 7).","k":[]}}},{"pt":"Lekcje 0.12–0.13","h":"Potrzeba to stan do osiągnięcia, nie zamówione rozwiązanie","b":"<ul><li><w k=\"potrzeba\">Potrzeba interesariusza<\/w> <span class=\"en\"><w k=\"interesariusz\">Stakeholder<\/w> need<\/span>: „<w k=\"it-klient\">klient<\/w> widzi historię swoich spraw”.<\/li><li>Prośba: „kupcie nowy system” – tylko jeden pomysł.<\/li><li>Potrzeby bywają sprzeczne – waży je <w k=\"lad\">Ład<\/w>.<\/li><\/ul>","c":"Pytaj „po co?”, aż dojdziesz do stanu, który da się sprawdzić.","s":"COBIT 5 Framework (PL), s. 17","ctx":"<p>Rozróżnienie potrzeby i prośby to narzędzie kursu – COBIT 5 mówi po prostu o potrzebach interesariuszy. Pomaga, bo podręcznik każe zaczynać od potrzeb: trzeba je przekształcić w strategię złożoną z konkretnych działań, w kolejności potrzeba → cel → rozwiązanie. Odpowiedź zaczynająca od technologii („kupić aplikację”) zwykle jest dystraktorem.<\/p><p>Dla każdego interesariusza „tworzenie wartości” znaczy co innego, niekiedy rzeczy wykluczające się. Ład (podręcznik: nadzór) nie spełnia życzeń po kolei ani nie czeka na zgodę wszystkich: zbiera oczekiwania wszystkich stron, negocjuje i decyduje.<\/p><p>Przykład: zarząd szpitala mówi „potrzebujemy aplikacji”, a pacjenci skarżą się, że nie wiedzą, kiedy będą wyniki. Potrzebą jest „pacjent zna termin wyników” – może wystarczy SMS.<\/p>"},{"pt":"Sprawdź się","quiz":{"tresc":"Szpital wdraża elektroniczną kartotekę. Lekarze chcą szybkiego dostępu, inspektor ochrony danych – ograniczeń, a dyrekcja – niskich kosztów. Co powinno nastąpić przed decyzją?","opcje":[{"t":"Spełnienie oczekiwań lekarzy, bo to oni najczęściej korzystają z systemu","w":"Za wąsko: użytkownicy to tylko jedna grupa interesariuszy."},{"t":"Przekazanie całej decyzji dostawcy, bo najlepiej zna technologię","w":"Dostawca jest interesariuszem zewnętrznym. Nie on waży oczekiwania szpitala."},{"t":"Uwzględnienie oczekiwań wszystkich interesariuszy i ich wyważenie","ok":true,"w":"Podręcznik mówi, że przed decyzją trzeba uwzględnić oczekiwania wszystkich interesariuszy."},{"t":"Wybór najtańszej oferty, bo koszt najłatwiej zmierzyć","w":"Za wąsko: koszt to tylko jedno z oczekiwań."}],"src":"COBIT 5 Framework (PL), s. 17","pomoc":{"t":"Pytanie dotyczy lekcji 0.12 „Różni interesariusze, różne oczekiwania”. Cel lekcji: Potrafię wyjaśnić, że interesariusze mają różne, czasem sprzeczne oczekiwania, i że trzeba je wyważyć przed decyzją.","k":[]}}},{"pt":"Sprawdź się","quiz":{"tresc":"Które zdanie najlepiej opisuje podejście COBIT 5 do potrzeb interesariuszy?","opcje":[{"t":"Dział IT wybiera technologię, a potrzeby dopasowuje się potem do niej","w":"Kolejność odwrócona: najpierw potrzeby, potem rozwiązania."},{"t":"Potrzeby interesariuszy to wyznaczniki, czyli czynniki wpływające na potrzeby","w":"Pomieszanie pojęć: wyznacznik to przyczyna zmiany potrzeby, a nie sama potrzeba."},{"t":"Potrzeby ustala dostawca systemu na podstawie swojej oferty","w":"Potrzeby należą do interesariuszy, a nie wynikają z oferty dostawcy."},{"t":"Potrzeby interesariuszy przekłada się na konkretne cele i działania","ok":true,"w":"Podręcznik: potrzeby trzeba przekształcić w strategię złożoną z konkretnych działań."}],"src":"COBIT 5 Framework (PL), s. 17","pomoc":{"t":"Pytanie dotyczy lekcji 0.13 „Potrzeba a oczekiwanie”. Cel lekcji: Potrafię odróżnić potrzebę interesariusza od prośby o konkretne rozwiązanie.","k":["potrzeba"]}}},{"pt":"Lekcje 0.14–0.15","h":"Wyznacznik wywołuje potrzebę, aktywator pomaga ją spełnić","b":"<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>Pojęcie<\/th><th>Rola<\/th><th>Przykład<\/th><\/tr><tr><td><w k=\"wyznacznik\">Wyznacznik<\/w> <span class=\"en\"><w k=\"interesariusz\">Stakeholder<\/w> Driver<\/span><\/td><td>przyczyna<\/td><td>nowy przepis o ochronie danych<\/td><\/tr><tr><td><w k=\"potrzeba\">Potrzeba<\/w><\/td><td>skutek<\/td><td><w k=\"it-dane\">dane<\/w> klientów bezpieczne<\/td><\/tr><tr><td><w k=\"aktywator\">Aktywator<\/w> <span class=\"en\">Enabler<\/span><\/td><td>środek<\/td><td>nowa <w k=\"polityka\">polityka<\/w> ochrony danych<\/td><\/tr><\/table><\/div>","c":"„Czynnik wpływający na potrzeby” to wyznacznik, a „czynnik umożliwiający” – aktywator.","s":"COBIT 5 Framework (PL), s. 14, 17","ctx":"<p>Podręcznik wymienia trzy wyznaczniki: zmiany w strategii, zmiany w otoczeniu biznesowym i regulacyjnym (jeden wyznacznik) oraz nowe technologie. Na egzaminie wyznacznik bywa opisany jako „czynnik wpływający na potrzeby interesariuszy”, a w podręczniku aktywator to „czynnik umożliwiający” – to samo słowo, dwa pojęcia. Gdy pytanie dotyczy tego, co zmienia potrzeby, szukaj strategii, otoczenia albo technologii; procesy, polityki i zespoły to aktywatory.<\/p><p>Kolejność jest stała: wyznacznik → potrzeba → cele organizacji; odpowiedź, która nazywa potrzebę przyczyną, jest błędna. Wyznacznik to też nie zdarzenie wyzwalające, które uruchamia wdrożenie COBIT 5 – ta sama zmiana może być jednym albo drugim, zależnie od etapu, o który pyta egzamin.<\/p><p>Przykład: konkurent sklepu internetowego wprowadza dostawę w dwie godziny (zmiana otoczenia biznesowego). Klienci zaczynają tego oczekiwać (potrzeba). Nowy proces logistyki to aktywator.<\/p><p>W materiałach szkoleniowych zmiany w otoczeniu porządkuje się często skrótem PESTEL: czynniki polityczne, ekonomiczne, społeczne, technologiczne, prawne i środowiskowe (wiedza ogólna, nie ma go w podręczniku). To wygodna lista kontrolna do szukania <w k=\"wyznacznik\">wyznaczników<\/w> – na egzaminie liczy się jednak to, że wyznacznik jest zmianą, która rodzi nowe potrzeby interesariuszy.<\/p>"},{"pt":"Sprawdź się","quiz":{"tresc":"Bank zastanawia się, co może zmienić potrzeby jego interesariuszy. Która odpowiedź jest zgodna z COBIT 5?","opcje":[{"t":"Przejście konkurencji na obsługę wyłącznie mobilną","ok":true,"w":"To zmiana otoczenia biznesowego, czyli jeden z trzech wyznaczników."},{"t":"Czynnik umożliwiający, np. proces zarządzania zmianą","w":"Pułapka słowa „czynnik”: czynnik umożliwiający to aktywator, a nie wyznacznik."},{"t":"Nowa polityka bezpieczeństwa informacji banku","w":"Polityka pomaga spełniać potrzeby – to aktywator, inna kategoria."},{"t":"Nowy podział ról i obowiązków w dziale IT banku","w":"Struktura i role to aktywatory. Nie wywołują potrzeb, tylko pomagają je spełnić."}],"src":"COBIT 5 Framework (PL), s. 17","pomoc":{"t":"Pytanie dotyczy lekcji 0.14 „Skąd się biorą nowe potrzeby – wyznaczniki”. Cel lekcji: Potrafię wymienić trzy wyznaczniki, które zmieniają potrzeby interesariuszy, i rozpoznać je w przykładzie.","k":["wyznacznik"]}}},{"pt":"Sprawdź się","quiz":{"tresc":"Pytanie egzaminacyjne mówi o „czynniku wpływającym na potrzeby interesariuszy”. Jak to pojęcie nazywa polski podręcznik COBIT 5?","opcje":[{"t":"Cel przedsiębiorstwa","w":"Cel organizacji to dalszy krok kaskady, a nie przyczyna zmiany potrzeb."},{"t":"Wyznacznik","ok":true,"w":"Podręcznik: „wyznaczniki dotyczące interesariuszy” (<em>Stakeholder drivers<\/em>)."},{"t":"Zdarzenie wyzwalające","w":"Zdarzenie wyzwalające uruchamia wdrożenie COBIT 5 – inna kategoria."},{"t":"Czynnik umożliwiający","w":"Tak podręcznik nazywa aktywator (<em>Enabler<\/em>) – inne pojęcie mimo słowa „czynnik”."}],"src":"COBIT 5 Framework (PL), s. 17","pomoc":{"t":"Pytanie dotyczy lekcji 0.15 „Wyznacznik – z czym go nie mylić”. Cel lekcji: Potrafię odróżnić wyznacznik od potrzeby i od aktywatora, także gdy pytanie używa słowa „czynnik”.","k":[]}}}]};</script>
