<script>window.DECK={"id":"k-mt-aktywatory","rozdzial":"Poza podręcznikiem · Mentor i finał","tytul":"Mentor: aktywatory i procesy","prev":"k-mt-lad-kaskada.html","next":"k-mt-zdolnosc.html","T":{"proc-apo07":{"t":"APO07 Zarządzanie zasobami ludzkimi","eg":"APO07 Zarządzanie zasobami ludzkimi","pd":"APO07 Zarządzanie zasobami ludzkimi","en":"APO07 Manage Human Resources","wyj":"Dbanie o ludzi w informatyce: kogo zatrudnić, czego ich nauczyć, kto kogo zastąpi i jak ich oceniać.\n\nZapewnienie odpowiednich ludzi i kompetencji, przez planowanie zatrudnienia, rozwój oraz utrzymanie personelu.\n\nŻeby w IT pracowali właściwi ludzie z właściwymi umiejętnościami i żeby nic nie zależało od jednej osoby.","zycie":"W rodzinnej piekarni tylko dziadek umie zrobić zakwas. Gdy zachoruje, nie ma chleba. Rodzina postanawia: wnuczka uczy się od dziadka i co tydzień piecze z nim. Dbanie o umiejętności i zastępstwa to APO07.","firma":"W firmie transportowej jeden informatyk zna system rozliczeń kierowców. Kierownik IT planuje szkolenie drugiej osoby i ocenia kompetencje zespołu. Raz w roku rozmawia z każdym o celach. To APO07.","urzad":"Sekretarz powiatu widzi, że informatyk odchodzi na emeryturę. Planuje nabór, wdrożenie następcy i szkolenia. Ustala też zasady pracy firmy zewnętrznej, która pomaga w serwisie. To APO07.","it":"Kierownik IT ma plan sukcesji dla administratora bazy danych i matrycę kompetencji zespołu. To APO07. Spisana instrukcja administratora to już BAI08.","egz":"Słowa-klucze: obsada, kompetencje, szkolenia, ocena pracowników, zależność od kluczowych osób, personel zewnętrzny → APO07 Human Resources. Nie EDM04 i nie BAI09. Nazwa egzaminacyjna PL niepotwierdzona: na egzaminie nazwa może brzmieć inaczej niż w podręczniku. Egzamin używa własnych tłumaczeń, w domenach trybu rozkazującego (np. „Dostosuj, Planuj i Organizuj”). Rozpoznawaj proces po kodzie APO07 i słowie kluczowym EN Human Resources. Pułapka „zasoby”: APO07 to Human Resources (tylko ludzie). EDM04 to Resource (wszystkie zasoby, Ład). BAI09 to Assets (aktywa). Nie myl z: EDM04 Zapewnienie optymalizacji zasobów – EDM04 (Ład) ocenia i kieruje wykorzystaniem wszystkich zasobów. APO07 (Zarządzanie) zajmuje się ludźmi: obsadą, kompetencjami, szkoleniami.; BAI09 Zarządzanie zasobami – BAI09 Assets to sprzęt i licencje. W podręczniku też „zasoby”, ale nie ludzie.; BAI08 Zarządzanie wiedzą – BAI08 utrzymuje wiedzę: instrukcje, bazy wiedzy. APO07 dba o ludzi i ich umiejętności.; Ludzie, Umiejętności i Kompetencje – To aktywator, czyli kategoria „czego potrzebujemy”. APO07 to proces, który ludźmi zarządza.","src":"COBIT 5: Enabling Processes, sekcja APO07 — Process Description / Purpose / Practices"},"prm":{"t":"Referencyjny Model Procesu","eg":"Referencyjny Model Procesu","pd":"Model referencyjny procesu COBIT 5","en":"Process Reference Model (PRM)","wyj":"Gotowa lista 37 typowych zadań informatyki w każdej firmie czy urzędzie, podzielona na pięć szuflad.\n\nReferencyjny Model Procesu (Process Reference Model) ma 37 procesów w dwóch obszarach: Ład (domena EDM, Evaluate, Direct and Monitor, 5 procesów) i Zarządzanie (4 domeny PBRM: APO 13, BAI 10, DSS 6, MEA 3, razem 32). Każdy proces ma opis, cele, praktyki, działania, wejścia i wyjścia oraz tabelę RACI. Model nie jest normatywny: organizacja dopasowuje go do siebie, a w ocenie zdolności tworzy on wymiar procesu.\n\nŻeby każda organizacja miała kompletny wzorzec procesów Ładu i Zarządzania IT, z którym może porównać swoją praktykę i znaleźć luki, zamiast wymyślać wszystko od zera.","zycie":"Młodzi po ślubie dostają od rodziców listę „co trzeba ogarniać w domu”: rachunki, zakupy, sprzątanie, naprawy, ubezpieczenia. U nich rachunkami i ubezpieczeniami zajmuje się jedna osoba w jeden wieczór w miesiącu, a napraw prawie nie ma, bo mieszkanie jest nowe. Lista od rodziców jest jak PRM – wzorzec, który każdy dopasowuje do siebie.","firma":"Właściciel warsztatu czyta listę 37 procesów COBIT i łapie się za głowę. Konsultant tłumaczy: to wzorzec, nie obowiązek – u Ciebie jedna osoba może zajmować się i dostawcami, i umowami, i sprzętem. Ważne tylko, żeby żaden istotny obszar nie został bez opieki.","urzad":"Informatyk w urzędzie gminy kładzie obok siebie listę procesów PRM i to, co urząd faktycznie robi. Kopie zapasowe i obsługę zgłoszeń mają, ale nikt nie pilnuje umów z dostawcami oprogramowania. PRM posłużył jako wzorzec do znalezienia luki, a nie jako 37 procedur do napisania.","it":"Organizacja porównuje swoją pracę z PRM i widzi, że ma kopie zapasowe (DSS04) i obsługę incydentów (DSS02), ale nikt nie prowadzi APO10 (Zarządzanie dostawcami). Luka trafia do planu doskonalenia, a pozostałe procesy organizacja łączy i przycina według swojej wielkości.","egz":"Liczby: 5 + 32 = 37 (EDM 5, APO 13, BAI 10, DSS 6, MEA 3). W ocenie zdolności PRM tworzy wymiar procesu. Nie myl z: Model oceny procesu (PAM) – PAM ocenia zdolność procesów z PRM. PRM to sam zestaw procesów (wymiar procesu).","src":"COBIT 5 Framework (PL), s. 32; COBIT 5 Framework (PL), s. 33; COBIT 5 Framework (PL), s. 33, Ilustracja 16"},"zasady-polityki-struktury":{"t":"Zasady, Polityki i Struktury ramowe","eg":"Zasady, Polityki i Struktury ramowe","pd":"Zasady, polityki i metodyki","en":"Principles, Policies and Frameworks (enabler 1)","wyj":"Spisane reguły i wskazówki, które mówią ludziom, jak mają postępować na co dzień.\n\nTo aktywator 1 (Principles, Policies and Frameworks). Zasady to niewiele prostych zdań o podstawowych wartościach organizacji. Polityki to bardziej szczegółowe wytyczne, jak te zasady stosować; dobra polityka jest skuteczna, wydajna i nieinwazyjna. Struktury ramowe dają strukturę i narzędzia, a polityki realizuje się przede wszystkim przez praktyki procesów.\n\nŻeby przekazać ludziom wytyczne i instrukcje organu Ładu i kierownictwa: co jest ważne, jak postępować na co dzień i z jakich narzędzi korzystać.","zycie":"Rodzice ustalają zasadę domu: „Szanujemy wspólny czas”. Z niej wynika polityka: telefony odkładamy przy kolacji, wyjątek to dyżur pod telefonem w pracy, kto złamie, zmywa naczynia, a w niedzielę sprawdzamy, jak nam idzie. Zasada jest krótka i ogólna, polityka mówi, jak ją stosować.","firma":"Właścicielka sklepu internetowego ma zasadę: „Klient zawsze wie, za co płaci”. Spisuje politykę zwrotów: 14 dni, wyjątek dla rzeczy szytych na zamówienie, raz w miesiącu sprawdza, czy pracownicy jej przestrzegają. Zasada mówi, co jest ważne, polityka – jak to robić.","urzad":"Wójt ogłasza zasadę: „Urząd działa jawnie”. Sekretarz przygotowuje politykę udostępniania informacji publicznej: czego dotyczy, w jakim terminie odpowiadamy, kiedy odmawiamy (np. tajemnica przedsiębiorstwa) i kto pilnuje terminów. Zasada jest krótka, polityka szczegółowa.","it":"APO01 (Zarządzanie metodyką zarządzania IT) obejmuje przekazywanie celów i kierunku zarządzania oraz utrzymywanie polityk IT. Polityka bezpieczeństwa informacji z APO13 (Zarządzanie bezpieczeństwem) działa dopiero wtedy, gdy realizują ją praktyki procesów, np. w DSS05 (Zarządzanie usługami bezpieczeństwa).","egz":"Na egzaminie: zasady = podstawowe wartości (mało, prosto); polityki = szczegółowe wytyczne stosowania zasad; struktury ramowe = otwarte i elastyczne. Cechy dobrej polityki: skuteczna, wydajna, nieinwazyjna. Najważniejszy nośnik wykonywania polityk to praktyki procesu. Egzamin: „Zasady, Polityki i Struktury ramowe” (czasem „modele ramowe”). Podręcznik: „Zasady, polityki i metodyki”. „Zasady” w tym aktywatorze (principles organizacji) ≠ 5 zasad COBIT 5. Nie myl z: Pięć zasad COBIT 5 – Pięć zasad COBIT 5 to fundament samej metodyki. Zasady w aktywatorze 1 to wartości TWOJEJ organizacji.; Procedura – Procedura opisuje kroki. Polityka mówi, co i dlaczego ma obowiązywać.","src":"COBIT 5 Framework (PL), s. 67; COBIT 5 Framework (PL), s. 67, Ilustracja 28; COBIT 5 Framework (PL), s. 68"},"ludzie-umiejetnosci-kompetencje":{"t":"Ludzie, Umiejętności i Kompetencje","eg":"Ludzie, Umiejętności i Kompetencje","pd":"Ludzie, umiejętności i kompetencje","en":"People, Skills and Competencies (enabler 7)","wyj":"Właściwi ludzie z właściwą wiedzą na właściwych miejscach.\n\nDla każdej roli określa się wymagane umiejętności i kompetencje (skills and competencies), przypisane do kategorii umiejętności w domenach procesów. W cyklu życia planuje się bazę umiejętności, rozwija ją szkoleniami albo pozyskuje z zewnątrz, wykorzystuje w rolach, okresowo ocenia i wygasza umiejętności, które przestają być potrzebne. Cele obejmują m.in. wykształcenie i umiejętności techniczne (jakość wewnętrzna) oraz doświadczenie, wiedzę i dostępność ludzi (jakość kontekstowa).\n\nŻeby w każdej roli byli ludzie z wiedzą i umiejętnościami potrzebnymi do wykonania pracy, podejmowania decyzji i naprawiania błędów.","zycie":"Babcia zostaje sama po śmierci dziadka, który zawsze płacił rachunki. Wnuczka przez kilka niedziel uczy ją bankowości w telefonie, po miesiącu sprawdza, czy babcia radzi sobie sama, a rozliczenie podatku zleca znajomej księgowej, bo tego babcia uczyć się nie musi. Ustalić, jakie umiejętności są potrzebne, a potem je wyćwiczyć albo wziąć z zewnątrz – tego dotyczy ten aktywator.","firma":"Piekarnia kupuje piec sterowany z panelu dotykowego. Właściciel spisuje, co musi umieć piekarz na nocnej zmianie, jednego pracownika wysyła na szkolenie u producenta, a gdy drugi odchodzi, przyjmuje kogoś, kto takie piece już obsługiwał. Po pół roku sprawdza, kto sobie radzi, a ręczne pilnowanie temperatury przestaje być umiejętnością, której trzeba uczyć – to cały cykl życia aktywatora Ludzie, Umiejętności i Kompetencje.","urzad":"Szkoła przechodzi na e-dziennik. Dyrektor ustala, co musi umieć każdy nauczyciel i sekretarka, organizuje szkolenie, a konfigurację systemu zleca informatykowi z gminy, zamiast uczyć tego kogoś na miejscu. Na koniec semestru sprawdza, kto jeszcze potrzebuje pomocy – właściwi ludzie z właściwymi umiejętnościami we właściwych rolach to sedno tego aktywatora.","it":"W APO07 (Zarządzanie zasobami ludzkimi) dział IT ustala, że administrator kopii zapasowych musi umieć odtworzyć bazę danych, a na nocnej zmianie zawsze jest ktoś z tą umiejętnością. Brakujące kompetencje uzupełnia szkoleniem albo umową z firmą zewnętrzną.","egz":"Dobra praktyka: wymagania umiejętności dla każdej roli + mapowanie kategorii umiejętności na domeny procesów + zewnętrzne źródła (SFIA). Nie myl z: APO07 Zarządzanie zasobami ludzkimi – APO07 to proces. Ludzie, umiejętności i kompetencje to aktywator.","src":"COBIT 5 Framework (PL), s. 87; COBIT 5 Framework (PL), s. 87, Ilustracja 38"},"tworzenie-wartosci":{"t":"Tworzenie Wartości – Cel Ładu","eg":"Tworzenie Wartości – Cel Ładu","pd":"Tworzenie wartości – cel nadzoru","en":"Value Creation (governance objective)","wyj":"Pożytek większy niż koszt i ryzyko: dostajemy korzyści, nie przepłacając i nie narażając się bez potrzeby.\n\nTworzenie wartości (value creation) to cel Ładu wynikający z potrzeb interesariuszy. Składa się z trzech elementów: realizacji korzyści (benefits realisation), optymalizacji ryzyka (risk optimisation) i optymalizacji zasobów (resource optimisation). Ład równoważy je przy każdej decyzji, pytając, kto odnosi korzyści, kto ponosi ryzyko i jakie zasoby są potrzebne; w procesach odpowiadają za to EDM02, EDM03 i EDM04.\n\nŻeby każdą decyzję o IT oceniać nie tylko po korzyściach, ale też po ryzyku i zużytych zasobach, bo dopiero ich równowaga daje interesariuszom wartość.","zycie":"Zastanawiasz się nad rowerem do dojazdów. Liczysz: 300 zł miesięcznie mniej na paliwo i pół godziny mniej w korkach (korzyść), ryzyko kradzieży i wypadku (kupujesz zapięcie i kask), cena 2500 zł i miejsce w piwnicy (zasoby). Kupujesz, bo te trzy rzeczy się bilansują – to jest tworzenie wartości.","firma":"Właściciel warsztatu rozważa program do rezerwacji wizyt online. Zyska więcej klientów i mniej telefonów, ale ryzykuje wyciek danych klientów, a do tego płaci 150 zł abonamentu i traci dwa dni na szkolenie. Decyduje się, gdy znajduje dostawcę z dobrymi zabezpieczeniami – korzyść, ryzyko i koszt są w równowadze.","urzad":"Starostwo wdraża elektroniczny obieg dokumentów. Sprawy idą o tydzień szybciej (korzyść), ale trzeba robić kopie zapasowe, żeby awaria nie zgubiła akt (ryzyko), i kupić licencje oraz oddelegować dwie osoby do wdrożenia (zasoby). Gdyby system był szybki, ale zawodny albo za drogi, nie byłoby z niego wartości.","it":"W procesach EDM02 (Zapewnienie realizacji korzyści), EDM03 (Zapewnienie optymalizacji ryzyka) i EDM04 (Zapewnienie optymalizacji zasobów) zarząd ocenia inwestycję w usługi chmurowe: jakie korzyści da, czy ryzyko mieści się w apetycie na ryzyko i czy wystarczy ludzi i pieniędzy. Wartość jest dopiero przy równowadze tych trzech ocen.","egz":"Cel Ładu „Tworzenie Wartości” realizuje się przez wszystkie trzy składniki naraz. Odpowiedź z jednym składnikiem jest niepełna (pułapka „zbyt wąskie”). Egzamin: „Cel Ładu”. Podręcznik: „Cel nadzoru”. To ten sam cel – tworzenie wartości. Nie myl z: Zysk – Zysk to tylko jedna postać korzyści. W sektorze publicznym korzyścią są usługi publiczne.; Realizacja korzyści – Realizacja korzyści to tylko jeden z trzech składników tworzenia wartości.","src":"COBIT 5 Framework (PL), s. 17, Ilustracja 3; COBIT 5 Framework (PL), s. 93"},"kultura-etyka-zachowanie":{"t":"Kultura, Etyka i Zachowanie","eg":"Kultura, Etyka i Zachowanie","pd":"Kultura, etyka i zachowanie","en":"Culture, Ethics and Behaviour (enabler 4)","wyj":"Jak ludzie naprawdę się zachowują, gdy nikt nie patrzy, i co uważają za uczciwe.\n\nAktywator obejmuje trzy poziomy: etykę organizacyjną (organisational ethics: wartości, według których organizacja chce działać), etykę indywidualną (individual ethics: osobiste wartości pracownika) i zachowania indywidualne (individual behaviour), które razem tworzą kulturę. Pożądane zachowania wspiera się dobrymi praktykami: komunikowaniem wartości, przykładem kierownictwa i osobami wspierającymi (champions), zachętami i środkami zniechęcającymi oraz regułami i normami. Ważnym mechanizmem komunikowania wartości są zasady i polityki.\n\nŻeby zasady, procesy i decyzje naprawdę były stosowane, bo bez odpowiednich zachowań ludzi najlepsze procedury zostają na papierze.","zycie":"Rodzice zakazują telefonów przy stole, ale sami co chwilę zerkają w ekran. Po tygodniu dzieci robią to samo, bo bardziej patrzą na przykład niż na zakaz. Kultura i zachowanie biorą się z tego, co ludzie widzą u innych, zwłaszcza u tych „na górze”.","firma":"Właściciel firmy robiącej strony internetowe płaci premie tylko za oddanie projektu w terminie. Programiści szybko uczą się pomijać testy, bo za błędy nikt nie rozlicza, a za spóźnienie tak. Zachęty ukształtowały zachowanie – to właśnie aktywator Kultura, Etyka i Zachowanie (podobny przypadek opisuje Przykład 11 w podręczniku).","urzad":"W urzędzie gminy kierownik za każdy błąd robi publiczną awanturę. Urzędniczka, która przez pomyłkę wysłała dane mieszkańca pod zły adres, nikomu o tym nie mówi, więc nikt nie reaguje na czas. Procedura zgłaszania incydentów istnieje, ale kultura obwiniania sprawia, że jest martwa.","it":"W DSS03 (Zarządzanie problemami) zespół analizuje awarie bez szukania winnych, więc informatycy zgłaszają także własne pomyłki. Zachowanie „uczymy się zamiast obwiniać” należy do aktywatora Kultura, Etyka i Zachowanie i decyduje, czy proces dostaje prawdziwe dane.","egz":"„Wartości, w oparciu o które organizacja chce działać” → etyka organizacyjna. Dobra praktyka promowania zachowań → np. wskazywanie czempionów (osób wspierających), komunikacja, zachęty, reguły i normy. Mechanizm komunikowania wartości i pożądanego zachowania → zasady i polityki. Nie myl z: Etyka organizacyjna vs indywidualna – Organizacyjna to wartości, w oparciu o które ORGANIZACJA chce działać. Indywidualna to osobiste wartości pracownika (religia, pochodzenie, doświadczenia).","src":"COBIT 5 Framework (PL), s. 79; COBIT 5 Framework (PL), s. 79, Ilustracja 34; COBIT 5 Framework (PL), s. 80"},"zasada-4":{"t":"Zasada 4: Aktywacja holistycznego podejścia","eg":"Zasada 4: Aktywacja holistycznego podejścia","pd":"Zasada 4: Wdrożenie podejścia całościowego","en":"Principle 4: Enabling a Holistic Approach","wyj":"Patrz na całość: sukces zależy od wielu rzeczy naraz, nie tylko od sprzętu.\n\nCOBIT 5 wyróżnia 7 kategorii aktywatorów (enablers), m.in. procesy, struktury organizacyjne, informację oraz ludzi, umiejętności i kompetencje. Aktywatory indywidualnie i kolektywnie decydują o tym, czy Ład i Zarządzanie działają: każdy potrzebuje wejść od innych i dostarcza im wyników. Wszystkie mają cztery wspólne wymiary (interesariusze, cele, cykl życia, dobre praktyki), a ich wydajność mierzą wskaźniki wiodące i opóźnione.\n\nŻeby Ład i Zarządzanie IT budować na wszystkich współpracujących aktywatorach, a nie tylko na technologii czy na pojedynczym procesie.","zycie":"Kupujesz dziecku biurko i lampkę, żeby lepiej się uczyło. Nic się nie zmienia, dopóki nie ustalicie planu dnia, zasady „najpierw lekcje, potem gry”, a Ty sam nie odłożysz telefonu przy kolacji. Dopiero wszystkie te elementy razem dają efekt – to Zasada 4.","firma":"Sklep spożywczy stawia kasę samoobsługową, ale kolejki się nie skracają. Nikt nie pilnuje kasy, kasjerki nie umieją pomóc klientom, a klienci nie wiedzą, że wolno z niej korzystać. Sam sprzęt nie wystarczy, potrzebne są też ludzie, procedury i nawyki – to Zasada 4.","urzad":"Starostwo wdraża elektroniczne zarządzanie dokumentacją. System działa, ale urzędnicy dalej drukują pisma, bo nie ma instrukcji kancelaryjnej ani szkoleń, a kierownik sam woli papier. Bez procesów, ludzi, struktur i kultury system zostaje pustą skorupą – to Zasada 4.","it":"APO13 (Zarządzanie bezpieczeństwem) działa dopiero razem z polityką bezpieczeństwa, strukturą odpowiedzialną za bezpieczeństwo, kulturą zgłaszania incydentów, przeszkolonymi ludźmi, informacją i narzędziami. Przykład 4 z FW-PL: procesy i procedury bezpieczeństwa informacji nie będą skuteczne, jeśli kultura i etyka są nieodpowiednie.","egz":"Liczba 7 aktywatorów i 4 wymiary aktywatora to tematy Zasady 4. Pytania o „jakość kontekstową”, „wskaźniki wiodące” i „cykl życia aktywatora” też należą do Zasady 4. Egzamin (uzasadnienia SP1): „Aktywacja holistycznego podejścia” – „aktywacja”, bo egzamin tłumaczy enabler jako „aktywator”. Podręcznik: „Wdrożenie podejścia całościowego”. Rozpoznawaj po słowach: holistyczne / całościowe / aktywatory. Nie myl z: Zasada 2: Pokrycie całej organizacji – Zasada 2: CAŁA organizacja (zakres). Zasada 4: WSZYSTKIE rodzaje aktywatorów (całościowe podejście).","src":"COBIT 5 Framework (PL), s. 27; COBIT 5 Framework (PL), s. 27, Ilustracja 12; COBIT 5 Framework (PL), s. 28"},"proc-edm04":{"t":"EDM04 Zapewnienie optymalizacji zasobów","eg":"EDM04 Zapewnienie optymalizacji zasobów","pd":"EDM04 Zapewnienie optymalizacji zasobów","en":"EDM04 Ensure Resource Optimisation","wyj":"Szefostwo pilnuje, żeby ludzi, pieniędzy i sprzętu do informatyki było tyle, ile trzeba, i żeby ich nie marnować.\n\nZapewnienie odpowiednich zasobów IT i ich optymalnego wykorzystania do wspierania celów przedsiębiorstwa.\n\nŻeby IT miało dość ludzi, pieniędzy i technologii do realizacji celów i żeby tych zasobów nie marnować.","zycie":"Planujesz przeprowadzkę. Sprawdzasz, czy wystarczy rąk do noszenia, pieniędzy na auto i czasu. Sam nie nosisz kartonów. Decydujesz, ile czego potrzeba i czy niczego nie marnujesz. To EDM04.","firma":"Zarząd firmy kurierskiej widzi, że dwóch programistów obsługuje dziesięć systemów, a serwery stoją w połowie puste. Każe przesunąć pieniądze ze sprzętu na ludzi. Dyrektor IT wykonuje to w swoich procesach. Zarząd sprawdza efekt po kwartale.","urzad":"Starosta widzi, że każdy wydział kupuje własne skanery i programy, a część sprzętu stoi nieużywana. Decyduje: jeden wspólny zakup i jeden informatyk na trzy wydziały. Potem sprawdza, czy zasoby nie leżą odłogiem. To EDM04.","it":"Zarząd ocenia, że dział IT ma za mało specjalistów od chmury i za dużo nieużywanych licencji. Ustala kierunek: mniej licencji, więcej szkoleń. Wykonują to APO07 Zarządzanie zasobami ludzkimi i BAI09.","egz":"Trzy „zasoby”: EDM04 Resource Optimisation (Ład, wszystkie zasoby), APO07 Human Resources (Zarządzanie, ludzie), BAI09 Assets (Zarządzanie, aktywa). W pytaniu szukaj poziomu (kierunek czy wykonanie) i rodzaju zasobu. Nazwa egzaminacyjna PL niepotwierdzona: na egzaminie nazwa może brzmieć inaczej niż w podręczniku. Egzamin używa własnych tłumaczeń, w domenach trybu rozkazującego (np. „Dostosuj, Planuj i Organizuj”). Rozpoznawaj proces po kodzie EDM04 i słowie kluczowym EN Resource Optimisation. Pułapka tłumaczenia „zasoby”: EDM04 to Resource (wszystkie zasoby, Ład), APO07 to Human Resources (zasoby ludzkie), a BAI09 to Assets (aktywa, w podręczniku też „Zarządzanie zasobami”). Po polsku trzy razy „zasoby”, po angielsku trzy różne słowa. Nie myl z: APO07 Zarządzanie zasobami ludzkimi – APO07 (Zarządzanie) zajmuje się tylko ludźmi: role, kompetencje, szkolenia, zastępstwa. EDM04 (Ład) patrzy na wszystkie zasoby i ustala kierunek.; BAI09 Zarządzanie zasobami – BAI09 Manage Assets to aktywa: sprzęt i licencje w cyklu życia. Podręcznik nazywa go „Zarządzanie zasobami”, ale to nie EDM04.; Optymalizacja zasobów – Optymalizacja zasobów to składnik Celu Ładu (pojęcie). EDM04 to proces Ładu, który go zapewnia.","src":"COBIT 5: Enabling Processes, sekcja EDM04 — Process Description / Purpose / Practices"},"proc-bai09":{"t":"BAI09 Zarządzanie zasobami","eg":"BAI09 Zarządzanie zasobami","pd":"BAI09 Zarządzanie zasobami","en":"BAI09 Manage Assets","wyj":"Prowadzisz spis sprzętu i licencji: co masz, gdzie to jest, ile kosztuje i kiedy wymienić.\n\nZarządzanie aktywami IT przez cały cykl życia, z kontrolą wartości, wykorzystania, kosztów i zobowiązań licencyjnych.\n\nŻeby wiedzieć, jaki sprzęt i licencje masz, ile kosztują i kiedy je wymienić. Policzone aktywa łatwiej chronić.","zycie":"Masz w domu teczkę: kiedy kupiłeś pralkę, do kiedy jest gwarancja, ile lat ma laptop i kiedy odnowić antywirusa. Gdy laptop się zestarzeje, kasujesz dane i oddajesz go do elektrośmieci. To zarządzanie aktywami.","firma":"Biuro rachunkowe pilnuje, żeby licencji nie było mniej niż stanowisk, i planuje wymianę laptopów.","urzad":"W starostwie każdy komputer i każda licencja ma numer inwentarzowy, datę zakupu i osobę odpowiedzialną. Informatyk co roku sprawdza, czy licencji na program biurowy nie jest mniej niż 120 stanowisk, i planuje wymianę najstarszych komputerów. Przy likwidacji sprzętu dysk niszczy się protokolarnie, żeby dane mieszkańców nie wyszły poza urząd.","it":"Praktyki BAI09: identyfikacja i ewidencja aktywów, aktywa krytyczne, cykl życia, optymalizacja kosztów i zarządzanie licencjami.","egz":"Tłumacz z angielskiego: Assets → BAI09, Configuration → BAI10, Human Resources → APO07, Resource Optimisation → EDM04. Słowa-klucze BAI09: ewidencja, licencje, cykl życia sprzętu, wycofanie. Podręcznik: „BAI09 Zarządzanie zasobami”. Na egzaminie nazwa procesu może brzmieć inaczej niż w podręczniku. Egzamin PL tłumaczy po swojemu, często trybem rozkazującym (np. domena „Twórz, Nabywaj i Wdrażaj” zamiast „Budowanie, nabywanie i wdrażanie”). Egzaminacyjnej nazwy tego procesu nie potwierdziliśmy, dlatego rozpoznawaj go po kodzie i angielskim słowie kluczowym: Assets. „Zasoby” to tu assets, czyli aktywa (sprzęt, oprogramowanie, licencje). To NIE są zasoby ludzkie (APO07 Human Resources) ani optymalizacja zasobów (EDM04 Resource Optimisation). Nie myl z: BAI10 Zarządzanie konfiguracją – BAI09 patrzy na rzecz jak na majątek: koszt, właściciel, gwarancja, licencja, wymiana. BAI10 patrzy na nią jak na element systemu: ustawienia, wersja i powiązania z usługą.; APO07 Zarządzanie zasobami ludzkimi – APO07 to zasoby LUDZKIE (Human Resources). BAI09 to aktywa – rzeczy i licencje.; EDM04 Zapewnienie optymalizacji zasobów – EDM04 to decyzja Ładu, czy zasoby (ludzie, pieniądze, sprzęt) są wystarczające i dobrze użyte. BAI09 to codzienne prowadzenie aktywów IT.; Zasób – „Zasób” (resource) w COBIT to wszystko, co pomaga osiągnąć cele. Aktywa z BAI09 to tylko część zasobów.","src":"COBIT 5: Enabling Processes, sekcja BAI09 — Process Description / Purpose / Practices"},"uslugi-infrastruktura-aplikacje":{"t":"Usługi, Infrastruktura i Aplikacje","eg":"Usługi, Infrastruktura i Aplikacje","pd":"Usługi, infrastruktura i aplikacje","en":"Services, Infrastructure and Applications (enabler 6)","wyj":"Sprzęt, sieć, programy i usługi, na których stoi cała informatyka.\n\nBaseline architecture to architektura bazowa opisująca stan obecny. Docelowa opisuje przyszły stan, a przejściowa etapy pośrednie. Reference architecture jest wzorcem referencyjnym i nie jest synonimem architektury bazowej.\n\nŻeby nazwać i świadomie prowadzić techniczną podstawę IT: sprzęt, sieć, programy i usługi, z których korzystają procesy organizacji.","zycie":"W domu masz router, laptopa i aplikację, która sama wrzuca zdjęcia z telefonu do chmury. Router i laptop to infrastruktura, aplikacja do zdjęć to aplikacja, a „zdjęcia same się zapisują i każdy w rodzinie je widzi” to usługa. Gdy planujecie wymianę routera, macie stan obecny i docelowy – to już myślenie architekturą.","firma":"Sklep internetowy z rękodziełem stoi na wynajętym serwerze, działa na gotowej platformie sklepowej i korzysta z bramki płatności. Właścicielka umawia się z firmą hostingową, że sklep ma działać 99,9% czasu. Serwer to infrastruktura, platforma to aplikacja, a działający sklep z umówioną dostępnością to usługa z poziomem usług.","urzad":"Szkoła podstawowa ma pracownię komputerową, szkolne Wi-Fi i dziennik elektroniczny. Dyrektor ustala z firmą serwisową, że awarię dziennika usuwa się w ciągu jednego dnia roboczego. Komputery i sieć to infrastruktura, dziennik to aplikacja, a działający dziennik z gwarantowanym czasem naprawy to usługa z poziomem usług.","it":"APO03 (Zarządzanie architekturą korporacyjną) opisuje obecną i docelową architekturę serwerów, sieci i aplikacji, a APO09 (Zarządzanie umowami o świadczenie usług) ustala poziomy usług, np. dostępność systemu 99,9%. DSS01 (Zarządzanie eksploatacją) utrzymuje tę infrastrukturę w codziennym działaniu.","egz":"Informacja jest jedną ze zdolności do świadczenia usług (zdolności usługowych), a zdolności te wykorzystuje się poprzez procesy, by świadczyć usługi wewnętrzne i zewnętrzne (s. 86). Egzamin: „Zdolność usługowa”. Podręcznik: „Zdolność do świadczenia usług” (service capabilities). Nie myl z: zdolnosc-procesu – Zdolność usługowa opisuje zasoby do świadczenia usług, a zdolność procesu określa model PAM.","src":"COBIT 5 Framework (EN), sekcja załącznik G, aktywator 6: Good Practices"}},"S":[{"lekcje":["mt-k15-incydent-siedem-aktywatorow","mt-k16-granica-aktywatorow"],"pt":"Lekcje MT.15–MT.16","h":"Incydent ma przyczyny w kilku aktywatorach – pytaj, co dokładnie zawiodło","b":"<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>Co zawiodło</th><th>Aktywator</th></tr><tr><td>dokument</td><td><w k=\"zasady-polityki-struktury\">Zasady, Polityki i Struktury ramowe</w></td></tr><tr><td>praca</td><td>Procesy</td></tr><tr><td>decyzja</td><td>Struktury organizacyjne</td></tr><tr><td>zachowanie</td><td><w k=\"kultura-etyka-zachowanie\">Kultura, Etyka i Zachowanie</w></td></tr><tr><td>dane</td><td>Informacja</td></tr><tr><td>technika</td><td><w k=\"uslugi-infrastruktura-aplikacje\">Usługi, Infrastruktura i Aplikacje</w></td></tr><tr><td>umiejętności</td><td><w k=\"ludzie-umiejetnosci-kompetencje\">Ludzie, Umiejętności i Kompetencje</w></td></tr></table></div>","c":"Nowy serwer naprawia jeden aktywator; trwała naprawa obejmuje kilka.","s":"COBIT 5 Framework (PL), s. 27–28","ctx":"<p><w k=\"zasada-4\">Zasada 4</w>: aktywatory (<span class=\"en\">Enablers</span>) są powiązane – każdy jest w pełni efektywny tylko z wejściami od pozostałych (s. 28). Przykład: sklep internetowy przez trzy godziny wyprzedaży nie przyjmuje zamówień. Brak reguły testów (polityka), nikt nie zaplanował pojemności (procesy), zakup bez decyzji komitetu (struktury), przemilczane spowolnienia (kultura), prognoza ruchu sprzed roku (informacja), za mała pojemność serwerów (usługi), konfigurację zna jedna osoba (ludzie).</p><p>Przypadki graniczne rozstrzyga pytanie o to, co dokładnie zawiodło (skrót dydaktyczny kursu). Regulamin z karą za błędy to dokument → polityka, a strach przed zgłaszaniem to zachowanie → kultura; podręcznik mówi, że bez odpowiedniej kultury procedury bezpieczeństwa nie będą skuteczne (s. 28). Nieaktualny adres klienta: treść danych → Informacja, brak aktualizacji → Procesy. CIO to rola osoby, komitet sterujący IT – Struktury organizacyjne. Jedna sytuacja może mieć poprawnie dwie przyczyny.</p>"},{"pt":"Sprawdź się","quiz":{"id":"q-fn-m-27","sylabus":["PR-01-02","EN-02-16"],"tresc":"Który przykład NAJLEPIEJ pokazuje systemowy charakter aktywatorów (zasada 4)?","opcje":[{"t":"Procedury bezpieczeństwa nie działają, bo kultura ich nie wspiera","ok":true,"w":"Siedem aktywatorów to zasady/polityki/ramy; procesy; struktury; kultura/etyka/zachowanie; informacja; usługi/infrastruktura/aplikacje; ludzie/umiejętności/kompetencje. Wspólnie umożliwiają osiąganie celów. Wskazana odpowiedź odpowiada właśnie temu elementowi modelu."},{"t":"Polityka bezpieczeństwa jest formalnie zatwierdzona przez zarząd banku","ok":false,"w":"Zdanie prawdziwe, ale nie pokazuje zależności między aktywatorami."},{"t":"Procesy dzielą się na procesy Ładu i Zarządzania","ok":false,"w":"Podział na procesy Ładu i Zarządzania ilustruje zasadę 5. Pytanie dotyczy natomiast współzależności różnych aktywatorów w zasadzie 4."},{"t":"Każdy aktywator ma własny cykl życia od planowania do wycofania","ok":false,"w":"Zdanie prawdziwe, ale dotyczy wymiarów, a nie zależności."}],"src":"COBIT 5 Framework (EN), sekcja rozdział 5, rysunki 12–13","pomoc":{"t":"Pytanie dotyczy lekcji MT.15 „Jeden incydent, siedem aktywatorów – dlaczego nie ma jednego winnego”. Cel lekcji: Potrafię rozłożyć jeden incydent na siedem aktywatorów i pokazać kursantowi, że trwała naprawa obejmuje kilka z nich.","k":[]},"kurs":"Siedem aktywatorów to zasady/polityki/ramy; procesy; struktury; kultura/etyka/zachowanie; informacja; usługi/infrastruktura/aplikacje; ludzie/umiejętności/kompetencje. Wspólnie umożliwiają osiąganie celów. Wskazana odpowiedź odpowiada właśnie temu elementowi modelu.","kontekst":""}},{"pt":"Sprawdź się","quiz":{"id":"q-fn-m-14","sylabus":["PR-02-12"],"tresc":"Do którego wymiaru aktywatora należą „produkty pracy (wejścia i wyjścia)”?","opcje":[{"t":"Cykl życia","ok":false,"w":"Cykl życia to fazy: od planowania do pozbywania się."},{"t":"Dobre praktyki","ok":true,"w":"Il. 13 i s. 29: dobre praktyki obejmują praktyki oraz produkty pracy (wejścia i wyjścia); w podręczniku: „produkty działań”."},{"t":"Interesariusze","ok":false,"w":"Interesariusze to strony wewnętrzne i zewnętrzne."},{"t":"Cele","ok":false,"w":"Wyniki brzmią jak cele, ale na Rysunku 13 produkty pracy są w dobrych praktykach."}],"src":"COBIT 5 Framework (EN), sekcja rozdział 5, rysunek 13","pomoc":{"t":"Pytanie dotyczy lekcji MT.16 „Przyczyna na granicy dwóch aktywatorów – „co dokładnie zawiodło?””. Cel lekcji: Potrafię przypisać przyczynę z pogranicza dwóch aktywatorów, pytając, co dokładnie zawiodło.","k":[]},"kurs":"Il. 13 i s. 29: dobre praktyki obejmują praktyki oraz produkty pracy (wejścia i wyjścia); w podręczniku: „produkty działań”.","kontekst":""}},{"lekcje":["mt-k17-37-procesow-szuflady","mt-k18-pary-procesow"],"pt":"Lekcje MT.17–MT.18","h":"37 procesów: zapamiętaj układ i pytania, które rozplątują pary","b":"<p>EDM 5, APO 13, BAI 10, DSS 6, MEA 3.</p><div class=\"tblwrap\"><table class=\"tbl\"><tr><th>Para</th><th>Pytanie</th></tr><tr><td>EDM03 / APO12</td><td>ile ryzyka akceptujemy czy jakie ryzyka mamy?</td></tr><tr><td>DSS02 / DSS03</td><td>przywrócić usługę czy usunąć przyczynę?</td></tr><tr><td>BAI09 / APO07 / EDM04</td><td>zasoby: rzeczy, ludzie czy kierunek?</td></tr></table></div>","c":"Słowo w nazwie wskazuje temat, a pytanie o rodzaj pracy – konkretny proces.","s":"COBIT 5 Framework (PL), s. 17, 33, Ilustracja 16","ctx":"<p><w k=\"prm\">Model referencyjny procesu</w> łatwiej zapamiętać przez jedno słowo na domenę (skrót kursu): EDM – kierunek, APO (Dostosuj, Planuj i Organizuj) – przygotowanie, BAI (Twórz, Nabywaj i Wdrażaj) – zmiana, DSS (Dostarczaj, Obsługuj i Wspieraj) – codzienność, MEA – kontrola. EDM odbija <w k=\"tworzenie-wartosci\">tworzenie wartości</w>: EDM02 korzyści, EDM03 ryzyko, EDM04 zasoby, do tego EDM01 ramy Ładu i EDM05 przejrzystość.</p><p>Kolejne pary: BAI05 – ludzie przyjmują zmianę, BAI06 – zmiana IT zatwierdzona, BAI07 – rozwiązanie odebrane; BAI04 – zwykły wzrost obciążenia, DSS04 – poważna awaria (ciągłość); APO13 – system zarządzania bezpieczeństwem, DSS05 – codzienne zabezpieczenia; APO09 – obietnica dla odbiorcy usług, APO10 – umowa z dostawcą; APO05 – w co inwestujemy, BAI01 – jak prowadzimy projekt.</p><p>„Zasoby”: ewidencja serwerów i licencji to <w k=\"proc-bai09\">BAI09</w>, rekrutacja specjalisty w szpitalu – <w k=\"proc-apo07\">APO07</w>, decyzja zarządu, ile ludzi i pieniędzy dać na IT – <w k=\"proc-edm04\">EDM04</w>. Proces trafia do domeny według najwłaściwszego obszaru działania (s. 33).</p>"},{"pt":"Sprawdź się","quiz":{"id":"q-prb-46-3","sylabus":["PR-01-03"],"tresc":"Ile procesów ma Referencyjny Model Procesu COBIT 5 (<em>Process Reference Model</em>) i jak się dzielą?","opcje":[{"t":"32: po 8 procesów w każdej z czterech domen","ok":false,"w":"Domeny mają różną liczbę procesów, a do 32 dochodzi 5 procesów Ładu."},{"t":"34: tyle samo, ile miał model COBIT 4.1","ok":false,"w":"Model COBIT 5 ma 37 procesów."},{"t":"37: 5 procesów Ładu i 32 procesy Zarządzania","ok":true,"w":"Dobrze. Ilustracja 16 pokazuje 37 procesów: EDM ma 5, a APO, BAI, DSS i MEA razem 32."},{"t":"37: 32 procesy Ładu i 5 procesów Zarządzania","ok":false,"w":"Liczby są zamienione. Ład ma 5 procesów, a Zarządzanie 32."}],"src":"COBIT 5 Framework (EN), sekcja rozdział 6, rysunki 15–16","pomoc":{"t":"Pytanie dotyczy lekcji MT.17 „37 procesów w pięciu szufladach – jak pomóc je zapamiętać”. Cel lekcji: Potrafię pokazać kursantowi układ 37 procesów (5–13–10–6–3) z jednym słowem na domenę i EDM jako lustrem tworzenia wartości.","k":[]},"kurs":"Dobrze. Ilustracja 16 pokazuje 37 procesów: EDM ma 5, a APO, BAI, DSS i MEA razem 32.","kontekst":""}},{"pt":"Sprawdź się","quiz":{"id":"q-fin-pliki-29","sylabus":["PR-02-06","PR-01-04"],"tresc":"Na posiedzeniu Rady ds. Informatyki dyrektor IT mówi: „Naszym priorytetem jest cel związany z Informatyką 04, czyli zarządzanie ryzykiem biznesowym związanym z IT. Skoro 04, to wdrażamy proces APO04”. Na czym polega błąd?","opcje":[{"t":"Nic – numer celu związanego z Informatyką zawsze wskazuje proces APO o tym samym numerze.","ok":false,"w":"Takiej reguły nie ma. Na przykład APO13 wspiera w przykładzie 8 cele 02, 04, 06, 10, 14, 07 i 08, a nie cel 13."},{"t":"Cel 04 należy do wymiaru Klient karty IT BSC, więc trzeba wybrać proces z domeny DSS.","ok":false,"w":"Cel 04 należy do wymiaru Finanse (Rysunek 6). Wymiar karty wyników nie wskazuje domeny procesów."},{"t":"Wystarczy zamienić APO04 na APO12 Zarządzanie ryzykiem i na tym poprzestać, bo jeden proces wystarczy.","ok":false,"w":"Nazwa APO12 rzeczywiście dotyczy ryzyka. Ale cel związany z Informatyką wspiera wiele procesów i inne aktywatory, nie jeden proces."},{"t":"Numery celów i procesów to osobne katalogi; APO04 to Zarządzanie innowacjami.","ok":true,"w":"Cel 04 pochodzi z listy 17 celów związanych z Informatyką (Rysunek 6). APO04 pochodzi z listy 37 procesów (Rysunek 16). Procesy dla celu 04 odczytuje się dopiero z Rysunku 23, a i tak trzeba je dostosować do organizacji."}],"src":"COBIT 5 Framework (EN), sekcja rozdział 2; załącznik C, rysunek 23","pomoc":{"t":"Pytanie dotyczy lekcji MT.18 „Procesy, które się mylą – pytania rozstrzygające”. Cel lekcji: Potrafię rozplątać najczęściej mylone procesy jednym pytaniem rozstrzygającym o rodzaj pracy.","k":[]},"kurs":"Cel 04 pochodzi z listy 17 celów związanych z Informatyką (Rysunek 6). APO04 pochodzi z listy 37 procesów (Rysunek 16). Procesy dla celu 04 odczytuje się dopiero z Rysunku 23, a i tak trzeba je dostosować do organizacji.","kontekst":""}}],"bankRevision":"ee61ea95282bb2d3","legacySp1Order":[null,null,null,null,null,null]};</script>
