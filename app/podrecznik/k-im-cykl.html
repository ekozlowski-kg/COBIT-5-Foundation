<script>window.DECK={"id":"k-im-cykl","rozdzial":"Rozdział 7 · Wdrożenie · s. 35–39","tytul":"Cykl życia wdrożenia: trzy pierścienie, siedem faz","prev":"k-im-kontekst.html","next":"k-im-uzasadnienie.html","T":{"projekt":{"t":"Projekt","eg":"Projekt","pd":"Projekt","en":"Project","wyj":"Jednorazowe przedsięwzięcie z początkiem i końcem, np. przeprowadzka biura do nowej siedziby.\n\nProjekt (project) ma początek, koniec, cel, budżet i zespół. Tworzy rezultat (output), np. nowy system, który po zakończeniu przechodzi do procesów, czyli do codziennej pracy. Kilka powiązanych projektów tworzy program (programme), a w COBIT 5 programami i projektami zarządza proces BAI01 (Zarządzanie programami i projektami).\n\nŻeby jednorazową zmianę, np. wdrożenie nowego systemu, przeprowadzić w ustalonym czasie, budżecie i zakresie, a jej efekt przekazać do codziennej pracy.","zycie":"Remontujecie łazienkę: budżet 20 tys. zł, ekipa wchodzi w marcu, w kwietniu odbieracie robotę i remont się kończy. Codzienne sprzątanie tej łazienki to już nie projekt, tylko proces. Projekt ma koniec, proces się powtarza.","firma":"Piekarnia otwiera drugi punkt sprzedaży: trzeba wynająć lokal, kupić ladę, zatrudnić dwie osoby i ruszyć przed świętami. W dniu otwarcia projekt się kończy. Codzienna sprzedaż w nowym punkcie to już zwykła praca.","urzad":"Starostwo buduje portal do zapisów na rejestrację pojazdów: jest harmonogram, budżet z dotacji i termin odbioru. Po uruchomieniu portalu projekt zostaje zamknięty. Codzienna obsługa zapisów przechodzi do wydziału komunikacji.","it":"Wdrożenie nowego systemu kadrowego to projekt prowadzony w procesie BAI01 (Zarządzanie programami i projektami). Po odbiorze system przechodzi do codziennej eksploatacji w DSS01 (Zarządzanie eksploatacją), a projekt zostaje zamknięty.","egz":"Na egzaminie częściej spotkasz „program” (Zarządzanie programem) niż „projekt”. Powielające się projekty to przykład punktu zapalnego (s. 37). Nie myl z: Proces – Proces się powtarza i trwa; projekt się kończy.","src":"materiały kursu"},"faza-3":{"t":"Faza 3: Dokąd chcemy dojść?","eg":"Faza 3: Dokąd chcemy dojść?","pd":"Faza 3: Do czego dążymy?","en":"Phase 3: Where do we want to be?","wyj":"Trzeci krok: mówisz jasno, gdzie chcesz być, i widzisz, ile brakuje do celu.\n\nDefiniujesz stan docelowy, np. wyższy poziom zdolności procesu. Analiza luk pokazuje, czego brakuje. Wybierasz szybkie korzyści i najbardziej opłacalne inicjatywy. Rezultat komunikujesz ludziom, a program układa mapę drogową.\n\nŻeby jasno nazwać cel i zobaczyć lukę między dziś a celem. Wtedy wiesz, co zrobić najpierw.","zycie":"Ważysz 92 kg. Ustalasz cel: 84 kg do lipca. Widzisz lukę – 8 kg. Najprostszy ruch to rzucić słodzone napoje, więc zaczynasz od niego. Mówisz rodzinie, do czego dążysz. To faza 3.","firma":"Sklep chce wysyłać paczki w 2 dni zamiast 4: najpierw nowy kurier, potem nowy magazyn.","urzad":"Starostwo ustala cel: połowa spraw w wydziale komunikacji ma być umawiana przez e-rezerwację, czyli rezerwację wizyt przez Internet. Analiza luk pokazuje, że brakuje systemu rezerwacji i szkoleń dla urzędników. Cel i plan dojścia starosta ogłasza wszystkim pracownikom.","it":"Stan docelowy: DSS02 na poziomie 3. Analiza luk pokazuje braki w atrybutach PA 2.1, PA 2.2, PA 3.1 i PA 3.2.","egz":"Elementy fazy 3: Zdefiniowanie stanu docelowego, Komunikowanie rezultatu, Definiowanie mapy drogowej. Faza 3 to też analiza luk i szybkie korzyści. „Identyfikacja odtwórców ról” to już faza 4. Działanie programu w fazie 3 na egzaminie to „Definiowanie mapy drogowej”. Podręcznik (il. 17) pisze „Zdefiniowanie planu działań”. Słowo „plan” kusi, żeby wskazać fazę 4, a to faza 3. Nie myl z: Faza 4: Co trzeba zrobić? – Mapa drogowa (faza 3) wyznacza kierunek i kolejność kroków. Planowanie programu (faza 4) to szczegółowy plan z projektami i uzasadnieniami biznesowymi.; Faza 2: Gdzie jesteśmy teraz? – Faza 2 opisuje stan obecny. Faza 3 ustala stan docelowy i lukę.","src":"COBIT 5 Framework (PL), s. 38; COBIT 5 Framework (PL), s. 38, Ilustracja 17; materiały Altkom"},"cykl-wdrozenia":{"t":"Cykl Życia Wdrożenia","eg":"Cykl Życia Wdrożenia","pd":"Cykl życia wdrożenia","en":"Implementation life cycle","wyj":"Plan wprowadzania zmian krok po kroku, który się powtarza, bo poprawiać trzeba stale, nie raz.\n\nCykl ma trzy pierścienie: zewnętrzny – zarządzanie programem (programme management), środkowy – aktywowanie zmiany (change enablement), czyli strona ludzka i kulturowa, i wewnętrzny – cykl ciągłego doskonalenia (continual improvement life cycle). Wszystkie trzy przechodzą razem przez 7 faz, od „Jakie są wyznaczniki?” do „Jak utrzymać motywację do działania?”. Po fazie 7 cykl rusza od nowa, bo realizuje się go iteracyjnie.\n\nŻeby wdrażanie COBIT 5 było stałym doskonaleniem, a nie jednorazowym projektem, i żeby obok techniki zadbać o ludzi i o zarządzanie całym programem.","zycie":"Rodzina postanawia zdrowiej jeść. Ktoś musi to poprowadzić: plan, zakupy, budżet (zarządzanie programem). Trzeba też przekonać dzieci, które kochają frytki (aktywowanie zmiany), a po miesiącu sprawdzić, co działa, i poprawić plan posiłków (ciągłe doskonalenie). Te trzy rzeczy dzieją się równolegle, a pętla rusza od nowa przy kolejnym celu – to cykl życia wdrożenia.","firma":"Warsztat przechodzi z zeszytu na program do zleceń. Właściciel pilnuje harmonogramu i kosztów, rozmawia ze starszym mechanikiem, który nie chce „klikać”, i po kwartale poprawia to, co nie działa. Program, ludzie i doskonalenie to trzy pierścienie, które biegną razem przez wszystkie siedem faz.","urzad":"Szkoła wprowadza dziennik elektroniczny. Dyrektor prowadzi to jako program z planem i budżetem, wicedyrektor oswaja nauczycieli, którzy wolą papier, a po pierwszym semestrze zespół poprawia ustawienia i zasady. Program, zmiana w ludziach i ciągłe doskonalenie idą równolegle przez cały cykl życia wdrożenia.","it":"Bank wdraża COBIT 5 po awarii bankowości internetowej: CIO prowadzi program, rozmowy z pracownikami i nowa kultura zgłaszania błędów to aktywowanie zmiany (wspiera je BAI05 Zarządzanie wdrażaniem zmian organizacyjnych), a kolejne usprawnienia procesu DSS02 Zarządzanie zgłoszeniami serwisowymi i incydentami to ciągłe doskonalenie.","egz":"Komponent dotyczący behawioralnych i kulturowych aspektów wdrożenia → Aktywowanie zmiany (pierścień środkowy). Nie myl z: Cykl życia aktywatora – Cykl życia aktywatora (6 faz: planowanie… pozbywanie się) dotyczy pojedynczego aktywatora. Cykl życia wdrożenia dotyczy programu wdrażania COBIT.","src":"COBIT 5 Framework (PL), s. 37; COBIT 5 Framework (PL), s. 38, Ilustracja 17; materiały Altkom"},"pierscien-doskonalenie":{"t":"Główny cykl życia ciągłego doskonalenia","eg":"Główny cykl życia ciągłego doskonalenia","pd":"Podstawowy cykl życia ciągłego doskonalenia","en":"Continual improvement life cycle (inner ring)","wyj":"Stałe poprawianie w kółko: sprawdź, jak jest, popraw, zmierz efekt i zacznij od nowa.\n\nNajpierw rozpoznajesz potrzebę i oceniasz stan obecny. Potem definiujesz stan docelowy, budujesz i wdrażasz usprawnienia. Na koniec eksploatujesz, mierzysz i prowadzisz Monitorowanie i szacowanie. Potem pętla rusza od nowa.\n\nŻeby aktywatory poprawiały się stale, a nie jeden raz. Ten pierścień to samo ulepszanie, krok po kroku.","zycie":"Uczysz się piec chleb. Pieczesz, próbujesz, za twardy – dodajesz wody. Następnym razem za blady – dłużej pieczesz. Nie ma dnia, w którym kończysz naukę na zawsze. To ciągłe doskonalenie.","firma":"Kawiarnia mierzy czas obsługi, dodaje drugą kasę, mierzy znowu i bierze kolejny problem.","urzad":"Urząd gminy co kwartał poprawia jeden krok wydawania zaświadczeń i ponownie mierzy czas. Gdy czas spada z 5 do 3 dni, sekretarz gminy bierze na warsztat kolejny krok. Ta pętla nie ma daty zakończenia.","it":"Ocena zdolności procesu, np. DSS02, w fazie 2 daje stan obecny. Ponowna ocena w fazie 7 pokazuje, czy proces wszedł na wyższy poziom.","egz":"Komponent, który nie jest projektem jednorazowym → (Główny) Cykl życia ciągłego doskonalenia, pierścień wewnętrzny. W arkuszu PL widać jego działania m.in.: Zdefiniowanie stanu docelowego (3), Budowanie usprawnień (4), Wdrażanie usprawnień (5), Monitorowanie i szacowanie (7). Egzamin: „Główny cykl życia ciągłego doskonalenia” albo krótko „Cykl życia ciągłego doskonalenia”. Podręcznik na s. 37: „Podstawowy cykl…”. To ten sam pierścień wewnętrzny. Nie myl go z cyklem życia aktywatora ani z poziomem 5 zdolności. Nie myl z: Cykl życia aktywatora – Cykl życia aktywatora (planowanie… pozbywanie się) opisuje życie jednego aktywatora. Ciągłe doskonalenie to pierścień wdrożenia COBIT.; Poziomy zdolności 0–5 – Poziom 5 (proces zoptymalizowany) to ocena jednego procesu. Ciągłe doskonalenie to sposób prowadzenia wdrożenia, a nie ocena.","src":"COBIT 5 Framework (PL), s. 37; COBIT 5 Framework (PL), s. 38, Ilustracja 17; COBIT 5 Framework (PL), s. 38"},"faza-7":{"t":"Faza 7: Jak utrzymać motywację do działania?","eg":"Faza 7: Jak utrzymać motywację do działania?","pd":"Faza 7: Jak utrzymać obecną dynamikę?","en":"Phase 7: How do we keep the momentum going?","wyj":"Siódmy krok: sprawdzasz, czy całość się udała, i ustalasz, co poprawiać dalej, żeby nie stracić tempa.\n\nWeryfikujesz ogólny sukces inicjatywy. Rozpoznajesz dalsze wymagania dotyczące Ładu i Zarządzania IT. Wzmacniasz potrzebę ciągłego doskonalenia, a pętla wraca do fazy 1. Działanie pierścienia doskonalenia to Monitorowanie i szacowanie.\n\nŻeby sprawdzić sukces całej inicjatywy i nie stracić tempa. Z tej fazy wychodzą cele na następną iterację.","zycie":"Schudłeś 8 kg. Siadasz z żoną i oceniacie cały rok: co zadziałało, co nie. Ustalacie, że teraz zajmiecie się snem. Zostawiacie bieganie we wtorki, żeby nie wrócić do starego. To faza 7.","firma":"Sklep po roku ocenia program logistyki: wysyłki są szybsze, więc następnym celem są zwroty.","urzad":"Po roku starosta ocenia cały program: kolejki w wydziale komunikacji są wyraźnie krótsze. Wpisuje coroczny przegląd do planu pracy starostwa, żeby nie wrócić do starych nawyków. Następnym obszarem zmian wybiera wydział geodezji i pętla zaczyna się od nowa.","it":"Ponowna ocena zdolności DSS02 i raporty z MEA01 pokazują efekt całości. Nowe wymagania, np. dla DSS03, uruchamiają kolejną iterację.","egz":"Faza, w której weryfikuje się ogólny sukces, identyfikuje dalsze wymagania i wzmacnia potrzebę ciągłego doskonalenia → faza 7. Działanie doskonalenia: Monitorowanie i szacowanie. Działanie doskonalenia w fazie 7 to „Monitorowanie i szacowanie”. Nie myl go z domeną MEA (Monitoruj, Oszacuj i Oceń) ani z „Monitoruj” w EDM. Faza 7 nie kończy cyklu: po niej rusza kolejna iteracja. Nie myl z: Monitoruj, Oszacuj i Oceń (MEA) – MEA to domena procesów Zarządzania (Monitoruj, Oszacuj i Oceń). „Monitorowanie i szacowanie” w fazie 7 to działanie pierścienia doskonalenia we wdrożeniu.; Faza 6: Czy dotarliśmy do celu? – Faza 6 sprawdza korzyści tej iteracji. Faza 7 ocenia ogólny sukces i ustala dalsze wymagania.","src":"COBIT 5 Framework (PL), s. 38; COBIT 5 Framework (PL), s. 38, Ilustracja 17"},"pierscien-program":{"t":"Zarządzanie programem","eg":"Zarządzanie programem","pd":"Zarządzanie programem (krąg zewnętrzny)","en":"Programme management (outer ring)","wyj":"Pilnowanie całego przedsięwzięcia: kto prowadzi, ile kosztuje, jakie terminy i czy przyniosło obiecany zysk.\n\nPierścień zewnętrzny ma swoje działanie w każdej z siedmiu faz. Zaczyna od Inicjowania programu, potem definiuje problemy i okazje, mapę drogową i plan. Na końcu realizuje plan, rozlicza korzyści i robi przegląd skuteczności.\n\nŻeby wdrożenie miało sponsora, budżet i terminy. I żeby ktoś na końcu rozliczył, czy dało obiecane korzyści.","zycie":"Organizujesz wesele siostry. Trzymasz listę zadań, budżet i terminy, a po weselu sprawdzasz, czy zmieściliście się w kosztach. To Ty zarządzasz programem, choć nie pieczesz tortu ani nie grasz w zespole.","firma":"Sieć piekarni wdraża wspólny system zamówień: wspólnik pilnuje harmonogramu, budżetu i mniejszych strat pieczywa.","urzad":"Sekretarz powiatu prowadzi program e-rezerwacji wizyt w starostwie. Pilnuje budżetu, harmonogramu i kilku projektów naraz: nowej strony, szkoleń i biletomatów. Po pół roku rozlicza, czy kolejki się skróciły, czyli czy program dał obiecane korzyści.","it":"Proces BAI01 (Zarządzanie programami i projektami) daje praktyki dla tego pierścienia, od inicjowania do zamknięcia programu. Korzyści monitoruje Ład w EDM02.","egz":"Pierścień zewnętrzny = Zarządzanie programem. Jego działania z arkusza PL: Inicjowanie programu (1), Definiowanie problemów i okazji (2), Definiowanie mapy drogowej (3), Planowanie programu (4). Aspekty behawioralne i kulturowe to nie ten pierścień, tylko Aktywowanie zmiany. Nie myl z: Projekt – Program obejmuje kilka powiązanych projektów i działań, które razem mają dać korzyści. Projekt ma jeden konkretny wynik i koniec.; Główny cykl życia ciągłego doskonalenia – Program pilnuje terminów, budżetu i korzyści. Pierścień wewnętrzny dotyczy samego ulepszania aktywatorów (ocena stanu, usprawnienia, pomiar).","src":"COBIT 5 Framework (PL), s. 37; COBIT 5 Framework (PL), s. 38, Ilustracja 17; COBIT 5 Framework (PL), s. 36; COBIT 5 Framework (PL), s. 39"},"it-program":{"t":"Program","eg":"Program","pd":"program","en":"Programme","wyj":"Kilka powiązanych projektów prowadzonych razem, żeby osiągnąć jeden większy cel.\n\nKierownictwo wyznacza cel, np. „usługa zawsze dostępna dla klientów”. Kierownik programu dzieli go na projekty, ustala kolejność i budżet. Co jakiś czas sprawdza, czy projekty razem zbliżają organizację do celu.\n\nŻeby wiele projektów nie szło w różne strony, tylko razem dało jedną korzyść.","zycie":"Remont całego domu: projekt „nowy dach”, projekt „ocieplenie”, projekt „nowe okna”. Razem dają program „ciepły dom”.","firma":"Sieć hoteli prowadzi dwuletni program „gość bez kolejki”: projekt aplikacji do zameldowania, projekt elektronicznych kluczy do pokoi i szkolenia recepcji. Każdy projekt ma własny budżet, ale wszystkie służą jednemu celowi.","urzad":"Miasto prowadzi przez trzy lata program „urząd przez Internet”: kilka projektów nowych aplikacji i szkolenia urzędników. Pełnomocnik prezydenta miasta pilnuje kolejności projektów i sprawdza, czy razem przybliżają cel: większość spraw do załatwienia bez wizyty w urzędzie.","it":"Programami i projektami zarządza BAI01 Zarządzanie programami i projektami (FW-PL s. 33); wdrożenie COBIT 5 to program (s. 37).","egz":"BAI01 Zarządzanie programami i projektami (Manage Programmes and Projects) i pierścień „Zarządzanie programem” we wdrożeniu (dzień 4). Uwaga na dwuznaczność słowa „program”. Nie myl z: Projekt – Projekt to jedno przedsięwzięcie z początkiem i końcem. Program łączy kilka projektów dla wspólnej korzyści.; Oprogramowanie – „Program komputerowy” to oprogramowanie. Program w tym haśle to grupa projektów.; Zarządzanie programem – „Zarządzanie programem” we wdrożeniu COBIT 5 to pierścień zewnętrzny cyklu wdrożenia – szczególny przypadek programu.","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; COBIT 5 Framework (PL), s. 37"},"fazy-wdrozenia":{"t":"Siedem faz cyklu życia wdrożenia","eg":"Siedem faz cyklu życia wdrożenia","pd":"Siedem faz cyklu życia wdrożenia","en":"Seven phases of the implementation life cycle","wyj":"Siedem kroków naprawy: dlaczego zmieniamy, gdzie jesteśmy, dokąd idziemy, co robimy, jak robimy, czy wyszło, jak utrzymać.\n\nFazy to pytania: 1 Jakie są wyznaczniki? (What are the drivers?), 2 Gdzie jesteśmy teraz? (Where are we now?), 3 Dokąd chcemy dojść? (Where do we want to be?), 4 Co trzeba zrobić? (What needs to be done?), 5 Jak się tam dostaniemy? (How do we get there?), 6 Czy dotarliśmy do celu? (Did we get there?), 7 Jak utrzymać motywację do działania? (How do we keep the momentum going?). W każdej fazie działają razem trzy pierścienie: zarządzanie programem, aktywowanie zmiany i ciągłe doskonalenie. W fazie 4 definiuje się projekty wspierane przez uzasadnienia biznesowe.\n\nŻeby wdrożenie prowadzić krok po kroku, odpowiadając po kolei na siedem pytań, od powodu zmiany do utrzymania jej efektów.","zycie":"Lekarz ostrzega Cię przed wysokim ciśnieniem, więc postanawiasz schudnąć (1). Stajesz na wadze (2), ustalasz cel minus 8 kg do lata (3), wybierasz dietę i plan treningów (4), zaczynasz ćwiczyć (5), w czerwcu sprawdzasz wagę (6) i ustalasz, jak nie wrócić do starych nawyków (7). Te siedem kroków to fazy cyklu życia wdrożenia.","firma":"Klienci sklepu internetowego skarżą się na długie dostawy (1). Właściciel mierzy obecny czas wysyłki – średnio 4 dni (2) – i ustala cel: 2 dni (3). Planuje zmianę kuriera i nowy układ magazynu (4), wdraża je (5), po kwartale sprawdza czasy i opinie (6), a potem ustala, jak pilnować tempa i co poprawić dalej (7). To siedem faz cyklu życia wdrożenia.","urzad":"Mieszkańcy skarżą się na kolejki w wydziale komunikacji starostwa (1). Starostwo liczy, ile trwa obsługa (2), i ustala cel: połowa spraw z rezerwacją przez internet (3). Planuje e-rezerwację i szkolenia (4), uruchamia je (5), po pół roku sprawdza efekty (6) i wpisuje stały przegląd do rocznego planu (7). Każde z tych pytań to jedna faza wdrożenia.","it":"Po awarii bankowości internetowej bank uznaje ją za punkt zapalny (1), audytor ocenia obecną zdolność procesu DSS02 Zarządzanie zgłoszeniami serwisowymi i incydentami (2), a zarząd ustala poziom docelowy (3). Dyrektor finansowy pisze uzasadnienie biznesowe projektów (4), dział IT wdraża usprawnienia (5), audytor mierzy efekty (6), a komitet sterujący IT planuje kolejną rundę (7).","egz":"Faza, w której projekty są wspierane przez uzasadnienia biznesowe → 4 (Planowanie programu). Wdrażanie usprawnień odpowiada na pytanie „Jak się tam dostaniemy?” (faza 5). Elementy fazy 3 to: stan docelowy, komunikowanie rezultatu, mapa drogowa. „Identyfikacja odtwórców ról” należy do fazy 4. Polskie nazwy działań w pierścieniach różnią się między podręcznikiem a egzaminem. Ucz się po kolejności pytań i po sensie. Nazwy oznaczone „(SP1)” pochodzą z polskiego arkusza egzaminacyjnego.","src":"COBIT 5 Framework (PL), s. 38; COBIT 5 Framework (PL), s. 38, Ilustracja 17; WWW"},"it-zmiana":{"t":"Zmiana","eg":"Zmiana","pd":"zmiana","en":"Change","wyj":"Zaplanowana przeróbka w sprzęcie, programie albo ustawieniach, zrobiona tak, żeby niczego nie zepsuć.\n\nKtoś składa wniosek o zmianę. Specjaliści oceniają, co może pójść źle. Osoba odpowiedzialna zatwierdza. Zmianę testuje się, wdraża w ustalonym czasie i sprawdza. Gdy coś nie działa, wraca się do poprzedniej wersji.\n\nŻeby ulepszać systemy, nie psując tego, co działa.","zycie":"Telefon pyta: „Zainstalować aktualizację dziś o 2:00 w nocy?”. To zaplanowana zmiana w porze, gdy nie korzystasz z telefonu.","firma":"Bank zmienia system kont. Najpierw testuje go miesiąc na kopii danych, potem wdraża w długi weekend.","urzad":"Urząd marszałkowski chce zainstalować nową wersję systemu do obsługi dotacji unijnych. Kierownik informatyki ocenia ryzyko, a dyrektor wydziału zatwierdza termin. Zmianę testuje się tydzień na kopii danych, wdraża w sobotę, a na wypadek kłopotów jest gotowy plan powrotu do starej wersji.","it":"Zmianami w IT zarządza proces BAI06 Zarządzanie zmianami (FW-PL s. 33).","egz":"BAI06 Zarządzanie zmianami (Manage Changes). Nie myl z pierścieniem „Aktywowanie zmiany” (change enablement) we wdrożeniu (dzień 4). Nie myl z: Aktywowanie zmiany – „Aktywowanie zmiany” we wdrożeniu COBIT 5 dotyczy ludzi i ich zachowań. Zmiana w tym haśle to modyfikacja systemu IT.; Problem – Problem to przyczyna awarii. Zmiana to często sposób, by tę przyczynę usunąć.","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; COBIT 5 Framework (PL), s. 38"},"faza-2":{"t":"Faza 2: Gdzie jesteśmy teraz?","eg":"Faza 2: Gdzie jesteśmy teraz?","pd":"Faza 2: Jaka jest nasza obecna sytuacja?","en":"Phase 2: Where are we now?","wyj":"Drugi krok: ustalasz, co obejmie zmiana, i uczciwie sprawdzasz, jak jest teraz.\n\nMapujesz cele organizacji na cele związane z informatyką i na procesy. Uwzględniasz scenariusze ryzyka. Potem oceniasz stan obecny i zdolność wybranych procesów, żeby znaleźć problemy.\n\nŻeby ustalić zakres zmiany i uczciwie zmierzyć, jak jest teraz. Bez punktu wyjścia nie zmierzysz postępu.","zycie":"Postanowiłeś schudnąć. Teraz stajesz na wadze, mierzysz pas i przez tydzień zapisujesz, co jesz. Wybierasz też, że zajmiesz się jedzeniem, a nie snem. To faza 2: zakres i uczciwy obraz stanu.","firma":"Sklep internetowy przez dwa tygodnie liczy czas wysyłek i zawęża zmiany do magazynu.","urzad":"Starostwo przez dwa tygodnie mierzy czas obsługi we wszystkich wydziałach. Najdłużej trwa rejestracja samochodów, średnio 50 minut, więc to ją wybiera jako obszar zmian. Tak powstaje zakres i uczciwy obraz stanu obecnego.","it":"Kaskada celów wskazuje proces DSS02 jako kluczowy dla celów organizacji. Asesor ocenia jego zdolność i stwierdza poziom 1.","egz":"Ocena stanu obecnego i oszacowanie zdolności procesu → faza 2. Działanie programu w fazie 2: Definiowanie problemów i okazji. Reguła 6 miesięcy (dzielenie na iteracje) pada w opisie fazy 2. Egzamin i kurs: „Gdzie jesteśmy teraz?”. Il. 17 w podręczniku: „Jaka jest nasza obecna sytuacja?”. To ta sama faza 2. Nie myl z: Faza 1: Jakie są wyznaczniki? – Faza 1 uzgadnia, dlaczego zmieniamy. Faza 2 mierzy, jak jest, i określa zakres.; Faza 3: Dokąd chcemy dojść? – Faza 2 opisuje stan obecny. Faza 3 ustala stan docelowy i lukę między nimi.","src":"COBIT 5 Framework (PL), s. 38; COBIT 5 Framework (PL), s. 38, Ilustracja 17"},"pierscien-zmiana":{"t":"Aktywowanie zmiany","eg":"Aktywowanie zmiany","pd":"Umożliwienie zmian (krąg środkowy)","en":"Change enablement (middle ring)","wyj":"Przekonanie ludzi do nowego sposobu pracy: wyjaśnić, wysłuchać obaw, znaleźć liderów i utrwalić nowe nawyki.\n\nPierścień środkowy prowadzi ludzi przez siedem faz. Najpierw budzi chęć zmiany i tworzy zespół wdrożeniowy. Potem komunikuje rezultat, wskazuje odtwórców ról i wspiera użytkowanie. Na końcu osadza nowe podejścia i utrzymuje zmianę.\n\nŻeby ludzie naprawdę przyjęli nowy sposób pracy. Samo nowe narzędzie bez ludzi niczego nie zmienia.","zycie":"Rodzina przechodzi na segregację śmieci. Mama tłumaczy dzieciom, po co to jest, starszy syn pilnuje młodszego, a po miesiącu nikt już nie wrzuca szkła do plastiku. To aktywowanie zmiany: chodzi o ludzi i nawyki, nie o kosze.","firma":"Warsztat przechodzi z zeszytu na tablet: właściciel wysłuchuje obaw starszego mechanika i robi z najmłodszego „lidera tabletu”.","urzad":"Gmina wprowadza e-dziennik w swoich szkołach. W szkole podstawowej wicedyrektorka wysłuchuje obaw starszych nauczycieli i organizuje dla nich cotygodniowe godziny pomocy. Najsprawniejsza nauczycielka zostaje „liderką e-dziennika”, aż papierowy dziennik znika.","it":"Proces BAI05 (Zarządzanie wdrażaniem zmian organizacyjnych) ma praktyki odpowiadające działaniom tego pierścienia: od chęci zmiany po jej utrzymanie.","egz":"Komponent cyklu wdrożenia, który dotyczy aspektów behawioralnych i kulturowych → Aktywowanie zmiany (pierścień środkowy). W arkuszu PL widać jego działania: Komunikowanie rezultatu (faza 3) i Identyfikacja odtwórców ról (faza 4). Egzamin: „Aktywowanie zmiany”. Podręcznik: „Umożliwienie zmian” (il. 17), a na s. 37 także „Wdrożenie zmiany”. To ten sam pierścień środkowy. Nie myl go z „Aktywatorem” (enabler) – to inne pojęcie o podobnym brzmieniu. Nie myl z: Aktywator – Aktywator to jeden z siedmiu czynników, które pomagają w Ładzie i Zarządzaniu. Aktywowanie zmiany to pierścień wdrożenia, który zajmuje się ludźmi i kulturą.; Kultura, Etyka i Zachowanie – „Kultura, etyka i zachowanie” to stały aktywator organizacji. Aktywowanie zmiany to praca z ludźmi podczas konkretnego wdrożenia.","src":"COBIT 5 Framework (PL), s. 37; COBIT 5 Framework (PL), s. 38, Ilustracja 17; materiały Altkom"},"cykl-faza-1":{"t":"Planowanie","eg":"Planowanie","pd":"Planowanie (obejmuje opracowanie oraz wybór koncepcji)","en":"Plan (enabler life-cycle phase 1)","wyj":"Pierwszy krok w życiu rzeczy: wymyślasz kilka pomysłów i wybierasz ten, który zrobisz.\n\nOpracowujesz kilka koncepcji aktywatora. Porównujesz je z celem, np. z korzyścią, ryzykiem i kosztem. Wybierasz jedną i dopiero wtedy przechodzisz do projektowania.\n\nŻeby aktywator powstał z przemyślanego wyboru, a nie z przypadku.","zycie":"Rodzina chce psa. Najpierw rozważacie: duży czy mały, ze schroniska czy z hodowli, kto będzie go wyprowadzał. Wybieracie małego psa ze schroniska. To faza planowania: pomysły i wybór.","firma":"Właściciel sklepu chce przyjmować płatności BLIK. Porównuje trzy rozwiązania: terminal, bramkę płatności w sklepie internetowym, aplikację. Wybiera bramkę. To faza planowania aktywatora.","urzad":"Urząd miasta chce skrócić kolejki w wydziale komunikacji. Kierownik rozważa system numerków, zapisy przez Internet albo dodatkowe okienko. Wybiera zapisy przez Internet. Ten wybór koncepcji to faza planowania.","it":"Przy nowym systemie kierownictwo IT porównuje warianty: budowa, zakup albo usługa w chmurze. Takie decyzje inwestycyjne wspiera m.in. APO05 (Zarządzanie portfelem projektów) (interpretacja kursu).","egz":"Faza 1 = Planowanie: opracowanie i wybór koncepcji. Egzaminacyjnej nazwy PL faz cyklu życia aktywatora nie potwierdziliśmy (brak w SP1 i w zestawieniu Altkom). Używamy nazwy z FW-PL (s. 29, il. 13). „Planowanie” aktywatora to nie domena APO („Dostosuj, Planuj i Organizuj”) ani „Planuj” z PBRM, ani faza 4 wdrożenia (Planowanie programu). Egzaminacyjnej nazwy PL faz cyklu życia aktywatora nie potwierdziliśmy (brak w SP1 i w zestawieniu Altkom). Używamy nazwy z FW-PL (s. 29, il. 13). Nie myl z: Dostosuj, Planuj i Organizuj (APO) – APO (Dostosuj, Planuj i Organizuj) to domena procesów Zarządzania. Faza 1 to etap życia jednego aktywatora.; Planuj, Twórz, Wykonuj i Monitoruj – „Planuj” w Planuj, Twórz, Wykonuj i Monitoruj to obszar działań Zarządzania, a nie faza życia aktywatora.; Faza 4 wdrożenia „Co trzeba zrobić?” (Planowanie programu) – To faza programu wdrażania COBIT 5 (7 faz). Faza 1 cyklu życia aktywatora to wybór koncepcji jednego aktywatora.","src":"COBIT 5 Framework (PL), s. 29; COBIT 5 Framework (PL), s. 28, Ilustracja 13"},"faza-5":{"t":"Faza 5: Jak się tam dostaniemy?","eg":"Faza 5: Jak się tam dostaniemy?","pd":"Faza 5 (pytanie fazy w il. 17 nieczytelne w korpusie tekstowym)","en":"Phase 5: How do we get there?","wyj":"Piąty krok: robisz to, co zaplanowałeś, i od razu ustawiasz, jak będziesz mierzyć efekty.\n\nWdrażasz usprawnienia według planu. Ustalasz miary i monitorowanie na podstawie celów i mierników COBIT. Najwyższe kierownictwo wyraźnie to wspiera, a biznes i IT przejmują własność rozwiązania.\n\nŻeby plan stał się codzienną praktyką. I żeby od razu działał pomiar, który pokaże efekty.","zycie":"Masz plan treningów i plan posiłków. Teraz naprawdę biegasz we wtorki i gotujesz według listy. Wieszasz w kuchni kartkę, na której co tydzień zapiszesz wagę. To faza 5: robisz i ustawiasz pomiar.","firma":"Sklep zmienia kuriera, przestawia półki i włącza licznik czasu wysyłki.","urzad":"Starostwo uruchamia e-rezerwację dla mieszkańców. Od pierwszego dnia system notuje czas oczekiwania i czas każdej wizyty. Starosta publicznie popiera zmianę, a wydział komunikacji przejmuje system jako swój.","it":"Usprawniony DSS02 rusza w praktyce. Mierniki, np. odsetek incydentów rozwiązanych w uzgodnionym czasie, trafiają do monitorowania w MEA01.","egz":"Wdrażanie usprawnień odpowiada na pytanie „Jak się tam dostaniemy?”, czyli faza 5. Budowanie usprawnień to faza 4. „Jak się tam dostaniemy?” brzmi jak planowanie trasy, a to faza wdrażania. Plan powstał w fazie 4. W fazie 5 działa się według planu: Wdrażanie usprawnień, Wykonywanie planu. Nie myl z: Faza 4: Co trzeba zrobić? – Faza 4 planuje i buduje (Budowanie usprawnień). Faza 5 wdraża (Wdrażanie usprawnień).; Faza 6: Czy dotarliśmy do celu? – Faza 5 wdraża i ustawia miary. Faza 6 korzysta z nich: eksploatacja, pomiar i monitorowanie korzyści.","src":"COBIT 5 Framework (PL), s. 38; COBIT 5 Framework (PL), s. 38, Ilustracja 17"},"faza-4":{"t":"Faza 4: Co trzeba zrobić?","eg":"Faza 4: Co trzeba zrobić?","pd":"Faza 4: Jakie działania należy podjąć? (odczyt il. 17)","en":"Phase 4: What needs to be done?","wyj":"Czwarty krok: rozpisujesz konkretne zadania, koszty i ludzi, zanim cokolwiek zaczniesz robić.\n\nPlanujesz program i projekty wspierane przez uzasadnienia biznesowe. Wskazujesz odtwórców ról, czyli osoby do nowych zadań. Budujesz usprawnienia, ale jeszcze ich nie wdrażasz.\n\nŻeby zamienić cel w konkretne projekty z ludźmi, kosztami i spodziewanymi korzyściami. Bez planu realizacja się rozjedzie.","zycie":"Masz cel: minus 8 kg. Teraz rozpisujesz plan posiłków, kupujesz karnet i umawiasz się z kolegą na wspólne bieganie we wtorki. Liczysz koszt i sprawdzasz, czy się opłaca. Jeszcze nie biegasz. To faza 4.","firma":"Sklep rozpisuje dwa projekty, zmianę kuriera i nowy magazyn, każdy z kosztorysem i zyskiem.","urzad":"Starostwo rozpisuje projekt e-rezerwacji z budżetem i uzasadnieniem biznesowym: ile kosztuje i o ile skróci kolejki. Wyznacza dwie urzędniczki na opiekunki systemu. System jest przygotowany, ale mieszkańcy jeszcze z niego nie korzystają.","it":"Każdy projekt prowadzisz według BAI01 i z uzasadnieniem biznesowym. Tabela RACI wskazuje, kto odpowiada za usprawniony proces DSS02.","egz":"Faza, w której projekty są wspierane przez uzasadnienia biznesowe → faza 4. Jej działania: Planowanie programu, Identyfikacja odtwórców ról, Budowanie usprawnień. „Budowanie usprawnień” brzmi jak robota w terenie, ale to faza 4. Samo „Wdrażanie usprawnień” to faza 5. Podręcznik nazywa działanie programu „Zaplanowanie programu”, a egzamin – „Planowanie programu”. Nie myl z: Faza 5: Jak się tam dostaniemy? – Faza 4 buduje i planuje usprawnienia. Faza 5 je wdraża (Wdrażanie usprawnień, Wykonywanie planu).; Faza 3: Dokąd chcemy dojść? – Faza 3 wyznacza mapę drogową. Faza 4 zamienia ją w plan programu z projektami i uzasadnieniami biznesowymi.","src":"COBIT 5 Framework (PL), s. 38; COBIT 5 Framework (PL), s. 38, Ilustracja 17"},"faza-1":{"t":"Faza 1: Jakie są wyznaczniki?","eg":"Faza 1: Jakie są wyznaczniki?","pd":"Faza 1: Jakie są wyznaczniki?","en":"Phase 1: What are the drivers?","wyj":"Pierwszy krok: wspólnie przyznajecie, że coś trzeba zmienić, i mówicie dlaczego.\n\nZbierasz punkty zapalne, czyli to, co boli teraz. Dodajesz zdarzenia wyzwalające, np. zapowiedzianą kontrolę albo nowe przepisy. Kierownictwo uznaje potrzebę zmiany, a program zostaje zainicjowany.\n\nŻeby wszyscy, łącznie z kierownictwem, zgodzili się, że zmiana jest potrzebna. Bez tej zgody kolejne fazy nie mają paliwa.","zycie":"Lekarz mówi, że masz za wysokie ciśnienie. Do tego za miesiąc wesele, a garnitur nie dopina się w pasie. Siadasz z żoną i ustalacie: „Musimy coś zmienić”. Jeszcze nie ważysz się i nie wybierasz diety. To faza 1.","firma":"Sklep internetowy dostaje lawinę skarg na spóźnione paczki, a duży klient grozi odejściem, więc właściciele uznają potrzebę zmian.","urzad":"Do starostwa co tydzień wpływają skargi na kolejki w wydziale komunikacji, a do tego zapowiedziano kontrolę. Starosta zbiera naczelników wydziałów i ogłasza: „Musimy to naprawić”. Skargi to punkt zapalny, zapowiedziana kontrola to zdarzenie wyzwalające.","it":"Seria podobnych incydentów obsługiwanych w DSS02 to punkt zapalny. Zapowiedziany audyt zgodności z przepisami (MEA03) to zdarzenie wyzwalające.","egz":"Faza, w której identyfikuje się punkty zapalne i zdarzenia wyzwalające oraz uzgadnia potrzebę zmiany → faza 1. Działanie programu w tej fazie: Inicjowanie programu. Opis fazy 1 w podręczniku mówi o „czynnikach inicjujących”. Na egzaminie to „zdarzenia wyzwalające”. Do tego „wyznacznik” w fazie 1 to powód wdrożenia, a nie „czynnik wpływający na potrzeby interesariuszy” z zasady 1. Nie myl z: Faza 2: Gdzie jesteśmy teraz? – Faza 1 mówi, dlaczego zmieniamy. Faza 2 określa zakres i mierzy, jak jest teraz.; Czynnik wpływający na potrzeby interesariuszy – Wyznacznik z zasady 1 zmienia potrzeby interesariuszy i otwiera kaskadę celów. „Wyznaczniki” w fazie 1 to powody, dla których zaczynamy wdrożenie.","src":"COBIT 5 Framework (PL), s. 38; COBIT 5 Framework (PL), s. 39; COBIT 5 Framework (PL), s. 38, Ilustracja 17"},"faza-6":{"t":"Faza 6: Czy dotarliśmy do celu?","eg":"Faza 6: Czy dotarliśmy do celu?","pd":"Faza 6: Czy cel został osiągnięty?","en":"Phase 6: Did we get there?","wyj":"Szósty krok: nowe rozwiązanie działa na co dzień, a Ty sprawdzasz, czy dało obiecane korzyści.\n\nNowe lub ulepszone aktywatory działają w codziennej pracy. Mierzysz wyniki miarami z fazy 5. Program porównuje korzyści z uzasadnieniem biznesowym, a zespół osadza nowe podejścia.\n\nŻeby sprawdzić, czy rozwiązanie przyjęło się na co dzień i dało obiecane korzyści. To rozliczenie tej iteracji.","zycie":"Od dwóch miesięcy biegasz i gotujesz po nowemu. To już nawyk, nie zryw. Stajesz na wadze: minus 6 kg i lepsze ciśnienie. Sprawdzasz, czy dostałeś to, po co zacząłeś. To faza 6.","firma":"Sklep po kwartale porównuje czasy wysyłek i skargi z kosztorysem.","urzad":"Po pół roku starostwo liczy: 45% spraw umawia się przez e-rezerwację, a średnie czekanie spadło z 50 do 15 minut. Wyniki porównuje z uzasadnieniem biznesowym projektu. Urzędnicy pracują już po nowemu na co dzień.","it":"Czas rozwiązania incydentów w DSS02 porównujesz z uzasadnieniem biznesowym. Ład monitoruje korzyści w EDM02 (Zapewnienie realizacji korzyści).","egz":"Faza, w której koncentrujemy się na zrównoważonym wykorzystaniu nowych aktywatorów i monitorowaniu uzyskania spodziewanych korzyści → faza 6. Działanie programu: Realizacja korzyści. Egzamin i kurs: „Czy dotarliśmy do celu?”. Il. 17: „Czy cel został osiągnięty?”. Działanie pierścienia zmiany w podręczniku to „Integracja nowych podejść”, w arkuszu egzaminacyjnym (SP1) i w kursie „Umożliwianie nowych podejść”. Nie myl z: Faza 7: Jak utrzymać motywację do działania? – Faza 6 sprawdza korzyści tej iteracji i utrwala nowe podejścia. Faza 7 weryfikuje ogólny sukces i ustala dalsze wymagania.; Realizacja korzyści – „Realizacja korzyści” jako cel Ładu dotyczy całej organizacji, zawsze. Działanie programu w fazie 6 sprawdza korzyści tego wdrożenia.","src":"COBIT 5 Framework (PL), s. 38; COBIT 5 Framework (PL), s. 38, Ilustracja 17"}},"S":[{"lekcje":["im-k14-trzy-pierscienie","im-k15-aktywowanie-zmiany"],"pt":"Lekcje 3.14–3.15","h":"Trzy pierścienie cyklu wdrożenia działają jednocześnie","b":"<p><w k=\"cykl-wdrozenia\">Cykl Życia Wdrożenia</w> (Rysunek 17):</p><div class=\"tblwrap\"><table class=\"tbl\"><tr><th>Pierścień</th><th>Zajmuje się</th></tr><tr><td>zewnętrzny: <w k=\"pierscien-program\">Zarządzanie programem</w></td><td>budżet, terminy, korzyści</td></tr><tr><td>środkowy: <w k=\"pierscien-zmiana\">Aktywowanie zmiany</w></td><td>ludzie, zachowania, kultura</td></tr><tr><td>wewnętrzny: <w k=\"pierscien-doskonalenie\">Główny cykl życia ciągłego doskonalenia</w></td><td>procesy – nie <w k=\"projekt\">projekt</w> jednorazowy</td></tr></table></div>","c":"Aspekty ludzkie i kulturowe to Aktywowanie zmiany; ciągłe doskonalenie nie jest projektem jednorazowym.","s":"COBIT 5 Framework (PL), s. 37, Ilustracja 17","ctx":"<p>EN: <span class=\"en\">Implementation life cycle</span>; <span class=\"en\">Programme management</span>, <span class=\"en\">Change enablement</span>, <span class=\"en\">Continual improvement life cycle</span>. Podręcznik pisze „umożliwienie zmian” i „podstawowy cykl życia ciągłego doskonalenia”, a Rysunek 17 nazywa Ilustracją 17. Pierścienie nie są etapami po kolei – kręcą się naraz przez całe wdrożenie.</p><p>Podręcznik ostrzega, że zbyt małą wagę przywiązuje się do ludzi, zachowań i kultury: „Nie należy zakładać”, że interesariusze chętnie przyjmą zmianę – brak świadomości i opór trzeba przewidzieć w sposób ustrukturyzowany i proaktywny. Narzędzie: plan komunikacji (co, jak, komu – w każdej fazie). Dystraktor: Zarządzanie programem też przydziela role, ale opór i kultura należą do pierścienia środkowego. Przykład: urząd kupił sprawny system obiegu dokumentów, a urzędnicy dalej drukują pisma – technika jest, zmiany nie ma.</p>"},{"pt":"Sprawdź się","quiz":{"id":"q-mt-06-01","sylabus":["IM-01-01","IM-02-06","IM-02-07"],"tresc":"Które zestawienie działań fazy 7 jest poprawne (kolejno: zarządzanie programem / Aktywowanie zmiany / cykl życia ciągłego doskonalenia)?","opcje":[{"t":"Przegląd skuteczności / Utrzymanie / Monitorowanie i szacowanie","ok":true,"w":"Poprawnie. To trzy działania fazy 7 „Jak utrzymać motywację do działania?”."},{"t":"Realizacja korzyści / Utrzymanie / Monitorowanie i szacowanie","ok":false,"w":"Realizacja korzyści to działanie programu w fazie 6, a nie w fazie 7."},{"t":"Przegląd skuteczności / Monitorowanie i szacowanie / Utrzymanie","ok":false,"w":"Dwa ostatnie działania są zamienione między pierścieniami."},{"t":"Przegląd skuteczności / Osadzenie nowych podejść / Eksploatacja i pomiar","ok":false,"w":"Osadzenie nowych podejść i Eksploatacja i pomiar to działania fazy 6."}],"src":"COBIT 5 Framework (EN), sekcja rozdział 7, rysunek 17","pomoc":{"t":"Pytanie dotyczy lekcji 3.14 „Cykl życia wdrożenia – trzy pierścienie”. Cel lekcji: Potrafię nazwać trzy pierścienie cyklu życia wdrożenia i powiedzieć, czym zajmuje się każdy z nich.","k":["cykl-wdrozenia","pierscien-program","pierscien-doskonalenie"]},"kurs":"Poprawnie. To trzy działania fazy 7 „Jak utrzymać motywację do działania?”.","kontekst":""}},{"pt":"Sprawdź się","quiz":{"id":"q-fn-m-31","sylabus":["IM-02-05","IM-01-01"],"tresc":"Szpital organizuje szkolenia, komunikację i zaangażowanie liderów, żeby personel zaakceptował nowy system. Który komponent cyklu życia wdrożenia to opisuje?","opcje":[{"t":"Cykl życia ciągłego doskonalenia (krąg wewnętrzny)","ok":false,"w":"Ten krąg dotyczy samego doskonalenia aktywatorów."},{"t":"Aktywowanie zmiany (krąg środkowy)","ok":true,"w":"Aktywowanie zmiany dotyczy ludzi, kultury i zaangażowania. Komunikacja określa co, jak i komu przekazywać w każdej fazie. Duże przedsięwzięcia prowadzi się iteracyjnie. Wskazana odpowiedź odpowiada właśnie temu elementowi modelu."},{"t":"Zarządzanie programem (krąg zewnętrzny)","ok":false,"w":"Zarządzanie programem planuje i prowadzi inicjatywę, ale ludźmi i kulturą zajmuje się krąg środkowy."},{"t":"Proces BAI06 – zarządzanie zmianami","ok":false,"w":"BAI06 to zmiany w IT (techniczne). Zmiany organizacyjne to BAI05, a pytanie dotyczy cyklu życia, nie procesu."}],"src":"COBIT 5 Framework (EN), sekcja rozdział 7, Enabling Change / Using a Life Cycle Approach","pomoc":{"t":"Pytanie dotyczy lekcji 3.15 „Aktywowanie zmiany – ludzie, zachowania i kultura”. Cel lekcji: Potrafię wyjaśnić, czym zajmuje się Aktywowanie zmiany i dlaczego nie wolno zakładać, że ludzie sami przyjmą zmianę.","k":["pierscien-zmiana"]},"kurs":"Aktywowanie zmiany dotyczy ludzi, kultury i zaangażowania. Komunikacja określa co, jak i komu przekazywać w każdej fazie. Duże przedsięwzięcia prowadzi się iteracyjnie. Wskazana odpowiedź odpowiada właśnie temu elementowi modelu.","kontekst":""}},{"pt":"Arkusz próbny","sp1":"sp1-04","lekcja":"3.15","temat":"Aktywowanie zmiany – ludzie, zachowania i kultura","k":["pierscien-zmiana"]},{"lekcje":["im-k16-siedem-faz"],"pt":"Lekcja 3.16","h":"Siedem faz to siedem pytań jednego okrążenia","b":"<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>Faza</th><th>Pytanie (egzamin PL)</th></tr><tr><td>1</td><td><w k=\"faza-1\">Jakie są wyznaczniki?</w></td></tr><tr><td>2</td><td><w k=\"faza-2\">Gdzie jesteśmy teraz?</w></td></tr><tr><td>3</td><td><w k=\"faza-3\">Dokąd chcemy dojść?</w></td></tr><tr><td>4</td><td><w k=\"faza-4\">Co trzeba zrobić?</w></td></tr><tr><td>5</td><td><w k=\"faza-5\">Jak się tam dostaniemy?</w></td></tr><tr><td>6</td><td><w k=\"faza-6\">Czy dotarliśmy do celu?</w></td></tr><tr><td>7</td><td><w k=\"faza-7\">Jak utrzymać motywację do działania?</w></td></tr></table></div>","c":"Po fazie 7 rusza kolejne okrążenie – cykl służy ciągłemu doskonaleniu.","s":"COBIT 5 Framework (PL), s. 38, Ilustracja 17","ctx":"<p>EN: <span class=\"en\">What are the drivers? · Where are we now? · Where do we want to be? · What needs to be done? · How do we get there? · Did we get there? · How do we keep the momentum going?</span> <w k=\"fazy-wdrozenia\">Fazy</w> idą po kolei, a w każdej działa każdy z trzech pierścieni. Fazy 1–3 to diagnoza, 4–7 – działanie i jego utrzymanie.</p><p>Pułapka: podręcznik tłumaczy pytania inaczej – faza 2 „Jaka jest nasza obecna sytuacja?”, 3 „Do czego dążymy?”, 6 „Czy cel został osiągnięty?”, 7 „Jak utrzymać obecną dynamikę?”. W razie wątpliwości myśl po angielsku. Przykład – sklep internetowy: skargi na zwroty (1), zwrot trwa 14 dni (2), cel 5 dni (3), projekt z uzasadnieniem (4), wdrożenie (5), 6 dni w praktyce (6), przegląd i kolejny cel – reklamacje (7).</p>"},{"pt":"Sprawdź się","quiz":{"id":"q-mt-06-01","sylabus":["IM-01-01","IM-02-06","IM-02-07"],"tresc":"Które zestawienie działań fazy 7 jest poprawne (kolejno: zarządzanie programem / Aktywowanie zmiany / cykl życia ciągłego doskonalenia)?","opcje":[{"t":"Realizacja korzyści / Utrzymanie / Monitorowanie i szacowanie","ok":false,"w":"Realizacja korzyści to działanie programu w fazie 6, a nie w fazie 7."},{"t":"Przegląd skuteczności / Monitorowanie i szacowanie / Utrzymanie","ok":false,"w":"Dwa ostatnie działania są zamienione między pierścieniami."},{"t":"Przegląd skuteczności / Utrzymanie / Monitorowanie i szacowanie","ok":true,"w":"Poprawnie. To trzy działania fazy 7 „Jak utrzymać motywację do działania?”."},{"t":"Przegląd skuteczności / Osadzenie nowych podejść / Eksploatacja i pomiar","ok":false,"w":"Osadzenie nowych podejść i Eksploatacja i pomiar to działania fazy 6."}],"src":"COBIT 5 Framework (EN), sekcja rozdział 7, rysunek 17","pomoc":{"t":"Pytanie dotyczy lekcji 3.16 „Siedem faz – siedem pytań cyklu wdrożenia”. Cel lekcji: Potrafię ułożyć po kolei siedem pytań faz cyklu wdrożenia w nazwach z egzaminu.","k":["fazy-wdrozenia","faza-1","faza-2","faza-3"]},"kurs":"Poprawnie. To trzy działania fazy 7 „Jak utrzymać motywację do działania?”.","kontekst":""}},{"lekcje":["im-k17-fazy-1-3","im-k18-fazy-4-7"],"pt":"Lekcje 3.17–3.18","h":"Fazę rozpoznasz po działaniu: 1–3 diagnoza, 4–7 zmiana","b":"<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>Faza</th><th>Słowo-klucz</th></tr><tr><td>1 · 2 · 3</td><td>potrzeba zmiany · stan obecny · stan docelowy i luki</td></tr><tr><td>4</td><td>projekty <b>wspierane przez uzasadnienia biznesowe</b>, budowanie</td></tr><tr><td>5</td><td>wdrażanie usprawnień</td></tr><tr><td>6 · 7</td><td>korzyści w użyciu · ogólny sukces</td></tr></table></div>","c":"Budowanie usprawnień to faza 4, wdrażanie – faza 5; inicjatywę dłuższą niż pół roku dzieli się na okrążenia.","s":"COBIT 5 Framework (PL), s. 38","ctx":"<p>Faza 2 najpierw ustala zakres (mapowanie celów organizacji na cele związane z Informatyką i procesy, scenariusze ryzyka), potem ocenia stan obecny i zdolność procesów. Przy niej pada reguła: inicjatywa trwająca dłużej niż sześć miesięcy grozi utratą dynamiki, koncentracji i akceptacji interesariuszy, więc duże wdrożenie buduje się z wielu okrążeń – to próg dla inicjatywy, nie czas fazy. Faza 3 daje priorytet szybkim korzyściom, faza 5 wymaga wyraźnego zaangażowania najwyższego kierownictwa.</p><p>Pułapki sąsiednich faz: uzasadnienia biznesowe to faza 4, nie 3 (faza 3 wybiera rozwiązania); monitorowanie korzyści w codziennym użyciu to faza 6, weryfikacja ogólnego sukcesu i dalszych wymagań – faza 7. Przykład: uczelnia w fazie 2 mierzy, że zaświadczenie czeka 10 dni, w fazie 3 ustala cel 2 dni (luka 8 dni) i wybiera szybką korzyść – gotowy wzór w systemie.</p>"},{"pt":"Sprawdź się","quiz":{"id":"q-mt-06-01","sylabus":["IM-01-01","IM-02-06","IM-02-07"],"tresc":"Które zestawienie działań fazy 7 jest poprawne (kolejno: zarządzanie programem / Aktywowanie zmiany / cykl życia ciągłego doskonalenia)?","opcje":[{"t":"Realizacja korzyści / Utrzymanie / Monitorowanie i szacowanie","ok":false,"w":"Realizacja korzyści to działanie programu w fazie 6, a nie w fazie 7."},{"t":"Przegląd skuteczności / Monitorowanie i szacowanie / Utrzymanie","ok":false,"w":"Dwa ostatnie działania są zamienione między pierścieniami."},{"t":"Przegląd skuteczności / Osadzenie nowych podejść / Eksploatacja i pomiar","ok":false,"w":"Osadzenie nowych podejść i Eksploatacja i pomiar to działania fazy 6."},{"t":"Przegląd skuteczności / Utrzymanie / Monitorowanie i szacowanie","ok":true,"w":"Poprawnie. To trzy działania fazy 7 „Jak utrzymać motywację do działania?”."}],"src":"COBIT 5 Framework (EN), sekcja rozdział 7, rysunek 17","pomoc":{"t":"Pytanie dotyczy lekcji 3.17 „Fazy 1–3 – powody, stan obecny i cel”. Cel lekcji: Potrafię rozpoznać po opisie działań fazę 1, 2 albo 3 i wiem, dlaczego duże wdrożenie dzieli się na okrążenia krótsze niż pół roku.","k":[]},"kurs":"Poprawnie. To trzy działania fazy 7 „Jak utrzymać motywację do działania?”.","kontekst":""}},{"pt":"Sprawdź się","quiz":{"id":"q-imk-18-3","sylabus":["IM-02-07"],"tresc":"Sklep internetowy definiuje projekty usprawnień i do każdego dołącza uzasadnienie biznesowe. Na pytanie której fazy właśnie odpowiada?","opcje":[{"t":"W fazie 4 (Co trzeba zrobić?)","ok":true,"w":"Dobrze. Podręcznik: w fazie 4 planuje się rozwiązania, definiując projekty wspierane przez uzasadnienia biznesowe."},{"t":"W fazie 1 (Jakie są wyznaczniki?)","ok":false,"w":"Faza 1 ustala potrzebę zmiany, jeszcze bez projektów."},{"t":"W fazie 5 (Jak się tam dostaniemy?)","ok":false,"w":"W fazie 5 projekty są już realizowane."},{"t":"W fazie 3 (Dokąd chcemy dojść?)","ok":false,"w":"W fazie 3 wskazuje się luki i możliwe rozwiązania. Projekty z uzasadnieniami to faza 4."}],"src":"COBIT 5 Framework (EN), sekcja rozdział 7, fazy 4–7, rysunek 17","pomoc":{"t":"Pytanie dotyczy lekcji 3.18 „Fazy 4–7 – plan, wdrożenie, korzyści i utrzymanie”. Cel lekcji: Potrafię rozpoznać po opisie działań fazę 4, 5, 6 albo 7 i odróżnić budowanie usprawnień od ich wdrażania.","k":[]},"kurs":"Dobrze. Podręcznik: w fazie 4 planuje się rozwiązania, definiując projekty wspierane przez uzasadnienia biznesowe.","kontekst":""}},{"lekcje":["im-k19-rysunek-17"],"pt":"Lekcja 3.19","h":"Rysunek 17: 7 faz × 3 pierścienie = 21 działań","b":"<p>Kolejność: <w k=\"it-program\">program</w> · <w k=\"it-zmiana\">zmiana</w> · doskonalenie.</p><ul><li>Faza 3: mapa drogowa · komunikowanie rezultatu · stan docelowy</li><li>Faza 4: <w k=\"cykl-faza-1\">planowanie</w> programu · odtwórcy ról · budowanie usprawnień</li><li>Faza 5: wykonywanie planu · działaj i używaj · wdrażanie usprawnień</li></ul>","c":"Pierścień wskazuje temat (plan, ludzie, procesy), a fazę – słowa o stanie, budowaniu i wdrażaniu.","s":"COBIT 5 Framework (PL), s. 38, Ilustracja 17","ctx":"<p>Pozostałe działania: faza 1 – inicjowanie programu, ustanowienie chęci zmiany, rozpoznanie potrzeby działania; faza 2 – definiowanie problemów i okazji, utworzenie zespołu wdrożeniowego, ocena stanu obecnego; faza 6 – realizacja korzyści (pierścień programu!), umożliwianie nowych podejść, eksploatacja i pomiar; faza 7 – przegląd skuteczności, utrzymanie, monitorowanie i szacowanie. Część nazw to tłumaczenie kursu z oryginału, bo polska Ilustracja 17 jest słabo czytelna.</p><p>Pułapka: „monitorowanie i szacowanie” to działanie fazy 7 w pierścieniu wewnętrznym, a nie domena Monitoruj, Oszacuj i Oceń <span class=\"en\">MEA – Monitor, Evaluate and Assess</span>. Odtwórcy ról to osoby, które pierwsze pokazują nowy sposób pracy – przykład: ubezpieczyciel w fazie 4 wybiera w każdym oddziale doświadczonego likwidatora szkód, który pierwszy przejdzie na nowy proces.</p>"},{"pt":"Sprawdź się","quiz":{"id":"q-mt-06-01","sylabus":["IM-01-01","IM-02-06","IM-02-07"],"tresc":"Które zestawienie działań fazy 7 jest poprawne (kolejno: zarządzanie programem / Aktywowanie zmiany / cykl życia ciągłego doskonalenia)?","opcje":[{"t":"Realizacja korzyści / Utrzymanie / Monitorowanie i szacowanie","ok":false,"w":"Realizacja korzyści to działanie programu w fazie 6, a nie w fazie 7."},{"t":"Przegląd skuteczności / Utrzymanie / Monitorowanie i szacowanie","ok":true,"w":"Poprawnie. To trzy działania fazy 7 „Jak utrzymać motywację do działania?”."},{"t":"Przegląd skuteczności / Monitorowanie i szacowanie / Utrzymanie","ok":false,"w":"Dwa ostatnie działania są zamienione między pierścieniami."},{"t":"Przegląd skuteczności / Osadzenie nowych podejść / Eksploatacja i pomiar","ok":false,"w":"Osadzenie nowych podejść i Eksploatacja i pomiar to działania fazy 6."}],"src":"COBIT 5 Framework (EN), sekcja rozdział 7, rysunek 17","pomoc":{"t":"Pytanie dotyczy lekcji 3.19 „Rysunek 17 – jedna faza, trzy pierścienie”. Cel lekcji: Potrafię przypisać działanie z Rysunku 17 do właściwej fazy i właściwego pierścienia.","k":[]},"kurs":"Poprawnie. To trzy działania fazy 7 „Jak utrzymać motywację do działania?”.","kontekst":""}},{"pt":"Arkusz próbny","sp1":"sp1-03","lekcja":"3.19","temat":"Rysunek 17 – jedna faza, trzy pierścienie","k":[]},{"pt":"Arkusz próbny","sp1":"sp1-16","lekcja":"3.19","temat":"Rysunek 17 – jedna faza, trzy pierścienie","k":[]},{"pt":"Arkusz próbny","sp1":"sp1-39","lekcja":"3.19","temat":"Rysunek 17 – jedna faza, trzy pierścienie","k":[]}],"bankRevision":"755d421ee470b3ef","legacySp1Order":[null,null,null,{"sp1":"sp1-04"},null,null,null,null,null,null,null,{"sp1":"sp1-03"},{"sp1":"sp1-16"},{"sp1":"sp1-39"}]};</script>
