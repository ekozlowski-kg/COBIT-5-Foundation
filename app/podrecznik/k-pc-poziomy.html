<script>window.DECK={"id":"k-pc-poziomy","rozdzial":"Rozdział 8 · Model zdolności procesu · s. 41–45","tytul":"Sześć poziomów i dziewięć atrybutów","prev":"k-pc-model.html","next":"k-pc-atrybuty.html","T":{"poziom-2":{"t":"Poziom 2 – Proces zarządzany","eg":"Poziom 2 – Proces zarządzany","pd":"Poziom 2 potencjału – proces zarządzany","en":"Level 2 – Managed process","wyj":"Robota daje efekt, a do tego ktoś ją planuje, pilnuje i trzyma papiery w porządku.\n\nAsesor najpierw sprawdza, czy PA 1.1 ma P. Potem ocenia PA 2.1 (plan, monitorowanie, korekta) i PA 2.2 (kontrola produktów pracy). Oba muszą mieć co najmniej W.\n\nŻeby proces nie zależał od szczęścia: ktoś go planuje, pilnuje i trzyma porządek w jego dokumentach.","zycie":"Domowe rachunki: masz kalendarz terminów, co miesiąc sprawdzasz, czy wszystko zapłacone, a potwierdzenia trzymasz w jednej teczce. Rachunki są płacone (poziom 1), a do tego planowane i pilnowane, z porządkiem w papierach. To poziom 2.","firma":"Warsztat samochodowy ma grafik przyjęć, kierownik codziennie sprawdza, czy auta są gotowe na czas, a karty zleceń mają wzór i trafiają do archiwum. Drugi warsztat tej samej firmy robi to jednak po swojemu. Poziom 2 tak, poziom 3 jeszcze nie.","urzad":"Wydział komunikacji starostwa planuje obsadę okienek, co tydzień sprawdza kolejki i przesuwa ludzi, gdy trzeba. Wnioski mają wzór, są rejestrowane i przechowywane. To proces zarządzany, czyli poziom 2.","it":"Proces BAI06 (zarządzanie zmianami): zmiany w systemach są planowane, ich wykonanie jest pilnowane, a wnioski o zmianę mają wzór i wersje. Każdy zespół IT robi to jednak według własnych zasad. To poziom 2, jeszcze nie 3.","egz":"„Planowanie, monitorowanie i dostosowanie” + „produkty pracy kontrolowane” → poziom 2, proces zarządzany. Atrybuty: zarządzanie wydajnością i zarządzanie produktami pracy. „Zarządzany” w COBIT 5 to poziom 2. W COBIT 4.1 „Zarządzany i wymierny” to poziom 4. Podobna nazwa, inne piętro. Nie myl z: Poziom 3 – Proces ustanowiony – Poziom 3 to jeden zdefiniowany standard, stosowany przy każdym wykonaniu. Poziom 2 to zarządzanie wykonaniem, bez wymogu wspólnego standardu.; Poziom 4 dojrzałości COBIT 4.1 („Zarządzany i wymierny”) – Podobna nazwa, inny model i inny poziom. Skal COBIT 4.1 i COBIT 5 nie da się prosto porównać.; PA 2.2 Zarządzanie produktami pracy – PA 2.2 to jeden z dwóch atrybutów poziomu 2. Poziom 2 to wynik całego procesu, liczony z PA 1.1, PA 2.1 i PA 2.2.","src":"COBIT 5 Framework (PL), s. 42, Ilustracja 19; COBIT 5 Framework (PL), s. 42; sylabus PeopleCert"},"poziom-5":{"t":"Poziom 5 – Proces zoptymalizowany","eg":"Poziom 5 – Proces zoptymalizowany","pd":"Poziom 5 potencjału – proces optymalizujący","en":"Level 5 – Optimising process","wyj":"Robota nie tylko działa dobrze, ale ciągle ją ulepszasz pod to, czego potrzebuje organizacja.\n\nNa bazie danych z poziomu 4 organizacja szuka i wybiera zmiany (PA 5.1), a potem je wprowadza i sprawdza efekt (PA 5.2). Oba atrybuty muszą mieć co najmniej W, a wszystkie niższe P.\n\nŻeby proces, który już działa stabilnie, dalej się poprawiał razem ze zmieniającymi się celami organizacji.","zycie":"Co roku porównujesz oferty prądu i internetu, patrzysz, ile wydaliście, i zmieniasz sposób płacenia na tańszy albo wygodniejszy. Domowe rachunki nie tylko się zgadzają, ale stale się poprawiają. To poziom 5.","firma":"Firma kurierska co kwartał analizuje dane z pomiarów, testuje nowe trasy i nowe skanery. Wdraża tylko zmiany, które dały efekt. Proces stale się doskonali pod cele firmy.","urzad":"Urząd miasta co roku analizuje dane o obsłudze wniosków, testuje nowe e-usługi i wdraża te, które skracają czas. Sprawdza też, czy zmiana naprawdę pomogła mieszkańcom. To poziom 5.","it":"Proces APO12 (zarządzanie ryzykiem): na bazie zmierzonych wyników organizacja co roku testuje nowe metody analizy ryzyka i wdraża te, które poprawiają trafność ocen. Przy P na poziomach 1–4 to poziom 5.","egz":"Poziom 5 = proces zoptymalizowany (podręcznik: optymalizujący). Atrybuty: innowacja procesu (PA 5.1) i optymalizacja procesu (PA 5.2). Nie ma poziomu 6. Egzamin: „Proces zoptymalizowany”. Podręcznik (Il. 19 i 20): „Proces optymalizujący”. To ten sam poziom 5. Nie myl z poziomem 5 dojrzałości COBIT 4.1 („Zoptymalizowany”), który ma inną treść. Nie myl z: Poziom 4 – Proces przewidywalny – Poziom 4 trzyma proces w limitach. Poziom 5 dodaje szukanie, wdrażanie i sprawdzanie ulepszeń.; Poziom 5 dojrzałości COBIT 4.1 („Zoptymalizowany”) – Ta sama nazwa, inna treść: tam procesy dopracowane do poziomu dobrej praktyki i zautomatyzowane. Skal nie da się prosto porównać.; PA 5.2 Optymalizacja procesu – PA 5.2 Optymalizacja procesu to jeden z dwóch atrybutów poziomu 5, a nie nazwa całego poziomu.","src":"COBIT 5 Framework (PL), s. 42, Ilustracja 19; COBIT 5 Framework (PL), s. 43; COBIT 5 Framework (PL), s. 44, Ilustracja 20"},"poziomy-zdolnosci":{"t":"Poziomy zdolności 0–5","eg":"Poziomy zdolności 0–5","pd":"Poziomy potencjału procesu","en":"Capability levels 0–5","wyj":"Sześć stopni od „nie robimy” przez „robimy z planem” do „ciągle poprawiamy”.\n\nModel zdolności (capability model) oparty na ISO/IEC 15504 ma sześć poziomów: 0 niekompletny (Incomplete), 1 wykonywany (Performed), 2 zarządzany (Managed), 3 ustanowiony (Established), 4 przewidywalny (Predictable) i 5 zoptymalizowany (Optimising). Każdy poziom ma atrybuty procesu (poziom 1 jeden, kolejne po dwa), które asesor ocenia w skali N/C/W/P. Proces osiąga poziom, gdy atrybuty tego poziomu mają W lub P, a wszystkie atrybuty niższych poziomów mają P.\n\nŻeby dało się porównywalnie i obiektywnie powiedzieć, jak dobrze działa dany proces i co trzeba poprawić, żeby wejść wyżej.","zycie":"Domowe rachunki. 0 – czasem przychodzi wezwanie do zapłaty; 1 – wszystko jest zapłacone; 2 – masz kalendarz terminów i teczkę z potwierdzeniami; 3 – cała rodzina płaci według jednej spisanej listy z jednego konta. 4 – co miesiąc sprawdzasz wydatki i trzymasz się ustalonych kwot, 5 – co roku szukasz tańszego prądu i internetu i zmieniasz sposób na lepszy.","firma":"Sklep internetowy z kawą, wysyłka paczek. Na poziomie 1 paczki po prostu wychodzą; na 2 ktoś planuje wysyłki na dany dzień i sprawdza etykiety; na 3 jest jedna spisana instrukcja pakowania dla wszystkich. Na 4 mierzą czas od zamówienia do nadania i trzymają się limitu 24 godzin, a na 5 co kwartał zmieniają sposób pakowania, żeby szło szybciej i taniej.","urzad":"Zapisy do pierwszej klasy w gminie. 1 – dzieci są zapisane; 2 – sekretariat ma harmonogram i sprawdza kompletność dokumentów; 3 – wszystkie szkoły w gminie używają tej samej procedury i formularza. 4 – gmina mierzy czas rozpatrzenia i liczbę odwołań i trzyma je w ustalonych granicach, 5 – co roku poprawia procedurę na podstawie tych danych.","it":"Asesor ocenia BAI06 (Zarządzanie zmianami): zmiany są wdrażane i rejestrowane (PA 1.1 = P), planowane i nadzorowane (PA 2.1 = P), a wnioski o zmianę jako produkty pracy są kontrolowane tylko w większości (PA 2.2 = W). Proces osiąga poziom 2 (zarządzany); żeby myśleć o poziomie 3, musi najpierw mieć P także na PA 2.2.","egz":"„Proces ustanowiony” → poziom 3. „Przewidywalny” → 4. Nie istnieje poziom 6. Atrybut procesu przewidywalnego to m.in. Miara (pomiar) procesu (PA 4.1). Nie myl z: Poziom 6 – Nie ma poziomu 6. Poziomy to 0–5.","src":"COBIT 5 Framework (PL), s. 42; COBIT 5 Framework (PL), s. 42, Ilustracja 19"},"poziom-0":{"t":"Poziom 0 – Proces niekompletny","eg":"Poziom 0 – Proces niekompletny","pd":"Poziom 0 potencjału – proces niekompletny","en":"Level 0 – Incomplete process","wyj":"Robota niby się dzieje, ale efektu, po który ją robimy, nie ma albo jest przypadkiem.\n\nAsesor ocenia PA 1.1 skalą N/C/W/P. Gdy wychodzi N albo C, proces ląduje na poziomie 0. Oceny wyższych atrybutów niczego wtedy nie zmieniają.\n\nŻeby uczciwie nazwać proces, który istnieje na papierze albo w praktyce, ale nie daje efektu, po który go prowadzimy.","zycie":"Co tydzień robisz pranie, ale połowa rzeczy wraca brudna albo zafarbowana. Pralka chodzi, proszek się zużywa, a czystych ubrań nie masz za każdym razem. To poziom 0: proces niekompletny, choć wcale nie „nieistniejący”.","firma":"Sklep internetowy ma dział reklamacji i formularz na stronie. Co trzecia reklamacja ginie bez odpowiedzi. Ludzie pracują, ale rezultat „każda reklamacja rozpatrzona” nie jest osiągany, więc asesor da PA 1.1 = C i poziom 0.","urzad":"Gmina robi kopie zapasowe danych mieszkańców, ale nikt nie sprawdza, czy da się je odtworzyć. Przy awarii okazuje się, że kopie są puste. Proces formalnie istnieje, ale celu nie osiąga, więc ma poziom 0.","it":"Proces DSS04 (zarządzanie ciągłością): plan ciągłości działania leży w szafie, ale test pokazał, że po awarii nie da się uruchomić usług w wymaganym czasie. Rezultaty procesu nie są osiągane, więc PA 1.1 = C i poziom 0.","egz":"„Proces nie został wdrożony lub nie osiąga celu” → poziom 0, proces niekompletny. Nie myl z „nieistniejącym” z COBIT 4.1. W COBIT 4.1 poziom 0 to „Nieistniejący”. W COBIT 5 poziom 0 to „Niekompletny”: proces może istnieć i być wykonywany, ale nie osiąga swojego celu. Nie myl z: Poziom 1 – Proces wykonywany – Poziom 1: PA 1.1 ma co najmniej W, czyli proces osiąga cel. Poziom 0: PA 1.1 ma N albo C.; Poziom 0 dojrzałości COBIT 4.1 („Nieistniejący”) – Tam: całkowity brak rozpoznawalnych procesów. W COBIT 5 poziom 0 obejmuje też procesy wykonywane, które nie osiągają celu.; N – Nieosiągnięty – N to ocena atrybutu (0–15%), a poziom 0 to wynik całego procesu. Poziom 0 daje zarówno N, jak i C na PA 1.1.","src":"COBIT 5 Framework (PL), s. 42, Ilustracja 19; COBIT 5 Framework (PL), s. 44, Ilustracja 20"},"atrybuty-procesu":{"t":"Atrybuty procesu","eg":"Atrybuty procesu","pd":"Atrybuty potencjału procesu","en":"Process attributes (PA)","wyj":"Dziewięć rzeczy, które sprawdza oceniający, żeby powiedzieć, jak dobrze coś robimy, od „robimy” po „ciągle poprawiamy”.\n\nModel zdolności procesu COBIT 5 (oparty na ISO/IEC 15504) ma 9 atrybutów procesu (process attributes, PA): PA 1.1 na poziomie 1 i po dwa na poziomach 2–5. Każdy atrybut ocenia się w skali N/C/W/P: nieosiągnięty, częściowy, większościowy, pełny (N/P/L/F). Poziom jest osiągnięty, gdy jego atrybuty mają co najmniej W, a wszystkie atrybuty niższych poziomów mają P.\n\nŻeby ocena zdolności procesu opierała się na konkretnych, mierzalnych cechach, a nie na wrażeniu oceniającego. Atrybuty mówią, co dokładnie trzeba sprawdzić na każdym poziomie.","zycie":"Pieczesz sernik. Najpierw liczy się, czy w ogóle wyszedł (PA 1.1), potem czy planujesz czas i zakupy (PA 2.1) i czy przepis jest zapisany i poprawiany (PA 2.2). Dalej: czy cała rodzina piecze z tej samej spisanej wersji (PA 3.1, 3.2), czy mierzycie wynik i reagujecie, gdy coś odbiega od normy (PA 4.1, 4.2), i czy szukacie lepszego przepisu i go wprowadzacie (PA 5.1, 5.2). Każde z tych pytań to jeden atrybut procesu.","firma":"Audytor przychodzi do warsztatu samochodowego i ocenia przyjmowanie aut do naprawy. Sprawdza po kolei: czy auta są przyjmowane i naprawiane (PA 1.1), czy ktoś planuje terminy i pilnuje, kto co robi (PA 2.1), czy karta zlecenia ma wzór i jest sprawdzana (PA 2.2). Każde takie pytanie to osobny atrybut, a ich oceny dają poziom zdolności.","urzad":"Szkoła ocenia proces zapisów do pierwszej klasy. Zapisy się odbywają (PA 1.1), dyrektor planuje terminy i wyznacza osoby (PA 2.1), formularze mają jeden wzór i są sprawdzane (PA 2.2), ale każda sekretarka przyjmuje je trochę inaczej, więc PA 3.1 i 3.2 wypadają słabo. Atrybuty pokazują, na którym poziomie proces się zatrzymał.","it":"Audytor ocenia proces DSS02 Zarządzanie zgłoszeniami serwisowymi i incydentami: PA 1.1 = P, PA 2.1 = W, PA 2.2 = W, PA 3.1 = C. Proces osiąga poziom 2, bo PA 1.1 jest pełny, a atrybuty poziomu 2 mają co najmniej W; poziom 3 wymagałby P na PA 2.1 i PA 2.2.","egz":"Do zapamiętania: 9 atrybutów, 1 + 2 + 2 + 2 + 2. Pytanie o atrybut poziomu 4 → pomiar (miara) i kontrola procesu. Poziom 2 → zarządzanie wydajnością i zarządzanie produktami pracy. Nazwy atrybutów różnią się: podręcznik PA 1.1 „Sprawność procesu”, PA 2.1 „Zarządzanie sprawnością”, PA 2.2 „Zarządzanie produktami działań”, PA 4.1 „Pomiar procesu”. Na egzaminie: „Zarządzanie wydajnością” (2.1), „Miara procesu” (4.1).","src":"COBIT 5 Framework (PL), s. 93; COBIT 5 Framework (PL), s. 42, Ilustracja 19"},"poziom-4":{"t":"Poziom 4 – Proces przewidywalny","eg":"Poziom 4 – Proces przewidywalny","pd":"Poziom 4 potencjału – proces przewidywalny","en":"Level 4 – Predictable process","wyj":"Wiesz z góry, ile to potrwa i jak wyjdzie, bo mierzysz i trzymasz się granic.\n\nProces ustanowiony jest mierzony względem celów ilościowych (PA 4.1). Wyniki pomiaru służą do trzymania procesu w ustalonych limitach i korygowania odchyleń (PA 4.2). Wszystko niżej musi mieć P.\n\nŻeby wiedzieć z góry, jak proces się zachowa, i szybko wyłapywać sytuacje, gdy wychodzi poza normę.","zycie":"Domowy budżet: co miesiąc liczysz wydatki na jedzenie i wiesz, że mieszczą się w 1500–1700 zł. Gdy w maju wychodzi 2100 zł, od razu szukasz przyczyny i poprawiasz. To poziom 4: pomiar i trzymanie się granic.","firma":"Sklep internetowy mierzy czas od zamówienia do nadania paczki. Cel: 95% paczek w 24 godziny. Gdy wskaźnik spada, kierownik magazynu szuka przyczyny i reaguje. Proces jest przewidywalny.","urzad":"Starostwo mierzy czas wydania pozwolenia na budowę i liczbę odwołań. Wie, że 90% spraw kończy się w 45 dni. Gdy jest gorzej, od razu sprawdza przyczyny i reaguje. To poziom 4.","it":"Proces DSS01 (zarządzanie operacjami): czas wykonania nocnych zadań wsadowych jest mierzony i ma limit. Przekroczenie limitu uruchamia analizę i korektę. Przy P na poziomach 1–3 to poziom 4.","egz":"„Działa w zdefiniowanych limitach” → poziom 4, proces przewidywalny. Atrybuty: miara (pomiar) procesu i kontrola procesu. W COBIT 4.1 poziom 4 to „Zarządzany i wymierny”. W COBIT 5 poziom 4 to „Przewidywalny”, a „zarządzany” to poziom 2. Nie myl z: Poziom 3 – Proces ustanowiony – Poziom 3 to standard stosowany przez wszystkich. Poziom 4 dodaje liczby i trzymanie procesu w limitach.; Poziom 5 – Proces zoptymalizowany – Poziom 5 to ciągłe doskonalenie pod cele biznesowe. Poziom 4 to stabilne działanie w limitach.; PA 2.1 Zarządzanie wydajnością – PA 2.1 też monitoruje, ale wykonanie względem planu. Poziom 4 mierzy proces ilościowo względem jego celów.","src":"COBIT 5 Framework (PL), s. 42, Ilustracja 19; COBIT 5 Framework (PL), s. 44, Ilustracja 20"},"proces":{"t":"Proces","eg":"Proces","pd":"Proces","en":"Process","wyj":"Coś, co robimy regularnie i zawsze w podobny sposób, np. przyjmowanie każdego zgłoszenia.\n\nProces (process) przyjmuje wejścia (inputs), przetwarza je przez praktyki i działania ukierunkowane przez polityki i procedury i daje wyniki (outputs), np. produkt albo usługę. Ma właściciela, role i mierniki, a wynik jednego procesu bywa wejściem innego. W COBIT 5 procesy są jednym z siedmiu aktywatorów, a Referencyjny Model Procesu opisuje ich 37.\n\nŻeby powtarzalną pracę wykonywać za każdym razem tak samo dobrze, niezależnie od tego, kto ją akurat robi, i żeby dało się ją mierzyć i poprawiać.","zycie":"Co sobotę rano sprawdzasz lodówkę, piszesz listę, jedziesz do sklepu, rozpakowujesz i odhaczasz, czego zabrakło. Za tydzień wszystko powtarza się od nowa. To proces: stałe kroki, wejście (pusta lodówka i lista) i wynik (pełna lodówka).","firma":"W sklepie internetowym z herbatą przychodzi zamówienie, pracownik pakuje paczkę, drukuje etykietę i fakturę, a kurier odbiera paczki o 15:00. Tak samo dzieje się z każdym zamówieniem, codziennie. To proces – powtarzalny, z wejściem (zamówienie) i wynikiem (paczka u klienta).","urzad":"Do urzędu gminy wpływa wniosek o wycinkę drzewa. Kancelaria go rejestruje, kierownik przydziela go referentowi, ten jedzie na oględziny i wydaje decyzję. Każdy kolejny wniosek idzie tą samą ścieżką – to jest proces.","it":"DSS02 (Zarządzanie zgłoszeniami serwisowymi i incydentami) to proces: każde zgłoszenie (wejście) jest rejestrowane, klasyfikowane, rozwiązywane i zamykane (praktyki), a wynikiem jest przywrócona usługa i wpis w rejestrze. Działa codziennie i tak samo dla każdego zgłoszenia.","egz":"Opis „zbiór praktyk ukierunkowanych politykami i procedurami, który przetwarza wejścia w wyniki” to Proces (Załącznik H). Nie myl z: Projekt – Projekt jest jednorazowy, ma początek i koniec (np. wdrożenie systemu). Proces trwa i się powtarza (np. obsługa zgłoszeń w tym systemie).","src":"COBIT 5 Framework (PL), s. 93"},"poziom-1":{"t":"Poziom 1 – Proces wykonywany","eg":"Poziom 1 – Proces wykonywany","pd":"Poziom 1 potencjału – proces wykonywany","en":"Level 1 – Performed process","wyj":"Robota daje efekt, po który ją robimy, choć bez planu i spisanych zasad.\n\nAsesor sprawdza rezultaty procesu, praktyki bazowe i produkty pracy. Gdy PA 1.1 ma W albo P, proces osiąga poziom 1. Planowania i standardu na tym poziomie się nie wymaga.\n\nŻeby oddzielić procesy, które naprawdę dają efekt, od tych, w których tylko „coś się robi”.","zycie":"Gotujesz obiad bez przepisu, „na oko”, za każdym razem trochę inaczej. Ale codziennie o 17:00 rodzina je ciepły posiłek. Cel jest osiągnięty, więc to poziom 1, choć bez planu i spisanych zasad.","firma":"W małej drukarni jeden pan przyjmuje zamówienia na wizytówki do zeszytu. Nie ma grafiku ani wzoru zamówienia, ale klienci prawie zawsze dostają dobre wizytówki na czas. Asesor da PA 1.1 = W albo P, czyli poziom 1.","urzad":"W urzędzie gminy jedna urzędniczka wydaje zaświadczenia o niezaleganiu w podatkach. Robi to po swojemu, bez procedury, ale mieszkańcy dostają poprawne zaświadczenia w terminie. To poziom 1: rezultat jest, zarządzania jeszcze nie ma.","it":"Proces DSS02 (zgłoszenia serwisowe i incydenty): zgłoszenia od użytkowników są rozwiązywane, choć każdy informatyk robi to po swojemu i bez planu. Rezultaty procesu są osiągane, więc PA 1.1 = W albo P i poziom 1.","egz":"„Cel wdrożonego procesu został osiągnięty” → poziom 1, proces wykonywany. Ma jeden atrybut (PA 1.1). Ocenia się go praktykami bazowymi i produktami pracy. „Wykonywany” brzmi jak „ktoś to robi”. W COBIT 5 znaczy: proces osiąga swój cel. Nie myl z poziomem 1 w COBIT 4.1 („Wstępny/Ad hoc”). Nie myl z: Poziom 0 – Proces niekompletny – Poziom 0: PA 1.1 = N albo C, proces nie osiąga celu. Poziom 1: PA 1.1 = W albo P.; Poziom 2 – Proces zarządzany – Poziom 2 dodaje planowanie, monitorowanie i kontrolę produktów pracy. Poziom 1 pyta tylko o efekt.; Poziom 1 dojrzałości COBIT 4.1 („Wstępny/Ad hoc”) – Tam wystarczyło dostrzec problem i działać doraźnie. W COBIT 5 poziom 1 wymaga osiągania celu procesu.","src":"COBIT 5 Framework (PL), s. 42, Ilustracja 19; COBIT 5 Framework (PL), s. 42; COBIT 5 Framework (PL), s. 43; COBIT 5 Framework (PL), s. 45"},"poziom-3":{"t":"Poziom 3 – Proces ustanowiony","eg":"Poziom 3 – Proces ustanowiony","pd":"Poziom 3 potencjału – proces ustanowiony","en":"Level 3 – Established process","wyj":"Wszyscy robią to tak samo, według jednego spisanego sposobu, który naprawdę stosują.\n\nOrganizacja ma standardowy proces (PA 3.1) i stosuje go w każdym wykonaniu (PA 3.2). Oba atrybuty muszą mieć co najmniej W, a wszystkie atrybuty poziomów 1 i 2 muszą mieć P.\n\nŻeby cała organizacja robiła daną rzecz według jednego, sprawdzonego wzorca, a nie według nawyków poszczególnych zespołów.","zycie":"Cała rodzina płaci rachunki według jednej kartki na lodówce: z którego konta, do kiedy, gdzie odłożyć potwierdzenie. Gdy babcia zastępuje mamę, robi to tak samo, bo zna tę kartkę. To proces ustanowiony, poziom 3.","firma":"Sieć pięciu piekarni ma jedną instrukcję przyjmowania dostaw. Szkoli z niej każdego nowego pracownika i dopasowuje ją do wielkości sklepu. Kierowniczka sprawdza, czy wszyscy ją stosują. To poziom 3: standard jest zdefiniowany i wdrożony.","urzad":"Wszystkie szkoły w gminie przyjmują zapisy do pierwszej klasy według jednej procedury i jednego formularza, przygotowanych przez urząd gminy. Każda szkoła może dodać swoje terminy dni otwartych, ale reszta jest wspólna. To proces ustanowiony, czyli poziom 3.","it":"Proces DSS02: cała organizacja obsługuje incydenty według jednej procedury, z jednym narzędziem i szkoleniem dla każdego zespołu wsparcia. Standard jest zdefiniowany i stosowany, więc przy P na poziomach 1–2 proces ma poziom 3.","egz":"„Proces ustanowiony” → poziom 3. Atrybuty: definicja procesu (PA 3.1) i wdrożenie procesu (PA 3.2). W COBIT 4.1 poziom 3 to „Zdefiniowany proces”. W COBIT 5 poziom 3 to „Ustanowiony”, a „Definicja procesu” to nazwa jednego z jego atrybutów (PA 3.1). Nie myl z: Poziom 2 – Proces zarządzany – Poziom 2 to plan, pilnowanie i porządek w dokumentach. Poziom 3 dodaje jeden standard i jego stosowanie w każdym wykonaniu.; Poziom 3 dojrzałości COBIT 4.1 („Zdefiniowany proces”) – Tam wystarczyły ustandaryzowane i zakomunikowane procedury. W COBIT 5 poziom 3 wymaga też P na wszystkich atrybutach poziomów 1 i 2.; PA 3.1 Definicja procesu – PA 3.1 to tylko jeden z dwóch atrybutów poziomu 3: wzorzec. Drugi, PA 3.2, sprawdza jego stosowanie.","src":"COBIT 5 Framework (PL), s. 42, Ilustracja 19; COBIT 5 Framework (PL), s. 42; COBIT 5 Framework (PL), s. 44, Ilustracja 20"}},"S":[{"lekcje":["pc-k20-szesc-poziomow"],"pt":"Lekcja 4.20","h":"Sześć poziomów zdolności: od 0 do 5","b":"<div class=\"tblwrap\"><table class=\"tbl\"><tr><th><\/th><th>Egzamin PL<\/th><th>EN<\/th><\/tr><tr><td>0<\/td><td><w k=\"poziom-0\">Proces niekompletny<\/w><\/td><td><span class=\"en\">Incomplete<\/span><\/td><\/tr><tr><td>1<\/td><td><w k=\"poziom-1\">Proces wykonywany<\/w><\/td><td><span class=\"en\">Performed<\/span><\/td><\/tr><tr><td>2<\/td><td><w k=\"poziom-2\">Proces zarządzany<\/w><\/td><td><span class=\"en\">Managed<\/span><\/td><\/tr><tr><td>3<\/td><td><w k=\"poziom-3\">Proces ustanowiony<\/w><\/td><td><span class=\"en\">Established<\/span><\/td><\/tr><tr><td>4<\/td><td><w k=\"poziom-4\">Proces przewidywalny<\/w><\/td><td><span class=\"en\">Predictable<\/span><\/td><\/tr><tr><td>5<\/td><td><w k=\"poziom-5\">Proces zoptymalizowany<\/w><\/td><td><span class=\"en\">Optimising<\/span><\/td><\/tr><\/table><\/div>","c":"Każdy poziom można osiągnąć tylko wtedy, gdy niższy jest w pełni uzyskany.","s":"COBIT 5 Framework (PL), s. 42, Ilustracja 19","ctx":"<p>Drabina <span class=\"en\">capability levels<\/span> jest wspólna dla wszystkich 37 procesów: szczeble nie zmieniają celu procesu, tylko sposób, w jaki organizacja nim kieruje. Poziom 1 ma jeden atrybut, poziomy 2–5 po dwa, poziom 0 – żadnego.<\/p><p>Pułapka: egzamin pisze „Proces zoptymalizowany”, podręcznik – „proces optymalizujący”; Rysunek 19 egzaminu to Ilustracja 19 podręcznika. Nie myl z poziomem 5 dojrzałości COBIT 4.1 („Zoptymalizowane”). Przykład – zwroty w sklepie internetowym: 0 część zwrotów ginie; 1 zwroty są załatwiane; 2 ktoś planuje i pilnuje terminów; 3 jedna procedura dla całej firmy; 4 czas zwrotu mierzony i trzymany w limicie; 5 proces stale ulepszany pod cele biznesowe.<\/p>"},{"pt":"Sprawdź się","quiz":{"id":"q-pck-20-3","sylabus":["PC-01-01"],"tresc":"Jak na egzaminie PL nazywa się poziom 5 zdolności (<em>Optimising process<\/em>)?","opcje":[{"t":"Proces zoptymalizowany","ok":true,"w":"Dobrze. Egzamin PL: Proces zoptymalizowany. Podręcznik: proces optymalizujący."},{"t":"Proces przewidywalny","w":"To poziom 4 (<em>Predictable process<\/em>)."},{"t":"Proces zarządzany i mierzalny","w":"To nazwa z modelu dojrzałości COBIT 4.1."},{"t":"Proces optymalizujący","w":"To forma z podręcznika PL."}],"src":"COBIT 5 Framework (PL), s. 42; materiały Altkom","pomoc":{"t":"Pytanie dotyczy lekcji 4.20 „Sześć poziomów zdolności – cała drabina”. Cel lekcji: Potrafię wymienić po polsku i po angielsku sześć poziomów zdolności od 0 do 5.","k":["poziomy-zdolnosci"]}}},{"pt":"Arkusz próbny","sp1":"sp1-25","lekcja":"4.20","temat":"Sześć poziomów zdolności – cała drabina","k":["poziomy-zdolnosci"]},{"lekcje":["pc-k21-poziom-0-i-1","pc-k22-poziom-2"],"pt":"Lekcje 4.21–4.22","h":"Poziomy 0, 1, 2: najpierw efekt, potem zarządzanie","b":"<ul><li><b>0<\/b> – nie wdrożono albo cel nieosiągnięty, choć ludzie pracują,<\/li><li><b>1<\/b> – cel osiągnięty, bez planu i pomiaru,<\/li><li><b>2<\/b> – praca planowana, monitorowana i dostosowywana; produkty pracy określone, kontrolowane, utrzymywane.<\/li><\/ul>","c":"O poziomie 0 albo 1 decyduje efekt, nie wysiłek; poziom 2 dokłada plan i porządek w produktach.","s":"COBIT 5 Framework (PL), s. 42","ctx":"<p>Podręcznik: na poziomie 0 „proces nie został wdrożony lub jego cel nie został osiągnięty”, na poziomie 1 „cel wdrożonego procesu został osiągnięty” – to już ważne osiągnięcie. Poziom 2 buduje na poziomie 1 i ma dwa atrybuty (PA 2.1, PA 2.2), ale nie wymaga jednej procedury dla całej organizacji – każdy zespół może zarządzać po swojemu; wspólny standard to poziom 3.<\/p><p>Pułapka: „Proces niekompletny” to nie „Nieistniejące” z COBIT 4.1 – proces może być codziennie wykonywany, a i tak stać na zerze. Przykład: helpdesk banku rejestruje zgłoszenia, ale połowa zostaje bez rozwiązania – poziom 0; zgłoszenia są rozwiązywane, choć bez grafiku i statystyk – poziom 1; kierownik planuje obsadę, co tydzień sprawdza terminy, a szablon zgłoszenia ma wersję – poziom 2.<\/p>"},{"pt":"Sprawdź się","quiz":{"id":"q-pck-21-3","sylabus":["PC-01-01"],"tresc":"Które zdanie poprawnie opisuje poziom 0 – Proces niekompletny w COBIT 5?","opcje":[{"t":"Proces nie ma spisanej procedury dla całej organizacji","w":"Brak standardu nie przesądza o poziomie 0."},{"t":"Proces nie jest wdrożony albo nie osiąga swojego celu","ok":true,"w":"Dobrze. Tak definiuje go podręcznik na s. 42."},{"t":"Proces osiąga cel, ale nie jest planowany","w":"To opis poziomu 1."},{"t":"W organizacji nie istnieje żaden rozpoznawalny proces","w":"To opis poziomu 0 dojrzałości COBIT 4.1 („Nieistniejące”)."}],"src":"COBIT 5 Framework (PL), s. 42; COBIT 5 Framework (PL), s. 44","pomoc":{"t":"Pytanie dotyczy lekcji 4.21 „Poziom 0 i poziom 1 – czy proces daje efekt?”. Cel lekcji: Potrafię odróżnić proces niekompletny od procesu wykonywanego po tym, czy osiąga swój cel.","k":["poziom-0","poziom-1"]}}},{"pt":"Sprawdź się","quiz":{"id":"q-pck-22-2","sylabus":["PC-01-01"],"tresc":"W każdym oddziale ubezpieczyciela kierownik planuje i pilnuje obsługi szkód, ale każdy oddział robi to po swojemu. Jaki poziom jest osiągnięty?","opcje":[{"t":"Poziom 4, bo kierownicy pilnują pracy","w":"Pilnowanie to nie pomiar w limitach."},{"t":"Poziom 3, bo każdy oddział ma swój proces","w":"Poziom 3 wymaga jednego, zdefiniowanego procesu dla organizacji."},{"t":"Poziom 2, bo brakuje wspólnego standardu do poziomu 3","ok":true,"w":"Dobrze. Zarządzanie w oddziałach to poziom 2. Wspólny standard to dopiero poziom 3."},{"t":"Poziom 1, bo różnice między oddziałami blokują poziom 2","w":"Różnice między oddziałami nie blokują poziomu 2."}],"src":"COBIT 5 Framework (PL), s. 42","pomoc":{"t":"Pytanie dotyczy lekcji 4.22 „Poziom 2 – proces zarządzany”. Cel lekcji: Potrafię rozpoznać proces zarządzany i odróżnić go od procesu wykonywanego i ustanowionego.","k":["poziom-2"]}}},{"lekcje":["pc-k23-poziomy-3-5"],"pt":"Lekcja 4.23","h":"Poziomy 3–5: wspólny standard, limity, ciągłe ulepszanie","b":"<ul><li><b>3<\/b> – działa według zdefiniowanego, wspólnego procesu,<\/li><li><b>4<\/b> – działa w zdefiniowanych limitach,<\/li><li><b>5<\/b> – jest stale doskonalony pod aktualne i przyszłe cele biznesowe.<\/li><\/ul>","c":"3 – tak samo wszędzie, 4 – w liczbach i granicach, 5 – coraz lepiej.","s":"COBIT 5 Framework (PL), s. 42–43","ctx":"<p>Kolejności nie da się przeskoczyć: sensownie mierzyć można tylko proces, który wszędzie przebiega tak samo, a ulepszać – taki, którego wyniki znamy w liczbach. Poziom 5 nie jest celem dla każdego procesu: poziom docelowy wybiera się z rachunku kosztów i korzyści oraz analizy wykonalności i „rzadko będzie jednym z najwyższych poziomów”.<\/p><p>Słowa-klucze w pytaniach: „standard dla całej organizacji” – 3, „limity, pomiar, odchylenia” – 4, „ulepszenia pod cele biznesowe” – 5. Przykład – dostawca chmury: wszystkie centra danych wdrażają zmiany według jednej procedury (3); czas wdrożenia jest mierzony, a po przekroczeniu limitu zespół szuka przyczyny (4); firma testuje automatyzację, bo klienci chcą szybszych zmian (5).<\/p>"},{"pt":"Sprawdź się","quiz":{"id":"q-pck-23-3","sylabus":["PC-01-01"],"tresc":"Który opis odpowiada poziomowi 5 – Proces zoptymalizowany (<em>Optimising process<\/em>)?","opcje":[{"t":"Proces jest wdrażany za pomocą zdefiniowanego procesu","w":"To poziom 3."},{"t":"Proces działa w ramach zdefiniowanych limitów","w":"To poziom 4."},{"t":"Proces został dopracowany do poziomu dobrej praktyki na wzór innych firm","w":"To opis poziomu 5 w modelu dojrzałości COBIT 4.1."},{"t":"Jest stale doskonalony pod obecne i przyszłe cele biznesowe","ok":true,"w":"Dobrze. Tak podręcznik opisuje poziom 5."}],"src":"COBIT 5 Framework (PL), s. 42","pomoc":{"t":"Pytanie dotyczy lekcji 4.23 „Poziomy 3, 4 i 5 – standard, liczby, ulepszanie”. Cel lekcji: Potrafię powiedzieć, co dokłada każdy z poziomów 3, 4 i 5.","k":["poziom-3","poziom-4","poziom-5"]}}},{"lekcje":["pc-k24-dziewiec-atrybutow"],"pt":"Lekcja 4.24","h":"Dziewięć atrybutów procesu: 1 + 2 + 2 + 2 + 2","b":"<p><w k=\"atrybuty-procesu\">Atrybuty procesu<\/w> <span class=\"en\"><w k=\"proces\">Process<\/w> attributes<\/span>, PA: poziom 1 ma jeden (PA 1.1), poziomy 2–5 po dwa. Pierwsza cyfra kodu to numer poziomu.<\/p>","c":"Dziewięć atrybutów procesu to COBIT 5; sześć atrybutów dojrzałości to COBIT 4.1.","s":"COBIT 5 Framework (PL), s. 41–42, Ilustracja 19","ctx":"<p>Mapa: PA 1.1 Wykonanie procesu; PA 2.1 Zarządzanie wydajnością, PA 2.2 Zarządzanie produktami pracy; PA 3.1 Definicja procesu, PA 3.2 Wdrożenie procesu; PA 4.1 Miara procesu, PA 4.2 Kontrola procesu; PA 5.1 Innowacja procesu, PA 5.2 Optymalizacja procesu. Formy PA 1.1 i PA 2.2 nie są potwierdzone w oficjalnych materiałach – rozpoznawaj atrybut po kodzie i nazwie angielskiej. Każdy atrybut ocenia się osobno, a z dziewięciu ocen wynika poziom.<\/p><p>Pułapka: podręcznik pisze „atrybuty potencjału procesu”. Liczba 6 to atrybuty dojrzałości COBIT 4.1, np. świadomość i komunikowanie, narzędzia i automatyzacja; częściowo pokrywają się z nowymi (Ilustracja 21), więc dawną ocenę można przeklasyfikować. Przykład: raport banku o procesie zarządzania dostępem ma dziewięć wierszy – po jednym na atrybut – i dopiero z nich wynika poziom.<\/p>"},{"pt":"Sprawdź się","quiz":{"id":"q-pck-24-3","sylabus":["PC-01-01","PC-01-02"],"tresc":"Które zdanie poprawnie opisuje rozkład atrybutów procesu (Rysunek 19)?","opcje":[{"t":"Poziom 1 ma jeden atrybut, a poziomy 2–5 po dwa","ok":true,"w":"Dobrze. Razem dziewięć atrybutów procesu."},{"t":"Poziom 1 ma dwa atrybuty, a poziomy 2–5 po jednym","w":"Liczby są zamienione."},{"t":"Atrybuty są tylko na poziomach 2–5, a poziom 1 ocenia się bez atrybutu","w":"Poziom 1 też ma atrybut: PA 1.1 Wykonanie procesu."},{"t":"Każdy poziom od 0 do 5 ma po dwa atrybuty","w":"Poziom 0 nie ma atrybutów, a poziom 1 ma jeden."}],"src":"COBIT 5 Framework (PL), s. 42","pomoc":{"t":"Pytanie dotyczy lekcji 4.24 „Dziewięć atrybutów procesu na drabinie poziomów”. Cel lekcji: Potrafię przypisać dziewięć atrybutów procesu do poziomów zdolności 1–5.","k":["atrybuty-procesu"]}}},{"pt":"Arkusz próbny","sp1":"sp1-12","lekcja":"4.24","temat":"Dziewięć atrybutów procesu na drabinie poziomów","k":["atrybuty-procesu"]}]};</script>
