<script>window.DECK={"id":"k-pr-wartosc","rozdzial":"Rozdział 2 · Zasada 1: Realizacja potrzeb interesariusza · s. 17–22","tytul":"Cel Ładu – Tworzenie Wartości","prev":"02a-zasada-1.html","next":"k-pr-kaskada.html","T":{"optymalizacja-zasobow":{"t":"Optymalizacja zasobów","eg":"Optymalizacja zasobów","pd":"Optymalizacja zasobów","en":"Resource Optimisation","wyj":"Mądre korzystanie z ludzi, pieniędzy i sprzętu: ani za mało, ani na wyrost.\n\nŁad w EDM04 (Zapewnienie optymalizacji zasobów) ocenia, jakich zasobów (resources) organizacja potrzebuje teraz i w przyszłości, kieruje ich przydziałem i monitoruje, czy są dobrze wykorzystane. Zasoby mają być użyte skutecznie (effective), wydajnie (efficient) i odpowiedzialnie (responsible). Czasem optymalizacja oznacza wydanie więcej, np. na szkolenie, bez którego drogi system stoi nieużywany.\n\nŻeby ludzie, pieniądze, sprzęt i infrastruktura były wykorzystane skutecznie, wydajnie i odpowiedzialnie: wystarczyło ich na to, co ważne, i nic się nie marnowało.","zycie":"Rodzina ma dwa samochody, ale drugi stoi pod blokiem sześć dni w tygodniu i tylko kosztuje. Sprzedaje go, mąż dostaje bilet miesięczny, a część pieniędzy idzie na drugi fotelik do pierwszego auta, żeby dzieci mógł wozić każdy z rodziców. Mniej marnowania, a codzienne sprawy dalej załatwione – to optymalizacja zasobów.","firma":"W pizzerii od 11 do 22 stało pięciu kucharzy, choć tłok jest tylko w porze obiadu i wieczorem. Właściciel układa grafik pod godziny ruchu, a zaoszczędzone pieniądze wydaje na szkolenie dwóch osób z obsługi nowego pieca, który dotąd pracował na pół gwizdka. Optymalizacja zasobów to nie samo cięcie kosztów, tylko lepsze wykorzystanie ludzi i sprzętu.","urzad":"Trzy sąsiednie gminy miały każda własną serwerownię i jednego informatyka, którego nikt nie mógł zastąpić na urlopie. Teraz utrzymują jedną wspólną serwerownię i zespół trzech informatyków, którzy nawzajem się zastępują. Mniej dublowania, a obsługa pewniejsza – to optymalizacja zasobów.","it":"W EDM04 (Zapewnienie optymalizacji zasobów) zarząd decyduje, że wydziały zamiast trzech serwerowni korzystają z jednej, a zaoszczędzone pieniądze idą na drugiego administratora, bo jeden był wąskim gardłem. Zatrudnienie i rozwój tej osoby prowadzi kierownictwo IT w APO07 (Zarządzanie zasobami ludzkimi).","egz":"Jeden z trzech składników celu Ładu. SP1: „Skuteczne użycie wszystkich Zasobów (Optymalizacja Zasobów) jest Celem Ładu”. Nie myl z: Cięcie kosztów – Najtańsza opcja nie zawsze jest optymalna – liczy się skuteczność i wydajność, nie sama cena.; Zasób – Zasób to rzecz (ludzie, pieniądze, sprzęt); optymalizacja zasobów to cel Ładu dotyczący ich wykorzystania.","src":"COBIT 5 Framework (PL), s. 93"},"ryzyko":{"t":"Ryzyko","eg":"Ryzyko","pd":"Ryzyko","en":"Risk","wyj":"Coś może pójść źle; liczy się, jak bardzo jest to prawdopodobne i jak bardzo zaboli.\n\nRyzyko (risk) to połączenie prawdopodobieństwa zdarzenia i jego konsekwencji. Dotyczy przyszłości. Dopowiedzenie kursu (interpretacja, nie definicja z s. 93): gdy zdarzenie już nastąpiło, mówimy raczej o problemie albo incydencie. Ład ustala apetyt na ryzyko (risk appetite), czyli ile ryzyka organizacja jest gotowa przyjąć (EDM03, Zapewnienie optymalizacji ryzyka), a Zarządzanie identyfikuje, ocenia i ogranicza ryzyka w tych granicach (APO12, Zarządzanie ryzykiem).\n\nŻeby z wyprzedzeniem widzieć, co może pójść źle i jak bardzo by zaszkodziło, i świadomie decydować, czemu zapobiegać, a co zaakceptować.","zycie":"Planujecie wesele w ogrodzie w lipcu. Deszcz jest dość prawdopodobny, a skutek byłby duży – goście mokną, tort się rozpływa – więc rezerwujecie namiot. Ryzyko to ta możliwość deszczu razem z jej skutkami; jeśli w dniu wesela leje, macie już problem, a nie ryzyko.","firma":"W biurze rachunkowym tylko pani Ewa umie obsługiwać program do płac. Jeśli zachoruje w ostatnim tygodniu miesiąca, pensje u klientów się spóźnią. Szef ocenia, że to mało prawdopodobne, ale bolesne, więc każe przeszkolić drugą osobę – tak wygląda praca z ryzykiem.","urzad":"Nabór wniosków o dopłaty do wymiany pieców w urzędzie gminy zamyka się w piątek o 15:00, a wszystko idzie przez jeden serwer. Awaria akurat w piątek jest mało prawdopodobna, ale skutek byłby fatalny, więc informatyk robi kopię i ma tego dnia dyżur. To ryzyko: możliwość zdarzenia plus jego skutki.","it":"W procesie APO12 (Zarządzanie ryzykiem) dział IT prowadzi rejestr ryzyk: np. „awaria serwerowni” ma ocenione prawdopodobieństwo i skutki. Dla ryzyk powyżej apetytu ustalonego przez Ład w EDM03 (Zapewnienie optymalizacji ryzyka) planuje się działania, np. zapasowe centrum danych.","egz":"Na egzaminie ryzyko pojawia się głównie jako „optymalizacja ryzyka” (cel Ładu) i „apetyt na ryzyko” (czynnik środowiskowy we wdrożeniu). Nie myl z: Issue / problem / incydent – Problem już zaistniał; ryzyko jest możliwością w przyszłości.; Zagrożenie – Zagrożenie to źródło (np. powódź); ryzyko łączy prawdopodobieństwo z konsekwencjami.","src":"COBIT 5 Framework (PL), s. 93"},"tworzenie-wartosci":{"t":"Tworzenie Wartości – Cel Ładu","eg":"Tworzenie Wartości – Cel Ładu","pd":"Tworzenie wartości – cel nadzoru","en":"Value Creation (governance objective)","wyj":"Pożytek większy niż koszt i ryzyko: dostajemy korzyści, nie przepłacając i nie narażając się bez potrzeby.\n\nTworzenie wartości (value creation) to cel Ładu wynikający z potrzeb interesariuszy. Składa się z trzech elementów: realizacji korzyści (benefits realisation), optymalizacji ryzyka (risk optimisation) i optymalizacji zasobów (resource optimisation). Ład równoważy je przy każdej decyzji, pytając, kto odnosi korzyści, kto ponosi ryzyko i jakie zasoby są potrzebne; w procesach odpowiadają za to EDM02, EDM03 i EDM04.\n\nŻeby każdą decyzję o IT oceniać nie tylko po korzyściach, ale też po ryzyku i zużytych zasobach, bo dopiero ich równowaga daje interesariuszom wartość.","zycie":"Zastanawiasz się nad rowerem do dojazdów. Liczysz: 300 zł miesięcznie mniej na paliwo i pół godziny mniej w korkach (korzyść), ryzyko kradzieży i wypadku (kupujesz zapięcie i kask), cena 2500 zł i miejsce w piwnicy (zasoby). Kupujesz, bo te trzy rzeczy się bilansują – to jest tworzenie wartości.","firma":"Właściciel warsztatu rozważa program do rezerwacji wizyt online. Zyska więcej klientów i mniej telefonów, ale ryzykuje wyciek danych klientów, a do tego płaci 150 zł abonamentu i traci dwa dni na szkolenie. Decyduje się, gdy znajduje dostawcę z dobrymi zabezpieczeniami – korzyść, ryzyko i koszt są w równowadze.","urzad":"Starostwo wdraża elektroniczny obieg dokumentów. Sprawy idą o tydzień szybciej (korzyść), ale trzeba robić kopie zapasowe, żeby awaria nie zgubiła akt (ryzyko), i kupić licencje oraz oddelegować dwie osoby do wdrożenia (zasoby). Gdyby system był szybki, ale zawodny albo za drogi, nie byłoby z niego wartości.","it":"W procesach EDM02 (Zapewnienie realizacji korzyści), EDM03 (Zapewnienie optymalizacji ryzyka) i EDM04 (Zapewnienie optymalizacji zasobów) zarząd ocenia inwestycję w usługi chmurowe: jakie korzyści da, czy ryzyko mieści się w apetycie na ryzyko i czy wystarczy ludzi i pieniędzy. Wartość jest dopiero przy równowadze tych trzech ocen.","egz":"Cel Ładu „Tworzenie Wartości” realizuje się przez wszystkie trzy składniki naraz. Odpowiedź z jednym składnikiem jest niepełna (pułapka „zbyt wąskie”). Egzamin: „Cel Ładu”. Podręcznik: „Cel nadzoru”. To ten sam cel – tworzenie wartości. Nie myl z: Zysk – Zysk to tylko jedna postać korzyści. W sektorze publicznym korzyścią są usługi publiczne.; Realizacja korzyści – Realizacja korzyści to tylko jeden z trzech składników tworzenia wartości.","src":"COBIT 5 Framework (PL), s. 17, Ilustracja 3; COBIT 5 Framework (PL), s. 93"},"optymalizacja-ryzyka":{"t":"Optymalizacja ryzyka","eg":"Optymalizacja ryzyka","pd":"Optymalizacja ryzyka","en":"Risk Optimisation","wyj":"Pilnowanie, żeby zagrożeń nie było więcej, niż szefostwo jest gotowe znieść.\n\nRyzyko się rozpoznaje, szacuje jego wpływ i prawdopodobieństwo, a potem wybiera strategię: unikanie (avoidance), ograniczanie (mitigation) albo transfer (transfer), i zarządza nim w kontekście apetytu na ryzyko (risk appetite). Apetyt na ryzyko ustala i monitoruje Ład w EDM03 (Zapewnienie optymalizacji ryzyka), a bieżące zarządzanie ryzykiem prowadzi Zarządzanie w APO12 (Zarządzanie ryzykiem). Razem z realizacją korzyści i optymalizacją zasobów tworzy cel Ładu: tworzenie wartości.\n\nŻeby ryzyko związane z IT utrzymać na akceptowalnym poziomie, czyli w granicach apetytu na ryzyko, a nie próbować go wyeliminować, co zablokowałoby działanie.","zycie":"Codziennie jeździsz samochodem do pracy, choć wiesz, że może zdarzyć się stłuczka. Zapinasz pasy (ograniczasz skutki), kupujesz AC (przerzucasz koszt na ubezpieczyciela), a po weselu kuzyna nie siadasz za kierownicę (unikasz). Ryzyko nie spada do zera, ale jest na poziomie, z którym możesz żyć – to optymalizacja ryzyka.","firma":"Sklep internetowy mógłby w ogóle nie przyjmować kart, żeby nie ryzykować wycieku, ale wtedy mało kto by coś kupił. Właścicielka oddaje więc płatności operatorowi i nie trzyma numerów kart u siebie (unikanie), robi codzienne kopie zapasowe (ograniczanie) i wykupuje ubezpieczenie od cyberataku (transfer). Ryzyko zostaje, ale w granicach, na które ją stać.","urzad":"Urząd gminy mógłby odłączyć się od internetu, żeby nikt się nie włamał, ale mieszkańcy straciliby e-usługi. Wójt akceptuje, że jakieś ryzyko zostaje, i każe wprowadzić to, co ma sens przy tych danych: kopie zapasowe, aktualizacje, szkolenie z rozpoznawania fałszywych maili. Zabezpieczenia na miarę zagrożenia, a nie za wszelką cenę – to optymalizacja ryzyka.","it":"W EDM03 (Zapewnienie optymalizacji ryzyka) zarząd ustala apetyt na ryzyko: przestój systemu sprzedaży najwyżej 4 godziny w roku. W APO12 (Zarządzanie ryzykiem) dział IT ocenia scenariusze i dobiera zabezpieczenia tak, by zmieścić się w tej granicy.","egz":"Jeden z trzech składników celu Ładu. Pułapka w odpowiedziach: „wyeliminowanie ryzyka” jest zawsze błędne. Poprawnie: „utrzymanie ryzyka na akceptowalnym poziomie / w granicach apetytu na ryzyko”. Nie myl z: Eliminacja ryzyka – Optymalizacja ≠ eliminacja. Usunięcie każdego ryzyka zwykle zabija też korzyści.; Ryzyko – Ryzyko to sama możliwość zdarzenia; optymalizacja ryzyka to cel Ładu dotyczący zarządzania nim.","src":"COBIT 5 Framework (PL), s. 93; COBIT 5 Framework (PL), s. 13"},"komponent-cel-ladu":{"t":"Cel Ładu (Tworzenie Wartości)","eg":"Cel Ładu (Tworzenie Wartości)","pd":"Cel nadzoru: tworzenie wartości","en":"Governance objective: value creation","wyj":"Po co w ogóle decydujemy: żeby z wydanych pieniędzy i pracy był pożytek, bez zbędnego ryzyka.\n\nOrgan Ładu formułuje cel jako tworzenie wartości: korzyści przy optymalnym ryzyku i zasobach. Aktywatory, zakres i role dobiera się tak, żeby temu celowi służyły. Każdą decyzję sprawdza się pytaniami z s. 17: kto odnosi korzyści, kto ponosi ryzyko, jakie zasoby są wymagane.\n\nŻeby każda decyzja o IT miała jeden punkt odniesienia: czy tworzy wartość. Bez celu pozostałe komponenty nie mają kierunku.","zycie":"Rodzina planuje zakup samochodu. Zanim wybierze model, ustala, po co. Auto ma wozić dzieci do szkoły (korzyść), nie psuć się zimą (ryzyko) i nie zjeść oszczędności (zasoby). To „po co” jest Celem Ładu w domowym systemie decyzji.","firma":"Właściciel piekarni ustala, po co mu nowy system kasowy: szybsza obsługa klientów, bez ryzyka utraty danych i bez przepłacania. Każdą decyzję o kasach porównuje potem z tym celem. To Cel Ładu, pierwszy komponent Podejścia do Ładu.","urzad":"Rada gminy zapisuje w strategii cyfryzacji: e-usługi mają oszczędzać czas mieszkańców, chronić ich dane i mieścić się w budżecie. Ten zapis to Cel Ładu, czyli wspólny punkt odniesienia dla decyzji o IT w gminie. Gdy wójt proponuje nowy system, radni pytają: kto zyska, kto poniesie ryzyko i ile to będzie kosztować.","it":"Procesy EDM02, EDM03 i EDM04 odpowiadają trzem częściom Celu Ładu: realizacji korzyści, optymalizacji ryzyka i optymalizacji zasobów (Ilustracja 16, s. 33).","egz":"Cztery komponenty z Ilustracji 8: Cel Ładu, aktywatory Ładu, zakres Ładu oraz role, działania i relacje. Jeśli w opcjach widzisz „Oszacuj, Kieruj i Monitoruj” albo proces EDM05 jako komponent, to dystraktor. Egzamin: „Cel Ładu”. Podręcznik: „Cel nadzoru”. Komponentem jest cel (tworzenie wartości), a nie praktyki Oszacuj, Kieruj i Monitoruj. Nie myl z: Tworzenie Wartości – Cel Ładu – Tworzenie wartości to treść celu (co znaczy wartość). Cel Ładu jako komponent to miejsce tej treści w Podejściu do Ładu, obok aktywatorów, zakresu i ról.; Oszacuj, Kieruj i Monitoruj (EDM) – Oszacuj, Kieruj i Monitoruj to praktyki procesów Ładu (domena EDM), a nie komponent Podejścia do Ładu.; Cele organizacji – Cele organizacji to 17 typowych celów z kaskady celów. Cel Ładu jest jeden: tworzenie wartości.","src":"COBIT 5 Framework (PL), s. 23, Ilustracja 8; COBIT 5 Framework (PL), s. 24; COBIT 5 Framework (PL), s. 17"}},"S":[{"lekcje":["pr-k14-tworzenie-wartosci"],"pt":"Lekcja 1.14","h":"Cel Ładu: Tworzenie Wartości – jedna nazwa, bez słowa „jedyny”","b":"<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>Egzamin<\/th><th>Podręcznik<\/th><th>EN<\/th><\/tr><tr><td><w k=\"tworzenie-wartosci\">Cel Ładu: Tworzenie Wartości<\/w><\/td><td>cel nadzoru: tworzenie wartości<\/td><td><span class=\"en\"><w k=\"komponent-cel-ladu\">Governance Objective: Value Creation<\/w><\/span><\/td><\/tr><\/table><\/div><blockquote>„jednym z celów w zakresie nadzoru jest tworzenie wartości”<\/blockquote>","c":"Tworzenie Wartości zawsze ma trzy składniki naraz: korzyści, ryzyko, zasoby.","s":"COBIT 5 Framework (PL), s. 17 (Ilustracja 3), 93","ctx":"<p>Na egzaminie przeczytasz „Cel Ładu: Tworzenie Wartości”, w podręczniku „cel nadzoru: tworzenie wartości”, w materiałach egzaminacyjnych bywa też „kreowanie wartości” – to ten sam cel (Rysunek 3). Słowniczek definiuje go jako „główny cel nadzoru w przedsiębiorstwie”, osiągany przez równowagę realizacji korzyści, optymalizacji ryzyka i optymalizacji zasobów; każdy z tych składników też opisuje jako „jeden z celów nadzoru”. Bezpieczna formuła: Cel Ładu to Tworzenie Wartości – bez „jedyny”.<\/p><p>Rysunek 3 pokazuje łańcuch: wyznacznik → potrzeby interesariuszy → Cel Ładu z trzema składnikami. Korzyści w firmie są zwykle finansowe, w administracji są nimi usługi publiczne – dlatego Tworzenie Wartości dotyczy każdej organizacji, także niekomercyjnej.<\/p><p>Przykład: szpital wdraża elektroniczną dokumentację etapami – lekarz od razu widzi wyniki, ryzyko przestoju i wycieku pozostaje akceptowalne, a koszt licencji i szkoleń rozsądny.<\/p>"},{"pt":"Sprawdź się","quiz":{"id":"q-pra-14-3","sylabus":["PR-02-01"],"tresc":"Jak brzmi Cel Ładu w COBIT 5 (<em>Governance objective<\/em>)?","opcje":[{"t":"Tworzenie Wartości","ok":true,"w":"Dobrze. Cel Ładu jest jeden: Tworzenie Wartości (<em>Value Creation<\/em>)."},{"t":"Realizacja korzyści","w":"To tylko jeden z trzech składników Celu Ładu."},{"t":"Realizacja potrzeb interesariusza","w":"To nazwa zasady 1, a nie Celu Ładu."},{"t":"Cel nadzoru: optymalizacja kosztów IT","w":"Podręcznik pisze „cel nadzoru: tworzenie wartości”, a nie optymalizacja kosztów."}],"src":"COBIT 5 Framework (PL), s. 17","pomoc":{"t":"Pytanie dotyczy lekcji 1.14 „Cel Ładu – Tworzenie Wartości”. Cel lekcji: Potrafię powiedzieć, że Cel Ładu to Tworzenie Wartości, i wymienić jego trzy składniki.","k":["tworzenie-wartosci"]}}},{"pt":"Arkusz próbny","sp1":"sp1-29","lekcja":"1.14","temat":"Cel Ładu – Tworzenie Wartości","k":["tworzenie-wartosci"]},{"lekcje":["pr-k15-optymalizacja","pr-k16-trzy-pytania"],"pt":"Lekcje 1.15–1.16","h":"Skrajność w odpowiedzi to sygnał błędu","b":"<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>Dystraktor<\/th><th>Poprawnie<\/th><\/tr><tr><td>„<w k=\"ryzyko\">ryzyko<\/w> do zera”<\/td><td>ryzyko akceptowalne<\/td><\/tr><tr><td>„najtańsza oferta”<\/td><td>skuteczne i odpowiedzialne użycie zasobów<\/td><\/tr><tr><td>„system odebrany = korzyść”<\/td><td>faktyczna poprawa<\/td><\/tr><tr><td>„decyduje największa grupa”<\/td><td>Ład uwzględnia wszystkich interesariuszy<\/td><\/tr><\/table><\/div>","c":"Przy każdej decyzji: kto odnosi korzyści, kto ponosi ryzyko, jakie zasoby są wymagane?","s":"COBIT 5 Framework (PL), s. 13, 17","ctx":"<p>Trzy pytania z s. 17 to praktyczna wersja trzech składników Celu Ładu. Podręcznik dodaje, że przed decyzją system nadzoru powinien uwzględnić oczekiwania wszystkich interesariuszy – Ład negocjuje i decyduje, co jest wartością. Korzyść i ryzyko często spadają na różne strony, dlatego pytania zaczynają się od „kto”.<\/p><p>Każdy dystraktor z tabeli zamienia równowagę w jedną skrajność. Słowa „do zera”, „zawsze najtaniej”, „w dniu odbioru systemu” czy „głos większości” to sygnał ostrzegawczy; poprawna odpowiedź mówi o poziomie akceptowalnym, rozsądnym użyciu zasobów i uwzględnieniu wszystkich stron.<\/p><p>Przykład: bank wybiera dostawcę chmury. Oferta A jest najtańsza, ale bez kopii w drugim centrum danych; oferta B jest droższa, z kopiami i certyfikatem bezpieczeństwa. Wybór B to optymalizacja ryzyka i zasobów naraz.<\/p>"},{"pt":"Sprawdź się","quiz":{"id":"q-pra-15-3","sylabus":["PR-02-01"],"tresc":"Co oznacza <b>optymalizacja ryzyka<\/b> (<em>Risk Optimisation<\/em>) w Celu Ładu?","opcje":[{"t":"Całkowitą eliminację każdego ryzyka","w":"Optymalizacja to nie eliminacja."},{"t":"Ryzyko na akceptowalnym poziomie","ok":true,"w":"Dobrze. Podręcznik mówi o utrzymaniu ryzyka na akceptowalnym poziomie."},{"t":"Minimalizację kosztów usług IT","w":"To pomylenie ryzyka z zasobami, i to w wersji „najtaniej”."},{"t":"Przeniesienie całego ryzyka na dostawcę","w":"To tylko jeden sposób postępowania z ryzykiem, a nie definicja optymalizacji."}],"src":"COBIT 5 Framework (PL), s. 13; COBIT 5 Framework (PL), s. 17","pomoc":{"t":"Pytanie dotyczy lekcji 1.15 „Optymalizacja ryzyka i zasobów – nie zero, nie najtaniej”. Cel lekcji: Potrafię wyjaśnić, że optymalizacja ryzyka to ryzyko akceptowalne, a optymalizacja zasobów to rozsądne, a nie najtańsze użycie zasobów.","k":["optymalizacja-ryzyka","optymalizacja-zasobow"]}}},{"pt":"Sprawdź się","quiz":{"id":"q-pra-16-3","sylabus":["PR-02-01"],"tresc":"Interesariusze organizacji chcą różnych, czasem sprzecznych rzeczy. Kto według COBIT 5 negocjuje i decyduje, co jest wartością?","opcje":[{"t":"Zarządzanie, bo prowadzi projekty","w":"Zarządzanie planuje i wykonuje w kierunku wskazanym przez Ład."},{"t":"Dostawca systemu, bo zna technologię","w":"Dostawca jest interesariuszem zewnętrznym i nie decyduje za organizację."},{"t":"Ład","ok":true,"w":"Dobrze. Nadzór, czyli Ład, negocjuje i decyduje o wartości, uwzględniając wszystkich interesariuszy."},{"t":"Dział IT, bo zna systemy","w":"Dział IT realizuje decyzje, ale nie rozstrzyga, co jest wartością."}],"src":"COBIT 5 Framework (PL), s. 17","pomoc":{"t":"Pytanie dotyczy lekcji 1.16 „Trzy pytania przy każdej decyzji i różna wartość dla różnych interesariuszy”. Cel lekcji: Potrafię zadać trzy pytania COBIT 5 przy decyzji i wyjaśnić, dlaczego to Ład decyduje, co jest wartością.","k":[]}}}]};</script>
