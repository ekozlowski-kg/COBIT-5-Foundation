<script>window.DECK={"id":"k-pr-atlas-apo","rozdzial":"Rozdział 6 · Zasada 5: Oddzielenie Ładu od Zarządzania · s. 31–33","tytul":"Atlas procesów: APO","prev":"k-pr-atlas-edm.html","next":"k-pr-atlas-bai.html","T":{"proc-apo07":{"t":"APO07 Zarządzanie zasobami ludzkimi","eg":"APO07 Zarządzanie zasobami ludzkimi","pd":"APO07 Zarządzanie zasobami ludzkimi","en":"APO07 Manage Human Resources","wyj":"Dbanie o ludzi w informatyce: kogo zatrudnić, czego ich nauczyć, kto kogo zastąpi i jak ich oceniać.\n\nKierownictwo IT planuje obsadę ról i potrzebne kompetencje. Organizuje rekrutację, szkolenia, ocenę pracy i zastępstwa w kluczowych rolach. Pilnuje też zasad pracy osób z zewnątrz.\n\nŻeby w IT pracowali właściwi ludzie z właściwymi umiejętnościami i żeby nic nie zależało od jednej osoby.","zycie":"W rodzinnej piekarni tylko dziadek umie zrobić zakwas. Gdy zachoruje, nie ma chleba. Rodzina postanawia: wnuczka uczy się od dziadka i co tydzień piecze z nim. Dbanie o umiejętności i zastępstwa to APO07.","firma":"W firmie transportowej jeden informatyk zna system rozliczeń kierowców. Kierownik IT planuje szkolenie drugiej osoby i ocenia kompetencje zespołu. Raz w roku rozmawia z każdym o celach. To APO07.","urzad":"Sekretarz powiatu widzi, że informatyk odchodzi na emeryturę. Planuje nabór, wdrożenie następcy i szkolenia. Ustala też zasady pracy firmy zewnętrznej, która pomaga w serwisie. To APO07.","it":"Kierownik IT ma plan sukcesji dla administratora bazy danych i matrycę kompetencji zespołu. To APO07. Spisana instrukcja administratora to już BAI08.","egz":"Słowa-klucze: obsada, kompetencje, szkolenia, ocena pracowników, zależność od kluczowych osób, personel zewnętrzny → APO07 Human Resources. Nie EDM04 i nie BAI09. Nazwa egzaminacyjna PL niepotwierdzona: na egzaminie nazwa może brzmieć inaczej niż w podręczniku. Egzamin używa własnych tłumaczeń, w domenach trybu rozkazującego (np. „Dostosuj, Planuj i Organizuj”). Rozpoznawaj proces po kodzie APO07 i słowie kluczowym EN Human Resources. Pułapka „zasoby”: APO07 to Human Resources (tylko ludzie). EDM04 to Resource (wszystkie zasoby, Ład). BAI09 to Assets (aktywa). Nie myl z: EDM04 Zapewnienie optymalizacji zasobów – EDM04 (Ład) ocenia i kieruje wykorzystaniem wszystkich zasobów. APO07 (Zarządzanie) zajmuje się ludźmi: obsadą, kompetencjami, szkoleniami.; BAI09 Zarządzanie zasobami – BAI09 Assets to sprzęt i licencje. W podręczniku też „zasoby”, ale nie ludzie.; BAI08 Zarządzanie wiedzą – BAI08 utrzymuje wiedzę: instrukcje, bazy wiedzy. APO07 dba o ludzi i ich umiejętności.; Ludzie, Umiejętności i Kompetencje – To aktywator, czyli kategoria „czego potrzebujemy”. APO07 to proces, który ludźmi zarządza.","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; COBIT 5 Framework (PL), s. 60; COBIT 5 Framework (PL), s. 22, Ilustracja 7"},"proc-apo01":{"t":"APO01 Zarządzanie metodyką zarządzania IT","eg":"APO01 Zarządzanie metodyką zarządzania IT","pd":"APO01 Zarządzanie metodyką zarządzania IT","en":"APO01 Manage the IT Management Framework","wyj":"Szef informatyki ustala, jak jego dział jest zorganizowany: kto za co odpowiada i według jakich zasad pracuje.\n\nKierownictwo IT projektuje strukturę organizacyjną, role i odpowiedzialności. Ustala polityki IT i właścicieli informacji oraz systemów. Komunikuje to i regularnie doskonali procesy.\n\nŻeby dział IT miał jasną organizację: kto za co odpowiada, jakie są zasady i procesy, i żeby to stale poprawiać.","zycie":"Zakładasz z sąsiadami ogródek. Spisujecie, kto podlewa, kto kupuje nasiona i kto prowadzi zeszyt wydatków. Ustalacie też zastępstwa na urlopy. Taka organizacja wspólnej pracy to APO01.","firma":"Nowy dyrektor IT w hurtowni spisuje, kto jest właścicielem każdego systemu i procesu. Wprowadza politykę IT i jeden sposób zgłaszania zmian. Raz na kwartał przegląda procesy i je poprawia. To APO01.","urzad":"Kierownik referatu informatyki w urzędzie miasta pisze regulamin referatu: zakresy obowiązków, zastępstwa, właściciele systemów, zasady dokumentowania. Burmistrz go zatwierdza. Opracowanie i utrzymanie tego układu to APO01.","it":"Dyrektor IT tworzy katalog ról, tabele Diagram RACI dla procesów i politykę IT oraz wyznacza właścicieli procesów. To APO01, oparte na zasadach z EDM01 Zapewnienie i utrzymanie ładu korporacyjnego.","egz":"Słowa-klucze: struktura organizacyjna IT, role i odpowiedzialności, polityki IT, system zarządzania, ciągłe doskonalenie procesów → APO01. Nazwa na egzaminie może mieć „strukturę ramową” zamiast „metodyki”. Nazwa egzaminacyjna PL niepotwierdzona: na egzaminie nazwa może brzmieć inaczej niż w podręczniku. Egzamin używa własnych tłumaczeń, w domenach trybu rozkazującego (np. „Dostosuj, Planuj i Organizuj”). Rozpoznawaj proces po kodzie APO01 i słowie kluczowym EN IT Management Framework. „Metodyka” to tu Framework, a egzamin tłumaczy Framework jako „Struktura ramowa”. Nie chodzi o metodykę prowadzenia projektów (to BAI01). Nie myl też z EDM01. Nie myl z: EDM01 Zapewnienie i utrzymanie ładu korporacyjnego – EDM01 (Ład) ustala zasady decydowania o IT. APO01 (Zarządzanie) organizuje pracę zarządczą IT według tych zasad.; BAI01 Zarządzanie programami i projektami – BAI01 prowadzi programy i projekty. „Metodyka” w nazwie APO01 to framework, a nie metodyka projektowa.; Struktura ramowa – Struktura ramowa (framework) to ogólne pojęcie. APO01 to proces, który zarządza strukturą ramową zarządzania IT w danej organizacji.","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; COBIT 5 Framework (PL), s. 88, Ilustracja 39; COBIT 5 Framework (PL), s. 32; materiały Altkom"},"proc-apo11":{"t":"APO11 Zarządzanie jakością","eg":"APO11 Zarządzanie jakością","pd":"APO11 Zarządzanie jakością","en":"APO11 Manage Quality","wyj":"Ustalenie, co znaczy „dobrze zrobione”, pilnowanie tego i ciągłe poprawianie pracy, żeby użytkownicy byli zadowoleni.\n\nKierownictwo IT ustala wymagania i standardy jakości dla procesów, usług i rozwiązań. Utrzymuje system zarządzania jakością, robi przeglądy i słucha klientów. Na tej podstawie wprowadza usprawnienia.\n\nŻeby było jasne, co znaczy „dobrze zrobione” w IT, i żeby praca była stale poprawiana.","zycie":"Gotujesz obiady dla gości. Ustalasz: zupa zawsze gorąca, porcje równe. Pytasz gości o opinię i poprawiasz przepis. Wymagania, sprawdzanie i poprawki to zarządzanie jakością.","firma":"Firma programistyczna wprowadza zasadę: żaden kod bez przeglądu drugiej osoby i bez testów. Co kwartał analizuje skargi klientów i poprawia standard. To APO11.","urzad":"Urząd skarbowy wprowadza standard: odpowiedź na e-mail podatnika w 3 dni, prostym językiem. Kierownik sprawdza próbki i poprawia szablony. To APO11.","it":"Dział IT utrzymuje system zarządzania jakością: standard przeglądu kodu, testy przed wdrożeniem, analiza skarg. To APO11. Przekrojowy raport mierników dla zarządu przygotowuje MEA01 Monitorowanie, ocena i oszacowanie wydajności i zgodności.","egz":"Słowa-klucze: standardy jakości, system zarządzania jakością, zadowolenie klienta, ciągłe doskonalenie → APO11. Mierniki wyników i zgodności, raport dla kierownictwa i Ładu → MEA01. Nazwa egzaminacyjna PL niepotwierdzona: na egzaminie nazwa może brzmieć inaczej niż w podręczniku. Egzamin używa własnych tłumaczeń, w domenach trybu rozkazującego (np. „Dostosuj, Planuj i Organizuj”). Rozpoznawaj proces po kodzie APO11 i słowie kluczowym EN Quality. Nie myl z MEA01 (monitorowanie wyników i zgodności) ani z kryteriami jakości informacji z aktywatora Informacja. Nie myl z: MEA01 Monitorowanie, ocena i oszacowanie wydajności i zgodności – MEA01 zbiera i ocenia wyniki i zgodność wszystkich procesów względem celów i raportuje je w górę. APO11 ustala wymagania jakości i prowadzi doskonalenie.; Kryteria jakości informacji – Jakość informacji to cechy informacji, np. dokładność i aktualność. APO11 to proces zarządzania jakością pracy i usług IT.","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; COBIT 5 Framework (PL), s. 33; COBIT 5 Framework (PL), s. 93; COBIT 5 Framework (PL), s. 61"},"proc-apo06":{"t":"APO06 Zarządzanie budżetem i kosztami","eg":"APO06 Zarządzanie budżetem i kosztami","pd":"APO06 Zarządzanie budżetem i kosztami","en":"APO06 Manage Budget and Costs","wyj":"Planowanie, ile pieniędzy pójdzie na informatykę, pilnowanie wydatków i wyjaśnianie, skąd biorą się koszty.\n\nKierownictwo IT razem z finansami planuje budżet i przydziela go. W trakcie roku śledzi koszty i wyjaśnia odchylenia od planu. Może też rozliczać koszty IT na jednostki, które z IT korzystają.\n\nŻeby wydatki na IT były zaplanowane, kontrolowane i zrozumiałe dla tych, którzy za nie płacą.","zycie":"Prowadzisz zeszyt wydatków domowych. Planujesz miesiąc, zapisujesz każdy rachunek i sprawdzasz, czemu prąd kosztował więcej. Koszt wspólnego internetu dzielisz między współlokatorów. To APO06.","firma":"Dział finansów i IT co miesiąc porównują plan z wydatkami na licencje i chmurę. Wzrost kosztów chmury o 30% trzeba wyjaśnić. Koszt systemu sprzedażowego rozlicza się na dział sprzedaży. To APO06.","urzad":"Skarbnik gminy z informatykiem planują budżet IT na rok. W trakcie roku śledzą faktury za serwis i licencje. Gdy koszt rośnie, szukają przyczyny i korygują plan. To APO06.","it":"Kontroler IT dzieli koszt chmury między działy według zużycia i wyjaśnia zarządowi wzrost o 30%. To APO06. Negocjacje z dostawcą chmury prowadzi APO10 Zarządzanie dostawcami.","egz":"Słowa-klucze: budżet IT, śledzenie kosztów, odchylenia, przydział i rozliczanie kosztów (refundacja) → APO06. Wybór inwestycji → APO05. Nazwa egzaminacyjna PL niepotwierdzona: na egzaminie nazwa może brzmieć inaczej niż w podręczniku. Egzamin używa własnych tłumaczeń, w domenach trybu rozkazującego (np. „Dostosuj, Planuj i Organizuj”). Rozpoznawaj proces po kodzie APO06 i słowie kluczowym EN Budget and Costs. Nie myl z EDM04 (Ład nad wszystkimi zasobami) ani z APO05 (wybór inwestycji). APO06 to finanse IT: budżet, koszty i ich rozliczanie. Nie myl z: APO05 Zarządzanie Portfelem – APO05 wybiera, w co inwestujemy. APO06 planuje i kontroluje pieniądze i koszty, także bieżące.; EDM04 Zapewnienie optymalizacji zasobów – EDM04 (Ład) ustala zasady optymalnego użycia wszystkich zasobów. APO06 (Zarządzanie) prowadzi budżet i koszty IT.; Uzasadnienie biznesowe – Uzasadnienie biznesowe dotyczy jednej inicjatywy: koszty, korzyści, ryzyko. APO06 prowadzi budżet całego IT.","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; COBIT 5 Framework (PL), s. 88, Ilustracja 39; COBIT 5 Framework (PL), s. 89; COBIT 5 Framework (PL), s. 22, Ilustracja 7"},"proc-apo08":{"t":"APO08 Zarządzanie relacjami","eg":"APO08 Zarządzanie relacjami","pd":"APO08 Zarządzanie relacjami","en":"APO08 Manage Relationships","wyj":"Informatycy regularnie rozmawiają z resztą organizacji, żeby dobrze rozumieć potrzeby ludzi i budować zaufanie.\n\nIT utrzymuje stały kontakt z użytkownikami i kierownikami w organizacji. Zbiera potrzeby, tłumaczy możliwości IT i uzgadnia priorytety. Mierzy zadowolenie i reaguje na sygnały.\n\nŻeby IT i reszta organizacji rozumiały się nawzajem, ufały sobie i razem ustalały potrzeby.","zycie":"Fryzjer przy każdej wizycie pyta, jak sprawdziła się ostatnia fryzura i czego szukasz teraz. Zna Twoje potrzeby, zanim je powiesz. To relacja, a nie cennik. W IT to APO08.","firma":"Opiekun biznesowy z działu IT co miesiąc spotyka się z kierownikami sprzedaży i magazynu. Słucha, co ich boli, i tłumaczy, co IT może zrobić. Raz w roku robi ankietę zadowolenia. To APO08.","urzad":"Informatyk urzędu marszałkowskiego raz w miesiącu odwiedza każdy departament i pyta o problemy z systemami. Zbiera potrzeby na kolejny rok. Departamenty mu ufają i zgłaszają kłopoty wcześniej. To APO08.","it":"Opiekun biznesowy (business relationship manager) prowadzi kwartalne spotkania z dyrektorami działów i badania zadowolenia. To APO08. Spisane poziomy usług to APO09 Zarządzanie umowami o świadczenie usług.","egz":"Słowa-klucze: relacja IT–biznes, wspólne rozumienie potrzeb, opiekun biznesowy, zadowolenie użytkowników → APO08. Framework używa APO08 jako przykładu celów i mierników procesu (s. 30). Nazwa egzaminacyjna PL niepotwierdzona: na egzaminie nazwa może brzmieć inaczej niż w podręczniku. Egzamin używa własnych tłumaczeń, w domenach trybu rozkazującego (np. „Dostosuj, Planuj i Organizuj”). Rozpoznawaj proces po kodzie APO08 i słowie kluczowym EN Relationships. Chodzi o relacje IT z resztą organizacji (z „biznesem”). Relacje z dostawcami to APO10. Nie myl z: APO09 Zarządzanie umowami o świadczenie usług – APO09 zapisuje formalne poziomy usług (SLA) i je monitoruje. APO08 buduje relację i wspólne rozumienie potrzeb.; APO10 Zarządzanie dostawcami – APO10 to relacje z dostawcami zewnętrznymi. APO08 to relacja IT z organizacją, którą IT obsługuje.; Interesariusz – Interesariusze to wszyscy zainteresowani. APO08 skupia się na relacji IT z resztą organizacji.","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; COBIT 5 Framework (PL), s. 30"},"proc-apo04":{"t":"APO04 Zarządzanie innowacjami","eg":"APO04 Zarządzanie innowacjami","pd":"APO04 Zarządzanie innowacjami","en":"APO04 Manage Innovation","wyj":"Śledzenie nowinek i sprawdzanie, które naprawdę pomogą organizacji, zanim wyda się na nie pieniądze.\n\nZespół śledzi trendy i nowe technologie. Ocenia, które mogą pomóc organizacji, i sprawdza je w małym pilotażu. Wyniki i zalecenia przekazuje do strategii i portfela.\n\nŻeby organizacja nie przegapiła nowych możliwości i nie wydawała pieniędzy na nowinki, zanim je sprawdzi.","zycie":"Słyszysz o pompach ciepła. Zanim wymienisz piec, pytasz sąsiada, który ją ma, i liczysz rachunki. Dopiero potem decydujesz. Rozpoznanie i sprawdzenie nowinki przed zakupem to APO04.","firma":"Sklep internetowy testuje automatyczny czat na jednej kategorii produktów. Po miesiącu zespół ocenia, czy klienci są zadowoleni. Wynik trafia do decyzji o inwestycji. Test i ocena nowości to APO04.","urzad":"Urząd gminy sprawdza na jednym okienku elektroniczną kolejkę z powiadomieniem SMS-em. Po kwartale informatyk opisuje wyniki i zaleca wdrożenie albo rezygnację. To APO04.","it":"Zespół IT robi proof of concept nowej technologii i pisze zalecenie. To APO04. Wybór inwestycji należy do APO05 Zarządzanie Portfelem, a ewentualne wdrożenie do BAI.","egz":"Słowa-klucze: trendy technologiczne, szanse na innowacje, pilotaż, proof of concept, zalecenia → APO04. „Innowacje” to kategoria umiejętności domeny APO (il. 39). Nazwa egzaminacyjna PL niepotwierdzona: na egzaminie nazwa może brzmieć inaczej niż w podręczniku. Egzamin używa własnych tłumaczeń, w domenach trybu rozkazującego (np. „Dostosuj, Planuj i Organizuj”). Rozpoznawaj proces po kodzie APO04 i słowie kluczowym EN Innovation. Nie myl z PA 5.1 „Innowacja procesu” z modelu zdolności. To atrybut oceny, a nie proces APO04. Nie myl z: Atrybuty procesu – PA 5.1 „Innowacja procesu” to atrybut w ocenie zdolności procesu. APO04 to proces z modelu referencyjnego.; APO05 Zarządzanie Portfelem – APO05 decyduje, w które inwestycje idą pieniądze. APO04 rozpoznaje i sprawdza pomysły.; BAI03 Zarządzanie identyfikacją i budowaniem rozwiązań – BAI03 identyfikuje i buduje albo pozyskuje rozwiązanie po decyzji. Pilotaż nowinki przed decyzją to jeszcze APO04.","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; COBIT 5 Framework (PL), s. 58; COBIT 5 Framework (PL), s. 88, Ilustracja 39"},"proc-apo05":{"t":"APO05 Zarządzanie Portfelem","eg":"APO05 Zarządzanie Portfelem","pd":"APO05 Zarządzanie portfelem projektów","en":"APO05 Manage Portfolio","wyj":"Wybieranie, w które pomysły wydać ograniczone pieniądze, i pilnowanie, żeby cały zestaw się opłacał.\n\nKierownictwo zbiera propozycje inwestycji z uzasadnieniami biznesowymi. Porównuje je pod względem wartości, ryzyka i zgodności ze strategią. Wybiera, równoważy i monitoruje portfel, a słabe inwestycje wstrzymuje.\n\nŻeby ograniczone pieniądze trafiały do zestawu inwestycji, który razem daje organizacji najwięcej wartości.","zycie":"Masz 20 tys. zł i pięć pomysłów: auto, kurs językowy, wakacje, remont, lokata. Nie starczy na wszystko. Wybierasz zestaw, który da najwięcej. Co pół roku sprawdzasz, czy wybór był dobry.","firma":"Firma ma 12 pomysłów na nowe systemy i budżet na cztery. Komitet porównuje uzasadnienia biznesowe, ryzyko i zgodność ze strategią. Wybiera cztery, resztę odkłada. Co kwartał przegląda cały portfel. To APO05.","urzad":"Miasto zgłosiło do budżetu 30 projektów cyfrowych. Zespół wybiera te, które najbardziej skrócą sprawy mieszkańców. Jeden projekt w trakcie zostaje wstrzymany, bo przestał się opłacać. Takie decyzje to APO05.","it":"Komitet portfelowy co kwartał przegląda wszystkie programy IT, porównuje uzasadnienia biznesowe i wstrzymuje jeden program. To APO05. Prowadzenie programów to BAI01 Zarządzanie programami i projektami.","egz":"Na egzaminie „Zarządzanie Portfelem”. Słowa-klucze: priorytety inwestycji, równoważenie, wybór programów, wartość całego portfela → APO05. Prowadzenie konkretnego projektu → BAI01. Kategoria umiejętności „Zarządzanie portfelami projektów” należy do APO (il. 39). Egzamin: „Zarządzanie Portfelem”. Podręcznik: „Zarządzanie portfelem projektów”. To ten sam APO05. Portfel to nie tylko projekty: obejmuje inwestycje, programy i usługi. Nie myl z BAI01 Zarządzanie programami i projektami. Nie myl z: BAI01 Zarządzanie programami i projektami – BAI01 prowadzi pojedynczy program albo projekt do końca. APO05 wybiera i równoważy cały zestaw inwestycji.; EDM02 Zapewnienie realizacji korzyści – EDM02 (Ład) ustala, jakiej wartości oczekujemy, i ją rozlicza. APO05 (Zarządzanie) układa portfel, żeby tę wartość dać.; Projekt – Projekt to jedno przedsięwzięcie z końcem. Portfel to zbiór wielu inwestycji, programów i usług.","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; COBIT 5 Framework (PL), s. 58; COBIT 5 Framework (PL), s. 92; COBIT 5 Framework (PL), s. 61"},"proc-apo09":{"t":"APO09 Zarządzanie umowami o świadczenie usług","eg":"APO09 Zarządzanie umowami o świadczenie usług","pd":"APO09 Zarządzanie umowami o świadczenie usług","en":"APO09 Manage Service Agreements","wyj":"Spisanie z użytkownikami, jakie usługi daje informatyka, jak dobrze i jak szybko, a potem sprawdzanie tego.\n\nIT definiuje usługi w katalogu usług. Z odbiorcami uzgadnia ich poziomy w umowach SLA, np. dostępność i czas reakcji. Monitoruje dotrzymanie poziomów, raportuje je i przegląda umowy.\n\nŻeby użytkownicy wiedzieli, jakich usług IT i jakiej ich jakości mogą oczekiwać, a IT wiedziało, czego ma dotrzymać.","zycie":"Spółdzielnia zapisuje w regulaminie: winda naprawiona w 24 godziny, śmieci wywożone dwa razy w tygodniu. Raz w roku pokazuje, czy tego dotrzymała. To umowa o poziomie usług, czyli APO09.","firma":"Dział IT uzgadnia z działem sprzedaży: sklep dostępny 99,9% czasu, awaria krytyczna obsłużona w godzinę. Zapisuje to w SLA i co miesiąc raportuje wynik. To APO09.","urzad":"Referat informatyki urzędu miasta publikuje katalog usług dla wydziałów: poczta, drukarki, system kancelaryjny. Przy każdej usłudze podaje czas reakcji. Co kwartał pokazuje, czy go dotrzymał. To APO09.","it":"Dział IT publikuje katalog usług i SLA dla działów, np. dostępność 99,9%. To APO09. Umowy z dostawcami, które pomagają dotrzymać SLA, prowadzi APO10 Zarządzanie dostawcami.","egz":"Słowa-klucze: katalog usług, SLA, poziom usług, dostępność uzgodniona z organizacją → APO09. Umowa z firmą zewnętrzną, wybór i ocena dostawcy → APO10. Nazwa egzaminacyjna PL niepotwierdzona: na egzaminie nazwa może brzmieć inaczej niż w podręczniku. Egzamin używa własnych tłumaczeń, w domenach trybu rozkazującego (np. „Dostosuj, Planuj i Organizuj”). Rozpoznawaj proces po kodzie APO09 i słowie kluczowym EN Service Agreements. „Umowy o świadczenie usług” brzmią jak umowy z dostawcą. Tymczasem APO09 to uzgodnione z organizacją usługi i ich poziomy (SLA). Dostawców i ich umowy prowadzi APO10. Nie myl z: APO10 Zarządzanie dostawcami – APO10 wybiera dostawców, prowadzi z nimi umowy i ocenia ich pracę. APO09 uzgadnia usługi i ich poziomy z organizacją.; APO08 Zarządzanie relacjami – APO08 buduje relację i rozumie potrzeby. APO09 zapisuje je jako mierzalne poziomy usług.; DSS02 Zarządzanie zgłoszeniami serwisowymi i incydentami – DSS02 obsługuje konkretne zgłoszenia i incydenty. APO09 ustala, jak szybko ma się to dziać.","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; COBIT 5 Framework (PL), s. 59; COBIT 5 Framework (PL), s. 93"},"proc-apo10":{"t":"APO10 Zarządzanie dostawcami","eg":"APO10 Zarządzanie dostawcami","pd":"APO10 Zarządzanie dostawcami","en":"APO10 Manage Suppliers","wyj":"Wybieranie firm, które coś dla nas robią, pilnowanie umów z nimi i sprawdzanie, czy się wywiązują.\n\nKierownictwo IT określa wymagania i wybiera dostawców. Zawiera z nimi umowy i prowadzi relację. Regularnie ocenia wykonanie umowy i ryzyko związane z dostawcą, a w razie potrzeby zmienia warunki albo dostawcę.\n\nŻeby firmy zewnętrzne, od których zależy IT, były dobrze wybrane, związane właściwą umową i rzetelnie oceniane.","zycie":"Wybierasz firmę do wywozu śmieci. Porównujesz oferty, podpisujesz umowę, a potem sprawdzasz, czy przyjeżdża w terminie. Gdy zawodzi, rozmawiasz albo zmieniasz firmę. To APO10.","firma":"Sklep internetowy co kwartał ocenia firmę hostingową: dostępność, czas reakcji, cenę. Sprawdza też, co się stanie, jeśli firma upadnie. Przy odnowieniu umowy negocjuje lepsze warunki. To APO10.","urzad":"Ministerstwo przed przetargiem na serwis drukarek opisuje wymagania. Po wyborze wykonawcy co miesiąc sprawdza protokoły napraw. Za spóźnienia nalicza kary z umowy. To APO10.","it":"Kierownik ds. dostawców prowadzi rejestr kontraktów, kwartalną ocenę dostawców i ocenę ryzyka uzależnienia od jednego dostawcy chmury. To APO10. Ryzyko trafia też do APO12 Zarządzanie ryzykiem.","egz":"Słowa-klucze: wybór dostawcy, umowa z dostawcą, ocena wykonania, ryzyko dostawcy, outsourcing → APO10. Usługi i SLA dla własnych użytkowników → APO09. Nazwa egzaminacyjna PL niepotwierdzona: na egzaminie nazwa może brzmieć inaczej niż w podręczniku. Egzamin używa własnych tłumaczeń, w domenach trybu rozkazującego (np. „Dostosuj, Planuj i Organizuj”). Rozpoznawaj proces po kodzie APO10 i słowie kluczowym EN Suppliers. Nie myl z APO09: tamten ma „umowy” w polskiej nazwie, ale to uzgodnienia usług z organizacją. Umowy z dostawcami są w APO10. Nie myl z: APO09 Zarządzanie umowami o świadczenie usług – APO09 uzgadnia usługi i ich poziomy z organizacją (SLA). APO10 zarządza dostawcami i umowami z nimi.; APO08 Zarządzanie relacjami – APO08 to relacja IT z organizacją. APO10 to relacja z dostawcami zewnętrznymi.; BAI03 Zarządzanie identyfikacją i budowaniem rozwiązań – BAI03 identyfikuje i buduje albo pozyskuje rozwiązanie. APO10 zarządza samym dostawcą i umową.","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; COBIT 5 Framework (PL), s. 22, Ilustracja 7; COBIT 5 Framework (PL), s. 58"},"it-portfel":{"t":"Portfel","eg":"Portfel","pd":"Portfel inwestycyjny","en":"Portfolio","wyj":"Lista wszystkich projektów i programów, na które organizacja wydaje albo chce wydać pieniądze.\n\nWszystkie pomysły i trwające projekty trafiają na jedną listę. Kierownictwo porównuje koszty, korzyści i ryzyko. Wybiera, co uruchomić, co kontynuować, a co zatrzymać. Listę przegląda się regularnie.\n\nŻeby organizacja wydawała ograniczone pieniądze na to, co daje jej najwięcej korzyści przy akceptowalnym ryzyku.","zycie":"Rodzina ma 20 000 zł oszczędności i trzy pomysły: nowe auto, remont łazienki, kurs dla córki. Porównuje i wybiera łazienkę i kurs – to zarządzanie domowym portfelem.","firma":"Zarząd szpitala przegląda co kwartał listę 12 projektów IT. Dwa zatrzymuje, bo przestały być potrzebne, a pieniądze przenosi na bezpieczeństwo danych.","urzad":"Urząd marszałkowski ma na liście 15 projektów IT, m.in. nową stronę, e-usługi dla przedsiębiorców i wymianę serwerów. Zarząd województwa co pół roku przegląda całą listę i porównuje koszty, korzyści i ryzyko. Jeden projekt wstrzymuje, a zaoszczędzone pieniądze przesuwa na e-usługi.","it":"APO05 Zarządzanie portfelem projektów; definicja portfela inwestycyjnego w słowniku FW-PL (s. 92).","egz":"APO05 Zarządzanie Portfelem (Manage Portfolio). Kolejność do zapamiętania: portfel zawiera programy, a programy zawierają projekty. Nie myl z: Program – Program to kilka projektów dla jednego celu. Portfel to wszystkie inwestycje organizacji naraz – wiele programów i projektów.; Projekt – Projekt to jedno przedsięwzięcie. Portfel to lista wszystkich przedsięwzięć, spośród których się wybiera.","src":"COBIT 5 Framework (PL), s. 92; COBIT 5 Framework (PL), s. 33, Ilustracja 16; COBIT 5 Framework (PL), s. 31"},"proc-apo12":{"t":"APO12 Zarządzanie ryzykiem","eg":"APO12 Zarządzanie ryzykiem","pd":"APO12 Zarządzanie ryzykiem","en":"APO12 Manage Risk","wyj":"Ciągłe wyszukiwanie, co może pójść źle w informatyce, ocenianie tego i przygotowanie, co wtedy zrobimy.\n\nKierownictwo IT zbiera dane o ryzyku i analizuje je. Utrzymuje profil ryzyka i informuje o nim. Dobiera reakcje: unikanie, ograniczanie, przeniesienie albo akceptację, w granicach apetytu ustalonego przez Ład.\n\nŻeby ryzyko IT było stale rozpoznawane, oceniane i ograniczane do poziomu, który organizacja akceptuje.","zycie":"Przed wyjazdem na wakacje spisujesz, co może pójść źle: kradzież, zalanie, zgubiony paszport. Oceniasz, co najgroźniejsze. Kupujesz ubezpieczenie, prosisz sąsiada o zaglądanie i robisz kopię paszportu. To APO12.","firma":"Kierownik ryzyka IT w banku prowadzi rejestr ryzyk: awaria centrum danych, wyciek danych, odejście kluczowych ludzi. Co miesiąc aktualizuje oceny i postęp działań. Raport trafia do zarządu. To APO12.","urzad":"Informatyk starostwa analizuje: co, jeśli wirus zaszyfruje dane? Ocenia prawdopodobieństwo i skutki. Proponuje kopie zapasowe poza budynkiem i szkolenie pracowników. To APO12.","it":"Kierownik ryzyka IT prowadzi rejestr ryzyk z oceną prawdopodobieństwa i skutków oraz plan reakcji. To APO12. Ryzyka ponad apetyt eskaluje do EDM03 Zapewnienie optymalizacji ryzyka. (interpretacja kursu: eskalacja)","egz":"Słowa-klucze: rejestr ryzyk, profil ryzyka, analiza scenariuszy, reakcja na ryzyko → APO12. Apetyt na ryzyko, kierunek zarządu → EDM03. Nazwa egzaminacyjna PL niepotwierdzona: na egzaminie nazwa może brzmieć inaczej niż w podręczniku. Egzamin używa własnych tłumaczeń, w domenach trybu rozkazującego (np. „Dostosuj, Planuj i Organizuj”). Rozpoznawaj proces po kodzie APO12 i słowie kluczowym EN Manage Risk. Nie myl z EDM03 Zapewnienie optymalizacji ryzyka (Ład). APO12 to codzienna praca z ryzykiem w Zarządzaniu. Nie myl z: EDM03 Zapewnienie optymalizacji ryzyka – EDM03 (Ład) ustala apetyt na ryzyko i rozlicza, czy go przestrzegamy. APO12 (Zarządzanie) rozpoznaje, analizuje i obsługuje ryzyko w tych granicach.; APO13 Zarządzanie bezpieczeństwem – APO13 prowadzi system zarządzania bezpieczeństwem informacji. APO12 obejmuje całe ryzyko IT, nie tylko bezpieczeństwo.; DSS04 Zarządzanie ciągłością – DSS04 przygotowuje i ćwiczy plany ciągłości działania. APO12 ocenia ryzyka, z których te plany wynikają.; Ryzyko – Ryzyko to pojęcie: prawdopodobieństwo i skutek. APO12 to proces, który ryzykiem zarządza.","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; COBIT 5 Framework (PL), s. 60; COBIT 5 Framework (PL), s. 93; COBIT 5 Framework (PL), s. 22, Ilustracja 7"},"proc-apo13":{"t":"APO13 Zarządzanie bezpieczeństwem","eg":"APO13 Zarządzanie bezpieczeństwem","pd":"APO13 Zarządzanie bezpieczeństwem","en":"APO13 Manage Security","wyj":"Ustalenie całego sposobu dbania o bezpieczeństwo informacji: zasad, planu i regularnego sprawdzania, czy działa.\n\nKierownictwo IT ustanawia system zarządzania bezpieczeństwem informacji (ISMS): zakres i politykę. Przygotowuje plan postępowania z ryzykiem bezpieczeństwa i wdraża go. Regularnie monitoruje i przegląda skuteczność systemu.\n\nŻeby bezpieczeństwo informacji było zorganizowane jako system z polityką, planem i przeglądami, a nie zbiorem przypadkowych zabezpieczeń.","zycie":"Rodzina ustala zasady: klucze mają tylko domownicy, alarm włączany na noc, raz w roku przegląd zamków. Spisuje, co jest najcenniejsze i jak to chronić. Sam zamek w drzwiach to narzędzie. Cały ten system to APO13.","firma":"Firma wdraża system zarządzania bezpieczeństwem informacji według ISO/IEC 27001. Ustala zakres, politykę i plan postępowania z ryzykiem. Co pół roku robi przegląd skuteczności. To APO13.","urzad":"Urząd wojewódzki powołuje pełnomocnika ds. bezpieczeństwa informacji. Pełnomocnik pisze politykę bezpieczeństwa, plan działań i harmonogram przeglądów. Ustawianie zapór i haseł to praca informatyków w procesie DSS05 Zarządzanie usługami bezpieczeństwa. Sam system zarządzania bezpieczeństwem to APO13.","it":"Pełnomocnik ds. bezpieczeństwa informacji utrzymuje ISMS zgodny z ISO/IEC 27001: politykę, plan postępowania z ryzykiem i przeglądy. To APO13. Zapory i konta obsługuje DSS05 Zarządzanie usługami bezpieczeństwa.","egz":"Słowa-klucze: ISMS, polityka bezpieczeństwa informacji, plan postępowania z ryzykiem bezpieczeństwa, przegląd ISMS → APO13. Antywirus, zapory, konta i uprawnienia, monitorowanie zdarzeń bezpieczeństwa → DSS05. Nazwa egzaminacyjna PL niepotwierdzona: na egzaminie nazwa może brzmieć inaczej niż w podręczniku. Egzamin używa własnych tłumaczeń, w domenach trybu rozkazującego (np. „Dostosuj, Planuj i Organizuj”). Rozpoznawaj proces po kodzie APO13 i słowie kluczowym EN Manage Security. Nie myl z DSS05 Zarządzanie usługami bezpieczeństwa. APO13 organizuje system zarządzania bezpieczeństwem informacji (ISMS), a DSS05 chroni systemy na co dzień. Nie myl z: DSS05 Zarządzanie usługami bezpieczeństwa – DSS05 to codzienne usługi bezpieczeństwa: ochrona przed złośliwym oprogramowaniem, sieć, tożsamość i dostęp, dostęp fizyczny. APO13 ustanawia i nadzoruje cały system zarządzania bezpieczeństwem.; APO12 Zarządzanie ryzykiem – APO12 obejmuje całe ryzyko IT. APO13 skupia się na bezpieczeństwie informacji.; ISO/IEC 27001 – ISO/IEC 27001 to norma o ISMS. APO13 to proces COBIT, który odpowiada za ISMS w organizacji.; Dostęp i Bezpieczeństwo – Dostęp i bezpieczeństwo to kategoria jakości informacji. APO13 to proces zarządzania bezpieczeństwem.","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; COBIT 5 Framework (PL), s. 51; COBIT 5 Framework (PL), s. 60; COBIT 5 Framework (PL), s. 88, Ilustracja 39"},"proc-apo02":{"t":"APO02 Zarządzanie strategią","eg":"APO02 Zarządzanie strategią","pd":"APO02 Zarządzanie strategią","en":"APO02 Manage Strategy","wyj":"Plan na kilka lat: dokąd ma dojść informatyka, żeby pomóc organizacji, i jak tam dojść krok po kroku.\n\nKierownictwo IT opisuje stan obecny i docelowy, a potem lukę między nimi. Z luki wyprowadza inicjatywy i układa je w mapę drogową. Strategię uzgadnia z celami organizacji i przekazuje inicjatywy do portfela.\n\nŻeby informatyka wiedziała, dokąd ma dojść w ciągu kilku lat, aby wspierać cele organizacji, i w jakiej kolejności to zrobić.","zycie":"Chcesz za trzy lata mieszkać we własnym mieszkaniu. Sprawdzasz, ile masz teraz, ile potrzeba i czego brakuje. Rozpisujesz kroki: oszczędzanie, kredyt, przeprowadzka. To strategia z mapą drogi.","firma":"Sklep internetowy chce wejść na rynek czeski. Dyrektor IT opisuje, czego brakuje: czeskiej wersji sklepu, lokalnych płatności, nowego magazynu danych. Układa plan na dwa lata. To APO02.","urzad":"Urząd marszałkowski przyjął cel: większość spraw online do 2030 roku. Informatycy spisują stan obecny, stan docelowy i kolejne etapy. Plan trafia do zatwierdzenia. Opracowanie strategii IT to APO02.","it":"Dział IT przygotowuje trzyletnią strategię z analizą luki i mapą drogową. Opis architektury bierze z APO03 Zarządzanie architekturą korporacyjną, a inicjatywy przekazuje do APO05 Zarządzanie Portfelem.","egz":"Słowa-klucze: strategia IT, stan obecny i docelowy, luka, mapa drogowa, zgodność planu IT z celami organizacji → APO02. Załącznik E: APO02 koncentruje się na ustalaniu celów. Nazwa egzaminacyjna PL niepotwierdzona: na egzaminie nazwa może brzmieć inaczej niż w podręczniku. Egzamin używa własnych tłumaczeń, w domenach trybu rozkazującego (np. „Dostosuj, Planuj i Organizuj”). Rozpoznawaj proces po kodzie APO02 i słowie kluczowym EN Strategy. Nie myl z APO03 (architektura) ani z procesami Ładu. APO02 to strategia IT w Zarządzaniu. Nie myl z: APO03 Zarządzanie architekturą korporacyjną – APO03 opisuje, jak zbudowana jest organizacja i jej systemy (architektura), i ustala zasady budowy. APO02 mówi, dokąd idziemy i w jakiej kolejności.; Kaskada Celów – Kaskada celów przekłada potrzeby na cele. APO02 to proces, który z tych celów robi strategię i mapę drogową IT.; APO05 Zarządzanie Portfelem – APO05 wybiera i równoważy inwestycje w portfelu. APO02 wskazuje kierunek, z którego te inwestycje wynikają.","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; COBIT 5 Framework (PL), s. 59"},"proc-apo03":{"t":"APO03 Zarządzanie architekturą korporacyjną","eg":"APO03 Zarządzanie architekturą korporacyjną","pd":"APO03 Zarządzanie architekturą korporacyjną","en":"APO03 Manage Enterprise Architecture","wyj":"Plan, jak systemy, dane i działania organizacji łączą się ze sobą i według jakich reguł je budujemy.\n\nKierownictwo IT opisuje architekturę obecną i docelową w warstwach: działania, informacje, aplikacje, technologia. Ustala zasady i standardy architektury. Każde nowe rozwiązanie sprawdza się z tym opisem.\n\nŻeby systemy, dane i działania organizacji pasowały do siebie, a nowe rozwiązania nie tworzyły chaosu.","zycie":"Przed remontem rysujesz plan mieszkania: gdzie biegną rury, prąd i internet. Ustalasz zasadę: wszystkie gniazdka w jednym standardzie. Dzięki temu nowa pralka pasuje bez kucia ścian. To architektura.","firma":"Hurtownia ma sklep, magazyn, płatności i księgowość. Architekt IT rysuje, kto z kim wymienia dane. Ustala zasadę: dane klienta tylko w jednym systemie. Nowy moduł musi pasować do tego planu. To APO03.","urzad":"Powiat ma osobne systemy ewidencji, podatków i kadr. Zespół architektury opisuje ich połączenia i wprowadza zasadę: jeden rejestr mieszkańców dla wszystkich. Każdy nowy zakup musi się w tym zmieścić. To APO03.","it":"Rada ds. Architektury zatwierdza docelową architekturę i zasady integracji systemów, np. jedno źródło danych o klientach. To APO03. Ewidencję elementów prowadzi BAI10 Zarządzanie konfiguracją.","egz":"Słowa-klucze: architektura biznesu, informacji, aplikacji i technologii; zasady architektury; Rada ds. Architektury; TOGAF → APO03. Kategoria umiejętności „Architektura korporacyjna” należy do domeny APO (il. 39). Nazwa egzaminacyjna PL niepotwierdzona: na egzaminie nazwa może brzmieć inaczej niż w podręczniku. Egzamin używa własnych tłumaczeń, w domenach trybu rozkazującego (np. „Dostosuj, Planuj i Organizuj”). Rozpoznawaj proces po kodzie APO03 i słowie kluczowym EN Enterprise Architecture. Sam termin bywa na egzaminie tłumaczony jako „Architektura Korporacyjna” albo „Architektura Przedsiębiorstwa”. Pełnej egzaminacyjnej nazwy procesu nie potwierdziliśmy. Nie myl z: APO02 Zarządzanie strategią – APO02 mówi, dokąd idziemy i w jakiej kolejności. APO03 opisuje budowę i zasady budowy.; BAI10 Zarządzanie konfiguracją – BAI10 prowadzi ewidencję konkretnych elementów konfiguracji (ten serwer, ta wersja). APO03 opisuje architekturę i zasady na wyższym poziomie.; Zasady (pryncypia) architektury – Zasady architektury to element aktywatora Zasady, polityki i struktury ramowe. APO03 to proces, który je tworzy i utrzymuje.","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; COBIT 5 Framework (PL), s. 61; COBIT 5 Framework (PL), s. 89; COBIT 5 Framework (PL), s. 88, Ilustracja 39"}},"S":[{"lekcje":["pr-k60-apo01-apo02","pr-k61-apo03-apo04"],"pt":"Lekcje 1.60–1.61","h":"APO01–APO04: organizacja IT, strategia, architektura, innowacje","b":"<ul><li><w k=\"proc-apo01\">APO01<\/w> – role, polityki i procesy zarządzania IT<\/li><li><w k=\"proc-apo02\">APO02<\/w> – strategia IT: stan dziś, cel, luka, kroki<\/li><li><w k=\"proc-apo03\">APO03<\/w> – architektura korporacyjna: jak całość jest poskładana<\/li><li><w k=\"proc-apo04\">APO04<\/w> – innowacje: pilotaż i rekomendacja<\/li><\/ul>","c":"APO01 porządkuje dział IT, APO02 wyznacza mu drogę, APO03 opisuje całość i jej zasady, APO04 sprawdza nowości.","s":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; s. 59, 61","ctx":"<p>Nazwy angielskie: <span class=\"en\">Manage the IT Management Framework<\/span>, <span class=\"en\">Strategy<\/span>, <span class=\"en\">Enterprise Architecture<\/span>, <span class=\"en\">Innovation<\/span>. W nazwie APO01 podręcznikowa „metodyka” to <span class=\"en\">Framework<\/span> (na egzaminie struktura ramowa) – cały system zarządzania IT, nie metodyka projektów (tę prowadzi BAI01). Nazwy egzaminacyjne niepotwierdzone.<\/p><p>Pary: APO01 ≠ EDM01 (zasady decydowania ustala zarząd); APO02 to strategia IT, nie całej organizacji – podręcznik mówi, że pomaga dopasować plan IT do celów biznesowych; APO03 to model i zasady, a spis serwerów z wersjami to BAI10; APO04 kończy się rekomendacją, a decyzja o finansowaniu to APO05. Do APO03 podręcznik odwzorował metodykę TOGAF.<\/p><p>Przykład: uczelnia ustala jeden numer studenta we wszystkich systemach (APO03), a w jednym wydziale przez semestr testuje aplikację z planem zajęć i przedstawia rekomendację (APO04).<\/p>"},{"pt":"Sprawdź się","quiz":{"id":"q-prc-60-3","sylabus":["PR-01-04"],"tresc":"Który proces COBIT 5 ustanawia role, polityki i procesy zarządzania IT (<em>Manage the IT Management Framework<\/em>)?","opcje":[{"t":"APO01 Zarządzanie metodyką zarządzania IT","ok":true,"w":"Dobrze. „Metodyka” w tej nazwie to <em>Framework<\/em>, czyli cały system zarządzania IT."},{"t":"EDM01 Zapewnienie i utrzymanie ładu korporacyjnego","w":"EDM01 też mówi o zasadach, ale to zasady decydowania w Ładzie, a nie organizacja pracy IT."},{"t":"APO01 Zarządzanie metodyką prowadzenia projektów","w":"Nie ma takiej nazwy. „Metodyka” w APO01 nie oznacza metodyki projektowej. Projekty prowadzi BAI01."},{"t":"APO02 Zarządzanie strategią","w":"APO02 wyznacza kierunek IT na kilka lat. Nie ustanawia ról i polityk."}],"src":"COBIT 5 Framework (PL), s. 33","pomoc":{"t":"Pytanie dotyczy lekcji 1.60 „APO01 i APO02: organizacja pracy IT i strategia IT”. Cel lekcji: Potrafię odróżnić APO01 (organizacja zarządzania IT) od APO02 (strategia IT) i od EDM01 (zasady decydowania w Ładzie).","k":["proc-apo01","proc-apo02"]}}},{"pt":"Sprawdź się","quiz":{"id":"q-prc-61-3","sylabus":["PR-01-04"],"tresc":"Kierownik IT urzędu rysuje, jak system podatkowy, ewidencja mieszkańców i skrzynka podawcza wymieniają dane. Ustala zasadę: każdy nowy system korzysta z jednej bazy adresów. Który proces?","opcje":[{"t":"BAI10 Zarządzanie konfiguracją","w":"BAI10 to spis konkretnych elementów i ich wersji. Model połączeń i zasady budowy to APO03."},{"t":"APO03 Zarządzanie architekturą korporacyjną","ok":true,"w":"Dobrze. Opis połączeń w całości i zasada dla każdego nowego systemu to architektura korporacyjna."},{"t":"APO02 Zarządzanie strategią","w":"Strategia wyznacza kierunek i kolejność kroków. Tu opisano budowę całości i zasadę budowy."},{"t":"EDM01 Zapewnienie i utrzymanie ładu korporacyjnego","w":"Słowo „zasada” kusi, ale EDM01 to zasady decydowania w Ładzie, a nie zasady budowy systemów."}],"src":"COBIT 5 Framework (PL), s. 33","pomoc":{"t":"Pytanie dotyczy lekcji 1.61 „APO03 i APO04: architektura korporacyjna i innowacje”. Cel lekcji: Potrafię odróżnić APO03 (jak całość jest poskładana) od APO02 (dokąd idziemy) i APO04 (sprawdzanie nowości) od APO05 (wybór inwestycji).","k":["proc-apo03","proc-apo04"]}}},{"lekcje":["pr-k62-apo05-apo07","pr-k63-apo08-apo10"],"pt":"Lekcje 1.62–1.63","h":"APO05–APO10: pieniądze, ludzie i druga strona umowy","b":"<ul><li><w k=\"proc-apo05\">APO05<\/w> – <w k=\"it-portfel\">portfel<\/w>: w co inwestujemy<\/li><li><w k=\"proc-apo06\">APO06<\/w> – budżet i koszty IT<\/li><li><w k=\"proc-apo07\">APO07<\/w> – ludzie IT: obsada, umiejętności<\/li><li><w k=\"proc-apo08\">APO08<\/w> – relacje z własną organizacją<\/li><li><w k=\"proc-apo09\">APO09<\/w> – umowy o usługi (SLA)<\/li><li><w k=\"proc-apo10\">APO10<\/w> – dostawcy zewnętrzni<\/li><\/ul>","c":"Przy APO05–APO07 pytaj, czego dotyczy decyzja; przy APO08–APO10 – kto jest drugą stroną.","s":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; s. 58–60","ctx":"<p>APO05 <span class=\"en\">Manage Portfolio<\/span> to jedyny tu proces z potwierdzoną nazwą egzaminacyjną: „Zarządzanie Portfelem” (podręcznik: „portfelem projektów”). Wybiera i równoważy inwestycje „z myślą o zapewnieniu realizacji korzyści i optymalizacji kosztów”. APO05 ≠ BAI01 (prowadzenie wybranego projektu) ≠ EDM02 (Ład ocenia, czy inwestycje dały wartość). APO06 liczy koszty, ale nie wybiera inwestycji; APO07 <span class=\"en\">Human Resources<\/span> ≠ BAI09 (sprzęt i licencje).<\/p><p>APO08 <span class=\"en\">Relationships<\/span> i APO09 <span class=\"en\">Service Agreements<\/span> dotyczą własnej organizacji: rozmowa i zaufanie albo spisana obietnica usług SLA (<span class=\"en\">Service Level Agreement<\/span>, umowa o poziomie usług) i jej pomiar. APO10 <span class=\"en\">Suppliers<\/span>: wybór, kontrakt, ocena i ryzyko dostawcy. Naprawa awarii to nie APO09, tylko DSS02.<\/p><p>Przykład: sklep internetowy obiecuje sprzedaży, że platforma działa 99,9% czasu (APO09); kontrakt z firmą, która ją utrzymuje, i jego rozliczanie to APO10.<\/p>"},{"pt":"Sprawdź się","quiz":{"id":"q-prc-62-3","sylabus":["PR-01-04"],"tresc":"Jak na egzaminie PL brzmi nazwa procesu APO05 (<em>Manage Portfolio<\/em>)?","opcje":[{"t":"Zapewnienie realizacji korzyści","w":"To nazwa EDM02, procesu Ładu. APO05 należy do Zarządzania."},{"t":"Zarządzanie programami i projektami","w":"To nazwa BAI01, który prowadzi wybrane projekty. Portfel je wybiera."},{"t":"Zarządzanie Portfelem","ok":true,"w":"Dobrze. Egzamin używa krótkiej formy „Zarządzanie Portfelem”."},{"t":"Zarządzanie portfelem projektów","w":"To forma z podręcznika (il. 16). Opisuje ten sam proces, ale na egzaminie pada krótsza nazwa."}],"src":"COBIT 5 Framework (PL), s. 33","pomoc":{"t":"Pytanie dotyczy lekcji 1.62 „APO05–APO07: portfel, budżet i ludzie IT”. Cel lekcji: Potrafię odróżnić wybór inwestycji (APO05) od liczenia kosztów (APO06) i pracy z ludźmi IT (APO07) oraz od prowadzenia projektu (BAI01).","k":["proc-apo05","proc-apo06","proc-apo07"]}}},{"pt":"Sprawdź się","quiz":{"id":"q-prc-63-3","sylabus":["PR-01-04"],"tresc":"Dla którego procesu podręcznik COBIT 5 podaje przykładowy cel: „istnieją dobre relacje między przedsiębiorstwem i działem IT”?","opcje":[{"t":"APO10 Zarządzanie dostawcami","w":"APO10 dotyczy relacji z dostawcami zewnętrznymi, a nie z własną organizacją."},{"t":"APO09 Zarządzanie umowami o świadczenie usług","w":"APO09 spisuje poziom usług. Dobre relacje jako cel to APO08."},{"t":"EDM05 Zapewnienie Transparentności Interesariuszy","w":"EDM05 to Ład i raportowanie interesariuszom. Cel o relacjach IT z przedsiębiorstwem dotyczy APO08."},{"t":"APO08 Zarządzanie relacjami","ok":true,"w":"Dobrze. Podręcznik podaje ten cel w przykładzie dla procesu Zarządzanie relacjami (APO08)."}],"src":"COBIT 5 Framework (PL), s. 30","pomoc":{"t":"Pytanie dotyczy lekcji 1.63 „APO08–APO10: relacje, umowy o usługi i dostawcy”. Cel lekcji: Potrafię rozpoznać APO08, APO09 i APO10 po tym, kto jest drugą stroną: własna organizacja czy firma zewnętrzna.","k":["proc-apo08","proc-apo09","proc-apo10"]}}},{"lekcje":["pr-k64-apo11-apo13"],"pt":"Lekcja 1.64","h":"APO11–APO13: jakość, ryzyko i bezpieczeństwo planuje się w APO","b":"<ul><li><w k=\"proc-apo11\">APO11<\/w> – standard jakości i doskonalenie ≠ MEA01<\/li><li><w k=\"proc-apo12\">APO12<\/w> – rejestr ryzyk i reakcje ≠ EDM03<\/li><li><w k=\"proc-apo13\">APO13<\/w> – system i plan bezpieczeństwa ≠ DSS05<\/li><\/ul>","c":"APO planuje i organizuje, DSS wykonuje na co dzień, MEA mierzy i ocenia, a EDM wyznacza granice.","s":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; s. 51–53, Ilustracja 23","ctx":"<p>Nazwy angielskie: <span class=\"en\">Manage Quality<\/span>, <span class=\"en\">Risk<\/span>, <span class=\"en\">Security<\/span> (egzaminacyjne niepotwierdzone). Zbieranie mierników ze wszystkich procesów i raport dla zarządu to nie APO11, lecz MEA01. Ryzyko jest w dwóch domenach: granicę akceptowanego ryzyka ustala Ład (EDM03), a APO12 pracuje w tej granicy.<\/p><p>Załącznik C (Ilustracja 23) mapuje 17 celów związanych z Informatyką na 37 procesów: P – relacja podstawowa, S – wspierająca. Przykład 8 z podręcznika: APO13 przede wszystkim wspiera m.in. cel 10 „Bezpieczeństwo informacji, infrastruktury przetwarzania i aplikacji” i cel 04 – zarządzanie ryzykiem biznesowym związanym z IT.<\/p><p>Przykład: szpital przyjmuje politykę i plan bezpieczeństwa na trzy lata (APO13); administrator co rano przegląda alerty zapory i blokuje podejrzane konto (DSS05); audytor sprawdza, czy zabezpieczenia działają (MEA).<\/p>"},{"pt":"Sprawdź się","quiz":{"id":"q-prc-64-3","sylabus":["PR-01-04"],"tresc":"Zarząd banku określa, ile ryzyka IT bank może zaakceptować. Kierownictwo prowadzi rejestr ryzyk i planuje reakcje w tych granicach. Które procesy opisano, w kolejności?","opcje":[{"t":"EDM03, a potem APO12","ok":true,"w":"Dobrze. Granicę ryzyka ustala Ład (EDM03), a rejestr ryzyk i reakcje prowadzi Zarządzanie (APO12)."},{"t":"APO12, a potem EDM03","w":"Kolejność jest odwrócona. Najpierw Ład ustala granice, potem Zarządzanie działa w ich ramach."},{"t":"APO12, a potem MEA02","w":"Zarząd nie pracuje w APO12. Ocena kontroli w MEA02 też nie wyznacza granicy ryzyka."},{"t":"EDM03, a potem APO13","w":"Pierwszy krok jest dobry, ale rejestr ryzyk to APO12, a nie APO13."}],"src":"COBIT 5 Framework (PL), s. 31; COBIT 5 Framework (PL), s. 33","pomoc":{"t":"Pytanie dotyczy lekcji 1.64 „APO11–APO13: jakość, ryzyko i bezpieczeństwo w planowaniu”. Cel lekcji: Potrafię rozpoznać APO11, APO12 i APO13 i odróżnić APO12 od EDM03 oraz APO13 od codziennej ochrony w DSS05.","k":["proc-apo11","proc-apo12","proc-apo13"]}}}]};</script>
