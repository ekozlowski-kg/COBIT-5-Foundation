<script>window.DECK={"id":"k-pr-zasada-2","rozdzial":"Rozdział 3 · Zasada 2: Pokrycie całej organizacji · s. 23–24","tytul":"Zasada 2: Ład nad IT, podejście do Ładu, role","prev":"k-pr-kaskada-uzycie.html","next":"k-pr-zasada-3.html","T":{"zakres-ladu":{"t":"Zakres Ładu","eg":"Zakres Ładu","pd":"Zakres nadzoru","en":"Governance scope","wyj":"Czego dotyczą decyzje szefostwa: całej firmy czy tylko jednej części, np. jednego systemu.\n\nZakres Ładu (governance scope) to jeden z czterech komponentów Podejścia do Ładu (governance approach), obok Celu Ładu, aktywatorów Ładu oraz ról, działań i relacji. Ład można stosować wobec całej organizacji, jednostki albo aktywów materialnych i niematerialnych. Zakres trzeba jasno zdefiniować; COBIT 5 domyślnie patrzy na całą organizację.\n\nŻeby było jasne, czego dotyczy system Ładu: całej organizacji, jednej jednostki czy konkretnych aktywów.","zycie":"Ustalacie w domu zasady korzystania z ekranów. Możecie je wprowadzić dla całej rodziny albo tylko dla tabletu młodszego dziecka. To, czego dotyczą Wasze reguły, to zakres Ładu.","firma":"Właściciel trzech piekarni postanawia uporządkować nadzór nad IT. Zaczyna tylko od systemu zamówień dla sklepów, a kasy i księgowość zostawia na później. Ten wybór – nad czym trzymamy kontrolę – to zakres Ładu.","urzad":"Starosta chce uporządkować nadzór nad informatyką. Może objąć nim całe starostwo albo tylko wydział komunikacji z systemem rejestracji pojazdów. Decyzja, gdzie przebiega ta granica, to zakres Ładu.","it":"Zarząd grupy kapitałowej decyduje, że Ład IT obejmie na razie tylko spółkę-matkę i jej system ERP. EDM01 (Zapewnienie i utrzymanie ładu korporacyjnego) ustala i utrzymuje taki system Ładu, w tym to, czego on dotyczy.","egz":"Zakres Ładu jest jednym z czterech kluczowych komponentów Podejścia do Ładu (Ilustracja 8). Egzamin: „Zakres Ładu”. Podręcznik: „Zakres nadzoru”. Nie myl z: Zasada 2: Pokrycie całej organizacji – Zasada 2 mówi, że COBIT obejmuje całą organizację. Zakres Ładu to komponent, który trzeba zdefiniować w konkretnym systemie.","src":"COBIT 5 Framework (PL), s. 24"},"zasada-2":{"t":"Zasada 2: Pokrycie całej organizacji","eg":"Zasada 2: Pokrycie całej organizacji","pd":"Zasada 2: Uwzględnienie wszystkich aspektów działania przedsiębiorstwa","en":"Principle 2: Covering the Enterprise End-to-End","wyj":"Informatyka to sprawa całej firmy czy urzędu, a nie tylko działu informatyków.\n\nŁad nad IT w organizacji (governance of enterprise IT) jest częścią ładu korporacyjnego (enterprise governance). COBIT 5 obejmuje wszystkie funkcje i procesy, w których przetwarza się informacje, także zewnętrzne usługi i procesy. Zasada wprowadza Podejście do Ładu (governance approach) z czterema komponentami: Cel Ładu, aktywatory Ładu, zakres Ładu oraz role, działania i relacje.\n\nŻeby informację i technologię traktować jako sprawę całej organizacji, a Ład nad IT jako część ładu korporacyjnego, a nie wyłącznie zadanie działu IT.","zycie":"W domu z rodzinnego Wi-Fi i wspólnego konta z filmami korzystają dzieci, dziadek i partner. Hasło ustawione przez „domowego informatyka” na nic się zda, jeśli dziecko poda je kolegom. Zasady dotyczą całego domu, nie jednej osoby – to Zasada 2.","firma":"W sklepie internetowym dane klientów widzi sprzedawca przy pakowaniu, księgowa przy fakturach i kurier na etykiecie. Informatyk ustawi najlepsze zabezpieczenia, ale jeśli sprzedawca wyśle listę klientów prywatnym mailem, i tak jest wyciek. Dlatego zasady obejmują wszystkich, także firmę kurierską – to Zasada 2.","urzad":"W urzędzie gminy dane w ewidencji ludności wpisują urzędnicy wydziału spraw obywatelskich, a informatyk tylko utrzymuje system. Gdy ktoś wpisze zły adres, to problem całego urzędu, nie informatyka. Ład nad informacją obejmuje każdy wydział – to Zasada 2.","it":"APO10 (Zarządzanie dostawcami) obejmuje usługi świadczone z zewnątrz, a DSS06 (Zarządzanie mechanizmami kontrolnymi procesów biznesowych) kontrolę informacji w procesach biznesowych, np. w fakturowaniu. Zasięg COBIT 5 wychodzi więc poza dział IT.","egz":"Według uzasadnień egzaminacyjnych „ujednolicenie z najnowszymi poglądami na temat Ładu” to kluczowy aspekt zasady „Pokrycie całej organizacji” (s. 23). Egzamin (uzasadnienie SP1): „Pokrycie całej organizacji”. Podręcznik: „Uwzględnienie wszystkich aspektów działania przedsiębiorstwa”. Nie myl z: Zasada 3: Zastosowanie Pojedynczej Zintegrowanej Struktury Ramowej – Zasada 3 dotyczy integracji z INNYMI standardami. Zasada 2 dotyczy objęcia CAŁEJ organizacji.","src":"COBIT 5 Framework (PL), s. 23"},"aktywatory-ladu":{"t":"Aktywatory Ładu","eg":"Aktywatory Ładu","pd":"Czynniki umożliwiające nadzór","en":"Governance enablers","wyj":"Wszystko, czym szefostwo się posługuje, żeby rządzić: zasady, zespoły, procedury, ludzie, informacje, sprzęt.\n\nOrgan Ładu korzysta z zasobów organizacyjnych: metodyk, zasad, struktur, procesów i praktyk. Dochodzą do tego zasoby organizacji: infrastruktura i aplikacje, ludzie, informacje. COBIT 5 opisuje je jednolicie jako 7 kategorii aktywatorów. Gdy któregoś brakuje, spada zdolność tworzenia wartości.\n\nŻeby Ład miał czym działać. Sam cel bez polityk, struktur, procesów i ludzi niczego nie zmienia.","zycie":"Rodzice chcą pilnować domowego budżetu. Używają do tego zasady „duże zakupy razem”, wspólnego konta, arkusza wydatków i comiesięcznej rozmowy. Bez tych narzędzi cel „żyć bez długów” zostałby pobożnym życzeniem. To aktywatory Ładu w domu.","firma":"Rada spółki prowadzącej sklepy chce nadzorować informatykę. Posługuje się regulaminem zakupów IT, komitetem inwestycyjnym, kwartalnym raportem i ludźmi, którzy umieją go czytać. To aktywatory Ładu: środki, którymi rada sprawuje nadzór.","urzad":"Wójt chce trzymać rękę na pulsie cyfryzacji gminy. Ma do tego zarządzenie o zakupach IT, zespół do spraw cyfryzacji, procedurę zgłaszania incydentów i raport z systemu obiegu dokumentów. Każdy z tych elementów to aktywator Ładu, czyli środek, którym wójt sprawuje nadzór.","it":"Proces EDM01 (Zapewnienie i utrzymanie ładu korporacyjnego) dba o to, żeby struktury decyzyjne, zasady i inne aktywatory Ładu istniały i działały (interpretacja kursu).","egz":"„Zasoby organizacyjne związane z Ładem, np. struktury ramowe, zasady, struktury, procesy, praktyki” → Aktywatory Ładu (Ilustracja 8). Nie myl z zakresem Ładu ani z rolami, działaniami i relacjami. Forma kursu (analogia, niepotwierdzona na egzaminie): „Aktywatory Ładu”. Podręcznik (s. 24): „Czynniki umożliwiające nadzór”. To ta sama rzecz. Nie myl z: Aktywator – To ta sama koncepcja: 7 kategorii aktywatorów. „Aktywatory Ładu” to nazwa komponentu z Ilustracji 8, czyli spojrzenie na aktywatory jako narzędzia Ładu.; Zasób – Nie każdy aktywator jest zasobem. Zasobami są trzy kategorie: informacje; usługi, infrastruktura i aplikacje; ludzie, umiejętności i kompetencje (s. 27).; Zakres Ładu – Zakres mówi, CZEGO dotyczy Ład. Aktywatory mówią, CZYM się go sprawuje.","src":"COBIT 5 Framework (PL), s. 23, 24, 27"},"it-usluga-it":{"t":"Usługa IT","eg":"Usługa IT","pd":"Usługi IT","en":"IT service","wyj":"To, co informatyka daje ludziom do pracy, np. „poczta działa”, „płatność przechodzi”.\n\nInformatycy łączą sprzęt, sieć, serwery i aplikacje. Ustalają, kiedy usługa ma działać i kto pomaga przy kłopotach. Użytkownik po prostu korzysta, a gdy coś nie działa, zgłasza to.\n\nŻeby ludzie mogli robić swoją pracę, nie znając się na komputerach.","zycie":"Bankowość internetowa to usługa: możesz zapłacić rachunek o północy. Nie musisz wiedzieć, gdzie stoją serwery banku.","firma":"Uczelnia daje studentom usługę „poczta i oceny w Internecie”. Za nią stoją serwery, aplikacje i dział informatyki.","urzad":"Zakład Ubezpieczeń Społecznych (ZUS) daje klientom usługę: przez Platformę Usług Elektronicznych można sprawdzić swoje składki i wysłać wniosek, także wieczorem. Za tą usługą stoją serwery, aplikacje, sieć i infolinia pomocy technicznej. Klienta nie interesuje, który serwer go obsługuje – ważne, że wniosek da się wysłać.","it":"FW-PL definiuje usługi IT jako codzienne zapewnianie infrastruktury, aplikacji i wsparcia (s. 92); są częścią aktywatora Usługi, infrastruktura i aplikacje.","egz":"Usługi IT to część aktywatora Usługi, infrastruktura i aplikacje (FW-PL s. 27, 85). Na egzaminie pamiętaj: usługa to efekt dla użytkownika, a infrastruktura i aplikacje to jej składniki. Nie myl z: Aplikacja – Aplikacja to narzędzie. Usługa to efekt dla użytkownika z aplikacji, sprzętu i wsparcia razem.; Usługi, Infrastruktura i Aplikacje – Aktywator COBIT 5 obejmuje usługi oraz infrastrukturę i aplikacje, które je tworzą. To hasło opisuje samą usługę.","src":"COBIT 5 Framework (PL), s. 27, 92"},"role-dzialania-relacje":{"t":"Role, działania i relacje","eg":"Role, działania i relacje","pd":"Role, działania i relacje","en":"Roles, activities and relationships","wyj":"Kto komu zleca, kto kogo kieruje, kto przed kim się rozlicza, od właścicieli po wykonawców.\n\nInteresariusze (owners and stakeholders) delegują (delegate) władzę organowi Ładu (governing body), który jest przed nimi rozliczany (accountable). Organ Ładu wyznacza kierunek (set direction) kierownictwu (management), a kierownictwo instruuje i dopasowuje (instruct and align) role operacyjne (operations and execution), które raportują (report) do kierownictwa. Strzałka monitorowania (monitor) na Ilustracji 9 łączy kierownictwo z organem Ładu; według uzasadnień egzaminacyjnych to kierownictwo odpowiada wykonawczo za monitorowanie.\n\nŻeby było jasne, kto w systemie Ładu deleguje władzę, kto wyznacza kierunek, kto go realizuje, kto raportuje i przed kim każdy się rozlicza.","zycie":"Mieszkańcy na zebraniu wspólnoty powierzają decyzje zarządowi wspólnoty i co roku rozliczają go z budżetu. Zarząd ustala, że w tym roku remontuje się dach, a administrator budynku dostaje to zadanie i rozdziela pracę firmom. Firmy raportują administratorowi, a zarząd sprawdza administratora. Mieszkańcy delegują, zarząd wyznacza kierunek, administrator instruuje, wykonawcy raportują.","firma":"Właściciele spółki prowadzącej trzy piekarnie wybierają radę nadzorczą i co roku ją rozliczają. Rada wyznacza kierunek: „otwieramy czwarty punkt, ale bez kredytu”. Zarząd rozdziela zadania kierownikom sklepów i jest przez radę pilnowany, a kierownicy co tydzień raportują sprzedaż.","urzad":"Mieszkańcy w wyborach powierzają władzę radzie gminy i wójtowi, a potem rozliczają ich przy urnie. Rada i wójt wyznaczają kierunek: w tym roku e-usługi. Sekretarz i kierownicy wydziałów rozdzielają zadania urzędnikom i są z tego sprawdzani, a urzędnicy raportują, ile spraw załatwili.","it":"Rada nadzorcza jako organ Ładu w procesie EDM01 (Zapewnienie i utrzymanie ładu korporacyjnego) wyznacza kierunek dla IT i monitoruje jego realizację. CIO i kierownicy IT (kierownictwo) instruują zespoły IT, a zespoły raportują im wyniki pracy w procesach DSS; akcjonariusze delegują władzę radzie i rozliczają ją.","egz":"Według uzasadnień egzaminacyjnych: organ Ładu – odpowiedzialność decyzyjna (rozliczany); kierownictwo – odpowiedzialne wykonawczo za monitorowanie; role operacyjne – raportowanie; interesariusze – delegowanie. Nazwy ról: egzamin „Organ Ładu i nadzoru” / „Kierownictwo” / „Role operacyjne”; podręcznik „Organ nadzorujący” / „Zarządzanie” / „Eksploatacja i wykonanie”. Nie myl z: RACI – RACI przypisuje role do konkretnych działań w procesie. Ilustracja 9 pokazuje ogólne relacje w systemie Ładu.","src":"COBIT 5 Framework (PL), s. 24"},"system-ladu":{"t":"Podejście do Ładu","eg":"Podejście do Ładu","pd":"Podejście do nadzoru","en":"Governance approach / Key components of a governance system","wyj":"Ustalenie, po co decydujemy, czym, w jakim zakresie i kto komu co zleca.\n\nPodejście do Ładu (governance approach) z zasady 2 ma cztery kluczowe komponenty (Ilustracja 8). Cel Ładu to tworzenie wartości (value creation), aktywatory Ładu (governance enablers) to zasoby, którymi się działa, np. struktury ramowe, zasady, procesy i struktury organizacyjne, a zakres Ładu (governance scope) mówi, czego Ład dotyczy: całej organizacji, jednostki albo aktywa. Czwarty komponent to role, działania i relacje (roles, activities and relationships), czyli kto sprawuje Ład i jak współpracuje (Ilustracja 9).\n\nŻeby Ład nad IT zbudować świadomie i w całości: wiedzieć, po co jest, czym się posługuje, czego dotyczy i kto w nim co robi.","zycie":"Rodzice siadają, żeby ogarnąć domowe finanse. Cel: żyć wygodnie, bez długów i bez przesadnego ryzyka; narzędzia: wspólne konto, arkusz wydatków, zasada „większe zakupy razem”; zakres: tylko pieniądze, nie wychowanie dzieci. Role: mama decyduje o oszczędnościach, tata płaci rachunki, a raz w miesiącu oboje sprawdzają wydatki – to cztery elementy podejścia do Ładu.","firma":"Właściciel trzech piekarni porządkuje, jak rządzić informatyką. Cel: kasy i sklep internetowy mają przynosić zysk bez zbędnego ryzyka i kosztów; aktywatory: regulamin, umowa z informatykiem, system kasowy; zakres: wszystkie trzy sklepy. Role: właściciel decyduje, kierowniczka wydaje polecenia, informatyk wykonuje i raportuje.","urzad":"Gmina opisuje, jak sprawuje Ład nad informatyką. Cel: dobre usługi dla mieszkańców przy rozsądnym koszcie i ryzyku; aktywatory: regulamin organizacyjny, procedury, systemy, ludzie; zakres: urząd i podległe szkoły. Role: rada i wójt wyznaczają kierunek, sekretarz i kierownicy instruują, urzędnicy wykonują i raportują.","it":"Rada nadzorcza w procesie EDM01 (Zapewnienie i utrzymanie ładu korporacyjnego) ustala wszystkie cztery komponenty: cel (wartość z IT), aktywatory (np. polityki, komitet ds. strategii IT, procesy), zakres (cała grupa kapitałowa) oraz role i relacje między radą, zarządem, CIO i zespołami IT.","egz":"Komponenty: Cel Ładu, aktywatory Ładu, zakres Ładu, role/działania/relacje (Ilustracja 8). Proces EDM05, praktyki EDM i domeny PBRM to inne kategorie. Egzamin: „Podejście do Ładu”. Podręcznik: „Podejście do nadzoru”. Komponenty: Cel Ładu, aktywatory Ładu, zakres Ładu, role/działania/relacje. Nie myl z: Proces EDM05 Zapewnienie przejrzystości dotyczącej interesariuszy – To jeden z PROCESÓW Ładu, a nie komponent Podejścia do Ładu.; Oszacuj, Kieruj i Monitoruj (EDM) – Oszacuj, Kieruj, Monitoruj to praktyki procesów Ładu, a nie komponent Podejścia do Ładu.","src":"COBIT 5 Framework (PL), s. 23, 24"},"rola-operacyjne":{"t":"Role operacyjne","eg":"Role operacyjne","pd":"Eksploatacja i wykonanie","en":"Operations and execution","wyj":"Ludzie, którzy na co dzień wykonują pracę i mówią przełożonym, jak im poszło.\n\nRole operacyjne dostają instrukcje od kierownictwa. Wykonują pracę, np. obsługę zgłoszeń czy kopii zapasowych. Wyniki i problemy raportują do kierownictwa, które przekazuje wnioski wyżej.\n\nŻeby praca naprawdę została wykonana, a kierownictwo wiedziało, jak poszło.","zycie":"Firma remontowa dostaje od administratora budynku zlecenie: dach do końca lipca. Dekarze kładą blachę i co piątek wysyłają administratorowi zdjęcia postępów. Nie dzwonią do zarządu wspólnoty. To role operacyjne: wykonują i raportują.","firma":"Kierowniczka sklepu dostaje plan sprzedaży od dyrektora. Ekspedientki obsługują klientów, a w niedzielę wysyłają kierowniczce raport z kasy. To role operacyjne z Ilustracji 9.","urzad":"Urzędniczka wydziału komunikacji w starostwie rejestruje pojazdy według instrukcji naczelnika. Co miesiąc przekazuje naczelnikowi zestawienie spraw i problemów, np. 12 wniosków z brakami. Nie raportuje radzie powiatu. To rola operacyjna.","it":"Praktyki procesu DSS02 (Zarządzanie zgłoszeniami serwisowymi i incydentami) wykonują zwykle role operacyjne, np. pracownicy pomocy technicznej. Raportują kierownikowi usług IT.","egz":"„Kto raportuje?” → role operacyjne (do kierownictwa). Forma podręcznikowa „Eksploatacja i wykonanie” to ta sama rola. Na Ilustracji 9 role operacyjne nie raportują wprost organowi Ładu. Egzamin: „Role operacyjne”. Podręcznik: „Eksploatacja i wykonanie”. Słowo „eksploatacja” pada też w fazie 4 cyklu życia aktywatora (Użytkowanie/eksploatacja), ale to inna rzecz. Nie myl z: Kierownictwo – Kierownictwo instruuje i monitoruje. Role operacyjne wykonują i raportują do kierownictwa.; Użytkowanie/eksploatacja – Faza 4 cyklu życia aktywatora (Użytkowanie/eksploatacja) to etap życia aktywatora, a nie rola ludzi. Wspólne jest tylko słowo „eksploatacja”.; Dostarczaj, Obsługuj i Wspieraj (DSS) – DSS to domena procesów Zarządzania. Role operacyjne to ogniwo w łańcuchu ról z Ilustracji 9.","src":"COBIT 5 Framework (PL), s. 24"},"proc-apo10":{"t":"APO10 Zarządzanie dostawcami","eg":"APO10 Zarządzanie dostawcami","pd":"APO10 Zarządzanie dostawcami","en":"APO10 Manage Suppliers","wyj":"Wybieranie firm, które coś dla nas robią, pilnowanie umów z nimi i sprawdzanie, czy się wywiązują.\n\nKierownictwo IT określa wymagania i wybiera dostawców. Zawiera z nimi umowy i prowadzi relację. Regularnie ocenia wykonanie umowy i ryzyko związane z dostawcą, a w razie potrzeby zmienia warunki albo dostawcę.\n\nŻeby firmy zewnętrzne, od których zależy IT, były dobrze wybrane, związane właściwą umową i rzetelnie oceniane.","zycie":"Wybierasz firmę do wywozu śmieci. Porównujesz oferty, podpisujesz umowę, a potem sprawdzasz, czy przyjeżdża w terminie. Gdy zawodzi, rozmawiasz albo zmieniasz firmę. To APO10.","firma":"Sklep internetowy co kwartał ocenia firmę hostingową: dostępność, czas reakcji, cenę. Sprawdza też, co się stanie, jeśli firma upadnie. Przy odnowieniu umowy negocjuje lepsze warunki. To APO10.","urzad":"Ministerstwo przed przetargiem na serwis drukarek opisuje wymagania. Po wyborze wykonawcy co miesiąc sprawdza protokoły napraw. Za spóźnienia nalicza kary z umowy. To APO10.","it":"Kierownik ds. dostawców prowadzi rejestr kontraktów, kwartalną ocenę dostawców i ocenę ryzyka uzależnienia od jednego dostawcy chmury. To APO10. Ryzyko trafia też do APO12 Zarządzanie ryzykiem.","egz":"Słowa-klucze: wybór dostawcy, umowa z dostawcą, ocena wykonania, ryzyko dostawcy, outsourcing → APO10. Usługi i SLA dla własnych użytkowników → APO09. Nazwa egzaminacyjna PL niepotwierdzona: na egzaminie nazwa może brzmieć inaczej niż w podręczniku. Egzamin używa własnych tłumaczeń, w domenach trybu rozkazującego (np. „Dostosuj, Planuj i Organizuj”). Rozpoznawaj proces po kodzie APO10 i słowie kluczowym EN Suppliers. Nie myl z APO09: tamten ma „umowy” w polskiej nazwie, ale to uzgodnienia usług z organizacją. Umowy z dostawcami są w APO10. Nie myl z: APO09 Zarządzanie umowami o świadczenie usług – APO09 uzgadnia usługi i ich poziomy z organizacją (SLA). APO10 zarządza dostawcami i umowami z nimi.; APO08 Zarządzanie relacjami – APO08 to relacja IT z organizacją. APO10 to relacja z dostawcami zewnętrznymi.; BAI03 Zarządzanie identyfikacją i budowaniem rozwiązań – BAI03 identyfikuje i buduje albo pozyskuje rozwiązanie. APO10 zarządza samym dostawcą i umową.","src":"COBIT 5 Framework (PL), s. 22, 33, 58"},"organ-ladu":{"t":"Organ Ładu i nadzoru","eg":"Organ Ładu i nadzoru","pd":"Organ nadzorujący","en":"Governing body","wyj":"Szef albo grupa na samej górze, np. zarząd, rada nadzorcza czy dyrektor urzędu, którzy decydują o kierunku.\n\nNa Ilustracji 9 właściciele i interesariusze delegują (delegate) uprawnienia organowi Ładu (governing body), a ten jest przed nimi rozliczany (accountable). Organ Ładu wyznacza kierunek (set direction) kierownictwu (management). Kierownictwo instruuje i dopasowuje (instruct and align) role operacyjne, które raportują (report) do kierownictwa (FW-PL s. 24, Il. 9). Strzałka monitorowania (monitor) łączy kierownictwo z organem Ładu; według uzasadnień egzaminacyjnych to kierownictwo odpowiada wykonawczo za monitorowanie. Sam organ Ładu też monitoruje, ale wyniki względem kierunku, który wyznaczył (EDM).\n\nŻeby było jasne, kto w imieniu właścicieli i interesariuszy sprawuje Ład: wyznacza kierunek kierownictwu i odpowiada za wyniki.","zycie":"Właściciele mieszkań na zebraniu wspólnoty wybierają zarząd i powierzają mu dbanie o budynek. Zarząd wyznacza kierunek – w tym roku dach – i każe administratorowi to załatwić, a administrator raportuje postępy. Na następnym zebraniu zarząd rozlicza się przed właścicielami: to on jest organem Ładu.","firma":"Właściciele rodzinnej sieci piekarni powołują radę, która raz na kwartał ustala, dokąd firma zmierza: otwieramy dwa nowe punkty, nie wchodzimy w catering. Dyrektor zarządzający dostaje ten kierunek i sam układa plan, a rada sprawdza wyniki i odpowiada przed właścicielami. Ta rada to organ Ładu.","urzad":"Mieszkańcy w wyborach powierzają radzie gminy pilnowanie spraw gminy. Rada uchwala strategię i budżet, wyznacza kierunek wójtowi i urzędowi, a potem rozlicza ich z wykonania; sama odpowiada przed mieszkańcami przy kolejnych wyborach. W tej scenie rada gminy pełni rolę organu Ładu.","it":"Zarząd jako organ Ładu w EDM01 (Zapewnienie i utrzymanie ładu korporacyjnego) ustala zasady podejmowania decyzji o IT, a w EDM05 (Zapewnienie przejrzystości dotyczącej interesariuszy) raportuje udziałowcom i regulatorom, jak IT realizuje cele. Plany i kierowanie pracą zespołów zostawia kierownictwu IT (APO, BAI, DSS, MEA).","egz":"Według uzasadnień egzaminacyjnych organ Ładu i nadzoru jest odpowiedzialny decyzyjnie (rozliczany) i wyznacza kierunek. Za monitorowanie osiągania celów odpowiada wykonawczo kierownictwo. Egzamin: „Organ Ładu i nadzoru”. Podręcznik: „Organ nadzorujący”. Nie myl z: Kierownictwo (management) – Kierownictwo realizuje kierunek, instruuje i dopasowuje role operacyjne i odpowiada wykonawczo za monitorowanie osiągania celów; organ Ładu wyznacza kierunek i jest rozliczany przed interesariuszami.","src":"COBIT 5 Framework (PL), s. 24"},"informacja":{"t":"Informacja","eg":"Informacja","pd":"Informacje","en":"Information (enabler 5)","wyj":"Wszystko, co wiemy i zapisujemy, od numeru telefonu po raport, i co komuś do czegoś służy.\n\nInformacja (Information) to piąty z 7 aktywatorów i obejmuje wszystkie informacje w organizacji, nie tylko te w systemach. Ma interesariuszy w rolach wytwórcy (producer), opiekuna (custodian) i konsumenta (consumer), własny cykl życia i kryteria jakości: wewnętrznej, kontekstowej oraz bezpieczeństwa i dostępności. Opisuje się ją też w 6 warstwach atrybutów, od fizycznej po społeczną.\n\nŻeby organizacja traktowała informację jak zasób, o który trzeba dbać: wytwarzać ją, przechowywać, chronić i udostępniać tym, którzy jej potrzebują.","zycie":"Mama dzwoni, że w czwartek nie odbierze dzieci ze szkoły, na lodówce wisi plan lekcji, a szkoła przysyła SMS o skróconych zajęciach. Żadna z tych wiadomości nie siedzi w komputerze, a mimo to wszystkie są informacją, od której zależy, kto i o której jedzie po dzieci. Jeśli nikt jej nie przeczyta i nie zareaguje, nic z niej nie wynika – to cecha aktywatora Informacja.","firma":"Piekarz zapisuje w zeszycie, ile chleba zostało wieczorem, kasa drukuje raport sprzedaży, a sprzedawczyni mówi, o co pytali klienci. Z tego wszystkiego właścicielka planuje jutrzejszy wypiek. Piekarz informację tworzy, zeszyt i kasa ją przechowują, a właścicielka z niej korzysta – to role wokół aktywatora Informacja.","urzad":"W szkole sekretarka prowadzi rejestr uczniów, wychowawca wpisuje oceny do dziennika, a dyrektor na radzie pedagogicznej słyszy ustnie o kłopotach w klasie 3b. Wszystko to jest informacja, także to, czego nie ma w żadnym systemie. Coś z niej wynika dopiero wtedy, gdy dyrektor na tej podstawie organizuje pomoc dla klasy.","it":"Dane kontaktowe klientów w systemie CRM to aktywator Informacja: klient podaje je przy zakładaniu konta (wytwórca), administrator utrzymuje bazę (opiekun), a konsultant korzysta z niej przy obsłudze (konsument). Nieaktualny numer to błąd jakości informacji, przez który powiadomienie nie dotarło.","egz":"Informacja jest jedną ze zdolności do świadczenia usług, a zdolności te wykorzystuje się poprzez procesy, by świadczyć usługi (s. 86). Procesy wymagają informacji jako wejścia i wytwarzają ją jako wyjście (s. 71). Nie myl z: Dane – Dane to surowe fakty. Informacja to dane przetworzone i mające znaczenie.","src":"COBIT 5 Framework (PL), s. 81, 86"},"organizacja":{"t":"Organizacja","eg":"Organizacja","pd":"Przedsiębiorstwo","en":"Enterprise","wyj":"Firma, urząd, szkoła czy szpital: ludzie, którzy razem robią coś w jakimś celu.\n\nW COBIT 5 organizacja (enterprise) to podmiot, który ma interesariuszy, ich potrzeby i własne cele (enterprise goals). Ład i Zarządzanie IT służą temu, by organizacja te cele osiągała. Podręcznik tłumaczy enterprise jako „przedsiębiorstwo”, a egzamin jako „organizacja”, ale chodzi o to samo, także o sektor publiczny i not-for-profit.\n\nŻeby jednym słowem mówić o każdej zorganizowanej całości z celami: firmie, urzędzie, szpitalu czy uczelni, bo COBIT 5 stosuje się do wszystkich, nie tylko do biznesu.","zycie":"Klub szachowy przy osiedlowym domu kultury ma skarbnika, składki i wspólny cel: utrzymać salę i co roku zorganizować turniej. Nikt na tym nie zarabia, a mimo to są pieniądze, ludzie i decyzje do podjęcia. Dla COBIT 5 to też organizacja – nie trzeba być firmą, żeby z niego korzystać.","firma":"Pani Ania prowadzi jednoosobowy sklep internetowy z ceramiką, a jej brat spółkę z 200 pracownikami. Oboje mają swoje cele, pieniądze i informatykę, od której zależą. Dla COBIT 5 obie firmy są organizacjami, bez względu na wielkość.","urzad":"Szpital powiatowy, urząd gminy i szkoła podstawowa nie zarabiają dla właścicieli, ale mają budżet, ludzi, systemy i cele do osiągnięcia. COBIT 5 wprost mówi, że nadaje się też dla sektora publicznego i not-for-profit. Każda z tych instytucji jest więc organizacją w rozumieniu egzaminu.","it":"Gdy szpital publiczny realizuje APO02 (Zarządzanie strategią), też jest organizacją (enterprise) w rozumieniu COBIT 5: jego cele, np. ciągłość opieki nad pacjentami, są w kaskadzie celów celami organizacji, choć szpital nie działa dla zysku.","egz":"Gdy w pytaniu widzisz „organizacja”, w podręczniku szukaj „przedsiębiorstwo”. Podręcznik: „przedsiębiorstwo”, egzamin: „organizacja”. Chodzi o każdą organizację – także urząd czy szpital publiczny, nie tylko firmę. Nie myl z: Firma komercyjna – „Przedsiębiorstwo” w COBIT ≠ tylko firma nastawiona na zysk.","src":"COBIT 5 Framework (PL), s. 13"},"rola-kierownictwo":{"t":"Kierownictwo","eg":"Kierownictwo","pd":"Zarządzanie (podpis roli na Ilustracji 9)","en":"Management","wyj":"Kierownicy, którzy dostają kierunek od szefostwa, rozdzielają pracę ludziom i pilnują, czy organizacja osiąga cele.\n\nKierownictwo dostaje kierunek od organu Ładu. Instruuje i dopasowuje role operacyjne i odbiera ich raporty – między kierownictwem a rolami operacyjnymi są tylko te dwie relacje (FW-PL s. 24, Il. 9). Strzałka monitorowania łączy kierownictwo z organem Ładu; według uzasadnień egzaminacyjnych to kierownictwo odpowiada wykonawczo za monitorowanie. Swoją pracę prowadzi w obszarze Planuj, Twórz, Wykonuj i Monitoruj.\n\nŻeby kierunek od organu Ładu zamienił się w konkretne zadania i żeby ktoś pilnował ich wykonania.","zycie":"Zarząd wspólnoty postanawia: w tym roku remont dachu. Administrator budynku wybiera firmę i ustala jej harmonogram. Firma raportuje administratorowi postępy, a on co miesiąc mówi zarządowi, czy remont idzie zgodnie z planem. Administrator to kierownictwo: instruuje i dopasowuje.","firma":"Rada spółki ustala: otwieramy czwarty sklep bez kredytu. Dyrektor zarządzający układa plan, rozdziela zadania kierownikom i co tydzień patrzy na raporty sprzedaży. To kierownictwo z Ilustracji 9.","urzad":"Rada gminy uchwala strategię e-usług. Sekretarz gminy rozdziela zadania wydziałom, dopasowuje grafik informatyków i co miesiąc zdaje radzie gminy relację z postępów. Sekretarz działa jako kierownictwo.","it":"Kierownictwo IT mierzy, czy IT osiąga cele, m.in. w procesie MEA01 (Monitorowanie, ocena i oszacowanie wydajności i zgodności) z domeny MEA, i raportuje wyniki organowi Ładu.","egz":"„Kto instruuje i dopasowuje role operacyjne?” → Kierownictwo. Kto odpowiada wykonawczo za monitorowanie w rolach z Ilustracji 9? Według uzasadnień egzaminacyjnych także Kierownictwo, a nie organ Ładu. Podręcznikowy podpis „Zarządzanie” na Ilustracji 9 to ta sama rola. Na Ilustracji 9 podręcznik podpisuje tę rolę „Zarządzanie”, a egzamin mówi „Kierownictwo” (tę formę podręcznik ma też w nagłówku na s. 31). W uzasadnieniach egzaminacyjnych to kierownictwo odpowiada wykonawczo za monitorowanie, a nie organ Ładu. Nie myl z: Organ Ładu i nadzoru – Organ Ładu wyznacza kierunek i jest rozliczany przed interesariuszami. Kierownictwo realizuje kierunek, instruuje i dopasowuje role operacyjne i odpowiada wykonawczo za monitorowanie osiągania celów.; Zarządzanie – Zarządzanie to obszar działań (PBRM, 32 procesy). Kierownictwo to rola z Ilustracji 9, czyli ludzie, którzy te działania prowadzą.; Oszacuj, Kieruj i Monitoruj (EDM) – „Monitoruj” w EDM to praktyka procesów Ładu: Ład monitoruje sprawność i zgodność względem kierunku (s. 14). W pytaniu o role z Ilustracji 9 egzamin wiąże monitorowanie z kierownictwem.","src":"COBIT 5 Framework (PL), s. 14, 24, 31"},"lad":{"t":"Ład","eg":"Ład","pd":"Nadzór","en":"Governance","wyj":"Szefostwo decyduje, po co i co robimy, i pilnuje, czy idziemy w dobrą stronę.\n\nOrgan Ładu, zwykle zarząd pod przewodnictwem prezesa, ocenia potrzeby, warunki i opcje interesariuszy (Evaluate), ustala priorytety i podejmuje decyzje (Direct), a potem monitoruje sprawność i zgodność z wyznaczonym kierunkiem (Monitor). Wyniki z Zarządzania wracają do Ładu i cykl się powtarza.\n\nŻeby informatyka robiła to, czego potrzebuje cała organizacja, a nie tylko to, co umieją informatycy.","zycie":"Wspólnota mieszkaniowa na zebraniu rocznym ocenia stan budynku i decyduje: w tym roku najpierw dach, elewacja dopiero za dwa lata, a zarządca co kwartał pokazuje wydatki. Wyboru dekarza i pilnowania ekipy zebranie już nie robi – to robota zarządcy. Ocenić, wyznaczyć kierunek, monitorować: to jest Ład.","firma":"Właścicielka restauracji raz na kwartał siada z wynikami i decyduje: celujemy w rodziny z dziećmi, marża ma wynosić co najmniej 20%, a za trzy miesiące sprawdzamy, czy to działa. Co i jak gotować każdego dnia, ustala już szef kuchni. Ona sprawuje Ład, on zarządza.","urzad":"Rada gminy przyjmuje strategię cyfryzacji: najpierw e-usługi dla mieszkańców, potem nowy system księgowy. Ustala na to budżet i co pół roku każe sobie przedstawić, co zrobiono. Wybór dostawcy i prowadzenie wdrożenia zostawia urzędowi – rada sprawuje Ład, a nie zarządza projektem.","it":"W EDM03 (Zapewnienie optymalizacji ryzyka) zarząd ocenia ryzyko IT, ustala apetyt na ryzyko i monitoruje, czy organizacja go nie przekracza.","egz":"Zapamiętaj czasowniki: Ład = Oszacuj, Kieruj, Monitoruj (EDM); odpowiada zarząd pod przewodnictwem prezesa (EN: chairperson – przewodniczący rady/zarządu, nie CEO). Zarządzanie = Planuj, Twórz, Wykonuj, Monitoruj; odpowiada kierownictwo pod przewodnictwem CEO. Egzamin PL: „Ład”. Podręcznik PL: „Nadzór”. EN: Governance. To jedno i to samo pojęcie. Słowo „nadzór” w pytaniu egzaminacyjnym może też pojawić się w zbitce „ład i nadzór”. Nie myl z: Zarządzanie – Zarządzanie (management) planuje, buduje, uruchamia i monitoruje działania ZGODNIE z kierunkiem wyznaczonym przez Ład.; Nadzór w znaczeniu kontroli / inspekcji – Polskie „nadzór” kojarzy się z kontrolą. W COBIT to coś szerszego: także wyznaczanie kierunku i ustalanie priorytetów.; Ład korporacyjny (enterprise governance) – Ład nad IT w organizacji (GEIT) jest CZĘŚCIĄ ładu korporacyjnego (Zasada 2).","src":"COBIT 5 Framework (PL), s. 14, 91"},"rola-interesariusze":{"t":"Interesariusze (właściciele) – delegują","eg":"Interesariusze (właściciele) – delegują","pd":"Właściciele oraz interesariusze","en":"Owners and stakeholders","wyj":"Ci, w czyim imieniu działa organizacja, np. właściciele czy mieszkańcy; to oni powierzają władzę szefostwu.\n\nWłaściciele i interesariusze powierzają, czyli delegują, sprawowanie Ładu organowi Ładu. Organ wyznacza kierunek kierownictwu. Na końcu organ jest rozliczany przed interesariuszami z efektów.\n\nŻeby było jasne, skąd organ Ładu ma władzę i przed kim się rozlicza.","zycie":"Mieszkańcy bloku na zebraniu wspólnoty wybierają zarząd i powierzają mu dbanie o budynek. Sami nie zlecają prac firmom. Za rok rozliczają zarząd z budżetu. Mieszkańcy pełnią tu rolę „interesariusze”: delegują i rozliczają.","firma":"Wspólnicy spółki piekarniczej na zgromadzeniu wybierają radę nadzorczą. Nie mówią kierownikom sklepów, co mają robić. Raz w roku słuchają sprawozdania rady i oceniają jej pracę. To rola interesariuszy z Ilustracji 9.","urzad":"Mieszkańcy gminy w wyborach powierzają władzę radzie i wójtowi. Nie piszą zarządzeń ani nie wdrażają systemów. Przy kolejnych wyborach rozliczają władzę z efektów. To rola interesariuszy: delegowanie.","it":"Proces EDM05 (Zapewnienie przejrzystości dotyczącej interesariuszy) wspiera relację „strona rozliczana”: organ Ładu rzetelnie informuje interesariuszy o wynikach IT (interpretacja kursu).","egz":"„Kto deleguje?” → interesariusze (właściciele). „Kto jest rozliczany przed interesariuszami?” → organ Ładu i nadzoru. Interesariusze nie instruują i nie monitorują kierownictwa. Egzamin skraca tę rolę do „Interesariusze”. Podręcznik na Ilustracji 9 pisze „Właściciele oraz interesariusze”. To ta sama rola. Nie myl z: Interesariusz – Interesariusz to szerokie pojęcie z Zasady 1: każdy, kogo dotyczy organizacja. Rola z Ilustracji 9 to konkretne ogniwo: ten, kto deleguje i rozlicza organ Ładu.; Interesariusze (wymiar aktywatora) – Wymiar aktywatora pyta, kto ma rolę lub interes w danym aktywatorze, np. w procesie. Rola z Ilustracji 9 dotyczy całego systemu Ładu.; Organ Ładu i nadzoru – Organ Ładu wyznacza kierunek. Interesariusze tylko delegują i rozliczają; kierunku kierownictwu nie wyznaczają.","src":"COBIT 5 Framework (PL), s. 24"},"komponent-cel-ladu":{"t":"Cel Ładu (Tworzenie Wartości)","eg":"Cel Ładu (Tworzenie Wartości)","pd":"Cel nadzoru: tworzenie wartości","en":"Governance objective: value creation","wyj":"Po co w ogóle decydujemy: żeby z wydanych pieniędzy i pracy był pożytek, bez zbędnego ryzyka.\n\nOrgan Ładu formułuje cel jako tworzenie wartości: korzyści przy optymalnym ryzyku i zasobach. Aktywatory, zakres i role dobiera się tak, żeby temu celowi służyły. Każdą decyzję sprawdza się pytaniami z s. 17: kto odnosi korzyści, kto ponosi ryzyko, jakie zasoby są wymagane.\n\nŻeby każda decyzja o IT miała jeden punkt odniesienia: czy tworzy wartość. Bez celu pozostałe komponenty nie mają kierunku.","zycie":"Rodzina planuje zakup samochodu. Zanim wybierze model, ustala, po co. Auto ma wozić dzieci do szkoły (korzyść), nie psuć się zimą (ryzyko) i nie zjeść oszczędności (zasoby). To „po co” jest Celem Ładu w domowym systemie decyzji.","firma":"Właściciel piekarni ustala, po co mu nowy system kasowy: szybsza obsługa klientów, bez ryzyka utraty danych i bez przepłacania. Każdą decyzję o kasach porównuje potem z tym celem. To Cel Ładu, pierwszy komponent Podejścia do Ładu.","urzad":"Rada gminy zapisuje w strategii cyfryzacji: e-usługi mają oszczędzać czas mieszkańców, chronić ich dane i mieścić się w budżecie. Ten zapis to Cel Ładu, czyli wspólny punkt odniesienia dla decyzji o IT w gminie. Gdy wójt proponuje nowy system, radni pytają: kto zyska, kto poniesie ryzyko i ile to będzie kosztować.","it":"Procesy EDM02, EDM03 i EDM04 odpowiadają trzem częściom Celu Ładu: realizacji korzyści, optymalizacji ryzyka i optymalizacji zasobów (Ilustracja 16, s. 33).","egz":"Cztery komponenty z Ilustracji 8: Cel Ładu, aktywatory Ładu, zakres Ładu oraz role, działania i relacje. Jeśli w opcjach widzisz „Oszacuj, Kieruj i Monitoruj” albo proces EDM05 jako komponent, to dystraktor. Egzamin: „Cel Ładu”. Podręcznik: „Cel nadzoru”. Komponentem jest cel (tworzenie wartości), a nie praktyki Oszacuj, Kieruj i Monitoruj. Nie myl z: Tworzenie Wartości – Cel Ładu – Tworzenie wartości to treść celu (co znaczy wartość). Cel Ładu jako komponent to miejsce tej treści w Podejściu do Ładu, obok aktywatorów, zakresu i ról.; Oszacuj, Kieruj i Monitoruj (EDM) – Oszacuj, Kieruj i Monitoruj to praktyki procesów Ładu (domena EDM), a nie komponent Podejścia do Ładu.; Cele organizacji – Cele organizacji to 17 typowych celów z kaskady celów. Cel Ładu jest jeden: tworzenie wartości.","src":"COBIT 5 Framework (PL), s. 17, 23, 24"}},"S":[{"pt":"Lekcja 1.27","h":"Zasada 2: Ład nad IT to część ładu całej organizacji","b":"<p><w k=\"zasada-2\">Pokrycie całej organizacji<\/w> <span class=\"en\">Covering the <w k=\"organizacja\">Enterprise<\/w> End-to-end<\/span>:<\/p><ul><li><w k=\"lad\">Ład<\/w> nad IT jest <b>częścią<\/b> ładu korporacyjnego.<\/li><li>Obejmuje wszystkie funkcje i procesy przetwarzające <w k=\"informacja\">informacje<\/w> – także <b>zewnętrzne<\/b> <w k=\"it-usluga-it\">usługi IT<\/w> i procesy biznesowe.<\/li><\/ul>","c":"Ład nad IT sięga wszędzie, gdzie przetwarza się informacje organizacji – w środku i na zewnątrz.","s":"COBIT 5 Framework (PL), s. 23; s. 14","ctx":"<p>Ład nad IT nie jest osobnym systemem działu IT, tylko fragmentem ładu korporacyjnego, czyli sposobu, w jaki władze kierują całą organizacją. Informacje i technologia to aktywa, o które dbają wszyscy pracownicy. Zasięg obejmuje „rozszerzony zakres przedsiębiorstwa”: dostawcę chmury, firmę outsourcingową, partnera logistycznego. Podręcznik dodaje, że COBIT 5 jest spójny z najnowszymi poglądami dotyczącymi Ładu (s. 23).<\/p><p>Pułapki: zasada 2 mówi o <b>zasięgu<\/b> (cała organizacja, od początku do końca). Współdziałanie aktywatorów to zasada 4, a łączenie standardów – zasada 3. Podręcznik nazywa ją „Uwzględnienie wszystkich aspektów działania przedsiębiorstwa”; na egzaminie szukaj nazwy „Pokrycie całej organizacji”.<\/p><p>Przykład: sklep internetowy zleca magazyn firmie zewnętrznej, a dane zamówień trafiają do jej systemu. Ten przepływ też podlega Ładowi; relacjami z dostawcą zajmuje się proces <w k=\"proc-apo10\">APO10 Zarządzanie dostawcami<\/w> <span class=\"en\">Manage Suppliers<\/span>.<\/p>"},{"pt":"Sprawdź się","quiz":{"tresc":"Sklep internetowy zleca obsługę magazynu firmie zewnętrznej, a dane zamówień trafiają do jej systemu. Czy według zasady 2 ten przepływ informacji należy do Ładu sklepu?","opcje":[{"t":"Tak – zasada 2 obejmuje też usługi zewnętrzne","ok":true,"w":"Dobrze. COBIT 5 uwzględnia wewnętrzne i zewnętrzne usługi IT oraz procesy."},{"t":"Nie – Ład kończy się na granicy organizacji","w":"Zasada 2 obejmuje też to, co poza organizacją."},{"t":"Nie – to sprawa wyłącznie firmy zewnętrznej","w":"Dane należą do sklepu, więc to sprawa jego Ładu."},{"t":"Tak – ale tylko wtedy, gdy dostawca stosuje COBIT 5","w":"Zasięg Ładu sklepu nie zależy od tego, czego używa dostawca."}],"src":"COBIT 5 Framework (PL), s. 23","pomoc":{"t":"Pytanie dotyczy lekcji 1.27 „Zasada 2 – Ład nad IT częścią ładu korporacyjnego”. Cel lekcji: Potrafię wyjaśnić, że według zasady 2 Ład nad IT jest częścią ładu korporacyjnego i obejmuje także usługi i procesy zewnętrzne.","k":[]}}},{"pt":"Lekcja 1.28","h":"Podejście do Ładu: cztery komponenty","b":"<p><w k=\"system-ladu\">Podejście do Ładu<\/w> <span class=\"en\"><w k=\"lad\">Governance<\/w> approach<\/span>, Ilustracja 8:<\/p><div class=\"tblwrap\"><table class=\"tbl\"><tr><th>Komponent<\/th><th>Pytanie<\/th><\/tr><tr><td><w k=\"komponent-cel-ladu\">Cel Ładu<\/w>: Tworzenie Wartości<\/td><td>Po co?<\/td><\/tr><tr><td><w k=\"aktywatory-ladu\">Aktywatory Ładu<\/w><\/td><td>Czym?<\/td><\/tr><tr><td><w k=\"zakres-ladu\">Zakres Ładu<\/w><\/td><td>Czego dotyczy?<\/td><\/tr><tr><td><w k=\"role-dzialania-relacje\">Role, działania i relacje<\/w><\/td><td>Kto i jak?<\/td><\/tr><\/table><\/div>","c":"Komponenty są tylko cztery: cel, aktywatory, zakres oraz role, działania i relacje.","s":"COBIT 5 Framework (PL), s. 23–24, Ilustracja 8","ctx":"<p>Aktywatory Ładu <span class=\"en\">Governance enablers<\/span> to metodyki, zasady, struktury, procesy i praktyki oraz zasoby: infrastruktura, aplikacje, ludzie i informacje; ich brak osłabia tworzenie wartości. Zakres Ładu <span class=\"en\">Governance scope<\/span> to cała organizacja, jednostka albo konkretne aktywa – można go ująć różnie, ale trzeba go zdefiniować. Role, działania i relacje mówią, kto uczestniczy w Ładzie i jak współpracuje (rozwija je Ilustracja 9).<\/p><p>Pułapki: „Oszacuj, Kieruj i Monitoruj” to czynności Ładu, a „Planuj, Twórz, Wykonuj i Monitoruj” – Zarządzania; żadne z nich nie jest komponentem; Zapewnienie Transparentności Interesariuszy to proces EDM05, a nie komponent. Ilustracja 8 to na egzaminie Rysunek 8.<\/p><p>Przykład ze szpitala: cel – lepsza opieka przy rozsądnym ryzyku i koszcie; aktywatory – regulaminy, komitet ds. IT, systemy, ludzie; zakres – cały szpital albo tylko dokumentacja medyczna; role – rada nadzorcza, dyrekcja, informatycy.<\/p>"},{"pt":"Sprawdź się","quiz":{"tresc":"Szpital wypisuje: regulaminy, komitet ds. IT, procesy, systemy i ludzi. Który komponent Podejścia do Ładu właśnie opisał?","opcje":[{"t":"Cel Ładu","w":"Cel Ładu to Tworzenie Wartości."},{"t":"Aktywatory Ładu","ok":true,"w":"Dobrze. Metodyki, zasady, struktury, procesy, praktyki i zasoby to aktywatory Ładu."},{"t":"Role, działania i relacje","w":"Komitet ma swoją rolę, ale cała lista opisuje środki działania."},{"t":"Zakres Ładu","w":"Zakres mówi, czego dotyczy Ład, a nie czym się posługuje."}],"src":"COBIT 5 Framework (PL), s. 24","pomoc":{"t":"Pytanie dotyczy lekcji 1.28 „Podejście do Ładu – cztery komponenty”. Cel lekcji: Potrafię wymienić cztery komponenty Podejścia do Ładu i odróżnić je od innych pojęć COBIT 5.","k":["system-ladu","zakres-ladu","role-dzialania-relacje","komponent-cel-ladu"]}}},{"pt":"Arkusz próbny","sp1":"sp1-08","lekcja":"1.28","temat":"Podejście do Ładu – cztery komponenty","k":["system-ladu","zakres-ladu","role-dzialania-relacje","komponent-cel-ladu"]},{"pt":"Lekcja 1.29","h":"Cztery role: władza idzie w dół, informacja wraca w górę","b":"<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>Rola<\/th><th>W dół<\/th><th>W górę<\/th><\/tr><tr><td><w k=\"rola-interesariusze\">Interesariusze<\/w><\/td><td>delegują<\/td><td>–<\/td><\/tr><tr><td><w k=\"organ-ladu\">Organ Ładu i nadzoru<\/w><\/td><td>wyznacza kierunek<\/td><td>jest rozliczany<\/td><\/tr><tr><td><w k=\"rola-kierownictwo\">Kierownictwo<\/w><\/td><td>instruuje i dopasowuje<\/td><td>monitoruje<\/td><\/tr><tr><td><w k=\"rola-operacyjne\">Role operacyjne<\/w><\/td><td>wykonują<\/td><td>raportują<\/td><\/tr><\/table><\/div>","c":"Interesariusze tylko delegują; Organ Ładu wyznacza kierunek i jest rozliczany; Kierownictwo instruuje i monitoruje; role operacyjne wykonują i raportują.","s":"COBIT 5 Framework (PL), s. 24, Ilustracja 9; s. 14","ctx":"<p>Ilustracja 9 (na egzaminie Rysunek 9) rozwija komponent „role, działania i relacje”. W dół idzie władza: delegowanie, wyznaczanie kierunku, instruowanie i dopasowanie. W górę wraca informacja: rozliczanie, monitorowanie, raportowanie. Strzałka monitorowania łączy Kierownictwo z Organem Ładu; egzamin przypisuje monitorowanie Kierownictwu. W wyjaśnieniach egzaminu Organ Ładu i nadzoru jest „odpowiedzialny decyzyjnie” (rozliczany), a Kierownictwo „odpowiedzialne wykonawczo” za monitorowanie. Interesariusze <b>tylko delegują<\/b> – nie kierują i nie monitorują.<\/p><p>Pułapka nazw: podręcznik podpisuje role „Właściciele oraz interesariusze”, „Organ nadzorujący”, „Zarządzanie”, „Eksploatacja i wykonanie”. Na egzaminie: Interesariusze, Organ Ładu i nadzoru, Kierownictwo, Role operacyjne (<span class=\"en\">Owners and Stakeholders, Governing Body, Management, Operations and Execution<\/span>).<\/p><p>Przykład ze spółki: akcjonariusze delegują; zarząd pod przywództwem prezesa wyznacza kierunek (s. 14); kadra z dyrektorem generalnym i dyrektorem IT instruuje i monitoruje; administratorzy i helpdesk wykonują i raportują. Stanowiska to przykład kursu – COBIT 5 opisuje role ogólnie.<\/p>"},{"pt":"Sprawdź się","quiz":{"tresc":"Która rola z Rysunku 9 <b>wyznacza kierunek<\/b> i jest <b>rozliczana<\/b>?","opcje":[{"t":"Role operacyjne, np. administratorzy","w":"Role operacyjne wykonują i raportują."},{"t":"Kierownictwo, np. dyrektor IT","w":"Kierownictwo instruuje i dopasowuje pracę oraz monitoruje."},{"t":"Organ Ładu i nadzoru, np. zarząd","ok":true,"w":"Dobrze. Organ Ładu wyznacza kierunek kierownictwu i rozlicza się przed interesariuszami."},{"t":"Interesariusze, np. akcjonariusze","w":"Interesariusze delegują, a nie wyznaczają kierunku."}],"src":"COBIT 5 Framework (PL), s. 24","pomoc":{"t":"Pytanie dotyczy lekcji 1.29 „Role, działania i relacje – kto deleguje, kto kieruje, kto wykonuje”. Cel lekcji: Potrafię przypisać czynności z Ilustracji 9 do czterech ról: interesariuszy, Organu Ładu i nadzoru, kierownictwa i ról operacyjnych.","k":["organ-ladu","rola-interesariusze","rola-kierownictwo","rola-operacyjne"]}}},{"pt":"Arkusz próbny","sp1":"sp1-20","lekcja":"1.29","temat":"Role, działania i relacje – kto deleguje, kto kieruje, kto wykonuje","k":["organ-ladu","rola-interesariusze","rola-kierownictwo","rola-operacyjne"]}]};</script>
