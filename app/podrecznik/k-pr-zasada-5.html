<script>window.DECK={"id":"k-pr-zasada-5","rozdzial":"Rozdział 6 · Zasada 5: Oddzielenie Ładu od Zarządzania · s. 31–33","tytul":"Zasada 5: czynności EDM i PBRM, obieg informacji","prev":"k-m0-lad.html","next":"k-pr-prm.html","T":{"struktury-organizacyjne":{"t":"Struktury organizacyjne","eg":"Struktury organizacyjne","pd":"Struktury organizacyjne","en":"Organisational Structures (enabler 3)","wyj":"Zespoły, komisje i stanowiska, które podejmują decyzje, np. narada kierownictwa czy komisja przetargowa.\n\nStruktury organizacyjne (organisational structures) to kluczowe jednostki decyzyjne, np. zarząd, komitet ds. strategii IT czy komitet sterujący. Każda ma mandat, skład i zasady działania, a dobre praktyki obejmują też zakres kontroli (span of control), poziom uprawnień (level of authority), delegowanie uprawnień i procedury eskalacji. Wynikiem ich pracy są decyzje, a tabele RACI łączą je z praktykami procesów.\n\nŻeby było wiadomo, które zespoły i gremia podejmują jakie decyzje, z jakim umocowaniem i według jakich zasad.","zycie":"Trójka rodzeństwa opiekuje się starszym tatą i umawia się: każdy wydatek powyżej 1000 zł na leczenie czy remont jego mieszkania zatwierdzają we trójkę, na rozmowie w niedzielę. Drobne zakupy robi ten, kto akurat jest u taty. Ta niedzielna „rada” to struktura organizacyjna – ma skład, mandat i zasady podejmowania decyzji.","firma":"W rodzinnej stolarni powstaje komitet inwestycyjny: właściciel, jego córka i księgowa. Raz w miesiącu decydują o zakupach maszyn powyżej 20 tys. zł, a mniejsze wydatki zatwierdza sam kierownik warsztatu. Komitet to struktura organizacyjna z określonym zakresem uprawnień.","urzad":"Wójt zarządzeniem powołuje komisję przetargową do zakupu komputerów dla szkół. Zarządzenie mówi, kto w niej zasiada, co ocenia i kiedy kończy pracę – po podpisaniu umowy. To struktura organizacyjna z mandatem i cyklem życia.","it":"Komitet sterujący programu wdrożenia nowego systemu zatwierdza zmiany zakresu i budżetu w procesie BAI01 (Zarządzanie programami i projektami), a sprawy przekraczające jego uprawnienia eskaluje do komitetu ds. strategii IT. To aktywator „Struktury organizacyjne” w działaniu: mandat, poziom uprawnień i eskalacja.","egz":"Produkt działań struktury to decyzje. Pytania o „zasady operacyjne”, „zakres kontroli”, „poziom uprawnień”, „delegowanie” i „eskalację” dotyczą tego aktywatora. Nie myl z: Role i struktury organizacyjne – Struktura to jednostka (np. komitet), a rola to funkcja osoby (np. CIO). Ilustracja 33 zawiera i jedne, i drugie.","src":"COBIT 5 Framework (PL), s. 27, 75"},"mea":{"t":"Monitoruj, Oszacuj i Oceń (MEA)","eg":"Monitoruj, Oszacuj i Oceń (MEA)","pd":"Monitorowanie, ocena i oszacowanie (MEA)","en":"Monitor, Evaluate and Assess (MEA)","wyj":"Szuflada zadań „kontrola”: sprawdzać wyniki, przestrzeganie przepisów i to, czy kontrole wewnętrzne działają.\n\nMEA (Monitor, Evaluate and Assess) to domena Zarządzania z trzema procesami. MEA01 monitoruje wydajność i zgodność (performance and conformance), MEA02 system kontroli wewnętrznej (system of internal control), a MEA03 zgodność z wymogami zewnętrznymi (external requirements), np. przepisami. Wyniki trafiają do Ładu, który w EDM monitoruje, czy organizacja trzyma się wyznaczonego kierunku.\n\nŻeby Zarządzanie wiedziało, jak naprawdę idzie: czy cele są osiągane, czy mechanizmy kontrolne działają i czy organizacja spełnia wymogi zewnętrzne, i mogło to rzetelnie zaraportować Ładowi.","zycie":"Pod koniec miesiąca siadasz z wyciągiem z konta: czy zmieściliście się w budżecie, czy zlecenie stałe na czynsz naprawdę się wykonało i czy żaden rachunek nie umknął. Raz w roku sprawdzasz jeszcze, czy PIT rozliczyłeś zgodnie z przepisami. Sprawdzanie wyników, własnych zabezpieczeń i zgodności z przepisami to w domowej skali domena MEA.","firma":"Właścicielka sklepu internetowego co kwartał patrzy na liczbę zwrotów i czas wysyłki (MEA01), sprawdza, czy pracownicy naprawdę robią kopie zapasowe tak, jak każe procedura (MEA02), i czy regulamin sklepu jest zgodny z nowymi przepisami konsumenckimi (MEA03). Te trzy rodzaje sprawdzania to trzy procesy domeny MEA.","urzad":"Sekretarz gminy co pół roku zbiera raport, ile spraw załatwiono w terminie (MEA01), zleca audytorowi wewnętrznemu sprawdzenie, czy kontrola zarządcza działa (MEA02), a informatyk przygotowuje urząd do kontroli zgodności z KRI (MEA03). Mierzenie wyników, sprawdzanie własnych mechanizmów kontrolnych i zgodności z przepisami – to domena MEA.","it":"W MEA03 (Monitorowanie, ocena i oszacowanie zgodności z wymogami zewnętrznymi) dział IT co pół roku sprawdza, czy przetwarzanie danych osobowych spełnia wymogi RODO, i raportuje wynik zarządowi. Zarząd w EDM monitoruje na tej podstawie, czy organizacja trzyma się kierunku.","egz":"MEA to Zarządzanie, nie Ład. „Monitoruj, Oszacuj i Oceń” (MEA) ≠ „Oszacuj, Kieruj i Monitoruj” (EDM). W przepływie: Oszacuj → Kieruj → Planuj → … → Monitoruj (MEA) → Monitoruj (EDM). Egzamin: „Monitoruj, Oszacuj i Oceń (MEA)”. Podręcznik: „Monitorowanie, ocena i oszacowanie (MEA)”. Nazwy procesów na egzaminie mogą brzmieć inaczej niż w podręczniku. Rozpoznawaj je po kodzie i angielskim słowie kluczowym.","src":"COBIT 5 Framework (PL), s. 33"},"zarzadzanie":{"t":"Zarządzanie","eg":"Zarządzanie","pd":"Zarządzanie","en":"Management","wyj":"Kierownicy planują i wykonują pracę w kierunku, który wyznaczyło szefostwo.\n\nKierownictwo pod przewodnictwem CEO planuje, tworzy, wykonuje i monitoruje działania (Plan, Build, Run, Monitor) zgodnie z kierunkiem wskazanym przez Ład. W COBIT 5 to cztery domeny: APO, BAI, DSS i MEA, razem 32 procesy. Wyniki i informacje zwrotne wracają do Ładu, który je ocenia i w razie potrzeby koryguje kierunek.\n\nŻeby kierunek wyznaczony przez Ład zamienić w zaplanowaną, wykonaną i sprawdzoną pracę, która prowadzi do celów organizacji.","zycie":"Rodzina ustaliła: „oszczędzamy na wakacje” (to Ład). Ty robisz plan zakupów, porównujesz ceny, co miesiąc przelewasz 1000 zł na lokatę i sprawdzasz, czy kwota rośnie. Ta codzienna robota to Zarządzanie.","firma":"Właściciel restauracji ustalił, że w weekendy ma być nowe menu. Kierownik zmiany układa grafik, zamawia towar, pilnuje jakości dań i w poniedziałek raportuje właścicielowi, jak poszło. Praca kierownika to Zarządzanie.","urzad":"Wójt zdecydował, że mieszkańcy mają załatwiać sprawy przez internet. Sekretarz gminy i kierownik informatyki planują projekt, wybierają dostawcę, wdrażają e-usługi i co miesiąc raportują wójtowi. Ich praca to Zarządzanie.","it":"W dziale IT szpitala APO09 (Zarządzanie umowami o świadczenie usług) planuje poziomy usług, BAI03 (Zarządzanie identyfikacją i budowaniem rozwiązań) buduje nowy moduł rejestracji, DSS01 (Zarządzanie eksploatacją) utrzymuje go w ruchu, a MEA01 (Monitorowanie, ocena i oszacowanie wydajności i zgodności) mierzy wyniki i raportuje je do Ładu.","egz":"Zarządzanie działa zgodnie z kierunkiem wyznaczonym przez organ Ładu, aby osiągnąć cele organizacji (definicja, s. 31). Nie myl z: Ład – Ład ocenia, kieruje i monitoruje; Zarządzanie planuje, tworzy, wykonuje i monitoruje. Oba „monitorują”, ale Ład monitoruje kierunek i cele, a Zarządzanie – realizację działań.","src":"COBIT 5 Framework (PL), s. 14, 92"},"edm":{"t":"Oszacuj, Kieruj i Monitoruj (EDM)","eg":"Oszacuj, Kieruj i Monitoruj (EDM)","pd":"Ocena, kierowanie i monitorowanie (EDM)","en":"Evaluate, Direct and Monitor (EDM)","wyj":"Trzy obowiązki szefostwa: ocenić sytuację, wskazać kierunek i sprawdzać, czy idziemy w dobrą stronę.\n\nEDM to jedyna domena Ładu i ma 5 procesów (EDM01–EDM05). W każdym są praktyki Oszacuj (Evaluate), Kieruj (Direct) i Monitoruj (Monitor): organ Ładu ocenia potrzeby i możliwości, kieruje przez priorytety i decyzje, a potem monitoruje wyniki i zgodność względem wyznaczonego kierunku. EDM02–EDM04 odpowiadają trzem składnikom Celu Ładu: korzyściom, ryzyku i zasobom.\n\nŻeby organ Ładu miał uporządkowane procesy do oceny potrzeb, wyznaczania kierunku i sprawdzania, czy kierunek jest realizowany. Dzięki temu Ład jest oddzielony od codziennego Zarządzania.","zycie":"Raz na kwartał siadacie z partnerem przy kuchennym stole. Patrzycie, jak wygląda sytuacja w domu (Oszacuj), ustalacie, że w tym roku priorytetem jest remont, a nie nowe auto (Kieruj), i po trzech miesiącach sprawdzacie, czy remont idzie zgodnie z planem (Monitoruj). Sami nie kładziecie płytek – od tego jest ekipa. To jest EDM, czyli Ład.","firma":"Wspólnicy sklepu internetowego spotykają się raz na kwartał. Oceniają, czy sklep się opłaca i czy ryzyko wycieku danych jest pod kontrolą, postanawiają, że w tym roku stawiają na aplikację mobilną, a po trzech miesiącach sprawdzają, jak kierownik ją wdraża. Nie konfigurują serwerów – wyznaczają kierunek i go pilnują, czyli działają w domenie EDM.","urzad":"Rada gminy uchwala strategię cyfryzacji, a po roku słucha sprawozdania wójta i ocenia, czy pieniądze na e-usługi dały efekt. Radni nie wdrażają systemów – oceniają, kierują i monitorują. To jest rola EDM.","it":"EDM03 Zapewnienie optymalizacji ryzyka: zarząd banku ocenia ryzyko przestoju bankowości internetowej, ustala, że przestój nie może przekroczyć 4 godzin w roku, i co kwartał sprawdza raport CIO. Codzienne rozpoznawanie i analizę ryzyka prowadzi Zarządzanie w APO12 Zarządzanie ryzykiem.","egz":"„Oszacuj, Kieruj i Monitoruj” to praktyki każdego procesu Ładu, a nie komponent Podejścia do Ładu. EDM05 bywa nazywany „Zapewnienie Transparentności Interesariuszy”. Egzamin: „Oszacuj, Kieruj i Monitoruj”. Podręcznik: „Ocena, kierowanie i monitorowanie”. Nie myl z MEA: „Monitoruj, Oszacuj i Oceń”. Nie myl z: Monitoruj, Oszacuj i Oceń (MEA) – MEA to domena ZARZĄDZANIA (monitorowanie wydajności, kontroli wewnętrznej i zgodności). EDM to domena ŁADU.","src":"COBIT 5 Framework (PL), s. 32, 33"},"dzialanie-procesu":{"t":"Działania","eg":"Działania","pd":"Działania","en":"Activities","wyj":"Konkretne kroki, które trzeba wykonać, żeby duży punkt planu został zrobiony.\n\nDziałania to konieczne i wystarczające kroki do realizacji praktyki. Uwzględniają wejścia i wyjścia oraz ułatwiają przypisanie ról. Nie są normatywne, więc organizacja przerabia je na własne procedury. Gdy są za ogólne, dokłada się szczegółowe działania z innych standardów.\n\nŻeby rozpisać praktykę na konkretne kroki, przy których łatwo wskazać, kto co robi i co wchodzi oraz wychodzi.","zycie":"Praktyka: „Przygotuj dziecko do szkoły”. Działania: kup podręczniki, podpisz zeszyty, sprawdź plan lekcji. To wystarczy, żeby praktyka była wykonana. Każda rodzina zrobi to po swojemu i to jest w porządku.","firma":"W warsztacie samochodowym praktyka brzmi: „Przyjmij auto do naprawy”. Działania: spisz usterki z klientem, zrób zdjęcia, ustal termin, wydaj potwierdzenie. Właściciel zamienia je na własną kartę przyjęcia z rubrykami. Działania z wzoru stały się procedurą warsztatu.","urzad":"W urzędzie praktyka brzmi: „Zarządzaj uprawnieniami użytkowników”. Działania to: przyjmij wniosek kierownika, nadaj dostęp, raz w roku przejrzyj listę. Informatyk dopisuje do nich szczegóły z normy ISO 27001 (międzynarodowej normy o bezpieczeństwie informacji) – to już szczegółowe działania.","it":"W DSS02 działania pod praktyką rejestrowania incydentów obejmują zapisanie zgłoszenia, klasyfikację i nadanie priorytetu. Zespół uzupełnia je szczegółowymi działaniami z ITIL (szczegóły procesu: uproszczenie kursu).","egz":"Działania: konieczne i wystarczające kroki, uwzględniają wejścia i wyjścia, ułatwiają wyznaczenie ról, nie są normatywne. Dystraktor „są obowiązkowe dla każdej organizacji” jest fałszywy. Nie myl z: Praktyka nadzoru / zarządzania – Praktyka to ogólny wymóg (CO). Działania to kroki do jej realizacji (JAK).; Procedura – Działania COBIT 5 nie są normatywne. Procedura to konkretna, obowiązująca wersja działań, napisana przez organizację.","src":"COBIT 5 Framework (PL), s. 70, 89"},"cele-organizacji":{"t":"Cele organizacji","eg":"Cele organizacji","pd":"Cele przedsiębiorstwa","en":"Enterprise goals","wyj":"Siedemnaście typowych celów, które ma każda firma czy urząd, np. zadowoleni klienci, zgodność z przepisami.\n\nTo drugi krok kaskady celów: potrzeby interesariuszy (stakeholder needs) przekłada się na cele organizacji (enterprise goals). COBIT 5 podaje 17 typowych celów w 4 wymiarach BSC: finanse, klient, obszar wewnętrzny, szkolenie i rozwój. Ilustracja 5 pokazuje, z którymi składnikami Celu Ładu (realizacja korzyści, optymalizacja ryzyka, optymalizacja zasobów) cel ma relację podstawową (P) lub wspierającą (S).\n\nŻeby potrzeby interesariuszy zamienić w konkretne cele całej organizacji, z których dopiero wynikają cele dla IT. Bez tego IT nie wie, czemu ma służyć.","zycie":"Na początku roku rodzina ustala, na czym jej najbardziej zależy: odłożyć na wkład własny, żeby dzieci dobrze zaczęły nową szkołę i żeby wszyscy byli zdrowi. Nikt jeszcze nie mówi o laptopach czy internecie. To cele „całego domu” – odpowiednik celów organizacji.","firma":"Właścicielka piekarni mówi: w tym roku chcę, żeby klienci wracali, żeby sanepid nie miał uwag i żeby firma była na plusie. To cele całej piekarni, a dopiero z nich wyniknie, czego potrzeba od kasy fiskalnej czy sklepu online. Tak wyglądają cele organizacji.","urzad":"Wójt na sesji rady gminy zapowiada: decyzje wydawane w terminie, sprawy do załatwienia przez internet i jawne wydatki. Te zamierzenia dotyczą całego urzędu, nie działu informatyki. To cele organizacji, od których zaczyna się kaskada.","it":"Cel organizacji 7 „Ciągłość i dostępność usług biznesowych” (wymiar Klient) w kaskadzie prowadzi m.in. do celu związanego z IT 07 „Dostarczanie usług IT zgodnie z wymogami biznesowymi”, a dalej m.in. do procesu DSS04 Zarządzanie ciągłością.","egz":"Potrzeby interesariuszy → Cele organizacji (krok 2). 17 celów, 4 wymiary BSC, relacje P/S. Nie musisz znać wszystkich 17 na pamięć – rozpoznawaj wymiary i logikę P/S. Egzamin: „Cele organizacji”. Podręcznik: „Cele przedsiębiorstwa”. Słownik podręcznika odsyła do „Cel biznesowy”. Nie myl z: Cele związane z informatyką – Cele organizacji dotyczą całej działalności; cele związane z informatyką opisują, co musi zapewnić IT, aby te cele wspierać.","src":"COBIT 5 Framework (PL), s. 19, 91"},"pbrm":{"t":"Planuj, Twórz, Wykonuj i Monitoruj","eg":"Planuj, Twórz, Wykonuj i Monitoruj","pd":"Planowanie, Budowanie, Uruchamianie i Monitorowanie","en":"Plan, Build, Run and Monitor (PBRM)","wyj":"Cztery etapy pracy kierowników: zaplanować, zbudować, uruchomić na co dzień, sprawdzać.\n\nZarządzanie realizuje kierunek wyznaczony przez Ład w czterech domenach: planuje i organizuje (Plan, APO), tworzy, nabywa i wdraża rozwiązania (Build, BAI), dostarcza je i obsługuje na co dzień (Run, DSS) oraz monitoruje i ocenia wyniki (Monitor, MEA). Wyniki monitorowania wracają do planowania i do Ładu, więc cykl się powtarza. Razem te domeny mają 32 procesy Zarządzania (13 + 10 + 6 + 3).\n\nŻeby całą pracę kierownictwa IT podzielić na cztery obszary odpowiedzialności, w których żadna ważna sprawa nie zostaje bez właściciela – od planu po sprawdzenie wyników.","zycie":"Chcecie w domu porządny internet. Najpierw porównujesz oferty i ustalasz budżet, potem technik podłącza router, potem cała rodzina korzysta z sieci na co dzień, a raz na jakiś czas mierzysz prędkość i sprawdzasz rachunek. To po kolei Planuj, Twórz, Wykonuj i Monitoruj.","firma":"Właścicielka piekarni chce przyjmować zamówienia na torty przez internet. Planuje, ile to ma kosztować i kto będzie odbierał zamówienia, informatyk stawia sklep, od poniedziałku ekspedientka codziennie obsługuje zamówienia, a na koniec miesiąca właścicielka liczy sprzedane torty i reklamacje. Cztery kroki to cztery obszary PBRM.","urzad":"Szkoła przechodzi na dziennik elektroniczny. Dyrektor ustala, czego potrzeba i ile można wydać (Planuj), sekretariat kupuje system i szkoli nauczycieli (Twórz), nauczyciele codziennie wpisują oceny, a informatyk pomaga, gdy coś nie działa (Wykonuj). Na koniec semestru dyrektor sprawdza, czy rodzice naprawdę z niego korzystają (Monitoruj).","it":"Nowy system poczty elektronicznej w organizacji: APO02 (Zarządzanie strategią) i APO06 (Zarządzanie budżetem i kosztami) to Planuj, BAI03 (Zarządzanie identyfikacją i budowaniem rozwiązań) to Twórz, DSS01 (Zarządzanie eksploatacją) i DSS02 (Zarządzanie zgłoszeniami serwisowymi i incydentami) to Wykonuj, a MEA01 (Monitorowanie, ocena i oszacowanie wydajności i zgodności) to Monitoruj.","egz":"„Planuj, Twórz, Wykonuj i Monitoruj” to obszary (domeny) Zarządzania, a nie komponent Podejścia do Ładu. Polski arkusz egzaminacyjny (SP1) używa formy „Planuj, Twórz, Wykonuj i Monitoruj”. Zestawienie Altkom podaje „Planuj, Wytwarzaj, Wykonuj i Monitoruj”. Podręcznik: „Planowanie, Budowanie, Uruchamianie i Monitorowanie”. Wszystkie trzy to Plan, Build, Run, Monitor. Nie myl z: Oszacuj, Kieruj i Monitoruj (EDM) – EDM to Ład (Oszacuj, Kieruj, Monitoruj). PBRM to Zarządzanie.","src":"COBIT 5 Framework (PL), s. 32"},"ryzyko":{"t":"Ryzyko","eg":"Ryzyko","pd":"Ryzyko","en":"Risk","wyj":"Coś może pójść źle; liczy się, jak bardzo jest to prawdopodobne i jak bardzo zaboli.\n\nRyzyko (risk) to połączenie prawdopodobieństwa zdarzenia i jego konsekwencji. Dotyczy przyszłości. Dopowiedzenie kursu (interpretacja, nie definicja z s. 93): gdy zdarzenie już nastąpiło, mówimy raczej o problemie albo incydencie. Ład ustala apetyt na ryzyko (risk appetite), czyli ile ryzyka organizacja jest gotowa przyjąć (EDM03, Zapewnienie optymalizacji ryzyka), a Zarządzanie identyfikuje, ocenia i ogranicza ryzyka w tych granicach (APO12, Zarządzanie ryzykiem).\n\nŻeby z wyprzedzeniem widzieć, co może pójść źle i jak bardzo by zaszkodziło, i świadomie decydować, czemu zapobiegać, a co zaakceptować.","zycie":"Planujecie wesele w ogrodzie w lipcu. Deszcz jest dość prawdopodobny, a skutek byłby duży – goście mokną, tort się rozpływa – więc rezerwujecie namiot. Ryzyko to ta możliwość deszczu razem z jej skutkami; jeśli w dniu wesela leje, macie już problem, a nie ryzyko.","firma":"W biurze rachunkowym tylko pani Ewa umie obsługiwać program do płac. Jeśli zachoruje w ostatnim tygodniu miesiąca, pensje u klientów się spóźnią. Szef ocenia, że to mało prawdopodobne, ale bolesne, więc każe przeszkolić drugą osobę – tak wygląda praca z ryzykiem.","urzad":"Nabór wniosków o dopłaty do wymiany pieców w urzędzie gminy zamyka się w piątek o 15:00, a wszystko idzie przez jeden serwer. Awaria akurat w piątek jest mało prawdopodobna, ale skutek byłby fatalny, więc informatyk robi kopię i ma tego dnia dyżur. To ryzyko: możliwość zdarzenia plus jego skutki.","it":"W procesie APO12 (Zarządzanie ryzykiem) dział IT prowadzi rejestr ryzyk: np. „awaria serwerowni” ma ocenione prawdopodobieństwo i skutki. Dla ryzyk powyżej apetytu ustalonego przez Ład w EDM03 (Zapewnienie optymalizacji ryzyka) planuje się działania, np. zapasowe centrum danych.","egz":"Na egzaminie ryzyko pojawia się głównie jako „optymalizacja ryzyka” (cel Ładu) i „apetyt na ryzyko” (czynnik środowiskowy we wdrożeniu). Nie myl z: Issue / problem / incydent – Problem już zaistniał; ryzyko jest możliwością w przyszłości.; Zagrożenie – Zagrożenie to źródło (np. powódź); ryzyko łączy prawdopodobieństwo z konsekwencjami.","src":"COBIT 5 Framework (PL), s. 93"},"zasada-5":{"t":"Zasada 5: Oddzielenie Ładu od Zarządzania","eg":"Zasada 5: Oddzielenie Ładu od Zarządzania","pd":"Zasada 5: Oddzielenie nadzoru od zarządzania","en":"Principle 5: Separating Governance From Management","wyj":"Kto innego decyduje o kierunku, a kto inny wykonuje pracę; to dwie różne role.\n\nŁad (Governance) ocenia, kieruje i monitoruje (Evaluate, Direct, Monitor; domena EDM, 5 procesów); odpowiada zarząd pod przewodnictwem prezesa. Zarządzanie (Management) planuje, tworzy, wykonuje i monitoruje (Plan, Build, Run, Monitor; domeny APO, BAI, DSS, MEA, 32 procesy); odpowiada kierownictwo pod przewodnictwem CEO. Ład wyznacza kierunek i monitoruje, czy jest realizowany, a Zarządzanie działa zgodnie z nim i przekazuje Ładowi informacje zwrotne.\n\nŻeby rozdzielić decydowanie o kierunku od wykonywania pracy, bo to działania o innym charakterze, wymagające innych struktur i służące innym celom.","zycie":"Raz w miesiącu rodzina siada przy stole i ustala budżet: na co wydajemy, na co oszczędzamy. Potem Ty robisz zakupy, płacisz rachunki i pilnujesz wydatków. Na kolejnej naradzie pokazujesz wyniki, a rodzina koryguje plan – narada to Ład, codzienne pilnowanie to Zarządzanie.","firma":"Właścicielka piekarni ustala, że w tym roku rozwijają sprzedaż przez internet i ile może to kosztować, a co kwartał ocenia wyniki. Kierownik zakładu wybiera system zamówień, uczy ludzi i co miesiąc raportuje, jak idzie. Ona wyznacza kierunek i ocenia (Ład), on planuje i wykonuje (Zarządzanie).","urzad":"Rada gminy z wójtem decydują, że gmina cyfryzuje obsługę mieszkańców, i co pół roku oceniają postępy. Sekretarz i kierownicy wydziałów planują wdrożenie, wybierają systemy i pilnują codziennej pracy. Decyzja i nadzór to Ład, wykonanie to Zarządzanie.","it":"W EDM03 (Zapewnienie optymalizacji ryzyka) zarząd ustala apetyt na ryzyko IT i monitoruje, czy nie jest przekraczany. W APO12 (Zarządzanie ryzykiem) kierownictwo identyfikuje, analizuje i obsługuje konkretne ryzyka w tych granicach i raportuje wyniki do Ładu.","egz":"Kolejność: Oszacuj → Kieruj → Planuj → Twórz → Wykonuj → Monitoruj (MEA) → Monitoruj (EDM) (Ilustracja 15). Zarządzanie działa zgodnie z kierunkiem organu Ładu, aby osiągnąć cele organizacji. Egzamin: „Oddzielenie Ładu od Zarządzania”. Podręcznik: „Oddzielenie nadzoru od zarządzania”. Nie myl z: Ład – Ład to jedna ze stron rozdziału.; Zarządzanie – Zarządzanie to druga strona.","src":"COBIT 5 Framework (PL), s. 31, 32"},"it-portfel":{"t":"Portfel","eg":"Portfel","pd":"Portfel inwestycyjny","en":"Portfolio","wyj":"Lista wszystkich projektów i programów, na które organizacja wydaje albo chce wydać pieniądze.\n\nWszystkie pomysły i trwające projekty trafiają na jedną listę. Kierownictwo porównuje koszty, korzyści i ryzyko. Wybiera, co uruchomić, co kontynuować, a co zatrzymać. Listę przegląda się regularnie.\n\nŻeby organizacja wydawała ograniczone pieniądze na to, co daje jej najwięcej korzyści przy akceptowalnym ryzyku.","zycie":"Rodzina ma 20 000 zł oszczędności i trzy pomysły: nowe auto, remont łazienki, kurs dla córki. Porównuje i wybiera łazienkę i kurs – to zarządzanie domowym portfelem.","firma":"Zarząd szpitala przegląda co kwartał listę 12 projektów IT. Dwa zatrzymuje, bo przestały być potrzebne, a pieniądze przenosi na bezpieczeństwo danych.","urzad":"Urząd marszałkowski ma na liście 15 projektów IT, m.in. nową stronę, e-usługi dla przedsiębiorców i wymianę serwerów. Zarząd województwa co pół roku przegląda całą listę i porównuje koszty, korzyści i ryzyko. Jeden projekt wstrzymuje, a zaoszczędzone pieniądze przesuwa na e-usługi.","it":"APO05 Zarządzanie portfelem projektów; definicja portfela inwestycyjnego w słowniku FW-PL (s. 92).","egz":"APO05 Zarządzanie Portfelem (Manage Portfolio). Kolejność do zapamiętania: portfel zawiera programy, a programy zawierają projekty. Nie myl z: Program – Program to kilka projektów dla jednego celu. Portfel to wszystkie inwestycje organizacji naraz – wiele programów i projektów.; Projekt – Projekt to jedno przedsięwzięcie. Portfel to lista wszystkich przedsięwzięć, spośród których się wybiera.","src":"COBIT 5 Framework (PL), s. 31, 33, 92"},"cykl-faza-1":{"t":"Planowanie","eg":"Planowanie","pd":"Planowanie (obejmuje opracowanie oraz wybór koncepcji)","en":"Plan (enabler life-cycle phase 1)","wyj":"Pierwszy krok w życiu rzeczy: wymyślasz kilka pomysłów i wybierasz ten, który zrobisz.\n\nOpracowujesz kilka koncepcji aktywatora. Porównujesz je z celem, np. z korzyścią, ryzykiem i kosztem. Wybierasz jedną i dopiero wtedy przechodzisz do projektowania.\n\nŻeby aktywator powstał z przemyślanego wyboru, a nie z przypadku.","zycie":"Rodzina chce psa. Najpierw rozważacie: duży czy mały, ze schroniska czy z hodowli, kto będzie go wyprowadzał. Wybieracie małego psa ze schroniska. To faza planowania: pomysły i wybór.","firma":"Właściciel sklepu chce przyjmować płatności BLIK. Porównuje trzy rozwiązania: terminal, bramkę płatności w sklepie internetowym, aplikację. Wybiera bramkę. To faza planowania aktywatora.","urzad":"Urząd miasta chce skrócić kolejki w wydziale komunikacji. Kierownik rozważa system numerków, zapisy przez Internet albo dodatkowe okienko. Wybiera zapisy przez Internet. Ten wybór koncepcji to faza planowania.","it":"Przy nowym systemie kierownictwo IT porównuje warianty: budowa, zakup albo usługa w chmurze. Takie decyzje inwestycyjne wspiera m.in. APO05 (Zarządzanie portfelem projektów) (interpretacja kursu).","egz":"Faza 1 = Planowanie: opracowanie i wybór koncepcji. Egzaminacyjnej nazwy PL faz cyklu życia aktywatora nie potwierdziliśmy (brak w SP1 i w zestawieniu Altkom). Używamy nazwy z FW-PL (s. 29, il. 13). „Planowanie” aktywatora to nie domena APO („Dostosuj, Planuj i Organizuj”) ani „Planuj” z PBRM, ani faza 4 wdrożenia (Planowanie programu). Egzaminacyjnej nazwy PL faz cyklu życia aktywatora nie potwierdziliśmy (brak w SP1 i w zestawieniu Altkom). Używamy nazwy z FW-PL (s. 29, il. 13). Nie myl z: Dostosuj, Planuj i Organizuj (APO) – APO (Dostosuj, Planuj i Organizuj) to domena procesów Zarządzania. Faza 1 to etap życia jednego aktywatora.; Planuj, Twórz, Wykonuj i Monitoruj – „Planuj” w Planuj, Twórz, Wykonuj i Monitoruj to obszar działań Zarządzania, a nie faza życia aktywatora.; Faza 4 wdrożenia „Co trzeba zrobić?” (Planowanie programu) – To faza programu wdrażania COBIT 5 (7 faz). Faza 1 cyklu życia aktywatora to wybór koncepcji jednego aktywatora.","src":"COBIT 5 Framework (PL), s. 28, 29"},"informacja":{"t":"Informacja","eg":"Informacja","pd":"Informacje","en":"Information (enabler 5)","wyj":"Wszystko, co wiemy i zapisujemy, od numeru telefonu po raport, i co komuś do czegoś służy.\n\nInformacja (Information) to piąty z 7 aktywatorów i obejmuje wszystkie informacje w organizacji, nie tylko te w systemach. Ma interesariuszy w rolach wytwórcy (producer), opiekuna (custodian) i konsumenta (consumer), własny cykl życia i kryteria jakości: wewnętrznej, kontekstowej oraz bezpieczeństwa i dostępności. Opisuje się ją też w 6 warstwach atrybutów, od fizycznej po społeczną.\n\nŻeby organizacja traktowała informację jak zasób, o który trzeba dbać: wytwarzać ją, przechowywać, chronić i udostępniać tym, którzy jej potrzebują.","zycie":"Mama dzwoni, że w czwartek nie odbierze dzieci ze szkoły, na lodówce wisi plan lekcji, a szkoła przysyła SMS o skróconych zajęciach. Żadna z tych wiadomości nie siedzi w komputerze, a mimo to wszystkie są informacją, od której zależy, kto i o której jedzie po dzieci. Jeśli nikt jej nie przeczyta i nie zareaguje, nic z niej nie wynika – to cecha aktywatora Informacja.","firma":"Piekarz zapisuje w zeszycie, ile chleba zostało wieczorem, kasa drukuje raport sprzedaży, a sprzedawczyni mówi, o co pytali klienci. Z tego wszystkiego właścicielka planuje jutrzejszy wypiek. Piekarz informację tworzy, zeszyt i kasa ją przechowują, a właścicielka z niej korzysta – to role wokół aktywatora Informacja.","urzad":"W szkole sekretarka prowadzi rejestr uczniów, wychowawca wpisuje oceny do dziennika, a dyrektor na radzie pedagogicznej słyszy ustnie o kłopotach w klasie 3b. Wszystko to jest informacja, także to, czego nie ma w żadnym systemie. Coś z niej wynika dopiero wtedy, gdy dyrektor na tej podstawie organizuje pomoc dla klasy.","it":"Dane kontaktowe klientów w systemie CRM to aktywator Informacja: klient podaje je przy zakładaniu konta (wytwórca), administrator utrzymuje bazę (opiekun), a konsultant korzysta z niej przy obsłudze (konsument). Nieaktualny numer to błąd jakości informacji, przez który powiadomienie nie dotarło.","egz":"Informacja jest jedną ze zdolności do świadczenia usług, a zdolności te wykorzystuje się poprzez procesy, by świadczyć usługi (s. 86). Procesy wymagają informacji jako wejścia i wytwarzają ją jako wyjście (s. 71). Nie myl z: Dane – Dane to surowe fakty. Informacja to dane przetworzone i mające znaczenie.","src":"COBIT 5 Framework (PL), s. 81, 86"},"it-dane":{"t":"Dane","eg":"Dane","pd":"dane","en":"Data","wyj":"Zapisane liczby, słowa, znaki, zdjęcia czy dźwięki – jeszcze bez wyjaśnienia, co znaczą.\n\nKtoś wpisuje albo urządzenie zapisuje fakt, np. numer telefonu. Komputer przechowuje go jako dane. Gdy dane zestawimy z wyjaśnieniem („to numer klienta, który zgłosił reklamację”), powstaje informacja.\n\nŻeby zapisać fakty raz i móc z nich korzystać wiele razy: liczyć, porównywać, wysyłać.","zycie":"Na paragonie widzisz „4,99” i „12.05”. To dane. Informacją stają się, gdy wiesz: „4,99 zł zapłaciłam 12 maja za chleb”.","firma":"Sklep internetowy zbiera dane o zamówieniach: datę, kwotę, adres. Dopiero zestawione pokazują, co sprzedaje się najlepiej.","urzad":"Rachmistrze GUS (Głównego Urzędu Statystycznego) zbierają w spisie powszechnym odpowiedzi: wiek, wykształcenie, liczbę pokoi w mieszkaniu. Każda odpowiedź to pojedyncza dana. Dopiero zestawione i opisane pokazują na przykład, ile rodzin w województwie mieszka w ciasnych mieszkaniach.","it":"Dane są surowcem aktywatora Informacja; COBIT 5 mówi o kontekście danych: dokładności, dostępności, aktualności i jakości (FW-PL s. 91).","egz":"Odróżnienie danych od informacji pomaga zrozumieć aktywator Informacja i jakość informacji (dzień 3). Na egzaminie słowo „dane” rzadko pada samodzielnie. Nie myl z: Informacja – Dane to zapisane fakty. Informacja to dane, które coś komuś mówią w danej sytuacji.; Plik – Plik to „pojemnik” na dane w komputerze. Dane to jego zawartość.","src":"COBIT 5 Framework (PL), s. 91"},"raci":{"t":"Diagram RACI","eg":"Diagram RACI","pd":"Tabela RACI","en":"RACI chart","wyj":"Tabela, która dla każdego zadania mówi: kto robi, kto odpowiada, kogo pytamy, kogo informujemy.\n\nDiagram RACI (RACI chart; w podręczniku: tabela RACI) ma w wierszach praktyki procesu, a w kolumnach role i struktury organizacyjne. W każdej komórce stoi litera: R (Responsible) – wykonuje, A (Accountable) – odpowiada za sukces, C (Consulted) – dostarcza wejścia, komunikacja dwukierunkowa, I (Informed) – otrzymuje informacje, komunikacja jednokierunkowa. Przy jednej praktyce powinien być tylko jeden A (praktyka tabel RACI – interpretacja kursu; FW-PL nie formułuje tej reguły).\n\nŻeby przy każdej czynności było jasne, kto ją wykonuje, kto ostatecznie za nią odpowiada, kogo trzeba zapytać i kogo poinformować, i żeby żadne zadanie nie zostało bez właściciela.","zycie":"Przy remoncie mieszkania ekipa kładzie płytki (R), a Ty jako inwestor płacisz i odpowiadasz za cały remont (A). Przed kuciem ścian uzgadniasz godziny z sąsiadem zza ściany (C), a administratora budynku tylko zawiadamiasz, kiedy będzie hałas (I). Tak wygląda RACI: jeden robi, jeden odpowiada, z jednym rozmawiasz, drugiemu dajesz znać.","firma":"Sklep internetowy przygotowuje promocję na Black Friday. Grafik robi banery (R), kierowniczka marketingu odpowiada za wynik akcji (A), księgowa mówi, jakie rabaty się opłacają (C). Magazyn dostaje maila z terminem, żeby przygotował towar (I).","urzad":"W wydziale budownictwa starostwa inspektor przygotowuje decyzję (R), a naczelnik wydziału ją podpisuje i za nią odpowiada (A). Radca prawny wcześniej opiniuje projekt (C), a wójt gminy, na której terenie ma stanąć budynek, dostaje kopię do wiadomości (I).","it":"COBIT 5 podaje dla każdej praktyki wzorcową tabelę RACI, którą organizacja dostosowuje. Dla praktyki DSS02.05 (rozwiązywanie incydentów i przywracanie usług) organizacja może wpisać: kierownik ds. usług IT – A, zespół wsparcia – R, właściciel procesu biznesowego – C, użytkownicy – I.","egz":"„Ktoś, kto dostaje zadanie do wykonania” → R (odpowiedzialny wykonawczo). „Odpowiada za sukces” → A (odpowiedzialny decyzyjnie). „Dostarcza wejścia” → C (rola konsultanta). „Otrzymuje informacje” → I. R po polsku na egzaminie to „Odpowiedzialny wykonawczo”, czyli ten, kto wykonuje. A to „Odpowiedzialny decyzyjnie”, czyli ten, kto odpowiada za sukces. Obie nazwy zaczynają się od „odpowiedzialny” – rozróżnia je drugie słowo. Podręcznik: „strona odpowiedzialna” (R) i „strona rozliczana” (A). Nie myl z: Role, działania i relacje – Ilustracja 9 to ogólne relacje w systemie Ładu. RACI przypisuje role do konkretnych praktyk procesu.","src":"COBIT 5 Framework (PL), s. 89, 90, 92, 93"},"rola-kierownictwo":{"t":"Kierownictwo","eg":"Kierownictwo","pd":"Zarządzanie (podpis roli na Ilustracji 9)","en":"Management","wyj":"Kierownicy, którzy dostają kierunek od szefostwa, rozdzielają pracę ludziom i pilnują, czy organizacja osiąga cele.\n\nKierownictwo dostaje kierunek od organu Ładu. Instruuje i dopasowuje role operacyjne i odbiera ich raporty – między kierownictwem a rolami operacyjnymi są tylko te dwie relacje (FW-PL s. 24, Il. 9). Strzałka monitorowania łączy kierownictwo z organem Ładu; według uzasadnień egzaminacyjnych to kierownictwo odpowiada wykonawczo za monitorowanie. Swoją pracę prowadzi w obszarze Planuj, Twórz, Wykonuj i Monitoruj.\n\nŻeby kierunek od organu Ładu zamienił się w konkretne zadania i żeby ktoś pilnował ich wykonania.","zycie":"Zarząd wspólnoty postanawia: w tym roku remont dachu. Administrator budynku wybiera firmę i ustala jej harmonogram. Firma raportuje administratorowi postępy, a on co miesiąc mówi zarządowi, czy remont idzie zgodnie z planem. Administrator to kierownictwo: instruuje i dopasowuje.","firma":"Rada spółki ustala: otwieramy czwarty sklep bez kredytu. Dyrektor zarządzający układa plan, rozdziela zadania kierownikom i co tydzień patrzy na raporty sprzedaży. To kierownictwo z Ilustracji 9.","urzad":"Rada gminy uchwala strategię e-usług. Sekretarz gminy rozdziela zadania wydziałom, dopasowuje grafik informatyków i co miesiąc zdaje radzie gminy relację z postępów. Sekretarz działa jako kierownictwo.","it":"Kierownictwo IT mierzy, czy IT osiąga cele, m.in. w procesie MEA01 (Monitorowanie, ocena i oszacowanie wydajności i zgodności) z domeny MEA, i raportuje wyniki organowi Ładu.","egz":"„Kto instruuje i dopasowuje role operacyjne?” → Kierownictwo. Kto odpowiada wykonawczo za monitorowanie w rolach z Ilustracji 9? Według uzasadnień egzaminacyjnych także Kierownictwo, a nie organ Ładu. Podręcznikowy podpis „Zarządzanie” na Ilustracji 9 to ta sama rola. Na Ilustracji 9 podręcznik podpisuje tę rolę „Zarządzanie”, a egzamin mówi „Kierownictwo” (tę formę podręcznik ma też w nagłówku na s. 31). W uzasadnieniach egzaminacyjnych to kierownictwo odpowiada wykonawczo za monitorowanie, a nie organ Ładu. Nie myl z: Organ Ładu i nadzoru – Organ Ładu wyznacza kierunek i jest rozliczany przed interesariuszami. Kierownictwo realizuje kierunek, instruuje i dopasowuje role operacyjne i odpowiada wykonawczo za monitorowanie osiągania celów.; Zarządzanie – Zarządzanie to obszar działań (PBRM, 32 procesy). Kierownictwo to rola z Ilustracji 9, czyli ludzie, którzy te działania prowadzą.; Oszacuj, Kieruj i Monitoruj (EDM) – „Monitoruj” w EDM to praktyka procesów Ładu: Ład monitoruje sprawność i zgodność względem kierunku (s. 14). W pytaniu o role z Ilustracji 9 egzamin wiąże monitorowanie z kierownictwem.","src":"COBIT 5 Framework (PL), s. 14, 24, 31"},"lad":{"t":"Ład","eg":"Ład","pd":"Nadzór","en":"Governance","wyj":"Szefostwo decyduje, po co i co robimy, i pilnuje, czy idziemy w dobrą stronę.\n\nOrgan Ładu, zwykle zarząd pod przewodnictwem prezesa, ocenia potrzeby, warunki i opcje interesariuszy (Evaluate), ustala priorytety i podejmuje decyzje (Direct), a potem monitoruje sprawność i zgodność z wyznaczonym kierunkiem (Monitor). Wyniki z Zarządzania wracają do Ładu i cykl się powtarza.\n\nŻeby informatyka robiła to, czego potrzebuje cała organizacja, a nie tylko to, co umieją informatycy.","zycie":"Wspólnota mieszkaniowa na zebraniu rocznym ocenia stan budynku i decyduje: w tym roku najpierw dach, elewacja dopiero za dwa lata, a zarządca co kwartał pokazuje wydatki. Wyboru dekarza i pilnowania ekipy zebranie już nie robi – to robota zarządcy. Ocenić, wyznaczyć kierunek, monitorować: to jest Ład.","firma":"Właścicielka restauracji raz na kwartał siada z wynikami i decyduje: celujemy w rodziny z dziećmi, marża ma wynosić co najmniej 20%, a za trzy miesiące sprawdzamy, czy to działa. Co i jak gotować każdego dnia, ustala już szef kuchni. Ona sprawuje Ład, on zarządza.","urzad":"Rada gminy przyjmuje strategię cyfryzacji: najpierw e-usługi dla mieszkańców, potem nowy system księgowy. Ustala na to budżet i co pół roku każe sobie przedstawić, co zrobiono. Wybór dostawcy i prowadzenie wdrożenia zostawia urzędowi – rada sprawuje Ład, a nie zarządza projektem.","it":"W EDM03 (Zapewnienie optymalizacji ryzyka) zarząd ocenia ryzyko IT, ustala apetyt na ryzyko i monitoruje, czy organizacja go nie przekracza.","egz":"Zapamiętaj czasowniki: Ład = Oszacuj, Kieruj, Monitoruj (EDM); odpowiada zarząd pod przewodnictwem prezesa (EN: chairperson – przewodniczący rady/zarządu, nie CEO). Zarządzanie = Planuj, Twórz, Wykonuj, Monitoruj; odpowiada kierownictwo pod przewodnictwem CEO. Egzamin PL: „Ład”. Podręcznik PL: „Nadzór”. EN: Governance. To jedno i to samo pojęcie. Słowo „nadzór” w pytaniu egzaminacyjnym może też pojawić się w zbitce „ład i nadzór”. Nie myl z: Zarządzanie – Zarządzanie (management) planuje, buduje, uruchamia i monitoruje działania ZGODNIE z kierunkiem wyznaczonym przez Ład.; Nadzór w znaczeniu kontroli / inspekcji – Polskie „nadzór” kojarzy się z kontrolą. W COBIT to coś szerszego: także wyznaczanie kierunku i ustalanie priorytetów.; Ład korporacyjny (enterprise governance) – Ład nad IT w organizacji (GEIT) jest CZĘŚCIĄ ładu korporacyjnego (Zasada 2).","src":"COBIT 5 Framework (PL), s. 14, 91"},"aktywator":{"t":"Aktywator","eg":"Aktywator","pd":"Czynnik umożliwiający","en":"Enabler","wyj":"Wszystko, co musi zagrać, żeby informatyka działała dobrze: ludzie, reguły, narzędzia, informacje.\n\nCOBIT 5 dzieli aktywatory (enablers) na 7 kategorii, od Zasad, polityk i struktur ramowych (Principles, Policies and Frameworks) po Ludzi, umiejętności i kompetencje (People, Skills and Competencies). Kaskada celów wyznacza, czego oczekujemy od każdego aktywatora (cele aktywatora). Aktywatory są od siebie zależne i dostarczają sobie wejść, np. proces potrzebuje informacji i przeszkolonych ludzi. Każdy opisuje się w 4 wymiarach: interesariusze, cele, cykl życia, dobre praktyki.\n\nŻeby organizacja widziała wszystko, co musi zagrać, by osiągnąć cele, a nie tylko technologię. Aktywatory to elementy, przez które Ład i Zarządzanie realnie wpływają na wynik.","zycie":"Chcesz, żeby dzieci same odrabiały lekcje. Ustalacie zasadę „najpierw zadania, potem tablet”, stałą godzinę po obiedzie, kupujecie biurko z lampką, a Ty w tym czasie też siadasz z książką zamiast z telefonem. Zasada, stała pora, biurko i Twój przykład to różne aktywatory – działają dopiero razem.","firma":"Właścicielka kawiarni chce, żeby kawa smakowała tak samo na każdej zmianie. Spisuje recepturę, ustala kolejność parzenia, szkoli nowego baristę i oddaje ekspres do serwisu. Receptura, sposób parzenia, umiejętności baristy i ekspres to aktywatory – brak jednego psuje całość.","urzad":"Urząd gminy chce wydawać decyzje w terminie. Ma instrukcję kancelaryjną, ustalony obieg wniosku, wydział, który za sprawę odpowiada, system EZD i urzędników po szkoleniu z KPA. Każdy z tych elementów to aktywator innej kategorii.","it":"Proces DSS04 Zarządzanie ciągłością to aktywator z kategorii Procesy, ale działa tylko razem z innymi: polityką ciągłości (Zasady, polityki i struktury ramowe), aktualnym planem awaryjnym (Informacja), stanowiskiem zapasowym (Usługi, infrastruktura i aplikacje) i przećwiczonym zespołem (Ludzie, umiejętności i kompetencje).","egz":"Pułapka terminologiczna nr 1 obok Ład/Nadzór. Liczba kategorii: 7. Liczba zasad: 5. Liczba procesów: 37. Egzamin: „Aktywator”. Podręcznik: „Czynnik umożliwiający”. EN: Enabler. W pytaniach egzaminacyjnych prawie zawsze pada „Aktywator”. Nie myl z: Czynnik wpływający na potrzeby interesariuszy – Wyznacznik zmienia potrzeby; aktywator pomaga je zaspokoić.; Komponent (COBIT 2019) – W COBIT 2019 aktywatory nazwano „komponentami systemu ładu”. Na egzaminie COBIT 5 używaj „aktywator”.","src":"COBIT 5 Framework (PL), s. 14, 91"}},"S":[{"pt":"Lekcja 1.42","h":"Zasada 5: Ład i Zarządzanie różnią się działaniami, strukturami i celami","b":"<p><w k=\"zasada-5\">Oddzielenie Ładu od Zarządzania<\/w> <span class=\"en\">Separating <w k=\"lad\">Governance<\/w> From <w k=\"rola-kierownictwo\">Management<\/w><\/span><\/p><ul><li>inne <b><w k=\"dzialanie-procesu\">działania<\/w><\/b><\/li><li>inne <b><w k=\"struktury-organizacyjne\">struktury organizacyjne<\/w><\/b><\/li><li>inne <b>cele<\/b><\/li><\/ul><p>Oddziela się role, nie kontakt.<\/p>","c":"Zasada 5 rozdziela dwie dziedziny, ale nie przerywa ich współpracy: kierunek idzie w dół, raporty wracają w górę.","s":"COBIT 5 Framework (PL), s. 31","ctx":"<p>Podręcznikowa nazwa to „Oddzielenie nadzoru od zarządzania”; na egzaminie wybieraj „Oddzielenie Ładu od Zarządzania”. Trójka różnic – działania, struktury, cele – to ulubiony materiał pytań. Za Ład odpowiada zwykle zarząd z prezesem, za Zarządzanie kadra zarządzająca z dyrektorem generalnym (CEO).<\/p><p>Trzy błędne odczytania zasady: Ład nie jest „wyższym piętrem” Zarządzania; oddzielenie nie oznacza braku rozmów; o przynależności nie decyduje nazwa stanowiska, lecz zakres decyzji. Jako przykładowe decyzje struktur Ładu podręcznik podaje portfel inwestycyjny i apetyt na ryzyko.<\/p><p>Przykład: zarząd ubezpieczyciela ustala, że priorytetem jest zgłaszanie szkód przez internet, i określa, ile ryzyka przestojów zniesie. Dyrektor IT wybiera dostawcę chmury, prowadzi wdrożenie i co miesiąc raportuje wyniki. Zarząd nie wybiera dostawcy, dyrektor IT nie ustala apetytu na ryzyko.<\/p>"},{"pt":"Sprawdź się","quiz":{"tresc":"Czym według COBIT 5 różnią się Ład (<em>Governance<\/em>) i Zarządzanie (<em>Management<\/em>)?","opcje":[{"t":"Mają działania o innym charakterze, inne struktury i inne cele","ok":true,"w":"Dobrze. FW-PL s. 31: każda dziedzina obejmuje działania o odmiennym charakterze, wymaga różnych struktur organizacyjnych i służy innym celom."},{"t":"Nadzór to kontrola, a Ład to kierunek – dwie różne dziedziny","w":"„Nadzór” to podręcznikowe tłumaczenie Governance, czyli to samo co Ład."},{"t":"Ład to wyższy szczebel Zarządzania, z tymi samymi działaniami","w":"Fałsz. Ład to inna dziedzina, a nie wyższe piętro tej samej pracy."},{"t":"Ład dotyczy tylko IT, a Zarządzanie całej firmy i jej finansów","w":"Fałsz. Obie dziedziny dotyczą przedsiębiorstwa i jego IT."}],"src":"COBIT 5 Framework (PL), s. 31","pomoc":{"t":"Pytanie dotyczy lekcji 1.42 „Zasada 5 – Oddzielenie Ładu od Zarządzania”. Cel lekcji: Potrafię powiedzieć, czym według zasady 5 różnią się Ład i Zarządzanie i kto w organizacji za nie odpowiada.","k":[]}}},{"pt":"Lekcja 1.43","h":"Na egzaminie czynności mają tryb rozkazujący: EDM i PBRM","b":"<div class=\"tblwrap\"><table class=\"tbl\"><tr><th><\/th><th>podręcznik<\/th><th>egzamin<\/th><\/tr><tr><td><w k=\"edm\">EDM<\/w> – Ład<\/td><td>ocena, kierowanie, monitorowanie<\/td><td><b>Oszacuj, Kieruj, Monitoruj<\/b><\/td><\/tr><tr><td><w k=\"pbrm\">PBRM<\/w> – <w k=\"zarzadzanie\">Zarządzanie<\/w><\/td><td><w k=\"cykl-faza-1\">planowanie<\/w>, budowanie, uruchamianie, monitorowanie<\/td><td><b>Planuj, Twórz, Wykonuj, Monitoruj<\/b><\/td><\/tr><\/table><\/div><p>Zarządzanie działa zgodnie z kierunkiem od Ładu, <b>aby osiągnąć <w k=\"cele-organizacji\">cele organizacji<\/w><\/b>.<\/p>","c":"Ład ma trzy czynności, Zarządzanie cztery – zapamiętaj formy egzaminacyjne i angielskie skróty.","s":"COBIT 5 Framework (PL), s. 14, 31–32","ctx":"<p>EDM to <span class=\"en\">Evaluate, Direct and Monitor<\/span>, PBRM to <span class=\"en\">Plan, Build, Run and Monitor<\/span>. Podręcznik mówi, że w każdym z pięciu procesów Ładu zdefiniowano praktyki oceny, kierowania i monitorowania. Kolejność ma sens: Oszacuj przed decyzją, Kieruj to decyzja, Monitoruj po niej.<\/p><p>Pełna definicja (s. 14 i 31): „Zarządzanie polega na planowaniu, budowaniu, realizacji i monitorowaniu działań w sposób spójny z kierunkiem wskazanym przez organ nadzorujący, aby osiągnąć cele przedsiębiorstwa”. Na egzaminie „cele przedsiębiorstwa” to <b>cele organizacji<\/b>. Definicja Ładu też na nich się opiera: Ład ocenia potrzeby interesariuszy, by ustalić zrównoważone, uzgodnione cele organizacji, wyznacza kierunek priorytetami i decyzjami oraz monitoruje sprawność i zgodność. Obie definicje wskazują ten sam poziom Kaskady Celów – nie cele związane z Informatyką ani Cele aktywatora.<\/p><p>Pułapka: <span class=\"en\">Build<\/span> to w podręczniku „budowanie”, na egzaminie „Twórz” (w zestawieniu Altkom także „Wytwarzaj”); <span class=\"en\">Run<\/span> to „uruchamianie” lub „realizacja”, na egzaminie „Wykonuj”. Czasowniki PBRM nie są nazwami domen – domeny mają nazwy trzyczłonowe, np. „Dostosuj, Planuj i Organizuj”.<\/p><p>Przykład: rada uczelni i rektor porównują oferty e-dziekanatu (Oszacuj), wybierają priorytet i budżet (Kieruj), co semestr sprawdzają efekty (Monitoruj). Dział IT planuje projekt, kupuje i konfiguruje system, obsługuje go i mierzy awarie (PBRM).<\/p>"},{"pt":"Sprawdź się","quiz":{"tresc":"Jak egzamin PL nazywa czynności Zarządzania <em>Plan, Build, Run and Monitor<\/em> (PBRM)?","opcje":[{"t":"Dostosuj – Planuj – Organizuj","w":"To nazwa jednej domeny Zarządzania (APO), a nie czterech czynności."},{"t":"Planuj – Twórz – Wykonuj – Monitoruj","ok":true,"w":"Dobrze. To forma egzaminacyjna PL (zestawienie Altkom)."},{"t":"Oszacuj – Kieruj – Monitoruj","w":"To czynności Ładu (EDM), a nie Zarządzania."},{"t":"Planowanie – Budowanie – Uruchamianie – Monitorowanie","w":"To forma podręcznikowa. Na egzaminie szukaj „Twórz” i „Wykonuj”."}],"src":"COBIT 5 Framework (PL), s. 32","pomoc":{"t":"Pytanie dotyczy lekcji 1.43 „Czynności Ładu (EDM) i Zarządzania (PBRM)”. Cel lekcji: Potrafię wymienić egzaminacyjne nazwy trzech czynności Ładu i czterech czynności Zarządzania oraz przypisać do nich przykład.","k":["edm","pbrm"]}}},{"pt":"Arkusz próbny","sp1":"sp1-42","lekcja":"1.43","temat":"Czynności Ładu (EDM) i Zarządzania (PBRM)","k":["edm","pbrm"]},{"pt":"Lekcja 1.44","h":"Kierunek płynie w dół, informacje zwrotne wracają w górę – dwa różne „Monitoruj”","b":"<p>Potrzeby biznesowe → <b>Oszacuj → Kieruj<\/b> → Planuj → Twórz → Wykonuj → <b>Monitoruj (MEA)<\/b> → <w k=\"informacja\">informacje<\/w> zwrotne → <b>Monitoruj (Ład)<\/b><\/p><ul><li>Ład: czy kierunek wcielono w życie<\/li><li>MEA: jak idzie bieżąca praca<\/li><\/ul>","c":"Raport Zarządzania sam niczego nie zmienia – zmienia go dopiero decyzja Ładu, która zamyka obieg.","s":"COBIT 5 Framework (PL), s. 32, Ilustracja 15, przypis 5","ctx":"<p>Ilustracja 15 (na egzaminie Rysunek 15) pokazuje zamknięte koło: Ład ocenia potrzeby i kieruje, Zarządzanie w obszarach Planowanie (APO), Budowanie (BAI), Uruchamianie (DSS) i Monitorowanie (MEA) wykonuje pracę, a „informacje zwrotne dotyczące zarządzania” wracają do Ładu, który znów ocenia.<\/p><p>Najczęstsza pomyłka: <w k=\"mea\">MEA<\/w> to domena <b>Zarządzania<\/b>. Przypis podręcznika mówi, że w Ładzie monitorowanie to sprawdzanie, „w jakim stopniu określony kierunek wytyczony dla zarządzania został wcielony w życie”. Pytanie o kierunek i decyzje zarządu – Ład; o bieżące wyniki i zgodność procesów – MEA.<\/p><p>Przykład: dział IT banku raportuje dostępność aplikacji i postęp projektów (MEA). Zarząd porównuje to z decyzją „aplikacja mobilna głównym kanałem sprzedaży”, widzi opóźnienie i przesuwa budżet (Monitoruj, potem znów Oszacuj i Kieruj).<\/p>"},{"pt":"Sprawdź się","quiz":{"tresc":"Która kolejność opisuje obieg między Ładem a Zarządzaniem (Rysunek 15)?","opcje":[{"t":"Planuj → Oszacuj → Kieruj → Twórz → Wykonuj → Monitoruj (Ład) → Monitoruj (MEA)","w":"Obieg zaczyna się od potrzeb biznesowych i oceny w Ładzie, a nie od planowania."},{"t":"Oszacuj → Kieruj → Monitoruj (Ład) → Planuj → Twórz → Wykonuj → Monitoruj (MEA)","w":"Ład monitoruje na podstawie informacji zwrotnych, więc jego monitorowanie jest na końcu obiegu."},{"t":"Oszacuj → Kieruj → Planuj → Twórz → Wykonuj → Monitoruj (MEA) → Monitoruj (Ład)","ok":true,"w":"Dobrze. Kierunek płynie z Ładu do Zarządzania, a informacje zwrotne wracają do monitorowania Ładu."},{"t":"Kieruj → Oszacuj → Planuj → Wykonuj → Twórz → Monitoruj (MEA) → Monitoruj (Ład)","w":"Najpierw jest ocena, potem decyzja. Twórz musi też być przed Wykonuj."}],"src":"COBIT 5 Framework (PL), s. 32","pomoc":{"t":"Pytanie dotyczy lekcji 1.44 „Obieg między Ładem a Zarządzaniem – dwa „Monitoruj””. Cel lekcji: Potrafię opisać obieg od potrzeb biznesowych do informacji zwrotnych i odróżnić monitorowanie w Ładzie od monitorowania w Zarządzaniu.","k":[]}}},{"pt":"Arkusz próbny","sp1":"sp1-23","lekcja":"1.44","temat":"Obieg między Ładem a Zarządzaniem – dwa „Monitoruj”","k":[]},{"pt":"Lekcja 1.45","h":"Ład i Zarządzanie łączy wszystkie siedem aktywatorów","b":"<ul><li>procesy – osobne procesy obu stron, diagramy RACI<\/li><li>polityki – zamieniają decyzje Ładu w reguły<\/li><li>struktury Ładu – <w k=\"it-portfel\">portfel<\/w> i apetyt na <w k=\"ryzyko\">ryzyko<\/w><\/li><li>kultura – ustalana odgórnie, przez przykład<\/li><li><w k=\"informacja\">informacje<\/w>, ludzie, usługi – <w k=\"it-dane\">dane<\/w> i kompetencje dla obu stron<\/li><\/ul>","c":"Interakcje Ładu i Zarządzania opisuje się aktywator po aktywatorze, a raporty są tylko jednym z kanałów.","s":"COBIT 5 Framework (PL), s. 31, Ilustracja 14","ctx":"<p>Podręcznik: skoro Ład ocenia, kieruje i monitoruje, potrzebny jest „zbiór interakcji między nadzorem i zarządzaniem”, aby system Ładu był skuteczny. Ilustracja 14 (na egzaminie Rysunek 14) opisuje je przez siedem <w k=\"aktywator\">aktywatorów<\/w>: informacje są wymieniane jako wejścia i wyniki procesów, usługi i aplikacje dostarczają Ładowi danych, a kluczową kompetencją obu stron jest rozumienie różnicy między ich zadaniami.<\/p><p>Pułapki: łącznikiem nie są wyłącznie raporty; połączenie działa w obie strony; polityka napisana przez dział IT bez decyzji Ładu nie jest interakcją, tylko regułą wewnętrzną Zarządzania. Kultura to „przywództwo przez dawanie przykładu”.<\/p><p>Przykład: rada nadzorcza szpitala decyduje o w pełni elektronicznej dokumentacji. Polityka szpitala zamienia to w regułę, proces wdrożenia ma tabelę <w k=\"raci\">RACI<\/w>, a system raportowy co kwartał pokazuje radzie postęp.<\/p>"},{"pt":"Sprawdź się","quiz":{"tresc":"Które zdanie o interakcjach między Ładem a Zarządzaniem (Rysunek 14) jest prawdziwe?","opcje":[{"t":"Oddzielenie oznacza, że Ład i Zarządzanie nie wymieniają informacji","w":"Fałsz. COBIT 5 wymaga zbioru interakcji między Ładem a Zarządzaniem."},{"t":"Interakcje opisuje się przez pięć procesów EDM, a nie przez aktywatory","w":"Ilustracja 14 opisuje interakcje przez siedem aktywatorów."},{"t":"Kulturę i zachowanie ustala się oddolnie, od pracowników","w":"Odwrotnie. FW-PL mówi, że zachowanie jest ustalane odgórnie, przez przykład."},{"t":"Struktury Ładu decydują np. o portfelu i apetycie na ryzyko","ok":true,"w":"Dobrze. FW-PL s. 31 podaje te decyzje jako przykład interakcji struktur Ładu z wdrożeniem."}],"src":"COBIT 5 Framework (PL), s. 31","pomoc":{"t":"Pytanie dotyczy lekcji 1.45 „Przez co Ład i Zarządzanie się łączą – siedem aktywatorów”. Cel lekcji: Potrafię podać, jak każdy z siedmiu aktywatorów łączy Ład z Zarządzaniem.","k":[]}}}]};</script>
