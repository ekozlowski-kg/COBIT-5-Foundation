<script>window.DECK={"id":"k-pc-iso","rozdzial":"Rozdział 8 · Model zdolności procesu · s. 41–45","tytul":"ISO/IEC 15504, ocena i przewodniki","prev":"k-pc-oceny.html","next":"k-en-zasady.html","T":{"wymiary-oceny":{"t":"Wymiar Procesu i Wymiar Zdolności","eg":"Wymiar Procesu i Wymiar Zdolności","pd":"Wskaźniki wydajności i wskaźniki potencjału","en":"Assessment dimensions: process and capability","wyj":"Dwie strony oceny: czy w ogóle robimy to, co trzeba, i jak dobrze tym kierujemy.\n\nModel oceny procesów zgodny z ISO/IEC 15504 ma dwa wymiary. Wymiar procesu (process dimension) bierze procesy z Referencyjnego Modelu Procesu (PRM) i bada wskaźniki wykonania: praktyki bazowe (base practices) i produkty pracy (work products); to decyduje o poziomie 1. Wymiar zdolności (capability dimension) bada atrybuty procesu na poziomach 1–5 za pomocą ogólnych (generic) praktyk, zasobów i produktów pracy.\n\nŻeby w ocenie procesu oddzielić dwa pytania: czy proces w ogóle osiąga swój cel i jak dobrze jest prowadzony.","zycie":"Oceniasz, jak sąsiad piecze chleb. Najpierw patrzysz, czy robi kolejne kroki – zaczyn, wyrabianie, pieczenie – i czy z pieca wychodzi chleb (wymiar procesu). Potem sprawdzasz, czy planuje wypieki, ma spisany przepis i porównuje efekty (wymiar zdolności). To dwa osobne wymiary jednej oceny.","firma":"Oceniający przychodzi do warsztatu i bierze pod lupę przyjmowanie aut do naprawy. Sprawdza, czy wykonuje się podstawowe kroki (oględziny, wycena, zlecenie) i czy powstaje karta zlecenia – to wymiar procesu: praktyki bazowe i produkty pracy. Potem pyta, czy proces jest planowany, taki sam u każdego mechanika i mierzony – to wymiar zdolności.","urzad":"Kontrola w starostwie ocenia proces wydawania praw jazdy. Najpierw sprawdza, czy urzędnik przyjmuje wniosek, weryfikuje go i wydaje dokument oraz czy zostaje ślad w systemie (wymiar procesu). Potem pyta, czy praca jest zaplanowana, ujednolicona i mierzona (wymiar zdolności, poziomy 1–5).","it":"Asesor ocenia DSS02 (Zarządzanie zgłoszeniami serwisowymi i incydentami). W wymiarze procesu sprawdza praktyki bazowe i produkty pracy, np. rejestr incydentów. W wymiarze zdolności ocenia atrybuty, np. PA 2.1 Zarządzanie wydajnością i PA 2.2 Zarządzanie produktami pracy, w skali N/C/W/P.","egz":"Z Referencyjnym Modelem Procesu wiąże się Wymiar Procesu, a nie wymiar zdolności. PRM określa wymiar procesu, który nakreśla strukturę 37 procesów. Nie myl z: Wymiary aktywatora – Wymiary aktywatora (interesariusze, cele, cykl życia, dobre praktyki) to model aktywatora, a nie ocena procesów.","src":"COBIT 5 Framework (PL), s. 42"},"pam":{"t":"Model Oceny Procesu (PAM)","eg":"Model Oceny Procesu (PAM)","pd":"Model oceny procesu (PAM)","en":"COBIT Process Assessment Model (PAM)","wyj":"Gruba instrukcja oceniania: co sprawdzać w każdej robocie, po czym to poznać i jaką skalą ocenić.\n\nPAM łączy wymiar procesu (procesy z PRM i ich wskaźniki wykonania) z wymiarem zdolności (poziomy, atrybuty i wskaźniki ogólne). Dodaje skalę N/C/W/P. Przewodniki opisują, jak z tego modelu korzystać.\n\nŻeby każda ocena procesów COBIT korzystała z tego samego modelu: tych samych procesów, atrybutów, wskaźników i skali.","zycie":"Regulamin konkursu tańca opisuje figury, kryteria i skalę punktów. Sędziowie i tancerze, którzy ćwiczą w domu, korzystają z tego samego regulaminu. Takim regulaminem dla oceny procesów jest PAM.","firma":"Sieć sklepów ma jeden „podręcznik oceny sklepu”: co sprawdzać, po czym poznać, jak punktować. Korzysta z niego audytor z centrali i kierownik sklepu przy samoocenie. To rola PAM.","urzad":"Urząd wojewódzki wydaje jedną metodykę oceny gmin: zakres, kryteria i skalę. Kontrolerzy i same gminy, które się przygotowują, korzystają z tej samej metodyki. Tak działa PAM.","it":"Asesor oceniający DSS02 bierze z PAM opis procesu i jego praktyki bazowe, wskaźniki dla 9 atrybutów i skalę N/C/W/P. Ten sam model posłuży do oceny APO12 czy BAI06.","egz":"PAM to podstawa oceny. Z PAM korzystają Przewodnik Asesora i Przewodnik Samooceny. PRM to tylko wymiar procesu. PAM (Model Oceny Procesu) to nie PRM (Referencyjny Model Procesu). PRM opisuje procesy, a PAM dokłada do nich atrybuty, wskaźniki i skalę. Skróty różnią się jedną literą. Nie myl z: Referencyjny Model Procesu – PRM to wzorcowa lista 37 procesów z opisami, czyli wymiar procesu. PAM zawiera PRM i dodaje wymiar zdolności.; Przewodnik Asesora – Przewodnik Asesora mówi, jak przeprowadzić formalną ocenę. PAM to model, według którego się ocenia.","src":"COBIT 5 Framework (PL), s. 41, 42"},"organ-ladu":{"t":"Organ Ładu i nadzoru","eg":"Organ Ładu i nadzoru","pd":"Organ nadzorujący","en":"Governing body","wyj":"Szef albo grupa na samej górze, np. zarząd, rada nadzorcza czy dyrektor urzędu, którzy decydują o kierunku.\n\nNa Ilustracji 9 właściciele i interesariusze delegują (delegate) uprawnienia organowi Ładu (governing body), a ten jest przed nimi rozliczany (accountable). Organ Ładu wyznacza kierunek (set direction) kierownictwu (management). Kierownictwo instruuje i dopasowuje (instruct and align) role operacyjne, które raportują (report) do kierownictwa (FW-PL s. 24, Il. 9). Strzałka monitorowania (monitor) łączy kierownictwo z organem Ładu; według uzasadnień egzaminacyjnych to kierownictwo odpowiada wykonawczo za monitorowanie. Sam organ Ładu też monitoruje, ale wyniki względem kierunku, który wyznaczył (EDM).\n\nŻeby było jasne, kto w imieniu właścicieli i interesariuszy sprawuje Ład: wyznacza kierunek kierownictwu i odpowiada za wyniki.","zycie":"Właściciele mieszkań na zebraniu wspólnoty wybierają zarząd i powierzają mu dbanie o budynek. Zarząd wyznacza kierunek – w tym roku dach – i każe administratorowi to załatwić, a administrator raportuje postępy. Na następnym zebraniu zarząd rozlicza się przed właścicielami: to on jest organem Ładu.","firma":"Właściciele rodzinnej sieci piekarni powołują radę, która raz na kwartał ustala, dokąd firma zmierza: otwieramy dwa nowe punkty, nie wchodzimy w catering. Dyrektor zarządzający dostaje ten kierunek i sam układa plan, a rada sprawdza wyniki i odpowiada przed właścicielami. Ta rada to organ Ładu.","urzad":"Mieszkańcy w wyborach powierzają radzie gminy pilnowanie spraw gminy. Rada uchwala strategię i budżet, wyznacza kierunek wójtowi i urzędowi, a potem rozlicza ich z wykonania; sama odpowiada przed mieszkańcami przy kolejnych wyborach. W tej scenie rada gminy pełni rolę organu Ładu.","it":"Zarząd jako organ Ładu w EDM01 (Zapewnienie i utrzymanie ładu korporacyjnego) ustala zasady podejmowania decyzji o IT, a w EDM05 (Zapewnienie przejrzystości dotyczącej interesariuszy) raportuje udziałowcom i regulatorom, jak IT realizuje cele. Plany i kierowanie pracą zespołów zostawia kierownictwu IT (APO, BAI, DSS, MEA).","egz":"Według uzasadnień egzaminacyjnych organ Ładu i nadzoru jest odpowiedzialny decyzyjnie (rozliczany) i wyznacza kierunek. Za monitorowanie osiągania celów odpowiada wykonawczo kierownictwo. Egzamin: „Organ Ładu i nadzoru”. Podręcznik: „Organ nadzorujący”. Nie myl z: Kierownictwo (management) – Kierownictwo realizuje kierunek, instruuje i dopasowuje role operacyjne i odpowiada wykonawczo za monitorowanie osiągania celów; organ Ładu wyznacza kierunek i jest rozliczany przed interesariuszami.","src":"COBIT 5 Framework (PL), s. 24"},"przewodnik-asesora":{"t":"Przewodnik Asesora","eg":"Przewodnik Asesora","pd":"Przewodnik osoby oceniającej","en":"COBIT Assessor Guide","wyj":"Instrukcja dla zawodowego oceniającego: jak sprawdzić robotę rzetelnie, na podstawie dowodów.\n\nKompetentny asesor planuje ocenę, zbiera dowody (dokumenty, rozmowy, obserwacje) i ocenia atrybuty według PAM. Każdą ocenę uzasadnia dowodem. Wynik może służyć raportowaniu wewnętrznemu albo zewnętrznemu.\n\nŻeby formalna ocena procesów była rzetelna, powtarzalna i oparta na dowodach, którym można zaufać.","zycie":"Rzeczoznawca wycenia mieszkanie do kredytu. Ogląda je, prosi o dokumenty, robi zdjęcia i pisze operat według ustalonej metody. Bank ufa wynikowi, bo oparto go na dowodach. Tak pracuje asesor.","firma":"Duży klient żąda od firmy IT niezależnej oceny procesu zarządzania zmianami. Asesor przegląda wnioski o zmianę, protokoły i maile, rozmawia z ludźmi i uzasadnia każdą ocenę atrybutu. Pracuje według Przewodnika Asesora.","urzad":"Przed wyborem dostawcy usług informatycznych dla 12 szkół gmina zleca formalną ocenę jego procesów, np. obsługi incydentów. Asesor przegląda rejestr zgłoszeń, umowy i raporty, rozmawia z pracownikami dostawcy i każdą ocenę zapisuje razem z dowodem. Raport trafia do burmistrza. To ocena według Przewodnika Asesora.","it":"Asesor ocenia proces BAI06 według Przewodnika Asesora: zbiera wnioski o zmianę, protokoły komitetu zmian i zapisy z narzędzia. Każdą ocenę atrybutu, od PA 1.1 do PA 3.2, uzasadnia konkretnym dowodem.","egz":"Formalna ocena na dowodach → Przewodnik Asesora. Lżejsza, bez dowodów → Przewodnik Samooceny. Oba opierają się na PAM. Egzamin: „Przewodnik Asesora”. Według zestawienia różnic tłumaczenia (Altkom) wersja podręcznikowa to „Przewodnik osoby oceniającej”. Asesor to osoba oceniająca, a nie asystent. Nie myl z: Przewodnik Samooceny – Samoocena to lżejsza metoda bez wymogu dowodów, służąca rozpoznaniu i przygotowaniu do oceny formalnej.; Model Oceny Procesu (PAM) – PAM to model oceny (co i czym mierzyć). Przewodnik Asesora to sposób przeprowadzenia formalnej oceny.","src":"COBIT 5 Framework (PL), s. 43, 45"},"cele-oceny":{"t":"Cele oceny zdolności procesu","eg":"Cele oceny zdolności procesu","pd":"Cele oszacowania potencjału procesu","en":"Purposes of process capability assessment","wyj":"Po co ktoś sprawdza, jak dobrze coś robimy: żeby wiedzieć, gdzie jesteśmy i co poprawić.\n\nOcena zdolności procesu (process capability assessment) pozwala porównywać (benchmarking) zdolność procesów, np. między jednostkami. Pokazuje stan „jak jest” (as-is) i „jak ma być” (to-be), a różnica między nimi to analiza luk (gap analysis), z której wynika plan usprawnień. Powtarzane oceny pozwalają mierzyć i monitorować bieżące zdolności.\n\nŻeby organ Ładu i kierownictwo mieli rzetelną podstawę do decyzji: gdzie procesy są teraz, gdzie mają być i w co zainwestować, żeby zmniejszyć różnicę.","zycie":"Ty i brat prowadzicie domowe budżety, więc siadacie i porównujecie: kto zapisuje wydatki, kto odkłada co miesiąc, kto nie wie, ile wydał. Wychodzi, że brakuje Ci planu oszczędzania, więc ustalasz, co poprawić do wiosny, a za pół roku porównujecie się znowu. Porównanie, luka, plan poprawy i ponowny pomiar – to cele oceny.","firma":"Właścicielka trzech piekarni zleca ocenę, jak w każdej działa przyjmowanie dostaw. W jednej wszystko jest spisane, w drugiej każdy robi po swojemu, w trzeciej nikt nie sprawdza dat ważności. Dzięki ocenie wie, gdzie są luki, w co najpierw zainwestować i jak za rok sprawdzić postęp.","urzad":"Starostwo porównuje obsługę wniosków w swoich wydziałach. Ocena pokazuje stan „jak jest”, kierownictwo ustala „jak ma być”, a różnica wyznacza plan szkoleń i zmian na przyszły rok. Po roku ta sama ocena pokaże, czy coś się poprawiło – tak wyglądają cele oceny w praktyce.","it":"Audytor ocenia w banku proces DSS02 Zarządzanie zgłoszeniami serwisowymi i incydentami: dziś jest poziom 1, a zarząd wyznacza cel na poziom 3. Luka pokazuje, co poprawić najpierw, np. spisać standardową procedurę (PA 3.1), a ocena za rok zmierzy postęp.","egz":"Ocenę zdolności wykonuje się m.in. po to, aby zidentyfikować, co w procesie należy usprawnić (analiza luk). Nie służy do oceniania ludzi ani do analizy nakłady-korzyści. Nie myl z: Ocena ludzi – Ocena zdolności dotyczy procesów, a nie oceny jakości pracowników.","src":"COBIT 5 Framework (PL), s. 44, 45"},"wymiar-zdolnosci":{"t":"Wymiar Zdolności","eg":"Wymiar Zdolności","pd":"Wskaźniki potencjału (Model oceny procesu)","en":"Capability dimension","wyj":"Drabina od „robi” do „ciągle poprawia”: te same pytania o każdą robotę, bez względu na jej rodzaj.\n\nWymiar zdolności to 6 poziomów i 9 atrybutów. Asesor ocenia je ogólnymi wskaźnikami: praktykami, zasobami i produktami pracy, takimi samymi dla każdego procesu. Dowody do PA 1.1 bierze z wymiaru procesu.\n\nŻeby wszystkie procesy, choć różne, dało się ocenić tą samą miarą: jak dobrze są prowadzone.","zycie":"Trener ocenia różne sporty tymi samymi pytaniami: czy ćwiczysz według planu, czy masz spisany program, czy mierzysz postępy, czy ulepszasz trening. Pytania są te same dla biegania i pływania. To wymiar zdolności.","firma":"Audytorka ocenia w firmie fakturowanie i rekrutację. Procesy są zupełnie różne, ale pytania o planowanie, standard, pomiar i ulepszanie są takie same. To wymiar zdolności.","urzad":"Kontrola ocenia w urzędzie miasta wydawanie zezwoleń na sprzedaż alkoholu i obsługę skarg tą samą drabiną od 0 do 5, z tymi samymi atrybutami. O oba procesy pyta tak samo: czy jest plan, czy ktoś monitoruje cele, czy dokumenty są pod kontrolą. To wymiar zdolności.","it":"Asesor ocenia PA 2.1 w APO12 i w DSS02 tymi samymi praktykami ogólnymi, np. „czy ustalono cele wykonania procesu i czy je monitorowano”. Różne są tylko praktyki bazowe obu procesów.","egz":"Wymiar Zdolności = atrybuty (poziomy 1–5) i wskaźniki ogólne (praktyki, zasoby, produkty pracy). PRM nie należy do tego wymiaru. Egzamin: „Wymiar Zdolności”. Podręcznik (Il. 19): „wskaźniki potencjału: typowe praktyki, typowe zasoby, typowe produkty działań”. „Typowe” znaczy tu „ogólne”, czyli takie same dla wszystkich procesów. Nie myl z: Wymiar Procesu – Wymiar procesu to treść konkretnego procesu (PRM). Wymiar zdolności to wspólna skala atrybutów.; Praktyka bazowa – Praktyka bazowa należy do jednego procesu i do wymiaru procesu. Praktyka ogólna jest wspólna dla wszystkich procesów.","src":"COBIT 5 Framework (PL), s. 42, 43, 45"},"produkt-pracy":{"t":"Produkt pracy","eg":"Produkt pracy","pd":"Produkt działań","en":"Work product","wyj":"Papier, plik albo wpis, który powstaje przy tej robocie albo jest do niej potrzebny.\n\nProdukty pracy to wejścia i wyjścia praktyk. Na poziomie 1 asesor sprawdza, czy istnieją i potwierdzają wykonanie. Na poziomie 2 sprawdza, czy są pod kontrolą (PA 2.2).\n\nŻeby było na czym oprzeć ocenę: dokumenty i pliki pokazują, że praca naprawdę się odbyła.","zycie":"Gotujesz obiad. Lista zakupów to wejście, a plan posiłków na lodówce to wyjście. Oba są produktami pracy procesu „gotowanie”. Sam obiad na stole to rezultat.","firma":"W procesie reklamacji produkty pracy to formularz reklamacji (wejście), notatka z oceny i pismo z decyzją (wyjścia). Asesor ogląda je jako dowody.","urzad":"W starostwie, w procesie wydawania pozwoleń na budowę, produkty pracy to wniosek (wejście) oraz notatka ze sprawdzenia projektu i decyzja (wyjścia). Kontrola wewnętrzna przegląda 10 losowych teczek spraw, żeby ocenić, czy wszystkie kroki zostały wykonane. Teczki nie są celem samym w sobie – są dowodem wykonania pracy.","it":"W procesie APO12 produktem pracy jest np. profil ryzyka i rejestr ryzyk (wyjścia praktyk), a także dane o zdarzeniach (wejście). Asesor ogląda je jako dowody wykonania praktyk.","egz":"Odpowiednikiem produktów pracy w COBIT 5 są wejścia i wyjścia. Razem z praktykami bazowymi to wskaźniki wymiaru procesu. Podręcznik: „produkty działań”. Kurs: „produkty pracy” (nazwy egzaminacyjnej nie potwierdziliśmy w arkuszu). Produkt pracy to nie towar dla klienta. W COBIT 5 odpowiadają mu wejścia i wyjścia praktyk. Nie myl z: Rezultat procesu – Rezultat to stan, który widać, gdy proces działa. Produkt pracy to artefakt, który może ten stan potwierdzać.; PA 2.2 Zarządzanie produktami pracy – PA 2.2 to atrybut, który sprawdza, czy produkty pracy są pod kontrolą. Produkt pracy to sam artefakt.; Rezultat / wynik – Hasło „Rezultat” (output) to to, co bezpośrednio powstało z pracy. Pokrywa się z wyjściami, ale produkty pracy obejmują też wejścia.","src":"COBIT 5 Framework (PL), s. 43, 45"},"prm":{"t":"Referencyjny Model Procesu","eg":"Referencyjny Model Procesu","pd":"Model referencyjny procesu COBIT 5","en":"Process Reference Model (PRM)","wyj":"Gotowa lista 37 typowych zadań informatyki w każdej firmie czy urzędzie, podzielona na pięć szuflad.\n\nReferencyjny Model Procesu (Process Reference Model) ma 37 procesów w dwóch obszarach: Ład (domena EDM, Evaluate, Direct and Monitor, 5 procesów) i Zarządzanie (4 domeny PBRM: APO 13, BAI 10, DSS 6, MEA 3, razem 32). Każdy proces ma opis, cele, praktyki, działania, wejścia i wyjścia oraz tabelę RACI. Model nie jest normatywny: organizacja dopasowuje go do siebie, a w ocenie zdolności tworzy on wymiar procesu.\n\nŻeby każda organizacja miała kompletny wzorzec procesów Ładu i Zarządzania IT, z którym może porównać swoją praktykę i znaleźć luki, zamiast wymyślać wszystko od zera.","zycie":"Młodzi po ślubie dostają od rodziców listę „co trzeba ogarniać w domu”: rachunki, zakupy, sprzątanie, naprawy, ubezpieczenia. U nich rachunkami i ubezpieczeniami zajmuje się jedna osoba w jeden wieczór w miesiącu, a napraw prawie nie ma, bo mieszkanie jest nowe. Lista od rodziców jest jak PRM – wzorzec, który każdy dopasowuje do siebie.","firma":"Właściciel warsztatu czyta listę 37 procesów COBIT i łapie się za głowę. Konsultant tłumaczy: to wzorzec, nie obowiązek – u Ciebie jedna osoba może zajmować się i dostawcami, i umowami, i sprzętem. Ważne tylko, żeby żaden istotny obszar nie został bez opieki.","urzad":"Informatyk w urzędzie gminy kładzie obok siebie listę procesów PRM i to, co urząd faktycznie robi. Kopie zapasowe i obsługę zgłoszeń mają, ale nikt nie pilnuje umów z dostawcami oprogramowania. PRM posłużył jako wzorzec do znalezienia luki, a nie jako 37 procedur do napisania.","it":"Organizacja porównuje swoją pracę z PRM i widzi, że ma kopie zapasowe (DSS04) i obsługę incydentów (DSS02), ale nikt nie prowadzi APO10 (Zarządzanie dostawcami). Luka trafia do planu doskonalenia, a pozostałe procesy organizacja łączy i przycina według swojej wielkości.","egz":"Liczby: 5 + 32 = 37 (EDM 5, APO 13, BAI 10, DSS 6, MEA 3). W ocenie zdolności PRM tworzy wymiar procesu. Nie myl z: Model oceny procesu (PAM) – PAM ocenia zdolność procesów z PRM. PRM to sam zestaw procesów (wymiar procesu).","src":"COBIT 5 Framework (PL), s. 32, 33"},"przeznaczenie-procesu":{"t":"Przeznaczenie procesu","eg":"Przeznaczenie procesu","pd":"Cel procesu","en":"Process purpose","wyj":"Jedno zdanie o tym, po co w ogóle ta robota istnieje.\n\nOpis każdego procesu zaczyna się od zdania o przeznaczeniu. Z niego wynikają rezultaty, a z rezultatów praktyki. Na poziomie 1 asesor sprawdza, czy proces osiąga swoje przeznaczenie.\n\nŻeby każdy wiedział, po co dany proces w ogóle istnieje, zanim zacznie oceniać jego kroki.","zycie":"Przeznaczenie porannego gotowania: rodzina wychodzi z domu najedzona. Nie chodzi o to, ile jajek usmażysz, tylko po co w ogóle wstajesz wcześniej.","firma":"Przeznaczenie procesu reklamacji w sklepie: klient z wadliwym towarem szybko dostaje uczciwe rozwiązanie. Z tego zdania wynikają rezultaty, kroki i dokumenty.","urzad":"Przeznaczenie procesu wydawania dowodów osobistych w urzędzie gminy: mieszkaniec dostaje ważny dokument bez zbędnej zwłoki. To jedno zdanie, od którego zaczyna się opis procesu. Z niego wynikają rezultaty, np. „dowód gotowy do odbioru w ustawowym terminie”, i kroki: przyjęcie wniosku, sprawdzenie danych, wydanie.","it":"Każdy z 37 procesów w COBIT 5: Procesy umożliwiające ma opis i deklarację przeznaczenia. Dla DSS02 brzmi ona w skrócie: szybko przywrócić normalne działanie usług po incydencie.","egz":"„Po co proces istnieje” → przeznaczenie procesu (process purpose). W podręczniku: „cel procesu”. Egzamin: „Przeznaczenie procesu”. Podręcznik (rozdział 8): „cel procesu”. Uwaga: w aktywatorze Procesy „cel procesu” to process goal, czyli coś innego, bliższego rezultatowi. Nie myl z: Rezultat procesu – Rezultat to obserwowalny efekt osiągnięcia przeznaczenia. Przeznaczenie to ogólne „po co”.; Kategorie celów procesu – Cele procesu (wewnętrzne, kontekstowe, dostępności) należą do aktywatora Procesy. To process goals, a nie przeznaczenie.; Cele związane z informatyką – Cele związane z IT pochodzą z kaskady celów. Przeznaczenie dotyczy jednego procesu.","src":"COBIT 5 Framework (PL), s. 43"},"rezultat-procesu":{"t":"Rezultat procesu","eg":"Rezultat procesu","pd":"Wynik procesu","en":"Process outcome","wyj":"To, co widać, gdy robota naprawdę spełnia swoje zadanie, np. „każde zgłoszenie dostało odpowiedź”.\n\nOpis procesu wymienia kilka rezultatów. Asesor sprawdza, czy są osiągane, i ocenia to skalą N/C/W/P. Wynik decyduje o PA 1.1 i o tym, czy proces ma poziom 1.\n\nŻeby przeznaczenie dało się sprawdzić: wiadomo, jakie konkretne efekty mają być widoczne.","zycie":"Przeznaczenie odkurzania: czysty dom. Rezultaty: na podłodze nie ma okruchów, a pod łóżkiem kurzu. Odkurzacz, który hałasuje godzinę, to czynność, a nie rezultat.","firma":"Rezultaty procesu reklamacji: każda reklamacja ma decyzję w 14 dni, a klient wie, co dalej. Formularz i e-mail to produkty pracy, a nie rezultaty.","urzad":"Rezultat procesu wydawania dowodów osobistych w urzędzie gminy: mieszkaniec w ustawowym terminie dostaje ważny dowód z poprawnymi danymi. Wniosek w systemie i potwierdzenie odbioru to produkty pracy, które ten rezultat potwierdzają. Gdy co dziesiąty dowód trzeba wymieniać przez literówkę, rezultat nie jest uzyskiwany konsekwentnie.","it":"Dla DSS02 rezultatami są m.in. przywrócone usługi i rozwiązane incydenty, a w Procesach umożliwiających odpowiadają im cele procesu. Rejestr incydentów to produkt pracy, który te rezultaty potwierdza.","egz":"Poziom 1 sprawdza, czy rezultaty procesu są osiągane. Rezultat to obserwowalny efekt osiągnięcia przeznaczenia. Podręcznik (rozdział 8): „wyniki procesu”. Kurs: „rezultat procesu” (forma egzaminacyjna potwierdzona w SP1: „Rezultaty procesu”). Nie myl z „wynikami” jako wyjściami procesu (outputs) ani z hasłem „Rezultat” (output). Nie myl z: Rezultat / wynik – Hasło „Rezultat” to output, czyli to, co bezpośrednio powstało z pracy. Rezultat procesu (outcome) to obserwowalny efekt osiągnięcia przeznaczenia.; Produkt pracy – Produkt pracy to artefakt (dokument, log). Rezultat to stan, który ten artefakt może potwierdzać.; Przeznaczenie procesu – Przeznaczenie mówi, po co jest proces. Rezultaty mówią, po czym to poznać.","src":"COBIT 5 Framework (PL), s. 42, 45"},"wejscia-wyjscia":{"t":"Wejścia i wyjścia","eg":"Wejścia i wyjścia","pd":"Dane wejściowe i wyniki","en":"Inputs and outputs (work products)","wyj":"Papiery i dane, które trafiają do pracy, i te, które z niej wychodzą jako ślad.\n\nKażda kluczowa praktyka ma wejścia (np. zgłoszenie, plan) i wyjścia (np. raport, decyzja, wpis w rejestrze). Wyjście jednego procesu często jest wejściem innego. Wejścia i wyjścia tworzą ścieżkę rewizyjną, a lista COBIT 5 jest przykładowa.\n\nŻeby było wiadomo, czego praktyka potrzebuje i co wytwarza, i żeby po fakcie dało się odtworzyć, co się stało.","zycie":"Idziesz do lekarza ze skierowaniem (wejście). Wychodzisz z receptą i wpisem w karcie (wyjścia). Recepta staje się wejściem dla apteki. Gdy coś pójdzie nie tak, wpis w karcie pokaże, co lekarz zalecił.","firma":"Drukarnia dostaje od klienta plik i zamówienie (wejścia). Wydaje gotowe ulotki i protokół odbioru (wyjścia). Gdy klient reklamuje kolory, protokół z podpisem pokazuje, co zaakceptował.","urzad":"Starostwo przyjmuje wniosek o pozwolenie na budowę (wejście). Wydaje decyzję i zostawia akta sprawy (wyjścia). Kopia decyzji jest wejściem dla nadzoru budowlanego. Akta to ścieżka rewizyjna na wypadek skargi.","it":"W BAI06 (Zarządzanie zmianami) wniosek o zmianę jest wejściem, a zatwierdzona zmiana i wpis w rejestrze zmian są wyjściami. Rejestr staje się wejściem m.in. dla BAI10 (Zarządzanie konfiguracją) (szczegóły procesu: uproszczenie kursu).","egz":"Wejścia i wyjścia: produkty działań, podstawa decyzji, ścieżka rewizyjna, weryfikacja po incydencie. Definiuje się je na poziomie praktyk. Lista COBIT 5 nie jest wyczerpująca. Egzamin: „wejścia i wyjścia”. Podręcznik: „dane wejściowe i wyniki”, a same rzeczy nazywa „produktami działań” albo „pozostałościami”. To ten sam element. Nie myl z: Działania – Działania uwzględniają wejścia i wyjścia, ale same wejścia i wyjścia definiuje się na poziomie praktyk.; Informacja – Informacja to osobny aktywator. W procesie bywa wejściem lub wyjściem, ale wejścia i wyjścia to szersza kategoria produktów działań.","src":"COBIT 5 Framework (PL), s. 70, 71, 92"},"proces":{"t":"Proces","eg":"Proces","pd":"Proces","en":"Process","wyj":"Coś, co robimy regularnie i zawsze w podobny sposób, np. przyjmowanie każdego zgłoszenia.\n\nProces (process) przyjmuje wejścia (inputs), przetwarza je przez praktyki i działania ukierunkowane przez polityki i procedury i daje wyniki (outputs), np. produkt albo usługę. Ma właściciela, role i mierniki, a wynik jednego procesu bywa wejściem innego. W COBIT 5 procesy są jednym z siedmiu aktywatorów, a Referencyjny Model Procesu opisuje ich 37.\n\nŻeby powtarzalną pracę wykonywać za każdym razem tak samo dobrze, niezależnie od tego, kto ją akurat robi, i żeby dało się ją mierzyć i poprawiać.","zycie":"Co sobotę rano sprawdzasz lodówkę, piszesz listę, jedziesz do sklepu, rozpakowujesz i odhaczasz, czego zabrakło. Za tydzień wszystko powtarza się od nowa. To proces: stałe kroki, wejście (pusta lodówka i lista) i wynik (pełna lodówka).","firma":"W sklepie internetowym z herbatą przychodzi zamówienie, pracownik pakuje paczkę, drukuje etykietę i fakturę, a kurier odbiera paczki o 15:00. Tak samo dzieje się z każdym zamówieniem, codziennie. To proces – powtarzalny, z wejściem (zamówienie) i wynikiem (paczka u klienta).","urzad":"Do urzędu gminy wpływa wniosek o wycinkę drzewa. Kancelaria go rejestruje, kierownik przydziela go referentowi, ten jedzie na oględziny i wydaje decyzję. Każdy kolejny wniosek idzie tą samą ścieżką – to jest proces.","it":"DSS02 (Zarządzanie zgłoszeniami serwisowymi i incydentami) to proces: każde zgłoszenie (wejście) jest rejestrowane, klasyfikowane, rozwiązywane i zamykane (praktyki), a wynikiem jest przywrócona usługa i wpis w rejestrze. Działa codziennie i tak samo dla każdego zgłoszenia.","egz":"Opis „zbiór praktyk ukierunkowanych politykami i procedurami, który przetwarza wejścia w wyniki” to Proces (Załącznik H). Nie myl z: Projekt – Projekt jest jednorazowy, ma początek i koniec (np. wdrożenie systemu). Proces trwa i się powtarza (np. obsługa zgłoszeń w tym systemie).","src":"COBIT 5 Framework (PL), s. 93"},"pojecia-iso15504":{"t":"Przeznaczenie procesu, rezultat, praktyka bazowa, produkt pracy","eg":"Przeznaczenie procesu, rezultat, praktyka bazowa, produkt pracy","pd":"Cel procesu, wyniki procesu, podstawowe praktyki, produkty działań","en":"Process purpose, outcome, base practice, work product (ISO/IEC 15504)","wyj":"Słowa oceniającego: po co ta praca jest, co z niej wychodzi, jakie kroki i jakie dokumenty powstają.\n\nKażdy proces ma przeznaczenie (process purpose), czyli ogólny cel. Jego osiągnięcie widać po rezultatach (outcomes), do których prowadzą wykonywane praktyki bazowe (base practices), a po drodze powstają produkty pracy (work products), czyli dowody. W COBIT 5 rezultatom odpowiadają cele procesu, praktykom bazowym praktyki nadzoru/zarządzania, a produktom pracy wejścia i wyjścia. Asesor sprawdza praktyki bazowe i produkty pracy, gdy ocenia atrybut PA 1.1 (wykonanie procesu).\n\nŻeby oceniający mógł obiektywnie stwierdzić, czy proces osiąga swoje przeznaczenie (poziom 1), na podstawie tego, co da się zobaczyć i udokumentować, a nie deklaracji.","zycie":"Gotujesz obiady dla rodziny na cały tydzień. Przeznaczenie: wszyscy codziennie jedzą ciepły obiad. Rezultat: każdego dnia o 17:00 obiad stoi na stole. Praktyki bazowe to planowanie posiłków, zakupy i gotowanie, a produkty pracy to plan obiadów na lodówce i lista zakupów.","firma":"Warsztat samochodowy przyjmuje auto do naprawy. Przeznaczenie: każde auto naprawione w obiecanym terminie; rezultat: klient odbiera auto w dniu, który mu podano. Praktyki bazowe to oględziny przy kliencie, wycena i zamówienie części, a produkty pracy to zlecenie z podpisem klienta i faktura.","urzad":"Urząd gminy wydaje dowody osobiste. Przeznaczenie: mieszkaniec dostaje ważny dowód bez zbędnego czekania; rezultat: dowód wydany w terminie i bez błędów w danych. Praktyki bazowe to sprawdzenie tożsamości, przyjęcie wniosku i wydanie dokumentu, a produkty pracy to wniosek w systemie i potwierdzenie odbioru.","it":"Asesor ocenia na poziomie 1 proces DSS02 (Zarządzanie zgłoszeniami serwisowymi i incydentami). Sprawdza, czy praktyki bazowe, np. rejestrowanie, klasyfikowanie i rozwiązywanie incydentów, są wykonywane, a jako produkty pracy ogląda rejestr incydentów i raporty z ich zamknięcia.","egz":"Poziom 1 ocenia się przez praktyki bazowe i produkty pracy (wskaźniki wykonania procesu). Egzamin: „przeznaczenie procesu” (process purpose). Podręcznik: „cel procesu”. Uwaga: „cel procesu” w aktywatorze Procesy to process goal, czyli coś innego.","src":"COBIT 5 Framework (PL), s. 43"},"przewodniki-oceny":{"t":"Model Oceny Procesu (PAM), Przewodnik Asesora, Przewodnik Samooceny","eg":"Model Oceny Procesu (PAM), Przewodnik Asesora, Przewodnik Samooceny","pd":"Model oceny procesu (FW-PL s. 41–42); nazw przewodników FW-PL nie podaje – zestawienie Altkom i inne polskie publikacje: Przewodnik osoby oceniającej, Podręcznik samooceny","en":"COBIT Assessment Programme guides: PAM, Assessor Guide, Self-Assessment Guide","wyj":"Trzy podręczniki do sprawdzania, jak dobrze coś robimy: dokładny, dla oceniającego i do samooceny.\n\nModel Oceny Procesu (Process Assessment Model, PAM) jest podstawą: zawiera procesy z PRM, wskaźniki, atrybuty i skalę ocen. Przewodnik Asesora (Assessor Guide) opisuje formalną ocenę zgodną z ISO/IEC 15504, opartą na dowodach i prowadzoną przez kompetentnego asesora. Przewodnik Samooceny (Self-Assessment Guide) pozwala na lżejszą, wewnętrzną ocenę bez zbierania dowodów, np. jako przygotowanie do oceny formalnej.\n\nŻeby oceny zdolności procesów COBIT 5 prowadzić według jednego modelu, zarówno gdy organizacja ocenia się sama, jak i gdy robi to formalnie niezależny asesor.","zycie":"Przed egzaminem na prawo jazdy robisz w domu test próbny w aplikacji – nikt nie sprawdza, czy zaglądasz do notatek (samoocena). Potem w WORD-zie egzaminator sprawdza wszystko według przepisów (ocena formalna). Oba sprawdziany opierają się na tych samych zasadach – tak jak oba przewodniki opierają się na PAM.","firma":"Właścicielka sklepu internetowego sama siada z arkuszem i ocenia, jak działa obsługa reklamacji – szybko, z tego, co wiedzą pracownicy (Przewodnik Samooceny). Gdy duży kontrahent żąda niezależnej oceny, zatrudnia asesora, który prosi o dowody: rejestr reklamacji, procedury, maile (Przewodnik Asesora). Oboje korzystają z tego samego modelu – PAM.","urzad":"Informatyk urzędu gminy razem z kierownikami wypełnia ankietę samooceny procesów IT, żeby zobaczyć, gdzie są braki. Rok później przychodzi asesor i każdą ocenę sprawdza na dokumentach i w rozmowach. Samoocena była przygotowaniem do formalnej oceny.","it":"Przed oceną zewnętrzną dział IT robi samoocenę APO12 (Zarządzanie ryzykiem) według Przewodnika Samooceny i widzi braki w rejestrze ryzyk. Potem asesor ocenia ten sam proces według PAM i Przewodnika Asesora i żąda dowodów, np. rejestru ryzyk i protokołów z jego przeglądów.","egz":"Prawdziwe: Przewodnik Samooceny może być użyty do przygotowania do formalnej oceny zdolności procesu. Fałsz: „Samoocena jest taka sama jak Przewodnik Asesora”. Egzamin: „Przewodnik Asesora”, „Przewodnik Samooceny”. Zestawienie Altkom i inne polskie publikacje: „Przewodnik osoby oceniającej”, „Podręcznik samooceny” – tych nazw nie ma w podręczniku FW-PL. Nie myl z: Samoocena ≠ to samo co ocena asesora – Samoocena nie jest „tym samym przewodnikiem używanym wewnętrznie”. To lżejsza metoda bez wymogu dowodów.","src":"COBIT 5 Framework (PL), s. 45"},"praktyka-bazowa":{"t":"Praktyka bazowa","eg":"Praktyka bazowa","pd":"Podstawowa praktyka","en":"Base practice","wyj":"Konkretny krok tej jednej roboty, który robiony regularnie prowadzi do efektu.\n\nPraktyki bazowe pochodzą z opisu procesu. W COBIT 5 to praktyki nadzoru i zarządzania, np. DSS02.01. Asesor sprawdza, czy są stosowane, i ocenia je skalą N/C/W/P, żeby znaleźć braki.\n\nŻeby ocena miała konkretne punkty zaczepienia: jakie kroki tego procesu muszą być robione.","zycie":"Proces „pranie”. Praktyki bazowe: posortuj ubrania, wybierz program, rozwieś. To kroki właśnie prania. Pytanie „czy planujesz pranie na sobotę” to już nie praktyka bazowa, tylko zarządzanie.","firma":"W procesie reklamacji praktyki bazowe to: przyjmij zgłoszenie, oceń zasadność, przekaż decyzję klientowi. Każdy proces w firmie ma swoje, inne praktyki bazowe.","urzad":"W starostwie, w procesie wydawania pozwoleń na budowę, praktyki bazowe to: sprawdź kompletność wniosku, zbierz opinie, wydaj decyzję. Proces obsługi skarg ma zupełnie inne praktyki.","it":"Praktyki bazowe procesu DSS02 to jego praktyki zarządzania, np. DSS02.01 (zdefiniowanie schematów klasyfikacji incydentów) i kolejne. Działania pod każdą praktyką to drobniejsze rozbicie, a nie osobne praktyki bazowe.","egz":"Odpowiednikiem praktyk bazowych w COBIT 5 są praktyki nadzoru i zarządzania. Razem z produktami pracy służą ocenie poziomu 1. Podręcznik: „podstawowe praktyki”. Kurs: „praktyki bazowe” (nazwy egzaminacyjnej nie potwierdziliśmy w arkuszu). Praktykom bazowym odpowiadają w COBIT 5 praktyki nadzoru i zarządzania, a nie działania. Nie myl ich z praktykami ogólnymi („typowymi”) z wymiaru zdolności. Nie myl z: Praktyki, działania, wejścia i wyjścia procesu – Praktyki, działania, wejścia i wyjścia to budowa procesu w COBIT 5. Praktyce bazowej odpowiada praktyka, a nie działanie.; Wymiar Zdolności – Praktyki ogólne („typowe”) należą do wymiaru zdolności i są wspólne dla wszystkich procesów.; Produkt pracy – Produkt pracy to artefakt (wejście, wyjście). Praktyka bazowa to czynność.","src":"COBIT 5 Framework (PL), s. 43, 45"},"rola-kierownictwo":{"t":"Kierownictwo","eg":"Kierownictwo","pd":"Zarządzanie (podpis roli na Ilustracji 9)","en":"Management","wyj":"Kierownicy, którzy dostają kierunek od szefostwa, rozdzielają pracę ludziom i pilnują, czy organizacja osiąga cele.\n\nKierownictwo dostaje kierunek od organu Ładu. Instruuje i dopasowuje role operacyjne i odbiera ich raporty – między kierownictwem a rolami operacyjnymi są tylko te dwie relacje (FW-PL s. 24, Il. 9). Strzałka monitorowania łączy kierownictwo z organem Ładu; według uzasadnień egzaminacyjnych to kierownictwo odpowiada wykonawczo za monitorowanie. Swoją pracę prowadzi w obszarze Planuj, Twórz, Wykonuj i Monitoruj.\n\nŻeby kierunek od organu Ładu zamienił się w konkretne zadania i żeby ktoś pilnował ich wykonania.","zycie":"Zarząd wspólnoty postanawia: w tym roku remont dachu. Administrator budynku wybiera firmę i ustala jej harmonogram. Firma raportuje administratorowi postępy, a on co miesiąc mówi zarządowi, czy remont idzie zgodnie z planem. Administrator to kierownictwo: instruuje i dopasowuje.","firma":"Rada spółki ustala: otwieramy czwarty sklep bez kredytu. Dyrektor zarządzający układa plan, rozdziela zadania kierownikom i co tydzień patrzy na raporty sprzedaży. To kierownictwo z Ilustracji 9.","urzad":"Rada gminy uchwala strategię e-usług. Sekretarz gminy rozdziela zadania wydziałom, dopasowuje grafik informatyków i co miesiąc zdaje radzie gminy relację z postępów. Sekretarz działa jako kierownictwo.","it":"Kierownictwo IT mierzy, czy IT osiąga cele, m.in. w procesie MEA01 (Monitorowanie, ocena i oszacowanie wydajności i zgodności) z domeny MEA, i raportuje wyniki organowi Ładu.","egz":"„Kto instruuje i dopasowuje role operacyjne?” → Kierownictwo. Kto odpowiada wykonawczo za monitorowanie w rolach z Ilustracji 9? Według uzasadnień egzaminacyjnych także Kierownictwo, a nie organ Ładu. Podręcznikowy podpis „Zarządzanie” na Ilustracji 9 to ta sama rola. Na Ilustracji 9 podręcznik podpisuje tę rolę „Zarządzanie”, a egzamin mówi „Kierownictwo” (tę formę podręcznik ma też w nagłówku na s. 31). W uzasadnieniach egzaminacyjnych to kierownictwo odpowiada wykonawczo za monitorowanie, a nie organ Ładu. Nie myl z: Organ Ładu i nadzoru – Organ Ładu wyznacza kierunek i jest rozliczany przed interesariuszami. Kierownictwo realizuje kierunek, instruuje i dopasowuje role operacyjne i odpowiada wykonawczo za monitorowanie osiągania celów.; Zarządzanie – Zarządzanie to obszar działań (PBRM, 32 procesy). Kierownictwo to rola z Ilustracji 9, czyli ludzie, którzy te działania prowadzą.; Oszacuj, Kieruj i Monitoruj (EDM) – „Monitoruj” w EDM to praktyka procesów Ładu: Ład monitoruje sprawność i zgodność względem kierunku (s. 14). W pytaniu o role z Ilustracji 9 egzamin wiąże monitorowanie z kierownictwem.","src":"COBIT 5 Framework (PL), s. 14, 24, 31"},"wymiar-procesu":{"t":"Wymiar Procesu","eg":"Wymiar Procesu","pd":"Wskaźniki wydajności (Model oceny procesu)","en":"Process dimension","wyj":"Lista tego, co dana robota ma dawać, i kroków oraz papierów, które to potwierdzają.\n\nWymiar procesu bierze procesy z PRM. Każdy ma przeznaczenie, rezultaty, praktyki bazowe i produkty pracy. Te wskaźniki są inne dla każdego procesu i służą ocenie PA 1.1, czyli poziomu 1.\n\nŻeby ocena miała jasną treść: wiadomo, co dany proces ma osiągać i po jakich dowodach to poznać.","zycie":"Egzamin na prawo jazdy ma listę manewrów: parkowanie, łuk, ruszanie pod górę. To jak wymiar procesu: konkretne kroki i efekty, inne dla kategorii B, inne dla C. Lista nie mówi, jak dobrze kursant planuje naukę.","firma":"Audytor ocenia w firmie proces obsługi reklamacji. Bierze opis procesu: przeznaczenie, rezultaty, praktyki i dokumenty. Sprawdza, czy to wszystko się dzieje. To wymiar procesu, inny dla reklamacji, a inny dla fakturowania.","urzad":"Kontrola w starostwie bierze opis procesu wydawania pozwoleń na budowę: po co jest, jakie ma rezultaty, jakie kroki i jakie dokumenty powstają, np. wniosek, opinia, decyzja. Sprawdza, czy to wszystko się dzieje. To wymiar procesu – dla wydawania praw jazdy lista kroków i dokumentów byłaby zupełnie inna.","it":"Wymiar procesu dla APO12 (zarządzanie ryzykiem) to jego opis z Procesów umożliwiających: przeznaczenie, cele procesu, praktyki APO12.01–APO12.06 oraz ich wejścia i wyjścia, np. profil ryzyka.","egz":"Z Referencyjnym Modelem Procesu wiąże się Wymiar Procesu. Jego wskaźniki, praktyki bazowe i produkty pracy, służą ocenie poziomu 1. Egzamin: „Wymiar Procesu”. Podręcznik (Il. 19) nie używa słowa „wymiar”, tylko „wskaźniki wydajności: wyniki procesu, podstawowe praktyki, produkty działań”. Nie myl z wymiarami aktywatora. Nie myl z: Wymiar Zdolności – Wymiar zdolności to 9 atrybutów i ogólne wskaźniki, wspólne dla wszystkich procesów. Wymiar procesu jest specyficzny dla każdego procesu.; Wymiary aktywatora – Wymiary aktywatora należą do modelu aktywatora (Zasada 4), a nie do oceny zdolności.","src":"COBIT 5 Framework (PL), s. 42, 43"},"przewodnik-samooceny":{"t":"Przewodnik Samooceny","eg":"Przewodnik Samooceny","pd":"Podręcznik samooceny","en":"COBIT Self-Assessment Guide","wyj":"Prosta ankieta, którą wypełniasz sam, żeby zobaczyć, gdzie robota kuleje, bez zbierania papierów.\n\nZespół organizacji przechodzi pytania z przewodnika i ocenia procesy z własnej wiedzy, bez zbierania dowodów. Wynik pokazuje luki i pomaga zaplanować usprawnienia. Może też przygotować do formalnej oceny.\n\nŻeby organizacja mogła szybko i tanio sama sprawdzić, gdzie są jej słabe procesy.","zycie":"Przed wizytą u lekarza wypełniasz w domu ankietę: jak śpisz, ile się ruszasz. Nikt nie sprawdza odpowiedzi, ale już widzisz, o co zapytać lekarza. To samoocena.","firma":"Właścicielka małej firmy siada z zespołem i w godzinę ocenia trzy procesy według prostych pytań. Wychodzi, że najbardziej kuleją reklamacje. Wie, od czego zacząć poprawki.","urzad":"Pięciu naczelników wydziałów w starostwie w jedno popołudnie wypełnia ankietę samooceny procesów informatycznych, z własnej wiedzy, bez zbierania dokumentów. Wynik pokazuje, że najsłabiej wypadają kopie zapasowe. Starosta zleca poprawki, a za rok formalną ocenę według Przewodnika Asesora.","it":"Dział IT urzędu przechodzi Przewodnik Samooceny dla DSS02, DSS04 i BAI06. Najgorzej wypada DSS04, więc od niego zaczyna poprawki. Za rok planuje formalną ocenę według Przewodnika Asesora.","egz":"Przewodnik Samooceny pomaga przygotować się do formalnej oceny. To nie to samo co Przewodnik Asesora, tylko lżejsza metoda bez dowodów. Egzamin: „Przewodnik Samooceny”. Według zestawienia różnic tłumaczenia (Altkom) wersja podręcznikowa to „Podręcznik samooceny”. Samoocena nie jest „tym samym co Przewodnik Asesora, tylko robionym wewnętrznie”. Nie myl z: Przewodnik Asesora – Przewodnik Asesora prowadzi formalną ocenę na dowodach. Samoocena jest lżejsza i nie wymaga dowodów.; Model Oceny Procesu (PAM) – PAM to model, na którym opiera się samoocena. Sam Przewodnik Samooceny to uproszczony sposób oceniania.","src":"COBIT 5 Framework (PL), s. 45"}},"S":[{"pt":"Lekcja 4.50","h":"Wymiar Procesu: czy proces robi swoje; Wymiar Zdolności: jak nim kierujemy","b":"<div class=\"tblwrap\"><table class=\"tbl\"><tr><th><\/th><th><w k=\"wymiar-procesu\">Wymiar Procesu<\/w><\/th><th><w k=\"wymiar-zdolnosci\">Wymiar Zdolności<\/w><\/th><\/tr><tr><td>wskaźniki<\/td><td>wyniki, praktyki bazowe, produkty pracy – inne dla każdego procesu<\/td><td>typowe praktyki, zasoby i produkty – wspólne<\/td><\/tr><tr><td>służy<\/td><td>poziomowi 1<\/td><td>poziomom 2–5<\/td><\/tr><\/table><\/div>","c":"Wskaźnik specyficzny dla procesu to Wymiar Procesu; wspólny dla wszystkich – Wymiar Zdolności.","s":"COBIT 5 Framework (PL), s. 42, 45, Ilustracja 19","ctx":"<p>EN: <span class=\"en\">Process dimension<\/span>, <span class=\"en\">Capability dimension<\/span>. Na Ilustracji 19 podręcznik mówi o „wskaźnikach wydajności” i „wskaźnikach potencjału” – to te same dwie grupy; „wydajność” znaczy tu wykonanie procesu, nie szybkość. Dla wyższych poziomów używa się typowych praktyk <span class=\"en\">generic practices<\/span> opartych na normie ISO/IEC 15504-2, np. „zaplanuj wykonanie procesu” – pasują do każdego procesu.<\/p><p>To jedna ocena z dwóch stron, nie dwie kontrole. Przykład – obsługa incydentów IT w szpitalu: Wymiar Procesu to rejestr zgłoszeń i to, czy awarie są usuwane; Wymiar Zdolności – czy praca jest planowana, czy jest wspólna procedura, czy wyniki są mierzone. Jeśli awarie nie są usuwane, dowody z Wymiaru Zdolności nie podniosą wyniku ponad 0.<\/p>"},{"pt":"Sprawdź się","quiz":{"tresc":"Które wskaźniki należą do <b>Wymiaru Procesu<\/b>, a NIE do Wymiaru Zdolności?","opcje":[{"t":"Praktyki bazowe i produkty pracy konkretnego procesu","ok":true,"w":"Dobrze. Wymiar Procesu: wyniki, praktyki bazowe i produkty pracy danego procesu."},{"t":"Atrybuty od PA 2.1 do PA 5.2 oceniane skalą N/C/W/P","w":"Atrybuty poziomów 2–5 ocenia się w Wymiarze Zdolności."},{"t":"Wskaźniki wydajności i wskaźniki potencjału","w":"To podręcznikowe nazwy obu grup naraz, a nie samego Wymiaru Procesu."},{"t":"Typowe praktyki, zasoby i produkty pracy, wspólne dla wszystkich procesów","w":"To wskaźniki Wymiaru Zdolności."}],"src":"COBIT 5 Framework (PL), s. 42","pomoc":{"t":"Pytanie dotyczy lekcji 4.50 „Wymiar Procesu i Wymiar Zdolności”. Cel lekcji: Potrafię odróżnić Wymiar Procesu od Wymiaru Zdolności po tym, jakie wskaźniki sprawdzają.","k":["wymiary-oceny","wymiar-procesu","wymiar-zdolnosci"]}}},{"pt":"Lekcje 4.51–4.52","h":"Referencyjny Model Procesu opisuje tylko to, co prowadzi do celu","b":"<p><w k=\"prm\">Referencyjny Model Procesu<\/w> <span class=\"en\"><w k=\"proces\">Process<\/w> Reference Model<\/span>, PRM:<\/p><div class=\"tblwrap\"><table class=\"tbl\"><tr><th>Pojęcie<\/th><th>Znaczy<\/th><\/tr><tr><td><w k=\"przeznaczenie-procesu\">Przeznaczenie procesu<\/w><\/td><td>po co istnieje<\/td><\/tr><tr><td><w k=\"rezultat-procesu\">Rezultat<\/w><\/td><td>widoczny skutek<\/td><\/tr><tr><td><w k=\"praktyka-bazowa\">Praktyka bazowa<\/w><\/td><td>praktyka Ładu lub Zarządzania<\/td><\/tr><tr><td><w k=\"produkt-pracy\">Produkt pracy<\/w><\/td><td><w k=\"wejscia-wyjscia\">wejścia i wyjścia<\/w><\/td><\/tr><\/table><\/div>","c":"Planowanie, pomiar i standaryzacja nie należą do opisu procesu – to atrybuty poziomów 2–5.","s":"COBIT 5 Framework (PL), s. 43","ctx":"<p>W COBIT 5 PRM to 37 procesów z przewodnika „Procesy umożliwiające” <span class=\"en\">COBIT 5: Enabling Processes<\/span>; ich opisy zawierają „wyłącznie kroki konieczne do osiągnięcia rzeczywistych zamiarów i celów procesu”. Cechy wspólne (plan, pomiar, standard) przeniesiono do atrybutów, żeby się nie powielały. PRM łączy się z Wymiarem Procesu. Opis czterech pojęć to streszczenie normy ISO/IEC 15504; EN: <span class=\"en\">purpose, outcome, base practice, work product<\/span>.<\/p><p>Pułapki: przeznaczenie to podręcznikowy „cel procesu”; rezultat <span class=\"en\">outcome<\/span> to stan, a nie wyjście <span class=\"en\">output<\/span> – raport jest produktem pracy. Formy „praktyka bazowa” i „produkt pracy” są niepotwierdzone (podręcznik: podstawowe praktyki, produkty działań). Przykład – helpdesk: przeznaczenie – szybko przywracać usługi; rezultat – incydenty rozwiązane w uzgodnionym czasie; praktyka – rejestruj i klasyfikuj zgłoszenia; produkt – rejestr zgłoszeń.<\/p>"},{"pt":"Sprawdź się","quiz":{"tresc":"Asesor w urzędzie wojewódzkim sprawdza, czy proces obsługi zgłoszeń wykonuje praktyki bazowe i wytwarza produkty pracy opisane w modelu referencyjnym procesu. Na czym się teraz skupia?","opcje":[{"t":"Na ocenie w Wymiarze Zdolności (Capability dimension)","w":"Wymiar Zdolności ocenia atrybuty procesu poziomów 2–5 (np. zarządzanie wydajnością), wspólne dla wszystkich procesów, a nie praktyki z modelu referencyjnego."},{"t":"Na ocenie w Wymiarze Procesu (Process dimension)","ok":true,"w":"Dobrze. Praktyki bazowe i produkty pracy z modelu referencyjnego to wskaźniki Wymiaru Procesu – sprawdzają, czy proces osiąga swoje przeznaczenie (poziom 1)."},{"t":"Na ustaleniu poziomu dojrzałości według COBIT 4.1","w":"Model dojrzałości to dawne podejście COBIT 4.1, zastąpione w COBIT 5 modelem zdolności procesu."},{"t":"Na przypisaniu procesu do celów w kaskadzie celów","w":"Kaskada celów łączy cele z procesami, ale nie służy do oceny, czy proces wykonuje swoje praktyki."}],"src":"COBIT 5 Framework (PL), s. 42; COBIT 5 Framework (PL), s. 43","pomoc":{"t":"Pytanie dotyczy lekcji 4.51 „Referencyjny Model Procesu według ISO/IEC 15504”. Cel lekcji: Potrafię powiedzieć, co zawiera Referencyjny Model Procesu i czego w opisie procesu być nie może.","k":[]}}},{"pt":"Arkusz próbny","sp1":"sp1-22","lekcja":"4.51","temat":"Referencyjny Model Procesu według ISO/IEC 15504","k":[]},{"pt":"Arkusz próbny","sp1":"sp1-47","lekcja":"4.51","temat":"Referencyjny Model Procesu według ISO/IEC 15504","k":[]},{"pt":"Sprawdź się","quiz":{"tresc":"Helpdesk prowadzi rejestr zgłoszeń i co miesiąc wysyła raport. Czym są te dokumenty w ocenie procesu?","opcje":[{"t":"Przeznaczeniem procesu","w":"Przeznaczenie to cel istnienia procesu."},{"t":"Rezultatami procesu","w":"Rezultat to stan, a nie dokument. Raport to wyjście (<em>output<\/em>)."},{"t":"Produktami pracy","ok":true,"w":"Dobrze. Produkty pracy to wejścia i wyjścia procesu, czyli dowody pracy."},{"t":"Praktykami bazowymi","w":"Praktyka to czynność, a rejestr to jej ślad."}],"src":"COBIT 5 Framework (PL), s. 43","pomoc":{"t":"Pytanie dotyczy lekcji 4.52 „Przeznaczenie, rezultat, praktyka bazowa, produkt pracy”. Cel lekcji: Potrafię nazwać i odróżnić cztery pojęcia normy ISO/IEC 15504: przeznaczenie, rezultat, praktykę bazową i produkt pracy.","k":["pojecia-iso15504","przeznaczenie-procesu","rezultat-procesu","praktyka-bazowa"]}}},{"pt":"Lekcja 4.53","h":"Poziom 1 ocenia się po wynikach, a praktyki pokazują, co poprawić","b":"<ol><li>wyniki procesu porównaj z jego opisem i oceń N/C/W/P,<\/li><li>tą samą skalą oceń praktyki,<\/li><li>dla dokładności uwzględnij produkty pracy.<\/li><\/ol>","c":"Gdy proces nie osiąga poziomu 1, ocena praktyk wskazuje, które praktyki wdrożyć w planie doskonalenia.","s":"COBIT 5 Framework (PL), s. 45","ctx":"<p>Podręcznik: „Oszacowanie praktyk procesów pozwoli na ustalenie, których praktyk brakuje” albo które nie działają – z tego powstaje plan doskonalenia. Sam wynik mówi, że jest problem; ocena praktyk – gdzie dokładnie. Przykład: u ubezpieczyciela wypłaty się opóźniają, a ocena praktyk pokazuje, że nikt nie weryfikuje kompletności dokumentów – plan to wdrożyć tę praktykę.<\/p><p>Czym ocena poziomu 1 nie jest: przeliczeniem dawnej oceny dojrzałości z COBIT 4.1, oceną ludzi ani sprawdzaniem planów i procedur – te należą do Wymiaru Zdolności i poziomów 2–5. Trzy kroki odpowiadają pojęciom normy – rezultatom, praktykom bazowym i produktom pracy – czyli dowodom z Wymiaru Procesu.<\/p>"},{"pt":"Sprawdź się","quiz":{"tresc":"Która kolejność kroków oceny poziomu 1 jest zgodna z podręcznikiem?","opcje":[{"t":"Produkty pracy, potem praktyki, potem wyniki procesu","w":"Kolejność jest odwrócona."},{"t":"Poziom dojrzałości, potem przeliczenie na zdolność","w":"Nie przelicza się wyników COBIT 4.1."},{"t":"Typowe praktyki, potem atrybuty poziomów 2–5","w":"To ocena wyższych poziomów."},{"t":"Wyniki procesu, potem praktyki, potem produkty pracy","ok":true,"w":"Dobrze. Tak opisuje to podręcznik na s. 45."}],"src":"COBIT 5 Framework (PL), s. 45","pomoc":{"t":"Pytanie dotyczy lekcji 4.53 „Jak ocenia się, czy proces osiągnął poziom 1”. Cel lekcji: Potrafię opisać trzy kroki oceny poziomu 1 i powiedzieć, co zrobić, gdy proces go nie osiąga.","k":[]}}},{"pt":"Lekcja 4.55","h":"Ocena zdolności ma cel wewnętrzny albo zewnętrzny","b":"<p><w k=\"cele-oceny\">Cele oceny zdolności procesu<\/w>:<\/p><ol><li>porównanie procesów przez <w k=\"organ-ladu\">Organ Ładu i nadzoru<\/w> i <w k=\"rola-kierownictwo\">kierownictwo<\/w>,<\/li><li>stan „jak jest” i „jak ma być”,<\/li><li>analiza luk i plan usprawnień,<\/li><li>klasyfikacja ocen do monitorowania.<\/li><\/ol>","c":"Formalna ocena, raportowanie i certyfikacja to cel zewnętrzny; porównania i doskonalenie – wewnętrzny.","s":"COBIT 5 Framework (PL), s. 45","ctx":"<p>Cel wewnętrzny to porównanie obszarów organizacji albo doskonalenie dla własnych korzyści. Podręcznik: cele „mogą mieć charakter zewnętrzny i dotyczyć formalnego oszacowania, raportowania i certyfikacji”; od celu zależy stopień rygoryzmu oceny. Cztery cele tworzą ciąg: porównanie pokazuje słabe procesy, „jak jest / jak ma być” daje podstawę decyzji inwestycyjnych, analiza luk zamienia różnicę w projekty, a klasyfikacja ocen pozwala sprawdzić, czy luki maleją. Podręcznik pisze „organ nadzorujący” <span class=\"en\">governing body<\/span>.<\/p><p>Przykład: zarząd banku pyta, gdzie są kluczowe procesy i co sfinansować w przyszłym roku – cel wewnętrzny; regulator żąda formalnego raportu o procesach – cel zewnętrzny. Ocenia się procesy, a nie ludzi.<\/p>"},{"pt":"Sprawdź się","quiz":{"tresc":"Kto według podręcznika korzysta z porównania zdolności procesów jako celu oceny?","opcje":[{"t":"Organ Ładu i kierownictwo","ok":true,"w":"Dobrze. Ocena umożliwia organowi nadzorującemu i kierownictwu porównanie zdolności procesów."},{"t":"Klienci organizacji","w":"Klienci nie są wskazani jako odbiorcy porównania."},{"t":"Dostawcy oprogramowania","w":"Dostawcy nie są wskazani jako odbiorcy porównania."},{"t":"Wyłącznie zewnętrzny audytor","w":"Podręcznik wskazuje organ Ładu i kierownictwo."}],"src":"COBIT 5 Framework (PL), s. 45","pomoc":{"t":"Pytanie dotyczy lekcji 4.55 „Po co ocenia się zdolność procesów”. Cel lekcji: Potrafię wymienić cele oceny zdolności procesu i odróżnić cel wewnętrzny od zewnętrznego.","k":["cele-oceny"]}}},{"pt":"Arkusz próbny","sp1":"sp1-31","lekcja":"4.55","temat":"Po co ocenia się zdolność procesów","k":["cele-oceny"]},{"pt":"Lekcja 4.56","h":"PAM to wspólna podstawa, przewodniki – dwa rodzaje oceny","b":"<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>Publikacja<\/th><th>Do czego<\/th><\/tr><tr><td><w k=\"pam\">Model Oceny Procesu<\/w> (PAM)<\/td><td>procesy, wskaźniki, atrybuty, skala<\/td><\/tr><tr><td><w k=\"przewodnik-asesora\">Przewodnik Asesora<\/w><\/td><td>formalna ocena z dowodami<\/td><\/tr><tr><td><w k=\"przewodnik-samooceny\">Przewodnik Samooceny<\/w><\/td><td>uproszczona, nieformalna ocena – przygotowanie do formalnej<\/td><\/tr><\/table><\/div>","c":"Formalna ocena z dowodami to Przewodnik Asesora; lżejsza, bez wymogu dowodów – Przewodnik Samooceny.","s":"Sylabus; COBIT 5 Framework (PL), s. 41","ctx":"<p>Model Oceny Procesu <span class=\"en\">Process Assessment Model<\/span> opiera się na ISO/IEC 15504 i łączy procesy z Referencyjnego Modelu Procesu, wskaźniki obu wymiarów, dziewięć atrybutów i skalę ocen – dzięki temu wyniki różnych ocen znaczą to samo. Opis przewodników pochodzi z sylabusa; podręcznik FW-PL ich nazw nie podaje. Przewodnik Asesora prowadzi formalną ocenę zgodną z normą. Przewodnik Samooceny nie jest jego kopią „do użytku wewnętrznego” – to uproszczona, nieformalna ocena, która może przygotować do oceny formalnej. Sam PAM ma wartość jako model referencyjny; przewodniki z niego korzystają, a nie go oceniają.<\/p><p>Pułapka nazw: <span class=\"en\">Assessor Guide<\/span> bywa tłumaczony jako „Przewodnik osoby oceniającej”, <span class=\"en\">Self-Assessment Guide<\/span> – jako „Podręcznik samooceny”; na egzaminie: Przewodnik Asesora i Przewodnik Samooceny. Przykład: dział IT uczelni najpierw sam ocenia procesy i usuwa luki, a po roku zaprasza asesora, który zbiera dowody i wystawia formalną ocenę.<\/p>"},{"pt":"Sprawdź się","quiz":{"tresc":"Która publikacja jest wspólną podstawą Przewodnika Asesora i Przewodnika Samooceny?","opcje":[{"t":"Przewodnik osoby oceniającej","w":"To inna polska nazwa Przewodnika Asesora."},{"t":"Model Oceny Procesu (PAM)","ok":true,"w":"Dobrze. PAM zawiera procesy, wskaźniki, atrybuty i skalę."},{"t":"Norma ISO/IEC 27001","w":"To norma o bezpieczeństwie informacji."},{"t":"Model dojrzałości COBIT 4.1","w":"COBIT 5 nie opiera oceny na modelu dojrzałości."}],"src":"COBIT 5 Framework (PL), s. 41; sylabus PeopleCert","pomoc":{"t":"Pytanie dotyczy lekcji 4.56 „PAM, Przewodnik Asesora i Przewodnik Samooceny”. Cel lekcji: Potrafię powiedzieć, do czego służy Model Oceny Procesu, Przewodnik Asesora i Przewodnik Samooceny.","k":["przewodniki-oceny","pam","przewodnik-asesora","przewodnik-samooceny"]}}},{"pt":"Arkusz próbny","sp1":"sp1-07","lekcja":"4.56","temat":"PAM, Przewodnik Asesora i Przewodnik Samooceny","k":["przewodniki-oceny","pam","przewodnik-asesora","przewodnik-samooceny"]}]};</script>
