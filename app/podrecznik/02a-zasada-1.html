window.DECK={id:'02a-zasada-1',rozdzial:'Rozdział 2 · Zasada 1 · s. 17–22',tytul:'Realizacja potrzeb interesariusza',prev:'k-m0-wartosc.html',next:'k-pr-wartosc.html',
T:{
zasada1:{t:'Zasada 1',eg:'Zasada 1: Realizacja potrzeb interesariusza',pd:'Zasada 1: Spełnienie potrzeb interesariuszy',en:'Principle 1: Meeting Stakeholder Needs',wyj:'Pierwsza z pięciu zasad COBIT 5 odpowiada na pytanie, po co w ogóle zajmować się ładem i zarządzaniem IT: każda organizacja istnieje po to, żeby tworzyć wartość dla swoich interesariuszy. Dotyczy to zarówno firm, gdzie korzyści są zwykle finansowe, jak i urzędów czy szpitali publicznych, gdzie korzyścią są usługi publiczne.\n\nWartość nie jest jedna dla wszystkich – zarząd, klienci, regulator i pracownicy chcą różnych, czasem sprzecznych rzeczy. Dlatego zasada 1 daje dwa narzędzia: cel Ładu „Tworzenie Wartości” (korzyści, ryzyko i zasoby w równowadze) oraz kaskadę celów, która zamienia ogólne potrzeby w konkretne cele dla organizacji, dla IT i dla aktywatorów.\n\nPozostałe zasady mówią, jak tę wartość osiągać: w całej organizacji (zasada 2), jedną zintegrowaną strukturą ramową (zasada 3), za pomocą aktywatorów (zasada 4) i z oddzieleniem Ładu od Zarządzania (zasada 5).',zycie:'Remont mieszkania: Ty chcesz ładnej kuchni, partner – zmieścić się w 30 tys. zł, a dzieci – żeby wszystko skończyło się przed wrześniem. Dobry plan zaczyna się od spisania, czego chce każdy domownik, a dopiero potem wybiera się płytki i ekipę. Tak działa zasada 1: najpierw potrzeby, potem rozwiązania.',firma:'Bank planuje nową aplikację mobilną. Zanim informatycy zaczną programować, zarząd ustala, czego chcą klienci (szybkie przelewy, płatności telefonem), akcjonariusze (zysk, mniej kosztownych oddziałów), regulator (bezpieczeństwo, raportowanie) i pracownicy (mniej ręcznej pracy). Aplikacja ma sens, jeśli odpowiada na te potrzeby – a nie dlatego, że „technologia jest modna”.',urzad:'Gmina uruchamia e-usługę płacenia podatku od nieruchomości. Mieszkańcy chcą płacić bez wizyty w urzędzie, skarbnik – szybciej widzieć wpłaty, rada – zmieścić projekt w budżecie, a inspektor ochrony danych – bezpieczeństwa danych. Korzyścią nie jest tu zysk, tylko lepsza usługa publiczna.',egz:'Nazwa egzaminacyjna (Sample Paper 1): „Realizacja potrzeb interesariusza”; w podręczniku – „Spełnienie potrzeb interesariuszy”. Do zasady 1 należą cel Ładu „Tworzenie Wartości” (Rysunek 3) i kaskada celów (Rysunek 4) – częsta zła odpowiedź przypisuje kaskadę do zasady 4, bo kończy się na aktywatorach. Tworzenie wartości dotyczy też organizacji niekomercyjnych.',src:'FW-PL s. 17–18'},
inter:{t:'Interesariusz',eg:'Interesariusz',pd:'Interesariusz',en:'Stakeholder',wyj:'Interesariusz to każda osoba, grupa lub instytucja, która ma interes w tym, co robi organizacja, albo odczuje skutki jej decyzji. Nie musi niczego decydować ani nawet korzystać z systemu – wystarczy, że sprawa ją dotyczy.\n\nPodręcznik dzieli interesariuszy na wewnętrznych (np. zarząd, dyrektor generalny, dyrektor ds. informatyki, właściciele procesów biznesowych, audyt wewnętrzny, użytkownicy IT) i zewnętrznych (np. klienci, dostawcy, udziałowcy, organy nadzorcze, audytorzy zewnętrzni). Każda grupa zadaje inne pytania – Ilustracja 7 wylicza je osobno.\n\nW COBIT 5 interesariusze są punktem startu: ich potrzeby są pierwszym poziomem kaskady celów, a Ład ma te potrzeby ocenić, wyważyć i przełożyć na decyzje.',zycie:'Budowa placu zabaw na osiedlu. Interesariuszami są nie tylko dzieci i rodzice, ale też starsi sąsiedzi z parteru (hałas), wspólnota mieszkaniowa (koszt 80 tys. zł) i jej ubezpieczyciel (bezpieczeństwo urządzeń). Nikt z nich nie musi się huśtać, a każdy ma swoje zdanie.',firma:'Prywatny szpital wdraża elektroniczną dokumentację medyczną. Interesariusze wewnętrzni: zarząd, lekarze, pielęgniarki, dział IT, inspektor ochrony danych. Zewnętrzni: pacjenci, płatnik publiczny, dostawca oprogramowania, audytor zewnętrzny. Pacjent nie obsługuje systemu, a jednak to jego dane są stawką.',urzad:'Starostwo powiatowe wymienia system rejestracji pojazdów. Interesariusze wewnętrzni: starosta, sekretarz powiatu, naczelnik wydziału komunikacji, urzędnicy przy okienkach, informatyk. Zewnętrzni: mieszkańcy, stacje kontroli pojazdów, ministerstwo prowadzące centralną ewidencję i instytucje kontrolujące urząd.',egz:'Interesariusz nie musi być użytkownikiem ani decydentem – to częsta pułapka. Podział z Ilustracji 7: audyt WEWNĘTRZNY, dyrektor ds. ryzyka (CRO) i użytkownicy IT to interesariusze wewnętrzni; audytorzy ZEWNĘTRZNI, organy nadzorcze, klienci, dostawcy, udziałowcy i konsultanci – zewnętrzni. W nazwie zasady na egzaminie liczba pojedyncza: „Realizacja potrzeb interesariusza”.',src:'FW-PL s. 17, 22 (Ilustracja 7), 93'},
pot:{t:'Potrzeby interesariuszy',eg:'Potrzeby interesariuszy',pd:'Potrzeby interesariuszy',en:'Stakeholder Needs',wyj:'Potrzeby interesariuszy to to, czego różne grupy oczekują od organizacji – i od IT. Na Rysunkach 3 i 4 zawsze rozkłada się je na trzy części: jakie korzyści mają powstać, jakie ryzyko jest akceptowalne i jakie zasoby trzeba na to przeznaczyć.\n\nPotrzeby najłatwiej rozpoznać po pytaniach, które ludzie zadają, np. „Czy informacje, które przetwarzam, są dobrze zabezpieczone?” albo „Jak kontroluje się koszt IT?” (Ilustracja 7). Takie pytania są danymi wejściowymi kaskady.\n\nPotrzeby zmieniają się pod wpływem wyznaczników, a następnie przypisuje się je do 17 celów organizacji – pomaga w tym Załącznik D.',zycie:'Rodzina planuje wakacje. Dzieci chcą basenu (korzyść), babcia boi się długiego lotu (ryzyko), a budżet to 8 tys. zł (zasoby). Zanim wybierzecie hotel, spisujecie te potrzeby – inaczej ktoś wróci rozczarowany.',firma:'Zarząd sklepu internetowego pyta: „Ile zamówień tracimy, gdy strona się zawiesza?”, dyrektor finansowy: „Czemu hosting kosztuje 40% więcej niż rok temu?”, a dział prawny: „Czy przechowujemy dane klientów zgodnie z RODO (ogólnym rozporządzeniem o ochronie danych)?”. Każde z tych pytań to potrzeba, którą kaskada zamieni w cel.',urzad:'Wójt pyta: „Czy mieszkańcy będą zadowoleni z e-usług?”, skarbnik: „Czy zmieścimy się w budżecie na informatyzację?”, a sekretarz gminy: „Co zrobimy, gdy system podatkowy przestanie działać w terminie płatności raty?”. To trzy potrzeby – o korzyść, o zasoby i o ryzyko.',egz:'Potrzeby → cele organizacji łączy Załącznik D (Ilustracja 24), nie B ani C. Wyznacznik (zmiana przepisów, technologii, strategii) to nie potrzeba – wyznacznik WPŁYWA na potrzeby. Potrzeby opisuje się zawsze przez korzyści, ryzyko i zasoby.',src:'FW-PL s. 17–18, 21–22, 55–56'},
war:{t:'Cel Ładu: Tworzenie Wartości',eg:'Cel Ładu: Tworzenie Wartości (Rysunek 3)',pd:'Cel nadzoru: Tworzenie Wartości (Ilustracja 3)',en:'Governance Objective: Value Creation',wyj:'Według COBIT 5 nadrzędnym celem Ładu w każdej organizacji jest tworzenie wartości. Podręcznik definiuje to precyzyjnie: osiąganie korzyści w sposób maksymalnie oszczędny pod względem zasobów i przy zoptymalizowanym ryzyku.\n\nWartość ma więc trzy składniki, które trzeba utrzymać w równowadze: realizację korzyści, optymalizację ryzyka i optymalizację zasobów. Projekt, który daje duże korzyści, ale naraża organizację na nieakceptowalne ryzyko albo pochłania nieproporcjonalnie dużo pieniędzy, nie tworzy wartości.\n\nTe trzy składniki wracają w całym COBIT 5: na Rysunku 5 każdy z 17 celów organizacji ma przy nich oznaczenie P lub S, a trzy procesy domeny EDM nazywają się wprost od nich (EDM02 – korzyści, EDM03 – ryzyko, EDM04 – zasoby).',zycie:'Kupujesz samochód. Korzyść: wygodny dojazd do pracy. Ryzyko: używane auto bez historii serwisowej może się często psuć. Zasoby: 45 tys. zł oszczędności. Wartość to auto, które dowiezie Cię do pracy, nie zrujnuje budżetu i nie grozi awarią co miesiąc – a nie po prostu najtańsze albo najdroższe.',firma:'Ubezpieczyciel wdraża automatyczną likwidację drobnych szkód. Korzyść: wypłata w 24 godziny zamiast 14 dni. Ryzyko: wyłudzenia – dlatego szkody powyżej 5 tys. zł nadal ogląda rzeczoznawca. Zasoby: gotowa platforma zamiast budowy własnej od zera.',urzad:'Ministerstwo uruchamia portal do składania wniosków o dotacje. Korzyść: wnioski bez papieru i szybsza ocena. Ryzyko: przeciążenie portalu w ostatnim dniu naboru – stąd test obciążenia przed startem. Zasoby: projekt mieści się w budżecie, a obsługę przejmuje istniejący zespół.',egz:'„Ład” (egzamin) = „nadzór” (podręcznik) = governance; „Rysunek” (egzamin) = „Ilustracja” (podręcznik). Trzy elementy: realizacja korzyści, optymalizacja ryzyka, optymalizacja zasobów – nie „minimalizacja ryzyka”, nie „minimalizacja kosztów”, nie „maksymalizacja zysku”. Tworzenie wartości dotyczy także urzędów i organizacji non-profit.',src:'FW-PL s. 17 (Ilustracja 3)'},
kor:{t:'Realizacja korzyści',eg:'Realizacja korzyści',pd:'Realizacja korzyści',en:'Benefits Realisation',wyj:'Realizacja korzyści oznacza, że organizacja faktycznie osiąga to, dla czego podjęła działanie: więcej klientów, krótszy czas obsługi, lepsze usługi publiczne. Liczy się efekt dla interesariuszy, a nie sam fakt, że coś zbudowano.\n\nTo ważne rozróżnienie: „system wdrożony w terminie” to rezultat projektu, a korzyść pojawia się dopiero wtedy, gdy ludzie z niego korzystają i coś się poprawia. Korzyści mogą być finansowe (firma) albo niefinansowe (urząd, szpital publiczny).\n\nNa poziomie Ładu realizację korzyści zapewnia proces EDM02, a na Rysunku 5 aż 12 z 17 celów organizacji ma z nią relację podstawową (P).',zycie:'Kupujesz rower, żeby dojeżdżać do pracy i schudnąć. Korzyść nie polega na tym, że rower stoi w przedpokoju – pojawia się, gdy jeździsz nim trzy razy w tygodniu i po pół roku waga spada o 5 kg.',firma:'Bank wdrożył aplikację mobilną za 12 mln zł. Rezultat: aplikacja działa. Korzyść: po roku 60% klientów loguje się przez aplikację, a bank obsługuje więcej klientów taniej i może zamknąć kilka mało odwiedzanych oddziałów.',urzad:'Starostwo uruchomiło rezerwację wizyt online w wydziale komunikacji. Korzyść widać nie w dniu uruchomienia, ale gdy średni czas oczekiwania spada z 90 do 15 minut, a mieszkańcy przestają stać w kolejce od rana.',egz:'Na egzaminie: „Realizacja korzyści” – jeden z trzech elementów celu Ładu. Pułapki: korzyść ≠ rezultat (wdrożony system), korzyść ≠ wyłącznie zysk finansowy. Proces Ładu: EDM02 (w podręczniku „Zapewnienie realizacji korzyści”).',src:'FW-PL s. 17, 19 (Ilustracja 5)'},
ryz:{t:'Optymalizacja ryzyka',eg:'Optymalizacja ryzyka',pd:'Optymalizacja ryzyka',en:'Risk Optimisation',wyj:'Optymalizacja ryzyka oznacza utrzymanie ryzyka na poziomie, który organizacja świadomie akceptuje. Nie chodzi o zero ryzyka, bo to zwykle oznacza też zero korzyści: bank, który nie udziela kredytów, nie ma ryzyka kredytowego, ale nie ma też przychodów.\n\nDlatego COBIT 5 mówi „optymalizacja”, a nie „minimalizacja”: część ryzyka się ogranicza, część przenosi (np. na ubezpieczyciela), a część akceptuje. Ład decyduje, ile ryzyka warto ponieść za daną korzyść.\n\nNa Rysunku 5 cele organizacji 3, 4, 7 i 15 mają relację podstawową z ryzykiem i żadnej z korzyściami – to zarządzane ryzyko biznesowe, zgodność z przepisami, ciągłość usług i zgodność z politykami wewnętrznymi. Na poziomie Ładu ryzyko optymalizuje proces EDM03.',zycie:'Jeździsz samochodem, więc istnieje ryzyko kolizji. Nie rezygnujesz z jazdy (zero ryzyka = zero korzyści), tylko zapinasz pasy, wykupujesz OC i AC (ubezpieczenie odpowiedzialności cywilnej i autocasco) i nie siadasz za kierownicę zmęczony. Zostaje ryzyko, które świadomie akceptujesz.',firma:'Sklep internetowy akceptuje 30-minutową przerwę techniczną we wtorek o 3 w nocy, ale żadnej przerwy w Black Friday. Dla płatności kartą kupuje usługę wykrywania oszustw, a ryzyko drobnych zwrotów po prostu wkalkulowuje w ceny.',urzad:'Gmina akceptuje, że system podatkowy może nie działać w niedzielę rano, ale nie w ostatnim dniu płatności raty podatku. Dlatego przed terminem płatności wstrzymuje zmiany w systemie i ma w umowie z dostawcą reakcję na awarię w 2 godziny.',egz:'„Optymalizacja” ≠ „minimalizacja” ≠ „eliminacja” – dystraktor „minimalizacja ryzyka” często pojawia się w pytaniach o cel Ładu. Proces Ładu: EDM03 (w podręczniku „Zapewnienie optymalizacji ryzyka”).',src:'FW-PL s. 17, 19 (Ilustracja 5); sposoby reagowania na ryzyko (ograniczenie, przeniesienie, akceptacja) – wiedza ogólna'},
zas:{t:'Optymalizacja zasobów',eg:'Optymalizacja zasobów',pd:'Optymalizacja zasobów',en:'Resource Optimisation',wyj:'Optymalizacja zasobów oznacza takie wykorzystanie ludzi, pieniędzy, informacji, infrastruktury i aplikacji, żeby osiągnąć korzyści bez marnotrawstwa – ale też bez szkodliwych oszczędności. Zasób to nie tylko budżet: to również czas i kompetencje pracowników.\n\nOptymalizacja nie znaczy „najtaniej”. Rezygnacja z kopii zapasowych obniża koszty, ale podnosi ryzyko ponad akceptowalny poziom – czyli niszczy wartość, zamiast ją tworzyć. Zasobów ma być tyle, ile trzeba, i tam, gdzie są potrzebne.\n\nNa poziomie Ładu zapewnia to proces EDM04, a na Rysunku 5 relację podstawową z zasobami mają cele organizacji 9, 10, 11, 12, 14 i 16.',zycie:'Nie kupujesz 7-osobowego vana, jeśli dojeżdżasz do pracy sam – ale też nie wybierasz auta bez poduszek powietrznych, żeby zaoszczędzić. Optymalne zasoby to te, które pasują do potrzeby.',firma:'Szpital miał 40 serwerów, z czego połowa pracowała na 10% mocy. Przeniósł część systemów do chmury z opłatą za zużycie, a zaoszczędzone pieniądze przeznaczył na drugiego administratora – bo jeden informatyk na cały szpital był wąskim gardłem.',urzad:'Zamiast zamawiać własny system e-wniosków za 2 mln zł, gmina korzysta z gotowej platformy administracji publicznej, a informatyk zajmuje się bezpieczeństwem i kopiami zapasowymi. Pieniądze i czas idą tam, gdzie gmina naprawdę ich potrzebuje.',egz:'Optymalizacja ≠ „najtaniej” ≠ „minimalizacja kosztów”. Zasoby to nie tylko pieniądze, ale też ludzie, informacja, infrastruktura i aplikacje. Proces Ładu: EDM04 (w podręczniku „Zapewnienie optymalizacji zasobów”).',src:'FW-PL s. 17, 19 (Ilustracja 5); przykładowe rodzaje zasobów – wiedza ogólna'},
wyz:{t:'Wyznaczniki',eg:'nazwa niepotwierdzona – rozpoznaj po opisie („czynniki, które wpływają na potrzeby interesariuszy”)',pd:'Wyznaczniki dotyczące interesariuszy',en:'Stakeholder Drivers',wyj:'Wyznaczniki to zmiany i okoliczności, przez które interesariusze zaczynają potrzebować czegoś nowego. Podręcznik podaje trzy przykłady: zmiany w strategii, zmiany w otoczeniu biznesowym i regulacyjnym oraz nowe technologie.\n\nWyznacznik sam w sobie nie jest ani potrzebą, ani celem – jest przyczyną. Nowe przepisy o ochronie danych nie są „celem” urzędu, ale sprawiają, że kierownictwo i mieszkańcy zaczynają oczekiwać lepszej ochrony danych.\n\nW kaskadzie celów to krok 1: wyznaczniki wpływają na potrzeby interesariuszy (Rysunek 4, na samej górze). Uwaga na Rysunek 3: tam słowo „Wyznacznik” to tylko podpis strzałki od potrzeb interesariuszy do celu Ładu (potrzeby „napędzają” tworzenie wartości, ang. drive).',zycie:'Urodziło Ci się dziecko, więc nagle potrzebujesz większego mieszkania i samochodu z miejscem na wózek. Narodziny dziecka to wyznacznik, większe mieszkanie – potrzeba, a „kupić mieszkanie 3-pokojowe do końca roku” – już cel.',firma:'Konkurencyjny bank wprowadził płatności zegarkiem i zakładanie konta przez selfie (nowa technologia). Klienci zaczynają tego oczekiwać także od Twojego banku, a zarząd zmienia strategię na „najpierw telefon”. Technologia i ruch konkurencji to wyznaczniki; oczekiwania klientów – potrzeby.',urzad:'Ustawa nakłada na urzędy obowiązek doręczeń elektronicznych (zmiana otoczenia regulacyjnego). W starostwie potrzeby zmieniają się z dnia na dzień: kierownictwo chce zgodności z przepisami, a mieszkańcy – odbierania pism bez wizyty na poczcie.',egz:'Polska nazwa egzaminacyjna niepotwierdzona – rozpoznaj po opisie: czynniki, które wpływają na potrzeby interesariuszy (strategia, otoczenie biznesowe i regulacyjne, technologie). Pułapki: wyznacznik ≠ potrzeba ≠ cel organizacji. Nie myl z „czynnikami projektowymi” (design factors) z COBIT 2019 ani z „czynnikami umożliwiającymi” (w podręczniku = aktywatory).',src:'FW-PL s. 17–18 (Ilustracja 3 i 4); COBIT 2019 – wiedza ogólna'},
kas:{t:'Kaskada celów',eg:'Kaskada Celów',pd:'Kaskada celów COBIT 5',en:'Goals Cascade',wyj:'Kaskada celów to mechanizm, który zamienia ogólne potrzeby interesariuszy w coraz bardziej konkretne cele – aż do poziomu, na którym każdy zespół wie, co ma zrobić. Ma cztery kroki: wyznaczniki wpływają na potrzeby, potrzeby przekłada się na cele organizacji, cele organizacji na cele związane z Informatyką, a te – na cele aktywatora.\n\nKroki 2–4 mają tabele pomocnicze: Załącznik D (potrzeby → cele organizacji), Załącznik B (cele organizacji → cele IT) i Załącznik C (cele IT → procesy). Dzięki temu kaskada pozwala ustalić priorytety wdrożenia, doskonalenia i audytu oraz „przefiltrować” COBIT 5 do tego, co w danej organizacji naprawdę ważne.\n\nPodręcznik podkreśla, że to wskazówka, a nie uniwersalna prawda: każda organizacja powinna dopasować mapowania do swoich priorytetów, wielkości i branży.',zycie:'Chcesz „zdrowo żyć” (potrzeba). Przekładasz to na cele ogólne: lepsza kondycja i mniej stresu; potem na cele pośrednie: „przebiec 5 km w maju”, „spać 7 godzin”; a na końcu na cele dla narzędzi: plan treningów 3 razy w tygodniu, przypomnienie w telefonie o 22:30.',firma:'Sklep internetowy: klienci chcą, żeby sklep „zawsze działał” (potrzeba) → cel organizacji 7: ciągłość i dostępność usług biznesowych → cele IT 04, 10 i 14 (ryzyko IT, bezpieczeństwo, wiarygodne informacje) → cele aktywatora, np. test planu ciągłości działania raz na kwartał i dwóch administratorów pod telefonem w okresie świątecznym.',urzad:'Ministerstwo: obywatele chcą „załatwić sprawę bez kolejki” (potrzeba) → cel organizacji 6: kultura usług zorientowanych na klienta → cele IT 01 i 07 (IT zgodne ze strategią, usługi IT zgodne z wymogami) → cele aktywatora: zgłoszenia obywateli obsłużone w 2 dni, każda e-usługa ma wyznaczonego właściciela w departamencie.',egz:'Na egzaminie: „Kaskada Celów”. Należy do ZASADY 1 – typowa zła odpowiedź to zasada 4 (bo na końcu są aktywatory). Kolejność: (wyznaczniki →) potrzeby interesariuszy → cele organizacji → cele związane z Informatyką → cele aktywatora. Liczby: 17 celów organizacji i 17 celów IT; „40 celów ładu i zarządzania” to COBIT 2019, nie COBIT 5.',src:'FW-PL s. 17–21 (Ilustracja 4), 49–56; COBIT 2019 – wiedza ogólna'},
bsc:{t:'Zrównoważona karta wyników (BSC)',eg:'Zrównoważona karta wyników (BSC); dla IT – Zrównoważona karta wyników dla informatyki',pd:'Zrównoważona karta wyników (BSC); IT BSC',en:'Balanced Scorecard (BSC); IT Balanced Scorecard (IT BSC)',wyj:'Zrównoważona karta wyników to sposób oceniania organizacji z czterech perspektyw jednocześnie, żeby nie patrzeć wyłącznie na pieniądze. Wymiary to: finanse, klient, obszar wewnętrzny (procesy) oraz szkolenie i rozwój. Metodę opisali Robert Kaplan i David Norton (1996).\n\nCOBIT 5 używa BSC do uporządkowania celów: 17 celów organizacji podzielono według wymiarów BSC (Finanse 1–5, Klient 6–10, Obszar wewnętrzny 11–15, Szkolenie i rozwój 16–17), a 17 celów związanych z Informatyką – według IT BSC (Finanse 01–06, Klient 07–08, Obszar wewnętrzny 09–15, Szkolenie i rozwój 16–17).\n\nDzięki temu widać, czy zestaw celów jest naprawdę „zrównoważony”: czy organizacja dba nie tylko o koszty, ale też o klientów, sprawne procesy i rozwój ludzi.',zycie:'Oceniasz swój rok nie tylko po stanie konta (finanse), ale też po tym, czy bliscy są z Ciebie zadowoleni (klient), czy dom jest dobrze zorganizowany (obszar wewnętrzny) i czy nauczyłeś się czegoś nowego (szkolenie i rozwój).',firma:'Ubezpieczyciel ocenia rok w czterech wymiarach: zysk i koszty (finanse), zadowolenie klientów i czas wypłaty odszkodowania (klient), czas obsługi szkody w procesie (obszar wewnętrzny) oraz liczbę likwidatorów przeszkolonych z nowego systemu (szkolenie i rozwój).',urzad:'Gmina w raporcie o stanie gminy pokazuje: wykonanie budżetu (finanse), wyniki ankiety satysfakcji mieszkańców (klient), średni czas załatwienia sprawy (obszar wewnętrzny) i liczbę urzędników po szkoleniach (szkolenie i rozwój).',egz:'Pułapki: wśród celów organizacji wymiar Klient ma 5 celów (6–10), a w IT BSC tylko 2 (07–08). Cel 10 „Optymalizacja kosztów świadczenia usług” jest w wymiarze KLIENT, nie Finanse. Nie ma wymiaru „Ryzyko” ani „Zgodność”. Na egzaminie IT BSC to „Zrównoważona karta wyników dla informatyki”. Załącznik B podręcznika błędnie rozwija BSC jako „Business Score Card” – poprawnie Balanced Scorecard.',src:'FW-PL s. 17 (przypis 1: Kaplan, Norton, 1996), 18–19 (Ilustracja 5 i 6), 49'},
ps:{t:'P i S',eg:'P – relacja podstawowa · S – relacja wspierająca',pd:'P – relacja podstawowa · S – relacja wspierająca (drugorzędna)',en:'P – Primary · S – Secondary',wyj:'Litery P i S pokazują w tabelach COBIT 5, jak mocno jeden element zależy od drugiego. P (Primary) to relacja podstawowa – istotna, bez której cel trudno osiągnąć. S (Secondary) to relacja wspierająca – wciąż silna, ale mniej istotna; puste pole oznacza brak istotnego związku.\n\nTe same litery występują w trzech miejscach: na Rysunku 5 (cel organizacji ↔ korzyści, ryzyko, zasoby), w Załączniku B (cele organizacji ↔ cele IT) i w Załączniku C (cele IT ↔ procesy). Przykład: cel organizacji 7 ma P z celami IT 04, 10 i 14 oraz S z 01, 07 i 08.\n\nSkala ma tylko dwa stopnie, a w rzeczywistości powiązania tworzą płynne continuum – dlatego podręcznik każe traktować tabele jako wskazówkę i dopasować je do własnej organizacji.',zycie:'Do upieczenia ciasta podstawowe (P) są mąka, jajka i piekarnik – bez nich ciasta nie będzie. Wspierające (S) są dobra forma i waga kuchenna – bardzo pomagają, ale da się bez nich.',firma:'Szpital ustala, że dla ciągłości usług (cel 7) podstawowe są: zarządzanie ryzykiem IT, bezpieczeństwo i wiarygodne informacje (P), a wspierające – zgodność IT ze strategią, usługi IT zgodne z wymogami i dobre wykorzystanie aplikacji (S). Pieniądze na usprawnienia dostają najpierw obszary oznaczone P.',urzad:'Starostwo, które za priorytet uznało zgodność z przepisami (cel 4), widzi w Załączniku B relację P z celami IT 02 (zgodność IT z przepisami) i 10 (bezpieczeństwo informacji). Od nich zaczyna planowanie, a cele z S traktuje jako drugą kolejkę.',egz:'Litery z angielskiego: Primary i Secondary – „S” to NIE „strategiczna” ani „słaba, do pominięcia”. Tylko dwa stopnie (plus puste pole). Tabele P/S to wskazówka, nie uniwersalna prawda – nie stosuje się ich mechanicznie. W Załączniku D (potrzeby → cele) nie ma P/S – pola są tylko zaznaczone.',src:'FW-PL s. 18, 20, 49, 51, 55'},
celeorg:{t:'Cele organizacji',eg:'Cele organizacji',pd:'Cele przedsiębiorstwa',en:'Enterprise Goals',wyj:'Cele organizacji to 17 typowych celów, które stawiają sobie organizacje – od „wartości inwestycji biznesowych dla interesariuszy” po „kulturę innowacji produktów i biznesu”. COBIT 5 podaje je jako gotową listę (Rysunek 5), bo większość konkretnych celów danej firmy czy urzędu da się przypisać do jednego lub kilku z nich.\n\nCele są ułożone według czterech wymiarów zrównoważonej karty wyników: finanse (1–5), klient (6–10), obszar wewnętrzny (11–15) oraz szkolenie i rozwój (16–17). Przy każdym zaznaczono, czy wiąże się z realizacją korzyści, optymalizacją ryzyka i optymalizacją zasobów relacją podstawową (P) czy wspierającą (S).\n\nTo drugi poziom kaskady: trafiają tu potrzeby interesariuszy (przez Załącznik D), a stąd przechodzi się do celów związanych z Informatyką (przez Załącznik B). Lista nie jest wyczerpująca – to punkt odniesienia, nie zamknięty katalog.',zycie:'Planując domowy budżet, nie wymyślasz kategorii od zera – korzystasz z gotowej listy: mieszkanie, jedzenie, transport, oszczędności, rozrywka. Twój cel „wakacje w Grecji” po prostu przypisujesz do kategorii „oszczędności” i „rozrywka”.',firma:'Bank ma w strategii „zwiększyć sprzedaż kredytów hipotecznych o 15%” i „ograniczyć reklamacje o połowę”. Przypisuje je do celów organizacji 2 (portfel konkurencyjnych produktów i usług) i 6 (kultura usług zorientowanych na klienta) – i od tej chwili może korzystać z gotowych mapowań COBIT 5.',urzad:'Gmina zapisała w strategii rozwoju „przyjazny urząd” i „spełnienie nowych wymogów dostępności cyfrowej”. Odpowiadają im cele organizacji 6 (kultura usług zorientowanych na klienta) i 4 (zgodność z przepisami prawa i regulacjami). Słowo „przedsiębiorstwo” w podręczniku nie przeszkadza – cele pasują też do urzędu.',egz:'„Przedsiębiorstwo” (podręcznik) = „organizacja” (egzamin) = enterprise. Dokładnie 17 celów w 4 wymiarach BSC (5 + 5 + 5 + 2). Nie myl z 17 celami związanymi z Informatyką (też 17!) ani z COBIT 2019 (13 celów organizacji, 40 celów ładu i zarządzania). Potrzeby → cele organizacji: Załącznik D; cele organizacji → cele IT: Załącznik B.',src:'FW-PL s. 17–19 (Ilustracja 5); COBIT 2019 – wiedza ogólna'},
celeit:{t:'Cele związane z Informatyką',eg:'Cele związane z Informatyką',pd:'Cele związane z IT',en:'IT-related Goals',wyj:'Cele związane z Informatyką opisują, co musi zapewnić informacja i powiązana z nią technologia, żeby organizacja mogła osiągnąć swoje cele. Nie są to cele działu IT w oderwaniu od reszty, tylko rezultaty, których organizacja potrzebuje od IT – np. „bezpieczeństwo informacji, infrastruktury przetwarzania i aplikacji” albo „dostępność wiarygodnych i przydatnych informacji wspierających proces decyzyjny”.\n\nJest ich 17, ponumerowanych 01–17 i ułożonych według IT BSC: finanse (01–06), klient (07–08), obszar wewnętrzny (09–15) oraz szkolenie i rozwój (16–17).\n\nTo trzeci poziom kaskady. Z celami organizacji łączy je Załącznik B, a z procesami – Załącznik C. Podręcznik zastrzega, że IT nie jest jedynym źródłem sukcesu (finanse czy marketing też wpływają na cele organizacji), ale COBIT 5 zajmuje się tylko częścią związaną z IT.',zycie:'Żeby rodzina mogła pracować i uczyć się zdalnie (cel ogólny), domowa „informatyka” musi zapewnić: szybki internet, laptop dla każdego, kopię zdjęć w chmurze i hasło do Wi-Fi, którego nie zna cała klatka schodowa. To odpowiedniki celów IT.',firma:'Sklep internetowy chce zwinnie reagować na zmiany rynku (cel organizacji 8). Od IT potrzebuje m.in. celu 09 – zwinności IT: nową formę płatności wdraża w 2 tygodnie, a nie w pół roku – oraz celu 17: zespołu, który śledzi nowe technologie i proponuje innowacje.',urzad:'Ministerstwo chce podejmować decyzje na podstawie danych (cel organizacji 9). Od IT potrzebuje celu 14: dostępności wiarygodnych i przydatnych informacji – np. codziennie aktualnego raportu o liczbie wniosków w każdym województwie, a nie arkusza sprzed kwartału.',egz:'„IT” (podręcznik) = „Informatyka” (egzamin). 17 celów, numeracja dwucyfrowa 01–17, ułożone według IT BSC (egzamin: „Zrównoważona karta wyników dla informatyki”). Pułapki: celów IT nie jest 37 (to procesy) ani 7 (to kategorie aktywatorów); wymiar Klient w IT BSC ma tylko dwa cele (07, 08).',src:'FW-PL s. 18–19 (Ilustracja 6), 49–53'},
celeakt:{t:'Cele aktywatora',eg:'Cele aktywatora',pd:'Cele czynników umożliwiających',en:'Enabler Goals',wyj:'Ostatni poziom kaskady celów. Kiedy wiadomo już, czego organizacja potrzebuje od IT (cele związane z Informatyką), trzeba zdecydować, czym to osiągnąć – i tu wchodzą aktywatory: procesy, ludzie, informacja, zasady, struktury, kultura, usługi i infrastruktura.\n\nDla każdego aktywatora ustala się własny, konkretny cel, który da się zmierzyć – np. „proces obsługi incydentów zamyka 95% zgłoszeń w 4 godziny” albo „każdy pracownik przeszedł szkolenie z bezpieczeństwa”. Dzięki temu na samym dole kaskady każdy zespół wie, co dokładnie ma osiągnąć i po czym pozna, że się udało.\n\nCele aktywatora dzielą się na trzy kategorie: jakość wewnętrzną (w podręczniku: jakość rzeczywista), jakość kontekstową oraz dostęp i bezpieczeństwo (rozdział 5, s. 29).',zycie:'Chcesz być zdrowszy (cel ogólny). Żeby się udało, ustalasz cele dla „narzędzi”: buty – kupione do piątku; plan treningów – 3 razy w tygodniu; lodówka – bez słodyczy; partner – biega z Tobą w soboty. Każde narzędzie ma swój mierzalny cel.',firma:'Bank chce bezpieczeństwa danych (cel IT 10). Cele aktywatora: proces obsługi incydentów – 95% w 4 godziny; polityka haseł – zatwierdzona i znana wszystkim; zespół bezpieczeństwa – 2 osoby z certyfikatem; rejestr incydentów – kompletny i aktualny; kultura – pracownicy zgłaszają podejrzane maile bez obawy przed karą.',urzad:'Gmina chce chronić dane mieszkańców. Cele aktywatora: procedura reagowania na wyciek – zgłoszenie w terminie z przepisów; zarządzenie wójta o bezpieczeństwie informacji – przyjęte; informatyk – po szkoleniu z ochrony danych; kopie zapasowe systemu podatkowego – codziennie, sprawdzane raz w miesiącu.',egz:'„Czynnik umożliwiający” w podręczniku = „aktywator” na egzaminie. Cele aktywatora to czwarty, ostatni poziom kaskady (po celach organizacji i celach związanych z Informatyką). Dla procesów powiązania z celami IT podaje Załącznik C.',src:'FW-PL s. 18–19, 28–29'},
zalB:{t:'Załącznik B',eg:'Załącznik B',pd:'Załącznik B – Szczegółowe mapowanie celów przedsiębiorstwa na cele związane z IT',en:'Appendix B: Detailed Mapping Enterprise Goals – IT-related Goals',wyj:'Załącznik B to tabela 17 × 17 (Ilustracja 22): w kolumnach 17 celów organizacji, w wierszach 17 celów związanych z Informatyką, a na przecięciu P, S albo puste pole. Pokazuje, które cele IT trzeba osiągnąć, żeby wesprzeć dany cel organizacji.\n\nPrzykład 7 z podręcznika: cel organizacji 7 „Ciągłość i dostępność usług biznesowych” zależy przede wszystkim (P) od celów IT 04, 10 i 14, a w mniejszym stopniu (S) od 01, 07 i 08. Tabelę można czytać też odwrotnie: cel IT 09 „Zwinność IT” wspiera podstawowo cele organizacji 2, 8, 11 i 17.\n\nTo krok 3 kaskady. Jak wszystkie tabele mapowania, jest wskazówką, którą organizacja dopasowuje do siebie; powstała na podstawie badań Antwerp Management School i opinii ekspertów.',zycie:'Jak tabela w poradniku o zdrowym trybie życia: w kolumnach cele („więcej energii”, „lepszy sen”), w wierszach nawyki, a w polach – czy nawyk pomaga bardzo (P), trochę (S), czy wcale. Szukasz kolumny swojego celu i od razu widzisz, od czego zacząć.',firma:'Ubezpieczyciel za priorytet uznał cel organizacji 7 (ciągłość usług – klienci zgłaszają szkody całą dobę). W Załączniku B odczytuje: P – cele IT 04, 10, 14; S – 01, 07, 08. Pierwsze inwestycje idą więc w zarządzanie ryzykiem IT, bezpieczeństwo i wiarygodne dane o szkodach.',urzad:'Gmina chce przestrzegać własnych zarządzeń (cel organizacji 15 – zgodność z politykami wewnętrznymi). W Załączniku B widzi relację P z celami IT 02, 10 i 15, więc zleca informatykowi przegląd zgodności systemów z zarządzeniem o bezpieczeństwie informacji.',egz:'B = cele organizacji → cele związane z Informatyką (Ilustracja 22, s. 50). Kolejność załączników w kaskadzie: D → B → C (nie alfabetyczna!). Zapamiętaj przykład 7: P – 04, 10, 14; S – 01, 07, 08 – w pytaniu łatwo zamienić P z S.',src:'FW-PL s. 49–50 (Ilustracja 22, przykład 7)'},
zalC:{t:'Załącznik C',eg:'Załącznik C',pd:'Załącznik C – Szczegółowe mapowanie celów związanych z IT na procesy związane z IT',en:'Appendix C: Detailed Mapping IT-related Goals – IT-related Processes',wyj:'Załącznik C to tabela (Ilustracja 23): w kolumnach 17 celów związanych z Informatyką, w wierszach wszystkie 37 procesów COBIT 5 pogrupowanych w domeny, a na przecięciach P lub S. Pokazuje, które procesy trzeba usprawnić, żeby osiągnąć dany cel IT.\n\nPrzykład 8 z podręcznika: proces APO13 „Zarządzanie bezpieczeństwem” wspiera podstawowo cele IT 02, 04, 06, 10 i 14, a w mniejszym stopniu 07 i 08. Czytając w drugą stronę: cel IT 10 (bezpieczeństwo) realizują podstawowo procesy EDM03, APO12, APO13, BAI06 i DSS05.\n\nTo krok 4 kaskady, ale tylko dla jednego aktywatora – procesów. Dla pozostałych aktywatorów (ludzi, struktur, informacji, kultury…) cele trzeba ustalić osobno, bo same procesy nie wystarczą.',zycie:'Jak tabela programów w instrukcji pralki: w kolumnach to, co chcesz uprać (białe koszule, wełniany sweter), w wierszach programy, a w polach – który program jest podstawowy, a który może pomóc. Ale sama pralka nie wystarczy – potrzebny jest jeszcze proszek i ktoś, kto rozwiesi pranie.',firma:'Bank po audycie bezpieczeństwa wybiera cel IT 10. Z Załącznika C odczytuje procesy z P: EDM03 (optymalizacja ryzyka), APO12 (ryzyko), APO13 (bezpieczeństwo), BAI06 (zmiany) i DSS05 (usługi bezpieczeństwa) – i to je usprawnia w pierwszej kolejności.',urzad:'Starostwo chce mieć wiarygodne dane do decyzji (cel IT 14). Załącznik C wskazuje jako podstawowe m.in. procesy APO09, APO13, BAI04, BAI10, DSS03 i DSS04, więc naczelnik informatyki zaczyna od umów o poziomie usług i porządku w konfiguracji systemów.',egz:'C = cele związane z Informatyką → procesy (37 procesów, Ilustracja 23, s. 52–53). Załącznik C dotyczy TYLKO procesów, nie wszystkich aktywatorów. Nie myl: B (cele organizacji → cele IT), D (potrzeby → cele organizacji). Przykład 8 (APO13): P – 02, 04, 06, 10, 14; S – 07, 08.',src:'FW-PL s. 19, 21, 51–53 (Ilustracja 23, przykład 8); odczyt dla celów 10 i 14 – za tabelą z części „Schemat kaskady”'},
zalD:{t:'Załącznik D',eg:'Załącznik D',pd:'Załącznik D – Potrzeby interesariuszy oraz cele przedsiębiorstwa',en:'Appendix D: Stakeholder Needs and Enterprise Goals',wyj:'Załącznik D (Ilustracja 24) łączy typowe pytania interesariuszy wewnętrznych z Ilustracji 7 – np. „Czy uwzględniłem całe ryzyko związane z IT?” albo „Jak kontroluje się koszt IT?” – z 17 celami organizacji. Pole na przecięciu jest zaznaczone, jeśli daną potrzebę trzeba uwzględnić przy danym celu.\n\nW odróżnieniu od Załączników B i C nie ma tu liter P i S – pole jest po prostu wypełnione albo puste. Przykład odczytu: pytanie „Czy informacje, które przetwarzam, są dobrze zabezpieczone?” wiąże się z celami organizacji 3, 4, 7 i 15.\n\nTo krok 2 kaskady – pierwszy, w którym korzysta się z tabeli. Jak pozostałe mapowania, jest sugerowanym typowym zbiorem relacji, a nie mechaniczną regułą.',zycie:'Jak ściąga „z czym iść do jakiego lekarza”: Twoje pytanie („czemu boli mnie kolano po bieganiu?”) prowadzi do konkretnej kategorii – ortopeda, fizjoterapeuta. Załącznik D robi to samo z pytaniami o IT i celami organizacji.',firma:'Dyrektor finansowy sklepu internetowego pyta: „Jak kontroluje się koszt IT?”. Załącznik D łączy to pytanie z celami organizacji 10, 12 i 14 (koszty usług, koszty procesów, wydajność), więc sklep wie, które cele uwzględnić w planie na przyszły rok.',urzad:'Audytor wewnętrzny ministerstwa pyta: „W jaki sposób zapewnia się audyt IT?”. Załącznik D wskazuje cele organizacji 4 (zgodność z przepisami) i 15 (zgodność z politykami wewnętrznymi) – od nich zaczyna się dalsza kaskada.',egz:'D = potrzeby (pytania) interesariuszy WEWNĘTRZNYCH → cele organizacji (Ilustracja 24, s. 55–56). Bez P/S – tylko zaznaczenie. Kolejność w kaskadzie: D → B → C. Pytania pochodzą z Ilustracji 7 (s. 22).',src:'FW-PL s. 22 (Ilustracja 7), 55–56 (Ilustracja 24); odczyt zaznaczeń – za tabelą z części „Schemat kaskady”'}
},
S:[
{pt:'Zasada 1 · s. 17',h:'Po co istnieje każda organizacja?',b:'<p><w k="zasada1">Zasada 1</w>: Realizacja potrzeb interesariusza<span class="en">Principle 1: Meeting Stakeholder Needs</span></p><p>Zaczyna od prostej myśli: każda organizacja istnieje po to, żeby tworzyć wartość dla swoich <w k="inter">interesariuszy</w> – niezależnie od tego, czy działa komercyjnie.</p><div class="cards"><div><b>Firma</b>korzyści zwykle finansowe – np. więcej klientów i niższe koszty obsługi w banku</div><div><b>Urząd, szpital publiczny</b>korzyścią są usługi publiczne – np. sprawa załatwiona bez kolejki</div></div>',c:'Cel jest ten sam: wartość dla interesariuszy.',s:'COBIT 5 Framework (PL), s. 17.',ctx:'<p>Zasada 1 jest punktem wyjścia całego COBIT 5: zanim zapytamy, jakie procesy czy narzędzia wdrożyć, trzeba ustalić, po co organizacja w ogóle działa i dla kogo. Odpowiedź podręcznika brzmi: żeby tworzyć wartość dla <w k="inter">interesariuszy</w>. Wszystko, co dalej – <w k="war">cel Ładu</w>, <w k="kas">Kaskada Celów</w>, aktywatory – służy temu, by tę wartość rozpisać na konkretne cele i ją dostarczyć.</p><p>Przykład: szpital powiatowy nie ma akcjonariuszy czekających na dywidendę, ale ma pacjentów, organ prowadzący, płatnika i personel. Jego „zyskiem” jest krótsza kolejka na badanie albo bezpieczna dokumentacja medyczna. Narzędzia COBIT 5 działają tu tak samo jak w banku – zmienia się tylko postać korzyści.</p><p>Pułapka egzaminacyjna: zdanie „tworzenie wartości dotyczy tylko przedsiębiorstw komercyjnych” jest fałszywe – podręcznik mówi wprost, że dotyczy każdej organizacji, niezależnie od tego, czy prowadzi działalność komercyjną. Druga pułapka to nazwa: na egzaminie „Realizacja potrzeb interesariusza”, w podręczniku „Spełnienie potrzeb interesariuszy” – to ta sama zasada.</p>'},
{pt:'Zasada 1 · s. 22 · Rysunek 7',h:'Kim są interesariusze?',b:'<p><w k="inter">Interesariusz</w><span class="en">Stakeholder</span></p><p>To każdy, kogo sprawa dotyczy – nie musi decydować ani korzystać z systemu. Podręcznik dzieli ich na dwie grupy (wybór z Rysunku 7):</p><div class="tblwrap"><table class="tbl"><tr><th>Wewnętrzni</th><th>Zewnętrzni</th></tr><tr><td>Zarząd<span class="en">Board</span></td><td>Partnerzy biznesowi<span class="en">Business partners</span></td></tr><tr><td>Dyrektor generalny (CEO)<span class="en">Chief executive officer</span></td><td>Dostawcy<span class="en">Vendors</span></td></tr><tr><td>Dyrektor ds. finansowych (CFO)<span class="en">Chief financial officer</span></td><td>Udziałowcy<span class="en">Shareholders</span></td></tr><tr><td>Dyrektor ds. informatyki (CIO)<span class="en">Chief information officer</span></td><td>Organy nadzorcze / rządowe<span class="en">Regulators / government</span></td></tr><tr><td>Dyrektor ds. ryzyka (CRO)<span class="en">Chief risk officer</span></td><td>Użytkownicy zewnętrzni<span class="en">External users</span></td></tr><tr><td>Właściciele procesów biznesowych<span class="en">Business process owners</span></td><td>Klienci<span class="en">Customers</span></td></tr><tr><td>Audyt wewnętrzny<span class="en">Internal audit</span></td><td>Audytorzy zewnętrzni<span class="en">External auditors</span></td></tr><tr><td>Użytkownicy IT<span class="en">IT users</span></td><td>Konsultanci<span class="en">Consultants</span></td></tr></table></div><p>Każda grupa zadaje własne pytania o IT – to one są <w k="pot">potrzebami interesariuszy</w>.</p>',c:'Audyt wewnętrzny jest wewnętrzny, audytor zewnętrzny – zewnętrzny.',s:'COBIT 5 Framework (PL), s. 22, Ilustracja 7. Nazwy angielskie – oryginał COBIT 5 (wiedza ogólna).',ctx:'<p>Lista z Rysunku 7 nie służy do wkuwania, tylko do zadawania przy każdej decyzji o IT pytania: kogo jeszcze to dotyczy? Podręcznik zestawia z nią pytania, które zadają poszczególne grupy – np. „Czy informacje, które przetwarzam, są dobrze zabezpieczone?” albo „Jak kontroluje się koszt IT?”. Te pytania to właśnie <w k="pot">potrzeby interesariuszy</w>, czyli materiał wejściowy dla kaskady.</p><p>Przykład: sklep internetowy zmienia operatora płatności. Wewnątrz decyzja dotyczy zarządu, dyrektora finansowego (CFO, <span class="en">Chief Financial Officer</span>), właściciela procesu sprzedaży i użytkowników IT w obsłudze zwrotów; na zewnątrz – klientów, nowego dostawcy, partnerów biznesowych i audytora zewnętrznego badającego sprawozdanie. Pominięcie jednej grupy potrafi zniweczyć całą korzyść.</p><p>Pułapka: o podziale decyduje miejsce względem organizacji, a nie słowo w nazwie funkcji. Audyt wewnętrzny jest wewnętrzny, choć „kontroluje”; konsultant jest zewnętrzny, nawet gdy pracuje w biurze firmy. Warto też wiedzieć, że <w k="zalD">Załącznik D</w> łączy z celami organizacji tylko pytania interesariuszy wewnętrznych.</p>'},
{pt:'Sprawdź się',quiz:{kontekst:'Dyrektor szpitala powiatowego (publicznego) mówi na naradzie: „COBIT 5 jest dla firm. Nie mamy zysku, więc tworzenie wartości nas nie dotyczy”.',tresc:'Która odpowiedź jest zgodna z <b>zasadą 1</b>?',opcje:[{t:'Dyrektor ma rację – cel Ładu „Tworzenie Wartości” dotyczy tylko organizacji komercyjnych.',w:'Podręcznik mówi wprost: tworzenie wartości jest celem Ładu każdej organizacji, niezależnie od tego, czy działa komercyjnie.'},{t:'Szpital musi przeliczyć każdą usługę na zysk, bo COBIT 5 mierzy wartość tylko w pieniądzu.',w:'Korzyści mogą mieć różną postać – w firmach zwykle finansową, w podmiotach publicznych są nimi usługi publiczne.'},{t:'Szpital też tworzy wartość – jego korzyścią są głównie usługi dla pacjentów.',ok:true,w:'Tak. Wartość to korzyści przy optymalnym ryzyku i zasobach, a dla podmiotów publicznych korzyścią są usługi publiczne (s. 17).'},{t:'Zasada 1 dotyczy wyłącznie działu IT, więc dyrektora szpitala nie obejmuje.',w:'Zasada 1 zaczyna od potrzeb interesariuszy całej organizacji; to, że Ład obejmuje całą organizację, a nie tylko dział IT, podkreśla też zasada 2.'}],src:'COBIT 5 Framework (PL), s. 17. Pytanie autorskie w stylu egzaminu.',pomoc:{t:'Pytanie dotyczy zakresu zasady 1: kogo obejmuje cel Ładu „Tworzenie Wartości” i jaką postać mogą przybierać korzyści w różnych organizacjach. Wróć do pierwszego akapitu rozdziału 2 (s. 17).',k:['zasada1','war','kor']}}},
{pt:'Sprawdź się',quiz:{kontekst:'Ubezpieczyciel wdraża aplikację do zgłaszania szkód przez telefon. Kierownik projektu dzieli interesariuszy według Rysunku 7.',tresc:'Które zestawienie zawiera <b>wyłącznie</b> interesariuszy zewnętrznych?',opcje:[{t:'Klienci, audytorzy zewnętrzni, organ nadzoru finansowego',ok:true,w:'Wszyscy trzej są na liście interesariuszy zewnętrznych z Rysunku 7 (klienci, audytorzy zewnętrzni, organy nadzorcze/rządowe).'},{t:'Zarząd, właściciele procesów biznesowych, klienci',w:'Klienci są zewnętrzni, ale zarząd i właściciele procesów biznesowych to interesariusze wewnętrzni.'},{t:'Audyt wewnętrzny, dostawcy, udziałowcy',w:'Dostawcy i udziałowcy są zewnętrzni, ale audyt wewnętrzny – jak wskazuje nazwa – jest interesariuszem wewnętrznym.'},{t:'Dyrektor ds. ryzyka (CRO), zewnętrzni konsultanci, użytkownicy IT',w:'Konsultanci są zewnętrzni, ale CRO i użytkownicy IT należą do interesariuszy wewnętrznych.'}],src:'COBIT 5 Framework (PL), s. 22, Ilustracja 7. Pytanie autorskie w stylu egzaminu.',pomoc:{t:'Przypomnij sobie podział interesariuszy z Rysunku 7 na wewnętrznych i zewnętrznych. Sprawdź każdą osobę lub grupę w zestawieniu osobno – zestawienie musi być zgodne w całości.',k:['inter']}}},
{pt:'Zasada 1 · s. 17 · Rysunek 3',h:'Wartość = trzy rzeczy w równowadze',b:'<p><w k="war">Cel Ładu: Tworzenie Wartości</w><span class="en">Governance Objective: Value Creation</span></p><p>To osiąganie korzyści możliwie oszczędnie i przy zoptymalizowanym ryzyku. Składa się z trzech elementów:</p><div class="cards"><div><b>1</b><w k="kor">Realizacja korzyści</w><span class="en">Benefits Realisation</span></div><div><b>2</b><w k="ryz">Optymalizacja ryzyka</w><span class="en">Risk Optimisation</span></div><div><b>3</b><w k="zas">Optymalizacja zasobów</w><span class="en">Resource Optimisation</span></div></div><p>Duża korzyść kosztem nieakceptowalnego ryzyka albo marnotrawstwa zasobów to nie jest wartość. „Optymalizacja” nie znaczy „minimalizacja”.</p>',c:'Korzyść za rozsądną cenę i przy rozsądnym ryzyku.',s:'COBIT 5 Framework (PL), s. 17, Ilustracja 3.',ctx:'<p>Rysunek 3 pokazuje, że potrzeby interesariuszy „napędzają” cel Ładu, a ten rozkłada się na trzy elementy. To najważniejszy schemat zasady 1, bo te same elementy wracają dalej: przy każdym z 17 <w k="celeorg">celów organizacji</w> Rysunek 5 zaznacza, czy wiąże się on z korzyściami, ryzykiem i zasobami relacją P czy S. Kto rozumie te trzy elementy, łatwiej odczyta tamtą tabelę.</p><p>Przykład: ubezpieczyciel chce wypłacać drobne odszkodowania automatycznie. Sama szybkość wypłaty (korzyść) nie wystarczy – trzeba ustalić, jaki poziom wyłudzeń jest akceptowalny (ryzyko) i czy lepiej kupić gotową platformę, czy budować własną (zasoby). Dopiero decyzja ważąca wszystkie trzy elementy tworzy wartość.</p><p>Pułapka: dystraktory zmieniają jedno słowo – „minimalizacja ryzyka”, „minimalizacja kosztów”, „maksymalizacja zysku”. Poprawne nazwy to realizacja korzyści, optymalizacja ryzyka i optymalizacja zasobów. Egzaminacyjny „Ład” to podręcznikowy „nadzór” (<span class="en">governance</span>), a „Rysunek” – podręcznikowa „Ilustracja”.</p>'},
{pt:'Sprawdź się',quiz:{kontekst:'Sklep internetowy przygotowuje się do Black Friday, kiedy ruch rośnie dziesięciokrotnie. Propozycje:<br>1. Kupić na stałe trzy razy więcej własnych serwerów.<br>2. Wynająć dodatkową moc w chmurze na tydzień i wcześniej zrobić test obciążenia.<br>3. Wyłączyć weryfikację płatności, żeby zakupy szły szybciej.',tresc:'Która propozycja najlepiej realizuje cel Ładu: <b>Tworzenie Wartości</b>?',opcje:[{t:'1 – bo najmocniej ogranicza ryzyko awarii',w:'Ryzyko spada, ale serwery przez 51 tygodni w roku stoją prawie bezczynnie – zasoby nie są zoptymalizowane.'},{t:'3 – bo daje najwięcej zamówień',w:'Korzyść rośnie, ale ryzyko oszustw płatniczych staje się nieakceptowalne. Wartość wymaga równowagi trzech elementów.'},{t:'1 i 3 – bo razem dają największą sprzedaż',w:'To połączenie dwóch błędów: marnotrawstwa zasobów i nieakceptowalnego ryzyka.'},{t:'2',ok:true,w:'Korzyść (obsłużony ruch) przy zoptymalizowanych zasobach (płacisz tylko za tydzień) i zoptymalizowanym ryzyku (test obciążenia przed startem).'}],src:'COBIT 5 Framework (PL), s. 17. Pytanie autorskie w stylu egzaminu.',pomoc:{t:'Cel Ładu to równowaga trzech elementów. Oceń każdą propozycję pod kątem korzyści, ryzyka i zasobów jednocześnie, a nie tylko jednego z nich.',k:['war','kor','ryz','zas']}}},
{pt:'Sprawdź się',quiz:{tresc:'Która opcja <b>NIE</b> jest elementem celu Ładu: Tworzenie Wartości?',opcje:[{t:'Realizacja korzyści',w:'To pierwszy z trzech elementów (Rysunek 3).'},{t:'Minimalizacja ryzyka',ok:true,w:'COBIT 5 mówi o optymalizacji, nie minimalizacji ryzyka. Ryzyko utrzymuje się na akceptowalnym poziomie, bo zero ryzyka zwykle oznacza też zero korzyści.'},{t:'Optymalizacja zasobów',w:'To trzeci element – zasoby wykorzystane bez marnotrawstwa, ale też bez szkodliwych oszczędności.'},{t:'Optymalizacja ryzyka',w:'To drugi element – i poprawna nazwa, w odróżnieniu od „minimalizacji”.'}],src:'COBIT 5 Framework (PL), s. 17, Ilustracja 3. Pytanie autorskie w stylu egzaminu.',pomoc:{t:'Pytanie sprawdza dokładne nazwy trzech elementów celu Ładu z Rysunku 3. Zwróć uwagę na całą nazwę, nie tylko na temat (korzyści, ryzyko, zasoby).',k:['war','ryz','zas']}}},
{pt:'Zasada 1 · s. 17',h:'Każdy chce czegoś innego',b:'<p>Interesariusze mają różne, czasem wykluczające się oczekiwania. Ład je <b>negocjuje i decyduje</b>, uwzględniając wszystkich. Przy każdej decyzji pyta:</p><div class="tblwrap"><table class="tbl"><tr><th>Pytanie</th><th>Bank: aplikacja</th><th>Gmina: e-podatki</th></tr><tr><td>Kto odnosi korzyści?<span class="en">Who receives the benefits?</span></td><td>klienci, akcjonariusze</td><td>mieszkańcy, urząd</td></tr><tr><td>Kto ponosi ryzyko?<span class="en">Who bears the risk?</span></td><td>klienci (dane), bank (kary)</td><td>mieszkańcy (dane), gmina</td></tr><tr><td>Jakie zasoby są wymagane?<span class="en">What resources are required?</span></td><td>budżet, programiści, chmura</td><td>budżet, informatyk, dostawca</td></tr></table></div>',c:'Korzyść i ryzyko często spadają na różne osoby.',s:'COBIT 5 Framework (PL), s. 17. Przykłady – kursu.',ctx:'<p>Ten slajd odpowiada na pytanie, kto właściwie ustala, co jest wartością. Skoro interesariusze chcą rzeczy sprzecznych, ktoś musi je wyważyć – i to jest zadanie Ładu. Według podręcznika system Ładu powinien uwzględnić oczekiwania wszystkich interesariuszy, zanim podejmie decyzję o korzyściach, ryzyku i zasobach. Trzy pytania z tabeli to praktyczne narzędzie tego ważenia.</p><p>Przykład: szpital wprowadza rejestrację wizyt przez aplikację. Korzyść odnoszą pacjenci i rejestracja, ryzyko wycieku danych ponoszą głównie pacjenci, a ryzyko kar – szpital. Zasoby (budżet, informatycy, dostawca) wykłada dyrekcja. Gdy korzyść i ryzyko spadają na różne osoby, łatwo o decyzję wygodną dla jednej grupy kosztem drugiej – właśnie temu ma zapobiec Ład.</p><p>Pułapka: Ład to nie „spełnij życzenia najważniejszego interesariusza” ani „oddaj decyzję działowi IT”. Te trzy pytania przygotowują grunt pod kaskadę: dopiero wyważone <w k="pot">potrzeby</w> można przełożyć na <w k="celeorg">cele organizacji</w>.</p>'},
{pt:'Sprawdź się',quiz:{kontekst:'Ministerstwo buduje centralny rejestr wniosków. Minister chce uruchomienia przed końcem roku, departament budżetu – niskiego kosztu, inspektor ochrony danych – pełnego bezpieczeństwa, a obywatele – prostej obsługi przez telefon.',tresc:'Co według zasady 1 jest zadaniem <b>Ładu</b> w tej sytuacji?',opcje:[{t:'Realizować oczekiwania ministra, bo jest najważniejszym interesariuszem',w:'Ład ma uwzględnić oczekiwania wszystkich interesariuszy, a nie tylko najwyżej postawionego.'},{t:'Przekazać decyzję dyrektorowi IT, bo sprawa dotyczy systemu informatycznego',w:'To decyzja o wartości dla całej organizacji, a nie decyzja techniczna – IT nie powinno samo rozstrzygać sprzecznych oczekiwań.'},{t:'Wybrać wariant, który całkowicie eliminuje ryzyko, nawet kosztem kilkuletniego opóźnienia',w:'Celem jest optymalizacja, a nie eliminacja ryzyka – takie opóźnienie niszczy korzyści.'},{t:'Negocjować i decydować, ważąc korzyści, ryzyko i zasoby wszystkich stron',ok:true,w:'Podręcznik: Ład polega na negocjowaniu i podejmowaniu decyzji z uwzględnieniem oczekiwań wszystkich interesariuszy; pyta, kto odnosi korzyści, kto ponosi ryzyko i jakie zasoby są wymagane.'}],src:'COBIT 5 Framework (PL), s. 17. Pytanie autorskie w stylu egzaminu.',pomoc:{t:'Przypomnij sobie, jak podręcznik (s. 17) opisuje rolę Ładu wtedy, gdy interesariusze mają różne, czasem wykluczające się oczekiwania.',k:['war','inter','pot']}}},
{pt:'Kaskada celów · krok 1',h:'Potrzeby się zmieniają',b:'<p><w k="wyz">Wyznaczniki</w><span class="en">Stakeholder Drivers</span></p><p>To zmiany, przez które interesariusze zaczynają chcieć czegoś nowego. Podręcznik wymienia trzy:</p><div class="cards"><div><b>Strategia</b>zmiany w strategii<span class="en">strategy changes</span></div><div><b>Otoczenie</b>zmiany w otoczeniu biznesowym i regulacyjnym<span class="en">changing business and regulatory environment</span></div><div><b>Technologia</b>nowe technologie<span class="en">new technologies</span></div></div><p>Przykłady: konkurencja ma płatności zegarkiem – klienci banku chcą tego samego; przepisy wymagają doręczeń elektronicznych – urząd musi je zapewnić.</p>',c:'Wyznaczniki wpływają na potrzeby – same nie są potrzebą ani celem.',s:'COBIT 5 Framework (PL), s. 17–18, Ilustracja 4. Nazwy angielskie – oryginał COBIT 5 (wiedza ogólna).',ctx:'<p>Potrzeby interesariuszy nie są dane raz na zawsze, dlatego <w k="kas">Kaskada Celów</w> zaczyna się krok przed nimi – od <w k="wyz">wyznaczników</w>. Podręcznik opisuje też szerszy kontekst: czynniki zewnętrzne (rynek, branża, sytuacja geopolityczna) i wewnętrzne (kultura, organizacja, apetyt na ryzyko), do których trzeba dopasować Ład i Zarządzanie. Wyznaczniki to te zmiany, które przesuwają oczekiwania ludzi.</p><p>Przykład: ubezpieczyciel przyjmuje strategię „najpierw kanał cyfrowy” (zmiana strategii). Zarząd zaczyna pytać o dostępność aplikacji przez całą dobę, a klienci oczekują zgłoszenia szkody zdjęciem z telefonu. Strategia jest wyznacznikiem, oczekiwania – potrzebami, a ich przypisanie np. do celu organizacji 7 (ciągłość i dostępność usług biznesowych) to już krok 2 kaskady.</p><p>Pułapka: w pytaniu sytuacyjnym odróżnij przyczynę od skutku. Nowa ustawa to wyznacznik, „chcemy przestrzegać ustawy” – potrzeba, a „Zgodność z przepisami prawa i regulacjami” – cel organizacji. Nie myl też wyznaczników z czynnikami projektowymi (<span class="en">design factors</span>) z COBIT 2019 (wiedza ogólna).</p>'},
{pt:'Sprawdź się',quiz:{kontekst:'Nowa ustawa nakłada na starostwo obowiązek doręczeń elektronicznych. Po jej ogłoszeniu kierownictwo zaczyna oczekiwać zgodności z przepisami, a mieszkańcy – odbierania pism bez wizyty na poczcie.',tresc:'Czym w kaskadzie celów COBIT 5 jest <b>sama zmiana przepisów</b>?',opcje:[{t:'Wyznacznikiem, który wpływa na potrzeby interesariuszy',ok:true,w:'Krok 1 kaskady: zmiany w otoczeniu biznesowym i regulacyjnym to wyznaczniki, które wpływają na potrzeby.'},{t:'Celem organizacji 4: Zgodność z przepisami prawa i regulacjami',w:'Cel 4 pojawi się w kaskadzie później, jako przełożenie nowych potrzeb. Sama ustawa jest przyczyną, nie celem.'},{t:'Celem aktywatora dla procesu obsługi korespondencji',w:'Cele aktywatora to ostatni, najbardziej konkretny poziom kaskady – nie jej początek.'},{t:'Czynnikiem projektowym (design factor) dostosowania Ładu',w:'Czynniki projektowe to pojęcie z COBIT 2019, nie z COBIT 5.'}],src:'COBIT 5 Framework (PL), s. 17. Pytanie autorskie w stylu egzaminu.',pomoc:{t:'Pytanie dotyczy początku kaskady celów (Rysunek 4). Zastanów się, na którym poziomie kaskady leży samo zdarzenie zewnętrzne, a na którym reakcje kierownictwa i mieszkańców.',k:['wyz','pot','kas']}}},
{pt:'Kaskada celów · s. 17–18 · Rysunek 4',h:'Jak zamienić potrzeby w działania?',b:'<p><w k="kas">Kaskada Celów</w><span class="en">Goals Cascade</span></p><p>„Klienci chcą wygodnego banku” to za mało, żeby ktoś wiedział, co jutro zrobić. Kaskada rozpisuje to schodek po schodku – od ogółu do konkretu:</p><div class="tblwrap"><table class="tbl"><tr><th>Krok</th><th>Z czego → na co</th><th>Tabela</th></tr><tr><td>1</td><td><w k="wyz">Wyznaczniki</w><span class="en">Stakeholder Drivers</span>→ <w k="pot">potrzeby interesariuszy</w><span class="en">Stakeholder Needs</span></td><td>– (wpływ)</td></tr><tr><td>2</td><td>potrzeby → <w k="celeorg">cele organizacji</w><span class="en">Enterprise Goals</span></td><td><w k="zalD">Załącznik D</w></td></tr><tr><td>3</td><td>cele organizacji → <w k="celeit">cele związane z Informatyką</w><span class="en">IT-related Goals</span></td><td><w k="zalB">Załącznik B</w></td></tr><tr><td>4</td><td>cele IT → <w k="celeakt">cele aktywatora</w><span class="en">Enabler Goals</span></td><td><w k="zalC">Załącznik C</w> (procesy)</td></tr></table></div>',c:'Od ogółu do konkretu – aż każdy wie, co robić. Kaskada należy do zasady 1.',s:'COBIT 5 Framework (PL), s. 17–19, Ilustracja 4.',ctx:'<p>Kaskada jest mostem między ogólnymi oczekiwaniami a konkretną pracą. Podręcznik podaje, po co jej używać: pozwala ustalić priorytety wdrożenia, doskonalenia i audytu na podstawie celów organizacji i związanego z nimi ryzyka; filtruje obszerną bazę wiedzy COBIT 5 do tego, co w danym projekcie istotne; pokazuje, jak aktywatory przyczyniają się do celów organizacji. Mechanizm oparto na badaniach Antwerp Management School.</p><p>Przykład: mieszkańcy powiatu mówią starostwu „chcemy załatwiać sprawy przez internet”. Kaskada prowadzi od tej potrzeby do celu organizacji 6 (kultura usług zorientowanych na klienta), dalej do celów związanych z Informatyką, a na końcu do celów konkretnych aktywatorów: procesu obsługi wniosków, kompetencji urzędników, dostępności e-usług. Na każdym poziomie ktoś inny odpowiada za swój fragment.</p><p>Pułapki: kaskada należy do zasady 1, nie do zasady 4; biegnie z góry w dół; załączniki D, B, C nie idą alfabetycznie. Krok 1 nie ma tabeli – wyznaczniki tylko „wpływają” na potrzeby.</p>'},
{pt:'Sprawdź się',quiz:{tresc:'Które stwierdzenia o kolejności kaskady celów są prawdziwe?<br>1. Cele organizacji przekłada się bezpośrednio na cele aktywatora, z pominięciem celów IT.<br>2. Cele związane z Informatyką leżą między celami organizacji a celami aktywatorów.<br>3. Wyznaczniki wpływają na potrzeby interesariuszy.<br>4. Z celów aktywatorów wyprowadza się potrzeby interesariuszy.',opcje:[{t:'1 i 2',w:'Stwierdzenie 1 jest fałszywe – kaskada nie pomija poziomu celów związanych z Informatyką.'},{t:'2 i 3',ok:true,w:'Kolejność: wyznaczniki → potrzeby → cele organizacji → cele związane z Informatyką → cele aktywatora.'},{t:'3 i 4',w:'Stwierdzenie 4 odwraca kierunek: kaskada idzie od potrzeb w dół, do aktywatorów.'},{t:'1 i 4',w:'Oba fałszywe: 1 pomija poziom celów IT, 4 odwraca kierunek kaskady.'}],src:'COBIT 5 Framework (PL), s. 17–18, Ilustracja 4. Pytanie autorskie w stylu egzaminu.',pomoc:{t:'Odtwórz kolejność poziomów z Rysunku 4 od góry do dołu i oceń każde stwierdzenie osobno – zarówno kolejność poziomów, jak i kierunek przekładania.',k:['kas','celeorg','celeit','celeakt']}}},
{pt:'Sprawdź się',quiz:{kontekst:'Kolega przed egzaminem twierdzi: „Kaskada celów kończy się na aktywatorach, więc należy do zasady o aktywatorach”.',tresc:'Do której zasady COBIT 5 należy kaskada celów?',opcje:[{t:'Do zasady 4 – o aktywatorach',w:'Aktywatory to ostatni poziom kaskady, ale sam mechanizm opisano w rozdziale 2, przy zasadzie 1. To najczęstsza pułapka.'},{t:'Do zasady 5 – o oddzieleniu Ładu od Zarządzania',w:'Zasada 5 dotyczy podziału na Ład (EDM) i Zarządzanie (APO – Dostosuj, Planuj i Organizuj; BAI – Twórz, Nabywaj i Wdrażaj; DSS – Dostarczaj, Obsługuj i Wspieraj; MEA), nie kaskady.'},{t:'Do zasady 3 – o jednej zintegrowanej strukturze ramowej',w:'Zasada 3 mówi o tym, że COBIT 5 łączy inne standardy i ramy w jedną strukturę ramową.'},{t:'Do zasady 1 – Realizacja potrzeb interesariusza',ok:true,w:'Kaskada przekłada potrzeby interesariuszy na cele – podręcznik opisuje ją w rozdziale 2, przy zasadzie 1.'}],src:'COBIT 5 Framework (PL), s. 17–19. Pytanie autorskie w stylu egzaminu.',pomoc:{t:'Przypomnij sobie, w którym rozdziale podręcznika i przy omawianiu której zasady opisano Kaskadę Celów oraz od czego kaskada wychodzi.',k:['kas']}}},
{pt:'Kaskada celów · krok 2 · BSC',h:'Cztery perspektywy: zrównoważona karta wyników',b:'<p><w k="bsc">Zrównoważona karta wyników (BSC)</w><span class="en">Balanced Scorecard</span></p><p>Według niej ułożono 17 celów organizacji i 17 celów IT – dzięki temu cele nie dotyczą tylko pieniędzy:</p><div class="tblwrap"><table class="tbl"><tr><th>Wymiar</th><th>Pytanie</th><th>Cele organizacji</th><th>Cele IT</th></tr><tr><td>Finanse<span class="en">Financial</span></td><td>czy dobrze gospodarujemy?</td><td>1–5</td><td>01–06</td></tr><tr><td>Klient<span class="en">Customer</span></td><td>czy obsługiwani są zadowoleni?</td><td>6–10</td><td>07–08</td></tr><tr><td>Obszar wewnętrzny<span class="en">Internal</span></td><td>czy w środku działamy sprawnie?</td><td>11–15</td><td>09–15</td></tr><tr><td>Szkolenie i rozwój<span class="en">Learning and Growth</span></td><td>czy się rozwijamy?</td><td>16–17</td><td>16–17</td></tr></table></div><p>Potrzeby interesariuszy przypisuje się do <w k="celeorg">celów organizacji</w> przez <w k="zalD">Załącznik D</w>. Lista nie jest wyczerpująca – konkretny cel firmy lub urzędu przypisuje się do jednego lub kilku celów typowych.</p>',c:'4 wymiary BSC; podział 5 + 5 + 5 + 2 celów organizacji.',s:'COBIT 5 Framework (PL), s. 17–19, Ilustracja 5 i 6. Nazwy angielskie wymiarów – oryginał COBIT 5 (wiedza ogólna).',ctx:'<p>Zrównoważoną kartę wyników (BSC, <span class="en">Balanced Scorecard</span>) opisali Kaplan i Norton (1996) jako narzędzie strategiczne, żeby organizacji nie oceniać wyłącznie po wynikach finansowych (wiedza ogólna; podręcznik podaje źródło w przypisie). COBIT 5 zapożycza ten pomysł, by lista celów była kompletna: każdy wymiar zadaje inne pytanie, a zestaw celów ma odpowiadać na wszystkie.</p><p>Przykład: bank, który patrzy tylko na finanse, tnie koszty infolinii. Karta z czterema wymiarami od razu pokaże skutek: spada zadowolenie klientów (Klient), wydłuża się obsługa reklamacji (Obszar wewnętrzny), odchodzą doświadczeni konsultanci (Szkolenie i rozwój).</p><p>Jak zapamiętać podział: cele organizacji to „5 + 5 + 5 + 2”, cele IT (IT BSC – zrównoważona karta wyników dla informatyki) – „6 + 2 + 7 + 2”. Wspólny jest koniec: 16–17 to zawsze Szkolenie i rozwój. Pułapki: cel organizacji 10 „Optymalizacja kosztów świadczenia usług” leży w wymiarze Klient, nie Finanse; nie ma wymiaru „Ryzyko” ani „Zgodność”.</p>'},
{pt:'Sprawdź się',quiz:{tresc:'Które cele organizacji należą do wymiaru <b>Klient</b> zrównoważonej karty wyników?<br>1. Kultura usług zorientowanych na klienta<br>2. Zgodność z przepisami prawa i regulacjami<br>3. Optymalizacja kosztów świadczenia usług<br>4. Zgodność z politykami wewnętrznymi',opcje:[{t:'1 i 2',w:'Cel „Zgodność z przepisami prawa i regulacjami” (4) należy do wymiaru Finanse.'},{t:'2 i 4',w:'Cel 4 to Finanse, a cel 15 „Zgodność z politykami wewnętrznymi” – Obszar wewnętrzny.'},{t:'1 i 3',ok:true,w:'Wymiar Klient to cele 6–10, m.in. 6 (kultura usług zorientowanych na klienta) i 10 (optymalizacja kosztów świadczenia usług) – mimo słowa „koszty” cel 10 nie należy do Finansów.'},{t:'3 i 4',w:'Cel 10 jest w wymiarze Klient, ale cel 15 – w Obszarze wewnętrznym.'}],src:'COBIT 5 Framework (PL), s. 19, Ilustracja 5. Pytanie autorskie w stylu egzaminu.',pomoc:{t:'Pytanie dotyczy podziału 17 celów organizacji na wymiary zrównoważonej karty wyników (Rysunek 5). Przypomnij sobie zakresy numerów w każdym wymiarze, a potem ustal numer każdego z czterech celów.',k:['bsc','celeorg']}}},
{pt:'Sprawdź się',quiz:{kontekst:'Zarząd banku zapisał w strategii: „Zwiększyć sprzedaż kredytów hipotecznych o 15% w dwa lata”. Zespół wdrażający COBIT 5 nie znajduje takiego celu na liście.',tresc:'Jak należy postąpić zgodnie z COBIT 5?',opcje:[{t:'Dopisać go jako 18. cel organizacji',w:'Lista nie jest wyczerpująca, ale kaskada nie polega na dopisywaniu pozycji – konkretne cele przypisuje się do celów typowych.'},{t:'Przypisać go do jednego lub kilku z 17 typowych celów',ok:true,w:'Podręcznik: większość celów konkretnej organizacji można łatwo przyporządkować do jednego lub kilku typowych celów – tu np. do celu 2 (portfel konkurencyjnych produktów i usług).'},{t:'Wybrać pasujący cel spośród 40 celów ładu i zarządzania',w:'40 celów ładu i zarządzania to COBIT 2019. W COBIT 5 jest 17 celów organizacji, 17 celów IT i 37 procesów.'},{t:'Pominąć go, bo kaskada obejmuje tylko cele związane z IT',w:'Kaskada zaczyna od potrzeb interesariuszy i celów całej organizacji, a dopiero potem schodzi do celów IT.'}],src:'COBIT 5 Framework (PL), s. 17–18; COBIT 2019 – wiedza ogólna. Pytanie autorskie w stylu egzaminu.',pomoc:{t:'Przypomnij sobie, co podręcznik mówi o liście 17 typowych celów organizacji: czy jest wyczerpująca i jak postępować z konkretnymi celami strategicznymi danej organizacji (s. 17–18).',k:['celeorg','kas']}}},
{pt:'Kaskada celów · krok 2 · Rysunek 5',h:'17 celów organizacji i ich związek z wartością',b:'<p><w k="celeorg">Cele organizacji</w><span class="en">Enterprise Goals</span></p><p>Rysunek 5 pokazuje, jak każdy z 17 celów wiąże się z trzema elementami celu Ładu (<w k="ps">P lub S</w>; puste pole – brak związku):</p><div class="tblwrap"><table class="tbl"><tr><th>Cel organizacji</th><th>Korzyści<span class="en">Benefits</span></th><th>Ryzyko<span class="en">Risk</span></th><th>Zasoby<span class="en">Resources</span></th></tr><tr><td colspan="4"><b>Finanse</b><span class="en">Financial</span></td></tr><tr><td>1. Wartość inwestycji biznesowych dla interesariuszy<span class="en">Stakeholder value of business investments</span></td><td>P</td><td></td><td>S</td></tr><tr><td>2. Portfel konkurencyjnych produktów i usług<span class="en">Portfolio of competitive products and services</span></td><td>P</td><td>P</td><td>S</td></tr><tr><td>3. Zarządzane ryzyko biznesowe (ochrona zasobów)<span class="en">Managed business risk (safeguarding of assets)</span></td><td></td><td>P</td><td>S</td></tr><tr><td>4. Zgodność z przepisami prawa i regulacjami<span class="en">Compliance with external laws and regulations</span></td><td></td><td>P</td><td></td></tr><tr><td>5. Przejrzystość finansowa<span class="en">Financial transparency</span></td><td>P</td><td>S</td><td>S</td></tr><tr><td colspan="4"><b>Klient</b><span class="en">Customer</span></td></tr><tr><td>6. Kultura usług zorientowanych na klienta<span class="en">Customer-oriented service culture</span></td><td>P</td><td></td><td>S</td></tr><tr><td>7. Ciągłość i dostępność usług biznesowych<span class="en">Business service continuity and availability</span></td><td></td><td>P</td><td></td></tr><tr><td>8. Zwinność w reagowaniu na zmieniające się otoczenie biznesowe<span class="en">Agile responses to a changing business environment</span></td><td>P</td><td></td><td>S</td></tr><tr><td>9. Świadome podejmowanie decyzji strategicznych na podstawie informacji<span class="en">Information-based strategic decision making</span></td><td>P</td><td>P</td><td>P</td></tr><tr><td>10. Optymalizacja kosztów świadczenia usług<span class="en">Optimisation of service delivery costs</span></td><td>P</td><td></td><td>P</td></tr><tr><td colspan="4"><b>Obszar wewnętrzny</b><span class="en">Internal</span></td></tr><tr><td>11. Optymalizacja funkcjonalności procesów biznesowych<span class="en">Optimisation of business process functionality</span></td><td>P</td><td></td><td>P</td></tr><tr><td>12. Optymalizacja kosztów procesów biznesowych<span class="en">Optimisation of business process costs</span></td><td>P</td><td></td><td>P</td></tr><tr><td>13. Zarządzanie programami biznesowymi — zmiany biznesowe<span class="en">Managed business change programmes</span></td><td>P</td><td>P</td><td>S</td></tr><tr><td>14. Wydajność pracowników i działań operacyjnych<span class="en">Operational and staff productivity</span></td><td>P</td><td></td><td>P</td></tr><tr><td>15. Zgodność z politykami wewnętrznymi<span class="en">Compliance with internal policies</span></td><td></td><td>P</td><td></td></tr><tr><td colspan="4"><b>Szkolenie i rozwój</b><span class="en">Learning and Growth</span></td></tr><tr><td>16. Wykwalifikowany i zmotywowany personel<span class="en">Skilled and motivated people</span></td><td>S</td><td>P</td><td>P</td></tr><tr><td>17. Kultura innowacji produktów i biznesu<span class="en">Product and business innovation culture</span></td><td>P</td><td></td><td></td></tr></table></div>',c:'Tylko cel 9 ma P, P, P. Cele 4, 7 i 15 – P wyłącznie przy ryzyku.',s:'COBIT 5 Framework (PL), s. 19, Ilustracja 5 (P/S sprawdzone z obrazem strony). Nazwy angielskie – oryginał COBIT 5.',ctx:'<p>Jak czytać tabelę: wiersz to jeden typowy cel organizacji, a trzy kolumny to elementy celu Ładu z Rysunku 3. <w k="ps">P</w> znaczy, że osiągnięcie celu podstawowo przyczynia się do danego elementu, S – że wspiera go słabiej, puste pole – brak istotnego związku. Tabela łączy więc „wartość” z konkretnymi celami, zanim zejdziemy do celów IT przez <w k="zalB">Załącznik B</w>.</p><p>Jak zapamiętać, zamiast wkuwać 51 pól: nazwy celów w dużej mierze same podpowiadają odpowiedź. Cele o ochronie, zgodności i ciągłości (3, 4, 7, 15) mają P tylko przy ryzyku. Cele z „optymalizacją” lub „wydajnością” w nazwie (10, 11, 12, 14) łączą korzyści z zasobami (P, –, P). Wyjątek do zapamiętania: cel 9 – decyzje oparte na informacji – jako jedyny ma P, P, P.</p><p>Przykład: gmina, która za priorytet uznała przejrzystość wydatków, znajdzie cel 5 (przejrzystość finansowa) i zobaczy, że służy głównie korzyściom, a wspiera też ryzyko i zasoby. Pułapka: cel 16 ma P przy ryzyku i zasobach, ale przy korzyściach tylko S.</p>'},
{pt:'Sprawdź się',quiz:{tresc:'Który cel organizacji ma na Rysunku 5 relację <b>podstawową (P)</b> ze wszystkimi trzema elementami celu Ładu?',opcje:[{t:'7. Ciągłość i dostępność usług biznesowych',w:'Cel 7 ma P tylko przy optymalizacji ryzyka.'},{t:'16. Wykwalifikowany i zmotywowany personel',w:'Cel 16: korzyści S, ryzyko P, zasoby P – blisko, ale z korzyściami ma tylko relację wspierającą.'},{t:'9. Świadome podejmowanie decyzji strategicznych na podstawie informacji',ok:true,w:'Jedyny cel z P, P, P: decyzje oparte na rzetelnej informacji wpływają jednocześnie na korzyści, ryzyko i zasoby.'},{t:'2. Portfel konkurencyjnych produktów i usług',w:'Cel 2: korzyści P, ryzyko P, ale zasoby tylko S.'}],src:'COBIT 5 Framework (PL), s. 19, Ilustracja 5. Pytanie autorskie w stylu egzaminu.',pomoc:{t:'Sprawdź w tabeli z Rysunku 5 wiersz każdego z podanych celów i odczytaj litery we wszystkich trzech kolumnach: korzyści, ryzyko, zasoby.',k:['celeorg','ps','war']}}},
{pt:'Sprawdź się',quiz:{kontekst:'Zarząd ubezpieczyciela szuka celów organizacji, które według Rysunku 5 mają relację podstawową z optymalizacją ryzyka, a <b>nie mają żadnego</b> związku z realizacją korzyści.',tresc:'Która para spełnia oba warunki?',opcje:[{t:'4 (zgodność z przepisami) i 15 (zgodność z politykami wewnętrznymi)',ok:true,w:'Oba cele mają P przy ryzyku i puste pola przy korzyściach (i zasobach). Warunki spełniają też cele 3 i 7.'},{t:'2 (portfel produktów i usług) i 13 (zarządzanie programami biznesowymi)',w:'Oba mają P przy ryzyku, ale też P przy realizacji korzyści.'},{t:'9 (decyzje na podstawie informacji) i 16 (wykwalifikowany personel)',w:'Cel 9 ma P przy korzyściach, a cel 16 – S. Oba mają więc związek z korzyściami.'},{t:'5 (przejrzystość finansowa) i 8 (zwinność w reagowaniu na zmiany)',w:'Cel 5 ma P przy korzyściach i S przy ryzyku; cel 8 ma P przy korzyściach i nie ma związku z ryzykiem.'}],src:'COBIT 5 Framework (PL), s. 19, Ilustracja 5. Pytanie autorskie w stylu egzaminu.',pomoc:{t:'Pytanie dotyczy Rysunku 5. Oba warunki muszą być spełnione jednocześnie, więc dla każdego celu z pary odczytaj zarówno kolumnę ryzyka, jak i kolumnę korzyści.',k:['celeorg','ps','ryz','kor']}}},
{pt:'Sprawdź się',quiz:{tresc:'Które stwierdzenie o tabelach mapowania P/S (Rysunek 5, Załączniki B i C) jest <b>prawdziwe</b>?',opcje:[{t:'Są uniwersalną prawdą – należy je stosować dokładnie tak, jak je opublikowano',w:'Podręcznik ostrzega przed mechanicznym stosowaniem: tabele nie zawierają uniwersalnej prawdy.'},{t:'Litera S oznacza relację strategiczną, ważniejszą niż P',w:'S pochodzi od Secondary – relacja wspierająca, wciąż silna, ale mniej istotna niż P (Primary).'},{t:'Organizacja powinna dopasować mapowanie do swoich priorytetów i branży',ok:true,w:'Tak – to pierwsza czynność przy korzystaniu z kaskady: priorytety są różne, tabele nie uwzględniają wielkości ani branży, a dwa poziomy P/S upraszczają płynne continuum.'},{t:'Mają trzy poziomy: P, S i N, czyli brak związku',w:'Są tylko dwa poziomy (P i S); brak związku to po prostu puste pole.'}],src:'COBIT 5 Framework (PL), s. 18, 20, 49. Pytanie autorskie w stylu egzaminu.',pomoc:{t:'Przypomnij sobie zastrzeżenia podręcznika do tabel mapowania (s. 20, „Właściwe korzystanie z kaskady celów”) oraz to, co oznaczają litery P i S.',k:['ps','kas','zalB','zalC']}}},
{pt:'Kaskada celów · krok 3 · Rysunek 6',h:'17 celów związanych z Informatyką',b:'<p><w k="celeit">Cele związane z Informatyką</w><span class="en">IT-related Goals</span></p><p>Żeby organizacja osiągnęła swoje cele, IT musi dostarczyć konkretne rezultaty. Opisuje je 17 celów ułożonych według IT BSC (na egzaminie: zrównoważona karta wyników dla informatyki):</p><div class="tblwrap"><table class="tbl"><tr><th>Nr</th><th>Cel związany z Informatyką</th></tr><tr><td colspan="2"><b>Finanse</b><span class="en">Financial</span></td></tr><tr><td>01</td><td>Zgodność IT z biznesowymi celami strategicznymi<span class="en">Alignment of IT and business strategy</span></td></tr><tr><td>02</td><td>Zgodność IT oraz wsparcie w zakresie zgodności działalności z przepisami prawa i regulacjami<span class="en">IT compliance and support for business compliance with external laws and regulations</span></td></tr><tr><td>03</td><td>Zaangażowanie kadry zarządzającej w podejmowanie decyzji związanych z IT<span class="en">Commitment of executive management for making IT-related decisions</span></td></tr><tr><td>04</td><td>Zarządzanie ryzykiem biznesowym związanym z IT<span class="en">Managed IT-related business risk</span></td></tr><tr><td>05</td><td>Uzyskanie korzyści z inwestycji i portfela usług związanych z IT<span class="en">Realised benefits from IT-enabled investments and services portfolio</span></td></tr><tr><td>06</td><td>W obszarze IT: przejrzystość kosztów, korzyści i ryzyka<span class="en">Transparency of IT costs, benefits and risk</span></td></tr><tr><td colspan="2"><b>Klient</b><span class="en">Customer</span></td></tr><tr><td>07</td><td>Dostarczanie usług IT zgodnie z wymogami biznesowymi<span class="en">Delivery of IT services in line with business requirements</span></td></tr><tr><td>08</td><td>Adekwatne wykorzystanie aplikacji, informacji i rozwiązań w zakresie technologii<span class="en">Adequate use of applications, information and technology solutions</span></td></tr><tr><td colspan="2"><b>Obszar wewnętrzny</b><span class="en">Internal</span></td></tr><tr><td>09</td><td>Zwinność IT (ang. agility)<span class="en">IT agility</span></td></tr><tr><td>10</td><td>Bezpieczeństwo informacji, infrastruktury przetwarzania i aplikacji<span class="en">Security of information, processing infrastructure and applications</span></td></tr><tr><td>11</td><td>Optymalizacja aktywów, zasobów i potencjału związanych z IT<span class="en">Optimisation of IT assets, resources and capabilities</span></td></tr><tr><td>12</td><td>Umożliwianie i wsparcie realizacji procesów biznesowych poprzez integrację aplikacji i rozwiązań technologicznych z procesami biznesowymi<span class="en">Enablement and support of business processes by integrating applications and technology into business processes</span></td></tr><tr><td>13</td><td>Realizacja programów przynoszących korzyści — w sposób terminowy, w ramach budżetu i zgodnie z wymogami i standardami jakościowymi<span class="en">Delivery of programmes delivering benefits, on time, on budget, and meeting requirements and quality standards</span></td></tr><tr><td>14</td><td>Dostępność wiarygodnych i przydatnych informacji wspierających proces decyzyjny<span class="en">Availability of reliable and useful information for decision making</span></td></tr><tr><td>15</td><td>Zgodność IT z politykami wewnętrznymi<span class="en">IT compliance with internal policies</span></td></tr><tr><td colspan="2"><b>Szkolenie i rozwój</b><span class="en">Learning and Growth</span></td></tr><tr><td>16</td><td>Kompetentny i zmotywowany personel działu biznesowego i działu IT<span class="en">Competent and motivated business and IT personnel</span></td></tr><tr><td>17</td><td>Wiedza, kompetencje oraz inicjatywy w zakresie innowacji biznesowych<span class="en">Knowledge, expertise and initiatives for business innovation</span></td></tr></table></div>',c:'Wymiar Klient w IT BSC ma tylko dwa cele: 07 i 08.',s:'COBIT 5 Framework (PL), s. 18–19, Ilustracja 6. Nazwy angielskie – oryginał COBIT 5.',ctx:'<p>Jak czytać listę: każdy cel związany z Informatyką to rezultat, którego organizacja potrzebuje od informacji i technologii – nie zadanie działu IT ani nazwa procesu. To trzeci poziom kaskady: z góry trafiają tu cele organizacji przez <w k="zalB">Załącznik B</w>, a w dół do procesów prowadzi <w k="zalC">Załącznik C</w>. Podręcznik przypomina, że IT nie jest jedynym źródłem sukcesu (finanse czy marketing też wpływają na cele organizacji), ale COBIT 5 zajmuje się tylko częścią związaną z IT.</p><p>Jak zapamiętać: wiele celów IT to „lustrzane odbicie” celów organizacji – zgodność z przepisami (cel organizacji 4 ↔ IT 02), ryzyko (3 ↔ 04), zgodność z politykami (15 ↔ 15), zwinność (8 ↔ 09), informacja do decyzji (9 ↔ 14), personel (16 ↔ 16), innowacje (17 ↔ 17). To skojarzenie pamięciowe kursu, a nie odczyt z Załącznika B. Układ IT BSC: „6 + 2 + 7 + 2”.</p><p>Przykład: ministerstwo, które chce decydować na podstawie danych, sięga po cel 14 – dostępność wiarygodnych i przydatnych informacji. Pułapka: celów IT jest 17, nie 37 (tyle jest procesów).</p>'},
{pt:'Sprawdź się',quiz:{tresc:'Które cele związane z Informatyką należą do wymiaru <b>Finanse</b> IT BSC?<br>1. 02 Zgodność IT oraz wsparcie w zakresie zgodności działalności z przepisami<br>2. 10 Bezpieczeństwo informacji, infrastruktury przetwarzania i aplikacji<br>3. 06 W obszarze IT: przejrzystość kosztów, korzyści i ryzyka<br>4. 16 Kompetentny i zmotywowany personel działu biznesowego i działu IT',opcje:[{t:'1 i 3',ok:true,w:'Wymiar Finanse IT BSC to cele 01–06, czyli m.in. 02 i 06.'},{t:'1 i 2',w:'Cel 10 (bezpieczeństwo) należy do Obszaru wewnętrznego (09–15).'},{t:'2 i 4',w:'Cel 10 to Obszar wewnętrzny, cel 16 – Szkolenie i rozwój.'},{t:'3 i 4',w:'Cel 06 jest w Finansach, ale cel 16 – w wymiarze Szkolenie i rozwój.'}],src:'COBIT 5 Framework (PL), s. 19, Ilustracja 6. Pytanie autorskie w stylu egzaminu.',pomoc:{t:'Pytanie dotyczy układu 17 celów związanych z Informatyką według IT BSC (Rysunek 6). Przypomnij sobie zakres numerów w wymiarze Finanse i porównaj go z numerami podanych celów.',k:['celeit','bsc']}}},
{pt:'Kaskada celów · krok 3 · Załącznik B',h:'Który cel IT wspiera który cel organizacji?',b:'<p><w k="zalB">Załącznik B</w><span class="en">Appendix B: Detailed Mapping Enterprise Goals – IT-related Goals</span></p><p>To tabela 17 × 17 z literami <w k="ps">P/S</w>. Przykład 7 z podręcznika – cel organizacji:</p><div class="chips"><span>7. Ciągłość i dostępność usług biznesowych<span class="en">Business service continuity and availability</span></span></div><p>zależy przede wszystkim (P) od celów IT:</p><div class="chips"><span>04 Zarządzanie ryzykiem biznesowym związanym z IT<span class="en">Managed IT-related business risk</span></span><span>10 Bezpieczeństwo informacji, infrastruktury przetwarzania i aplikacji<span class="en">Security of information, processing infrastructure and applications</span></span><span>14 Dostępność wiarygodnych i przydatnych informacji wspierających proces decyzyjny<span class="en">Availability of reliable and useful information for decision making</span></span></div><p>a w mniejszym stopniu (S) od:</p><div class="chips"><span>01 Zgodność IT z biznesowymi celami strategicznymi<span class="en">Alignment of IT and business strategy</span></span><span>07 Dostarczanie usług IT zgodnie z wymogami biznesowymi<span class="en">Delivery of IT services in line with business requirements</span></span><span>08 Adekwatne wykorzystanie aplikacji, informacji i rozwiązań w zakresie technologii<span class="en">Adequate use of applications, information and technology solutions</span></span></div><p>Tabelę czyta się też odwrotnie: cel IT 09 Zwinność IT<span class="en">IT agility</span> wspiera podstawowo cele organizacji 2, 8, 11 i 17.</p>',c:'Cele organizacji wymagają konkretnych celów IT – zapamiętaj: 7 → P 04, 10, 14.',s:'COBIT 5 Framework (PL), s. 49–50 (przykład 7, Ilustracja 22).',ctx:'<p>Załącznik B to krok 3 kaskady w praktyce: wybierasz kolumnę swojego celu organizacji i schodzisz w dół, zbierając cele IT oznaczone P (w pierwszej kolejności) i S (w drugiej). Można też czytać wierszem – wtedy widać, ile celów organizacji zyska na poprawie jednego celu IT. Tabelę opracowano na podstawie badań Antwerp Management School i opinii ekspertów, więc jest „wspólnym mianownikiem”, a nie przepisem.</p><p>Przykład: sklep internetowy z elektroniką uznaje za priorytet cel organizacji 7, bo każda godzina przestoju to utracone zamówienia. Z tabeli odczytuje cele IT 04, 10 i 14 jako podstawowe, ale świadomie podnosi też wagę celu 07 (oznaczonego S), bo klienci oceniają go głównie po dotrzymaniu obiecanej jakości usługi. Tak wygląda dopasowanie mapowania, którego wymaga podręcznik.</p><p>Pułapka: w pytaniach o przykład 7 dystraktorem bywa zamiana grup P i S. Pamiętaj też, że B łączy cele organizacji z <w k="celeit">celami związanymi z Informatyką</w> – procesów w tej tabeli nie ma.</p>'},
