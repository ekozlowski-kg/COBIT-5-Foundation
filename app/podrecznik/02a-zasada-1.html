{pt:'Sprawdź się',quiz:{kontekst:'Szpital uznał za priorytet cel organizacji 7: Ciągłość i dostępność usług biznesowych – system rejestracji pacjentów nie może przestać działać.',tresc:'Które cele związane z Informatyką mają według Załącznika B relację <b>podstawową (P)</b> z tym celem?',opcje:[{t:'01, 07 i 08',w:'To cele z relacją wspierającą (S) – w przykładzie 7 łatwo pomylić je z P.'},{t:'04, 10 i 14',ok:true,w:'Przykład 7 z podręcznika: ryzyko biznesowe związane z IT (04), bezpieczeństwo (10) i wiarygodne informacje (14).'},{t:'09, 11 i 17',w:'Zwinność IT, optymalizacja aktywów i innowacje nie są podstawowe dla ciągłości usług.'},{t:'02, 10 i 15',w:'To cele z P dla celu organizacji 15 (zgodność z politykami wewnętrznymi); dla ciągłości usług poprawne jest tylko 10.'}],src:'COBIT 5 Framework (PL), s. 49–50 (przykład 7). Pytanie autorskie w stylu egzaminu.',pomoc:{t:'Pytanie odwołuje się do przykładu 7 z Załącznika B (s. 49). Przykład wymienia dwie grupy celów IT – o relacji podstawowej i wspierającej – więc upewnij się, którą z nich wskazujesz.',k:['zalB','ps','celeit']}}},
{pt:'Sprawdź się',quiz:{tresc:'Dopasuj załączniki do kroków kaskady:<br>1. Potrzeby (pytania) interesariuszy → cele organizacji<br>2. Cele organizacji → cele związane z Informatyką<br>3. Cele związane z Informatyką → procesy',opcje:[{t:'1 – B, 2 – C, 3 – D',w:'Kolejność alfabetyczna to pułapka – załączniki nie idą w kaskadzie po kolei.'},{t:'1 – D, 2 – C, 3 – B',w:'Zamienione B i C: C dotyczy procesów, B – celów IT.'},{t:'1 – C, 2 – B, 3 – D',w:'Załącznik D nie dotyczy procesów, tylko potrzeb interesariuszy.'},{t:'1 – D, 2 – B, 3 – C',ok:true,w:'D: potrzeby → cele organizacji, B: cele organizacji → cele IT, C: cele IT → procesy. W kaskadzie: D → B → C.'}],src:'COBIT 5 Framework (PL), s. 18 (Ilustracja 4), 49, 51, 55. Pytanie autorskie w stylu egzaminu.',pomoc:{t:'Przypomnij sobie Rysunek 4: przy każdej strzałce kaskady podręcznik odsyła do innego załącznika. Ustal, co jest w kolumnach i wierszach każdej z trzech tabel.',k:['zalD','zalB','zalC','kas']}}},
{pt:'Kaskada celów · krok 4 · Załącznik C',h:'Cele IT realizują aktywatory',b:'<p><w k="celeakt">Cele aktywatora</w><span class="en">Enabler Goals</span></p><p>Cel IT nie zrealizuje się sam. Potrzebne są aktywatory, a każdy dostaje własny, mierzalny cel:</p><div class="chips"><span>Zasady, polityki i struktury ramowe<span class="en">Principles, Policies and Frameworks</span></span><span>Procesy<span class="en">Processes</span></span><span>Struktury organizacyjne<span class="en">Organisational Structures</span></span><span>Kultura, etyka i zachowanie<span class="en">Culture, Ethics and Behaviour</span></span><span>Informacja<span class="en">Information</span></span><span>Usługi, infrastruktura i aplikacje<span class="en">Services, Infrastructure and Applications</span></span><span>Ludzie, umiejętności i kompetencje<span class="en">People, Skills and Competencies</span></span></div><p>Dla procesów podręcznik ma gotową tabelę:</p><p><w k="zalC">Załącznik C</w><span class="en">Appendix C: Detailed Mapping IT-related Goals – IT-related Processes</span></p><p>Na przykład cel IT 10 Bezpieczeństwo informacji, infrastruktury przetwarzania i aplikacji<span class="en">Security of information, processing infrastructure and applications</span> realizują podstawowo (P) procesy:</p><div class="chips"><span><span class="no">EDM03</span>Zapewnienie optymalizacji ryzyka<span class="en">Ensure Risk Optimisation</span></span><span><span class="no">APO12</span>Zarządzanie ryzykiem<span class="en">Manage Risk</span></span><span><span class="no">APO13</span>Zarządzanie bezpieczeństwem<span class="en">Manage Security</span></span><span><span class="no">BAI06</span>Zarządzanie zmianami<span class="en">Manage Changes</span></span><span><span class="no">DSS05</span>Zarządzanie usługami bezpieczeństwa<span class="en">Manage Security Services</span></span></div><p>Same procesy jednak nie wystarczą – cele potrzebne są też dla kultury, struktur, ludzi i pozostałych aktywatorów.</p>',c:'Na końcu kaskady każdy aktywator ma swój cel.',s:'COBIT 5 Framework (PL), s. 18–19, 21, 51–53. Nazwy aktywatorów – rozdział 5; nazwy angielskie – oryginał COBIT 5.',ctx:'<p>To ostatni schodek kaskady i miejsce, w którym zasada 1 spotyka się z zasadą 4 (aktywatory). Cel związany z Informatyką mówi, co ma zostać osiągnięte, a cele aktywatorów – czym i w jakim stopniu. Według podręcznika po przejściu kaskady organizacja ma spójny zbiór celów dla wszystkich aktywatorów i komplet mierników do pomiaru. Rozdział 5 dzieli cele aktywatora na jakość wewnętrzną (tak na egzaminie; w podręczniku „jakość rzeczywista”, <span class="en">intrinsic quality</span>), jakość kontekstową oraz dostęp i bezpieczeństwo.</p><p>Przykład: ubezpieczyciel po incydencie wybiera cel IT 10 (bezpieczeństwo). Załącznik C podpowiada procesy, np. APO13 Zarządzanie bezpieczeństwem, ale to nie koniec: struktura organizacyjna dostaje cel „komitet bezpieczeństwa zbiera się co miesiąc”, ludzie – „wszyscy likwidatorzy po szkoleniu z wyłudzania danych (<span class="en">phishing</span>)”, kultura – „pracownicy zgłaszają podejrzane wiadomości bez obawy przed karą”.</p><p>Pułapka: Załącznik C obejmuje wyłącznie procesy (37), a nie wszystkie siedem kategorii aktywatorów. Dla pozostałych aktywatorów cele trzeba ustalić samodzielnie.</p>'},
{pt:'Sprawdź się',quiz:{kontekst:'Gmina po kontroli ochrony danych wybrała cel związany z Informatyką 10: Bezpieczeństwo informacji, infrastruktury przetwarzania i aplikacji. Informatyk ma wskazać procesy do usprawnienia.',tresc:'Gdzie znajdzie podpowiedź i co tam przeczyta?',opcje:[{t:'W Załączniku C – m.in. EDM03, APO12, APO13, BAI06, DSS05 jako P',ok:true,w:'Załącznik C mapuje cele IT na 37 procesów; dla celu 10 relację P mają właśnie te procesy.'},{t:'W Załączniku B – procesy APO13 i DSS05 jako P',w:'Załącznik B łączy cele organizacji z celami IT – w ogóle nie zawiera procesów.'},{t:'W Załączniku D – procesy EDM03 i APO12 jako zaznaczone',w:'Załącznik D łączy pytania interesariuszy z celami organizacji, a nie z procesami.'},{t:'W Załączniku C – wyłącznie DSS05, bo tylko on dotyczy bezpieczeństwa',w:'Bezpieczeństwo wspiera kilka procesów naraz, m.in. APO13 Zarządzanie bezpieczeństwem i EDM03 – relacje są „wiele do wielu”.'}],src:'COBIT 5 Framework (PL), s. 51–53 (Ilustracja 23). Pytanie autorskie w stylu egzaminu.',pomoc:{t:'Pytanie ma dwie części: która tabela prowadzi od celów związanych z Informatyką do procesów i co w niej odczytasz dla celu IT 10. Obie części odpowiedzi muszą się zgadzać.',k:['zalC','celeit','celeakt']}}},
{pt:'Sprawdź się',quiz:{tresc:'Które stwierdzenie o celach aktywatorów <b>NIE</b> jest prawdziwe?',opcje:[{t:'Są ostatnim, najbardziej konkretnym poziomem kaskady celów',w:'Prawdziwe – po celach związanych z Informatyką następują cele aktywatora.'},{t:'Można je określić dla każdego aktywatora, także dla kultury i ludzi, nie tylko procesów',w:'Prawdziwe – podręcznik podkreśla, że kultura, struktury organizacyjne czy umiejętności też wymagają jasnych celów.'},{t:'Wystarczy usprawnić procesy, żeby osiągnąć cele związane z Informatyką',ok:true,w:'To fałsz: według podręcznika same procesy nie wystarczą – potrzebne są też pozostałe aktywatory z własnymi celami (s. 21).'},{t:'Dla procesów powiązania z celami IT podaje Załącznik C',w:'Prawdziwe – Załącznik C mapuje cele IT na procesy.'}],src:'COBIT 5 Framework (PL), s. 18–19, 21. Pytanie autorskie w stylu egzaminu.',pomoc:{t:'Pytanie z NIE: szukasz stwierdzenia fałszywego. Przypomnij sobie krok 4 kaskady i komentarz podręcznika pod przykładem 1 (s. 21) o tym, co następuje po wyborze celów IT.',k:['celeakt','zalC','kas']}}},
{pt:'Kaskada celów · s. 21 · przykład 1',h:'Kaskada to drzewo, nie linia',b:'<p>Przykład 1 z podręcznika: najważniejszym celem strategicznym jest zadowolenie klientów. To podnosi priorytet trzech celów organizacji:</p><div class="chips"><span>6. Kultura usług zorientowanych na klienta<span class="en">Customer-oriented service culture</span></span><span>7. Ciągłość i dostępność usług biznesowych<span class="en">Business service continuity and availability</span></span><span>8. Zwinność w reagowaniu na zmieniające się otoczenie biznesowe<span class="en">Agile responses to a changing business environment</span></span></div><p>Załącznik B wskazuje dla nich siedem celów IT z relacją P:</p><div class="chips"><span>01 Zgodność IT z biznesowymi celami strategicznymi<span class="en">Alignment of IT and business strategy</span></span><span>04 Zarządzanie ryzykiem biznesowym związanym z IT<span class="en">Managed IT-related business risk</span></span><span>07 Dostarczanie usług IT zgodnie z wymogami biznesowymi<span class="en">Delivery of IT services in line with business requirements</span></span><span>09 Zwinność IT (ang. agility)<span class="en">IT agility</span></span><span>10 Bezpieczeństwo informacji, infrastruktury przetwarzania i aplikacji<span class="en">Security of information, processing infrastructure and applications</span></span><span>14 Dostępność wiarygodnych i przydatnych informacji wspierających proces decyzyjny<span class="en">Availability of reliable and useful information for decision making</span></span><span>17 Wiedza, kompetencje oraz inicjatywy w zakresie innowacji biznesowych<span class="en">Knowledge, expertise and initiatives for business innovation</span></span></div><p>Organizacja (w podręczniku: przedsiębiorstwo) weryfikuje tę listę i za priorytet uznaje pierwsze cztery (01, 04, 07, 09). Na każdym poziomie jeden cel wymaga kilku celów poziom niżej, a gałęzie się przeplatają.</p><a class="go" href="02b-kaskada-schemat.html">Otwórz schemat kaskady →</a>',c:'Powiązania „wiele do wielu”, oznaczone P/S – i zawsze weryfikowane przez organizację.',s:'COBIT 5 Framework (PL), s. 21 (przykład 1), 49–50.',ctx:'<p>Przykład 1 pokazuje, że kaskada rozgałęzia się na każdym poziomie: jeden cel strategiczny podnosi priorytet trzech celów organizacji, a te prowadzą do siedmiu celów IT. Idąc dalej, każdy cel IT wskazałby kilka procesów w <w k="zalC">Załączniku C</w>, a jeden proces zwykle wspiera kilka celów IT. Powiązania są „wiele do wielu”, dlatego kaskadę lepiej wyobrażać sobie jako drzewo z przeplatającymi się gałęziami niż jako prostą strzałkę.</p><p>Najważniejsza lekcja przykładu to weryfikacja: organizacja (w podręczniku: przedsiębiorstwo) nie bierze wszystkich celów z P, tylko wybiera cztery. Podręcznik każe zawsze najpierw dopasować mapowanie do własnej sytuacji – nadać celom wagi zgodne ze strategią i sprawdzić je pod kątem branży. Bank internetowy i szpital z tym samym celem „zadowolenie klientów” mogą więc dojść do różnych priorytetów IT.</p><p>Przykład 2 z podręcznika (zrównoważony rozwój) pokazuje to samo dla innej strategii: wybrano cele organizacji 1, 4, 8, 16 i 17. Pułapka egzaminacyjna: przeskakiwanie poziomów, np. z celów organizacji od razu do procesów.</p>'},
{pt:'Sprawdź się',quiz:{kontekst:'Sklep internetowy uznał, że najważniejsze jest zadowolenie klientów, i podniósł priorytet celów organizacji 6, 7 i 8.',tresc:'Jaki jest <b>następny</b> krok kaskady celów?',opcje:[{t:'Od razu wdrożyć proces DSS02 – zarządzanie zgłoszeniami i incydentami',w:'To przeskok o dwa poziomy – najpierw trzeba ustalić cele związane z Informatyką, dopiero potem procesy.'},{t:'Ustalić w Załączniku B, które cele IT wspierają cele 6, 7 i 8',ok:true,w:'Tak postępuje organizacja (w podręczniku: przedsiębiorstwo) z przykładu 1: z celów organizacji przechodzi do celów IT przez Załącznik B, a potem samo wybiera priorytety spośród celów z P.'},{t:'Wrócić do Załącznika D i dobrać kolejne cele organizacji',w:'Załącznik D to krok wcześniej (potrzeby → cele organizacji), a cele zostały już wybrane.'},{t:'Wdrożyć wszystkie cele IT z relacją P bez dalszej analizy',w:'Podręcznik każe zweryfikować listę – w przykładzie 1 z siedmiu celów z P wybrano cztery. Mapowanie to wskazówka.'}],src:'COBIT 5 Framework (PL), s. 20–21 (przykład 1), 49–50. Pytanie autorskie w stylu egzaminu.',pomoc:{t:'Ustal, na którym poziomie kaskady jest teraz sklep, i przypomnij sobie przykład 1 z podręcznika (s. 21), który przechodzi przez te same cele organizacji.',k:['kas','celeorg','celeit']}}},
{pt:'Podsumowanie',h:'Na egzamin',b:'<div class="tblwrap"><table class="tbl"><tr><th>Pojęcie</th><th>Zapamiętaj</th></tr><tr><td><w k="zasada1">Zasada 1</w><span class="en">Meeting Stakeholder Needs</span></td><td>organizacja istnieje, by tworzyć <b>wartość</b> dla interesariuszy – także urząd i szpital publiczny</td></tr><tr><td><w k="war">Cel Ładu: Tworzenie Wartości</w><span class="en">Value Creation</span></td><td>realizacja korzyści + optymalizacja ryzyka + optymalizacja zasobów (optymalizacja, nie minimalizacja)</td></tr><tr><td><w k="kas">Kaskada Celów</w><span class="en">Goals Cascade</span></td><td>wyznaczniki → potrzeby → <b>cele organizacji (17, BSC)</b> → <b>cele związane z Informatyką (17, IT BSC)</b> → <b>cele aktywatora</b></td></tr><tr><td>Załączniki D, B, C<span class="en">Appendices D, B, C</span></td><td><b>D</b> potrzeby → cele organizacji · <b>B</b> → cele IT · <b>C</b> → procesy</td></tr><tr><td><w k="ps">P / S</w><span class="en">Primary / Secondary</span></td><td>dwa stopnie powiązania; tabele to wskazówka, nie uniwersalna prawda</td></tr></table></div><p>Kaskada należy do <b>zasady 1</b>. Cel 7 → P: 04, 10, 14. Jedyny cel P, P, P – cel 9.</p>',c:'Zła odpowiedź: „kaskada celów należy do zasady 4”.',s:'COBIT 5 Framework (PL), s. 17–21, 49–56.',ctx:'<p>To slajd do powtórki tuż przed egzaminem. Zasadę 1 da się streścić jednym zdaniem: organizacja tworzy wartość dla interesariuszy, a <w k="kas">Kaskada Celów</w> przekłada ich potrzeby – przez cele organizacji i cele związane z Informatyką – na cele aktywatorów. Następna część kursu (schemat kaskady) pokazuje te powiązania na jednym rysunku, a kolejne zasady – jak dostarczać wartość w całej organizacji i za pomocą aktywatorów.</p><p>Sprawdź się na przykładzie: gmina chce, żeby mieszkańcy załatwiali sprawy bez kolejki. Czy umiesz wskazać wyznacznik, potrzebę, pasujący cel organizacji z wymiaru Klient, tabelę prowadzącą do celów IT i tabelę prowadzącą do procesów? Jeśli tak, rozumiesz kaskadę, a nie tylko jej nazwy.</p><p>Najczęstsze pułapki w jednym miejscu: kaskada przypisana do zasady 4; „minimalizacja” zamiast „optymalizacja”; kolejność załączników B–C–D zamiast D–B–C; liczby z COBIT 2019 (13 celów organizacji, 40 celów ładu i zarządzania – wiedza ogólna) zamiast 17 i 17; litera S czytana jako „strategiczna”.</p>'}
]};
