<script>window.DECK={"id":"k-pr-kaskada-uzycie","rozdzial":"Rozdział 2 · Zasada 1: Realizacja potrzeb interesariusza · s. 17–22","tytul":"Do czego służy kaskada i jak ją dostosować","prev":"02c-kaskada-w-praktyce.html","next":"k-pr-zasada-2.html","T":{},"S":[{"pt":"Lekcje 1.24–1.26","h":"Kaskada przekłada potrzeby na cele i wspiera dopasowanie biznesu i IT","b":"<ol><li><b>Przełożenie<\/b> potrzeb interesariuszy na konkretne cele.<\/li><li><b>Dopasowanie<\/b> <span class=\"en\">alignment<\/span> potrzeb organizacji do rozwiązań i usług IT.<\/li><\/ol><p>Nie opisuje wejść i wyjść procesów, ról ani architektury.<\/p>","c":"„Najpierw” przy kaskadzie znaczy: dostosuj tabele do swojej organizacji.","s":"COBIT 5 Framework (PL), s. 17, 20, 22","ctx":"<p>Pytanie „do czego służy Kaskada Celów” ma dwie poprawne odpowiedzi z s. 17: przełożenie potrzeb na konkretne cele na każdym poziomie oraz wspieranie dopasowania potrzeb przedsiębiorstwa do rozwiązań i usług IT. Prawdziwe, ale obce odpowiedzi – wejścia i wyjścia procesu, przypisanie ról i odpowiedzialności, architektura korporacyjna – nie są celem kaskady.<\/p><p>Dostosowanie to nie wymyślanie kaskady od zera: organizacja opracowuje własną kaskadę, porównuje ją z COBIT 5 i dopracowuje szczegóły; „wdrożyć wszystkie cele z tabel” to zła odpowiedź. Pytania interesariuszy z Rysunku 7 wchodzą na samą górę kaskady jako dane wejściowe (przez Załącznik D), a nie na poziomie celów IT.<\/p><p>Przykład: ubezpieczyciel stawia na szybkie wypłaty odszkodowań. Kaskada wskazuje kilka celów IT i procesów, więc dział IT nie czyta całego COBIT 5, tylko wytyczne o ciągłości usług i obsłudze zgłoszeń.<\/p>"},{"pt":"Sprawdź się","quiz":{"tresc":"Ubezpieczyciel stawia na szybkie wypłaty odszkodowań. Dział IT czyta tylko te wytyczne COBIT 5, które dotyczą ciągłości usług i obsługi zgłoszeń. Jaką korzyść z kaskady to pokazuje?","opcje":[{"t":"Filtrowanie bazy wiedzy COBIT 5","ok":true,"w":"Dobrze. Kaskada pomaga wybrać wytyczne właściwe dla celu i projektu."},{"t":"Ocenę wymiarów każdego aktywatora","w":"Wymiary aktywatora to inny temat."},{"t":"Opis ról z Rysunku 9","w":"Role to komponent Podejścia do Ładu, a nie korzyść z kaskady."},{"t":"Zastąpienie ITIL przez COBIT 5","w":"COBIT 5 nie zastępuje ITIL. To też nie jest korzyść z kaskady."}],"src":"COBIT 5 Framework (PL), s. 20","pomoc":{"t":"Pytanie dotyczy lekcji 1.24 „Do czego służy Kaskada Celów”. Cel lekcji: Potrafię podać dwa cele Kaskady Celów i jej korzyści dla organizacji.","k":[]}}},{"pt":"Arkusz próbny","sp1":"sp1-10","lekcja":"1.24","temat":"Do czego służy Kaskada Celów","k":[]},{"pt":"Sprawdź się","quiz":{"tresc":"Który powód NIE jest podany w COBIT 5 jako przyczyna, by nie stosować tabel kaskady mechanicznie?","opcje":[{"t":"Tabele nie uwzględniają wielkości ani branży","w":"To prawdziwy powód z s. 20."},{"t":"Tabele zawierają błędy rachunkowe","ok":true,"w":"Dobrze. Podręcznik nie podaje takiego powodu. Wymienia trzy inne."},{"t":"Priorytety organizacji różnią się i zmieniają","w":"To prawdziwy powód z s. 20, więc nie pasuje do pytania z „NIE”."},{"t":"Podział na P i S upraszcza płynną skalę","w":"To prawdziwy powód z s. 20."}],"src":"COBIT 5 Framework (PL), s. 20","pomoc":{"t":"Pytanie dotyczy lekcji 1.25 „Kaskady nie stosuj mechanicznie – najpierw dostosuj”. Cel lekcji: Potrafię wyjaśnić, dlaczego tabel kaskady nie stosuje się mechanicznie, i wskazać pierwszy krok pracy z nimi.","k":[]}}},{"pt":"Sprawdź się","quiz":{"tresc":"Gdzie COBIT 5 pokazuje przykład mapowania pytań interesariuszy z Rysunku 7 na cele organizacji?","opcje":[{"t":"Na Rysunku 12","w":"Rysunek 12 pokazuje siedem kategorii aktywatorów."},{"t":"W Załączniku C","w":"Załącznik C łączy cele związane z IT z procesami."},{"t":"W Załączniku D","ok":true,"w":"Dobrze. Załącznik D łączy pytania i potrzeby z celami organizacji."},{"t":"W Załączniku B","w":"Załącznik B łączy cele organizacji z celami związanymi z IT."}],"src":"COBIT 5 Framework (PL), s. 22","pomoc":{"t":"Pytanie dotyczy
