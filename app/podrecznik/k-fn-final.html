<script>window.DECK={"id":"k-fn-final","rozdzial":"Poza podręcznikiem · Mentor i finał","tytul":"Finał: tabele, obce źródła, pytania przekrojowe","prev":"k-mt-zdolnosc.html","next":"04-warsztat.html","T":{"cobit-5":{"t":"COBIT 5","eg":"COBIT 5","pd":"COBIT 5","en":"COBIT 5","wyj":"Zbiór sprawdzonych reguł z 2012 roku, jak mądrze decydować o informatyce i nią kierować.\n\nCOBIT 5 (ISACA, 2012) opiera się na 5 zasadach (principles), 7 kategoriach aktywatorów (enablers) i modelu referencyjnym 37 procesów: 5 Ładu w domenie EDM i 32 Zarządzania w domenach APO, BAI, DSS i MEA. Kaskada celów przekłada potrzeby interesariuszy na cele organizacji, cele związane z IT i cele aktywatorów. Integruje wcześniejsze wytyczne ISACA (COBIT 4.1, Val IT, Risk IT) i jest spójny z innymi standardami, np. ITIL i ISO/IEC 27001.\n\nŻeby organizacja mogła mądrze kierować informatyką i nią zarządzać: osiągać korzyści przy rozsądnym ryzyku i zużyciu zasobów. Daje jedną, spójną strukturę ramową zamiast wielu luźnych wskazówek.","zycie":"Rodzina ma coraz więcej sprzętu i kont: telefony, laptop, router, bank, zdjęcia w chmurze. Ustalacie, kto decyduje o zakupach, kto pilnuje haseł i kopii, i co miesiąc sprawdzacie, czy wszystko działa i czy nie przepłacacie. COBIT 5 to taki „regulamin domu” dla informatyki, tylko spisany dla firm i urzędów.","firma":"Właściciel warsztatu kupił program do rezerwacji, kasę online i monitoring, ale nie wie, czy to się opłaca i kto za co odpowiada. COBIT 5 podpowiada, jak to poukładać: kto wyznacza kierunek, kto prowadzi codzienne sprawy, jak mierzyć efekty i ryzyko. To gotowa rama, a nie program do zainstalowania.","urzad":"Burmistrz słyszy, że urząd wydaje na informatykę coraz więcej, a mieszkańcy dalej stoją w kolejkach. Sięga po COBIT 5, żeby ustalić, czego chce od systemów, kto w urzędzie za nie odpowiada i jak co roku sprawdzać, czy przynoszą korzyści. COBIT 5 służy tu do uporządkowania Ładu i Zarządzania IT.","it":"Bank po poważnej awarii bankowości internetowej porządkuje IT według COBIT 5: zarząd przejmuje 5 procesów Ładu (EDM01–EDM05), CIO 32 procesy Zarządzania, np. DSS04 Zarządzanie ciągłością, a audyt wewnętrzny ocenia zdolność procesów.","egz":"Liczby do zapamiętania: 5 zasad, 7 aktywatorów, 37 procesów (EDM 5 + APO 13 + BAI 10 + DSS 6 + MEA 3), 6 poziomów zdolności (0–5). Nie myl z: COBIT 2019 – Nowsza wersja (2018/2019) – inne pojęcia (komponenty, 40 celów, czynniki projektowe). Egzamin COBIT 5 Foundation dotyczy COBIT 5.; ITIL – ITIL to dobre praktyki zarządzania usługami IT – jak dostarczać usługi. COBIT patrzy szerzej: Ład i Zarządzanie całością IT w organizacji.; ISO/IEC 27001 – ISO/IEC 27001 to norma bezpieczeństwa informacji z certyfikacją; COBIT 5 to struktura ramowa Ładu i Zarządzania IT.","src":"COBIT 5 Framework (PL), s. 90"},"wskaznik-wiodacy":{"t":"Wskaźnik wiodący","eg":"Wskaźnik wiodący","pd":"Wskaźnik wyprzedzający","en":"Lead indicator","wyj":"Liczba, która ostrzega wcześniej, czy idziemy w dobrą stronę, np. ile godzin się uczysz.\n\nDwa ostatnie z czterech pytań zarządzania wydajnością aktywatora (enabler performance management) dotyczą jego funkcjonowania: czy cykl życia aktywatora jest zarządzany i czy stosowane są dobre praktyki. Mierniki, które na nie odpowiadają, to wskaźniki wiodące (lead indicators). Przewidują przyszły wynik, który potem pokażą wskaźniki opóźnione (lag indicators).\n\nŻeby wcześnie, zanim pojawi się wynik, zobaczyć, czy aktywator działa jak trzeba, i zdążyć to poprawić.","zycie":"Za trzy miesiące biegniesz półmaraton. Co tydzień sprawdzasz, czy zrobiłeś zaplanowane cztery treningi. Jeśli od miesiąca wychodzą dwa, już wiesz, że wynik będzie słaby, i możesz to jeszcze zmienić – to wskaźnik wiodący.","firma":"Właściciel warsztatu samochodowego sprawdza, czy mechanicy wypełniają listę kontrolną przy każdym aucie. Jeśli połowa ją pomija, spodziewa się reklamacji, zanim te przyjdą, i od razu reaguje – to wskaźnik wiodący.","urzad":"Tydzień przed wejściem nowej procedury w urzędzie gminy sekretarz sprawdza, ilu urzędników przeszło szkolenie. Jest 60%, więc wie, że będą kłopoty, zanim wpłynie pierwsza skarga – to wskaźnik wiodący.","it":"W BAI06 (Zarządzanie zmianami) odsetek zmian wdrażanych po zatwierdzeniu i z planem wycofania to wskaźnik wiodący. Gdy spada, można przewidzieć więcej incydentów w DSS02 (Zarządzanie zgłoszeniami serwisowymi i incydentami), zanim one wystąpią.","egz":"Wskaźnik wiodący mierzy, czy cykl życia jest zarządzany i czy stosowane są dobre praktyki. Osiągnięcie celów i uwzględnienie potrzeb mierzą wskaźniki opóźnione (s. 29). Egzamin: „Wskaźniki wiodące”. Podręcznik: „Wskaźniki wyprzedzające”. Nie myl z: Wskaźnik opóźniony – Opóźniony mierzy wynik, czyli osiągnięcie celów i zaspokojenie potrzeb.","src":"COBIT 5 Framework (PL), s. 29; materiały Altkom"},"struktura-ramowa":{"t":"Struktura ramowa","eg":"Struktura ramowa","pd":"Metodyka","en":"Framework","wyj":"Gotowy, uporządkowany zbiór reguł i dobrych praktyk, z którego korzystamy zamiast wymyślać od zera.\n\nStruktura ramowa (framework) daje model, pojęcia, zasady, role i dobre praktyki, ale nie szczegółową instrukcję krok po kroku. Organizacja dostosowuje ją do swojej wielkości i potrzeb. COBIT 5 jest strukturą ramową dla Ładu i Zarządzania IT w organizacji i łączy w jedną całość inne standardy i struktury, np. ITIL i ISO/IEC 27001.\n\nŻeby organizacja nie wymyślała od zera, jak podejść do złożonego obszaru, tylko korzystała z gotowego, sprawdzonego zestawu pojęć, zasad i praktyk i dopasowywała go do siebie.","zycie":"Dietetyk daje Ci zasadę talerza: połowa warzywa, ćwierć białko, ćwierć węglowodany. Nie mówi, co jutro zjesz – to układasz sam, pod swoje smaki i portfel. Zasada talerza to struktura ramowa, a Twój plan posiłków to już jej dopasowanie do siebie.","firma":"Właściciel otwiera kawiarnię we franczyzie i dostaje księgę standardów: wygląd lokalu, receptury, sposób obsługi gości. Grafik pracy i lokalnych dostawców ustala już sam. Księga to rama, w której dopasowuje szczegóły do swojego miasta.","urzad":"Dyrektor szkoły dostaje standardy kontroli zarządczej dla sektora finansów publicznych. Mówią, co ma być pod kontrolą – cele, ryzyka, dokumentacja – ale nie mówią, jak dokładnie prowadzić rejestr ryzyk w tej szkole. To struktura ramowa: wspólna dla wszystkich jednostek, a szczegóły ustala szkoła.","it":"Organizacja przyjmuje COBIT 5 jako strukturę ramową i w procesie APO01 (Zarządzanie metodyką zarządzania IT) ustala, jak wpiąć w nią ITIL dla obsługi usług i ISO/IEC 27001 dla bezpieczeństwa. Zgodnie z zasadą 3 powstaje jeden spójny system zamiast kilku osobnych.","egz":"W pytaniach: „Zastosowanie Pojedynczej Zintegrowanej Struktury Ramowej” (Zasada 3), „Zasady, Polityki i Struktury ramowe” (aktywator 1). Egzamin: „Struktura ramowa”. Podręcznik: „Metodyka”. EN: Framework. „COBIT 5 jest zintegrowaną strukturą ramową” = „COBIT 5 jest zintegrowaną metodyką”. Nie myl z: Norma / standard (np. ISO/IEC 27001) – Norma ma wymagania, z którymi można certyfikować zgodność. COBIT 5 jest strukturą ramową – nie certyfikuje się organizacji „na COBIT”.; Procedura – Procedura to szczegółowy przepis wykonania; struktura ramowa jest ogólniejsza.","src":"COBIT 5 Framework (PL), s. 91; materiały Altkom"},"punkty-zapalne":{"t":"Punkty zapalne","eg":"Punkty zapalne","pd":"Punkty zapalne","en":"Pain points","wyj":"To, co już boli i wszyscy się skarżą, np. częste awarie albo przekroczone budżety.\n\nPunkty zapalne (pain points) to trwające problemy, np. nieudane projekty, powtarzające się uwagi audytu, ukryte wydatki na IT czy kłopoty z outsourcingiem. Organizacja rozpoznaje je na początku wdrożenia (faza 1 „Jakie są wyznaczniki?”) i wiąże z nimi uzasadnienie biznesowe (business case) oraz cele inicjatywy. Rozwiązanie widocznego problemu daje szybkie korzyści (quick wins) i poparcie kierownictwa.\n\nŻeby problemy, które wszyscy już odczuwają, wykorzystać jako bodziec i argument do rozpoczęcia wdrożenia albo poprawy Ładu i Zarządzania IT.","zycie":"Co miesiąc, tydzień przed wypłatą, konto jest puste i trzeba pożyczać od rodziców. Wszyscy w domu to czują i wszyscy mają dość kłótni o pieniądze. To punkt zapalny – trwający ból, który w końcu skłania do ułożenia domowego budżetu.","firma":"W sklepie internetowym trzeci raz w miesiącu pada strona w czasie promocji, a klienci piszą złe opinie. Do tego firma płaci za dwa programy do faktur, bo każdy wspólnik kupił swój. Te powtarzające się problemy to punkty zapalne – argument, żeby wreszcie uporządkować IT.","urzad":"Audyt wewnętrzny drugi rok z rzędu pisze w raporcie to samo: konta byłych pracowników urzędu gminy nadal mają dostęp do systemów. Wójt ma dość tłumaczenia się radzie. Powtarzające się złe wyniki audytu to klasyczny punkt zapalny.","it":"Audyt trzeci rok z rzędu wskazuje brak przeglądów uprawnień, a dwa działy utrzymują osobne, zdublowane systemy zgłoszeń. Te punkty zapalne uzasadniają inicjatywę wdrożenia, w której organizacja poprawia m.in. DSS05 (Zarządzanie usługami bezpieczeństwa) i APO05 (Zarządzanie portfelem projektów).","egz":"„Zduplikowane projekty”, „ukryte wydatki na IT”, „powtarzające się złe wyniki audytu”, „złożone modele operacyjne IT” → punkty zapalne. „Fuzje i przejęcia” → zdarzenie wyzwalające. Nie myl z: Zdarzenia wyzwalające – Punkt zapalny to TRWAJĄCY problem (ból). Zdarzenie wyzwalające to ZMIANA w otoczeniu (fuzja, nowe przepisy, nowy CIO).","src":"COBIT 5 Framework (PL), s. 36; COBIT 5 Framework (PL), s. 37"},"model-zdolnosci":{"t":"Model Zdolności Procesu","eg":"Model Zdolności Procesu","pd":"Model potencjału procesu COBIT 5","en":"COBIT 5 Process Capability Model (ISO/IEC 15504)","wyj":"Szkolna skala od 0 do 5, która mówi, jak dobrze robimy konkretną rzecz.\n\nModel Zdolności Procesu (Process Capability Model) opiera się na ISO/IEC 15504. Proces ocenia się na sześciu poziomach, od 0 (Niekompletny, incomplete) do 5 (Zoptymalizowany, optimising), a o poziomach decyduje 9 atrybutów procesu (process attributes). Atrybuty ocenia się skalą N/C/W/P: proces osiąga poziom, gdy atrybuty tego poziomu mają W lub P, a wszystkie atrybuty niższych poziomów mają P (Pełny).\n\nŻeby ocenić, jak dobrze działa i jak jest zarządzany konkretny proces, w sposób porównywalny i powtarzalny, i wiedzieć, co poprawić, by wejść poziom wyżej.","zycie":"Rodzina ocenia swoje domowe sprawy tą samą skalą 0–5: płacenie rachunków, sprzątanie, gotowanie. Wychodzi, że rachunki są na poziomie 3 (wszyscy robią to według jednej ustalonej procedury), a sprzątanie ledwie na 1 (jakoś się robi, ale bez planu). Jedna skala do porównania różnych procesów – to model zdolności procesu.","firma":"Warsztat samochodowy przez lata oceniał się starą skalą i wychodziło mu „trzy na pięć”. Po przejściu na nową, gdzie każdy poziom trzeba udowodnić konkretnymi atrybutami (np. czy przyjmowanie aut jest planowane, a dokumenty pod kontrolą), wychodzi poziom 1. Warsztat nie stał się gorszy – skala jest bardziej wymagająca, tak jak model zdolności COBIT 5 wobec modelu dojrzałości COBIT 4.1.","urzad":"Audytor ocenia w starostwie trzy procesy IT: obsługa zgłoszeń wychodzi na poziom 2 (zarządzany), kopie zapasowe na 1 (wykonywany), a zarządzanie zmianami na 0 (niekompletny). O strukturach, ludziach czy kulturze urzędu ta ocena nic nie mówi. Model zdolności mierzy procesy, czyli jeden z siedmiu aktywatorów, a nie cały Ład IT.","it":"Audytor ocenia DSS02 (Zarządzanie zgłoszeniami serwisowymi i incydentami): PA 1.1 dostaje P, a PA 2.1 i PA 2.2 dostają W, więc proces osiąga poziom 2. Ocena dotyczy tylko DSS02, a nie całego IT.","egz":"Model zdolności COBIT 5 opiera się na ISO/IEC 15504. Ocena procesów nie daje pełnego obrazu stanu Ładu, bo procesy to tylko jeden z 7 aktywatorów. Egzamin: „zdolność procesu”, „Ocena Zdolności Procesu”. Podręcznik: „potencjał procesu”, „ocena potencjału procesu”. Nie myl z: Model dojrzałości COBIT 4.1 – Poziomy dojrzałości 0–5 (nie istnieje… zoptymalizowany) ≠ poziomy zdolności ISO 15504. Nie da się ich prosto porównać.","src":"COBIT 5 Framework (PL), s. 41; COBIT 5 Framework (PL), s. 43; materiały Altkom"},"kaskada-celow":{"t":"Kaskada Celów","eg":"Kaskada Celów","pd":"Kaskada celów","en":"Goals Cascade","wyj":"Schodzenie od ogólnego „czego chcemy” do konkretnych zadań, jak rozpisanie wesela na listę rzeczy do załatwienia.\n\nWyznaczniki (stakeholder drivers) wpływają na potrzeby interesariuszy (stakeholder needs). Potrzeby przekłada się na cele organizacji (enterprise goals, 17 w wymiarach BSC), te na cele związane z informatyką (IT-related goals, 17 w wymiarach IT BSC), a te na cele aktywatorów (enabler goals), np. cele procesów. Każda organizacja dostosowuje kaskadę do siebie, bo nie jest ona uniwersalną prawdą.\n\nŻeby ogólne potrzeby interesariuszy przełożyć na konkretne, mierzalne cele na każdym poziomie, aż po cele procesów i innych aktywatorów, i wiedzieć, które z nich są priorytetem.","zycie":"Rodzice chcą, żeby za dwa lata stać ich było na mieszkanie. Ustalają cel domu: odkładać 1500 zł miesięcznie, a z niego cel dla domowej „informatyki”: aplikacja bankowa ma sama przelewać pieniądze na oszczędności w dniu wypłaty. Na końcu są zadania dla konkretnych „narzędzi”: zlecenie stałe, wspólny arkusz wydatków i zasada, że co miesiąc siadają razem nad liczbami – każdy krok wynika z poprzedniego, to jest kaskada celów.","firma":"Właściciel sklepu internetowego z zabawkami chce stabilnego zysku. Przekłada to na cel firmy „wracający klienci”, z niego wychodzi cel IT „sklep działa bez przerw w sezonie świątecznym”, a z tego cele aktywatorów: procedura reagowania na awarie, przeszkolony pracownik i umowa z firmą hostingową na szybką pomoc. Od ogólnej potrzeby do konkretnych zadań, krok po kroku – to kaskada celów.","urzad":"Mieszkańcy skarżą się, że na każdą sprawę w urzędzie muszą brać wolne. Gmina zapisuje cel: najważniejsze sprawy da się załatwić bez wizyty, informatyk przekłada go na cel IT: bezpieczne i stale dostępne e-usługi, a z tego wynikają cele aktywatorów: proces obsługi e-wniosków, polityka bezpieczeństwa i przeszkoleni urzędnicy. To kaskada celów: od skargi mieszkańca do konkretnego zadania w urzędzie.","it":"Potrzeba „działamy zgodnie z prawem” prowadzi do celu organizacji „zgodność z zewnętrznymi przepisami i regulacjami”, ten do celu związanego z informatyką „zgodność IT z zewnętrznymi przepisami i wsparcie zgodności biznesu”, a ten do celów procesu MEA03 (Monitorowanie, ocena i oszacowanie zgodności z wymogami zewnętrznymi).","egz":"„Do czego służy Kaskada Celów?”: do wspierania dopasowania potrzeb organizacji do rozwiązań i usług IT i do przełożenia potrzeb na konkretne cele (s. 17). RACI, architektura korporacyjna oraz wejścia i wyjścia procesu to inne kategorie. Nie myl z: Hierarchia służbowa – Kaskada dotyczy CELÓW, nie ludzi – nie mylić ze strukturą organizacyjną.; Zrównoważona karta wyników (BSC) – BSC to narzędzie, którego wymiary (finanse, klient, obszar wewnętrzny, szkolenie i rozwój) porządkują cele organizacji w kaskadzie. Nie jest samą kaskadą.","src":"COBIT 5 Framework (PL), s. 17; COBIT 5 Framework (PL), s. 18, Ilustracja 4; COBIT 5 Framework (PL), s. 20"},"aktywator":{"t":"Aktywator","eg":"Aktywator","pd":"Czynnik umożliwiający","en":"Enabler","wyj":"Wszystko, co musi zagrać, żeby informatyka działała dobrze: ludzie, reguły, narzędzia, informacje.\n\nCOBIT 5 dzieli aktywatory (enablers) na 7 kategorii, od Zasad, polityk i struktur ramowych (Principles, Policies and Frameworks) po Ludzi, umiejętności i kompetencje (People, Skills and Competencies). Kaskada celów wyznacza, czego oczekujemy od każdego aktywatora (cele aktywatora). Aktywatory są od siebie zależne i dostarczają sobie wejść, np. proces potrzebuje informacji i przeszkolonych ludzi. Każdy opisuje się w 4 wymiarach: interesariusze, cele, cykl życia, dobre praktyki.\n\nŻeby organizacja widziała wszystko, co musi zagrać, by osiągnąć cele, a nie tylko technologię. Aktywatory to elementy, przez które Ład i Zarządzanie realnie wpływają na wynik.","zycie":"Chcesz, żeby dzieci same odrabiały lekcje. Ustalacie zasadę „najpierw zadania, potem tablet”, stałą godzinę po obiedzie, kupujecie biurko z lampką, a Ty w tym czasie też siadasz z książką zamiast z telefonem. Zasada, stała pora, biurko i Twój przykład to różne aktywatory – działają dopiero razem.","firma":"Właścicielka kawiarni chce, żeby kawa smakowała tak samo na każdej zmianie. Spisuje recepturę, ustala kolejność parzenia, szkoli nowego baristę i oddaje ekspres do serwisu. Receptura, sposób parzenia, umiejętności baristy i ekspres to aktywatory – brak jednego psuje całość.","urzad":"Urząd gminy chce wydawać decyzje w terminie. Ma instrukcję kancelaryjną, ustalony obieg wniosku, wydział, który za sprawę odpowiada, system EZD i urzędników po szkoleniu z KPA. Każdy z tych elementów to aktywator innej kategorii.","it":"Proces DSS04 Zarządzanie ciągłością to aktywator z kategorii Procesy, ale działa tylko razem z innymi: polityką ciągłości (Zasady, polityki i struktury ramowe), aktualnym planem awaryjnym (Informacja), stanowiskiem zapasowym (Usługi, infrastruktura i aplikacje) i przećwiczonym zespołem (Ludzie, umiejętności i kompetencje).","egz":"Pułapka terminologiczna nr 1 obok Ład/Nadzór. Liczba kategorii: 7. Liczba zasad: 5. Liczba procesów: 37. Egzamin: „Aktywator”. Podręcznik: „Czynnik umożliwiający”. EN: Enabler. W pytaniach egzaminacyjnych prawie zawsze pada „Aktywator”. Nie myl z: Czynnik wpływający na potrzeby interesariuszy – Wyznacznik zmienia potrzeby; aktywator pomaga je zaspokoić.; Komponent (COBIT 2019) – W COBIT 2019 aktywatory nazwano „komponentami systemu ładu”. Na egzaminie COBIT 5 używaj „aktywator”.","src":"COBIT 5 Framework (PL), s. 14; COBIT 5 Framework (PL), s. 91; materiały Altkom"},"organ-ladu":{"t":"Organ Ładu i nadzoru","eg":"Organ Ładu i nadzoru","pd":"Organ nadzorujący","en":"Governing body","wyj":"Szef albo grupa na samej górze, np. zarząd, rada nadzorcza czy dyrektor urzędu, którzy decydują o kierunku.\n\nNa Ilustracji 9 właściciele i interesariusze delegują (delegate) uprawnienia organowi Ładu (governing body), a ten jest przed nimi rozliczany (accountable). Organ Ładu wyznacza kierunek (set direction) kierownictwu (management). Kierownictwo instruuje i dopasowuje (instruct and align) role operacyjne, które raportują (report) do kierownictwa (FW-PL s. 24, Il. 9). Strzałka monitorowania (monitor) łączy kierownictwo z organem Ładu; według uzasadnień egzaminacyjnych to kierownictwo odpowiada wykonawczo za monitorowanie. Sam organ Ładu też monitoruje, ale wyniki względem kierunku, który wyznaczył (EDM).\n\nŻeby było jasne, kto w imieniu właścicieli i interesariuszy sprawuje Ład: wyznacza kierunek kierownictwu i odpowiada za wyniki.","zycie":"Właściciele mieszkań na zebraniu wspólnoty wybierają zarząd i powierzają mu dbanie o budynek. Zarząd wyznacza kierunek – w tym roku dach – i każe administratorowi to załatwić, a administrator raportuje postępy. Na następnym zebraniu zarząd rozlicza się przed właścicielami: to on jest organem Ładu.","firma":"Właściciele rodzinnej sieci piekarni powołują radę, która raz na kwartał ustala, dokąd firma zmierza: otwieramy dwa nowe punkty, nie wchodzimy w catering. Dyrektor zarządzający dostaje ten kierunek i sam układa plan, a rada sprawdza wyniki i odpowiada przed właścicielami. Ta rada to organ Ładu.","urzad":"Mieszkańcy w wyborach powierzają radzie gminy pilnowanie spraw gminy. Rada uchwala strategię i budżet, wyznacza kierunek wójtowi i urzędowi, a potem rozlicza ich z wykonania; sama odpowiada przed mieszkańcami przy kolejnych wyborach. W tej scenie rada gminy pełni rolę organu Ładu.","it":"Zarząd jako organ Ładu w EDM01 (Zapewnienie i utrzymanie ładu korporacyjnego) ustala zasady podejmowania decyzji o IT, a w EDM05 (Zapewnienie przejrzystości dotyczącej interesariuszy) raportuje udziałowcom i regulatorom, jak IT realizuje cele. Plany i kierowanie pracą zespołów zostawia kierownictwu IT (APO, BAI, DSS, MEA).","egz":"Według uzasadnień egzaminacyjnych organ Ładu i nadzoru jest odpowiedzialny decyzyjnie (rozliczany) i wyznacza kierunek. Za monitorowanie osiągania celów odpowiada wykonawczo kierownictwo. Egzamin: „Organ Ładu i nadzoru”. Podręcznik: „Organ nadzorujący”. Nie myl z: Kierownictwo (management) – Kierownictwo realizuje kierunek, instruuje i dopasowuje role operacyjne i odpowiada wykonawczo za monitorowanie osiągania celów; organ Ładu wyznacza kierunek i jest rozliczany przed interesariuszami.","src":"COBIT 5 Framework (PL), s. 24, Ilustracja 9"},"zasada-4":{"t":"Zasada 4: Aktywacja holistycznego podejścia","eg":"Zasada 4: Aktywacja holistycznego podejścia","pd":"Zasada 4: Wdrożenie podejścia całościowego","en":"Principle 4: Enabling a Holistic Approach","wyj":"Patrz na całość: sukces zależy od wielu rzeczy naraz, nie tylko od sprzętu.\n\nCOBIT 5 wyróżnia 7 kategorii aktywatorów (enablers), m.in. procesy, struktury organizacyjne, informację oraz ludzi, umiejętności i kompetencje. Aktywatory indywidualnie i kolektywnie decydują o tym, czy Ład i Zarządzanie działają: każdy potrzebuje wejść od innych i dostarcza im wyników. Wszystkie mają cztery wspólne wymiary (interesariusze, cele, cykl życia, dobre praktyki), a ich wydajność mierzą wskaźniki wiodące i opóźnione.\n\nŻeby Ład i Zarządzanie IT budować na wszystkich współpracujących aktywatorach, a nie tylko na technologii czy na pojedynczym procesie.","zycie":"Kupujesz dziecku biurko i lampkę, żeby lepiej się uczyło. Nic się nie zmienia, dopóki nie ustalicie planu dnia, zasady „najpierw lekcje, potem gry”, a Ty sam nie odłożysz telefonu przy kolacji. Dopiero wszystkie te elementy razem dają efekt – to Zasada 4.","firma":"Sklep spożywczy stawia kasę samoobsługową, ale kolejki się nie skracają. Nikt nie pilnuje kasy, kasjerki nie umieją pomóc klientom, a klienci nie wiedzą, że wolno z niej korzystać. Sam sprzęt nie wystarczy, potrzebne są też ludzie, procedury i nawyki – to Zasada 4.","urzad":"Starostwo wdraża elektroniczne zarządzanie dokumentacją. System działa, ale urzędnicy dalej drukują pisma, bo nie ma instrukcji kancelaryjnej ani szkoleń, a kierownik sam woli papier. Bez procesów, ludzi, struktur i kultury system zostaje pustą skorupą – to Zasada 4.","it":"APO13 (Zarządzanie bezpieczeństwem) działa dopiero razem z polityką bezpieczeństwa, strukturą odpowiedzialną za bezpieczeństwo, kulturą zgłaszania incydentów, przeszkolonymi ludźmi, informacją i narzędziami. Przykład 4 z FW-PL: procesy i procedury bezpieczeństwa informacji nie będą skuteczne, jeśli kultura i etyka są nieodpowiednie.","egz":"Liczba 7 aktywatorów i 4 wymiary aktywatora to tematy Zasady 4. Pytania o „jakość kontekstową”, „wskaźniki wiodące” i „cykl życia aktywatora” też należą do Zasady 4. Egzamin (uzasadnienia SP1): „Aktywacja holistycznego podejścia” – „aktywacja”, bo egzamin tłumaczy enabler jako „aktywator”. Podręcznik: „Wdrożenie podejścia całościowego”. Rozpoznawaj po słowach: holistyczne / całościowe / aktywatory. Nie myl z: Zasada 2: Pokrycie całej organizacji – Zasada 2: CAŁA organizacja (zakres). Zasada 4: WSZYSTKIE rodzaje aktywatorów (całościowe podejście).","src":"COBIT 5 Framework (PL), s. 27; COBIT 5 Framework (PL), s. 27, Ilustracja 12; COBIT 5 Framework (PL), s. 28"},"wskaznik-opozniony":{"t":"Wskaźnik opóźniony","eg":"Wskaźnik opóźniony","pd":"Wskaźnik następujący","en":"Lag indicator","wyj":"Liczba, którą widać dopiero po fakcie i która mówi, czy cel się udał, np. wynik sprawdzianu.\n\nZarządzanie wydajnością aktywatora (enabler performance management) zadaje cztery pytania. Dwa pierwsze dotyczą wyniku: czy potrzeby interesariuszy są uwzględnione i czy cele aktywatora są osiągane. Mierniki, które na nie odpowiadają, to wskaźniki opóźnione (lag indicators). Pokazują to, co już się stało, więc służą do rozliczenia i wniosków na przyszłość.\n\nŻeby po fakcie sprawdzić, czy aktywator dał to, co miał dać: czy cele osiągnięto i czy potrzeby interesariuszy są uwzględnione.","zycie":"Miesiąc temu zacząłeś dietę. Dziś stajesz na wadze i widzisz minus 3 kg. Waga nie powie Ci, co robić jutro, tylko pokazuje, co już się stało – to wskaźnik opóźniony.","firma":"Właścicielka sklepu internetowego na koniec kwartału otwiera raport: przychód wzrósł o 10%. Na ten wynik nic już nie poradzi, może tylko wyciągnąć wnioski na następny kwartał – to wskaźnik opóźniony.","urzad":"W styczniu kierownik wydziału komunikacji w starostwie liczy, ile rejestracji pojazdów załatwiono w zeszłym roku w terminie. Wynik pokazuje, czy ubiegłoroczny cel osiągnięto, ale niczego w tamtym roku już nie zmieni – to wskaźnik opóźniony.","it":"W DSS02 (Zarządzanie zgłoszeniami serwisowymi i incydentami) odsetek incydentów rozwiązanych za kwartał w uzgodnionym czasie to wskaźnik opóźniony: mówi, czy cel osiągnięto. Taki wynik raportuje się m.in. w MEA01 (Monitorowanie, ocena i oszacowanie wydajności i zgodności).","egz":"Pytania o osiągnięcie celów i uwzględnienie potrzeb → wskaźniki opóźnione. Egzamin: „Wskaźniki opóźnione”. Podręcznik: „Wskaźniki następujące”. Nie myl z: Wskaźnik wiodący – Wiodący mierzy, czy aktywator działa właściwie: cykl życia i dobre praktyki. Przewiduje wynik.","src":"COBIT 5 Framework (PL), s. 29; materiały Altkom"},"proc-apo02":{"t":"APO02 Zarządzanie strategią","eg":"APO02 Zarządzanie strategią","pd":"APO02 Zarządzanie strategią","en":"APO02 Manage Strategy","wyj":"Plan na kilka lat: dokąd ma dojść informatyka, żeby pomóc organizacji, i jak tam dojść krok po kroku.\n\nKierownictwo IT opisuje stan obecny i docelowy, a potem lukę między nimi. Z luki wyprowadza inicjatywy i układa je w mapę drogową. Strategię uzgadnia z celami organizacji i przekazuje inicjatywy do portfela.\n\nŻeby informatyka wiedziała, dokąd ma dojść w ciągu kilku lat, aby wspierać cele organizacji, i w jakiej kolejności to zrobić.","zycie":"Chcesz za trzy lata mieszkać we własnym mieszkaniu. Sprawdzasz, ile masz teraz, ile potrzeba i czego brakuje. Rozpisujesz kroki: oszczędzanie, kredyt, przeprowadzka. To strategia z mapą drogi.","firma":"Sklep internetowy chce wejść na rynek czeski. Dyrektor IT opisuje, czego brakuje: czeskiej wersji sklepu, lokalnych płatności, nowego magazynu danych. Układa plan na dwa lata. To APO02.","urzad":"Urząd marszałkowski przyjął cel: większość spraw online do 2030 roku. Informatycy spisują stan obecny, stan docelowy i kolejne etapy. Plan trafia do zatwierdzenia. Opracowanie strategii IT to APO02.","it":"Dział IT przygotowuje trzyletnią strategię z analizą luki i mapą drogową. Opis architektury bierze z APO03 Zarządzanie architekturą korporacyjną, a inicjatywy przekazuje do APO05 Zarządzanie Portfelem.","egz":"Słowa-klucze: strategia IT, stan obecny i docelowy, luka, mapa drogowa, zgodność planu IT z celami organizacji → APO02. Załącznik E: APO02 koncentruje się na ustalaniu celów. Nazwa egzaminacyjna PL niepotwierdzona: na egzaminie nazwa może brzmieć inaczej niż w podręczniku. Egzamin używa własnych tłumaczeń, w domenach trybu rozkazującego (np. „Dostosuj, Planuj i Organizuj”). Rozpoznawaj proces po kodzie APO02 i słowie kluczowym EN Strategy. Nie myl z APO03 (architektura) ani z procesami Ładu. APO02 to strategia IT w Zarządzaniu. Nie myl z: APO03 Zarządzanie architekturą korporacyjną – APO03 opisuje, jak zbudowana jest organizacja i jej systemy (architektura), i ustala zasady budowy. APO02 mówi, dokąd idziemy i w jakiej kolejności.; Kaskada Celów – Kaskada celów przekłada potrzeby na cele. APO02 to proces, który z tych celów robi strategię i mapę drogową IT.; APO05 Zarządzanie Portfelem – APO05 wybiera i równoważy inwestycje w portfelu. APO02 wskazuje kierunek, z którego te inwestycje wynikają.","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; COBIT 5 Framework (PL), s. 59"},"cele-organizacji":{"t":"Cele organizacji","eg":"Cele organizacji","pd":"Cele przedsiębiorstwa","en":"Enterprise goals","wyj":"Siedemnaście typowych celów, które ma każda firma czy urząd, np. zadowoleni klienci, zgodność z przepisami.\n\nTo drugi krok kaskady celów: potrzeby interesariuszy (stakeholder needs) przekłada się na cele organizacji (enterprise goals). COBIT 5 podaje 17 typowych celów w 4 wymiarach BSC: finanse, klient, obszar wewnętrzny, szkolenie i rozwój. Ilustracja 5 pokazuje, z którymi składnikami Celu Ładu (realizacja korzyści, optymalizacja ryzyka, optymalizacja zasobów) cel ma relację podstawową (P) lub wspierającą (S).\n\nŻeby potrzeby interesariuszy zamienić w konkretne cele całej organizacji, z których dopiero wynikają cele dla IT. Bez tego IT nie wie, czemu ma służyć.","zycie":"Na początku roku rodzina ustala, na czym jej najbardziej zależy: odłożyć na wkład własny, żeby dzieci dobrze zaczęły nową szkołę i żeby wszyscy byli zdrowi. Nikt jeszcze nie mówi o laptopach czy internecie. To cele „całego domu” – odpowiednik celów organizacji.","firma":"Właścicielka piekarni mówi: w tym roku chcę, żeby klienci wracali, żeby sanepid nie miał uwag i żeby firma była na plusie. To cele całej piekarni, a dopiero z nich wyniknie, czego potrzeba od kasy fiskalnej czy sklepu online. Tak wyglądają cele organizacji.","urzad":"Wójt na sesji rady gminy zapowiada: decyzje wydawane w terminie, sprawy do załatwienia przez internet i jawne wydatki. Te zamierzenia dotyczą całego urzędu, nie działu informatyki. To cele organizacji, od których zaczyna się kaskada.","it":"Cel organizacji 7 „Ciągłość i dostępność usług biznesowych” (wymiar Klient) w kaskadzie prowadzi m.in. do celu związanego z IT 07 „Dostarczanie usług IT zgodnie z wymogami biznesowymi”, a dalej m.in. do procesu DSS04 Zarządzanie ciągłością.","egz":"Potrzeby interesariuszy → Cele organizacji (krok 2). 17 celów, 4 wymiary BSC, relacje P/S. Nie musisz znać wszystkich 17 na pamięć – rozpoznawaj wymiary i logikę P/S. Egzamin: „Cele organizacji”. Podręcznik: „Cele przedsiębiorstwa”. Słownik podręcznika odsyła do „Cel biznesowy”. Nie myl z: Cele związane z informatyką – Cele organizacji dotyczą całej działalności; cele związane z informatyką opisują, co musi zapewnić IT, aby te cele wspierać.","src":"COBIT 5 Framework (PL), s. 19, Ilustracja 5; COBIT 5 Framework (PL), s. 91"},"cobit-2019":{"t":"COBIT 2019","eg":"COBIT 2019","pd":"—","en":"COBIT 2019","wyj":"Nowsza wersja COBIT z innymi nazwami; nie myl jej z COBIT 5, z którego jest egzamin.\n\nCOBIT 2019 zastępuje aktywatory komponentami systemu ładu (components), zamiast 37 procesów ma 40 celów Ładu i Zarządzania (governance and management objectives) i dodaje czynniki projektowe (design factors). Nowe cele to m.in. APO14 (dane), BAI11 (projekty) i MEA04 (zapewnienie). Gdy w odpowiedzi pada „komponent”, „40 celów” albo „czynnik projektowy”, odpowiedź nie dotyczy COBIT 5.\n\nTo hasło ostrzegawcze: pomaga rozpoznać pojęcia z nowszej wersji, które na egzaminie COBIT 5 Foundation są błędnymi odpowiedziami.","zycie":"Kupujesz używany samochód i dostajesz instrukcję do nowszego modelu. Przyciski są podobne, ale część nazw i funkcji się różni, więc instrukcja myli zamiast pomagać. Tak działa nauka do egzaminu COBIT 5 z materiałów o COBIT 2019.","firma":"Bank zatrudnia konsultanta do przygotowania pracowników do egzaminu COBIT 5 Foundation. Konsultant uczy z najnowszych materiałów i mówi o „celach Ładu i Zarządzania” zamiast o 37 procesach. Na egzaminie część osób wybiera odpowiedzi w języku COBIT 2019 i traci punkty, choć znała temat.","urzad":"Urząd marszałkowski zamawia audyt informatyki oparty na COBIT 5. Audytor przysyła raport pełen „komponentów”, „40 celów Ładu i Zarządzania” i „czynników projektowych”. Kierowniczka wydziału informatyki odsyła raport do poprawy, bo to słownictwo COBIT 2019, a nie wersji z zamówienia.","it":"W COBIT 5 zarządzanie ryzykiem to proces APO12 Zarządzanie ryzykiem, a w COBIT 2019 to cel zarządczy APO12 Managed Risk. Na egzaminie COBIT 5 poprawne jest słowo „proces”, a nie „cel zarządczy” (management objective).","egz":"Jeśli odpowiedź mówi o „40 celach”, „komponentach systemu ładu” albo „czynnikach projektowych”, to jest COBIT 2019, a więc zła odpowiedź. Materiały o COBIT 2019 są w internecie częstsze niż o COBIT 5. Nie ucz się z nich: inne pojęcia (40 celów, „komponenty”, czynniki projektowe) dają złe odpowiedzi na egzaminie COBIT 5. Nie myl z: COBIT 5 – COBIT 5: 5 zasad, 7 aktywatorów, 37 procesów.","src":"WWW"},"cele-zwiazane-z-it":{"t":"Cele związane z informatyką","eg":"Cele związane z informatyką","pd":"Cele związane z IT","en":"IT-related goals","wyj":"Siedemnaście typowych celów dla informatyki, np. systemy działają, dane są bezpieczne, projekty kończą się na czas.\n\nTo trzeci krok kaskady celów: cele organizacji przekłada się na cele związane z IT (IT-related goals), czyli rezultaty związane z IT. COBIT 5 podaje ich 17 w wymiarach IT BSC; mapowanie na cele organizacji jest w Załączniku B, a na procesy w Załączniku C. „Związane z IT” oznacza informację i powiązaną technologię w całej organizacji, a nie tylko dział IT.\n\nŻeby wiedzieć, co informacja i technologia muszą zapewnić, aby udały się cele organizacji. Dzięki temu IT nie wyznacza sobie celów w oderwaniu od reszty organizacji.","zycie":"Rodzina chce bezpiecznie odkładać pieniądze. Żeby się udało, w domu musi działać bankowość w telefonie, hasła muszą być w menedżerze haseł, a skany umów mieć kopię zapasową. Te wymagania wobec domowej technologii to cele związane z IT.","firma":"Sklep internetowy chce zadowolonych klientów. Z tego wynika, że strona ma działać także w Black Friday, płatności mają przechodzić bez błędów, a adresy klientów nie mogą wyciec (cele IT 07 i 10). To cele związane z IT – to, co technologia musi dać, żeby udał się cel sklepu.","urzad":"Gmina chce, żeby mieszkańcy załatwiali sprawy przez internet. Do tego e-usługi muszą działać, dane osobowe muszą być chronione, a rejestry aktualne. To nie są cele informatyka dla niego samego, tylko cele związane z IT, które wynikają z celu gminy.","it":"Cel związany z IT 10 „Bezpieczeństwo informacji, infrastruktury przetwarzania i aplikacji” (wymiar Obszar wewnętrzny) to rezultat, który w banku muszą zapewnić m.in. procesy APO13 Zarządzanie bezpieczeństwem i DSS05 Zarządzanie usługami bezpieczeństwa.","egz":"Opis „rezultaty związane z IT, wymagane do osiągnięcia celów organizacji” to Cele związane z informatyką (s. 18). Egzamin: „Cele związane z informatyką”. Podręcznik: „Cele związane z IT”. Nie myl z: Cele organizacji – Krok wcześniej: cele organizacji dotyczą całej działalności.; Cele aktywatora – Krok później: cele konkretnych aktywatorów (np. procesów), które pozwalają osiągnąć cele związane z informatyką.","src":"COBIT 5 Framework (PL), s. 18; COBIT 5 Framework (PL), s. 19, Ilustracja 6; materiały Altkom"},"proc-edm02":{"t":"EDM02 Zapewnienie realizacji korzyści","eg":"EDM02 Zapewnienie realizacji korzyści","pd":"EDM02 Zapewnienie realizacji korzyści","en":"EDM02 Ensure Benefits Delivery","wyj":"Szefostwo pilnuje, żeby pieniądze wydane na informatykę dały prawdziwy pożytek, a nie tylko nowe urządzenia.\n\nOrgan Ładu ocenia, jakiej wartości oczekuje od inwestycji i usług IT. Kieruje priorytetami i wymaga uzasadnień biznesowych. Monitoruje, czy korzyści przyszły, i decyduje: kontynuować, poprawić albo zakończyć.\n\nŻeby pieniądze wydane na IT dawały organizacji prawdziwą korzyść, a nie kończyły się na zakupie i wdrożeniu.","zycie":"Kupiliście robota sprzątającego za 1500 zł. Po trzech miesiącach pytacie: czy naprawdę mamy więcej wolnego czasu? Jeśli robot stoi w szafie, korzyści nie ma, choć zakup się „udał”. Pilnowanie tej różnicy to EDM02.","firma":"Zarząd sklepu internetowego zatwierdził nową bramkę płatności, bo miała zmniejszyć porzucanie koszyków. Pół roku po wdrożeniu zarząd sprawdza, czy porzuceń jest mniej. Nie liczy, czy projekt skończył się w terminie. Liczy, czy przyszła korzyść.","urzad":"Rada powiatu dała pieniądze na e-rejestrację pojazdów. Po roku pyta starostę: o ile skróciły się kolejki w wydziale komunikacji? Gdy korzyści brak, rada każe poprawić usługę albo przestać na nią wydawać. To EDM02.","it":"Rada nadzorcza przegląda portfel inwestycji IT z mierzonymi korzyściami (np. czas obsługi klienta). Ocenę wartości i decyzje o dalszym finansowaniu podejmuje w EDM02, a portfel układa APO05 Zarządzanie Portfelem.","egz":"EDM02 = Ład + korzyści i wartość. Razem z EDM03 Zapewnienie optymalizacji ryzyka i EDM04 Zapewnienie optymalizacji zasobów odpowiada trzem składnikom Celu Ładu: korzyści, ryzyko, zasoby. Słowa „wartość inwestycji”, „uzasadnienie biznesowe” na poziomie organu Ładu → EDM02. Nazwa egzaminacyjna PL niepotwierdzona: na egzaminie nazwa może brzmieć inaczej niż w podręczniku. Egzamin używa własnych tłumaczeń, w domenach trybu rozkazującego (np. „Dostosuj, Planuj i Organizuj”). Rozpoznawaj proces po kodzie EDM02 i słowie kluczowym EN Benefits. Nie myl z BAI01 (doprowadzenie projektu do końca) ani z APO05 (portfel). „Realizacja” znaczy tu, że korzyść ma się naprawdę pojawić, a nie że projekt ma się zakończyć. Nie myl z: APO05 Zarządzanie Portfelem – APO05 (Zarządzanie) wybiera i równoważy inwestycje w portfelu. EDM02 (Ład) ustala, jakiej wartości oczekujemy, i ocenia, czy ją dostajemy.; BAI01 Zarządzanie programami i projektami – BAI01 dowozi projekt: zakres, termin, budżet. EDM02 pyta, czy z dowiezionego projektu jest pożytek.; Realizacja korzyści – Realizacja korzyści to składnik Celu Ładu (pojęcie). EDM02 to proces, który ten składnik zapewnia.","src":"COBIT 5 Framework (PL), s. 33, Ilustracja 16; COBIT 5 Framework (PL), s. 58; COBIT 5 Framework (PL), s. 89"}},"S":[{"lekcje":["fn-k10-czytanie-tabel","fn-k11-kaskada-to-wytyczna","fn-k12-profil-ocen-od-dolu"],"pt":"Lekcje 10.10–10.12","h":"Zanim odczytasz literę z tabeli, ustal, co to za tabela","b":"<ol><li>Rodzaj: macierz P/S, skala, role, cykl?<\/li><li>Kierunek czytania.<\/li><li>Katalog: cel organizacji 7 ≠ cel IT 07.<\/li><li>System liter.<\/li><li>Czy trzeba dostosować?<\/li><\/ol><p>Rysunek (egzamin) = Ilustracja (podręcznik).<\/p>","c":"Tabele kaskady są wytyczną: litera P podpowiada, a nie nakazuje.","s":"COBIT 5 Framework (PL), s. 18–21, 45, 50, 52","ctx":"<p><w k=\"cele-organizacji\">Cele organizacji<\/w> i <w k=\"cele-zwiazane-z-it\">cele związane z IT<\/w> mają osobne katalogi po 17 pozycji: 7 to „Ciągłość i dostępność usług biznesowych”, 07 – „Dostarczanie usług IT zgodnie z wymogami biznesowymi” (s. 19). Rysunek 22 (s. 50) prowadzi od celów organizacji do celów IT, Rysunek 23 (s. 52) – od celów IT do procesów.<\/p><p>Tabela kaskady „nie zawiera uniwersalnej prawdy” (s. 20): priorytety są różne i zmienne, tabele nie znają wielkości ani branży, a podział P/S upraszcza ciągłą skalę. W Przykładzie 1 organizacja z siedmiu celów IT z relacją P wybiera cztery (s. 21) – to wzorcowe użycie. Pytanie o „mechaniczne stosowanie” tabel ma odpowiedź przeczącą.<\/p><p>Litera P w trzech tabelach: kaskada – relacja podstawowa (<span class=\"en\">Primary<\/span>); egzamin PL – Pełny; podręcznik PL – częściowo (<span class=\"en\">Partially<\/span>, egzaminacyjne C). Profil PA 1.1 = W, 2.1 = P, 2.2 = P to poziom 1 – czytasz od dołu.<\/p>"},{"pt":"Sprawdź się","quiz":{"id":"q-fnk-10-3","sylabus":["EX-00-01"],"tresc":"Pytanie egzaminacyjne odwołuje się do Rysunku 23. Gdzie znajdziesz tę treść w polskim podręczniku COBIT 5?","opcje":[{"t":"Na Ilustracji 23 – cele związane z IT na procesy","ok":true,"w":"Dobrze. Egzamin mówi „Rysunek”, podręcznik – „Ilustracja”, a numer jest ten sam. Ilustracja 23 mapuje cele związane z IT na procesy."},{"t":"Na Rysunku 23 – podręcznik używa tej samej nazwy","w":"Podręcznik PL używa słowa „Ilustracja”, a nie „Rysunek”."},{"t":"W Załączniku D – potrzeby interesariuszy a cele organizacji","w":"Załącznik D dotyczy innego szczebla kaskady."},{"t":"Na Ilustracji 23 – cele organizacji na cele związane z IT","w":"To opis Ilustracji 22. Ilustracja 23 idzie krok dalej, do procesów."}],"src":"COBIT 5 Framework (PL), s. 52","pomoc":{"t":"Pytanie dotyczy lekcji 10.10 „Etap F1 – jak czytać tabele i rysunki podręcznika”. Cel lekcji: Potrafię zadać tabeli z podręcznika COBIT 5 pięć pytań, zanim odczytam z niej literę albo numer.","k":[]}}},{"pt":"Sprawdź się","quiz":{"id":"q-fnk-11-3","sylabus":["EX-00-01","PR-02-07"],"tresc":"W Przykładzie 1 podręcznika organizacja dostaje z tabeli siedem celów związanych z informatyką z relacją P i wybiera cztery. Jak ocenić tę decyzję?","opcje":[{"t":"Jest błędna – relacja P (Primary) oznacza cel obowiązkowy","w":"P to relacja podstawowa, czyli silniejsze powiązanie, a nie obowiązek."},{"t":"Jest właściwa – tabelę kaskady się dostosowuje","ok":true,"w":"Dobrze. Podręcznik pokazuje wybór czterech z siedmiu jako wzorcowe użycie kaskady."},{"t":"Jest dopuszczalna tylko, gdy pominięte cele mają relację S","w":"Wszystkie siedem miało relację P, a wybór i tak był właściwy."},{"t":"Jest błędna – P oznacza ocenę Pełny, więc cele są już osiągnięte","w":"To litera P ze skali ocen egzaminu PL, a nie z macierzy kaskady."}],"src":"COBIT 5 Framework (PL), s. 21","pomoc":{"t":"Pytanie dotyczy lekcji 10.11 „Tabele kaskady celów są wytyczną, a nie przepisem”. Cel lekcji: Potrafię wyjaśnić, dlaczego organizacja nie musi przyjąć wszystkich celów, które tabela kaskady oznacza literą P.","k":[]}}},{"pt":"Sprawdź się","quiz":{"id":"q-fnk-12-3","sylabus":["EX-00-01","PC-01-03"],"tresc":"Raport przygotowany według skali z podręcznika PL (litery angielskie) podaje dla PA 2.2 literę P. Co ta ocena oznacza w skali egzaminu PL?","opcje":[{"t":"W – Większościowy","w":"W odpowiada angielskiemu L, a nie P."},{"t":"Relację podstawową z macierzy kaskady celów","w":"To trzecie znaczenie litery P, z innej tabeli."},{"t":"C – Częściowy","ok":true,"w":"Dobrze. W skali N/P/L/F litera P to „częściowo osiągnięto”, czyli egzaminacyjne C."},{"t":"P – Pełny","w":"To przepisanie litery bez zmiany znaczenia. Pełny to w skali angielskiej F."}],"src":"COBIT 5 Framework (PL), s. 45","pomoc":{"t":"Pytanie dotyczy lekcji 10.12 „Profil ocen czytaj od dołu – i litera P w trzech tabelach”. Cel lekcji: Potrafię ustalić poziom zdolności z profilu ocen, czytając go od dołu, i rozpoznać trzy znaczenia litery P.","k":[]}}},{"lekcje":["fn-k13-pytanie-z-internetu","fn-k14-cobit-2019-i-dumpy"],"pt":"Lekcje 10.13–10.14","h":"Obce pytanie: przetłumacz, sprawdź model, rozstrzygnij podręcznikiem","b":"<ol><li>Nazwy na egzaminacyjne (Enabler → <w k=\"aktywator\">Aktywator<\/w>).<\/li><li>Słowa z <w k=\"cobit-2019\">COBIT 2019<\/w> odrzucasz.<\/li><li>Klucz ze strony sprawdzasz w podręczniku.<\/li><li>Czy to prawda i ta sama szuflada?<\/li><\/ol>","c":"Z internetu bierzesz pomysł na sytuację, nigdy rozstrzygnięcie.","s":"COBIT 5 Framework (PL), s. 14, 29, 33","ctx":"<p><w k=\"cobit-2019\">COBIT 2019<\/w> to inny model (wiedza ogólna): komponenty, 40 celów Ładu i Zarządzania, czynniki projektowe, obszary koncentracji. COBIT 5 ma siedem kategorii aktywatorów i 37 procesów. W pytaniu „która jest kategorią aktywatorów?” trzy fachowo brzmiące opcje z COBIT 2019 to dystraktory – zostają „Procesy”. „Dumpy”, czyli rzekome pytania z egzaminu, mają złe klucze, łamią poufność i uczą liter zamiast uzasadnień.<\/p><p>Jeden termin <span class=\"en\">Governance<\/span> to „ład informatyczny” w artykułach, „nadzór” w podręczniku i Ład na egzaminie; „przedsiębiorstwo” to zawsze Organizacja, także urząd czy szpital. Rozstrzyga definicja, nie brzmienie: odsetek pracowników banku przeszkolonych z bezpieczeństwa, liczony raz w roku, mierzy stosowanie praktyki, więc jest <w k=\"wskaznik-wiodacy\">wskaźnikiem wiodącym<\/w>; liczba udanych ataków phishingowych mierzy osiągnięcie celu – <w k=\"wskaznik-opozniony\">opóźniony<\/w> (s. 29).<\/p>"},{"pt":"Sprawdź się","quiz":{"id":"q-fnk-13-2","sylabus":["EX-00-01"],"tresc":"Artykuł branżowy o bankowości pisze o „ładzie informatycznym”. Jakiej nazwy użyjesz, rozwiązując pytanie egzaminu COBIT 5 PL?","opcje":[{"t":"Zarządzanie IT – bo artykuł dotyczy informatyki","w":"Zarządzanie (Management) to inna dziedzina niż Ład."},{"t":"Ład informatyczny – to osobne pojęcie COBIT 5","w":"To nazwa z artykułów branżowych, a nie osobny termin COBIT 5."},{"t":"Nadzór – bo tak pisze polski podręcznik","w":"To nazwa podręcznikowa. Na egzaminie PL szukaj słowa „Ład”."},{"t":"Ład (Governance)","ok":true,"w":"Dobrze. „Ład informatyczny”, „nadzór” i „Ład” to jeden termin Governance; egzamin PL mówi „Ład”."}],"src":"materiały Altkom; COBIT 5 Framework (PL), s. 14","pomoc":{"t":"Pytanie dotyczy lekcji 10.13 „Etap F2 – cztery kroki dla pytania z obcego źródła”. Cel lekcji: Potrafię przełożyć pytanie z obcego źródła na nazwy egzaminacyjne i rozstrzygnąć je definicją z podręcznika.","k":[]}}},{"pt":"Sprawdź się","quiz":{"id":"q-fnk-14-3","sylabus":["EX-00-01","PR-01-02"],"tresc":"Która z poniższych jest jedną z siedmiu kategorii aktywatorów COBIT 5?","opcje":[{"t":"Informacja","ok":true,"w":"Dobrze. Informacja to jedna z siedmiu kategorii aktywatorów (czynników umożliwiających)."},{"t":"Obszary koncentracji systemu ładu","w":"To również pojęcie z COBIT 2019."},{"t":"Cele Ładu i Zarządzania","w":"40 celów Ładu i Zarządzania to COBIT 2019, a nie kategoria aktywatora."},{"t":"Czynniki projektowe systemu ładu","w":"To pojęcie z COBIT 2019."}],"src":"COBIT 5 Framework (PL), s. 14","pomoc":{"t":"Pytanie dotyczy lekcji 10.14 „COBIT 2019 i „dumpy” – źródła, które prowadzą do złej odpowiedzi”. Cel lekcji: Potrafię rozpoznać pojęcia z COBIT 2019 w pytaniu z internetu i zamienić je na odpowiedniki z COBIT 5.","k":[]}}},{"lekcje":["fn-k15-pytanie-przekrojowe","fn-k16-wdrozenie-kaskada-luka","fn-k17-kto-monitoruje"],"pt":"Lekcje 10.15–10.17","h":"Pytanie przekrojowe: rozłóż scenariusz, znajdź regułę, która decyduje","b":"<ol><li>Przy każdym zdaniu zapisz obszar: PR, EN, IM, PC.<\/li><li>Ostatnie zdanie mówi, o co pytają.<\/li><li>Przy „prawie” wypisz elementy definicji.<\/li><li>Opcja: prawdziwa i z tej samej kategorii?<\/li><li>Litery skali: ustal język tabeli.<\/li><\/ol>","c":"Pytanie mistrzowskie nie wymaga nowej wiedzy, tylko porządku w tej, którą masz.","s":"COBIT 5 Framework (PL), s. 14, 24, 32, 38","ctx":"<p>Rodzaje pytań mistrzowskich: przekrojowe, przypadek graniczny, trzy nazwy, „prawie spełnia definicję”, wstecz po kaskadzie, reguły oceny. Egzamin mistrzowski kursu (metodyka, nie wymóg egzaminu): 50 pytań w proporcjach PR 15, EN 21, IM 7, PC 7, 40 minut; „Skrajnie biegły” to co najmniej 40/50 dwa razy z rzędu i każdy obszar co najmniej 70%.<\/p><p>Przykład: sklep internetowy co roku pada w święta (<w k=\"punkty-zapalne\">punkt zapalny<\/w>), a zapowiedziano audyt (zdarzenie wyzwalające) – oba rozpoznajesz w fazie 1. W fazie 2 zakres wyznacza mapowanie celów organizacji na cele IT (np. ciągłość → DSS04, BAI04), a nie „wszystkie 37 procesów”. Stan PA 1.1 = P, 2.1 = W, 2.2 = C i cel „poziom 2” dają lukę tylko w PA 2.2 (z C do co najmniej W). Luka to nie średnia ani „wszystko do P”.<\/p><p>Kto monitoruje? Pytanie o czynności Ładu (EDM) – Ład, względem kierunku (s. 14, 32); pytanie o role z Rysunku 9 – kierownictwo i bieżące wykonanie (s. 24). Czasownik jest w obu, więc szukaj słów „Rysunek 9” albo „role”. <span class=\"en\">Governing body<\/span> to na egzaminie <w k=\"organ-ladu\">Organ Ładu i nadzoru<\/w>.<\/p>"},{"pt":"Sprawdź się","quiz":{"id":"q-fnk-15-3","sylabus":["EX-00-01"],"tresc":"Pytanie podaje nazwę z podręcznika PL, nazwę z egzaminu PL i termin angielski, a pyta, która trójka opisuje to samo pojęcie. Jaki to rodzaj pytania mistrzowskiego?","opcje":[{"t":"Wstecz po kaskadzie","w":"Ten rodzaj każe iść od procesu do celu organizacji."},{"t":"Trzy nazwy","ok":true,"w":"Dobrze. Pytanie o trzy nazwy sprawdza egzamin PL, podręcznik PL i angielski termin."},{"t":"Prawie spełnia definicję","w":"Ten rodzaj ukrywa brak jednego elementu definicji."},{"t":"Reguły oceny zdolności","w":"Ten rodzaj dotyczy profilu liter N/C/W/P."}],"src":"materiały Altkom","pomoc":{"t":"Pytanie dotyczy lekcji 10.15 „Etap F3 – pytanie przekrojowe i egzamin mistrzowski”. Cel lekcji: Potrafię rozpoznać rodzaj pytania mistrzowskiego i rozłożyć scenariusz na obszary COBIT 5, zanim sprawdzę opcje.","k":[]}}},{"pt":"Sprawdź się","quiz":{"id":"q-fnk-16-3","sylabus":["EX-00-01","IM-02-05","PC-01-02"],"tresc":"Stan obecny procesu: PA 1.1 = P, PA 2.1 = W, PA 2.2 = C. W fazie 3 organizacja wyznacza cel: poziom 2. Jaką lukę trzeba zamknąć?","opcje":[{"t":"Podnieść PA 2.1 i PA 2.2 do oceny P","w":"P jest wymagane na niższych poziomach, a nie na ocenianym."},{"t":"Żadnej – średnia ocen poziomu 2 daje ocenę W","w":"Model nie liczy średniej; każdy atrybut sprawdza się osobno."},{"t":"Podnieść PA 2.2 co najmniej do W","ok":true,"w":"Dobrze. PA 1.1 = P i PA 2.1 = W już spełniają regułę poziomu 2. Brakuje tylko PA 2.2."},{"t":"Najpierw podnieść PA 1.1, bo poziom 1 jest niepotwierdzony","w":"PA 1.1 ma P, więc poziom 1 jest potwierdzony."}],"src":"COBIT 5 Framework (PL), s. 38; COBIT 5 Framework (PL), s. 42","pomoc":{"t":"Pytanie dotyczy lekcji 10.16 „Pytanie przekrojowe – wdrożenie, kaskada celów i luka zdolności”. Cel lekcji: Potrafię połączyć fazy 1–3 wdrożenia z kaskadą celów i obliczyć lukę zdolności atrybut po atrybucie.","k":[]}}},{"pt":"Sprawdź się","quiz":{"id":"q-fnk-17-3","sylabus":["EX-00-01","PR-02-14"],"tresc":"Bank co kwartał sprawdza, czy osiąga cele organizacji. Kto według Rysunku 9 i uzasadnień egzaminu PL odpowiada wykonawczo za to monitorowanie?","opcje":[{"t":"Role operacyjne (eksploatacja i wykonanie)","w":"Role operacyjne wykonują pracę i raportują do kierownictwa. Za monitorowanie osiągania celów nie odpowiadają."},{"t":"Właściciele i interesariusze","w":"Oni delegują uprawnienia organowi Ładu i rozliczają go. Nie monitorują na bieżąco osiągania celów."},{"t":"Organ Ładu","w":"Organ Ładu jest na Rysunku 9 rolą rozliczaną wobec interesariuszy i wyznacza kierunek; odpowiedzialność wykonawczą za monitorowanie osiągania celów egzamin PL przypisuje Kierownictwu."},{"t":"Kierownictwo (Zarządzanie)","ok":true,"w":"Dobrze. Na Rysunku 9 relacja „Monitorowanie” łączy kierownictwo z organem Ładu, a egzamin PL przypisuje kierownictwu odpowiedzialność wykonawczą za monitorowanie osiągania celów."}],"src":"COBIT 5 Framework (PL), s. 24","pomoc":{"t":"Pytanie dotyczy lekcji 10.17 „Przypadek graniczny – kto monitoruje: Ład czy kierownictwo?”. Cel lekcji: Potrafię rozstrzygnąć, kto monitoruje, na podstawie kategorii pytania: czynności Ładu czy role z Rysunku 9.","k":[]}}},{"lekcje":["fn-k18-bledy-w-materialach"],"pt":"Lekcja 10.18","h":"Film szkoleniowy też się myli – rozstrzyga podręcznik","b":"<ul><li><w k=\"proc-edm02\">EDM02<\/w> to korzyści, strategia to <w k=\"proc-apo02\">APO02<\/w>.<\/li><li>Zasada 3 – jedna <w k=\"struktura-ramowa\">struktura ramowa<\/w>, <w k=\"zasada-4\">zasada 4<\/w> – holizm.<\/li><li><w k=\"cobit-5\">COBIT 5<\/w> ma <w k=\"model-zdolnosci\">model zdolności<\/w>, nie dojrzałości.<\/li><li><w k=\"kaskada-celow\">Kaskada celów<\/w> ma 4 kroki.<\/li><li>17 to liczba celów, nie potrzeb.<\/li><\/ul>","c":"Gdy film i podręcznik mówią co innego, wygrywa podręcznik COBIT 5.","s":"COBIT 5 Framework (PL), s. 13, 17–19, 33, 41","ctx":"<p>Te pięć błędów pochodzi z przeglądu popularnych filmów szkoleniowych o COBIT 5 na YouTube (wiedza ogólna, listopad 2026). Dwa są pomyłkami w kodach i numerach: <w k=\"proc-edm02\">EDM02<\/w> to Zapewnienie realizacji korzyści, a strategią zajmuje się <w k=\"proc-apo02\">APO02<\/w> (s. 33); zasada 3 to Zastosowanie Pojedynczej Zintegrowanej Struktury Ramowej, a zasada 4 – Aktywacja holistycznego podejścia (s. 13).<\/p><p>Trzy pozostałe mieszają wersje i listy. Cele kontrolne, wytyczne zarządcze i modele dojrzałości to elementy COBIT 4.1 – COBIT 5 ocenia procesy <w k=\"model-zdolnosci\">modelem zdolności procesu<\/w> (s. 41). <w k=\"kaskada-celow\">Kaskada celów<\/w> ma cztery kroki (s. 17–18), a liczba 17 dotyczy <w k=\"cele-organizacji\">celów organizacji<\/w> i celów związanych z IT (s. 19). Potrzeby interesariuszy podręcznik podaje jako pytania Ładu i Zarządzania (Ilustracja 24).<\/p><p>Przykład: kurs dla urzędu marszałkowskiego podaje „EDM02 – Zarządzanie strategią”. Zanim zapiszesz to w notatkach, sprawdzasz Ilustrację 16 na s. 33.<\/p>"},{"pt":"Sprawdź się","quiz":{"id":"q-fnk-18-3","sylabus":["EX-00-01"],"tresc":"Kolega powtarza z filmu: „Zasada 3 to Aktywacja holistycznego podejścia, a zasada 4 to Zastosowanie Pojedynczej Zintegrowanej Struktury Ramowej”. Jak go poprawić?","opcje":[{"t":"Zamienić numery: 3 to jedna struktura ramowa, 4 to holizm","ok":true,"w":"Dobrze. Zasada 3: Zastosowanie Pojedynczej Zintegrowanej Struktury Ramowej, zasada 4: Aktywacja holistycznego podejścia (s. 13)."},{"t":"Poprawić zasadę 3 na Oddzielenie Ładu od Zarządzania, a resztę zostawić","w":"Oddzielenie Ładu od Zarządzania to zasada 5."},{"t":"Poprawić zasadę 4 na Pokrycie całej organizacji, a resztę zostawić bez zmian","w":"Pokrycie całej organizacji to zasada 2."},{"t":"Nic nie zmieniać, bo kolejność zasad COBIT 5 nie ma znaczenia dla egzaminu","w":"Numery zasad są stałe i pytania egzaminacyjne się do nich odwołują."}],"src":"COBIT 5 Framework (PL), s. 13","pomoc":{"t":"Pytanie dotyczy lekcji 10.18 „Błędy w filmach i kursach z internetu”. Cel lekcji: Potrafię wyłapać typowe błędy w materiałach o COBIT 5 z internetu i rozstrzygnąć je podręcznikiem.","k":[]}}}]};</script>
