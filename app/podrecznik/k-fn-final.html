<script>window.DECK={"id":"k-fn-final","rozdzial":"Poza podręcznikiem · Mentor i finał","tytul":"Finał: tabele, obce źródła, pytania przekrojowe","prev":"k-mt-zdolnosc.html","next":null,"T":{"wskaznik-wiodacy":{"t":"Wskaźnik wiodący","eg":"Wskaźnik wiodący","pd":"Wskaźnik wyprzedzający","en":"Lead indicator","wyj":"Liczba, która ostrzega wcześniej, czy idziemy w dobrą stronę, np. ile godzin się uczysz.\n\nDwa ostatnie z czterech pytań zarządzania wydajnością aktywatora (enabler performance management) dotyczą jego funkcjonowania: czy cykl życia aktywatora jest zarządzany i czy stosowane są dobre praktyki. Mierniki, które na nie odpowiadają, to wskaźniki wiodące (lead indicators). Przewidują przyszły wynik, który potem pokażą wskaźniki opóźnione (lag indicators).\n\nŻeby wcześnie, zanim pojawi się wynik, zobaczyć, czy aktywator działa jak trzeba, i zdążyć to poprawić.","zycie":"Za trzy miesiące biegniesz półmaraton. Co tydzień sprawdzasz, czy zrobiłeś zaplanowane cztery treningi. Jeśli od miesiąca wychodzą dwa, już wiesz, że wynik będzie słaby, i możesz to jeszcze zmienić – to wskaźnik wiodący.","firma":"Właściciel warsztatu samochodowego sprawdza, czy mechanicy wypełniają listę kontrolną przy każdym aucie. Jeśli połowa ją pomija, spodziewa się reklamacji, zanim te przyjdą, i od razu reaguje – to wskaźnik wiodący.","urzad":"Tydzień przed wejściem nowej procedury w urzędzie gminy sekretarz sprawdza, ilu urzędników przeszło szkolenie. Jest 60%, więc wie, że będą kłopoty, zanim wpłynie pierwsza skarga – to wskaźnik wiodący.","it":"W BAI06 (Zarządzanie zmianami) odsetek zmian wdrażanych po zatwierdzeniu i z planem wycofania to wskaźnik wiodący. Gdy spada, można przewidzieć więcej incydentów w DSS02 (Zarządzanie zgłoszeniami serwisowymi i incydentami), zanim one wystąpią.","egz":"Wskaźnik wiodący mierzy, czy cykl życia jest zarządzany i czy stosowane są dobre praktyki. Osiągnięcie celów i uwzględnienie potrzeb mierzą wskaźniki opóźnione (s. 29). Egzamin: „Wskaźniki wiodące”. Podręcznik: „Wskaźniki wyprzedzające”. Nie myl z: Wskaźnik opóźniony – Opóźniony mierzy wynik, czyli osiągnięcie celów i zaspokojenie potrzeb.","src":"COBIT 5 Framework (PL), s. 29"},"punkty-zapalne":{"t":"Punkty zapalne","eg":"Punkty zapalne","pd":"Punkty zapalne","en":"Pain points","wyj":"To, co już boli i wszyscy się skarżą, np. częste awarie albo przekroczone budżety.\n\nPunkty zapalne (pain points) to trwające problemy, np. nieudane projekty, powtarzające się uwagi audytu, ukryte wydatki na IT czy kłopoty z outsourcingiem. Organizacja rozpoznaje je na początku wdrożenia (faza 1 „Jakie są wyznaczniki?”) i wiąże z nimi uzasadnienie biznesowe (business case) oraz cele inicjatywy. Rozwiązanie widocznego problemu daje szybkie korzyści (quick wins) i poparcie kierownictwa.\n\nŻeby problemy, które wszyscy już odczuwają, wykorzystać jako bodziec i argument do rozpoczęcia wdrożenia albo poprawy Ładu i Zarządzania IT.","zycie":"Co miesiąc, tydzień przed wypłatą, konto jest puste i trzeba pożyczać od rodziców. Wszyscy w domu to czują i wszyscy mają dość kłótni o pieniądze. To punkt zapalny – trwający ból, który w końcu skłania do ułożenia domowego budżetu.","firma":"W sklepie internetowym trzeci raz w miesiącu pada strona w czasie promocji, a klienci piszą złe opinie. Do tego firma płaci za dwa programy do faktur, bo każdy wspólnik kupił swój. Te powtarzające się problemy to punkty zapalne – argument, żeby wreszcie uporządkować IT.","urzad":"Audyt wewnętrzny drugi rok z rzędu pisze w raporcie to samo: konta byłych pracowników urzędu gminy nadal mają dostęp do systemów. Wójt ma dość tłumaczenia się radzie. Powtarzające się złe wyniki audytu to klasyczny punkt zapalny.","it":"Audyt trzeci rok z rzędu wskazuje brak przeglądów uprawnień, a dwa działy utrzymują osobne, zdublowane systemy zgłoszeń. Te punkty zapalne uzasadniają inicjatywę wdrożenia, w której organizacja poprawia m.in. DSS05 (Zarządzanie usługami bezpieczeństwa) i APO05 (Zarządzanie portfelem projektów).","egz":"„Zduplikowane projekty”, „ukryte wydatki na IT”, „powtarzające się złe wyniki audytu”, „złożone modele operacyjne IT” → punkty zapalne. „Fuzje i przejęcia” → zdarzenie wyzwalające. Nie myl z: Zdarzenia wyzwalające – Punkt zapalny to TRWAJĄCY problem (ból). Zdarzenie wyzwalające to ZMIANA w otoczeniu (fuzja, nowe przepisy, nowy CIO).","src":"COBIT 5 Framework (PL), s. 36, 37"},"aktywator":{"t":"Aktywator","eg":"Aktywator","pd":"Czynnik umożliwiający","en":"Enabler","wyj":"Wszystko, co musi zagrać, żeby informatyka działała dobrze: ludzie, reguły, narzędzia, informacje.\n\nCOBIT 5 dzieli aktywatory (enablers) na 7 kategorii, od Zasad, polityk i struktur ramowych (Principles, Policies and Frameworks) po Ludzi, umiejętności i kompetencje (People, Skills and Competencies). Kaskada celów wyznacza, czego oczekujemy od każdego aktywatora (cele aktywatora). Aktywatory są od siebie zależne i dostarczają sobie wejść, np. proces potrzebuje informacji i przeszkolonych ludzi. Każdy opisuje się w 4 wymiarach: interesariusze, cele, cykl życia, dobre praktyki.\n\nŻeby organizacja widziała wszystko, co musi zagrać, by osiągnąć cele, a nie tylko technologię. Aktywatory to elementy, przez które Ład i Zarządzanie realnie wpływają na wynik.","zycie":"Chcesz, żeby dzieci same odrabiały lekcje. Ustalacie zasadę „najpierw zadania, potem tablet”, stałą godzinę po obiedzie, kupujecie biurko z lampką, a Ty w tym czasie też siadasz z książką zamiast z telefonem. Zasada, stała pora, biurko i Twój przykład to różne aktywatory – działają dopiero razem.","firma":"Właścicielka kawiarni chce, żeby kawa smakowała tak samo na każdej zmianie. Spisuje recepturę, ustala kolejność parzenia, szkoli nowego baristę i oddaje ekspres do serwisu. Receptura, sposób parzenia, umiejętności baristy i ekspres to aktywatory – brak jednego psuje całość.","urzad":"Urząd gminy chce wydawać decyzje w terminie. Ma instrukcję kancelaryjną, ustalony obieg wniosku, wydział, który za sprawę odpowiada, system EZD i urzędników po szkoleniu z KPA. Każdy z tych elementów to aktywator innej kategorii.","it":"Proces DSS04 Zarządzanie ciągłością to aktywator z kategorii Procesy, ale działa tylko razem z innymi: polityką ciągłości (Zasady, polityki i struktury ramowe), aktualnym planem awaryjnym (Informacja), stanowiskiem zapasowym (Usługi, infrastruktura i aplikacje) i przećwiczonym zespołem (Ludzie, umiejętności i kompetencje).","egz":"Pułapka terminologiczna nr 1 obok Ład/Nadzór. Liczba kategorii: 7. Liczba zasad: 5. Liczba procesów: 37. Egzamin: „Aktywator”. Podręcznik: „Czynnik umożliwiający”. EN: Enabler. W pytaniach egzaminacyjnych prawie zawsze pada „Aktywator”. Nie myl z: Czynnik wpływający na potrzeby interesariuszy – Wyznacznik zmienia potrzeby; aktywator pomaga je zaspokoić.; Komponent (COBIT 2019) – W COBIT 2019 aktywatory nazwano „komponentami systemu ładu”. Na egzaminie COBIT 5 używaj „aktywator”.","src":"COBIT 5 Framework (PL), s. 14, 91"},"organ-ladu":{"t":"Organ Ładu i nadzoru","eg":"Organ Ładu i nadzoru","pd":"Organ nadzorujący","en":"Governing body","wyj":"Szef albo grupa na samej górze, np. zarząd, rada nadzorcza czy dyrektor urzędu, którzy decydują o kierunku.\n\nNa Ilustracji 9 właściciele i interesariusze delegują (delegate) uprawnienia organowi Ładu (governing body), a ten jest przed nimi rozliczany (accountable). Organ Ładu wyznacza kierunek (set direction) kierownictwu (management). Kierownictwo instruuje i dopasowuje (instruct and align) role operacyjne, które raportują (report) do kierownictwa (FW-PL s. 24, Il. 9). Strzałka monitorowania (monitor) łączy kierownictwo z organem Ładu; według uzasadnień egzaminacyjnych to kierownictwo odpowiada wykonawczo za monitorowanie. Sam organ Ładu też monitoruje, ale wyniki względem kierunku, który wyznaczył (EDM).\n\nŻeby było jasne, kto w imieniu właścicieli i interesariuszy sprawuje Ład: wyznacza kierunek kierownictwu i odpowiada za wyniki.","zycie":"Właściciele mieszkań na zebraniu wspólnoty wybierają zarząd i powierzają mu dbanie o budynek. Zarząd wyznacza kierunek – w tym roku dach – i każe administratorowi to załatwić, a administrator raportuje postępy. Na następnym zebraniu zarząd rozlicza się przed właścicielami: to on jest organem Ładu.","firma":"Właściciele rodzinnej sieci piekarni powołują radę, która raz na kwartał ustala, dokąd firma zmierza: otwieramy dwa nowe punkty, nie wchodzimy w catering. Dyrektor zarządzający dostaje ten kierunek i sam układa plan, a rada sprawdza wyniki i odpowiada przed właścicielami. Ta rada to organ Ładu.","urzad":"Mieszkańcy w wyborach powierzają radzie gminy pilnowanie spraw gminy. Rada uchwala strategię i budżet, wyznacza kierunek wójtowi i urzędowi, a potem rozlicza ich z wykonania; sama odpowiada przed mieszkańcami przy kolejnych wyborach. W tej scenie rada gminy pełni rolę organu Ładu.","it":"Zarząd jako organ Ładu w EDM01 (Zapewnienie i utrzymanie ładu korporacyjnego) ustala zasady podejmowania decyzji o IT, a w EDM05 (Zapewnienie przejrzystości dotyczącej interesariuszy) raportuje udziałowcom i regulatorom, jak IT realizuje cele. Plany i kierowanie pracą zespołów zostawia kierownictwu IT (APO, BAI, DSS, MEA).","egz":"Według uzasadnień egzaminacyjnych organ Ładu i nadzoru jest odpowiedzialny decyzyjnie (rozliczany) i wyznacza kierunek. Za monitorowanie osiągania celów odpowiada wykonawczo kierownictwo. Egzamin: „Organ Ładu i nadzoru”. Podręcznik: „Organ nadzorujący”. Nie myl z: Kierownictwo (management) – Kierownictwo realizuje kierunek, instruuje i dopasowuje role operacyjne i odpowiada wykonawczo za monitorowanie osiągania celów; organ Ładu wyznacza kierunek i jest rozliczany przed interesariuszami.","src":"COBIT 5 Framework (PL), s. 24"},"wskaznik-opozniony":{"t":"Wskaźnik opóźniony","eg":"Wskaźnik opóźniony","pd":"Wskaźnik następujący","en":"Lag indicator","wyj":"Liczba, którą widać dopiero po fakcie i która mówi, czy cel się udał, np. wynik sprawdzianu.\n\nZarządzanie wydajnością aktywatora (enabler performance management) zadaje cztery pytania. Dwa pierwsze dotyczą wyniku: czy potrzeby interesariuszy są uwzględnione i czy cele aktywatora są osiągane. Mierniki, które na nie odpowiadają, to wskaźniki opóźnione (lag indicators). Pokazują to, co już się stało, więc służą do rozliczenia i wniosków na przyszłość.\n\nŻeby po fakcie sprawdzić, czy aktywator dał to, co miał dać: czy cele osiągnięto i czy potrzeby interesariuszy są uwzględnione.","zycie":"Miesiąc temu zacząłeś dietę. Dziś stajesz na wadze i widzisz minus 3 kg. Waga nie powie Ci, co robić jutro, tylko pokazuje, co już się stało – to wskaźnik opóźniony.","firma":"Właścicielka sklepu internetowego na koniec kwartału otwiera raport: przychód wzrósł o 10%. Na ten wynik nic już nie poradzi, może tylko wyciągnąć wnioski na następny kwartał – to wskaźnik opóźniony.","urzad":"W styczniu kierownik wydziału komunikacji w starostwie liczy, ile rejestracji pojazdów załatwiono w zeszłym roku w terminie. Wynik pokazuje, czy ubiegłoroczny cel osiągnięto, ale niczego w tamtym roku już nie zmieni – to wskaźnik opóźniony.","it":"W DSS02 (Zarządzanie zgłoszeniami serwisowymi i incydentami) odsetek incydentów rozwiązanych za kwartał w uzgodnionym czasie to wskaźnik opóźniony: mówi, czy cel osiągnięto. Taki wynik raportuje się m.in. w MEA01 (Monitorowanie, ocena i oszacowanie wydajności i zgodności).","egz":"Pytania o osiągnięcie celów i uwzględnienie potrzeb → wskaźniki opóźnione. Egzamin: „Wskaźniki opóźnione”. Podręcznik: „Wskaźniki następujące”. Nie myl z: Wskaźnik wiodący – Wiodący mierzy, czy aktywator działa właściwie: cykl życia i dobre praktyki. Przewiduje wynik.","src":"COBIT 5 Framework (PL), s. 29"},"cele-organizacji":{"t":"Cele organizacji","eg":"Cele organizacji","pd":"Cele przedsiębiorstwa","en":"Enterprise goals","wyj":"Siedemnaście typowych celów, które ma każda firma czy urząd, np. zadowoleni klienci, zgodność z przepisami.\n\nTo drugi krok kaskady celów: potrzeby interesariuszy (stakeholder needs) przekłada się na cele organizacji (enterprise goals). COBIT 5 podaje 17 typowych celów w 4 wymiarach BSC: finanse, klient, obszar wewnętrzny, szkolenie i rozwój. Ilustracja 5 pokazuje, z którymi składnikami Celu Ładu (realizacja korzyści, optymalizacja ryzyka, optymalizacja zasobów) cel ma relację podstawową (P) lub wspierającą (S).\n\nŻeby potrzeby interesariuszy zamienić w konkretne cele całej organizacji, z których dopiero wynikają cele dla IT. Bez tego IT nie wie, czemu ma służyć.","zycie":"Na początku roku rodzina ustala, na czym jej najbardziej zależy: odłożyć na wkład własny, żeby dzieci dobrze zaczęły nową szkołę i żeby wszyscy byli zdrowi. Nikt jeszcze nie mówi o laptopach czy internecie. To cele „całego domu” – odpowiednik celów organizacji.","firma":"Właścicielka piekarni mówi: w tym roku chcę, żeby klienci wracali, żeby sanepid nie miał uwag i żeby firma była na plusie. To cele całej piekarni, a dopiero z nich wyniknie, czego potrzeba od kasy fiskalnej czy sklepu online. Tak wyglądają cele organizacji.","urzad":"Wójt na sesji rady gminy zapowiada: decyzje wydawane w terminie, sprawy do załatwienia przez internet i jawne wydatki. Te zamierzenia dotyczą całego urzędu, nie działu informatyki. To cele organizacji, od których zaczyna się kaskada.","it":"Cel organizacji 7 „Ciągłość i dostępność usług biznesowych” (wymiar Klient) w kaskadzie prowadzi m.in. do celu związanego z IT 07 „Dostarczanie usług IT zgodnie z wymogami biznesowymi”, a dalej m.in. do procesu DSS04 Zarządzanie ciągłością.","egz":"Potrzeby interesariuszy → Cele organizacji (krok 2). 17 celów, 4 wymiary BSC, relacje P/S. Nie musisz znać wszystkich 17 na pamięć – rozpoznawaj wymiary i logikę P/S. Egzamin: „Cele organizacji”. Podręcznik: „Cele przedsiębiorstwa”. Słownik podręcznika odsyła do „Cel biznesowy”. Nie myl z: Cele związane z informatyką – Cele organizacji dotyczą całej działalności; cele związane z informatyką opisują, co musi zapewnić IT, aby te cele wspierać.","src":"COBIT 5 Framework (PL), s. 19, 91"},"cobit-2019":{"t":"COBIT 2019","eg":"COBIT 2019","pd":"—","en":"COBIT 2019","wyj":"Nowsza wersja COBIT z innymi nazwami; nie myl jej z COBIT 5, z którego jest egzamin.\n\nCOBIT 2019 zastępuje aktywatory komponentami systemu ładu (components), zamiast 37 procesów ma 40 celów Ładu i Zarządzania (governance and management objectives) i dodaje czynniki projektowe (design factors). Nowe cele to m.in. APO14 (dane), BAI11 (projekty) i MEA04 (zapewnienie). Gdy w odpowiedzi pada „komponent”, „40 celów” albo „czynnik projektowy”, odpowiedź nie dotyczy COBIT 5.\n\nTo hasło ostrzegawcze: pomaga rozpoznać pojęcia z nowszej wersji, które na egzaminie COBIT 5 Foundation są błędnymi odpowiedziami.","zycie":"Kupujesz używany samochód i dostajesz instrukcję do nowszego modelu. Przyciski są podobne, ale część nazw i funkcji się różni, więc instrukcja myli zamiast pomagać. Tak działa nauka do egzaminu COBIT 5 z materiałów o COBIT 2019.","firma":"Bank zatrudnia konsultanta do przygotowania pracowników do egzaminu COBIT 5 Foundation. Konsultant uczy z najnowszych materiałów i mówi o „celach Ładu i Zarządzania” zamiast o 37 procesach. Na egzaminie część osób wybiera odpowiedzi w języku COBIT 2019 i traci punkty, choć znała temat.","urzad":"Urząd marszałkowski zamawia audyt informatyki oparty na COBIT 5. Audytor przysyła raport pełen „komponentów”, „40 celów Ładu i Zarządzania” i „czynników projektowych”. Kierowniczka wydziału informatyki odsyła raport do poprawy, bo to słownictwo COBIT 2019, a nie wersji z zamówienia.","it":"W COBIT 5 zarządzanie ryzykiem to proces APO12 Zarządzanie ryzykiem, a w COBIT 2019 to cel zarządczy APO12 Managed Risk. Na egzaminie COBIT 5 poprawne jest słowo „proces”, a nie „cel zarządczy” (management objective).","egz":"Jeśli odpowiedź mówi o „40 celach”, „komponentach systemu ładu” albo „czynnikach projektowych”, to jest COBIT 2019, a więc zła odpowiedź. Materiały o COBIT 2019 są w internecie częstsze niż o COBIT 5. Nie ucz się z nich: inne pojęcia (40 celów, „komponenty”, czynniki projektowe) dają złe odpowiedzi na egzaminie COBIT 5. Nie myl z: COBIT 5 – COBIT 5: 5 zasad, 7 aktywatorów, 37 procesów.","src":"materiały kursu"},"cele-zwiazane-z-it":{"t":"Cele związane z informatyką","eg":"Cele związane z informatyką","pd":"Cele związane z IT","en":"IT-related goals","wyj":"Siedemnaście typowych celów dla informatyki, np. systemy działają, dane są bezpieczne, projekty kończą się na czas.\n\nTo trzeci krok kaskady celów: cele organizacji przekłada się na cele związane z IT (IT-related goals), czyli rezultaty związane z IT. COBIT 5 podaje ich 17 w wymiarach IT BSC; mapowanie na cele organizacji jest w Załączniku B, a na procesy w Załączniku C. „Związane z IT” oznacza informację i powiązaną technologię w całej organizacji, a nie tylko dział IT.\n\nŻeby wiedzieć, co informacja i technologia muszą zapewnić, aby udały się cele organizacji. Dzięki temu IT nie wyznacza sobie celów w oderwaniu od reszty organizacji.","zycie":"Rodzina chce bezpiecznie odkładać pieniądze. Żeby się udało, w domu musi działać bankowość w telefonie, hasła muszą być w menedżerze haseł, a skany umów mieć kopię zapasową. Te wymagania wobec domowej technologii to cele związane z IT.","firma":"Sklep internetowy chce zadowolonych klientów. Z tego wynika, że strona ma działać także w Black Friday, płatności mają przechodzić bez błędów, a adresy klientów nie mogą wyciec (cele IT 07 i 10). To cele związane z IT – to, co technologia musi dać, żeby udał się cel sklepu.","urzad":"Gmina chce, żeby mieszkańcy załatwiali sprawy przez internet. Do tego e-usługi muszą działać, dane osobowe muszą być chronione, a rejestry aktualne. To nie są cele informatyka dla niego samego, tylko cele związane z IT, które wynikają z celu gminy.","it":"Cel związany z IT 10 „Bezpieczeństwo informacji, infrastruktury przetwarzania i aplikacji” (wymiar Obszar wewnętrzny) to rezultat, który w banku muszą zapewnić m.in. procesy APO13 Zarządzanie bezpieczeństwem i DSS05 Zarządzanie usługami bezpieczeństwa.","egz":"Opis „rezultaty związane z IT, wymagane do osiągnięcia celów organizacji” to Cele związane z informatyką (s. 18). Egzamin: „Cele związane z informatyką”. Podręcznik: „Cele związane z IT”. Nie myl z: Cele organizacji – Krok wcześniej: cele organizacji dotyczą całej działalności.; Cele aktywatora – Krok później: cele konkretnych aktywatorów (np. procesów), które pozwalają osiągnąć cele związane z informatyką.","src":"COBIT 5 Framework (PL), s. 18, 19"}},"S":[{"pt":"Lekcje 10.10–10.12","h":"Zanim odczytasz literę z tabeli, ustal, co to za tabela","b":"<ol><li>Rodzaj: macierz P/S, skala, role, cykl?<\/li><li>Kierunek czytania.<\/li><li>Katalog: cel organizacji 7 ≠ cel IT 07.<\/li><li>System liter.<\/li><li>Czy trzeba dostosować?<\/li><\/ol><p>Rysunek (egzamin) = Ilustracja (podręcznik).<\/p>","c":"Tabele kaskady są wytyczną: litera P podpowiada, a nie nakazuje.","s":"COBIT 5 Framework (PL), s. 18–21, 45, 50, 52","ctx":"<p><w k=\"cele-organizacji\">Cele organizacji<\/w> i <w k=\"cele-zwiazane-z-it\">cele związane z IT<\/w> mają osobne katalogi po 17 pozycji: 7 to „Ciągłość i dostępność usług biznesowych”, 07 – „Dostarczanie usług IT zgodnie z wymogami biznesowymi” (s. 19). Rysunek 22 (s. 50) prowadzi od celów organizacji do celów IT, Rysunek 23 (s. 52) – od celów IT do procesów.<\/p><p>Tabela kaskady „nie zawiera uniwersalnej prawdy” (s. 20): priorytety są różne i zmienne, tabele nie znają wielkości ani branży, a podział P/S upraszcza ciągłą skalę. W Przykładzie 1 organizacja z siedmiu celów IT z relacją P wybiera cztery (s. 21) – to wzorcowe użycie. Pytanie o „mechaniczne stosowanie” tabel ma odpowiedź przeczącą.<\/p><p>Litera P w trzech tabelach: kaskada – relacja podstawowa (<span class=\"en\">Primary<\/span>); egzamin PL – Pełny; podręcznik PL – częściowo (<span class=\"en\">Partially<\/span>, egzaminacyjne C). Profil PA 1.1 = W, 2.1 = P, 2.2 = P to poziom 1 – czytasz od dołu.<\/p>"},{"pt":"Sprawdź się","quiz":{"tresc":"Pytanie egzaminacyjne odwołuje się do Rysunku 23. Gdzie znajdziesz tę treść w polskim podręczniku COBIT 5?","opcje":[{"t":"Na Ilustracji 23 – cele związane z IT na procesy","ok":true,"w":"Dobrze. Egzamin mówi „Rysunek”, podręcznik – „Ilustracja”, a numer jest ten sam. Ilustracja 23 mapuje cele związane z IT na procesy."},{"t":"Na Rysunku 23 – podręcznik używa tej samej nazwy","w":"Podręcznik PL używa słowa „Ilustracja”, a nie „Rysunek”."},{"t":"W Załączniku D – potrzeby interesariuszy a cele organizacji","w":"Załącznik D dotyczy innego szczebla kaskady."},{"t":"Na Ilustracji 23 – cele organizacji na cele związane z IT","w":"To opis Ilustracji 22. Ilustracja 23 idzie krok dalej, do procesów."}],"src":"COBIT 5 Framework (PL), s. 52","pomoc":{"t":"Pytanie dotyczy lekcji 10.10 „Etap F1 – jak czytać tabele i rysunki podręcznika”. Cel lekcji: Potrafię zadać tabeli z podręcznika COBIT 5 pięć pytań, zanim odczytam z niej literę albo numer.","k":[]}}},{"pt":"Sprawdź się","quiz":{"tresc":"W Przykładzie 1 podręcznika organizacja dostaje z tabeli siedem celów związanych z informatyką z relacją P i wybiera cztery. Jak ocenić tę decyzję?","opcje":[{"t":"Jest błędna – relacja P (Primary) oznacza cel obowiązkowy","w":"P to relacja podstawowa, czyli silniejsze powiązanie, a nie obowiązek."},{"t":"Jest właściwa – tabelę kaskady się dostosowuje","ok":true,"w":"Dobrze. Podręcznik pokazuje wybór czterech z siedmiu jako wzorcowe użycie kaskady."},{"t":"Jest dopuszczalna tylko, gdy pominięte cele mają relację S","w":"Wszystkie siedem miało relację P, a wybór i tak był właściwy."},{"t":"Jest błędna – P oznacza ocenę Pełny, więc cele są już osiągnięte","w":"To litera P ze skali ocen egzaminu PL, a nie z macierzy kaskady."}],"src":"COBIT 5 Framework (PL), s. 21","pomoc":{"t":"Pytanie dotyczy lekcji 10.11 „Tabele kaskady celów są wytyczną, a nie przepisem”. Cel lekcji: Potrafię wyjaśnić, dlaczego organizacja nie musi przyjąć wszystkich celów, które tabela kaskady oznacza literą P.","k":[]}}},{"pt":"Sprawdź się","quiz":{"tresc":"Raport przygotowany według skali z podręcznika PL (litery angielskie) podaje dla PA 2.2 literę P. Co ta ocena oznacza w skali egzaminu PL?","opcje":[{"t":"W – Większościowy","w":"W odpowiada angielskiemu L, a nie P."},{"t":"Relację podstawową z macierzy kaskady celów","w":"To trzecie znaczenie litery P, z innej tabeli."},{"t":"C – Częściowy","ok":true,"w":"Dobrze. W skali N/P/L/F litera P to „częściowo osiągnięto”, czyli egzaminacyjne C."},{"t":"P – Pełny","w":"To przepisanie litery bez zmiany znaczenia. Pełny to w skali angielskiej F."}],"src":"COBIT 5 Framework (PL), s. 45","pomoc":{"t":"Pytanie dotyczy lekcji 10.12 „Profil ocen czytaj od dołu – i litera P w trzech tabelach”. Cel lekcji: Potrafię ustalić poziom zdolności z profilu ocen, czytając go od dołu, i rozpoznać trzy znaczenia litery P.","k":[]}}},{"pt":"Lekcje 10.13–10.14","h":"Obce pytanie: przetłumacz, sprawdź model, rozstrzygnij podręcznikiem","b":"<ol><li>Nazwy na egzaminacyjne (Enabler → <w k=\"aktywator\">Aktywator<\/w>).<\/li><li>Słowa z <w k=\"cobit-2019\">COBIT 2019<\/w> odrzucasz.<\/li><li>Klucz ze strony sprawdzasz w podręczniku.<\/li><li>Czy to prawda i ta sama szuflada?<\/li><\/ol>","c":"Z internetu bierzesz pomysł na sytuację, nigdy rozstrzygnięcie.","s":"COBIT 5 Framework (PL), s. 14, 29, 33","ctx":"<p><w k=\"cobit-2019\">COBIT 2019<\/w> to inny model (wiedza ogólna): komponenty, 40 celów Ładu i Zarządzania, czynniki projektowe, obszary koncentracji. COBIT 5 ma siedem kategorii aktywatorów i 37 procesów. W pytaniu „która jest kategorią aktywatorów?” trzy fachowo brzmiące opcje z COBIT 2019 to dystraktory – zostają „Procesy”. „Dumpy”, czyli rzekome pytania z egzaminu, mają złe klucze, łamią poufność i uczą liter zamiast uzasadnień.<\/p><p>Jeden termin <span class=\"en\">Governance<\/span> to „ład informatyczny” w artykułach, „nadzór” w podręczniku i Ład na egzaminie; „przedsiębiorstwo” to zawsze Organizacja, także urząd czy szpital. Rozstrzyga definicja, nie brzmienie: odsetek pracowników banku przeszkolonych z bezpieczeństwa, liczony raz w roku, mierzy stosowanie praktyki, więc jest <w k=\"wskaznik-wiodacy\">wskaźnikiem wiodącym<\/w>; liczba udanych ataków phishingowych mierzy osiągnięcie celu – <w k=\"wskaznik-opozniony\">opóźniony<\/w> (s. 29).<\/p>"},{"pt":"Sprawdź się","quiz":{"tresc":"Artykuł branżowy o bankowości pisze o „ładzie informatycznym”. Jakiej nazwy użyjesz, rozwiązując pytanie egzaminu COBIT 5 PL?","opcje":[{"t":"Zarządzanie IT – bo artykuł dotyczy informatyki","w":"Zarządzanie (Management) to inna dziedzina niż Ład."},{"t":"Ład informatyczny – to osobne pojęcie COBIT 5","w":"To nazwa z artykułów branżowych, a nie osobny termin COBIT 5."},{"t":"Nadzór – bo tak pisze polski podręcznik","w":"To nazwa podręcznikowa. Na egzaminie PL szukaj słowa „Ład”."},{"t":"Ład (Governance)","ok":true,"w":"Dobrze. „Ład informatyczny”, „nadzór” i „Ład” to jeden termin Governance; egzamin PL mówi „Ład”."}],"src":"materiały Altkom; COBIT 5 Framework (PL), s. 14","pomoc":{"t":"Pytanie dotyczy lekcji 10.13 „Etap F2 – cztery kroki dla pytania z obcego źródła”. Cel lekcji: Potrafię przełożyć pytanie z obcego źródła na nazwy egzaminacyjne i rozstrzygnąć je definicją z podręcznika.","k":[]}}},{"pt":"Sprawdź się","quiz":{"tresc":"Która z poniższych jest jedną z siedmiu kategorii aktywatorów COBIT 5?","opcje":[{"t":"Informacja","ok":true,"w":"Dobrze. Informacja to jedna z siedmiu kategorii aktywatorów (czynników umożliwiających)."},{"t":"Obszary koncentracji systemu ładu","w":"To również pojęcie z COBIT 2019."},{"t":"Cele Ładu i Zarządzania","w":"40 celów Ładu i Zarządzania to COBIT 2019, a nie kategoria aktywatora."},{"t":"Czynniki projektowe systemu ładu","w":"To pojęcie z COBIT 2019."}],"src":"COBIT 5 Framework (PL), s. 14","pomoc":{"t":"Pytanie dotyczy lekcji 10.14 „COBIT 2019 i „dumpy” – źródła, które prowadzą do złej odpowiedzi”. Cel lekcji: Potrafię rozpoznać pojęcia z COBIT 2019 w pytaniu z internetu i zamienić je na odpowiedniki z COBIT 5.","k":[]}}},{"pt":"Lekcje 10.15–10.17","h":"Pytanie przekrojowe: rozłóż scenariusz, znajdź regułę, która decyduje","b":"<ol><li>Przy każdym zdaniu zapisz obszar: PR, EN, IM, PC.<\/li><li>Ostatnie zdanie mówi, o co pytają.<\/li><li>Przy „prawie” wypisz elementy definicji.<\/li><li>Opcja: prawdziwa i z tej samej kategorii?<\/li><li>Litery skali: ustal język tabeli.<\/li><\/ol>","c":"Pytanie mistrzowskie nie wymaga nowej wiedzy, tylko porządku w tej, którą masz.","s":"COBIT 5 Framework (PL), s. 14, 24, 32, 38","ctx":"<p>Rodzaje pytań mistrzowskich: przekrojowe, przypadek graniczny, trzy nazwy, „prawie spełnia definicję”, wstecz po kaskadzie, reguły oceny. Egzamin mistrzowski kursu (metodyka, nie wymóg egzaminu): 50 pytań w proporcjach PR 15, EN 21, IM 7, PC 7, 40 minut; „Skrajnie biegły” to co najmniej 40/50 dwa razy z rzędu i każdy obszar co najmniej 70%.<\/p><p>Przykład: sklep internetowy co roku pada w święta (<w k=\"punkty-zapalne\">punkt zapalny<\/w>), a zapowiedziano audyt (zdarzenie wyzwalające) – oba rozpoznajesz w fazie 1. W fazie 2 zakres wyznacza mapowanie celów organizacji na cele IT (np. ciągłość → DSS04, BAI04), a nie „wszystkie 37 procesów”. Stan PA 1.1 = P, 2.1 = W, 2.2 = C i cel „poziom 2” dają lukę tylko w PA 2.2 (z C do co najmniej W). Luka to nie średnia ani „wszystko do P”.<\/p><p>Kto monitoruje? Pytanie o czynności Ładu (EDM) – Ład, względem kierunku (s. 14, 32); pytanie o role z Rysunku 9 – kierownictwo i bieżące wykonanie (s. 24). Czasownik jest w obu, więc szukaj słów „Rysunek 9” albo „role”. <span class=\"en\">Governing body<\/span> to na egzaminie <w k=\"organ-ladu\">Organ Ładu i nadzoru<\/w>.<\/p>"},{"pt":"Sprawdź się","quiz":{"tresc":"Pytanie podaje nazwę z podręcznika PL, nazwę z egzaminu PL i termin angielski, a pyta, która trójka opisuje to samo pojęcie. Jaki to rodzaj pytania mistrzowskiego?","opcje":[{"t":"Wstecz po kaskadzie","w":"Ten rodzaj każe iść od procesu do celu organizacji."},{"t":"Trzy nazwy","ok":true,"w":"Dobrze. Pytanie o trzy nazwy sprawdza egzamin PL, podręcznik PL i angielski termin."},{"t":"Prawie spełnia definicję","w":"Ten rodzaj ukrywa brak jednego elementu definicji."},{"t":"Reguły oceny zdolności","w":"Ten rodzaj dotyczy profilu liter N/C/W/P."}],"src":"materiały Altkom","pomoc":{"t":"Pytanie dotyczy lekcji 10.15 „Etap F3 – pytanie przekrojowe i egzamin mistrzowski”. Cel lekcji: Potrafię rozpoznać rodzaj pytania mistrzowskiego i rozłożyć scenariusz na obszary COBIT 5, zanim sprawdzę opcje.","k":[]}}},{"pt":"Sprawdź się","quiz":{"tresc":"Stan obecny procesu: PA 1.1 = P, PA 2.1 = W, PA 2.2 = C. W fazie 3 organizacja wyznacza cel: poziom 2. Jaką lukę trzeba zamknąć?","opcje":[{"t":"Podnieść PA 2.1 i PA 2.2 do oceny P","w":"P jest wymagane na niższych poziomach, a nie na ocenianym."},{"t":"Żadnej – średnia ocen poziomu 2 daje ocenę W","w":"Model nie liczy średniej; każdy atrybut sprawdza się osobno."},{"t":"Podnieść PA 2.2 co najmniej do W","ok":true,"w":"Dobrze. PA 1.1 = P i PA 2.1 = W już spełniają regułę poziomu 2. Brakuje tylko PA 2.2."},{"t":"Najpierw podnieść PA 1.1, bo poziom 1 jest niepotwierdzony","w":"PA 1.1 ma P, więc poziom 1 jest potwierdzony."}],"src":"COBIT 5 Framework (PL), s. 38; COBIT 5 Framework (PL), s. 42","pomoc":{"t":"Pytanie dotyczy lekcji 10.16 „Pytanie przekrojowe – wdrożenie, kaskada celów i luka zdolności”. Cel lekcji: Potrafię połączyć fazy 1–3 wdrożenia z kaskadą celów i obliczyć lukę zdolności atrybut po atrybucie.","k":[]}}},{"pt":"Sprawdź się","quiz":{"tresc":"Bank co kwartał sprawdza, czy osiąga cele organizacji. Kto według Rysunku 9 i uzasadnień egzaminu PL odpowiada wykonawczo za to monitorowanie?","opcje":[{"t":"Role operacyjne (eksploatacja i wykonanie)","w":"Role operacyjne wykonują pracę i raportują do kierownictwa. Za monitorowanie osiągania celów nie odpowiadają."},{"t":"Właściciele i interesariusze","w":"Oni delegują uprawnienia organowi Ładu i rozliczają go. Nie monitorują na bieżąco osiągania celów."},{"t":"Organ Ładu","w":"Organ Ładu jest na Rysunku 9 rolą rozliczaną wobec interesariuszy i wyznacza kierunek; odpowiedzialność wykonawczą za monitorowanie osiągania celów egzamin PL przypisuje Kierownictwu."},{"t":"Kierownictwo (Zarządzanie)","ok":true,"w":"Dobrze. Na Rysunku 9 relacja „Monitorowanie” łączy kierownictwo z organem Ładu, a egzamin PL przypisuje kierownictwu odpowiedzialność wykonawczą za monitorowanie osiągania celów."}],"src":"COBIT 5 Framework (PL), s. 24","pomoc":{"t":"Pytanie dotyczy lekcji 10.17 „Przypadek graniczny – kto monitoruje: Ład czy kierownictwo?”. Cel lekcji: Potrafię rozstrzygnąć, kto monitoruje, na podstawie kategorii pytania: czynności Ładu czy role z Rysunku 9.","k":[]}}}]};</script>
