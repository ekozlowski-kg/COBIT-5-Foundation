<script>window.DECK={"id":"k-mt-lad-kaskada","rozdzial":"Poza podręcznikiem · Mentor i finał","tytul":"Mentor: Ład i kaskada celów","prev":"k-ex-powtorka.html","next":"k-mt-aktywatory.html","T":{"potrzeba":{"t":"Potrzeba interesariusza","eg":"Potrzeba interesariusza","pd":"Potrzeba interesariusza","en":"Stakeholder need","wyj":"Czego ktoś naprawdę chce albo potrzebuje od tego, co robimy.\n\nInteresariusze (stakeholders) mają potrzeby (stakeholder needs), które zmieniają się pod wpływem wyznaczników (drivers), np. nowych przepisów albo technologii. Ład ocenia i równoważy te często sprzeczne potrzeby w kategoriach realizacji korzyści, optymalizacji ryzyka i optymalizacji zasobów. Kaskada celów przekłada je potem na cele organizacji, cele związane z IT i cele aktywatorów.\n\nŻeby wszystko, co robi organizacja i jej informatyka, wynikało z tego, czego naprawdę potrzebują interesariusze, a nie z gotowych pomysłów na rozwiązania.","zycie":"Mama mówi: „Kupmy nowy telefon, ten jest do niczego”. Przy kolacji okazuje się, że telefon pada o 15:00, a ona czeka wtedy na telefony ze szkoły. Potrzeba to bateria na cały dzień, a nie nowy model – wystarczy wymiana baterii za 150 zł.","firma":"Klientka cukierni prosi o „aplikację do zamawiania”. Właściciel dopytuje i słyszy, że chodzi o pewność, że tort urodzinowy będzie gotowy na sobotę na 14:00. Tę potrzebę spełnia zwykły formularz z potwierdzeniem SMS-em – aplikacja była tylko jej pomysłem na rozwiązanie.","urzad":"Kierownik wydziału architektury w starostwie żąda „nowego systemu”. Na spotkaniu wychodzi, że pozwolenia czekają 30 dni, a powinny najwyżej 14, bo teczki krążą między pokojami. Potrzeba to krótszy czas obsługi wniosku – nowy system to tylko jeden ze sposobów.","it":"Zarząd potrzebuje pewności, że organizacja przestrzega przepisów o ochronie danych. W kaskadzie celów ta potrzeba staje się celem organizacji „zgodność z zewnętrznymi przepisami”, potem celami związanymi z IT, a w procesach trafia m.in. do MEA03 (Monitorowanie, ocena i oszacowanie zgodności z wymogami zewnętrznymi).","egz":"W kaskadzie: wyznaczniki → potrzeby interesariuszy → cele organizacji (Ilustracja 4). Nie myl z: Oczekiwanie – Oczekiwanie to proponowany sposób; potrzeba to cel, który za nim stoi. COBIT zaczyna od potrzeb, nie od gotowych rozwiązań.; Czynnik wpływający na potrzeby interesariuszy – Wyznacznik (driver) to przyczyna zmiany potrzeby (np. nowa ustawa), a nie sama potrzeba.","src":"COBIT 5 Framework (PL), s. 17"},"informacja":{"t":"Informacja","eg":"Informacja","pd":"Informacje","en":"Information (enabler 5)","wyj":"Wszystko, co wiemy i zapisujemy, od numeru telefonu po raport, i co komuś do czegoś służy.\n\nInformacja (Information) to piąty z 7 aktywatorów i obejmuje wszystkie informacje w organizacji, nie tylko te w systemach. Ma interesariuszy w rolach wytwórcy (producer), opiekuna (custodian) i konsumenta (consumer), własny cykl życia i kryteria jakości: wewnętrznej, kontekstowej oraz bezpieczeństwa i dostępności. Opisuje się ją też w 6 warstwach atrybutów, od fizycznej po społeczną.\n\nŻeby organizacja traktowała informację jak zasób, o który trzeba dbać: wytwarzać ją, przechowywać, chronić i udostępniać tym, którzy jej potrzebują.","zycie":"Mama dzwoni, że w czwartek nie odbierze dzieci ze szkoły, na lodówce wisi plan lekcji, a szkoła przysyła SMS o skróconych zajęciach. Żadna z tych wiadomości nie siedzi w komputerze, a mimo to wszystkie są informacją, od której zależy, kto i o której jedzie po dzieci. Jeśli nikt jej nie przeczyta i nie zareaguje, nic z niej nie wynika – to cecha aktywatora Informacja.","firma":"Piekarz zapisuje w zeszycie, ile chleba zostało wieczorem, kasa drukuje raport sprzedaży, a sprzedawczyni mówi, o co pytali klienci. Z tego wszystkiego właścicielka planuje jutrzejszy wypiek. Piekarz informację tworzy, zeszyt i kasa ją przechowują, a właścicielka z niej korzysta – to role wokół aktywatora Informacja.","urzad":"W szkole sekretarka prowadzi rejestr uczniów, wychowawca wpisuje oceny do dziennika, a dyrektor na radzie pedagogicznej słyszy ustnie o kłopotach w klasie 3b. Wszystko to jest informacja, także to, czego nie ma w żadnym systemie. Coś z niej wynika dopiero wtedy, gdy dyrektor na tej podstawie organizuje pomoc dla klasy.","it":"Dane kontaktowe klientów w systemie CRM to aktywator Informacja: klient podaje je przy zakładaniu konta (wytwórca), administrator utrzymuje bazę (opiekun), a konsultant korzysta z niej przy obsłudze (konsument). Nieaktualny numer to błąd jakości informacji, przez który powiadomienie nie dotarło.","egz":"Informacja jest jedną ze zdolności do świadczenia usług, a zdolności te wykorzystuje się poprzez procesy, by świadczyć usługi (s. 86). Procesy wymagają informacji jako wejścia i wytwarzają ją jako wyjście (s. 71). Nie myl z: Dane – Dane to surowe fakty. Informacja to dane przetworzone i mające znaczenie.","src":"COBIT 5 Framework (PL), s. 81; COBIT 5 Framework (PL), s. 86"},"rola-kierownictwo":{"t":"Kierownictwo","eg":"Kierownictwo","pd":"Zarządzanie (podpis roli na Ilustracji 9)","en":"Management","wyj":"Kierownicy, którzy dostają kierunek od szefostwa, rozdzielają pracę ludziom i pilnują, czy organizacja osiąga cele.\n\nKierownictwo dostaje kierunek od organu Ładu. Instruuje i dopasowuje role operacyjne i odbiera ich raporty – między kierownictwem a rolami operacyjnymi są tylko te dwie relacje (FW-PL s. 24, Il. 9). Strzałka monitorowania łączy kierownictwo z organem Ładu; według uzasadnień egzaminacyjnych to kierownictwo odpowiada wykonawczo za monitorowanie. Swoją pracę prowadzi w obszarze Planuj, Twórz, Wykonuj i Monitoruj.\n\nŻeby kierunek od organu Ładu zamienił się w konkretne zadania i żeby ktoś pilnował ich wykonania.","zycie":"Zarząd wspólnoty postanawia: w tym roku remont dachu. Administrator budynku wybiera firmę i ustala jej harmonogram. Firma raportuje administratorowi postępy, a on co miesiąc mówi zarządowi, czy remont idzie zgodnie z planem. Administrator to kierownictwo: instruuje i dopasowuje.","firma":"Rada spółki ustala: otwieramy czwarty sklep bez kredytu. Dyrektor zarządzający układa plan, rozdziela zadania kierownikom i co tydzień patrzy na raporty sprzedaży. To kierownictwo z Ilustracji 9.","urzad":"Rada gminy uchwala strategię e-usług. Sekretarz gminy rozdziela zadania wydziałom, dopasowuje grafik informatyków i co miesiąc zdaje radzie gminy relację z postępów. Sekretarz działa jako kierownictwo.","it":"Kierownictwo IT mierzy, czy IT osiąga cele, m.in. w procesie MEA01 (Monitorowanie, ocena i oszacowanie wydajności i zgodności) z domeny MEA, i raportuje wyniki organowi Ładu.","egz":"„Kto instruuje i dopasowuje role operacyjne?” → Kierownictwo. Kto odpowiada wykonawczo za monitorowanie w rolach z Ilustracji 9? Według uzasadnień egzaminacyjnych także Kierownictwo, a nie organ Ładu. Podręcznikowy podpis „Zarządzanie” na Ilustracji 9 to ta sama rola. Na Ilustracji 9 podręcznik podpisuje tę rolę „Zarządzanie”, a egzamin mówi „Kierownictwo” (tę formę podręcznik ma też w nagłówku na s. 31). W uzasadnieniach egzaminacyjnych to kierownictwo odpowiada wykonawczo za monitorowanie, a nie organ Ładu. Nie myl z: Organ Ładu i nadzoru – Organ Ładu wyznacza kierunek i jest rozliczany przed interesariuszami. Kierownictwo realizuje kierunek, instruuje i dopasowuje role operacyjne i odpowiada wykonawczo za monitorowanie osiągania celów.; Zarządzanie – Zarządzanie to obszar działań (PBRM, 32 procesy). Kierownictwo to rola z Ilustracji 9, czyli ludzie, którzy te działania prowadzą.; Oszacuj, Kieruj i Monitoruj (EDM) – „Monitoruj” w EDM to praktyka procesów Ładu: Ład monitoruje sprawność i zgodność względem kierunku (s. 14). W pytaniu o role z Ilustracji 9 egzamin wiąże monitorowanie z kierownictwem.","src":"COBIT 5 Framework (PL), s. 24, Ilustracja 9; COBIT 5 Framework (PL), s. 31; COBIT 5 Framework (PL), s. 14"},"wyznacznik":{"t":"Czynnik wpływający na potrzeby interesariuszy","eg":"Czynnik wpływający na potrzeby interesariuszy","pd":"Wyznacznik","en":"Driver / Stakeholder drivers","wyj":"Coś, co sprawia, że ludzie zaczynają czegoś potrzebować, np. nowy przepis, awaria albo nowa technologia.\n\nWyznaczniki (stakeholder drivers) to czynniki zewnętrzne i wewnętrzne, np. zmiany strategii, otoczenia biznesowego i regulacyjnego oraz nowe technologie. Wpływają na potrzeby interesariuszy (stakeholder needs). To krok 1 kaskady celów (goals cascade): potem potrzeby przekłada się na cele organizacji, cele związane z IT i cele aktywatorów.\n\nŻeby wiedzieć, skąd biorą się i dlaczego zmieniają się potrzeby interesariuszy, od których zaczyna się kaskada celów.","zycie":"Rodzi się Wam dziecko. Nagle potrzebujecie większego auta, innego budżetu i elastycznych godzin pracy. Samo dziecko nie jest potrzebą – to wyznacznik, który zmienia Wasze potrzeby.","firma":"Wchodzi przepis o kasach fiskalnych online. Właściciel małego sklepu spożywczego musi wymienić kasę i nauczyć sprzedawczynie nowej obsługi. Przepis to wyznacznik, który tworzy w sklepie nową potrzebę.","urzad":"Ustawa o doręczeniach elektronicznych nakłada na urzędy nowy obowiązek. Urząd gminy musi założyć skrzynkę do e-Doręczeń i zmienić pracę kancelarii. Ustawa to zewnętrzny wyznacznik, który zmienia potrzeby urzędu.","it":"Nowa regulacja o cyberbezpieczeństwie to wyznacznik. Zmienia potrzeby interesariuszy, a kaskada celów prowadzi od nich do celów związanych z IT (bezpieczeństwo informacji, zgodność) i do procesów APO13 (Zarządzanie bezpieczeństwem) oraz MEA03 (Monitorowanie, ocena i oszacowanie zgodności z wymogami zewnętrznymi).","egz":"Wyznacznikami są zmiany strategii, otoczenia biznesowego i regulacyjnego oraz nowe technologie (s. 17). Dobre praktyki, jakość kontekstowa i wskaźniki to pojęcia z modelu aktywatora, czyli inna kategoria. Podręcznik używa słowa „wyznacznik”. Na egzaminie pytanie bywa opisowe: „czynnik wpływający na potrzeby interesariuszy”. Nie myl tego słowa „czynnik” z „czynnikiem umożliwiającym” (aktywatorem). Nie myl z: Aktywator – Aktywator (czynnik umożliwiający) POMAGA osiągnąć cele – np. proces czy struktura. Wyznacznik WYWOŁUJE zmianę potrzeb.; Zdarzenie wyzwalające (trigger event) – Pojęcie z wdrożenia (IM): zdarzenie, które uruchamia program usprawnień, np. fuzja. Podobne w duchu, ale inny obszar sylabusa.","src":"COBIT 5 Framework (PL), s. 91; COBIT 5 Framework (PL), s. 17"},"lad":{"t":"Ład","eg":"Ład","pd":"Nadzór","en":"Governance","wyj":"Szefostwo decyduje, po co i co robimy, i pilnuje, czy idziemy w dobrą stronę.\n\nŁad ocenia potrzeby i warianty, wyznacza kierunek i monitoruje wyniki (EDM). Zarządzanie planuje, buduje, prowadzi i monitoruje działania (PBRM) zgodnie z tym kierunkiem. W oryginale COBIT 5 Ład zwykle sprawuje board pod przewodnictwem chairperson, a Zarządzanie executive management pod kierownictwem CEO. Polski podział kompetencji trzeba przypisać według rzeczywistego mandatu; nie wolno automatycznie utożsamiać board z zarządem pod prezesem.\n\nŻeby informatyka robiła to, czego potrzebuje cała organizacja, a nie tylko to, co umieją informatycy.","zycie":"Wspólnota mieszkaniowa na zebraniu rocznym ocenia stan budynku i decyduje: w tym roku najpierw dach, elewacja dopiero za dwa lata, a zarządca co kwartał pokazuje wydatki. Wyboru dekarza i pilnowania ekipy zebranie już nie robi – to robota zarządcy. Ocenić, wyznaczyć kierunek, monitorować: to jest Ład.","firma":"Właścicielka restauracji raz na kwartał siada z wynikami i decyduje: celujemy w rodziny z dziećmi, marża ma wynosić co najmniej 20%, a za trzy miesiące sprawdzamy, czy to działa. Co i jak gotować każdego dnia, ustala już szef kuchni. Ona sprawuje Ład, on zarządza.","urzad":"Rada gminy przyjmuje strategię cyfryzacji: najpierw e-usługi dla mieszkańców, potem nowy system księgowy. Ustala na to budżet i co pół roku każe sobie przedstawić, co zrobiono. Wybór dostawcy i prowadzenie wdrożenia zostawia urzędowi – rada sprawuje Ład, a nie zarządza projektem.","it":"W EDM03 (Zapewnienie optymalizacji ryzyka) zarząd ocenia ryzyko IT, ustala apetyt na ryzyko i monitoruje, czy organizacja go nie przekracza.","egz":"Zapamiętaj czasowniki: Ład = Oszacuj, Kieruj, Monitoruj (EDM); odpowiada zarząd pod przewodnictwem prezesa (EN: chairperson – przewodniczący rady/zarządu, nie CEO). Zarządzanie = Planuj, Twórz, Wykonuj, Monitoruj; odpowiada kierownictwo pod przewodnictwem CEO. Egzamin PL: „Ład”. Podręcznik PL: „Nadzór”. EN: Governance. To jedno i to samo pojęcie. Słowo „nadzór” w pytaniu egzaminacyjnym może też pojawić się w zbitce „ład i nadzór”. Nie myl z: Zarządzanie – Zarządzanie (management) planuje, buduje, uruchamia i monitoruje działania ZGODNIE z kierunkiem wyznaczonym przez Ład.; Nadzór w znaczeniu kontroli / inspekcji – Polskie „nadzór” kojarzy się z kontrolą. W COBIT to coś szerszego: także wyznaczanie kierunku i ustalanie priorytetów.; Ład korporacyjny (enterprise governance) – Ład nad IT w organizacji (GEIT) jest CZĘŚCIĄ ładu korporacyjnego (Zasada 2).","src":"COBIT 5 Framework (EN), sekcja rozdział 6; Key Differences Between Governance and Management"},"zarzadzanie":{"t":"Zarządzanie","eg":"Zarządzanie","pd":"Zarządzanie","en":"Management","wyj":"Kierownicy planują i wykonują pracę w kierunku, który wyznaczyło szefostwo.\n\nKierownictwo pod przewodnictwem CEO planuje, tworzy, wykonuje i monitoruje działania (Plan, Build, Run, Monitor) zgodnie z kierunkiem wskazanym przez Ład. W COBIT 5 to cztery domeny: APO, BAI, DSS i MEA, razem 32 procesy. Wyniki i informacje zwrotne wracają do Ładu, który je ocenia i w razie potrzeby koryguje kierunek.\n\nŻeby kierunek wyznaczony przez Ład zamienić w zaplanowaną, wykonaną i sprawdzoną pracę, która prowadzi do celów organizacji.","zycie":"Rodzina ustaliła: „oszczędzamy na wakacje” (to Ład). Ty robisz plan zakupów, porównujesz ceny, co miesiąc przelewasz 1000 zł na lokatę i sprawdzasz, czy kwota rośnie. Ta codzienna robota to Zarządzanie.","firma":"Właściciel restauracji ustalił, że w weekendy ma być nowe menu. Kierownik zmiany układa grafik, zamawia towar, pilnuje jakości dań i w poniedziałek raportuje właścicielowi, jak poszło. Praca kierownika to Zarządzanie.","urzad":"Wójt zdecydował, że mieszkańcy mają załatwiać sprawy przez internet. Sekretarz gminy i kierownik informatyki planują projekt, wybierają dostawcę, wdrażają e-usługi i co miesiąc raportują wójtowi. Ich praca to Zarządzanie.","it":"W dziale IT szpitala APO09 (Zarządzanie umowami o świadczenie usług) planuje poziomy usług, BAI03 (Zarządzanie identyfikacją i budowaniem rozwiązań) buduje nowy moduł rejestracji, DSS01 (Zarządzanie eksploatacją) utrzymuje go w ruchu, a MEA01 (Monitorowanie, ocena i oszacowanie wydajności i zgodności) mierzy wyniki i raportuje je do Ładu.","egz":"Zarządzanie działa zgodnie z kierunkiem wyznaczonym przez organ Ładu, aby osiągnąć cele organizacji (definicja, s. 31). Nie myl z: Ład – Ład ocenia, kieruje i monitoruje; Zarządzanie planuje, tworzy, wykonuje i monitoruje. Oba „monitorują”, ale Ład monitoruje kierunek i cele, a Zarządzanie – realizację działań.","src":"COBIT 5 Framework (EN), sekcja rozdział 6; Key Differences Between Governance and Management"}},"S":[{"lekcje":["mt-k10-dobra-analogia-ladu","mt-k11-bledne-analogie-ladu"],"pt":"Lekcje MT.10–MT.11","h":"Ład i Zarządzanie różnią się rodzajem pracy, nie piętrem","b":"<p>Trzy testy dobrej analogii:</p><ol><li>inne czynności, a nie wyższy szczebel;</li><li>kierunek w dół, <w k=\"informacja\">informacja</w> w górę;</li><li>obie strony monitorują, ale co innego.</li></ol><p>Pytaj kursanta: co ta osoba <b>teraz</b> robi?</p>","c":"Mentor sprawdza analogię – swoją i kursanta – zanim jej użyje.","s":"COBIT 5 Framework (PL), s. 14, 31","ctx":"<p>Mentor (pojęcie kursu, nie COBIT 5 – egzamin go nie sprawdza) doprowadza do odpowiedzi inną osobę: przewiduje jej pomyłkę i wie, gdzie pęka jej analogia. Dobra analogia: rodzice ustalają cel wakacji i budżet, syn rezerwuje nocleg i co tydzień raportuje.</p><p>„Ład to dyrektor IT” myli stanowisko z czynnością: CIO w komitecie ustalającym apetyt na ryzyko uczestniczy w <w k=\"lad\">Ładzie</w>, a układając harmonogram wdrożeń – w <w k=\"zarzadzanie\">Zarządzaniu</w>; struktury należą do jednej lub drugiej przestrzeni zależnie od składu i zakresu decyzji (s. 31). „Wyższe piętro” gubi inne czasowniki: Ład ocenia, kieruje i monitoruje (czy robimy właściwe rzeczy?), Zarządzanie planuje, buduje, realizuje i monitoruje (czy robimy je dobrze?).</p><p>Polskie nazwy mogą się różnić między przekładami. Porównuj sens i angielski oryginał; poprawny synonim nie staje się błędny przez samą formę tłumaczenia. Kurs nie potwierdza tu aktualnego brzmienia polskiego arkusza operatora. W oryginale COBIT 5 Ład zwykle sprawuje board pod przewodnictwem chairperson, a Zarządzanie executive management pod kierownictwem CEO. Polski podział kompetencji trzeba przypisać według rzeczywistego mandatu; nie wolno automatycznie utożsamiać board z zarządem pod prezesem.</p>"},{"pt":"Sprawdź się","quiz":{"id":"q-fn-w-05","sylabus":["PR-02-01","PR-02-14"],"tresc":"Konsultanci call center chcą prostego systemu, inspektor ochrony danych – bezpiecznego, a księgowa – taniego. Jaka jest rola Ładu wobec tych sprzecznych oczekiwań?","opcje":[{"t":"Negocjować i decydować, biorąc pod uwagę oczekiwania wszystkich stron","ok":true,"w":"Tworzenie wartości polega na osiąganiu korzyści przy optymalizacji ryzyka i kosztu zasobów. Równowagę ustala się wobec potrzeb różnych interesariuszy, także w sektorze publicznym. Wskazana odpowiedź odpowiada właśnie temu elementowi modelu."},{"t":"Zawsze wybierać rozwiązanie najtańsze, bo optymalizuje zasoby","ok":false,"w":"Optymalizacja zasobów to tylko jeden z trzech składników wartości."},{"t":"Wybrać oczekiwania najważniejszego interesariusza i jemu podporządkować resztę","ok":false,"w":"Ład waży interesy wszystkich, a nie jednego."},{"t":"Przekazać decyzję dostawcy systemu jako najlepszemu ekspertowi","ok":false,"w":"To oddanie Ładu stronie zewnętrznej."}],"src":"COBIT 5 Framework (EN), sekcja rozdział 2, rysunek 3; WWW","pomoc":{"t":"Pytanie dotyczy lekcji MT.10 „Mentor i analogia – trzy testy dobrej analogii Ładu”. Cel lekcji: Potrafię sprawdzić analogię Ładu i Zarządzania trzema testami, zanim użyję jej w rozmowie z kursantem.","k":[]},"kurs":"Tworzenie wartości polega na osiąganiu korzyści przy optymalizacji ryzyka i kosztu zasobów. Równowagę ustala się wobec potrzeb różnych interesariuszy, także w sektorze publicznym. Wskazana odpowiedź odpowiada właśnie temu elementowi modelu.","kontekst":""}},{"pt":"Sprawdź się","quiz":{"id":"q-fn-w-05","sylabus":["PR-02-01","PR-02-14"],"tresc":"Konsultanci call center chcą prostego systemu, inspektor ochrony danych – bezpiecznego, a księgowa – taniego. Jaka jest rola Ładu wobec tych sprzecznych oczekiwań?","opcje":[{"t":"Zawsze wybierać rozwiązanie najtańsze, bo optymalizuje zasoby","ok":false,"w":"Optymalizacja zasobów to tylko jeden z trzech składników wartości."},{"t":"Negocjować i decydować, biorąc pod uwagę oczekiwania wszystkich stron","ok":true,"w":"Tworzenie wartości polega na osiąganiu korzyści przy optymalizacji ryzyka i kosztu zasobów. Równowagę ustala się wobec potrzeb różnych interesariuszy, także w sektorze publicznym. Wskazana odpowiedź odpowiada właśnie temu elementowi modelu."},{"t":"Wybrać oczekiwania najważniejszego interesariusza i jemu podporządkować resztę","ok":false,"w":"Ład waży interesy wszystkich, a nie jednego."},{"t":"Przekazać decyzję dostawcy systemu jako najlepszemu ekspertowi","ok":false,"w":"To oddanie Ładu stronie zewnętrznej."}],"src":"COBIT 5 Framework (EN), sekcja rozdział 2, rysunek 3; WWW","pomoc":{"t":"Pytanie dotyczy lekcji MT.11 „Dwie błędne analogie – „Ład to szef IT” i „Ład to wyższe piętro””. Cel lekcji: Potrafię poprawić analogie „Ład to szef IT” i „Ład to wyższe piętro zarządzania”, wskazując, gdzie pękają.","k":[]},"kurs":"Tworzenie wartości polega na osiąganiu korzyści przy optymalizacji ryzyka i kosztu zasobów. Równowagę ustala się wobec potrzeb różnych interesariuszy, także w sektorze publicznym. Wskazana odpowiedź odpowiada właśnie temu elementowi modelu.","kontekst":""}},{"lekcje":["mt-k12-lad-tez-monitoruje"],"pt":"Lekcja MT.12","h":"Ład też monitoruje – kierunek, a nie bieżące wykonanie","b":"<ul><li><b>Ład</b> sprawdza, czy jego kierunek wcielono w życie.</li><li><b>Rysunek 9</b>: relację „Monitorowanie” wykonania ma <w k=\"rola-kierownictwo\">kierownictwo</w>.</li></ul><p>Rozstrzyga kategoria pytania: czynności Ładu czy role z rysunku?</p>","c":"Najpierw uznaj trafną część („rysunek się zgadza”), potem dołóż definicję Ładu.","s":"COBIT 5 Framework (PL), s. 14, 24 (Ilustracja 9), 32","ctx":"<p>Przypis na s. 32 doprecyzowuje monitorowanie w domenie Ładu:</p><blockquote>„monitorowanie oznacza te działania, w ramach których organ nadzorujący sprawdza, w jakim stopniu określony kierunek”</blockquote><p>Przykład z banku: zarząd co kwartał sprawdza, czy ryzyko IT mieści się w przyjętym apetycie – to monitorowanie Ładu; kierownik utrzymania co tydzień mierzy dostępność bankowości internetowej – to monitorowanie kierownictwa. Mentor nie przytakuje („monitoruje tylko kierownictwo”), nie odwraca („na rysunku monitoruje Ład”) i nie ucieka („to bez znaczenia”). Mówi: „Masz rację co do rysunku. A teraz zobacz definicję Ładu”.</p>"},{"pt":"Sprawdź się","quiz":{"id":"q-fn-w-05","sylabus":["PR-02-01","PR-02-14"],"tresc":"Konsultanci call center chcą prostego systemu, inspektor ochrony danych – bezpiecznego, a księgowa – taniego. Jaka jest rola Ładu wobec tych sprzecznych oczekiwań?","opcje":[{"t":"Zawsze wybierać rozwiązanie najtańsze, bo optymalizuje zasoby","ok":false,"w":"Optymalizacja zasobów to tylko jeden z trzech składników wartości."},{"t":"Wybrać oczekiwania najważniejszego interesariusza i jemu podporządkować resztę","ok":false,"w":"Ład waży interesy wszystkich, a nie jednego."},{"t":"Negocjować i decydować, biorąc pod uwagę oczekiwania wszystkich stron","ok":true,"w":"Tworzenie wartości polega na osiąganiu korzyści przy optymalizacji ryzyka i kosztu zasobów. Równowagę ustala się wobec potrzeb różnych interesariuszy, także w sektorze publicznym. Wskazana odpowiedź odpowiada właśnie temu elementowi modelu."},{"t":"Przekazać decyzję dostawcy systemu jako najlepszemu ekspertowi","ok":false,"w":"To oddanie Ładu stronie zewnętrznej."}],"src":"COBIT 5 Framework (EN), sekcja rozdział 2, rysunek 3; WWW","pomoc":{"t":"Pytanie dotyczy lekcji MT.12 „„Ład nic nie monitoruje” – jak poprawić prawdę połowiczną”. Cel lekcji: Potrafię poprawić zdanie „Ład nic nie monitoruje”, uznając trafną część o Rysunku 9 i dokładając definicję Ładu.","k":[]},"kurs":"Tworzenie wartości polega na osiąganiu korzyści przy optymalizacji ryzyka i kosztu zasobów. Równowagę ustala się wobec potrzeb różnych interesariuszy, także w sektorze publicznym. Wskazana odpowiedź odpowiada właśnie temu elementowi modelu.","kontekst":""}},{"lekcje":["mt-k13-kaskada-od-konca","mt-k14-kaskada-siec"],"pt":"Lekcje MT.13–MT.14","h":"Kaskadę tłumaczysz od końca pytaniem „po co?” – i pamiętasz, że to sieć","b":"<p>Cel aktywatora → cel związany z IT → cel organizacji → <w k=\"potrzeba\">potrzeba interesariusza</w> → <w k=\"wyznacznik\">wyznacznik</w>.</p><ul><li>Powiązania wiele do wielu (P – podstawowe, S – wspierające).</li><li>Brak ścieżki w górę to sygnał do przeglądu, nie wyrok.</li></ul>","c":"Kto zna tylko swój proces, najszybciej zrozumie kaskadę, idąc w górę.","s":"COBIT 5 Framework (PL), s. 17–20, Ilustracje 5 i 6","ctx":"<p>Przykład z banku: administrator testuje centrum zapasowe (DSS04) → usługa działa po awarii → cel IT 07 „Dostarczanie usług IT zgodnie z wymogami biznesowymi” → cel organizacji 7 „Ciągłość i dostępność usług biznesowych” → klienci mają stały dostęp do konta → nowe wymogi regulatora. Nazwy celów pochodzą z s. 19, ale sam łańcuch jest dydaktyczny, a nie odczytem z tabel. Nazwę szczebla podajesz dopiero po odpowiedzi kursanta.</p><p>Ten sam test wspiera też bezpieczeństwo i ryzyko – mentor idzie najważniejszą ścieżką, ale mówi, że jest ich więcej. Litery P/S w mapowaniu to nie ocena P ze skali. Raport, „którego nikt nie czyta”, może czytać audytor – priorytety ustala Ład, nie wykonawca. Tabel nie przepisuje się jeden do jednego: najpierw dostosowanie (s. 20).</p><p>Na szczycie: <w k=\"wyznacznik\">wyznacznik</w> (zmienia potrzeby, np. przepisy) ≠ <w k=\"potrzeba\">potrzeba</w> (stan, którego chcą interesariusze) ≠ gotowe rozwiązanie („kupmy drugie centrum danych”). Zapowiedź audytu to wyznacznik w pytaniu o kaskadę, ale zdarzenie wyzwalające w pytaniu o wdrożenie.</p>"},{"pt":"Sprawdź się","quiz":{"id":"q-fn-m-03","sylabus":["PR-02-02"],"tresc":"Regulator rynku finansowego ogłasza nowe wymagania dotyczące raportowania incydentów przez banki. W KASKADZIE CELÓW COBIT 5 ta zmiana jest przede wszystkim:","opcje":[{"t":"zdarzeniem wyzwalającym, które otwiera okno na zmianę","ok":false,"w":"Tak nazwiemy ją w cyklu życia wdrożenia (s. 37), ale pytanie dotyczy kaskady celów."},{"t":"celem organizacji w zrównoważonej karcie wyników","ok":false,"w":"Cel organizacji powstaje dopiero z potrzeb interesariuszy (krok 2)."},{"t":"celem związanym z Informatyką w obszarze zgodności","ok":false,"w":"To krok 3 kaskady."},{"t":"wyznacznikiem wpływającym na potrzeby interesariuszy","ok":true,"w":"Krok 1 kaskady (s. 17): zmiany regulacyjne, strategiczne i technologiczne wpływają na potrzeby interesariuszy."}],"src":"COBIT 5 Framework (EN), sekcja rozdział 2, rysunek 4","pomoc":{"t":"Pytanie dotyczy lekcji MT.13 „Kaskada celów od końca – pytanie „po co?””. Cel lekcji: Potrafię przeprowadzić kursanta wstecz przez kaskadę celów pytaniem „po co?”: od procesu do potrzeby i wyznacznika.","k":[]},"kurs":"Krok 1 kaskady (s. 17): zmiany regulacyjne, strategiczne i technologiczne wpływają na potrzeby interesariuszy.","kontekst":""}},{"pt":"Sprawdź się","quiz":{"id":"q-pak-T01Q04","sylabus":["PR-02-03","PR-02-07"],"tresc":"Jaka jest właściwa kolejność Kaskady Celów COBIT 5?","opcje":[{"t":"Potrzeby interesariuszy → cele organizacji → cele związane z informatyką → cele aktywatora","ok":true,"w":"Potrzeby interesariuszy przekłada się na cele organizacji, te na cele związane z informatyką, a te na cele aktywatora (Rysunek 4)."},{"t":"Cele związane z informatyką → cele organizacji → potrzeby interesariuszy → cele aktywatora","ok":false,"w":"Odwrócona kolejność. Kaskada zaczyna się od potrzeb interesariuszy, a nie od celów związanych z informatyką."},{"t":"Potrzeby interesariuszy → cele związane z informatyką → cele organizacji → cele aktywatora","ok":false,"w":"Cele organizacji muszą poprzedzać cele związane z informatyką – informatyka wspiera cele organizacji."},{"t":"Cele organizacji → potrzeby interesariuszy → cele aktywatora → cele związane z informatyką","ok":false,"w":"Potrzeby interesariuszy są przed celami organizacji, a cele aktywatora są ostatnim poziomem kaskady."}],"src":"COBIT 5 Framework (EN), sekcja rozdział 2, rysunki 4–6","pomoc":{"t":"Pytanie dotyczy lekcji MT.14 „Kaskada wstecz – sieć, a nie linia; wyznacznik, potrzeba i gotowe rozwiązanie”. Cel lekcji: Potrafię ostrzec kursanta, że kaskada to sieć powiązań, a brak ścieżki w górę to sygnał do przeglądu, a nie wyrok.","k":[]},"kurs":"Potrzeby interesariuszy przekłada się na cele organizacji, te na cele związane z informatyką, a te na cele aktywatora (Rysunek 4).","kontekst":""}}],"bankRevision":"309de4bb2ddc86c8","legacySp1Order":[null,null,null,null,null,null,null,null]};</script>
