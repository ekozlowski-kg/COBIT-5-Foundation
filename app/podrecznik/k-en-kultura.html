<script>window.DECK={"id":"k-en-kultura","rozdzial":"Załącznik G · Aktywatory szczegółowo · s. 65–88","tytul":"Kultura, Etyka i Zachowanie","prev":"k-en-role.html","next":"k-en-informacja.html","T":{"organizacja":{"t":"Organizacja","eg":"Organizacja","pd":"Przedsiębiorstwo","en":"Enterprise","wyj":"Firma, urząd, szkoła czy szpital: ludzie, którzy razem robią coś w jakimś celu.\n\nW COBIT 5 organizacja (enterprise) to podmiot, który ma interesariuszy, ich potrzeby i własne cele (enterprise goals). Ład i Zarządzanie IT służą temu, by organizacja te cele osiągała. Podręcznik tłumaczy enterprise jako „przedsiębiorstwo”, a egzamin jako „organizacja”, ale chodzi o to samo, także o sektor publiczny i not-for-profit.\n\nŻeby jednym słowem mówić o każdej zorganizowanej całości z celami: firmie, urzędzie, szpitalu czy uczelni, bo COBIT 5 stosuje się do wszystkich, nie tylko do biznesu.","zycie":"Klub szachowy przy osiedlowym domu kultury ma skarbnika, składki i wspólny cel: utrzymać salę i co roku zorganizować turniej. Nikt na tym nie zarabia, a mimo to są pieniądze, ludzie i decyzje do podjęcia. Dla COBIT 5 to też organizacja – nie trzeba być firmą, żeby z niego korzystać.","firma":"Pani Ania prowadzi jednoosobowy sklep internetowy z ceramiką, a jej brat spółkę z 200 pracownikami. Oboje mają swoje cele, pieniądze i informatykę, od której zależą. Dla COBIT 5 obie firmy są organizacjami, bez względu na wielkość.","urzad":"Szpital powiatowy, urząd gminy i szkoła podstawowa nie zarabiają dla właścicieli, ale mają budżet, ludzi, systemy i cele do osiągnięcia. COBIT 5 wprost mówi, że nadaje się też dla sektora publicznego i not-for-profit. Każda z tych instytucji jest więc organizacją w rozumieniu egzaminu.","it":"Gdy szpital publiczny realizuje APO02 (Zarządzanie strategią), też jest organizacją (enterprise) w rozumieniu COBIT 5: jego cele, np. ciągłość opieki nad pacjentami, są w kaskadzie celów celami organizacji, choć szpital nie działa dla zysku.","egz":"Gdy w pytaniu widzisz „organizacja”, w podręczniku szukaj „przedsiębiorstwo”. Podręcznik: „przedsiębiorstwo”, egzamin: „organizacja”. Chodzi o każdą organizację – także urząd czy szpital publiczny, nie tylko firmę. Nie myl z: Firma komercyjna – „Przedsiębiorstwo” w COBIT ≠ tylko firma nastawiona na zysk.","src":"COBIT 5 Framework (PL), s. 13"},"praktyki-zachowan":{"t":"Dobre praktyki kształtowania zachowań","eg":"Dobre praktyki kształtowania zachowań","pd":"Dobre praktyki dotyczące tworzenia, promowania i utrzymywania pożądanych wzorców zachowań","en":"Good practices for creating, encouraging and maintaining desired behaviour","wyj":"Sposoby, żeby ludzie zaczęli dobrze postępować: mówić, dawać przykład, nagradzać, spisać reguły.\n\nOrganizacja komunikuje pożądane zachowania i wartości. Kierownictwo i czempioni dają przykład. Zachęty i środki zniechęcające, także w systemie wynagradzania, wzmacniają zachowania. Reguły i normy, powiązane z politykami, dają szczegóły.\n\nŻeby pożądane zachowania pojawiły się i utrzymały, a nie zostały tylko hasłem.","zycie":"Chcesz, żeby dzieci segregowały śmieci. Tłumaczysz, po co to (komunikacja). Sam segregujesz na ich oczach (przykład). Za tydzień bez pomyłek jest pizza (zachęta). Na koszach wiszą naklejki z opisem (reguły). To cztery praktyki naraz.","firma":"Sieć piekarni chce, żeby sprzedawcy myli ręce po każdej płatności gotówką. Kierowniczka robi to pierwsza, w każdym sklepie jest „ambasadorka higieny”, a premia zależy od wyniku kontroli sanepidu. Instrukcja wisi przy kasie. To dobre praktyki kształtowania zachowań.","urzad":"Starostwo chce, żeby urzędnicy blokowali komputer przy odchodzeniu od biurka. Starosta robi to na oczach wszystkich, w każdym wydziale jest jedna osoba-czempion, a wydział z najlepszym wynikiem kontroli dostaje dodatkowy dzień szkoleniowy. Reguła jest wpisana do polityki bezpieczeństwa.","it":"Proces APO07 (Zarządzanie zasobami ludzkimi) obejmuje ocenę pracowników. Jeśli oceny nagradzają tylko terminy, rośnie ryzyko jak w Przykładzie 11. Dlatego cele w ocenach powinny obejmować też jakość (interpretacja kursu).","egz":"Dobra praktyka promowania zachowań: komunikowanie, przykład kierownictwa i czempionów (osób wspierających), zachęty i środki zniechęcające, reguły i normy. Związek z systemem wynagradzania jest wprost w podręczniku. Podręcznik: „osoby wspierające”. Egzamin: „czempioni”. To te same osoby: dają przykład i promują pożądane zachowania. Nie myl z: Etyka organizacyjna, etyka indywidualna, zachowania – Poziomy etyki to cele (co chcemy mieć). Dobre praktyki zachowań to narzędzia (jak to osiągnąć).; Ludzie, Umiejętności i Kompetencje – Szkolenie uczy, JAK coś zrobić (umiejętności). Praktyki zachowań sprawiają, że ludzie CHCĄ to robić.","src":"COBIT 5 Framework (PL), s. 80; COBIT 5 Framework (PL), s. 79, Ilustracja 34"},"poziomy-etyki":{"t":"Etyka organizacyjna, etyka indywidualna, zachowania","eg":"Etyka organizacyjna, etyka indywidualna, zachowania","pd":"Etyka organizacji, etyka indywidualna, indywidualne wzorce zachowań","en":"Organisational ethics, individual ethics, individual behaviour","wyj":"Trzy warstwy: w co wierzy firma, w co wierzy człowiek i co ludzie naprawdę robią.\n\nOrganizacja określa wartości, na których chce się opierać (etyka organizacyjna). Każdy pracownik ma własne wartości (etyka indywidualna). Ich połączenie i wiele innych czynników kształtuje zachowania, które razem tworzą kulturę.\n\nŻeby oddzielić to, co organizacja deklaruje, od tego, co myślą i robią ludzie.","zycie":"Drużyna harcerska ma prawo harcerskie: „harcerz mówi prawdę” (etyka organizacji). Każdy harcerz przynosi z domu własne wartości (etyka indywidualna). To, czy na obozie ktoś przyzna się do zgubienia namiotu, to zachowanie. Razem te zachowania tworzą atmosferę drużyny.","firma":"Firma kurierska pisze w kodeksie: „Szanujemy czas klienta” (etyka organizacyjna). Kurier Tomek wyniósł z domu, że słowa trzeba dotrzymać (etyka indywidualna). To, czy kurier zostawia awizo bez pukania, to jego zachowanie. Suma takich zachowań to prawdziwa kultura firmy.","urzad":"Urząd gminy przyjmuje kodeks etyki: „Bezstronnie traktujemy mieszkańców” (etyka organizacyjna). Urzędniczka ma własne przekonania, np. że sąsiadom trzeba pomagać (etyka indywidualna). To, czy załatwia sprawę znajomego poza kolejką, to zachowanie. Te zachowania razem pokazują kulturę urzędu.","it":"W APO13 (Zarządzanie bezpieczeństwem) organizacja ogłasza wartość „chronimy dane klientów”. Zachowanie widać w tym, czy pracownicy zgłaszają podejrzane maile. Dopiero takie zachowania pokazują prawdziwą kulturę bezpieczeństwa.","egz":"„Wartości, w oparciu o które organizacja chce działać” → etyka organizacyjna. „Osobiste wartości pracownika, zależne od religii, pochodzenia…” → etyka indywidualna. „Zachowania, które łącznie tworzą kulturę” → zachowania indywidualne. Egzamin: „etyka organizacyjna”, podręcznik: „etyka organizacji”. Etyka organizacyjna to wartości, w oparciu o które organizacja CHCE działać, a nie to, jak ludzie faktycznie się zachowują. Nie myl z: Dobre praktyki kształtowania zachowań – Poziomy etyki to CELE aktywatora (co chcemy osiągnąć). Praktyki zachowań to DOBRE PRAKTYKI (jak to kształtować: komunikacja, przykład, zachęty, reguły).; Zasady, Polityki i Struktury ramowe – Zasady i polityki są mechanizmem komunikowania wartości. Sama etyka organizacyjna to wartości, a nie dokument.","src":"COBIT 5 Framework (PL), s. 79; COBIT 5 Framework (PL), s. 79, Ilustracja 34"},"kultura-etyka-zachowanie":{"t":"Kultura, Etyka i Zachowanie","eg":"Kultura, Etyka i Zachowanie","pd":"Kultura, etyka i zachowanie","en":"Culture, Ethics and Behaviour (enabler 4)","wyj":"Jak ludzie naprawdę się zachowują, gdy nikt nie patrzy, i co uważają za uczciwe.\n\nAktywator obejmuje trzy poziomy: etykę organizacyjną (organisational ethics: wartości, według których organizacja chce działać), etykę indywidualną (individual ethics: osobiste wartości pracownika) i zachowania indywidualne (individual behaviour), które razem tworzą kulturę. Pożądane zachowania wspiera się dobrymi praktykami: komunikowaniem wartości, przykładem kierownictwa i osobami wspierającymi (champions), zachętami i środkami zniechęcającymi oraz regułami i normami. Ważnym mechanizmem komunikowania wartości są zasady i polityki.\n\nŻeby zasady, procesy i decyzje naprawdę były stosowane, bo bez odpowiednich zachowań ludzi najlepsze procedury zostają na papierze.","zycie":"Rodzice zakazują telefonów przy stole, ale sami co chwilę zerkają w ekran. Po tygodniu dzieci robią to samo, bo bardziej patrzą na przykład niż na zakaz. Kultura i zachowanie biorą się z tego, co ludzie widzą u innych, zwłaszcza u tych „na górze”.","firma":"Właściciel firmy robiącej strony internetowe płaci premie tylko za oddanie projektu w terminie. Programiści szybko uczą się pomijać testy, bo za błędy nikt nie rozlicza, a za spóźnienie tak. Zachęty ukształtowały zachowanie – to właśnie aktywator Kultura, Etyka i Zachowanie (podobny przypadek opisuje Przykład 11 w podręczniku).","urzad":"W urzędzie gminy kierownik za każdy błąd robi publiczną awanturę. Urzędniczka, która przez pomyłkę wysłała dane mieszkańca pod zły adres, nikomu o tym nie mówi, więc nikt nie reaguje na czas. Procedura zgłaszania incydentów istnieje, ale kultura obwiniania sprawia, że jest martwa.","it":"W DSS03 (Zarządzanie problemami) zespół analizuje awarie bez szukania winnych, więc informatycy zgłaszają także własne pomyłki. Zachowanie „uczymy się zamiast obwiniać” należy do aktywatora Kultura, Etyka i Zachowanie i decyduje, czy proces dostaje prawdziwe dane.","egz":"„Wartości, w oparciu o które organizacja chce działać” → etyka organizacyjna. Dobra praktyka promowania zachowań → np. wskazywanie czempionów (osób wspierających), komunikacja, zachęty, reguły i normy. Mechanizm komunikowania wartości i pożądanego zachowania → zasady i polityki. Nie myl z: Etyka organizacyjna vs indywidualna – Organizacyjna to wartości, w oparciu o które ORGANIZACJA chce działać. Indywidualna to osobiste wartości pracownika (religia, pochodzenie, doświadczenia).","src":"COBIT 5 Framework (PL), s. 79; COBIT 5 Framework (PL), s. 79, Ilustracja 34; COBIT 5 Framework (PL), s. 80"}},"S":[{"lekcje":["en-k35-kultura-czym-jest","en-k36-poziomy-etyki"],"pt":"Lekcje 2.35–2.36","h":"Kultura to rzeczywiste zachowania – bez niej procesy i struktury nie działają","b":"<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>Poziom<\/th><th>Co to jest<\/th><\/tr><tr><td>Etyka organizacyjna<\/td><td>wartości, na których <w k=\"organizacja\">organizacja<\/w> chce działać<\/td><\/tr><tr><td>Etyka indywidualna<\/td><td>osobiste wartości pracownika<\/td><\/tr><tr><td>Zachowania indywidualne<\/td><td>razem tworzą kulturę<\/td><\/tr><\/table><\/div>","c":"Wartość zapisana dla całej organizacji to etyka organizacyjna, nawet gdy pracownicy osobiście ją podzielają.","s":"COBIT 5 Framework (PL), s. 27, 79–80, Przykłady 11–12","ctx":"<p><w k=\"kultura-etyka-zachowanie\">Kultura, Etyka i Zachowanie<\/w> (<span class=\"en\">Culture, Ethics and Behaviour<\/span>) to zbiór zachowań indywidualnych i zbiorowych. Podręcznik nazywa ten aktywator często niedocenianym czynnikiem sukcesu. Bez właściwej kultury procesy nie dają wyników, a decyzje struktur nie są wdrażane. Zasady i polityki to bardzo ważny mechanizm komunikowania wartości. Warto obserwować trzy zachowania: podejmowanie ryzyka, przestrzeganie polityk i reakcję na negatywne wyniki.<\/p><p>Przykład 11: zespoły programistów oceniano tylko za termin i budżet, więc skracały testy. Rozwiązaniem były lepsze zachęty, bo procedury były dobre. Przykład 12: działy biznesowe obwiniają IT o opóźnienia, choć same nie określiły jasno oczekiwań. Podręcznik każe za wszelką cenę unikać kultury obwiniania, bo najbardziej blokuje ona komunikację.<\/p>"},{"pt":"Sprawdź się","quiz":{"id":"q-enk-35-3","sylabus":["EN-02-16"],"tresc":"Który aktywator podręcznik COBIT 5 nazywa <b>często niedocenianym czynnikiem sukcesu<\/b> działań związanych z Ładem i Zarządzaniem?","opcje":[{"t":"Aktywator 4 – Kultura, Etyka i Zachowanie","ok":true,"w":"Dobrze. Tak mówi podręcznik na s. 27."},{"t":"Aktywator 5 – Informacja","w":"Podręcznik opisuje informację jako kluczowy produkt organizacji."},{"t":"Aktywator 3 – Struktury organizacyjne","w":"Struktury to kluczowe jednostki decyzyjne."},{"t":"Aktywator 7 – Ludzie, Umiejętności i Kompetencje","w":"Ten aktywator jest wymagany do działań i decyzji, ale to nie on jest tak nazwany."}],"src":"COBIT 5 Framework (PL), s. 27","pomoc":{"t":"Pytanie dotyczy lekcji 2.35 „Aktywator 4 – Kultura, Etyka i Zachowanie: czym jest i dlaczego decyduje”. Cel lekcji: Potrafię wyjaśnić, czym jest aktywator Kultura, Etyka i Zachowanie i dlaczego bez niego nie działają procesy ani struktury.","k":["kultura-etyka-zachowanie"]}}},{"pt":"Arkusz próbny","sp1":"sp1-05","lekcja":"2.35","temat":"Aktywator 4 – Kultura, Etyka i Zachowanie: czym jest i dlaczego decyduje","k":["kultura-etyka-zachowanie"]},{"pt":"Sprawdź się","quiz":{"id":"q-enk-36-3","sylabus":["EN-02-15"],"tresc":"Po każdej awarii w firmie najpierw szuka się winnego, a przyczyny zostają. Który rodzaj zachowań z COBIT 5 opisuje ta sytuacja?","opcje":[{"t":"Zachowanie związane z przestrzeganiem polityki","w":"Ta kategoria dotyczy stosowania polityk."},{"t":"Zachowanie w przypadku negatywnych wyników","ok":true,"w":"Dobrze. Organizacja przypisuje winę zamiast uczyć się na błędach."},{"t":"Zachowanie związane z podejmowaniem ryzyka","w":"Ta kategoria dotyczy tego, ile ryzyka organizacja przyjmuje."},{"t":"Etyka indywidualna pracowników","w":"To poziom wartości, a nie rodzaj zachowania."}],"src":"COBIT 5 Framework (PL), s. 79","pomoc":{"t":"Pytanie dotyczy lekcji 2.36 „Etyka organizacyjna, etyka indywidualna i zachowania”. Cel lekcji: Potrafię odróżnić etykę organizacyjną, etykę indywidualną i zachowania indywidualne.","k":["poziomy-etyki"]}}},{"pt":"Arkusz próbny","sp1":"sp1-43","lekcja":"2.36","temat":"Etyka organizacyjna, etyka indywidualna i zachowania","k":["poziomy-etyki"]},{"lekcje":["en-k37-praktyki-zachowan"],"pt":"Lekcja 2.37","h":"Zachowania kształtuje komunikowanie, przykład, zachęty i reguły","b":"<ol><li><b>Komunikowanie<\/b> wartości.<\/li><li><b>Świadomość<\/b> – przykład kierownictwa i <b>czempionów<\/b> (<span class=\"en\">Champions<\/span>).<\/li><li><b>Zachęty<\/b> i środki zniechęcające.<\/li><li><b>Reguły i normy<\/b>.<\/li><\/ol><p>Rysunek 34 dodaje <b>egzekwowanie wymagań<\/b>.<\/p>","c":"Czempioni to kultura; delegowanie, zasady operacyjne i eskalacja to struktury organizacyjne.","s":"COBIT 5 Framework (PL), s. 79–80, Ilustracja 34","ctx":"<p>Tekst podręcznika opisuje cztery <w k=\"praktyki-zachowan\">dobre praktyki kształtowania zachowań<\/w>. Zachęty łączy się z systemem wynagrodzeń. Reguły i normy podają szczegóły do zasad i polityk. Ilustracja 34 wymienia sześć haseł: komunikowanie, egzekwowanie wymagań, zachęty i nagrody, świadomość, reguły i normy, osoby wspierające. Podręcznik pisze „osoby wspierające”, a egzamin – „czempioni”.<\/p><p>Przykład: ubezpieczyciel walczy z fałszywymi e-mailami. Prezes publicznie zgłasza podejrzaną wiadomość (przykład kierownictwa). W każdym dziale działa czempion bezpieczeństwa. Za zgłoszenie jest pochwała (zachęta). Polityka każe przekazać podejrzany e-mail w ciągu godziny (reguła). Sama polityka by nie wystarczyła. Na egzaminie pytanie o praktyki tego aktywatora często zawiera dystraktory z innych aktywatorów – wszystkie prawdziwe, ale tylko jedna odpowiedź dotyczy kultury.<\/p>"},{"pt":"Sprawdź się","quiz":{"id":"q-enk-37-3","sylabus":["EN-02-14"],"tresc":"Która z opcji jest dobrą praktyką aktywatora <b>Kultura, Etyka i Zachowanie<\/b>?","opcje":[{"t":"Zasady operacyjne","w":"To dobra praktyka struktur organizacyjnych."},{"t":"Delegowanie uprawnień","w":"To dobra praktyka struktur organizacyjnych."},{"t":"Wskazanie czempionów (osób wspierających)","ok":true,"w":"Dobrze. Czempioni to dobra praktyka z Rysunku 34."},{"t":"Definicja pryncypiów architektury korporacyjnej","w":"To dobra praktyka aktywatora Usługi, Infrastruktura i Aplikacje."}],"src":"COBIT 5 Framework (PL), s. 79","pomoc":{"t":"Pytanie dotyczy lekcji 2.37 „Dobre praktyki kształtowania zachowań – komunikowanie, przykład, zachęty, reguły”. Cel lekcji: Potrafię wymienić dobre praktyki kształtowania zachowań, w tym czempionów, i odróżnić je od praktyk struktur organizacyjnych.","k":["praktyki-zachowan"]}}},{"pt":"Arkusz próbny","sp1":"sp1-36","lekcja":"2.37","temat":"Dobre praktyki kształtowania zachowań – komunikowanie, przykład, zachęty, reguły","k":["praktyki-zachowan"]}]};</script>
