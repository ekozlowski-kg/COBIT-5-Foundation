<script>window.DECK={"id":"k-en-struktury","rozdzial":"Załącznik G · Aktywatory szczegółowo · s. 65–88","tytul":"Struktury organizacyjne","prev":"k-en-raci.html","next":"k-en-role.html","T":{"poziom-uprawnien":{"t":"Poziom uprawnień","eg":"Poziom uprawnień","pd":"Poziom decyzyjny / uprawnienia decyzyjne","en":"Level of authority / decision rights","wyj":"Lista decyzji, które zespół może podjąć sam, bez pytania nikogo wyżej.\n\nZarządzenie albo regulamin wymienia decyzje, do których struktura jest uprawniona, np. zakupy do określonej kwoty. Decyzje ponad ten poziom należą do kogoś wyżej. Część swoich uprawnień struktura może delegować w dół.\n\nŻeby struktura wiedziała, jakie decyzje może podjąć sama, a które musi oddać wyżej.","zycie":"Nastolatek dostaje kartę z limitem 200 zł miesięcznie. Za tę kwotę kupuje, co chce, bez pytania. Na droższy telefon potrzebuje zgody rodziców. 200 zł to jego poziom uprawnień.","firma":"Kierowniczka sklepu może sama dać klientowi rabat do 10%. Większy rabat zatwierdza właściciel. Rabat do 10% to poziom uprawnień kierowniczki.","urzad":"Dyrektor szkoły prowadzonej przez gminę sam zatwierdza wycieczki klasowe i zakup pomocy dydaktycznych do 5 tys. zł. Większe wydatki zatwierdza organ prowadzący, czyli gmina. Kwota 5 tys. zł to poziom uprawnień dyrektora.","it":"Komitety sterujące programów i projektów z il. 33 mają określone, o czym mogą zdecydować same, np. o przesunięciu zasobów w ramach programu. Większe decyzje inwestycyjne wracają do komitetu ds. strategii (przykład kursu).","egz":"„Jakie decyzje struktura może podejmować” → poziom uprawnień. Podręcznikowe „poziom decyzyjny” i „uprawnienia decyzyjne” to ta sama praktyka. Egzamin: „poziom uprawnień”. Podręcznik w tekście: „poziom decyzyjny/uprawnienia decyzyjne”, a na il. 32 i s. 72 też „poziom uprawnień”. To ten sam element. Nie myl z: Zakres kontroli – Zakres kontroli to granice tematów. Poziom uprawnień to rodzaj i wielkość decyzji w tych granicach.; Delegowanie uprawnień – Poziom uprawnień mówi, co struktura może zdecydować. Delegowanie mówi, co z tego przekazuje strukturze podległej.","src":"COBIT 5 Framework (PL), s. 75; COBIT 5 Framework (PL), s. 75, Ilustracja 32; COBIT 5 Framework (PL), s. 72; materiały Altkom"},"struktury-organizacyjne":{"t":"Struktury organizacyjne","eg":"Struktury organizacyjne","pd":"Struktury organizacyjne","en":"Organisational Structures (enabler 3)","wyj":"Zespoły, komisje i stanowiska, które podejmują decyzje, np. narada kierownictwa czy komisja przetargowa.\n\nStruktury organizacyjne (organisational structures) to kluczowe jednostki decyzyjne, np. zarząd, komitet ds. strategii IT czy komitet sterujący. Każda ma mandat, skład i zasady działania, a dobre praktyki obejmują też zakres kontroli (span of control), poziom uprawnień (level of authority), delegowanie uprawnień i procedury eskalacji. Wynikiem ich pracy są decyzje, a tabele RACI łączą je z praktykami procesów.\n\nŻeby było wiadomo, które zespoły i gremia podejmują jakie decyzje, z jakim umocowaniem i według jakich zasad.","zycie":"Trójka rodzeństwa opiekuje się starszym tatą i umawia się: każdy wydatek powyżej 1000 zł na leczenie czy remont jego mieszkania zatwierdzają we trójkę, na rozmowie w niedzielę. Drobne zakupy robi ten, kto akurat jest u taty. Ta niedzielna „rada” to struktura organizacyjna – ma skład, mandat i zasady podejmowania decyzji.","firma":"W rodzinnej stolarni powstaje komitet inwestycyjny: właściciel, jego córka i księgowa. Raz w miesiącu decydują o zakupach maszyn powyżej 20 tys. zł, a mniejsze wydatki zatwierdza sam kierownik warsztatu. Komitet to struktura organizacyjna z określonym zakresem uprawnień.","urzad":"Wójt zarządzeniem powołuje komisję przetargową do zakupu komputerów dla szkół. Zarządzenie mówi, kto w niej zasiada, co ocenia i kiedy kończy pracę – po podpisaniu umowy. To struktura organizacyjna z mandatem i cyklem życia.","it":"Komitet sterujący programu wdrożenia nowego systemu zatwierdza zmiany zakresu i budżetu w procesie BAI01 (Zarządzanie programami i projektami), a sprawy przekraczające jego uprawnienia eskaluje do komitetu ds. strategii IT. To aktywator „Struktury organizacyjne” w działaniu: mandat, poziom uprawnień i eskalacja.","egz":"Produkt działań struktury to decyzje. Pytania o „zasady operacyjne”, „zakres kontroli”, „poziom uprawnień”, „delegowanie” i „eskalację” dotyczą tego aktywatora. Nie myl z: Role i struktury organizacyjne – Struktura to jednostka (np. komitet), a rola to funkcja osoby (np. CIO). Ilustracja 33 zawiera i jedne, i drugie.","src":"COBIT 5 Framework (PL), s. 27; COBIT 5 Framework (PL), s. 75, Ilustracja 32"},"rezultat":{"t":"Rezultat / wynik","eg":"Rezultat / wynik","pd":"Wynik","en":"Output","wyj":"Konkretny produkt pracy, np. raport, działający program albo podpisana umowa.\n\nRezultat (output) to bezpośredni produkt pracy procesu albo projektu, np. wdrożony system, raport czy przeprowadzone szkolenie. W COBIT 5 wyjścia (outputs) praktyk jednego procesu bywają wejściami innych praktyk i procesów. Korzyść (benefit) pojawia się dopiero wtedy, gdy rezultat realnie coś poprawia u interesariuszy.\n\nŻeby odróżnić to, co praca bezpośrednio wytworzyła, od korzyści, którą ma przynieść, i nie uznawać samego dostarczenia za sukces.","zycie":"Kupujesz bieżnię i stawiasz ją w sypialni – bieżnia to rezultat. Jeśli po pół roku służy za wieszak na ubrania, rezultat jest, a korzyści, czyli lepszej kondycji, nie ma.","firma":"Warsztat zamawia stronę internetową z rezerwacją wizyt i od poniedziałku strona działa – to rezultat. Czy przyniesie korzyść, okaże się, gdy właściciel policzy, ile osób naprawdę się przez nią umówiło.","urzad":"Szkoła robi dla rodziców szkolenie z e-dziennika: 80 osób na sali, lista obecności podpisana. To rezultat. Korzyść będzie wtedy, gdy rodzice przestaną dzwonić do sekretariatu po oceny.","it":"Projekt w BAI03 (Zarządzanie identyfikacją i budowaniem rozwiązań) dostarcza nową aplikację – to rezultat (output). Czy powstała korzyść, sprawdza się później, np. w EDM02 (Zapewnienie realizacji korzyści), porównując efekty z uzasadnieniem biznesowym.","egz":"Pytania o „sukces projektu”: dostarczenie zgodnie z umową (rezultat) NIE oznacza jeszcze wartości dla interesariuszy (korzyść). Nie myl z: Realizacja korzyści – Korzyść = zmiana na lepsze dzięki rezultatowi.; Rezultat procesu w ISO/IEC 15504 (outcome) – Tu „rezultat” to output – konkretny produkt pracy (raport, działający system). W ocenie zdolności (ISO/IEC 15504) „rezultat” to outcome – obserwowalny skutek osiągnięcia przeznaczenia procesu. To dwa różne angielskie słowa przetłumaczone tak samo.","src":"COBIT 5 Framework (PL), s. 92"},"procedury-eskalacji":{"t":"Procedury eskalacji","eg":"Procedury eskalacji","pd":"Procedury eskalacji","en":"Escalation procedures","wyj":"Umówiona droga, którą sprawa idzie wyżej, gdy zespół nie potrafi podjąć decyzji.\n\nProcedura mówi, kiedy uznajemy, że decyzji nie da się podjąć, do kogo sprawa idzie wyżej i co trzeba przygotować. Eskalacja idzie w górę, w przeciwieństwie do delegowania. Słownik wspomina o eskalacji także przy wejściach od roli C.\n\nŻeby decyzja nie utknęła, gdy struktura nie może jej podjąć.","zycie":"Rodzeństwo nie może się dogadać, kto dostaje większy pokój. Umówili się wcześniej: gdy po dwóch rozmowach nie ma zgody, decyduje mama. Tak działa procedura eskalacji: wiadomo, kiedy i do kogo sprawa idzie wyżej.","firma":"W firmie budowlanej zespół projektu nie może wybrać dostawcy okien. Procedura mówi: po tygodniu bez decyzji kierownik projektu przekazuje sprawę dyrektorowi, z opisem dwóch ofert. Dyrektor rozstrzyga w 3 dni.","urzad":"Komisja przetargowa w gminie nie może uzgodnić oceny dwóch ofert na przebudowę drogi. Regulamin komisji mówi: gdy po dwóch posiedzeniach nie ma zgody, przewodniczący w ciągu 2 dni przekazuje sprawę wójtowi z notatką opisującą oba stanowiska. Wójt jako kierownik zamawiającego rozstrzyga. To procedura eskalacji.","it":"Gdy komitet sterujący programu nie może się zgodzić co do przesunięcia budżetu, sprawa trafia do komitetu ds. strategii (wykonawczego IT). Taka ścieżka powinna być zapisana z góry (przykład kursu).","egz":"„Ścieżka i działania, gdy nie da się podjąć decyzji” → procedury eskalacji. Nie myl z delegowaniem (w dół). Nie myl z: Delegowanie uprawnień – Eskalacja przenosi problem z decyzją W GÓRĘ. Delegowanie przekazuje uprawnienia W DÓŁ.; Poziom uprawnień – Poziom uprawnień mówi, co struktura może zdecydować. Eskalacja mówi, co robić, gdy decyzji nie da się podjąć.","src":"COBIT 5 Framework (PL), s. 75; COBIT 5 Framework (PL), s. 90"},"dobre-praktyki-struktur":{"t":"Dobre praktyki struktur organizacyjnych","eg":"Dobre praktyki struktur organizacyjnych","pd":"Dobre praktyki struktur organizacyjnych","en":"Organisational structure good practices","wyj":"Sprawdzone reguły dla zespołów i komisji: kto w nich siedzi, co mogą zdecydować, kiedy oddają sprawę wyżej.\n\nDla aktywatora Struktury organizacyjne COBIT 5 opisuje sześć dobrych praktyk: zasady operacyjne (operating principles), skład (composition), zakres kontroli (span of control), poziom uprawnień (level of authority), delegowanie uprawnień (delegation of authority) i procedury eskalacji (escalation procedures). Zakres kontroli wyznacza granice, w których struktura decyduje, a poziom uprawnień mówi, jakie decyzje może podjąć. Gdy decyzji nie da się podjąć, procedura eskalacji wskazuje, dokąd sprawa idzie.\n\nŻeby zespoły, komitety i rady działały przewidywalnie: wiadomo, kto w nich jest, o czym i do jakiego stopnia decydują i co się dzieje, gdy decyzja utknie.","zycie":"Wspólnota mieszkaniowa wybiera zarząd z trzech sąsiadów (skład). Zarząd spotyka się raz w miesiącu i pisze protokół (zasady operacyjne), zajmuje się tylko częściami wspólnymi budynku, nie mieszkaniami (zakres kontroli), sam może zlecić naprawę do 5 tys. zł (poziom uprawnień), sprzątanie klatek powierza administratorowi (delegowanie), a większe wydatki idą pod głosowanie wszystkich właścicieli (eskalacja). Tak wyglądają dobre praktyki struktury w jednym bloku.","firma":"Sklep internetowy powołuje komitet zakupów: właściciel, księgowa i kierownik magazynu (skład). Spotykają się w poniedziałki i notują decyzje (zasady operacyjne), decydują tylko o zakupach towaru, nie o pensjach (zakres kontroli), zatwierdzają zamówienia do 50 tys. zł (poziom uprawnień), drobne zamówienia zostawiają magazynierowi (delegowanie), a większe kierują do wspólników (eskalacja). Te ustalenia to dobre praktyki struktury organizacyjnej.","urzad":"Dyrektor szkoły powołuje zespół do spraw sprzętu: informatyka, wicedyrektora i dwoje nauczycieli (skład). Zespół spotyka się raz na kwartał (zasady operacyjne), zajmuje się sprzętem, ale nie budżetem szkoły (zakres kontroli), sam przydziela laptopy salom (poziom uprawnień), drobne naprawy zleca informatykowi (delegowanie), a gdy nie może się dogadać, rozstrzyga dyrektor (eskalacja). Tak wyglądają dobre praktyki struktur organizacyjnych.","it":"Komitet sterujący IT w banku ma skład (członek zarządu, CIO, dyrektor finansowy) i zasady operacyjne (posiedzenie raz w miesiącu z protokołem). Zajmuje się tylko sprawami IT (zakres kontroli) i zatwierdza projekty do ustalonej kwoty (poziom uprawnień). Zatwierdzanie bieżących zmian w systemach deleguje do działu IT (BAI06 Zarządzanie zmianami), a wydatki ponad budżet kieruje do zarządu (eskalacja).","egz":"„Publikowanie harmonogramu spotkań” to zasady operacyjne. „Granice uprawnień” → zakres kontroli. „Jakie decyzje wolno podjąć” → poziom uprawnień. „Ścieżka przy problemach z decyzją” → eskalacja. Egzamin: „Zasady operacyjne” / „Zasady wykonawcze”, „Poziom uprawnień”, „Delegowanie uprawnień”. Podręcznik: „Zasady działania”, „Poziom decyzyjny/uprawnienia decyzyjne”, „Przekazywanie uprawnień”. Nie myl z: Zakres kontroli vs poziom uprawnień – Zakres kontroli to GRANICE (czego dotyczy władza). Poziom uprawnień to RODZAJ decyzji, które wolno podjąć.","src":"COBIT 5 Framework (PL), s. 75; materiały Altkom; sylabus PeopleCert, s. 8"},"dzialanie-procesu":{"t":"Działania","eg":"Działania","pd":"Działania","en":"Activities","wyj":"Konkretne kroki, które trzeba wykonać, żeby duży punkt planu został zrobiony.\n\nDziałania to konieczne i wystarczające kroki do realizacji praktyki. Uwzględniają wejścia i wyjścia oraz ułatwiają przypisanie ról. Nie są normatywne, więc organizacja przerabia je na własne procedury. Gdy są za ogólne, dokłada się szczegółowe działania z innych standardów.\n\nŻeby rozpisać praktykę na konkretne kroki, przy których łatwo wskazać, kto co robi i co wchodzi oraz wychodzi.","zycie":"Praktyka: „Przygotuj dziecko do szkoły”. Działania: kup podręczniki, podpisz zeszyty, sprawdź plan lekcji. To wystarczy, żeby praktyka była wykonana. Każda rodzina zrobi to po swojemu i to jest w porządku.","firma":"W warsztacie samochodowym praktyka brzmi: „Przyjmij auto do naprawy”. Działania: spisz usterki z klientem, zrób zdjęcia, ustal termin, wydaj potwierdzenie. Właściciel zamienia je na własną kartę przyjęcia z rubrykami. Działania z wzoru stały się procedurą warsztatu.","urzad":"W urzędzie praktyka brzmi: „Zarządzaj uprawnieniami użytkowników”. Działania to: przyjmij wniosek kierownika, nadaj dostęp, raz w roku przejrzyj listę. Informatyk dopisuje do nich szczegóły z normy ISO 27001 (międzynarodowej normy o bezpieczeństwie informacji) – to już szczegółowe działania.","it":"W DSS02 działania pod praktyką rejestrowania incydentów obejmują zapisanie zgłoszenia, klasyfikację i nadanie priorytetu. Zespół uzupełnia je szczegółowymi działaniami z ITIL (szczegóły procesu: uproszczenie kursu).","egz":"Polskie nazwy mogą się różnić między przekładami. Porównuj sens i angielski oryginał; poprawny synonim nie staje się błędny przez samą formę tłumaczenia. Kurs nie potwierdza tu aktualnego brzmienia polskiego arkusza operatora. Nie myl z: Praktyka nadzoru / zarządzania – Praktyka to ogólny wymóg (CO). Działania to kroki do jej realizacji (JAK).; Procedura – Działania COBIT 5 nie są normatywne. Procedura to konkretna, obowiązująca wersja działań, napisana przez organizację.","src":"COBIT 5 Framework (PL), s. 89; COBIT 5 Framework (PL), s. 70"},"zakres-kontroli":{"t":"Zakres kontroli","eg":"Zakres kontroli","pd":"Zakres (zasięg) kontroli","en":"Span of control","wyj":"Granica tego, o czym zespół w ogóle może decydować, a co jest poza nim.\n\nPrzy powołaniu struktury określa się granice jej uprawnień decyzyjnych, np. tylko sprawy IT albo tylko projekty. Wewnątrz tych granic poziom uprawnień mówi, jakie decyzje wolno podjąć. Struktury mogą też tworzyć polityki tylko w swoim zakresie kontroli.\n\nŻeby było jasne, jakich spraw dotyczy władza danej struktury, a jakich nie.","zycie":"Wspólnota mieszkaniowa decyduje o klatce schodowej, dachu i podwórku. O tym, jak urządzisz swoje mieszkanie, nie decyduje. Granica między częściami wspólnymi a twoim mieszkaniem to zakres kontroli wspólnoty.","firma":"Komitet zakupów w sieci sklepów decyduje o zakupie towaru. O pensjach i zatrudnieniu decyduje dział kadr. Towar to zakres kontroli komitetu, pensje są poza nim.","urzad":"Zebranie wiejskie decyduje, na co pójdzie fundusz sołecki jego wsi, np. 40 tysięcy złotych na plac zabaw. Nie decyduje o budżecie całej gminy ani o drogach powiatowych. To granice jego zakresu kontroli.","it":"Rada ds. Architektury z il. 33 zajmuje się decyzjami o architekturze korporacyjnej i polityką architektury, a nie budżetem marketingu. Te granice to jej zakres kontroli.","egz":"Polskie nazwy mogą się różnić między przekładami. Porównuj sens i angielski oryginał; poprawny synonim nie staje się błędny przez samą formę tłumaczenia. Kurs nie potwierdza tu aktualnego brzmienia polskiego arkusza operatora. W naukach o zarządzaniu span of control to liczba podwładnych jednego szefa. W COBIT 5 to coś innego: granice uprawnień decyzyjnych struktury. Na egzaminie liczy się definicja COBIT 5. Nie myl z: Poziom uprawnień – Zakres kontroli: GRANICE (czego dotyczy władza). Poziom uprawnień: RODZAJ decyzji, które wolno podjąć w tych granicach.; Delegowanie uprawnień – Zakres kontroli to granice władzy struktury. Delegowanie to przekazanie części tej władzy strukturze podległej.","src":"COBIT 5 Framework (PL), s. 75; COBIT 5 Framework (PL), s. 75, Ilustracja 32; COBIT 5 Framework (PL), s. 68"},"zasady-operacyjne":{"t":"Zasady operacyjne","eg":"Zasady operacyjne","pd":"Zasady działania","en":"Operating principles","wyj":"Ustalenia, jak zespół pracuje: jak często się spotyka, jak notuje i jak prowadzi zebrania.\n\nStruktura ustala, jak często się zbiera, jak dokumentuje decyzje i jak prowadzi posiedzenia. Te ustalenia oraz mandat struktury określa wdrożona struktura polityk. Zasady operacyjne mówią, JAK zespół pracuje, a nie JAKIE decyzje może podjąć.\n\nŻeby zespół decyzyjny pracował przewidywalnie i zostawiał ślad swoich ustaleń.","zycie":"Rada rodziców w szkole spotyka się w pierwszy wtorek miesiąca. Ktoś zawsze pisze notatkę i rozsyła ją w grupie. Zebranie ma porządek obrad i trwa najwyżej godzinę. To zasady operacyjne tej rady.","firma":"Zarząd spółdzielni mleczarskiej zbiera się co dwa tygodnie. Każde zebranie ma prowadzącego, a kończy się protokołem z listą decyzji. To zasady operacyjne zarządu.","urzad":"Komisja do spraw zakupów w starostwie ma regulamin: posiedzenia raz w miesiącu, kworum trzech osób, protokół w ciągu trzech dni. Te ustalenia to zasady operacyjne komisji.","it":"Komitet ds. strategii (wykonawczy IT) z il. 33 potrzebuje ustalonych terminów posiedzeń i rejestru decyzji. Bez tego nie widać, jak rozliczał portfele inwestycji IT.","egz":"Terminy zebrań, protokoły, częstotliwość posiedzeń, porządek obrad → zasady operacyjne. Nie myl z zasadami (principles) z aktywatora 1. Egzamin: „zasady operacyjne” (czasem „zasady wykonawcze”). Podręcznik: „zasady działania”. Nie myl z „zasadami” z aktywatora 1, czyli z wartościami organizacji. Nie myl z: Zasady, Polityki i Struktury ramowe – Zasady w aktywatorze 1 to wartości organizacji (np. „bezpieczeństwo danych klientów przede wszystkim”). Zasady operacyjne to reguły pracy jednego zespołu.; Zakres kontroli – Zasady operacyjne mówią, JAK zespół pracuje. Zakres kontroli mówi, CZEGO dotyczą jego decyzje.","src":"COBIT 5 Framework (PL), s. 75; materiały Altkom"},"delegowanie-uprawnien":{"t":"Delegowanie uprawnień","eg":"Delegowanie uprawnień","pd":"Przekazywanie uprawnień","en":"Delegation of authority","wyj":"Oddajesz część swoich decyzji zespołowi pod sobą, żeby nie wszystko szło przez ciebie.\n\nStruktura przekazuje część swoich uprawnień decyzyjnych strukturze podległej. Delegować można tylko to, co mieści się w jej poziomie uprawnień. Delegowanie idzie w dół, a eskalacja w górę.\n\nŻeby wyższa struktura nie musiała decydować o każdym drobiazgu i żeby decyzje zapadały bliżej pracy.","zycie":"Rodzice wyjeżdżają na weekend i mówią najstarszej córce: „Ty decydujesz, co jecie i kiedy rodzeństwo idzie spać”. O wyjściu na imprezę dalej decydują rodzice przez telefon. To delegowanie części uprawnień.","firma":"Zarząd hotelu przekazuje kierownikowi recepcji decyzje o bezpłatnym późnym wymeldowaniu. Rabaty powyżej 20% zostawia sobie. To delegowanie podzbioru uprawnień strukturze podległej.","urzad":"Dyrektor szpitala powiatowego przekazuje ordynatorom decyzje o grafiku pracy lekarzy na ich oddziałach. Zatrudnianie lekarzy zostawia sobie. To delegowanie uprawnień w dół.","it":"Zarząd przekazuje komitetowi ds. strategii (wykonawczemu IT) decyzje o portfelach inwestycji IT, zgodnie z opisem komitetu na il. 33. Przy procesie EDM01 ustala się, jakie uprawnienia są delegowane (szczegóły procesu: uproszczenie kursu).","egz":"„Struktura przekazuje uprawnienia (lub ich część) strukturom podległym” → delegowanie uprawnień. Podręcznik: „przekazywanie uprawnień”. Egzamin: „delegowanie uprawnień”. Podręcznik: „przekazywanie uprawnień”. Delegowanie idzie w dół, do struktur podległych. W górę idzie eskalacja. Nie myl z: Procedury eskalacji – Delegowanie przekazuje decyzje W DÓŁ, planowo. Eskalacja przenosi problem z decyzją W GÓRĘ.; Poziom uprawnień – Poziom uprawnień mówi, co struktura może zdecydować. Delegowanie mówi, którą część tego oddaje niżej.","src":"COBIT 5 Framework (PL), s. 75; materiały Altkom"}},"S":[{"lekcje":["en-k25-struktury-organizacyjne"],"pt":"Lekcja 2.25","h":"Struktura organizacyjna to zespół, którego wynikiem są decyzje","b":"<p><w k=\"struktury-organizacyjne\">Struktury organizacyjne</w> (<span class=\"en\">Organisational Structures</span>) – zarząd, komitety, rady.</p><ul><li><b><w k=\"rezultat\">Wynik</w>:</b> <w k=\"dzialanie-procesu\">działania</w> i decyzje.</li><li><b>Mandat</b> – powód i cel, określone przy założeniu.</li><li><b>Cykl życia:</b> utworzenie → istnienie → dostosowanie → rozwiązanie.</li></ul>","c":"Komitet bez mandatu ma nazwę i członków, ale nie podejmuje decyzji.","s":"COBIT 5 Framework (PL), s. 27, 75–76","ctx":"<p>Struktura podejmuje decyzje na podstawie danych wejściowych, zwykle informacji. Jej wynikiem są decyzje, inne informacje albo prośba o dodatkowe dane. Kultura, etyka i zachowanie decydują o wydajności i skuteczności struktur. Skład zespołu odzwierciedla potrzebne umiejętności, a mandat i zasady działania określają polityki. Struktura może należeć do Ładu albo do Zarządzania – zależy to od jej składu i zakresu decyzji.</p><p>Przykład: komitet sterujący wdrożenia CRM w banku. Mandat: nadzór nad wdrożeniem. Wejście: comiesięczne raporty. Wynik: decyzje, np. przesunięcie terminu albo dodatkowy budżet. Po wdrożeniu komitet się rozwiązuje, co zamyka jego cykl życia. Komitet uczelni powołany bez mandatu po trzech miesiącach nie wiedział, o czym może decydować.</p>"},{"pt":"Sprawdź się","quiz":{"id":"q-en-04-02","sylabus":["EN-02-12"],"tresc":"Która dobra praktyka struktury organizacyjnej określa <b>granice</b> jej uprawnień decyzyjnych?","opcje":[{"t":"Zakres kontroli","ok":true,"w":"Struktury są jednostkami podejmowania decyzji. Określa się zasady działania, skład, zakres kontroli, poziom uprawnień, delegowanie oraz eskalację. Sylabus wymienia także podejmowanie decyzji. Wskazana odpowiedź odpowiada właśnie temu elementowi modelu."},{"t":"Procedury eskalacji","ok":false,"w":"To ścieżka przy problemach z decyzją."},{"t":"Zasady operacyjne","ok":false,"w":"To praktyczny sposób działania."},{"t":"Poziom uprawnień","ok":false,"w":"Poziom uprawnień to RODZAJ decyzji, które struktura może podjąć."}],"src":"COBIT 5 Framework (EN), sekcja załącznik G, aktywator 3; SYL EN-02-12","pomoc":{"t":"Pytanie dotyczy lekcji 2.25 „Aktywator 3 – Struktury organizacyjne: decyzje, mandat i cykl życia”. Cel lekcji: Potrafię powiedzieć, czym jest struktura organizacyjna, jaki jest jej wynik i jak wygląda jej cykl życia.","k":["struktury-organizacyjne"]},"kurs":"Struktury są jednostkami podejmowania decyzji. Określa się zasady działania, skład, zakres kontroli, poziom uprawnień, delegowanie oraz eskalację. Sylabus wymienia także podejmowanie decyzji. Wskazana odpowiedź odpowiada właśnie temu elementowi modelu.","kontekst":""}},{"lekcje":["en-k26-praktyki-struktur","en-k27-delegowanie-eskalacja"],"pt":"Lekcje 2.26–2.27","h":"Zakres kontroli to granice decyzji, poziom uprawnień – jakie decyzje wolno podjąć","b":"<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>Dobra praktyka</th><th>Pytanie</th></tr><tr><td><w k=\"zasady-operacyjne\">Zasady operacyjne</w></td><td>jak działamy?</td></tr><tr><td>Skład</td><td>kto jest członkiem?</td></tr><tr><td><w k=\"zakres-kontroli\">Zakres kontroli</w></td><td>granice decyzji?</td></tr><tr><td><w k=\"poziom-uprawnien\">Poziom uprawnień</w></td><td>jakie decyzje?</td></tr><tr><td><w k=\"delegowanie-uprawnien\">Delegowanie uprawnień</w></td><td>co oddajemy <b>w dół</b>?</td></tr><tr><td><w k=\"procedury-eskalacji\">Procedury eskalacji</w></td><td>co idzie <b>w górę</b>?</td></tr></table></div><p><b>Podejmowanie decyzji (Decision making):</b> jak dochodzimy do rozstrzygnięcia. Poziom uprawnień mówi, co wolno rozstrzygnąć; eskalacja wskazuje drogę, gdy nie można podjąć decyzji.</p>","c":"„Granice” to zakres kontroli, „struktura podległa” to delegowanie, „problem z podjęciem decyzji” to eskalacja.","s":"COBIT 5 Framework (PL), s. 75; sylabus PeopleCert v01.2, EN-02-12, s. 8","ctx":"<p>Pułapka nazw. W podręczniku są to: zasady działania, zakres (zasięg) kontroli, poziom decyzyjny, przekazywanie uprawnień. Na egzaminie: zasady operacyjne, zakres kontroli, poziom uprawnień, delegowanie uprawnień. Po angielsku: <span class=\"en\">operating principles, composition, span of control, level of authority, delegation of authority, escalation procedures</span>. Wszystkie sześć to <w k=\"dobre-praktyki-struktur\">dobre praktyki struktur</w>, a nie kultury. Czempioni należą do kultury.</p><p>Delegowanie przekazuje część uprawnień strukturom podległym. Procedura eskalacji to droga ustalona z góry na wypadek, gdy struktura nie może podjąć decyzji. Zasady operacyjne to praktyczne ustalenia: jak często się spotykamy i jak dokumentujemy prace.</p><p>Przykład: komitet ds. IT w szpitalu decyduje o systemach, a nie o lekach (zakres kontroli). Sam zatwierdza zakupy do 200 000 zł (poziom uprawnień). Gdy jego członkowie nie mogą się porozumieć, regulamin kieruje sprawę do zarządu (eskalacja).</p><p>Sylabus PeopleCert v01.2, EN-02-12, wymienia również Decision making. Przykład kursu: regulamin określa głosowanie i dokumentowanie rozstrzygnięć. Nie jest to tryb narzucony każdej strukturze przez COBIT 5.</p>"},{"pt":"Sprawdź się","quiz":{"id":"q-enk-26-2","sylabus":["EN-02-12"],"tresc":"Regulamin komitetu ds. inwestycji IT mówi: „spotkania w pierwszy wtorek miesiąca, protokół rozsyłany w trzy dni”. Którą dobrą praktykę struktury opisuje?","opcje":[{"t":"Skład","ok":false,"w":"Skład mówi, kto jest członkiem komitetu."},{"t":"Zasady operacyjne","ok":true,"w":"Dobrze. Częstotliwość spotkań i dokumentacja to zasady operacyjne."},{"t":"Procedury eskalacji","ok":false,"w":"Eskalacja dotyczy problemów z podjęciem decyzji."},{"t":"Zakres kontroli","ok":false,"w":"Zakres kontroli to granice decyzji."}],"src":"COBIT 5 Framework (EN), sekcja załącznik G, aktywator 3; SYL EN-02-12","pomoc":{"t":"Pytanie dotyczy lekcji 2.26 „Dobre praktyki struktur i podejmowanie decyzji”. Cel lekcji: Potrafię wymienić sześć dobrych praktyk struktur organizacyjnych i odróżnić zakres kontroli od poziomu uprawnień.","k":["dobre-praktyki-struktur","zasady-operacyjne","zakres-kontroli","poziom-uprawnien"]},"kurs":"Dobrze. Częstotliwość spotkań i dokumentacja to zasady operacyjne.","kontekst":""}},{"pt":"Arkusz próbny","sp1":"sp1-09","lekcja":"2.26","temat":"Dobre praktyki struktur i podejmowanie decyzji","k":["dobre-praktyki-struktur","zasady-operacyjne","zakres-kontroli","poziom-uprawnien"]},{"pt":"Sprawdź się","quiz":{"id":"q-enk-27-3","sylabus":["EN-02-12"],"tresc":"Która dobra praktyka struktur organizacyjnych opisuje <b>wymagane działania w przypadku problemów z podjęciem decyzji</b>?","opcje":[{"t":"Poziom uprawnień","ok":false,"w":"Poziom uprawnień to decyzje, które struktura może podjąć."},{"t":"Delegowanie uprawnień","ok":false,"w":"Delegowanie to przekazanie decyzji strukturom podległym."},{"t":"Procedury eskalacji","ok":true,"w":"Dobrze. Tak definiuje je podręcznik na s. 75."},{"t":"Zakres kontroli","ok":false,"w":"Zakres kontroli to granice uprawnień decyzyjnych."}],"src":"COBIT 5 Framework (EN), sekcja załącznik G, aktywator 3; SYL EN-02-12","pomoc":{"t":"Pytanie dotyczy lekcji 2.27 „Delegowanie uprawnień i procedury eskalacji – w dół i w górę”. Cel lekcji: Potrafię odróżnić delegowanie uprawnień (decyzje w dół) od procedury eskalacji (sprawa w górę).","k":["delegowanie-uprawnien","procedury-eskalacji"]},"kurs":"Dobrze. Tak definiuje je podręcznik na s. 75.","kontekst":""}}],"bankRevision":"0c228d8e9a3d5751","legacySp1Order":[null,null,null,null,{"sp1":"sp1-09"},null]};</script>
