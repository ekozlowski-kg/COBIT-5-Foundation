 nie budzi niepotrzebnego oporu).","ex":"Dobra reguła w kuchni działa, nie kosztuje fortuny i nie irytuje ludzi bez powodu. Haczyk SWN: Skuteczna, Wydajna, Nieinwazyjna.","org":""}},"fz-C-014":{"id":"fz-C-014","typ":"egzamin","s":"EN-02-05","t":"Który z poniższych NIE jest elementem, który musi opisywać struktura polityk?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 68"],"r":null,"zap":"","scen":"","o":[{"t":"Zakres i ważność – kogo i kiedy polityka dotyczy","ok":false,"w":"To element struktury polityk."},{"t":"Skutki nieprzestrzegania polityki","ok":false,"w":"To element struktury polityk."},{"t":"Nieinwazyjność polityki","ok":true,"w":"To cecha dobrej polityki, nie element struktury polityk."},{"t":"Sposób kontroli i pomiaru przestrzegania polityki","ok":false,"w":"To element struktury polityk."}],"fz":{"h":"Struktura polityk","p":"P1","pulapka":true,"n":"EN: Scope and validity; consequences of non-compliance; exception handling; compliance monitoring","q":"Jakie elementy musi opisywać struktura polityk?","a":"Zakres i ważność (podr. prawidłowość) – kogo i kiedy dotyczy; skutki nieprzestrzegania; obsługa wyjątków; sposób kontroli i pomiaru przestrzegania polityki.","ex":"Każdy regulamin kuchni mówi: kogo i gdzie dotyczy, co grozi za złamanie, kiedy wolno zrobić wyjątek i kto to sprawdza. Cztery rubryki: zakres, kara, wyjątek, kontrola.","org":""}},"fz-C-015":{"id":"fz-C-015","typ":"egzamin","s":"EN-02-05,EN-02-03","t":"Czym w COBIT 5 jest „zakres i ważność”?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 68"],"r":null,"zap":"","scen":"","o":[{"t":"Cechą dobrej polityki, obok skuteczności i wydajności","ok":false,"w":"Cechy dobrej polityki to: skuteczna, wydajna, nieinwazyjna."},{"t":"Elementem struktury polityk, obok konsekwencji, wyjątków i kontroli zgodności","ok":true,"w":"Fiszka wprost: to element struktury polityk."},{"t":"Kryterium, które muszą spełniać zasady","ok":false,"w":"Kryteria zasad to ograniczona liczba, prosty język i precyzja."},{"t":"Cechą struktur ramowych Ładu i Zarządzania","ok":false,"w":"Struktury ramowe mają być kompleksowe, otwarte, aktualne i dostępne."}],"fz":{"h":"Zakres i ważność","p":"P1","pulapka":true,"n":"EN: Policy framework elements vs good policy characteristics","q":"„Zakres i ważność” – cecha dobrej polityki czy element struktury polityk?","a":"Element struktury polityk (obok konsekwencji, wyjątków i kontroli zgodności). Cechy dobrej polityki to: skuteczna, wydajna, nieinwazyjna.","ex":"Cechy dobrej polityki to oceny regulaminu (SWN: skuteczna, wydajna, nieinwazyjna). Elementy struktury to rubryki w samym regulaminie: zakres, kary, wyjątki, kontrola.","org":""}},"fz-C-016":{"id":"fz-C-016","typ":"egzamin","s":"EN-02-05","t":"Jakie powinny być struktury ramowe Ładu i Zarządzania?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 67"],"r":null,"zap":"","scen":"","o":[{"t":"Kompleksowe, otwarte i elastyczne, aktualne oraz dostępne dla wszystkich zainteresowanych","ok":true,"w":"To cechy struktur ramowych z fiszki."},{"t":"Skuteczne, wydajne i nieinwazyjne","ok":false,"w":"To cechy dobrej polityki."},{"t":"Nieliczne i sformułowane prostym językiem","ok":false,"w":"To kryteria dla zasad."},{"t":"Poufne i dostępne wyłącznie dla organu Ładu","ok":false,"w":"Mają być dostępne dla wszystkich zainteresowanych."}],"fz":{"h":"Struktury ramowe Ładu i Zarządzania","p":"P2","pulapka":false,"n":"EN: Frameworks: comprehensive, open and flexible, current, available","q":"Jakie powinny być struktury ramowe Ładu i Zarządzania?","a":"Kompleksowe (obejmują całość), otwarte i elastyczne, aktualne oraz dostępne dla wszystkich zainteresowanych.","ex":"Jak księga procedur restauracji: obejmuje całą kuchnię, da się ją dopasować do nowego menu, jest aktualna i leży tam, gdzie każdy może zajrzeć.","org":""}},"fz-C-017":{"id":"fz-C-017","typ":"egzamin","s":"EN-02-05","t":"Która z poniższych jest dobrą praktyką dotyczącą polityk?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 68"],"r":null,"zap":"","scen":"","o":[{"t":"Polityki powstają niezależnie od zasad organizacji","ok":false,"w":"Polityki wynikają z zasad."},{"t":"Raz zatwierdzonej polityki się nie aktualizuje","ok":false,"w":"Polityki są regularnie odnawiane lub aktualizowane."},{"t":"Polityki stoją poza hierarchiczną strukturą ramową","ok":false,"w":"Polityki są częścią hierarchicznej struktury ramowej."},{"t":"Polityki pasują do apetytu na ryzyko organizacji","ok":true,"w":"Fiszka wymienia dopasowanie do apetytu na ryzyko."}],"fz":{"h":"Dobre praktyki polityk","p":"P2","pulapka":false,"n":"EN: Policy good practices","q":"Jakie dobre praktyki dotyczą polityk?","a":"Są częścią hierarchicznej struktury ramowej i wynikają z zasad; pasują do apetytu na ryzyko (ile ryzyka organizacja akceptuje); są regularnie odnawiane lub aktualizowane.","ex":"Regulamin kuchni wynika z zasad lokalu, pasuje do tego, ile ryzyka szef akceptuje (podajemy surową rybę czy nie), i co sezon się go przegląda.","org":""}},"fz-C-018":{"id":"fz-C-018","typ":"egzamin","s":"EN-02-04","t":"Co jest kluczowe w cyklu życia polityki?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 68"],"r":null,"zap":"","scen":"","o":[{"t":"Nieinwazyjność, by polityka nie budziła oporu","ok":false,"w":"To cecha dobrej polityki, nie klucz cyklu życia."},{"t":"Aktualność: aktualizacja, wiedza pracowników o zmianach, dostęp do najnowszej wersji, archiwizacja starych","ok":true,"w":"To klucz cyklu życia polityki według fiszki."},{"t":"Ograniczona liczba i prosty język","ok":false,"w":"To kryteria dla zasad."},{"t":"Oparcie na otwartych standardach branżowych","ok":false,"w":"To pryncypium otwartości architektury."}],"fz":{"h":"Cykl życia polityki","p":"P2","pulapka":false,"n":"EN: Policy life cycle","q":"Co jest kluczowe w cyklu życia polityki?","a":"Aktualność: czy i kiedy się ją aktualizuje, czy pracownicy wiedzą o zmianach, mają dostęp do najnowszej wersji, a nieaktualne wersje są archiwizowane lub usuwane.","ex":"Jak karta dań: po zmianie cen stara znika ze stołów, a wszyscy kelnerzy wiedzą o nowej. Najgorsze to dwie różne wersje w obiegu.","org":""}},"fz-C-019":{"id":"fz-C-019","typ":"egzamin","s":"EN-02-06","t":"Co jest najważniejszym środkiem realizacji polityk?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 68"],"r":null,"zap":"","scen":"","o":[{"t":"Praktyki i działania procesów","ok":true,"w":"Polityki mówią, co wolno i trzeba, a procesy to wykonują."},{"t":"Decyzje komitetu sterującego","ok":false,"w":"Komitety sterujące dają wytyczne programom i projektom, nie realizują polityk."},{"t":"Zachęty i nagrody dla pracowników","ok":false,"w":"To dobra praktyka kształtowania zachowań."},{"t":"Repozytorium architektury","ok":false,"w":"To dobra praktyka aktywatora Usługi, infrastruktura i aplikacje."}],"fz":{"h":"Polityki a inne aktywatory","p":"P2","pulapka":false,"n":"EN: Policies – relationships with other enablers; Processes execute policies","q":"Jak polityki wiążą się z innymi aktywatorami? Czym jest najważniejszy środek realizacji polityk?","a":"Odzwierciedlają kulturę i wartości etyczne; najważniejszym sposobem ich realizacji są praktyki i działania procesów; struktury ustalają i wdrażają polityki w swoim zakresie kontroli; polityki są też informacją. Polityki mówią, co wolno i trzeba, a procesy to wykonują.","ex":"Regulamin wyrasta z atmosfery lokalu, wykonuje się go, gotując według przepisów, ogłasza go szefostwo, a wisi na ścianie jako kartka, czyli informacja. Regulamin mówi „mięso trzymaj w 4°C”, a dopiero codzienne czynności w kuchni sprawiają, że tak jest. Polityka mówi, proces robi.","org":""}},"fz-C-020":{"id":"fz-C-020","typ":"egzamin","s":"EN-02-12","t":"Który z poniższych NIE jest dobrą praktyką struktur organizacyjnych?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 75"],"r":null,"zap":"","scen":"","o":[{"t":"Procedury eskalacji","ok":false,"w":"To dobra praktyka struktur."},{"t":"Delegowanie uprawnień","ok":false,"w":"To dobra praktyka struktur."},{"t":"Liczba podwładnych menedżera","ok":true,"w":"Na liście nie ma takiej praktyki; zakres kontroli to granice uprawnień, nie liczba podwładnych."},{"t":"Skład struktury","ok":false,"w":"To dobra praktyka struktur."}],"fz":{"h":"Dobre praktyki struktur organizacyjnych","p":"P2","pulapka":false,"n":"EN: Operating principles, composition, span of control, level of authority, delegation of authority, escalation procedures","q":"Jakie są dobre praktyki struktur organizacyjnych?","a":"Zasady operacyjne (podr. zasady działania), skład, zakres kontroli, poziom uprawnień (decyzyjnych), delegowanie uprawnień, procedury eskalacji; sylabus PeopleCert dodaje podejmowanie decyzji.","ex":"Opis każdego zespołu w kuchni: jak pracuje, kto w nim jest, o czym decyduje, co może oddać zastępcy i do kogo idzie, gdy sam nie rozstrzygnie.","org":""}},"fz-C-021":{"id":"fz-C-021","typ":"egzamin","s":"EN-02-12","t":"Czy „podejmowanie decyzji” jest dobrą praktyką struktury organizacyjnej?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["SYL EN02.12","FW-PL s. 75–76"],"r":null,"zap":"","scen":"","o":[{"t":"Nie – decyzje są wyłącznie produktem pracy struktury","ok":false,"w":"Jedno nie wyklucza drugiego: to dwa ujęcia, sposób decydowania i jego wynik."},{"t":"Nie – to jedna z cech dobrej polityki","ok":false,"w":"Cechy dobrej polityki to: skuteczna, wydajna, nieinwazyjna."},{"t":"Tak – ale tylko w strukturach ramowych z COBIT 4.1","ok":false,"w":"Sylabus wymienia je wprost przy strukturach organizacyjnych COBIT 5."},{"t":"Tak – sylabus PeopleCert (EN02.12) wymienia je wśród dobrych praktyk struktur","ok":true,"w":"Fiszka: to sposób decydowania; same decyzje są wynikiem pracy struktury."}],"fz":{"h":"Podejmowanie decyzji jako dobra praktyka","p":"P2","pulapka":true,"n":"EN: Organisational structure good practices; decisions are outputs","q":"Czy „podejmowanie decyzji” to dobra praktyka struktury organizacyjnej?","a":"Tak – sylabus PeopleCert (EN02.12) wymienia podejmowanie decyzji wśród dobrych praktyk struktur, obok zasad działania, zakresu kontroli, poziomu uprawnień, delegowania i eskalacji. Podręcznik pokazuje też decyzje jako główny produkt pracy struktury. To dwa ujęcia: sposób decydowania i jego wynik.","ex":"Rada rodzinna ma ustalony sposób podejmowania uchwał (praktyka), a same uchwały to wynik jej pracy. Jedno nie wyklucza drugiego.","org":""}},"fz-C-022":{"id":"fz-C-022","typ":"egzamin","s":"EN-02-12","t":"Czym są zasady operacyjne (podr. zasady działania) struktury organizacyjnej?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 75"],"r":null,"zap":"","scen":"","o":[{"t":"Granicami uprawnień decyzyjnych struktury","ok":false,"w":"To zakres kontroli."},{"t":"Praktycznymi ustaleniami działania struktury, np. częstotliwością zebrań, regułami dokumentowania, porządkiem obrad","ok":true,"w":"Tak definiuje je fiszka."},{"t":"Mandatem, czyli celem istnienia struktury","ok":false,"w":"Mandat definiuje się przy tworzeniu struktury; to nie zasady operacyjne."},{"t":"Drogą przekazania sprawy wyżej, gdy struktura nie może zdecydować","ok":false,"w":"To procedury eskalacji."}],"fz":{"h":"Zasady operacyjne struktury","p":"P2","pulapka":false,"n":"EN: Operating principles","q":"Czym są zasady operacyjne struktury?","a":"Praktycznymi ustaleniami działania struktury, np. częstotliwość zebrań, reguły dokumentowania i porządku obrad.","ex":"Jak regulamin porannej narady w kuchni: odprawa codziennie o 10:00, ktoś notuje ustalenia, wiadomo, o czym się rozmawia i w jakiej kolejności.","org":""}},"fz-C-023":{"id":"fz-C-023","typ":"egzamin","s":"EN-02-12","t":"Czym jest zakres kontroli (span of control) w COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 75"],"r":null,"zap":"","scen":"","o":[{"t":"Granicami uprawnień decyzyjnych struktury organizacyjnej","ok":true,"w":"Tak definiuje go COBIT 5."},{"t":"Liczbą podwładnych menedżera","ok":false,"w":"To klasyczna pułapka: w COBIT 5 nie chodzi o liczbę podwładnych."},{"t":"Przekazaniem uprawnień decyzyjnych strukturom podległym","ok":false,"w":"To delegowanie uprawnień."},{"t":"Zakresem audytu mechanizmów kontrolnych","ok":false,"w":"Audyt mechanizmów kontrolnych to kategoria umiejętności MEA, nie zakres kontroli."}],"fz":{"h":"Zakres kontroli","p":"P2","pulapka":true,"n":"EN: Span of control; Span of control ≠ number of subordinates","q":"Czym jest zakres kontroli (span of control)? Czy to liczba podwładnych menedżera?","a":"Granicami uprawnień decyzyjnych struktury organizacyjnej – nie liczbą podwładnych. W COBIT 5 to granice uprawnień decyzyjnych struktury organizacyjnej.","ex":"Kierownik sali decyduje o rezerwacjach, ale nie o menu. Zakres kontroli to płot wokół jego decyzji, a nie liczba kelnerów pod nim. Pułapka egzaminacyjna: „zakres kontroli” brzmi jak liczba podwładnych, ale w COBIT to płot wokół decyzji, czyli o czym dany zespół może rozstrzygać.","org":""}},"fz-C-024":{"id":"fz-C-024","typ":"egzamin","s":"EN-02-12","t":"Czym jest poziom uprawnień (podr. poziom decyzyjny) struktury?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 75"],"r":null,"zap":"","scen":"","o":[{"t":"Liczbą członków struktury","ok":false,"w":"To dotyczy składu struktury."},{"t":"Ustaleniami o częstotliwości zebrań i porządku obrad","ok":false,"w":"To zasady operacyjne."},{"t":"Decyzjami, do których podjęcia struktura jest uprawniona","ok":true,"w":"Tak definiuje go fiszka."},{"t":"Drogą przekazania sprawy wyżej, gdy struktura nie może zdecydować","ok":false,"w":"To procedury eskalacji."}],"fz":{"h":"Poziom uprawnień","p":"P2","pulapka":false,"n":"EN: Level of authority / decision rights","q":"Czym jest poziom uprawnień?","a":"Decyzjami, do których podjęcia struktura jest uprawniona (podr. poziom decyzyjny / uprawnienia decyzyjne).","ex":"Kucharz zmiany może sam zmienić dodatek do dania, ale nowe danie w karcie zatwierdza tylko szef. Chodzi o to, kto może podjąć jaką decyzję.","org":""}},"fz-C-025":{"id":"fz-C-025","typ":"egzamin","s":"EN-02-12","t":"Czym jest delegowanie uprawnień (podr. przekazywanie uprawnień)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 75"],"r":null,"zap":"","scen":"","o":[{"t":"Przekazaniem sprawy wyżej, gdy struktura nie umie podjąć decyzji","ok":false,"w":"To procedury eskalacji – ruch w górę, nie w dół."},{"t":"Wyznaczeniem przez zarząd komitetu ds. strategii","ok":false,"w":"To opis komitetu ds. strategii, nie delegowania."},{"t":"Określeniem granic, w jakich struktura może decydować","ok":false,"w":"To zakres kontroli."},{"t":"Przekazaniem przez strukturę jej uprawnień decyzyjnych (lub ich części) podległym strukturom","ok":true,"w":"Tak definiuje je fiszka."}],"fz":{"h":"Delegowanie uprawnień","p":"P2","pulapka":false,"n":"EN: Delegation of authority","q":"Czym jest delegowanie uprawnień?","a":"Przekazaniem przez strukturę jej uprawnień decyzyjnych (lub ich części) podległym strukturom. Podr.: przekazywanie uprawnień.","ex":"Szef kuchni przed urlopem mówi zastępcy: „zamówienia u dostawców zatwierdzasz ty”. Oddaje część swoich decyzji komuś niżej.","org":""}},"fz-C-026":{"id":"fz-C-026","typ":"egzamin","s":"EN-02-12","t":"Co opisują procedury eskalacji?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 75"],"r":null,"zap":"","scen":"","o":[{"t":"Przekazanie części uprawnień strukturom podległym","ok":false,"w":"To delegowanie uprawnień."},{"t":"Częstotliwość zebrań i porządek obrad","ok":false,"w":"To zasady operacyjne."},{"t":"Co zrobić, gdy struktura ma problem z podjęciem decyzji – drogę przekazania sprawy wyżej","ok":true,"w":"Tak opisuje je fiszka."},{"t":"Skutki nieprzestrzegania polityki","ok":false,"w":"To element struktury polityk."}],"fz":{"h":"Procedury eskalacji","p":"P2","pulapka":false,"n":"EN: Escalation procedures","q":"Czym są procedury eskalacji?","a":"Ustalona droga przekazania sprawy wyżej: opisuje, co trzeba zrobić, gdy struktura ma problem z podjęciem decyzji.","ex":"Kelner nie umie rozwiązać skargi, więc woła kierownika sali, a ten właściciela. Eskalacja to schody w górę, aż ktoś zdecyduje.","org":""}},"fz-C-027":{"id":"fz-C-027","typ":"egzamin","s":"EN-02-12","t":"Co definiuje się przy tworzeniu struktury organizacyjnej?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 75"],"r":null,"zap":"","scen":"","o":[{"t":"Mandat – po co struktura istnieje i jaki ma cel","ok":true,"w":"Fiszka: przy tworzeniu struktury definiuje się mandat."},{"t":"Pryncypia architektury","ok":false,"w":"To dobra praktyka aktywatora Usługi, infrastruktura i aplikacje."},{"t":"Cykl życia umiejętności","ok":false,"w":"To element aktywatora Ludzie, umiejętności i kompetencje."},{"t":"Architekturę docelową","ok":false,"w":"To przyszła zdolność usługowa, nie element tworzenia struktury."}],"fz":{"h":"Mandat i wyniki struktury","p":"P2","pulapka":false,"n":"EN: Mandate; outputs: decisions","q":"Co definiuje się przy tworzeniu struktury i co ona wytwarza?","a":"Mandat, czyli po co struktura istnieje i jaki ma cel. Decyzje podejmuje na podstawie wejść (zwykle informacji); jej wyniki to decyzje, informacje lub prośby o dodatkowe dane.","ex":"Komisja menu powstaje „po to, by co kwartał odświeżać kartę” – to mandat. Dostaje opinie gości i ceny, a wydaje decyzje: co zostaje, co znika.","org":""}},"fz-C-028":{"id":"fz-C-028","typ":"egzamin","s":"EN-02-12","t":"Co jest głównym produktem pracy struktury organizacyjnej?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 75","FW-PL s. 76"],"r":null,"zap":"","scen":"","o":[{"t":"Informacje, które struktura otrzymuje na wejściu","ok":false,"w":"Informacje są zwykle wejściem, a nie głównym produktem."},{"t":"Decyzje (a także informacje i prośby o dodatkowe dane)","ok":true,"w":"Fiszka: wchodzą informacje, wychodzą decyzje."},{"t":"Usługi IT dla użytkowników","ok":false,"w":"Usługi IT zapewnia aktywator Usługi, infrastruktura i aplikacje."},{"t":"Wartość wynikająca z wiedzy","ok":false,"w":"To ostatni element cyklu informacji."}],"fz":{"h":"Produkt pracy struktury","p":"P2","pulapka":true,"n":"EN: Structures output decisions; Mandate; outputs: decisions","q":"Co jest produktem pracy struktury organizacyjnej?","a":"Decyzje (a także informacje i żądania dodatkowych danych). Wejściem są zwykle informacje. Przy tworzeniu struktury definiuje się mandat, czyli po co struktura istnieje i jaki ma cel.","ex":"Narada szefów kuchni nie gotuje zup – jej produktem są decyzje, np. nowe menu. Wchodzą informacje, wychodzą decyzje. Komisja menu dostaje opinie gości i ceny, a wydaje decyzje: co zostaje, co znika.","org":""}},"fz-C-029":{"id":"fz-C-029","typ":"egzamin","s":"EN-02-13","t":"Co według COBIT 5 łączy działania procesów ze strukturami i rolami?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 75"],"r":null,"zap":"","scen":"","o":[{"t":"Repozytorium architektury","ok":false,"w":"Repozytorium przechowuje wyniki prac architektonicznych."},{"t":"Cykl informacji","ok":false,"w":"Cykl informacji opisuje drogę od procesów biznesowych do wartości."},{"t":"Tabela RACI","ok":true,"w":"Fiszka: RACI łączy działania procesów ze strukturami i rolami."},{"t":"Struktura polityk","ok":false,"w":"Struktura polityk określa mandat i zasady działania, nie wiąże działań z rolami."}],"fz":{"h":"Struktury a inne aktywatory","p":"P2","pulapka":false,"n":"EN: Organisational structures – relationships","q":"Jak struktury wiążą się z innymi aktywatorami?","a":"RACI łączy działania procesów ze strukturami i rolami; kultura i zachowanie decydują o skuteczności decyzji; skład powinien odzwierciedlać umiejętności; mandat i zasady działania określa struktura polityk.","ex":"RACI to tabela „kto robi, kto odpowiada, kogo zapytać, kogo powiadomić”. Komisja menu działa, gdy ma właściwych ludzi, dobrą atmosferę i spisany regulamin.","org":""}},"fz-C-030":{"id":"fz-C-030","typ":"egzamin","s":"EN-02-13","t":"Czy role z Rysunku 33 trzeba wdrożyć w organizacji?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 76"],"r":null,"zap":"","scen":"","o":[{"t":"Tak – COBIT 5 wymaga wszystkich tych ról w każdej organizacji","ok":false,"w":"Role nie muszą odpowiadać rzeczywistym funkcjom."},{"t":"Nie – mają charakter ilustracyjny, choć opis ich celu pasuje do większości organizacji","ok":true,"w":"Tak mówi fiszka o Rysunku 33."},{"t":"Tak – ale tylko w dużych organizacjach","ok":false,"w":"Fiszka nie wprowadza takiego wymogu; role są ilustracyjne."},{"t":"Nie – a opisy ich celu nie pasują do większości organizacji","ok":false,"w":"Opis celu ról jest trafny dla większości organizacji."}],"fz":{"h":"Rysunek 33 – role ilustracyjne","p":"P2","pulapka":false,"n":"EN: Figure 33 is illustrative","q":"Czy role z Rysunku 33 trzeba wdrożyć w organizacji?","a":"Nie. Mają charakter ilustracyjny i nie muszą odpowiadać rzeczywistym funkcjom; ich opis celu jest jednak trafny dla większości organizacji.","ex":"To przykładowy schemat stanowisk, jak wzorcowy plan lokalu w poradniku gastronomii: nie musisz mieć każdego stanowiska, ale opisy ich zadań pasują prawie wszędzie.","org":""}},"fz-C-031":{"id":"fz-C-031","typ":"egzamin","s":"EN-02-13","t":"Kto zwykle przewodniczy komitetowi ds. strategii (wykonawczemu IT)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 76"],"r":null,"zap":"","scen":"","o":[{"t":"CIO","ok":false,"w":"To pułapka: CIO doradza, ale zwykle nie przewodniczy komitetowi."},{"t":"CISO","ok":false,"w":"CISO odpowiada za bezpieczeństwo informacji, nie prowadzi tego komitetu."},{"t":"Kierownik PMO","ok":false,"w":"PMO wspiera kierowników programów i projektów."},{"t":"Członek zarządu","ok":true,"w":"Fiszka: przewodniczy zwykle członek zarządu, a nie CIO."}],"fz":{"h":"Komitet ds. strategii (wykonawczy IT)","p":"P2","pulapka":false,"n":"EN: IT strategy committee; Chaired by a board member, not the CIO","q":"Czym jest komitet ds. strategii (wykonawczy IT) i kto mu przewodniczy?","a":"Grupa najwyższych kierowników wyznaczona przez zarząd, by włączać go w kluczowe decyzje IT; rozlicza się z portfeli (zestawów) inwestycji, usług i zasobów IT. Przewodniczy zwykle członek zarządu, nie CIO.","ex":"Jak rada właścicieli sieci restauracji decydująca o drogich inwestycjach. Prowadzi ją ktoś z zarządu, nie szef techniki – żeby nie oceniał sam siebie. Kierownik techniczny siedzi przy stole, ale nie przewodniczy. Zarząd trzyma ster, CIO doradza.","org":""}},"fz-C-032":{"id":"fz-C-032","typ":"egzamin","s":"EN-02-13","t":"Czym zajmują się komitety sterujące (programów i projektów)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 76"],"r":null,"zap":"","scen":"","o":[{"t":"Wytycznymi dla programów i projektów: planami, przydziałem zasobów, korzyściami i ryzykiem","ok":true,"w":"Tak opisuje je fiszka."},{"t":"Wytycznymi w sprawach architektury korporacyjnej","ok":false,"w":"To zadanie Rady ds. Architektury."},{"t":"Wspólnym stanowiskiem ws. ryzyka całego przedsiębiorstwa (ERM)","ok":false,"w":"To komitet ds. zarządzania ryzykiem w przedsiębiorstwie."},{"t":"Audytami wewnętrznymi","ok":false,"w":"To zadanie Audytu."}],"fz":{"h":"Komitety sterujące","p":"P2","pulapka":false,"n":"EN: Steering (programmes/projects) committees","q":"Czym zajmują się komitety sterujące?","a":"Wytycznymi dla programów i projektów: zarządzanie planami i ich monitorowanie, przydział zasobów, dostarczanie korzyści i wartości, ryzyko programów i projektów.","ex":"Jak ekipa nadzorująca remont lokalu: pilnuje planu, przydziela ludzi i pieniądze, sprawdza, czy remont się opłaci, i ostrzega przed wpadkami.","org":""}},"fz-C-033":{"id":"fz-C-033","typ":"egzamin","s":"EN-02-13","t":"Czym zajmuje się Rada ds. Architektury?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 76"],"r":null,"zap":"","scen":"","o":[{"t":"Prowadzeniem sekretariatu portfela inwestycji i usług","ok":false,"w":"To zadanie VMO."},{"t":"Wytycznymi w sprawach architektury korporacyjnej oraz tworzeniem polityk i standardów architektury","ok":true,"w":"Tak opisuje ją fiszka."},{"t":"Wspieraniem kierowników programów i projektów","ok":false,"w":"To zadanie PMO."},{"t":"Bezpieczeństwem informacji we wszystkich formach","ok":false,"w":"To odpowiedzialność CISO."}],"fz":{"h":"Rada ds. Architektury","p":"P2","pulapka":false,"n":"EN: Architecture board","q":"Czym zajmuje się Rada ds. Architektury?","a":"Wytycznymi w sprawach architektury korporacyjnej (jak systemy firmy do siebie pasują) oraz tworzeniem polityk i standardów architektury.","ex":"Jak główny architekt sieci restauracji: pilnuje, by każda nowa kuchnia miała pasujący do reszty układ i sprzęt, i spisuje standardy.","org":""}},"fz-C-034":{"id":"fz-C-034","typ":"egzamin","s":"EN-02-13","t":"Czym zajmuje się komitet ds. zarządzania ryzykiem w przedsiębiorstwie?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 76"],"r":null,"zap":"","scen":"","o":[{"t":"Wyłącznie ryzykiem pojedynczych programów i projektów","ok":false,"w":"Ryzykiem programów i projektów zajmują się komitety sterujące."},{"t":"Wytycznymi zgodności z wymogami prawnymi i umownymi","ok":false,"w":"To zadanie funkcji Zgodność."},{"t":"Zarządzaniem finansami i rzetelną rachunkowością","ok":false,"w":"To odpowiedzialność CFO."},{"t":"Uzgadnianiem wspólnego stanowiska kadry kierowniczej w zarządzaniu ryzykiem całego przedsiębiorstwa (ERM)","ok":true,"w":"Tak opisuje go fiszka; może mieć pod sobą radę ds. ryzyka IT."}],"fz":{"h":"Komitet ds. zarządzania ryzykiem w przedsiębiorstwie","p":"P2","pulapka":false,"n":"EN: Enterprise risk committee","q":"Czym zajmuje się komitet ds. zarządzania ryzykiem w przedsiębiorstwie?","a":"Współpracą i uzgadnianiem wspólnego stanowiska kadry kierowniczej, potrzebnego do działań i decyzji w zarządzaniu ryzykiem całego przedsiębiorstwa (ERM); może mieć pod sobą radę ds. ryzyka IT.","ex":"Narada kierowników o zagrożeniach całej firmy: pożar, zatrucie, utrata dostawcy. Uzgadniają wspólne stanowisko; awariami systemów może zająć się osobna, mniejsza rada.","org":""}},"fz-C-035":{"id":"fz-C-035","typ":"egzamin","s":"EN-02-13","t":"Które przypisanie zadań do PMO i VMO jest zgodne z COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 77"],"r":null,"zap":"","scen":"","o":[{"t":"VMO – sekretariat portfela inwestycji i usług, ocena szans i uzasadnień biznesowych","ok":true,"w":"Fiszka: V jak value, czyli wartość."},{"t":"PMO – ocena uzasadnień biznesowych i raportowanie tworzenia wartości","ok":false,"w":"To zadania VMO, nie PMO."},{"t":"VMO – wsparcie kierowników programów i projektów","ok":false,"w":"To zadanie PMO."},{"t":"PMO – tworzenie polityk i standardów architektury","ok":false,"w":"To zadanie Rady ds. Architektury."}],"fz":{"h":"PMO i VMO","p":"P2","pulapka":false,"n":"EN: Project and programme management office; value management office","q":"Czym zajmują się PMO i VMO?","a":"PMO (biuro projektów): wspiera kierowników programów i projektów; zbiera, ocenia i raportuje informacje o ich przebiegu. VMO (biuro wartości): sekretariat portfela inwestycji i usług – ocenia szanse i uzasadnienia biznesowe, raportuje tworzenie wartości.","ex":"PMO to biuro, które pilnuje wszystkich remontów naraz i raportuje postępy. VMO liczy, czy nowy lokal się opłaci. P jak projekty, V jak value, czyli wartość.","org":""}},"fz-C-036":{"id":"fz-C-036","typ":"egzamin","s":"EN-02-13","t":"Za co odpowiada właściciel procesu biznesowego?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 76"],"r":null,"zap":"","scen":"","o":[{"t":"Za audyty wewnętrzne","ok":false,"w":"To zadanie Audytu."},{"t":"Za wytyczne zgodności z wymogami prawnymi, regulacyjnymi i umownymi","ok":false,"w":"To zadanie funkcji Zgodność."},{"t":"Za osiąganie celów procesu, jego doskonalenie i zatwierdzanie zmian","ok":true,"w":"Tak opisuje tę rolę fiszka."},{"t":"Za dopasowanie strategii IT do strategii biznesowej","ok":false,"w":"To odpowiedzialność CIO."}],"fz":{"h":"Audyt, Zgodność, właściciel procesu biznesowego","p":"P2","pulapka":false,"n":"EN: Audit, compliance, business process owner","q":"Za co odpowiadają Audyt, Zgodność i właściciel procesu biznesowego?","a":"Audyt: audyty wewnętrzne. Zgodność: wytyczne zgodności z wymogami prawnymi, regulacyjnymi i umownymi. Właściciel procesu biznesowego: osiąganie celów procesu, jego doskonalenie i zatwierdzanie zmian.","ex":"Audyt to wewnętrzny inspektor, który sprawdza kuchnię. Zgodność pilnuje przepisów sanepidu i umów. Właściciel procesu „ma” dany przepis: ulepsza go i zatwierdza zmiany.","org":""}},"fz-C-037":{"id":"fz-C-037","typ":"egzamin","s":"EN-02-13","t":"Za co odpowiada CIO?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 76"],"r":null,"zap":"","scen":"","o":[{"t":"Za przewodniczenie komitetowi ds. strategii (wykonawczemu IT)","ok":false,"w":"Komitetowi przewodniczy zwykle członek zarządu, nie CIO."},{"t":"Za wszystkie aspekty zarządzania ryzykiem w organizacji","ok":false,"w":"To odpowiedzialność CRO."},{"t":"Za bezpieczeństwo informacji we wszystkich formach","ok":false,"w":"To odpowiedzialność CISO."},{"t":"Za dopasowanie strategii IT do biznesowej oraz planowanie, optymalizację zasobów i dostarczanie usług IT","ok":true,"w":"Tak opisuje tę rolę fiszka."}],"fz":{"h":"CIO","p":"P2","pulapka":false,"n":"EN: Chief Information Officer","q":"Za co odpowiada CIO?","a":"Za dopasowanie strategii IT do strategii biznesowej oraz za planowanie, optymalizację zasobów i dostarczanie usług i rozwiązań IT wspierających cele organizacji.","ex":"CIO to szef całej techniki w sieci restauracji: dba, by kasy i systemy zamówień służyły planom firmy, a nie żyły własnym życiem.","org":""}},"fz-C-038":{"id":"fz-C-038","typ":"egzamin","s":"EN-02-13","t":"Za co odpowiada CRO?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 76"],"r":null,"zap":"","scen":"","o":[{"t":"Za wszystkie aspekty zarządzania ryzykiem w organizacji","ok":true,"w":"Fiszka: R jak ryzyko."},{"t":"Za ryzyko finansowe, kontrole i rzetelną rachunkowość","ok":false,"w":"To odpowiedzialność CFO."},{"t":"Za bezpieczeństwo informacji we wszystkich formach","ok":false,"w":"To odpowiedzialność CISO."},{"t":"Za funkcjonowanie organizacji","ok":false,"w":"To odpowiedzialność COO."}],"fz":{"h":"CFO, CRO, CISO","p":"P2","pulapka":false,"n":"EN: CFO, CRO, CISO","q":"Za co odpowiadają CFO, CRO i CISO?","a":"CFO: zarządzanie finansami, ryzyko finansowe i kontrole, rzetelna rachunkowość. CRO: wszystkie aspekty zarządzania ryzykiem w organizacji. CISO: bezpieczeństwo informacji we wszystkich formach.","ex":"CFO – kasa i księgowość (F jak finanse). CRO – wszystkie zagrożenia (R jak ryzyko). CISO – ochrona informacji w każdej postaci, także na papierze (S jak security).","org":""}},"fz-C-039":{"id":"fz-C-039","typ":"egzamin","s":"EN-02-15","t":"Jak COBIT 5 definiuje kulturę?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 91"],"r":null,"zap":"","scen":"","o":[{"t":"Jako ogólne zamierzenia formalnie spisane przez kierownictwo","ok":false,"w":"To definicja polityki."},{"t":"Jako wzorzec zachowań, poglądów, założeń, postaw i sposobów działania","ok":true,"w":"To definicja z fiszki (FW-PL s. 91)."},{"t":"Jako wartości osobiste wynikające z religii i pochodzenia","ok":false,"w":"To opis etyki indywidualnej."},{"t":"Jako wartości i podstawowe przekonania organizacji","ok":false,"w":"To definicja zasady."}],"fz":{"h":"Definicja kultury","p":"P2","pulapka":false,"n":"EN: Culture","q":"Jak COBIT 5 definiuje kulturę?","a":"Wzorzec zachowań, poglądów, założeń, postaw i sposobów działania.","ex":"Kultura to „jak się u nas robi”: czy w kuchni pomaga się nowym i sprząta po sobie. Pięć słów: zachowania, poglądy, założenia, postawy, sposoby działania.","org":""}},"fz-C-040":{"id":"fz-C-040","typ":"egzamin","s":"EN-02-15","t":"Na jakich poziomach określa się cele aktywatora Kultura, etyka i zachowanie?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 79"],"r":null,"zap":"","scen":"","o":[{"t":"Jakość wewnętrzna, jakość kontekstowa, jakość bezpieczeństwa","ok":false,"w":"To kategorie celów aktywatora Informacja."},{"t":"Wytwórca, opiekun, konsument","ok":false,"w":"To role interesariuszy informacji."},{"t":"Etyka organizacyjna, etyka indywidualna, zachowania indywidualne","ok":true,"w":"Te trzy poziomy razem tworzą kulturę organizacji."},{"t":"Zasady, polityki, struktury ramowe","ok":false,"w":"To elementy innego aktywatora."}],"fz":{"h":"Poziomy celów kultury, etyki i zachowania","p":"P2","pulapka":false,"n":"EN: Organisational ethics, individual ethics, individual behaviour","q":"Na jakich poziomach określa się cele tego aktywatora?","a":"Etyka organizacyjna (wartości organizacji), etyka indywidualna (wartości osobiste), zachowania indywidualne – łącznie tworzące kulturę organizacji.","ex":"Trzy piętra: wartości restauracji („tylko świeże produkty”), wartości kucharza (uczciwość wyniesiona z domu) i to, co faktycznie robi przy garach. Razem dają atmosferę lokalu.","org":""}},"fz-C-041":{"id":"fz-C-041","typ":"egzamin","s":"EN-02-15","t":"Od czego w dużej mierze zależy etyka indywidualna?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 79"],"r":null,"zap":"","scen":"","o":[{"t":"Od czynników zewnętrznych: religii, pochodzenia, statusu społeczno-ekonomicznego, regionu i doświadczeń","ok":true,"w":"Fiszka: firma tych wartości nie wymyśla."},{"t":"Od polityk zatwierdzonych przez zarząd","ok":false,"w":"Polityki kształtują zachowania w organizacji, a etyka indywidualna przychodzi z zewnątrz."},{"t":"Od zachęt i nagród w organizacji","ok":false,"w":"To dobra praktyka kształtowania zachowań, nie źródło etyki indywidualnej."},{"t":"Od mandatu struktury organizacyjnej","ok":false,"w":"Mandat określa cel struktury, nie wartości osobiste."}],"fz":{"h":"Etyka indywidualna","p":"P2","pulapka":false,"n":"EN: Individual ethics","q":"Od czego zależy etyka indywidualna?","a":"W dużej mierze od czynników zewnętrznych: religii, pochodzenia, statusu społeczno-ekonomicznego, regionu i doświadczeń osobistych.","ex":"Każdy kucharz przynosi wartości z zewnątrz: wiarę, wychowanie, zamożność rodziny, miejsce, z którego pochodzi, i to, co przeżył. Firma ich nie wymyśla.","org":""}},"fz-C-042":{"id":"fz-C-042","typ":"egzamin","s":"EN-02-15","t":"Który przykład to zachowanie indywidualne istotne dla Ładu według COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 79"],"r":null,"zap":"","scen":"","o":[{"t":"Częstotliwość zebrań komitetu","ok":false,"w":"To zasady operacyjne struktury."},{"t":"Wybór architektury docelowej","ok":false,"w":"To element aktywatora Usługi, infrastruktura i aplikacje."},{"t":"Wskaźnik rotacji personelu","ok":false,"w":"To cel aktywatora Ludzie, umiejętności i kompetencje."},{"t":"Zachowanie wobec negatywnych wyników (nauka czy szukanie winnych)","ok":true,"w":"Fiszka wymienia je obok zachowania wobec ryzyka i przestrzegania polityk."}],"fz":{"h":"Zachowania indywidualne istotne dla Ładu","p":"P2","pulapka":false,"n":"EN: Risk-taking, policy compliance, behaviour on negative outcomes","q":"Podaj przykłady zachowań indywidualnych istotnych dla Ładu.","a":"Zachowanie wobec ryzyka (ile ryzyka przyjąć), przestrzeganie polityk, zachowanie wobec negatywnych wyników (nauka czy szukanie winnych).","ex":"Czy kucharz zaryzykuje nowy przepis w sobotni wieczór, czy trzyma się regulaminu i czy po wpadce szuka przyczyny, czy winnego. Haczyk: ryzyko, reguły, porażka.","org":""}},"fz-C-043":{"id":"fz-C-043","typ":"egzamin","s":"EN-02-14","t":"Który z poniższych NIE jest dobrą praktyką kształtowania pożądanych zachowań?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 80"],"r":null,"zap":"","scen":"","o":[{"t":"Zachęty i nagrody","ok":false,"w":"To dobra praktyka kształtowania zachowań."},{"t":"Delegowanie uprawnień","ok":true,"w":"To dobra praktyka struktur organizacyjnych, nie kształtowania zachowań."},{"t":"Przykład kierownictwa i czempionów","ok":false,"w":"To dobra praktyka kształtowania zachowań (świadomość)."},{"t":"Egzekwowanie wymagań","ok":false,"w":"To dobra praktyka kształtowania zachowań."}],"fz":{"h":"Dobre praktyki kształtowania zachowań","p":"P2","pulapka":false,"n":"EN: Communication, enforcement, incentives and rewards, awareness, rules and norms, champions","q":"Jakie są dobre praktyki kształtowania pożądanych zachowań?","a":"Komunikowanie zachowań i wartości; świadomość przez przykład kierownictwa i czempionów (podr. osoby wspierające, czyli wzory do naśladowania); zachęty i nagrody oraz środki zniechęcające do zachowań niepożądanych; reguły i normy; egzekwowanie wymagań.","ex":"Szef sam myje ręce przed gotowaniem, nagradza porządek, wiesza zasady na ścianie i reaguje, gdy ktoś je łamie. Mówić, pokazywać, nagradzać, pilnować.","org":""}},"fz-C-044":{"id":"fz-C-044","typ":"egzamin","s":"EN-02-16","t":"Jak kultura wiąże się z innymi aktywatorami według COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 80"],"r":null,"zap":"","scen":"","o":[{"t":"Decyzje struktur są wdrażane niezależnie od zachęt","ok":false,"w":"Fiszka: decyzje struktur nie są wdrażane bez zachęt."},{"t":"Zasady i polityki nie mają związku z wartościami","ok":false,"w":"Zasady i polityki komunikują wartości i pożądane zachowania."},{"t":"Nawet doskonały proces nie da wyników, gdy ludzie nie chcą go stosować","ok":true,"w":"Tak opisuje to powiązanie fiszka."},{"t":"Kultura wpływa tylko na aktywatory będące zasobami","ok":false,"w":"Kultura wpływa też na procesy, struktury i polityki."}],"fz":{"h":"Kultura a inne aktywatory","p":"P2","pulapka":false,"n":"EN: Culture – relationships","q":"Jak kultura wiąże się z innymi aktywatorami?","a":"Nawet doskonały proces nie da wyników, gdy ludzie nie chcą go stosować; decyzje struktur nie są wdrażane bez zachęt; zasady i polityki komunikują wartości i pożądane zachowania.","ex":"Najlepszy przepis nie uratuje dania, jeśli kucharzowi się nie chce. Decyzja szefa bez zachęty i przekonania zespołu łatwo zostaje na kartce.","org":""}},"fz-C-045":{"id":"fz-C-045","typ":"egzamin","s":"EN-02-18","t":"Jaka jest kolejność elementów cyklu informacji (Rysunek 35)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 81"],"r":null,"zap":"","scen":"","o":[{"t":"Procesy biznesowe → dane → informacje → wiedza → wartość","ok":true,"w":"Wartość z kolei ukierunkowuje procesy biznesowe."},{"t":"Dane → informacje → wiedza → mądrość → wartość","ok":false,"w":"Mądrości nie ma w cyklu, a brakuje procesów biznesowych."},{"t":"Planowanie → projektowanie → budowanie/nabywanie → użytkowanie → ocena → aktualizacja","ok":false,"w":"To cykl życia informacji, nie cykl informacji."},{"t":"Dane → procesy biznesowe → wiedza → informacje → wartość","ok":false,"w":"Kolejność jest zła: z danych powstają informacje, a z nich wiedza."}],"fz":{"h":"Cykl informacji (Rysunek 35)","p":"P1","pulapka":true,"n":"EN: Information cycle: business processes → data → information → knowledge → value","q":"Czym jest cykl informacji (Rysunek 35)?","a":"Pięć elementów w kole: procesy biznesowe → dane → informacje → wiedza → wartość; wartość z kolei ukierunkowuje procesy biznesowe. Nie myl z cyklem życia informacji (6 grup etapów).","ex":"Kelner zapisuje zamówienia (dane), szef widzi, co się sprzedaje (informacja), rozumie, że goście lubią zupy (wiedza), i zmienia menu, zarabiając więcej (wartość).","org":""}},"fz-C-046":{"id":"fz-C-046","typ":"egzamin","s":"EN-02-18","t":"Która faza cyklu życia informacji obejmuje przechowywanie, udostępnianie i wykorzystanie?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 82"],"r":null,"zap":"","scen":"","o":[{"t":"Budowanie/nabywanie","ok":false,"w":"To faza poprzedzająca użytkowanie."},{"t":"Użytkowanie/obsługa","ok":true,"w":"Fiszka wpisuje te czynności do fazy Użytkowanie/obsługa."},{"t":"Ocena/monitorowanie","ok":false,"w":"To faza następująca po użytkowaniu."},{"t":"Aktualizacja/pozbywanie się","ok":false,"w":"To ostatnia faza cyklu życia."}],"fz":{"h":"Cykl życia informacji","p":"P1","pulapka":true,"n":"EN: Information life cycle","q":"Podaj fazy cyklu życia informacji.","a":"Planowanie → Projektowanie → Budowanie/nabywanie → Użytkowanie/obsługa (przechowywanie, udostępnianie, wykorzystanie) → Ocena/monitorowanie → Aktualizacja/pozbywanie się.","ex":"Jak z kartą dań: planujesz ją, projektujesz, drukujesz, kładziesz na stoły, sprawdzasz, czy goście ją rozumieją, a potem poprawiasz albo wyrzucasz.","org":""}},"fz-C-047":{"id":"fz-C-047","typ":"egzamin","s":"EN-02-18","t":"Jakie ogólne role interesariuszy informacji wyróżnia COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 82"],"r":null,"zap":"","scen":"","o":[{"t":"Wykonawca, odpowiedzialny decyzyjnie, konsultant, informowany","ok":false,"w":"To role w tabeli RACI."},{"t":"Etyka organizacyjna, etyka indywidualna, zachowanie","ok":false,"w":"To poziomy celów aktywatora Kultura, etyka i zachowanie."},{"t":"Wytwórca, opiekun, konsument","ok":true,"w":"Role zależą od fazy cyklu życia informacji."},{"t":"Właściciel procesu, audytor, regulator","ok":false,"w":"Fiszka nie wymienia takich ról interesariuszy informacji."}],"fz":{"h":"Role interesariuszy informacji","p":"P2","pulapka":false,"n":"EN: Information producer, custodian, consumer","q":"Jakie ogólne role interesariuszy informacji wyróżnia COBIT 5?","a":"Wytwórca (tworzy informacje), opiekun (przechowuje i utrzymuje), konsument (korzysta z informacji). Role zależą od fazy cyklu życia.","ex":"Zamówienie: kelner je zapisuje (wytwórca), kierownik przechowuje bloczki (opiekun), kucharz z nich gotuje (konsument). Pisze, trzyma, korzysta.","org":""}},"fz-C-048":{"id":"fz-C-048","typ":"egzamin","s":"EN-02-17","t":"Do której kategorii jakości informacji COBIT 5 należy wiarygodność?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 82"],"r":null,"zap":"","scen":"","o":[{"t":"Do jakości kontekstowej","ok":false,"w":"Kontekstowa to np. istotność, kompletność, aktualność."},{"t":"Do jakości reprezentacji","ok":false,"w":"Reprezentacja to np. zwięzłe i spójne przedstawienie."},{"t":"Do jakości bezpieczeństwa/dostępności","ok":false,"w":"Ta kategoria to dostępność i ograniczony dostęp."},{"t":"Do jakości wewnętrznej (podr. rzeczywistej)","ok":true,"w":"Razem z dokładnością, obiektywnością i reputacją (DOWR)."}],"fz":{"h":"Jakość wewnętrzna informacji","p":"P1","pulapka":true,"n":"EN: Intrinsic quality: accuracy, objectivity, believability, reputation; Believability = intrinsic","q":"Co obejmuje jakość wewnętrzna informacji (podr. rzeczywista)? Wiarygodność informacji – do której kategorii jakości COBIT 5 należy?","a":"Dokładność, obiektywność, wiarygodność, reputację – zgodność wartości danych z prawdą. Wiarygodność należy do jakości wewnętrznej (rzeczywistej), razem z dokładnością, obiektywnością i reputacją.","ex":"Czy zapis na bloczku jest prawdziwy: dokładny, bez zmyślania, godny wiary i od kelnera z dobrą opinią. Haczyk DOWR: Dokładność, Obiektywność, Wiarygodność, Reputacja. Wiarygodność to cecha samej informacji – czy można jej wierzyć, niezależnie od sytuacji.","org":""}},"fz-C-049":{"id":"fz-C-049","typ":"egzamin","s":"EN-02-17","t":"Która cecha należy do jakości kontekstowej i jakości reprezentacji informacji?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 82"],"r":null,"zap":"","scen":"","o":[{"t":"Dokładność","ok":false,"w":"Dokładność należy do jakości wewnętrznej."},{"t":"Obiektywność","ok":false,"w":"Obiektywność należy do jakości wewnętrznej."},{"t":"Ograniczony dostęp","ok":false,"w":"To jakość bezpieczeństwa/dostępności."},{"t":"Kompletność","ok":true,"w":"Fiszka wymienia kompletność obok istotności i aktualności."}],"fz":{"h":"Jakość kontekstowa i reprezentacji","p":"P1","pulapka":false,"n":"EN: Contextual and representational quality","q":"Co obejmuje jakość kontekstowa i jakość reprezentacji informacji?","a":"Istotność, kompletność, aktualność, odpowiednia ilość, zwięzłe przedstawienie, spójne przedstawienie, możliwość interpretacji, jasność przekazu (zrozumiałość), łatwość posługiwania się.","ex":"Kontekstowa: czy informacja pasuje do potrzeby (na temat, pełna, świeża, w sam raz). Reprezentacji: czy podano ją czytelnie, jak dobrze napisana karta dań.","org":""}},"fz-C-050":{"id":"fz-C-050","typ":"egzamin","s":"EN-02-17","t":"Co obejmuje jakość bezpieczeństwa/dostępności informacji?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 82"],"r":null,"zap":"","scen":"","o":[{"t":"Dostępność/terminowość i ograniczony dostęp","ok":true,"w":"Informacja ma być dostępna, gdy trzeba, ale tylko dla upoważnionych."},{"t":"Dokładność i reputację","ok":false,"w":"To jakość wewnętrzna."},{"t":"Istotność i kompletność","ok":false,"w":"To jakość kontekstowa."},{"t":"Zwięzłe i spójne przedstawienie","ok":false,"w":"To jakość reprezentacji."}],"fz":{"h":"Jakość bezpieczeństwa/dostępności","p":"P1","pulapka":false,"n":"EN: Security/accessibility quality: availability, restricted access","q":"Co obejmuje jakość bezpieczeństwa/dostępności informacji?","a":"Dostępność/terminowość (informacja dostępna, gdy potrzeba) oraz ograniczony dostęp (tylko dla upoważnionych).","ex":"Zeszyt z przepisami szefa: ma być pod ręką, gdy kucharz go potrzebuje, ale zamknięty przed konkurencją. Dostępny dla swoich, niedostępny dla obcych.","org":""}},"fz-C-051":{"id":"fz-C-051","typ":"egzamin","s":"EN-02-17","t":"Które z poniższych NIE należy do siedmiu kryteriów informacji z COBIT 4.1?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 63"],"r":null,"zap":"","scen":"","o":[{"t":"Integralność","ok":false,"w":"To jedno z siedmiu kryteriów COBIT 4.1."},{"t":"Zgodność","ok":false,"w":"To jedno z siedmiu kryteriów COBIT 4.1."},{"t":"Reputacja","ok":true,"w":"Reputacja to cel jakości wewnętrznej w COBIT 5, nie kryterium COBIT 4.1."},{"t":"Wiarygodność","ok":false,"w":"To jedno z siedmiu kryteriów COBIT 4.1."}],"fz":{"h":"Siedem kryteriów informacji COBIT 4.1","p":"P2","pulapka":true,"n":"EN: COBIT 4.1 information criteria","q":"Podaj siedem kryteriów informacji z COBIT 4.1.","a":"Skuteczność, wydajność, poufność, integralność, dostępność, zgodność, wiarygodność.","ex":"Weź znane z bezpieczeństwa trio PID (Poufność, Integralność, Dostępność), dołóż z przodu SW (Skuteczność, Wydajność), a na końcu ZW (Zgodność, Wiarygodność).","org":""}},"fz-C-052":{"id":"fz-C-052","typ":"egzamin","s":"EN-02-17","t":"Czym jest wydajność informacji według kryteriów COBIT 4.1?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 63"],"r":null,"zap":"","scen":"","o":[{"t":"Informacja pozwala odbiorcy wykonać jego zadanie (informacja jako produkt)","ok":false,"w":"To skuteczność."},{"t":"Informację zdobywa się i wykorzystuje małym nakładem czasu, pieniędzy i wysiłku (informacja jako usługa)","ok":true,"w":"Tak fiszka opisuje wydajność."},{"t":"Informacja jest dostępna tylko dla upoważnionych","ok":false,"w":"To poufność, w COBIT 5 ograniczony dostęp."},{"t":"Informacja jest kompletna i dokładna","ok":false,"w":"To odpowiednik integralności w COBIT 5."}],"fz":{"h":"Skuteczność i wydajność informacji (COBIT 4.1)","p":"P2","pulapka":false,"n":"EN: COBIT 4.1 effectiveness, efficiency","q":"Czym są skuteczność i wydajność informacji (kryteria COBIT 4.1)?","a":"Skuteczność: informacja pozwala odbiorcy wykonać jego zadanie (informacja jako produkt). Wydajność: taką informację zdobywa się i wykorzystuje małym nakładem czasu, pieniędzy i wysiłku (informacja jako usługa).","ex":"Skuteczny przepis pozwala ugotować danie. Wydajny – znajdziesz go w 10 sekund, a nie po godzinie przekopywania sterty kartek.","org":""}},"fz-C-053":{"id":"fz-C-053","typ":"egzamin","s":"EN-02-17","t":"Na co w COBIT 5 rozkłada się kryterium integralności z COBIT 4.1?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 63","FW-PL s. 82"],"r":null,"zap":"","scen":"","o":[{"t":"Na ograniczony dostęp","ok":false,"w":"Na ograniczony dostęp przeszła poufność."},{"t":"Na wiarygodność, reputację i obiektywność","ok":false,"w":"Na te trzy cechy rozpisano wiarygodność."},{"t":"Na cele kompletności i dokładności","ok":true,"w":"Integralność to kryterium COBIT 4.1, w COBIT 5 rozkłada się na te dwa cele."},{"t":"Na dostępność/terminowość","ok":false,"w":"To odpowiednik kryterium dostępności."}],"fz":{"h":"Kryteria COBIT 4.1 w COBIT 5","p":"P2","pulapka":true,"n":"EN: Mapping COBIT 4.1 criteria to COBIT 5 quality goals; Integrity → completeness, accuracy","q":"Jak kryteria COBIT 4.1 odwzorowano w COBIT 5? Integralność – kategoria jakości COBIT 5 czy kryterium COBIT 4.1?","a":"Integralność → kompletność i dokładność; poufność → ograniczony dostęp; dostępność → dostępność; zgodność → ujęta w każdym celu jakości; wiarygodność → wiarygodność, reputacja, obiektywność. Integralność to kryterium COBIT 4.1; w COBIT 5 rozkłada się na cele kompletności i dokładności.","ex":"Stare słowa rozpisano na nowe: „integralność” to teraz „kompletna i dokładna”, „poufność” – „ograniczony dostęp”, a „wiarygodność” rozbito na trzy cechy. W COBIT 5 pytasz: czy rachunek jest kompletny (wszystkie pozycje) i dokładny (dobre ceny)?","org":""}},"fz-C-054":{"id":"fz-C-054","typ":"egzamin","s":"EN-02-08","t":"Jak mają się kategorie celów procesu do kategorii celów aktywatora?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 69"],"r":null,"zap":"","scen":"","o":[{"t":"Są identyczne: proces też ma Jakość wewnętrzną, Jakość kontekstową, Dostęp i Bezpieczeństwo","ok":false,"w":"Logika jest ta sama, ale nazwy kategorii procesu są inne."},{"t":"Proces ma cele wiodące i cele opóźnione","ok":false,"w":"To rodzaje wskaźników, nie kategorie celów procesu."},{"t":"Proces ma cele organizacji, cele związane z IT i cele aktywatorów","ok":false,"w":"To poziomy kaskady celów."},{"t":"Ta sama logika, inne nazwy: proces ma Cele wewnętrzne, Cele kontekstowe, Cele dostępności i bezpieczeństwa","ok":true,"w":"Aktywator mówi „Jakość…”, proces mówi „Cele…”."}],"fz":{"h":"Kategorie celów procesu a aktywatora","p":"P2","pulapka":true,"n":"EN: Enabler goal categories vs process goal categories","q":"Kategorie celów procesu a kategorie celów aktywatora – czy to to samo?","a":"Ta sama logika, inne nazwy. Aktywator ogólnie: Jakość wewnętrzna, Jakość kontekstowa, Dostęp i Bezpieczeństwo. Proces: Cele wewnętrzne, Cele kontekstowe, Cele dostępności i bezpieczeństwa.","ex":"Te same trzy szuflady pod innymi etykietami: jakość samej rzeczy, przydatność w danej sytuacji, dostęp i ochrona. Aktywator mówi „Jakość…”, proces mówi „Cele…”.","org":""}},"fz-C-055":{"id":"fz-C-055","typ":"egzamin","s":"EN-02-19","t":"Które z poniższych jest jednym z trzech zastosowań modelu informacji w przykładach podręcznika?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 84"],"r":null,"zap":"","scen":"","o":[{"t":"Określenie wymaganej ochrony informacji","ok":true,"w":"Fiszka wymienia też specyfikację informacji i łatwość korzystania z danych."},{"t":"Wyznaczenie przewodniczącego komitetu ds. strategii","ok":false,"w":"To sprawa struktur organizacyjnych, nie modelu informacji."},{"t":"Ustalenie zakresu kontroli struktury","ok":false,"w":"To dobra praktyka struktur organizacyjnych."},{"t":"Wybór między nabyciem a samodzielnym tworzeniem rozwiązania","ok":false,"w":"To pryncypium architektury."}],"fz":{"h":"Zastosowania modelu informacji","p":"P2","pulapka":false,"n":"EN: Information model uses","q":"Podaj trzy zastosowania modelu informacji z przykładów podręcznika.","a":"Określenie specyfikacji informacji (np. dla nowej aplikacji), określenie wymaganej ochrony, określenie łatwości korzystania z danych (przegląd jakości informacji).","ex":"Jak lista kontrolna przy zamawianiu nowego systemu kasy: co ma zawierać informacja, jak ją chronić i czy łatwo z niej korzystać.","org":""}},"fz-C-056":{"id":"fz-C-056","typ":"egzamin","s":"EN-02-21","t":"Czym jest zdolność usługowa (podr. zdolność do świadczenia usług)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 85"],"r":null,"zap":"","scen":"","o":[{"t":"Poziomem usług uzgodnionym z dostawcą","ok":false,"w":"Poziomy usług to osobna dobra praktyka."},{"t":"Zasobami, takimi jak aplikacje i infrastruktura, wykorzystywanymi do świadczenia usług IT","ok":true,"w":"Tak definiuje ją fiszka."},{"t":"Umiejętnościami personelu Service Desk","ok":false,"w":"To aktywator Ludzie, umiejętności i kompetencje."},{"t":"Kolejnymi etapami dojścia do architektury docelowej","ok":false,"w":"To architektura przejściowa."}],"fz":{"h":"Zdolność usługowa","p":"P2","pulapka":false,"n":"EN: Service capabilities","q":"Czym jest zdolność usługowa?","a":"Zasobami, takimi jak aplikacje i infrastruktura, wykorzystywanymi do świadczenia usług związanych z IT. Podr.: zdolność do świadczenia usług.","ex":"To sprzęt i programy, którymi restauracja obsługuje gości: kasa, system rezerwacji, kuchenka. Czyli czym dysponujesz, żeby móc świadczyć usługę.","org":""}},"fz-C-057":{"id":"fz-C-057","typ":"egzamin","s":"EN-02-20","t":"Czy architektura referencyjna (EN baseline) opisuje stan obecny czy docelowy?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 85"],"r":null,"zap":"","scen":"","o":[{"t":"Docelowy – to przyszła, planowana zdolność usługowa","ok":false,"w":"Przyszłą zdolność opisuje architektura docelowa."},{"t":"Ani jeden, ani drugi – to etapy pośrednie","ok":false,"w":"Etapy pośrednie opisuje architektura przejściowa."},{"t":"Ani jeden, ani drugi – to inna nazwa modelu referencyjnego procesów","ok":false,"w":"Fiszka ostrzega, by nie mylić jej z modelem referencyjnym."},{"t":"Obecny – to architektura bazowa, czyli bieżąca zdolność usługowa","ok":true,"w":"Polski podręcznik nazywa baseline architekturą referencyjną."}],"fz":{"h":"Architektura docelowa, referencyjna, przejściowa","p":"P2","pulapka":true,"n":"EN: Target, baseline (reference), transition architecture; Reference (baseline) = current","q":"Czym różnią się architektura docelowa, referencyjna i przejściowa? Architektura referencyjna – stan obecny czy docelowy?","a":"Docelowa: przyszła, planowana zdolność usługowa. Referencyjna (EN baseline, bazowa): obecna zdolność dostarczająca bieżących usług – nie mylić z modelem referencyjnym. Przejściowa: kolejne etapy dojścia od bazowej do docelowej. Polski podręcznik nazywa referencyjną architekturę bazową (EN baseline), czyli bieżącą zdolność usługową.","ex":"Remont kuchni: jak jest dziś (referencyjna), jak ma być po remoncie (docelowa) i etapy po drodze (przejściowa). Dziś – po drodze – jutro. Referencyjna to punkt odniesienia, czyli to, co już stoi – stan obecny.","org":""}},"fz-C-058":{"id":"fz-C-058","typ":"egzamin","s":"EN-02-20","t":"Która z poniższych jest dobrą praktyką aktywatora Usługi, infrastruktura i aplikacje?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 85"],"r":null,"zap":"","scen":"","o":[{"t":"Procedury eskalacji","ok":false,"w":"To dobra praktyka struktur organizacyjnych."},{"t":"Repozytorium (archiwum) architektury","ok":true,"w":"Fiszka wymienia też pryncypia, punkty widzenia i poziomy usług."},{"t":"Zachęty i nagrody","ok":false,"w":"To dobra praktyka kształtowania zachowań."},{"t":"Struktura polityk z obsługą wyjątków","ok":false,"w":"To element aktywatora Zasady, polityki i struktury ramowe."}],"fz":{"h":"Dobre praktyki usług, infrastruktury i aplikacji","p":"P2","pulapka":false,"n":"EN: Architecture principles, viewpoints, repository, service levels","q":"Jakie są dobre praktyki dla usług, infrastruktury i aplikacji?","a":"Pryncypia (zasady) architektury; punkty widzenia architektury, czyli sposoby jej opisu (modele, katalogi, macierze); repozytorium (archiwum) architektury; poziomy usług do zdefiniowania i osiągnięcia przez dostawców.","ex":"Remont sieci lokali: ogólne zasady budowy, rysunki i spisy sprzętu, jedno archiwum planów i umowa z serwisem „naprawa pieca w 4 godziny”.","org":""}},"fz-C-059":{"id":"fz-C-059","typ":"egzamin","s":"EN-02-20","t":"Które z poniższych NIE jest jednym z pięciu przykładowych pryncypiów architektury w COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 86"],"r":null,"zap":"","scen":"","o":[{"t":"Kompleksowość","ok":true,"w":"To cecha struktur ramowych, nie pryncypium architektury."},{"t":"Ponowne wykorzystanie","ok":false,"w":"To jedno z pięciu pryncypiów."},{"t":"Zwinność","ok":false,"w":"To jedno z pięciu pryncypiów."},{"t":"Otwartość","ok":false,"w":"To jedno z pięciu pryncypiów."}],"fz":{"h":"Pięć pryncypiów architektury","p":"P1","pulapka":false,"n":"EN: Reuse, buy vs build, simplicity, agility, openness","q":"Podaj pięć pryncypiów architektury.","a":"Pięć przykładów podanych w COBIT 5: ponowne wykorzystanie, nabywanie lub samodzielne tworzenie, prostota, zwinność, otwartość.","ex":"Urządzając kuchnię: używaj tego, co już masz, kupuj zamiast budować, prosto, z myślą o zmianach, na standardowe części. Haczyk: „Ponownie Nabyłem Prosty Zwinny Otwieracz”.","org":""}},"fz-C-060":{"id":"fz-C-060","typ":"egzamin","s":"EN-02-20","t":"Co mówi pryncypium ponownego wykorzystania?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 86"],"r":null,"zap":"","scen":"","o":[{"t":"Rozwiązania należy nabywać, chyba że jest zatwierdzony powód, by je tworzyć","ok":false,"w":"To pryncypium nabywania lub samodzielnego tworzenia."},{"t":"Architektura ma być możliwie najprostsza przy spełnieniu wymagań","ok":false,"w":"To pryncypium prostoty."},{"t":"Wspólne komponenty architektury powinny być używane przy projektowaniu i wdrażaniu rozwiązań","ok":true,"w":"Dotyczy rozwiązań w architekturze docelowej lub przejściowej."},{"t":"Architektura ma się opierać na otwartych standardach branżowych","ok":false,"w":"To pryncypium otwartości."}],"fz":{"h":"Ponowne wykorzystanie","p":"P2","pulapka":false,"n":"EN: Reuse","q":"Co mówi pryncypium ponownego wykorzystania?","a":"Wspólne komponenty architektury powinny być używane przy projektowaniu i wdrażaniu rozwiązań w architekturze docelowej lub przejściowej.","ex":"Nowy lokal dostaje ten sam sprawdzony piec i system kasowy co pozostałe, zamiast wymyślać wszystko od zera.","org":""}},"fz-C-061":{"id":"fz-C-061","typ":"egzamin","s":"EN-02-20","t":"Co mówi pryncypium nabywania lub samodzielnego tworzenia?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 86"],"r":null,"zap":"","scen":"","o":[{"t":"Rozwiązania należy tworzyć samodzielnie, chyba że zakup jest tańszy","ok":false,"w":"Jest odwrotnie: domyślnie się nabywa."},{"t":"O wyborze decyduje zawsze sam CIO, bez uzasadnienia","ok":false,"w":"Pryncypium wymaga zatwierdzonego powodu, by tworzyć samodzielnie."},{"t":"Rozwiązania należy nabywać, chyba że istnieje zatwierdzony powód, by opracować je w organizacji","ok":true,"w":"Domyślnie: kupuj."},{"t":"Wspólne komponenty należy używać w nowych rozwiązaniach","ok":false,"w":"To pryncypium ponownego wykorzystania."}],"fz":{"h":"Nabywanie lub samodzielne tworzenie","p":"P2","pulapka":false,"n":"EN: Buy vs build","q":"Co mówi pryncypium nabywania lub samodzielnego tworzenia?","a":"Rozwiązania należy nabywać, chyba że istnieje zatwierdzony powód, by opracować je w organizacji.","ex":"Kupujesz gotową zmywarkę, a nie konstruujesz własnej, chyba że szefostwo zatwierdziło ważny powód. Domyślnie: kupuj.","org":""}},"fz-C-062":{"id":"fz-C-062","typ":"egzamin","s":"EN-02-20","t":"Co oznacza pryncypium zwinności architektury?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 86"],"r":null,"zap":"","scen":"","o":[{"t":"Architektura jest możliwie najprostsza przy spełnieniu wymagań","ok":false,"w":"To pryncypium prostoty."},{"t":"Architektura skutecznie i wydajnie spełnia zmieniające się potrzeby biznesu","ok":true,"w":"Tak fiszka opisuje zwinność."},{"t":"Architektura opiera się na otwartych standardach branżowych","ok":false,"w":"To pryncypium otwartości."},{"t":"Wspólne komponenty używa się w nowych rozwiązaniach","ok":false,"w":"To pryncypium ponownego wykorzystania."}],"fz":{"h":"Prostota, zwinność, otwartość","p":"P2","pulapka":false,"n":"EN: Simplicity, agility, openness","q":"Co mówią pryncypia prostoty, zwinności i otwartości?","a":"Prostota: architektura możliwie najprostsza przy spełnieniu wymagań. Zwinność: skutecznie i wydajnie spełnia zmieniające się potrzeby biznesu. Otwartość: oparta na otwartych standardach branżowych.","ex":"Kuchnia ma być prosta, ale wystarczająca; łatwa do przestawienia pod nowe menu; na standardowe części pasujące do sprzętu wielu producentów.","org":""}},"fz-C-063":{"id":"fz-C-063","typ":"egzamin","s":"EN-02-21","t":"Jak Usługi, infrastruktura i aplikacje wiążą się z innymi aktywatorami?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 86"],"r":null,"zap":"","scen":"","o":[{"t":"Informacja jest jedną ze zdolności usługowych wykorzystywanych przez procesy","ok":true,"w":"Tak opisuje to powiązanie fiszka."},{"t":"Zdolności usługowe nie mogą być wejściami ani wyjściami praktyk","ok":false,"w":"Wejścia i wyjścia praktyk mogą obejmować zdolności usługowe."},{"t":"Kultura ukierunkowana na usługi nie wymaga określonych zachowań","ok":false,"w":"Fiszka: kultura ukierunkowana na usługi wymaga zachowań."},{"t":"Usługi zastępują struktury organizacyjne w podejmowaniu decyzji","ok":false,"w":"Decyzje podejmują struktury organizacyjne."}],"fz":{"h":"Usługi a inne aktywatory","p":"P2","pulapka":false,"n":"EN: Services – relationships","q":"Jak usługi wiążą się z innymi aktywatorami?","a":"Informacja jest jedną ze zdolności usługowych, wykorzystywanych przez procesy; kultura ukierunkowana na usługi wymaga zachowań; wejścia i wyjścia praktyk mogą obejmować zdolności usługowe.","ex":"System zamówień przechowuje bloczki (informacja), z których korzysta kuchnia (proces), a obsługa nastawiona na gościa wymaga odpowiedniego zachowania kelnerów (kultura).","org":""}},"fz-C-064":{"id":"fz-C-064","typ":"egzamin","s":"EN-02-22","t":"Co należy do celów aktywatora Ludzie, umiejętności i kompetencje?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 87"],"r":null,"zap":"","scen":"","o":[{"t":"Zakres kontroli struktury","ok":false,"w":"To dobra praktyka struktur organizacyjnych."},{"t":"Ograniczony dostęp do informacji","ok":false,"w":"To cel jakości bezpieczeństwa informacji."},{"t":"Zgodność z otwartymi standardami branżowymi","ok":false,"w":"To pryncypium otwartości architektury."},{"t":"Dostępność personelu i wskaźnik rotacji","ok":true,"w":"Fiszka wymienia je obok wykształcenia, umiejętności, doświadczenia i wiedzy."}],"fz":{"h":"Cele aktywatora Ludzie, umiejętności i kompetencje","p":"P2","pulapka":false,"n":"EN: People, skills and competencies – goals","q":"Czego dotyczą cele aktywatora Ludzie, Umiejętności i Kompetencje?","a":"Wykształcenia i kwalifikacji, umiejętności technicznych, doświadczenia, wiedzy, umiejętności behawioralnych (np. współpraca); także dostępności personelu i wskaźnika rotacji (odejść z pracy).","ex":"Kucharz: dyplom szkoły, umie filetować rybę, ma lata praktyki, zna przepisy, dogaduje się z zespołem. Liczy się też, czy jest w grafiku i czy ludzie nie odchodzą.","org":""}},"fz-C-065":{"id":"fz-C-065","typ":"egzamin","s":"EN-02-22","t":"Który etap należy do cyklu życia umiejętności?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 87"],"r":null,"zap":"","scen":"","o":[{"t":"Archiwizowanie nieaktualnych wersji polityk","ok":false,"w":"To element cyklu życia polityki."},{"t":"Pozbywanie się umiejętności, np. po automatyzacji lub outsourcingu","ok":true,"w":"Fiszka wymienia ten etap obok planowania, rozwijania, wdrażania i oceny."},{"t":"Delegowanie uprawnień podległym strukturom","ok":false,"w":"To dobra praktyka struktur organizacyjnych."},{"t":"Przekształcanie danych w informacje i wiedzę","ok":false,"w":"To cykl informacji."}],"fz":{"h":"Cykl życia umiejętności","p":"P2","pulapka":false,"n":"EN: Skills life cycle","q":"Jak wygląda cykl życia umiejętności?","a":"Wgląd w obecną bazę i planowanie; rozwijanie (szkolenia) lub pozyskiwanie (rekrutacja); wdrażanie w rolach; pozbywanie się (np. po automatyzacji, outsourcingu); okresowa (np. roczna) ocena bazy.","ex":"Sprawdzasz, co umie zespół, uczysz albo zatrudniasz, przydzielasz do stanowisk, rezygnujesz z niepotrzebnych umiejętności (np. po kupnie maszyny do pierogów), co rok oceniasz.","org":""}},"fz-C-066":{"id":"fz-C-066","typ":"egzamin","s":"EN-02-22","t":"Jaka jest dobra praktyka dla umiejętności i kompetencji?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 87"],"r":null,"zap":"","scen":"","o":[{"t":"Zdefiniowanie mandatu dla każdej roli","ok":false,"w":"Mandat definiuje się dla struktury organizacyjnej."},{"t":"Przypisanie jednego odpowiedzialnego decyzyjnie (A) do każdej umiejętności","ok":false,"w":"Jeden A dotyczy praktyk w tabeli RACI."},{"t":"Oparcie wymagań wyłącznie na stażu pracy","ok":false,"w":"Wymagania mają być obiektywne, z poziomami i definicjami umiejętności."},{"t":"Zdefiniowanie obiektywnych wymagań umiejętności dla każdej roli, np. z użyciem SFIA","ok":true,"w":"Fiszka: poziomy i definicje umiejętności, zewnętrzne źródła jak SFIA."}],"fz":{"h":"Dobre praktyki dla umiejętności i kompetencji","p":"P2","pulapka":false,"n":"EN: Skill requirements per role; SFIA","q":"Jakie są dobre praktyki dla umiejętności i kompetencji?","a":"Zdefiniowanie obiektywnych wymagań umiejętności dla każdej roli: poziomy umiejętności w kategoriach umiejętności i definicje umiejętności; zewnętrzne źródła, np. SFIA.","ex":"Dla każdego stanowiska w kuchni spisujesz, co trzeba umieć i na jakim poziomie, np. „kucharz od sushi: poziom 3”. Można sięgnąć po gotowy katalog, np. SFIA.","org":""}},"fz-C-067":{"id":"fz-C-067","typ":"egzamin","s":"EN-02-23","t":"Jakie kategorie umiejętności Rysunek 39 przypisuje do domeny MEA?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 88"],"r":null,"zap":"","scen":"","o":[{"t":"Weryfikacja zgodności, monitorowanie wydajności, audyt mechanizmów kontrolnych","ok":true,"w":"MEA to sprawdzanie: kontrolerzy."},{"t":"Ład IT w organizacji","ok":false,"w":"To kategoria przypisana do EDM."},{"t":"Strategia IT, architektura korporacyjna, innowacje","ok":false,"w":"To kategorie APO."},{"t":"Zarządzanie dostępnością, Service Desk i incydenty","ok":false,"w":"To kategorie DSS."}],"fz":{"h":"Kategorie umiejętności EDM i MEA (Rysunek 39)","p":"P1","pulapka":false,"n":"EN: Skill categories EDM, MEA","q":"Jakie kategorie umiejętności przypisano do EDM i MEA (Rysunek 39)?","a":"EDM: Ład IT w organizacji. MEA: weryfikacja zgodności, monitorowanie wydajności, audyt mechanizmów kontrolnych.","ex":"EDM (Ład, sama góra): umiejętność rządzenia IT. MEA (sprawdzanie): kontrolerzy – zgodność, wyniki, audyt. Jak właściciel lokalu i inspektor sanepidu.","org":""}},"fz-C-068":{"id":"fz-C-068","typ":"egzamin","s":"EN-02-23","t":"Do której domeny Rysunek 39 przypisuje kategorię umiejętności „zarządzanie portfelami”?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 88"],"r":null,"zap":"","scen":"","o":[{"t":"EDM","ok":false,"w":"EDM ma jedną kategorię: Ład IT w organizacji."},{"t":"BAI","ok":false,"w":"BAI to np. analiza biznesowa i zarządzanie projektami."},{"t":"APO","ok":true,"w":"APO obejmuje m.in. strategię IT, zarządzanie finansowe i portfelami."},{"t":"MEA","ok":false,"w":"MEA to weryfikacja zgodności, monitorowanie wydajności i audyt."}],"fz":{"h":"Kategorie umiejętności APO (Rysunek 39)","p":"P1","pulapka":false,"n":"EN: Skill categories APO","q":"Jakie kategorie umiejętności przypisano do APO (Rysunek 39)?","a":"Opracowanie polityki IT, strategia IT, architektura korporacyjna, innowacje, zarządzanie finansowe, zarządzanie portfelami.","ex":"APO to planowanie i organizowanie – jak planowanie nowej restauracji: regulaminy, strategia, układ lokalu, nowe pomysły, budżet i wybór, w co inwestować.","org":""}},"fz-C-069":{"id":"fz-C-069","typ":"egzamin","s":"EN-02-23","t":"Do której domeny Rysunek 39 przypisuje kategorię umiejętności „analiza biznesowa”?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 88"],"r":null,"zap":"","scen":"","o":[{"t":"BAI","ok":true,"w":"BAI obejmuje m.in. analizę biznesową, zarządzanie projektami i programowanie."},{"t":"APO","ok":false,"w":"APO to np. strategia IT, innowacje i zarządzanie portfelami."},{"t":"DSS","ok":false,"w":"DSS to np. zarządzanie problemami i eksploatacja IT."},{"t":"EDM","ok":false,"w":"EDM ma jedną kategorię: Ład IT w organizacji."}],"fz":{"h":"Kategorie umiejętności BAI (Rysunek 39)","p":"P1","pulapka":false,"n":"EN: Skill categories BAI","q":"Jakie kategorie umiejętności przypisano do BAI (Rysunek 39)?","a":"Analiza biznesowa, zarządzanie projektami, ocena użyteczności, definiowanie wymagań i zarządzanie nimi, programowanie, ergonomia systemu, wycofanie oprogramowania, zarządzanie pojemnością.","ex":"BAI to budowanie – jak stawianie nowego lokalu: analiza potrzeb, kierowanie budową, wygoda gości, lista wymagań, wykonanie, rozbiórka starego i miejsce na odpowiednią liczbę gości.","org":""}},"fz-C-070":{"id":"fz-C-070","typ":"egzamin","s":"EN-02-23","t":"Do której domeny Rysunek 39 przypisuje kategorię umiejętności „administrowanie bazami danych”?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 88"],"r":null,"zap":"","scen":"","o":[{"t":"BAI","ok":false,"w":"BAI to np. programowanie i wycofanie oprogramowania."},{"t":"APO","ok":false,"w":"APO to np. architektura korporacyjna i zarządzanie finansowe."},{"t":"MEA","ok":false,"w":"MEA to weryfikacja zgodności, monitorowanie wydajności i audyt."},{"t":"DSS","ok":true,"w":"DSS obejmuje m.in. eksploatację IT i administrowanie bazami danych."}],"fz":{"h":"Kategorie umiejętności DSS (Rysunek 39)","p":"P1","pulapka":false,"n":"EN: Skill categories DSS","q":"Jakie kategorie umiejętności przypisano do DSS (Rysunek 39)?","a":"Zarządzanie dostępnością, zarządzanie problemami, Service Desk i incydenty, administracja bezpieczeństwa, eksploatacja IT, administrowanie bazami danych.","ex":"DSS to codzienna praca – jak obsługa otwartej restauracji: lokal czynny, szukanie przyczyn usterek, przyjmowanie skarg, ochrona, praca kuchni i porządek w spiżarni (bazy danych).","org":""}},"fz-C-071":{"id":"fz-C-071","typ":"egzamin","s":"EN-02-23","t":"Do których domen Rysunek 39 przypisuje kategorie umiejętności „zarządzanie dostępnością” i „zarządzanie pojemnością”?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 88"],"r":null,"zap":"","scen":"","o":[{"t":"Obie – BAI, bo łączy je proces BAI04","ok":false,"w":"BAI04 łączy obie, ale Rysunek 39 dotyczy umiejętności, nie procesów."},{"t":"Dostępność – DSS, pojemność – BAI","ok":true,"w":"Rysunek 39 przypisuje kategorie umiejętności, nie procesy."},{"t":"Obie – DSS","ok":false,"w":"Pojemność jest w Rysunku 39 przypisana do BAI."},{"t":"Dostępność – BAI, pojemność – DSS","ok":false,"w":"Odwrotnie: dostępność to DSS, pojemność to BAI."}],"fz":{"h":"Zarządzanie dostępnością a pojemnością (Rysunek 39)","p":"P2","pulapka":true,"n":"EN: Availability DSS, capacity BAI (skills)","q":"Zarządzanie dostępnością a zarządzanie pojemnością – które domeny (Rysunek 39)?","a":"Dostępność – DSS, pojemność – BAI, choć proces BAI04 łączy obie. Rysunek 39 przypisuje kategorie umiejętności, nie procesy.","ex":"Dostępność to „lokal czynny” – codzienna obsługa (DSS). Pojemność to „ile stolików zbudować” – budowanie (BAI). Rysunek 39 dotyczy umiejętności, nie procesów.","org":""}},"fz-C-072":{"id":"fz-C-072","typ":"egzamin","s":"EN-02-10","t":"Czym różni się praktyka od działania?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 70"],"r":null,"zap":"","scen":"","o":[{"t":"Praktyka mówi, JAK to zrobić; działanie – CO trzeba osiągnąć","ok":false,"w":"Odwrotnie: praktyka to CO, działanie to JAK."},{"t":"Działanie to szczegółowa instrukcja z ITIL lub PRINCE2","ok":false,"w":"To opis szczegółowego działania, poziom niżej."},{"t":"Praktyka mówi, CO trzeba osiągnąć; działanie – JAK, czyli konieczne i wystarczające kroki","ok":true,"w":"Tak rozróżnia je fiszka."},{"t":"Praktyka i działanie to synonimy","ok":false,"w":"To dwa różne poziomy opisu procesu."}],"fz":{"h":"Praktyka, działanie, szczegółowe działanie","p":"P1","pulapka":true,"n":"EN: Practice vs activity vs detailed activity","q":"Praktyka, działanie, szczegółowe działanie – czym się różnią?","a":"Praktyka: CO trzeba osiągnąć (ogólne wymagania). Działanie: JAK – konieczne i wystarczające kroki do wdrożenia praktyki. Szczegółowe działanie: jeszcze niżej, z ITIL, ISO/IEC 27000, PRINCE2.","ex":"Praktyka: „podać ciepłą zupę” (CO). Działanie: „podgrzej, nalej, zanieś” (JAK). Szczegółowe działanie: dokładna instrukcja z zewnętrznego poradnika (np. ITIL).","org":""}},"fz-C-073":{"id":"fz-C-073","typ":"egzamin","s":"EN-01-01,EN-02-10","t":"Jaką hierarchię mają proces, praktyka i działanie?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 27","FW-PL s. 69","FW-PL s. 93"],"r":null,"zap":"","scen":"","o":[{"t":"Praktyka obejmuje procesy, a procesy rozwija się w działania","ok":false,"w":"To proces obejmuje praktyki, nie odwrotnie."},{"t":"Proces to zbiór praktyk, więc nie zawiera działań","ok":false,"w":"Działania są w procesie, tylko piętro niżej."},{"t":"Proces obejmuje praktyki, praktyki rozwija się w działania, a te w razie potrzeby w działania szczegółowe","ok":true,"w":"Tak opisuje hierarchię fiszka."},{"t":"Działanie obejmuje praktyki, a praktyki – procesy","ok":false,"w":"Hierarchia jest odwrócona."}],"fz":{"h":"Proces, praktyka, działanie – hierarchia","p":"P1","pulapka":true,"n":"EN: Process = set of practices","q":"Jaką hierarchię mają proces, praktyka i działanie?","a":"Proces obejmuje praktyki ukierunkowane przez polityki i procedury, które zamieniają wejścia w wyniki. Praktyki rozwija się w działania, a te w razie potrzeby w działania szczegółowe. Definicja egzaminacyjna: proces to zbiór praktyk – co nie znaczy, że nie ma w nim działań.","ex":"Menu (proces) to zbiór dań (praktyk), a kroki przygotowania (działania) są w przepisie każdego dania. Działania są w procesie, tylko piętro niżej.","org":""}},"fz-C-074":{"id":"fz-C-074","typ":"egzamin","s":"EN-02-25","t":"Ilu odpowiedzialnych decyzyjnie (A) może mieć jedna praktyka w tabeli RACI?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 89"],"r":null,"zap":"","scen":"","o":[{"t":"Dowolnie wielu, tak jak wykonawców (R)","ok":false,"w":"Wielu może być tylko R, A jest jeden."},{"t":"Dwóch – po jednym z biznesu i z IT","ok":false,"w":"A jest zawsze jeden."},{"t":"Tylu, ilu jest konsultantów (C)","ok":false,"w":"Liczba A nie zależy od C; A jest jeden."},{"t":"Jednego","ok":true,"w":"Ostatecznej odpowiedzialności (A) się nie dzieli."}],"fz":{"h":"Jeden odpowiedzialny decyzyjnie (A)","p":"P1","pulapka":true,"n":"EN: Only one Accountable","q":"Ilu odpowiedzialnych decyzyjnie (A) może mieć jedna praktyka?","a":"Jednego. A (Accountable) to ostateczna odpowiedzialność za powodzenie – nie dzieli się jej; R (wykonawców) może być wielu.","ex":"Gotować może pięciu kucharzy (R), ale za danie odpowiada jeden szef (A). Dwóch szefów od jednego dania to w praktyce żaden.","org":""}},"fz-C-075":{"id":"fz-C-075","typ":"egzamin","s":"EN-02-25","t":"Jak w RACI wygląda komunikacja z rolami C (Konsultant) i I (Informowany)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 90"],"r":null,"zap":"","scen":"","o":[{"t":"C – dwukierunkowa, I – jednokierunkowa","ok":true,"w":"Konsultanta pytasz i słuchasz, Informowanemu tylko mówisz."},{"t":"C – jednokierunkowa, I – dwukierunkowa","ok":false,"w":"Odwrotnie: dwukierunkowa jest komunikacja z C."},{"t":"Obie dwukierunkowe","ok":false,"w":"Z Informowanym komunikacja jest jednokierunkowa."},{"t":"Obie jednokierunkowe","ok":false,"w":"Z Konsultantem komunikacja jest dwukierunkowa."}],"fz":{"h":"RACI: C i I","p":"P1","pulapka":true,"n":"EN: Consulted two-way, Informed one-way","q":"Która rola RACI ma komunikację dwukierunkową, a która jednokierunkową?","a":"C (Konsultant) – dwukierunkową; I (Informowany) – jednokierunkową.","ex":"Konsultanta pytasz i słuchasz odpowiedzi – rozmowa w obie strony. Informowanemu tylko mówisz, jak ogłoszenie na tablicy. Haczyk: C jak czat, I jak info.","org":""}},"fz-C-076":{"id":"fz-C-076","typ":"egzamin","s":"EN-02-13","t":"Za co według Rysunku 33 odpowiada Zarząd?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 76"],"r":null,"zap":"","scen":"","o":[{"t":"Za całe zarządzanie organizacją jako najwyższy rangą dyrektor","ok":false,"w":"To rola CEO."},{"t":"Za Ład organizacji i ogólną kontrolę nad jej zasobami","ok":true,"w":"Tak opisuje Zarząd fiszka."},{"t":"Za funkcjonowanie organizacji","ok":false,"w":"To rola COO."},{"t":"Za działalność jednej jednostki biznesowej lub spółki zależnej","ok":false,"w":"To rola członka naczelnego kierownictwa (Business Executive)."}],"fz":{"h":"Zarząd i CEO (Rysunek 33)","p":"P2","pulapka":false,"n":"EN: Board; Chief Executive Officer","q":"Za co odpowiadają Zarząd i CEO (Rysunek 33)?","a":"Zarząd: najwyżsi przedstawiciele kierownictwa i/lub dyrektorzy niewykonawczy, rozliczani z Ładu organizacji i sprawujący ogólną kontrolę nad jej zasobami. CEO (dyrektor generalny): najwyższy rangą dyrektor, odpowiedzialny za całe zarządzanie organizacją.","ex":"W szkole: rada szkoły pilnuje kierunku i majątku (Zarząd), a dyrektor prowadzi szkołę na co dzień (CEO).","org":""}},"fz-C-077":{"id":"fz-C-077","typ":"egzamin","s":"EN-02-13","t":"Kim w Rysunku 33 jest członek naczelnego kierownictwa (EN Business Executive)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 76"],"r":null,"zap":"","scen":"","o":[{"t":"Dyrektorem odpowiedzialnym za funkcjonowanie całej organizacji","ok":false,"w":"To rola COO."},{"t":"Najwyższym rangą dyrektorem, odpowiedzialnym za całe zarządzanie","ok":false,"w":"To rola CEO."},{"t":"Osobą odpowiedzialną za planowanie i polityki kadrowe","ok":false,"w":"To rola dyrektora ds. zasobów ludzkich."},{"t":"Osobą odpowiedzialną za działalność jednej jednostki biznesowej lub spółki zależnej","ok":true,"w":"Tak opisuje tę rolę fiszka."}],"fz":{"h":"COO, Business Executive, dyrektor ds. zasobów ludzkich","p":"P2","pulapka":false,"n":"EN: COO; Business Executive; Head of Human Resources","q":"Za co odpowiadają COO, członek naczelnego kierownictwa i dyrektor ds. zasobów ludzkich?","a":"COO (dyrektor operacyjny): funkcjonowanie organizacji. Członek naczelnego kierownictwa (EN Business Executive): działalność jednej jednostki biznesowej lub spółki zależnej. Dyrektor ds. zasobów ludzkich: planowanie i polityki kadrowe.","ex":"Sieć pizzerii: COO pilnuje, by wszystkie lokale działały; szef jednego lokalu to Business Executive; kadrowa planuje zatrudnienie.","org":""}},"fz-C-078":{"id":"fz-C-078","typ":"egzamin","s":"EN-02-13","t":"Za co odpowiada dyrektor ds. administracji IT?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 76–77"],"r":null,"zap":"","scen":"","o":[{"t":"Za środowiska operacyjne i infrastrukturę IT","ok":false,"w":"To dyrektor ds. operacji IT."},{"t":"Za procesy tworzenia rozwiązań IT","ok":false,"w":"To dyrektor ds. rozwoju."},{"t":"Za zapisy (dokumentację) i sprawy administracyjne IT","ok":true,"w":"Tak opisuje tę rolę fiszka."},{"t":"Za proces architektury korporacyjnej","ok":false,"w":"To dyrektor ds. architektury."}],"fz":{"h":"Dyrektorzy ds. architektury, rozwoju, operacji i administracji IT","p":"P2","pulapka":false,"n":"EN: Head of Architecture, Development, IT Operations, IT Administration","q":"Za co odpowiadają dyrektorzy ds. architektury, rozwoju, operacji IT i administracji IT?","a":"To członkowie wyższej kadry kierowniczej. Architektura: proces architektury korporacyjnej. Rozwój: procesy tworzenia rozwiązań IT. Operacje IT: środowiska operacyjne i infrastruktura IT. Administracja IT: zapisy (dokumentacja) i sprawy administracyjne IT.","ex":"Przy budowie domu: architekt pilnuje projektu, kierownik budowy stawia ściany, administrator dba o instalacje, a sekretariat o papiery.","org":""}},"fz-C-079":{"id":"fz-C-079","typ":"egzamin","s":"EN-02-13","t":"Za co odpowiada kierownik ds. ciągłości działalności biznesowej?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","
