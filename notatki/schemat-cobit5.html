z na to nie pozwala. Wystarczy opis procesu: cel, praktyki bazowe (co się robi) i produkty pracy (co powstaje).","ex":"Zamiast osobnej skali dla zmywaka i osobnej dla grilla jest jedna wspólna lista pytań. O stanowisku wystarczy wiedzieć, po co jest, co się na nim robi i co powstaje.","org":""}},"fz-D-056":{"id":"fz-D-056","typ":"egzamin","s":"PC-02-05","t":"Która z poniższych NIE jest korzyścią modelu zdolności COBIT 5 względem COBIT 4.1?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 44"],"r":null,"zap":"","scen":"","o":[{"t":"Skupienie na tym, czy proces osiąga cel","ok":false,"w":"To korzyść z fiszki."},{"t":"Ocena wiarygodniejsza i bardziej powtarzalna","ok":false,"w":"To korzyść z fiszki."},{"t":"Zgodność z uznaną normą","ok":false,"w":"To korzyść z fiszki."},{"t":"Bezpośrednie przeliczenie starych ocen 1:1","ok":true,"w":"Ocen COBIT 4.1 nie przeliczysz 1:1."}],"fz":{"h":"Korzyści modelu zdolności COBIT 5","p":"P2","pulapka":false,"n":"EN: Benefits of the COBIT 5 capability model","q":"Jakie korzyści daje model zdolności COBIT 5 względem COBIT 4.1?","a":"Skupienie na tym, czy proces osiąga cel; prostsza treść bez powtórzeń; ocena wiarygodniejsza i bardziej powtarzalna; nadaje się do formalnej oceny; zgodność z uznaną normą.","ex":"Jak jednolity regulamin sanepidu: każdy inspektor ocenia tak samo, liczy się efekt na talerzu, a wynik uznają wszyscy.","org":""}},"fz-D-057":{"id":"fz-D-057","typ":"egzamin","s":"PC-01-01","t":"Co odróżnia poziom 2 – Proces zarządzany od poziomu 1?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42"],"r":null,"zap":"","scen":"","o":[{"t":"Proces jest planowany, pilnowany i korygowany, a produkty pracy są określone, sprawdzane i przechowywane","ok":true,"w":"Tak opisuje poziom 2 fiszka."},{"t":"Proces działa według zdefiniowanego standardu","ok":false,"w":"To poziom 3."},{"t":"Proces jest stale doskonalony","ok":false,"w":"To poziom 5."},{"t":"Proces po raz pierwszy osiąga swój cel","ok":false,"w":"To poziom 1."}],"fz":{"h":"Poziom 2 – Proces zarządzany","p":"P1","pulapka":false,"n":"EN: Level 2 Managed","q":"Co oznacza poziom 2 – Proces zarządzany?","a":"Proces z poziomu 1 jest zarządzany: planowany, pilnowany i korygowany, a jego produkty pracy (dokumenty, wyniki) są określone, sprawdzane i przechowywane. Dwa atrybuty.","ex":"Szef kuchni układa grafik, sprawdza, czy zespół zdąża, i poprawia plan; zamówienia i receptury są pod kontrolą, a nie na luźnych karteczkach.","org":""}},"fz-D-058":{"id":"fz-D-058","typ":"egzamin","s":"PC-01-01","t":"Czy do poziomu 3 – Proces ustanowiony wystarczy spisany dokument standardu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42"],"r":null,"zap":"","scen":"","o":[{"t":"Tak – liczy się sam dokument","ok":false,"w":"Standard musi działać w praktyce (PA 3.2 Wdrożenie procesu)."},{"t":"Tak – jeśli dokument zatwierdzi zarząd","ok":false,"w":"Zatwierdzenie nie zastępuje stosowania w praktyce."},{"t":"Nie – potrzebna jest też kontrola ilościowa","ok":false,"w":"Kontrola ilościowa to poziom 4."},{"t":"Nie – standard musi być wdrożony w praktyce i pozwalać osiągać wyniki","ok":true,"w":"Fiszka: sam dokument nie wystarczy."}],"fz":{"h":"Poziom 3 – Proces ustanowiony","p":"P1","pulapka":true,"n":"EN: Level 3 Established","q":"Co oznacza poziom 3 – Proces ustanowiony?","a":"Proces zarządzany działa według zdefiniowanego standardu (wzorca), wdrożonego w praktyce, który pozwala osiągać wyniki. Sam dokument nie wystarczy. Dwa atrybuty.","ex":"Sieć restauracji ma spisaną książkę receptur i każda kuchnia gotuje według niej, a nie każdy kucharz po swojemu.","org":""}},"fz-D-059":{"id":"fz-D-059","typ":"egzamin","s":"PC-01-01","t":"Czy do poziomu 4 – Proces przewidywalny wystarczy zbierać mierniki?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42"],"r":null,"zap":"","scen":"","o":[{"t":"Tak – samo zbieranie mierników wystarcza","ok":false,"w":"Potrzebne jest też trzymanie procesu w granicach (PA 4.2)."},{"t":"Nie – trzeba też stale wprowadzać innowacje","ok":false,"w":"Innowacja to poziom 5."},{"t":"Tak – jeśli mierniki zbiera zewnętrzny asesor","ok":false,"w":"Kto zbiera mierniki, nie ma znaczenia; liczy się kontrola procesu."},{"t":"Nie – zachowanie procesu trzeba rozumieć ilościowo i utrzymywać w określonych granicach","ok":true,"w":"Fiszka: samo zbieranie mierników nie wystarczy."}],"fz":{"h":"Poziom 4 – Proces przewidywalny","p":"P1","pulapka":true,"n":"EN: Level 4 Predictable","q":"Co oznacza poziom 4 – Proces przewidywalny?","a":"Proces ustanowiony działa w określonych granicach: jego zachowanie rozumie się ilościowo i utrzymuje w normie, by osiągać wyniki. Samo zbieranie mierników nie wystarczy. Dwa atrybuty.","ex":"Kuchnia mierzy czas wydania i ilość odpadów i reaguje, gdy wynik wychodzi poza normę; prawie każde danie wychodzi w 12–15 minut, więc wiadomo z góry, czego się spodziewać.","org":""}},"fz-D-060":{"id":"fz-D-060","typ":"egzamin","s":"PC-01-01","t":"Co oznacza poziom 5 – Proces zoptymalizowany?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42"],"r":null,"zap":"","scen":"","o":[{"t":"Proces osiąga cel, choć działa bez planu","ok":false,"w":"To poziom 1."},{"t":"Proces działa według zdefiniowanego standardu","ok":false,"w":"To poziom 3."},{"t":"Proces przewidywalny jest stale doskonalony, by realizować obecne i przyszłe cele biznesowe","ok":true,"w":"Tak opisuje poziom 5 fiszka."},{"t":"Proces osiągnął 100% i nie wymaga już zmian","ok":false,"w":"Poziom 5 oznacza ciągłe doskonalenie, a nie koniec zmian."}],"fz":{"h":"Poziom 5 – Proces zoptymalizowany","p":"P1","pulapka":false,"n":"EN: Level 5 Optimising","q":"Co oznacza poziom 5 – Proces zoptymalizowany?","a":"Proces przewidywalny jest stale doskonalony, by realizować obecne i przyszłe istotne cele biznesowe. Dwa atrybuty.","ex":"Kuchnia nie spoczywa na laurach: testuje nowe dania i sprzęt, by nadążać za gośćmi dziś i za rok. Czarny pas – i dalej trening.","org":""}},"fz-D-061":{"id":"fz-D-061","typ":"egzamin","s":"PC-01-02","t":"Które atrybuty należą do poziomu 2?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42"],"r":null,"zap":"","scen":"","o":[{"t":"PA 2.1 Zarządzanie wydajnością i PA 2.2 Zarządzanie produktami pracy","ok":true,"w":"To dwa atrybuty poziomu 2."},{"t":"PA 2.1 Definicja procesu i PA 2.2 Wdrożenie procesu","ok":false,"w":"To atrybuty poziomu 3 (PA 3.1 i 3.2)."},{"t":"PA 2.1 Miara procesu i PA 2.2 Kontrola procesu","ok":false,"w":"To atrybuty poziomu 4 (PA 4.1 i 4.2)."},{"t":"PA 2.1 Wykonanie procesu i PA 2.2 Innowacja procesu","ok":false,"w":"Wykonanie procesu to PA 1.1, a innowacja to PA 5.1."}],"fz":{"h":"Atrybuty poziomów 1 i 2","p":"P1","pulapka":false,"n":"EN: PA 1.1 Process performance; PA 2.1 Performance management; PA 2.2 Work product management","q":"Podaj atrybuty poziomów 1 i 2 (nazwy egzaminacyjne).","a":"Poziom 1: PA 1.1 Wykonanie procesu. Poziom 2: PA 2.1 Zarządzanie wydajnością, PA 2.2 Zarządzanie produktami pracy.","ex":"Poziom 1 pyta: czy obiad wychodzi? Poziom 2 pyta: czy praca jest planowana i pilnowana (2.1) oraz czy receptury i zamówienia są w porządku (2.2)?","org":""}},"fz-D-062":{"id":"fz-D-062","typ":"egzamin","s":"PC-01-02","t":"Jak na egzaminie PL nazywa się atrybut PA 4.1?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42"],"r":null,"zap":"","scen":"","o":[{"t":"Kontrola procesu","ok":false,"w":"To PA 4.2."},{"t":"Miara procesu (podr.: Pomiar procesu)","ok":true,"w":"To ten sam atrybut poziomu 4."},{"t":"Definicja procesu","ok":false,"w":"To PA 3.1."},{"t":"Optymalizacja procesu","ok":false,"w":"To PA 5.2."}],"fz":{"h":"Atrybuty poziomów 3 i 4","p":"P1","pulapka":true,"n":"EN: PA 3.1 Process definition; PA 3.2 Process deployment; PA 4.1 Process measurement; PA 4.2 Process control","q":"Podaj atrybuty poziomów 3 i 4 (nazwy egzaminacyjne). | PA 4.1 – „Pomiar procesu” czy „Miara procesu”?","a":"Poziom 3: PA 3.1 Definicja procesu, PA 3.2 Wdrożenie procesu. Poziom 4: PA 4.1 Miara procesu, PA 4.2 Kontrola procesu. | Na egzaminie PL: Miara procesu; w podręczniku: Pomiar procesu. To ten sam atrybut poziomu 4.","ex":"Poziom 3: czy są spisane receptury (3.1) i czy wszyscy według nich gotują (3.2)? Poziom 4: czy się mierzy (4.1) i reaguje, gdy wyniki wychodzą poza normę (4.2)? | Egzamin „Miara”, podręcznik „Pomiar” – chodzi o to samo: czy kuchnia mierzy np. czas wydania dań i liczbę reklamacji.","org":""}},"fz-D-063":{"id":"fz-D-063","typ":"egzamin","s":"PC-01-02","t":"Które atrybuty należą do poziomu 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42"],"r":null,"zap":"","scen":"","o":[{"t":"PA 5.1 Miara procesu i PA 5.2 Kontrola procesu","ok":false,"w":"To atrybuty poziomu 4."},{"t":"PA 5.1 Definicja procesu i PA 5.2 Wdrożenie procesu","ok":false,"w":"To atrybuty poziomu 3."},{"t":"Tylko jeden: PA 5.1 Optymalizacja procesu","ok":false,"w":"Poziom 5 ma dwa atrybuty, a optymalizacja to PA 5.2."},{"t":"PA 5.1 Innowacja procesu i PA 5.2 Optymalizacja procesu","ok":true,"w":"Najpierw wymyśl, potem dopracuj."}],"fz":{"h":"Atrybuty poziomu 5","p":"P1","pulapka":false,"n":"EN: PA 5.1 Process innovation; PA 5.2 Process optimisation","q":"Podaj atrybuty poziomu 5 (nazwy egzaminacyjne).","a":"PA 5.1 Innowacja procesu, PA 5.2 Optymalizacja procesu.","ex":"Czy kuchnia szuka nowych pomysłów (5.1) i czy wprowadza je tak, by naprawdę coś poprawiły (5.2)? Haczyk: najpierw wymyśl, potem dopracuj.","org":""}},"fz-D-064":{"id":"fz-D-064","typ":"egzamin","s":"PC-01-03","t":"Co oznacza ocena C – Częściowy (EN: P)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 45"],"r":null,"zap":"","scen":"","o":[{"t":"Atrybut jest realizowany systematycznie, z pewnymi słabościami; >50–85%","ok":false,"w":"To ocena W."},{"t":"Atrybut jest w pełni osiągany, bez istotnych słabości; >85–100%","ok":false,"w":"To ocena P."},{"t":"Są pewne dowody realizacji atrybutu, część rzeczy dzieje się nieprzewidywalnie; >15–50%","ok":true,"w":"Tak opisuje ocenę C fiszka."},{"t":"Atrybut jest nieosiągnięty; 0–15%","ok":false,"w":"To ocena N."}],"fz":{"h":"Ocena C – Częściowy","p":"P1","pulapka":true,"n":"EN: P – Partially achieved","q":"Co oznacza ocena C – Częściowy (EN: P)?","a":"Są pewne dowody, że atrybut jest realizowany i częściowo osiągany; część rzeczy dzieje się nieprzewidywalnie. >15–50%.","ex":"Kuchnia czasem trzyma się grafiku, czasem nie – raczej przypadkiem niż z zasady. Zrobione mniej niż połowa.","org":""}},"fz-D-065":{"id":"fz-D-065","typ":"egzamin","s":"PC-01-03","t":"Jaki zakres procentowy odpowiada ocenie W – Większościowy (EN: L)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 45"],"r":null,"zap":"","scen":"","o":[{"t":">15–50%","ok":false,"w":"To zakres oceny C."},{"t":">85–100%","ok":false,"w":"To zakres oceny P."},{"t":">50–85%","ok":true,"w":"Tak podaje fiszka."},{"t":"0–15%","ok":false,"w":"To zakres oceny N."}],"fz":{"h":"Ocena W – Większościowy","p":"P1","pulapka":true,"n":"EN: L – Largely achieved","q":"Co oznacza ocena W – Większościowy (EN: L)?","a":"Są dowody, że atrybut jest realizowany systematycznie i w dużej mierze osiągany; mogą zostać pewne słabości. >50–85%.","ex":"Kuchnia zwykle trzyma się grafiku i robi to celowo, ale zdarzają się wpadki. Zrobiona większość, nie wszystko.","org":""}},"fz-D-066":{"id":"fz-D-066","typ":"egzamin","s":"PC-01-03","t":"Czy ocena P – Pełny wymaga 100% osiągnięcia atrybutu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 45"],"r":null,"zap":"","scen":"","o":[{"t":"Tak – tylko 100% daje ocenę P","ok":false,"w":"Zakres oceny P to >85–100%."},{"t":"Nie – wystarczy ponad 85%, bez istotnych słabości","ok":true,"w":"Fiszka: pełny to nie 100%."},{"t":"Nie – wystarczy ponad 50%","ok":false,"w":"Ponad 50% to dopiero ocena W."},{"t":"Tak – i dodatkowo potwierdzenie zewnętrznego asesora","ok":false,"w":"Ocena P nie wymaga 100% ani zewnętrznego asesora."}],"fz":{"h":"Ocena P – Pełny","p":"P1","pulapka":true,"n":"EN: F – Fully achieved","q":"Co oznacza ocena P – Pełny (EN: F)?","a":"Są dowody, że atrybut jest realizowany kompletnie i systematycznie oraz w pełni osiągany; brak istotnych słabości. >85–100%.","ex":"Kuchnia prawie zawsze trzyma się grafiku, a drobne potknięcia niczego nie zmieniają. Uwaga: pełny to nie 100%, wystarczy ponad 85%.","org":""}},"fz-D-067":{"id":"fz-D-067","typ":"egzamin","s":"PC-02-06","t":"Jak ocenia się, czy proces osiągnął poziom 1?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 45"],"r":null,"zap":"","scen":"","o":[{"t":"Ocenia się tylko plan pracy procesu","ok":false,"w":"Planowanie to poziom 2."},{"t":"Ocenia się rezultaty procesu i praktyki bazowe skalą N/C/W/P, a opcjonalnie produkty pracy","ok":true,"w":"Efekt – czynności – papiery."},{"t":"Ocenia się atrybuty PA 2.1 i PA 2.2","ok":false,"w":"To atrybuty poziomu 2."},{"t":"Ocenia się dojrzałość całej organizacji","ok":false,"w":"Ocena dotyczy procesu, a nie organizacji."}],"fz":{"h":"Ocena poziomu 1","p":"P1","pulapka":false,"n":"EN: Assessing level 1","q":"Jak ocenia się, czy proces osiągnął poziom 1?","a":"1. Ocena rezultatów procesu skalą N/C/W/P. 2. Ocena praktyk bazowych (czynności) tą samą skalą. 3. Opcjonalnie ocena produktów pracy (dokumentów).","ex":"Inspektor najpierw ogląda talerze (czy dania wychodzą), potem czynności kucharzy, a na koniec może zajrzeć w papiery. Haczyk: efekt – czynności – papiery.","org":""}},"fz-D-068":{"id":"fz-D-068","typ":"egzamin","s":"PC-02-06","t":"Co zrobić, gdy proces nie osiąga poziomu 1?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 45"],"r":null,"zap":"","scen":"","o":[{"t":"Udoskonalić proces – ocena praktyk pokaże, których brakuje lub które nie działają","ok":true,"w":"Tak radzi fiszka."},{"t":"Od razu przejść do oceny poziomu 2","ok":false,"w":"Poziom 2 wymaga najpierw pełnego osiągnięcia poziomu 1."},{"t":"Uznać, że to poziom 1, bo proces istnieje","ok":false,"w":"Bez rezultatów proces zostaje na poziomie 0."},{"t":"Zmienić skalę ocen na łagodniejszą","ok":false,"w":"Skala N/C/W/P jest stała."}],"fz":{"h":"Gdy proces nie osiąga poziomu 1","p":"P2","pulapka":false,"n":"EN: Improvement when level 1 not achieved","q":"Co zrobić, gdy proces nie osiąga poziomu 1?","a":"Jeśli rezultat nie jest konsekwentnie uzyskiwany, proces trzeba udoskonalić; ocena praktyk pokaże, których brakuje lub które nie działają.","ex":"Jeśli obiady nie wychodzą regularnie, lista czynności pokaże, gdzie jest dziura – np. nikt nie zamawia warzyw. Wtedy wiadomo, co naprawić.","org":""}},"fz-D-069":{"id":"fz-D-069","typ":"egzamin","s":"PC-01-04","t":"Które z poniższych NIE jest jednym z czterech pojęć ISO/IEC 15504 używanych w ocenie?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 43"],"r":null,"zap":"","scen":"","o":[{"t":"Mapa drogowa","ok":true,"w":"To pojęcie z wytycznych wdrożenia (faza 3)."},{"t":"Praktyka bazowa","ok":false,"w":"To jedno z czterech pojęć."},{"t":"Produkt pracy","ok":false,"w":"To jedno z czterech pojęć."},{"t":"Rezultat procesu","ok":false,"w":"To jedno z czterech pojęć."}],"fz":{"h":"Cztery pojęcia ISO/IEC 15504","p":"P1","pulapka":false,"n":"EN: Process purpose, outcome, base practice, work product","q":"Podaj cztery pojęcia ISO/IEC 15504 używane w ocenie.","a":"Przeznaczenie procesu, rezultat procesu, praktyka bazowa, produkt pracy (podr.: cel procesu, wynik procesu, podstawowa praktyka, produkt działań).","ex":"Kuchnia: przeznaczenie – po co jest (karmić gości); rezultat – co widać (obiad na stole); praktyka bazowa – co się robi (gotowanie); produkt pracy – ślad (zamówienie, rachunek).","org":""}},"fz-D-070":{"id":"fz-D-070","typ":"egzamin","s":"PC-01-04","t":"Czym są praktyki bazowe w COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 43"],"r":null,"zap":"","scen":"","o":[{"t":"Odpowiednikami wejść i wyjść procesu","ok":false,"w":"To produkty pracy."},{"t":"Atrybutami poziomów 2–5","ok":false,"w":"Atrybuty to cechy zdolności, a nie praktyki bazowe."},{"t":"Odpowiednikami praktyk Ładu i Zarządzania z opisu procesu","ok":true,"w":"Ich wykonywanie prowadzi do rezultatów procesu."},{"t":"Widocznymi efektami spełnienia przeznaczenia procesu","ok":false,"w":"To rezultaty procesu."}],"fz":{"h":"Praktyki bazowe","p":"P1","pulapka":false,"n":"EN: Base practices = governance/management practices","q":"Czym są praktyki bazowe w COBIT 5?","a":"To odpowiedniki praktyk Ładu i Zarządzania z opisu procesu; ich wykonywanie prowadzi do rezultatów procesu (poziom 1).","ex":"Praktyki bazowe to kroki z przepisu: obierz, pokrój, usmaż. Gdy się je wykonuje, wychodzi danie, czyli rezultat.","org":""}},"fz-D-071":{"id":"fz-D-071","typ":"egzamin","s":"PC-01-04","t":"Czemu w COBIT 5 odpowiadają produkty pracy?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 43"],"r":null,"zap":"","scen":"","o":[{"t":"Praktykom Ładu i Zarządzania","ok":false,"w":"Im odpowiadają praktyki bazowe."},{"t":"Atrybutom procesu","ok":false,"w":"Atrybuty to mierzalne cechy zdolności."},{"t":"Wejściom i wyjściom procesu","ok":true,"w":"To dokumenty i inne ślady powstające przy wykonywaniu procesu."},{"t":"Poziomom zdolności","ok":false,"w":"Poziomy to skala 0–5, a nie produkty pracy."}],"fz":{"h":"Produkty pracy","p":"P1","pulapka":false,"n":"EN: Work products = inputs/outputs","q":"Czym są produkty pracy w COBIT 5?","a":"To odpowiedniki wejść i wyjść procesu: dokumenty i inne ślady (dowody) powstające przy jego wykonywaniu.","ex":"W kuchni: zamówienie od kelnera (wejście), rachunek i zapis temperatur lodówki (wyjścia). Inspektor ogląda je jako dowód, że praca była wykonana.","org":""}},"fz-D-072":{"id":"fz-D-072","typ":"egzamin","s":"PC-01-04","t":"Czym jest rezultat procesu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 45"],"r":null,"zap":"","scen":"","o":[{"t":"Widocznym, sprawdzalnym efektem tego, że proces spełnia swoje przeznaczenie","ok":true,"w":"Ocenia się go przy poziomie 1."},{"t":"Dokumentem z planem pracy procesu","ok":false,"w":"Planowanie pracy procesu to poziom 2."},{"t":"Oceną wystawioną przez asesora","ok":false,"w":"Ocena to wynik oceny, a nie rezultat procesu."},{"t":"Opisem, po co proces istnieje","ok":false,"w":"To przeznaczenie procesu."}],"fz":{"h":"Rezultat procesu","p":"P1","pulapka":false,"n":"EN: Process outcome","q":"Czym jest rezultat procesu?","a":"Widoczny, sprawdzalny efekt tego, że proces spełnia swoje przeznaczenie; ocenia się go przy poziomie 1.","ex":"Rezultat to to, co da się zobaczyć: obiad na stole, najedzony gość. Jeśli go nie ma, kuchnia nie ma nawet poziomu 1.","org":""}},"fz-D-073":{"id":"fz-D-073","typ":"egzamin","s":"PC-02-04","t":"Czym różni się Wymiar Procesu od Wymiaru Zdolności?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42"],"r":null,"zap":"","scen":"","o":[{"t":"Wymiar Procesu obejmuje atrybuty wspólne, a Wymiar Zdolności – wskaźniki właściwe dla procesu","ok":false,"w":"Definicje są tu zamienione."},{"t":"Wymiar Procesu dotyczy COBIT 4.1, a Wymiar Zdolności – COBIT 5","ok":false,"w":"Oba wymiary dotyczą oceny w COBIT 5."},{"t":"Wymiar Procesu ma wskaźniki właściwe dla procesu (poziom 1), a Wymiar Zdolności – atrybuty wspólne dla procesów (poziomy 1–5)","ok":true,"w":"Tak rozróżnia je fiszka."},{"t":"Niczym – to dwie nazwy tego samego","ok":false,"w":"To dwa różne wymiary wskaźników oceny."}],"fz":{"h":"Wymiar Procesu a Wymiar Zdolności","p":"P1","pulapka":false,"n":"EN: Process dimension vs capability dimension","q":"Czym różnią się Wymiar Procesu i Wymiar Zdolności?","a":"Wymiar Procesu: wskaźniki właściwe dla danego procesu – praktyki bazowe i produkty pracy (procesy i ich wyniki definiuje PRM); sprawdza poziom 1 (PA 1.1). Wymiar Zdolności: atrybuty z ogólnymi praktykami, zasobami i produktami pracy, wspólne dla procesów; poziomy 1–5. Wskaźniki opisuje PAM.","ex":"Wymiar Procesu – pytania o konkretne stanowisko (czy grill piecze mięso?). Wymiar Zdolności – te same pytania dla każdego stanowiska (czy jest plan, standard, pomiar?).","org":""}},"fz-D-074":{"id":"fz-D-074","typ":"egzamin","s":"PC-02-03","t":"Czego według ISO/IEC 15504-2 NIE może zawierać opis procesu w Referencyjnym Modelu Procesu (PRM)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 43"],"r":null,"zap":"","scen":"","o":[{"t":"Niczego z poziomów powyżej 1","ok":true,"w":"Fiszka: tylko kroki potrzebne do osiągnięcia celu procesu."},{"t":"Celu procesu","ok":false,"w":"Cel procesu musi się w opisie znaleźć."},{"t":"Rezultatów procesu","ok":false,"w":"Rezultaty procesu muszą się w opisie znaleźć."},{"t":"Kroków potrzebnych do osiągnięcia celu procesu","ok":false,"w":"Te kroki właśnie mogą się znaleźć w opisie."}],"fz":{"h":"Wymagania ISO/IEC 15504-2 wobec PRM","p":"P2","pulapka":false,"n":"EN: PRM requirements per ISO/IEC 15504-2","q":"Jakie wymagania ISO/IEC 15504-2 musi spełniać opis procesu w PRM?","a":"Musi zawierać cel i rezultaty procesu. Nie może zawierać niczego z poziomów powyżej 1 – tylko kroki potrzebne do osiągnięcia celu procesu.","ex":"PRM to katalog opisów stanowisk: każdy mówi tylko, po co jest stanowisko i co ma z niego wyjść. Planowanie i pomiary (poziomy 2–5) są na wspólnej liście pytań.","org":""}},"fz-D-075":{"id":"fz-D-075","typ":"egzamin","s":"PC-02-01","t":"Który z poniższych NIE jest celem oceny zdolności procesu według fiszki?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 45"],"r":null,"zap":"","scen":"","o":[{"t":"Porównanie procesów przez Ład i kierownictwo","ok":false,"w":"To cel z fiszki."},{"t":"Ustalenie „jak jest” i „jak ma być”, by zdecydować o inwestycjach","ok":false,"w":"To cel z fiszki."},{"t":"Ocena osobistych kompetencji każdego pracownika","ok":true,"w":"Ocena zdolności dotyczy procesów, a nie ludzi."},{"t":"Śledzenie zdolności w czasie dzięki porównywalnym ocenom","ok":false,"w":"To cel z fiszki."}],"fz":{"h":"Cele oceny zdolności procesu","p":"P2","pulapka":false,"n":"EN: Purposes of process capability assessment","q":"Jakie są cele oceny zdolności procesu?","a":"Ład i kierownictwo mogą porównać procesy; ustalić „jak jest” i „jak ma być”, by zdecydować o inwestycjach; zobaczyć luki i zaplanować usprawnienia; śledzić zdolność w czasie dzięki porównywalnym ocenom.","ex":"Właściciel sieci restauracji widzi, która kuchnia odstaje, ile brakuje do celu i w co włożyć pieniądze – oraz czy z roku na rok jest lepiej.","org":""}},"fz-D-076":{"id":"fz-D-076","typ":"egzamin","s":"PC-02-01","t":"Jakie cele może mieć ocena według ISO/IEC 15504?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 45"],"r":null,"zap":"","scen":"","o":[{"t":"Wyłącznie zewnętrzne – certyfikację","ok":false,"w":"Ocena może mieć też cele wewnętrzne."},{"t":"Wyłącznie wewnętrzne – porównania obszarów","ok":false,"w":"Ocena może mieć też cele zewnętrzne."},{"t":"Wewnętrzne (np. doskonalenie procesów) lub zewnętrzne (np. formalna ocena, certyfikacja)","ok":true,"w":"Z różnym stopniem rygoru – tak mówi fiszka."},{"t":"Wyłącznie finansowe – wycenę działu IT","ok":false,"w":"Fiszka nie wymienia takiego celu."}],"fz":{"h":"Ocena wewnętrzna a zewnętrzna","p":"P2","pulapka":false,"n":"EN: Internal vs external assessment","q":"Jakie cele może mieć ocena wg ISO/IEC 15504?","a":"Wewnętrzne (porównania obszarów, doskonalenie procesów) lub zewnętrzne (formalna ocena, raportowanie, certyfikacja) – z różnym stopniem rygoru.","ex":"Wewnętrzna – jak szef kuchni sprawdzający własny zespół. Zewnętrzna – jak kontrola sanepidu czy przyznanie gwiazdki: surowiej, z papierami i oficjalnym wynikiem.","org":""}},"fz-D-077":{"id":"fz-D-077","typ":"egzamin","s":"PC-02-02","t":"Który dokument NIE należy do trzech przewodników programu oceny COBIT?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 41"],"r":null,"zap":"","scen":"","o":[{"t":"Model Oceny Procesu (PAM)","ok":false,"w":"To jeden z trzech przewodników."},{"t":"Przewodnik COBIT 5: Wdrożenie","ok":true,"w":"To przewodnik wdrożenia, a nie oceny."},{"t":"Przewodnik Asesora","ok":false,"w":"To jeden z trzech przewodników."},{"t":"Przewodnik Samooceny","ok":false,"w":"To jeden z trzech przewodników."}],"fz":{"h":"Trzy przewodniki programu oceny","p":"P2","pulapka":false,"n":"EN: PAM, Assessor Guide, Self-Assessment Guide","q":"Podaj trzy przewodniki programu oceny COBIT.","a":"Model Oceny Procesu (PAM), Przewodnik Asesora, Przewodnik Samooceny.","ex":"Haczyk: PAM – arkusz pytań; Przewodnik Asesora – instrukcja dla oficjalnego oceniającego (jak egzaminator na prawo jazdy); Przewodnik Samooceny – wersja „sprawdź się sam”.","org":""}},"fz-D-078":{"id":"fz-D-078","typ":"egzamin","s":"PC-02-06","t":"PA 1.1 = P, PA 2.1 = W, PA 2.2 = W, PA 3.1 = C. Jaki to poziom zdolności?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42"],"r":null,"zap":"","scen":"","o":[{"t":"Poziom 1","ok":false,"w":"Atrybuty poziomu 2 na W wystarczają do poziomu 2."},{"t":"Poziom 2","ok":true,"w":"Poziom 1 jest pełny, a atrybuty poziomu 2 mają co najmniej W."},{"t":"Poziom 3","ok":false,"w":"Wymagałby P na obu atrybutach poziomu 2 i co najmniej W na PA 3.1 i 3.2."},{"t":"Poziom 0","ok":false,"w":"PA 1.1 = P, więc proces osiąga cel."}],"fz":{"h":"Liczenie poziomu: P, W, W, C","p":"P1","pulapka":false,"n":"EN: Worked example","q":"PA1.1=P, PA2.1=W, PA2.2=W, PA3.1=C – jaki poziom zdolności?","a":"Poziom 2. Poziom 1 pełny (P), atrybuty poziomu 2 co najmniej W. Poziom 3 nie: wymaga P na obu atrybutach poziomu 2 i co najmniej W na PA 3.1 i 3.2.","ex":"Stoisz na stopniu 2: stopień 1 jest cały (P), a 2 „prawie” (W). Na 3 nie wejdziesz: stopień 2 musiałby być cały, a PA 3.1 ma tylko C.","org":""}},"fz-D-079":{"id":"fz-D-079","typ":"egzamin","s":"PC-02-06","t":"PA 1.1 = W, PA 2.1 = P, PA 2.2 = P. Jaki to poziom zdolności?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42"],"r":null,"zap":"","scen":"","o":[{"t":"Poziom 2","ok":false,"w":"Poziom 2 wymaga P na PA 1.1."},{"t":"Poziom 0","ok":false,"w":"W na PA 1.1 wystarcza do poziomu 1."},{"t":"Poziom 3","ok":false,"w":"Nie oceniono atrybutów poziomu 3, a PA 1.1 nie jest pełny."},{"t":"Poziom 1","ok":true,"w":"W na PA 1.1 wystarcza do poziomu 1."}],"fz":{"h":"Liczenie poziomu: W, P, P","p":"P1","pulapka":false,"n":"EN: Worked example","q":"PA1.1=W, PA2.1=P, PA2.2=P – jaki poziom zdolności?","a":"Poziom 1. W na PA 1.1 wystarcza do poziomu 1, ale poziom 2 wymaga P na PA 1.1 – dobre oceny PA 2.x nie pomagają.","ex":"Jak pasy: świetnie opanowane techniki zielonego pasa nic nie dają, gdy żółty jest zaliczony tylko „prawie”. Najpierw domknij niższy poziom.","org":""}},"fz-D-080":{"id":"fz-D-080","typ":"egzamin","s":"PC-02-06","t":"PA 1.1 = P, PA 2.1 = P, PA 2.2 = P, PA 3.1 = W, PA 3.2 = C. Jaki to poziom zdolności?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42"],"r":null,"zap":"","scen":"","o":[{"t":"Poziom 3","ok":false,"w":"Oba atrybuty poziomu 3 muszą mieć co najmniej W."},{"t":"Poziom 1","ok":false,"w":"Atrybuty poziomu 2 są pełne, więc poziom 2 jest osiągnięty."},{"t":"Poziom 4","ok":false,"w":"Poziom 3 nie jest nawet osiągnięty."},{"t":"Poziom 2","ok":true,"w":"PA 3.2 ma tylko C, więc poziom 3 nie jest osiągnięty."}],"fz":{"h":"Liczenie poziomu: P, P, P, W, C","p":"P1","pulapka":false,"n":"EN: Worked example","q":"PA1.1=P, PA2.1=P, PA2.2=P, PA3.1=W, PA3.2=C – jaki poziom zdolności?","a":"Poziom 2. Do poziomu 3 oba atrybuty PA 3.1 i PA 3.2 muszą mieć co najmniej W; PA 3.2 ma tylko C.","ex":"Do poziomu 3 oba jego pytania trzeba zaliczyć co najmniej na W. Jedno słabe (C) blokuje cały poziom – jak oblany jeden z dwóch egzaminów.","org":""}},"fz-D-081":{"id":"fz-D-081","typ":"egzamin","s":"PC-02-06","t":"PA 1.1 osiągnięto w 40%. Jaka to ocena i jaki poziom zdolności?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 45"],"r":null,"zap":"","scen":"","o":[{"t":"Ocena C, poziom 0","ok":true,"w":"40% mieści się w >15–50%, a do poziomu 1 potrzeba co najmniej W."},{"t":"Ocena C, poziom 1","ok":false,"w":"Poziom 1 wymaga na PA 1.1 co najmniej W, czyli ponad 50%."},{"t":"Ocena W, poziom 1","ok":false,"w":"40% to C, a nie W."},{"t":"Ocena N, poziom 0","ok":false,"w":"N to tylko 0–15%."}],"fz":{"h":"Liczenie poziomu: PA 1.1 w 40%","p":"P1","pulapka":false,"n":"EN: Worked example","q":"PA 1.1 osiągnięty w 40%. Jaka ocena i poziom?","a":"Ocena C (Częściowy, >15–50%), więc poziom 0 – proces niekompletny.","ex":"Do poziomu 1 trzeba na PA 1.1 co najmniej W, czyli ponad 50%. 40% to oceniony stopień osiągnięcia atrybutu (nie odsetek udanych obiadów) – za mało, więc zostaje 0.","org":""}},"fz-D-082":{"id":"fz-D-082","typ":"egzamin","s":"PC-02-04","t":"Czy atrybuty poziomów 2–5 są inne dla każdego procesu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 43"],"r":null,"zap":"","scen":"","o":[{"t":"Nie – są wspólne dla wszystkich procesów; różni się tylko poziom 1","ok":true,"w":"Tak mówi fiszka."},{"t":"Tak – każdy proces ma własne atrybuty 2–5","ok":false,"w":"Atrybuty 2–5 są wspólne."},{"t":"Tak – różnią się dla każdej domeny","ok":false,"w":"Atrybuty 2–5 są wspólne dla wszystkich procesów."},{"t":"Nie – bo poziomy 2–5 nie mają atrybutów","ok":false,"w":"Każdy z poziomów 2–5 ma dwa atrybuty."}],"fz":{"h":"Wspólne atrybuty poziomów 2–5","p":"P1","pulapka":false,"n":"EN: Generic attributes for levels 2–5","q":"Czy atrybuty poziomów 2–5 są inne dla każdego procesu?","a":"Nie. Są wspólne dla wszystkich procesów. PRM definiuje przeznaczenie i wyniki procesów (Wymiar Procesu, poziom 1); PAM dodaje wskaźniki oceny, w tym wspólne wskaźniki zdolności dla poziomów 1–5.","ex":"Pytania „czy jest plan?”, „czy jest standard?” zadaje się tak samo zmywakowi i grillowi. Różni się tylko pytanie z poziomu 1: co dane stanowisko ma robić.","org":""}},"fz-D-083":{"id":"fz-D-083","typ":"egzamin","s":"PC-01-02","t":"Planowanie, monitorowanie i korygowanie wykonania ocenianego procesu – do którego atrybutu należy?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42"],"r":null,"zap":"","scen":"","o":[{"t":"PA 1.1 Wykonanie procesu (poziom 1)","ok":false,"w":"PA 1.1 sprawdza tylko, czy proces osiąga cel."},{"t":"PA 2.1 Zarządzanie wydajnością (poziom 2)","ok":true,"w":"Plan pracy procesu to poziom 2."},{"t":"PA 3.1 Definicja procesu (poziom 3)","ok":false,"w":"PA 3.1 dotyczy zdefiniowanego standardu."},{"t":"PA 4.2 Kontrola procesu (poziom 4)","ok":false,"w":"PA 4.2 dotyczy trzymania procesu w granicach."}],"fz":{"h":"Planowanie wykonania procesu – poziom 2","p":"P1","pulapka":true,"n":"EN: Planning = level 2","q":"Planowanie wykonania procesu – poziom 1 czy 2?","a":"Planowanie, monitorowanie i korygowanie wykonania ocenianego procesu to PA 2.1 (Zarządzanie wydajnością), poziom 2. Nie myl z planowaniem, które jest wynikiem procesu, np. APO02.","ex":"Poziom 1: obiad wychodzi, choćby na żywioł. Grafik pracy kuchni i pilnowanie zmian to już poziom 2. Haczyk: plan pracy procesu = dwójka.","org":""}},"fz-D-084":{"id":"fz-D-084","typ":"egzamin","s":"PC-02-04","t":"Co ocenia atrybut PA 1.1?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42"],"r":null,"zap":"","scen":"","o":[{"t":"Jak dobrze proces jest zarządzany","ok":false,"w":"To zakres atrybutów poziomu 2."},{"t":"Czy proces jest stale doskonalony","ok":false,"w":"To zakres poziomu 5."},{"t":"Czy proces osiąga swój cel","ok":true,"w":"PA 1.1 – Wykonanie procesu."},{"t":"Czy proces działa w granicach ilościowych","ok":false,"w":"To zakres poziomu 4."}],"fz":{"h":"PA 1.1 a pozostałe atrybuty","p":"P1","pulapka":false,"n":"EN: PA 1.1 vs higher attributes","q":"Co ocenia PA 1.1, a co pozostałe atrybuty?","a":"PA 1.1: czy proces osiąga cel (Wymiar Procesu: praktyki bazowe, produkty pracy). PA 2.1–5.2: jak dobrze proces jest zarządzany, ustanowiony, przewidywalny i doskonalony.","ex":"PA 1.1 pyta: czy obiad wychodzi? Pozostałe osiem pyta, jak porządnie kuchnia działa: czy planuje, ma receptury, mierzy i się ulepsza.","org":""}},"fz-D-085":{"id":"fz-D-085","typ":"egzamin","s":"PC-01-02","t":"Jak słownik COBIT 5 definiuje zdolność procesu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 93"],"r":null,"zap":"","scen":"","o":[{"t":"Jako mierzalną cechę odnoszącą się do każdego procesu","ok":false,"w":"To definicja atrybutu procesu."},{"t":"Jako cechę mówiącą, na ile proces potrafi osiągać obecne lub planowane cele biznesowe","ok":true,"w":"Tak podaje słownik."},{"t":"Jako liczbę praktyk bazowych procesu","ok":false,"w":"Tego słownik nie podaje."},{"t":"Jako dokumenty powstające przy wykonywaniu procesu","ok":false,"w":"To produkty pracy."}],"fz":{"h":"Atrybut procesu i zdolność procesu (słownik)","p":"P2","pulapka":false,"n":"EN: Process attribute; process capability","q":"Jak słownik COBIT 5 definiuje atrybut procesu i zdolność procesu?","a":"Atrybut procesu: mierzalna cecha zdolności procesu, odnosząca się do każdego procesu (ISO/IEC 15504). Zdolność procesu (podr. potencjał): cecha mówiąca, na ile proces potrafi osiągać obecne lub planowane cele biznesowe.","ex":"Zdolność kucharza: czy wyda obiad dla 100 osób. Atrybuty to sprawdzane cechy: plan pracy, porządek, receptury, pomiary.","org":""}}},"N":{"kont":["fz-D-004","fz-D-005","fz-D-012","q-pc-impc-013","q-pc-impc-012","q-pc-impc-017"],"decyz":["fz-D-011","fz-D-014","fz-D-026","fz-D-027","fz-D-028","q-pc-impc-032","q-pc-impc-038","q-pc-impc-039","q-pc-impc-042","q-pc-impc-045"],"pz":["fz-A-018","fz-D-008","fz-D-009","fz-D-010","fz-D-013","fz-D-014","fz-D-034","fz-D-036","q-pc-impc-026","q-pc-impc-024"],"zi":["fz-A-018","fz-D-008","fz-D-009","fz-D-010","fz-D-013","fz-D-014","fz-D-034","q-pc-impc-026","q-pc-impc-024"],"f1":["fz-D-006","fz-D-016","fz-D-017","fz-D-018","fz-D-019","fz-D-025","fz-D-031","fz-D-037","q-pc-impc-059"],"f2":["fz-D-006","fz-D-016","fz-D-017","fz-D-018","fz-D-019","fz-D-025","fz-D-031","fz-D-037","q-pc-impc-059"],"f3":["fz-D-006","fz-D-016","fz-D-017","fz-D-018","fz-D-019","fz-D-025","fz-D-031","fz-D-037","q-pc-impc-059"],"f4":["fz-D-016","fz-D-020","fz-D-021","fz-D-022","fz-D-023","fz-D-032","fz-D-033","fz-D-037","q-pc-impc-071"],"f5 function relKeys(t,en){

  if(n){ const w=n.split(' '); k.push(w.length>4?w.slice(0,3).join(' '):n); }

/* ---------- wyniki pytań testowych: zapis w przeglądarce (localStorage) i w ciasteczku ---------- */
const WYN_KEY='cobit-schemat-wyniki', WYN_COOKIE='cobitWyniki';
function wynLoad(){ let o={};
  try{ const v=localStorage.getItem(WYN_KEY); if(v) o=JSON.parse(v)||{}; }catch(_){}
  try{ const m=document.cookie.match(new RegExp('(?:^|; )'+WYN_COOKIE+'=([^;]*)')); if(m){ const c=JSON.parse(decodeURIComponent(m[1]))||{}; Object.entries(c).forEach(([k,v])=>{ if(!o[k]||(v.t||0)>(o[k].t||0)) o[k]=v; }); } }catch(_){}
  return o; }
let WYN=wynLoad();
function wynSave(){
  try{ localStorage.setItem(WYN_KEY,JSON.stringify(WYN)); }catch(_){}
  try{ const ent=Object.entries(WYN).sort((a,b)=>(b[1].t||0)-(a[1].t||0)), o={};
    for(const [k,v] of ent){ o[k]=v; if(encodeURIComponent(JSON.stringify(o)).length>3800){ delete o[k]; break; } }
    document.cookie=WYN_COOKIE+'='+encodeURIComponent(JSON.stringify(o))+';max-age=31536000;path=/;SameSite=Lax'; }catch(_){}
}

/* ---------- ilustracja cyklu wdrożenia (własny rysunek wg Ilustracji 17, FW-PL s. 38) ---------- */
function cyklHTML(){
  const C=260, rings=[[240,184,'g-amber'],[184,128,'g-teal'],[128,72,'g-purple']];
  const pt=(r,a)=>[(C+r*Math.cos(a)).toFixed(1),(C+r*Math.sin(a)).toFixed(1)];
  let svg='<svg class="cykl-svg" viewBox="0 0 520 520" role="img" aria-label="Trzy pierścienie po 7 faz: zewnętrzny zarządzanie programem, środkowy aktywowanie zmiany, wewnętrzny cykl ciągłego doskonalenia">';
  rings.forEach(([R,r,g],ri)=>{
    svg+='<g class="'+g+'">';
    for(let i=0;i<7;i++){
      const a0=-Math.PI/2+i*2*Math.PI/7+0.012, a1=-Math.PI/2+(i+1)*2*Math.PI/7-0.012, am=(a0+a1)/2;
      const [x0,y0]=pt(R,a0),[x1,y1]=pt(R,a1),[x2,y2]=pt(r,a1),[x3,y3]=pt(r,a0),[tx,ty]=pt((R+r)/2,am);
      svg+='<path d="M'+x0+' '+y0+'A'+R+' '+R+' 0 0 1 '+x1+' '+y1+'L'+x2+' '+y2+'A'+r+' '+r+' 0 0 0 '+x3+' '+y3+'Z"/>';
      svg+='<text x="'+tx+'" y="'+ty+'" text-anchor="middle" dominant-baseline="central"'+(ri===0?' class="big"':'')+'>'+(i+1)+'</text>';
    }
    svg+='</g>';
  });
  svg+='<circle cx="260" cy="260" r="68" class="core"/><text x="260" y="250" text-anchor="middle" class="core-t">7 faz</text><text x="260" y="276" text-anchor="middle" class="core-t">↻ w kółko</text></svg>';
  const legend='<div class="cykl-leg">'+RINGS.map(r=>'<span class="'+r.g+'"><i></i><span>'+esc(r.hb)+'<br><small>egzamin: '+esc(r.ex)+' · EN: <em>'+esc(r.en)+'</em></small></span></span>').join('')+'</div>';
  const table='<table class="mini cykl-tab"><tr><th></th><th>Podręcznik PL</th><th>Egzamin PL</th><th>EN</th></tr>'+
    FAZY3.map((f,i)=>'<tr class="cykl-ph"><td><b>Faza '+(i+1)+'</b></td><td><b>'+esc(f.hb)+'</b></td><td><b>'+esc(f.ex||'—')+'</b></td><td><b><em>'+esc(f.en)+'</em></b></td></tr>'+
      f.r.map((x,j)=>'<tr><td class="'+RINGS[j].g+'"><span class="rdot"></span>'+esc(RINGS[j].ex)+'</td><td>'+esc(x[0])+'</td><td>'+esc(x[1]||'—')+'</td><td><em>'+esc(x[2])+'</em></td></tr>').join('')).join('')+'</table>'+
    '<p class="note2">'+esc(EXNOTE)+'</p>';
  const opis=CYKL21.map((f,i)=>'<p><b>Faza '+(i+1)+': '+esc(FAZY3[i].hb)+'</b> '+esc(f[4])+'</p>').join('');
  return '<h3>Ilustracja: 7 faz × 3 pierścienie</h3><div class="cykl-fig">'+svg+legend+'</div>'+
    '<p class="note2">Własny rysunek na podstawie Ilustracji 17 (<button type="button" class="pref" data-p="38">FW-PL s. 38</button>, egzamin: Rysunek 17). Każda faza dzieje się naraz w trzech pierścieniach.</p>'+
    '<h3>7 faz i 21 działań: podręcznik / egzamin / EN</h3>'+table+
    '<p class="note2">Nazwy działań: polski arkusz egzaminacyjny i tłumaczenie kursu z oryginału EN (lekcja 3.19). Pierścień rozpoznasz po tym, czego dotyczy działanie: planu i korzyści (program), ludzi (zmiana) czy wszystkich aktywatorów (doskonalenie).</p>'+
    '<h3>Co dzieje się w każdej fazie</h3>'+opis;
}

/* wycinek koła dla fazy: ta sama geometria co Ilustracja 17, podświetlona tylko faza n */
function wedgeHTML(n){
  const C=110, rings=[[104,80,'g-amber'],[80,56,'g-teal'],[56,32,'g-purple']];
  const pt=(r,a)=>[(C+r*Math.cos(a)).toFixed(1),(C+r*Math.sin(a)).toFixed(1)];
  let svg='<svg class="cykl-svg wedge-svg" viewBox="0 0 220 220" role="img" aria-label="Faza '+n+' w trzech kręgach">';
  rings.forEach(([R,r,g])=>{ svg+='<g class="'+g+'">';
    for(let i=0;i<7;i++){ const a0=-Math.PI/2+i*2*Math.PI/7+0.015, a1=-Math.PI/2+(i+1)*2*Math.PI/7-0.015;
      const [x0,y0]=pt(R,a0),[x1,y1]=pt(R,a1),[x2,y2]=pt(r,a1),[x3,y3]=pt(r,a0);
      svg+='<path'+(i===n-1?'':' class="wdim"')+' d="M'+x0+' '+y0+'A'+R+' '+R+' 0 0 1 '+x1+' '+y1+'L'+x2+' '+y2+'A'+r+' '+r+' 0 0 0 '+x3+' '+y3+'Z"/>'; }
    svg+='</g>'; });
  svg+='<circle cx="110" cy="110" r="30" class="core"/><text x="110" y="110" text-anchor="middle" dominant-baseline="central" class="core-t">'+n+'</text></svg>';
  const f=FAZY3[n-1];
  const rows=f.r.map((x,j)=>'<div class="wedge-row '+RINGS[j].g+'"><span class="rdot"></span><div><div class="wedge-k">'+esc(['krąg zewnętrzny','krąg środkowy','krąg wewnętrzny'][j])+' · '+esc(RINGS[j].ex)+'</div>'+
    '<b>'+esc(x[1]||x[0])+'</b>'+(x[1]&&x[1]!==x[0]?'<div class="wedge-hb">podręcznik: '+esc(x[0])+'</div>':'')+'<div class="wedge-en"><em>'+esc(x[2])+'</em></div></div></div>').join('');
  return '<h3>Wycinek koła: faza '+n+' w trzech kręgach (Rysunek 17)</h3><div class="wedge-fig">'+svg+'<div class="wedge-rows">'+rows+'</div></div>';
}

      const d=all.filter(q=>WYN[q.u]), g=d.filter(q=>WYN[q.u].ok).length; cnt.textContent=cnt.textContent.replace(/ · rozwiązane.*$/,'')+' · rozwiązane '+d.length+' · dobrze '+g+' ('+Math.round(100*g/d.length)+'%)'; } }
  });
  draw();
}

/* strony bez ilustracji, przypięte ręcznie: streszczenie i rozdz. 1 (s. 13–16), przykłady, załączniki A–G */
const PAGES_X={z1:[13,14,15,16],z23:[13,14,15,16,47,57,58,59,60,61,63],z4:[13,14,15,16],z5:[13,14,15,16],
  akt:[30,65,66],a2:[72],a5:[83,84],cit:[49,50,51],cakt:[52,53,54],corg:[55,56],potrz:[55,56],prm:[73,74],lad:[73],zarz:[73]};
/* strony podręcznika przypięte do kafelka: wszystkie „s. N” / „s. N–M” z opisu kafelka + strony jego ilustracji */
function pagesOf(id){
  const d=INFO[id]||{}, I=window.ILU, set=new Set();
  const txt=[d.from,d.trap].concat(d.refs||[],d.traps||[],(d.tables||[]).map(t=>t.note||'')).join(' ');
  txt.replace(/(?<![\wąćęłńóśźżĄĆĘŁŃÓŚŹŻ])s\.\s?(\d{1,2})(?:\s?[–-]\s?(\d{1,2}))?/g,(m,a,b)=>{ a=+a; b=b?+b:a; if(b<a||b-a>8) b=a; for(let p=a;p<=b;p++) if(p>=1&&p<=94) set.add(p); return m; });
  txt.replace(/Ilustracj\w*\s(\d{1,2})/g,(m,n)=>{ const f=I&&I.figs[n]; if(f) f.s.forEach(p=>set.add(p)); return m; });
  (FIGS[id]||[]).forEach(n=>{ const f=I&&I.figs[String(n)]; if(f) f.s.forEach(p=>set.add(p)); });
  (PAGES_X[id]||[]).forEach(p=>set.add(p));
  return [...set].sort((x,y)=>x-y);
}
function pagesHTML(id){
  const P=pagesOf(id);
  if(!P.length) return '<p class="note2">Ten kafelek nie ma jeszcze przypiętych stron podręcznika.</p>';

      '<figcaption><button type="button" class="pref" data-p="'+p+'">FW-PL s. '+p+'</button></figcaption></figure>').join('');
}
function openPage(n){
  const T=window.FWPL;
  const max=T?Math.max(...Object.keys(T).map(Number)):94;
  n=Math.max(1,Math.min(max,n));
  pv.innerHTML='<button class="x" type="button" aria-label="Zamknij (Esc)">✕</button>'+
    '<div class="fnav"><button type="button" class="pp">◀ s. '+(n-1)+'</button><button type="button" class="pn">s. '+(n+1)+' ▶</button></div>'+
    '<h2>Podręcznik COBIT 5 PL · strona '+n+'</h2>'+
    '<img class="pvimg" alt="Strona '+n+' podręcznika COBIT 5 PL" src="'+ILU_DIR+'strona-'+String(n).padStart(3,'0')+'.jpg">'+
    '<p class="note2 pvmiss" hidden>Brak obrazu strony (lokalny katalog app/podrecznik/ilustracje/). Poniżej tekst wyciągnięty z PDF.</p>'+
    '<details class="pvtxt"><summary>Tekst strony (wyciąg z PDF, do wyszukiwania i kopiowania)</summary>'+
    (T&&T[n]!=null?'<pre class="pvt">'+esc(T[n])+'</pre>':'<p class="trap">Brak lokalnego tekstu podręcznika. Uruchom w katalogu projektu: <code>python3 notatki/generuj-tekst-podrecznika.py</code></p>')+'</details>'+
    '<p class="note2">Strona z Twojego egzemplarza (PDF, tylko lokalnie, poza gitem).</p>';
  pv.hidden=false; pv.scrollTop=0;
  { const im=pv.querySelector('.pvimg'); im.onerror=()=>{ im.remove(); pv.querySelector('.pvmiss').hidden=false; const d=pv.querySelector('.pvtxt'); if(d) d.open=true; }; }
  pv.querySelector('.x').onclick=closePage;
  pv.querySelector('.pp').onclick=()=>openPage(n-1);
  pv.querySelector('.pn').onclick=()=>openPage(n+1);
}

let RF=null;
const NEIGH={};
function fitAll(d=300){ if(!RF) return; const b=RF.getNodesBounds(RF.getNodes()); b.height+=260; RF.fitBounds(b,{padding:0.04,duration:d}); }
/* Widok zmieniamy tylko po nawigacji użytkownika. Zamknięcie panelu,
   zmiana rozmiaru okna i zakończenie ładowania nie dopasowują całej mapy. */
const VIEW_KEY='cobit-schemat-widok-v1';
function initialViewport(){ return {x:28,y:24,zoom:document.getElementById('app').clientWidth<520?0.8:0.9}; }
function readViewport(){
  try{ const v=JSON.parse(localStorage.getItem(VIEW_KEY)||'null');
    if(v&&[v.x,v.y,v.zoom].every(Number.isFinite)&&v.zoom>=0.03&&v.zoom<=2) return {x:v.x,y:v.y,zoom:v.zoom};
  }catch(_){} return null;
}
function saveViewport(v){ try{localStorage.setItem(VIEW_KEY,JSON.stringify({x:v.x,y:v.y,zoom:v.zoom}));}catch(_){} }
function focusOn(id){
  if(!RF) return;
  const el=document.getElementById('app'), W=el.clientWidth, H=el.clientHeight;
  const nid=id, n=RF.getNode(nid); if(!n) return;
  const w=(n.measured&&n.measured.width)||n.width||300, hh=(n.measured&&n.measured.height)||n.height||100;
  const cy=n.position.y+hh/2;
  if(w>1000){ const z=0.62; RF.setCenter(n.position.x+(W/2-30)/z, cy+(W<900?(H*0.28)/z:0), {zoom:z,duration:450}); return; }
  const z=Math.min(1.25, (W*0.36)/Math.max(w,1));
  const cx=n.position.x+w/2;
  if(W<900) RF.setCenter(cx, cy+(H*0.28)/z, {zoom:z,duration:450});
  else RF.setCenter(cx+(W*0.30)/z, cy, {zoom:z,duration:450});
}
function getTheme(){ try{ return localStorage.getItem(KEY)||'system'; }catch(_){ return 'system'; } }
function App(){
  const [theme,setTheme] = React.useState(getTheme());
  React.useEffect(()=>{
    if(theme==='light'||theme==='dark') root.setAttribute('data-theme',theme); else root.removeAttribute('data-theme');
    document.querySelectorAll('.theme button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.t===theme)));
    try{ localStorage.setItem(KEY,theme); }catch(_){}
  },[theme]);
  React.useEffect(()=>{
    const bs=[...document.querySelectorAll('.theme button')];
    const fns=bs.map(b=>{const f=()=>setTheme(b.dataset.t);b.addEventListener('click',f);return f;});
    return ()=>bs.forEach((b,i)=>b.removeEventListener('click',fns[i]));
  },[]);
  const [sel,setSel] = React.useState(null);
  React.useEffect(()=>{
    const f=(ev)=>setSel(ev.detail);
    window.addEventListener('cobit-sel',f);
    return ()=>window.removeEventListener('cobit-sel',f);
  },[]);
  React.useEffect(()=>{
    window.__sel=sel;
    if(sel){ showInfo(sel); focusOn(sel); }
    else clearInfo();
  },[sel]);
  React.useEffect(()=>{
    const k=(e)=>{
      if(e.target && (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.closest('.bar'))) return;
      if(e.key==='Escape') setSel(null);
      else if(e.key==='ArrowRight') setSel(s=>s?step(s,1):s);
      else if(e.key==='ArrowLeft') setSel(s=>s?step(s,-1):s);
    };
    window.addEventListener('keydown',k); return ()=>window.removeEventListener('keydown',k);
  },[]);
  const live = sel ? (NEIGH[sel]||[sel]) : null;
  const [startViewport] = React.useState(()=>readViewport()||initialViewport());
  const viewNodes = React.useMemo(()=>nodes.map(n=>!sel?n:{...n,className:live.includes(n.id)?'sel':'dim'}),[sel]);
  const viewEdges = React.useMemo(()=>edges.map(x=>{
    let y=x;
    if(x.id==='e17') y={...x,style:{...x.style,stroke:sel==='petla'?'#BA7517':'#6f6e69',strokeWidth:sel==='petla'?3.4:2.4},interactionWidth:24};
    if(sel){ const on = (x.source===sel||x.target===sel); y={...y,className:on?'':'dim'}; }
    return y;
  }),[sel]);
  return h(ReactFlow,{
    nodes:viewNodes, edges:viewEdges, nodeTypes,
    onNodeClick:(_,n)=>{ if(INFO[n.id]) setSel(n.id); },
    onEdgeClick:(_,ed)=>{ if(ed.id==='e17') setSel('petla'); },
    onPaneClick:()=>setSel(null),
    colorMode: theme,
    defaultViewport:startViewport,
    onMoveEnd:(_,viewport)=>saveViewport(viewport),
    onInit:(inst)=>{RF=inst;},
    minZoom:0.03, maxZoom:2,
    zoomOnScroll:false, panOnScroll:false, preventScrolling:false, zoomOnPinch:true,
    nodesConnectable:false, elementsSelectable:true,
    proOptions:{hideAttribution:true}
  },
    h(Background,{gap:24,size:1}),
    h(Controls,{showInteractive:false})
  );
}
createRoot(document.getElementById('app')).render(h(App));
