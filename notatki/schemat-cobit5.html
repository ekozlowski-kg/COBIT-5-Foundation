ę z innymi aktywatorami?","a":"Nawet dobrze zaprojektowany proces nie da oczekiwanych wyników, jeśli ludzie nie realizują działań prawidłowo. Skuteczność struktur zależy od wdrażania ich decyzji; przeszkodami mogą być m.in. rozbieżne intencje i niewłaściwe zachęty. Zasady i polityki komunikują wartości oraz pożądane zachowania.","ex":"Najlepszy przepis nie uratuje dania, jeśli kucharzowi się nie chce. Decyzja szefa bez zachęty i przekonania zespołu łatwo zostaje na kartce.","org":""}},"fz-C-045":{"id":"fz-C-045","typ":"egzamin","s":"EN-02-18","t":"Jaka jest kolejność elementów cyklu informacji (Rysunek 35)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 81"],"r":null,"zap":"","scen":"","o":[{"t":"Procesy biznesowe → dane → informacje → wiedza → wartość","ok":true,"w":"Wartość z kolei ukierunkowuje procesy biznesowe."},{"t":"Dane → informacje → wiedza → mądrość → wartość","ok":false,"w":"Mądrości nie ma w cyklu, a brakuje procesów biznesowych."},{"t":"Planowanie → projektowanie → budowanie/nabywanie → użytkowanie → ocena → aktualizacja","ok":false,"w":"To cykl życia informacji, nie cykl informacji."},{"t":"Dane → procesy biznesowe → wiedza → informacje → wartość","ok":false,"w":"Kolejność jest zła: z danych powstają informacje, a z nich wiedza."}],"fz":{"h":"Cykl informacji (Rysunek 35)","p":"P1","pulapka":true,"n":"EN: Information cycle: business processes → data → information → knowledge → value","q":"Czym jest cykl informacji (Rysunek 35)?","a":"Pięć elementów w kole: procesy biznesowe → dane → informacje → wiedza → wartość; wartość z kolei ukierunkowuje procesy biznesowe. Nie myl z cyklem życia informacji (6 grup etapów).","ex":"Kelner zapisuje zamówienia (dane), szef widzi, co się sprzedaje (informacja), rozumie, że goście lubią zupy (wiedza), i zmienia menu, zarabiając więcej (wartość).","org":""}},"fz-C-046":{"id":"fz-C-046","typ":"egzamin","s":"EN-02-18","t":"Która faza cyklu życia informacji obejmuje przechowywanie, udostępnianie i wykorzystanie?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 82"],"r":null,"zap":"","scen":"","o":[{"t":"Budowanie/nabywanie","ok":false,"w":"To faza poprzedzająca użytkowanie."},{"t":"Użytkowanie/obsługa","ok":true,"w":"Przechowywanie, udostępnianie i wykorzystanie są podetapami użytkowania/obsługi informacji. Ocena/monitorowanie i aktualizacja/pozbywanie się to odrębne grupy cyklu życia (s.82–83)."},{"t":"Ocena/monitorowanie","ok":false,"w":"To faza następująca po użytkowaniu."},{"t":"Aktualizacja/pozbywanie się","ok":false,"w":"To ostatnia faza cyklu życia."}],"fz":{"h":"Cykl życia informacji","p":"P1","pulapka":true,"n":"EN: Information life cycle","q":"Podaj fazy cyklu życia informacji.","a":"Planowanie → Projektowanie → Budowanie/nabywanie → Użytkowanie/obsługa (przechowywanie, udostępnianie, wykorzystanie) → Ocena/monitorowanie → Aktualizacja/pozbywanie się.","ex":"Jak z kartą dań: planujesz ją, projektujesz, drukujesz, kładziesz na stoły, sprawdzasz, czy goście ją rozumieją, a potem poprawiasz albo wyrzucasz.","org":""}},"fz-C-047":{"id":"fz-C-047","typ":"egzamin","s":"EN-02-18","t":"Jakie ogólne role interesariuszy informacji wyróżnia COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 82"],"r":null,"zap":"","scen":"","o":[{"t":"Wykonawca, odpowiedzialny decyzyjnie, konsultant, informowany","ok":false,"w":"To role w tabeli RACI (Responsible, Accountable, Consulted, Informed — odpowiedzialny wykonawczo, odpowiedzialny decyzyjnie, konsultowany, informowany)."},{"t":"Etyka organizacyjna, etyka indywidualna, zachowanie","ok":false,"w":"To poziomy celów aktywatora Kultura, etyka i zachowanie."},{"t":"Wytwórca, opiekun, konsument","ok":true,"w":"Role zależą od fazy cyklu życia informacji."},{"t":"Właściciel procesu, audytor, regulator","ok":false,"w":"Właściciel procesu, audytor lub regulator mogą być interesariuszami, lecz nie są przytoczonym ogólnym podziałem ról informacji. COBIT 5 wskazuje wytwórcę, opiekuna i konsumenta; dopuszcza też role bardziej szczegółowe (s.82)."}],"fz":{"h":"Role interesariuszy informacji","p":"P2","pulapka":false,"n":"EN: Information producer, custodian, consumer","q":"Jakie ogólne role interesariuszy informacji wyróżnia COBIT 5?","a":"Wytwórca (tworzy informacje), opiekun (przechowuje i utrzymuje), konsument (korzysta z informacji). Role zależą od fazy cyklu życia.","ex":"Zamówienie: kelner je zapisuje (wytwórca), kierownik przechowuje bloczki (opiekun), kucharz z nich gotuje (konsument). Pisze, trzyma, korzysta.","org":""}},"fz-C-048":{"id":"fz-C-048","typ":"egzamin","s":"EN-02-17","t":"Do której kategorii jakości informacji COBIT 5 należy wiarygodność?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 82"],"r":null,"zap":"","scen":"","o":[{"t":"Do jakości kontekstowej","ok":false,"w":"Kontekstowa to np. istotność, kompletność, aktualność."},{"t":"Do jakości reprezentacji","ok":false,"w":"Reprezentacja to np. zwięzłe i spójne przedstawienie."},{"t":"Do jakości bezpieczeństwa/dostępności","ok":false,"w":"Ta kategoria to dostępność i ograniczony dostęp."},{"t":"Do jakości wewnętrznej (podr. rzeczywistej)","ok":true,"w":"Razem z dokładnością, obiektywnością i reputacją (DOWR)."}],"fz":{"h":"Jakość wewnętrzna informacji","p":"P1","pulapka":true,"n":"EN: Intrinsic quality: accuracy, objectivity, believability, reputation; Believability = intrinsic","q":"Co obejmuje jakość wewnętrzna informacji (podr. rzeczywista)? Wiarygodność informacji – do której kategorii jakości COBIT 5 należy?","a":"Dokładność, obiektywność, wiarygodność, reputację – zgodność wartości danych z prawdą. Wiarygodność należy do jakości wewnętrznej (rzeczywistej), razem z dokładnością, obiektywnością i reputacją.","ex":"Czy zapis na bloczku jest prawdziwy: dokładny, bez zmyślania, godny wiary i od kelnera z dobrą opinią. Haczyk DOWR: Dokładność, Obiektywność, Wiarygodność, Reputacja. Wiarygodność to cecha samej informacji – czy można jej wierzyć, niezależnie od sytuacji.","org":""}},"fz-C-049":{"id":"fz-C-049","typ":"egzamin","s":"EN-02-17","t":"Która cecha należy do wspólnej kategorii jakości kontekstowej i reprezentacji informacji?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 82"],"r":null,"zap":"","scen":"","o":[{"t":"Dokładność","ok":false,"w":"Dokładność należy do jakości wewnętrznej."},{"t":"Obiektywność","ok":false,"w":"Obiektywność należy do jakości wewnętrznej."},{"t":"Ograniczony dostęp","ok":false,"w":"To jakość bezpieczeństwa/dostępności."},{"t":"Kompletność","ok":true,"w":"Kompletność jest wymieniona we wspólnym podwymiarze jakości kontekstowej i reprezentacji. Oznacza właściwy zakres i szczegółowość bez braków istotnych dla zadania użytkownika (s.82)."}],"fz":{"h":"Jakość kontekstowa i reprezentacji","p":"P1","pulapka":false,"n":"EN: Contextual and representational quality","q":"Co obejmuje jakość kontekstowa i jakość reprezentacji informacji?","a":"Istotność, kompletność, aktualność, odpowiednia ilość, zwięzłe przedstawienie, spójne przedstawienie, możliwość interpretacji, jasność przekazu (zrozumiałość), łatwość posługiwania się.","ex":"Kontekstowa: czy informacja pasuje do potrzeby (na temat, pełna, świeża, w sam raz). Reprezentacji: czy podano ją czytelnie, jak dobrze napisana karta dań.","org":""}},"fz-C-050":{"id":"fz-C-050","typ":"egzamin","s":"EN-02-17","t":"Co obejmuje jakość bezpieczeństwa/dostępności informacji?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 82"],"r":null,"zap":"","scen":"","o":[{"t":"Dostępność/terminowość i ograniczony dostęp","ok":true,"w":"Informacja ma być dostępna, gdy trzeba, ale tylko dla upoważnionych."},{"t":"Dokładność i reputację","ok":false,"w":"To jakość wewnętrzna."},{"t":"Istotność i kompletność","ok":false,"w":"To jakość kontekstowa."},{"t":"Zwięzłe i spójne przedstawienie","ok":false,"w":"To jakość reprezentacji."}],"fz":{"h":"Jakość bezpieczeństwa/dostępności","p":"P1","pulapka":false,"n":"EN: Security/accessibility quality: availability, restricted access","q":"Co obejmuje jakość bezpieczeństwa/dostępności informacji?","a":"Dostępność/terminowość (informacja dostępna, gdy potrzeba) oraz ograniczony dostęp (tylko dla upoważnionych).","ex":"Zeszyt z przepisami szefa: ma być pod ręką, gdy kucharz go potrzebuje, ale zamknięty przed konkurencją. Dostępny dla swoich, niedostępny dla obcych.","org":""}},"fz-C-051":{"id":"fz-C-051","typ":"egzamin","s":"EN-02-17","t":"Które z poniższych NIE należy do siedmiu kryteriów informacji z COBIT 4.1?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 63"],"r":null,"zap":"","scen":"","o":[{"t":"Integralność","ok":false,"w":"To jedno z siedmiu kryteriów COBIT 4.1."},{"t":"Zgodność","ok":false,"w":"To jedno z siedmiu kryteriów COBIT 4.1."},{"t":"Reputacja","ok":true,"w":"Reputacja to cel jakości wewnętrznej w COBIT 5, nie kryterium COBIT 4.1."},{"t":"Wiarygodność","ok":false,"w":"To jedno z siedmiu kryteriów COBIT 4.1."}],"fz":{"h":"Siedem kryteriów informacji COBIT 4.1","p":"P2","pulapka":true,"n":"EN: COBIT 4.1 information criteria","q":"Podaj siedem kryteriów informacji z COBIT 4.1.","a":"Skuteczność, wydajność, poufność, integralność, dostępność, zgodność, wiarygodność.","ex":"Weź znane z bezpieczeństwa trio PID (Poufność, Integralność, Dostępność), dołóż z przodu SW (Skuteczność, Wydajność), a na końcu ZW (Zgodność, Wiarygodność).","org":""}},"fz-C-052":{"id":"fz-C-052","typ":"egzamin","s":"EN-02-17","t":"Czym jest wydajność informacji według kryteriów COBIT 4.1?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 63"],"r":null,"zap":"","scen":"","o":[{"t":"Informacja pozwala odbiorcy wykonać jego zadanie (informacja jako produkt)","ok":false,"w":"To skuteczność."},{"t":"Informację zdobywa się i wykorzystuje małym nakładem czasu, pieniędzy i wysiłku (informacja jako usługa)","ok":true,"w":"Wydajność dotyczy procesu uzyskiwania i wykorzystywania informacji małym nakładem zasobów. Skuteczność dotyczy spełnienia potrzeb odbiorcy przez informację jako produkt (s.63)."},{"t":"Informacja jest dostępna tylko dla upoważnionych","ok":false,"w":"To poufność, w COBIT 5 ograniczony dostęp."},{"t":"Informacja jest kompletna i dokładna","ok":false,"w":"To odpowiednik integralności w COBIT 5."}],"fz":{"h":"Skuteczność i wydajność informacji (COBIT 4.1)","p":"P2","pulapka":false,"n":"EN: COBIT 4.1 effectiveness, efficiency","q":"Czym są skuteczność i wydajność informacji (kryteria COBIT 4.1)?","a":"Skuteczność: informacja pozwala odbiorcy wykonać jego zadanie (informacja jako produkt). Wydajność: taką informację zdobywa się i wykorzystuje małym nakładem czasu, pieniędzy i wysiłku (informacja jako usługa).","ex":"Skuteczny przepis pozwala ugotować danie. Wydajny – znajdziesz go w 10 sekund, a nie po godzinie przekopywania sterty kartek.","org":""}},"fz-C-053":{"id":"fz-C-053","typ":"egzamin","s":"EN-02-17","t":"Na co w COBIT 5 rozkłada się kryterium integralności z COBIT 4.1?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 63","FW-PL s. 82"],"r":null,"zap":"","scen":"","o":[{"t":"Na ograniczony dostęp","ok":false,"w":"Na ograniczony dostęp przeszła poufność."},{"t":"Na wiarygodność, reputację i obiektywność","ok":false,"w":"Na te trzy cechy rozpisano wiarygodność."},{"t":"Na cele kompletności i dokładności","ok":true,"w":"Integralność to kryterium COBIT 4.1, w COBIT 5 rozkłada się na te dwa cele."},{"t":"Na dostępność/terminowość","ok":false,"w":"To odpowiednik kryterium dostępności."}],"fz":{"h":"Kryteria COBIT 4.1 w COBIT 5","p":"P2","pulapka":true,"n":"EN: Mapping COBIT 4.1 criteria to COBIT 5 quality goals; Integrity → completeness, accuracy","q":"Jak kryteria COBIT 4.1 odwzorowano w COBIT 5? Integralność – kategoria jakości COBIT 5 czy kryterium COBIT 4.1?","a":"Integralność → kompletność i dokładność; poufność → ograniczony dostęp; dostępność → dostępność; zgodność → ujęta w każdym celu jakości; wiarygodność → wiarygodność, reputacja, obiektywność. Integralność to kryterium COBIT 4.1; w COBIT 5 rozkłada się na cele kompletności i dokładności.","ex":"Stare słowa rozpisano na nowe: „integralność” to teraz „kompletna i dokładna”, „poufność” – „ograniczony dostęp”, a „wiarygodność” rozbito na trzy cechy. W COBIT 5 pytasz: czy rachunek jest kompletny (wszystkie pozycje) i dokładny (dobre ceny)?","org":""}},"fz-C-054":{"id":"fz-C-054","typ":"egzamin","s":"EN-02-08","t":"Jak mają się kategorie celów procesu do kategorii celów aktywatora?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 69"],"r":null,"zap":"","scen":"","o":[{"t":"Są identyczne: proces też ma Jakość wewnętrzną, Jakość kontekstową, Dostęp i Bezpieczeństwo","ok":false,"w":"Logika jest ta sama, ale nazwy kategorii procesu są inne."},{"t":"Proces ma cele wiodące i cele opóźnione","ok":false,"w":"To rodzaje wskaźników, nie kategorie celów procesu."},{"t":"Proces ma cele organizacji, cele związane z IT i cele aktywatorów","ok":false,"w":"To poziomy kaskady celów."},{"t":"Ta sama logika, inne nazwy: proces ma Cele wewnętrzne, Cele kontekstowe, Cele dostępności i bezpieczeństwa","ok":true,"w":"Aktywator mówi „Jakość…”, proces mówi „Cele…”."}],"fz":{"h":"Kategorie celów procesu a aktywatora","p":"P2","pulapka":true,"n":"EN: Enabler goal categories vs process goal categories","q":"Kategorie celów procesu a kategorie celów aktywatora – czy to to samo?","a":"Ta sama logika, inne nazwy. Aktywator ogólnie: Jakość wewnętrzna, Jakość kontekstowa, Dostęp i Bezpieczeństwo. Proces: Cele wewnętrzne, Cele kontekstowe, Cele dostępności i bezpieczeństwa.","ex":"Te same trzy szuflady pod innymi etykietami: jakość samej rzeczy, przydatność w danej sytuacji, dostęp i ochrona. Aktywator mówi „Jakość…”, proces mówi „Cele…”.","org":""}},"fz-C-055":{"id":"fz-C-055","typ":"egzamin","s":"EN-02-19","t":"Które z poniższych jest jednym z trzech zastosowań modelu informacji w przykładach podręcznika?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 84"],"r":null,"zap":"","scen":"","o":[{"t":"Określenie wymaganej ochrony informacji","ok":true,"w":"Przykład 14 pokazuje użycie atrybutów informacji i jej cyklu życia do ustalenia wymaganej ochrony i mechanizmów zabezpieczających. Pozostałe zastosowania z przykładów 13 i 15 to specyfikacja informacji i ocena łatwości korzystania z danych (s.84)."},{"t":"Wyznaczenie przewodniczącego komitetu ds. strategii","ok":false,"w":"To sprawa struktur organizacyjnych, nie modelu informacji."},{"t":"Ustalenie zakresu kontroli struktury","ok":false,"w":"To dobra praktyka struktur organizacyjnych."},{"t":"Wybór między nabyciem a samodzielnym tworzeniem rozwiązania","ok":false,"w":"To pryncypium architektury."}],"fz":{"h":"Zastosowania modelu informacji","p":"P2","pulapka":false,"n":"EN: Information model uses","q":"Podaj trzy zastosowania modelu informacji z przykładów podręcznika.","a":"Określenie specyfikacji informacji (np. dla nowej aplikacji), określenie wymaganej ochrony, określenie łatwości korzystania z danych (przegląd jakości informacji).","ex":"Jak lista kontrolna przy zamawianiu nowego systemu kasy: co ma zawierać informacja, jak ją chronić i czy łatwo z niej korzystać.","org":""}},"fz-C-056":{"id":"fz-C-056","typ":"egzamin","s":"EN-02-21","t":"Czym jest zdolność usługowa (podr. zdolność do świadczenia usług)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 85"],"r":null,"zap":"","scen":"","o":[{"t":"Poziomem usług uzgodnionym z dostawcą","ok":false,"w":"Poziomy usług to osobna dobra praktyka."},{"t":"Zasobami, takimi jak aplikacje i infrastruktura, wykorzystywanymi do świadczenia usług IT","ok":true,"w":"Zdolność usługowa oznacza zasoby, np. aplikacje i infrastrukturę, wykorzystywane do świadczenia usług związanych z informatyką. Nie jest samym uzgodnionym poziomem usługi ani indywidualną umiejętnością pracownika (s.85)."},{"t":"Umiejętnościami personelu Service Desk","ok":false,"w":"To aktywator Ludzie, umiejętności i kompetencje."},{"t":"Kolejnymi etapami dojścia do architektury docelowej","ok":false,"w":"To architektura przejściowa."}],"fz":{"h":"Zdolność usługowa","p":"P2","pulapka":false,"n":"EN: Service capabilities","q":"Czym jest zdolność usługowa?","a":"Zasobami, takimi jak aplikacje i infrastruktura, wykorzystywanymi do świadczenia usług związanych z IT. Podr.: zdolność do świadczenia usług.","ex":"To sprzęt i programy, którymi restauracja obsługuje gości: kasa, system rezerwacji, kuchenka. Czyli czym dysponujesz, żeby móc świadczyć usługę.","org":""}},"fz-C-057":{"id":"fz-C-057","typ":"egzamin","s":"EN-02-20","t":"Czy architektura referencyjna (EN baseline) opisuje stan obecny czy docelowy?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 85"],"r":null,"zap":"","scen":"","o":[{"t":"Docelowy – to przyszła, planowana zdolność usługowa","ok":false,"w":"Przyszłą zdolność opisuje architektura docelowa."},{"t":"Ani jeden, ani drugi – to etapy pośrednie","ok":false,"w":"Etapy pośrednie opisuje architektura przejściowa."},{"t":"Ani jeden, ani drugi – to inna nazwa modelu referencyjnego procesów","ok":false,"w":"Fiszka ostrzega, by nie mylić jej z modelem referencyjnym."},{"t":"Obecny – to architektura bazowa, czyli bieżąca zdolność usługowa","ok":true,"w":"Polski podręcznik nazywa baseline architekturą referencyjną."}],"fz":{"h":"Architektura docelowa, referencyjna, przejściowa","p":"P2","pulapka":true,"n":"EN: Target, baseline (reference), transition architecture; Reference (baseline) = current","q":"Czym różnią się architektura docelowa, referencyjna i przejściowa? Architektura referencyjna – stan obecny czy docelowy?","a":"Docelowa: przyszła, planowana zdolność usługowa. Referencyjna (EN baseline, bazowa): obecna zdolność dostarczająca bieżących usług – nie mylić z modelem referencyjnym. Przejściowa: kolejne etapy dojścia od bazowej do docelowej. Polski podręcznik nazywa referencyjną architekturę bazową (EN baseline), czyli bieżącą zdolność usługową.","ex":"Remont kuchni: jak jest dziś (referencyjna), jak ma być po remoncie (docelowa) i etapy po drodze (przejściowa). Dziś – po drodze – jutro. Referencyjna to punkt odniesienia, czyli to, co już stoi – stan obecny.","org":""}},"fz-C-058":{"id":"fz-C-058","typ":"egzamin","s":"EN-02-20","t":"Która z poniższych jest dobrą praktyką aktywatora Usługi, infrastruktura i aplikacje?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 85","FW-PL s. 86"],"r":null,"zap":"","scen":"","o":[{"t":"Procedury eskalacji","ok":false,"w":"To dobra praktyka struktur organizacyjnych."},{"t":"Repozytorium (archiwum) architektury","ok":true,"w":"Repozytorium architektury przechowuje wyniki prac, m.in. pryncypia, standardy i modele architektury. Dysponowanie nim jest dobrą praktyką usług, infrastruktury i aplikacji obok definiowania pryncypiów, punktów widzenia i poziomów usług (s.85–86)."},{"t":"Zachęty i nagrody","ok":false,"w":"To dobra praktyka kształtowania zachowań."},{"t":"Struktura polityk z obsługą wyjątków","ok":false,"w":"To element aktywatora Zasady, polityki i struktury ramowe."}],"fz":{"h":"Dobre praktyki usług, infrastruktury i aplikacji","p":"P2","pulapka":false,"n":"EN: Architecture principles, viewpoints, repository, service levels","q":"Jakie są dobre praktyki dla usług, infrastruktury i aplikacji?","a":"Pryncypia (zasady) architektury; punkty widzenia architektury, czyli sposoby jej opisu (modele, katalogi, macierze); repozytorium (archiwum) architektury; poziomy usług do zdefiniowania i osiągnięcia przez dostawców.","ex":"Remont sieci lokali: ogólne zasady budowy, rysunki i spisy sprzętu, jedno archiwum planów i umowa z serwisem „naprawa pieca w 4 godziny”.","org":""}},"fz-C-059":{"id":"fz-C-059","typ":"egzamin","s":"EN-02-20","t":"Które z poniższych NIE jest jednym z pięciu przykładowych pryncypiów architektury w COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 86"],"r":null,"zap":"","scen":"","o":[{"t":"Kompleksowość","ok":true,"w":"To cecha struktur ramowych, nie pryncypium architektury."},{"t":"Ponowne wykorzystanie","ok":false,"w":"To jedno z pięciu pryncypiów."},{"t":"Zwinność","ok":false,"w":"To jedno z pięciu pryncypiów."},{"t":"Otwartość","ok":false,"w":"To jedno z pięciu pryncypiów."}],"fz":{"h":"Pięć pryncypiów architektury","p":"P1","pulapka":false,"n":"EN: Reuse, buy vs build, simplicity, agility, openness","q":"Podaj pięć pryncypiów architektury.","a":"Pięć przykładów podanych w COBIT 5: ponowne wykorzystanie, nabywanie lub samodzielne tworzenie, prostota, zwinność, otwartość.","ex":"Urządzając kuchnię: używaj tego, co już masz, kupuj zamiast budować, prosto, z myślą o zmianach, na standardowe części. Haczyk: „Ponownie Nabyłem Prosty Zwinny Otwieracz”.","org":""}},"fz-C-060":{"id":"fz-C-060","typ":"egzamin","s":"EN-02-20","t":"Co mówi pryncypium ponownego wykorzystania?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 86"],"r":null,"zap":"","scen":"","o":[{"t":"Rozwiązania należy nabywać, chyba że jest zatwierdzony powód, by je tworzyć","ok":false,"w":"To pryncypium nabywania lub samodzielnego tworzenia."},{"t":"Architektura ma być możliwie najprostsza przy spełnieniu wymagań","ok":false,"w":"To pryncypium prostoty."},{"t":"Wspólne komponenty architektury powinny być używane przy projektowaniu i wdrażaniu rozwiązań","ok":true,"w":"Dotyczy rozwiązań w architekturze docelowej lub przejściowej."},{"t":"Architektura ma się opierać na otwartych standardach branżowych","ok":false,"w":"To pryncypium otwartości."}],"fz":{"h":"Ponowne wykorzystanie","p":"P2","pulapka":false,"n":"EN: Reuse","q":"Co mówi pryncypium ponownego wykorzystania?","a":"Wspólne komponenty architektury powinny być używane przy projektowaniu i wdrażaniu rozwiązań w architekturze docelowej lub przejściowej.","ex":"Nowy lokal dostaje ten sam sprawdzony piec i system kasowy co pozostałe, zamiast wymyślać wszystko od zera.","org":""}},"fz-C-061":{"id":"fz-C-061","typ":"egzamin","s":"EN-02-20","t":"Co mówi pryncypium nabywania lub samodzielnego tworzenia?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 86"],"r":null,"zap":"","scen":"","o":[{"t":"Rozwiązania należy tworzyć samodzielnie, chyba że zakup jest tańszy","ok":false,"w":"Jest odwrotnie: domyślnie się nabywa."},{"t":"O wyborze decyduje zawsze sam CIO, bez uzasadnienia","ok":false,"w":"Pryncypium wymaga zatwierdzonego powodu, by tworzyć samodzielnie."},{"t":"Rozwiązania należy nabywać, chyba że istnieje zatwierdzony powód, by opracować je w organizacji","ok":true,"w":"Domyślnie: kupuj."},{"t":"Wspólne komponenty należy używać w nowych rozwiązaniach","ok":false,"w":"To pryncypium ponownego wykorzystania."}],"fz":{"h":"Nabywanie lub samodzielne tworzenie","p":"P2","pulapka":false,"n":"EN: Buy vs build","q":"Co mówi pryncypium nabywania lub samodzielnego tworzenia?","a":"Rozwiązania należy nabywać, chyba że istnieje zatwierdzony powód, by opracować je w organizacji.","ex":"Kupujesz gotową zmywarkę, a nie konstruujesz własnej, chyba że szefostwo zatwierdziło ważny powód. Domyślnie: kupuj.","org":""}},"fz-C-062":{"id":"fz-C-062","typ":"egzamin","s":"EN-02-20","t":"Co oznacza pryncypium zwinności architektury?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 86"],"r":null,"zap":"","scen":"","o":[{"t":"Architektura jest możliwie najprostsza przy spełnieniu wymagań","ok":false,"w":"To pryncypium prostoty."},{"t":"Architektura skutecznie i wydajnie spełnia zmieniające się potrzeby biznesu","ok":true,"w":"Zwinność architektury pozwala skutecznie i wydajnie spełniać zmieniające się potrzeby biznesu. Prostota dotyczy ograniczania złożoności, a otwartość stosowania otwartych standardów (s.86)."},{"t":"Architektura opiera się na otwartych standardach branżowych","ok":false,"w":"To pryncypium otwartości."},{"t":"Wspólne komponenty używa się w nowych rozwiązaniach","ok":false,"w":"To pryncypium ponownego wykorzystania."}],"fz":{"h":"Prostota, zwinność, otwartość","p":"P2","pulapka":false,"n":"EN: Simplicity, agility, openness","q":"Co mówią pryncypia prostoty, zwinności i otwartości?","a":"Prostota: architektura możliwie najprostsza przy spełnieniu wymagań. Zwinność: skutecznie i wydajnie spełnia zmieniające się potrzeby biznesu. Otwartość: oparta na otwartych standardach branżowych.","ex":"Kuchnia ma być prosta, ale wystarczająca; łatwa do przestawienia pod nowe menu; na standardowe części pasujące do sprzętu wielu producentów.","org":""}},"fz-C-063":{"id":"fz-C-063","typ":"egzamin","s":"EN-02-21","t":"Proces wymaga uruchomienia środowiska testowego, a po jego zakończeniu środowisko jest przekazywane kolejnemu zespołowi. Co ilustruje to w relacjach Usług, Infrastruktury i Aplikacji z procesami?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 86"],"r":null,"zap":"","scen":"","o":[{"t":"Zdolności usługowe mogą być wejściami i wyjściami praktyk oraz działań","ok":true,"w":"Środowisko testowe jest zdolnością usługową wykorzystywaną przez proces. COBIT 5 dopuszcza zdolności usługowe jako wejścia oraz wyniki praktyk i działań. Informacja także jest jedną ze zdolności usługowych; świadczenie usług wymaga ponadto właściwej kultury (s.86)."},{"t":"Wymagane poziomy usług wyznaczają kategorie jakości informacji","ok":false,"w":"Poziomy usług określają wymagania wobec świadczenia usług; nie wyznaczają trzech kategorii jakości informacji (s.82,86)."},{"t":"Mandat struktury organizacyjnej definiuje szczegółowe działania procesu","ok":false,"w":"Mandat określa powód i cel istnienia struktury. Szczegółowe działania dotyczą wdrażania praktyk procesu i wymagają odpowiednich wytycznych (s.70,75)."},{"t":"Ocena umiejętności personelu wyznacza poziom zdolności procesu","ok":false,"w":"Umiejętności personelu wspierają proces, lecz jego zdolność ocenia się na podstawie wyników i atrybutów procesu, a nie samej kompetencji ludzi (s.42–46,87)."}],"fz":{"h":"Usługi a inne aktywatory","p":"P2","pulapka":false,"n":"EN: Services – relationships","q":"Jak usługi wiążą się z innymi aktywatorami?","a":"Informacja jest jedną ze zdolności usługowych, wykorzystywanych przez procesy; kultura ukierunkowana na usługi wymaga zachowań; wejścia i wyjścia praktyk mogą obejmować zdolności usługowe.","ex":"System zamówień przechowuje bloczki (informacja), z których korzysta kuchnia (proces), a obsługa nastawiona na gościa wymaga odpowiedniego zachowania kelnerów (kultura).","org":""},"przyklad":"Środowisko testowe dostarczone zespołowi jest wejściem zdolności usługowej; gotowe środowisko przekazane do dalszej pracy może być wynikiem. Procesy wykorzystują przy tym informację, a skuteczna obsługa użytkowników wymaga odpowiedniej kultury."},"fz-C-064":{"id":"fz-C-064","typ":"egzamin","s":"EN-02-22","t":"Co należy do celów aktywatora Ludzie, umiejętności i kompetencje?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 87"],"r":null,"zap":"","scen":"","o":[{"t":"Zakres kontroli struktury","ok":false,"w":"To dobra praktyka struktur organizacyjnych."},{"t":"Ograniczony dostęp do informacji","ok":false,"w":"To cel jakości bezpieczeństwa informacji."},{"t":"Zgodność z otwartymi standardami branżowymi","ok":false,"w":"To pryncypium otwartości architektury."},{"t":"Dostępność personelu i wskaźnik rotacji","ok":true,"w":"Cele dotyczące ludzi obejmują odpowiednią dostępność personelu i wskaźnik rotacji. Cele umiejętności i kompetencji obejmują m.in. kwalifikacje, umiejętności techniczne, doświadczenie, wiedzę i umiejętności behawioralne (s.87)."}],"fz":{"h":"Cele aktywatora Ludzie, umiejętności i kompetencje","p":"P2","pulapka":false,"n":"EN: People, skills and competencies – goals","q":"Czego dotyczą cele aktywatora Ludzie, Umiejętności i Kompetencje?","a":"Wykształcenia i kwalifikacji, umiejętności technicznych, doświadczenia, wiedzy, umiejętności behawioralnych (np. współpraca); także dostępności personelu i wskaźnika rotacji (odejść z pracy).","ex":"Kucharz: dyplom szkoły, umie filetować rybę, ma lata praktyki, zna przepisy, dogaduje się z zespołem. Liczy się też, czy jest w grafiku i czy ludzie nie odchodzą.","org":""}},"fz-C-065":{"id":"fz-C-065","typ":"egzamin","s":"EN-02-22","t":"Który etap należy do cyklu życia umiejętności?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 87"],"r":null,"zap":"","scen":"","o":[{"t":"Archiwizowanie nieaktualnych wersji polityk","ok":false,"w":"To element cyklu życia polityki."},{"t":"Pozbywanie się umiejętności, np. po automatyzacji lub outsourcingu","ok":true,"w":"Cykl życia umiejętności może obejmować rezygnację z utrzymywania określonych umiejętności w organizacji, np. po automatyzacji lub outsourcingu. Obejmuje też planowanie, rozwój/pozyskiwanie, wdrażanie w rolach i okresową ocenę bazy (s.87)."},{"t":"Delegowanie uprawnień podległym strukturom","ok":false,"w":"To dobra praktyka struktur organizacyjnych."},{"t":"Przekształcanie danych w informacje i wiedzę","ok":false,"w":"To cykl informacji."}],"fz":{"h":"Cykl życia umiejętności","p":"P2","pulapka":false,"n":"EN: Skills life cycle","q":"Jak wygląda cykl życia umiejętności?","a":"Wgląd w obecną bazę i planowanie; rozwijanie (szkolenia) lub pozyskiwanie (rekrutacja); wdrażanie w rolach; pozbywanie się (np. po automatyzacji, outsourcingu); okresowa (np. roczna) ocena bazy.","ex":"Sprawdzasz, co umie zespół, uczysz albo zatrudniasz, przydzielasz do stanowisk, rezygnujesz z niepotrzebnych umiejętności (np. po kupnie maszyny do pierogów), co rok oceniasz.","org":""}},"fz-C-066":{"id":"fz-C-066","typ":"egzamin","s":"EN-02-22","t":"Jaka jest dobra praktyka dla umiejętności i kompetencji?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 87"],"r":null,"zap":"","scen":"","o":[{"t":"Zdefiniowanie mandatu dla każdej roli","ok":false,"w":"Mandat definiuje się dla struktury organizacyjnej."},{"t":"Przypisanie jednego odpowiedzialnego decyzyjnie (A) do każdej umiejętności","ok":false,"w":"Jeden A dotyczy praktyk w tabeli RACI."},{"t":"Oparcie wymagań wyłącznie na stażu pracy","ok":false,"w":"Wymagania mają być obiektywne, z poziomami i definicjami umiejętności."},{"t":"Zdefiniowanie obiektywnych wymagań umiejętności dla każdej roli, np. z użyciem SFIA","ok":true,"w":"Fiszka: poziomy i definicje umiejętności, zewnętrzne źródła jak SFIA."}],"fz":{"h":"Dobre praktyki dla umiejętności i kompetencji","p":"P2","pulapka":false,"n":"EN: Skill requirements per role; SFIA","q":"Jakie są dobre praktyki dla umiejętności i kompetencji?","a":"Zdefiniowanie obiektywnych wymagań umiejętności dla każdej roli: poziomy umiejętności w kategoriach umiejętności i definicje umiejętności; zewnętrzne źródła, np. SFIA.","ex":"Dla każdego stanowiska w kuchni spisujesz, co trzeba umieć i na jakim poziomie, np. „kucharz od sushi: poziom 3”. Można sięgnąć po gotowy katalog, np. SFIA.","org":""}},"fz-C-067":{"id":"fz-C-067","typ":"egzamin","s":"EN-02-23","t":"Jakie kategorie umiejętności Rysunek 39 przypisuje do domeny MEA?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 88"],"r":null,"zap":"","scen":"","o":[{"t":"Weryfikacja zgodności, monitorowanie wydajności, audyt mechanizmów kontrolnych","ok":true,"w":"MEA to sprawdzanie: kontrolerzy."},{"t":"Ład IT w organizacji","ok":false,"w":"To kategoria przypisana do EDM."},{"t":"Strategia IT, architektura korporacyjna, innowacje","ok":false,"w":"To kategorie APO."},{"t":"Zarządzanie dostępnością, Service Desk i incydenty","ok":false,"w":"To kategorie DSS."}],"fz":{"h":"Kategorie umiejętności EDM i MEA (Rysunek 39)","p":"P1","pulapka":false,"n":"EN: Skill categories EDM, MEA","q":"Jakie kategorie umiejętności przypisano do EDM i MEA (Rysunek 39)?","a":"EDM: Ład IT w organizacji. MEA: weryfikacja zgodności, monitorowanie wydajności, audyt mechanizmów kontrolnych.","ex":"EDM (Ład, sama góra): umiejętność rządzenia IT. MEA (sprawdzanie): kontrolerzy – zgodność, wyniki, audyt. Jak właściciel lokalu i inspektor sanepidu.","org":""}},"fz-C-068":{"id":"fz-C-068","typ":"egzamin","s":"EN-02-23","t":"Do której domeny Rysunek 39 przypisuje kategorię umiejętności „zarządzanie portfelami”?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 88"],"r":null,"zap":"","scen":"","o":[{"t":"EDM","ok":false,"w":"EDM (Evaluate, Direct and Monitor — Oszacuj, Kieruj i Monitoruj) ma jedną kategorię: Ład IT (Information Technology — technologie informatyczne) w organizacji."},{"t":"BAI","ok":false,"w":"BAI (Build, Acquire and Implement — Twórz, Nabywaj i Wdrażaj) to np. analiza biznesowa i zarządzanie projektami."},{"t":"APO","ok":true,"w":"APO (Align, Plan and Organise — Dostosuj, Planuj i Organizuj) obejmuje m.in. strategię IT (Information Technology — technologie informatyczne), zarządzanie finansowe i portfelami."},{"t":"MEA","ok":false,"w":"MEA (Monitor, Evaluate and Assess — Monitoruj, Oszacuj i Oceń) to weryfikacja zgodności, monitorowanie wydajności i audyt."}],"fz":{"h":"Kategorie umiejętności APO (Rysunek 39)","p":"P1","pulapka":false,"n":"EN: Skill categories APO","q":"Jakie kategorie umiejętności przypisano do APO (Rysunek 39)?","a":"Opracowanie polityki IT, strategia IT, architektura korporacyjna, innowacje, zarządzanie finansowe, zarządzanie portfelami.","ex":"APO to planowanie i organizowanie – jak planowanie nowej restauracji: regulaminy, strategia, układ lokalu, nowe pomysły, budżet i wybór, w co inwestować.","org":""}},"fz-C-069":{"id":"fz-C-069","typ":"egzamin","s":"EN-02-23","t":"Do której domeny Rysunek 39 przypisuje kategorię umiejętności „analiza biznesowa”?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 88"],"r":null,"zap":"","scen":"","o":[{"t":"BAI","ok":true,"w":"BAI (Build, Acquire and Implement — Twórz, Nabywaj i Wdrażaj) obejmuje m.in. analizę biznesową, zarządzanie projektami i programowanie."},{"t":"APO","ok":false,"w":"APO (Align, Plan and Organise — Dostosuj, Planuj i Organizuj) to np. strategia IT (Information Technology — technologie informatyczne), innowacje i zarządzanie portfelami."},{"t":"DSS","ok":false,"w":"DSS (Deliver, Service and Support — Dostarczaj, Obsługuj i Wspieraj) to np. zarządzanie problemami i eksploatacja IT (Information Technology — technologie informatyczne)."},{"t":"EDM","ok":false,"w":"EDM (Evaluate, Direct and Monitor — Oszacuj, Kieruj i Monitoruj) ma jedną kategorię: Ład IT (Information Technology — technologie informatyczne) w organizacji."}],"fz":{"h":"Kategorie umiejętności BAI (Rysunek 39)","p":"P1","pulapka":false,"n":"EN: Skill categories BAI","q":"Jakie kategorie umiejętności przypisano do BAI (Rysunek 39)?","a":"Analiza biznesowa, zarządzanie projektami, ocena użyteczności, definiowanie wymagań i zarządzanie nimi, programowanie, ergonomia systemu, wycofanie oprogramowania, zarządzanie pojemnością.","ex":"BAI to budowanie – jak stawianie nowego lokalu: analiza potrzeb, kierowanie budową, wygoda gości, lista wymagań, wykonanie, rozbiórka starego i miejsce na odpowiednią liczbę gości.","org":""}},"fz-C-070":{"id":"fz-C-070","typ":"egzamin","s":"EN-02-23","t":"Do której domeny Rysunek 39 przypisuje kategorię umiejętności „administrowanie bazami danych”?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 88"],"r":null,"zap":"","scen":"","o":[{"t":"BAI","ok":false,"w":"BAI (Build, Acquire and Implement — Twórz, Nabywaj i Wdrażaj) to np. programowanie i wycofanie oprogramowania."},{"t":"APO","ok":false,"w":"APO (Align, Plan and Organise — Dostosuj, Planuj i Organizuj) to np. architektura korporacyjna i zarządzanie finansowe."},{"t":"MEA","ok":false,"w":"MEA (Monitor, Evaluate and Assess — Monitoruj, Oszacuj i Oceń) to weryfikacja zgodności, monitorowanie wydajności i audyt."},{"t":"DSS","ok":true,"w":"DSS (Deliver, Service and Support — Dostarczaj, Obsługuj i Wspieraj) obejmuje m.in. eksploatację IT (Information Technology — technologie informatyczne) i administrowanie bazami danych."}],"fz":{"h":"Kategorie umiejętności DSS (Rysunek 39)","p":"P1","pulapka":false,"n":"EN: Skill categories DSS","q":"Jakie kategorie umiejętności przypisano do DSS (Rysunek 39)?","a":"Zarządzanie dostępnością, zarządzanie problemami, Service Desk i incydenty, administracja bezpieczeństwa, eksploatacja IT, administrowanie bazami danych.","ex":"DSS to codzienna praca – jak obsługa otwartej restauracji: lokal czynny, szukanie przyczyn usterek, przyjmowanie skarg, ochrona, praca kuchni i porządek w spiżarni (bazy danych).","org":""}},"fz-C-071":{"id":"fz-C-071","typ":"egzamin","s":"EN-02-23","t":"Do których domen Rysunek 39 przypisuje kategorie umiejętności „zarządzanie dostępnością” i „zarządzanie pojemnością”?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 88"],"r":null,"zap":"","scen":"","o":[{"t":"Obie – BAI, bo łączy je proces BAI04","ok":false,"w":"BAI04 łączy obie, ale Rysunek 39 dotyczy umiejętności, nie procesów."},{"t":"Dostępność – DSS, pojemność – BAI","ok":true,"w":"Rysunek 39 przypisuje kategorie umiejętności, nie procesy."},{"t":"Obie – DSS","ok":false,"w":"Pojemność jest w Rysunku 39 przypisana do BAI (Build, Acquire and Implement — Twórz, Nabywaj i Wdrażaj)."},{"t":"Dostępność – BAI, pojemność – DSS","ok":false,"w":"Odwrotnie: dostępność to DSS (Deliver, Service and Support — Dostarczaj, Obsługuj i Wspieraj), pojemność to BAI (Build, Acquire and Implement — Twórz, Nabywaj i Wdrażaj)."}],"fz":{"h":"Zarządzanie dostępnością a pojemnością (Rysunek 39)","p":"P2","pulapka":true,"n":"EN: Availability DSS, capacity BAI (skills)","q":"Zarządzanie dostępnością a zarządzanie pojemnością – które domeny (Rysunek 39)?","a":"Dostępność – DSS, pojemność – BAI, choć proces BAI04 łączy obie. Rysunek 39 przypisuje kategorie umiejętności, nie procesy.","ex":"Dostępność to „lokal czynny” – codzienna obsługa (DSS). Pojemność to „ile stolików zbudować” – budowanie (BAI). Rysunek 39 dotyczy umiejętności, nie procesów.","org":""}},"fz-C-072":{"id":"fz-C-072","typ":"egzamin","s":"EN-02-10","t":"Czym różni się praktyka od działania?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 70"],"r":null,"zap":"","scen":"","o":[{"t":"Praktyka mówi, JAK to zrobić; działanie – CO trzeba osiągnąć","ok":false,"w":"Odwrotnie: praktyka to CO, działanie to JAK."},{"t":"Działanie to szczegółowa instrukcja z ITIL lub PRINCE2","ok":false,"w":"To opis szczegółowego działania, poziom niżej."},{"t":"Praktyka mówi, CO trzeba osiągnąć; działanie – JAK, czyli konieczne i wystarczające kroki","ok":true,"w":"Tak rozróżnia je fiszka."},{"t":"Praktyka i działanie to synonimy","ok":false,"w":"To dwa różne poziomy opisu procesu."}],"fz":{"h":"Praktyka, działanie, szczegółowe działanie","p":"P1","pulapka":true,"n":"EN: Practice vs activity vs detailed activity","q":"Praktyka, działanie, szczegółowe działanie – czym się różnią?","a":"Praktyka: CO trzeba osiągnąć (ogólne wymagania). Działanie: JAK – konieczne i wystarczające kroki do wdrożenia praktyki. Szczegółowe działanie: jeszcze niżej, z ITIL, ISO/IEC 27000, PRINCE2.","ex":"Praktyka: „podać ciepłą zupę” (CO). Działanie: „podgrzej, nalej, zanieś” (JAK). Szczegółowe działanie: dokładna instrukcja z zewnętrznego poradnika (np. ITIL).","org":""}},"fz-C-073":{"id":"fz-C-073","typ":"egzamin","s":"EN-01-01,EN-02-10","t":"Jaką hierarchię mają proces, praktyka i działanie?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 27","FW-PL s. 69","FW-PL s. 70","FW-PL s. 89","FW-PL s. 93"],"r":null,"zap":"Proces obejmuje praktyki; praktyki rozwija się w działania, a te w razie potrzeby w działania szczegółowe. Praktyki mówią ogólnie, co robić; działania opisują konieczne i wystarczające kroki wdrożenia. Działania nie są normatywne: trzeba je dostosować i rozwinąć w procedury organizacji.","scen":"","o":[{"t":"Praktyka obejmuje procesy, a procesy rozwija się w działania","ok":false,"w":"To proces obejmuje praktyki, nie odwrotnie."},{"t":"Proces to zbiór praktyk, więc nie zawiera działań","ok":false,"w":"Działania są w procesie, tylko piętro niżej."},{"t":"Proces obejmuje praktyki, praktyki rozwija się w działania, a te w razie potrzeby w działania szczegółowe","ok":true,"w":"Proces obejmuje praktyki, a te można rozwijać w działania i działania szczegółowe. Praktyki są ogólnymi deklaracjami; działania dostarczają kroków wdrożenia, które trzeba dostosować do organizacji (s.69–70)."},{"t":"Działanie obejmuje praktyki, a praktyki – procesy","ok":false,"w":"Hierarchia jest odwrócona."}],"fz":{"h":"Proces, praktyka, działanie – hierarchia","p":"P1","pulapka":true,"n":"EN: Process = set of practices","q":"Jaką hierarchię mają proces, praktyka i działanie?","a":"Proces obejmuje praktyki ukierunkowane przez polityki i procedury, które zamieniają wejścia w wyniki. Praktyki rozwija się w działania, a te w razie potrzeby w działania szczegółowe. Definicja egzaminacyjna: proces to zbiór praktyk – co nie znaczy, że nie ma w nim działań.","ex":"Menu (proces) to zbiór dań (praktyk), a kroki przygotowania (działania) są w przepisie każdego dania. Działania są w procesie, tylko piętro niżej.","org":""}},"fz-C-074":{"id":"fz-C-074","typ":"egzamin","s":"EN-02-25","t":"Ilu odpowiedzialnych decyzyjnie (A) może mieć jedna praktyka w tabeli RACI?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 89"],"r":null,"zap":"","scen":"","o":[{"t":"Dowolnie wielu, tak jak wykonawców (R)","ok":false,"w":"Wielu wykonawców R (Responsible — odpowiedzialny wykonawczo) jest dopuszczalnych; dla jednej praktyki w danym zakresie wskazuje się jedną rolę A (Accountable — odpowiedzialny decyzyjnie). Także role C (Consulted — konsultowany) i I (Informed — informowany) mogą obejmować wiele osób lub jednostek."},{"t":"Dwóch – po jednym z biznesu i z IT","ok":false,"w":"A (Accountable — odpowiedzialny decyzyjnie) jest zawsze jeden."},{"t":"Tylu, ilu jest konsultantów (C)","ok":false,"w":"Liczba A (Accountable — odpowiedzialny decyzyjnie) nie zależy od C (Consulted — konsultowany); A (Accountable — odpowiedzialny decyzyjnie) jest jeden."},{"t":"Jednego","ok":true,"w":"Ostatecznej odpowiedzialności (A (Accountable — odpowiedzialny decyzyjnie)) się nie dzieli."}],"fz":{"h":"Jeden odpowiedzialny decyzyjnie (A)","p":"P1","pulapka":true,"n":"EN: Only one Accountable","q":"Ilu odpowiedzialnych decyzyjnie (A) może mieć jedna praktyka?","a":"Jednego. A (Accountable) to ostateczna odpowiedzialność za powodzenie – nie dzieli się jej; R (wykonawców) może być wielu.","ex":"Gotować może pięciu kucharzy (R), ale za danie odpowiada jeden szef (A). Dwóch szefów od jednego dania to w praktyce żaden.","org":""}},"fz-C-075":{"id":"fz-C-075","typ":"egzamin","s":"EN-02-25","t":"Jak w RACI wygląda komunikacja z rolami C (Konsultant) i I (Informowany)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 90"],"r":null,"zap":"","scen":"","o":[{"t":"C – dwukierunkowa, I – jednokierunkowa","ok":true,"w":"Konsultanta pytasz i słuchasz, Informowanemu tylko mówisz."},{"t":"C – jednokierunkowa, I – dwukierunkowa","ok":false,"w":"Odwrotnie: dwukierunkowa jest komunikacja z C (Consulted — konsultowany)."},{"t":"Obie dwukierunkowe","ok":false,"w":"Z Informowanym komunikacja jest jednokierunkowa."},{"t":"Obie jednokierunkowe","ok":false,"w":"Z Konsultantem komunikacja jest dwukierunkowa."}],"fz":{"h":"RACI: C i I","p":"P1","pulapka":true,"n":"EN: Consulted two-way, Informed one-way","q":"Która rola RACI ma komunikację dwukierunkową, a która jednokierunkową?","a":"C (Konsultant) – dwukierunkową; I (Informowany) – jednokierunkową.","ex":"Konsultanta pytasz i słuchasz odpowiedzi – rozmowa w obie strony. Informowanemu tylko mówisz, jak ogłoszenie na tablicy. Haczyk: C jak czat, I jak info.","org":""}},"fz-C-076":{"id":"fz-C-076","typ":"egzamin","s":"EN-02-13","t":"Za co według Rysunku 33 odpowiada Zarząd?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 76"],"r":null,"zap":"","scen":"","o":[{"t":"Za całe zarządzanie organizacją jako najwyższy rangą dyrektor","ok":false,"w":"To rola CEO."},{"t":"Za Ład organizacji i ogólną kontrolę nad jej zasobami","ok":true,"w":"Tak opisuje Zarząd fiszka."},{"t":"Za funkcjonowanie organizacji","ok":false,"w":"To rola COO."},{"t":"Za działalność jednej jednostki biznesowej lub spółki zależnej","ok":false,"w":"To rola członka naczelnego kierownictwa (Business Executive)."}],"fz":{"h":"Zarząd i CEO (Rysunek 33)","p":"P2","pulapka":false,"n":"EN: Board; Chief Executive Officer","q":"Za co odpowiadają Zarząd i CEO (Rysunek 33)?","a":"Zarząd: najwyżsi przedstawiciele kierownictwa i/lub dyrektorzy niewykonawczy, rozliczani z Ładu organizacji i sprawujący ogólną kontrolę nad jej zasobami. CEO (dyrektor generalny): najwyższy rangą dyrektor, odpowiedzialny za całe zarządzanie organizacją.","ex":"W szkole: rada szkoły pilnuje kierunku i majątku (Zarząd), a dyrektor prowadzi szkołę na co dzień (CEO).","org":""}},"fz-C-077":{"id":"fz-C-077","typ":"egzamin","s":"EN-02-13","t":"Kim w Rysunku 33 jest członek naczelnego kierownictwa (EN Business Executive)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 76"],"r":null,"zap":"","scen":"","o":[{"t":"Dyrektorem odpowiedzialnym za funkcjonowanie całej organizacji","ok":false,"w":"To rola COO."},{"t":"Najwyższym rangą dyrektorem, odpowiedzialnym za całe zarządzanie","ok":false,"w":"To rola CEO."},{"t":"Osobą odpowiedzialną za planowanie i polityki kadrowe","ok":false,"w":"To rola dyrektora ds. zasobów ludzkich."},{"t":"Osobą odpowiedzialną za działalność jednej jednostki biznesowej lub spółki zależnej","ok":true,"w":"Tak opisuje tę rolę fiszka."}],"fz":{"h":"COO, Business Executive, dyrektor ds. zasobów ludzkich","p":"P2","pulapka":false,"n":"EN: COO; Business Executive; Head of Human Resources","q":"Za co odpowiadają COO, członek naczelnego kierownictwa i dyrektor ds. zasobów ludzkich?","a":"COO (dyrektor operacyjny): funkcjonowanie organizacji. Członek naczelnego kierownictwa (EN Business Executive): działalność jednej jednostki biznesowej lub spółki zależnej. Dyrektor ds. zasobów ludzkich: planowanie i polityki kadrowe.","ex":"Sieć pizzerii: COO pilnuje, by wszystkie lokale działały; szef jednego lokalu to Business Executive; kadrowa planuje zatrudnienie.","org":""}},"fz-C-078":{"id":"fz-C-078","typ":"egzamin","s":"EN-02-13","t":"Za co odpowiada dyrektor ds. administracji IT?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 76–77"],"r":null,"zap":"","scen":"","o":[{"t":"Za środowiska operacyjne i infrastrukturę IT","ok":false,"w":"To dyrektor ds. operacji IT (Information Technology — technologie informatyczne)."},{"t":"Za procesy tworzenia rozwiązań IT","ok":false,"w":"To dyrektor ds. rozwoju."},{"t":"Za zapisy (dokumentację) i sprawy administracyjne IT","ok":true,"w":"Dyrektor ds. administracji IT (Information Technology — technologie informatyczne) odpowiada za zapisy i sprawy administracyjne związane z informatyką. Rysunek 33 odróżnia ten zakres od infrastruktury operacyjnej, rozwoju rozwiązań i procesu architektury korporacyjnej (s.76–77)."},{"t":"Za proces architektury korporacyjnej","ok":false,"w":"To dyrektor ds. architektury."}],"fz":{"h":"Dyrektorzy ds. architektury, rozwoju, operacji i administracji IT","p":"P2","pulapka":false,"n":"EN: Head of Architecture, Development, IT Operations, IT Administration","q":"Za co odpowiadają dyrektorzy ds. architektury, rozwoju, operacji IT i administracji IT?","a":"To członkowie wyższej kadry kierowniczej. Architektura: proces architektury korporacyjnej. Rozwój: procesy tworzenia rozwiązań IT. Operacje IT: środowiska operacyjne i infrastruktura IT. Administracja IT: zapisy (dokumentacja) i sprawy administracyjne IT.","ex":"Przy budowie domu: architekt pilnuje projektu, kierownik budowy stawia ściany, administrator dba o instalacje, a sekretariat o papiery.","org":""}},"fz-C-079":{"id":"fz-C-079","typ":"egzamin","s":"EN-02-13","t":"Za co odpowiada kierownik ds. ciągłości działalności biznesowej?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 77"],"r":null,"zap":"","scen":"","o":[{"t":"Za rozwój i prowadzenie usług dla konkretnego klienta lub grupy klientów","ok":false,"w":"To kierownik ds. usług."},{"t":"Za zdolność organizacji do utrzymania funkcji krytycznych po zdarzeniach zakłócających","ok":true,"w":"Kierownik ds. ciągłości działalności biznesowej zarządza zdolnością do utrzymania funkcji krytycznych po zakłóceniach oraz uczestniczy w jej projektowaniu, nadzorowaniu i ocenie. Nie ogranicza się to do usług jednego klienta (s.77)."},{"t":"Za ryzyko i przepisy dotyczące prywatności","ok":false,"w":"To dyrektor ds. prywatności."},{"t":"Za wszystkie aspekty zarządzania ryzykiem w organizacji","ok":false,"w":"To CRO (Chief Risk Officer — dyrektor ds. ryzyka)."}],"fz":{"h":"Kierownik ds. usług i kierownik ds. ciągłości","p":"P2","pulapka":false,"n":"EN: Service Manager; Business Continuity Manager","q":"Czym zajmują się kierownik ds. usług i kierownik ds. ciągłości działalności biznesowej?","a":"Kierownik ds. usług: rozwój, wdrożenie, ocena i prowadzenie produktów i usług dla konkretnego klienta lub grupy klientów. Kierownik ds. ciągłości: zdolność organizacji do utrzymania funkcji krytycznych po zdarzeniach zakłócających.","ex":"Kierownik sali dba o gości jednego lokalu. Ktoś inny ma plan, co robić, gdy wysiądzie prąd albo zaleje kuchnię.","org":""}},"fz-C-080":{"id":"fz-C-080","typ":"egzamin","s":"EN-02-13","t":"Czym zajmuje się dyrektor ds. prywatności (ds. ochrony danych)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 76–77"],"r":null,"zap":"","scen":"","o":[{"t":"Ryzykiem i przepisami o prywatności oraz wdrażaniem polityk prywatności","ok":true,"w":"Tak opisuje tę rolę fiszka."},{"t":"Bezpieczeństwem informacji całej organizacji we wszystkich formach","ok":false,"w":"To CISO, najwyższy szczebel bezpieczeństwa."},{"t":"Projektowaniem, nadzorem, oceną i prowadzeniem bezpieczeństwa informacji","ok":false,"w":"To kierownik ds. bezpieczeństwa informacji."},{"t":"Audytami wewnętrznymi","ok":false,"w":"To zadanie Audytu."}],"fz":{"h":"CISO, kierownik ds. bezpieczeństwa informacji, dyrektor ds. prywatności","p":"P2","pulapka":false,"n":"EN: CISO; Information Security Manager; Privacy Officer","q":"CISO, kierownik ds. bezpieczeństwa informacji i dyrektor ds. prywatności – czym się różnią?","a":"CISO: najwyższy szczebel, bezpieczeństwo informacji całej organizacji we wszystkich formach. Kierownik ds. bezpieczeństwa informacji: projektuje, nadzoruje, ocenia i prowadzi bezpieczeństwo. Dyrektor ds. prywatności (też ds. ochrony danych): ryzyko i przepisy o prywatności, wdrażanie polityk prywatności.","ex":"W straży: komendant odpowiada za bezpieczeństwo wszystkich informacji jednostki, dowódca zmiany prowadzi bieżące działania ochronne, a inspektor pilnuje, by nikt nie czytał cudzych danych osobowych.","org":""}},"fz-D-001":{"id":"fz-D-001","typ":"egzamin","s":"IM-01-01,IM-02-05","t":"Który krąg cyklu życia wdrożenia zajmuje się zachowaniem ludzi i kulturą?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 37"],"r":null,"zap":"","scen":"","o":[{"t":"Zarządzanie programem – krąg zewnętrzny","ok":false,"w":"Krąg zewnętrzny kieruje całością programu, a nie kulturą."},{"t":"Cykl ciągłego doskonalenia – krąg wewnętrzny","ok":false,"w":"Krąg wewnętrzny to samo ulepszanie, a nie ludzka strona zmiany."},{"t":"Żaden krąg – kulturą zajmuje się tylko faza 7","ok":false,"w":"Kulturą zajmuje się osobny krąg, obecny w każdej fazie."},{"t":"Aktywowanie zmiany – krąg środkowy","ok":true,"w":"Change enablement — Aktywowanie zmiany — jest środkowym pierścieniem cyklu wdrożenia. Uwzględnia ludzi, ich zachowania, kulturę, motywację i komunikację przez wszystkie fazy. Współpracuje z zarządzaniem programem i ciągłym doskonaleniem."}],"fz":{"h":"Aktywowanie zmiany","p":"P1","pulapka":true,"n":"egzamin: aktywowanie zmiany · podr.: umożliwienie zmian · EN: change enablement","q":"Na czym polega Aktywowanie zmiany i który to krąg? | Który komponent cyklu dotyczy zachowania i kultury?","a":"Krąg środkowy cyklu wdrożenia: ludzie, ich zachowania i nawyki (kultura), motywowanie zaangażowanych do przyjęcia zmiany, plan komunikacji dla każdej fazy. | Aktywowanie zmiany (podr. umożliwienie zmian / wdrożenie zmiany).","ex":"Nowa kuchnia nic nie da, jeśli domownicy dalej gotują po staremu. Ten krąg przekonuje ludzi do zmiany i na bieżąco mówi im, co się dzieje. | Kultura to „u nas tak się robi”, czyli nawyki ludzi. Ludzie są pośrodku: środkowy pierścień leży między samym ulepszaniem a kierowaniem całością.","org":"lider zmiany w każdej komendzie wojewódzkiej i comiesięczny komunikat."}},"fz-D-002":{"id":"fz-D-002","typ":"egzamin","s":"IM-02-05","t":"Na czym polega Aktywowanie zmiany?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 37"],"r":null,"zap":"","scen":"","o":[{"t":"Na zarządzaniu ludzką stroną zmiany i motywowaniu interesariuszy, z planem komunikacji dla każdej fazy","ok":true,"w":"Tak opisuje to fiszka: zachowania, nawyki, kultura i plan komunikacji."},{"t":"Na planowaniu budżetu i harmonogramu całego programu","ok":false,"w":"Kierowanie programem należy do kręgu zarządzania programem."},{"t":"Na formalnej ocenie zdolności procesów według ISO/IEC 15504","ok":false,"w":"Ocena zdolności dotyczy procesów, a nie ludzkiej strony zmiany."},{"t":"Na jednorazowym szkoleniu pracowników po zakończeniu wdrożenia","ok":false,"w":"Komunikacja i motywowanie trwają w każdej fazie, a nie raz na końcu."}],"fz":{"h":"Aktywowanie zmiany","p":"P1","pulapka":false,"n":"EN: Change enablement","q":"Na czym polega Aktywowanie zmiany?","a":"Na zarządzaniu ludzką stroną zmiany (zachowania, nawyki, kultura) i motywowaniu zaangażowanych (interesariuszy), by ją przyjęli; z planem komunikacji dla każdej fazy (treść, sposób, adresaci).","ex":"Jak zdrowa dieta całej rodziny: kupić warzywa łatwo, trudniej przekonać domowników, żeby je jedli. Plan komunikacji: co, jak i komu mówimy na każdym etapie.","org":""}},"fz-D-003":{"id":"fz-D-003","typ":"egzamin","s":"IM-01-01","t":"Które trzy komponenty tworzą cykl życia wdrożenia?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 37–38","FW-PL s. 37"],"r":null,"zap":"","scen":"","o":[{"t":"Zasady, polityki i struktury ramowe","ok":false,"w":"To nazwa jednego z siedmiu aktywatorów, a nie komponenty cyklu wdrożenia."},{"t":"Uzasadnienie biznesowe, mapa drogowa, ocena zdolności","ok":false,"w":"To produkty lub działania wewnątrz faz, a nie trzy pierścienie."},{"t":"Zarządzanie programem, Aktywowanie zmiany, cykl ciągłego doskonalenia","ok":true,"w":"To trzy pierścienie: zewnętrzny, środkowy i wewnętrzny."},{"t":"Przewodnik Asesora, Przewodnik Samooceny, Model Oceny Procesu","ok":false,"w":"To trzy przewodniki programu oceny, a nie komponenty wdrożenia."}],"fz":{"h":"Cykl życia wdrożenia","p":"P1","pulapka":false,"n":"egzamin: cykl życia wdrożenia · podr.: cykl życia wdrożenia · EN: implementation life cycle","q":"Z czego składa się cykl życia wdrożenia? | Podaj trzy wzajemnie powiązane komponenty Cyklu Życia Wdrożenia.","a":"7 faz i 3 kręgi: zarządzanie programem (zewnętrzny), aktywowanie zmiany (środkowy), cykl ciągłego doskonalenia (wewnętrzny). To nie jednorazowy projekt. | 1. Główny cykl życia ciągłego doskonalenia (pierścień wewnętrzny). 2. Aktywowanie zmiany (środkowy) – zachowanie i kultura. 3. Zarządzanie programem (zewnętrzny).","ex":"Jak dbanie o dom: remont nie jest raz na zawsze. 7 kroków i 3 pierścienie jak tarcza: zewnętrzny – kierownik remontu, środkowy – domownicy, wewnętrzny – samo ulepszanie. | Trzy pierścienie jak tarcza: w środku samo ulepszanie, wokół ludzie i ich nawyki, na zewnątrz kierownik pilnujący planu i budżetu. Od środka: co – kto – jak kierować.","org":"pierwsza iteracja: obsługa zgłoszeń; druga: przyczyny powtarzających się awarii."}},"fz-D-004":{"id":"fz-D-004","typ":"egzamin","s":"IM-02-01","t":"Który z poniższych NIE jest wymieniony wśród czynników środowiska wewnętrznego i zewnętrznego wdrożenia?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 35"],"r":null,"zap":"","scen":"","o":[{"t":"Apetyt na ryzyko","ok":false,"w":"Apetyt na ryzyko jest na liście czynników."},{"t":"Liczba procesów COBIT 5","ok":true,"w":"Liczba procesów w modelu nie jest pozycją listy czynników kontekstu. Lista dotyczy konkretnej organizacji: m.in. jej kultury, przepisów, strategii, modelu operacyjnego, apetytu na ryzyko, zdolności i zasobów."},{"t":"Etyka i kultura","ok":false,"w":"Etyka i kultura otwierają listę czynników."},{"t":"Styl zarządzania","ok":false,"w":"Styl zarządzania jest na liście czynników."}],"fz":{"h":"Czynniki środowiskowe","p":"P2","pulapka":false,"n":"egzamin: czynniki środowiskowe (kontekst organizacji) · podr.: czynniki środowiska wewn. i zewn. · EN: internal and external environment factors","q":"Jakie czynniki kontekstu uwzględnia się przy wdrożeniu? | Podaj czynniki środowiska wewnętrznego i zewnętrznego wdrożenia.","a":"Etyka i kultura; przepisy; misja, wizja, wartości; polityki Ładu; plan biznesowy; model operacyjny i dojrzałość; styl zarządzania; apetyt na ryzyko; zasoby; praktyki branżowe. | Etyka i kultura; przepisy, regulacje i polityki; misja, wizja i wartości; polityki i praktyki Ładu; plan biznesowy i kierunki strategiczne; model operacyjny i poziom dojrzałości; styl zarządzania; apetyt na ryzyko; zdolności i dostępne zasoby; praktyki branżowe.","ex":"Remont dopasowujesz do przepisów, budżetu, gustu domowników i tego, ile ryzyka akceptujesz (apetyt na ryzyko). Tak samo wdrożenie COBIT dopasowuje się do warunków firmy. | Zanim kupisz meble, mierzysz pokój, sprawdzasz budżet i gust rodziny. Tu tak samo: wdrożenie dopasowujesz do kultury, przepisów, celów, pieniędzy i ludzi firmy.","org":"przepisy o cyberbezpieczeństwie i zamówieniach publicznych; mały zespół IT."}},"fz-D-005":{"id":"fz-D-005","typ":"egzamin","s":"IM-02-01","t":"Który z poniższych NIE jest jednym z pięciu kluczowych czynników sukcesu wdrożenia?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 35–36","FW-PL s. 35"],"r":null,"zap":"","scen":"","o":[{"t":"Kierunek, mandat i stałe wsparcie kierownictwa najwyższego szczebla","ok":false,"w":"To czynnik nr 1."},{"t":"Szybkie korzyści i priorytet najłatwiejszych, najkorzystniejszych usprawnień","ok":false,"w":"To czynnik nr 5."},{"t":"Dopasowanie COBIT i innych praktyk do kontekstu organizacji","ok":false,"w":"To czynnik nr 4."},{"t":"Osiągnięcie poziomu 5 zdolności przez wszystkie procesy","ok":true,"w":"Docelowy poziom zdolności dobiera się do kosztów, korzyści i wykonalności. Poziom 5 wszystkich procesów nie jest warunkiem sukcesu wdrożenia; źródło podaje wsparcie kierownictwa, rozumienie celów, komunikację, dostosowanie i szybkie korzyści."}],"fz":{"h":"Kluczowe czynniki sukcesu","p":"P2","pulapka":false,"n":"egzamin: kluczowe czynniki sukcesu wdrożenia · podr.: kluczowe czynniki sukcesu · EN: critical success factors","q":"Podaj kluczowe czynniki sukcesu wdrożenia. | Podaj pięć kluczowych czynników sukcesu wdrożenia.","a":"1) kierownictwo wskazuje kierunek, daje upoważnienie (mandat) i wsparcie; 2) zrozumienie celów biznesowych i IT; 3) komunikacja i umożliwienie zmian; 4) dopasowanie COBIT do sytuacji organizacji; 5) szybkie korzyści. | 1. Kierownictwo najwyższego szczebla daje kierunek, mandat i stałe wsparcie. 2. Wszyscy rozumieją cele biznesowe i cele IT. 3. Skuteczna komunikacja i umożliwienie zmian. 4. Dopasowanie COBIT i innych praktyk do kontekstu. 5. Szybkie korzyści i priorytet najłatwiejszych, najkorzystniejszych usprawnień.","ex":"Udany remont: właściciel decyduje i płaci (1), wszyscy wiedzą, po co (2), domownicy są na bieżąco (3), projekt pasuje do tego mieszkania (4), szybko widać pierwszy efekt (5). | Haczyk na pięć palców: szef chce (1), wszyscy wiedzą, po co (2), mówimy o zmianach (3), szyjemy na miarę (4), szybko widać efekt (5).","org":"zastępca komendanta jako sponsor; efekt widoczny po miesiącu."}},"fz-D-006":{"id":"fz-D-006","typ":"egzamin","s":"IM-02-06","t":"W której fazie i w którym kręgu powstaje mapa drogowa?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 38"],"r":null,"zap":"","scen":"","o":[{"t":"W fazie 1, w kręgu Aktywowania zmiany","ok":false,"w":"W fazie 1 krąg zmiany ustanawia chęć zmiany."},{"t":"W fazie 4, w kręgu cyklu ciągłego doskonalenia","ok":false,"w":"W fazie 4 doskonalenie buduje usprawnienia; mapa powstaje wcześniej."},{"t":"W fazie 5, w kręgu zarządzania programem","ok":false,"w":"W fazie 5 program wykonuje plan, a nie go definiuje."},{"t":"W fazie 3 („Do czego dążymy?”), w kręgu zarządzania programem","ok":true,"w":"Definiowanie mapy drogowej należy do zewnętrznego pierścienia zarządzania programem w fazie 3. W tej samej fazie definiuje się stan docelowy i komunikuje oczekiwany rezultat."}],"fz":{"h":"Mapa drogowa","p":"P1","pulapka":false,"n":"egzamin: mapa drogowa · podr.: plan działań · EN: road map","q":"Czym jest mapa drogowa i w której fazie powstaje? | Czym jest mapa drogowa?","a":"Kolejność i priorytety działań. Faza 3 („Do czego dążymy?”), krąg zarządzania programem. | Planem działań dojścia do stanu docelowego (podr. plan działań; EN road map); definiuje się go w fazie 3 w pierścieniu zarządzania programem.","ex":"Jak harmonogram remontu: najpierw elektryka, potem tynki, na końcu malowanie. Powstaje w fazie 3, bo dopiero wtedy wiesz, jak mieszkanie ma wyglądać. | Jak trasa w nawigacji: wiesz, skąd i dokąd jedziesz, a mapa pokazuje kolejne zakręty. Rysuje się ją w fazie 3, bo dopiero wtedy znany jest cel.","org":"najpierw rejestr, potem dyżur, na końcu procedura i szkolenia."}},"fz-D-007":{"id":"fz-D-007","typ":"egzamin","s":"IM-01-01","t":"Czy przewodnik COBIT 5: Wdrożenie jest normatywny?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 35"],"r":null,"zap":"","scen":"","o":[{"t":"Tak – nakazuje dokładną kolejność kroków, której trzeba przestrzegać","ok":false,"w":"Normatywny znaczy „rób dokładnie tak”, a przewodnik tylko podpowiada."},{"t":"Tak – jest kompletnym, gotowym rozwiązaniem do wdrożenia","ok":false,"w":"Podręcznik wskazuje, że nie jest kompletnym rozwiązaniem."},{"t":"Nie – bo dotyczy wyłącznie oceny zdolności procesów","ok":false,"w":"Przewodnik dotyczy wdrożenia, a nie wyłącznie oceny zdolności."},{"t":"Nie – to zbiór wskazówek, jak unikać typowych problemów i korzystać z dobrych praktyk","ok":true,"w":"COBIT 5: Wdrożenie jest zbiorem wskazówek wymagających przyjęcia i dostosowania do środowiska przedsiębiorstwa. Nie narzuca identycznego planu każdej organizacji ani nie stanowi kompletnego gotowego rozwiązania."}],"fz":{"h":"Normatywność wytycznych","p":"P2","pulapka":false,"n":"egzamin: nie jest normatywny · podr.: nie jest normatywny · EN: not prescriptive","q":"Czy przewodnik COBIT 5: Wdrożenie jest normatywny? | Czy przewodnik COBIT 5 – Wdrożenie jest normatywny?","a":"Nie. To zbiór wskazówek, jak unikać typowych problemów, korzystać z dobrych praktyk i osiągać wyniki, a nie gotowe rozwiązanie. | Nie. Nie jest normatywny ani kompletnym rozwiązaniem; to zbiór wskazówek, jak unikać typowych problemów, korzystać z dobrych praktyk i osiągać pożądane wyniki.","ex":"Jak książka z poradami remontowymi, a nie gotowy projekt architekta: podpowiada, czego unikać, ale decydujesz sam. Normatywny = nakazujący „rób dokładnie tak”. | Jak przewodnik turystyczny: pokazuje dobre trasy i pułapki, ale nie wybiera drogi za ciebie. Haczyk: „wskazówki, nie przepis”.","org":""}},"fz-D-008":{"id":"fz-D-008","typ":"egzamin","s":"IM-02-02","t":"Czym różni się punkt zapalny od zdarzenia wyzwalającego?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 36–37","FW-PL s. 36"],"r":null,"zap":"","scen":"","o":[{"t":"Punkt zapalny to zmiana w otoczeniu, a zdarzenie wyzwalające to istniejący problem","ok":false,"w":"Definicje są tu zamienione miejscami."},{"t":"To synonimy – oba oznaczają problem wykazany przez audyt","ok":false,"w":"To dwa różne pojęcia, choć razem tworzą wyznaczniki fazy 1."},{"t":"Punkt zapalny to istniejący problem, a zdarzenie wyzwalające to zmiana, która daje powód, by działać teraz","ok":true,"w":"Pain point — punkt zapalny — to dostrzegany problem, np. powtarzające się słabe wyniki audytu. Trigger event — zdarzenie wyzwalające — to bodziec do działania, np. nowe regulacje, fuzja lub nowy CIO (Chief Information Officer — Dyrektor ds. Informatyki). Przykłady pochodzą z list podręcznika; rzeczywista sytuacja może mieć oba aspekty."},{"t":"Punkty zapalne ustala się w fazie 7, a zdarzenia wyzwalające w fazie 1","ok":false,"w":"Oba identyfikuje się w fazie 1 jako wyznaczniki."}],"fz":{"h":"Punkt zapalny a zdarzenie wyzwalające","p":"P1","pulapka":true,"n":"egzamin: punkt zapalny / zdarzenie wyzwalające · podr.: punkt zapalny / zdarzenie inicjujące · EN: pain point vs trigger event","q":"Czym różni się punkt zapalny od zdarzenia wyzwalającego?","a":"Punkt zapalny: istniejący problem. Zdarzenie wyzwalające: zmiana w otoczeniu lub organizacji, która daje powód, by działać teraz. Razem tworzą wyznaczniki fazy 1. | Punkt zapalny to istniejący problem wskazujący potrzebę usprawnienia Ładu (np. nieudane projekty). Zdarzenie wyzwalające to inne zdarzenie w otoczeniu wewnętrznym lub zewnętrznym, które skłania do zajęcia się Ładem (np. fuzja, nowy CIO).","ex":"Punkt zapalny: auto stuka od miesięcy. Zdarzenie wyzwalające: zbliża się przegląd albo wyjazd na wakacje – nic nowego się nie zepsuło, ale trzeba działać teraz. | Punkt zapalny: kran cieknie od miesięcy (problem już jest). Zdarzenie wyzwalające: zapowiedzieli się goście (coś nowego każe działać teraz). Ból kontra bodziec.","org":"awaria = punkt zapalny; nowy komendant lub zapowiedziany audyt = zdarzenie wyzwalające."}},"fz-D-009":{"id":"fz-D-009","typ":"egzamin","s":"IM-02-02","t":"Który z poniższych jest przykładem punktu zapalnego?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 36–37","FW-PL s. 36"],"r":null,"zap":"","scen":"","o":[{"t":"Fuzja z inną firmą","ok":false,"w":"Fuzja to zdarzenie wyzwalające, a nie istniejący problem."},{"t":"Nowy prezes (CEO)","ok":false,"w":"Nowy CEO (Chief Executive Officer — Dyrektor Generalny) to zdarzenie wyzwalające."},{"t":"Niedotrzymywanie poziomu usług przez dostawcę","ok":true,"w":"Powtarzające się niedotrzymywanie uzgodnionych poziomów usług przez dostawcę outsourcingowego jest wymienionym punktem zapalnym. Fuzja, nowy CEO (Chief Executive Officer — Dyrektor Generalny) i nowa strategia znajdują się na liście zdarzeń wyzwalających."},{"t":"Nowa strategia organizacji","ok":false,"w":"Nowa strategia to zdarzenie wyzwalające."}],"fz":{"h":"Punkty zapalne","p":"P2","pulapka":false,"n":"egzamin: punkty zapalne · podr.: punkty zapalne · EN: pain points","q":"Czym są punkty zapalne? Podaj przykłady. | Podaj punkty zapalne (część 1).","a":"Istniejące problemy, które pokazują potrzebę usprawnień, np. frustracja biznesu, poważne incydenty ryzyka IT (utrata danych), kłopoty z firmą zewnętrzną (outsourcing), niespełnione przepisy, słabe wyniki audytów. | Frustracja biznesu nieudanymi inicjatywami, rosnącymi kosztami IT i niską wartością; poważne incydenty ryzyka IT (utrata danych, porażka projektu); kłopoty z firmą zewnętrzną (outsourcing), która nie dotrzymuje uzgodnionego poziomu usług; niespełnione wymagania przepisów lub umów; IT hamuje innowacje i szybkie reagowanie (zwinność); audyty regularnie wskazują słabą wydajność lub jakość IT.","ex":"Jak ból zęba, który w końcu każe iść do dentysty: coś już źle działa i wszyscy to czują. „Zapalny” = już boli. | Sześć „bólów”: szefowie sfrustrowani, coś poważnego się stało (wyciek danych), firma zewnętrzna zawodzi, łamiemy przepisy, IT hamuje nowe pomysły, kontrole stale wytykają błędy.","org":"system ewidencji zdarzeń niedostępny 95 min w czasie nawałnic; sklep nie działał 6 godzin w Black Friday."}},"fz-D-010":{"id":"fz-D-010","typ":"egzamin","s":"IM-02-02","t":"Który z poniższych NIE jest punktem zapalnym?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 37"],"r":null,"zap":"","scen":"","o":[{"t":"Ukryte i nieuczciwe wydatki na IT","ok":false,"w":"To punkt zapalny z drugiej części listy."},{"t":"Powielanie inicjatyw i marnotrawstwo zasobów","ok":false,"w":"To punkt zapalny z drugiej części listy."},{"t":"Brak ludzi, umiejętności lub wypalenie zespołu IT","ok":false,"w":"To punkt zapalny z drugiej części listy."},{"t":"Audyt zewnętrzny lub ocena konsultantów","ok":true,"w":"Audyt zewnętrzny lub ocena konsultantów są wymienionymi zdarzeniami wyzwalającymi. Powtarzające się złe wyniki audytów są natomiast punktem zapalnym; nie należy utożsamiać samego audytu z wynikiem audytu."}],"fz":{"h":"Punkty zapalne (część 2)","p":"P2","pulapka":false,"n":"EN: Pain points (2)","q":"Podaj punkty zapalne (część 2).","a":"Ukryte i nieuczciwe wydatki na IT; powielanie inicjatyw i marnotrawstwo zasobów; brak ludzi, umiejętności lub wypalenie zespołu IT; zmiany IT spóźnione, ponad budżet, nietrafione; niechęć zarządu do współpracy z IT, brak sponsorów (osób z kierownictwa popierających IT); złożone, zagmatwane modele operacyjne IT.","ex":"Kolejne sześć „bólów”: pieniądze na IT idą bokiem, dwa zespoły robią to samo, brak ludzi lub są wypaleni, zmiany spóźnione i za drogie, zarząd unika IT, wszystko zagmatwane.","org":""}},"fz-D-011":{"id":"fz-D-011","typ":"egzamin","s":"IM-02-04","t":"Który element NIE należy do minimalnej zawartości uzasadnienia biznesowego?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 39"],"r":null,"zap":"","scen":"","o":[{"t":"Właściciele korzyści, czyli kto odpowiada za ich uzyskanie","ok":false,"w":"To element minimalnej zawartości."},{"t":"Ryzyko, ograniczenia i zależności","ok":false,"w":"To element minimalnej zawartości."},{"t":"Pełny opis wszystkich procesów z Referencyjnego Modelu Procesu","ok":true,"w":"Tego nie ma na liście; uzasadnienie dotyczy korzyści, kosztów, ryzyka i ról."},{"t":"Monitorowanie inwestycji i wartości przez cały cykl ekonomiczny, z miernikami","ok":false,"w":"To element minimalnej zawartości."}],"fz":{"h":"Uzasadnienie biznesowe","p":"P1","pulapka":true,"n":"egzamin: uzasadnienie biznesowe · podr.: uzasadnienie biznesowe · EN: business case","q":"Co musi zawierać uzasadnienie biznesowe? | Co musi zawierać co najmniej uzasadnienie biznesowe?","a":"Docelowe korzyści, ich zgodność ze strategią i właściciele korzyści (kto odpowiada za ich uzyskanie); zmiany biznesowe i zakres; inwestycje; koszty bieżące; korzyści po zmianie; ryzyka i zależności; role i rozliczalność; monitorowanie wartości i mierniki. Aktualizuje się je przez cały cykl. | Docelowe korzyści biznesowe, ich zgodność ze strategią oraz właściciele korzyści (kto odpowiada za ich zapewnienie; podr. beneficjenci); wymagane zmiany biznesowe; inwestycje; bieżące koszty IT i biznesowe; oczekiwane korzyści po zmianach; ryzyko, ograniczenia i zależności; role, odpowiedzialności i rozliczalności; monitorowanie inwestycji i wartości przez cały cykl ekonomiczny, z miernikami.","ex":"Jak wniosek o kredyt na remont: co zyskasz i kto pilnuje, by to się stało, ile to kosztuje teraz i potem, co może pójść źle, kto odpowiada i jak sprawdzisz efekt. | Jak kosztorys remontu dla rodziny: co zyskamy i kto pilnuje, żeby to się stało, co zmienić, ile kosztuje teraz i co roku, co może pójść źle, kto odpowiada, jak sprawdzimy efekt.","org":"krótsze przerwy usług krytycznych za ok. 480 tys. zł w pierwszym roku."}},"fz-D-012":{"id":"fz-D-012","typ":"egzamin","s":"IM-02-01","t":"Co obejmuje stworzenie właściwego środowiska wdrożenia?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 36"],"r":null,"zap":"","scen":"","o":[{"t":"Formalną ocenę zdolności wszystkich procesów przez zewnętrznego asesora","ok":false,"w":"Ogólna diagnostyka i oceny zdolności mogą pomóc zbudować świadomość i poparcie dla zmiany. COBIT 5 nie wymaga jednak formalnej oceny wszystkich procesów przez zewnętrznego asesora jako warunku stworzenia środowiska."},{"t":"Przyjęcie normatywnego zestawu kroków do dokładnego wykonania","ok":false,"w":"Przewodnik wdrożenia nie jest normatywny."},{"t":"Przekazanie programu wyłącznie działowi IT, bez udziału zarządu","ok":false,"w":"Zaangażowanie interesariuszy biznesowych i widoczne wsparcie kierownictwa są potrzebne od początku; przekazanie całej inicjatywy samemu działowi IT (Information Technology — informatyka) pomija te warunki."},{"t":"Zaangażowanie interesariuszy od początku, zasoby, jasne role, struktury Ładu i widoczne wsparcie zarządu","ok":true,"w":"Właściwe środowisko obejmuje zaangażowanie interesariuszy od początku, cele i korzyści opisane w uzasadnieniu biznesowym, zasoby, jasno przydzielone role oraz struktury i procesy Ładu i Zarządzania. Kluczowi interesariusze powinni widocznie wspierać inicjatywę."}],"fz":{"h":"Właściwe środowisko","p":"P2","pulapka":false,"n":"egzamin: stworzenie właściwego środowiska · podr.: stworzenie właściwego środowiska · EN: creating the appropriate environment","q":"Co obejmuje stworzenie właściwego środowiska wdrożenia?","a":"Właściwe środowisko obejmuje zaangażowanie interesariuszy od początku, cele i korzyści w uzasadnieniu biznesowym, zasoby, jasne role oraz struktury i procesy Ładu i Zarządzania. Potrzebne jest widoczne wsparcie kluczowego kierownictwa. Diagnostyka i oceny zdolności mogą pomóc uzgodnić potrzebę działania; formalna ocena wszystkich procesów nie jest obowiązkowym warunkiem startu.","ex":"Zanim ruszy remont: domownicy wiedzą i się zgadzają, są pieniądze i ekipa, wiadomo, kto o czym decyduje, a właściciel widocznie jest „za”. Bez tego ekipa stoi. | Jak przygotowanie wesela: rodzina zgadza się od początku, jest budżet, każdy wie, za co odpowiada, a rodzice widocznie wspierają. Dopiero wtedy ruszasz.","org":"sponsor, kierownik programu, przegląd co dwa tygodnie."}},"fz-D-013":{"id":"fz-D-013","typ":"egzamin","s":"IM-02-02","t":"Który z poniższych jest przykładem zdarzenia wyzwalającego?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 37"],"r":null,"zap":"","scen":"","o":[{"t":"Poważny incydent utraty danych","ok":false,"w":"To punkt zapalny, czyli istniejący problem."},{"t":"Nowe wymagania regulacyjne","ok":true,"w":"To zdarzenie z listy zdarzeń wyzwalających."},{"t":"Audyty regularnie wskazują słabą jakość IT","ok":false,"w":"To punkt zapalny."},{"t":"Zmiany IT są spóźnione i ponad budżet","ok":false,"w":"To punkt zapalny."}],"fz":{"h":"Zdarzenia wyzwalające","p":"P2","pulapka":false,"n":"egzamin: zdarzenia wyzwalające · podr.: zdarzenia inicjujące · EN: trigger events","q":"Czym są zdarzenia wyzwalające? Podaj przykłady. | Podaj zdarzenia wyzwalające.","a":"Zdarzenia wewnątrz lub na zewnątrz organizacji, które skłaniają do zajęcia się Ładem: fuzje, zmiana pozycji na rynku, nowe przepisy, zmiana technologii, nowy prezes lub szef IT (CEO/CIO), audyt zewnętrzny, nowa strategia. | Fuzje, przejęcia, sprzedaż części firmy (zbycie); zmiana pozycji rynkowej, finansowej lub wobec konkurencji; zmiana modelu działania lub zaopatrzenia; nowe wymagania regulacyjne; duża zmiana technologii lub podejścia (paradygmatu); ogólnofirmowa inicjatywa Ładu; nowy CEO, CFO, CIO itd.; audyt zewnętrzny lub ocena konsultantów; nowa strategia lub priorytet.","ex":"Jak przeprowadzka, po której w końcu robisz porządek w szafach: nic się nie zepsuło, ale nowa sytuacja daje powód do działania. | Nic nie boli, ale sytuacja się zmienia, jak po ślubie czy przeprowadzce. Skróty: CEO = prezes, CFO = dyrektor finansowy, CIO = szef IT.","org":"nowe wymogi cyberbezpieczeństwa; zapowiedź audytu; nowy prezes po fuzji."}},"fz-D-014":{"id":"fz-D-014","typ":"egzamin","s":"IM-02-02,IM-02-03","t":"Po co identyfikuje się punkty zapalne i zdarzenia wyzwalające?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 36"],"r":null,"zap":"","scen":"","o":[{"t":"Aby ustalić poziom zdolności procesów według ISO/IEC 15504","ok":false,"w":"Do tego służy ocena zdolności, a nie wyznaczniki."},{"t":"Aby zastąpić uzasadnienie biznesowe","ok":false,"w":"Wiążą uzasadnienie z realnymi problemami, a nie zastępują go."},{"t":"Aby uzasadnić zmianę realnymi problemami i okazjami","ok":true,"w":"Punkty zapalne i zdarzenia wyzwalające wiążą uzasadnienie biznesowe z realnymi problemami i okazjami. Wzmacniają akceptację oraz poczucie pilności i pomagają wskazać szybkie korzyści oraz zdobyć poparcie kierownictwa."},{"t":"Aby formalnie zamknąć cykl wdrożenia w fazie 7","ok":false,"w":"To punkt wejścia do wdrożenia (faza 1), a nie zakończenie."}],"fz":{"h":"Punkty zapalne i zdarzenia wyzwalające jako punkt wejścia","p":"P2","pulapka":false,"n":"EN: Pain points and trigger events as entry points","q":"Po co identyfikować punkty zapalne i zdarzenia wyzwalające?","a":"Wiążą uzasadnienie biznesowe z codziennymi problemami, zwiększają akceptację i poczucie pilności, pozwalają wskazać szybkie korzyści i zdobyć poparcie kierownictwa.","ex":"Ludzie chętniej płacą za naprawę dachu, gdy właśnie kapie im na głowę. Realny problem daje poczucie, że trzeba działać teraz, i pozwala szybko pokazać efekt.","org":""}},"fz-D-015":{"id":"fz-D-015","typ":"egzamin","s":"IM-02-05","t":"Jakie podejście do trwałej poprawy podczas zmiany wskazuje COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 37"],"r":null,"zap":"","scen":"","o":[{"t":"Budowanie zaangażowania interesariuszy oraz, gdy jest wymagane, egzekwowanie zgodności","ok":true,"w":"Zaangażowanie interesariuszy buduje się przez zaufanie, przywództwo, komunikację i reagowanie na potrzeby. Gdy wymagane jest egzekwowanie zgodności, stosuje się odpowiednie procesy administrowania, monitorowania i egzekwowania. Nie jest to wyłącznie etap po nieudanym przekonywaniu ludzi."},{"t":"Rozbudowanie kontroli zgodności przy pominięciu zaufania, przywództwa i komunikacji","ok":false,"w":"Kontrola może być wymagana, ale nie zastępuje świadomego zajęcia się ludzkimi i kulturowymi aspektami zmiany. Nie jest jedyną drogą wskazaną w podręczniku."},{"t":"Dostarczenie rozwiązań technicznych i przyjęcie, że interesariusze samodzielnie zmienią zachowania","ok":false,"w":"Dobre rozwiązanie techniczne nie zapewnia przyjęcia zmiany przez ludzi. Podręcznik wymaga proaktywnego uwzględnienia zachowań, kultury i możliwego oporu."},{"t":"Przekazywanie informacji o zmianie dopiero po zakończeniu programu wdrożeniowego","ok":false,"w":"Plan komunikacji obejmuje kolejne fazy programu, a nie wyłącznie komunikat po jego zakończeniu."}],"fz":{"h":"Trwała poprawa podczas zmiany","p":"P2","pulapka":false,"n":"EN: Sustainable change: buy-in or enforced compliance","q":"Jak osiągnąć trwałą poprawę podczas zmiany?","a":"Trwałą poprawę wspiera zaangażowanie interesariuszy: zaufanie, przywództwo, komunikacja i reagowanie na potrzeby. Gdy wymagane jest egzekwowanie zgodności, wykorzystuje się administrowanie, monitorowanie i egzekwowanie. Oba podejścia mogą współdziałać; wymagania zgodności nie zależą wyłącznie od tego, czy udało się przekonać pracowników.","ex":"Pracownicy rozumieją sens rejestrowania incydentów i współtworzą rozwiązanie. Równolegle organizacja kontroluje przestrzeganie wymaganej polityki. Obowiązek kontroli nie znika dlatego, że pracownicy popierają zmianę.","org":""}},"fz-D-016":{"id":"fz-D-016","typ":"egzamin","s":"IM-02-06,IM-02-07","t":"Jak brzmi pytanie fazy 4 cyklu wdrożenia (nazwa egzaminacyjna)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 38"],"r":null,"zap":"","scen":"","o":[{"t":"Jak się tam dostaniemy?","ok":false,"w":"To pytanie fazy 5."},{"t":"Do czego dążymy?","ok":false,"w":"To pytanie fazy 3."},{"t":"Jakie działania należy podjąć?","ok":true,"w":"To pytanie fazy 4."},{"t":"Czy dotarliśmy do celu?","ok":false,"w":"To pytanie fazy 6."}],"fz":{"h":"Pytania siedmiu faz","p":"P1","pulapka":false,"n":"EN: What are the drivers? Where are we now? Where do we want to be? What needs to be done? How do we get there? Did we get there? How do we keep the momentum going?","q":"Podaj pytania siedmiu faz (nazwy egzaminacyjne).","a":"1. Jakie są wyznaczniki? 2. Gdzie jesteśmy teraz? 3. Do czego dążymy? 4. Jakie działania należy podjąć? 5. Jak się tam dostaniemy? 6. Czy dotarliśmy do celu? 7. Jak utrzymać motywację do działania?","ex":"Remont: po co? – jak jest? – jak ma być? – co zrobić? – robimy – czy wyszło? – jak nie odpuścić? Po kroku 7 zaczynasz od nowa.","org":""}},"fz-D-017":{"id":"fz-D-017","typ":"egzamin","s
