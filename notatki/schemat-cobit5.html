ok":true,"w":"Te cztery pytania tworzą zarządzanie wydajnością aktywatora (s. 29)."},{"t":"Określeniu wyznaczników interesariuszy","ok":false,"w":"Wyznaczniki to krok 1 kaskady (s. 17)."},{"t":"Ocenie zdolności procesu","ok":false,"w":"Ocena zdolności procesu korzysta z atrybutów procesu (FW-PL s. 42), a nie z tych czterech pytań."}],"cyt":{"s":"29","t":"Zarządzanie sprawnością czynników umożliwiających wymaga regularnego monitorowania i udzielania odpowiedzi na poniższe pytania","w":"TERMIN","u":"FW-PL: „zarządzanie sprawnością czynnika umożliwiającego”; egzamin PL: zarządzanie wydajnością aktywatora."}},"q-pc-pr-052":{"id":"q-pc-pr-052","typ":"egzamin","s":"PR-02-02","t":"Który zestaw to wyłącznie przykłady wyznaczników z kroku 1 kaskady?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 17"],"r":"B","zap":"Wyznaczniki: strategia, otoczenie biznesowe i regulacyjne, technologie.","scen":"","o":[{"t":"Cele organizacji, cele IT, cele aktywatorów","ok":false,"w":"To kolejne poziomy kaskady (s. 18)."},{"t":"Jakość wewnętrzna, kontekstowa, dostęp","ok":false,"w":"To kategorie celów aktywatora (s. 29)."},{"t":"Nowe technologie, dobre praktyki, cykl życia","ok":false,"w":"Dobre praktyki i cykl życia to wymiary aktywatora (s. 28)."},{"t":"Zmiany strategii, otoczenia biznesowego, nowe technologie","ok":true,"w":"Te przykłady podaje krok 1 kaskady (s. 17)."}],"cyt":{"s":"17","t":"Na potrzeby interesariuszy wpływa wiele czynników, takich jak zmiany w strategii, zmiany w otoczeniu biznesowym i regulacyjnym oraz nowe technologie.","w":"ZGODNE"}},"q-pc-pr-106":{"id":"q-pc-pr-106","typ":"egzamin","s":"PR-02-08","t":"Uzupełnij: Kluczowym komponentem Podejścia do Ładu jest Cel Ładu, czyli [?].","k":false,"st":"autorskie","src":"","z":["FW-PL s. 23"],"r":null,"zap":"Cel Ładu = Tworzenie Wartości.","scen":"","o":[{"t":"Zgodność z regulacjami","ok":false,"w":"To jeden z celów organizacji (s. 19)."},{"t":"Ocena, kierowanie i monitorowanie","ok":false,"w":"To działania domeny EDM (s. 32)."},{"t":"Zapewnienie transparentności","ok":false,"w":"To proces EDM05 (s. 33)."},{"t":"Tworzenie Wartości","ok":true,"w":"Cel Ładu: Tworzenie Wartości (s. 23)."}],"cyt":{"s":"23","t":"Cel nadzoru: tworzenie wartości","w":"ZGODNE","u":"FW-PL: „Cel nadzoru” = egzamin: Cel Ładu."}},"q-pc-pr-111":{"id":"q-pc-pr-111","typ":"egzamin","s":"PR-02-09","t":"Co Interesariusze (właściciele) robią wobec Organu Ładu i nadzoru?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 24"],"r":null,"zap":"Interesariusze → delegują → Organ Ładu i nadzoru.","scen":"","o":[{"t":"Wyznaczają kierunek","ok":false,"w":"Kierunek wyznacza Organ Ładu (s. 24)."},{"t":"Delegują","ok":true,"w":"Właściciele i interesariusze delegują uprawnienia Organowi Ładu (s. 24, il. 9)."},{"t":"Raportują","ok":false,"w":"Raportują role operacyjne (s. 24)."},{"t":"Instruują i dopasowują","ok":false,"w":"To Kierownictwo wobec ról operacyjnych (s. 24)."}],"cyt":{"s":"24","t":"Ilustracja 9 — Kluczowe role, działania i relacje Właściciele oraz interesariusze Delegowanie","w":"ZGODNE","u":"Cytat z Ilustracji 9 (warstwa tekstowa); FW-PL: „organ nadzorujący” = egzamin: Organ Ładu."}},"q-pc-pr-115":{"id":"q-pc-pr-115","typ":"egzamin","s":"PR-02-09","t":"W jakiej kolejności przepływa kierunek między rolami w Podejściu do Ładu?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 24"],"r":null,"zap":"Interesariusze → Organ Ładu → Kierownictwo → Role operacyjne.","scen":"","o":[{"t":"Kierownictwo → Organ Ładu → Interesariusze → Role operacyjne","ok":false,"w":"Kolejność odwrócona (s. 24)."},{"t":"Organ Ładu → Interesariusze → Kierownictwo → Role operacyjne","ok":false,"w":"Interesariusze są na początku – delegują (s. 24)."},{"t":"Interesariusze → Kierownictwo → Organ Ładu → Role operacyjne","ok":false,"w":"Kierownictwo dostaje kierunek od Organu Ładu (s. 24)."},{"t":"Interesariusze → Organ Ładu → Kierownictwo → Role operacyjne","ok":true,"w":"Delegowanie, wyznaczanie kierunku, instruowanie i dopasowanie (s. 24, il. 9)."}],"cyt":{"s":"24","t":"Delegowanie Strona rozliczana Role, działania i relacje Wyznaczanie Instruowanie kierunku i dopasowanie Organ nadzorujący Zarządzanie Eksploatacja i wykonanie","w":"CZESCIOWO","u":"Kolejność wynika z układu strzałek Ilustracji 9; warstwa tekstowa podaje role i działania, ale bez jednoznacznej kolejności."}},"q-pc-pr-121":{"id":"q-pc-pr-121","typ":"egzamin","s":"PR-02-10","t":"Które wytyczne ISACA zintegrowano w COBIT 5?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 15","FW-PL s. 25"],"r":null,"zap":"Wytyczne ISACA w COBIT 5: COBIT, Val IT, Risk IT, BMIS, ITAF.","scen":"","o":[{"t":"PMBOK i COSO","ok":false,"w":"To struktury innych organizacji (s. 15)."},{"t":"ITIL, TOGAF i PRINCE2","ok":false,"w":"To inne standardy – COBIT 5 jest z nimi spójny, ale nie są ISACA (s. 15)."},{"t":"Val IT, Risk IT, BMIS i ITAF","ok":true,"w":"COBIT 5 łączy wcześniejsze struktury ISACA (s. 15, 25)."},{"t":"ISO/IEC 15504 i ISO/IEC 27001","ok":false,"w":"To normy ISO, nie wytyczne ISACA (s. 15)."}],"cyt":{"s":"25","t":"opracowała metodyki, takie jak COBIT, Val IT, Risk IT, BMIS, publikację Board Briefing on IT Governance oraz ITAF","w":"ZGODNE"}},"q-pc-en3-01":{"id":"q-pc-en3-01","typ":"egzamin","s":"EN-02-05","t":"Który element struktury polityk określa, kto zatwierdza odstępstwo od polityki?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 68"],"r":null,"zap":"Struktura polityk opisuje 4 elementy: zakres i ważność, konsekwencje braku zgodności, obsługę wyjątków, kontrolę i pomiar zgodności.","scen":"","o":[{"t":"Zakres i ważność polityki","ok":false,"w":"Zakres i ważność mówią, kogo i czego polityka dotyczy, a nie jak postępować z odstępstwami (FW-PL s. 68)."},{"t":"Sposób obsługi wyjątków","ok":true,"w":"Struktura polityk musi opisywać sposób obsługi wyjątków – czyli m.in. kto i jak zatwierdza odstępstwo (FW-PL s. 68)."},{"t":"Konsekwencje braku zgodności","ok":false,"w":"Ten element opisuje skutki nieprzestrzegania polityki, nie tryb zatwierdzania odstępstw (FW-PL s. 68)."},{"t":"Kontrola i pomiar zgodności","ok":false,"w":"Ten element mówi, jak sprawdza się przestrzeganie polityki, a nie jak udziela się wyjątków (FW-PL s. 68)."}],"przyklad":"PRZYKŁAD: w firmie obowiązuje zakaz pracy na prywatnych laptopach, ale grafik potrzebuje swojego Maca. Ktoś musi wiedzieć, kto może się na to zgodzić i na jak długo – to właśnie obsługa wyjątków. HACZYK: „odstępstwo”, „zgoda na wyjątek” = obsługa wyjątków, a „co grozi za złamanie” = konsekwencje braku zgodności.","cyt":{"s":"68","t":"W ramach struktury polityk muszą zostać opisane następujące elementy: • zakres i prawidłowość; • konsekwencje nieprzestrzegania polityki; • sposób obsługi wyjątków;","w":"ZGODNE","u":""}},"q-pc-en3-02":{"id":"q-pc-en3-02","typ":"egzamin","s":"EN-02-06","t":"Zidentyfikuj brakujące słowo w następującym zdaniu. Polityki stanowią również [?], więc dotyczą ich dobre praktyki tego Aktywatora.","k":false,"st":"autorskie","src":"","z":["FW-PL s. 68"],"r":null,"zap":"Polityka to też informacja – obowiązują ją dobre praktyki Aktywatora Informacja.","scen":"","o":[{"t":"procesami","ok":false,"w":"Praktyki procesów są głównym środkiem realizacji polityk, ale same polityki nie są procesami (FW-PL s. 68)."},{"t":"kompetencjami","ok":false,"w":"Kompetencje należą do Aktywatora Ludzie, Umiejętności i Kompetencje; polityki nimi nie są (FW-PL s. 68)."},{"t":"informacjami","ok":true,"w":"Polityki są również informacjami, więc stosuje się do nich wszystkie dobre praktyki Aktywatora Informacja (FW-PL s. 68)."},{"t":"aplikacjami","ok":false,"w":"Aplikacje należą do Aktywatora Usługi, Infrastruktura i Aplikacje; polityka nie jest aplikacją (FW-PL s. 68)."}],"przyklad":"PRZYKŁAD: regulamin pracy zdalnej to dokument, czyli informacja. Musi być aktualny, dostępny dla pracowników, w jednej obowiązującej wersji – tak samo jak każda inna ważna informacja w firmie. HACZYK: to samo zdanie pojawia się przy definicjach umiejętności – one też są informacjami.","cyt":{"s":"68","t":"Polityki stanowią również informacje, więc wszystkie dobre praktyki odnoszące się do informacji odnoszą się również do polityk.","w":"ZGODNE","u":""}},"q-pc-en3-03":{"id":"q-pc-en3-03","typ":"egzamin","s":"EN-02-07","t":"Do której grupy interesariuszy procesu należą wolontariusze?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 69"],"r":null,"zap":"Wewnętrzni: zarząd, kierownictwo, pracownicy, wolontariusze. Zewnętrzni: klienci, partnerzy, udziałowcy, regulatorzy.","scen":"","o":[{"t":"Do interesariuszy zewnętrznych","ok":false,"w":"Zewnętrzni to klienci, partnerzy biznesowi, udziałowcy i organy regulacyjne – wolontariuszy tam nie ma (FW-PL s. 69)."},{"t":"Do partnerów biznesowych","ok":false,"w":"Partnerzy biznesowi to interesariusze zewnętrzni; wolontariusze są wymienieni wśród wewnętrznych (FW-PL s. 69)."},{"t":"Do organów regulacyjnych","ok":false,"w":"Organy regulacyjne to interesariusze zewnętrzni, a wolontariusz nikogo nie reguluje (FW-PL s. 69)."},{"t":"Do interesariuszy wewnętrznych","ok":true,"w":"Do interesariuszy wewnętrznych należą zarząd, kierownictwo, pracownicy i wolontariusze (FW-PL s. 69)."}],"przyklad":"PRZYKŁAD: w hospicjum wolontariusz nie dostaje pensji, ale pracuje w środku organizacji, wykonuje jej zadania i zna jej procedury – jest „u siebie”, tak jak pracownik. HACZYK: brak umowy o pracę nie robi z wolontariusza interesariusza zewnętrznego.","cyt":{"s":"69","t":"Do interesariuszy wewnętrznych należy zarząd, kierownictwo, pracownicy i wolontariusze.","w":"ZGODNE","u":""}},"q-pc-en3-04":{"id":"q-pc-en3-04","typ":"egzamin","s":"EN-02-08","t":"Do której kategorii celów procesu należy cel „proces jest zgodny z dobrą praktyką”?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 69"],"r":null,"zap":"Cele wewnętrzne procesu = jakość rzeczywista: proces odpowiedni, zgodny z dobrą praktyką i z regułami.","scen":"","o":[{"t":"Cele wewnętrzne","ok":true,"w":"Cele wewnętrzne pytają, czy proces ma jakość rzeczywistą, jest odpowiedni i zgodny z dobrą praktyką oraz z regułami (FW-PL s. 69)."},{"t":"Cele kontekstowe","ok":false,"w":"Cele kontekstowe dotyczą dopasowania procesu do sytuacji organizacji i łatwości jego zastosowania (FW-PL s. 69)."},{"t":"Cele dostępności i bezpieczeństwa","ok":false,"w":"Ta kategoria dotyczy poufności procesu i jego dostępności dla osób, które go potrzebują (FW-PL s. 69)."},{"t":"Cele związane z Informatyką","ok":false,"w":"To poziom kaskady celów wspierany przez cele procesu, a nie kategoria celów procesu (FW-PL s. 69)."}],"przyklad":"PRZYKŁAD: przepis na sernik może być „poprawny sam w sobie” – zgodny ze sztuką cukierniczą – nawet jeśli nie pasuje do twojego piekarnika. Zgodność ze sztuką to cel wewnętrzny, dopasowanie do kuchni to cel kontekstowy. HACZYK: „dobra praktyka” i „reguły” → wewnętrzne; „dopasowany, zrozumiały, łatwy” → kontekstowe.","cyt":{"s":"69","t":"Cele wewnętrzne — czy proces ma jakość rzeczywistą? Czy jest odpowiedni i zgodny z dobrą praktyką?","w":"ZGODNE","u":""}},"q-pc-en3-05":{"id":"q-pc-en3-05","typ":"egzamin","s":"EN-02-10","t":"Które stwierdzenie o wejściach i wyjściach procesu jest prawdziwe?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 70"],"r":null,"zap":"Wejścia/wyjścia: na poziomie kluczowych praktyk; bywają używane tylko wewnątrz procesu, często zasilają inne procesy; lista COBIT 5 nie jest kompletna.","scen":"","o":[{"t":"Określa się je na poziomie domen procesów","ok":false,"w":"Wejścia i wyjścia definiuje się na poziomie kluczowych praktyk, nie całych domen (FW-PL s. 70)."},{"t":"Przykładowa lista COBIT 5 jest kompletna","ok":false,"w":"Lista przykładowych wejść i wyjść nie jest kompletna – organizacja może zdefiniować dodatkowe przepływy (FW-PL s. 70)."},{"t":"Określa się je na poziomie kluczowych praktyk","ok":true,"w":"Wejścia i wyjścia definiuje się na poziomie kluczowych praktyk Ładu/Zarządzania (FW-PL s. 70)."},{"t":"Zastępują role opisane w tabeli RACI","ok":false,"w":"Wejścia i wyjścia to produkty działań; role i odpowiedzialności opisuje osobno tabela RACI (FW-PL s. 70)."}],"przyklad":"PRZYKŁAD: w kuchni restauracji każdy etap (np. „przygotuj sos”) ma swoje składniki na wejściu i gotowy sos na wyjściu. Sos czasem zostaje w kuchni, a czasem idzie do innej stacji. Książka kucharska COBIT podaje tylko przykładowe składniki – lokal może dopisać własne. HACZYK: poziom = praktyka, a lista = niekompletna.","cyt":{"s":"70","t":"Definiuje się je na poziomie kluczowych praktyk nadzoru/zarządzania; mogą one obejmować niektóre produkty działań wykorzystywane tylko w ramach samego procesu i stanowią często niezbędne dane wejściowe dla innych procesów","w":"ZGODNE","u":""}},"q-pc-en3-06":{"id":"q-pc-en3-06","typ":"egzamin","s":"EN-02-12","t":"Które działanie jest dobrą praktyką odnoszącą się do procedur eskalacji w strukturach organizacyjnych?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 75"],"r":null,"zap":"Procedury eskalacji = co robić i do kogo iść, gdy struktura nie potrafi podjąć decyzji.","scen":"","o":[{"t":"Publikowanie harmonogramu zebrań komitetu z wyprzedzeniem","ok":false,"w":"To praktyka zasad działania (częstotliwość zebrań, dokumentacja), nie eskalacji (FW-PL s. 75)."},{"t":"Określenie ścieżki, gdy komitet nie może podjąć decyzji","ok":true,"w":"Procedury eskalacji opisują ścieżkę i wymagane działania, gdy struktura ma problem z podjęciem decyzji (FW-PL s. 75)."},{"t":"Wyznaczenie granic uprawnień decyzyjnych komitetu","ok":false,"w":"Granice uprawnień decyzyjnych to zakres kontroli, a nie procedura eskalacji (FW-PL s. 75)."},{"t":"Przekazanie części uprawnień strukturom podległym","ok":false,"w":"To przekazywanie (delegowanie) uprawnień – osobna dobra praktyka struktur organizacyjnych (FW-PL s. 75)."}],"przyklad":"PRZYKŁAD: wspólnota mieszkaniowa nie może się dogadać w sprawie remontu dachu, bo głosy rozkładają się po równo. Regulamin mówi: w takim wypadku sprawę rozstrzyga zarząd wspólnoty. To właśnie ścieżka eskalacji. HACZYK: „impas”, „nie może zdecydować”, „przekazuje wyżej” = eskalacja; „przekazuje niżej” = delegowanie uprawnień.","cyt":{"s":"75","t":"Procedury eskalacji — ścieżka eskalacji dla struktury, opisująca wymagane działania w przypadku problemów z podjęciem decyzji.","w":"ZGODNE","u":""}},"q-pc-en3-07":{"id":"q-pc-en3-07","typ":"egzamin","s":"EN-02-13","t":"Która funkcja wspiera kierowników programów i projektów oraz raportuje informacje o ich realizacji?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 77"],"r":null,"zap":"PMO = wsparcie kierowników projektów i programów + raportowanie ich realizacji. VMO = portfel inwestycji i usług, wartość.","scen":"","o":[{"t":"Biuro zarządzania wartością (VMO)","ok":false,"w":"VMO jest sekretariatem zarządzania portfelem inwestycji i usług, ocenia szanse inwestycyjne i uzasadnienia biznesowe (FW-PL s. 77)."},{"t":"Dyrektor ds. informatyki (CIO)","ok":false,"w":"CIO odpowiada za dopasowanie strategii IT do strategii biznesowej, a nie za bieżące wsparcie kierowników projektów (FW-PL s. 76)."},{"t":"Dyrektor ds. ryzyka (CRO)","ok":false,"w":"CRO odpowiada za wszystkie aspekty zarządzania ryzykiem w organizacji (FW-PL s. 76)."},{"t":"Biuro zarządzania projektami (PMO)","ok":true,"w":"PMO wspiera kierowników programów i projektów oraz gromadzi, ocenia i raportuje informacje o ich realizacji (FW-PL s. 77)."}],"przyklad":"PRZYKŁAD: w dużej budowie osiedla kilku kierowników prowadzi osobne bloki. Biuro budowy zbiera od nich raporty postępu, pilnuje wspólnych szablonów i pomaga w papierach – to rola PMO. Inwestor, który ocenia, czy w ogóle opłaca się budować kolejny etap, to bliżej VMO. HACZYK: projekty i ich postęp → PMO; wartość, portfel i uzasadnienia biznesowe → VMO.","cyt":{"s":"77","t":"Funkcja odpowiedzialna za wspieranie kierowników programów i projektów oraz za gromadzenie, ocenę i raportowanie informacji dotyczących realizacji programów oraz projektów wchodzących w ich skład.","w":"ZGODNE","u":""}},"q-pc-en3-08":{"id":"q-pc-en3-08","typ":"egzamin","s":"EN-02-14","t":"Która dobra praktyka kształtowania zachowań jest powiązana ze schematem wynagradzania?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 80"],"r":null,"zap":"Zachęty i środki zniechęcające ↔ schemat wynagradzania (HR). Reguły i normy ↔ zasady i polityki.","scen":"","o":[{"t":"Zachęty i środki zniechęcające","ok":true,"w":"COBIT 5 wskazuje wyraźny związek między zachowaniem pracowników a schematem wynagradzania – służą temu zachęty i środki zniechęcające (FW-PL s. 80)."},{"t":"Komunikowanie pożądanych zachowań","ok":false,"w":"Komunikowanie zachowań i wartości to osobna dobra praktyka, niezwiązana z wynagradzaniem (FW-PL s. 80)."},{"t":"Przykład kierownictwa i czempionów","ok":false,"w":"Ta praktyka buduje świadomość przez przykład liderów, a nie przez system wynagrodzeń (FW-PL s. 80)."},{"t":"Reguły i normy zachowań","ok":false,"w":"Reguły i normy są powiązane z zasadami i politykami, nie ze schematem wynagradzania (FW-PL s. 80)."}],"przyklad":"Sytuacja: zespół programistów jest nagradzany wyłącznie za oddanie projektu w terminie i budżecie, więc skraca testy, a nowe aplikacje często się psują. PRZYKŁAD: jeśli kurierowi płacisz tylko za liczbę paczek, będzie rzucał nimi pod drzwi. Żeby dbał o jakość, musisz zmienić to, za co go nagradzasz. HACZYK: problem wynika z nagród, więc naprawia się go zachętami i środkami zniechęcającymi, a nie kolejnym szkoleniem.","cyt":{"s":"80","t":"zachęty oraz środki zniechęcające w celu promowania pożądanego zachowania. Istnieje wyraźny związek między zachowaniem poszczególnych pracowników oraz schematem wynagradzania","w":"ZGODNE","u":""}},"q-pc-en3-09":{"id":"q-pc-en3-09","typ":"egzamin","s":"EN-02-17","t":"Któremu celowi jakości informacji COBIT 5 odpowiada kryterium poufności z COBIT 4.1?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 63"],"r":null,"zap":"Poufność (4.1) → ograniczony dostęp (COBIT 5). Dostępność (4.1) → dostępność/terminowość. Integralność → kompletność i dokładność.","scen":"","o":[{"t":"Dostępność/terminowość","ok":false,"w":"Dostępność/terminowość odpowiada kryterium dostępności z COBIT 4.1, a nie poufności (FW-PL s. 63)."},{"t":"Kompletność","ok":false,"w":"Kompletność (wraz z dokładnością) odpowiada kryterium integralności z COBIT 4.1 (FW-PL s. 63)."},{"t":"Ograniczony dostęp","ok":true,"w":"Poufność z COBIT 4.1 odnosi się do celu jakości informacji „ograniczony dostęp” (FW-PL s. 63)."},{"t":"Obiektywność","ok":false,"w":"Obiektywność wiąże się z kryteriami skuteczności i wiarygodności, a nie poufności (FW-PL s. 63)."}],"przyklad":"PRZYKŁAD: wyniki badań w przychodni powinien widzieć pacjent i jego lekarz, ale już nie sąsiad z poczekalni. To jest poufność – w COBIT 5 nazwana „ograniczonym dostępem”. HACZYK: obie cechy z kategorii bezpieczeństwa/dostępności mają w nazwie „dostęp” – poufność to ta, która dostęp ogranicza.","cyt":{"s":"63","t":"Poufność Poufność odnosi się do celu jakościowego informacji dotyczącego ograniczonego dostępu.","w":"ZGODNE","u":""}},"q-pc-en3-10":{"id":"q-pc-en3-10","typ":"egzamin","s":"EN-02-17","t":"Jak nazywa się cecha jakości informacji prezentowanych zawsze w tym samym formacie?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 82"],"r":null,"zap":"Spójne przedstawienie = ten sam format; zwięzłe = krótko; aktualność = wystarczająco aktualne do zadania; odpowiednia ilość = właściwy wolumen.","scen":"","o":[{"t":"Zwięzłe przedstawienie","ok":false,"w":"Zwięzłe przedstawienie oznacza, że informacje są podane w zwięzły sposób, a nie w jednolitym formacie (FW-PL s. 82)."},{"t":"Spójne przedstawienie","ok":true,"w":"Spójne przedstawienie to stopień, w jakim informacje są prezentowane w tym samym formacie (FW-PL s. 82)."},{"t":"Jasność przekazu","ok":false,"w":"Jasność przekazu to stopień, w jakim informacje są łatwo zrozumiałe (FW-PL s. 82)."},{"t":"Łatwość posługiwania się","ok":false,"w":"Ta cecha mówi, że informacje łatwo przekształcać i wykorzystywać do różnych zadań (FW-PL s. 82)."}],"przyklad":"PRZYKŁAD: jeśli każdy oddział banku wysyła raport z datami w innym zapisie (raz 05.03, raz 3/5, raz „marzec 5”), centrala gubi się w danych. Jeden wspólny wzór raportu to spójne przedstawienie. HACZYK: „ten sam format” → spójne; „krótko i bez zbędnych słów” → zwięzłe.","cyt":{"s":"82","t":"spójne przedstawienie — stopień, w jakim informacje są prezentowane w tym samym formacie","w":"ZGODNE","u":""}},"q-pc-en3-11":{"id":"q-pc-en3-11","typ":"egzamin","s":"EN-02-20","t":"Które pryncypium architektury korporacyjnej odnosi się do stosowania standardów branżowych?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 86"],"r":null,"zap":"Pięć pryncypiów: ponowne wykorzystanie, nabywanie lub samodzielne tworzenie, prostota, zwinność, otwartość (= otwarte standardy branżowe).","scen":"","o":[{"t":"Prostota","ok":false,"w":"Prostota wymaga, by architektura była możliwie najprostsza przy spełnieniu wymagań organizacji (FW-PL s. 86)."},{"t":"Zwinność","ok":false,"w":"Zwinność pozwala skutecznie i wydajnie reagować na zmieniające się potrzeby biznesowe (FW-PL s. 86)."},{"t":"Ponowne wykorzystanie","ok":false,"w":"Ponowne wykorzystanie dotyczy wspólnych komponentów architektury, nie standardów branżowych (FW-PL s. 86)."},{"t":"Otwartość","ok":true,"w":"Pryncypium otwartości: architektura korporacyjna powinna być oparta na otwartych standardach branżowych (FW-PL s. 86)."}],"przyklad":"PRZYKŁAD: ładowarki USB-C pasują do telefonów wielu marek, bo producenci trzymają się wspólnego, otwartego standardu. Architektura oparta na takich standardach nie zamyka organizacji u jednego dostawcy. HACZYK: „standardy branżowe” → otwartość; „wspólne komponenty” → ponowne wykorzystanie.","cyt":{"s":"86","t":"Otwartość — architektura korporacyjna powinna być oparta na otwartych standardach branżowych.","w":"ZGODNE","u":""}},"q-pc-en3-12":{"id":"q-pc-en3-12","typ":"egzamin","s":"EN-02-22","t":"Które zewnętrzne źródło dobrych praktyk zawiera kompleksowe definicje umiejętności?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 88"],"r":null,"zap":"SFIA (Skills Framework for the Information Age) = zewnętrzne źródło definicji umiejętności dla Aktywatora Ludzie, Umiejętności i Kompetencje.","scen":"","o":[{"t":"SFIA","ok":true,"w":"Skills Framework for the Information Age (SFIA) to zewnętrzne źródło z kompleksowymi definicjami umiejętności (FW-PL s. 88)."},{"t":"TOGAF","ok":false,"w":"TOGAF dostarcza modeli referencyjnych architektury i infrastruktury, nie definicji umiejętności (FW-PL s. 86)."},{"t":"ITIL","ok":false,"w":"ITIL zawiera wytyczne projektowania i świadczenia usług, a nie katalog umiejętności (FW-PL s. 86)."},{"t":"ISO/IEC 15504","ok":false,"w":"ISO/IEC 15504 to podstawa oceny zdolności procesów, nie definicji umiejętności (FW-PL s. 71)."}],"przyklad":"PRZYKŁAD: tak jak w kadrach korzysta się z gotowego klasyfikatora zawodów, zamiast samemu wymyślać nazwy stanowisk, tak dział IT może sięgnąć po gotowy katalog umiejętności SFIA. HACZYK: S jak Skills – umiejętności; TOGAF to architektura, ITIL to usługi, ISO/IEC 15504 to ocena procesów.","cyt":{"s":"88","t":"Istnieją zewnętrzne źródła dobrych praktyk, takie jak Skills Framework for the Information Age (SFIA)","w":"ZGODNE","u":""}},"q-pc-en3-13":{"id":"q-pc-en3-13","typ":"egzamin","s":"EN-02-23","t":"Która kategoria umiejętności jest przypisana do domeny Oszacuj, Kieruj i Monitoruj (EDM)?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 88"],"r":null,"zap":"EDM ma jedną przykładową kategorię umiejętności: Ład IT w organizacji (nadzór nad technologiami informatycznymi w przedsiębiorstwie).","scen":"","o":[{"t":"Strategia IT","ok":false,"w":"Strategia IT to przykładowa kategoria umiejętności domeny APO (FW-PL s. 88)."},{"t":"Ład informatyki w organizacji","ok":true,"w":"Jedyna przykładowa kategoria umiejętności dla EDM to Ład (w podręczniku: nadzór) nad informatyką w organizacji (FW-PL s. 88)."},{"t":"Audyt mechanizmów kontrolnych","ok":false,"w":"Audyt mechanizmów kontrolnych to kategoria umiejętności domeny MEA (FW-PL s. 88)."},{"t":"Opracowanie polityki IT","ok":false,"w":"Opracowanie polityki IT to kategoria umiejętności domeny APO (FW-PL s. 88)."}],"przyklad":"PRZYKŁAD: rada nadzorcza spółki nie pisze regulaminów i nie robi audytów – ocenia kierunek, wyznacza go i patrzy, czy firma po nim idzie. Do tego potrzebna jest umiejętność Ładu. HACZYK: strategia i polityka IT brzmią „wysoko”, ale należą do APO, a audyt – do MEA.","cyt":{"s":"88","t":"Ocena, kierowanie i monitorowanie (EDM) • Nadzór nad technologiami informatycznymi w przedsiębiorstwie","w":"TERMIN","u":"Fakt zgodny z FW-PL; różni się nazewnictwo: podręcznik „Nadzór nad technologiami informatycznymi w przedsiębiorstwie” i „Ocena, kierowanie i monitorowanie”, egzamin PL: Ład oraz „Oszacuj, Kieruj i Monitoruj”."}},"q-pc-en3-14":{"id":"q-pc-en3-14","typ":"egzamin","s":"EN-02-24","t":"Który element opisu procesu określa pożądane wyniki procesu i sposób ich pomiaru?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 72","COBIT 5: Enabling Processes, rozdz. 5"],"r":null,"zap":"Element „cele i miary procesu” = lista celów procesu + miary dla każdego z nich.","scen":"","o":[{"t":"Opis procesu","ok":false,"w":"Opis procesu daje ogólny przegląd tego, co proces robi; nie wymienia celów i miar (COBIT 5: Procesy umożliwiające, rozdz. 5; por. FW-PL s. 72)."},{"t":"Cele i miary procesu","ok":true,"w":"Element „cele i miary procesu” wymienia cele procesu i powiązane z nimi miary (COBIT 5: Procesy umożliwiające, rozdz. 5; por. przykład APO08 w FW-PL s. 72)."},{"t":"Identyfikacja procesu","ok":false,"w":"Identyfikacja procesu to etykieta, nazwa, obszar i domena procesu (COBIT 5: Procesy umożliwiające, rozdz. 5; por. FW-PL s. 72)."},{"t":"Przeznaczenie procesu","ok":false,"w":"Przeznaczenie procesu ogólnie wyjaśnia, po co proces istnieje, bez listy celów i miar (COBIT 5: Procesy umożliwiające, rozdz. 5; por. FW-PL s. 72)."}],"przyklad":"PRZYKŁAD: plan treningowy biegacza ma cel „przebiec 10 km poniżej godziny” i miarę „czas na zegarku po każdym biegu”. W opisie procesu COBIT taką parę cel–miara znajdziesz w elemencie „cele i miary procesu”. HACZYK: cele związane z Informatyką, które proces wspiera, siedzą w innym elemencie – w informacjach o kaskadzie celów.","cyt":{"s":"72","t":"Dla każdego procesu muszą zostać zdefiniowane odpowiednie cele i powiązane mierniki.","w":"BRAK_W_FW","u":"Struktura opisu procesu pochodzi z przewodnika COBIT 5: Enabling Processes (rozdz. 5); FW-PL nie opisuje elementów opisu procesu – najbliższy fragment to przykład APO08 (s. 72) z celami i miernikami procesu."}},"q-pc-en3-15":{"id":"q-pc-en3-15","typ":"egzamin","s":"EN-02-24","t":"Który element opisu procesu wskazuje cele związane z Informatyką, wspierane przez proces?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 69","COBIT 5: Enabling Processes, rozdz. 5"],"r":null,"zap":"Informacje o kaskadzie celów = które cele związane z Informatyką proces wspiera (z miarami).","scen":"","o":[{"t":"Cele i miary procesu","ok":false,"w":"Ten element wymienia cele samego procesu i ich miary, a nie cele związane z Informatyką (COBIT 5: Procesy umożliwiające, rozdz. 5; por. FW-PL s. 69)."},{"t":"Diagram RACI procesu","ok":false,"w":"Diagram RACI przypisuje role do praktyk procesu (COBIT 5: Procesy umożliwiające, rozdz. 5; por. FW-PL s. 69)."},{"t":"Powiązane standardy i wytyczne","ok":false,"w":"Ten element wskazuje inne standardy i metodyki powiązane z procesem (COBIT 5: Procesy umożliwiające, rozdz. 5; por. FW-PL s. 70)."},{"t":"Informacje o kaskadzie celów","ok":true,"w":"Informacje o kaskadzie celów wskazują cele związane z Informatyką wspierane przez proces wraz z ich miarami (COBIT 5: Procesy umożliwiające, rozdz. 5; por. FW-PL s. 69)."}],"przyklad":"PRZYKŁAD: drużyna piłkarska ma cel klubu „awans do wyższej ligi”, a trener bramkarzy ma swój cel „mniej straconych goli”. W opisie pracy trenera warto zapisać, że jego cel wspiera awans klubu – to jest informacja o kaskadzie celów. HACZYK: cele „wyżej” (związane z Informatyką) → kaskada celów; cele samego procesu → cele i miary procesu.","cyt":{"s":"69","t":"cele procesu wspierają realizację celów związanych z IT, które z kolei wspierają osiągnięcie celów przedsiębiorstwa","w":"BRAK_W_FW","u":"Struktura opisu procesu pochodzi z przewodnika COBIT 5: Enabling Processes (rozdz. 5); FW-PL nie opisuje elementu „informacje o kaskadzie celów” – najbliższy fragment o powiązaniu celów procesu z celami związanymi z IT jest na s. 69."}},"q-pc-pul-01":{"id":"q-pc-pul-01","typ":"egzamin","s":"PR-02-01","t":"Jak egzamin PL nazywa „framework”, w polskim wydaniu COBIT 5 „metodyka”?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 11"],"r":null,"zap":"Framework: podręcznik „metodyka” = egzamin „Struktura ramowa” (np. w nazwie Zasady 3).","scen":"","o":[{"t":"Model referencyjny","ok":false,"w":"Model referencyjny to np. Referencyjny Model Procesu (PRM) – część COBIT 5, a nie nazwa całego „framework” (FW-PL s. 33)."},{"t":"Struktura ramowa","ok":true,"w":"Na egzaminie PL framework to „Struktura ramowa” (np. Zasada 3: Zastosowanie Pojedynczej Zintegrowanej Struktury Ramowej); polskie wydanie pisze „metodyka COBIT 5” (FW-PL s. 11)."},{"t":"Metodyka biznesowa","ok":false,"w":"To brzmienie z tytułu polskiego wydania podręcznika, a nie termin egzaminacyjny (FW-PL s. 11)."},{"t":"Platforma zarządcza","ok":false,"w":"Takiego terminu nie używa ani podręcznik, ani egzamin."}],"przyklad":"Jak szkielet budynku: wyznacza konstrukcję, w którą wstawia się konkretne rozwiązania (procesy, polityki, role). HACZYK: na egzaminie COBIT 5 to „Struktura ramowa”, a słowo „metodyka” pochodzi z polskiego wydania.","cyt":{"s":"11","t":"Publikacja COBIT 5 zawiera opis metodyki COBIT 5 w zakresie nadzoru nad technologiami informatycznymi w przedsiębiorstwie i zarządzania nimi.","w":"TERMIN","u":"Polskie wydanie podręcznika i egzamin PL używają różnych nazw tego samego pojęcia. Podręcznik: metodyka; egzamin: Struktura ramowa."}},"q-pc-pul-02":{"id":"q-pc-pul-02","typ":"egzamin","s":"EN-02-12","t":"Jak egzamin PL nazywa „level of authority”, w polskim wydaniu „poziom decyzyjny”?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 75"],"r":null,"zap":"Level of authority: podręcznik „poziom decyzyjny” = egzamin „poziom uprawnień”; delegation: podręcznik „przekazywanie uprawnień” = egzamin „delegowanie uprawnień”.","scen":"","o":[{"t":"Zakres kontroli","ok":false,"w":"Zakres kontroli (span of control) to granice uprawnień decyzyjnych struktury – osobna dobra praktyka (FW-PL s. 75)."},{"t":"Delegowanie uprawnień","ok":false,"w":"Delegowanie uprawnień (podręcznik: przekazywanie uprawnień) to przekazanie ich strukturom podległym – osobna dobra praktyka (FW-PL s. 75)."},{"t":"Poziom uprawnień","ok":true,"w":"Na egzaminie PL level of authority to „poziom uprawnień”: decyzje, do których podjęcia struktura jest uprawniona; polskie wydanie: „poziom decyzyjny/uprawnienia decyzyjne” (FW-PL s. 75)."},{"t":"Poziom zdolności","ok":false,"w":"Poziom zdolności dotyczy oceny procesów (0–5), a nie struktur organizacyjnych."}],"przyklad":"Komitet ds. zakupów może sam zatwierdzić wydatek do 100 tys. zł – to jego poziom uprawnień. Gdy decyzje do 10 tys. zł przekaże kierownikom działów, to delegowanie uprawnień. HACZYK: egzamin mówi „poziom uprawnień” i „delegowanie”, podręcznik – „poziom decyzyjny” i „przekazywanie”.","cyt":{"s":"75","t":"Poziom decyzyjny/uprawnienia decyzyjne — decyzje, do których podjęcia struktura jest uprawniona","w":"TERMIN","u":"Polskie wydanie podręcznika i egzamin PL używają różnych nazw tego samego pojęcia. Podręcznik: poziom decyzyjny, przekazywanie uprawnień; egzamin: poziom uprawnień, delegowanie uprawnień."}},"q-pc-pul-03":{"id":"q-pc-pul-03","typ":"egzamin","s":"PR-02-10","t":"Na ilu kluczowych zasadach opiera się norma ISO/IEC 38500?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 57"],"r":null,"zap":"ISO/IEC 38500 = 6 zasad (odpowiedzialność, strategia, nabycie, sprawność, zgodność, zachowanie pracowników); COBIT 5 = 5 zasad.","scen":"","o":[{"t":"Na czterech","ok":false,"w":"Cztery to np. liczba wspólnych wymiarów aktywatora COBIT 5, a nie zasad ISO/IEC 38500 (FW-PL s. 28)."},{"t":"Na pięciu","ok":false,"w":"Pięć zasad ma COBIT 5; norma ISO/IEC 38500 ma ich sześć (FW-PL s. 14, 57)."},{"t":"Na sześciu","ok":true,"w":"Norma ISO/IEC 38500:2008 opiera się na sześciu kluczowych zasadach: odpowiedzialność, strategia, nabycie, sprawność, zgodność, zachowanie pracowników (FW-PL s. 57–59)."},{"t":"Na siedmiu","ok":false,"w":"Siedem to liczba kategorii aktywatorów COBIT 5, a nie zasad ISO/IEC 38500 (FW-PL s. 27)."}],"przyklad":"Dwa regulaminy o podobnym celu mogą mieć różną liczbę punktów – norma ładu IT i COBIT 5 też. HACZYK: ISO/IEC 38500 ma o jedną zasadę więcej niż COBIT 5 – sześć, nie pięć.","cyt":{"s":"57","t":"Norma ISO/IEC 38500:2008–Corporate governance of information technology opiera się na sześciu kluczowych zasadach.","w":"ZGODNE","u":""}},"q-pc-pul-04":{"id":"q-pc-pul-04","typ":"egzamin","s":"EN-02-17","t":"Od czego zależy wartość informacji dla organizacji?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 84"],"r":null,"zap":"Informacja nie ma wartości sama w sobie – korzyść daje dopiero jej zastosowanie lub wykorzystanie (wewnętrznie albo przez sprzedaż), s. 84.","scen":"","o":[{"t":"Od kosztu jej wytworzenia","ok":false,"w":"Koszt wytworzenia nie nadaje informacji wartości; korzyść daje dopiero jej wykorzystanie (FW-PL s. 84)."},{"t":"Od możliwości jej wykorzystania","ok":true,"w":"Wartość informacji jest określana wyłącznie na podstawie możliwości ich wykorzystania – informacje nie mają wartości same w sobie (FW-PL s. 84)."},{"t":"Od ilości zgromadzonych danych","ok":false,"w":"Sama ilość danych nie tworzy wartości; wartość powstaje dopiero przy wykorzystaniu informacji (FW-PL s. 84)."},{"t":"Od czasu jej przechowywania","ok":false,"w":"Przechowywanie to tylko jeden z etapów cyklu życia informacji, a nie źródło jej wartości (FW-PL s. 83)."}],"przyklad":"Raport o sprzedaży leżący nieotwarty w szufladzie niczego nie daje; wartość pojawia się, gdy kierownik na jego podstawie zmieni ceny. HACZYK: liczy się wykorzystanie informacji, a nie samo jej posiadanie, koszt czy ilość.","cyt":{"s":"84","t":"Przedsiębiorstwo może osiągać korzyści z informacji dopiero wówczas, gdy zasób informacyjny zostanie zastosowany lub wykorzystany, więc wartość informacji jest określana wyłącznie na podstawie możliwości ich wykorzystania (wewnętrznie lub poprzez ich sprzedaż) — informacje nie mają wartości same w sobie.","w":"ZGODNE","u":""}},"q-pc-pul-05":{"id":"q-pc-pul-05","typ":"egzamin","s":"PR-02-01","k":false,"st":"autorskie","src":"","z":["FW-PL s. 17","FW-PL s. 23"],"r":null,"scen":"","t":"Zidentyfikuj brakujące słowo w następującym zdaniu. Cel Ładu to realizacja korzyści przy optymalizacji ryzyka i [?].","o":[{"t":"zgodności","ok":false,"w":"Zgodność z przepisami to cel organizacji (powiązany głównie z optymalizacją ryzyka), a nie składnik Celu Ładu (FW-PL s. 17, 19)."},{"t":"jakości","ok":false,"w":"Jakość pojawia się w COBIT 5 m.in. jako kategoria celów aktywatora (jakość wewnętrzna i kontekstowa) oraz w procesie APO11, ale nie jest składnikiem Celu Ładu (FW-PL s. 17, 29, 33)."},{"t":"zasobów","ok":true,"w":"Cel Ładu – Tworzenie Wartości – ma trzy składniki: realizację korzyści, optymalizację ryzyka i optymalizację zasobów (FW-PL s. 17, 23)."},{"t":"procesów","ok":false,"w":"Procesy to jeden z siedmiu aktywatorów, a nie składnik Celu Ładu (FW-PL s. 17, 27)."}],"zap":"Cel Ładu = Tworzenie Wartości = realizacja korzyści + optymalizacja ryzyka + optymalizacja zasobów. Zgodność z przepisami to cel organizacji, nie składnik Celu Ładu.","przyklad":"Szpital kupuje nowy system rejestracji: ma skrócić kolejki (korzyść), nie narażać danych pacjentów (ryzyko) i nie pochłonąć całego budżetu ani ludzi (zasoby). Wymogi prawa trzeba spełnić, ale to osobny cel organizacji. HACZYK: „zgodność” brzmi jak czwarty składnik Celu Ładu, a nim nie jest.","cyt":{"s":"17","t":"Tworzenie wartości oznacza osiąganie ko const REL_STOP=new Set(['cobit 5','cobit','procesy','proces','cele','informacje','informacja','zasoby','role']);
function relKeys(t,en){
  const k=[], code=(t||'').match(/\b(EDM|APO|BAI|DSS|MEA)\d\d\b|\bPA ?\d\.\d\b/);
  if(code) k.push(code[0].toLowerCase().replace(' ',''));
  const n=(t||'').toLowerCase().replace(/\([^)]*\)/g,' ').replace(/®/g,'').replace(/^[\d.·\s]+/,'').replace(/[„”"·:—–]/g,' ').replace(/\s+/g,' ').trim();
  if(n){ const w=n.split(' '); k.push(w.length>4?w.slice(0,3).join(' '):n); }
  if(en&&en.length>=6) k.push(en.toLowerCase().replace(/\([^)]*\)/g,'').trim());
  return k.filter(x=>x.length>=5&&!REL_STOP.has(x));
}
const containsPhrase=(text,phrase)=>{ const n=s=>String(s||'').toLocaleLowerCase('pl').replace(/[^\p{L}\p{N}]+/gu,' ').trim(); return (' '+n(text)+' ').includes(' '+n(phrase)+' '); };

function examFilter(items,pk,suf){

  const keep=new Set(items.filter(i=>i.dimOf||isExam(i.pl,i.en,i.opis)).map(i=>i.k));
  [...keep].forEach(k=>{ let p=byk[k][pk], n=0; while(p&&byk[p]&&n<10){ keep.add(p); p=byk[p][pk]; n++; } });

  if(rest.length) out.push({k:'_tlo'+(suf||''),pl:'Pozostałe szczegóły ('+rest.length+')',opis:rest.map(r=>r.pl).join(' · '),tlo:rest});

const WYN_KEY='cobit-schemat-wyniki', WYN_COOKIE='cobitWyniki';
function wynLoad(){ let o={};
  try{ const v=localStorage.getItem(WYN_KEY); if(v) o=JSON.parse(v)||{}; }catch(_){}
  try{ const m=document.cookie.match(new RegExp('(?:^|; )'+WYN_COOKIE+'=([^;]*)')); if(m){ const c=JSON.parse(decodeURIComponent(m[1]))||{}; Object.entries(c).forEach(([k,v])=>{ if(!o[k]||(v.t||0)>(o[k].t||0)) o[k]=v; }); } }catch(_){}
  return o; }
let WYN=wynLoad();
function wynSave(){
  try{ localStorage.setItem(WYN_KEY,JSON.stringify(WYN)); }catch(_){}
  try{ const ent=Object.entries(WYN).sort((a,b)=>(b[1].t||0)-(a[1].t||0)), o={};
    for(const [k,v] of ent){ o[k]=v; if(encodeURIComponent(JSON.stringify(o)).length>3800){ delete o[k]; break; } }
    document.cookie=WYN_COOKIE+'='+encodeURIComponent(JSON.stringify(o))+';max-age=31536000;path=/;SameSite=Lax'; }catch(_){}
}

/* wycinek koła dla fazy: ta sama geometria co Ilustracja 17, podświetlona tylko faza n */
function wedgeHTML(n){
  const C=110, rings=[[104,80,'g-amber'],[80,56,'g-teal'],[56,32,'g-purple']];
  const pt=(r,a)=>[(C+r*Math.cos(a)).toFixed(1),(C+r*Math.sin(a)).toFixed(1)];
  let svg='<svg class="cykl-svg wedge-svg" viewBox="0 0 220 220" role="img" aria-label="Faza '+n+' w trzech kręgach">';
  rings.forEach(([R,r,g])=>{ svg+='<g class="'+g+'">';
    for(let i=0;i<7;i++){ const a0=-Math.PI/2+i*2*Math.PI/7+0.015, a1=-Math.PI/2+(i+1)*2*Math.PI/7-0.015;
      const [x0,y0]=pt(R,a0),[x1,y1]=pt(R,a1),[x2,y2]=pt(r,a1),[x3,y3]=pt(r,a0);
      svg+='<path'+(i===n-1?'':' class="wdim"')+' d="M'+x0+' '+y0+'A'+R+' '+R+' 0 0 1 '+x1+' '+y1+'L'+x2+' '+y2+'A'+r+' '+r+' 0 0 0 '+x3+' '+y3+'Z"/>'; }
    svg+='</g>'; });
  svg+='<circle cx="110" cy="110" r="30" class="core"/><text x="110" y="110" text-anchor="middle" dominant-baseline="central" class="core-t">'+n+'</text></svg>';
  const f=FAZY3[n-1];
  const rows=f.r.map((x,j)=>'<div class="wedge-row '+RINGS[j].g+'"><span class="rdot"></span><div><div class="wedge-k">'+esc(['krąg zewnętrzny','krąg środkowy','krąg wewnętrzny'][j])+' · '+esc(RINGS[j].ex)+'</div>'+
    '<b>'+esc(x[1]||x[0])+'</b>'+(x[1]&&x[1]!==x[0]?'<div class="wedge-hb">podręcznik: '+esc(x[0])+'</div>':'')+'<div class="wedge-en"><em>'+esc(x[2])+'</em></div></div></div>').join('');

document.addEventListener('keydown',e=>{ if(pv.hidden)return; if(e.key==='Escape'){closePage();e.preventDefault();e.stopImmediatePropagation();}else if(e.key==='Tab'){const bs=[...pv.querySelectorAll('button,summary')];const i=bs.indexOf(document.activeElement);if(e.shiftKey&&(i<=0)){e.preventDefault();bs.at(-1)?.focus();}else if(!e.shiftKey&&(i===bs.length-1||i<0)){e.preventDefault();bs[0]?.focus();}e.stopImmediatePropagation();} },true);

/* ---------- aplikacja ---------- */
let RF=null;
const NEIGH={};
function fitAll(d=300){ if(!RF) return; const b=RF.getNodesBounds(RF.getNodes()); b.height+=260; RF.fitBounds(b,{padding:0.04,duration:d}); }
/* Widok zmieniamy tylko po nawigacji użytkownika. Zamknięcie panelu,
   zmiana rozmiaru okna i zakończenie ładowania nie dopasowują całej mapy. */
const VIEW_KEY='cobit-schemat-widok-v1';
function initialViewport(){ return {x:28,y:24,zoom:document.getElementById('app').clientWidth<520?0.8:0.9}; }
function readViewport(){
  try{ const v=JSON.parse(localStorage.getItem(VIEW_KEY)||'null');
    if(v&&[v.x,v.y,v.zoom].every(Number.isFinite)&&v.zoom>=0.03&&v.zoom<=2) return {x:v.x,y:v.y,zoom:v.zoom};
  }catch(_){} return null;
}
function saveViewport(v){ try{localStorage.setItem(VIEW_KEY,JSON.stringify({x:v.x,y:v.y,zoom:v.zoom}));}catch(_){} }
function focusOn(id){
  if(!RF) return;
  const el=document.getElementById('app'), W=el.clientWidth, H=el.clientHeight;
  const nid=id, n=RF.getNode(nid); if(!n) return;
  const w=(n.measured&&n.measured.width)||n.width||300, hh=(n.measured&&n.measured.height)||n.height||100;
  const cy=n.position.y+hh/2;
  if(w>1000){ const z=0.62; RF.setCenter(n.position.x+(W/2-30)/z, cy+(W<900?(H*0.28)/z:0), {zoom:z,duration:450}); return; }
  const z=Math.min(1.25, (W*0.36)/Math.max(w,1));
  const cx=n.position.x+w/2;
  if(W<900) RF.setCenter(cx, cy+(H*0.28)/z, {zoom:z,duration:450});
  else RF.setCenter(cx+(W*0.30)/z, cy, {zoom:z,duration:450});
}
function getTheme(){ try{ return localStorage.getItem(KEY)||'system'; }catch(_){ return 'system'; } }
function App(){
  const [theme,setTheme] = React.useState(getTheme());
  React.useEffect(()=>{
    if(theme==='light'||theme==='dark') root.setAttribute('data-theme',theme); else root.removeAttribute('data-theme');
    document.querySelectorAll('.theme button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.t===theme)));
    try{ localStorage.setItem(KEY,theme); }catch(_){}
  },[theme]);
  React.useEffect(()=>{
    const bs=[...document.querySelectorAll('.theme button')];
    const fns=bs.map(b=>{const f=()=>setTheme(b.dataset.t);b.addEventListener('click',f);return f;});
    return ()=>bs.forEach((b,i)=>b.removeEventListener('click',fns[i]));
  },[]);
  const [sel,setSel] = React.useState(null);
  React.useEffect(()=>{
    const f=(ev)=>setSel(ev.detail);
    window.addEventListener('cobit-sel',f);
    return ()=>window.removeEventListener('cobit-sel',f);
  },[]);
  React.useEffect(()=>{
    window.__sel=sel;
    if(sel){ showInfo(sel); focusOn(sel); }
    else clearInfo();
  },[sel]);
  React.useEffect(()=>{
    const k=(e)=>{
      if(e.target && (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.closest('.bar'))) return;
      if(e.key==='Escape') setSel(null);
      else if(e.key==='ArrowRight') setSel(s=>s?step(s,1):s);
      else if(e.key==='ArrowLeft') setSel(s=>s?step(s,-1):s);
    };
    window.addEventListener('keydown',k); return ()=>window.removeEventListener('keydown',k);
  },[]);
  const live = sel ? (NEIGH[sel]||[sel]) : null;
  const [startViewport] = React.useState(()=>readViewport()||initialViewport());
  const viewNodes = React.useMemo(()=>nodes.map(n=>!sel?n:{...n,className:live.includes(n.id)?'sel':'dim'}),[sel]);
  const viewEdges = React.useMemo(()=>edges.map(x=>{
    let y=x;
    if(x.id==='e17') y={...x,style:{...x.style,stroke:sel==='petla'?'#BA7517':'#6f6e69',strokeWidth:sel==='petla'?3.4:2.4},interactionWidth:24};
    if(sel){ const on = (x.source===sel||x.target===sel); y={...y,className:on?'':'dim'}; }
    return y;
  }),[sel]);
  return h(ReactFlow,{
    nodes:viewNodes, edges:viewEdges, nodeTypes,
    onNodeClick:(_,n)=>{ if(INFO[n.id]) setSel(n.id); },
    onEdgeClick:(_,ed)=>{ if(ed.id==='e17') setSel('petla'); },
    onPaneClick:()=>setSel(null),
    colorMode: theme,
    defaultViewport:startViewport,
    onMoveEnd:(_,viewport)=>saveViewport(viewport),
    onInit:(inst)=>{RF=inst;},
    minZoom:0.03, maxZoom:2,
    zoomOnScroll:false, panOnScroll:false, preventScrolling:false, zoomOnPinch:true,
    nodesConnectable:false, elementsSelectable:true,
    proOptions:{hideAttribution:true}
  },
    h(Background,{gap:24,size:1}),
    h(Controls,{showInteractive:false})
  );
}
createRoot(document.getElementById('app')).render(h(App));
window.SCHEMAT_EXAM.init({getResults:()=>WYN,refresh:()=>{if(window.__sel&&INFO[window.__sel])showInfo(window.__sel);},record:(u,i,ok,meta={})=>{const r=WYN[u]||{n:0,g:0};r.n++;r.g+=ok?1:0;r.ok=ok?1:0;r.i=i;r.rev=window.PYTANIA.plan.revision;r.assisted=!!meta.assisted;r.t=Date.now();WYN[u]=r;wynSave();},jump:code=>{const nodes=(window.PYTANIA.plan.kody[code]||[]);const id=nodes.find(n=>INFO[n]);if(id)window.dispatchEvent(new CustomEvent('cobit-sel',{detail:id}));}});

/* tylko egzamin / cały podręcznik */
{ const b=document.getElementById('exall'); b.textContent=EX_ALL?'Skup widok — zwiń szczegóły':'Rozwiń wszystkie szczegóły'; b.setAttribute('aria-pressed',String(!EX_ALL));
  b.addEventListener('click',()=>{ try{ localStorage.setItem('cobit-schemat-szczegoly',EX_ALL?'compact':'full'); }catch(_){} location.reload(); }); }
/* tryb przykładu */
document.getElementById('exbtn').addEventListener('click',()=>{
  toolsMenu.open=false;
  if(EXMODE){ window.dispatchEvent(new CustomEvent('cobit-sel',{detail:null})); return; }
  EXMODE=true; TAB='ex'; exBtnSync();

});
/* pełny ekran */
const app=document.getElementById('wrap'), fs=document.getElementById('fs');
fs.addEventListener('click',()=>{ if(document.fullscreenElement) document.exitFullscreen(); else if(app.requestFullscreen) app.requestFullscreen(); });
document.addEventListener('fullscreenchange',()=>{ fs.textContent=document.fullscreenElement?'Zamknij pełny ekran':'Pełny ekran'; });
document.getElementById('area').addEventListener('change',e=>{const id=e.target.value;if(id){toolsMenu.open=false;window.dispatchEvent(new CustomEvent('cobit-sel',{detail:id}));}e.target.value='';});
const toolsMenu=document.querySelector('.tools-menu');
document.getElementById('homeview').addEventListener('click',()=>{toolsMenu.open=false;window.dispatchEvent(new CustomEvent('cobit-sel',{detail:null}));if(RF)RF.setViewport(initialViewport(),{duration:300});});
document.getElementById('allview').addEventListener('click',()=>{toolsMenu.open=false;window.dispatchEvent(new CustomEvent('cobit-sel',{detail:null}));fitAll();});
document.addEventListener('click',e=>{if(!toolsMenu.contains(e.target))toolsMenu.open=false;});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&toolsMenu.open){toolsMenu.open=false;toolsMenu.querySelector('summary').focus();e.stopImmediatePropagation();}},true);
</script>
