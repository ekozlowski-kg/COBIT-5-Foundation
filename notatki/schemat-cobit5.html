owstające przy jego wykonywaniu.","ex":"W kuchni: zamówienie od kelnera (wejście), rachunek i zapis temperatur lodówki (wyjścia). Inspektor ogląda je jako dowód, że praca była wykonana.","org":""}},"fz-D-072":{"id":"fz-D-072","typ":"egzamin","s":"PC-01-04","t":"Czym jest rezultat procesu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 45"],"r":null,"zap":"","scen":"","o":[{"t":"Widocznym, sprawdzalnym efektem tego, że proces spełnia swoje przeznaczenie","ok":true,"w":"Ocenia się go przy poziomie 1."},{"t":"Dokumentem z planem pracy procesu","ok":false,"w":"Planowanie pracy procesu to poziom 2."},{"t":"Oceną wystawioną przez asesora","ok":false,"w":"Ocena to wynik oceny, a nie rezultat procesu."},{"t":"Opisem, po co proces istnieje","ok":false,"w":"To przeznaczenie procesu."}],"fz":{"h":"Rezultat procesu","p":"P1","pulapka":false,"n":"EN: Process outcome","q":"Czym jest rezultat procesu?","a":"Widoczny, sprawdzalny efekt tego, że proces spełnia swoje przeznaczenie; ocenia się go przy poziomie 1.","ex":"Rezultat to to, co da się zobaczyć: obiad na stole, najedzony gość. Jeśli go nie ma, kuchnia nie ma nawet poziomu 1.","org":""}},"fz-D-073":{"id":"fz-D-073","typ":"egzamin","s":"PC-02-04","t":"Czym różni się Wymiar Procesu od Wymiaru Zdolności?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42","PeopleCert Syllabus — PC-02-04"],"r":null,"zap":"","scen":"","o":[{"t":"Wymiar Procesu obejmuje atrybuty wspólne, a Wymiar Zdolności – wskaźniki właściwe dla procesu","ok":false,"w":"Definicje są tu zamienione."},{"t":"Wymiar Procesu dotyczy COBIT 4.1, a Wymiar Zdolności – COBIT 5","ok":false,"w":"Oba wymiary dotyczą oceny w COBIT 5."},{"t":"Wymiar Procesu ma wskaźniki właściwe dla procesu (poziom 1), a Wymiar Zdolności – atrybuty wspólne dla procesów (poziomy 1–5)","ok":true,"w":"Wymiar procesu zawiera treść właściwą konkretnym procesom i wskaźniki ich wykonania. Wymiar zdolności zawiera wspólne atrybuty poziomów 1–5, w tym PA (Process Attribute — atrybut procesu) 1.1. Specyficzne są wskaźniki osiągania celu procesu, nie sam atrybut PA 1.1."},{"t":"Niczym – to dwie nazwy tego samego","ok":false,"w":"To dwa różne wymiary wskaźników oceny."}],"fz":{"h":"Wymiar Procesu a Wymiar Zdolności","p":"P1","pulapka":false,"n":"EN: Process dimension vs capability dimension","q":"Czym różnią się Wymiar Procesu i Wymiar Zdolności?","a":"Wymiar Procesu: wskaźniki właściwe dla danego procesu – praktyki bazowe i produkty pracy (procesy i ich wyniki definiuje PRM); sprawdza poziom 1 (PA 1.1). Wymiar Zdolności: atrybuty z ogólnymi praktykami, zasobami i produktami pracy, wspólne dla procesów; poziomy 1–5. Wskaźniki opisuje PAM.","ex":"Wymiar Procesu – pytania o konkretne stanowisko (czy grill piecze mięso?). Wymiar Zdolności – te same pytania dla każdego stanowiska (czy jest plan, standard, pomiar?).","org":""}},"fz-D-074":{"id":"fz-D-074","typ":"egzamin","s":"PC-02-03","t":"Czego według ISO/IEC 15504-2 NIE może zawierać opis procesu w Referencyjnym Modelu Procesu (PRM)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 43","PeopleCert Syllabus — PC-02-03"],"r":null,"zap":"","scen":"","o":[{"t":"Ogólnych cech atrybutów zdolności poziomów 2–5 wpisanych w treść opisu każdego procesu","ok":true,"w":"Opis w PRM (Process Reference Model — Referencyjny Model Procesu) obejmuje przeznaczenie i rezultaty procesu. Nie włącza ogólnych cech atrybutów zdolności ponad poziom 1 do treści każdego procesu. Nie oznacza to zakazu planowania lub monitorowania, gdy właśnie taki jest merytoryczny cel ocenianego procesu."},{"t":"Celu procesu","ok":false,"w":"Cel procesu musi się w opisie znaleźć."},{"t":"Rezultatów procesu","ok":false,"w":"Rezultaty procesu muszą się w opisie znaleźć."},{"t":"Kroków potrzebnych do osiągnięcia celu procesu","ok":false,"w":"Te kroki właśnie mogą się znaleźć w opisie."}],"fz":{"h":"Wymagania ISO/IEC 15504-2 wobec PRM","p":"P2","pulapka":false,"n":"EN: PRM requirements per ISO/IEC 15504-2","q":"Jakie wymagania ISO/IEC 15504-2 musi spełniać opis procesu w PRM?","a":"Opis procesu w Process Reference Model — Referencyjnym Modelu Procesu — zawiera jego przeznaczenie i rezultaty. Nie włącza do treści każdego procesu ogólnych cech atrybutów zdolności ponad poziom 1. Rozdziela się to, co proces ma osiągnąć, od oceny sposobu jego wykonywania. Planowanie lub monitorowanie może być własnym celem konkretnego procesu, np. procesów MEA.","ex":"Proces monitorowania może wytwarzać raporty już jako wymagane wyniki swojego wykonania. Oddzielnie bada się, czy samo wykonywanie tego procesu jest planowane, zarządzane i kontrolowane.","org":""}},"fz-D-075":{"id":"fz-D-075","typ":"egzamin","s":"PC-02-01","t":"Który z poniższych NIE jest celem oceny zdolności procesu według fiszki?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 45","PeopleCert Syllabus — PC-02-01"],"r":null,"zap":"","scen":"","o":[{"t":"Porównanie procesów przez Ład i kierownictwo","ok":false,"w":"Jest to cel oceny wymieniony w podręczniku."},{"t":"Ustalenie „jak jest” i „jak ma być”, by zdecydować o inwestycjach","ok":false,"w":"Jest to cel oceny wymieniony w podręczniku."},{"t":"Ocena osobistych kompetencji każdego pracownika","ok":true,"w":"Ocena zdolności dotyczy procesów: porównań, stanu aktualnego i docelowego, luk, planu usprawnień oraz monitorowania zdolności w czasie. Nie służy wystawianiu ogólnej oceny wartości lub kompetencji poszczególnych pracowników."},{"t":"Śledzenie zdolności w czasie dzięki porównywalnym ocenom","ok":false,"w":"Jest to cel oceny wymieniony w podręczniku."}],"fz":{"h":"Cele oceny zdolności procesu","p":"P2","pulapka":false,"n":"EN: Purposes of process capability assessment","q":"Jakie są cele oceny zdolności procesu?","a":"Ład i kierownictwo mogą porównać procesy; ustalić „jak jest” i „jak ma być”, by zdecydować o inwestycjach; zobaczyć luki i zaplanować usprawnienia; śledzić zdolność w czasie dzięki porównywalnym ocenom.","ex":"Właściciel sieci restauracji widzi, która kuchnia odstaje, ile brakuje do celu i w co włożyć pieniądze – oraz czy z roku na rok jest lepiej.","org":""}},"fz-D-076":{"id":"fz-D-076","typ":"egzamin","s":"PC-02-01","t":"Jakie cele może mieć ocena według ISO/IEC 15504?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 45","PeopleCert Syllabus — PC-02-01"],"r":null,"zap":"","scen":"","o":[{"t":"Wyłącznie zewnętrzne – certyfikację","ok":false,"w":"Ocena może mieć też cele wewnętrzne."},{"t":"Wyłącznie wewnętrzne – porównania obszarów","ok":false,"w":"Ocena może mieć też cele zewnętrzne."},{"t":"Wewnętrzne lub zewnętrzne, zależnie od celu oceny","ok":true,"w":"Ocena może służyć wewnętrznemu doskonaleniu lub celom zewnętrznym, np. formalnemu raportowaniu. Cel, zakres i wymagany rygor ustala się dla oceny. Samoocena nie zapewnia automatycznej certyfikacji, a ocena wewnętrzna także może być formalna."},{"t":"Wyłącznie finansowe – wycenę działu IT","ok":false,"w":"Podręcznik nie wymienia takiego celu."}],"fz":{"h":"Ocena wewnętrzna a zewnętrzna","p":"P2","pulapka":false,"n":"EN: Internal vs external assessment","q":"Jakie cele może mieć ocena wg ISO/IEC 15504?","a":"Ocena według ISO/IEC 15504 może mieć cele wewnętrzne, np. doskonalenie i porównania obszarów, lub zewnętrzne, np. formalne raportowanie. Wymagany rygor zależy od celu i ustalonej procedury. Wewnętrzna ocena także może być formalna, a samoocena nie nadaje automatycznie certyfikacji.","ex":"Organizacja może zlecić własnemu kompetentnemu zespołowi formalną ocenę albo wykonać orientacyjną samoocenę. Zewnętrzny odbiorca może wymagać dodatkowo określonej procedury i raportu.","org":""}},"fz-D-077":{"id":"fz-D-077","typ":"egzamin","s":"PC-02-02","t":"Który dokument NIE należy do trzech przewodników programu oceny COBIT?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 41","PeopleCert Syllabus — PC-02-02"],"r":null,"zap":"","scen":"","o":[{"t":"Model Oceny Procesu (PAM)","ok":false,"w":"To jeden z trzech przewodników."},{"t":"Przewodnik COBIT 5: Wdrożenie","ok":true,"w":"Trzy przewodniki programu oceny to PAM — Model Oceny Procesu, Assessor Guide — Przewodnik Asesora i Self-assessment Guide — Przewodnik Samooceny. Przewodnik wdrożenia ma inny cel: wspiera wdrażanie i doskonalenie Ładu i Zarządzania."},{"t":"Przewodnik Asesora","ok":false,"w":"To jeden z trzech przewodników."},{"t":"Przewodnik Samooceny","ok":false,"w":"To jeden z trzech przewodników."}],"fz":{"h":"Trzy przewodniki programu oceny","p":"P2","pulapka":false,"n":"EN: PAM, Assessor Guide, Self-Assessment Guide","q":"Podaj trzy przewodniki programu oceny COBIT.","a":"Process Assessment Model — Model Oceny Procesu (PAM); Assessor Guide — Przewodnik Asesora; Self-assessment Guide — Przewodnik Samooceny.","ex":"Model określa procesy i wskaźniki oceny. Przewodnik Asesora wyjaśnia formalne przeprowadzenie oceny, a Przewodnik Samooceny prostsze rozpoznanie. Nie są to trzy nazwy tego samego dokumentu.","org":""}},"fz-D-078":{"id":"fz-D-078","typ":"egzamin","s":"PC-02-06","t":"PA 1.1 = P, PA 2.1 = W, PA 2.2 = W, PA 3.1 = C. Jaki to poziom zdolności?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42","PeopleCert Syllabus — PC-02-06"],"r":null,"zap":"","scen":"","o":[{"t":"Poziom 1","ok":false,"w":"Atrybuty poziomu 2 na W wystarczają do poziomu 2."},{"t":"Poziom 2","ok":true,"w":"PA (Process Attribute — atrybut procesu) 1.1 jest pełny, a oba atrybuty poziomu 2 mają W, więc proces osiąga poziom 2. Do poziomu 3 potrzebne są pełne atrybuty niższe oraz co najmniej W dla obu atrybutów poziomu 3; wskazane oceny tego nie spełniają."},{"t":"Poziom 3","ok":false,"w":"Wymagałby P na obu atrybutach poziomu 2 i co najmniej W na PA (Process Attribute — atrybut procesu) 3.1 i 3.2."},{"t":"Poziom 0","ok":false,"w":"PA (Process Attribute — atrybut procesu) 1.1 = P, więc proces osiąga cel."}],"fz":{"h":"Liczenie poziomu: P, W, W, C","p":"P1","pulapka":false,"n":"EN: Worked example","q":"PA1.1=P, PA2.1=W, PA2.2=W, PA3.1=C – jaki poziom zdolności?","a":"Poziom 2. Poziom 1 pełny (P), atrybuty poziomu 2 co najmniej W. Poziom 3 nie: wymaga P na obu atrybutach poziomu 2 i co najmniej W na PA 3.1 i 3.2.","ex":"Stoisz na stopniu 2: stopień 1 jest cały (P), a 2 „prawie” (W). Na 3 nie wejdziesz: stopień 2 musiałby być cały, a PA 3.1 ma tylko C.","org":""}},"fz-D-079":{"id":"fz-D-079","typ":"egzamin","s":"PC-02-06","t":"PA 1.1 = W, PA 2.1 = P, PA 2.2 = P. Jaki to poziom zdolności?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42","PeopleCert Syllabus — PC-02-06"],"r":null,"zap":"","scen":"","o":[{"t":"Poziom 2","ok":false,"w":"Poziom 2 wymaga P na PA (Process Attribute — atrybut procesu) 1.1."},{"t":"Poziom 0","ok":false,"w":"W na PA (Process Attribute — atrybut procesu) 1.1 wystarcza do poziomu 1."},{"t":"Poziom 3","ok":false,"w":"Nie oceniono atrybutów poziomu 3, a PA (Process Attribute — atrybut procesu) 1.1 nie jest pełny."},{"t":"Poziom 1","ok":true,"w":"W na PA (Process Attribute — atrybut procesu) 1.1 wystarcza do poziomu 1. Do poziomu 2 PA 1.1 musi mieć P, dlatego pełne oceny PA 2.1 i PA 2.2 nie podnoszą poziomu. Oceny atrybutów nie kompensują się średnią."}],"fz":{"h":"Liczenie poziomu: W, P, P","p":"P1","pulapka":false,"n":"EN: Worked example","q":"PA1.1=W, PA2.1=P, PA2.2=P – jaki poziom zdolności?","a":"Poziom 1. W na PA 1.1 wystarcza do poziomu 1, ale poziom 2 wymaga P na PA 1.1 – dobre oceny PA 2.x nie pomagają.","ex":"Jak pasy: świetnie opanowane techniki zielonego pasa nic nie dają, gdy żółty jest zaliczony tylko „prawie”. Najpierw domknij niższy poziom.","org":""}},"fz-D-080":{"id":"fz-D-080","typ":"egzamin","s":"PC-02-06","t":"PA 1.1 = P, PA 2.1 = P, PA 2.2 = P, PA 3.1 = W, PA 3.2 = C. Jaki to poziom zdolności?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42","PeopleCert Syllabus — PC-02-06"],"r":null,"zap":"","scen":"","o":[{"t":"Poziom 3","ok":false,"w":"Oba atrybuty poziomu 3 muszą mieć co najmniej W."},{"t":"Poziom 1","ok":false,"w":"Atrybuty poziomu 2 są pełne, więc poziom 2 jest osiągnięty."},{"t":"Poziom 4","ok":false,"w":"Poziom 3 nie jest nawet osiągnięty."},{"t":"Poziom 2","ok":true,"w":"PA (Process Attribute — atrybut procesu) 3.2 ma C, więc nie osiągnięto wymaganego minimum W dla każdego atrybutu poziomu 3. Pełne osiągnięcie atrybutów poziomów 1 i 2 pozwala potwierdzić poziom 2."}],"fz":{"h":"Liczenie poziomu: P, P, P, W, C","p":"P1","pulapka":false,"n":"EN: Worked example","q":"PA1.1=P, PA2.1=P, PA2.2=P, PA3.1=W, PA3.2=C – jaki poziom zdolności?","a":"Poziom 2. Do poziomu 3 oba atrybuty PA 3.1 i PA 3.2 muszą mieć co najmniej W; PA 3.2 ma tylko C.","ex":"Do poziomu 3 oba jego pytania trzeba zaliczyć co najmniej na W. Jedno słabe (C) blokuje cały poziom – jak oblany jeden z dwóch egzaminów.","org":""}},"fz-D-081":{"id":"fz-D-081","typ":"egzamin","s":"PC-02-06","t":"PA 1.1 osiągnięto w 40%. Jaka to ocena i jaki poziom zdolności?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 45","PeopleCert Syllabus — PC-02-06"],"r":null,"zap":"","scen":"","o":[{"t":"Ocena C, poziom 0","ok":true,"w":"Ocenione 40% osiągnięcia PA (Process Attribute — atrybut procesu) 1.1 odpowiada C — Częściowy, czyli angielskiemu P — Partially achieved. Do poziomu 1 potrzeba co najmniej W, dlatego wynik zdolności to poziom 0. Procent nie oznacza automatycznie odsetka udanych zgłoszeń."},{"t":"Ocena C, poziom 1","ok":false,"w":"Poziom 1 wymaga na PA (Process Attribute — atrybut procesu) 1.1 co najmniej W, czyli ponad 50%."},{"t":"Ocena W, poziom 1","ok":false,"w":"40% to C, a nie W."},{"t":"Ocena N, poziom 0","ok":false,"w":"N to tylko 0–15%."}],"fz":{"h":"Liczenie poziomu: PA 1.1 w 40%","p":"P1","pulapka":false,"n":"EN: Worked example","q":"PA 1.1 osiągnięty w 40%. Jaka ocena i poziom?","a":"Ocena C (Częściowy, >15–50%), więc poziom 0 – proces niekompletny.","ex":"Do poziomu 1 trzeba na PA 1.1 co najmniej W, czyli ponad 50%. 40% to oceniony stopień osiągnięcia atrybutu (nie odsetek udanych obiadów) – za mało, więc zostaje 0.","org":""}},"fz-D-082":{"id":"fz-D-082","typ":"egzamin","s":"PC-02-04","t":"Czy atrybuty poziomów 2–5 są inne dla każdego procesu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 43","PeopleCert Syllabus — PC-02-04"],"r":null,"zap":"","scen":"","o":[{"t":"Nie — atrybuty są wspólne wszystkim ocenianym procesom","ok":true,"w":"PA (Process Attribute — atrybut procesu) 2.1–PA 5.2 są wspólne dla procesów. Wspólny jest również PA 1.1, który mierzy osiąganie przeznaczenia. Konkretne rezultaty, praktyki bazowe i produkty pracy dostarczające wskaźników wykonania różnią się między procesami."},{"t":"Tak – każdy proces ma własne atrybuty 2–5","ok":false,"w":"Atrybuty 2–5 są wspólne."},{"t":"Tak – różnią się dla każdej domeny","ok":false,"w":"Atrybuty 2–5 są wspólne dla wszystkich procesów."},{"t":"Nie – bo poziomy 2–5 nie mają atrybutów","ok":false,"w":"Każdy z poziomów 2–5 ma dwa atrybuty."}],"fz":{"h":"Wspólne atrybuty poziomów 2–5","p":"P1","pulapka":false,"n":"EN: Generic attributes for levels 2–5","q":"Czy atrybuty poziomów 2–5 są inne dla każdego procesu?","a":"PA 2.1–PA 5.2 są wspólne dla procesów. Wspólny jest również PA 1.1 Process performance — Wykonanie procesu. Specyficzne dla danego procesu są przeznaczenie, rezultaty, praktyki bazowe i produkty pracy, które dostarczają wskaźników wykonania. Wszystkie atrybuty należą do wspólnego wymiaru zdolności.","ex":"Dwa różne procesy ocenia się tym samym atrybutem PA 1.1: czy osiągają swoje przeznaczenie? Różne są wymagane rezultaty i dowody, bo inny jest cel procesu obsługi incydentów, a inny procesu strategii.","org":""}},"fz-D-083":{"id":"fz-D-083","typ":"egzamin","s":"PC-01-02","t":"Planowanie, monitorowanie i korygowanie wykonania ocenianego procesu – do którego atrybutu należy?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42","PeopleCert Syllabus — PC-01-02"],"r":null,"zap":"","scen":"","o":[{"t":"PA 1.1 Wykonanie procesu (poziom 1)","ok":false,"w":"PA (Process Attribute — atrybut procesu) 1.1 sprawdza tylko, czy proces osiąga cel."},{"t":"PA 2.1 Zarządzanie wydajnością (poziom 2)","ok":true,"w":"Planowanie, monitorowanie i dostosowywanie wykonania ocenianego procesu należy do PA (Process Attribute — atrybut procesu) 2.1 Performance management — Zarządzanie wydajnością. Należy to odróżnić od procesu, którego własnym rezultatem jest plan, np. strategia IT (Information Technology — informatyka) w APO02."},{"t":"PA 3.1 Definicja procesu (poziom 3)","ok":false,"w":"PA (Process Attribute — atrybut procesu) 3.1 dotyczy zdefiniowanego standardu."},{"t":"PA 4.2 Kontrola procesu (poziom 4)","ok":false,"w":"PA (Process Attribute — atrybut procesu) 4.2 dotyczy trzymania procesu w granicach."}],"fz":{"h":"Planowanie wykonania procesu – poziom 2","p":"P1","pulapka":true,"n":"EN: Planning = level 2","q":"Planowanie wykonania procesu – poziom 1 czy 2?","a":"Planowanie, monitorowanie i korygowanie wykonania ocenianego procesu to PA 2.1 (Zarządzanie wydajnością), poziom 2. Nie myl z planowaniem, które jest wynikiem procesu, np. APO02.","ex":"Poziom 1: obiad wychodzi, choćby na żywioł. Grafik pracy kuchni i pilnowanie zmian to już poziom 2. Haczyk: plan pracy procesu = dwójka.","org":""}},"fz-D-084":{"id":"fz-D-084","typ":"egzamin","s":"PC-02-04","t":"Co ocenia atrybut PA 1.1?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42","PeopleCert Syllabus — PC-02-04"],"r":null,"zap":"","scen":"","o":[{"t":"Jak dobrze proces jest zarządzany","ok":false,"w":"To zakres atrybutów poziomu 2."},{"t":"Czy proces jest stale doskonalony","ok":false,"w":"To zakres poziomu 5."},{"t":"Czy proces osiąga swój cel","ok":true,"w":"PA (Process Attribute — atrybut procesu) 1.1 Process performance — Wykonanie procesu — ocenia stopień osiągania przeznaczenia procesu. To wspólny atrybut wymiaru zdolności. Przy jego ocenie wykorzystuje się specyficzne dla procesu rezultaty, praktyki bazowe i produkty pracy."},{"t":"Czy proces działa w granicach ilościowych","ok":false,"w":"To zakres poziomu 4."}],"fz":{"h":"PA 1.1 a pozostałe atrybuty","p":"P1","pulapka":false,"n":"EN: PA 1.1 vs higher attributes","q":"Co ocenia PA 1.1, a co pozostałe atrybuty?","a":"PA 1.1 Process performance — Wykonanie procesu — jest wspólnym atrybutem wymiaru zdolności i mierzy osiąganie przeznaczenia. Specyficzne rezultaty, praktyki bazowe i produkty pracy dostarczają wskaźników i dowodów. Pozostałe atrybuty oceniają zarządzanie, ustanowienie, przewidywalność i doskonalenie procesu.","ex":"PA 1.1 pyta: czy obiad wychodzi? Pozostałe osiem pyta, jak porządnie kuchnia działa: czy planuje, ma receptury, mierzy i się ulepsza.","org":""}},"fz-D-085":{"id":"fz-D-085","typ":"egzamin","s":"PC-01-02","t":"Jak słownik COBIT 5 definiuje zdolność procesu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 93","PeopleCert Syllabus — PC-01-02"],"r":null,"zap":"","scen":"","o":[{"t":"Jako mierzalną cechę odnoszącą się do każdego procesu","ok":false,"w":"To definicja atrybutu procesu."},{"t":"Jako cechę mówiącą, na ile proces potrafi osiągać obecne lub planowane cele biznesowe","ok":true,"w":"Process capability — Zdolność procesu — opisuje zdolność do osiągania aktualnych lub planowanych celów biznesowych przez wykonywanie procesu. Process attribute — Atrybut procesu — jest mierzalną cechą tej zdolności odnoszącą się do każdego procesu."},{"t":"Jako liczbę praktyk bazowych procesu","ok":false,"w":"Tego słownik nie podaje."},{"t":"Jako dokumenty powstające przy wykonywaniu procesu","ok":false,"w":"To produkty pracy."}],"fz":{"h":"Atrybut procesu i zdolność procesu (słownik)","p":"P2","pulapka":false,"n":"EN: Process attribute; process capability","q":"Jak słownik COBIT 5 definiuje atrybut procesu i zdolność procesu?","a":"Atrybut procesu: mierzalna cecha zdolności procesu, odnosząca się do każdego procesu (ISO/IEC 15504). Zdolność procesu (podr. potencjał): cecha mówiąca, na ile proces potrafi osiągać obecne lub planowane cele biznesowe.","ex":"Zdolność procesu wydawania posiłków dotyczy jego możliwości realizowania aktualnych i planowanych celów biznesowych. Ocenia się proces jako całość. Umiejętność pojedynczego kucharza należy do aktywatora Ludzie, Umiejętności i Kompetencje.","org":""}},"q-pc-gap-01":{"id":"q-pc-gap-01","typ":"egzamin","s":"EN-02-13","t":"Za co według Rysunku 33 odpowiada dyrektor ds. finansowych (CFO)?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 76","FW-PL s. 77"],"r":null,"zap":"CFO = finanse: pieniądze, ryzyko finansowe, kontrola i rzetelna księgowość.","scen":"","o":[{"t":"Za funkcjonowanie przedsiębiorstwa","ok":false,"w":"To opis dyrektora ds. operacyjnych (COO) (FW-PL s. 76)."},{"t":"Za wszystkie aspekty zarządzania finansami, w tym ryzyko finansowe, mechanizmy kontrolne i wiarygodną rachunkowość","ok":true,"w":"Tak opisuje CFO Rysunek 33: zarządzanie finansami razem z ryzykiem finansowym, mechanizmami kontrolnymi oraz wiarygodną i dokładną rachunkowością (FW-PL s. 76)."},{"t":"Za wszystkie aspekty zarządzania ryzykiem w całym przedsiębiorstwie","ok":false,"w":"To opis dyrektora ds. ryzyka (CRO). CFO odpowiada tylko za ryzyko finansowe (FW-PL s. 76)."},{"t":"Za planowanie i polityki zarządzania zasobami ludzkimi","ok":false,"w":"To opis dyrektora ds. zarządzania zasobami ludzkimi (FW-PL s. 76)."}],"przyklad":"W domu CFO to osoba, która prowadzi budżet, pilnuje, żeby nie zabrakło na rachunki, i trzyma paragony w porządku. HACZYK: CRO odpowiada za każde ryzyko, CFO tylko za ryzyko finansowe."},"q-pc-gap-02":{"id":"q-pc-gap-02","typ":"egzamin","s":"EN-02-13","t":"Który opis z Rysunku 33 dotyczy dyrektora ds. operacyjnych (COO)?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 76","FW-PL s. 77"],"r":null,"zap":"COO = funkcjonowanie całego przedsiębiorstwa. Dyrektor ds. operacji IT = tylko środowiska operacyjne i infrastruktura IT.","scen":"","o":[{"t":"Najwyższy rangą dyrektor odpowiedzialny za pełne zarządzanie przedsiębiorstwem","ok":false,"w":"To opis dyrektora generalnego (CEO) (FW-PL s. 76)."},{"t":"Członek wyższej kadry kierowniczej odpowiedzialny za środowiska operacyjne i infrastrukturę IT","ok":false,"w":"To dyrektor ds. operacji IT. Słowo „operacyjny” łatwo pomylić, ale COO odpowiada za całe przedsiębiorstwo, nie tylko za IT (FW-PL s. 76)."},{"t":"Przedstawiciel kierownictwa odpowiedzialny za działalność jednej jednostki biznesowej lub spółki zależnej","ok":false,"w":"To członek naczelnego kierownictwa (ang. Business Executive) (FW-PL s. 76)."},{"t":"Menedżer najwyższego szczebla odpowiedzialny za funkcjonowanie przedsiębiorstwa","ok":true,"w":"Tak opisuje COO Rysunek 33 (FW-PL s. 76)."}],"przyklad":"W szpitalu COO pilnuje, żeby cały szpital działał na co dzień: izby przyjęć, kuchnia, transport. Szef serwerowni dba tylko o sprzęt IT. HACZYK: „operacyjny” ma i COO, i dyrektor ds. operacji IT; rozstrzyga zakres – całe przedsiębiorstwo czy samo IT."},"q-pc-gap-03":{"id":"q-pc-gap-03","typ":"egzamin","s":"EN-02-13","t":"Kto według Rysunku 33 odpowiada na najwyższym szczeblu za bezpieczeństwo informacji przedsiębiorstwa we wszystkich formach?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 76","FW-PL s. 77"],"r":null,"zap":"CISO = najwyższy szczebel, bezpieczeństwo informacji we wszystkich formach (także papier i rozmowy, nie tylko IT).","scen":"","o":[{"t":"Kierownik ds. bezpieczeństwa informacji","ok":false,"w":"Kierownik projektuje, nadzoruje i ocenia bezpieczeństwo informacji oraz nim zarządza, ale nie jest rolą najwyższego szczebla (FW-PL s. 77)."},{"t":"Dyrektor ds. bezpieczeństwa informacji (CISO)","ok":true,"w":"CISO to dyrektor najwyższego szczebla odpowiedzialny za bezpieczeństwo informacji przedsiębiorstwa we wszystkich formach (FW-PL s. 76)."},{"t":"Dyrektor ds. informatyki (CIO)","ok":false,"w":"CIO dopasowuje strategię IT do biznesowej i zarządza usługami i rozwiązaniami IT; bezpieczeństwo informacji to osobna rola (FW-PL s. 76)."},{"t":"Dyrektor ds. prywatności","ok":false,"w":"Dyrektor ds. prywatności zajmuje się ryzykiem i przepisami o ochronie prywatności, a nie całym bezpieczeństwem informacji (FW-PL s. 77)."}],"przyklad":"W urzędzie CISO odpowiada za to, żeby żadna ważna informacja nie wyciekła: z komputera, z szafy z aktami ani z rozmowy na korytarzu. HACZYK: „we wszystkich formach” i „najwyższy szczebel” wskazują CISO, a nie kierownika ds. bezpieczeństwa."},"q-pc-gap-04":{"id":"q-pc-gap-04","typ":"egzamin","s":"EN-02-13","t":"Osoba projektuje, nadzoruje i ocenia bezpieczeństwo informacji w przedsiębiorstwie oraz nim zarządza, ale nie jest członkiem najwyższego kierownictwa. Którą rolę z Rysunku 33 pełni?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 76","FW-PL s. 77"],"r":null,"zap":"Kierownik ds. bezpieczeństwa informacji = projektuje, nadzoruje, ocenia, zarządza. CISO = ten sam temat na najwyższym szczeblu.","scen":"","o":[{"t":"Kierownik ds. ciągłości działalności biznesowej","ok":false,"w":"Ten kierownik dba o to, by funkcje krytyczne działały po zdarzeniach powodujących zakłócenia, a nie o bezpieczeństwo informacji (FW-PL s. 77)."},{"t":"Audyt","ok":false,"w":"Audyt to funkcja przeprowadzająca audyty wewnętrzne; nie projektuje zabezpieczeń (FW-PL s. 76)."},{"t":"Kierownik ds. bezpieczeństwa informacji","ok":true,"w":"Tak opisuje tę rolę Rysunek 33: projektowanie, nadzorowanie i/lub ocena bezpieczeństwa informacji oraz zarządzanie nim (FW-PL s. 77)."},{"t":"Dyrektor ds. bezpieczeństwa informacji (CISO)","ok":false,"w":"CISO to rola najwyższego szczebla; w pytaniu chodzi o osobę spoza najwyższego kierownictwa (FW-PL s. 76)."}],"przyklad":"CISO to komendant odpowiedzialny za bezpieczeństwo całej jednostki, a kierownik ds. bezpieczeństwa to oficer, który na co dzień układa zabezpieczenia i sprawdza, czy działają. HACZYK: słowa „projektuje, nadzoruje, ocenia” wskazują kierownika."},"q-pc-gap-05":{"id":"q-pc-gap-05","typ":"egzamin","s":"EN-02-13","t":"Która funkcja z Rysunku 33 przeprowadza audyty wewnętrzne?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 76","FW-PL s. 77"],"r":null,"zap":"Audyt = przeprowadza audyty wewnętrzne. Zgodność = wytyczne co do przepisów, regulacji i umów.","scen":"","o":[{"t":"Zgodność","ok":false,"w":"Zgodność daje wytyczne dotyczące zgodności z wymogami prawnymi, regulacyjnymi i wynikającymi z umów, ale nie przeprowadza audytów (FW-PL s. 76)."},{"t":"Komitet ds. zarządzania ryzykiem w przedsiębiorstwie","ok":false,"w":"Ten komitet uzgadnia wspólne stanowisko kierownictwa w sprawie ryzyka przedsiębiorstwa (ERM), nie prowadzi audytów (FW-PL s. 76)."},{"t":"Biuro zarządzania wartością (VMO)","ok":false,"w":"VMO jest sekretariatem portfela inwestycji i usług (FW-PL s. 77)."},{"t":"Audyt","ok":true,"w":"Rysunek 33 opisuje Audyt jako funkcję odpowiedzialną za przeprowadzanie audytów wewnętrznych (FW-PL s. 76)."}],"przyklad":"Zgodność mówi, jakich przepisów trzeba przestrzegać, a Audyt przychodzi potem i sprawdza, czy naprawdę się ich przestrzega. HACZYK: kto „przeprowadza audyty wewnętrzne” – tylko Audyt."},"q-pc-gap-06":{"id":"q-pc-gap-06","typ":"egzamin","s":"EN-02-13","t":"Czym według Rysunku 33 różni się dyrektor ds. architektury od Rady ds. Architektury?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 76","FW-PL s. 77"],"r":null,"zap":"Dyrektor ds. architektury = proces (osoba). Rada ds. Architektury = wytyczne, polityki, standardy (grupa).","scen":"","o":[{"t":"Dyrektor odpowiada za proces architektury korporacyjnej, a Rada daje wytyczne w sprawach architektury i opracowuje jej polityki i standardy","ok":true,"w":"Tak rozdziela je Rysunek 33: dyrektor to członek wyższej kadry odpowiedzialny za proces, a Rada to grupa interesariuszy i ekspertów od wytycznych, polityk i standardów (FW-PL s. 76)."},{"t":"Rada odpowiada za proces architektury korporacyjnej, a dyrektor opracowuje polityki i standardy","ok":false,"w":"Role są zamienione: proces należy do dyrektora, polityki i standardy do Rady (FW-PL s. 76)."},{"t":"To dwie nazwy tej samej roli","ok":false,"w":"Rysunek 33 wymienia je osobno: jedna to osoba, druga to grupa interesariuszy i ekspertów (FW-PL s. 76)."},{"t":"Dyrektor odpowiada za infrastrukturę IT, a Rada za rozwój rozwiązań IT","ok":false,"w":"Infrastruktura IT to dyrektor ds. operacji IT, a rozwój rozwiązań IT to dyrektor ds. rozwoju (FW-PL s. 76)."}],"przyklad":"Przy budowie osiedla główny architekt prowadzi projekt, a komisja urbanistyczna ustala zasady, których muszą trzymać się wszystkie budynki. HACZYK: osoba prowadzi proces, grupa ustala reguły."},"q-pc-gap-07":{"id":"q-pc-gap-07","typ":"egzamin","s":"EN-02-13","t":"Który członek wyższej kadry kierowniczej z Rysunku 33 odpowiada za środowiska operacyjne oraz infrastrukturę IT?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 76","FW-PL s. 77"],"r":null,"zap":"Trzech dyrektorów IT: rozwoju (nowe rozwiązania), operacji IT (środowiska i infrastruktura), administracji IT (zapisy i administracja).","scen":"","o":[{"t":"Dyrektor ds. operacyjnych (COO)","ok":false,"w":"COO odpowiada za funkcjonowanie całego przedsiębiorstwa, a nie za infrastrukturę IT (FW-PL s. 76)."},{"t":"Dyrektor ds. rozwoju","ok":false,"w":"Dyrektor ds. rozwoju odpowiada za procesy rozwoju rozwiązań IT (FW-PL s. 76)."},{"t":"Dyrektor ds. operacji IT","ok":true,"w":"Tak opisuje go Rysunek 33: środowiska operacyjne oraz infrastruktura IT (FW-PL s. 76)."},{"t":"Dyrektor ds. administracji IT","ok":false,"w":"Dyrektor ds. administracji IT odpowiada za zapisy i kwestie administracyjne związane z IT (FW-PL s. 77)."}],"przyklad":"W firmie przewozowej jeden szef projektuje nowe trasy (rozwój), drugi pilnuje, by autobusy jeździły i były sprawne (operacje), trzeci prowadzi dokumentację i rozliczenia floty (administracja). HACZYK: infrastruktura i środowiska operacyjne to operacje IT."},"q-pc-gap-08":{"id":"q-pc-gap-08","typ":"egzamin","s":"EN-02-13","t":"Osoba zarządza rozwojem, wdrożeniem i oceną nowych i istniejących produktów i usług dla określonego klienta lub grupy klientów. Którą rolę z Rysunku 33 pełni?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 76","FW-PL s. 77"],"r":null,"zap":"Kierownik ds. usług = produkty i usługi dla konkretnej grupy klientów (użytkowników).","scen":"","o":[{"t":"Właściciel procesu biznesowego","ok":false,"w":"Właściciel procesu odpowiada za sprawność procesu, jego doskonalenie i zatwierdzanie zmian w procesie, a nie za usługi dla grupy klientów (FW-PL s. 76)."},{"t":"Kierownik ds. usług","ok":true,"w":"Tak opisuje tę rolę Rysunek 33: rozwój, wdrożenie, ocena i zarządzanie produktami i usługami dla określonego klienta lub grupy klientów (FW-PL s. 77)."},{"t":"Biuro zarządzania projektami i programami (PMO)","ok":false,"w":"PMO wspiera kierowników programów i projektów oraz raportuje o ich realizacji (FW-PL s. 77)."},{"t":"Członek naczelnego kierownictwa","ok":false,"w":"Członek naczelnego kierownictwa odpowiada za działalność całej jednostki biznesowej lub spółki zależnej (FW-PL s. 76)."}],"przyklad":"W banku kierownik ds. usług odpowiada za konto dla studentów: projektuje je, wprowadza, sprawdza, czy się sprawdza, i nim zarządza. HACZYK: „dla określonego klienta lub grupy klientów” wskazuje kierownika ds. usług."},"q-pc-gap-09":{"id":"q-pc-gap-09","typ":"egzamin","s":"IM-02-01","t":"Który z poniższych należy do czynników środowiska wewnętrznego i zewnętrznego, które przedsiębiorstwo uwzględnia, projektując plan wdrożenia?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 35","FW-PL s. 36"],"r":null,"zap":"10 czynników kontekstu: etyka i kultura; przepisy, regulacje i polityki; misja, wizja i wartości; polityki i praktyki nadzoru; plan biznesowy i kierunki strategiczne; model operacyjny i dojrzałość; styl zarządzania; apetyt na ryzyko; potencjał i zasoby; praktyki w branży.","scen":"","o":[{"t":"Praktyki stosowane w branży","ok":true,"w":"Praktyki stosowane w branży są na liście dziesięciu czynników kontekstu przedsiębiorstwa w rozdziale 7 (FW-PL s. 35)."},{"t":"Istotne incydenty związane z ryzykiem IT, np. utrata danych","ok":false,"w":"To przykład punktu zapalnego, czyli problemu, który skłania do działania, a nie czynnika kontekstu (FW-PL s. 36)."},{"t":"Skupienie się na szybkich korzyściach","ok":false,"w":"To jeden z kluczowych czynników sukcesu wdrożenia, a nie czynnik kontekstu przedsiębiorstwa (FW-PL s. 36)."},{"t":"Problemy z realizacją usług w ramach outsourcingu","ok":false,"w":"To przykład punktu zapalnego (FW-PL s. 36)."}],"przyklad":"Plan remontu zależy od tego, jaki masz dom, budżet, gust i jakie są normy budowlane – to kontekst. Cieknący dach to punkt zapalny, a dobry kierownik budowy to czynnik sukcesu. HACZYK: kontekst opisuje, jakie jest przedsiębiorstwo, a punkt zapalny – co boli."},"q-pc-gap-10":{"id":"q-pc-gap-10","typ":"egzamin","s":"IM-02-01","t":"Który zestaw zawiera wyłącznie czynniki kontekstu przedsiębiorstwa z rozdziału 7 (środowisko wewnętrzne i zewnętrzne)?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 35","FW-PL s. 36"],"r":null,"zap":"Nie mieszaj trzech list z rozdziału 7: czynniki kontekstu (jakie jest przedsiębiorstwo), kluczowe czynniki sukcesu (co pomaga wdrożeniu) oraz punkty zapalne i zdarzenia inicjujące (co skłania do działania).","scen":"","o":[{"t":"Misja, wizja i wartości; fuzja z inną firmą; styl zarządzania","ok":false,"w":"Fuzja to zdarzenie inicjujące, a nie czynnik kontekstu (FW-PL s. 37)."},{"t":"Apetyt na ryzyko; niespełnienie wymagań regulacyjnych; etyka i kultura","ok":false,"w":"Niespełnienie wymagań regulacyjnych to punkt zapalny. Czynnikiem kontekstu są same obowiązujące przepisy i regulacje (FW-PL s. 35–36)."},{"t":"Misja, wizja i wartości; polityki i praktyki w zakresie nadzoru; plan biznesowy i strategiczne kierunki działania","ok":true,"w":"Wszystkie trzy są na liście czynników środowiska wewnętrznego i zewnętrznego, które trzeba uwzględnić w planie wdrożenia (FW-PL s. 35)."},{"t":"Etyka i kultura; widoczne zaangażowanie kierownictwa najwyższego szczebla; model operacyjny","ok":false,"w":"Zaangażowanie kierownictwa najwyższego szczebla to kluczowy czynnik sukcesu wdrożenia, a nie czynnik kontekstu (FW-PL s. 35)."}],"przyklad":"Przed przeprowadzką spisujesz: ile osób mieszka, jaki masz budżet, jakie macie zwyczaje – to kontekst. Zalanie mieszkania to punkt zapalny, nowa praca w innym mieście to zdarzenie inicjujące. HACZYK: w każdej błędnej odpowiedzi jest jeden element z innej listy."},"q-pc-gap-11":{"id":"q-pc-gap-11","typ":"egzamin","s":"EN-02-04","t":"Polityka haseł została zmieniona, ale pracownicy o tym nie wiedzą i nadal stosują starą wersję. Na którym aspekcie cyklu życia polityk COBIT 5 zawiodła organizacja?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 68"],"r":null,"zap":"Cykl życia polityk: aktualizacja, informowanie o zmianach, łatwy dostęp do najnowszej wersji, archiwizacja i pozbywanie się starych.","scen":"","o":[{"t":"Na mechanizmach zwiększających świadomość aktualizacji i zapewniających łatwy dostęp do najnowszej wersji","ok":true,"w":"Podręcznik wskazuje aktualność polityk jako kluczowy aspekt: czy wdrożono mechanizmy zwiększające świadomość aktualizacji, łatwy dostęp do najnowszej wersji oraz archiwizację i pozbywanie się nieaktualnych wersji (FW-PL s. 68)."},{"t":"Na opisaniu konsekwencji nieprzestrzegania polityki","ok":false,"w":"Konsekwencje nieprzestrzegania to element struktury polityk, a problemem jest tu nieznajomość nowej wersji (FW-PL s. 68)."},{"t":"Na dopasowaniu polityki do apetytu na ryzyko","ok":false,"w":"Dopasowanie do apetytu na ryzyko dotyczy treści polityki, a nie tego, czy pracownicy znają jej aktualną wersję (FW-PL s. 68)."},{"t":"Na nieinwazyjności polityki","ok":false,"w":"Nieinwazyjność to cecha dobrej polityki: ma być logiczna i nie budzić oporu. Nie rozwiązuje problemu nieznanej aktualizacji (FW-PL s. 67)."}],"przyklad":"Szkoła zmieniła plan lekcji, ale wywiesiła go w szufladzie dyrektora – uczniowie przyszli według starego. HACZYK: nowa wersja musi dotrzeć do ludzi, a stara – zniknąć z obiegu."},"q-pc-gap-12":{"id":"q-pc-gap-12","typ":"egzamin","s":"EN-02-09","t":"Proces obsługi zgłoszeń działa od roku. Kierownik sprawdza mierniki i stwierdza, że część kroków jest zbędna, więc je zmienia. Które etapy cyklu życia procesu tu zaszły?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 70"],"r":null,"zap":"Cykl życia procesu: definiowanie → tworzenie → obsługa → monitorowanie → dostosowanie/aktualizacja lub wycofanie.","scen":"","o":[{"t":"Definiowanie i tworzenie","ok":false,"w":"Definiowanie i tworzenie to początek cyklu życia; proces działa już od roku (FW-PL s. 70)."},{"t":"Obsługa i wycofanie","ok":false,"w":"Procesu nie wycofano, tylko go zmieniono (FW-PL s. 70)."},{"t":"Monitorowanie, a potem dostosowanie/aktualizacja","ok":true,"w":"Sprawdzanie mierników to monitorowanie, a zmiana zbędnych kroków to dostosowanie/aktualizacja. Pełny cykl: definiowanie, tworzenie, obsługa, monitorowanie oraz dostosowanie/aktualizacja lub wycofanie (FW-PL s. 70)."},{"t":"Tworzenie i ponowne definiowanie od zera","ok":false,"w":"Proces poprawiono, a nie zbudowano od nowa (FW-PL s. 70)."}],"przyklad":"Rodzina ustala grafik sprzątania (definiowanie), wiesza go na lodówce (tworzenie), sprząta według niego (obsługa), po miesiącu patrzy, co nie działa (monitorowanie), i go poprawia (dostosowanie). HACZYK: sprawdzanie = monitorowanie, poprawianie = dostosowanie."},"q-pc-gap-13":{"id":"q-pc-gap-13","typ":"egzamin","s":"EN-02-19","t":"Zespół bezpieczeństwa analizuje, gdzie fizycznie przechowuje się informacje, jakie są kanały dostępu do nich i jak długo trzeba je przechowywać, korzystając z atrybutów modelu informacji. Które to zastosowanie modelu informacji?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 84","FW-PL s. 85"],"r":null,"zap":"Trzy zastosowania modelu informacji z przykładów: specyfikacja (nowa aplikacja), wymagana ochrona (zespół bezpieczeństwa), łatwość korzystania z danych (przegląd procesu).","scen":"","o":[{"t":"Określenie specyfikacji informacji","ok":false,"w":"Specyfikację określa się przy projektowaniu nowej aplikacji (Przykład 13) (FW-PL s. 84)."},{"t":"Określenie łatwości korzystania z danych","ok":false,"w":"Łatwość korzystania sprawdza się przy przeglądzie informacji w procesie biznesowym lub aplikacji (Przykład 15) (FW-PL s. 85)."},{"t":"Opracowanie przypadków testowych","ok":false,"w":"Przypadki testowe to dodatkowe zastosowanie wspomniane przy specyfikacji (Przykład 13), a nie analiza zespołu bezpieczeństwa (FW-PL s. 84)."},{"t":"Określenie wymaganej ochrony informacji","ok":true,"w":"Przykład 14: zespoły bezpieczeństwa analizują warstwę fizyczną, empiryczną, semantyczną i pragmatyczną, by określić poziom ochrony i wymagane zabezpieczenia (FW-PL s. 84–85)."}],"przyklad":"Przed schowaniem dokumentów pytasz: w której szafie leżą, kto ma do niej klucz i jak długo trzeba je trzymać. Na tej podstawie dobierasz zamek. HACZYK: pytania „gdzie, kto ma dostęp, jak długo” prowadzą do ochrony informacji."},"q-pc-gap-14":{"id":"q-pc-gap-14","typ":"egzamin","s":"PR-02-10","t":"Co na Ilustracji 10 (jedna zintegrowana metodyka COBIT 5) pełni rolę filtra zawartości dla bazy wiedzy COBIT 5?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 25"],"r":null,"zap":"Ilustracja 10: źródła (wytyczne ISACA, nowe materiały, inne standardy) → baza wiedzy → filtr: czynniki umożliwiające → rodzina produktów COBIT 5.","scen":"","o":[{"t":"Rodzina produktów COBIT 5","ok":false,"w":"Rodzina produktów to wynik: przewodniki zbudowane na bazie wiedzy, a nie filtr (FW-PL s. 25)."},{"t":"Czynniki umożliwiające COBIT 5","ok":true,"w":"Na Ilustracji 10 czynniki umożliwiające są filtrem zawartości dla bazy wiedzy; porządkują istniejące i przyszłe treści (FW-PL s. 25)."},{"t":"Inne standardy i metodyki","ok":false,"w":"Inne standardy i metodyki to jedno ze źródeł wiedzy, które COBIT 5 integruje (FW-PL s. 25)."},{"t":"Pięć zasad COBIT 5","ok":false,"w":"Zasady nie są przedstawione na Ilustracji 10 jako filtr zawartości (FW-PL s. 25)."}],"przyklad":"Biblioteka zbiera książki z wielu wydawnictw (źródła), układa je w magazynie (baza wiedzy) i porządkuje według działów (filtr), a czytelnik dostaje gotowe zestawienia (produkty). HACZYK: filtrem są czynniki umożliwiające."},"q-pc-gap-15":{"id":"q-pc-gap-15","typ":"egzamin","s":"PR-02-10","t":"Wiedzę z których wcześniejszych metodyk ISACA połączono w COBIT 5?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 25"],"r":null,"zap":"Metodyki ISACA w COBIT 5: COBIT, Val IT (wartość), Risk IT (ryzyko), BMIS (bezpieczeństwo), Board Briefing on IT Governance, ITAF (audyt).","scen":"","o":[{"t":"ITIL, TOGAF i PRINCE2","ok":false,"w":"To zewnętrzne standardy i metodyki innych organizacji. COBIT 5 może je integrować, ale nie są metodykami ISACA (FW-PL s. 25)."},{"t":"ISO/IEC 15504, ISO/IEC 38500 i ISO 31000","ok":false,"w":"To normy ISO, a nie metodyki ISACA (FW-PL s. 25)."},{"t":"COBIT, Val IT, Risk IT, BMIS, Board Briefing on IT Governance i ITAF","ok":true,"w":"Podręcznik wymienia te metodyki ISACA jako wiedzę, którą COBIT 5 łączy w jednej strukturze (FW-PL s. 25)."},{"t":"Wyłącznie COBIT 4.1 bez żadnych innych publikacji","ok":false,"w":"COBIT 5 łączy całą wiedzę rozproszoną w różnych metodykach ISACA, nie tylko COBIT 4.1 (FW-PL s. 25)."}],"przyklad":"Jak jeden segregator, do którego wkładasz dawne zeszyty z różnych przedmiotów tej samej szkoły: notatki z wartości, ryzyka, bezpieczeństwa i audytu. HACZYK: ITIL, TOGAF i PRINCE2 to „obce szkoły” – COBIT 5 się z nimi łączy, ale ich nie wchłania."},"q-pc-gap-16":{"id":"q-pc-gap-16","typ":"egzamin","s":"EN-02-13","t":"Za co według Rysunku 33 odpowiada Zgodność?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 76","FW-PL s. 77"],"r":null,"zap":"Zgodność = wytyczne co do prawa, regulacji i umów. Audyt = audyty wewnętrzne. Prywatność = osobny dyrektor.","scen":"","o":[{"t":"Za przeprowadzanie audytów wewnętrznych","ok":false,"w":"To funkcja Audyt (FW-PL s. 76)."},{"t":"Za wytyczne dotyczące zgodności z wymogami prawnymi, regulacyjnymi i wynikającymi z umów","ok":true,"w":"Tak opisuje funkcję Zgodność Rysunek 33 (FW-PL s. 76)."},{"t":"Za monitorowanie ryzyka i wpływu przepisów o ochronie prywatności","ok":false,"w":"To dyrektor ds. prywatności (FW-PL s. 77)."},{"t":"Za zgodność IT ze strategią biznesową","ok":false,"w":"Dopasowanie strategii IT do strategii biznesowej to zadanie CIO (FW-PL s. 76)."}],"przyklad":"W klubie sportowym jedna osoba pilnuje, żeby klub znał przepisy ligi i warunki umów ze sponsorami (Zgodność), a kontroler sprawdza potem, czy ich przestrzegano (Audyt). HACZYK: Zgodność doradza, Audyt sprawdza."},"q-pc-deep-01":{"id":"q-pc-deep-01","typ":"egzamin","s":"EN-02-04","t":"Na które pytania o aktualność polityk COBIT 5 każe zwrócić szczególną uwagę w cyklu życia? Wskaż odpowiedź, która do nich NIE należy.","k":false,"st":"autorskie","src":"","z":["FW-PL s. 68"],"r":null,"zap":"Aktualność polityk = 4 pytania: czy i kiedy aktualizować, jak informować o zmianach, jak dać dostęp do najnowszej wersji, jak archiwizować i usuwać stare.","scen":"","o":[{"t":"Czy i kiedy aktualizuje się polityki?","ok":false,"w":"To pierwsze z pytań o aktualność polityk w cyklu życia (FW-PL s. 68)."},{"t":"Czy pracownicy mają łatwy dostęp do najnowszej wersji polityki?","ok":false,"w":"Łatwy dostęp do najnowszej wersji jest wymieniony wśród kluczowych aspektów aktualności (FW-PL s. 68)."},{"t":"Czy polityka jest nieinwazyjna, czyli nie budzi niepotrzebnego oporu?","ok":true,"w":"Nieinwazyjność to cecha dobrej polityki (obok skuteczności i wydajności), a nie pytanie o jej aktualność w cyklu życia (FW-PL s. 67)."},{"t":"Czy nieaktualne wersje są właściwie archiwizowane i usuwane?","ok":false,"w":"Archiwizacja i pozbywanie się nieaktualnych informacji zamykają listę pytań o aktualność (FW-PL s. 68)."}],"przyklad":"Rozkład jazdy autobusów: trzeba go zmienić, gdy zmienia się trasa, ogłosić zmianę, wywiesić nowy na przystanku i zdjąć stary. HACZYK: cechy dobrej polityki (skuteczna, wydajna, nieinwazyjna) to inna lista niż pytania o aktualność."},"q-pc-deep-02":{"id":"q-pc-deep-02","typ":"egzamin","s":"EN-02-04","t":"Bank działa w silnie regulowanym sektorze, a mała fundacja – w słabo regulowanym. Co według COBIT 5 wynika z tej różnicy dla polityk?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 68"],"r":null,"zap":"Im silniejsze wymogi regulacyjne wobec kontroli wewnętrznej, tym solidniejsza musi być struktura polityk.","scen":"","o":[{"t":"Fundacja nie potrzebuje polityk, bo nie ma nad sobą regulatora","ok":false,"w":"Każde przedsiębiorstwo komunikuje swoje reguły przez zasady i polityki; różnica dotyczy siły struktury, a nie samej potrzeby polityk (FW-PL s. 67–68)."},{"t":"Obie organizacje muszą mieć identyczny zestaw polityk, bo COBIT 5 tego wymaga","ok":false,"w":"COBIT 5 nie narzuca jednego zestawu polityk; ich struktura zależy od otoczenia przedsiębiorstwa (FW-PL s. 68)."},{"t":"W banku polityki nie mają cyklu życia, bo ich treść ustala regulator","ok":false,"w":"Polityki zawsze mają cykl życia; regulacje wpływają na to, jak silnej kontroli wewnętrznej i struktury polityk się wymaga (FW-PL s. 68)."},{"t":"Bank potrzebuje solidniejszej struktury polityk, bo wymogi regulacyjne wobec kontroli wewnętrznej są u niego silniejsze","ok":true,"w":"Podręcznik wskazuje, że w zależności od środowiska zewnętrznego mogą istnieć różne stopnie wymogów regulacyjnych wobec silnej kontroli wewnętrznej, a co za tym idzie – solidnej struktury polityk (FW-PL s. 68)."}],"przyklad":"Szpital musi mieć spisane procedury na każdą sytuację, bo kontroluje go wiele instytucji; klub szachowy wystarczy, że ma krótki regulamin. HACZYK: otoczenie decyduje o sile struktury polityk, a nie o tym, czy polityki w ogóle są potrzebne."},"q-pc-deep-03":{"id":"q-pc-deep-03","typ":"egzamin","s":"EN-02-04","t":"Polityka bezpieczeństwa obowiązuje od dwóch lat, a komisja co roku sprawdza, czy nadal działa i czy pracownicy jej przestrzegają. Który to etap cyklu życia polityki według Ilustracji 28?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 67","FW-PL s. 68"],"r":null,"zap":"Cykl życia polityki (Ilustracja 28): planowanie → projektowanie → budowanie/tworzenie/wdrażanie → użytkowanie/eksploatacja → ocena/monitorowanie → aktualizacja/pozbywanie się.","scen":"","o":[{"t":"Planowanie","ok":false,"w":"Planowanie jest na początku cyklu, zanim polityka powstanie (FW-PL s. 67)."},{"t":"Ocena/monitorowanie","ok":true,"w":"Sprawdzanie, czy obowiązująca polityka działa i jest przestrzegana, to etap oceny/monitorowania z Ilustracji 28 (FW-PL s. 67)."},{"t":"Budowanie/nabywanie/tworzenie/wdrażanie","ok":false,"w":"Ten etap dotyczy powstania i wprowadzenia polityki, a ta obowiązuje już od dwóch lat (FW-PL s. 67)."},{"t":"Aktualizacja/pozbywanie się","ok":false,"w":"Aktualizacja następuje dopiero, gdy ocena wykaże potrzebę zmian; samo sprawdzanie to jeszcze ocena (FW-PL s. 67–68)."}],"przyklad":"Regulamin domu: najpierw ustalacie, czego potrzeba (planowanie), piszecie go (projektowanie, tworzenie), stosujecie (użytkowanie), co jakiś czas sprawdzacie, czy działa (ocena), a w razie potrzeby zmieniacie (aktualizacja). HACZYK: „sprawdza, czy działa” = ocena/monitorowanie."},"q-pc-deep-04":{"id":"q-pc-deep-04","typ":"egzamin","s":"EN-02-09","t":"Który z poniższych NIE jest etapem cyklu życia procesu w COBIT 5?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 70"],"r":null,"zap":"Cykl życia procesu: definiowanie, tworzenie, obsługa, monitorowanie, dostosowanie/aktualizacja lub wycofanie.","scen":"","o":[{"t":"Obsługa","ok":false,"w":"Proces jest obsługiwany – to jeden z etapów cyklu życia (FW-PL s. 70)."},{"t":"Monitorowanie","ok":false,"w":"Proces jest monitorowany – to jeden z etapów cyklu życia (FW-PL s. 70)."},{"t":"Certyfikacja przez zewnętrzny organ","ok":true,"w":"Podręcznik wymienia: definiowanie, tworzenie, obsługę, monitorowanie oraz dostosowanie/aktualizację lub wycofanie. Certyfikacji wśród nich nie ma (FW-PL s. 70)."},{"t":"Wycofanie","ok":false,"w":"Proces może zostać wycofany – to ostatni możliwy etap cyklu życia (FW-PL s. 70)."}],"przyklad":"Proces jak lokalna linia autobusowa: wytycza się ją, uruchamia, kursuje, liczy się pasażerów, a potem zmienia trasę albo linię likwiduje. Nikt jej nie „certyfikuje”. HACZYK: COBIT 5 nie wymaga certyfikacji procesów."},"q-pc-deep-05":{"id":"q-pc-deep-05","typ":"egzamin","s":"EN-02-09","t":"Urząd wprowadził elektroniczny obieg wniosków i dawny proces ręcznego rejestrowania pism przestał być potrzebny. Który etap cyklu życia procesu teraz następuje?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 70"],"r":null,"zap":"Koniec cyklu życia procesu ma dwie drogi: dostosowanie/aktualizacja (proces zostaje, ale się zmienia) albo wycofanie (proces znika).","scen":"","o":[{"t":"Wycofanie","ok":true,"w":"Gdy proces przestaje być potrzebny, cykl życia kończy się jego wycofaniem (FW-PL s. 70)."},{"t":"Obsługa","ok":false,"w":"Obsługa oznacza bieżące działanie procesu, a ten proces nie jest już potrzebny (FW-PL s. 70)."},{"t":"Definiowanie","ok":false,"w":"Definiowanie to początek cyklu życia nowego procesu (FW-PL s. 70)."},{"t":"Monitorowanie","ok":false,"w":"Monitorowanie sprawdza działający proces; tu decyzja już zapadła – proces jest zbędny (FW-PL s. 70)."}],"przyklad":"Gdy w bloku zamontowano domofon, przestaje być potrzebny dyżur portiera przy drzwiach – ten „proces” się wycofuje. HACZYK: zmiana procesu = aktualizacja, likwidacja procesu = wycofanie."},"q-pc-deep-06":{"id":"q-pc-deep-06","typ":"egzamin","s":"EN-02-09","t":"Co według podręcznika może ułatwić definiowanie, realizację, monitorowanie i optymalizację procesów w ich cyklu życia?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 70"],"r":null,"zap":"Cykl życia procesu wspierają typowe praktyki z modelu oceny procesu (ISO/IEC 15504) – te same, które ocenia się na poziomach zdolności 2–5.","scen":"","o":[{"t":"Tabele mapowania kaskady celów","ok":false,"w":"Kaskada celów pomaga wybrać ważne procesy, ale podręcznik w tym miejscu wskazuje typowe praktyki z modelu oceny procesu (FW-PL s. 70)."},{"t":"Model informacji","ok":false,"w":"Model informacji opisuje informacje, a nie cykl życia procesów (FW-PL s. 70)."},{"t":"Pryncypia architektury","ok":false,"w":"Pryncypia architektury dotyczą czynnika Usługi, infrastruktura i aplikacje (FW-PL s. 70)."},{"t":"Typowe praktyki procesów, np. z modelu oceny procesu opartego na normie ISO/IEC 15504","ok":true,"w":"Podręcznik wskazuje, że typowe praktyki procesów zdefiniowane w modelu oceny procesu (ISO/IEC 15504) mogą ułatwić definiowanie, realizację, monitorowanie i optymalizację procesów (FW-PL s. 70)."}],"przyklad":"Kuchnia doskonali swoje przepisy według listy kontrolnej inspektora sanepidu: co ma być zaplanowane, spisane, mierzone i poprawiane. HACZYK: model oceny procesu nie tylko ocenia, ale też podpowiada, jak proces ulepszać."},"q-pc-deep-07":{"id":"q-pc-deep-07","typ":"egzamin","s":"EN-02-19","t":"Projektując nowy system, zespół pyta: „Jaka będzie struktura informacji i jakie strony kodowe zostaną użyte?”. Której warstwy modelu informacji dotyczy to pytanie?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 84"],"r":null,"zap":"Specyfikacja (Przykład 13): fizyczna – gdzie przechowywać; empiryczna – jak uzyskać dostęp; syntaktyczna – struktura i strony kodowe; semantyczna – rodzaj i szczegółowość; pragmatyczna – wymogi przechowywania i przydatność.","scen":"","o":[{"t":"Warstwy fizycznej","ok":false,"w":"Warstwa fizyczna pyta, gdzie informacje będą przechowywane (FW-PL s. 84)."},{"t":"Warstwy syntaktycznej","ok":true,"w":"W Przykładzie 13 warstwa syntaktyczna to pytanie o strukturę informacji i użyte strony kodowe (FW-PL s. 84)."},{"t":"Warstwy empirycznej","ok":false,"w":"Warstwa empiryczna pyta, jak można uzyskać dostęp do informacji (FW-PL s. 84)."},{"t":"Warstwy pragmatycznej","ok":false,"w":"Warstwa pragmatyczna pyta o wymogi przechowywania i inne informacje potrzebne do ich wykorzystania (FW-PL s. 84)."}],"przyklad":"Wysyłasz list: fizyczna – w której skrzynce leży; empiryczna – kto ma do niej klucz; syntaktyczna – w jakim języku i alfabecie jest napisany; semantyczna – o czym jest; pragmatyczna – jak długo trzeba go trzymać. HACZYK: składnia (syntaktyka) = struktura i zapis."},"q-pc-deep-08":{"id":"q-pc-deep-08","typ":"egzamin","s":"EN-02-19","t":"Według Przykładu 14 od którego etapu cyklu życia informacji trzeba zadbać o jej bezpieczeństwo?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 84"],"r":null,"zap":"Ochrona informacji (Przykład 14): we wszystkich fazach cyklu życia, od planowania przez przechowywanie i udostępnianie po pozbywanie się.","scen":"","o":[{"t":"Dopiero od fazy użytkowania, gdy informacja trafia do pracowników","ok":false,"w":"Podręcznik wymaga ochrony we wszystkich fazach cyklu życia, nie dopiero od użytkowania (FW-PL s. 84)."},{"t":"Dopiero w fazie pozbywania się informacji","ok":false,"w":"Pozbywanie się to tylko jedna z faz, w których potrzebne są zabezpieczenia (FW-PL s. 84)."},{"t":"Już w fazie planowania informacji","ok":true,"w":"Przykład 14: informacje wymagają ochrony we wszystkich fazach cyklu życia, a o bezpieczeństwo należy zadbać już w fazie planowania (FW-PL s. 84)."},{"t":"Dopiero gdy informacja staje się historyczna","ok":false,"w":"Status historyczny to tylko jedno z pytań warstwy pragmatycznej; ochrona dotyczy całego cyklu życia (FW-PL s. 84)."}],"przyklad":"Sejf planuje się razem z projektem banku, a nie montuje po pierwszym napadzie. HACZYK: bezpieczeństwo zaczyna się w fazie planowania."},"q-pc-deep-09":{"id":"q-pc-deep-09","typ":"egzamin","s":"EN-02-19","t":"Która analiza modelu informacji pozwala, według Przykładu 13, określić, jaki rodzaj dostępu do danych potrzebują poszczególne osoby w poszczególnych fazach cyklu życia informacji?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 84"],"r":null,"zap":"Kto (interesariusze) + kiedy (cykl życia) = jaki dostęp do danych.","scen":"","o":[{"t":"Analiza dwóch wymiarów: interesariuszy i cyklu życia","ok":true,"w":"Przykład 13: analiza wymiarów interesariuszy i cyklu życia pozwala określić wymagany rodzaj dostępu dla poszczególnych osób i faz cyklu życia (FW-PL s. 84)."},{"t":"Analiza samej warstwy syntaktycznej","ok":false,"w":"Warstwa syntaktyczna opisuje strukturę informacji i strony kodowe, a nie to, kto potrzebuje dostępu (FW-PL s. 84)."},{"t":"Analiza kryteriów prezentacji, np. zrozumiałości","ok":false,"w":"Kryteria prezentacji pojawiają się przy łatwości korzystania z danych (Przykład 15), a nie przy określaniu dostępu (FW-PL s. 84)."},{"t":"Analiza pryncypiów architektury","ok":false,"w":"Pryncypia architektury należą do czynnika Usługi, infrastruktura i aplikacje, a nie do modelu informacji (FW-PL s. 85)."}],"przyklad":"Dokumentacja medyczna: lekarz potrzebuje pełnego wglądu w czasie leczenia, rejestratorka tylko danych do wizyty, a archiwista dopiero po latach. HACZYK: dostęp ustala się z dwóch wymiarów – kto i w której fazie."},"q-pc-deep-10":{"id":"q-pc-deep-10","typ":"egzamin","s":"PR-02-10","t":"Jakie trzy źródła zasilają bazę wiedzy COBIT 5 na Ilustracji 10?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 25"],"r":null,"zap":"Ilustracja 10 czytana od lewej: 3 źródła → baza wiedzy → filtr (czynniki umożliwiające) → rodzina produktów.","scen":"","o":[{"t":"Przewodniki dotyczące czynników umożliwiających, specjalistyczne przewodniki i środowisko sieciowe oparte na współpracy","ok":false,"w":"To rodzina produktów COBIT 5, czyli to, co powstaje z bazy wiedzy, a nie jej źródła (FW-PL s. 25)."},{"t":"Pięć zasad, siedem czynników umożliwiających i 37 procesów","ok":false,"w":"To elementy samego COBIT 5, a nie źródła bazy wiedzy z Ilustracji 10 (FW-PL s. 25)."},{"t":"Obecne wytyczne ISACA, nowe materiały z wytycznymi ISACA oraz inne standardy i metodyki","ok":true,"w":"Tak przedstawia to Ilustracja 10: trzy źródła po lewej stronie zasilają bazę wiedzy COBIT 5 (FW-PL s. 25)."},{"t":"Wyłącznie dotychczasowe wytyczne ISACA","ok":false,"w":"Bazę wiedzy zasilają też nowe materiały ISACA oraz inne standardy i metodyki (FW-PL s. 25)."}],"przyklad":"Rzeka ma trzy dopływy: stare źródła (dawne wytyczne ISACA), nowe źródła (nowe materiały ISACA) i dopływy z sąsiednich dolin (inne standardy). Wszystkie wpadają do jednego jeziora – bazy wiedzy. HACZYK: przewodniki to to, co z jeziora wypływa, a nie dopływy."},"q-pc-deep-11":{"id":"q-pc-deep-11","typ":"egzamin","s":"PR-02-10","t":"Co według Ilustracji 10 zawiera baza wiedzy COBIT 5 oprócz aktualnych wytycznych i treści?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 25"],"r":null,"zap":"Baza wiedzy COBIT 5 = aktualne wytyczne i treści + struktura dla przyszłych treści.","scen":"","o":[{"t":"Gotowe procedury do wdrożenia bez zmian w każdej organizacji","ok":false,"w":"COBIT 5 nie jest normatywny; jego wytyczne trzeba dostosować do organizacji (FW-PL s. 25)."},{"t":"Wyniki ocen zdolności procesów różnych organizacji","ok":false,"w":"Ilustracja 10 nie wymienia wyników ocen jako zawartości bazy wiedzy (FW-PL s. 25)."},{"t":"Certyfikaty zgodności z normami ISO","ok":false,"w":"Baza wiedzy nie zawiera certyfikatów (FW-PL s. 25)."},{"t":"Strukturę dla przyszłych treści","ok":true,"w":"Ilustracja 10: baza wiedzy obejmuje aktualne wytyczne i treści oraz strukturę dla przyszłych treści (FW-PL s. 25)."}],"przyklad":"Biblioteka ma nie tylko książki na półkach, ale też wolne, opisane półki na książki, które dopiero się ukażą. HACZYK: COBIT 5 od początku przewiduje miejsce na nowe treści."},"q-pc-deep-12":{"id":"q-pc-deep-12","typ":"egzamin","s":"PR-02-10","t":"Który element NIE należy do rodziny produktów COBIT 5 na Ilustracji 10?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 11","FW-PL s. 25"],"r":null,"zap":"Rodzina produktów COBIT 5: COBIT 5 (metodyka), przewodniki dotyczące czynników umożliwiających, specjalistyczne przewodniki, środowisko sieciowe oparte na współpracy.","scen":"","o":[{"t":"Przewodniki dotyczące czynników umożliwiających","ok":false,"w":"To część rodziny produktów, np. COBIT 5: Procesy umożliwiające (FW-PL s. 11, 25)."},{"t":"Inne standardy i metodyki","ok":true,"w":"Inne standardy i metodyki są źródłem, które zasila bazę wiedzy, a nie produktem COBIT 5 (FW-PL s. 25)."},{"t":"Specjalistyczne przewodniki dotyczące metodyki COBIT 5","ok":false,"w":"To część rodziny produktów, np. COBIT 5: Wdrożenie czy Bezpieczeństwo informacji (FW-PL s. 11, 25)."},{"t":"Środowisko sieciowe oparte na współpracy","ok":false,"w":"To część rodziny produktów COBIT 5 (FW-PL s. 11, 25)."}],"przyklad":"Piekarnia kupuje mąkę od różnych młynów (źródła), a sprzedaje chleb, bułki i ciasta (produkty). Mąka z młyna nie jest produktem piekarni. HACZYK: inne standardy wchodzą do COBIT 5, ale nie są jego produktem."},"q-pc-std-01":{"id":"q-pc-std-01","typ":"egzamin","s":"PR-02-10","t":"Czego dotyczy ITIL, z którym COBIT 5 się integruje?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 15","FW-PL s. 86"],"r":null,"zap":"ITIL = usługi IT: jak je zaprojektować, uruchomić i codziennie świadczyć (np. obsługa zgłoszeń, incydentów, zmian).","scen":"","o":[{"t":"Zarządzania projektami w kontrolowanym środowisku","ok":false,"w":"To PRINCE2 (PRojects IN Controlled Environments) (FW-PL s. 15)."},{"t":"Architektury korporacyjnej i cyklu jej rozwoju","ok":false,"w":"To TOGAF, z cyklem ADM (FW-PL s. 61)."},{"t":"Zarządzania usługami IT – jak projektować i świadczyć usługi IT","ok":true,"w":"ITIL to biblioteka dobrych praktyk zarządzania usługami IT; podręcznik opisuje ją jako kompleksowe wytyczne dotyczące projektowania i wykonywania usług (FW-PL s. 15, 86)."},{"t":"Bezpieczeństwa informacji","ok":false,"w":"Bezpieczeństwa informacji dotyczy seria ISO/IEC 27000 (FW-PL s. 60)."}],"przyklad":"ITIL to jak podręcznik dobrze prowadzonego serwisu samochodowego: przyjęcie zgłoszenia, naprawa, wydanie auta, obsługa reklamacji. HACZYK: ITIL = usługi, PRINCE2 = projekty."},"q-pc-std-02":{"id":"q-pc-std-02","typ":"egzamin","s":"PR-02-10","t":"Które domeny COBIT 5 obejmują według Załącznika E ITIL V3 2011 i norma ISO/IEC 20000?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 60","FW-PL s. 61"],"r":null,"zap":"ITIL i ISO/IEC 20000 = usługi IT → przede wszystkim DSS (Dostarczaj, Obsługuj i Wspieraj).","scen":"","o":[{"t":"Podzbiór procesów DSS i BAI oraz niektóre procesy APO","ok":true,"w":"Tak wskazuje Załącznik E: ITIL V3 2011 i ISO/IEC 20000 odnoszą się głównie do świadczenia usług (DSS), częściowo do wdrażania (BAI) i do niektórych procesów APO (FW-PL s. 60)."},{"t":"Wyłącznie domenę EDM","ok":false,"w":"Domenie EDM odpowiada norma ISO/IEC 38500 o ładzie IT (FW-PL s. 61)."},{"t":"Procesy zarządzania ryzykiem w EDM i APO","ok":false,"w":"To obszar serii ISO/IEC 31000 (FW-PL s. 60)."},{"t":"Procesy portfela w APO oraz programów i projektów w BAI","ok":false,"w":"To obszar PRINCE2 (FW-PL s. 61)."}],"przyklad":"Usługi IT to codzienne życie: działające systemy, obsługa zgłoszeń i awarii. Dlatego ITIL ląduje głównie w DSS – domenie „codziennego serwisu”. HACZYK: ITIL ↔ DSS."},"q-pc-std-03":{"id":"q-pc-std-03","typ":"egzamin","s":"PR-02-10","t":"Czego dotyczy norma ISO/IEC 20000?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 47","FW-PL s. 60"],"r":null,"zap":"ISO/IEC 20000 = norma (certyfikowalna) dla zarządzania usługami IT; ITIL = biblioteka dobrych praktyk w tym samym obszarze.","scen":"","o":[{"t":"Ładu korporacyjnego w obszarze IT","ok":false,"w":"Tego dotyczy ISO/IEC 38500 (FW-PL s. 47, 57)."},{"t":"Zarządzania ryzykiem","ok":false,"w":"Tego dotyczy seria ISO/IEC 31000 (FW-PL s. 60)."},{"t":"Oceny procesów i ich zdolności","ok":false,"w":"Tego dotyczy ISO/IEC 15504, na której oparto model zdolności procesów COBIT 5 (FW-PL s. 41)."},{"t":"Zarządzania usługami IT","ok":true,"w":"ISO/IEC 20000 to norma zarządzania usługami IT (IT Service Management Standard); w Załączniku E występuje razem z ITIL (FW-PL s. 47, 60)."}],"przyklad":"ITIL to książka kucharska z przepisami serwisu, a ISO/IEC 20000 to egzamin, po którym serwis może dostać certyfikat. HACZYK: 20000 idzie w parze z ITIL."},"q-pc-std-04":{"id":"q-pc-std-04","typ":"egzamin","s":"PR-02-10","t":"Czym jest PRINCE2?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 15","FW-PL s. 61"],"r":null,"zap":"PRINCE2 = projekty (start, etapy, kontrola, zamknięcie). Podobny obszar obejmuje PMBOK.","scen":"","o":[{"t":"Biblioteką dobrych praktyk zarządzania usługami IT","ok":false,"w":"To ITIL (FW-PL s. 15)."},{"t":"Metodyką zarządzania projektami (PRojects IN Controlled Environments)","ok":true,"w":"PRINCE2 to metodyka zarządzania projektami w kontrolowanym środowisku; w COBIT 5 odnosi się do portfela (APO) oraz programów i projektów (BAI) (FW-PL s. 15, 61)."},{"t":"Normą zarządzania bezpieczeństwem informacji","ok":false,"w":"To seria ISO/IEC 27000 (FW-PL s. 60)."},{"t":"Modelem oceny zdolności procesów","ok":false,"w":"Ocena zdolności procesów opiera się na ISO/IEC 15504 (FW-PL s. 41)."}],"przyklad":"Budowa domu jako projekt: jest początek i koniec, budżet, harmonogram, kierownik i odbiory etapów. Tym zajmuje się PRINCE2. HACZYK: Projekt = PRINCE2 (P jak projekt)."},"q-pc-std-05":{"id":"q-pc-std-05","typ":"egzamin","s":"PR-02-10","t":"Z którymi procesami COBIT 5 wiążą się według Załącznika E PRINCE2 i PMBOK?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 60","FW-PL s. 61"],"r":null,"zap":"PRINCE2/PMBOK ↔ APO (portfel) + BAI (programy i projekty).","scen":"","o":[{"t":"Z procesami portfela w APO oraz zarządzania programami i projektami w BAI","ok":true,"w":"Załącznik E: PRINCE2 obejmuje procesy portfela w APO i procesy zarządzania programami i projektami w BAI; na Ilustracji 25 stoi razem z PMBOK (FW-PL s. 61)."},{"t":"Z procesami świadczenia usług w DSS","ok":false,"w":"Usługi w DSS to głównie ITIL i ISO/IEC 20000 (FW-PL s. 60)."},{"t":"Wyłącznie z procesami Ładu w EDM","ok":false,"w":"Ładowi w EDM odpowiada ISO/IEC 38500 (FW-PL s. 61)."},{"t":"Z monitorowaniem i oceną w MEA","ok":false,"w":"Działania monitorujące z MEA wymienia się przy serii ISO/IEC 27000, nie przy PRINCE2 (FW-PL s. 60)."}],"przyklad":"Najpierw wybierasz, które remonty w ogóle zrobić w tym roku (portfel – APO), potem prowadzisz każdy remont jako projekt (BAI). HACZYK: projekty to „Build” – BAI."},"q-pc-std-06":{"id":"q-pc-std-06","typ":"egzamin","s":"PR-02-10","t":"Czego dotyczy TOGAF 9?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 61","FW-PL s. 86"],"r":null,"zap":"TOGAF = architektura korporacyjna (jak systemy, dane i procesy organizacji pasują do siebie); rdzeń: cykl ADM.","scen":"","o":[{"t":"Zarządzania usługami IT","ok":false,"w":"To ITIL i ISO/IEC 20000 (FW-PL s. 60)."},{"t":"Zarządzania ryzykiem","ok":false,"w":"To seria ISO/IEC 31000 (FW-PL s. 60)."},{"t":"Zarządzania projektami","ok":false,"w":"To PRINCE2 i PMBOK (FW-PL s. 61)."},{"t":"Architektury korporacyjnej – jej rdzeniem jest cykl ADM (Architecture Development Method)","ok":true,"w":"TOGAF 9 dotyczy architektury korporacyjnej; rdzeniem jest cykl ADM, odwzorowany w praktykach COBIT 5 dotyczących architektury w APO (FW-PL s. 61). Podręcznik wskazuje też, że TOGAF daje techniczny model referencyjny (FW-PL s. 86)."}],"przyklad":"TOGAF to jak plan zagospodarowania miasta: gdzie drogi, gdzie budynki, jak wszystko się łączy, a cykl ADM to kolejne etapy rozbudowy. HACZYK: TOGAF ↔ architektura ↔ Rada ds. Architektury."},"q-pc-std-07":{"id":"q-pc-std-07","typ":"egzamin","s":"PR-02-10","t":"Czego dotyczy seria norm ISO/IEC 27000 i które obszary COBIT 5 obejmuje?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 60"],"r":null,"zap":"ISO/IEC 27000 = bezpieczeństwo informacji; jest „rozproszona” po wielu domenach: EDM, APO, DSS i MEA.","scen":"","o":[{"t":"Zarządzania usługami IT; obejmuje głównie domenę DSS","ok":false,"w":"Usługi IT w DSS to ITIL i ISO/IEC 20000 (FW-PL s. 60)."},{"t":"Bezpieczeństwa informacji; obejmuje procesy bezpieczeństwa i ryzyka w EDM, APO i DSS oraz działania monitorujące w MEA","ok":true,"w":"Tak opisuje ją Załącznik E: procesy związane z bezpieczeństwem i ryzykiem w EDM, APO i DSS, działania bezpieczeństwa w innych domenach i monitorowanie w MEA (FW-PL s. 60)."},{"t":"Ładu korporacyjnego w obszarze IT; obejmuje wyłącznie EDM","ok":false,"w":"To ISO/IEC 38500 (FW-PL s. 57, 61)."},{"t":"Rozwoju aplikacji; obejmuje procesy budowania w BAI","ok":false,"w":"Budowanie aplikacji w BAI łączy się z CMMI (FW-PL s. 61)."}],"przyklad":"Bezpieczeństwo w domu nie siedzi w jednym pokoju: zamki w drzwiach, sejf w sypialni, alarm w korytarzu i co jakiś czas sprawdzenie, czy wszystko działa. Tak samo 27000 przenika wiele domen. HACZYK: 27000 = bezpieczeństwo, wszędzie po trochu."},"q-pc-std-08":{"id":"q-pc-std-08","typ":"egzamin","s":"PR-02-10","t":"Z którymi procesami COBIT 5 wiąże się według Załącznika E seria ISO/IEC 31000?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 60"],"r":null,"zap":"ISO/IEC 31000 = zarządzanie ryzykiem → EDM (nadzór nad ryzykiem, EDM03) i APO (zarządzanie ryzykiem, APO12).","scen":"","o":[{"t":"Z procesami zarządzania ryzykiem w domenach EDM i APO","ok":true,"w":"Załącznik E: ISO/IEC 31000 obejmuje procesy związane z zarządzaniem ryzykiem w EDM i APO (FW-PL s. 60)."},{"t":"Z procesami świadczenia usług w DSS","ok":false,"w":"To obszar ITIL i ISO/IEC 20000 (FW-PL s. 60)."},{"t":"Z procesami architektury korporacyjnej w APO","ok":false,"w":"To obszar TOGAF 9 (FW-PL s. 61)."},{"t":"Z procesami zarządzania projektami w BAI","ok":false,"w":"To obszar PRINCE2 i PMBOK (FW-PL s. 61)."}],"przyklad":"Jak ubezpieczenie domu: zarząd rodziny decyduje, ile ryzyka akceptuje (EDM), a ktoś na co dzień pilnuje polis i zabezpieczeń (APO). HACZYK: 31000 = ryzyko."},"q-pc-std-09":{"id":"q-pc-std-09","typ":"egzamin","s":"PR-02-10,PR-01-03","t":"Czego dotyczy norma ISO/IEC 38500 i z którą domeną COBIT 5 się łączy?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 57","FW-PL s. 60","FW-PL s. 61"],"r":null,"zap":"ISO/IEC 38500 = ład IT, 6 zasad, ocena–kierowanie–monitorowanie → EDM. Nie myl z 5 zasadami COBIT 5.","scen":"","o":[{"t":"Zarządzania usługami IT; łączy się z DSS","ok":false,"w":"To ITIL i ISO/IEC 20000 (FW-PL s. 60)."},{"t":"Oceny zdolności procesów; łączy się z modelem PAM","ok":false,"w":"To ISO/IEC 15504 (FW-PL s. 41)."},{"t":"Ładu korporacyjnego w obszarze IT; opiera się na sześciu zasadach i łączy się z domeną EDM","ok":true,"w":"ISO/IEC 38500 (Corporate governance of information technology) opiera się na sześciu kluczowych zasadach; jej podejście ocena–kierowanie–monitorowanie odpowiada domenie EDM (FW-PL s. 57, 60–61)."},{"t":"Bezpieczeństwa informacji; łączy się z APO i DSS","ok":false,"w":"To seria ISO/IEC 27000 (FW-PL s. 60)."}],"przyklad":"38500 to „regulamin zarządu” w sprawach IT: zarząd ocenia, kieruje i sprawdza, a nie sam naprawia komputery. HACZYK: ISO/IEC 38500 ma 6 zasad, COBIT 5 ma 5 zasad."},"q-pc-std-10":{"id":"q-pc-std-10","typ":"egzamin","s":"PR-02-10","t":"Z którymi obszarami COBIT 5 wiąże się według Załącznika E model CMMI (rozwój)?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 61"],"r":null,"zap":"CMMI (rozwój) = dojrzałość wytwarzania oprogramowania → BAI (budowanie, nabywanie) + jakość w APO.","scen":"","o":[{"t":"Z procesami portfela w APO","ok":false,"w":"Portfel w APO wiąże się z PRINCE2 (FW-PL s. 61)."},{"t":"Z procesami budowania aplikacji i nabywania w BAI oraz niektórymi procesami organizacyjnymi i jakości w APO","ok":true,"w":"Załącznik E: CMMI (rozwój) obejmuje procesy budowania aplikacji oraz nabywania w BAI i niektóre procesy organizacyjne i związane z jakością w APO (FW-PL s. 61)."},{"t":"Z procesami Ładu w EDM","ok":false,"w":"Ładowi w EDM odpowiada ISO/IEC 38500 (FW-PL s. 61)."},{"t":"Z procesami bezpieczeństwa w DSS","ok":false,"w":"Bezpieczeństwo w DSS łączy się z serią ISO/IEC 27000 (FW-PL s. 60)."}],"przyklad":"CMMI to jak ocena warsztatu stolarskiego: czy meble robi się według sprawdzonej, powtarzalnej metody, czy za każdym razem inaczej. HACZYK: CMMI ↔ budowanie aplikacji ↔ BAI."},"q-pc-std-11":{"id":"q-pc-std-11","typ":"egzamin","s":"PR-02-10","t":"Która para „standard – obszar, którego dotyczy” jest poprawna?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 60","FW-PL s. 61"],"r":null,"zap":"ITIL – usługi; PRINCE2/PMBOK – projekty; TOGAF – architektura; CMMI – rozwój aplikacji; 27000 – bezpieczeństwo; 31000 – ryzyko; 38500 – ład IT; 20000 – usługi IT; 15504 – ocena procesów.","scen":"","o":[{"t":"ITIL – zarządzanie projektami","ok":false,"w":"ITIL dotyczy zarządzania usługami IT; projektami zajmuje się PRINCE2 (FW-PL s. 60–61)."},{"t":"PRINCE2 – zarządzanie usługami IT","ok":false,"w":"PRINCE2 dotyczy zarządzania projektami; usługami IT zajmuje się ITIL (FW-PL s. 60–61)."},{"t":"ISO/IEC 31000 – bezpieczeństwo informacji","ok":false,"w":"ISO/IEC 31000 dotyczy zarządzania ryzykiem; bezpieczeństwem informacji zajmuje się ISO/IEC 27000 (FW-PL s. 60)."},{"t":"TOGAF 9 – architektura korporacyjna","ok":true,"w":"TOGAF 9 dotyczy architektury korporacyjnej, z cyklem ADM jako rdzeniem (FW-PL s. 61)."}],"przyklad":"Jak przypisywanie fachowców do zadań: elektryk do prądu, hydraulik do rur, architekt do projektu domu. Pomylenie ich par to typowa pułapka. HACZYK: zapamiętaj ściągę z rubryki „Zapamiętaj”."},"q-pc-std-12":{"id":"q-pc-std-12","typ":"egzamin","s":"PR-02-10","t":"Która para „standard – organizacja, która go wydaje” jest poprawna według wykazu źródeł w Załączniku A?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 47"],"r":null,"zap":"Wydawcy: COBIT – ISACA; ITIL i PRINCE2 – rząd Wielkiej Brytanii; TOGAF – The Open Group; PMBOK – Project Management Institute; normy ISO/IEC – ISO i IEC.","scen":"","o":[{"t":"ITIL – ISACA","ok":false,"w":"ITIL i PRINCE2 wydał rząd Wielkiej Brytanii (HM Government, Best Management Practice Portfolio); ISACA wydaje COBIT (FW-PL s. 47)."},{"t":"TOGAF 9 – The Open Group","ok":true,"w":"Załącznik A wymienia TOGAF 9 jako publikację The Open Group (FW-PL s. 47)."},{"t":"PMBOK – Międzynarodowa Organizacja Normalizacyjna (ISO)","ok":false,"w":"PMBOK wydaje Project Management Institute (FW-PL s. 47)."},{"t":"ISO/IEC 27000 – Project Management Institute","ok":false,"w":"Normy ISO/IEC wydają wspólnie ISO i IEC (FW-PL s. 47)."}],"przyklad":"Jak marki samochodów: każda ma swojego producenta. COBIT nie „produkuje” ITIL ani TOGAF, tylko z nimi współpracuje. HACZYK: ISACA to tylko COBIT (oraz Val IT, Risk IT, BMIS, ITAF)."},"q-pc-std-13":{"id":"q-pc-std-13","typ":"egzamin","s":"PR-02-10,EN-02-10","t":"Po co COBIT 5 odsyła do standardów takich jak ITIL, seria ISO/IEC 27000 czy PRINCE2?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 70"],"r":null,"zap":"COBIT 5 = nadrzędna rama (CO trzeba robić); ITIL, ISO, PRINCE2, TOGAF = szczegóły (JAK to zrobić w danym obszarze).","scen":"","o":[{"t":"Bo COBIT 5 je zastępuje i przejmuje ich treść","ok":false,"w":"COBIT 5 nie zastępuje innych standardów, tylko jest z nimi spójny i je integruje (FW-PL s. 25, 70)."},{"t":"Bo bez certyfikatu z tych standardów nie można stosować COBIT 5","ok":false,"w":"Podręcznik nie stawia takiego wymogu (FW-PL s. 70)."},{"t":"Po szczegółowe wytyczne „jak” – COBIT 5 opisuje praktyki i działania, a dodatkowe szczegóły można wziąć z tych standardów","ok":true,"w":"Podręcznik wskazuje, że do osiągnięcia celów wdrożenia mogą być potrzebne dodatkowe wytyczne, które można uzyskać ze szczegółowych standardów i dobrych praktyk, takich jak ITIL, ISO/IEC 27000 i PRINCE2 (FW-PL s. 70)."},{"t":"Bo COBIT 5 nie ma własnych procesów","ok":false,"w":"COBIT 5 ma własny model referencyjny 37 procesów (FW-PL s. 70)."}],"przyklad":"COBIT 5 to jak plan budowy domu, a ITIL, PRINCE2 czy normy ISO to instrukcje konkretnych fachowców: elektryka, hydraulika, kierownika budowy. HACZYK: COBIT integruje, nie zastępuje."}},"N":{"kont":["fz-D-004","fz-D-005","fz-D-012","q-pc-impc-013","q-pc-impc-012","q-pc-impc-017","q-pc-gap-09","q-pc-gap-10"],"decyz":["fz-D-014","fz-D-026","fz-D-028","q-pc-impc-032","q-pc-impc-038","q-pc-impc-039","q-pc-impc-042","q-pc-impc-045","fz-D-011","fz-D-027"],"pz":["fz-D-008","fz-D-009","fz-D-010","fz-D-014","fz-D-036","q-pc-impc-0 const CANON=(()=>{ const m={}; nodes.concat(FTILES,FIG2).forEach(n=>{ if(n.type!=='card'||!n.data||!n.data.title) return; const k=NM(n.data.title); if(k.length>=8&&!m[k]) m[k]=n.id; }); return m; })();
const BKRAW=(window.BRAKI_TILES||[]).map(sec=>{ const gone=new Set(); sec.items.forEach(it=>{ const c=CANON[NM(it.pl)]; if(c){ gone.add(it.k); (FOLDX[c]=FOLDX[c]||[]).push([it.pl,(it.opis||'')+' (FW-PL s. '+it.s+')']); } });
  return Object.assign({},sec,{items:sec.items.filter(it=>!gone.has(it.k))}); });
const BKT=BKRAW.map((sec,si)=>Object.assign({},sec,{items:examFilter(sec.items,'rodzic',String(si))})).filter(sec=>sec.items.length), BKINFO={}, BKGROUPS=[];
(function(){
  if(!BKT.length) return;

    const roots=sec.items.filter(i=>!i.rodzic||!inSec[i.rodzic]||i.rodzic===i.k);
    const cols=roots.map(r=>{ const out=[], seen=new Set(); (function dfs(it,dp){ if(seen.has(it.k)) return; seen.add(it.k); out.push([it,dp]); (kids[it.k]||[]).forEach(c=>dfs(c,dp+1)); })(r,0); return out; });
    const C=Math.min(cols.length, cols.length>12?6:5), HD=C===1?150:122;
    const rows=[]; for(let i=0;i<cols.length;i+=C) rows.push(cols.slice(i,i+C));
    const rowHs=rows.map(r=>Math.max(...r.map(c=>c.length)));
    const w=20+C*(FT+20), hgt=HD+rowHs.reduce((a,b)=>a+b*FSTEP+30,0)+10;

      yOff+=rowHs[ri]*FSTEP+30; });
    sx+=w+GAP; rowH=Math.max(rowH,hgt);
  });
})();

const WYN_KEY='cobit-schemat-wyniki', WYN_COOKIE='cobitWyniki';
function wynLoad(){ let o={};
  try{ const v=localStorage.getItem(WYN_KEY); if(v) o=JSON.parse(v)||{}; }catch(_){}
  try{ const m=document.cookie.match(new RegExp('(?:^|; )'+WYN_COOKIE+'=([^;]*)')); if(m){ const c=JSON.parse(decodeURIComponent(m[1]))||{}; Object.entries(c).forEach(([k,v])=>{ if(!o[k]||(v.t||0)>(o[k].t||0)) o[k]=v; }); } }catch(_){}
  return o; }
let WYN=wynLoad();
function wynSave(){
  try{ localStorage.setItem(WYN_KEY,JSON.stringify(WYN)); }catch(_){}
  try{ const ent=Object.entries(WYN).sort((a,b)=>(b[1].t||0)-(a[1].t||0)), o={};
    for(const [k,v] of ent){ o[k]=v; if(encodeURIComponent(JSON.stringify(o)).length>3800){ delete o[k]; break; } }
    document.cookie=WYN_COOKIE+'='+encodeURIComponent(JSON.stringify(o))+';max-age=31536000;path=/;SameSite=Lax'; }catch(_){}
}

function wedgeHTML(n){
  const C=110, rings=[[104,80,'g-amber'],[80,56,'g-teal'],[56,32,'g-purple']];
  const pt=(r,a)=>[(C+r*Math.cos(a)).toFixed(1),(C+r*Math.sin(a)).toFixed(1)];
  let svg='<svg class="cykl-svg wedge-svg" viewBox="0 0 220 220" role="img" aria-label="Faza '+n+' w trzech kręgach">';
  rings.forEach(([R,r,g])=>{ svg+='<g class="'+g+'">';
    for(let i=0;i<7;i++){ const a0=-Math.PI/2+i*2*Math.PI/7+0.015, a1=-Math.PI/2+(i+1)*2*Math.PI/7-0.015;
      const [x0,y0]=pt(R,a0),[x1,y1]=pt(R,a1),[x2,y2]=pt(r,a1),[x3,y3]=pt(r,a0);
      svg+='<path'+(i===n-1?'':' class="wdim"')+' d="M'+x0+' '+y0+'A'+R+' '+R+' 0 0 1 '+x1+' '+y1+'L'+x2+' '+y2+'A'+r+' '+r+' 0 0 0 '+x3+' '+y3+'Z"/>'; }
    svg+='</g>'; });
  svg+='<circle cx="110" cy="110" r="30" class="core"/><text x="110" y="110" text-anchor="middle" dominant-baseline="central" class="core-t">'+n+'</text></svg>';
  const f=FAZY3[n-1];
  const rows=f.r.map((x,j)=>'<div class="wedge-row '+RINGS[j].g+'"><span class="rdot"></span><div><div class="wedge-k">'+esc(['krąg zewnętrzny','krąg środkowy','krąg wewnętrzny'][j])+' · '+esc(RINGS[j].ex)+'</div>'+
    '<b>'+esc(x[1]||x[0])+'</b>'+(x[1]&&x[1]!==x[0]?'<div class="wedge-hb">podręcznik: '+esc(x[0])+'</div>':'')+'<div class="wedge-en"><em>'+esc(x[2])+'</em></div></div></div>').join('');
  return '<h3>Wycinek koła: faza '+n+' w trzech kręgach (Rysunek 17)</h3><div class="wedge-fig">'+svg+'<div class="wedge-rows">'+rows+'</div></div>';
}
