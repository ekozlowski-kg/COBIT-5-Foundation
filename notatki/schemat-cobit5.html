,"fz-B-015":{"id":"fz-B-015","typ":"egzamin","s":"PR-02-15","t":"Jak procesy i informacje łączą Ład z Zarządzaniem (Rysunek 14)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 31"],"r":null,"zap":"","scen":"","o":[{"t":"Wszystkie procesy są wspólne dla Ładu i Zarządzania, więc RACI nie jest potrzebna","ok":false,"w":"Model rozróżnia procesy Ładu i Zarządzania, a RACI mówi, kto za co odpowiada."},{"t":"Model rozróżnia procesy Ładu i Zarządzania, RACI wskazuje odpowiedzialność, a procesy wymieniają informacje na wejściach i wyjściach praktyk","ok":true,"w":"Tak: decyzje idą w dół, a raporty i dane wracają w górę."},{"t":"Informacje płyną tylko od Ładu do Zarządzania","ok":false,"w":"Informacje płyną w obie strony: raporty wracają do Ładu."},{"t":"Łączy je przede wszystkim przykład dawany przez przywódców","ok":false,"w":"To opis interakcji przez kulturę i zachowanie, nie przez procesy i informacje."}],"fz":{"h":"Interakcje: procesy i informacje (Rysunek 14)","p":"P2","pulapka":false,"n":"EN: Interactions: processes, information","q":"Jak procesy i informacje łączą Ład z Zarządzaniem (Rysunek 14)?","a":"Procesy: model rozróżnia procesy Ładu i Zarządzania, a tabele RACI wskazują, kto za co odpowiada. Informacje: procesy wymieniają informacje i produkty pracy na wejściach i wyjściach praktyk (np. dokumenty, raporty, dane, decyzje).","ex":"Szkoła: dyrekcja i nauczyciele mają osobne zadania, a tabela RACI mówi, kto za co odpowiada. Łączy ich obieg informacji: plan lekcji i decyzje idą w dół, oceny i raporty wracają w górę.","org":""}},"fz-B-016":{"id":"fz-B-016","typ":"egzamin","s":"PR-02-15","t":"Jak według COBIT 5 kształtuje się zachowanie w relacji Ład–Zarządzanie?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 31"],"r":null,"zap":"","scen":"","o":[{"t":"Oddolnie – pracownicy ustalają normy, a zarząd je przejmuje","ok":false,"w":"Karta mówi, że kultura płynie z góry."},{"t":"Wyłącznie przez polityki, bez wpływu przywódców","ok":false,"w":"Polityki utrwalają decyzje Ładu, ale zachowanie kształtuje przykład przywódców."},{"t":"Przez tabelę RACI, która przypisuje zachowania","ok":false,"w":"RACI przypisuje odpowiedzialność za praktyki, a nie kształtuje kultury."},{"t":"Odgórnie – przywódcy dają przykład","ok":true,"w":"Tak: zachowanie kształtuje się odgórnie."}],"fz":{"h":"Interakcje: struktury, polityki, kultura","p":"P2","pulapka":false,"n":"EN: Interactions: structures, principles/policies, culture","q":"Jak struktury, polityki i kultura łączą Ład z Zarządzaniem?","a":"Struktury należą do Ładu lub Zarządzania zależnie od składu i zakresu decyzji. Zasady i polityki zamieniają decyzje Ładu w stałe reguły. Zachowanie kształtuje się odgórnie: przywódcy dają przykład.","ex":"Szkoła: rada pedagogiczna to struktura, regulamin utrwala decyzje dyrekcji, a uczniowie zachowują się tak, jak dyrektor daje przykład. Kultura płynie z góry.","org":""}},"fz-B-017":{"id":"fz-B-017","typ":"egzamin","s":"PR-02-15","t":"Od czego zależy, czy struktura organizacyjna należy do Ładu, czy do Zarządzania?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 31"],"r":null,"zap":"","scen":"","o":[{"t":"Od składu struktury i zakresu podejmowanych przez nią decyzji","ok":true,"w":"Tak: tak mówi karta o interakcjach Ład–Zarządzanie."},{"t":"Wszystkie struktury organizacyjne należą do Zarządzania","ok":false,"w":"Struktury mogą należeć do Ładu lub do Zarządzania."},{"t":"Od poziomu zdolności procesów, za które odpowiada","ok":false,"w":"Poziom zdolności dotyczy oceny procesów, a nie przynależności struktur."},{"t":"Od tego, czy jest wpisana jako C lub I w tabeli RACI","ok":false,"w":"Litery RACI opisują udział w praktykach, a nie przynależność struktury."}],"fz":{"h":"Interakcje: struktury, polityki, kultura","p":"P2","pulapka":false,"n":"EN: Interactions: structures, principles/policies, culture","q":"Jak struktury, polityki i kultura łączą Ład z Zarządzaniem?","a":"Struktury należą do Ładu lub Zarządzania zależnie od składu i zakresu decyzji. Zasady i polityki zamieniają decyzje Ładu w stałe reguły. Zachowanie kształtuje się odgórnie: przywódcy dają przykład.","ex":"Szkoła: rada pedagogiczna to struktura, regulamin utrwala decyzje dyrekcji, a uczniowie zachowują się tak, jak dyrektor daje przykład. Kultura płynie z góry.","org":""}},"fz-B-018":{"id":"fz-B-018","typ":"egzamin","s":"PR-02-15","t":"Jaką rolę w relacji Ład–Zarządzanie pełnią usługi, aplikacje i infrastruktura?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 31"],"r":null,"zap":"","scen":"","o":[{"t":"Wyznaczają kierunek przez priorytety i decyzje","ok":false,"w":"To zadanie organu Ładu, nie usług."},{"t":"Dostarczają organowi Ładu informacji do oceny, kierowania i monitorowania","ok":true,"w":"Tak: system daje zarządowi dane do decyzji."},{"t":"Służą wyłącznie Zarządzaniu i nie mają związku z Ładem","ok":false,"w":"Karta wskazuje, że dostarczają informacji właśnie organowi Ładu."},{"t":"Określają, kto jest R, A, C i I w praktykach","ok":false,"w":"To rola tabel RACI."}],"fz":{"h":"Interakcje: ludzie i usługi","p":"P2","pulapka":false,"n":"EN: Interactions: people, services","q":"Jak ludzie i usługi łączą Ład z Zarządzaniem?","a":"Ludzie: obie role wymagają innych umiejętności, ale kluczowe jest rozumienie obu zadań i różnic. Usługi, aplikacje i infrastruktura dostarczają organowi Ładu informacji do oceny, kierowania i monitorowania.","ex":"Szpital: dyrektor i chirurg potrzebują innych umiejętności, ale każdy musi rozumieć pracę drugiego. A system z wynikami leczenia daje dyrektorowi dane do decyzji.","org":""}},"fz-B-019":{"id":"fz-B-019","typ":"egzamin","s":"PR-01-03,PR-01-04","t":"Która para „kod domeny – nazwa egzaminacyjna” jest poprawna?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 32"],"r":null,"zap":"","scen":"","o":[{"t":"DSS – Dostosuj, Planuj i Organizuj","ok":false,"w":"To nazwa APO; DSS to Dostarczaj, Obsługuj i Wspieraj."},{"t":"BAI – Monitoruj, Oszacuj i Oceń","ok":false,"w":"To nazwa MEA; BAI to Twórz, Nabywaj i Wdrażaj."},{"t":"MEA – Monitoruj, Oszacuj i Oceń","ok":true,"w":"Tak: to egzaminacyjna nazwa MEA."},{"t":"APO – Oszacuj, Kieruj i Monitoruj","ok":false,"w":"To nazwa EDM; APO to Dostosuj, Planuj i Organizuj."}],"fz":{"h":"Pięć domen PRM (nazwy egzaminacyjne)","p":"P1","pulapka":false,"n":"EN: Evaluate, Direct and Monitor; Align, Plan and Organise; Build, Acquire and Implement; Deliver, Service and Support; Monitor, Evaluate and Assess","q":"Podaj nazwy pięciu domen (nazwy egzaminacyjne).","a":"EDM – Oszacuj, Kieruj i Monitoruj; APO – Dostosuj, Planuj i Organizuj; BAI – Twórz, Nabywaj i Wdrażaj; DSS – Dostarczaj, Obsługuj i Wspieraj; MEA – Monitoruj, Oszacuj i Oceń.","ex":"Kolejność jak w życiu: szef ocenia (EDM), potem plan (APO), budowa (BAI), codzienna obsługa (DSS), kontrola (MEA). Haczyk na kolejność liter: Ela, Ania, Basia, Dorota, Monika.","org":""}},"fz-B-020":{"id":"fz-B-020","typ":"egzamin","s":"PR-01-03","t":"Który z poniższych NIE jest procesem domeny EDM?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 33"],"r":null,"zap":"","scen":"","o":[{"t":"Zarządzanie ryzykiem","ok":true,"w":"To APO12, proces Zarządzania; w EDM jest EDM03 Zapewnienie optymalizacji ryzyka."},{"t":"Zapewnienie realizacji korzyści","ok":false,"w":"To EDM02."},{"t":"Zapewnienie optymalizacji zasobów","ok":false,"w":"To EDM04."},{"t":"Zapewnienie transparentności interesariuszy","ok":false,"w":"To EDM05."}],"fz":{"h":"Pięć procesów EDM","p":"P1","pulapka":false,"n":"EN: EDM01 Governance Framework Setting and Maintenance; EDM02 Benefits Delivery; EDM03 Risk Optimisation; EDM04 Resource Optimisation; EDM05 Stakeholder Transparency","q":"Podaj pięć procesów domeny EDM.","a":"EDM01 Zapewnienie i utrzymanie ładu korporacyjnego; EDM02 Zapewnienie realizacji korzyści; EDM03 Zapewnienie optymalizacji ryzyka; EDM04 Zapewnienie optymalizacji zasobów; EDM05 Zapewnienie Transparentności Interesariuszy.","ex":"Pięć trosk właściciela: 01 reguły gry, 02 czy się opłaca, 03 czy nie za ryzykownie, 04 czy starczy ludzi i pieniędzy, 05 czy wszyscy zainteresowani wiedzą, co się dzieje.","org":""}},"fz-B-021":{"id":"fz-B-021","typ":"egzamin","s":"PR-01-03,PR-01-04","t":"Czy model procesów COBIT 5 jest normatywny (obowiązkowy jeden do jednego)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 32"],"r":null,"zap":"","scen":"","o":[{"t":"Tak – każda organizacja musi wdrożyć wszystkie 37 procesów","ok":false,"w":"Model nie jest normatywny; mniejsza organizacja może mieć mniej procesów."},{"t":"Tak – ale obowiązkowe są tylko procesy Ładu (EDM)","ok":false,"w":"Żadna część modelu nie jest normatywna."},{"t":"Nie – bo nie obejmuje całego IT i trzeba go uzupełniać","ok":false,"w":"Model jest kompletny, a procesy Zarządzania razem obejmują całe IT."},{"t":"Nie – jest kompletny, ale organizacja definiuje własny zestaw procesów, byle pokrywał wszystkie cele Ładu i Zarządzania","ok":true,"w":"Tak: COBIT daje pełne menu, ale nie narzuca jednego zestawu."}],"fz":{"h":"Czy model procesów jest normatywny","p":"P2","pulapka":false,"n":"EN: Not prescriptive","q":"Czy model procesów COBIT 5 jest normatywny?","a":"Nie. Jest kompletny, ale nie jedyny możliwy; każda organizacja definiuje własny zestaw procesów, byle pokrywał wszystkie cele Ładu i Zarządzania. Mniejsza może mieć mniej procesów.","ex":"Normatywny = obowiązkowy jeden do jednego. COBIT daje pełne menu, ale mała kawiarnia może podać mniej dań, byle wszyscy goście (cele) zostali obsłużeni.","org":""}},"fz-B-022":{"id":"fz-B-022","typ":"egzamin","s":"PR-01-03","t":"Jakie praktyki zdefiniowano w każdym z pięciu procesów Ładu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 32"],"r":null,"zap":"","scen":"","o":[{"t":"Planuj, Twórz, Wykonuj i Monitoruj","ok":false,"w":"To obszary działań Zarządzania (PBRM)."},{"t":"Oszacuj, Kieruj i Monitoruj (EDM)","ok":true,"w":"Tak: EDM w każdym procesie EDM."},{"t":"Odpowiedzialny, Rozliczany, Konsultowany, Informowany","ok":false,"w":"To role w tabeli RACI, nie praktyki."},{"t":"Planowanie, projektowanie, budowanie, użytkowanie, ocena, aktualizacja","ok":false,"w":"To cykl życia aktywatora."}],"fz":{"h":"Praktyki w procesach Ładu","p":"P2","pulapka":false,"n":"EN: EDM practices within each governance process","q":"Jakie praktyki zdefiniowano w każdym procesie Ładu?","a":"Praktyki Oszacuj, Kieruj i Monitoruj (EDM) – w każdym z pięciu procesów Ładu.","ex":"Każdy z pięciu procesów Ładu powtarza ten sam trójkrok właściciela: oceń, wskaż kierunek, sprawdź. Haczyk: EDM w każdym EDM.","org":""}},"fz-B-023":{"id":"fz-B-023","typ":"egzamin","s":"PR-02-14","t":"Czym przede wszystkim różnią się procesy Ładu od procesów Zarządzania?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 71"],"r":null,"zap":"","scen":"","o":[{"t":"Celami: Ład dąży do celów interesariuszy (wartość, optymalizacja ryzyka i zasobów), a Zarządzanie w obszarach PBRM obejmuje całe IT","ok":true,"w":"Tak: karta wskazuje, że różnią się celami."},{"t":"Tym, że procesy Ładu nie mają praktyk","ok":false,"w":"Każdy proces Ładu ma praktyki EDM."},{"t":"Tym, że procesy Zarządzania nie mają tabel RACI","ok":false,"w":"Każdy proces COBIT 5 ma RACI."},{"t":"Tym, że procesy Ładu są obowiązkowe, a procesy Zarządzania opcjonalne","ok":false,"w":"Model procesów w ogóle nie jest normatywny."}],"fz":{"h":"Procesy Ładu a procesy Zarządzania","p":"P1","pulapka":true,"n":"EN: Governance vs management processes","q":"Czym różnią się procesy Ładu od procesów Zarządzania?","a":"Celami. Ład: cele interesariuszy – dostarczanie wartości, optymalizacja ryzyka i zasobów (przez ocenę, kierowanie, monitorowanie). Zarządzanie: obszary PBRM, które razem obejmują całe IT.","ex":"Ład pilnuje, by firma dawała wartość bez zbędnego ryzyka i marnowania pieniędzy i ludzi. Zarządzanie obejmuje całą robotę z IT: plan, budowę, obsługę i kontrolę.","org":""}},"fz-B-024":{"id":"fz-B-024","typ":"egzamin","s":"EN-02-07","t":"Który z poniższych to interesariusz WEWNĘTRZNY procesu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 69"],"r":null,"zap":"","scen":"","o":[{"t":"Klienci","ok":false,"w":"To interesariusz zewnętrzny."},{"t":"Organy regulacyjne","ok":false,"w":"To interesariusz zewnętrzny."},{"t":"Pracownicy","ok":true,"w":"Tak: wewnętrzni to zarząd, kierownictwo, pracownicy i wolontariusze."},{"t":"Partnerzy biznesowi","ok":false,"w":"To interesariusz zewnętrzny."}],"fz":{"h":"Interesariusze procesów","p":"P2","pulapka":false,"n":"EN: Process stakeholders","q":"Kim są interesariusze procesów?","a":"Zewnętrzni: klienci, partnerzy biznesowi, udziałowcy, organy regulacyjne. Wewnętrzni: zarząd, kierownictwo, pracownicy, wolontariusze. Ich role opisuje tabela RACI.","ex":"Interesariusz = każdy, kogo proces dotyczy. W szkole z zewnątrz: rodzice, kuratorium, sponsorzy; od środka: dyrekcja, nauczyciele, woźny. RACI mówi, kto co robi.","org":""}},"fz-B-025":{"id":"fz-B-025","typ":"egzamin","s":"EN-02-08","t":"Czym może być cel procesu (opis pożądanego wyniku)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 69"],"r":null,"zap":"","scen":"","o":[{"t":"Ogólnym zdaniem, po co proces istnieje","ok":false,"w":"To przeznaczenie procesu."},{"t":"Krokiem koniecznym do wdrożenia praktyki","ok":false,"w":"To działanie procesu."},{"t":"Miernikiem spełniającym kryteria SMART","ok":false,"w":"Miernik mierzy cel, ale nim nie jest."},{"t":"Wytworem (np. dokumentem), istotną zmianą stanu lub istotną poprawą zdolności innych procesów","ok":true,"w":"Tak: to trzy możliwe postaci celu procesu."}],"fz":{"h":"Cel procesu","p":"P2","pulapka":true,"n":"EN: Process goal","q":"Jak definiuje się cel procesu?","a":"Opis pożądanego wyniku procesu: wytwór (podr. pozostałość, artefakt, np. dokument), istotna zmiana stanu lub istotna poprawa zdolności innych procesów.","ex":"Po czym poznasz, że proces się udał: powstała rzecz (np. gotowy raport), coś wyraźnie się zmieniło (kran już nie cieknie) albo inne procesy działają lepiej.","org":""}},"fz-B-026":{"id":"fz-B-026","typ":"egzamin","s":"EN-02-08","t":"Na jakie kategorie dzielą się cele procesu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 69"],"r":null,"zap":"","scen":"","o":[{"t":"Cele wewnętrzne, kontekstowe oraz dostępności i bezpieczeństwa","ok":true,"w":"Tak: ta sama logika co cele aktywatora."},{"t":"Interesariusze, cele, cykl życia i dobre praktyki","ok":false,"w":"To cztery wymiary aktywatora."},{"t":"Korzyści, ryzyko i zasoby","ok":false,"w":"To elementy celu Ładu „Tworzenie wartości”."},{"t":"Planowanie, budowanie, uruchamianie i monitorowanie","ok":false,"w":"To obszary działań Zarządzania (PBRM)."}],"fz":{"h":"Cele procesu: kategorie","p":"P1","pulapka":false,"n":"egzamin: cele wewnętrzne, kontekstowe, dostępności · podr.: cele wewnętrzne, kontekstowe, dostępności · EN: intrinsic, contextual, accessibility and security goals","q":"Jakie kategorie celów ma proces?","a":"Cele wewnętrzne, cele kontekstowe, cele dostępności i bezpieczeństwa (ta sama logika co cele aktywatora).","ex":"Te same trzy szuflady co u aktywatorów: czy proces jest dobrze zrobiony (wewnętrzne), czy pasuje do potrzeb (kontekstowe), czy jest dostępny i chroniony (dostępność i bezpieczeństwo).","org":"kontekstowy cel DSS02: obsługa zgłoszeń dopasowana do godzin pracy komend i zrozumiała dla ich użytkowników."}},"fz-B-027":{"id":"fz-B-027","typ":"egzamin","s":"EN-02-08","t":"Pytanie „czy proces jest poufny, gdy trzeba, oraz znany i dostępny dla potrzebujących?” dotyczy której kategorii celów procesu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 69"],"r":null,"zap":"","scen":"","o":[{"t":"Celów wewnętrznych","ok":false,"w":"Te pytają o jakość wewnętrzną i zgodność z dobrą praktyką i regułami."},{"t":"Celów kontekstowych","ok":false,"w":"Te pytają, czy proces jest dopasowany, zrozumiały i łatwy w użyciu."},{"t":"Celów dostępności i bezpieczeństwa","ok":true,"w":"Tak: poufność i dostępność dla potrzebujących to ta kategoria."},{"t":"Wskaźników wiodących","ok":false,"w":"To mierniki stosowania praktyk, a nie kategoria celów procesu."}],"fz":{"h":"Kategorie celów procesu","p":"P1","pulapka":false,"n":"EN: Intrinsic, contextual, accessibility and security goals","q":"Podaj kategorie celów procesu z przykładowymi pytaniami.","a":"Cele wewnętrzne: czy proces ma jakość wewnętrzną, jest zgodny z dobrą praktyką i regułami? Cele kontekstowe: czy jest dopasowany, zrozumiały, łatwy w użyciu? Cele dostępności i bezpieczeństwa: poufny, gdy trzeba, znany i dostępny dla potrzebujących.","ex":"Jak ocena restauracji: wewnętrzne – czy kuchnia trzyma standard; kontekstowe – czy danie pasuje gościowi; dostępność i bezpieczeństwo – czy trafia na czas do właściwego stolika.","org":""}},"fz-B-028":{"id":"fz-B-028","typ":"egzamin","s":"EN-02-08","t":"Co oznacza litera A w kryteriach SMART dla mierników procesu w COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 69"],"r":null,"zap":"","scen":"","o":[{"t":"Achievable – osiągalne","ok":false,"w":"To popularne rozwinięcie, ale w COBIT 5 A = Actionable."},{"t":"Actionable – składające się z konkretnych działań (da się na ich podstawie działać)","ok":true,"w":"Tak: to pułapka z karty, w COBIT 5 A = Actionable."},{"t":"Accountable – rozliczane","ok":false,"w":"To litera A w RACI, nie w SMART."},{"t":"Accessible – dostępne","ok":false,"w":"Dostępność to kategoria celów procesu, a nie kryterium SMART."}],"fz":{"h":"Mierniki procesu: SMART","p":"P2","pulapka":true,"n":"EN: SMART metrics","q":"Jakie kryteria powinny spełniać mierniki procesu?","a":"SMART: specyficzne, mierzalne (podr. wymierne), składające się z konkretnych działań (EN actionable – da się na ich podstawie działać), istotne, terminowe. Pułapka: w COBIT 5 A = Actionable, nie popularne Achievable (osiągalne).","ex":"Jak cel odchudzania: „schudnę 3 kg do 1 czerwca, chodząc codziennie 5 km” – konkretny, mierzalny, wiadomo, co robić, ma sens i termin. „Chcę być fit” nie jest SMART.","org":""}},"fz-B-029":{"id":"fz-B-029","typ":"egzamin","s":"EN-02-09","t":"Jaki jest cykl życia procesu w COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 70"],"r":null,"zap":"","scen":"","o":[{"t":"Siedem faz wdrożenia, od wyznaczników do utrzymania motywacji","ok":false,"w":"To fazy cyklu życia wdrożenia, nie cykl życia procesu."},{"t":"Ocena, kierowanie i monitorowanie","ok":false,"w":"To działania Ładu (EDM)."},{"t":"Definiowanie, tworzenie, obsługa, monitorowanie oraz dostosowanie/aktualizacja lub wycofanie","ok":true,"w":"Tak: tak opisuje go karta."},{"t":"Planowanie, budowanie, uruchamianie i monitorowanie","ok":false,"w":"To obszary działań Zarządzania (PBRM)."}],"fz":{"h":"Cykl życia procesu","p":"P2","pulapka":false,"n":"EN: Process life cycle","q":"Jaki jest cykl życia procesu?","a":"Proces jest definiowany, tworzony, obsługiwany, monitorowany oraz dostosowywany/aktualizowany lub wycofywany.","ex":"Jak sklep: pomysł (definiowanie), otwarcie (tworzenie), codzienna praca (obsługa), liczenie utargu (monitorowanie), potem remont albo zamknięcie (dostosowanie lub wycofanie).","org":""}},"fz-B-030":{"id":"fz-B-030","typ":"egzamin","s":"EN-02-10","t":"Czym jest praktyka Ładu lub Zarządzania?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 70","FW-PL s. 91"],"r":null,"zap":"","scen":"","o":[{"t":"Szczegółową procedurą, którą wdraża się bez zmian","ok":false,"w":"Praktyki są ogólne i trzeba je dopasować do organizacji."},{"t":"Kompletnym zbiorem wymagań procesu zawartym w jednym punkcie","ok":false,"w":"Dopiero zestaw praktyk procesu daje kompletny zbiór wymagań."},{"t":"Produktem pracy na wejściu lub wyjściu procesu","ok":false,"w":"To wejścia i wyjścia."},{"t":"Ogólną deklaracją działania organu Ładu lub kierownictwa w procesie, którą trzeba dopasować do organizacji","ok":true,"w":"Tak: tak definiuje ją karta."}],"fz":{"h":"Praktyka Ładu/Zarządzania","p":"P1","pulapka":true,"n":"EN: Governance/management practice","q":"Czym jest praktyka Ładu/Zarządzania?","a":"Ogólna deklaracja działania organu Ładu lub kierownictwa w danym procesie. Dopiero zestaw praktyk procesu daje kompletny zbiór ogólnych wymagań. Praktyki są ogólne, więc trzeba je dopasować do organizacji.","ex":"Praktyka to jeden punkt z listy kontrolnej pilota; dopiero cała lista mówi, co musi być zrobione. Lista jest uniwersalna, więc każda linia lotnicza dopasowuje ją do siebie.","org":""}},"fz-B-031":{"id":"fz-B-031","typ":"egzamin","s":"EN-02-10","t":"Który z poniższych NIE jest wyborem organu Ładu i kierownictwa co do praktyk?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 70"],"r":null,"zap":"","scen":"","o":[{"t":"Wdrożenie wszystkich praktyk COBIT 5 bez zmian, bo są obowiązkowe","ok":true,"w":"Praktyki można wybierać i dostosowywać, a nawet świadomie ich nie wdrożyć."},{"t":"Dodanie lub dostosowanie praktyk","ok":false,"w":"To jeden z wyborów wymienionych na karcie."},{"t":"Wybór częstotliwości, zakresu i stopnia automatyzacji wdrożenia","ok":false,"w":"To wybór sposobu wdrożenia, wymieniony na karcie."},{"t":"Zaakceptowanie ryzyka niewdrożenia praktyki","ok":false,"w":"Tak można zrobić; to świadomy wybór z karty."}],"fz":{"h":"Wybory co do praktyk","p":"P2","pulapka":false,"n":"EN: Choices on practices, incl. accepting the risk of not implementing","q":"Jakie wybory co do praktyk podejmuje organ Ładu i kierownictwo?","a":"Wybierają właściwe praktyki i decydują o wdrożeniu; dodają lub dostosowują praktyki; definiują praktyki spoza IT; wybierają sposób wdrożenia (częstotliwość, zakres, automatyzacja); akceptują ryzyko niewdrożenia praktyki.","ex":"Jak inwestor domu: wybiera z katalogu, dodaje własne pomysły, decyduje, co zautomatyzować, i może świadomie zrezygnować z alarmu, biorąc na siebie ryzyko włamania.","org":""}},"fz-B-032":{"id":"fz-B-032","typ":"egzamin","s":"EN-02-10","t":"Czym są działania procesu w COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 70"],"r":null,"zap":"","scen":"","o":[{"t":"Ogólnymi deklaracjami tego, co trzeba robić w procesie","ok":false,"w":"To praktyki."},{"t":"Koniecznymi i wystarczającymi krokami do wdrożenia praktyki","ok":true,"w":"Tak: to podstawowe czynności obsługi procesu."},{"t":"Produktami pracy umożliwiającymi kluczowe decyzje","ok":false,"w":"To wejścia i wyjścia."},{"t":"Miernikami stosowania praktyk","ok":false,"w":"To wskaźniki wiodące."}],"fz":{"h":"Działania procesu","p":"P1","pulapka":true,"n":"EN: Activities","q":"Czym są działania procesu?","a":"Podstawowymi czynnościami obsługi procesu: koniecznymi i wystarczającymi krokami do wdrożenia praktyki. Uwzględniają wejścia i wyjścia, opierają się na dobrych praktykach, ułatwiają przypisanie ról.","ex":"Działania to kroki przepisu: „rozbij jajka, dodaj mąkę, piecz 40 minut”. Tylko potrzebne, ani jednego za dużo, i wiadomo, kto przy którym stoi.","org":""}},"fz-B-033":{"id":"fz-B-033","typ":"egzamin","s":"EN-02-10","t":"Czy działania procesu COBIT 5 są normatywne?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 70"],"r":null,"zap":"","scen":"","o":[{"t":"Tak – stosuje się je dosłownie jako procedury","ok":false,"w":"Trzeba je dostosować i rozwinąć w procedury organizacji."},{"t":"Tak – ale tylko w procesach Ładu","ok":false,"w":"Działania nie są normatywne w żadnym procesie."},{"t":"Nie – trzeba je dostosować i rozwinąć w konkretne procedury organizacji","ok":true,"w":"Tak: działania to przepis ogólny."},{"t":"Nie – bo COBIT 5 w ogóle nie opisuje działań, tylko praktyki","ok":false,"w":"COBIT 5 opisuje działania, tylko nie są one obowiązkowe."}],"fz":{"h":"Czy działania są normatywne","p":"P2","pulapka":false,"n":"EN: Activities are not prescriptive","q":"Czy działania procesu są normatywne?","a":"Nie. Trzeba je dostosować i rozwinąć w konkretne procedury właściwe dla organizacji.","ex":"Działania z COBIT to przepis ogólny, jak „dopraw do smaku”. Każda kuchnia zapisuje własną dokładną procedurę: ile soli, w jakim garnku.","org":""}},"fz-B-034":{"id":"fz-B-034","typ":"egzamin","s":"EN-02-10","t":"Do czego służą wejścia i wyjścia procesu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 70"],"r":null,"zap":"","scen":"","o":[{"t":"Określają, kto jest odpowiedzialny wykonawczo i decyzyjnie","ok":false,"w":"To robi tabela RACI."},{"t":"Opisują ogólny cel, któremu służy proces","ok":false,"w":"To przeznaczenie procesu."},{"t":"Służą tylko wewnątrz jednego procesu i nie trafiają do innych","ok":false,"w":"Często są wejściami innych procesów."},{"t":"Umożliwiają kluczowe decyzje, zostawiają ścieżkę rewizyjną i pozwalają sprawdzić przebieg po incydencie","ok":true,"w":"Tak: to produkty pracy określane dla praktyk."}],"fz":{"h":"Wejścia i wyjścia procesu","p":"P2","pulapka":false,"n":"EN: Inputs and outputs","q":"Czym są wejścia i wyjścia procesu?","a":"Produktami pracy potrzebnymi w procesie. Umożliwiają kluczowe decyzje, zostawiają ślad do kontroli (ścieżkę rewizyjną) i pozwalają sprawdzić przebieg po incydencie; określa się je dla praktyk; często są wejściami innych procesów.","ex":"Jak papiery w warsztacie: zlecenie naprawy (wejście), karta naprawy i faktura (wyjście). Widać, kto co zdecydował, a karta trafia potem dalej, np. do księgowości.","org":""}},"fz-B-035":{"id":"fz-B-035","typ":"egzamin","s":"EN-02-11","t":"Jak procesy wiążą się z innymi aktywatorami?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 71"],"r":null,"zap":"","scen":"","o":[{"t":"Wymagają i dostarczają informacji, wymagają struktur i ról z RACI, a kultura i zachowanie decydują o ich skuteczności","ok":true,"w":"Tak: to kilka z powiązań wymienionych na karcie."},{"t":"Są niezależne – aktywator opisuje się w oderwaniu od innych","ok":false,"w":"Model aktywatora uwzględnia zależności od pozostałych aktywatorów."},{"t":"Dostarczają informacji, ale jej nie wymagają","ok":false,"w":"Procesy zarówno wymagają, jak i dostarczają informacji."},{"t":"Zależą tylko od Usług, Infrastruktury i Aplikacji","ok":false,"w":"Zależą też od informacji, struktur, polityk, kultury i innych procesów."}],"fz":{"h":"Procesy a inne aktywatory","p":"P2","pulapka":false,"n":"EN: Processes – relationships with other enablers","q":"Jak procesy wiążą się z innymi aktywatorami?","a":"Wymagają i dostarczają informacji; wymagają struktur i ról z RACI; zapewniają i wymagają zdolności usługowej; zależą od innych procesów; wymagają polityk i procedur; kultura i zachowanie decydują o ich skuteczności.","ex":"Aktywator = wszystko, co pomaga działać. Gotowanie w restauracji potrzebuje zamówień (informacja), kucharzy z rolami, sprzętu, dostaw (inny proces), regulaminu i dobrej atmosfery (kultura).","org":""}},"fz-B-036":{"id":"fz-B-036","typ":"egzamin","s":"EN-02-24","t":"Który element NIE wchodzi w skład opisu procesu w przewodniku Procesy umożliwiające (Enabling Processes)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 33"],"r":null,"zap":"","scen":"","o":[{"t":"Tabela RACI","ok":false,"w":"RACI jest częścią opisu procesu."},{"t":"Przeznaczenie procesu","ok":false,"w":"Przeznaczenie jest częścią opisu procesu."},{"t":"Ocena poziomu zdolności procesu (ISO/IEC 15504)","ok":true,"w":"Karta nie wymienia oceny zdolności wśród elementów opisu procesu."},{"t":"Powiązane wytyczne","ok":false,"w":"Powiązane wytyczne zamykają opis procesu."}],"fz":{"h":"Opis procesu w Procesach umożliwiających","p":"P2","pulapka":false,"n":"EN: Process description components (COBIT 5: Enabling Processes)","q":"Z jakich elementów składa się opis procesu w Procesach umożliwiających?","a":"Etykieta (kod), nazwa, obszar (Ład/Zarządzanie), domena; opis procesu; przeznaczenie procesu; kaskada celów (cele IT i mierniki); cele i mierniki procesu; RACI; praktyki z wejściami/wyjściami i działaniami; powiązane wytyczne.","ex":"Jak etykieta na słoiku plus przepis: kod i nazwa, po co jest, cele i mierniki, kto co robi (RACI), kroki z wejściami i wyjściami, gdzie doczytać więcej.","org":""}},"fz-B-037":{"id":"fz-B-037","typ":"egzamin","s":"EN-02-25","t":"Do czego służy diagram RACI?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 93"],"r":null,"zap":"","scen":"","o":[{"t":"Mierzy, czy cele aktywatora zostały osiągnięte","ok":false,"w":"To robią wskaźniki opóźnione."},{"t":"Przypisuje wydatki IT jednostkom, które je spowodowały","ok":false,"w":"To refundacja kosztów IT (chargeback)."},{"t":"Określa, kto jest odpowiedzialny wykonawczo, odpowiedzialny decyzyjnie, konsultowany i informowany w ramach praktyk procesu","ok":true,"w":"Tak: w wierszach zadania, w kolumnach osoby, w kratkach litery."},{"t":"Opisuje cykl życia procesu od definiowania do wycofania","ok":false,"w":"To cykl życia procesu."}],"fz":{"h":"Diagram RACI","p":"P1","pulapka":false,"n":"EN: RACI chart","q":"Do czego służy diagram RACI?","a":"Określa, kto w strukturze organizacyjnej jest odpowiedzialny wykonawczo, odpowiedzialny decyzyjnie, konsultowany i informowany w ramach praktyk procesu.","ex":"Tabela jak grafik remontu: w wierszach zadania, w kolumnach osoby, w kratkach litery R, A, C, I. Rzut oka i wiesz, do kogo iść.","org":""}},"fz-B-038":{"id":"fz-B-038","typ":"egzamin","s":"EN-02-25","t":"Kogo oznacza litera R w tabeli RACI?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 93"],"r":null,"zap":"","scen":"","o":[{"t":"Osobę ostatecznie odpowiadającą za powodzenie zadania","ok":false,"w":"To A – odpowiedzialny decyzyjnie (podr.: strona rozliczana)."},{"t":"Tych, którzy realizują zadanie – role najbardziej zaangażowane operacyjnie; może ich być kilku","ok":true,"w":"Tak: R jak „Robi”."},{"t":"Osoby, których opinii się zasięga (komunikacja dwukierunkowa)","ok":false,"w":"To C – konsultowany."},{"t":"Osoby informowane o postępach (komunikacja jednokierunkowa)","ok":false,"w":"To I – informowany."}],"fz":{"h":"RACI: R – Odpowiedzialny wykonawczo","p":"P1","pulapka":true,"n":"EN: Responsible","q":"RACI: co oznacza R – Odpowiedzialny wykonawczo?","a":"Kto realizuje zadanie? Role najbardziej zaangażowane operacyjnie w wykonanie działań. Podr.: strona odpowiedzialna.","ex":"R jak „Robi”: fachowiec, który kładzie kafelki. Wykonawców może być kilku.","org":""}},"fz-B-039":{"id":"fz-B-039","typ":"egzamin","s":"EN-02-25","t":"Ile ról oznacza się literą A (odpowiedzialny decyzyjnie) w tabeli RACI?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 89","FW-PL s. 93"],"r":null,"zap":"","scen":"","o":[{"t":"Kilka – wszystkich, którzy wykonują zadanie","ok":false,"w":"To R; wykonawców może być kilku."},{"t":"Wszystkich, których się konsultuje","ok":false,"w":"Konsultowani to C."},{"t":"Dwie – zawsze prezesa i CEO","ok":false,"w":"A to jedna wskazana rola; może nią być osoba lub organ."},{"t":"Jedną – rolę ostatecznie odpowiedzialną za powodzenie zadania","ok":true,"w":"Tak: gdy odpowiadają wszyscy, nie odpowiada nikt."}],"fz":{"h":"RACI","p":"P1","pulapka":true,"n":"egzamin: RACI · podr.: RACI · EN: Responsible, Accountable, Consulted, Informed","q":"Co oznacza RACI? / RACI: co oznacza A – Odpowiedzialny decyzyjnie?","a":"R odpowiedzialny (wykonuje i zapewnia realizację), A rozliczany (jedna rola ostatecznie odpowiedzialna za powodzenie, z uprawnieniami; osoba lub organ), C konsultowany (dwukierunkowo), I informowany (jednokierunkowo).\nKto odpowiada za powodzenie zadania? Osoba lub jednostka ostatecznie odpowiedzialna. Podr.: strona rozliczana.","ex":"Remont: R – fachowiec, który kładzie kafelki; A – właściciel mieszkania, który ostatecznie odpowiada za efekt (jedna rola, np. też wspólnota); C – sąsiad, z którym ustalasz; I – administracja, którą powiadamiasz.\nA to ten, kto się rozlicza: właściciel mieszkania odpowiada za efekt remontu, choć sam nie kładzie płytek (to R). Jedna wskazana rola, bo gdy odpowiadają wszyscy, nie odpowiada nikt.","org":"A: właściciel procesu DSS02; R: dyżurny."}},"fz-B-040":{"id":"fz-B-040","typ":"egzamin","s":"EN-02-25","t":"Jaki rodzaj komunikacji dotyczy roli C (konsultowany) w RACI?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 90"],"r":null,"zap":"","scen":"","o":[{"t":"Dwukierunkowa – zasięga się opinii i słucha odpowiedzi","ok":true,"w":"Tak: C zapewnia dane wejściowe."},{"t":"Jednokierunkowa – tylko powiadomienie o postępach","ok":false,"w":"To rola I – informowany."},{"t":"Żadna – C samodzielnie wykonuje zadanie","ok":false,"w":"Zadanie wykonuje R."},{"t":"Rozliczeniowa – C odpowiada ostatecznie za powodzenie","ok":false,"w":"To rola A."}],"fz":{"h":"RACI: C – Konsultant","p":"P1","pulapka":true,"n":"EN: Consulted","q":"RACI: co oznacza C – Konsultant?","a":"Kto zapewnia dane wejściowe? Osoby, których opinii się zasięga; komunikacja dwukierunkowa.","ex":"C jak „Co sądzisz?”: sąsiad, z którym ustalasz godziny wiercenia. Rozmowa w obie strony – pytasz i słuchasz odpowiedzi.","org":""}},"fz-B-041":{"id":"fz-B-041","typ":"egzamin","s":"EN-02-25","t":"Kogo oznacza litera I w tabeli RACI?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 92"],"r":null,"zap":"","scen":"","o":[{"t":"Osoby zapewniające dane wejściowe w rozmowie dwukierunkowej","ok":false,"w":"To C – konsultowany."},{"t":"Rolę ostatecznie odpowiedzialną za powodzenie zadania","ok":false,"w":"To A – odpowiedzialny decyzyjnie."},{"t":"Osoby informowane o postępach i efektach – komunikacja jednokierunkowa","ok":true,"w":"Tak: wiadomość idzie w jedną stronę."},{"t":"Role najbardziej zaangażowane operacyjnie w wykonanie działań","ok":false,"w":"To R – odpowiedzialny wykonawczo."}],"fz":{"h":"RACI: I – Informowany","p":"P1","pulapka":true,"n":"EN: Informed","q":"RACI: co oznacza I – Informowany?","a":"Kto otrzymuje informacje? Osoby informowane o postępach i efektach; komunikacja jednokierunkowa.","ex":"I jak „Informacja”: administracja dostaje kartkę, że w środę remont. Wiadomość idzie tylko w jedną stronę, nikt nie czeka na odpowiedź.","org":""}},"fz-B-042":{"id":"fz-B-042","typ":"egzamin","s":"PR-01-04","t":"Który proces APO zarządza umowami o świadczenie usług?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 33"],"r":null,"zap":"","scen":"","o":[{"t":"APO09","ok":true,"w":"Tak: APO09 Zarządzanie umowami o świadczenie usług."},{"t":"APO10","ok":false,"w":"APO10 to Zarządzanie dostawcami."},{"t":"APO08","ok":false,"w":"APO08 to Zarządzanie relacjami."},{"t":"APO11","ok":false,"w":"APO11 to Zarządzanie jakością."}],"fz":{"h":"13 procesów APO","p":"P2","pulapka":false,"n":"EN: APO01–APO13: Manage IT Mgmt Framework, Strategy, Enterprise Architecture, Innovation, Portfolio, Budget and Costs, Human Resources, Relationships, Service Agreements, Suppliers, Quality, Risk, Security","q":"Podaj 13 procesów domeny APO (Dostosuj, Planuj i Organizuj).","a":"Każdy to „Zarządzanie…”: APO01 strukturą ramową zarządzania IT (podr. metodyką); APO02 strategią; APO03 architekturą korporacyjną; APO04 innowacjami; APO05 portfelem projektów; APO06 budżetem i kosztami; APO07 zasobami ludzkimi; APO08 relacjami; APO09 umowami o świadczenie usług; APO10 dostawcami; APO11 jakością; APO12 ryzykiem; APO13 bezpieczeństwem.","ex":"APO to biuro restauracji: plan, karta dań, budżet, kadry, umowy z dostawcami, kontrola jakości, ryzyko i zamki w drzwiach.","org":""}},"fz-B-043":{"id":"fz-B-043","typ":"egzamin","s":"PR-01-04","t":"Czym zarządza proces BAI08?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 33"],"r":null,"zap":"","scen":"","o":[{"t":"Konfiguracją","ok":false,"w":"To BAI10."},{"t":"Wiedzą","ok":true,"w":"Tak: BAI08 Zarządzanie wiedzą."},{"t":"Zasobami (aktywami)","ok":false,"w":"To BAI09."},{"t":"Definiowaniem wymagań","ok":false,"w":"To BAI02."}],"fz":{"h":"10 procesów BAI","p":"P2","pulapka":false,"n":"EN: BAI01–BAI10: Manage Programmes and Projects, Requirements Definition, Solutions Identification and Build, Availability and Capacity, Organisational Change Enablement, Changes, Change Acceptance and Transitioning, Knowledge, Assets, Configuration","q":"Podaj 10 procesów domeny BAI (Twórz, Nabywaj i Wdrażaj).","a":"Każdy to „Zarządzanie…”: BAI01 programami i projektami; BAI02 definiowaniem wymagań; BAI03 identyfikacją i budowaniem rozwiązań; BAI04 dostępnością i pojemnością; BAI05 wdrażaniem zmian organizacyjnych; BAI06 zmianami; BAI07 procesem akceptacji zmian i przejścia; BAI08 wiedzą; BAI09 zasobami (EN assets, czyli aktywami); BAI10 konfiguracją.","ex":"BAI to budowa nowej kuchni: projekt, lista wymagań, montaż sprzętu, odbiór, przeszkolenie kucharzy, spis wyposażenia i jego ustawień.","org":""}},"fz-B-044":{"id":"fz-B-044","typ":"egzamin","s":"PR-01-04","t":"Czym zarządza proces DSS03?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 33"],"r":null,"zap":"","scen":"","o":[{"t":"Zgłoszeniami serwisowymi i incydentami","ok":false,"w":"To DSS02."},{"t":"Ciągłością","ok":false,"w":"To DSS04."},{"t":"Mechanizmami kontrolnymi procesów biznesowych","ok":false,"w":"To DSS06."},{"t":"Problemami","ok":true,"w":"Tak: DSS03 Zarządzanie problemami."}],"fz":{"h":"6 procesów DSS","p":"P2","pulapka":false,"n":"EN: DSS01–DSS06: Manage Operations, Service Requests and Incidents, Problems, Continuity, Security Services, Business Process Controls","q":"Podaj 6 procesów domeny DSS (Dostarczaj, Obsługuj i Wspieraj).","a":"Każdy to „Zarządzanie…”: DSS01 eksploatacją; DSS02 zgłoszeniami serwisowymi i incydentami; DSS03 problemami; DSS04 ciągłością; DSS05 usługami bezpieczeństwa; DSS06 mechanizmami kontrolnymi procesów biznesowych.","ex":"DSS to codzienna praca kuchni: gotowanie, reklamacje, szukanie przyczyn awarii, plan na brak prądu, zamknięta spiżarnia i sprawdzanie rachunków.","org":""}},"fz-B-045":{"id":"fz-B-045","typ":"egzamin","s":"PR-01-04","t":"Jak brzmi nazwa procesu APO07 w podręczniku PL (Rysunek 16)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 33"],"r":null,"zap":"","scen":"","o":[{"t":"Relacje ludzkie","ok":false,"w":"To nieoficjalne spolszczenie z notatek."},{"t":"Zarządzanie zasobami ludzkimi","ok":true,"w":"Tak: tak nazywa APO07 podręcznik."},{"t":"Zarządzanie relacjami","ok":false,"w":"To APO08."},{"t":"Zarządzanie zasobami","ok":false,"w":"To BAI09, proces o aktywach."}],"fz":{"h":"Nieoficjalne nazwy procesów","p":"P2","pulapka":true,"n":"EN: Unofficial PL names vs manual names","q":"„APO07 Relacje ludzkie”, „BAI04 Moc obliczeniowa”, „DSS01 Operacje” – czy to nazwy z podręcznika?","a":"Nie, to nieoficjalne spolszczenia z notatek. Podręcznik PL (Rysunek 16): APO07 Zarządzanie zasobami ludzkimi, BAI04 Zarządzanie dostępnością i pojemnością, DSS01 Zarządzanie eksploatacją. Rozpoznawaj proces po kodzie i sensie.","ex":"Jak potoczne nazwy dań („schabowy”) i nazwy z karty: w zamówieniu liczy się, które to danie, a nie słowo.","org":""}},"fz-B-046":{"id":"fz-B-046","typ":"egzamin","s":"PR-01-03,PR-01-04","t":"Czy BAI09 „Zarządzanie zasobami” i EDM04 „Zapewnienie optymalizacji zasobów” dotyczą tych samych zasobów?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 33"],"r":null,"zap":"","scen":"","o":[{"t":"Tak – to ten sam proces opisany w dwóch domenach","ok":false,"w":"To dwa różne procesy: jeden Zarządzania, drugi Ładu."},{"t":"Tak – oba są procesami Ładu i różnią się tylko numerem","ok":false,"w":"BAI09 należy do Zarządzania."},{"t":"Nie – BAI09 dotyczy aktywów (sprzęt, licencje), a EDM04 optymalnego wykorzystania ludzi, finansów, infrastruktury i informacji","ok":true,"w":"Tak: assets kontra resources."},{"t":"Nie – BAI09 dotyczy ludzi i finansów, a EDM04 sprzętu i licencji","ok":false,"w":"Odwrotnie: aktywa to BAI09, a zasoby ludzkie i finansowe – EDM04."}],"fz":{"h":"BAI09 a EDM04","p":"P2","pulapka":true,"n":"EN: BAI09 Manage Assets vs EDM04 Ensure Resource Optimisation","q":"BAI09 „Zarządzanie zasobami” a EDM04 „Zapewnienie optymalizacji zasobów” – te same zasoby?","a":"Nie. BAI09 to proces Zarządzania aktywami (EN assets): sprzęt, licencje, ich koszty i wymiana. EDM04 to proces Ładu zapewniający optymalne wykorzystanie zasobów (EN resources): ludzi, finansów, infrastruktury i informacji.","ex":"Spis garnków w magazynie to BAI09. Pilnowanie przez właściciela, by ludzie, budżet i kuchnia były dobrze wykorzystane, to proces EDM04.","org":""}},"fz-B-047":{"id":"fz-B-047","typ":"egzamin","s":"PR-01-04","t":"Który proces odpowiada za codzienną ochronę, np. dostęp, uprawnienia i ochronę przed złośliwym oprogramowaniem?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 33"],"r":null,"zap":"","scen":"","o":[{"t":"APO13 Zarządzanie bezpieczeństwem","ok":false,"w":"APO13 ustala i utrzymuje podejście do bezpieczeństwa (domena planowania)."},{"t":"DSS06 Zarządzanie mechanizmami kontrolnymi procesów biznesowych","ok":false,"w":"DSS06 to kontrole wbudowane w procesy biznesowe."},{"t":"EDM03 Zapewnienie optymalizacji ryzyka","ok":false,"w":"EDM03 to proces Ładu ustalający apetyt na ryzyko."},{"t":"DSS05 Zarządzanie usługami bezpieczeństwa","ok":true,"w":"Tak: DSS05 to codzienna ochrona w domenie wykonania."}],"fz":{"h":"APO13 a DSS05","p":"P2","pulapka":true,"n":"EN: APO13 Manage Security vs DSS05 Manage Security Services","q":"APO13 a DSS05 – oba o bezpieczeństwie. Czym się różnią?","a":"APO13 Zarządzanie bezpieczeństwem (domena planowania): ustala i utrzymuje podejście do bezpieczeństwa informacji. DSS05 Zarządzanie usługami bezpieczeństwa (domena wykonania): codzienna ochrona, np. dostęp, uprawnienia, ochrona przed złośliwym oprogramowaniem.","ex":"Plan ochrony budynku to APO13. Ochroniarz przy drzwiach i zamykanie zamków każdego wieczoru to DSS05.","org":""}},"fz-B-048":{"id":"fz-B-048","typ":"egzamin","s":"PR-01-04","t":"Który proces dotyczy ludzkiej strony zmiany (Organisational Change Enablement)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 33"],"r":null,"zap":"","scen":"","o":[{"t":"BAI05 Zarządzanie wdrażaniem zmian organizacyjnych","ok":true,"w":"Tak: BAI05 to przekonywanie ludzi do zmiany."},{"t":"BAI06 Zarządzanie zmianami","ok":false,"w":"BAI06 obsługuje wnioski o zmianę."},{"t":"BAI07 Zarządzanie procesem akceptacji zmian i przejścia","ok":false,"w":"BAI07 to testy, odbiór i przekazanie do użytku."},{"t":"BAI03 Zarządzanie identyfikacją i budowaniem rozwiązań","ok":false,"w":"BAI03 dotyczy budowania rozwiązań, nie ludzkiej strony zmiany."}],"fz":{"h":"BAI05, BAI06, BAI07","p":"P2","pulapka":true,"n":"EN: BAI05 Change Enablement vs BAI06 Changes vs BAI07 Change Acceptance and Transitioning","q":"BAI05, BAI06, BAI07 – trzy procesy o zmianach. Czym się różnią?","a":"BAI05 Zarządzanie wdrażaniem zmian organizacyjnych: ludzka strona zmiany (EN Organisational Change Enablement). BAI06 Zarządzanie zmianami: obsługa wniosków o zmianę. BAI07 Zarządzanie procesem akceptacji zmian i przejścia: testy, odbiór, przekazanie do użytku.","ex":"Wymiana pieca: przekonujesz kucharzy (BAI05), zatwierdzasz zakup i montaż (BAI06), robisz próbny obiad i odbiór (BAI07).","org":""}},"fz-B-049":{"id":"fz-B-049","typ":"egzamin","s":"PR-01-03,PR-01-04","t":"Który proces ustala apetyt na ryzyko i pilnuje, by go nie przekroczyć?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 33","FW-PL s. 68"],"r":null,"zap":"","scen":"","o":[{"t":"APO12 Zarządzanie ryzykiem","ok":false,"w":"APO12 to bieżące rozpoznawanie, ocena i ograniczanie ryzyka IT."},{"t":"EDM03 Zapewnienie optymalizacji ryzyka","ok":true,"w":"Tak: to proces Ładu."},{"t":"APO13 Zarządzanie bezpieczeństwem","ok":false,"w":"APO13 ustala podejście do bezpieczeństwa informacji."},{"t":"MEA03 (zgodność z wymogami zewnętrznymi)","ok":false,"w":"MEA03 monitoruje zgodność z wymogami zewnętrznymi."}],"fz":{"h":"EDM03 a APO12","p":"P2","pulapka":true,"n":"EN: EDM03 Ensure Risk Optimisation vs APO12 Manage Risk","q":"EDM03 a APO12 – oba o ryzyku. Czym się różnią?","a":"EDM03 Zapewnienie optymalizacji ryzyka to Ład: ustalenie apetytu na ryzyko i pilnowanie, by go nie przekroczyć. APO12 Zarządzanie ryzykiem to Zarządzanie: bieżące rozpoznawanie, ocena i ograniczanie ryzyka IT.","ex":"Właściciel restauracji decyduje, ile ryzyka przyjmuje (EDM03). Szef kuchni na co dzień pilnuje gazu, noży i dat ważności (APO12).","org":""}},"fz-B-050":{"id":"fz-B-050","typ":"egzamin","s":"PR-01-04","t":"Czym zajmuje się MEA02 w odróżnieniu od DSS06?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 33","FW-PL s. 89","FW-PL s. 93"],"r":null,"zap":"","scen":"","o":[{"t":"Kontrolami wbudowanymi w codzienne procesy biznesowe","ok":false,"w":"To DSS06."},{"t":"Zgodnością z wymogami zewnętrznymi","ok":false,"w":"To MEA03."},{"t":"Monitorowaniem i oceną całego systemu kontroli wewnętrznej","ok":true,"w":"Tak: MEA02 sprawdza, czy cały system kontroli działa."},{"t":"Monitorowaniem wydajności i zgodności","ok":false,"w":"To MEA01."}],"fz":{"h":"DSS06 a MEA02","p":"P2","pulapka":true,"n":"EN: DSS06 Business Process Controls vs MEA02 System of Internal Control","q":"DSS06 a MEA02 – czym różnią się mechanizmy kontrolne procesów biznesowych od systemu kontroli wewnętrznej?","a":"DSS06: kontrole wbudowane w codzienne procesy biznesowe (polityki, procedury, praktyki dające rozsądną pewność, że proces osiągnie cel). MEA02: monitorowanie i ocena całego systemu kontroli wewnętrznej, czyli polityk, planów, procedur i struktur chroniących cele organizacji.","ex":"Kasjer liczy pieniądze przy każdym rachunku (DSS06). Raz w miesiącu ktoś sprawdza, czy cały system liczenia działa (MEA02).","org":""}},"fz-B-051":{"id":"fz-B-051","typ":"egzamin","s":"PR-02-12","t":"Na jakie kategorie dzielą się cele aktywatora?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 28"],"r":null,"zap":"","scen":"","o":[{"t":"Korzyści, ryzyko i zasoby","ok":false,"w":"To elementy celu Ładu „Tworzenie wartości”."},{"t":"Interesariusze, cele, cykl życia i dobre praktyki","ok":false,"w":"To cztery wymiary aktywatora."},{"t":"Planowanie, budowanie, użytkowanie i wycofanie","ok":false,"w":"To etapy cyklu życia aktywatora."},{"t":"Jakość wewnętrzna, jakość kontekstowa, dostęp i bezpieczeństwo","ok":true,"w":"Tak: podręcznik mówi „jakość rzeczywista” zamiast „wewnętrzna”."}],"fz":{"h":"Cele aktywatora","p":"P1","pulapka":false,"n":"≠ TŁUMACZENIE · egzamin: jakość wewnętrzna, kontekstowa, dostęp i bezpieczeństwo · podr.: jakość rzeczywista, kontekstowa, dostęp i bezpieczeństwo · EN: enabler goals: intrinsic, contextual, access and security","q":"Na jakie kategorie dzieli się cele aktywatora?","a":"Jakość wewnętrzna, jakość kontekstowa, dostęp i bezpieczeństwo.","ex":"Jak ocena jedzenia: wewnętrzna – czy samo w sobie świeże i dobre; kontekstowa – czy pasuje do okazji; dostęp i bezpieczeństwo – czy podane na czas i tylko zamawiającemu.","org":"rejestr: dane prawdziwe, kompletne, dostępne dla uprawnionych."}},"fz-B-052":{"id":"fz-B-052","typ":"egzamin","s":"PR-02-12","t":"Do której kategorii celów aktywatora należą istotność, kompletność, aktualność i zrozumiałość?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 29"],"r":null,"zap":"","scen":"","o":[{"t":"Jakość kontekstowa","ok":true,"w":"Tak: te cechy opisują jakość kontekstową."},{"t":"Jakość wewnętrzna","ok":false,"w":"Jakość wewnętrzna to dokładność i obiektywność."},{"t":"Dostęp i bezpieczeństwo","ok":false,"w":"Ta kategoria to dostępność w razie potrzeby i ochrona."},{"t":"Dobre praktyki","ok":false,"w":"To wymiar aktywatora, nie kategoria celów."}],"fz":{"h":"Kategorie celów aktywatora","p":"P1","pulapka":false,"n":"EN: Intrinsic quality, contextual quality, accessibility and security","q":"Jakie są kategorie celów aktywatora?","a":"Jakość wewnętrzna (podr. rzeczywista): dokładność, obiektywność. Jakość kontekstowa: istotność, kompletność, aktualność, zrozumiałość. Dostęp i Bezpieczeństwo: dostępność w razie potrzeby, ochrona wyników.","ex":"Jak informacja w gazecie: wewnętrzna – czy prawdziwa i bezstronna; kontekstowa – czy na temat, pełna i świeża; dostęp i bezpieczeństwo – czy dostaniesz ją, gdy trzeba, i czy chroniona.","org":""}},"fz-B-053":{"id":"fz-B-053","typ":"egzamin","s":"PR-02-12","t":"Które etapy tworzą cykl życia aktywatora?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 28","FW-PL s. 29"],"r":null,"zap":"","scen":"","o":[{"t":"Siedem faz wdrożenia, od „Jakie są wyznaczniki?” do „Jak utrzymać motywację?”","ok":false,"w":"To fazy cyklu życia wdrożenia; karta ostrzega przed pomyleniem."},{"t":"Planowanie, projektowanie, budowanie/nabywanie, użytkowanie, ocena/monitorowanie, aktualizacja/wycofanie","ok":true,"w":"Tak: to sześć etapów cyklu życia aktywatora."},{"t":"Ocena, kierowanie i monitorowanie","ok":false,"w":"To działania Ładu (EDM)."},{"t":"Planuj, Twórz, Wykonuj i Monitoruj","ok":false,"w":"To obszary działań Zarządzania (PBRM)."}],"fz":{"h":"Cykl życia aktywatora","p":"P1","pulapka":true,"n":"≠ TŁUMACZENIE · egzamin: cykl życia aktywatora · podr.: cykl życia czynnika umożliwiającego · EN: enabler life cycle","q":"Jakie etapy ma cykl życia aktywatora? / Podaj fazy cyklu życia aktywatora.","a":"Planowanie, projektowanie, budowanie/nabywanie/tworzenie/wdrażanie, użytkowanie/eksploatacja, ocena/monitorowanie, aktualizacja/wycofanie. ≠ 7 faz wdrożenia.\nPlanowanie → Projektowanie → Budowanie/nabywanie/tworzenie/wdrażanie → Użytkowanie/eksploatacja → Ocena/monitorowanie → Aktualizacja/pozbywanie się.","ex":"Jak samochód: wybór (planowanie), projekt, kupno (budowanie/nabywanie), jazda (użytkowanie), przegląd (ocena), naprawa albo złomowanie (aktualizacja/wycofanie). Uwaga: to nie 7 faz wdrożenia.\nJak lodówka: wybierasz, jakiej potrzebujesz (planowanie), projekt, kupno, używanie, sprawdzanie, czy dobrze chłodzi, aż w końcu naprawa albo wywiezienie na złom.","org":"system zgłoszeń: zaplanowany, zbudowany, używany, oceniany."}},"fz-B-054":{"id":"fz-B-054","typ":"egzamin","s":"PR-02-12","t":"Co obejmuje wymiar Dobre praktyki aktywatora?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 28","FW-PL s. 29"],"r":null,"zap":"","scen":"","o":[{"t":"Wewnętrznych i zewnętrznych interesariuszy z ich rolami","ok":false,"w":"To wymiar Interesariusze."},{"t":"Etapy od planowania do wycofania","ok":false,"w":"To wymiar Cykl życia."},{"t":"Przykłady lub sugestie optymalnego wdrożenia aktywatora wraz z produktami pracy (wejściami i wyjściami)","ok":true,"w":"Tak: dla części aktywatorów korzysta się też z innych standardów."},{"t":"Mierniki osiągnięcia celów aktywatora","ok":false,"w":"To wskaźniki opóźnione."}],"fz":{"h":"Dobre praktyki","p":"P2","pulapka":false,"n":"egzamin: dobre praktyki · podr.: dobre praktyki · EN: good practices","q":"Co obejmuje wymiar dobrych praktyk? / Czym jest wymiar Dobre praktyki aktywatora?","a":"Praktyki wspierające osiągnięcie celów aktywatora oraz przykłady produktów pracy i wejść/wyjść.\nPrzykładami lub sugestiami optymalnego wdrożenia aktywatora, z wymaganymi produktami pracy (wejściami i wyjściami). Dla części aktywatorów korzysta się z innych standardów.","ex":"Sprawdzone sposoby, jak robić coś dobrze, jak porady doświadczonej kucharki, plus wzory tego, co trzeba mieć na start i co ma powstać (wejścia i wyjścia).\nSprawdzone porady, jak zrobić coś najlepiej, jak przepis od babci, plus lista, co trzeba mieć na start i co ma wyjść. Czasem przepis bierze się z innej książki (standardu).","org":"procedura DSS02 oparta na ITIL."}},"fz-B-055":{"id":"fz-B-055","typ":"egzamin","s":"PR-02-12","t":"Kim są interesariusze aktywatora?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 28"],"r":null,"zap":"","scen":"","o":[{"t":"Wyłącznie zarząd i kadra kierownicza","ok":false,"w":"Interesariusze mogą być wewnętrzni i zewnętrzni."},{"t":"Wyłącznie klienci zewnętrzni","ok":false,"w":"Są też interesariusze wewnętrzni."},{"t":"Tylko role wpisane jako A w tabeli RACI","ok":false,"w":"A to jedna rola rozliczana, a interesariuszem jest każdy, kto ma udział w aktywatorze."},{"t":"Wszyscy, którzy mają w nim udział – wewnętrzni i zewnętrzni, z rolami i interesami","ok":true,"w":"Tak: każdy, kogo aktywator dotyczy."}],"fz":{"h":"Interesariusze aktywatora","p":"P2","pulapka":false,"n":"egzamin: interesariusze · podr.: interesariusze · EN: stakeholders","q":"Kim są interesariusze aktywatora?","a":"Ci, którzy mają w nim udział: wewnętrzni i zewnętrzni, z rolami i interesami.","ex":"Interesariusz = każdy, kogo coś dotyczy albo komu na tym zależy. Przy szkolnej stołówce: kucharki, uczniowie, rodzice, sanepid – każdy chce czegoś innego.","org":"procedura: dyżurni, komendy, kierownictwo, audyt."}},"fz-B-056":{"id":"fz-B-056","typ":"egzamin","s":"PR-01-05","t":"Które z poniższych NIE jest jednym z czterech pytań zarządzania wydajnością aktywatora?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 29"],"r":null,"zap":"","scen":"","o":[{"t":"Czy uwzględniono potrzeby interesariuszy?","ok":false,"w":"To pytanie 1."},{"t":"Czy osiągnięto cele aktywatora?","ok":false,"w":"To pytanie 2."},{"t":"Czy stosowane są dobre praktyki?","ok":false,"w":"To pytanie 4."},{"t":"Czy aktywator ma uzasadnienie biznesowe?","ok":true,"w":"Uzasadnienie biznesowe dotyczy wdrożenia; brakującym pytaniem jest „Czy zadbano o zarządzanie cyklem życia?”."}],"fz":{"h":"Cztery pytania zarządzania wydajnością aktywatora","p":"P1","pulapka":false,"n":"EN: Enabler performance management – 4 questions","q":"Podaj cztery pytania Zarządzania wydajnością aktywatora. / Jakie dwa aspekty obejmuje pomiar aktywatora?","a":"1. Czy uwzględniono potrzeby interesariuszy? 2. Czy osiągnięto cele aktywatora? 3. Czy zadbano o zarządzanie cyklem życia? 4. Czy stosowane są dobre praktyki?\nCzy potrzeby interesariuszy są spełnione (cele osiągnięte)? Czy aktywatorem dobrze się zarządza (cykl życia, dobre praktyki)? Pełne cztery pytania – na karcie o zarządzaniu wydajnością aktywatora.","ex":"Dieta: 1. czy rodzina jest zadowolona, 2. czy schudłem – to wynik. 3. czy dbam o plan od początku do końca, 4. czy trzymam się przepisów – to sposób działania.\nJak przy diecie: czy schudłem (cel osiągnięty)? I czy trzymam się planu posiłków (dobrze tym zarządzam)? Pierwsze mierzą wskaźniki opóźnione, drugie wiodące.","org":""}},"fz-B-057":{"id":"fz-B-057","typ":"egzamin","s":"PR-02-12","t":"Czy aktywator opisuje się w oderwaniu od innych aktywatorów?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 28"],"r":null,"zap":"","scen":"","o":[{"t":"Nie – model aktywatora uwzględnia jego zależności od pozostałych (Zasada 4)","ok":true,"w":"Tak: aktywator opisuje się razem z tym, od czego zależy."},{"t":"Tak – każdy aktywator ma własny, niezależny model","ok":false,"w":"Model uwzględnia powiązania z innymi aktywatorami."},{"t":"Tak – powiązania opisuje się tylko dla procesów","ok":false,"w":"Powiązania dotyczą każdego aktywatora."},{"t":"Nie – ale powiązania dotyczą tylko aktywatorów będących zasobami","ok":false,"w":"Model uwzględnia zależności od wszystkich pozostałych aktywatorów."}],"fz":{"h":"Powiązania z innymi aktywatorami","p":"P1","pulapka":false,"n":"egzamin: powiązania · podr.: powiązania · EN: interconnected enablers","q":"Czy aktywator opisuje się w oderwaniu od innych?","a":"Nie. Model aktywatora uwzględnia jego zależności od pozostałych (Zasada 4).","ex":"Jak straż pożarna: wóz bez strażaków, a strażacy bez wody i dyspozytora nic nie zdziałają. Dlatego aktywator opisuje się razem z tym, od czego zależy.","org":"procedura potrzebuje dyżurnych, rejestru i systemu."}},"fz-B-058":{"id":"fz-B-058","typ":"egzamin","s":"PR-02-13","t":"Na które z czterech pytań zarządzania wydajnością aktywatora odpowiadają wskaźniki opóźnione (podr.: następujące)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 29"],"r":null,"zap":"","scen":"","o":[{"t":"Na pytania 3 i 4 – o cykl życia i dobre praktyki","ok":false,"w":"Na te odpowiadają wskaźniki wiodące."},{"t":"Na pytania 1 i 2 – o potrzeby interesariuszy i cele aktywatora","ok":true,"w":"Tak: mierzą rzeczywisty wynik."},{"t":"Tylko na pytanie 4 – o dobre praktyki","ok":false,"w":"Dobre praktyki mierzą wskaźniki wiodące."},{"t":"Na wszystkie cztery pytania jednocześnie","ok":false,"w":"Pytania dzielą się: 1–2 opóźnione, 3–4 wiodące."}],"fz":{"h":"Wskaźniki opóźnione","p":"P1","pulapka":true,"n":"≠ TŁUMACZENIE · egzamin: wskaźniki opóźnione · podr.: wskaźniki następujące · EN: lag indicators","q":"Co mierzą wskaźniki opóźnione? / Czym są wskaźniki opóźnione?","a":"Czy cele aktywatora zostały osiągnięte (wynik). Zawsze względem konkretnego celu.\nMiernikami osiągnięcia celów – odpowiadają na pytania 1 i 2 (potrzeby interesariuszy, cele aktywatora), czyli o rzeczywisty wynik. Podr.: wskaźniki następujące.","ex":"Jak waga po miesiącu diety: pokazuje wynik dopiero po fakcie. Haczyk: opóźniony = „po czasie”, mówi, czy się udało.\nJak waga na koniec miesiąca: pokazuje wynik po fakcie, czyli odpowiada na pytania 1 i 2. Pułapka: podręcznik mówi „wskaźniki następujące”.","org":"łączna przerwa usług krytycznych w roku."}},"fz-B-059":{"id":"fz-B-059","typ":"egzamin","s":"PR-02-13","t":"Co mierzą wskaźniki wiodące (podr.: wyprzedzające)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 29"],"r":null,"zap":"","scen":"","o":[{"t":"Czy cele aktywatora zostały już osiągnięte","ok":false,"w":"To mierzą wskaźniki opóźnione."},{"t":"Wynik po fakcie, np. łączną przerwę usług krytycznych w roku","ok":false,"w":"To przykład wskaźnika opóźnionego."},{"t":"Czy aktywatorem dobrze się zarządza (stosowanie praktyk), co zapowiada wynik","ok":true,"w":"Tak: odpowiadają na pytania 3 i 4."},{"t":"Apetyt na ryzyko ustalony przez Ład","ok":false,"w":"Apetyt na ryzyko ustala proces EDM03, a nie wskaźnik."}],"fz":{"h":"Wskaźniki wiodące","p":"P1","pulapka":true,"n":"≠ TŁUMACZENIE · egzamin: wskaźniki wiodące · podr.: wskaźniki wyprzedzające · EN: lead indicators","q":"Co mierzą wskaźniki wiodące? / Czym są wskaźniki wiodące?","a":"Czy aktywatorem dobrze się zarządza (przebieg), co zapowiada wynik. Zawsze względem konkretnego celu.\nMiernikami stosowania praktyk – odpowiadają na pytania 3 i 4 (cykl życia, dobre praktyki), czyli o funkcjonowanie samego aktywatora. Podr.: wskaźniki wyprzedzające.","ex":"Jak zapisywanie zjedzonych posiłków w trakcie diety: zanim staniesz na wadze, widzisz, czy idziesz w dobrą stronę. Haczyk: wiodący = „prowadzi przed wynikiem”, zapowiada go.\nJak codzienne zapisywanie posiłków: widzisz, czy robisz to dobrze, zanim wynik się pojawi; to pytania 3 i 4. Pułapka: podręcznik mówi „wskaźniki wyprzedzające”.","org":"odsetek zgłoszeń w jednym rejestrze."}},"fz-B-060":{"id":"fz-B-060","typ":"egzamin","s":"PR-02-12","t":"Jakie są cztery wspólne wymiary aktywatora?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 28"],"r":null,"zap":"","scen":"","o":[{"t":"Jakość wewnętrzna, jakość kontekstowa, dostęp, bezpieczeństwo","ok":false,"w":"To kategorie celów aktywatora."},{"t":"Planuj, Twórz, Wykonuj, Monitoruj","ok":false,"w":"To obszary działań Zarządzania (PBRM)."},{"t":"Zasady, Procesy, Struktury organizacyjne, Kultura","ok":false,"w":"To część z siedmiu kategorii aktywatorów."},{"t":"Interesariusze, cele, cykl życia, dobre praktyki","ok":true,"w":"Tak: Rysunek 13."}],"fz":{"h":"Wymiary aktywatora","p":"P1","pulapka":false,"n":"≠ TŁUMACZENIE · egzamin: wymiary aktywatora · podr.: wymiary czynnika umożliwiającego · EN: enabler dimensions","q":"Jakie są cztery wymiary aktywatora? / Podaj cztery wspólne wymiary aktywatora.","a":"Interesariusze, cele, cykl życia, dobre praktyki (Rys. 13).\n1. Interesariusze. 2. Cele. 3. Cykl życia. 4. Dobre praktyki.","ex":"Cztery pytania o każdą rzecz: kto ją ma i komu służy (interesariusze), po co jest (cele), od narodzin do końca (cykl życia), jak robić ją dobrze (dobre praktyki). Haczyk: I-C-C-D.\nCztery pytania o każdą rzecz: dla kogo (interesariusze), po co (cele), od narodzin do końca (cykl życia), jak robić to dobrze (dobre praktyki). Haczyk: „Kto, Po co, Kiedy, Jak”.","org":""}},"fz-B-061":{"id":"fz-B-061","typ":"egzamin","s":"PR-01-02","t":"Który z poniższych NIE jest jedną z siedmiu kategorii aktywatorów COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 27"],"r":null,"zap":"","scen":"","o":[{"t":"Kultura, Etyka i Zachowanie","ok":false,"w":"To kategoria nr 4."},{"t":"Interesariusze","ok":true,"w":"To jeden z czterech wymiarów aktywatora, a nie kategoria aktywatora."},{"t":"Informacja","ok":false,"w":"To kategoria nr 5."},{"t":"Ludzie, Umiejętności i Kompetencje","ok":false,"w":"To kategoria nr 7."}],"fz":{"h":"Siedem kategorii aktywatorów","p":"P1","pulapka":false,"n":"EN: Principles, Policies and Frameworks; Processes; Organisational Structures; Culture, Ethics and Behaviour; Information; Services, Infrastructure and Applications; People, Skills and Competencies","q":"Podaj siedem kategorii aktywatorów (nazwy egzaminacyjne).","a":"1. Zasady, Polityki i Struktury ramowe. 2. Procesy. 3. Struktury organizacyjne. 4. Kultura, Etyka i Zachowanie. 5. Informacja. 6. Usługi, Infrastruktura i Aplikacje. 7. Ludzie, Umiejętności i Kompetencje.","ex":"Siedem rzeczy, bez których restauracja nie działa: regulamin, przepisy kuchenne, podział stanowisk, atmosfera, informacja, sprzęt i lokal, ludzie z umiejętnościami. Haczyk: od zasad do ludzi.","org":""}},"fz-B-063":{"id":"fz-B-063","typ":"egzamin","s":"PR-02-12","t":"Po co aktywatory mają wspólne wymiary?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 28"],"r":null,"zap":"","scen":"","o":[{"t":"Pozwalają ocenić poziom zdolności każdego procesu","ok":false,"w":"Ocena zdolności to osobny program oceny, nie cel wspólnych wymiarów."},{"t":"Pozwalają pominąć powiązania między aktywatorami","ok":false,"w":"Przeciwnie: pomagają ogarnąć te powiązania."},{"t":"Pozwalają opisać wszystkie aktywatory w jeden uporządkowany sposób i ogarnąć ich wzajemne powiązania","ok":true,"w":"Tak: i ułatwiają osiągnięcie dobrych wyników."},{"t":"Zastępują kaskadę celów","ok":false,"w":"Kaskada celów to osobne narzędzie; wymiary jej nie zastępują."}],"fz":{"h":"Po co wspólne wymiary","p":"P2","pulapka":false,"n":"EN: Purpose of common enabler dimensions","q":"Po co aktywatory mają wspólne wymiary?","a":"Pozwalają opisywać wszystkie aktywatory w jeden, prosty i uporządkowany sposób; pomagają ogarnąć ich złożone wzajemne powiązania; ułatwiają osiągnięcie dobrych wyników.","ex":"Jak jeden formularz dla wszystkich urządzeń w domu: każde opisujesz tak samo, więc łatwiej porównać i zobaczyć, jak ze sobą współpracują.","org":""}},"fz-C-001":{"id":"fz-C-001","typ":"egzamin","s":"PR-01-02","t":"Czym jest aktywator w COBIT 5 i ile jest ich kategorii?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 27"],"r":null,"zap":"","scen":"","o":[{"t":"Wszystko, co pomaga osiągnąć cele organizacji; kategorii jest 7","ok":true,"w":"Tak definiuje aktywator fiszka: 7 kategorii, cele z kaskady celów."},{"t":"Wszystko, co pomaga osiągnąć cele organizacji; kategorii jest 5","ok":false,"w":"Pięć to liczba zasad COBIT 5, aktywatorów jest 7 kategorii."},{"t":"Wyłącznie zasoby IT organizacji; kategorii jest 7","ok":false,"w":"Aktywatorami są też np. kultura, polityki i struktury, nie tylko zasoby IT."},{"t":"Proces z Referencyjnego Modelu Procesu; kategorii jest 37","ok":false,"w":"Procesy to tylko jedna z 7 kategorii aktywatorów; 37 to liczba procesów."}],"fz":{"h":"Aktywator","p":"P1","pulapka":false,"n":"egzamin: aktywator · podr.: czynnik umożliwiający · EN: enabler","q":"Czym jest aktywator i ile jest kategorii?","a":"Wszystko, co pomaga osiągnąć cele organizacji. Kategorii jest 7; ich cele wynikają z kaskady celów (krok 4).","ex":"Aktywator to wszystko, dzięki czemu restauracja działa: regulamin, przepisy, stanowiska, atmosfera, zamówienia, sprzęt, kucharze. Siedem po kolei: „Zupa Pomidorowa Smakuje Kucharzom I Uczniom Licealnym”.","org":"w KG PSP: procedura obsługi zgłoszeń, dyżur całodobowy, jeden rejestr zgłoszeń, przeszkoleni dyżurni."}},"fz-C-002":{"id":"fz-C-002","typ":"egzamin","s":"PR-01-02","t":"Jaką rolę pełni aktywator Informacja?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 27"],"r":null,"zap":"","scen":"","o":[{"t":"Jest kluczową jednostką podejmującą decyzje w organizacji","ok":false,"w":"Tak opisuje się Struktury organizacyjne."},{"t":"Zamienia pożądane zachowania w praktyczne wskazówki na co dzień","ok":false,"w":"To rola Zasad, polityk i struktur ramowych."},{"t":"Obejmuje wszystkie informacje tworzone i wykorzystywane przez organizację; bez nich nie da się działać ani sprawować Ładu","ok":true,"w":"To opis roli Informacji z fiszki; w codziennej pracy często jest głównym produktem."},{"t":"Obejmuje infrastrukturę, technologie i aplikacje do przetwarzania informacji","ok":false,"w":"To rola aktywatora Usługi, infrastruktura i aplikacje."}],"fz":{"h":"Informacja","p":"P1","pulapka":false,"n":"egzamin: informacja · podr.: informacja · EN: information","q":"Jaką rolę pełni Informacja?","a":"Wszystkie informacje, które organizacja tworzy i wykorzystuje. Bez nich nie da się działać ani sprawować Ładu; w codziennej pracy często są głównym produktem.","ex":"W restauracji to bloczki zamówień, menu, rachunki i lista alergenów. Bez kartki z zamówieniem kucharz nie wie, co gotować. Dla banku czy biura podróży informacja bywa wręcz tym, co się sprzedaje.","org":"rejestr zgłoszeń, raport dostępności usług, protokół z omówienia awarii."}},"fz-C-003":{"id":"fz-C-003","typ":"egzamin","s":"PR-01-02","t":"Jak COBIT 5 opisuje znaczenie aktywatora Kultura, etyka i zachowanie?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 27"],"r":null,"zap":"","scen":"","o":[{"t":"W codziennej pracy jest często głównym produktem organizacji","ok":false,"w":"To cecha aktywatora Informacja."},{"t":"Dotyczy ludzi i całej organizacji; to często niedoceniany czynnik sukcesu Ładu i Zarządzania","ok":true,"w":"Tak opisuje ten aktywator fiszka (FW-PL s. 27)."},{"t":"Jest uporządkowanym zbiorem praktyk i działań dających określone wyniki","ok":false,"w":"To definicja Procesów."},{"t":"Dotyczy wyłącznie zachowań kadry kierowniczej","ok":false,"w":"Dotyczy ludzi i całej organizacji, nie tylko kierownictwa."}],"fz":{"h":"Kultura, etyka i zachowanie","p":"P1","pulapka":false,"n":"egzamin: kultura, etyka i zachowanie · podr.: kultura, etyka i zachowanie · EN: culture, ethics and behaviour","q":"Jaką rolę pełni Kultura, etyka i zachowanie?","a":"Dotyczy ludzi i całej organizacji; często niedoceniany czynnik sukcesu Ładu i Zarządzania.","ex":"Atmosfera i nawyki zespołu: czy kelner przyzna się do pomyłki, czy kucharz myje ręce, gdy nikt nie patrzy. Łatwo o niej zapomnieć, a decyduje o wszystkim. Najczęściej pomijana, a bez niej najlepszy regulamin zostaje na papierze.","org":"błędy zgłaszamy bez szukania winnych; dyżurny nie ukrywa awarii przed przełożonym."}},"fz-C-004":{"id":"fz-C-004","typ":"egzamin","s":"PR-01-02","t":"Do czego potrzebny jest aktywator Ludzie, umiejętności i kompetencje?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 27"],"r":null,"zap":"","scen":"","o":[{"t":"Do formalnego spisania wytycznych organu Ładu i kierownictwa","ok":false,"w":"Przekazywanie wytycznych to rola Zasad, polityk i struktur ramowych."},{"t":"Do przetwarzania informacji i dostarczania usług IT","ok":false,"w":"To rola Usług, infrastruktury i aplikacji."},{"t":"Do wyznaczania granic uprawnień decyzyjnych w organizacji","ok":false,"w":"To zakres kontroli, opisujący Struktury organizacyjne."},{"t":"Do skutecznego wykonania działań, podejmowania właściwych decyzji i działań naprawczych","ok":true,"w":"Dokładnie taką rolę przypisuje mu fiszka."}],"fz":{"h":"Ludzie, umiejętności i kompetencje","p":"P1","pulapka":false,"n":"egzamin: ludzie, umiejętności i kompetencje · podr.: ludzie, umiejętności i kompetencje · EN: people, skills and competencies","q":"Jaką rolę pełnią Ludzie, umiejętności i kompetencje?","a":"Potrzebni do skutecznego wykonania działań, podejmowania właściwych decyzji i działań naprawczych.","ex":"Kucharze, kelnerzy i to, co umieją. Najlepszy przepis i sprzęt nic nie dadzą, jeśli nikt nie umie gotować ani zareagować, gdy coś się przypali. Tylko człowiek zdecyduje, co zrobić, gdy zabraknie składnika albo sos się przypali.","org":"dyżurny przeszkolony z procedury i eskalacji; administrator z uprawnieniami do przywracania usług."}},"fz-C-005":{"id":"fz-C-005","typ":"egzamin","s":"PR-01-02","t":"Czy aktywatory COBIT 5 działają niezależnie od siebie?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 27"],"r":null,"zap":"","scen":"","o":[{"t":"Nie – są systemowo powiązane i każdy potrzebuje innych (Zasada 4)","ok":true,"w":"Fiszka: np. proces potrzebuje informacji, struktur, ludzi i kultury."},{"t":"Tak – każdy aktywator wdraża się i ocenia całkowicie osobno","ok":false,"w":"Aktywatory są wzajemnie powiązane; słabość jednego osłabia pozostałe."},{"t":"Tak – od siebie zależą tylko Procesy i Struktury organizacyjne","ok":false,"w":"Powiązania dotyczą wszystkich aktywatorów, nie tylko dwóch."},{"t":"Nie – ale powiązane są wyłącznie aktywatory będące zasobami","ok":false,"w":"Powiązania obejmują wszystkie 7 kategorii, także procesy i kulturę."}],"fz":{"h":"Powiązania aktywatorów","p":"P1","pulapka":false,"n":"egzamin: wzajemnie powiązane aktywatory · podr.: wzajemnie powiązane czynniki · EN: systemic, interconnected enablers","q":"Czy aktywatory działają niezależnie?","a":"Nie. Są systemowo powiązane (Zasada 4): każdy potrzebuje innych, np. proces potrzebuje informacji, struktur, ludzi i kultury.","ex":"Jak naczynia połączone: przepis bez kucharza, produktów i pieca nie da obiadu. Brak lub słabość jednego aktywatora osłabia pozostałe.","org":"procedura bez dyżurnych i rejestru nie zadziała, nawet dobrze spisana."}},"fz-C-006":{"id":"fz-C-006","typ":"egzamin","s":"PR-01-02","t":"Jaką rolę pełnią Procesy?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 27"],"r":null,"zap":"","scen":"","o":[{"t":"Są kluczowymi jednostkami podejmującymi decyzje: osobami, zespołami, komitetami","ok":false,"w":"Tak opisuje się Struktury organizacyjne."},{"t":"Są wzorcem zachowań, poglądów, założeń i postaw","ok":false,"w":"To definicja kultury."},{"t":"Opisują uporządkowany zbiór praktyk i działań, które osiągają określone cele i dają wyniki wspierające cele związane z IT","ok":true,"w":"To definicja roli Procesów z fiszki."},{"t":"Są sposobem, w jaki organ Ładu przekazuje swoje wytyczne","ok":false,"w":"To rola Zasad, polityk i struktur ramowych."}],"fz":{"h":"Procesy","p":"P1","pulapka":false,"n":"egzamin: procesy · podr.: procesy · EN: processes","q":"Jaką rolę pełnią Procesy?","a":"Uporządkowany zbiór praktyk i działań, które osiągają określone cele i dają wyniki wspierające cele związane z IT.","ex":"Proces to przepis na danie: uzgodniony sposób pracy od przyjęcia zamówienia do podania talerza, z określonymi wejściami i efektem; konkretne kroki dopasowuje się do sytuacji. Każdy krok ma cel, a całość służy celom całej restauracji.","org":"DSS02 Zarządzanie zgłoszeniami serwisowymi i incydentami."}},"fz-C-007":{"id":"fz-C-007","typ":"egzamin","s":"PR-01-02","t":"Jaką rolę pełnią Struktury organizacyjne?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 27"],"r":null,"zap":"","scen":"","o":[{"t":"Opisują etapy dojścia od architektury bazowej do docelowej","ok":false,"w":"To architektura przejściowa z aktywatora Usługi, infrastruktura i aplikacje."},{"t":"Zamieniają wejścia w wyniki za pomocą praktyk i działań","ok":false,"w":"Tak działają Procesy."},{"t":"Obejmują wszystkie informacje tworzone przez organizację","ok":false,"w":"To rola aktywatora Informacja."},{"t":"Są kluczowymi jednostkami podejmującymi decyzje w organizacji (osoby, zespoły, komitety)","ok":true,"w":"Tak opisuje je fiszka: odpowiadają na pytanie, kto o czym decyduje."}],"fz":{"h":"Struktury organizacyjne","p":"P1","pulapka":false,"n":"egzamin: struktury org. · poziom uprawnień · delegowanie uprawnień · podr.: struktury org. · poziom decyzyjny · przekazywanie uprawnień · EN: organisational structures · level of authority · delegation of authority","q":"Jaką rolę pełnią Struktury organizacyjne?","a":"Kluczowe jednostki podejmujące decyzje w organizacji (osoby, zespoły, komitety). Opisuje się je m.in. poziomem uprawnień i delegowaniem uprawnień (s. 75–76).","ex":"Podział stanowisk: szef kuchni decyduje o menu, kierownik zmiany o grafiku, a pod nieobecność szefa jego zastępca. Odpowiada na pytanie: kto o czym decyduje. Pytanie „kto tu rządzi i w jakich sprawach?”.","org":"komitet sterujący programu, dyżur całodobowy z kierownikiem zmiany, który eskaluje."}},"fz-C-008":{"id":"fz-C-008","typ":"egzamin","s":"PR-01-02","t":"Jaką rolę pełnią Usługi, infrastruktura i aplikacje?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 27"],"r":null,"zap":"","scen":"","o":[{"t":"Określają, kto w organizacji o czym decyduje","ok":false,"w":"To rola Struktur organizacyjnych."},{"t":"Obejmują infrastrukturę, technologie i aplikacje, które zapewniają przetwarzanie informacji i usługi IT","ok":true,"w":"To rola tego aktywatora według fiszki."},{"t":"Zapewniają osoby zdolne do podejmowania działań naprawczych","ok":false,"w":"To rola aktywatora Ludzie, umiejętności i kompetencje."},{"t":"Opisują wzorzec zachowań i postaw w organizacji","ok":false,"w":"To definicja kultury."}],"fz":{"h":"Usługi, infrastruktura i aplikacje","p":"P1","pulapka":false,"n":"egzamin: usługi, infrastruktura i aplikacje · podr.: usługi, infrastruktura i aplikacje · EN: services, infrastructure and applications","q":"Jaką rolę pełnią Usługi, infrastruktura i aplikacje?","a":"Infrastruktura, technologie i aplikacje, dzięki którym organizacja przetwarza informacje i ma usługi IT.","ex":"Sprzęt i zaplecze restauracji: kuchenki, lodówki, kasa, system zamówień na tablecie kelnera. Bez nich ludzie mają związane ręce. Narzędzia, dzięki którym zamówienie trafia do kucharza, a rachunek do klienta.","org":"system zgłoszeń, monitoring dostępności usług, łącza do komend."}},"fz-C-009":{"id":"fz-C-009","typ":"egzamin","s":"PR-01-02","t":"Jaką rolę pełnią Zasady, polityki i struktury ramowe?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 27"],"r":null,"zap":"","scen":"","o":[{"t":"Opisują uporządkowany zbiór praktyk i działań dających wyniki","ok":false,"w":"To rola Procesów."},{"t":"Zamieniają pożądane zachowania w praktyczne wskazówki na co dzień; tak organ Ładu i kierownictwo przekazują wytyczne","ok":true,"w":"To dokładnie rola z fiszki."},{"t":"Dostarczają użytkownikom usług IT","ok":false,"w":"To rola Usług, infrastruktury i aplikacji."},{"t":"Są głównym produktem pracy struktur organizacyjnych","ok":false,"w":"Głównym produktem struktur są decyzje."}],"fz":{"h":"Zasady, polityki i struktury ramowe","p":"P1","pulapka":false,"n":"egzamin: zasady, polityki i struktury ramowe · podr.: zasady, polityki i metodyki · EN: principles, policies and frameworks","q":"Jaką rolę pełnią Zasady, polityki i struktury ramowe?","a":"Zamieniają pożądane zachowania w praktyczne wskazówki na co dzień; to sposób, w jaki organ Ładu i kierownictwo przekazują swoje wytyczne.","ex":"Regulamin restauracji: „klient z alergią dostaje danie z osobnej deski”. Szefostwo spisuje, czego chce, a zespół wie, jak się zachować na co dzień. Jak regulamin wiszący w kuchni: kartka na ścianie mówi kucharzom, jak postępować w zwykły dzień.","org":"polityka obsługi zgłoszeń; progi ryzyka zatwierdzone przez kierownictwo."}},"fz-C-010":{"id":"fz-C-010","typ":"egzamin","s":"PR-01-02","t":"Które aktywatory są jednocześnie zasobami?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 27"],"r":null,"zap":"","scen":"","o":[{"t":"Procesy; Struktury organizacyjne; Informacja","ok":false,"w":"Procesy i Struktury organizacyjne nie są zasobami."},{"t":"Zasady, polityki i struktury ramowe; Procesy; Ludzie, umiejętności i kompetencje","ok":false,"w":"Zasady, polityki i Procesy nie należą do zasobów."},{"t":"Informacja; Usługi, infrastruktura i aplikacje; Ludzie, umiejętności i kompetencje","ok":true,"w":"To trzy ostatnie z siedmiu aktywatorów (haczyk I-U-L)."},{"t":"Kultura, etyka i zachowanie; Informacja; Usługi, infrastruktura i aplikacje","ok":false,"w":"Kultura nie jest zasobem; brakuje Ludzi."}],"fz":{"h":"Zasoby wśród aktywatorów","p":"P1","pulapka":true,"n":"egzamin: aktywatory będące zasobami · podr.: czynniki będące zasobami · EN: enablers that are also resources","q":"Które aktywatory są jednocześnie zasobami?","a":"Informacja; Usługi, infrastruktura i aplikacje; Ludzie, umiejętności i kompetencje.","ex":"Zasoby to to, czym organizacja dysponuje i co wykorzystuje: wiedza w notatkach (informacja), sprzęt (infrastruktura), kucharze (ludzie). Haczyk: I-U-L, trzy ostatnie z siedmiu.","org":"rejestr zgłoszeń (informacja), serwery (infrastruktura), dyżurni (ludzie)."}},"fz-C-011":{"id":"fz-C-011","typ":"egzamin","s":"EN-02-02","t":"Czym według COBIT 5 jest polityka (w odróżnieniu od zasady i struktury ramowej)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 93"],"r":null,"zap":"","scen":"","o":[{"t":"Wartościami i podstawowymi przekonaniami organizacji","ok":false,"w":"To definicja zasady."},{"t":"Podstawowym szkieletem pojęć pomagającym rozwiązywać złożone problemy","ok":false,"w":"To definicja struktury ramowej."},{"t":"Koniecznymi i wystarczającymi krokami do wdrożenia praktyki","ok":false,"w":"To definicja działania w procesie."},{"t":"Ogólnymi zamierzeniami i wytycznymi, formalnie spisanymi przez kierownictwo","ok":true,"w":"Tak fiszka definiuje politykę."}],"fz":{"h":"Zasada, polityka, struktura ramowa","p":"P1","pulapka":true,"n":"EN: Principle vs policy vs framework","q":"Czym różni się zasada od polityki i struktury ramowej?","a":"Zasada: wartości i podstawowe przekonania organizacji. Polityka: ogólne zamierzenia i wytyczne, formalnie spisane przez kierownictwo. Struktura ramowa: podstawowy szkielet pojęć, który pomaga rozwiązywać złożone problemy.","ex":"Zasada: „gość jest najważniejszy”. Polityka: „reklamacje przyjmuje kierownik zmiany”. Struktura ramowa: cały gotowy system bezpieczeństwa żywności, szkielet do ogarnięcia złożonej sprawy.","org":""}},"fz-C-012":{"id":"fz-C-012","typ":"egzamin","s":"EN-02-05","t":"Jakie kryteria muszą spełniać zasady?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 67"],"r":null,"zap":"","scen":"","o":[{"t":"Ograniczona liczba, prosty język i jak najprecyzyjniejsze wyrażenie podstawowych wartości","ok":true,"w":"Haczyk z fiszki: mało, prosto, precyzyjnie."},{"t":"Skuteczność, wydajność i nieinwazyjność","ok":false,"w":"To cechy dobrej polityki."},{"t":"Kompleksowość, otwartość i elastyczność, aktualność, dostępność","ok":false,"w":"Tak powinny wyglądać struktury ramowe."},{"t":"Jak najwięcej szczegółów, by objąć każdy możliwy przypadek","ok":false,"w":"Odwrotnie: zasad ma być mało i mają być proste."}],"fz":{"h":"Kryteria zasad","p":"P2","pulapka":false,"n":"EN: Principles: limited in number, simple language","q":"Jakie kryteria muszą spełniać zasady?","a":"Ich liczba musi być ograniczona; muszą być sformułowane prostym językiem i jak najprecyzyjniej wyrażać podstawowe wartości organizacji.","ex":"Jak dziesięć przykazań: mało, krótko i prosto. Zasad nie może być sto, bo nikt ich nie zapamięta. Haczyk: mało, prosto, precyzyjnie.","org":""}},"fz-C-013":{"id":"fz-C-013","typ":"egzamin","s":"EN-02-03","t":"Jakie są cechy dobrej polityki?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 67"],"r":null,"zap":"","scen":"","o":[{"t":"Kompleksowa, otwarta i elastyczna, aktualna","ok":false,"w":"To cechy struktur ramowych Ładu i Zarządzania."},{"t":"Zakres i ważność, skutki nieprzestrzegania, obsługa wyjątków","ok":false,"w":"To elementy struktury polityk, nie cechy dobrej polityki."},{"t":"Nieliczna, prosta językowo, precyzyjna","ok":false,"w":"To kryteria dla zasad."},{"t":"Skuteczna, wydajna, nieinwazyjna","ok":true,"w":"Haczyk SWN z fiszki."}],"fz":{"h":"Cechy dobrej polityki","p":"P1","pulapka":true,"n":"EN: Effective, efficient, non-intrusive","q":"Jakie są cechy dobrej polityki?","a":"Skuteczna (osiąga cel), wydajna (realizuje zasady najmniejszym kosztem), nieinwazyjna (podr. nieingerencyjna: wydaje się sensowna,
