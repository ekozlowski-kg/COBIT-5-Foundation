e kategorii umiejętności (Rysunek 39) jest inne niż przypisanie procesów: dostępność to DSS, pojemność to BAI."},{"t":"Obie do DSS, bo dotyczą eksploatacji","ok":false,"w":"Pojemność jest w Rysunku 39 przypisana do BAI (Build, Acquire and Implement — Twórz, Nabywaj i Wdrażaj)."},{"t":"Dostępność do BAI, pojemność do DSS","ok":false,"w":"Odwrotnie: dostępność to DSS (Deliver, Service and Support — Dostarczaj, Obsługuj i Wspieraj), pojemność to BAI (Build, Acquire and Implement — Twórz, Nabywaj i Wdrażaj)."}],"fz":{"h":"Zarządzanie dostępnością a pojemnością (Rysunek 39)","p":"P2","pulapka":true,"n":"EN: Availability DSS, capacity BAI (skills)","q":"Zarządzanie dostępnością a zarządzanie pojemnością – które domeny (Rysunek 39)?","a":"Dostępność – DSS, pojemność – BAI, choć proces BAI04 łączy obie. Rysunek 39 przypisuje kategorie umiejętności, nie procesy.","ex":"Dostępność to „lokal czynny” – codzienna obsługa (DSS). Pojemność to „ile stolików zbudować” – budowanie (BAI). Rysunek 39 dotyczy umiejętności, nie procesów.","org":""},"cyt":{"s":"88","t":"Wycofanie oprogramowania z użycia • Zarządzanie pojemnością Dostarczanie, obsługa i wsparcie (DSS) • Zarządzanie dostępnością","w":"ZGODNE","u":"Tylko tabela il. 39: „Zarządzanie pojemnością” to ostatnia pozycja BAI, „Zarządzanie dostępnością” pierwsza DSS. Proces BAI04 Zarządzanie dostępnością i pojemnością jest na liście procesów (FW-PL s. 33, 74)."}},"fz-C-073":{"id":"fz-C-073","typ":"egzamin","s":"EN-01-01,EN-02-10","t":"Jaką hierarchię mają proces, praktyka i działanie?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 27","FW-PL s. 69","FW-PL s. 70","FW-PL s. 89","FW-PL s. 93"],"r":null,"zap":"Proces obejmuje praktyki; praktyki rozwija się w działania, a te w razie potrzeby w działania szczegółowe. Praktyki mówią ogólnie, co robić; działania opisują konieczne i wystarczające kroki wdrożenia. Działania nie są normatywne: trzeba je dostosować i rozwinąć w procedury organizacji.","scen":"","o":[{"t":"Praktyka obejmuje procesy, a te działania","ok":false,"w":"To proces obejmuje praktyki, nie odwrotnie."},{"t":"Proces to zbiór praktyk, który nie zawiera działań","ok":false,"w":"Działania są w procesie, tylko piętro niżej."},{"t":"Proces obejmuje praktyki, a praktyki działania","ok":true,"w":"Proces obejmuje praktyki, a te można rozwijać w działania i działania szczegółowe. Praktyki są ogólnymi deklaracjami; działania dostarczają kroków wdrożenia, które trzeba dostosować do organizacji (s.69–70)."},{"t":"Działanie obejmuje praktyki, a te procesy","ok":false,"w":"Hierarchia jest odwrócona."}],"fz":{"h":"Proces, praktyka, działanie – hierarchia","p":"P1","pulapka":true,"n":"EN: Process = set of practices","q":"Jaką hierarchię mają proces, praktyka i działanie?","a":"Proces obejmuje praktyki ukierunkowane przez polityki i procedury, które zamieniają wejścia w wyniki. Praktyki rozwija się w działania, a te w razie potrzeby w działania szczegółowe. Definicja egzaminacyjna: proces to zbiór praktyk – co nie znaczy, że nie ma w nim działań.","ex":"Menu (proces) to zbiór dań (praktyk), a kroki przygotowania (działania) są w przepisie każdego dania. Działania są w procesie, tylko piętro niżej.","org":""},"cyt":{"s":"70","t":"opisano wewnętrzne dobre praktyki dotyczące procesów zgodnie z rosnącym poziomem szczegółowości: praktyki, działania i szczegółowe działania","w":"ZGODNE"}},"fz-C-075":{"id":"fz-C-075","typ":"egzamin","s":"EN-02-25","t":"Jak w RACI wygląda komunikacja z rolami C (Konsultant) i I (Informowany)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 90"],"r":null,"zap":"","scen":"","o":[{"t":"C – dwukierunkowa, I – jednokierunkowa","ok":true,"w":"Konsultanta pytasz i słuchasz, Informowanemu tylko mówisz."},{"t":"C – jednokierunkowa, I – dwukierunkowa","ok":false,"w":"Odwrotnie: dwukierunkowa jest komunikacja z C (Consulted — konsultowany)."},{"t":"Obie dwukierunkowe","ok":false,"w":"Z Informowanym komunikacja jest jednokierunkowa."},{"t":"Obie jednokierunkowe","ok":false,"w":"Z Konsultantem komunikacja jest dwukierunkowa."}],"fz":{"h":"RACI: C i I","p":"P1","pulapka":true,"n":"EN: Consulted two-way, Informed one-way","q":"Która rola RACI ma komunikację dwukierunkową, a która jednokierunkową?","a":"C (Konsultant) – dwukierunkową; I (Informowany) – jednokierunkową.","ex":"Konsultanta pytasz i słuchasz odpowiedzi – rozmowa w obie strony. Informowanemu tylko mówisz, jak ogłoszenie na tablicy. Haczyk: C jak czat, I jak info.","org":""},"cyt":{"s":"90","t":"Odnosi się do osób, u których zasięga się opinii na temat danego działania (komunikacja dwukierunkowa).","w":"ZGODNE","u":"I – „komunikacja jednokierunkowa” – w definicji strony informowanej na s. 92."}},"fz-C-076":{"id":"fz-C-076","typ":"egzamin","s":"EN-02-13","t":"Za co odpowiada Zarząd?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 76"],"r":null,"zap":"","scen":"","o":[{"t":"Za całe zarządzanie organizacją","ok":false,"w":"To rola CEO."},{"t":"Za Ład i ogólną kontrolę nad zasobami","ok":true,"w":"Tak opisuje Zarząd podręcznik (Rysunek 33, FW-PL s. 76)."},{"t":"Za funkcjonowanie organizacji","ok":false,"w":"To rola COO."},{"t":"Za działalność jednej jednostki biznesowej","ok":false,"w":"To rola członka naczelnego kierownictwa (Business Executive)."}],"fz":{"h":"Zarząd i CEO (Rysunek 33)","p":"P2","pulapka":false,"n":"EN: Board; Chief Executive Officer","q":"Za co odpowiadają Zarząd i CEO (Rysunek 33)?","a":"Zarząd: najwyżsi przedstawiciele kierownictwa i/lub dyrektorzy niewykonawczy, rozliczani z Ładu organizacji i sprawujący ogólną kontrolę nad jej zasobami. CEO (dyrektor generalny): najwyższy rangą dyrektor, odpowiedzialny za całe zarządzanie organizacją.","ex":"W szkole: rada szkoły pilnuje kierunku i majątku (Zarząd), a dyrektor prowadzi szkołę na co dzień (CEO).","org":""},"cyt":{"s":"76","t":"rozliczanych za nadzór nad przedsiębiorstwem i sprawujących ogólną kontrolę nad jego zasobami","w":"ZGODNE","u":"Termin: nadzór = Ład."}},"fz-C-077":{"id":"fz-C-077","typ":"egzamin","s":"EN-02-13","t":"Kim jest członek naczelnego kierownictwa (Business Executive)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 76"],"r":null,"zap":"","scen":"","o":[{"t":"Dyrektorem odpowiedzialnym za całą organizację","ok":false,"w":"Całą organizację obejmują CEO (pełne zarządzanie przedsiębiorstwem) i COO (funkcjonowanie przedsiębiorstwa); członek naczelnego kierownictwa odpowiada tylko za jedną jednostkę biznesową lub spółkę zależną (FW-PL s. 76)."},{"t":"Najwyższym rangą dyrektorem w organizacji","ok":false,"w":"To rola CEO."},{"t":"Osobą odpowiedzialną za politykę kadrową","ok":false,"w":"To rola dyrektora ds. zasobów ludzkich."},{"t":"Osobą odpowiedzialną za jednostkę biznesową","ok":true,"w":"Członek naczelnego kierownictwa odpowiada za działalność jednej jednostki biznesowej lub spółki zależnej (Rysunek 33, FW-PL s. 76)."}],"fz":{"h":"COO, Business Executive, dyrektor ds. zasobów ludzkich","p":"P2","pulapka":false,"n":"EN: COO; Business Executive; Head of Human Resources","q":"Za co odpowiadają COO, członek naczelnego kierownictwa i dyrektor ds. zasobów ludzkich?","a":"COO (dyrektor operacyjny): funkcjonowanie organizacji. Członek naczelnego kierownictwa (EN Business Executive): działalność jednej jednostki biznesowej lub spółki zależnej. Dyrektor ds. zasobów ludzkich: planowanie i polityki kadrowe.","ex":"Sieć pizzerii: COO pilnuje, by wszystkie lokale działały; szef jednego lokalu to Business Executive; kadrowa planuje zatrudnienie.","org":""},"cyt":{"s":"76","t":"Przedstawiciel kierownictwa wyższego szczebla odpowiedzialny za działalność danej jednostki biznesowej lub spółki zależnej.","w":"ZGODNE"}},"fz-C-078":{"id":"fz-C-078","typ":"egzamin","s":"EN-02-13","t":"Za co odpowiada dyrektor ds. administracji IT?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 76–77"],"r":null,"zap":"","scen":"","o":[{"t":"Za środowiska operacyjne i infrastrukturę IT","ok":false,"w":"To dyrektor ds. operacji IT (Information Technology — technologie informatyczne)."},{"t":"Za procesy tworzenia rozwiązań IT","ok":false,"w":"To dyrektor ds. rozwoju."},{"t":"Za zapisy (dokumentację) i sprawy administracyjne IT","ok":true,"w":"Dyrektor ds. administracji IT (Information Technology — technologie informatyczne) odpowiada za zapisy i sprawy administracyjne związane z informatyką. Rysunek 33 odróżnia ten zakres od infrastruktury operacyjnej, rozwoju rozwiązań i procesu architektury korporacyjnej (s.76–77)."},{"t":"Za proces architektury korporacyjnej","ok":false,"w":"To dyrektor ds. architektury."}],"fz":{"h":"Dyrektorzy ds. architektury, rozwoju, operacji i administracji IT","p":"P2","pulapka":false,"n":"EN: Head of Architecture, Development, IT Operations, IT Administration","q":"Za co odpowiadają dyrektorzy ds. architektury, rozwoju, operacji IT i administracji IT?","a":"To członkowie wyższej kadry kierowniczej. Architektura: proces architektury korporacyjnej. Rozwój: procesy tworzenia rozwiązań IT. Operacje IT: środowiska operacyjne i infrastruktura IT. Administracja IT: zapisy (dokumentacja) i sprawy administracyjne IT.","ex":"Przy budowie domu: architekt pilnuje projektu, kierownik budowy stawia ściany, technik utrzymuje instalacje w ruchu (operacje IT), a sekretariat prowadzi papiery i sprawy administracyjne (administracja IT).","org":""},"cyt":{"s":"77","t":"Członek wyższej kadry kierowniczej odpowiedzialny za zapisy związane z IT oraz kwestie administracyjne związane z IT.","w":"ZGODNE"}},"fz-C-079":{"id":"fz-C-079","typ":"egzamin","s":"EN-02-13","t":"Za co odpowiada kierownik ds. ciągłości działalności biznesowej?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 77"],"r":null,"zap":"","scen":"","o":[{"t":"Za rozwój i prowadzenie usług dla konkretnego klienta lub grupy klientów","ok":false,"w":"To kierownik ds. usług."},{"t":"Za zdolność organizacji do utrzymania funkcji krytycznych po zdarzeniach zakłócających","ok":true,"w":"Kierownik ds. ciągłości działalności biznesowej zarządza zdolnością do utrzymania funkcji krytycznych po zakłóceniach oraz uczestniczy w jej projektowaniu, nadzorowaniu i ocenie. Nie ogranicza się to do usług jednego klienta (s.77)."},{"t":"Za ryzyko i przepisy dotyczące prywatności","ok":false,"w":"To dyrektor ds. prywatności."},{"t":"Za wszystkie aspekty zarządzania ryzykiem w organizacji","ok":false,"w":"To CRO (Chief Risk Officer — dyrektor ds. ryzyka)."}],"fz":{"h":"Kierownik ds. usług i kierownik ds. ciągłości","p":"P2","pulapka":false,"n":"EN: Service Manager; Business Continuity Manager","q":"Czym zajmują się kierownik ds. usług i kierownik ds. ciągłości działalności biznesowej?","a":"Kierownik ds. usług: rozwój, wdrożenie, ocena i prowadzenie produktów i usług dla konkretnego klienta lub grupy klientów. Kierownik ds. ciągłości: zdolność organizacji do utrzymania funkcji krytycznych po zdarzeniach zakłócających.","ex":"Kierownik sali dba o gości jednego lokalu. Ktoś inny ma plan, co robić, gdy wysiądzie prąd albo zaleje kuchnię.","org":""},"cyt":{"s":"77","t":"w celu zadbania o ciągłość działania funkcji krytycznych w przedsiębiorstwie po zdarzeniach powodujących zakłócenia","w":"ZGODNE"}},"fz-D-002":{"id":"fz-D-002","typ":"egzamin","s":"IM-02-05","t":"Na czym polega Aktywowanie zmiany?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 37"],"r":null,"zap":"","scen":"","o":[{"t":"Na motywowaniu ludzi i komunikacji w każdej fazie","ok":true,"w":"Aktywowanie zmiany to zarządzanie ludzką stroną zmiany: zachowania i kultura, motywowanie interesariuszy oraz komunikacja w każdej fazie (FW-PL s. 37)."},{"t":"Na planowaniu budżetu i harmonogramu programu","ok":false,"w":"Kierowanie programem należy do kręgu zarządzania programem."},{"t":"Na ocenie zdolności procesów według ISO/IEC 15504","ok":false,"w":"Ocena zdolności dotyczy procesów, a nie ludzkiej strony zmiany."},{"t":"Na szkoleniu pracowników po zakończeniu wdrożenia","ok":false,"w":"Komunikacja i motywowanie trwają w każdej fazie, a nie raz na końcu."}],"fz":{"h":"Aktywowanie zmiany","p":"P1","pulapka":false,"n":"EN: Change enablement","q":"Na czym polega Aktywowanie zmiany?","a":"Na zarządzaniu ludzką stroną zmiany (zachowania, nawyki, kultura) i motywowaniu zaangażowanych (interesariuszy), by ją przyjęli; z planem komunikacji dla każdej fazy (treść, sposób, adresaci).","ex":"Jak zdrowa dieta całej rodziny: kupić warzywa łatwo, trudniej przekonać domowników, żeby je jedli. Plan komunikacji: co, jak i komu mówimy na każdym etapie.","org":""},"cyt":{"s":"37","t":"zarządzania tymi aspektami zmiany, które dotyczą osób, zachowania i kultury, a także do motywowania interesariuszy do zaakceptowania zmiany","w":"ZGODNE","u":"Plan komunikacji dla każdej fazy (treść, sposób, adresaci) – ta sama strona."}},"fz-D-004":{"id":"fz-D-004","typ":"egzamin","s":"IM-02-01","t":"Który czynnik NIE należy do kontekstu wewnętrznego i zewnętrznego wdrożenia?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 35"],"r":null,"zap":"","scen":"","o":[{"t":"Apetyt na ryzyko","ok":false,"w":"Apetyt na ryzyko jest na liście czynników."},{"t":"Liczba procesów COBIT 5","ok":true,"w":"Liczba procesów w modelu nie jest pozycją listy czynników kontekstu. Lista dotyczy konkretnej organizacji: m.in. jej kultury, przepisów, strategii, modelu operacyjnego, apetytu na ryzyko, zdolności i zasobów."},{"t":"Etyka i kultura","ok":false,"w":"Etyka i kultura otwierają listę czynników."},{"t":"Obowiązujące przepisy i regulacje","ok":false,"w":"Obowiązujące przepisy, regulacje i polityki są na liście czynników (FW-PL s. 35)."}],"fz":{"h":"Czynniki środowiskowe","p":"P2","pulapka":false,"n":"egzamin: czynniki środowiskowe (kontekst organizacji) · podr.: czynniki środowiska wewn. i zewn. · EN: internal and external environment factors","q":"Jakie czynniki kontekstu uwzględnia się przy wdrożeniu? | Podaj czynniki środowiska wewnętrznego i zewnętrznego wdrożenia.","a":"Etyka i kultura; przepisy; misja, wizja, wartości; polityki Ładu; plan biznesowy; model operacyjny i dojrzałość; styl zarządzania; apetyt na ryzyko; zasoby; praktyki branżowe. | Etyka i kultura; przepisy, regulacje i polityki; misja, wizja i wartości; polityki i praktyki Ładu; plan biznesowy i kierunki strategiczne; model operacyjny i poziom dojrzałości; styl zarządzania; apetyt na ryzyko; zdolności i dostępne zasoby; praktyki branżowe.","ex":"Remont dopasowujesz do przepisów, budżetu, gustu domowników i tego, ile ryzyka akceptujesz (apetyt na ryzyko). Tak samo wdrożenie COBIT dopasowuje się do warunków firmy. | Zanim kupisz meble, mierzysz pokój, sprawdzasz budżet i gust rodziny. Tu tak samo: wdrożenie dopasowujesz do kultury, przepisów, celów, pieniędzy i ludzi firmy.","org":"przepisy o cyberbezpieczeństwie i zamówieniach publicznych; mały zespół IT."},"cyt":{"s":"35","t":"czynniki związane ze środowiskiem wewnętrznym i zewnętrznym przedsiębiorstwa, takie jak: • etyka i kultura; • obowiązujące przepisy, regulacje i polityki; • misja, wizja i wartości; • polityki i praktyki w zakresie nadzoru; • plan biznesowy i strategiczne kierunki działania; • model operacyjny oraz poziom dojrzałości; • styl zarządzania; • apetyt na ryzyko; • potencjał oraz dostępne zasoby; • praktyki stosowane w branży.","w":"ZGODNE","u":"Lista nie zawiera liczby procesów COBIT 5."}},"fz-D-005":{"id":"fz-D-005","typ":"egzamin","s":"IM-02-01","t":"Który z poniższych NIE jest jednym z pięciu kluczowych czynników sukcesu wdrożenia?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 35–36","FW-PL s. 35"],"r":null,"zap":"","scen":"","o":[{"t":"Kierunek, mandat i stałe wsparcie kierownictwa najwyższego szczebla","ok":false,"w":"To czynnik nr 1."},{"t":"Szybkie korzyści i priorytet najłatwiejszych, najkorzystniejszych usprawnień","ok":false,"w":"To czynnik nr 5."},{"t":"Dopasowanie COBIT i innych praktyk do kontekstu organizacji","ok":false,"w":"To czynnik nr 4."},{"t":"Osiągnięcie poziomu 5 zdolności przez wszystkie procesy","ok":true,"w":"Docelowy poziom zdolności dobiera się do kosztów, korzyści i wykonalności. Poziom 5 wszystkich procesów nie jest warunkiem sukcesu wdrożenia; źródło podaje wsparcie kierownictwa, rozumienie celów, komunikację, dostosowanie i szybkie korzyści."}],"fz":{"h":"Kluczowe czynniki sukcesu","p":"P2","pulapka":false,"n":"egzamin: kluczowe czynniki sukcesu wdrożenia · podr.: kluczowe czynniki sukcesu · EN: critical success factors","q":"Podaj kluczowe czynniki sukcesu wdrożenia. | Podaj pięć kluczowych czynników sukcesu wdrożenia.","a":"1) kierownictwo wskazuje kierunek, daje upoważnienie (mandat) i wsparcie; 2) zrozumienie celów biznesowych i IT; 3) komunikacja i umożliwienie zmian; 4) dopasowanie COBIT do sytuacji organizacji; 5) szybkie korzyści. | 1. Kierownictwo najwyższego szczebla daje kierunek, mandat i stałe wsparcie. 2. Wszyscy rozumieją cele biznesowe i cele IT. 3. Skuteczna komunikacja i umożliwienie zmian. 4. Dopasowanie COBIT i innych praktyk do kontekstu. 5. Szybkie korzyści i priorytet najłatwiejszych, najkorzystniejszych usprawnień.","ex":"Udany remont: właściciel decyduje i płaci (1), wszyscy wiedzą, po co (2), domownicy są na bieżąco (3), projekt pasuje do tego mieszkania (4), szybko widać pierwszy efekt (5). | Haczyk na pięć palców: szef chce (1), wszyscy wiedzą, po co (2), mówimy o zmianach (3), szyjemy na miarę (4), szybko widać efekt (5).","org":"zastępca komendanta jako sponsor; efekt widoczny po miesiącu."},"cyt":{"s":"35","t":"Kluczowe czynniki sukcesu umożliwiające skuteczne wdrożenie: • kierownictwo najwyższego szczebla przedstawia wytyczne i przyznaje uprawnienia odnoszące się do inicjatywy; widoczne jest także jego ciągłe zaangażowanie i wsparcie;","w":"ZGODNE","u":"Lista ciągnie się na s. 35–36 (cele, komunikacja, dostosowanie, szybkie korzyści); poziomu 5 nie ma. S. 43: poziom docelowy „bardzo rzadko” jest najwyższy."}},"fz-D-006":{"id":"fz-D-006","typ":"egzamin","s":"IM-02-06","t":"W której fazie i w którym kręgu powstaje mapa drogowa?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 38"],"r":null,"zap":"","scen":"","o":[{"t":"W fazie 1, w kręgu Aktywowania zmiany","ok":false,"w":"W fazie 1 krąg zmiany ustanawia chęć zmiany."},{"t":"W fazie 4, w kręgu ciągłego doskonalenia","ok":false,"w":"W fazie 4 doskonalenie buduje usprawnienia; mapa powstaje wcześniej."},{"t":"W fazie 5, w kręgu zarządzania programem","ok":false,"w":"W fazie 5 program wykonuje plan, a nie go definiuje."},{"t":"W fazie 3, w kręgu zarządzania programem","ok":true,"w":"Definiowanie mapy drogowej należy do zewnętrznego pierścienia zarządzania programem w fazie 3. W tej samej fazie definiuje się stan docelowy i komunikuje oczekiwany rezultat."}],"fz":{"h":"Mapa drogowa","p":"P1","pulapka":false,"n":"egzamin: mapa drogowa · podr.: plan działań · EN: road map","q":"Czym jest mapa drogowa i w której fazie powstaje? | Czym jest mapa drogowa?","a":"Kolejność i priorytety działań. Faza 3 („Do czego dążymy?”), krąg zarządzania programem. | Planem działań dojścia do stanu docelowego (podr. plan działań; EN road map); definiuje się go w fazie 3 w pierścieniu zarządzania programem.","ex":"Jak harmonogram remontu: najpierw elektryka, potem tynki, na końcu malowanie. Powstaje w fazie 3, bo dopiero wtedy wiesz, jak mieszkanie ma wyglądać. | Jak trasa w nawigacji: wiesz, skąd i dokąd jedziesz, a mapa pokazuje kolejne zakręty. Rysuje się ją w fazie 3, bo dopiero wtedy znany jest cel.","org":"najpierw rejestr, potem dyżur, na końcu procedura i szkolenia."},"cyt":{"s":"38","t":"Z d e f i n i o w a n i e p l a n u d z i a ł a ń 3 D o c z e g o d ą ż y m y ?","w":"ZGODNE"}},"fz-D-007":{"id":"fz-D-007","typ":"egzamin","s":"IM-01-01","t":"Które stwierdzenie opisuje przewodnik COBIT 5: Wdrożenie?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 35"],"r":null,"zap":"","scen":"","o":[{"t":"Nakazuje dokładną kolejność kroków do przestrzegania","ok":false,"w":"Normatywny znaczy „rób dokładnie tak”, a przewodnik tylko podpowiada."},{"t":"Jest kompletnym, gotowym rozwiązaniem do wdrożenia","ok":false,"w":"Podręcznik wskazuje, że nie jest kompletnym rozwiązaniem."},{"t":"Dotyczy wyłącznie oceny zdolności procesów","ok":false,"w":"Przewodnik dotyczy wdrożenia, a nie wyłącznie oceny zdolności."},{"t":"Jest zbiorem wskazówek i dobrych praktyk","ok":true,"w":"COBIT 5: Wdrożenie jest zbiorem wskazówek wymagających przyjęcia i dostosowania do środowiska przedsiębiorstwa. Nie narzuca identycznego planu każdej organizacji ani nie stanowi kompletnego gotowego rozwiązania."}],"fz":{"h":"Normatywność wytycznych","p":"P2","pulapka":false,"n":"egzamin: nie jest normatywny · podr.: nie jest normatywny · EN: not prescriptive","q":"Czy przewodnik COBIT 5: Wdrożenie jest normatywny? | Czy przewodnik COBIT 5 – Wdrożenie jest normatywny?","a":"Nie. To zbiór wskazówek, jak unikać typowych problemów, korzystać z dobrych praktyk i osiągać wyniki, a nie gotowe rozwiązanie. | Nie. Nie jest normatywny ani kompletnym rozwiązaniem; to zbiór wskazówek, jak unikać typowych problemów, korzystać z dobrych praktyk i osiągać pożądane wyniki.","ex":"Jak książka z poradami remontowymi, a nie gotowy projekt architekta: podpowiada, czego unikać, ale decydujesz sam. Normatywny = nakazujący „rób dokładnie tak”. | Jak przewodnik turystyczny: pokazuje dobre trasy i pułapki, ale nie wybiera drogi za ciebie. Haczyk: „wskazówki, nie przepis”.","org":""},"cyt":{"s":"35","t":"Publikacja ta nie ma charakteru normatywnego ani nie stanowi kompletnego rozwiązania, lecz jest raczej zbiorem wskazówek ułatwiających uniknięcie często spotykanych problemów, wykorzystanie dobrych praktyk i uzyskanie pożądanych wyników.","w":"ZGODNE"}},"fz-D-008":{"id":"fz-D-008","typ":"egzamin","s":"IM-02-02","t":"Czym różni się punkt zapalny od zdarzenia wyzwalającego?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 36–37","FW-PL s. 36"],"r":null,"zap":"","scen":"","o":[{"t":"Punkt zapalny to zmiana, a zdarzenie – problem","ok":false,"w":"Definicje są tu zamienione miejscami."},{"t":"Niczym, oba oznaczają problem z audytu","ok":false,"w":"To dwa różne pojęcia, choć razem tworzą wyznaczniki fazy 1."},{"t":"Punkt zapalny to problem, a zdarzenie – zmiana","ok":true,"w":"Pain point — punkt zapalny — to dostrzegany problem, np. powtarzające się słabe wyniki audytu. Trigger event — zdarzenie wyzwalające — to bodziec do działania, np. nowe regulacje, fuzja lub nowy CIO (Chief Information Officer — Dyrektor ds. Informatyki). Przykłady pochodzą z list podręcznika; rzeczywista sytuacja może mieć oba aspekty."},{"t":"Punkty zapalne ustala się dopiero w fazie 7","ok":false,"w":"Oba identyfikuje się w fazie 1 jako wyznaczniki."}],"fz":{"h":"Punkt zapalny a zdarzenie wyzwalające","p":"P1","pulapka":true,"n":"egzamin: punkt zapalny / zdarzenie wyzwalające · podr.: punkt zapalny / zdarzenie inicjujące · EN: pain point vs trigger event","q":"Czym różni się punkt zapalny od zdarzenia wyzwalającego?","a":"Punkt zapalny: istniejący problem. Zdarzenie wyzwalające: zmiana w otoczeniu lub organizacji, która daje powód, by działać teraz. Razem tworzą wyznaczniki fazy 1. | Punkt zapalny to istniejący problem wskazujący potrzebę usprawnienia Ładu (np. nieudane projekty). Zdarzenie wyzwalające to inne zdarzenie w otoczeniu wewnętrznym lub zewnętrznym, które skłania do zajęcia się Ładem (np. fuzja, nowy CIO).","ex":"Punkt zapalny: auto stuka od miesięcy. Zdarzenie wyzwalające: zbliża się przegląd albo wyjazd na wakacje – nic nowego się nie zepsuło, ale trzeba działać teraz. | Punkt zapalny: kran cieknie od miesięcy (problem już jest). Zdarzenie wyzwalające: zapowiedzieli się goście (coś nowego każe działać teraz). Ból kontra bodziec.","org":"awaria = punkt zapalny; nowy komendant lub zapowiedziany audyt = zdarzenie wyzwalające."},"cyt":{"s":"37","t":"Oprócz tych punktów zapalnych sygnałem lub czynnikiem skłaniającym do większego skupienia się na nadzorze nad technologiami informatycznymi i zarządzaniu nimi mogą być inne zdarzenia w wewnętrznym lub zewnętrznym środowisku przedsiębiorstwa.","w":"ZGODNE","u":"Termin: FW „zdarzenia inicjujące” = zdarzenia wyzwalające."}},"fz-D-009":{"id":"fz-D-009","typ":"egzamin","s":"IM-02-02","t":"Co jest przykładem punktu zapalnego?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 36–37","FW-PL s. 36"],"r":null,"zap":"","scen":"","o":[{"t":"Planowana fuzja z inną organizacją","ok":false,"w":"Fuzja to zdarzenie wyzwalające, a nie istniejący problem."},{"t":"Powołanie nowego dyrektora generalnego (CEO)","ok":false,"w":"Nowy CEO (Chief Executive Officer — Dyrektor Generalny) to zdarzenie wyzwalające."},{"t":"Niedotrzymywanie poziomu usług przez dostawcę","ok":true,"w":"Powtarzające się niedotrzymywanie uzgodnionych poziomów usług przez dostawcę outsourcingowego jest wymienionym punktem zapalnym. Fuzja, nowy CEO (Chief Executive Officer — Dyrektor Generalny) i nowa strategia znajdują się na liście zdarzeń wyzwalających."},{"t":"Przyjęcie nowej strategii przez organizację","ok":false,"w":"Nowa strategia to zdarzenie wyzwalające."}],"fz":{"h":"Punkty zapalne","p":"P2","pulapka":false,"n":"egzamin: punkty zapalne · podr.: punkty zapalne · EN: pain points","q":"Czym są punkty zapalne? Podaj przykłady. | Podaj punkty zapalne (część 1).","a":"Istniejące problemy, które pokazują potrzebę usprawnień, np. frustracja biznesu, poważne incydenty ryzyka IT (utrata danych), kłopoty z firmą zewnętrzną (outsourcing), niespełnione przepisy, słabe wyniki audytów. | Frustracja biznesu nieudanymi inicjatywami, rosnącymi kosztami IT i niską wartością; poważne incydenty ryzyka IT (utrata danych, porażka projektu); kłopoty z firmą zewnętrzną (outsourcing), która nie dotrzymuje uzgodnionego poziomu usług; niespełnione wymagania przepisów lub umów; IT hamuje innowacje i szybkie reagowanie (zwinność); audyty regularnie wskazują słabą wydajność lub jakość IT.","ex":"Jak ból zęba, który w końcu każe iść do dentysty: coś już źle działa i wszyscy to czują. „Zapalny” = już boli. | Sześć „bólów”: szefowie sfrustrowani, coś poważnego się stało (wyciek danych), firma zewnętrzna zawodzi, łamiemy przepisy, IT hamuje nowe pomysły, kontrole stale wytykają błędy.","org":"system ewidencji zdarzeń niedostępny 95 min w czasie nawałnic; sklep nie działał 6 godzin w Black Friday."},"cyt":{"s":"36","t":"problemy z realizacją usług w ramach outsourcingu, takie jak ciągły brak zapewnienia uzgodnionego poziomu usług","w":"ZGODNE"}},"fz-D-010":{"id":"fz-D-010","typ":"egzamin","s":"IM-02-02","t":"Który z poniższych NIE jest punktem zapalnym?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 37"],"r":null,"zap":"","scen":"","o":[{"t":"Ukryte i nieuczciwe wydatki na IT","ok":false,"w":"To punkt zapalny z drugiej części listy."},{"t":"Powielanie inicjatyw i marnotrawstwo zasobów","ok":false,"w":"To punkt zapalny z drugiej części listy."},{"t":"Brak ludzi, umiejętności lub wypalenie zespołu IT","ok":false,"w":"To punkt zapalny z drugiej części listy."},{"t":"Audyt zewnętrzny lub ocena konsultantów","ok":true,"w":"Audyt zewnętrzny lub ocena konsultantów są wymienionymi zdarzeniami wyzwalającymi. Powtarzające się złe wyniki audytów są natomiast punktem zapalnym; nie należy utożsamiać samego audytu z wynikiem audytu."}],"fz":{"h":"Punkty zapalne (część 2)","p":"P2","pulapka":false,"n":"EN: Pain points (2)","q":"Podaj punkty zapalne (część 2).","a":"Ukryte i nieuczciwe wydatki na IT; powielanie inicjatyw i marnotrawstwo zasobów; brak ludzi, umiejętności lub wypalenie zespołu IT; zmiany IT spóźnione, ponad budżet, nietrafione; niechęć zarządu do współpracy z IT, brak sponsorów (osób z kierownictwa popierających IT); złożone, zagmatwane modele operacyjne IT.","ex":"Kolejne sześć „bólów”: pieniądze na IT idą bokiem, dwa zespoły robią to samo, brak ludzi lub są wypaleni, zmiany spóźnione i za drogie, zarząd unika IT, wszystko zagmatwane.","org":""},"cyt":{"s":"37","t":"audyt zewnętrzny lub oceny dokonane przez konsultantów","w":"ZGODNE","u":"Pozycja z listy zdarzeń inicjujących, nie punktów zapalnych."}},"fz-D-011":{"id":"fz-D-011","typ":"egzamin","s":"IM-02-04","t":"Który element NIE należy do minimalnej zawartości uzasadnienia biznesowego?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 39"],"r":null,"zap":"","scen":"","o":[{"t":"Właściciele korzyści, czyli kto odpowiada za ich uzyskanie","ok":false,"w":"To element minimalnej zawartości."},{"t":"Ryzyko, ograniczenia i zależności","ok":false,"w":"To element minimalnej zawartości."},{"t":"Pełny opis wszystkich procesów z Referencyjnego Modelu Procesu","ok":true,"w":"Tego nie ma na liście; uzasadnienie dotyczy korzyści, kosztów, ryzyka i ról."},{"t":"Monitorowanie inwestycji i wartości przez cały cykl ekonomiczny, z miernikami","ok":false,"w":"To element minimalnej zawartości."}],"fz":{"h":"Uzasadnienie biznesowe","p":"P1","pulapka":true,"n":"egzamin: uzasadnienie biznesowe · podr.: uzasadnienie biznesowe · EN: business case","q":"Co musi zawierać uzasadnienie biznesowe? | Co musi zawierać co najmniej uzasadnienie biznesowe?","a":"Docelowe korzyści, ich zgodność ze strategią i właściciele korzyści (kto odpowiada za ich uzyskanie); zmiany biznesowe i zakres; inwestycje; koszty bieżące; korzyści po zmianie; ryzyka i zależności; role i rozliczalność; monitorowanie wartości i mierniki. Aktualizuje się je przez cały cykl. | Docelowe korzyści biznesowe, ich zgodność ze strategią oraz właściciele korzyści (kto odpowiada za ich zapewnienie; podr. beneficjenci); wymagane zmiany biznesowe; inwestycje; bieżące koszty IT i biznesowe; oczekiwane korzyści po zmianach; ryzyko, ograniczenia i zależności; role, odpowiedzialności i rozliczalności; monitorowanie inwestycji i wartości przez cały cykl ekonomiczny, z miernikami.","ex":"Jak wniosek o kredyt na remont: co zyskasz i kto pilnuje, by to się stało, ile to kosztuje teraz i potem, co może pójść źle, kto odpowiada i jak sprawdzisz efekt. | Jak kosztorys remontu dla rodziny: co zyskamy i kto pilnuje, żeby to się stało, co zmienić, ile kosztuje teraz i co roku, co może pójść źle, kto odpowiada, jak sprawdzimy efekt.","org":"krótsze przerwy usług krytycznych za ok. 480 tys. zł w pierwszym roku."},"cyt":{"s":"39","t":"Uzasadnienie biznesowe musi uwzględniać co najmniej następujące elementy: • docelowe korzyści biznesowe, ich zgodność ze strategią biznesową oraz powiązani beneficjenci (kto w przedsiębiorstwie będzie odpowiadać za ich zapewnienie).","w":"ZGODNE","u":"Dalsze pozycje (zmiany, inwestycje, koszty, korzyści, ryzyko, role, monitorowanie) na tej samej stronie; opisu procesów brak."}},"fz-D-012":{"id":"fz-D-012","typ":"egzamin","s":"IM-02-01","t":"Co obejmuje stworzenie właściwego środowiska wdrożenia?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 36"],"r":null,"zap":"","scen":"","o":[{"t":"Ocenę wszystkich procesów przez zewnętrznego asesora","ok":false,"w":"Ogólna diagnostyka i oceny zdolności mogą pomóc zbudować świadomość i poparcie dla zmiany. COBIT 5 nie wymaga jednak formalnej oceny wszystkich procesów przez zewnętrznego asesora jako warunku stworzenia środowiska."},{"t":"Przyjęcie normatywnego zestawu kroków do dokładnego wykonania","ok":false,"w":"Przewodnik wdrożenia nie jest normatywny."},{"t":"Przekazanie całego programu działowi IT","ok":false,"w":"Zaangażowanie interesariuszy biznesowych i widoczne wsparcie kierownictwa są potrzebne od początku; przekazanie całej inicjatywy samemu działowi IT (Information Technology — informatyka) pomija te warunki."},{"t":"Zaangażowanie interesariuszy i widoczne wsparcie zarządu","ok":true,"w":"Właściwe środowisko obejmuje zaangażowanie interesariuszy od początku, cele i korzyści opisane w uzasadnieniu biznesowym, zasoby, jasno przydzielone role oraz struktury i procesy Ładu i Zarządzania. Kluczowi interesariusze powinni widocznie wspierać inicjatywę."}],"fz":{"h":"Właściwe środowisko","p":"P2","pulapka":false,"n":"egzamin: stworzenie właściwego środowiska · podr.: stworzenie właściwego środowiska · EN: creating the appropriate environment","q":"Co obejmuje stworzenie właściwego środowiska wdrożenia?","a":"Właściwe środowisko obejmuje zaangażowanie interesariuszy od początku, cele i korzyści w uzasadnieniu biznesowym, zasoby, jasne role oraz struktury i procesy Ładu i Zarządzania. Potrzebne jest widoczne wsparcie kluczowego kierownictwa. Diagnostyka i oceny zdolności mogą pomóc uzgodnić potrzebę działania; formalna ocena wszystkich procesów nie jest obowiązkowym warunkiem startu.","ex":"Zanim ruszy remont: domownicy wiedzą i się zgadzają, są pieniądze i ekipa, wiadomo, kto o czym decyduje, a właściciel widocznie jest „za”. Bez tego ekipa stoi. | Jak przygotowanie wesela: rodzina zgadza się od początku, jest budżet, każdy wie, za co odpowiada, a rodzice widocznie wspierają. Dopiero wtedy ruszasz.","org":"sponsor, kierownik programu, przegląd co dwa tygodnie."},"cyt":{"s":"36","t":"O zaangażowanie i akceptację istotnych interesariuszy należy zabiegać od samego początku.","w":"ZGODNE","u":"Zasoby, role, struktury nadzoru i widoczne wsparcie zarządu – kolejne zdania s. 36."}},"fz-D-014":{"id":"fz-D-014","typ":"egzamin","s":"IM-02-02,IM-02-03","t":"Po co identyfikuje się punkty zapalne i zdarzenia wyzwalające?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 36"],"r":null,"zap":"","scen":"","o":[{"t":"Aby ustalić poziom zdolności procesów według ISO/IEC 15504","ok":false,"w":"Do tego służy ocena zdolności, a nie wyznaczniki."},{"t":"Aby zastąpić uzasadnienie biznesowe","ok":false,"w":"Wiążą uzasadnienie z realnymi problemami, a nie zastępują go."},{"t":"Aby uzasadnić zmianę realnymi problemami i okazjami","ok":true,"w":"Punkty zapalne i zdarzenia wyzwalające wiążą uzasadnienie biznesowe z realnymi problemami i okazjami. Wzmacniają akceptację oraz poczucie pilności i pomagają wskazać szybkie korzyści oraz zdobyć poparcie kierownictwa."},{"t":"Aby formalnie zamknąć cykl wdrożenia w fazie 7","ok":false,"w":"To punkt wejścia do wdrożenia (faza 1), a nie zakończenie."}],"fz":{"h":"Punkty zapalne i zdarzenia wyzwalające jako punkt wejścia","p":"P2","pulapka":false,"n":"EN: Pain points and trigger events as entry points","q":"Po co identyfikować punkty zapalne i zdarzenia wyzwalające?","a":"Wiążą uzasadnienie biznesowe z codziennymi problemami, zwiększają akceptację i poczucie pilności, pozwalają wskazać szybkie korzyści i zdobyć poparcie kierownictwa.","ex":"Ludzie chętniej płacą za naprawę dachu, gdy właśnie kapie im na głowę. Realny problem daje poczucie, że trzeba działać teraz, i pozwala szybko pokazać efekt.","org":""},"cyt":{"s":"36","t":"umożliwia powiązanie uzasadnienia biznesowego dla udoskonaleń w odniesieniu do nadzoru nad technologiami informatycznymi w przedsiębiorstwie i zarządzania nimi z praktycznymi, codziennymi problemami","w":"ZGODNE"}},"fz-D-015":{"id":"fz-D-015","typ":"egzamin","s":"IM-02-05","t":"Jakie podejście do trwałej poprawy podczas zmiany wskazuje COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 37"],"r":null,"zap":"","scen":"","o":[{"t":"Budowanie zaangażowania interesariuszy oraz, gdy jest wymagane, egzekwowanie zgodności","ok":true,"w":"Zaangażowanie interesariuszy buduje się przez zaufanie, przywództwo, komunikację i reagowanie na potrzeby. Gdy wymagane jest egzekwowanie zgodności, stosuje się odpowiednie procesy administrowania, monitorowania i egzekwowania. Nie jest to wyłącznie etap po nieudanym przekonywaniu ludzi."},{"t":"Rozbudowanie kontroli zgodności przy pominięciu zaufania, przywództwa i komunikacji","ok":false,"w":"Kontrola może być wymagana, ale nie zastępuje świadomego zajęcia się ludzkimi i kulturowymi aspektami zmiany. Nie jest jedyną drogą wskazaną w podręczniku."},{"t":"Dostarczenie rozwiązań technicznych i przyjęcie, że interesariusze samodzielnie zmienią zachowania","ok":false,"w":"Dobre rozwiązanie techniczne nie zapewnia przyjęcia zmiany przez ludzi. Podręcznik wymaga proaktywnego uwzględnienia zachowań, kultury i możliwego oporu."},{"t":"Przekazywanie informacji o zmianie dopiero po zakończeniu programu wdrożeniowego","ok":false,"w":"Plan komunikacji obejmuje kolejne fazy programu, a nie wyłącznie komunikat po jego zakończeniu."}],"fz":{"h":"Trwała poprawa podczas zmiany","p":"P2","pulapka":false,"n":"EN: Sustainable change: buy-in or enforced compliance","q":"Jak osiągnąć trwałą poprawę podczas zmiany?","a":"Trwałą poprawę wspiera zaangażowanie interesariuszy: zaufanie, przywództwo, komunikacja i reagowanie na potrzeby. Gdy wymagane jest egzekwowanie zgodności, wykorzystuje się administrowanie, monitorowanie i egzekwowanie. Oba podejścia mogą współdziałać; wymagania zgodności nie zależą wyłącznie od tego, czy udało się przekonać pracowników.","ex":"Pracownicy rozumieją sens rejestrowania incydentów i współtworzą rozwiązanie. Równolegle organizacja kontroluje przestrzeganie wymaganej polityki. Obowiązek kontroli nie znika dlatego, że pracownicy popierają zmianę.","org":""},"cyt":{"s":"37","t":"Trwałą poprawę można osiągnąć poprzez zyskanie zaangażowania interesariuszy (inwestycja w budowanie zaufania, zaangażowanie liderów oraz komunikowanie się z pracownikami i reagowanie na ich potrzeby) lub, w przypadkach, w których jest to wymagane, poprzez egzekwowanie zgodności z przepisami","w":"ZGODNE","u":"FW: „lub” (odpowiedź: „oraz”) i „egzekwowanie zgodności z przepisami”."}},"fz-D-016":{"id":"fz-D-016","typ":"egzamin","s":"IM-02-06,IM-02-07","t":"Jak brzmi pytanie fazy 4 cyklu życia wdrożenia?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 38"],"r":null,"zap":"","scen":"","o":[{"t":"Jak się tam dostaniemy?","ok":false,"w":"To pytanie fazy 5."},{"t":"Jak utrzymać motywację do działania?","ok":false,"w":"To pytanie fazy 7."},{"t":"Jakie działania należy podjąć?","ok":true,"w":"To pytanie fazy 4 (nazwa egzaminacyjna)."},{"t":"Czy dotarliśmy do celu?","ok":false,"w":"To pytanie fazy 6."}],"fz":{"h":"Pytania siedmiu faz","p":"P1","pulapka":false,"n":"EN: What are the drivers? Where are we now? Where do we want to be? What needs to be done? How do we get there? Did we get there? How do we keep the momentum going?","q":"Podaj pytania siedmiu faz (nazwy egzaminacyjne).","a":"1. Jakie są wyznaczniki? 2. Gdzie jesteśmy teraz? 3. Do czego dążymy? 4. Jakie działania należy podjąć? 5. Jak się tam dostaniemy? 6. Czy dotarliśmy do celu? 7. Jak utrzymać motywację do działania?","ex":"Remont: po co? – jak jest? – jak ma być? – co zrobić? – robimy – czy wyszło? – jak nie odpuścić? Po kroku 7 zaczynasz od nowa.","org":""},"cyt":{"s":"38","t":"W fazie 4 planuje się praktyczne rozwiązania, definiując projekty wspierane przez uzasadnienia biznesowe.","w":"ZGODNE"}},"fz-D-017":{"id":"fz-D-017","typ":"egzamin","s":"IM-02-06","t":"Co dzieje się w fazie 1 „Jakie są wyznaczniki?”?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 38"],"r":null,"zap":"","scen":"","o":[{"t":"Określa się stan docelowy i analizuje luki oraz rozwiązania","ok":false,"w":"To faza 3."},{"t":"Ocenia się stan obecny i zdolność procesów","ok":false,"w":"To faza 2."},{"t":"Rozpoznaje się punkty zapalne i zdarzenia wyzwalające","ok":true,"w":"Faza 1 rozpoznaje i uzgadnia potrzebę działania, w tym aktualne punkty zapalne i zdarzenia wyzwalające. Trzy pierścienie obejmują inicjowanie programu, ustanowienie chęci zmiany i rozpoznanie potrzeby działania."},{"t":"Ocenia się ogólny sukces i wzmacnia doskonalenie","ok":false,"w":"To faza 7."}],"fz":{"h":"Faza 1 „Jakie są wyznaczniki?”","p":"P1","pulapka":false,"n":"EN: Initiate programme; Establish desire to change; Recognise need to act","q":"Faza 1 „Jakie są wyznaczniki?” – co się dzieje i jakie działania pierścieni?","a":"Uzgadnia się potrzebę inicjatywy, identyfikuje punkty zapalne i zdarzenia wyzwalające. Program: Inicjowanie programu. Zmiana: Ustanowienie chęci zmiany. Doskonalenie: Rozpoznanie potrzeby działania.","ex":"Remont: zgadzacie się, że trzeba – bo cieknie dach (punkt zapalny) albo rodzi się dziecko (zdarzenie wyzwalające). Domownicy chcą zmiany, widać potrzebę działania.","org":""},"cyt":{"s":"38","t":"Faza 1 rozpoczyna się od stwierdzenia i uzgodnienia potrzeby realizacji inicjatywy związanej z wdrożeniem lub doskonaleniem. Identyfikuje się w niej aktualne punkty zapalne oraz czynniki inicjujące","w":"ZGODNE"}},"fz-D-019":{"id":"fz-D-019","typ":"egzamin","s":"IM-02-06","t":"Które działanie cyklu ciągłego doskonalenia odpowiada fazie 3 „Do czego dążymy?”?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 38"],"r":null,"zap":"","scen":"","o":[{"t":"Oceń stan obecny","ok":false,"w":"To faza 2."},{"t":"Zdefiniuj stan docelowy","ok":true,"w":"Faza 3 określa stan docelowy i analizuje luki oraz możliwe rozwiązania. W tym pierścieniu jest to Define target state — Zdefiniowanie stanu docelowego. Zarządzanie programem definiuje mapę drogową, a aktywowanie zmiany komunikuje rezultat."},{"t":"Buduj usprawnienia","ok":false,"w":"To faza 4."},{"t":"Wdrażaj usprawnienia","ok":false,"w":"To faza 5."}],"fz":{"h":"Faza 3 „Do czego dążymy?”","p":"P1","pulapka":false,"n":"EN: Define road map; Communicate outcome; Define target state","q":"Faza 3 „Do czego dążymy?” – co się dzieje i jakie działania pierścieni?","a":"Określa się stan docelowy, analizuje luki i rozwiązania, priorytet mają szybkie korzyści i największe korzyści. Program: Definiowanie mapy drogowej. Zmiana: Komunikowanie rezultatu. Doskonalenie: Zdefiniowanie stanu docelowego.","ex":"Remont: wybierasz, jak ma wyglądać mieszkanie, widzisz różnicę między „jest” a „ma być” (luka) i ustalasz kolejność prac. Najpierw drobiazgi dające szybki efekt.","org":""},"cyt":{"s":"38","t":"W trakcie fazy 3 określa się cel procesu doskonalenia","w":"ZGODNE"}},"fz-D-021":{"id":"fz-D-021","typ":"egzamin","s":"IM-02-07","t":"Który zestaw działań pierścieni (program / zmiana / doskonalenie) należy do fazy 5 „Jak się tam dostaniemy?”?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 38","SP1 s. 38"],"r":null,"zap":"","scen":"","o":[{"t":"Planowanie programu / Identyfikacja odtwórców ról / Budowanie usprawnień","ok":false,"w":"To działania fazy 4."},{"t":"Wykonywanie planu / Działaj i używaj / Wdrażanie usprawnień","ok":true,"w":"Faza 5 przekształca rozwiązania w praktyczne działania: Execute plan — Wykonywanie planu; Operate and use — Działaj i używaj; Implement improvements — Wdrażanie usprawnień. Są to działania trzech współdziałających pierścieni."},{"t":"Realizacja korzyści / Umożliwianie nowych podejść / Eksploatacja i pomiar","ok":false,"w":"To działania fazy 6 „Czy dotarliśmy do celu?”: Realizacja korzyści (program), Integracja nowych podejść – w polskim arkuszu „Umożliwianie nowych podejść” (zmiana) oraz Eksploatacja i pomiar (doskonalenie) (FW-PL s. 38)."},{"t":"Przegląd skuteczności / Utrzymanie / Monitorowanie i szacowanie","ok":false,"w":"To działania fazy 7."}],"fz":{"h":"Faza 5 „Jak się tam dostaniemy?”","p":"P1","pulapka":false,"n":"EN: Execute plan; Operate and use; Implement improvements","q":"Faza 5 „Jak się tam dostaniemy?” – co się dzieje i jakie działania pierścieni?","a":"Rozwiązania przechodzą w praktykę; definiuje się miary i monitorowanie. Program: Wykonywanie planu. Zmiana: Działaj i używaj. Doskonalenie: Wdrażanie usprawnień.","ex":"Remont: ekipa wchodzi i robi, domownicy zaczynają korzystać z nowej kuchni, a ty ustalasz, po czym poznasz sukces, np. niższe rachunki za prąd.","org":""},"cyt":{"s":"38","t":"W fazie 5 proponowane rozwiązania są przekształcane w praktyczne działania.","w":"ZGODNE"}},"fz-D-022":{"id":"fz-D-022","typ":"egzamin","s":"IM-02-07","t":"Co jest istotą fazy 6 „Czy dotarliśmy do celu?”?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 38"],"r":null,"zap":"","scen":"","o":[{"t":"Utrwalanie aktywatorów i monitorowanie korzyści","ok":true,"w":"W fazie 6 trwale wykorzystuje się nowe lub ulepszone aktywatory i monitoruje uzyskiwanie spodziewanych korzyści. Działania pierścieni to realizacja korzyści, utrwalanie nowych podejść oraz eksploatacja i pomiar."},{"t":"Określenie stanu docelowego i analiza istniejących luk","ok":false,"w":"To faza 3."},{"t":"Utworzenie zespołu wdrożeniowego programu","ok":false,"w":"To działanie kręgu zmiany w fazie 2."},{"t":"Uzgodnienie potrzeby podjęcia inicjatywy","ok":false,"w":"To faza 1."}],"fz":{"h":"Faza 6 „Czy dotarliśmy do celu?”","p":"P1","pulapka":false,"n":"EN: Realise benefits; Embed new approaches; Operate and measure","q":"Faza 6 „Czy dotarliśmy do celu?” – co się dzieje i jakie działania pierścieni?","a":"Faza 6 to trwałe korzystanie z nowych lub ulepszonych aktywatorów i monitorowanie korzyści. Program: Realizacja korzyści. Zmiana: Embed new approaches — Integracja i utrwalanie nowych podejść; w polskim arkuszu Umożliwianie nowych podejść. Doskonalenie: Eksploatacja i pomiar.","ex":"Remont: mieszkasz w odnowionym mieszkaniu na co dzień, nowe nawyki się utrwalają, a ty sprawdzasz, czy rachunki naprawdę spadły. Czy obiecany efekt przyszedł?","org":""},"cyt":{"s":"38","t":"Działania w fazie 6 koncentrują się na zrównoważonym wykorzystaniu nowych lub udoskonalonych czynników umożliwiających i monitorowaniu uzyskania spodziewanych korzyści.","w":"ZGODNE","u":"Termin: czynniki umożliwiające = aktywatory."}},"fz-D-023":{"id":"fz-D-023","typ":"egzamin","s":"IM-02-07","t":"Które działanie kręgu Aktywowania zmiany przypada na fazę 7 „Jak utrzymać motywację do działania?”?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 38","SP1 s. 38"],"r":null,"zap":"","scen":"","o":[{"t":"Utrzymanie","ok":true,"w":"Sustain — Utrzymanie — jest działaniem aktywowania zmiany w fazie 7. W tej samej fazie program przegląda skuteczność, a ciągłe doskonalenie monitoruje i ocenia. Wyniki przeglądu mogą uruchomić następną iterację."},{"t":"Działaj i używaj","ok":false,"w":"To faza 5."},{"t":"Umożliwianie nowych podejść","ok":false,"w":"Embed new approaches — Integracja lub utrwalanie nowych podejść — należy do środkowego pierścienia fazy 6. W polskim arkuszu spotyka się wariant Umożliwianie nowych podejść. Chodzi o trwałe zakorzenienie nowego sposobu działania, nie o ponowne przygotowywanie zmiany."},{"t":"Ustanowienie chęci zmiany","ok":false,"w":"To faza 1."}],"fz":{"h":"Faza 7 „Jak utrzymać motywację do działania?”","p":"P1","pulapka":false,"n":"EN: How do we keep the momentum going? — jak utrzymać dynamikę; Review effectiveness — Przegląd skuteczności; Sustain — Utrzymanie; Monitor and evaluate — Monitorowanie i szacowanie","q":"Co dzieje się w fazie 7 i jakie są działania trzech pierścieni?","a":"Faza 7: egzaminacyjnie Jak utrzymać motywację do działania?, w podręczniku Jak możemy utrzymać obecną dynamikę? Przegląda się ogólny sukces, identyfikuje dalsze potrzeby Ładu i Zarządzania oraz utrwala doskonalenie. Program: Przegląd skuteczności. Zmiana: Utrzymanie. Doskonalenie: Monitorowanie i szacowanie. Wyniki mogą uzasadnić kolejną iterację.","ex":"Remont: po roku oceniasz, co się udało i co jeszcze poprawić, i pilnujesz, żeby nie wrócił stary bałagan. Potem kolejna runda, np. łazienka.","org":""},"cyt":{"s":"38","t":"W trakcie fazy 7 weryfikuje się ogólny sukces inicjatywy, identyfikuje dalsze wymagania dotyczące nadzoru nad technologiami informatycznymi w przedsiębiorstwie i zarządzania nimi oraz wzmacnia potrzebę ciągłego doskonalenia.","w":"ZGODNE"}},"fz-D-024":{"id":"fz-D-024","typ":"egzamin","s":"IM-01-01","t":"Co uzasadnia podział dużego wdrożenia na iteracje cyklu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 38"],"r":null,"zap":"","scen":"","o":[{"t":"Zakaz wdrożeń dłuższych niż rok w ISO/IEC 15504","ok":false,"w":"Podręcznik nie wiąże iteracji z normą ISO."},{"t":"Wymóg osiągania poziomu 5 w każdej iteracji","ok":false,"w":"Poziom docelowy dobiera się do potrzeb, rzadko jest nim 5."},{"t":"Ryzyko utraty tempa po ponad sześciu miesiącach","ok":true,"w":"Podręcznik wskazuje ryzyko utraty dynamiki, koncentracji i akceptacji interesariuszy przy inicjatywie trwającej ponad sześć miesięcy. Uzasadnia to podział większych programów na iteracje; nie jest to normatywny zakaz dłuższych programów."},{"t":"Nakaz przewodnika, by były dokładnie trzy iteracje","ok":false,"w":"Przewodnik nie jest normatywny i nie nakazuje liczby iteracji."}],"fz":{"h":"Iteracje cyklu","p":"P2","pulapka":false,"n":"EN: More than six months – risk of losing momentum","q":"Dlaczego duże wdrożenie dzieli się na iteracje cyklu?","a":"Inicjatywa trwająca dłużej niż sześć miesięcy grozi utratą tempa (dynamiki), skupienia i poparcia zaangażowanych (interesariuszy).","ex":"Jak odchudzanie: plan na dwa lata łatwo porzucić, a cele na kilka miesięcy dają widoczne efekty i motywują. Haczyk: ponad pół roku – rośnie ryzyko utraty tempa.","org":""},"cyt":{"s":"38","t":"w przypadku każdej inicjatywy związanej z wdrożeniem, której realizacja trwa dłużej niż sześć miesięcy, istnieje ryzyko utraty dynamiki, koncentracji i akceptacji interesariuszy","w":"ZGODNE"}},"fz-D-025":{"id":"fz-D-025","typ":"egzamin","s":"IM-02-06","t":"W której fazie szczegółowo analizuje się luki i możliwe rozwiązania, nadając priorytet prostszym usprawnieniom o największych korzyściach?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 38","FW-PL s. 36"],"r":null,"zap":"","scen":"","o":[{"t":"W fazie 5, przy wdrażaniu usprawnień","ok":false,"w":"W fazie 5 rozwiązania przechodzą w praktykę."},{"t":"W fazie 6, przy realizacji korzyści","ok":false,"w":"W fazie 6 monitoruje się uzyskanie korzyści."},{"t":"W fazie 7, przy przeglądzie skuteczności","ok":false,"w":"W fazie 7 ocenia się ogólny sukces."},{"t":"W fazie 3, przy analizie luk","ok":true,"w":"Faza 3 szczegółowo analizuje luki i rozwiązania oraz nadaje priorytet prostszym inicjatywom o największych korzyściach. Okazje do szybkich korzyści można zauważać już na początku inicjatywy; nie występują wyłącznie w fazie 3."}],"fz":{"h":"Szybkie korzyści (quick wins)","p":"P1","pulapka":true,"n":"EN: Quick wins — szybkie korzyści; szczegółowa analiza luk w fazie 3","q":"Jak faza 3 wykorzystuje analizę luk przy wyborze szybkich korzyści?","a":"W fazie 3 określa się stan docelowy, analizuje luki i możliwe rozwiązania. Priorytet mają prostsze inicjatywy o największych korzyściach. Nie oznacza to, że szybkie korzyści można rozpoznawać wyłącznie w tej fazie: podręcznik wskazuje taką możliwość już przy rozpoczynaniu inicjatywy.","ex":"Wstępnie zauważono, że wspólny rejestr incydentów szybko pomoże zespołom. W fazie 3 porównuje się tę propozycję z innymi rozwiązaniami, ocenia luki i ustala priorytet.","org":""},"cyt":{"s":"38","t":"W trakcie fazy 3 określa się cel procesu doskonalenia, a następnie przeprowadza się bardziej szczegółową analizę opartą na wytycznych COBIT w celu zidentyfikowania luk oraz możliwych rozwiązań.","w":"ZGODNE"}},"fz-D-026":{"id":"fz-D-026","typ":"egzamin","s":"IM-02-03,IM-02-04","t":"Które stwierdzenie opisuje uzasadnienie biznesowe w programie wdrożenia?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 39"],"r":null,"zap":"","scen":"","o":[{"t":"Jest jednorazowym dokumentem zatwierdzanym w fazie 1","ok":false,"w":"Podręcznik: to nie jednorazowy dokument."},{"t":"Po zatwierdzeniu w fazie 1 pozostaje niezmienne","ok":false,"w":"Uzasadnienie stale się aktualizuje."},{"t":"Powstaje dopiero w fazie 7, po ocenie sukcesu","ok":false,"w":"Istnieje od początku programu, a nie dopiero na końcu."},{"t":"Jest stale uszczegóławiane i aktualizowane","ok":true,"w":"Uzasadnienie biznesowe może początkowo być ogólne i strategiczne. Uszczegóławia się je i stale aktualizuje, aby odzwierciedlało aktualne korzyści, koszty, ryzyka i opłacalność programu. Nie jest jednorazowym dokumentem."}],"fz":{"h":"Ewolucja uzasadnienia biznesowego","p":"P1","pulapka":false,"n":"EN: Business case evolves","q":"Jak ewoluuje uzasadnienie biznesowe? | Czy uzasadnienie biznesowe tworzy się tylko na starcie?","a":"Na początku może być ogólne, strategiczne (odgórne); potem uszczegóławia się zadania, kamienie milowe (ważne etapy) i role. To żywe narzędzie, stale aktualizowane, nie jednorazowy dokument. | Nie. Żyje przez cały program: zaczyna jako ogólne i strategiczne, potem się je uszczegóławia i stale aktualizuje.","ex":"Jak plan wesela: najpierw „chcemy skromnie, w sierpniu”, potem lista gości, terminy i kto co załatwia, a plan zmienia się do samego końca. | Jak budżet remontu: na początku szacunek „około 50 tys.”, potem dopisujesz faktury i poprawiasz plan aż do końca prac. Uzasadnienie „żyje” przez cały program.","org":""},"cyt":{"s":"39","t":"Uzasadnienie biznesowe nie jest jednorazowym statycznym dokumentem, ale dynamicznym narzędziem operacyjnym, które musi być stale aktualizowane","w":"ZGODNE","u":"W FW-PL zdanie „Początkowo może ona mieć charakter ogólny, strategiczny (odgórny)” gramatycznie dotyczy inicjatywy, nie uzasadnienia."}},"fz-D-027":{"id":"fz-D-027","typ":"egzamin","s":"IM-02-03","t":"Kto powinien odpowiadać za inicjatywę wdrożeniową?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 39"],"r":null,"zap":"","scen":"","o":[{"t":"Zewnętrzny asesor","ok":false,"w":"Asesor prowadzi formalną ocenę zdolności, a nie odpowiada za inicjatywę."},{"t":"Sponsor","ok":true,"w":"Podręcznik: za inicjatywę odpowiada sponsor (FW-PL s. 39)."},{"t":"Każdy pracownik IT osobno","ok":false,"w":"Bez jednego sponsora zmiana nie ma właściciela."},{"t":"Firma zewnętrzna (outsourcing)","ok":false,"w":"Podręcznik wskazuje sponsora, a nie dostawcę (FW-PL s. 39)."}],"fz":{"h":"Sponsor inicjatywy","p":"P2","pulapka":false,"n":"EN: Sponsor","q":"Kto powinien odpowiadać za inicjatywę wdrożeniową?","a":"Sponsor; inicjatywa obejmuje wszystkich kluczowych zainteresowanych (interesariuszy) i opiera się na uzasadnieniu biznesowym.","ex":"Jak inwestor remontu: decyduje, płaci i odpowiada, choć sam nie kładzie płytek. Bez sponsora zmiana nie ma właściciela.","org":""},"cyt":{"s":"39","t":"Za realizację inicjatywy powinien odpowiadać sponsor","w":"ZGODNE"}},"fz-D-028":{"id":"fz-D-028","typ":"egzamin","s":"IM-02-04","t":"Na jakich korzyściach powinno skupiać się uzasadnienie biznesowe?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 39"],"r":null,"zap":"","scen":"","o":[{"t":"Na realistycznych i możliwych do osiągnięcia","ok":true,"w":"Kwantyfikując korzyści, należy skupiać się na tych, które są realistyczne i możliwe do uzyskania. Wyniki innych przedsiębiorstw mogą pomóc oszacować korzyści, lecz nie gwarantują identycznego rezultatu u siebie."},{"t":"Na możliwie najwyższych, by przekonać zarząd","ok":false,"w":"Liczą się korzyści realne, nie efektowne."},{"t":"Na korzyściach dla samego działu IT","ok":false,"w":"Uzasadnienie opisuje docelowe korzyści biznesowe."},{"t":"Na niemierzalnych, bo mierniki są zbędne","ok":false,"w":"Uzasadnienie obejmuje monitorowanie wartości z miernikami."}],"fz":{"h":"Realistyczne korzyści","p":"P2","pulapka":false,"n":"EN: Realistic benefits","q":"Na jakie korzyści wdrożenia skupia się uzasadnienie?","a":"Tylko na realistycznych i osiągalnych; pomocne są badania korzyści osiągniętych w innych organizacjach.","ex":"Jak w reklamie diety: „minus 20 kg w miesiąc” brzmi świetnie, ale liczy się realne „minus 4 kg”. Pomaga sprawdzić, co naprawdę osiągnęli inni.","org":""},"cyt":{"s":"39","t":"należy zadbać o to, aby skupiono się tylko na korzyściach, które są realistyczne i możliwe do osiągnięcia","w":"ZGODNE"}},"fz-D-029":{"id":"fz-D-029","typ":"egzamin","s":"IM-01-01","t":"Jak fazy wdrożenia odnoszą się do trzech pierścieni cyklu życia?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 38"],"r":null,"zap":"","scen":"","o":[{"t":"Każdy pierścień ma odrębny zestaw faz","ok":false,"w":"Trzy pierścienie opisują równoległe aspekty tych samych siedmiu faz wdrożenia."},{"t":"Każdy pierścień obejmuje wspólnych siedem faz","ok":true,"w":"Siedem faz łączy trzy wzajemnie powiązane komponenty: zarządzanie programem, aktywowanie zmiany oraz ciągłe doskonalenie. W modelu graficznym dla każdej fazy wskazano działania każdego pierścienia (FW-PL s. 37–38)."},{"t":"Fazy występują tylko w pierścieniu programu","ok":false,"w":"Fazy odnoszą się do wszystkich trzech pierścieni, nie tylko do zarządzania programem."},{"t":"Pierścienie następują kolejno po siedmiu fazach","ok":false,"w":"Pierścienie współdziałają w ramach wspólnych faz; nie wykonuje się ich jako trzech kolejnych oddzielnych cykli."}],"fz":{"h":"Pierścienie a fazy","p":"P3","pulapka":false,"n":"EN: Three rings across seven phases — trzy pierścienie w siedmiu fazach","q":"Jak trzy pierścienie odnoszą się do siedmiu faz na Rysunku 17?","a":"Każdy z trzech pierścieni występuje w każdej z siedmiu faz. Rysunek zawiera więc 21 pól z nazwami działań. Pole jest podsumowaniem obszaru pracy i może obejmować wiele rzeczywistych zadań; nie jest to kompletna lista 21 kroków do odhaczenia.","ex":"Tabela ma siedem kolumn i trzy wiersze. Liczba komórek mówi o układzie modelu, a nie o liczbie zadań, osób ani dokumentów programu.","org":""},"cyt":{"s":"37","t":"Trzy wzajemnie powiązane komponenty cyklu życia","w":"CZESCIOWO","u":"FW-PL wymienia trzy komponenty i siedem faz (s. 37–38); że każdy pierścień obejmuje te same siedem faz, widać tylko na Ilustracji 17."}},"fz-D-030":{"id":"fz-D-030","typ":"egzamin","s":"IM-01-01","t":"Co następuje po zakończeniu fazy 7?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 37","FW-PL s. 38"],"r":null,"zap":"","scen":"","o":[{"t":"Powrót do fazy 1 w kolejnej iteracji","ok":true,"w":"Po fazie 7 cykl wraca do fazy 1 – ciągłe doskonalenie realizuje się iteracyjnie (FW-PL s. 38)."},{"t":"Koniec wdrożenia jako jednorazowego projektu","ok":false,"w":"Wdrożenie COBIT 5 nie jest jednorazowym projektem."},{"t":"Faza 8, czyli certyfikacja zgodności z ISO","ok":false,"w":"Cykl ma 7 faz."},{"t":"Rozwiązanie zespołu i archiwizacja dokumentów","ok":false,"w":"Cykl trwa dalej, a uzasadnienie żyje przez cały program."}],"fz":{"h":"Wdrożenie to nie jednorazowy projekt","p":"P1","pulapka":false,"n":"EN: Not a one-off project","q":"Czy wdrożenie COBIT 5 to jednorazowy projekt?","a":"Nie. Rdzeń to cykl ciągłego doskonalenia, realizowany iteracyjnie; po fazie 7 wraca się do fazy 1.","ex":"Jak sprzątanie domu: nie sprzątasz raz na zawsze. Po fazie 7 wracasz do fazy 1 – cykl kręci się jak koło.","org":""},"cyt":{"s":"38","t":"Z czasem cykl życia powinien być realizowany w sposób iteracyjny","w":"ZGODNE","u":"FW nie pisze wprost „powrót do fazy 1”; wynika to z iteracyjności cyklu."}},"fz-D-031":{"id":"fz-D-031","typ":"egzamin","s":"IM-02-06","t":"W której fazie ocenia się stan obecny?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 38"],"r":null,"zap":"","scen":"","o":[{"t":"W fazie 3 – Do czego dążymy?","ok":false,"w":"W fazie 3 określa się stan docelowy i luki."},{"t":"W fazie 2 – Gdzie jesteśmy teraz?","ok":true,"w":"Doskonalenie: Ocena stanu obecnego to faza 2."},{"t":"W fazie 1 – Jakie są wyznaczniki?","ok":false,"w":"W fazie 1 uzgadnia się potrzebę inicjatywy."},{"t":"W fazie 6 – Czy dotarliśmy do celu?","ok":false,"w":"W fazie 6 monitoruje się korzyści."}],"fz":{"h":"Ocena stanu obecnego – faza 2","p":"P1","pulapka":true,"n":"EN: Assess current state – phase 2","q":"Ocena stanu obecnego – faza 2 czy 3?","a":"Faza 2 (Gdzie jesteśmy teraz?). W fazie 3 określa się stan docelowy i luki.","ex":"Najpierw stajesz na wadze (faza 2 – jak jest teraz), dopiero potem wybierasz wagę docelową (faza 3). Nie ustalisz celu, nie wiedząc, gdzie jesteś.","org":""},"cyt":{"s":"38","t":"Następnie przeprowadza się ocenę aktualnego stanu oraz szacowanie potencjału procesu, które umożliwia identyfikację problemów lub niedoskonałości.","w":"ZGODNE","u":"Zdanie z opisu fazy 2; nazwa w podręczniku: „Jaka jest nasza obecna sytuacja?”."}},"fz-D-032":{"id":"fz-D-032","typ":"egzamin","s":"IM-02-07","t":"W której fazie definiuje się miary i monitorowanie przy wdrażaniu rozwiązań?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 38"],"r":null,"zap":"","scen":"","o":[{"t":"W fazie 6 – Czy dotarliśmy do celu?","ok":false,"w":"Faza 6 korzysta z miar, by monitorować korzyści."},{"t":"W fazie 2 – Gdzie jesteśmy teraz?","ok":false,"w":"W fazie 2 ocenia się stan obecny."},{"t":"W fazie 7 – Jak utrzymać motywację do działania?","ok":false,"w":"W fazie 7 ocenia się ogólny sukces."},{"t":"W fazie 5 – Jak się tam dostaniemy?","ok":true,"w":"Opis fazy 5 przewiduje definiowanie miar i wprowadzenie monitorowania przy wdrażaniu rozwiązań. Faza 6 wykorzystuje miary do monitorowania korzyści. Mierniki pojawiają się także wcześniej, np. w uzasadnieniu biznesowym."}],"fz":{"h":"Miary i monitorowanie – faza 5","p":"P1","pulapka":true,"n":"EN: Measures defined in phase 5","q":"Definiowanie miar i monitorowania – faza 5 czy 6?","a":"Faza 5 wprowadza miary i monitorowanie przy wdrażaniu; faza 6 korzysta z nich, by monitorować uzyskanie korzyści. Mierniki są jednak obecne wcześniej – już w uzasadnieniu biznesowym.","ex":"Mierniki korzyści zapisano już w uzasadnieniu biznesowym. W fazie 5 zespół uruchamia ich pomiar w nowym rozwiązaniu, a w fazie 6 regularnie sprawdza korzyści. Fazy mają różne akcenty, nie rozłączne prawa do mierników.","org":""},"cyt":{"s":"38","t":"Istnieje możliwość zdefiniowania miar i wprowadzenia procesu monitorowania na podstawie celów i mierników COBIT","w":"ZGODNE","u":"Zdanie z opisu fazy 5; nazwa „Jak się tam dostaniemy?” to termin egzaminu."}},"fz-D-033":{"id":"fz-D-033","typ":"egzamin","s":"IM-02-07","t":"W której fazie planuje się projekty z uzasadnieniami biznesowymi i plan zmian?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 38"],"r":null,"zap":"","scen":"","o":[{"t":"W fazie 3 – Do czego dążymy?","ok":false,"w":"W fazie 3 określa się stan docelowy i mapę drogową."},{"t":"W fazie 5 – Jak się tam dostaniemy?","ok":false,"w":"W fazie 5 rozwiązania przechodzą w praktykę."},{"t":"W fazie 1 – Jakie są wyznaczniki?","ok":false,"w":"W fazie 1 identyfikuje się wyznaczniki."},{"t":"W fazie 4 – Jakie działania należy podjąć?","ok":true,"w":"Podręcznik: w fazie 4 planuje się projekty wspierane przez uzasadnienia biznesowe (FW-PL s. 38)."}],"fz":{"h":"Projekty z uzasadnieniami – faza 4","p":"P1","pulapka":true,"n":"EN: Projects with business cases – phase 4","q":"Projekty z uzasadnieniami biznesowymi – w której fazie?","a":"W fazie 4 (Jakie działania należy podjąć?) – planuje się praktyczne rozwiązania i plan zmian.","ex":"Faza 4 = kosztorysy: każdą większą pracę (kuchnia, łazienka) rozpisujesz jako osobne zlecenie z wyliczeniem, czy się opłaca. „Jakie działania?” = konkretne zlecenia.","org":""},"cyt":{"s":"38","t":"W fazie 4 planuje się praktyczne rozwiązania, definiując projekty wspierane przez uzasadnienia biznesowe. Opracowuje się również plan zmian w odniesieniu do wdrożenia.","w":"ZGODNE"}},"fz-D-034":{"id":"fz-D-034","typ":"egzamin","s":"IM-02-02","t":"Do której kategorii należy pojawienie się nowego CIO w organizacji?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 37"],"r":null,"zap":"","scen":"","o":[{"t":"Punkt zapalny","ok":false,"w":"Punkt zapalny to istniejący problem, a nowy CIO niczego nie zepsuł."},{"t":"Zdarzenie wyzwalające","ok":true,"w":"Nowy CIO to zmiana, która daje okazję do działania."},{"t":"Szybka korzyść","ok":false,"w":"Szybkie korzyści to usprawnienia wybierane w fazie 3."},{"t":"Element mapy drogowej","ok":false,"w":"Mapa drogowa to plan działań z fazy 3."}],"fz":{"h":"Nowy CIO","p":"P1","pulapka":true,"n":"EN: New CIO = trigger event","q":"Nowy CIO – punkt zapalny czy zdarzenie wyzwalające?","a":"Zdarzenie wyzwalające. Złożone modele operacyjne IT czy nieudane projekty to punkty zapalne.","ex":"Nowy szef IT (CIO) jeszcze niczego nie zepsuł – to zmiana, która daje okazję do działania, jak nowy trener w drużynie. Zapalny = coś już boli.","org":""},"cyt":{"s":"37","t":"nowy dyrektor generalny (CEO), dyrektor ds. finansowych (CFO), dyrektor ds. informatyki (CIO) itd.","w":"ZGODNE"},"przyklad":"Sytuacja: W organizacji pojawił się nowy CIO."},"fz-D-035":{"id":"fz-D-035","typ":"egzamin","s":"IM-02-05","t":"Co jest częstą przyczyną niepowodzenia wdrożeń Ładu IT?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 37"],"r":null,"zap":"","scen":"","o":[{"t":"Nieosiąganie przez procesy poziomu 5 zdolności","ok":false,"w":"Poziom 5 rzadko jest celem i nie jest wskazany jako przyczyna porażki."},{"t":"Zbyt mało uwagi dla ludzi, kultury i zachowań","ok":true,"w":"Podręcznik ostrzega przed pomijaniem ludzkich, behawioralnych i kulturowych aspektów zmiany. Samo zaprojektowanie poprawnych aktywatorów nie zapewnia ich przyjęcia; potrzebne są komunikacja, motywowanie i wsparcie interesariuszy."},{"t":"Normatywny i zbyt sztywny przewodnik wdrożenia","ok":false,"w":"Przewodnik nie jest normatywny."},{"t":"Aktualizowanie uzasadnienia biznesowego w cyklu","ok":false,"w":"To dobra praktyka, a nie przyczyna porażki."}],"fz":{"h":"Dlaczego wdrożenia się nie udają","p":"P2","pulapka":false,"n":"EN: Behaviour and culture neglected","q":"Dlaczego wdrożenia Ładu IT często się nie udają?","a":"Podręcznik wskazuje m.in. brak odpowiedniego ukierunkowania, wsparcia i nadzoru ze strony interesariuszy (FW-PL s. 36) oraz zbyt małą uwagę dla ludzi, zachowań i kultury oraz motywowania do zmiany (FW-PL s. 37) – stąd osobny pierścień Aktywowania zmiany.","ex":"Jak firmowa siłownia, do której nikt nie chodzi: sprzęt jest, ale nikt nie przekonał ludzi. Dlatego osobny pierścień zajmuje się ludźmi.","org":""},"cyt":{"s":"37","t":"zbyt małą wagę przywiązuje się do zarządzania tymi aspektami zmiany, które dotyczą osób, zachowania i kultury, a także do motywowania interesariuszy do zaakceptowania zmiany","w":"CZESCIOWO","u":"FW nie podaje tego jako przyczyny niepowodzeń; wprost (s. 36) inicjatywy IT „często kończą się niepowodzeniem z powodu braku odpowiedniego ukierunkowania działań, wsparcia i nadzoru”."}},"fz-D-036":{"id":"fz-D-036","typ":"egzamin","s":"IM-02-02","t":"Które stwierdzenie opisuje rolę aktywatorów we wdrożeniu COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 36"],"r":null,"zap":"","scen":"","o":[{"t":"Wdrożenie kończy się, gdy działa siedem aktywatorów","ok":false,"w":"Aktywatory służą rozwiązaniu problemów, a nie są celem."},{"t":"Ich wdrożenia wymaga norma ISO/IEC 15504","ok":false,"w":"Norma dotyczy oceny procesów, nie celu wdrożenia."},{"t":"W COBIT 5 aktywatorami są tylko procesy","ok":false,"w":"COBIT 5 ma siedem kategorii aktywatorów, procesy to jedna z nich."},{"t":"Mają rozwiązywać realne potrzeby biznesowe","ok":true,"w":"Aktywatory mają rozwiązywać rzeczywiste potrzeby i problemy biznesowe. Ich wdrożenie nie jest celem samym w sobie; kierownictwo powinno uzgodnić potrzebę działania i oczekiwane korzyści."}],"fz":{"h":"Aktywatory a realne potrzeby","p":"P2","pulapka":false,"n":"EN: Enablers solve real business needs","q":"Czy aktywatory COBIT są celem samym w sobie?","a":"Nie. Mają rozwiązywać realne potrzeby i problemy biznesowe, zidentyfikowane z punktów zapalnych i wyznaczników.","ex":"Jak wiertarka: kupujesz ją, żeby powiesić półkę, a nie dla samej wiertarki. Aktywatory (np. procesy, role, zasady) mają rozwiązać konkretny problem firmy.","org":""},"cyt":{"s":"36","t":"Czynniki umożliwiające oparte na metodyce COBIT powinny zapewnić rozwiązanie odnoszące się do realnych potrzeb i problemów biznesowych, nie mogą być celem samym w sobie.","w":"ZGODNE"}},"fz-D-037":{"id":"fz-D-037","typ":"egzamin","s":"IM-02-06,IM-02-07","t":"Jak polskie wydanie COBIT 5 nazywa fazę 7, na egzaminie „Jak utrzymać motywację do działania?”?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 38"],"r":null,"zap":"","scen":"","o":[{"t":"Jak utrzymać obecną dynamikę?","ok":true,"w":"To podręcznikowa nazwa fazy 7."},{"t":"Czy cel został osiągnięty?","ok":false,"w":"To podręcznikowa nazwa fazy 6."},{"t":"Jak osiągnąć założony cel?","ok":false,"w":"To podręcznikowa nazwa fazy 5."},{"t":"Jaka jest nasza obecna sytuacja?","ok":false,"w":"To podręcznikowa nazwa fazy 2."}],"fz":{"h":"Nazwy faz 2, 5, 6, 7: egzamin a podręcznik","p":"P2","pulapka":true,"n":"EN: Phases 2, 5, 6, 7: Where are we now? How do we get there? Did we get there? How do we keep the momentum going?","q":"Pytania faz 2, 5, 6 i 7 – jak brzmią na egzaminie, a jak w podręczniku?","a":"Egzamin (podr.): 2 Gdzie jesteśmy teraz? (Jaka jest nasza obecna sytuacja?); 5 Jak się tam dostaniemy? (Jak osiągnąć założony cel?); 6 Czy dotarliśmy do celu? (Czy cel został osiągnięty?); 7 Jak utrzymać motywację do działania? (Jak utrzymać obecną dynamikę?). Fazy 1, 3, 4 brzmią tak samo.","ex":"Jak jeden przepis w dwóch książkach kucharskich: inne słowa, te same kroki.","org":""},"cyt":{"s":"38","t":"o b e c n ą d y n a m i k ę ? 1 m a ć r t z y u e m y ż m o k d a ą l J 7","w":"ZGODNE"}},"fz-D-038":{"id":"fz-D-038","typ":"egzamin","s":"PC-01-02","t":"Ile atrybutów procesu ma model zdolności i jak się rozkładają?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42","FW-PL s. 43","PeopleCert Syllabus — PC-01-02"],"r":null,"zap":"","scen":"","o":[{"t":"Sześć: po jednym na każdy poziom 0–5","ok":false,"w":"Poziom 0 nie ma atrybutu, a poziomy 2–5 mają po dwa."},{"t":"Dziesięć: po dwa na poziomy 1–5","ok":false,"w":"Poziom 1 ma tylko jeden atrybut: PA (Process Attribute — atrybut procesu) 1.1."},{"t":"Dziewięć: poziom 1 – jeden, poziomy 2–5 – po dwa","ok":true,"w":"Model zawiera dziewięć atrybutów: jeden na poziomie 1 i po dwa na poziomach 2–5. Poziom 0 nie ma własnego atrybutu. Każdy atrybut jest mierzalną cechą zdolności procesu, nie pojedynczym zadaniem na egzaminie."},{"t":"Dziewięć: poziom 0 – jeden, poziomy 1–4 – po dwa","ok":false,"w":"Poziom 0 nie ma atrybutu, a poziom 5 ma dwa."}],"fz":{"h":"Atrybuty procesu","p":"P1","pulapka":false,"n":"egzamin: atrybuty procesu · podr.: atrybuty potencjału procesu · EN: process attributes (PA)","q":"Ile jest atrybutów i jak się rozkładają? | Ile atrybutów procesu ma model i jak się rozkładają?","a":"9 atrybutów, czyli 9 mierzalnych cech zdolności; każdy dostaje ocenę N/C/W/P. Poziom 1: PA 1.1 Wykonanie procesu (czy cel jest osiągany). Poziom 2: PA 2.1 Zarządzanie wydajnością (plan i pilnowanie), PA 2.2 Zarządzanie produktami pracy (porządek w dokumentach i wynikach). Poziom 3: PA 3.1 Definicja procesu (zdefiniowany standard), PA 3.2 Wdrożenie procesu (standard stosowany w praktyce). Poziom 4: PA 4.1 Miara procesu (podr.: Pomiar procesu), PA 4.2 Kontrola procesu (trzymanie w granicach). Poziom 5: PA 5.1 Innowacja procesu, PA 5.2 Optymalizacja procesu. Poziom 0 nie ma atrybutu. | Dziewięć: poziom 1 – jeden, poziomy 2–5 – po dwa.","ex":"Poziom 1 ma jeden atrybut, a każdy z poziomów 2–5 po dwa. Atrybut obejmuje określone kryteria i jest oceniany na podstawie dowodów. Rachunek 1 + 4 × 2 = 9 dotyczy liczby atrybutów, nie liczby pytań ani zadań oceny.","org":"DSS02: PA 1.1 = W, PA 2.1 = C → poziom 1."},"cyt":{"s":"43","t":"W przypadku normy ISO/IEC 15504 poziomy potencjału definiuje się za pomocą zbioru dziewięciu atrybutów procesów.","w":"ZGODNE","u":"Rozkład 1 + 4×2 – opisy poziomów na s. 42 („jeden atrybut”, „dwa atrybuty”)."}},"fz-D-039":{"id":"fz-D-039","typ":"egzamin","s":"PC-02-05","t":"Które stwierdzenie opisuje relację ocen dojrzałości COBIT 4.1 i zdolności COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 41","FW-PL s. 43"],"r":null,"zap":"","scen":"","o":[{"t":"Skale są identyczne, wystarczy przepisać wynik","ok":false,"w":"Podręcznik: między poziomami dojrzałości COBIT 4.1 a poziomami potencjału nie ma prostego przełożenia (FW-PL s. 43)."},{"t":"Wystarczy dodać jeden poziom do wyniku","ok":false,"w":"Wyniki w COBIT 5 są zwykle niższe, a nie wyższe."},{"t":"COBIT 4.1 nie oceniał w ogóle procesów","ok":false,"w":"COBIT 4.1 miał modele dojrzałości dla procesów."},{"t":"Skale różnią się i brak prostego przełożenia","ok":true,"w":"COBIT 5 ocenia zdolność według ISO/IEC 15504, a mapowanie skali jest tylko przybliżone; mimo podobnych słów modele różnią się zakresem i intencją (FW-PL s. 43)."}],"fz":{"h":"COBIT 4.1 a model zdolności","p":"P1","pulapka":true,"n":"egzamin: model dojrzałości / zdolności · podr.: model dojrzałości / potencjału · EN: maturity model vs capability model","q":"Czym różni się ocena w COBIT 5 od COBIT 4.1? | Czy wyniki COBIT 4.1 i COBIT 5 da się prosto porównać?","a":"COBIT 4.1 miał modele dojrzałości dla procesów; COBIT 5 ocenia zdolność wg ISO/IEC 15504. Wyniki są zwykle niższe i nie ma prostego przełożenia. | Nie. Mimo podobnych skal i słów różnią się zakresem, ukierunkowaniem i intencją; mapowanie skali jest tylko przybliżone (Rysunek 20).","ex":"Jak zmiana egzaminatora na surowszego: stara skala była opisowa, nowa wg normy ISO wymaga dowodów. Ta sama kuchnia dostaje zwykle niższą ocenę, a starej nie przeliczysz 1:1. | Jak przeliczanie polskich ocen szkolnych na amerykańskie A–F: wygląda podobnie, ale mierzy co innego, więc przełożenie jest tylko orientacyjne.","org":""},"cyt":{"s":"43","t":"porównanie takie jest jednak trudne ze względu na różnice w zakresie, ukierunkowaniu i intencjach","w":"ZGODNE"}},"fz-D-040":{"id":"fz-D-040","typ":"egzamin","s":"PC-01-01","t":"Na jakiej normie oparto model zdolności procesu COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 41","PeopleCert Syllabus — PC-01-01"],"r":null,"zap":"","scen":"","o":[{"t":"ISO/IEC 15504","ok":true,"w":"Historyczną podstawą modelu zdolności COBIT 5 jest ISO/IEC 15504 — Software Engineering: Process Assessment, czyli Inżynieria oprogramowania: ocena procesów. Nie należy zastępować tej podstawy modelem oceny z COBIT 2019."},{"t":"ISO/IEC 27001","ok":false,"w":"Podręcznik wskazuje ISO/IEC 15504, nie tę normę."},{"t":"ISO/IEC 20000","ok":false,"w":"Podręcznik wskazuje ISO/IEC 15504, nie tę normę."},{"t":"ISO 9001","ok":false,"w":"Podręcznik wskazuje ISO/IEC 15504, nie tę normę."}],"fz":{"h":"ISO/IEC 15504","p":"P1","pulapka":false,"n":"egzamin: ISO/IEC 15504 · podr.: ISO/IEC 15504 · EN: ISO/IEC 15504","q":"Na jakiej normie oparto model zdolności? | Na jakiej normie opiera się model zdolności procesu COBIT 5?","a":"ISO/IEC 15504 (ocena procesów). Ocena dotyczy procesu, nie całej organizacji. | ISO/IEC 15504 (Software Engineering – Process Assessment). Szczegóły: Model Oceny Procesu (PAM).","ex":"Norma ISO to jak oficjalny regulamin egzaminu, jednakowy na całym świecie. Ocenia się jedno stanowisko w kuchni (proces), a nie całą restaurację. | Norma to regulamin egzaminu, a Model Oceny Procesu (PAM) to szczegółowy arkusz pytań, z którym przychodzi inspektor.","org":""},"cyt":{"s":"41","t":"Do produktów COBIT 5 należy również model potencjału procesu oparty na uznanej międzynarodowej normie ISO/ IEC 15504 Software Engineering — Process Assessment","w":"ZGODNE"}},"fz-D-041":{"id":"fz-D-041","typ":"egzamin","s":"PC-02-01","t":"Na jakiej podstawie przeprowadza się formalną ocenę zdolności procesu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 45","FW-PL s. 41","PeopleCert Syllabus — PC-02-01"],"r":null,"zap":"","scen":"","o":[{"t":"Na podstawie deklaracji właściciela procesu, bez dowodów","ok":false,"w":"Inspektor nie wierzy na słowo – potrzebne są dowody."},{"t":"Na podstawie wyników finansowych całej organizacji","ok":false,"w":"Ocena dotyczy procesu, a nie całej organizacji."},{"t":"Na podstawie liczby pracowników działu IT","ok":false,"w":"Nie jest to podstawa oceny wskazana w podręczniku; liczą się wyniki, praktyki i produkty pracy."},{"t":"Na podstawie dowodów: wyników, praktyk i produktów pracy","ok":true,"w":"Formalna ocena opiera się na obiektywnych dowodach odnoszących się do ocenianego procesu: rezultatach, praktykach i produktach pracy. W uproszczonej samoocenie rygor jest mniejszy, a wynik ma charakter orientacyjny."}],"fz":{"h":"Ocena zdolności procesu","p":"P1","pulapka":false,"n":"egzamin: ocena zdolności procesu · podr.: ocena potencjału procesu · EN: process capability assessment","q":"Co ocenia się w formalnej ocenie zdolności procesu?","a":"Na podstawie dowodów ocenia się osiąganie przeznaczenia procesu i jego atrybutów. Dowody pochodzą m.in. z rezultatów, praktyk i produktów pracy. Ocena procesów obejmuje jedną z siedmiu kategorii aktywatorów. Uproszczona samoocena ma mniejszy rygor i wynik orientacyjny.","ex":"Inspektor nie wierzy na słowo: przegląda zamówienia i rachunki, pyta kucharzy. Sprawdza jednak tylko procesy, a to jeden z siedmiu aktywatorów.","org":"próbka 40 zgłoszeń, monitoring, wywiady."},"cyt":{"s":"45","t":"Weryfikacja wyników procesu na podstawie ich charakterystyki zawartej w szczegółowych opisach procesów i wykorzystanie skali ocen ISO/IEC 15504 do przypisania ratingu określającego stopień, w jakim osiągnięto cel.","w":"ZGODNE","u":"FW opisuje „ogólną ocenę” w 3 krokach (wyniki, praktyki, produkty działań); skala odwołuje się do dowodów. Pojęcie „formalnej oceny” z PAM/Assessor Guide."}},"fz-D-042":{"id":"fz-D-042","typ":"egzamin","s":"PC-02-01","t":"Które stwierdzenie poprawnie opisuje ocenę zdolności procesów jako obraz Ładu organizacji?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 41","PeopleCert Syllabus — PC-02-01"],"r":null,"zap":"","scen":"","o":[{"t":"Procesy to tylko jeden z siedmiu aktywatorów","ok":true,"w":"Procesy są jedną z siedmiu kategorii aktywatorów, więc ocena procesów nie daje pełnego obrazu Ładu. Ich ocena dostarcza ważnych informacji, ale nie zastępuje oceny pozostałych aktywatorów i ich zależności (FW-PL s. 41)."},{"t":"Procesy obejmują wszystkie pozostałe aktywatory","ok":false,"w":"Procesy to jedna z siedmiu kategorii aktywatorów."},{"t":"Poziom 5 wszystkich procesów potwierdza cały Ład","ok":false,"w":"Wysoka zdolność procesów jest wartościową informacją, ale nie zastępuje oceny pozostałych kategorii aktywatorów i ich zależności."},{"t":"Ocenie podlegają wyłącznie procesy domeny EDM","ok":false,"w":"Ocenia się procesy, nie tylko EDM (Evaluate, Direct and Monitor — Oszacuj, Kieruj i Monitoruj); problemem jest pominięcie innych aktywatorów."}],"fz":{"h":"Ocena procesów a pełny obraz Ładu","p":"P1","pulapka":false,"n":"EN: Process assessment is only one enabler","q":"Czy ocena procesów daje pełny obraz Ładu w organizacji?","a":"Nie. Procesy to tylko jeden z siedmiu aktywatorów; trzeba ocenić też pozostałe.","ex":"Ocena samych przepisów nie mówi wszystkiego o restauracji – liczą się też ludzie, sprzęt, informacje, kultura. Procesy to jeden z siedmiu elementów.","org":""},"cyt":{"s":"41","t":"procesy są tylko jednym z siedmiu czynników umożliwiających dotyczących nadzoru nad ryzykiem i zarządzania nim. W związku z tym oszacowanie procesów nie zapewni pełnego obrazu stanu nadzoru w danym przedsiębiorstwie.","w":"ZGODNE"}},"fz-D-043":{"id":"fz-D-043","typ":"egzamin","s":"PC-01-01","t":"Co oznacza poziom 0 – Proces niekompletny?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42","PeopleCert Syllabus — PC-01-01"],"r":null,"zap":"","scen":"","o":[{"t":"Proces osiąga cel, ale działa bez planowania","ok":false,"w":"To poziom 1 – Proces wykonywany."},{"t":"Proces nie jest wdrożony lub nie osiąga celu","ok":true,"w":"Poziom 0 oznacza proces niewdrożony lub taki, który nie osiąga przeznaczenia; jest niewiele dowodów lub brak dowodów systematycznego osiągania celu. Poziom 1 wymaga co najmniej większościowego osiągnięcia PA (Process Attribute — atrybut procesu) 1.1, ocenionego na podstawie wymaganych rezultatów. Samo istnienie czynności lub dokumentu nie ustala poziomu."},{"t":"Proces działa według standardu, bez pomiaru","ok":false,"w":"To poziom 3 – Proces ustanowiony."},{"t":"Proces ma ocenę W na atrybucie PA 1.1","ok":false,"w":"W na PA (Process Attribute — atrybut procesu) 1.1 wystarcza już do poziomu 1."}],"fz":{"h":"Poziom 0 i poziom 1","p":"P1","pulapka":false,"n":"egzamin: niekompletny, wykonywany · podr.: niekompletny, wykonywany · EN: Level 0 Incomplete, Level 1 Performed","q":"Czym są poziomy 0 i 1? | Co oznacza poziom 0 – Proces niekompletny?","a":"0: proces niekompletny, nie osiąga celu. 1: proces wykonywany, osiąga swój cel (PA 1.1). Poziom 1 jest szczególny: ocenia się wyn
