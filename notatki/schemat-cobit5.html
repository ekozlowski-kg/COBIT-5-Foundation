":"IM-02-06","t":"Co dzieje się w fazie 1 „Jakie są wyznaczniki?”?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 38"],"r":null,"zap":"","scen":"","o":[{"t":"Określa się stan docelowy i analizuje luki","ok":false,"w":"To faza 3."},{"t":"Ocenia się stan obecny i zdolność procesów","ok":false,"w":"To faza 2."},{"t":"Uzgadnia się potrzebę inicjatywy oraz identyfikuje punkty zapalne i zdarzenia wyzwalające","ok":true,"w":"Faza 1 rozpoznaje i uzgadnia potrzebę działania, w tym aktualne punkty zapalne i zdarzenia wyzwalające. Trzy pierścienie obejmują inicjowanie programu, ustanowienie chęci zmiany i rozpoznanie potrzeby działania."},{"t":"Ocenia się ogólny sukces i wzmacnia potrzebę ciągłego doskonalenia","ok":false,"w":"To faza 7."}],"fz":{"h":"Faza 1 „Jakie są wyznaczniki?”","p":"P1","pulapka":false,"n":"EN: Initiate programme; Establish desire to change; Recognise need to act","q":"Faza 1 „Jakie są wyznaczniki?” – co się dzieje i jakie działania pierścieni?","a":"Uzgadnia się potrzebę inicjatywy, identyfikuje punkty zapalne i zdarzenia wyzwalające. Program: Inicjowanie programu. Zmiana: Ustanowienie chęci zmiany. Doskonalenie: Rozpoznanie potrzeby działania.","ex":"Remont: zgadzacie się, że trzeba – bo cieknie dach (punkt zapalny) albo rodzi się dziecko (zdarzenie wyzwalające). Domownicy chcą zmiany, widać potrzebę działania.","org":""}},"fz-D-018":{"id":"fz-D-018","typ":"egzamin","s":"IM-02-06","t":"Które działanie kręgu Aktywowania zmiany przypada na fazę 2 „Gdzie jesteśmy teraz?”?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 38"],"r":null,"zap":"","scen":"","o":[{"t":"Utworzenie zespołu wdrożeniowego","ok":true,"w":"Utworzenie zespołu wdrożeniowego należy do aktywowania zmiany w fazie 2. Równolegle program definiuje problemy i okazje, a ciągłe doskonalenie ocenia stan obecny. To przypisanie na rysunku nie zabrania współpracy zespołów."},{"t":"Ustanowienie chęci zmiany","ok":false,"w":"To faza 1."},{"t":"Komunikowanie rezultatu","ok":false,"w":"To faza 3."},{"t":"Identyfikacja odtwórców ról","ok":false,"w":"To faza 4."}],"fz":{"h":"Faza 2 „Gdzie jesteśmy teraz?”","p":"P1","pulapka":false,"n":"EN: Define problems and opportunities; Form implementation team; Assess current state","q":"Faza 2 „Gdzie jesteśmy teraz?” – co się dzieje i jakie działania pierścieni?","a":"Zakres: cele organizacji przekłada się na cele IT i procesy; scenariusze ryzyka (co może pójść źle); ocena stanu obecnego i zdolności procesów. Program: Definiowanie problemów i okazji. Zmiana: Utworzenie zespołu wdrożeniowego. Doskonalenie: Ocena stanu obecnego.","ex":"Remont: obchodzisz mieszkanie z kartką – co jest w złym stanie, co pilne, co grozi awarią – i kompletujesz ekipę. Najpierw szczery opis tego, jak jest.","org":""}},"fz-D-019":{"id":"fz-D-019","typ":"egzamin","s":"IM-02-06","t":"Które działanie cyklu ciągłego doskonalenia odpowiada fazie 3 „Do czego dążymy?”?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 38"],"r":null,"zap":"","scen":"","o":[{"t":"Ocena stanu obecnego","ok":false,"w":"To faza 2."},{"t":"Zdefiniowanie stanu docelowego","ok":true,"w":"Faza 3 określa stan docelowy i analizuje luki oraz możliwe rozwiązania. W tym pierścieniu jest to Define target state — Zdefiniowanie stanu docelowego. Zarządzanie programem definiuje mapę drogową, a aktywowanie zmiany komunikuje rezultat."},{"t":"Budowanie usprawnień","ok":false,"w":"To faza 4."},{"t":"Wdrażanie usprawnień","ok":false,"w":"To faza 5."}],"fz":{"h":"Faza 3 „Do czego dążymy?”","p":"P1","pulapka":false,"n":"EN: Define road map; Communicate outcome; Define target state","q":"Faza 3 „Do czego dążymy?” – co się dzieje i jakie działania pierścieni?","a":"Określa się stan docelowy, analizuje luki i rozwiązania, priorytet mają szybkie korzyści i największe korzyści. Program: Definiowanie mapy drogowej. Zmiana: Komunikowanie rezultatu. Doskonalenie: Zdefiniowanie stanu docelowego.","ex":"Remont: wybierasz, jak ma wyglądać mieszkanie, widzisz różnicę między „jest” a „ma być” (luka) i ustalasz kolejność prac. Najpierw drobiazgi dające szybki efekt.","org":""}},"fz-D-020":{"id":"fz-D-020","typ":"egzamin","s":"IM-02-07","t":"Które działanie kręgu zarządzania programem przypada na fazę 4 „Jakie działania należy podjąć?”?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 38"],"r":null,"zap":"","scen":"","o":[{"t":"Wykonywanie planu","ok":false,"w":"To faza 5."},{"t":"Planowanie programu","ok":true,"w":"Planowanie programu należy do fazy 4. Projekty mają praktyczne rozwiązania i uzasadnienia biznesowe; równolegle identyfikuje się osoby pełniące role oraz opracowuje usprawnienia."},{"t":"Definiowanie mapy drogowej","ok":false,"w":"To faza 3."},{"t":"Realizacja korzyści","ok":false,"w":"To faza 6."}],"fz":{"h":"Faza 4 „Jakie działania należy podjąć?”","p":"P1","pulapka":false,"n":"EN: Plan programme; Identify role players; Build improvements","q":"Faza 4 „Jakie działania należy podjąć?” – co się dzieje i jakie działania pierścieni?","a":"Planuje się praktyczne rozwiązania: projekty z uzasadnieniami biznesowymi i plan zmian. Program: Planowanie programu. Zmiana: Identyfikacja odtwórców ról. Doskonalenie: Budowanie usprawnień.","ex":"Remont: rozpisujesz prace na konkretne zlecenia z kosztorysem, ustalasz, kto co robi (elektryk, hydraulik, kto pilnuje), a ekipa przygotowuje materiały.","org":""}},"fz-D-021":{"id":"fz-D-021","typ":"egzamin","s":"IM-02-07","t":"Który zestaw działań pierścieni (program / zmiana / doskonalenie) należy do fazy 5 „Jak się tam dostaniemy?”?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 38","SP1 s. 38"],"r":null,"zap":"","scen":"","o":[{"t":"Planowanie programu / Identyfikacja odtwórców ról / Budowanie usprawnień","ok":false,"w":"To działania fazy 4."},{"t":"Wykonywanie planu / Działaj i używaj / Wdrażanie usprawnień","ok":true,"w":"Faza 5 przekształca rozwiązania w praktyczne działania: Execute plan — Wykonywanie planu; Operate and use — Działaj i używaj; Implement improvements — Wdrażanie usprawnień. Są to działania trzech współdziałających pierścieni."},{"t":"Realizacja korzyści / Umożliwianie nowych podejść / Eksploatacja i pomiar","ok":false,"w":"Embed new approaches — Integracja lub utrwalanie nowych podejść — należy do środkowego pierścienia fazy 6. W polskim arkuszu spotyka się wariant Umożliwianie nowych podejść. Chodzi o trwałe zakorzenienie nowego sposobu działania, nie o ponowne przygotowywanie zmiany."},{"t":"Przegląd skuteczności / Utrzymanie / Monitorowanie i szacowanie","ok":false,"w":"To działania fazy 7."}],"fz":{"h":"Faza 5 „Jak się tam dostaniemy?”","p":"P1","pulapka":false,"n":"EN: Execute plan; Operate and use; Implement improvements","q":"Faza 5 „Jak się tam dostaniemy?” – co się dzieje i jakie działania pierścieni?","a":"Rozwiązania przechodzą w praktykę; definiuje się miary i monitorowanie. Program: Wykonywanie planu. Zmiana: Działaj i używaj. Doskonalenie: Wdrażanie usprawnień.","ex":"Remont: ekipa wchodzi i robi, domownicy zaczynają korzystać z nowej kuchni, a ty ustalasz, po czym poznasz sukces, np. niższe rachunki za prąd.","org":""}},"fz-D-022":{"id":"fz-D-022","typ":"egzamin","s":"IM-02-07","t":"Co jest istotą fazy 6 „Czy dotarliśmy do celu?”?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 38"],"r":null,"zap":"","scen":"","o":[{"t":"Trwałe korzystanie z nowych aktywatorów i monitorowanie korzyści","ok":true,"w":"W fazie 6 trwale wykorzystuje się nowe lub ulepszone aktywatory i monitoruje uzyskiwanie spodziewanych korzyści. Działania pierścieni to realizacja korzyści, utrwalanie nowych podejść oraz eksploatacja i pomiar."},{"t":"Określenie stanu docelowego i analiza luk","ok":false,"w":"To faza 3."},{"t":"Utworzenie zespołu wdrożeniowego","ok":false,"w":"To działanie kręgu zmiany w fazie 2."},{"t":"Uzgodnienie potrzeby inicjatywy","ok":false,"w":"To faza 1."}],"fz":{"h":"Faza 6 „Czy dotarliśmy do celu?”","p":"P1","pulapka":false,"n":"EN: Realise benefits; Embed new approaches; Operate and measure","q":"Faza 6 „Czy dotarliśmy do celu?” – co się dzieje i jakie działania pierścieni?","a":"Faza 6 to trwałe korzystanie z nowych lub ulepszonych aktywatorów i monitorowanie korzyści. Program: Realizacja korzyści. Zmiana: Embed new approaches — Integracja i utrwalanie nowych podejść; w polskim arkuszu Umożliwianie nowych podejść. Doskonalenie: Eksploatacja i pomiar.","ex":"Remont: mieszkasz w odnowionym mieszkaniu na co dzień, nowe nawyki się utrwalają, a ty sprawdzasz, czy rachunki naprawdę spadły. Czy obiecany efekt przyszedł?","org":""}},"fz-D-023":{"id":"fz-D-023","typ":"egzamin","s":"IM-02-07","t":"Które działanie kręgu Aktywowania zmiany przypada na fazę 7 „Jak utrzymać motywację do działania?”?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 38","SP1 s. 38"],"r":null,"zap":"","scen":"","o":[{"t":"Utrzymanie","ok":true,"w":"Sustain — Utrzymanie — jest działaniem aktywowania zmiany w fazie 7. W tej samej fazie program przegląda skuteczność, a ciągłe doskonalenie monitoruje i ocenia. Wyniki przeglądu mogą uruchomić następną iterację."},{"t":"Działaj i używaj","ok":false,"w":"To faza 5."},{"t":"Umożliwianie nowych podejść","ok":false,"w":"Embed new approaches — Integracja lub utrwalanie nowych podejść — należy do środkowego pierścienia fazy 6. W polskim arkuszu spotyka się wariant Umożliwianie nowych podejść. Chodzi o trwałe zakorzenienie nowego sposobu działania, nie o ponowne przygotowywanie zmiany."},{"t":"Ustanowienie chęci zmiany","ok":false,"w":"To faza 1."}],"fz":{"h":"Faza 7 „Jak utrzymać motywację do działania?”","p":"P1","pulapka":false,"n":"EN: How do we keep the momentum going? — jak utrzymać dynamikę; Review effectiveness — Przegląd skuteczności; Sustain — Utrzymanie; Monitor and evaluate — Monitorowanie i szacowanie","q":"Co dzieje się w fazie 7 i jakie są działania trzech pierścieni?","a":"Faza 7: egzaminacyjnie Jak utrzymać motywację do działania?, w podręczniku Jak możemy utrzymać obecną dynamikę? Przegląda się ogólny sukces, identyfikuje dalsze potrzeby Ładu i Zarządzania oraz utrwala doskonalenie. Program: Przegląd skuteczności. Zmiana: Utrzymanie. Doskonalenie: Monitorowanie i szacowanie. Wyniki mogą uzasadnić kolejną iterację.","ex":"Remont: po roku oceniasz, co się udało i co jeszcze poprawić, i pilnujesz, żeby nie wrócił stary bałagan. Potem kolejna runda, np. łazienka.","org":""}},"fz-D-024":{"id":"fz-D-024","typ":"egzamin","s":"IM-01-01","t":"Dlaczego duże wdrożenie dzieli się na iteracje cyklu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 38"],"r":null,"zap":"","scen":"","o":[{"t":"Bo norma ISO/IEC 15504 zabrania wdrożeń dłuższych niż rok","ok":false,"w":"Podręcznik nie wiąże iteracji z normą ISO."},{"t":"Bo każda iteracja musi kończyć się osiągnięciem poziomu 5","ok":false,"w":"Poziom docelowy dobiera się do potrzeb, rzadko jest nim 5."},{"t":"Bo inicjatywa trwająca dłużej niż sześć miesięcy grozi utratą tempa, skupienia i poparcia interesariuszy","ok":true,"w":"Podręcznik wskazuje ryzyko utraty dynamiki, koncentracji i akceptacji interesariuszy przy inicjatywie trwającej ponad sześć miesięcy. Uzasadnia to podział większych programów na iteracje; nie jest to normatywny zakaz dłuższych programów."},{"t":"Bo przewodnik nakazuje dokładnie trzy iteracje","ok":false,"w":"Przewodnik nie jest normatywny i nie nakazuje liczby iteracji."}],"fz":{"h":"Iteracje cyklu","p":"P2","pulapka":false,"n":"EN: More than six months – risk of losing momentum","q":"Dlaczego duże wdrożenie dzieli się na iteracje cyklu?","a":"Inicjatywa trwająca dłużej niż sześć miesięcy grozi utratą tempa (dynamiki), skupienia i poparcia zaangażowanych (interesariuszy).","ex":"Jak odchudzanie: plan na dwa lata łatwo porzucić, a cele na kilka miesięcy dają widoczne efekty i motywują. Haczyk: ponad pół roku – rośnie ryzyko utraty tempa.","org":""}},"fz-D-025":{"id":"fz-D-025","typ":"egzamin","s":"IM-02-06","t":"W której fazie szczegółowo analizuje się luki i możliwe rozwiązania, nadając priorytet prostszym usprawnieniom o największych korzyściach?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 38","FW-PL s. 36"],"r":null,"zap":"","scen":"","o":[{"t":"W fazie 5, przy wdrażaniu usprawnień","ok":false,"w":"W fazie 5 rozwiązania przechodzą w praktykę."},{"t":"W fazie 6, przy realizacji korzyści","ok":false,"w":"W fazie 6 monitoruje się uzyskanie korzyści."},{"t":"W fazie 7, przy przeglądzie skuteczności","ok":false,"w":"W fazie 7 ocenia się ogólny sukces."},{"t":"W fazie 3, przy analizie luk","ok":true,"w":"Faza 3 szczegółowo analizuje luki i rozwiązania oraz nadaje priorytet prostszym inicjatywom o największych korzyściach. Okazje do szybkich korzyści można zauważać już na początku inicjatywy; nie występują wyłącznie w fazie 3."}],"fz":{"h":"Szybkie korzyści (quick wins)","p":"P1","pulapka":true,"n":"EN: Quick wins — szybkie korzyści; szczegółowa analiza luk w fazie 3","q":"Jak faza 3 wykorzystuje analizę luk przy wyborze szybkich korzyści?","a":"W fazie 3 określa się stan docelowy, analizuje luki i możliwe rozwiązania. Priorytet mają prostsze inicjatywy o największych korzyściach. Nie oznacza to, że szybkie korzyści można rozpoznawać wyłącznie w tej fazie: podręcznik wskazuje taką możliwość już przy rozpoczynaniu inicjatywy.","ex":"Wstępnie zauważono, że wspólny rejestr incydentów szybko pomoże zespołom. W fazie 3 porównuje się tę propozycję z innymi rozwiązaniami, ocenia luki i ustala priorytet.","org":""}},"fz-D-026":{"id":"fz-D-026","typ":"egzamin","s":"IM-02-03,IM-02-04","t":"Czy uzasadnienie biznesowe tworzy się tylko na starcie programu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 39"],"r":null,"zap":"","scen":"","o":[{"t":"Tak – to jednorazowy dokument zatwierdzany w fazie 1","ok":false,"w":"Podręcznik: to nie jednorazowy dokument."},{"t":"Tak – po zatwierdzeniu nie wolno go zmieniać","ok":false,"w":"Uzasadnienie stale się aktualizuje."},{"t":"Nie – powstaje dopiero w fazie 7, po ocenie sukcesu","ok":false,"w":"Istnieje od początku programu, a nie dopiero na końcu."},{"t":"Nie – zaczyna jako ogólne i strategiczne, potem się je uszczegóławia i stale aktualizuje","ok":true,"w":"Uzasadnienie biznesowe może początkowo być ogólne i strategiczne. Uszczegóławia się je i stale aktualizuje, aby odzwierciedlało aktualne korzyści, koszty, ryzyka i opłacalność programu. Nie jest jednorazowym dokumentem."}],"fz":{"h":"Ewolucja uzasadnienia biznesowego","p":"P1","pulapka":false,"n":"EN: Business case evolves","q":"Jak ewoluuje uzasadnienie biznesowe? | Czy uzasadnienie biznesowe tworzy się tylko na starcie?","a":"Na początku może być ogólne, strategiczne (odgórne); potem uszczegóławia się zadania, kamienie milowe (ważne etapy) i role. To żywe narzędzie, stale aktualizowane, nie jednorazowy dokument. | Nie. Żyje przez cały program: zaczyna jako ogólne i strategiczne, potem się je uszczegóławia i stale aktualizuje.","ex":"Jak plan wesela: najpierw „chcemy skromnie, w sierpniu”, potem lista gości, terminy i kto co załatwia, a plan zmienia się do samego końca. | Jak budżet remontu: na początku szacunek „około 50 tys.”, potem dopisujesz faktury i poprawiasz plan aż do końca prac. Uzasadnienie „żyje” przez cały program.","org":""}},"fz-D-027":{"id":"fz-D-027","typ":"egzamin","s":"IM-02-03","t":"Kto powinien odpowiadać za inicjatywę wdrożeniową?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 39"],"r":null,"zap":"","scen":"","o":[{"t":"Zewnętrzny asesor","ok":false,"w":"Asesor prowadzi formalną ocenę zdolności, a nie odpowiada za inicjatywę."},{"t":"Sponsor","ok":true,"w":"Fiszka: za inicjatywę odpowiada sponsor."},{"t":"Każdy pracownik IT osobno","ok":false,"w":"Bez jednego sponsora zmiana nie ma właściciela."},{"t":"Firma zewnętrzna (outsourcing)","ok":false,"w":"Fiszka wskazuje sponsora, a nie dostawcę."}],"fz":{"h":"Sponsor inicjatywy","p":"P2","pulapka":false,"n":"EN: Sponsor","q":"Kto powinien odpowiadać za inicjatywę wdrożeniową?","a":"Sponsor; inicjatywa obejmuje wszystkich kluczowych zainteresowanych (interesariuszy) i opiera się na uzasadnieniu biznesowym.","ex":"Jak inwestor remontu: decyduje, płaci i odpowiada, choć sam nie kładzie płytek. Bez sponsora zmiana nie ma właściciela.","org":""}},"fz-D-028":{"id":"fz-D-028","typ":"egzamin","s":"IM-02-04","t":"Na jakich korzyściach powinno skupiać się uzasadnienie biznesowe?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 39"],"r":null,"zap":"","scen":"","o":[{"t":"Tylko na realistycznych i osiągalnych; pomagają badania korzyści w innych organizacjach","ok":true,"w":"Kwantyfikując korzyści, należy skupiać się na tych, które są realistyczne i możliwe do uzyskania. Wyniki innych przedsiębiorstw mogą pomóc oszacować korzyści, lecz nie gwarantują identycznego rezultatu u siebie."},{"t":"Na jak najwyższych, by przekonać zarząd","ok":false,"w":"Liczą się korzyści realne, nie efektowne."},{"t":"Wyłącznie na korzyściach dla działu IT","ok":false,"w":"Uzasadnienie opisuje docelowe korzyści biznesowe."},{"t":"Na korzyściach niemierzalnych, bo mierniki są zbędne","ok":false,"w":"Uzasadnienie obejmuje monitorowanie wartości z miernikami."}],"fz":{"h":"Realistyczne korzyści","p":"P2","pulapka":false,"n":"EN: Realistic benefits","q":"Na jakie korzyści wdrożenia skupia się uzasadnienie?","a":"Tylko na realistycznych i osiągalnych; pomocne są badania korzyści osiągniętych w innych organizacjach.","ex":"Jak w reklamie diety: „minus 20 kg w miesiąc” brzmi świetnie, ale liczy się realne „minus 4 kg”. Pomaga sprawdzić, co naprawdę osiągnęli inni.","org":""}},"fz-D-029":{"id":"fz-D-029","typ":"egzamin","s":"IM-01-01","t":"Ile pól z nazwami działań przedstawia Rysunek 17, łącząc siedem faz z trzema pierścieniami?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 38"],"r":null,"zap":"","scen":"","o":[{"t":"7","ok":false,"w":"Siedem to liczba faz; w każdej przedstawiono po jednym polu dla każdego z trzech pierścieni."},{"t":"21","ok":true,"w":"Rysunek 17 ma 7 faz i 3 pierścienie, czyli 21 pól z nazwami działań. To liczba elementów graficznego zestawienia, a nie zamknięta liczba wszystkich zadań programu. Każde pole może obejmować wiele zadań."},{"t":"10","ok":false,"w":"Taka liczba nie odpowiada siedmiu fazom zestawionym z trzema pierścieniami."},{"t":"3","ok":false,"w":"Trzy to liczba pierścieni, a każdy przedstawiono w siedmiu fazach."}],"fz":{"h":"Pierścienie a fazy","p":"P3","pulapka":false,"n":"EN: Three rings across seven phases — trzy pierścienie w siedmiu fazach","q":"Jak trzy pierścienie odnoszą się do siedmiu faz na Rysunku 17?","a":"Każdy z trzech pierścieni występuje w każdej z siedmiu faz. Rysunek zawiera więc 21 pól z nazwami działań. Pole jest podsumowaniem obszaru pracy i może obejmować wiele rzeczywistych zadań; nie jest to kompletna lista 21 kroków do odhaczenia.","ex":"Tabela ma siedem kolumn i trzy wiersze. Liczba komórek mówi o układzie modelu, a nie o liczbie zadań, osób ani dokumentów programu.","org":""}},"fz-D-030":{"id":"fz-D-030","typ":"egzamin","s":"IM-01-01","t":"Co następuje po zakończeniu fazy 7?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 37"],"r":null,"zap":"","scen":"","o":[{"t":"Powrót do fazy 1 – cykl ciągłego doskonalenia realizuje się iteracyjnie","ok":true,"w":"Fiszka: po fazie 7 wraca się do fazy 1."},{"t":"Koniec wdrożenia, bo to jednorazowy projekt","ok":false,"w":"Wdrożenie COBIT 5 nie jest jednorazowym projektem."},{"t":"Faza 8: certyfikacja ISO","ok":false,"w":"Cykl ma 7 faz."},{"t":"Rozwiązanie zespołu i archiwizacja uzasadnienia biznesowego","ok":false,"w":"Cykl trwa dalej, a uzasadnienie żyje przez cały program."}],"fz":{"h":"Wdrożenie to nie jednorazowy projekt","p":"P1","pulapka":false,"n":"EN: Not a one-off project","q":"Czy wdrożenie COBIT 5 to jednorazowy projekt?","a":"Nie. Rdzeń to cykl ciągłego doskonalenia, realizowany iteracyjnie; po fazie 7 wraca się do fazy 1.","ex":"Jak sprzątanie domu: nie sprzątasz raz na zawsze. Po fazie 7 wracasz do fazy 1 – cykl kręci się jak koło.","org":""}},"fz-D-031":{"id":"fz-D-031","typ":"egzamin","s":"IM-02-06","t":"W której fazie ocenia się stan obecny?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 38"],"r":null,"zap":"","scen":"","o":[{"t":"W fazie 3 – Do czego dążymy?","ok":false,"w":"W fazie 3 określa się stan docelowy i luki."},{"t":"W fazie 2 – Gdzie jesteśmy teraz?","ok":true,"w":"Doskonalenie: Ocena stanu obecnego to faza 2."},{"t":"W fazie 1 – Jakie są wyznaczniki?","ok":false,"w":"W fazie 1 uzgadnia się potrzebę inicjatywy."},{"t":"W fazie 6 – Czy dotarliśmy do celu?","ok":false,"w":"W fazie 6 monitoruje się korzyści."}],"fz":{"h":"Ocena stanu obecnego – faza 2","p":"P1","pulapka":true,"n":"EN: Assess current state – phase 2","q":"Ocena stanu obecnego – faza 2 czy 3?","a":"Faza 2 (Gdzie jesteśmy teraz?). W fazie 3 określa się stan docelowy i luki.","ex":"Najpierw stajesz na wadze (faza 2 – jak jest teraz), dopiero potem wybierasz wagę docelową (faza 3). Nie ustalisz celu, nie wiedząc, gdzie jesteś.","org":""}},"fz-D-032":{"id":"fz-D-032","typ":"egzamin","s":"IM-02-07","t":"W której fazie definiuje się miary i monitorowanie przy wdrażaniu rozwiązań?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 38"],"r":null,"zap":"","scen":"","o":[{"t":"W fazie 6 – Czy dotarliśmy do celu?","ok":false,"w":"Faza 6 korzysta z miar, by monitorować korzyści."},{"t":"W fazie 2 – Gdzie jesteśmy teraz?","ok":false,"w":"W fazie 2 ocenia się stan obecny."},{"t":"W fazie 7 – Jak utrzymać motywację do działania?","ok":false,"w":"W fazie 7 ocenia się ogólny sukces."},{"t":"W fazie 5 – Jak się tam dostaniemy?","ok":true,"w":"Opis fazy 5 przewiduje definiowanie miar i wprowadzenie monitorowania przy wdrażaniu rozwiązań. Faza 6 wykorzystuje miary do monitorowania korzyści. Mierniki pojawiają się także wcześniej, np. w uzasadnieniu biznesowym."}],"fz":{"h":"Miary i monitorowanie – faza 5","p":"P1","pulapka":true,"n":"EN: Measures defined in phase 5","q":"Definiowanie miar i monitorowania – faza 5 czy 6?","a":"Faza 5 wprowadza miary i monitorowanie przy wdrażaniu; faza 6 korzysta z nich, by monitorować uzyskanie korzyści. Mierniki są jednak obecne wcześniej – już w uzasadnieniu biznesowym.","ex":"Mierniki korzyści zapisano już w uzasadnieniu biznesowym. W fazie 5 zespół uruchamia ich pomiar w nowym rozwiązaniu, a w fazie 6 regularnie sprawdza korzyści. Fazy mają różne akcenty, nie rozłączne prawa do mierników.","org":""}},"fz-D-033":{"id":"fz-D-033","typ":"egzamin","s":"IM-02-07","t":"W której fazie planuje się projekty z uzasadnieniami biznesowymi i plan zmian?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 38"],"r":null,"zap":"","scen":"","o":[{"t":"W fazie 3 – Do czego dążymy?","ok":false,"w":"W fazie 3 określa się stan docelowy i mapę drogową."},{"t":"W fazie 5 – Jak się tam dostaniemy?","ok":false,"w":"W fazie 5 rozwiązania przechodzą w praktykę."},{"t":"W fazie 1 – Jakie są wyznaczniki?","ok":false,"w":"W fazie 1 identyfikuje się wyznaczniki."},{"t":"W fazie 4 – Jakie działania należy podjąć?","ok":true,"w":"Fiszka: projekty z uzasadnieniami to faza 4."}],"fz":{"h":"Projekty z uzasadnieniami – faza 4","p":"P1","pulapka":true,"n":"EN: Projects with business cases – phase 4","q":"Projekty z uzasadnieniami biznesowymi – w której fazie?","a":"W fazie 4 (Jakie działania należy podjąć?) – planuje się praktyczne rozwiązania i plan zmian.","ex":"Faza 4 = kosztorysy: każdą większą pracę (kuchnia, łazienka) rozpisujesz jako osobne zlecenie z wyliczeniem, czy się opłaca. „Jakie działania?” = konkretne zlecenia.","org":""}},"fz-D-034":{"id":"fz-D-034","typ":"egzamin","s":"IM-02-02","t":"W organizacji pojawił się nowy CIO. Jak to zaklasyfikować?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 37"],"r":null,"zap":"","scen":"","o":[{"t":"Punkt zapalny","ok":false,"w":"Punkt zapalny to istniejący problem, a nowy CIO niczego nie zepsuł."},{"t":"Zdarzenie wyzwalające","ok":true,"w":"Nowy CIO to zmiana, która daje okazję do działania."},{"t":"Szybka korzyść","ok":false,"w":"Szybkie korzyści to usprawnienia wybierane w fazie 3."},{"t":"Mapa drogowa","ok":false,"w":"Mapa drogowa to plan działań z fazy 3."}],"fz":{"h":"Nowy CIO","p":"P1","pulapka":true,"n":"EN: New CIO = trigger event","q":"Nowy CIO – punkt zapalny czy zdarzenie wyzwalające?","a":"Zdarzenie wyzwalające. Złożone modele operacyjne IT czy nieudane projekty to punkty zapalne.","ex":"Nowy szef IT (CIO) jeszcze niczego nie zepsuł – to zmiana, która daje okazję do działania, jak nowy trener w drużynie. Zapalny = coś już boli.","org":""}},"fz-D-035":{"id":"fz-D-035","typ":"egzamin","s":"IM-02-05","t":"Dlaczego wdrożenia Ładu IT często się nie udają?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 37"],"r":null,"zap":"","scen":"","o":[{"t":"Bo procesy nie osiągają poziomu 5 zdolności","ok":false,"w":"Poziom 5 rzadko jest celem i nie jest wskazany jako przyczyna porażki."},{"t":"Bo zbyt mało uwagi poświęca się ludziom, zachowaniu, kulturze i motywowaniu do zmiany","ok":true,"w":"Podręcznik ostrzega przed pomijaniem ludzkich, behawioralnych i kulturowych aspektów zmiany. Samo zaprojektowanie poprawnych aktywatorów nie zapewnia ich przyjęcia; potrzebne są komunikacja, motywowanie i wsparcie interesariuszy."},{"t":"Bo przewodnik COBIT 5: Wdrożenie jest normatywny i zbyt sztywny","ok":false,"w":"Przewodnik nie jest normatywny."},{"t":"Bo uzasadnienie biznesowe aktualizuje się przez cały cykl","ok":false,"w":"To dobra praktyka, a nie przyczyna porażki."}],"fz":{"h":"Dlaczego wdrożenia się nie udają","p":"P2","pulapka":false,"n":"EN: Behaviour and culture neglected","q":"Dlaczego wdrożenia Ładu IT często się nie udają?","a":"Bo zbyt mało uwagi poświęca się ludziom, zachowaniu i kulturze oraz motywowaniu do zmiany – stąd pierścień Aktywowania zmiany.","ex":"Jak firmowa siłownia, do której nikt nie chodzi: sprzęt jest, ale nikt nie przekonał ludzi. Dlatego osobny pierścień zajmuje się ludźmi.","org":""}},"fz-D-036":{"id":"fz-D-036","typ":"egzamin","s":"IM-02-02","t":"Czy aktywatory COBIT są celem samym w sobie?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 36"],"r":null,"zap":"","scen":"","o":[{"t":"Tak – wdrożenie kończy się, gdy działa wszystkie siedem aktywatorów","ok":false,"w":"Aktywatory służą rozwiązaniu problemów, a nie są celem."},{"t":"Tak – ich wdrożenia wymaga norma ISO/IEC 15504","ok":false,"w":"Norma dotyczy oceny procesów, nie celu wdrożenia."},{"t":"Nie – bo COBIT 5 nie ma aktywatorów, tylko procesy","ok":false,"w":"COBIT 5 ma siedem kategorii aktywatorów, procesy to jedna z nich."},{"t":"Nie – mają rozwiązywać realne potrzeby biznesowe, wskazane przez punkty zapalne i wyznaczniki","ok":true,"w":"Aktywatory mają rozwiązywać rzeczywiste potrzeby i problemy biznesowe. Ich wdrożenie nie jest celem samym w sobie; kierownictwo powinno uzgodnić potrzebę działania i oczekiwane korzyści."}],"fz":{"h":"Aktywatory a realne potrzeby","p":"P2","pulapka":false,"n":"EN: Enablers solve real business needs","q":"Czy aktywatory COBIT są celem samym w sobie?","a":"Nie. Mają rozwiązywać realne potrzeby i problemy biznesowe, zidentyfikowane z punktów zapalnych i wyznaczników.","ex":"Jak wiertarka: kupujesz ją, żeby powiesić półkę, a nie dla samej wiertarki. Aktywatory (np. procesy, role, zasady) mają rozwiązać konkretny problem firmy.","org":""}},"fz-D-037":{"id":"fz-D-037","typ":"egzamin","s":"IM-02-06,IM-02-07","t":"Faza 7 na egzaminie brzmi „Jak utrzymać motywację do działania?”. Jak nazywa ją podręcznik?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 38"],"r":null,"zap":"","scen":"","o":[{"t":"Jak utrzymać obecną dynamikę?","ok":true,"w":"To podręcznikowa nazwa fazy 7."},{"t":"Czy cel został osiągnięty?","ok":false,"w":"To podręcznikowa nazwa fazy 6."},{"t":"Jak osiągnąć założony cel?","ok":false,"w":"To podręcznikowa nazwa fazy 5."},{"t":"Jaka jest nasza obecna sytuacja?","ok":false,"w":"To podręcznikowa nazwa fazy 2."}],"fz":{"h":"Nazwy faz 2, 5, 6, 7: egzamin a podręcznik","p":"P2","pulapka":true,"n":"EN: Phases 2, 5, 6, 7: Where are we now? How do we get there? Did we get there? How do we keep the momentum going?","q":"Pytania faz 2, 5, 6 i 7 – jak brzmią na egzaminie, a jak w podręczniku?","a":"Egzamin (podr.): 2 Gdzie jesteśmy teraz? (Jaka jest nasza obecna sytuacja?); 5 Jak się tam dostaniemy? (Jak osiągnąć założony cel?); 6 Czy dotarliśmy do celu? (Czy cel został osiągnięty?); 7 Jak utrzymać motywację do działania? (Jak utrzymać obecną dynamikę?). Fazy 1, 3, 4 brzmią tak samo.","ex":"Jak jeden przepis w dwóch książkach kucharskich: inne słowa, te same kroki.","org":""}},"fz-D-038":{"id":"fz-D-038","typ":"egzamin","s":"PC-01-02","t":"Ile atrybutów procesu ma model zdolności i jak się rozkładają?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42","FW-PL s. 43","PeopleCert Syllabus — PC-01-02"],"r":null,"zap":"","scen":"","o":[{"t":"Sześć: po jednym na każdy poziom 0–5","ok":false,"w":"Poziom 0 nie ma atrybutu, a poziomy 2–5 mają po dwa."},{"t":"Dziesięć: po dwa na poziomy 1–5","ok":false,"w":"Poziom 1 ma tylko jeden atrybut: PA (Process Attribute — atrybut procesu) 1.1."},{"t":"Dziewięć: poziom 1 – jeden, poziomy 2–5 – po dwa","ok":true,"w":"Model zawiera dziewięć atrybutów: jeden na poziomie 1 i po dwa na poziomach 2–5. Poziom 0 nie ma własnego atrybutu. Każdy atrybut jest mierzalną cechą zdolności procesu, nie pojedynczym zadaniem na egzaminie."},{"t":"Dziewięć: poziom 0 – jeden, poziomy 1–4 – po dwa","ok":false,"w":"Poziom 0 nie ma atrybutu, a poziom 5 ma dwa."}],"fz":{"h":"Atrybuty procesu","p":"P1","pulapka":false,"n":"egzamin: atrybuty procesu · podr.: atrybuty potencjału procesu · EN: process attributes (PA)","q":"Ile jest atrybutów i jak się rozkładają? | Ile atrybutów procesu ma model i jak się rozkładają?","a":"9 atrybutów, czyli 9 mierzalnych cech zdolności; każdy dostaje ocenę N/C/W/P. Poziom 1: PA 1.1 Wykonanie procesu (czy cel jest osiągany). Poziom 2: PA 2.1 Zarządzanie wydajnością (plan i pilnowanie), PA 2.2 Zarządzanie produktami pracy (porządek w dokumentach i wynikach). Poziom 3: PA 3.1 Definicja procesu (zdefiniowany standard), PA 3.2 Wdrożenie procesu (standard stosowany w praktyce). Poziom 4: PA 4.1 Miara procesu (podr.: Pomiar procesu), PA 4.2 Kontrola procesu (trzymanie w granicach). Poziom 5: PA 5.1 Innowacja procesu, PA 5.2 Optymalizacja procesu. Poziom 0 nie ma atrybutu. | Dziewięć: poziom 1 – jeden, poziomy 2–5 – po dwa.","ex":"Poziom 1 ma jeden atrybut, a każdy z poziomów 2–5 po dwa. Atrybut obejmuje określone kryteria i jest oceniany na podstawie dowodów. Rachunek 1 + 4 × 2 = 9 dotyczy liczby atrybutów, nie liczby pytań ani zadań oceny.","org":"DSS02: PA 1.1 = W, PA 2.1 = C → poziom 1."}},"fz-D-039":{"id":"fz-D-039","typ":"egzamin","s":"PC-02-05","t":"Czy oceny dojrzałości z COBIT 4.1 da się prosto przełożyć na poziomy zdolności COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 41","FW-PL s. 43"],"r":null,"zap":"","scen":"","o":[{"t":"Tak – skale są identyczne, wystarczy przepisać wynik","ok":false,"w":"Fiszka: nie ma prostego przełożenia."},{"t":"Tak – wystarczy dodać jeden poziom do wyniku z COBIT 4.1","ok":false,"w":"Wyniki w COBIT 5 są zwykle niższe, a nie wyższe."},{"t":"Nie – bo COBIT 4.1 w ogóle nie oceniał procesów","ok":false,"w":"COBIT 4.1 miał modele dojrzałości dla procesów."},{"t":"Nie – COBIT 5 ocenia zdolność wg ISO/IEC 15504, a mapowanie skali jest tylko przybliżone","ok":true,"w":"Mimo podobnych słów modele różnią się zakresem i intencją."}],"fz":{"h":"COBIT 4.1 a model zdolności","p":"P1","pulapka":true,"n":"egzamin: model dojrzałości / zdolności · podr.: model dojrzałości / potencjału · EN: maturity model vs capability model","q":"Czym różni się ocena w COBIT 5 od COBIT 4.1? | Czy wyniki COBIT 4.1 i COBIT 5 da się prosto porównać?","a":"COBIT 4.1 miał modele dojrzałości dla procesów; COBIT 5 ocenia zdolność wg ISO/IEC 15504. Wyniki są zwykle niższe i nie ma prostego przełożenia. | Nie. Mimo podobnych skal i słów różnią się zakresem, ukierunkowaniem i intencją; mapowanie skali jest tylko przybliżone (Rysunek 20).","ex":"Jak zmiana egzaminatora na surowszego: stara skala była opisowa, nowa wg normy ISO wymaga dowodów. Ta sama kuchnia dostaje zwykle niższą ocenę, a starej nie przeliczysz 1:1. | Jak przeliczanie polskich ocen szkolnych na amerykańskie A–F: wygląda podobnie, ale mierzy co innego, więc przełożenie jest tylko orientacyjne.","org":""}},"fz-D-040":{"id":"fz-D-040","typ":"egzamin","s":"PC-01-01","t":"Na jakiej normie oparto model zdolności procesu COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 41","PeopleCert Syllabus — PC-01-01"],"r":null,"zap":"","scen":"","o":[{"t":"ISO/IEC 15504","ok":true,"w":"Historyczną podstawą modelu zdolności COBIT 5 jest ISO/IEC 15504 — Software Engineering: Process Assessment, czyli Inżynieria oprogramowania: ocena procesów. Nie należy zastępować tej podstawy modelem oceny z COBIT 2019."},{"t":"ISO/IEC 27001","ok":false,"w":"Podręcznik wskazuje ISO/IEC 15504, nie tę normę."},{"t":"ISO/IEC 20000","ok":false,"w":"Podręcznik wskazuje ISO/IEC 15504, nie tę normę."},{"t":"ISO 9001","ok":false,"w":"Podręcznik wskazuje ISO/IEC 15504, nie tę normę."}],"fz":{"h":"ISO/IEC 15504","p":"P1","pulapka":false,"n":"egzamin: ISO/IEC 15504 · podr.: ISO/IEC 15504 · EN: ISO/IEC 15504","q":"Na jakiej normie oparto model zdolności? | Na jakiej normie opiera się model zdolności procesu COBIT 5?","a":"ISO/IEC 15504 (ocena procesów). Ocena dotyczy procesu, nie całej organizacji. | ISO/IEC 15504 (Software Engineering – Process Assessment). Szczegóły: Model Oceny Procesu (PAM).","ex":"Norma ISO to jak oficjalny regulamin egzaminu, jednakowy na całym świecie. Ocenia się jedno stanowisko w kuchni (proces), a nie całą restaurację. | Norma to regulamin egzaminu, a Model Oceny Procesu (PAM) to szczegółowy arkusz pytań, z którym przychodzi inspektor.","org":""}},"fz-D-041":{"id":"fz-D-041","typ":"egzamin","s":"PC-02-01","t":"Na jakiej podstawie przeprowadza się formalną ocenę zdolności procesu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 41","PeopleCert Syllabus — PC-02-01"],"r":null,"zap":"","scen":"","o":[{"t":"Na podstawie deklaracji właściciela procesu, bez dowodów","ok":false,"w":"Inspektor nie wierzy na słowo – potrzebne są dowody."},{"t":"Na podstawie wyników finansowych całej organizacji","ok":false,"w":"Ocena dotyczy procesu, a nie całej organizacji."},{"t":"Na podstawie liczby pracowników działu IT","ok":false,"w":"Nie jest to podstawa oceny wskazana w podręczniku; liczą się wyniki, praktyki i produkty pracy."},{"t":"Na podstawie dowodów: wyników, praktyk i produktów pracy","ok":true,"w":"Formalna ocena opiera się na obiektywnych dowodach odnoszących się do ocenianego procesu: rezultatach, praktykach i produktach pracy. W uproszczonej samoocenie rygor jest mniejszy, a wynik ma charakter orientacyjny."}],"fz":{"h":"Ocena zdolności procesu","p":"P1","pulapka":false,"n":"egzamin: ocena zdolności procesu · podr.: ocena potencjału procesu · EN: process capability assessment","q":"Co ocenia się w formalnej ocenie zdolności procesu?","a":"Na podstawie dowodów ocenia się osiąganie przeznaczenia procesu i jego atrybutów. Dowody pochodzą m.in. z rezultatów, praktyk i produktów pracy. Ocena procesów obejmuje jedną z siedmiu kategorii aktywatorów. Uproszczona samoocena ma mniejszy rygor i wynik orientacyjny.","ex":"Inspektor nie wierzy na słowo: przegląda zamówienia i rachunki, pyta kucharzy. Sprawdza jednak tylko procesy, a to jeden z siedmiu aktywatorów.","org":"próbka 40 zgłoszeń, monitoring, wywiady."}},"fz-D-042":{"id":"fz-D-042","typ":"egzamin","s":"PC-02-01","t":"Czy ocena zdolności procesów daje pełny obraz Ładu w organizacji?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 41","PeopleCert Syllabus — PC-02-01"],"r":null,"zap":"","scen":"","o":[{"t":"Nie – procesy to tylko jeden z siedmiu aktywatorów, trzeba ocenić też pozostałe","ok":true,"w":"Procesy są jedną z siedmiu kategorii aktywatorów. Ich ocena dostarcza ważnych informacji, ale nie zastępuje oceny pozostałych aktywatorów i ich zależności. Nawet wysoka zdolność procesów nie dowodzi samodzielnie poprawności całego systemu Ładu."},{"t":"Tak – procesy obejmują wszystkie aktywatory","ok":false,"w":"Procesy to jedna z siedmiu kategorii aktywatorów."},{"t":"Tak – jeśli wszystkie procesy mają poziom 5","ok":false,"w":"Wysoka zdolność procesów jest wartościową informacją, ale nie zastępuje oceny pozostałych kategorii aktywatorów i ich zależności."},{"t":"Nie – bo ocenia się wyłącznie procesy domeny EDM","ok":false,"w":"Ocenia się procesy, nie tylko EDM (Evaluate, Direct and Monitor — Oszacuj, Kieruj i Monitoruj); problemem jest pominięcie innych aktywatorów."}],"fz":{"h":"Ocena procesów a pełny obraz Ładu","p":"P1","pulapka":false,"n":"EN: Process assessment is only one enabler","q":"Czy ocena procesów daje pełny obraz Ładu w organizacji?","a":"Nie. Procesy to tylko jeden z siedmiu aktywatorów; trzeba ocenić też pozostałe.","ex":"Ocena samych przepisów nie mówi wszystkiego o restauracji – liczą się też ludzie, sprzęt, informacje, kultura. Procesy to jeden z siedmiu elementów.","org":""}},"fz-D-043":{"id":"fz-D-043","typ":"egzamin","s":"PC-01-01","t":"Co oznacza poziom 0 – Proces niekompletny?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42","PeopleCert Syllabus — PC-01-01"],"r":null,"zap":"","scen":"","o":[{"t":"Proces osiąga cel, ale działa bez planowania","ok":false,"w":"To poziom 1 – Proces wykonywany."},{"t":"Proces nie działa albo nie osiąga celu; prawie nie ma dowodów, że cel jest osiągany regularnie","ok":true,"w":"Poziom 0 oznacza proces niewdrożony lub taki, który nie osiąga przeznaczenia. Poziom 1 wymaga co najmniej większościowego osiągnięcia PA (Process Attribute — atrybut procesu) 1.1, ocenionego na podstawie wymaganych rezultatów. Samo istnienie czynności lub dokumentu nie ustala poziomu."},{"t":"Proces działa według standardu, ale nie jest mierzony","ok":false,"w":"To poziom 3 – Proces ustanowiony."},{"t":"Proces ma ocenę W na PA 1.1","ok":false,"w":"W na PA (Process Attribute — atrybut procesu) 1.1 wystarcza już do poziomu 1."}],"fz":{"h":"Poziom 0 i poziom 1","p":"P1","pulapka":false,"n":"egzamin: niekompletny, wykonywany · podr.: niekompletny, wykonywany · EN: Level 0 Incomplete, Level 1 Performed","q":"Czym są poziomy 0 i 1? | Co oznacza poziom 0 – Proces niekompletny?","a":"0: proces niekompletny, nie osiąga celu. 1: proces wykonywany, osiąga swój cel (PA 1.1). Poziom 1 jest szczególny: ocenia się wyniki procesu. | Proces nie działa albo nie osiąga celu; prawie nie ma dowodów, że cel jest osiągany regularnie.","ex":"Poziom 0: obiad nie wychodzi albo wychodzi przypadkiem. Poziom 1: goście regularnie dostają obiad, choć kuchnia działa „na żywioł”, bez planu. | Kuchnia, w której obiad czasem wychodzi, a czasem nie, i nikt nie umie pokazać, że wychodzi regularnie. Biały pas – dopiero start.","org":"jeśli PA 1.1 procesu DSS02 oceniono na W lub P (wg celu i wymaganych wyników procesu), a wymagania poziomu 2 nie są spełnione → poziom 1."}},"fz-D-044":{"id":"fz-D-044","typ":"egzamin","s":"PC-01-01","t":"Co jest istotą poziomu 1 – Proces wykonywany?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42","PeopleCert Syllabus — PC-01-01"],"r":null,"zap":"","scen":"","o":[{"t":"Proces jest planowany, monitorowany i korygowany","ok":false,"w":"Planowanie należy już do poziomu 2."},{"t":"Proces osiąga swój cel; ocenia się jeden atrybut – PA 1.1","ok":true,"w":"Poziom 1 potwierdza osiąganie przeznaczenia procesu. Ocenia się jeden atrybut PA (Process Attribute — atrybut procesu) 1.1, który musi otrzymać W lub P. Dodatkowe wymagania zarządzania wykonaniem i produktami pracy należą do poziomu 2."},{"t":"Proces jest rozumiany ilościowo i trzymany w granicach","ok":false,"w":"To poziom 4."},{"t":"Proces działa według zdefiniowanego standardu","ok":false,"w":"To poziom 3."}],"fz":{"h":"Poziom 1 – Proces wykonywany","p":"P1","pulapka":false,"n":"EN: Level 1 Performed","q":"Co oznacza poziom 1 – Proces wykonywany? | Czym poziom 1 różni się od wyższych poziomów?","a":"Proces działa i osiąga swój cel (przeznaczenie). Ocenia się jeden atrybut: PA 1.1. Planowanie należy już do poziomu 2. | Ustala, czy proces w ogóle osiąga cel – to ważne osiągnięcie i fundament wyższych poziomów; wymaga co najmniej W na PA 1.1.","ex":"Goście regularnie dostają obiad – cel osiągnięty, nawet jeśli kucharze pracują bez grafiku i improwizują. Liczy się wynik, nie porządek. | Poziom 1 to najważniejsze pytanie: czy goście w ogóle dostają obiad? Bez tego porządek, receptury i pomiary nie mają sensu.","org":""}},"fz-D-045":{"id":"fz-D-045","typ":"egzamin","s":"PC-02-01","t":"Czy celem organizacji zawsze powinien być poziom 5 zdolności?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 43","PeopleCert Syllabus — PC-02-01"],"r":null,"zap":"","scen":"","o":[{"t":"Tak – tylko poziom 5 jest zgodny z ISO/IEC 15504","ok":false,"w":"Zgodność z normą nie wymaga poziomu 5."},{"t":"Nie – poziom docelowy dobiera się do kosztów, korzyści i wykonalności; ambicją wielu jest poziom 1","ok":true,"w":"Przedsiębiorstwo wybiera poziom docelowy na podstawie kosztów, korzyści i wykonalności. Najwyższy poziom nie jest uniwersalnym celem. Uzyskanie poziomu 1 dla odpowiednich procesów już potwierdza istotny fundament: osiąganie ich przeznaczenia."},{"t":"Tak – niższe poziomy oznaczają, że proces nie działa","ok":false,"w":"Już poziom 1 oznacza, że proces osiąga cel."},{"t":"Nie – celem zawsze jest poziom 3","ok":false,"w":"Nie ma jednego poziomu dla wszystkich; dobiera go organizacja."}],"fz":{"h":"Poziom docelowy","p":"P2","pulapka":false,"n":"egzamin: docelowy poziom zdolności · podr.: docelowy poziom potencjału · EN: target capability level","q":"Czy celem zawsze jest poziom 5? | Jaki poziom docelowy powinna wybrać organizacja?","a":"Nie. Poziom dobiera się do potrzeb, kosztów i wykonalności. | Własny, wg kosztów, korzyści i wykonalności – bardzo rzadko najwyższy. Ambicją wielu jest poziom 1 dla wszystkich procesów.","ex":"Nie każdy potrzebuje czarnego pasa: budka z kebabem nie musi gotować jak restauracja z gwiazdką Michelin. Cel dobiera się do potrzeb i budżetu. | Budka z kebabem nie potrzebuje gwiazdki Michelin. Wiele firm byłoby zadowolonych, gdyby każdy ich proces po prostu działał (poziom 1).","org":"DSS02: cel poziom 3."}},"fz-D-046":{"id":"fz-D-046","typ":"egzamin","s":"PC-01-01","t":"Jak brzmią nazwy egzaminacyjne poziomów zdolności 2–5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42"],"r":null,"zap":"","scen":"","o":[{"t":"Powtarzalny, zdefiniowany, zarządzany i mierzalny, zoptymalizowany","ok":false,"w":"To nazwy z modelu dojrzałości COBIT 4.1."},{"t":"Wykonywany, zarządzany, ustanowiony, przewidywalny","ok":false,"w":"Wykonywany to poziom 1, nazwy przesunięto o jeden."},{"t":"Zarządzany, ustanowiony, przewidywalny, zoptymalizowany","ok":true,"w":"Haczyk Z-U-P-O, jak „zupa”."},{"t":"Zarządzany, przewidywalny, ustanowiony, zoptymalizowany","ok":false,"w":"Ustanowiony (3) jest przed przewidywalnym (4)."}],"fz":{"h":"Poziomy 2–5","p":"P1","pulapka":true,"n":"egzamin: zarządzany, ustanowiony, przewidywalny, zoptymalizowany · podr.: zarządzany, ustanowiony, przewidywalny, optymalizujący · EN: Managed, Established, Predictable, Optimising","q":"Nazwij poziomy 2–5. | Podaj sześć poziomów zdolności procesu (nazwy egzaminacyjne).","a":"2 zarządzany (planowany i pilnowany); 3 ustanowiony (zdefiniowany standard wdrożony w praktyce – sam dokument nie wystarczy); 4 przewidywalny (ilościowo rozumiany i trzymany w granicach – samo mierzenie nie wystarczy); 5 zoptymalizowany (podr.: optymalizujący; stale ulepszany). | 0 Proces niekompletny, 1 Proces wykonywany, 2 Proces zarządzany, 3 Proces ustanowiony, 4 Proces przewidywalny, 5 Proces zoptymalizowany (podr. optymalizujący).","ex":"Kuchnia: 2 – szef planuje i pilnuje; 3 – spisane receptury dla wszystkich; 4 – mierzy się czas i jakość; 5 – menu stale ulepszane. Haczyk: Z-U-P-O, jak „zupa”. | Haczyk: najpierw N i W (niekompletny, wykonywany), potem Z-U-P-O jak „zupa”: zarządzany, ustanowiony, przewidywalny, zoptymalizowany.","org":""}},"fz-D-047":{"id":"fz-D-047","typ":"egzamin","s":"PC-02-02","t":"Kiedy korzysta się z Przewodnika Asesora?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 41","PeopleCert Syllabus — PC-02-02"],"r":null,"zap":"","scen":"","o":[{"t":"Do uproszczonej samooceny bez formalnego zbierania dowodów","ok":false,"w":"To Przewodnik Samooceny."},{"t":"Do opisu przeznaczenia i rezultatów procesów","ok":false,"w":"To rola Referencyjnego Modelu Procesu (PRM (Process Reference Model — Referencyjny Model Procesu))."},{"t":"Do formalnej oceny zgodnej z ISO, opartej na dowodach, prowadzonej przez przeszkoloną osobę oceniającą","ok":true,"w":"Assessor Guide — Przewodnik Asesora — opisuje przeprowadzenie formalnej oceny procesów z użyciem modelu oceny. Wymaga kompetentnego zespołu i dowodów; osoba oceniająca może pochodzić z organizacji lub z zewnątrz."},{"t":"Do przygotowania uzasadnienia biznesowego","ok":false,"w":"Uzasadnienie biznesowe to element wdrożenia, a nie oceny."}],"fz":{"h":"Przewodnik Asesora","p":"P2","pulapka":false,"n":"egzamin: Przewodnik Asesora · podr.: Przewodnik osoby oceniającej · EN: Assessor Guide","q":"Do czego służą Przewodnik Asesora i Przewodnik Samooceny?","a":"Assessor Guide — Przewodnik Asesora — opisuje przeprowadzenie formalnej oceny procesów z wykorzystaniem modelu oceny i dowodów. Prowadzi ją kompetentny zespół, wewnętrzny lub zewnętrzny. Self-assessment Guide — Przewodnik Samooceny — wspiera prostsze, orientacyjne rozpoznanie oparte w większej mierze na osądzie uczestników i może przygotować formalną ocenę.","ex":"Zespół najpierw orientacyjnie wskazuje mocne strony i luki. Następnie planuje formalną ocenę, zbiera i weryfikuje dowody zgodnie z właściwą procedurą. O rygorze nie rozstrzyga sama siedziba asesora.","org":"ocena zewnętrzna po 9 miesiącach."}},"fz-D-048":{"id":"fz-D-048","typ":"egzamin","s":"PC-02-02","t":"Czym charakteryzuje się Przewodnik Samooceny?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 41","PeopleCert Syllabus — PC-02-02"],"r":null,"zap":"","scen":"","o":[{"t":"Wymaga zewnętrznej, przeszkolonej osoby oceniającej","ok":false,"w":"Przewodnik Asesora wymaga kompetentnego prowadzenia formalnej oceny, a nie bezwarunkowo osoby zewnętrznej. Zespół może być wewnętrzny lub zewnętrzny; rozróżnienie dotyczy przede wszystkim celu, procedury i rygoru."},{"t":"Daje oficjalny wynik formalnej oceny","ok":false,"w":"Uproszczona samoocena daje orientacyjny wynik. Wymagania formalnej oceny i ewentualnego raportowania ustala się odrębnie; sam przewodnik nie nadaje certyfikacji."},{"t":"Pozwala organizacji ocenić się samodzielnie, w uproszczony sposób","ok":true,"w":"Self-assessment Guide — Przewodnik Samooceny — pozwala na prostsze rozpoznanie stanu procesów przez organizację. Wynik jest orientacyjny i może przygotować do formalnej oceny; sama wewnętrzność zespołu nie definiuje rygoru oceny."},{"t":"Zawiera wskaźniki oceny dla procesów","ok":false,"w":"Wskaźniki oceny opisuje Model Oceny Procesu (PAM (Process Assessment Model — Model Oceny Procesu))."}],"fz":{"h":"Przewodnik Samooceny","p":"P2","pulapka":false,"n":"egzamin: Przewodnik Samooceny · podr.: Podręcznik samooceny · EN: Self-assessment Guide","q":"Do czego służy?","a":"Pozwala organizacji ocenić się samodzielnie, w uproszczony sposób.","ex":"Jak jazda próbna przed egzaminem: szef kuchni sam przechodzi listę pytań, bez formalnego zbierania dowodów, i dostaje wynik orientacyjny – często jako przygotowanie do oceny formalnej.","org":"ocena wewnętrzna w fazie 2."}},"fz-D-049":{"id":"fz-D-049","typ":"egzamin","s":"PC-02-06","t":"Kiedy proces osiąga dany poziom zdolności od 1 do 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42","PeopleCert Syllabus — PC-02-06"],"r":null,"zap":"","scen":"","o":[{"t":"Gdy atrybuty tego poziomu mają P, a niższych poziomów co najmniej W","ok":false,"w":"Warunki są tu odwrócone."},{"t":"Gdy średnia ocen wszystkich atrybutów przekracza 50%","ok":false,"w":"Nie liczy się średniej – każdy atrybut ocenia się osobno."},{"t":"Gdy co najmniej jeden atrybut tego poziomu ma C","ok":false,"w":"C to za mało; potrzebne jest co najmniej W."},{"t":"Gdy atrybuty tego poziomu mają co najmniej W, a atrybuty wszystkich niższych poziomów – P","ok":true,"w":"Na ocenianym poziomie od 1 do 5 każdy atrybut musi mieć co najmniej W — Większościowy. Wszystkie atrybuty niższych poziomów muszą mieć P — Pełny. Nie oblicza się średniej, która mogłaby zrekompensować słabszy atrybut."}],"fz":{"h":"Reguła osiągnięcia poziomu","p":"P1","pulapka":true,"n":"egzamin: zasada oceny · podr.: zasada oceny · EN: rating rule","q":"Jakie są warunki osiągnięcia poziomu zdolności od 1 do 5?","a":"Na ocenianym poziomie każdy atrybut musi mieć W — Większościowy (Largely achieved) lub P — Pełny (Fully achieved). Wszystkie atrybuty niższych poziomów muszą mieć P. Nie oblicza się średniej kompensującej słabszy atrybut. Do poziomu 1 wystarcza W lub P na PA 1.1. Poziom 0 nie ma własnego atrybutu.","ex":"Przykład: PA 1.1 = W, a PA 2.1 i PA 2.2 = P. Wynik to nadal poziom 1, ponieważ poziom 2 wymaga pełnego osiągnięcia PA 1.1.","org":"poziom 2: PA 2.1 i 2.2 ≥ W oraz PA 1.1 = P."}},"fz-D-050":{"id":"fz-D-050","typ":"egzamin","s":"PC-02-06","t":"Czy do poziomu 3 wystarczy ocena W na atrybutach poziomu 2?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42"],"r":null,"zap":"","scen":"","o":[{"t":"Tak – W wystarcza na wszystkich poziomach","ok":false,"w":"W wystarcza tylko na poziomie ocenianym."},{"t":"Nie – atrybuty poziomu 2 muszą mieć P; W wystarcza tylko na atrybutach poziomu 3","ok":true,"w":"Niższe poziomy muszą być osiągnięte w pełni."},{"t":"Tak – jeśli atrybuty poziomu 3 mają P","ok":false,"w":"Dobre oceny wyższego poziomu nie nadrabiają niższego."},{"t":"Nie – wszystkie atrybuty, także poziomu 3, muszą mieć P","ok":false,"w":"Na atrybutach poziomu ocenianego wystarczy W."}],"fz":{"h":"Pełne osiągnięcie niższych poziomów","p":"P1","pulapka":true,"n":"EN: Full achievement of lower levels","q":"Czy do poziomu 3 wystarczy W na atrybutach poziomu 2?","a":"Nie. Wyższy poziom wymaga P (pełnego) na wszystkich atrybutach niższych poziomów; W wystarcza tylko na atrybutach poziomu ocenianego.","ex":"Nie dostaniesz czarnego pasa, jeśli brązowy masz tylko „prawie”. Niższe poziomy muszą być na P – „prawie” (W) wystarcza tylko na poziomie, który zdobywasz.","org":""}},"fz-D-051":{"id":"fz-D-051","typ":"egzamin","s":"PC-01-03","t":"Co oznacza litera P w skali ocen egzaminu PL?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 45","PeopleCert Syllabus — PC-01-03","ALTKOM"],"r":null,"zap":"","scen":"","o":[{"t":"Częściowy (EN: P – Partially achieved)","ok":false,"w":"Częściowy to po polsku C; angielskie P to nasze C."},{"t":"Pełny (EN: F – Fully achieved)","ok":true,"w":"Polskie P oznacza Pełny i odpowiada angielskiemu F — Fully achieved. Angielskie P — Partially achieved — odpowiada polskiemu C — Częściowy. Skale mają te same cztery stopnie i progi, różnią się literami."},{"t":"Większościowy (EN: L – Largely achieved)","ok":false,"w":"Większościowy to W."},{"t":"Nieosiągnięty (EN: N – Not achieved)","ok":false,"w":"Nieosiągnięty to N."}],"fz":{"h":"Skala ocen","p":"P1","pulapka":true,"n":"egzamin: N/C/W/P: Nieosiągnięty, Częściowy, Większościowy, Pełny · podr.: N/P/L/F: nie, częściowo, w znacznym stopniu, w pełni osiągnięto · EN: N/P/L/F: Not, Partially, Largely, Fully achieved","q":"Jaka jest skala ocen atrybutu? | Podaj skalę ocen atrybutu z zakresami procentowymi. | „P” w skali egzaminu PL – Częściowy czy Pełny?","a":"Litera mówi, na ile spełniono jeden atrybut: N Nieosiągnięty 0–15% · C Częściowy >15–50% · W Większościowy >50–85% · P Pełny >85–100%. Pułapka: P po polsku = Pełny, po angielsku = Partially (częściowy). | N Nieosiągnięty: 0–15%; C Częściowy: >15–50%; W Większościowy: >50–85%; P Pełny: >85–100%. EN: N/P/L/F. Procent = oceniony stopień osiągnięcia atrybutu, nie odsetek udanych zgłoszeń. | Pełny (EN: F). Częściowy to C (EN: P) – najczęstsza pułapka.","ex":"N: brak lub znikome dowody; C: częściowe osiąganie; W: systematyczne podejście i znaczne osiąganie; P: kompletne, systematyczne osiąganie bez istotnych słabości. Progi 15, 50 i 85 pomagają zapamiętać skalę, lecz ocena wynika z dowodów i kryteriów atrybutu.","org":""}},"fz-D-052":{"id":"fz-D-052","typ":"egzamin","s":"PC-02-05","t":"Jaki jest podstawowy cel modeli dojrzałości COBIT 4.1 opisany w rozdziale o ocenie procesów?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 41","PeopleCert Syllabus — PC-02-05"],"r":null,"zap":"","scen":"","o":[{"t":"Do formalnej certyfikacji według ISO/IEC 15504","ok":false,"w":"Na ISO/IEC 15504 oparto dopiero model COBIT 5."},{"t":"Do oceny wyłącznie aktywatora Informacja","ok":false,"w":"Modele dojrzałości dotyczyły procesów."},{"t":"Do pomiaru obecnej i wymaganej dojrzałości procesów, luki między nimi i sposobu doskonalenia","ok":true,"w":"Modele dojrzałości COBIT 4.1 służyły do oceny aktualnej i docelowej dojrzałości procesów oraz luk i kierunku doskonalenia. Wyniki mogły wspierać decyzje inwestycyjne; nie były jednak pełnym uzasadnieniem biznesowym."},{"t":"Do przygotowania uzasadnienia biznesowego","ok":false,"w":"Wyniki oceny mogą wspierać uzasadnienie biznesowe. Podstawową funkcją modelu jest jednak ocena aktualnej i docelowej dojrzałości procesów oraz luk i kierunku doskonalenia."}],"fz":{"h":"Modele dojrzałości COBIT 4.1","p":"P2","pulapka":false,"n":"EN: COBIT 4.1 maturity models","q":"Do czego służyły modele dojrzałości COBIT 4.1?","a":"Do pomiaru obecnej dojrzałości procesów („tak jest”), określenia wymaganej („tak ma być”), luki między nimi i sposobu doskonalenia.","ex":"Stary sposób: zdjęcie kuchni „jak jest dziś”, rysunek „jak ma być” i lista, co poprawić, żeby dojść od jednego do drugiego.","org":""}},"fz-D-053":{"id":"fz-D-053","typ":"egzamin","s":"PC-02-05","t":"Proces miał poziom 1 w COBIT 4.1, ale nie osiąga rezultatów procesu. Jaki poziom może dostać w COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 43","FW-PL s. 44","PeopleCert Syllabus — PC-02-05"],"r":null,"zap":"","scen":"","o":[{"t":"0 – bez osiągnięcia rezultatów procesu nie ma poziomu 1","ok":true,"w":"Podobna liczba poziomu w obu modelach nie oznacza równoważności. Proces oceniony dawniej na 1 może mieć 0 w COBIT 5, jeśli nie osiąga wymaganych rezultatów. Nie ma automatycznego przeliczenia 1:1."},{"t":"1 – poziomy przelicza się 1:1","ok":false,"w":"Prostego przełożenia nie ma."},{"t":"2 – w COBIT 5 wyniki są zwykle wyższe","ok":false,"w":"Wyniki w COBIT 5 są zwykle niższe."},{"t":"Nie da się go ocenić, bo COBIT 5 nie ma poziomu 0","ok":false,"w":"Poziom 0 – Proces niekompletny istnieje."}],"fz":{"h":"Niższe wyniki w COBIT 5","p":"P2","pulapka":false,"n":"EN: Lower scores in COBIT 5","q":"Dlaczego wyniki oceny COBIT 5 są zwykle niższe niż w COBIT 4.1? | Proces na poziomie 1 w COBIT 4.1 – jaki poziom w COBIT 5?","a":"W COBIT 4.1 proces mógł mieć poziom 1 lub 2 bez pełnego osiągnięcia celów procesu; w COBIT 5 taki proces dostanie 0 lub 1. | Może wyjść 0, jeśli nie osiąga rezultatów procesu – stąd zwykle niższe wyniki w COBIT 5.","ex":"Stary egzaminator dawał punkty „za starania”. Nowy pyta najpierw: czy kuchnia naprawdę osiąga swój cel (obiady dla gości)? Jeśli nie w pełni, zostaje na 0 lub 1. | Kuchnia, która „się stara, ale obiady nie zawsze wychodzą”, w starej skali dostawała 1, w nowej dostaje 0 – liczy się efekt.","org":""}},"fz-D-054":{"id":"fz-D-054","typ":"egzamin","s":"PC-02-05","t":"Co ocenia model zdolności COBIT 5 – organizację czy proces?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 41","FW-PL s. 43–44","FW-PL s. 43","PeopleCert Syllabus — PC-02-05"],"r":null,"zap":"","scen":"","o":[{"t":"Całą organizację jednym wynikiem","ok":false,"w":"Ocena dotyczy procesu, a nie całej organizacji."},{"t":"Profil dojrzałości całego przedsiębiorstwa","ok":false,"w":"Profil przedsiębiorstwa składało się w COBIT 4.1."},{"t":"Tylko procesy domeny EDM","ok":false,"w":"Ocenia się każdy proces, nie tylko EDM (Evaluate, Direct and Monitor — Oszacuj, Kieruj i Monitoruj)."},{"t":"Zdolność poszczególnych procesów, według zakresu oceny","ok":true,"w":"COBIT 5 ocenia zdolność poszczególnych procesów we wspólnym wymiarze zdolności. Cały model obejmuje dziewięć atrybutów, lecz zakres konkretnej oceny może obejmować mniej poziomów. COBIT 4.1 również oceniał procesy i pozwalał zestawiać ich profil."}],"fz":{"h":"Profil organizacji czy procesu","p":"P1","pulapka":true,"n":"EN: Enterprise maturity profile vs per-process capability","q":"Co daje model COBIT 4.1, a co COBIT 5 – profil organizacji czy procesu? | Model zdolności ocenia organizację czy proces?","a":"COBIT 4.1 oceniał dojrzałość procesów i pozwalał zestawić profil dojrzałości przedsiębiorstwa. COBIT 5 ocenia zdolność poszczególnych procesów we wspólnym modelu dziewięciu atrybutów. Zakres oceny wskazuje procesy i poziomy, więc nie każda ocena musi badać wszystkie dziewięć atrybutów. Wyników obu modeli nie przelicza się 1:1.","ex":"Każdy proces otrzymuje własne oceny. Zestawienie wyników pomaga kierownictwu, ale nie zamienia modelu w jedną zbiorczą ocenę całej organizacji.","org":""}},"fz-D-055":{"id":"fz-D-055","typ":"egzamin","s":"PC-02-03","t":"Czy COBIT 5 ma osobny model dojrzałości dla każdego procesu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 43","PeopleCert Syllabus — PC-02-03"],"r":null,"zap":"","scen":"","o":[{"t":"Nie — dla procesów stosuje się wspólny model zdolności","ok":true,"w":"COBIT 5 stosuje wspólny model zdolności zamiast osobnych opisów dojrzałości 0–5 każdego procesu. PRM (Process Reference Model — Referencyjny Model Procesu) określa przeznaczenie i rezultaty; PAM (Process Assessment Model — Model Oceny Procesu) łączy ten wymiar procesu ze wskaźnikami wykonania i wymiarem zdolności."},{"t":"Tak – każdy proces ma własną skalę 0–5","ok":false,"w":"Skala i atrybuty zdolności są wspólne dla ocenianych procesów; nie tworzy się osobnego opisu dojrzałości 0–5 dla każdego procesu."},{"t":"Tak, ale tylko procesy Ładu (EDM)","ok":false,"w":"Rozróżnienie dotyczy całego modelu COBIT 5, a nie tylko procesów Ładu."},{"t":"Nie – bo COBIT 5 w ogóle nie ocenia procesów","ok":false,"w":"COBIT 5 ocenia zdolność procesów."}],"fz":{"h":"Brak osobnego modelu dojrzałości dla procesu","p":"P2","pulapka":false,"n":"EN: No per-process maturity model","q":"Czy COBIT 5 ma osobny model dojrzałości dla każdego procesu?","a":"COBIT 5 nie stosuje osobnego modelu dojrzałości 0–5 każdego procesu. Process Reference Model — Referencyjny Model Procesu — opisuje przeznaczenie i rezultaty procesów. Process Assessment Model — Model Oceny Procesu — łączy ten wymiar ze wskaźnikami wykonania oraz wspólnym wymiarem zdolności. Ogólnych cech atrybutów wyższych poziomów nie włącza się do treści każdego opisu procesu.","ex":"Opis mówi, po co proces istnieje i co ma osiągać. Oddzielny wspólny wymiar ocenia, w jakim stopniu proces jest wykonywany, zarządzany, ustanowiony, przewidywalny i doskonalony.","org":""}},"fz-D-056":{"id":"fz-D-056","typ":"egzamin","s":"PC-02-05","t":"Która z poniższych NIE jest korzyścią modelu zdolności COBIT 5 względem COBIT 4.1?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 44"],"r":null,"zap":"","scen":"","o":[{"t":"Skupienie na tym, czy proces osiąga cel","ok":false,"w":"To korzyść z fiszki."},{"t":"Ocena wiarygodniejsza i bardziej powtarzalna","ok":false,"w":"To korzyść z fiszki."},{"t":"Zgodność z uznaną normą","ok":false,"w":"To korzyść z fiszki."},{"t":"Bezpośrednie przeliczenie starych ocen 1:1","ok":true,"w":"Ocen COBIT 4.1 nie przeliczysz 1:1."}],"fz":{"h":"Korzyści modelu zdolności COBIT 5","p":"P2","pulapka":false,"n":"EN: Benefits of the COBIT 5 capability model","q":"Jakie korzyści daje model zdolności COBIT 5 względem COBIT 4.1?","a":"Skupienie na tym, czy proces osiąga cel; prostsza treść bez powtórzeń; ocena wiarygodniejsza i bardziej powtarzalna; nadaje się do formalnej oceny; zgodność z uznaną normą.","ex":"Jak jednolity regulamin sanepidu: każdy inspektor ocenia tak samo, liczy się efekt na talerzu, a wynik uznają wszyscy.","org":""}},"fz-D-057":{"id":"fz-D-057","typ":"egzamin","s":"PC-01-01","t":"Co odróżnia poziom 2 – Proces zarządzany od poziomu 1?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42","PeopleCert Syllabus — PC-01-01"],"r":null,"zap":"","scen":"","o":[{"t":"Planowanie i kontrolowanie wykonania oraz zarządzanie produktami pracy","ok":true,"w":"Poziom 2 dodaje zarządzanie wykonywaniem procesu oraz produktami pracy. Wykonanie jest planowane, monitorowane i dostosowywane; produkty pracy są właściwie określone, kontrolowane i utrzymywane. Oba atrybuty poziomu 2 muszą mieć co najmniej W, a PA (Process Attribute — atrybut procesu) 1.1 — P."},{"t":"Wdrożenie zdefiniowanego standardu procesu w skali organizacji","ok":false,"w":"To poziom 3."},{"t":"Ciągłe doskonalenie procesu przewidywalnego według celów biznesowych","ok":false,"w":"To poziom 5."},{"t":"Osiąganie przeznaczenia i wymaganych rezultatów procesu","ok":false,"w":"To poziom 1."}],"fz":{"h":"Poziom 2 – Proces zarządzany","p":"P1","pulapka":false,"n":"EN: Level 2 Managed","q":"Co oznacza poziom 2 – Proces zarządzany?","a":"Poziom 2 — Proces zarządzany — oznacza, że proces osiągający przeznaczenie jest wykonywany w sposób planowany, monitorowany i dostosowywany, a produkty pracy są właściwie określone, kontrolowane i utrzymywane. Obejmuje PA 2.1 Performance management — Zarządzanie wydajnością — i PA 2.2 Work product management — Zarządzanie produktami pracy. Do potwierdzenia poziomu oba muszą mieć co najmniej W, a PA 1.1 — P.","ex":"Szef kuchni układa grafik, sprawdza, czy zespół zdąża, i poprawia plan; zamówienia i receptury są pod kontrolą, a nie na luźnych karteczkach.","org":""}},"fz-D-058":{"id":"fz-D-058","typ":"egzamin","s":"PC-01-01","t":"Czy do poziomu 3 – Proces ustanowiony wystarczy spisany dokument standardu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42"],"r":null,"zap":"","scen":"","o":[{"t":"Tak – liczy się sam dokument","ok":false,"w":"Standard musi działać w praktyce (PA 3.2 Wdrożenie procesu)."},{"t":"Tak – jeśli dokument zatwierdzi zarząd","ok":false,"w":"Zatwierdzenie nie zastępuje stosowania w praktyce."},{"t":"Nie – potrzebna jest też kontrola ilościowa","ok":false,"w":"Kontrola ilościowa to poziom 4."},{"t":"Nie – standard musi być wdrożony w praktyce i pozwalać osiągać wyniki","ok":true,"w":"Fiszka: sam dokument nie wystarczy."}],"fz":{"h":"Poziom 3 – Proces ustanowiony","p":"P1","pulapka":true,"n":"EN: Level 3 Established","q":"Co oznacza poziom 3 – Proces ustanowiony?","a":"Proces zarządzany z poziomu 2 działa teraz według zdefiniowanego standardu (wzorca), wdrożonego w praktyce, który pozwala osiągać wyniki. Sam dokument nie wystarczy. Dwa atrybuty: PA 3.1 Definicja procesu i PA 3.2 Wdrożenie procesu.","ex":"Sieć restauracji ma spisaną książkę receptur i każda kuchnia gotuje według niej, a nie każdy kucharz po swojemu.","org":""}},"fz-D-059":{"id":"fz-D-059","typ":"egzamin","s":"PC-01-01","t":"Czy do poziomu 4 – Proces przewidywalny wystarczy zbierać mierniki?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42","PeopleCert Syllabus — PC-01-01"],"r":null,"zap":"","scen":"","o":[{"t":"Tak — wystarczają zdefiniowane mierniki i regularne raportowanie wyników","ok":false,"w":"Potrzebne jest też trzymanie procesu w granicach (PA (Process Attribute — atrybut procesu) 4.2)."},{"t":"Nie — wymagane jest już ciągłe wdrażanie innowacji w procesie","ok":false,"w":"Innowacja to poziom 5."},{"t":"Tak — wystarczy, że pomiary zatwierdzi uprawniona osoba oceniająca","ok":false,"w":"Zatwierdzenie pomiarów przez osobę oceniającą nie zastępuje ilościowego rozumienia zachowania procesu i jego kontroli w zdefiniowanych granicach."},{"t":"Nie — potrzebne są ilościowe zrozumienie i kontrola w ustalonych granicach","ok":true,"w":"Poziom 4 wymaga ilościowego rozumienia i kontrolowania procesu ustanowionego w zdefiniowanych granicach. Sam zbiór mierników ani dotrzymany poziom usług nie potwierdza tego poziomu. Wymagane są odpowiednie oceny obu atrybutów poziomu 4 i pełne osiągnięcie niższych."}],"fz":{"h":"Poziom 4 – Proces przewidywalny","p":"P1","pulapka":true,"n":"EN: Level 4 Predictable","q":"Co oznacza poziom 4 – Proces przewidywalny?","a":"Poziom 4 — Proces przewidywalny — oznacza ilościowo rozumiany proces ustanowiony, kontrolowany w zdefiniowanych granicach dla osiągania rezultatów. Samo zbieranie mierników ani spełnienie ustalonego czasu obsługi nie potwierdza poziomu. Potrzebne są oceny PA 4.1 i PA 4.2 co najmniej W oraz pełne osiągnięcie wszystkich niższych atrybutów.","ex":"Zespół nie tylko zbiera czasy obsługi. Rozumie ich zmienność, monitoruje zachowanie procesu i stosuje ilościowe mechanizmy kontroli. To ilustracja wymagań, a nie samodzielny dowód poziomu 4.","org":""}},"fz-D-060":{"id":"fz-D-060","typ":"egzamin","s":"PC-01-01","t":"Co oznacza poziom 5 – Proces zoptymalizowany?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42","PeopleCert Syllabus — PC-01-01"],"r":null,"zap":"","scen":"","o":[{"t":"Proces osiąga cel, choć działa bez planu","ok":false,"w":"To poziom 1."},{"t":"Proces działa według zdefiniowanego standardu","ok":false,"w":"To poziom 3."},{"t":"Proces przewidywalny jest stale doskonalony dla celów biznesowych","ok":true,"w":"Poziom 5 oznacza nieustanne doskonalenie procesu przewidywalnego dla istotnych obecnych i przyszłych celów biznesowych. Obejmuje innowację i optymalizację procesu; nie oznacza końca zmian ani identycznego poziomu dla wszystkich procesów."},{"t":"Proces osiągnął 100% i nie wymaga już zmian","ok":false,"w":"Poziom 5 oznacza ciągłe doskonalenie, a nie koniec zmian."}],"fz":{"h":"Poziom 5 – Proces zoptymalizowany","p":"P1","pulapka":false,"n":"EN: Level 5 Optimising","q":"Co oznacza poziom 5 – Proces zoptymalizowany?","a":"Proces przewidywalny jest stale doskonalony, by realizować obecne i przyszłe istotne cele biznesowe. Dwa atrybuty.","ex":"Kuchnia nie spoczywa na laurach: testuje nowe dania i sprzęt, by nadążać za gośćmi dziś i za rok. Czarny pas – i dalej trening.","org":""}},"fz-D-061":{"id":"fz-D-061","typ":"egzamin","s":"PC-01-02","t":"Które atrybuty należą do poziomu 2?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42"],"r":null,"zap":"","scen":"","o":[{"t":"PA 2.1 Zarządzanie wydajnością i PA 2.2 Zarządzanie produktami pracy","ok":true,"w":"To dwa atrybuty poziomu 2."},{"t":"PA 2.1 Definicja procesu i PA 2.2 Wdrożenie procesu","ok":false,"w":"To atrybuty poziomu 3 (PA 3.1 i 3.2)."},{"t":"PA 2.1 Miara procesu i PA 2.2 Kontrola procesu","ok":false,"w":"To atrybuty poziomu 4 (PA 4.1 i 4.2)."},{"t":"PA 2.1 Wykonanie procesu i PA 2.2 Innowacja procesu","ok":false,"w":"Wykonanie procesu to PA 1.1, a innowacja to PA 5.1."}],"fz":{"h":"Atrybuty poziomów 1 i 2","p":"P1","pulapka":false,"n":"EN: PA 1.1 Process performance; PA 2.1 Performance management; PA 2.2 Work product management","q":"Podaj atrybuty poziomów 1 i 2 (nazwy egzaminacyjne).","a":"Poziom 1: PA 1.1 Wykonanie procesu. Poziom 2: PA 2.1 Zarządzanie wydajnością, PA 2.2 Zarządzanie produktami pracy.","ex":"Poziom 1 pyta: czy obiad wychodzi? Poziom 2 pyta: czy praca jest planowana i pilnowana (2.1) oraz czy receptury i zamówienia są w porządku (2.2)?","org":""}},"fz-D-062":{"id":"fz-D-062","typ":"egzamin","s":"PC-01-02","t":"Jak na egzaminie PL nazywa się atrybut PA 4.1?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42","PeopleCert Syllabus — PC-01-02","SP1 s. 26"],"r":null,"zap":"","scen":"","o":[{"t":"Kontrola procesu","ok":false,"w":"To PA (Process Attribute — atrybut procesu) 4.2."},{"t":"Miara procesu (podr.: Pomiar procesu)","ok":true,"w":"PA (Process Attribute — atrybut procesu) 4.1 to Process measurement — Miara procesu, w podręczniku Pomiar procesu. PA 4.2 to Process control — Kontrola procesu. Są to dwa atrybuty poziomu 4; nazwę Miara procesu stosuje również polski arkusz próbny."},{"t":"Definicja procesu","ok":false,"w":"To PA (Process Attribute — atrybut procesu) 3.1."},{"t":"Optymalizacja procesu","ok":false,"w":"To PA (Process Attribute — atrybut procesu) 5.2."}],"fz":{"h":"Atrybuty poziomów 3 i 4","p":"P1","pulapka":true,"n":"EN: PA 3.1 Process definition; PA 3.2 Process deployment; PA 4.1 Process measurement; PA 4.2 Process control","q":"Podaj atrybuty poziomów 3 i 4 (nazwy egzaminacyjne). | PA 4.1 – „Pomiar procesu” czy „Miara procesu”?","a":"Poziom 3: PA 3.1 Definicja procesu, PA 3.2 Wdrożenie procesu. Poziom 4: PA 4.1 Miara procesu, PA 4.2 Kontrola procesu. | Na egzaminie PL: Miara procesu; w podręczniku: Pomiar procesu. To ten sam atrybut poziomu 4.","ex":"PA 3.1: zdefiniowany standard procesu. PA 3.2: rzeczywiste wdrożenie dopasowanego procesu. Sam dokument nie wystarcza. PA 4.1: pomiar ilościowy. PA 4.2: kontrola procesu. Przyznanie poziomu wymaga także odpowiednich ocen niższych atrybutów.","org":""}},"fz-D-063":{"id":"fz-D-063","typ":"egzamin","s":"PC-01-02","t":"Które atrybuty należą do poziomu 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42","PeopleCert Syllabus — PC-01-02"],"r":null,"zap":"","scen":"","o":[{"t":"PA 5.1 Miara procesu i PA 5.2 Kontrola procesu","ok":false,"w":"To atrybuty poziomu 4."},{"t":"PA 5.1 Definicja procesu i PA 5.2 Wdrożenie procesu","ok":false,"w":"To atrybuty poziomu 3."},{"t":"Tylko jeden: PA 5.1 Optymalizacja procesu","ok":false,"w":"Poziom 5 ma dwa atrybuty, a optymalizacja to PA (Process Attribute — atrybut procesu) 5.2."},{"t":"PA 5.1 Innowacja procesu i PA 5.2 Optymalizacja procesu","ok":true,"w":"Poziom 5 obejmuje PA (Process Attribute — atrybut procesu) 5.1 Process innovation — Innowacja procesu — oraz PA 5.2 Process optimization — Optymalizacja procesu. Ich ocena dotyczy systematycznego doskonalenia procesu przewidywalnego w związku z celami biznesowymi."}],"fz":{"h":"Atrybuty poziomu 5","p":"P1","pulapka":false,"n":"EN: PA 5.1 Process innovation; PA 5.2 Process optimisation","q":"Podaj atrybuty poziomu 5 (nazwy egzaminacyjne).","a":"PA 5.1 Innowacja procesu, PA 5.2 Optymalizacja procesu.","ex":"W związku z celami biznesowymi zespół identyfikuje możliwości innowacji i doskonalenia, wprowadza zmiany oraz ocenia ich skuteczność. Skrót najpierw pomysł, potem poprawa jest tylko pomocą pamięciową; formalne potwierdzenie obejmuje oba atrybuty i niższe poziomy.","org":""}},"fz-D-064":{"id":"fz-D-064","typ":"egzamin","s":"PC-01-03","t":"Co oznacza ocena C – Częściowy (EN: P)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 45"],"r":null,"zap":"","scen":"","o":[{"t":"Atrybut jest realizowany systematycznie, z pewnymi słabościami; >50–85%","ok":false,"w":"To ocena W."},{"t":"Atrybut jest w pełni osiągany, bez istotnych słabości; >85–100%","ok":false,"w":"To ocena P."},{"t":"Są pewne dowody realizacji atrybutu, część rzeczy dzieje się nieprzewidywalnie; >15–50%","ok":true,"w":"Tak opisuje ocenę C fiszka."},{"t":"Atrybut jest nieosiągnięty; 0–15%","ok":false,"w":"To ocena N."}],"fz":{"h":"Ocena C – Częściowy","p":"P1","pulapka":true,"n":"EN: P – Partially achieved","q":"Co oznacza ocena C – Częściowy (EN: P)?","a":"Są pewne dowody, że atrybut jest realizowany i częściowo osiągany; część rzeczy dzieje się nieprzewidywalnie. >15–50%.","ex":"Kuchnia czasem trzyma się grafiku, czasem nie – raczej przypadkiem niż z zasady. Zrobione mniej niż połowa.","org":""}},"fz-D-065":{"id":"fz-D-065","typ":"egzamin","s":"PC-01-03","t":"Jaki zakres procentowy odpowiada ocenie W – Większościowy (EN: L)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 45","PeopleCert Syllabus — PC-01-03"],"r":null,"zap":"","scen":"","o":[{"t":">15–50%","ok":false,"w":"To zakres oceny C."},{"t":">85–100%","ok":false,"w":"To zakres oceny P."},{"t":">50–85%","ok":true,"w":"W — Większościowy, angielskie L — Largely achieved — obejmuje >50–85% osiągnięcia atrybutu. Wymagane są dowody systematycznego podejścia i znacznego osiągania; pewne słabości mogą nadal istnieć."},{"t":"0–15%","ok":false,"w":"To zakres oceny N."}],"fz":{"h":"Ocena W – Większościowy","p":"P1","pulapka":true,"n":"EN: L – Largely achieved","q":"Co oznacza ocena W – Większościowy (EN: L)?","a":"Są dowody, że atrybut jest realizowany systematycznie i w dużej mierze osiągany; mogą zostać pewne słabości. >50–85%.","ex":"Kuchnia zwykle trzyma się grafiku i robi to celowo, ale zdarzają się wpadki. Zrobiona większość, nie wszystko.","org":""}},"fz-D-066":{"id":"fz-D-066","typ":"egzamin","s":"PC-01-03","t":"Czy ocena P – Pełny wymaga 100% osiągnięcia atrybutu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 45","PeopleCert Syllabus — PC-01-03"],"r":null,"zap":"","scen":"","o":[{"t":"Tak – tylko 100% daje ocenę P","ok":false,"w":"Zakres oceny P to >85–100%."},{"t":"Nie – wystarczy ponad 85%, bez istotnych słabości","ok":true,"w":"P — Pełny, angielskie F — Fully achieved — obejmuje >85–100%. Potrzebne są dowody kompletnego i systematycznego podejścia oraz brak istotnych słabości. Sam procent bez jakościowej oceny dowodów nie wystarcza."},{"t":"Nie – wystarczy ponad 50%","ok":false,"w":"Ponad 50% to dopiero ocena W."},{"t":"Tak – i dodatkowo potwierdzenie zewnętrznego asesora","ok":false,"w":"Ocena P nie wymaga 100% ani zewnętrznego asesora."}],"fz":{"h":"Ocena P – Pełny","p":"P1","pulapka":true,"n":"EN: F – Fully achieved","q":"Co oznacza ocena P – Pełny (EN: F)?","a":"Są dowody, że atrybut jest realizowany kompletnie i systematycznie oraz w pełni osiągany; brak istotnych słabości. >85–100%.","ex":"Ponad 85% ocenionego osiągnięcia może odpowiadać P, ale potrzebne są również kompletne i systematyczne podejście oraz brak istotnych słabości. Nie jest to prosty procent udanych zgłoszeń ani wynik testu wiedzy.","org":""}},"fz-D-067":{"id":"fz-D-067","typ":"egzamin","s":"PC-02-06","t":"Jak ocenia się, czy proces osiągnął poziom 1?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 45","PeopleCert Syllabus — PC-02-06"],"r":null,"zap":"","scen":"","o":[{"t":"Ocenia się tylko plan pracy procesu","ok":false,"w":"Planowanie to poziom 2."},{"t":"Ocenia się rezultaty i praktyki; pomocniczo produkty pracy","ok":true,"w":"Opis ogólnej oceny w podręczniku zaczyna się od rezultatów procesu, następnie uwzględnia praktyki bazowe, a w celu dopracowania także produkty pracy. Produkty pracy są wejściami i wyjściami procesu, a nie wyłącznie dokumentami."},{"t":"Ocenia się atrybuty PA 2.1 i PA 2.2","ok":false,"w":"To atrybuty poziomu 2."},{"t":"Ocenia się dojrzałość całej organizacji","ok":false,"w":"Ocena dotyczy procesu, a nie organizacji."}],"fz":{"h":"Ocena poziomu 1","p":"P1","pulapka":false,"n":"EN: Assessing level 1","q":"Jak ocenia się, czy proces osiągnął poziom 1?","a":"Ogólne podejście z podręcznika: sprawdzić wymagane rezultaty i ocenić osiąganie celu; uwzględnić realizację praktyk bazowych; dla dopracowania oceny uwzględnić produkty pracy. Produkty pracy są wejściami i wyjściami, nie tylko dokumentami. Dla poziomu 1 PA 1.1 musi otrzymać co najmniej W.","ex":"Oceniający pyta o wymagane wyniki procesu, weryfikuje działania prowadzące do nich i sprawdza odpowiednie produkty pracy. Sama obecność procedury nie dowodzi osiągania rezultatów.","org":""}},"fz-D-068":{"id":"fz-D-068","typ":"egzamin","s":"PC-02-06","t":"Co zrobić, gdy proces nie osiąga poziomu 1?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 45"],"r":null,"zap":"","scen":"","o":[{"t":"Udoskonalić proces – ocena praktyk pokaże, których brakuje lub które nie działają","ok":true,"w":"Tak radzi fiszka."},{"t":"Od razu przejść do oceny poziomu 2","ok":false,"w":"Poziom 2 wymaga najpierw pełnego osiągnięcia poziomu 1."},{"t":"Uznać, że to poziom 1, bo proces istnieje","ok":false,"w":"Bez rezultatów proces zostaje na poziomie 0."},{"t":"Zmienić skalę ocen na łagodniejszą","ok":false,"w":"Skala N/C/W/P jest stała."}],"fz":{"h":"Gdy proces nie osiąga poziomu 1","p":"P2","pulapka":false,"n":"EN: Improvement when level 1 not achieved","q":"Co zrobić, gdy proces nie osiąga poziomu 1?","a":"Jeśli rezultat nie jest konsekwentnie uzyskiwany, proces trzeba udoskonalić; ocena praktyk pokaże, których brakuje lub które nie działają.","ex":"Jeśli obiady nie wychodzą regularnie, lista czynności pokaże, gdzie jest dziura – np. nikt nie zamawia warzyw. Wtedy wiadomo, co naprawić.","org":""}},"fz-D-069":{"id":"fz-D-069","typ":"egzamin","s":"PC-01-04","t":"Które z poniższych NIE jest jednym z czterech pojęć ISO/IEC 15504 używanych w ocenie?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 43"],"r":null,"zap":"","scen":"","o":[{"t":"Mapa drogowa","ok":true,"w":"To pojęcie z wytycznych wdrożenia (faza 3)."},{"t":"Praktyka bazowa","ok":false,"w":"To jedno z czterech pojęć."},{"t":"Produkt pracy","ok":false,"w":"To jedno z czterech pojęć."},{"t":"Rezultat procesu","ok":false,"w":"To jedno z czterech pojęć."}],"fz":{"h":"Cztery pojęcia ISO/IEC 15504","p":"P1","pulapka":false,"n":"EN: Process purpose, outcome, base practice, work product","q":"Podaj cztery pojęcia ISO/IEC 15504 używane w ocenie.","a":"Przeznaczenie procesu, rezultat procesu, praktyka bazowa, produkt pracy (podr.: cel procesu, wynik procesu, podstawowa praktyka, produkt działań).","ex":"Kuchnia: przeznaczenie – po co jest (karmić gości); rezultat – co widać (obiad na stole); praktyka bazowa – co się robi (gotowanie); produkt pracy – ślad (zamówienie, rachunek).","org":""}},"fz-D-070":{"id":"fz-D-070","typ":"egzamin","s":"PC-01-04","t":"Czym są praktyki bazowe w COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 43","PeopleCert Syllabus — PC-01-04"],"r":null,"zap":"","scen":"","o":[{"t":"Odpowiednikami wejść i wyjść procesu","ok":false,"w":"To produkty pracy."},{"t":"Atrybutami poziomów 2–5","ok":false,"w":"Atrybuty to cechy zdolności, a nie praktyki bazowe."},{"t":"Odpowiednikami praktyk Ładu i Zarządzania z opisu procesu","ok":true,"w":"Praktyki bazowe odpowiadają praktykom Ładu i Zarządzania danego procesu. Ich realizacja prowadzi do wymaganych rezultatów. Szczegółowe czynności rozwijające praktykę są działaniami; tych poziomów opisu nie należy utożsamiać."},{"t":"Widocznymi efektami spełnienia przeznaczenia procesu","ok":false,"w":"To rezultaty procesu."}],"fz":{"h":"Praktyki bazowe","p":"P1","pulapka":false,"n":"EN: Base practices = governance/management practices","q":"Czym są praktyki bazowe w COBIT 5?","a":"To odpowiedniki praktyk Ładu i Zarządzania z opisu procesu; ich wykonywanie prowadzi do rezultatów procesu (poziom 1).","ex":"Praktyka bazowa opisuje, co należy robić, aby osiągnąć rezultat procesu. Jej wdrożenie można rozwinąć w działania i bardziej szczegółowe czynności. Praktyka i pojedynczy krok roboczy to różne poziomy opisu.","org":""}},"fz-D-071":{"id":"fz-D-071","typ":"egzamin","s":"PC-01-04","t":"Czemu w COBIT 5 odpowiadają produkty pracy?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 43","PeopleCert Syllabus — PC-01-04"],"r":null,"zap":"","scen":"","o":[{"t":"Praktykom Ładu i Zarządzania","ok":false,"w":"Im odpowiadają praktyki bazowe."},{"t":"Atrybutom procesu","ok":false,"w":"Atrybuty to mierzalne cechy zdolności."},{"t":"Wejściom i wyjściom procesu","ok":true,"w":"Produkty pracy odpowiadają wejściom i wyjściom procesu. Mogą obejmować dokumenty, rejestry, informacje i inne wyniki potrzebne do działania procesu albo potwierdzające jego realizację."},{"t":"Poziomom zdolności","ok":false,"w":"Poziomy to skala 0–5, a nie produkty pracy."}],"fz":{"h":"Produkty pracy","p":"P1","pulapka":false,"n":"EN: Work products = inputs/outputs","q":"Czym są produkty pracy w COBIT 5?","a":"To odpowiedniki wejść i wyjść procesu: dokumenty i inne ślady (dowody) p
