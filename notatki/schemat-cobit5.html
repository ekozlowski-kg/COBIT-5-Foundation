<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schemat COBIT 5</title>
<link rel="stylesheet" href="https://unpkg.com/@xyflow/react@12.3.2/dist/style.css">
<style>
:root{
  --bg:#f6f5f0;--surface:#ffffff;--text:#1f1e1d;--muted:#5f5e5a;--border:#d9d7cd;--line:#888780;
  --acc-f:#EEEDFE;--acc-s:#534AB7;--acc-t:#3C3489;--exam-good:#17643f;--exam-bad:#a63731;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171716;--surface:#242422;--text:#efeee9;--muted:#b4b2a9;--border:#3d3d3a;--line:#9c9a92;
  --acc-f:#3C3489;--acc-s:#AFA9EC;--acc-t:#EEEDFE;--exam-good:#85d6a7;--exam-bad:#ffb3ad;
}}
:root[data-theme="dark"]{
  --bg:#171716;--surface:#242422;--text:#efeee9;--muted:#b4b2a9;--border:#3d3d3a;--line:#9c9a92;
  --acc-f:#3C3489;--acc-s:#AFA9EC;--acc-t:#EEEDFE;--exam-good:#85d6a7;--exam-bad:#ffb3ad;
}
.g-amber{--f:#FAEEDA;--s:#BA7517;--t:#633806}
.g-green{--f:#EAF3DE;--s:#3B6D11;--t:#27500A}
.g-coral{--f:#FAECE7;--s:#993C1D;--t:#712B13}
.g-pink{--f:#FBEAF0;--s:#993556;--t:#72243E}
.g-blue{--f:#E6F1FB;--s:#185FA5;--t:#0C447C}
.g-purple{--f:#EEEDFE;--s:#534AB7;--t:#3C3489}
.g-teal{--f:#E1F5EE;--s:#0F6E56;--t:#085041}
.g-gray{--f:#F1EFE8;--s:#5F5E5A;--t:#444441}
.g-red{--f:#FCEBEB;--s:#A32D2D;--t:#791F1F}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .g-amber{--f:#4a2a05;--s:#EF9F27;--t:#FAC775}
  :root:not([data-theme="light"]) .g-green{--f:#1d3a08;--s:#97C459;--t:#C0DD97}
  :root:not([data-theme="light"]) .g-coral{--f:#57200e;--s:#F0997B;--t:#F5C4B3}
  :root:not([data-theme="light"]) .g-pink{--f:#4B1528;--s:#ED93B1;--t:#F4C0D1}
  :root:not([data-theme="light"]) .g-blue{--f:#09345f;--s:#85B7EB;--t:#B5D4F4}
  :root:not([data-theme="light"]) .g-purple{--f:#2d2768;--s:#AFA9EC;--t:#CECBF6}
  :root:not([data-theme="light"]) .g-teal{--f:#063d31;--s:#5DCAA5;--t:#9FE1CB}
  :root:not([data-theme="light"]) .g-gray{--f:#353533;--s:#B4B2A9;--t:#D3D1C7}
  :root:not([data-theme="light"]) .g-red{--f:#5c1717;--s:#F09595;--t:#F7C1C1}
}
:root[data-theme="dark"] .g-amber{--f:#4a2a05;--s:#EF9F27;--t:#FAC775}
:root[data-theme="dark"] .g-green{--f:#1d3a08;--s:#97C459;--t:#C0DD97}
:root[data-theme="dark"] .g-coral{--f:#57200e;--s:#F0997B;--t:#F5C4B3}
:root[data-theme="dark"] .g-pink{--f:#4B1528;--s:#ED93B1;--t:#F4C0D1}
:root[data-theme="dark"] .g-blue{--f:#09345f;--s:#85B7EB;--t:#B5D4F4}
:root[data-theme="dark"] .g-purple{--f:#2d2768;--s:#AFA9EC;--t:#CECBF6}
:root[data-theme="dark"] .g-teal{--f:#063d31;--s:#5DCAA5;--t:#9FE1CB}
:root[data-theme="dark"] .g-gray{--f:#353533;--s:#B4B2A9;--t:#D3D1C7}
:root[data-theme="dark"] .g-red{--f:#5c1717;--s:#F09595;--t:#F7C1C1}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.bar{height:50px;flex:none;position:relative;z-index:20;display:flex;align-items:center;gap:10px;padding:6px 12px;border-bottom:1px solid var(--border);background:var(--surface)}
.brand{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.brand-mark{display:grid;place-items:center;flex:none;width:28px;height:28px;border-radius:8px;background:var(--acc-f);color:var(--acc-t);font-size:12px;font-weight:800;letter-spacing:-.08em}
.bar h1{font-size:15px;line-height:1.2;font-weight:750;letter-spacing:-.025em;margin:0;white-space:nowrap}
.bar button,.bar select,.bar summary{font:inherit;font-size:12px;font-weight:550;min-height:34px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);padding:6px 10px;cursor:pointer}
.bar button:hover,.bar summary:hover{background:var(--bg)}
.bar :is(button,select,summary):focus-visible{outline:3px solid var(--acc-s);outline-offset:2px}
.bar .exam-link{display:flex;gap:8px;align-items:center;justify-content:center;flex:none;background:#6552c5;border-color:#6552c5;color:white;font-weight:700}
.bar .exam-link:hover{background:#5442af}
.exam-count{font-size:11px;font-weight:600;border-left:1px solid #ffffff55;padding-left:8px;opacity:.9}
.bar .area-select{width:100%;min-width:0;background:var(--bg)}
.bar #exbtn[aria-pressed="true"]{background:var(--acc-f);color:var(--acc-t);border-color:var(--acc-s)}
.tools-menu{position:relative;flex:none}
.tools-menu summary{list-style:none;display:flex;align-items:center;justify-content:center;gap:8px;user-select:none}
.tools-menu summary::-webkit-details-marker{display:none}
.tools-menu summary::after{content:'⌄';font-size:15px;color:var(--muted);line-height:1}
.tools-menu[open] summary{border-color:var(--acc-s);background:var(--acc-f)}
.tools-popover{position:absolute;right:0;top:calc(100% + 8px);width:300px;max-width:calc(100vw - 24px);max-height:calc(100dvh - 64px);overflow-y:auto;padding:14px;border:1px solid var(--border);border-radius:12px;background:var(--surface);box-shadow:0 16px 48px #00000030;display:grid;gap:9px}
.tools-popover .menu-label{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin:3px 0 0}
.tools-popover .menu-row{display:flex;gap:8px}
.tools-popover .menu-row button{flex:1}
.tools-popover .menu-help{font-size:11px;color:var(--muted);line-height:1.6;border-top:1px solid var(--border);padding-top:10px;margin:3px 0 0}
.tools-popover kbd{font:inherit;font-size:10px;border:1px solid var(--border);padding:1px 4px;border-radius:4px;background:var(--bg)}
.tools-popover .theme{display:flex}
.tools-popover .theme button{flex:1;padding:6px}
@media(max-width:520px){.bar{height:48px;padding:6px 10px;gap:8px}.brand-extra,.exam-count{display:none}.bar h1{font-size:14px}}
@media(max-width:360px){.brand-mark{display:none}.bar{gap:6px}.bar button,.bar summary{padding:6px 8px}}
.grp{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;flex-shrink:0}
.grp button{font:inherit;font-size:14px;padding:6px 12px;border:0;background:var(--surface);color:var(--muted);cursor:pointer;white-space:nowrap}
.grp button+button{border-left:1px solid var(--border)}
.grp button[aria-pressed="true"]{background:var(--acc-f);color:var(--acc-t);font-weight:600}
.grp button:focus-visible{outline:2px solid var(--acc-s);outline-offset:-2px}
.wrap{position:relative;display:flex;flex:1;min-height:0}
.wrap:fullscreen{height:100vh}
#app{flex:1;min-width:0;height:100%;background:var(--bg)}
#side{position:absolute;right:28px;top:50%;transform:translateY(-50%);width:min(800px,58%);max-height:calc(100% - 40px);overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25);padding:18px 26px 28px;font-size:16px;line-height:1.55;z-index:10}
#side[hidden]{display:none}
#side h2{font-size:21px;font-weight:700;margin:0 0 4px;color:var(--t,var(--text))}
#side .names{font-size:13px;color:var(--muted);margin-bottom:12px}
#side h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:18px 0 6px;font-weight:700}
#side p{margin:0 0 8px}
#side ul.refs{margin:0;padding-left:18px}
#side ul.refs li{margin:3px 0}
#side .trap{background:var(--f,var(--acc-f));border-left:4px solid var(--s,var(--acc-s));padding:8px 10px;border-radius:0 8px 8px 0}
#side .empty{color:var(--muted)}
#side .x{float:right;font:inherit;border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:8px;padding:2px 9px;cursor:pointer}
#side table.mini{width:100%;border-collapse:collapse;font-size:13.5px;margin:4px 0 6px}
#side table.mini th,#side table.mini td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--border);vertical-align:top}
#side table.mini th{color:var(--muted);font-weight:700;font-size:12px}
#side table.mini td:first-child{font-weight:600}
#side .note2{font-size:12.5px;color:var(--muted);margin:2px 0 8px}
#side p.trap + p.trap{margin-top:6px}
.qtools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:4px 0 8px;font-size:13.5px;color:var(--muted)}
.qtools input[type=search]{flex:1 1 100%;font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text)}
.qtools label{display:inline-flex;gap:5px;align-items:center;cursor:pointer}
.qrst{font:inherit;font-size:12.5px;border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:8px;padding:3px 9px;cursor:pointer;margin-left:auto}
.wyn{display:inline-block;margin-left:8px;font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;vertical-align:1px}
.wyn-ok{color:#27500A;background:#C0DD97}
.wyn-bad{color:#791F1F;background:#F7C1C1}
.qtools .cnt{margin-left:auto}
.ans{font-size:14px;margin-top:6px}
.ans ul,.ans ol{padding-left:20px;margin:4px 0}
.ans li{margin:4px 0}
.ans small{color:var(--muted)}
.scen{background:var(--surface);border:1px dashed var(--border);border-radius:8px;padding:7px 9px;font-size:14px}
.opt.reveal{text-align:center;font-weight:600}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--border);margin:10px 0 14px}
.tabs button{font:inherit;font-size:14px;font-weight:600;padding:8px 12px;border:0;border-bottom:3px solid transparent;background:none;color:var(--muted);cursor:pointer;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--t,var(--text));border-bottom-color:var(--s,var(--acc-s))}
.tabs button:focus-visible{outline:2px solid var(--acc-s);outline-offset:-2px}
.nm{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:2px 0 6px}
.chip{background:var(--f,var(--acc-f));border:1.5px solid var(--s,var(--acc-s));border-radius:12px;padding:8px 11px}
.chip .lb{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--t,var(--text));opacity:.75}
.chip .vl{display:block;font-size:17px;font-weight:700;color:var(--t,var(--text));line-height:1.25;margin-top:2px}
.card .more{all:unset;cursor:pointer;display:inline-block;margin-top:8px;font-size:15px;font-weight:600;color:var(--t);background:var(--f);border-radius:999px;padding:2px 12px}
.card .more:focus-visible{outline:2px solid var(--s);outline-offset:2px}
.card.lst{padding:8px 10px}
.card.lst .tog{all:unset;cursor:pointer;display:block;width:100%;font-weight:700;font-size:19px;color:var(--t);line-height:1.3}
.card.lst .tog .cnt{font-weight:600;color:var(--muted)}
.card.lst .tog:focus-visible{outline:2px solid var(--s);outline-offset:2px;border-radius:4px}
.lstbody{max-height:440px;overflow-y:auto;margin-top:8px;cursor:auto}
.lstbody ol,.lstbody ul{margin:0;padding-left:24px;font-size:16px}
.lstbody li{margin:6px 0}
.lstbody .pl{display:block}
.lstbody .en{display:block;font-size:14px;color:var(--muted);font-style:italic}
.cyk{width:100%;background:var(--f);border:2px solid var(--s);border-radius:18px;padding:16px 20px;color:var(--t)}
.cyk-t{font-size:22px;font-weight:700;text-align:center;margin-bottom:12px}
.cyk-row{display:flex;align-items:stretch;gap:10px}
.cyk-f{flex:1;background:var(--surface);border:1.5px solid var(--s);border-radius:12px;padding:10px 12px;font-size:19px;color:var(--text);text-align:center;display:flex;flex-direction:column;gap:3px;justify-content:center}
.cyk-f b{color:var(--t);font-size:15px;text-transform:uppercase;letter-spacing:.04em}
.cyk-ar{align-self:center;font-size:28px;color:var(--s);font-weight:700}
.cyk-back{font-size:22px;white-space:nowrap}
.cykl-fig{display:grid;grid-template-columns:1fr;gap:12px;justify-items:center;margin:4px 0}
.cykl-fig .cykl-svg{max-width:360px}
.cykl-leg{width:100%}
.cykl-leg > span{align-items:flex-start !important}
.cykl-leg > span > span{display:block}
.cykl-svg{width:100%;height:auto}
.cykl-svg path{fill:var(--f);stroke:var(--surface);stroke-width:3}
.cykl-svg text{fill:var(--t);font-size:20px;font-weight:600}
.cykl-svg text.big{font-size:30px;font-weight:800}
.cykl-svg .core{fill:var(--surface);stroke:var(--border)}
.cykl-svg .core-t{fill:var(--text);font-size:18px;font-weight:700}
.cykl-leg{display:flex;flex-direction:column;gap:8px;font-size:15px}
.cykl-leg span{display:flex;align-items:center;gap:8px;color:var(--t);font-weight:600}
.cykl-leg i{width:18px;height:18px;border-radius:5px;background:var(--f);border:2px solid var(--s);flex-shrink:0}
.cykl-tab th.g-amber,.cykl-tab th.g-teal,.cykl-tab th.g-purple{color:var(--t);background:var(--f)}
@media (max-width:700px){.cykl-fig{grid-template-columns:1fr}}
.trapnote{display:inline-block;margin-top:8px;font-size:14px;font-weight:700;color:#791F1F;background:#FCEBEB;border:1px solid #F09595;border-radius:999px;padding:1px 10px}
:root[data-theme="dark"] .trapnote{color:#F7C1C1;background:#5c1717;border-color:#A32D2D}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .trapnote{color:#F7C1C1;background:#5c1717;border-color:#A32D2D}}
.zas .trapnote{margin:0 0 0 10px;font-size:13px}
.cyk .trapnote{display:block;width:max-content;margin:10px auto 0}
.pref{font:inherit;font-size:inherit;color:var(--acc-s);background:none;border:0;border-bottom:1.5px dotted var(--acc-s);padding:0;cursor:pointer}
.pref:hover{background:var(--acc-f)}
#pv{position:absolute;left:24px;top:50%;transform:translateY(-50%);width:min(560px,calc(42% - 70px));max-height:calc(100% - 40px);overflow-y:auto;background:var(--surface);border:2px solid var(--acc-s);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.28);padding:16px 20px 22px;z-index:12;font-size:15px}
#pv[hidden]{display:none}
#pv h2{font-size:20px;margin:0 0 6px}
#pv .x{position:absolute;right:14px;top:12px;font:inherit;border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:8px;padding:2px 9px;cursor:pointer}
#pv .pvt{white-space:pre-wrap;font-family:inherit;font-size:15px;line-height:1.55;margin:8px 0 0;color:var(--text)}
@media (max-width:900px){#pv{left:10px;right:10px;width:auto;top:10px;transform:none;max-height:45%}}
details.q.sp1{border-left:5px solid #BA7517}
details.q.sp1 .meta{color:#854F0B;font-weight:600}
.f1box{display:block;box-sizing:border-box;width:100%;height:100%;border:4px dashed var(--s);border-radius:20px;background:color-mix(in srgb,var(--f) 70%,transparent);padding:12px 16px}
.grp-t{font-weight:800;font-size:26px;line-height:1.2;color:var(--t)}
.grp-en{display:block;font-weight:600;font-size:19px}
.grp-s{font-size:18px;line-height:1.35;color:var(--t);margin-top:4px}
.card .en{font-size:16px;color:var(--muted);margin-top:2px;line-height:1.25}
.zas .en{display:block;font-size:15px;opacity:.85}
.grp-names{margin:6px 0 8px;line-height:1.25;color:var(--t)}
.grp-names .hb,.grp-names .ex{font-size:24px}
.grp-names .hb{font-weight:800}
.grp-names .ex{font-weight:400;margin-top:2px}
.grp-names .en{font-size:17px;margin-top:4px}
.grp-names > div{margin:3px 0}
.grp-names .lb{display:inline-block;min-width:118px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;opacity:.75;margin-right:6px}
.cykl-tab tr.cykl-ph td{background:var(--f,var(--acc-f));color:var(--t,var(--text))}
.cykl-tab .rdot{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--f);border:2px solid var(--s);margin-right:6px;vertical-align:-1px}
.cykl-leg small{font-weight:400;color:var(--muted)}

.fundbox{width:100%;height:100%;box-sizing:border-box;border:4px solid #993C1D;border-radius:22px;background:color-mix(in srgb,#FAECE7 55%,transparent);padding:18px 26px;color:var(--text)}
.fund-t{font-size:30px;font-weight:800}
.fund-t i{font-weight:600;font-size:22px}
.fund-s{font-size:19px;margin-top:6px;line-height:1.35}
:root[data-theme="dark"] .fundbox{border-color:#F0997B;background:color-mix(in srgb,#57200e 45%,transparent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fundbox{border-color:#F0997B;background:color-mix(in srgb,#57200e 45%,transparent)}}


.exban{display:inline-block;font-size:12.5px;font-weight:700;letter-spacing:.02em;color:var(--t,var(--text));background:var(--f,var(--acc-f));border:1px solid var(--s,var(--acc-s));border-radius:999px;padding:3px 10px;margin:2px 0 8px}
.expane-box h3:first-child{margin-top:4px}
.expane-box p{font-size:15.5px;line-height:1.5}
.gojump{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--s,var(--acc-s));background:var(--f,var(--acc-f));color:var(--t,var(--text));border-radius:999px;padding:4px 12px;margin:2px 4px 2px 0;cursor:pointer}
.gojump:hover{filter:brightness(.95)}
.pol-box{background:var(--f,var(--acc-f));border:1px solid var(--s,var(--acc-s));border-radius:12px;padding:10px 14px;margin:2px 0 12px}
.pol-box b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--t,var(--text))}
.pol-box p{margin:4px 0 0;font-size:16px;line-height:1.5}
.expane-out{font-weight:700;background:var(--f,var(--acc-f));border-left:4px solid var(--s,var(--acc-s));padding:8px 10px;border-radius:0 8px 8px 0}
#exbtn[aria-pressed="true"]{background:var(--acc-f);color:var(--acc-t);font-weight:600}
.wedge-fig{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:4px 0 8px}
.wedge-svg{width:200px;max-width:200px;flex:none}
.wedge-svg .wdim{opacity:.45}
.wedge-svg path:not(.wdim){fill:var(--s)}
.wedge-rows{flex:1;min-width:240px;display:flex;flex-direction:column;gap:10px}
.wedge-row{display:flex;gap:8px;align-items:flex-start;font-size:15px;line-height:1.3}
.wedge-row .rdot{flex:none;display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--f);border:2px solid var(--s);margin-top:3px}
.wedge-k{font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
.wedge-hb,.wedge-en{font-size:13px;color:var(--muted)}
.card.cmini{padding:9px 12px;border-top-width:5px}
.card.cmini .t{font-size:17px}
.card.cmini .s{font-size:14px;margin-top:3px}
.card.cmini .en{font-size:13px}
.pvimg{display:block;width:100%;height:auto;border-radius:8px;background:#fff;border:1px solid var(--border);margin:6px 0 10px}
.pvtxt summary{cursor:pointer;font-size:13px;color:var(--muted);margin:6px 0}
.ilfig{margin:8px 0 14px}
.ilfig img{display:block;width:100%;height:auto;border-radius:8px;background:#fff;border:1px solid var(--border);margin-bottom:6px}
.ilfig figcaption{font-size:12.5px;color:var(--muted)}
.figbox{width:100%;height:100%;box-sizing:border-box;border:3px dashed var(--s);border-radius:18px;background:color-mix(in srgb,var(--f) 30%,transparent);padding:14px 20px;color:var(--text)}
.figbox-t{font-size:22px;font-weight:800;color:var(--t)}
.figbox-s{font-size:14px;color:var(--muted);margin-top:4px;line-height:1.3}
.card.cfix{height:118px;overflow:hidden}
.card.cfix .t{font-size:15px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card.cfix .en,.card.cfix .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.q{border:1px solid var(--border);border-radius:10px;margin:8px 0;background:var(--bg)}
details.q > summary{cursor:pointer;padding:9px 11px;list-style:none;font-size:14.5px}
details.q > summary::-webkit-details-marker{display:none}
details.q > summary .meta{display:block;font-size:12px;color:var(--muted);margin-top:3px}
details.q[open] > summary{border-bottom:1px solid var(--border)}
.qb{padding:8px 11px 11px}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:14px;margin:5px 0;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);cursor:pointer}
.opt:hover{border-color:var(--line)}
.opt.ok{border-color:#3B6D11;background:#EAF3DE;color:#173404}
.opt.bad{border-color:#A32D2D;background:#FCEBEB;color:#501313}
.opt .why{display:none;font-size:13px;margin-top:4px}
.done .opt .why{display:block}
.opt .why b{font-weight:700}
.qsrc{font-size:12px;color:var(--muted);margin-top:6px}
.react-flow__node.sel .card,.react-flow__node.sel .zas{outline:3px solid var(--s);outline-offset:3px}
.react-flow__node{cursor:pointer;transition:opacity .3s}
.react-flow__node.dim{opacity:.16}
.react-flow__edge{transition:opacity .3s}
.react-flow__edge.dim{opacity:.1}
.react-flow__node.sel .card{box-shadow:0 0 0 4px var(--s),0 12px 30px rgba(0,0,0,.25)}
.fnav{display:flex;align-items:center;gap:8px;margin:0 46px 8px 0;font-size:13px;color:var(--muted)}
.fnav button{font:inherit;font-size:13px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:4px 10px;cursor:pointer}
.fnav button:hover{border-color:var(--line)}
#side h2{font-size:26px !important;line-height:1.2}
@media (max-width:900px){#side{left:10px;right:10px;width:auto;top:auto;bottom:10px;transform:none;max-height:62%}}
.loading{padding:24px;color:var(--muted)}

/* węzły */
.card{width:100%;background:var(--surface);border:1px solid var(--border);border-top:6px solid var(--s);border-radius:12px;padding:12px 14px;color:var(--text);font-size:19px;line-height:1.35;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.card .t{font-weight:700;font-size:22px;color:var(--t);line-height:1.2}
.card .s{font-size:17px;color:var(--muted);margin-top:4px}
.card ul{margin:8px 0 0;padding-left:22px}
.card li{margin:3px 0}
.card li.hot{font-weight:700;color:var(--t);background:var(--f);border-radius:6px;padding:0 6px;margin-left:-6px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.pill{background:var(--f);color:var(--t);border-radius:999px;padding:2px 11px;font-size:17px;font-weight:600}
.zas{width:100%;background:var(--f);color:var(--t);border:2px solid var(--s);border-radius:14px;padding:10px 16px;text-align:center;font-size:20px}
.zas b{font-weight:700}
.stg{display:flex;align-items:center;gap:10px;font-weight:700;font-size:24px;color:var(--text);white-space:nowrap}
.stg .n{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:var(--s);color:var(--surface);font-size:20px}
.react-flow__edge-text{font-size:17px !important}
.react-flow__handle{opacity:0;width:6px;height:6px;min-width:0;min-height:0;border:0}
.react-flow__edge-textbg{fill:var(--bg)}
.react-flow__edge-text{fill:var(--muted);font-size:13px}
.react-flow__attribution{background:transparent}

main{max-width:800px;margin:0 auto;padding:16px 20px 64px}
main h2{font-size:20px;font-weight:600;margin:40px 0 12px}
.tbl{width:100%;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:top}
th{font-weight:600;color:var(--muted)}
tr:last-child td{border-bottom:0}
code{font-family:ui-monospace,Menlo,monospace;font-size:14px}
main ul{padding-left:20px}
main li{margin:6px 0}
.note{font-size:14px;color:var(--muted)}
</style>
</head>

torów COBIT 5 wymienia polityki wprost?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 27","FW-PL s. 67"],"r":"A","zap":"Polityka (każda) → aktywator Zasady, Polityki i Struktury ramowe.","scen":"","o":[{"t":"Informacja","ok":false,"w":"Polityka zapisana w dokumencie jest również informacją. Pytanie dotyczy jednak kategorii, której nazwa i opis wprost obejmują polityki (s. 27, 67)."},{"t":"Procesy","ok":false,"w":"Procesy realizują polityki, ale polityka należy do pierwszego aktywatora (s. 68)."},{"t":"Struktury organizacyjne","ok":false,"w":"Struktury mogą definiować polityki, ale same są jednostkami decyzyjnymi (s. 68, 75)."},{"t":"Zasady, Polityki i Struktury ramowe","ok":true,"w":"Polityki są częścią aktywatora Zasady, Polityki i Struktury ramowe (s. 67)."}]},"q-pc-en1-024":{"id":"q-pc-en1-024","typ":"egzamin","s":"EN-02-01","t":"Uzupełnij brakujące słowo: „Struktury ramowe powinny być [?], czyli obejmować wszystkie wymagane obszary”.","k":false,"st":"autorskie","src":"","z":["FW-PL s. 67"],"r":null,"zap":"Kompleksowa struktura ramowa obejmuje wszystkie wymagane obszary.","scen":"","o":[{"t":"kompleksowe","ok":true,"w":"Metodyki powinny być kompleksowe – obejmować wszystkie wymagane obszary (s. 67)."},{"t":"aktualne","ok":false,"w":"Aktualne = odzwierciedlające obecne ukierunkowanie i cele; to inna cecha (s. 67)."},{"t":"dostępne","ok":false,"w":"Dostępne = dla wszystkich interesariuszy; to inna cecha (s. 67)."},{"t":"nieinwazyjne","ok":false,"w":"To cecha dobrej polityki, nie struktury ramowej (s. 67)."}]},"q-pc-en1-025":{"id":"q-pc-en1-025","typ":"egzamin","s":"EN-02-02","t":"Jaką funkcję przypisuje definicja politykom jako bardziej szczegółowym wytycznym względem zasad?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 67"],"r":null,"zap":"Zasady = wartości; polityki = szczegółowe wytyczne stosowania zasad.","scen":"","o":[{"t":"Wyrażają podstawowe wartości organizacji","ok":false,"w":"Polityki także mogą odzwierciedlać wartości. Podstawowe wartości są ch ograniczona liczba","ok":false,"w":"To kryterium zasad (s. 67)."},{"t":"Wyrażają podstawowe wartości","ok":false,"w":"To kryterium zasad (s. 67)."}]},"q-pc-en1-035":{"id":"q-pc-en1-035","typ":"egzamin","s":"EN-02-02","t":"Który zapis starostwa jest polityką?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 67"],"r":null,"zap":"Konkrety (kto, kiedy, jak) = polityka; wartość = zasada.","scen":"","o":[{"t":"Nowe uprawnienia do dokumentów zatwierdza właściciel informacji; wyjątki rozpatruje wskazana rola.","ok":true,"w":"To przykład autorskiej polityki: konkretne wytyczne określające postępowanie i odpowiedzialność. COBIT 5 nie nakazuje tego konkretnego rozwiązania (s. 67)."},{"t":"Szanujemy czas mieszkańców","ok":false,"w":"Krótkie zdanie o wartościach – zasada (s. 67)."},{"t":"Działamy uczciwie i przejrzyście","ok":false,"w":"Krótkie zdanie o wartościach – zasada (s. 67)."},{"t":"Chronimy dane jak własne","ok":false,"w":"Krótkie zdanie o wartościach – zasada (s. 67)."}]},"q-pc-en1-038":{"id":"q-pc-en1-038","typ":"egzamin","s":"EN-02-03","t":"Co oznacza, że dobra polityka jest wydajna?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 67"],"r":null,"zap":"Wydajność polityki: wdrożenie w sposób najbardziej efektywny z punktu widzenia zasobów, przy osiąganiu zamierzonego wyniku (FW-PL s. 67).","scen":"","o":[{"t":"Odzwierciedla aktualne cele organizacji","ok":false,"w":"Aktualność to cecha struktur ramowych (s. 67)."},{"t":"Zapewnia wdrożenie zasad w najbardziej wydajny sposób","ok":true,"w":"Wydajność odnosi się do zasobów potrzebnych do wdrożenia polityki. Nie sprowadza się do obniżania kosztów pieniężnych niezależnie od wyniku (s. 67)."},{"t":"Wydaje się logiczna jej odbiorcom","ok":false,"w":"To opis polityki NIEINWAZYJNEJ (s. 67)."},{"t":"Umożliwia osiągnięcie wskazanego celu","ok":false,"w":"To opis polityki SKUTECZNEJ (s. 67)."}]},"q-pc-en1-041":{"id":"q-pc-en1-041","typ":"egzamin","s":"EN-02-03","t":"W której liście cech podręcznik umieszcza „ograniczoną liczbę” elementów?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 67"],"r":"A","zap":"Ograniczoną liczbę wymieniono przy zasadach. Przy politykach: skuteczność, wydajność i nieinwazyjność.","scen":"","o":[{"t":"W wymaganiach wobec struktur ramowych","ok":false,"w":"Struktury ramowe mają być kompleksowe, otwarte, aktualne i dostępne (s. 67)."},{"t":"Jako czwartą główną cechę dobrych polityk","ok":false,"w":"COBIT 5 podaje trzy cechy dobrych polityk (s. 67)."},{"t":"W kryteriach dobrych zasad","ok":true,"w":"FW-PL s. 67 wymienia ograniczoną liczbę zasad. Nie ustanawia przez to zakazu racjonalizowania liczby polityk w organizacji."},{"t":"W wymaganiach dotyczących procedur eskalacji","ok":false,"w":"Procedury eskalacji to dobra praktyka struktur organizacyjnych (s. 75)."}]},"q-pc-en1-042":{"id":"q-pc-en1-042","typ":"egzamin","s":"EN-02-03","t":"Którą trójką cech COBIT 5 opisuje dobre polityki?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 67"],"r":null,"zap":"Polityki: skuteczne, wydajne, nieinwazyjne.","scen":"","o":[{"t":"Specyficzne, mierzalne, terminowe","ok":false,"w":"To kryteria SMART dla mierników (s. 69)."},{"t":"Kompleksowe, otwarte, aktualne","ok":false,"w":"To cechy struktur ramowych (s. 67)."},{"t":"Skuteczne, wydajne, nieinwazyjne","ok":true,"w":"Dobre polityki są skuteczne, wydajne i nieinwazyjne (s. 67)."},{"t":"Nieliczne, proste, precyzyjne","ok":false,"w":"To kryteria zasad (s. 67)."}]},"q-pc-en1-046":{"id":"q-pc-en1-046","typ":"egzamin","s":"EN-02-03","t":"Która cecha dobrej polityki dotyczy osiągnięcia jej celu?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 67"],"r":null,"zap":"Osiąga cel = skuteczna.","scen":"","o":[{"t":"Nieinwazyjna","ok":false,"w":"Nieinwazyjność dotyczy odbioru przez pracowników (s. 67)."},{"t":"Wydajna","ok":false,"w":"Wydajność dotyczy sposobu wdrożenia zasad (s. 67)."},{"t":"Skuteczna","ok":true,"w":"Skuteczna polityka umożliwia osiągnięcie wskazanego celu (s. 67)."},{"t":"Kompleksowa","ok":false,"w":"Kompleksowość to cecha struktur ramowych (s. 67)."}]},"q-pc-en1-048":{"id":"q-pc-en1-048","typ":"egzamin","s":"EN-02-03","t":"Uzupełnij brakujące słowo: „Dobra polityka nie budzi niepotrzebnego [?] u osób, które muszą jej przestrzegać”.","k":false,"st":"autorskie","src":"","z":["FW-PL s. 67"],"r":"B","zap":"Nieinwazyjna polityka nie budzi niepotrzebnego oporu.","scen":"","o":[{"t":"oporu","ok":true,"w":"Nieinwazyjne polityki nie budzą niepotrzebnego oporu (s. 67)."},{"t":"kosztu","ok":false,"w":"Koszt dotyczy wydajności, a zdanie opisuje nieinwazyjność (s. 67)."},{"t":"ryzyka","ok":false,"w":"Zdanie dotyczy reakcji odbiorców polityki (s. 67)."},{"t":"sprzeciwu regulatora","ok":false,"w":"Chodzi o osoby przestrzegające polityki, nie o regulatora (s. 67)."}]},"q-pc-en1-049":{"id":"q-pc-en1-049","typ":"egzamin","s":"EN-02-04","t":"Uzupełnij brakujące słowo: „Cykl życia polityk musi wspierać realizację zdefiniowanych [?]”.","k":false,"st":"autorskie","src":"","z":["FW-PL s. 68"],"r":null,"zap":"Cykl życia polityk wspiera realizację zdefiniowanych celów.","scen":"","o":[{"t":"celów","ok":true,"w":"Polityki mają cykl życia, który musi wspierać realizację zdefiniowanych celów (s. 68)."},{"t":"budżetów","ok":false,"w":"Budżety mogą wpływać na tworzenie i utrzymanie polityk. W przytoczonym zdaniu o cyklu życia chodzi jednak o cykl życia organizacji i jej cele (s. 68)."},{"t":"procesów","ok":false,"w":"Procesy realizują polityki; zdanie mówi o celach (s. 68)."},{"t":"ról","ok":false,"w":"Role uczestniczą w cyklu życia polityk. Nie są jednak wyrazem uzupełniającym cytowany opis powiązania z cyklem życia i celami organizacji (s. 68)."}]},"q-pc-en1-050":{"id":"q-pc-en1-050","typ":"egzamin","s":"EN-02-04","t":"Szpital zastąpił politykę nową wersją. Co zrobić ze starą według COBIT 5?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 68"],"r":"A","zap":"Stare polityki: archiwizować i wycofywać; dostępna ma być najnowsza.","scen":"","o":[{"t":"Właściwie ją zarchiwizować i wycofać","ok":true,"w":"Kluczowa jest aktualność: dostęp do najnowszej wersji oraz archiwizacja i pozbywanie się nieaktualnych (s. 68)."},{"t":"Pozostawić dwie nieoznaczone wersje jako równocześnie obowiązujące","ok":false,"w":"Należy jednoznacznie oznaczyć wersję aktualną. Zachowanie poprzedniej wersji w oznaczonym archiwum może być zasadne; dwie sprzeczne wersje obowiązujące równocześnie wprowadzają niejasność (s. 68)."},{"t":"Przekształcić ją w zasadę organizacji","ok":false,"w":"Zasady to podstawowe wartości, nie stare polityki (s. 67)."},{"t":"Przekazać ją do oceny zdolności procesu","ok":false,"w":"Polityka może być dowodem w ocenie procesu. Sama ocena nie zastępuje jednak jej aktualizacji, wycofania lub oznaczenia wersji (s. 68)."}]},"q-pc-en1-051":{"id":"q-pc-en1-051","typ":"egzamin","s":"EN-02-04","t":"Co zapewnia struktura ramowa polityk w ich cyklu życia?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 68"],"r":null,"zap":"Struktura ramowa polityki = spójny zbiór polityk, łatwy w nawigacji.","scen":"","o":[{"t":"Decyzje podejmowane przez komitety","ok":false,"w":"Decyzje komitetów mogą prowadzić do zmiany polityk. Opis struktury ramowej polityk podkreśla jednak utworzenie i utrzymanie ich spójnego zbioru (s. 68)."},{"t":"Wejścia dla procesów domeny MEA","ok":false,"w":"Informacje o politykach mogą zasilać procesy MEA. Nie jest to jednak podstawowa rola struktury ramowej wskazana w tym fragmencie (s. 68)."},{"t":"Strukturę do tworzenia i utrzymania spójnego zbioru polityk","ok":true,"w":"Metodyka dotycząca polityk zapewnia strukturę do utworzenia i utrzymania spójnego zbioru polityk (s. 68)."},{"t":"Ograniczoną liczbę wartości organizacji","ok":false,"w":"To kryterium zasad (s. 67)."}]},"q-pc-en1-052":{"id":"q-pc-en1-052","typ":"egzamin","s":"EN-02-04","t":"Jak często według dobrej praktyki należy aktualizować polityki?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 68"],"r":"B","zap":"Polityki przegląda i aktualizuje się regularnie.","scen":"","o":[{"t":"Tylko po poważnym incydencie","ok":false,"w":"Aktualizacja ma być regularna, nie tylko reaktywna (s. 68)."},{"t":"W regularnych odstępach czasu","ok":true,"w":"Polityki muszą być przedłużane i/lub aktualizowane w regularnych odstępach (s. 68)."},{"t":"Wyłącznie na żądanie regulatora","ok":false,"w":"Wymóg regularności nie zależy od regulatora (s. 68)."},{"t":"Jednorazowo – przy zatwierdzeniu","ok":false,"w":"Polityki mają cykl życia; aktualizuje się je regularnie (s. 68)."}]},"q-pc-en1-053":{"id":"q-pc-en1-053","typ":"egzamin","s":"EN-02-04","t":"Która faza cyklu życia polityki następuje po użytkowaniu/eksploatacji?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 67"],"r":null,"zap":"Po użytkowaniu: ocena/monitorowanie, potem aktualizacja/pozbywanie się.","scen":"","o":[{"t":"Projektowanie","ok":false,"w":"Projektowanie jest przed budowaniem i użytkowaniem (s. 67)."},{"t":"Planowanie","ok":false,"w":"Planowanie otwiera cykl życia (s. 67)."},{"t":"Ocena/monitorowanie","ok":true,"w":"Cykl życia (Rysunek 28): planowanie, projektowanie, budowanie, użytkowanie, ocena/monitorowanie, aktualizacja/pozbywanie się (s. 67)."},{"t":"Budowanie/nabywanie/tworzenie/wdrażanie","ok":false,"w":"Budowanie poprzedza użytkowanie (s. 67)."}]},"q-pc-en1-054":{"id":"q-pc-en1-054","typ":"egzamin","s":"EN-02-05","t":"Uzupełnij brakujące słowa: „Struktura polityk opisuje m.in. zakres i ważność oraz konsekwencje [?]”.","k":false,"st":"autorskie","src":"","z":["FW-PL s. 68"],"r":"B","zap":"Struktura polityk: zakres i ważność, konsekwencje, wyjątki, zgodność.","scen":"","o":[{"t":"decyzji zarządu","ok":false,"w":"Nie ma takiego elementu w strukturze polityk (s. 68)."},{"t":"braku zgodności z polityką","ok":true,"w":"Struktura polityk opisuje: zakres i ważność, konsekwencje nieprzestrzegania, obsługę wyjątków, kontrolę i pomiar zgodności (s. 68)."},{"t":"oceny zdolności całego procesu","ok":false,"w":"Ocena zdolności dotyczy procesów (s. 71)."},{"t":"wdrożenia procesu","ok":false,"w":"Nie ma takiego elementu w strukturze polityk (s. 68)."}]},"q-pc-en1-055":{"id":"q-pc-en1-055","typ":"egzamin","s":"EN-02-05","t":"Gmina przyjęła politykę, ale nikt nie sprawdza jej przestrzegania. Którego elementu brakuje?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 68"],"r":"A","zap":"Sprawdzanie przestrzegania = kontrola i pomiar zgodności.","scen":"","o":[{"t":"Kontroli i pomiaru zgodności","ok":true,"w":"Struktura polityk musi opisywać sposób kontroli i pomiaru zgodności z polityką (s. 68)."},{"t":"Zakresu i ważności","ok":false,"w":"Zakres mówi, kogo i czego polityka dotyczy – nie o sprawdzaniu (s. 68)."},{"t":"Nieinwazyjności","ok":false,"w":"To cecha dobrej polityki, nie element jej struktury (s. 67)."},{"t":"Obsługi wyjątków","ok":false,"w":"Wyjątki to sytuacje, gdy polityki nie da się zastosować – tu problem to brak kontroli (s. 68)."}]},"q-pc-en1-056":{"id":"q-pc-en1-056","typ":"egzamin","s":"EN-02-05","t":"Które dopasowanie tekst podręcznika wskazuje wprost wśród dobrych praktyk polityk?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 68"],"r":null,"zap":"Polityki dopasowane do apetytu na ryzyko.","scen":"","o":[{"t":"Do liczby interesariuszy zewnętrznych","ok":false,"w":"Skład interesariuszy wpływa na kontekst, ale w tej praktyce podręcznik wskazuje dopasowanie polityk do apetytu na ryzyko (s. 68)."},{"t":"Do apetytu na ryzyko organizacji","ok":true,"w":"Polityki powinny być dopasowane do apetytu na ryzyko (s. 68)."},{"t":"Do wysokości budżetu IT","ok":false,"w":"Budżet jest uwarunkowaniem wdrożenia polityki. W tym fragmencie wskazano jednak wprost dopasowanie do apetytu na ryzyko (s. 68)."},{"t":"Do poziomu zdolności procesów","ok":false,"w":"Stan zdolności procesu może wpływać na sposób wdrożenia polityki. Nie jest jednak wymienionym w tym punkcie dopasowaniem do apetytu na ryzyko (s. 68)."}]},"q-pc-en1-057":{"id":"q-pc-en1-057","typ":"egzamin","s":"EN-02-05","t":"Gdzie według dobrej praktyki powinna mieć miejsce każda polityka?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 68"],"r":null,"zap":"Każda polityka ma miejsce w hierarchicznej strukturze ramowej.","scen":"","o":[{"t":"W hierarchicznej strukturze ramowej Ładu i Zarządzania","ok":true,"w":"Polityki powinny być częścią ogólnej (hierarchicznej) metodyki nadzoru i zarządzania (s. 68)."},{"t":"W mandacie komitetu sterującego","ok":false,"w":"Mandat określa cel istnienia struktury (s. 75)."},{"t":"W katalogu usług IT","ok":false,"w":"Katalog usług opisuje usługi IT (s. 93)."},{"t":"W diagramie RACI procesu","ok":false,"w":"RACI opisuje role w praktykach procesu (s. 69)."}]},"q-pc-en1-058":{"id":"q-pc-en1-058","typ":"egzamin","s":"EN-02-05","t":"Do czego powinna wyraźnie odnosić się każda polityka?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 68"],"r":null,"zap":"Każda polityka odnosi się do podstawowych zasad.","scen":"","o":[{"t":"Do wskaźników opóźnionych","ok":false,"w":"Wskaźniki opóźnione mierzą osiągnięcie celów (s. 29)."},{"t":"Do diagramu RACI","ok":false,"w":"RACI opisuje role w procesie (s. 69)."},{"t":"Do podstawowych zasad","ok":true,"w":"Każda polityka powinna wyraźnie odnosić się do podstawowych zasad (s. 68)."},{"t":"Do procedur eskalacji","ok":false,"w":"Eskalacja to dobra praktyka struktur organizacyjnych (s. 75)."}]},"q-pc-en1-060":{"id":"q-pc-en1-060","typ":"egzamin","s":"EN-02-06","t":"Uzupełnij brakujące słowo: „Praktyki i działania procesów są najistotniejszym [?] realizacji polityk”.","k":false,"st":"autorskie","src":"","z":["FW-PL s. 68"],"r":null,"zap":"Procesy (praktyki i działania) = środek realizacji polityk.","scen":"","o":[{"t":"środkiem","ok":true,"w":"Praktyki i działania procesów są najistotniejszym środkiem realizacji polityk (s. 68)."},{"t":"celem","ok":false,"w":"Procesy realizują polityki – nie są ich celem (s. 68)."},{"t":"wynikiem","ok":false,"w":"Praktyki mogą powstawać lub zmieniać się pod wpływem polityk. W cytowanym zdaniu rozpoznajemy jednak ich rolę jako środka realizacji polityk, a nie wyniku (s. 68)."  79)."},{"t":"regulacje","ok":false,"w":"Regulacje mogą wpływać na organizację i jej wartości. Cytowana definicja etyki organizacyjnej wskazuje jednak wartości, które mają stanowić podstawę jej funkcjonowania (s. 79)."},{"t":"procedury","ok":false,"w":"Procedury mogą wzmacniać zachowania i odzwierciedlać wartości. W tej definicji podstawę etyki stanowią jednak wartości (s. 79)."},{"t":"zasoby","ok":false,"w":"Zasoby nie są w definicji etyki organizacji (s. 79)."}]},"q-pc-en2-036":{"id":"q-pc-en2-036","typ":"egzamin","s":"EN-02-15","t":"Od czego według COBIT 5 zaczyna się zmiana kultury w organizacji?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 79"],"r":null,"zap":"Cykl życia kultury: od istniejącej kultury → zidentyfikuj zmiany → wdroż.","scen":"","o":[{"t":"Od zatrudnienia nowej kadry kierowniczej","ok":false,"w":"Podręcznik nie wskazuje wymiany kadry jako punktu wyjścia (s. 79)."},{"t":"Od istniejącej kultury i potrzebnych zmian","ok":true,"w":"Zaczynając od istniejącej kultury, organizacja identyfikuje wymagane zmiany i dba o ich wdrożenie (s. 79)."},{"t":"Od napisania nowego kodeksu etyki","ok":false,"w":"Cykl życia zaczyna się od istniejącej kultury, nie od dokumentu (s. 79)."},{"t":"Od zakupu narzędzi do monitorowania pracowników","ok":false,"w":"Tego nie ma w opisie cyklu życia (s. 79)."}]},"q-pc-en2-042":{"id":"q-pc-en2-042","typ":"egzamin","s":"EN-02-16","t":"Które zdanie o powiązaniach aktywatora Kultura, Etyka i Zachowanie NIE jest zgodne z COBIT 5?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 75","FW-PL s. 80","FW-PL s. 88"],"r":null,"zap":"Proces bez właściwego zachowania nie daje wyników.","scen":"","o":[{"t":"Reguły i normy są powiązane z zasadami i politykami","ok":false,"w":"Zgodne z COBIT 5 (s. 80)."},{"t":"Umiejętności behawioralne wpływają na zachowanie pracowników","ok":false,"w":"Zgodne z COBIT 5 (s. 88)."},{"t":"Dobry proces daje wyniki bez względu na zachowania","ok":true,"w":"Odwrotnie: bez właściwego zachowania wyniki procesu const WYN_KEY='cobit-schemat-wyniki', WYN_COOKIE='cobitWyniki';
function wynLoad(){ let o={};
  try{ const v=localStorage.getItem(WYN_KEY); if(v) o=JSON.parse(v)||{}; }catch(_){}
  try{ const m=document.cookie.match(new RegExp('(?:^|; )'+WYN_COOKIE+'=([^;]*)')); if(m){ const c=JSON.parse(decodeURIComponent(m[1]))||{}; Object.entries(c).forEach(([k,v])=>{ if(!o[k]||(v.t||0)>(o[k].t||0)) o[k]=v; }); } }catch(_){}
  return o; }
let WYN=wynLoad();
function wynSave(){
  try{ localStorage.setItem(WYN_KEY,JSON.stringify(WYN)); }catch(_){}
  try{ const ent=Object.entries(WYN).sort((a,b)=>(b[1].t||0)-(a[1].t||0)), o={};
    for(const [k,v] of ent){ o[k]=v; if(encodeURIComponent(JSON.stringify(o)).length>3800){ delete o[k]; break; } }
    document.cookie=WYN_COOKIE+'='+encodeURIComponent(JSON.stringify(o))+';max-age=31536000;path=/;SameSite=Lax'; }catch(_){}
}

/* wycinek koła dla fazy: ta sama geometria co Ilustracja 17, podświetlona tylko faza n */
function wedgeHTML(n){
  const C=110, rings=[[104,80,'g-amber'],[80,56,'g-teal'],[56,32,'g-purple']];
  const pt=(r,a)=>[(C+r*Math.cos(a)).toFixed(1),(C+r*Math.sin(a)).toFixed(1)];
  let svg='<svg class="cykl-svg wedge-svg" viewBox="0 0 220 220" role="img" aria-label="Faza '+n+' w trzech kręgach">';
  rings.forEach(([R,r,g])=>{ svg+='<g class="'+g+'">';
    for(let i=0;i<7;i++){ const a0=-Math.PI/2+i*2*Math.PI/7+0.015, a1=-Math.PI/2+(i+1)*2*Math.PI/7-0.015;
      const [x0,y0]=pt(R,a0),[x1,y1]=pt(R,a1),[x2,y2]=pt(r,a1),[x3,y3]=pt(r,a0);
      svg+='<path'+(i===n-1?'':' class="wdim"')+' d="M'+x0+' '+y0+'A'+R+' '+R+' 0 0 1 '+x1+' '+y1+'L'+x2+' '+y2+'A'+r+' '+r+' 0 0 0 '+x3+' '+y3+'Z"/>'; }
    svg+='</g>'; });
  svg+='<circle cx="110" cy="110" r="30" class="core"/><text x="110" y="110" text-anchor="middle" dominant-baseline="central" class="core-t">'+n+'</text></svg>';
  const f=FAZY3[n-1];
  const rows=f.r.map((x,j)=>'<div class="wedge-row '+RINGS[j].g+'"><span class="rdot"></span><div><div class="wedge-k">'+esc(['krąg zewnętrzny','krąg środkowy','krąg wewnętrzny'][j])+' · '+esc(RINGS[j].ex)+'</div>'+
    '<b>'+esc(x[1]||x[0])+'</b>'+(x[1]&&x[1]!==x[0]?'<div class="wedge-hb">podręcznik: '+esc(x[0])+'</div>':'')+'<div class="wedge-en"><em>'+esc(x[2])+'</em></div></div></div>').join('');
  return '<h3>Wycinek koła: faza '+n+' w trzech kręgach (Rysunek 17)</h3><div class="wedge-fig">'+svg+'<div class="wedge-rows">'+rows+'</div></div>';
}

/* strony podręcznika przypięte do kafelka: wszystkie „s. N” / „s. N–M” z opisu kafelka + strony jego ilustracji */
function pagesOf(id){
  const d=INFO[id]||{}, I=window.ILU, set=new Set();
  const txt=[d.from,d.trap].concat(d.refs||[],d.traps||[],(d.tables||[]).map(t=>t.note||'')).join(' ');
  txt.replace(/(?<![\wąćęłńóśźżĄĆĘŁŃÓŚŹŻ])s\.\s?(\d{1,2})(?:\s?[–-]\s?(\d{1,2}))?/g,(m,a,b)=>{ a=+a; b=b?+b:a; if(b<a||b-a>8) b=a; for(let p=a;p<=b;p++) if(p>=1&&p<=94) set.add(p); return m; });
  txt.replace(/Ilustracj\w*\s(\d{1,2})/g,(m,n)=>{ const f=I&&I.figs[n]; if(f) f.s.forEach(p=>set.add(p)); return m; });
  (FIGS[id]||[]).forEach(n=>{ const f=I&&I.figs[String(n)]; if(f) f.s.forEach(p=>set.add(p)); });
  (PAGES_X[id]||[]).forEach(p=>set.add(p));
  return [...set].sort((x,y)=>x-y);
}
function pagesHTML(id){
  const P=pagesOf(id);
  if(!P.length) return '<p class="note2">Ten kafelek nie ma jeszcze przypiętych stron podręcznika.</p>';
  return '<p class="note2">Strony z Twojego egzemplarza (PDF, tylko lokalnie). Kliknij numer, żeby otworzyć stronę w panelu z nawigacją.</p>'+
    P.map(p=>'<figure class="ilfig"><img loading="lazy" alt="Strona '+p+' podręcznika" src="'+ILU_DIR+'strona-'+String(p).padStart(3,'0')+'.jpg">'+
      '<figcaption><button type="button" class="pref" data-p="'+p+'">FW-PL s. '+p+'</button></figcaption></figure>').join('');
}
function openPage(n){
  const T=window.FWPL;
  const max=T?Math.max(...Object.keys(T).map(Number)):94;
  n=Math.max(1,Math.min(max,n));
  pv.innerHTML='<button class="x" type="button" aria-label="Zamknij (Esc)">✕</button>'+
    '<div class="fnav"><button type="button" class="pp">◀ s. '+(n-1)+'</button><button type="button" class="pn">s. '+(n+1)+' ▶</button></div>'+
    '<h2>Podręcznik COBIT 5 PL · strona '+n+'</h2>'+
    '<img class="pvimg" alt="Strona '+n+' podręcznika COBIT 5 PL" src="'+ILU_DIR+'strona-'+String(n).padStart(3,'0')+'.jpg">'+
    '<p class="note2 pvmiss" hidden>Brak obrazu strony (lokalny katalog app/podrecznik/ilustracje/). Poniżej tekst wyciągnięty z PDF.</p>'+
    '<details class="pvtxt"><summary>Tekst strony (wyciąg z PDF, do wyszukiwania i kopiowania)</summary>'+
    (T&&T[n]!=null?'<pre class="pvt">'+esc(T[n])+'</pre>':'<p class="trap">Brak lokalnego tekstu podręcznika. Uruchom w katalogu projektu: <code>python3 notatki/generuj-tekst-podrecznika.py</code></p>')+'</details>'+
    '<p class="note2">Strona z Twojego egzemplarza (PDF, tylko lokalnie, poza gitem).</p>';
  pv.hidden=false; pv.scrollTop=0;
  { const im=pv.querySelector('.pvimg'); im.onerror=()=>{ im.remove(); pv.querySelector('.pvmiss').hidden=false; const d=pv.querySelector('.pvtxt'); if(d) d.open=true; }; }
  pv.querySelector('.x').onclick=closePage;
  pv.querySelector('.pp').onclick=()=>openPage(n-1);
  pv.querySelector('.pn').onclick=()=>openPage(n+1);
}
function closePage(){ pv.hidden=true; pv.innerHTML=''; }
document.addEventListener('click',e=>{ const b=e.target.closest&&e.target.closest('.pref'); if(b){ e.preventDefault(); e.stopPropagation(); openPage(+b.dataset.p); } },true);
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!pv.hidden){ closePage(); e.stopImmediatePropagation(); } },true);

/* ---------- aplikacja ---------- */
let RF=null;
const NEIGH={};
function fitAll(d=300){ if(!RF) return; const b=RF.getNodesBounds(RF.getNodes()); b.height+=260; RF.fitBounds(b,{padding:0.04,duration:d}); }
/* Widok zmieniamy tylko po nawigacji użytkownika. Zamknięcie panelu,
   zmiana rozmiaru okna i zakończenie ładowania nie dopasowują całej mapy. */
const VIEW_KEY='cobit-schemat-widok-v1';
function initialViewport(){ return {x:28,y:24,zoom:document.getElementById('app').clientWidth<520?0.8:0.9}; }
function readViewport(){
  try{ const v=JSON.parse(localStorage.getItem(VIEW_KEY)||'null');
    if(v&&[v.x,v.y,v.zoom].every(Number.isFinite)&&v.zoom>=0.03&&v.zoom<=2) return {x:v.x,y:v.y,zoom:v.zoom};
  }catch(_){} return null;
}
function saveViewport(v){ try{localStorage.setItem(VIEW_KEY,JSON.stringify({x:v.x,y:v.y,zoom:v.zoom}));}catch(_){} }
function focusOn(id){
  if(!RF) return;
  const el=document.getElementById('app'), W=el.clientWidth, H=el.clientHeight;
  const nid=id, n=RF.getNode(nid); if(!n) return;
  const w=(n.measured&&n.measured.width)||n.width||300, hh=(n.measured&&n.measured.height)||n.height||100;
  const cy=n.position.y+hh/2;
  if(w>1000){ const z=0.62; RF.setCenter(n.position.x+(W/2-30)/z, cy+(W<900?(H*0.28)/z:0), {zoom:z,duration:450}); return; }
  const z=Math.min(1.25, (W*0.36)/Math.max(w,1));
  const cx=n.position.x+w/2;
  if(W<900) RF.setCenter(cx, cy+(H*0.28)/z, {zoom:z,duration:450});
  else RF.setCenter(cx+(W*0.30)/z, cy, {zoom:z,duration:450});
}
function getTheme(){ try{ return localStorage.getItem(KEY)||'system'; }catch(_){ return 'system'; } }
function App(){
  const [theme,setTheme] = React.useState(getTheme());
  React.useEffect(()=>{
    if(theme==='light'||theme==='dark') root.setAttribute('data-theme',theme); else root.removeAttribute('data-theme');
    document.querySelectorAll('.theme button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.t===theme)));
    try{ localStorage.setItem(KEY,theme); }catch(_){}
  },[theme]);
  React.useEffect(()=>{
    const bs=[...document.querySelectorAll('.theme button')];
    const fns=bs.map(b=>{const f=()=>setTheme(b.dataset.t);b.addEventListener('click',f);return f;});
    return ()=>bs.forEach((b,i)=>b.removeEventListener('click',fns[i]));
  },[]);
  const [sel,setSel] = React.useState(null);
  React.useEffect(()=>{
    const f=(ev)=>setSel(ev.detail);
    window.addEventListener('cobit-sel',f);
    return ()=>window.removeEventListener('cobit-sel',f);
  },[]);
  React.useEffect(()=>{
    window.__sel=sel;
    if(sel){ showInfo(sel); focusOn(sel); }
    else clearInfo();
  },[sel]);
  React.useEffect(()=>{
    const k=(e)=>{
      if(e.target && (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.closest('.bar'))) return;
      if(e.key==='Escape') setSel(null);
      else if(e.key==='ArrowRight') setSel(s=>s?step(s,1):s);
      else if(e.key==='ArrowLeft') setSel(s=>s?step(s,-1):s);
    };
    window.addEventListener('keydown',k); return ()=>window.removeEventListener('keydown',k);
  },[]);
  const live = sel ? (NEIGH[sel]||[sel]) : null;
  const [startViewport] = React.useState(()=>readViewport()||initialViewport());
  const viewNodes = React.useMemo(()=>nodes.map(n=>!sel?n:{...n,className:live.includes(n.id)?'sel':'dim'}),[sel]);
  const viewEdges = React.useMemo(()=>edges.map(x=>{
    let y=x;
    if(x.id==='e17') y={...x,style:{...x.style,stroke:sel==='petla'?'#BA7517':'#6f6e69',strokeWidth:sel==='petla'?3.4:2.4},interactionWidth:24};
    if(sel){ const on = (x.source===sel||x.target===sel); y={...y,className:on?'':'dim'}; }
    return y;
  }),[sel]);
  return h(ReactFlow,{
    nodes:viewNodes, edges:viewEdges, nodeTypes,
    onNodeClick:(_,n)=>{ if(INFO[n.id]) setSel(n.id); },
    onEdgeClick:(_,ed)=>{ if(ed.id==='e17') setSel('petla'); },
    onPaneClick:()=>setSel(null),
    colorMode: theme,
    defaultViewport:startViewport,
    onMoveEnd:(_,viewport)=>saveViewport(viewport),
    onInit:(inst)=>{RF=inst;},
    minZoom:0.03, maxZoom:2,
    zoomOnScroll:false, panOnScroll:false, preventScrolling:false, zoomOnPinch:true,
    nodesConnectable:false, elementsSelectable:true,
    proOptions:{hideAttribution:true}
  },
    h(Background,{gap:24,size:1}),
    h(Controls,{showInteractive:false})
  );
}
createRoot(document.getElementById('app')).render(h(App));
window.SCHEMAT_EXAM.init({getResults:()=>WYN,refresh:()=>{if(window.__sel&&INFO[window.__sel])showInfo(window.__sel);},record:(u,i,ok)=>{const r=WYN[u]||{n:0,g:0};r.n++;r.g+=ok?1:0;r.ok=ok?1:0;r.i=i;r.t=Date.now();WYN[u]=r;wynSave();},jump:code=>{const nodes=(window.PYTANIA.plan.kody[code]||[]);const id=nodes.find(n=>INFO[n]);if(id)window.dispatchEvent(new CustomEvent('cobit-sel',{detail:id}));}});
