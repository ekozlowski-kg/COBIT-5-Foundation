iki procesu. | Proces nie działa albo nie osiąga celu; prawie nie ma dowodów, że cel jest osiągany regularnie.","ex":"Poziom 0: obiad nie wychodzi albo wychodzi przypadkiem. Poziom 1: goście regularnie dostają obiad, choć kuchnia działa „na żywioł”, bez planu. | Kuchnia, w której obiad czasem wychodzi, a czasem nie, i nikt nie umie pokazać, że wychodzi regularnie. Biały pas – dopiero start.","org":"jeśli PA 1.1 procesu DSS02 oceniono na W lub P (wg celu i wymaganych wyników procesu), a wymagania poziomu 2 nie są spełnione → poziom 1."},"cyt":{"s":"42","t":"0 Proces niekompletny — proces nie został wdrożony lub jego cel nie został osiągnięty. Na tym poziomie nie istnieją dowody systematycznej realizacji celu procesu lub ich liczba jest znikoma.","w":"ZGODNE"}},"fz-D-044":{"id":"fz-D-044","typ":"egzamin","s":"PC-01-01","t":"Co jest istotą poziomu 1 – Proces wykonywany?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42","PeopleCert Syllabus — PC-01-01"],"r":null,"zap":"","scen":"","o":[{"t":"Proces jest planowany, monitorowany i korygowany","ok":false,"w":"Planowanie należy już do poziomu 2."},{"t":"Proces osiąga swój cel; ocenia się jeden atrybut – PA 1.1","ok":true,"w":"Poziom 1 potwierdza osiąganie przeznaczenia procesu. Ocenia się jeden atrybut PA (Process Attribute — atrybut procesu) 1.1, który musi otrzymać W lub P. Dodatkowe wymagania zarządzania wykonaniem i produktami pracy należą do poziomu 2."},{"t":"Proces jest rozumiany ilościowo i trzymany w granicach","ok":false,"w":"To poziom 4."},{"t":"Proces działa według zdefiniowanego standardu","ok":false,"w":"To poziom 3."}],"fz":{"h":"Poziom 1 – Proces wykonywany","p":"P1","pulapka":false,"n":"EN: Level 1 Performed","q":"Co oznacza poziom 1 – Proces wykonywany? | Czym poziom 1 różni się od wyższych poziomów?","a":"Proces działa i osiąga swój cel (przeznaczenie). Ocenia się jeden atrybut: PA 1.1. Planowanie należy już do poziomu 2. | Ustala, czy proces w ogóle osiąga cel – to ważne osiągnięcie i fundament wyższych poziomów; wymaga co najmniej W na PA 1.1.","ex":"Goście regularnie dostają obiad – cel osiągnięty, nawet jeśli kucharze pracują bez grafiku i improwizują. Liczy się wynik, nie porządek. | Poziom 1 to najważniejsze pytanie: czy goście w ogóle dostają obiad? Bez tego porządek, receptury i pomiary nie mają sensu.","org":""},"cyt":{"s":"42","t":"1 Proces wykonywany (jeden atrybut) — cel wdrożonego procesu został osiągnięty.","w":"ZGODNE"}},"fz-D-045":{"id":"fz-D-045","typ":"egzamin","s":"PC-02-01","t":"Które stwierdzenie o docelowym poziomie zdolności procesów jest prawdziwe?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 43","PeopleCert Syllabus — PC-02-01"],"r":null,"zap":"","scen":"","o":[{"t":"Tylko poziom 5 jest zgodny z ISO/IEC 15504","ok":false,"w":"Zgodność z normą nie wymaga poziomu 5."},{"t":"Poziom docelowy zależy od kosztów, korzyści i wykonalności","ok":true,"w":"Organizacja wybiera poziom docelowy na podstawie kosztów, korzyści i wykonalności. Najwyższy poziom nie jest uniwersalnym celem; ambicją wielu organizacji jest poziom 1, bo już on potwierdza osiąganie przeznaczenia procesów."},{"t":"Poziom niższy niż 5 oznacza, że proces nie działa","ok":false,"w":"Już poziom 1 oznacza, że proces osiąga cel."},{"t":"Celem każdej organizacji zawsze jest poziom 3","ok":false,"w":"Nie ma jednego poziomu dla wszystkich; dobiera go organizacja."}],"fz":{"h":"Poziom docelowy","p":"P2","pulapka":false,"n":"egzamin: docelowy poziom zdolności · podr.: docelowy poziom potencjału · EN: target capability level","q":"Czy celem zawsze jest poziom 5? | Jaki poziom docelowy powinna wybrać organizacja?","a":"Nie. Poziom dobiera się do potrzeb, kosztów i wykonalności. | Własny, wg kosztów, korzyści i wykonalności – bardzo rzadko najwyższy. Ambicją wielu jest poziom 1 dla wszystkich procesów.","ex":"Nie każdy potrzebuje czarnego pasa: budka z kebabem nie musi gotować jak restauracja z gwiazdką Michelin. Cel dobiera się do potrzeb i budżetu. | Budka z kebabem nie potrzebuje gwiazdki Michelin. Wiele firm byłoby zadowolonych, gdyby każdy ich proces po prostu działał (poziom 1).","org":"DSS02: cel poziom 3."},"cyt":{"s":"43","t":"(na podstawie rachunku kosztów i korzyści oraz analizy wykonalności) poziom docelowy lub pożądany, który bardzo rzadko będzie jednym z najwyższych poziomów.","w":"ZGODNE","u":"Ambicja poziomu 1 dla wszystkich procesów – s. 45."}},"fz-D-046":{"id":"fz-D-046","typ":"egzamin","s":"PC-01-01","t":"Jak brzmią nazwy egzaminacyjne poziomów zdolności 2–5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42"],"r":null,"zap":"","scen":"","o":[{"t":"Powtarzalny, zdefiniowany, zarządzany i mierzalny, zoptymalizowany","ok":false,"w":"To nazwy z modelu dojrzałości COBIT 4.1."},{"t":"Wykonywany, zarządzany, ustanowiony, przewidywalny","ok":false,"w":"Wykonywany to poziom 1, nazwy przesunięto o jeden."},{"t":"Zarządzany, ustanowiony, przewidywalny, zoptymalizowany","ok":true,"w":"Haczyk Z-U-P-O, jak „zupa”."},{"t":"Zarządzany, przewidywalny, ustanowiony, zoptymalizowany","ok":false,"w":"Ustanowiony (3) jest przed przewidywalnym (4)."}],"fz":{"h":"Poziomy 2–5","p":"P1","pulapka":true,"n":"egzamin: zarządzany, ustanowiony, przewidywalny, zoptymalizowany · podr.: zarządzany, ustanowiony, przewidywalny, optymalizujący · EN: Managed, Established, Predictable, Optimising","q":"Nazwij poziomy 2–5. | Podaj sześć poziomów zdolności procesu (nazwy egzaminacyjne).","a":"2 zarządzany (planowany i pilnowany); 3 ustanowiony (zdefiniowany standard wdrożony w praktyce – sam dokument nie wystarczy); 4 przewidywalny (ilościowo rozumiany i trzymany w granicach – samo mierzenie nie wystarczy); 5 zoptymalizowany (podr.: optymalizujący; stale ulepszany). | 0 Proces niekompletny, 1 Proces wykonywany, 2 Proces zarządzany, 3 Proces ustanowiony, 4 Proces przewidywalny, 5 Proces zoptymalizowany (podr. optymalizujący).","ex":"Kuchnia: 2 – szef planuje i pilnuje; 3 – wspólny standard receptur jest ustalony i naprawdę stosowany przez wszystkich; 4 – kuchnia rozumie swoje wyniki liczbowo i utrzymuje je w ustalonych granicach; 5 – menu stale ulepszane. Haczyk: Z-U-P-O, jak „zupa”. | Haczyk: najpierw N i W (niekompletny, wykonywany), potem Z-U-P-O jak „zupa”: zarządzany, ustanowiony, przewidywalny, zoptymalizowany. Analogia nie zastępuje oceny atrybutów: każdy poziom wymaga też osiągnięcia niższych.","org":""},"cyt":{"s":"42","t":"5 Proces optymalizujący (dwa atrybuty) — opisany wcześniej proces przewidywalny jest nieustannie doskonalony","w":"ZGODNE","u":"Poziomy 2–4 (zarządzany, ustanowiony, przewidywalny) na tej samej stronie; FW: poziom 5 „optymalizujący”, „Zoptymalizowany” to w FW nazwa poziomu 5 dojrzałości COBIT 4.1."}},"fz-D-047":{"id":"fz-D-047","typ":"egzamin","s":"PC-02-02","t":"Kiedy korzysta się z Przewodnika Asesora?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 41","PeopleCert Syllabus — PC-02-02"],"r":null,"zap":"","scen":"","o":[{"t":"Do uproszczonej samooceny bez dowodów","ok":false,"w":"To Przewodnik Samooceny."},{"t":"Do opisu przeznaczenia i rezultatów procesów","ok":false,"w":"To rola Referencyjnego Modelu Procesu (PRM — Process Reference Model)."},{"t":"Do formalnej oceny opartej na dowodach","ok":true,"w":"Assessor Guide — Przewodnik Asesora — opisuje przeprowadzenie formalnej oceny procesów zgodnej z ISO, z użyciem modelu oceny. Wymaga kompetentnego, przeszkolonego zespołu i dowodów; osoba oceniająca może pochodzić z organizacji lub z zewnątrz."},{"t":"Do przygotowania uzasadnienia biznesowego","ok":false,"w":"Uzasadnienie biznesowe to element wdrożenia, a nie oceny."}],"fz":{"h":"Przewodnik Asesora","p":"P2","pulapka":false,"n":"egzamin: Przewodnik Asesora · inne tłumaczenie: przewodnik osoby oceniającej · EN: Assessor Guide","q":"Do czego służą Przewodnik Asesora i Przewodnik Samooceny?","a":"Assessor Guide — Przewodnik Asesora — opisuje przeprowadzenie formalnej oceny procesów z wykorzystaniem modelu oceny i dowodów. Prowadzi ją kompetentny zespół, wewnętrzny lub zewnętrzny. Self-assessment Guide — Przewodnik Samooceny — wspiera prostsze, orientacyjne rozpoznanie oparte w większej mierze na osądzie uczestników i może przygotować formalną ocenę.","ex":"Zespół najpierw orientacyjnie wskazuje mocne strony i luki. Następnie planuje formalną ocenę, zbiera i weryfikuje dowody zgodnie z właściwą procedurą. O rygorze nie rozstrzyga sama siedziba asesora.","org":"ocena zewnętrzna po 9 miesiącach."},"cyt":{"s":"43","t":"Więcej informacji na temat nowego programu COBIT Assessment Programme opartego na normie ISO/IEC 15504 można znaleźć na stronie www.isaca.org/cobit-assessment-programme.","w":"BRAK_W_FW","u":"FW-PL nie wymienia Przewodnika Asesora (Assessor Guide); pochodzi z sylabusa / COBIT Assessment Programme."}},"fz-D-048":{"id":"fz-D-048","typ":"egzamin","s":"PC-02-02","t":"Czym charakteryzuje się Przewodnik Samooceny?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 41","PeopleCert Syllabus — PC-02-02"],"r":null,"zap":"","scen":"","o":[{"t":"Wymaga zewnętrznej, przeszkolonej osoby oceniającej","ok":false,"w":"Przewodnik Samooceny nie wymaga zewnętrznej, przeszkolonej osoby oceniającej – organizacja ocenia się sama, w uproszczony sposób. Nawet formalna ocena według Przewodnika Asesora wymaga kompetentnego zespołu, który może być wewnętrzny lub zewnętrzny."},{"t":"Daje oficjalny wynik formalnej oceny","ok":false,"w":"Uproszczona samoocena daje orientacyjny wynik. Wymagania formalnej oceny i ewentualnego raportowania ustala się odrębnie; sam przewodnik nie nadaje certyfikacji."},{"t":"Pozwala organizacji ocenić się samodzielnie, w uproszczony sposób","ok":true,"w":"Self-assessment Guide — Przewodnik Samooceny — pozwala na prostsze rozpoznanie stanu procesów przez organizację. Wynik jest orientacyjny i może przygotować do formalnej oceny; sama wewnętrzność zespołu nie definiuje rygoru oceny."},{"t":"Zastępuje Model Oceny Procesu","ok":false,"w":"Przewodnik Samooceny wykorzystuje PAM (Process Assessment Model — Model Oceny Procesu) w uproszczonej ocenie; nie zastępuje go odrębnym modelem."}],"fz":{"h":"Przewodnik Samooceny","p":"P2","pulapka":false,"n":"egzamin: Przewodnik Samooceny · inne tłumaczenie: podręcznik samooceny · EN: Self-assessment Guide","q":"Do czego służy?","a":"Pozwala organizacji ocenić się samodzielnie, w uproszczony sposób.","ex":"Jak jazda próbna przed egzaminem: szef kuchni sam przechodzi listę pytań, bez formalnego zbierania dowodów, i dostaje wynik orientacyjny – często jako przygotowanie do oceny formalnej.","org":"ocena wewnętrzna w fazie 2."},"cyt":{"s":"43","t":"Więcej informacji na temat nowego programu COBIT Assessment Programme opartego na normie ISO/IEC 15504 można znaleźć na stronie www.isaca.org/cobit-assessment-programme.","w":"BRAK_W_FW","u":"FW-PL nie wymienia Przewodnika Samooceny (Self-assessment Guide); „narzędzia do samooceny” z s. 35 to zestaw narzędzi COBIT 5: Wdrożenie. Źródło: sylabus / COBIT Assessment Programme."}},"fz-D-049":{"id":"fz-D-049","typ":"egzamin","s":"PC-02-06","t":"Kiedy proces osiąga dany poziom zdolności od 1 do 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42","PeopleCert Syllabus — PC-02-06"],"r":null,"zap":"","scen":"","o":[{"t":"Atrybuty tego poziomu mają P, niższych – co najmniej W","ok":false,"w":"Warunki są tu odwrócone."},{"t":"Średnia ocen wszystkich atrybutów przekracza 50%","ok":false,"w":"Nie liczy się średniej – każdy atrybut ocenia się osobno."},{"t":"Co najmniej jeden atrybut tego poziomu ma C","ok":false,"w":"C to za mało; potrzebne jest co najmniej W."},{"t":"Atrybuty tego poziomu mają co najmniej W, niższych – P","ok":true,"w":"Na ocenianym poziomie od 1 do 5 każdy atrybut musi mieć co najmniej W — Większościowy. Wszystkie atrybuty niższych poziomów muszą mieć P — Pełny. Nie oblicza się średniej, która mogłaby zrekompensować słabszy atrybut."}],"fz":{"h":"Reguła osiągnięcia poziomu","p":"P1","pulapka":true,"n":"egzamin: zasada oceny · podr.: zasada oceny · EN: rating rule","q":"Jakie są warunki osiągnięcia poziomu zdolności od 1 do 5?","a":"Na ocenianym poziomie każdy atrybut musi mieć W — Większościowy (Largely achieved) lub P — Pełny (Fully achieved). Wszystkie atrybuty niższych poziomów muszą mieć P. Nie oblicza się średniej kompensującej słabszy atrybut. Do poziomu 1 wystarcza W lub P na PA 1.1. Poziom 0 nie ma własnego atrybutu.","ex":"Przykład: PA 1.1 = W, a PA 2.1 i PA 2.2 = P. Wynik to nadal poziom 1, ponieważ poziom 2 wymaga pełnego osiągnięcia PA 1.1.","org":"poziom 2: PA 2.1 i 2.2 ≥ W oraz PA 1.1 = P."},"cyt":{"s":"42","t":"poziom 3 potencjału procesu (proces ustanowiony) wymaga zdefiniowania procesu oraz osiągnięcia (w znacznym stopniu) atrybutów wdrożenia — oprócz pełnego osiągnięcia wszystkich atrybutów poziomu 2 potencjału procesu (proces zarządzany)","w":"ZGODNE","u":"FW podaje regułę na przykładzie poziomu 3; litery egzaminu W/P = L/F."}},"fz-D-051":{"id":"fz-D-051","typ":"egzamin","s":"PC-01-03","t":"Co oznacza litera P w skali ocen egzaminu PL?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 45","PeopleCert Syllabus — PC-01-03","ALTKOM"],"r":null,"zap":"","scen":"","o":[{"t":"Częściowy (EN: P – Partially achieved)","ok":false,"w":"Częściowy to po polsku C; angielskie P to nasze C."},{"t":"Pełny (EN: F – Fully achieved)","ok":true,"w":"Polskie P oznacza Pełny i odpowiada angielskiemu F — Fully achieved. Angielskie P — Partially achieved — odpowiada polskiemu C — Częściowy. Skale mają te same cztery stopnie i progi, różnią się literami."},{"t":"Większościowy (EN: L – Largely achieved)","ok":false,"w":"Większościowy to W."},{"t":"Nieosiągnięty (EN: N – Not achieved)","ok":false,"w":"Nieosiągnięty to N."}],"fz":{"h":"Skala ocen","p":"P1","pulapka":true,"n":"egzamin: N/C/W/P: Nieosiągnięty, Częściowy, Większościowy, Pełny · podr.: N/P/L/F: nie, częściowo, w znacznym stopniu, w pełni osiągnięto · EN: N/P/L/F: Not, Partially, Largely, Fully achieved","q":"Jaka jest skala ocen atrybutu? | Podaj skalę ocen atrybutu z zakresami procentowymi. | „P” w skali egzaminu PL – Częściowy czy Pełny?","a":"Litera mówi, na ile spełniono jeden atrybut: N Nieosiągnięty 0–15% · C Częściowy >15–50% · W Większościowy >50–85% · P Pełny >85–100%. Pułapka: P po polsku = Pełny, po angielsku = Partially (częściowy). | N Nieosiągnięty: 0–15%; C Częściowy: >15–50%; W Większościowy: >50–85%; P Pełny: >85–100%. EN: N/P/L/F. Procent = oceniony stopień osiągnięcia atrybutu, nie odsetek udanych zgłoszeń. | Pełny (EN: F). Częściowy to C (EN: P) – najczęstsza pułapka.","ex":"N: brak lub znikome dowody; C: częściowe osiąganie; W: systematyczne podejście i znaczne osiąganie; P: kompletne, systematyczne osiąganie bez istotnych słabości. Progi 15, 50 i 85 pomagają zapamiętać skalę, lecz ocena wynika z dowodów i kryteriów atrybutu.","org":""},"cyt":{"s":"45","t":"F (w pełni osiągnięto) — istnieją dowody kompletnego i systematycznego zbliżania się do zdefiniowanego atrybutu w ocenianym procesie i pełnego osiągania go.","w":"ZGODNE","u":"FW-PL używa liter angielskich N/P/L/F (P = częściowo); polskie N/C/W/P to terminologia egzaminu PL."}},"fz-D-052":{"id":"fz-D-052","typ":"egzamin","s":"PC-02-05","t":"Jaki jest podstawowy cel modeli dojrzałości COBIT 4.1?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 41","PeopleCert Syllabus — PC-02-05"],"r":null,"zap":"","scen":"","o":[{"t":"Formalna certyfikacja według ISO/IEC 15504","ok":false,"w":"Na ISO/IEC 15504 oparto dopiero model COBIT 5."},{"t":"Ocena wyłącznie aktywatora Informacja","ok":false,"w":"Modele dojrzałości dotyczyły procesów."},{"t":"Pomiar obecnej i wymaganej dojrzałości procesów","ok":true,"w":"Modele dojrzałości COBIT 4.1 służyły do pomiaru aktualnej i wymaganej dojrzałości procesów, luki między nimi oraz sposobu doskonalenia. Wyniki mogły wspierać decyzje inwestycyjne; nie były jednak pełnym uzasadnieniem biznesowym."},{"t":"Przygotowanie uzasadnienia biznesowego","ok":false,"w":"Wyniki oceny mogą wspierać uzasadnienie biznesowe. Podstawową funkcją modelu jest jednak ocena aktualnej i docelowej dojrzałości procesów oraz luk i kierunku doskonalenia."}],"fz":{"h":"Modele dojrzałości COBIT 4.1","p":"P2","pulapka":false,"n":"EN: COBIT 4.1 maturity models","q":"Do czego służyły modele dojrzałości COBIT 4.1?","a":"Do pomiaru obecnej dojrzałości procesów („tak jest”), określenia wymaganej („tak ma być”), luki między nimi i sposobu doskonalenia.","ex":"Stary sposób: zdjęcie kuchni „jak jest dziś”, rysunek „jak ma być” i lista, co poprawić, żeby dojść od jednego do drugiego.","org":""},"cyt":{"s":"41","t":"Modele te wykorzystuje się do pomiaru aktualnej dojrzałości („tak jest”) związanych z IT procesów realizowanych w przedsiębiorstwie, definiowania wymaganego stanu dojrzałości („tak ma być”) oraz określania luki między nimi","w":"ZGODNE"}},"fz-D-053":{"id":"fz-D-053","typ":"egzamin","s":"PC-02-05","t":"Proces z poziomem 1 w COBIT 4.1 nie osiąga rezultatów. Jaki poziom może otrzymać w COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 43","FW-PL s. 44","PeopleCert Syllabus — PC-02-05"],"r":null,"zap":"","scen":"","o":[{"t":"Poziom 0","ok":true,"w":"Bez osiągnięcia rezultatów procesu nie ma poziomu 1. Podobna liczba poziomu w obu modelach nie oznacza równoważności: proces oceniony dawniej na 1 może mieć 0 w COBIT 5. Nie ma automatycznego przeliczenia 1:1."},{"t":"Poziom 1","ok":false,"w":"Poziomów nie przelicza się 1:1; bez rezultatów procesu nie ma poziomu 1."},{"t":"Poziom 2","ok":false,"w":"Wyniki w COBIT 5 są zwykle niższe, nie wyższe."},{"t":"Żaden poziom","ok":false,"w":"Poziom 0 – Proces niekompletny istnieje w COBIT 5, więc proces da się ocenić."}],"fz":{"h":"Niższe wyniki w COBIT 5","p":"P2","pulapka":false,"n":"EN: Lower scores in COBIT 5","q":"Dlaczego wyniki oceny COBIT 5 są zwykle niższe niż w COBIT 4.1? | Proces na poziomie 1 w COBIT 4.1 – jaki poziom w COBIT 5?","a":"W COBIT 4.1 proces mógł mieć poziom 1 lub 2 bez pełnego osiągnięcia celów procesu; w COBIT 5 taki proces może otrzymać niższy wynik (0 lub 1). | Może wyjść 0, jeśli nie osiąga rezultatów procesu – stąd zwykle niższe wyniki w COBIT 5.","ex":"Stary egzaminator dawał punkty „za starania”. Nowy pyta najpierw: czy kuchnia naprawdę osiąga swój cel (obiady dla gości)? Jeśli nie w pełni, zostaje na 0 lub 1. | Kuchnia, która „się stara, ale obiady nie zawsze wychodzą”, w starej skali dostawała 1, w nowej dostaje 0 – liczy się efekt.","org":""},"cyt":{"s":"44","t":"Istnieje możliwość, że niektóre procesy sklasyfikowane w ramach Modelu dojrzałości jako 1 zostaną sklasyfikowane w 15504 jako 0 — jeśli nie osiągnięto wyników procesu.","w":"ZGODNE"}},"fz-D-054":{"id":"fz-D-054","typ":"egzamin","s":"PC-02-05","t":"Co ocenia model zdolności COBIT 5 – organizację czy proces?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 41","FW-PL s. 43–44","FW-PL s. 43","PeopleCert Syllabus — PC-02-05"],"r":null,"zap":"","scen":"","o":[{"t":"Całą organizację jednym wynikiem","ok":false,"w":"Ocena dotyczy procesu, a nie całej organizacji."},{"t":"Profil dojrzałości całego przedsiębiorstwa","ok":false,"w":"Profil dojrzałości przedsiębiorstwa pozwalał uzyskać model dojrzałości COBIT 4.1 (FW-PL s. 43); COBIT 5 ocenia zdolność poszczególnych procesów."},{"t":"Tylko procesy domeny EDM","ok":false,"w":"Ocenia się każdy proces, nie tylko EDM (Evaluate, Direct and Monitor — Oszacuj, Kieruj i Monitoruj)."},{"t":"Zdolność poszczególnych procesów, według zakresu oceny","ok":true,"w":"COBIT 5 ocenia zdolność poszczególnych procesów we wspólnym wymiarze zdolności. Cały model obejmuje dziewięć atrybutów, lecz zakres konkretnej oceny może obejmować mniej poziomów. COBIT 4.1 również oceniał procesy i pozwalał zestawiać ich profil."}],"fz":{"h":"Profil organizacji czy procesu","p":"P1","pulapka":true,"n":"EN: Enterprise maturity profile vs per-process capability","q":"Co daje model COBIT 4.1, a co COBIT 5 – profil organizacji czy procesu? | Model zdolności ocenia organizację czy proces?","a":"COBIT 4.1 oceniał dojrzałość procesów i pozwalał zestawić profil dojrzałości przedsiębiorstwa. COBIT 5 ocenia zdolność poszczególnych procesów we wspólnym modelu dziewięciu atrybutów. Zakres oceny wskazuje procesy i poziomy, więc nie każda ocena musi badać wszystkie dziewięć atrybutów. Wyników obu modeli nie przelicza się 1:1.","ex":"Każdy proces otrzymuje własne oceny. Zestawienie wyników pomaga kierownictwu, ale nie zamienia modelu w jedną zbiorczą ocenę całej organizacji.","org":""},"cyt":{"s":"43","t":"w przypadku każdego procesu można dokonać oszacowania dla każdego z dziewięciu atrybutów potencjału","w":"ZGODNE","u":"O „zakresie oceny” FW nie mówi."}},"fz-D-055":{"id":"fz-D-055","typ":"egzamin","s":"PC-02-03","t":"Które stwierdzenie o modelu oceny procesów w COBIT 5 jest prawdziwe?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 43","PeopleCert Syllabus — PC-02-03"],"r":null,"zap":"","scen":"","o":[{"t":"Procesy ocenia się wspólnym modelem zdolności","ok":true,"w":"COBIT 5 stosuje wspólny model zdolności zamiast osobnych opisów dojrzałości 0–5 każdego procesu. PRM (Process Reference Model — Referencyjny Model Procesu) określa przeznaczenie i rezultaty; PAM (Process Assessment Model — Model Oceny Procesu) łączy ten wymiar procesu ze wskaźnikami wykonania i wymiarem zdolności."},{"t":"Każdy proces ma własny model dojrzałości 0–5","ok":false,"w":"Skala i atrybuty zdolności są wspólne dla ocenianych procesów; nie tworzy się osobnego opisu dojrzałości 0–5 dla każdego procesu."},{"t":"Własny model dojrzałości mają tylko procesy EDM","ok":false,"w":"Rozróżnienie dotyczy całego modelu COBIT 5, a nie tylko procesów Ładu."},{"t":"COBIT 5 w ogóle nie ocenia procesów","ok":false,"w":"COBIT 5 ocenia zdolność procesów."}],"fz":{"h":"Brak osobnego modelu dojrzałości dla procesu","p":"P2","pulapka":false,"n":"EN: No per-process maturity model","q":"Czy COBIT 5 ma osobny model dojrzałości dla każdego procesu?","a":"COBIT 5 nie stosuje osobnego modelu dojrzałości 0–5 każdego procesu. Process Reference Model — Referencyjny Model Procesu — opisuje przeznaczenie i rezultaty procesów. Process Assessment Model — Model Oceny Procesu — łączy ten wymiar ze wskaźnikami wykonania oraz wspólnym wymiarem zdolności. Ogólnych cech atrybutów wyższych poziomów nie włącza się do treści każdego opisu procesu.","ex":"Opis mówi, po co proces istnieje i co ma osiągać. Oddzielny wspólny wymiar ocenia, w jakim stopniu proces jest wykonywany, zarządzany, ustanowiony, przewidywalny i doskonalony.","org":""},"cyt":{"s":"43","t":"W metodyce COBIT 5 zrezygnowano z osobnego modelu dojrzałości dla każdego procesu","w":"ZGODNE"}},"fz-D-057":{"id":"fz-D-057","typ":"egzamin","s":"PC-01-01","t":"Co odróżnia poziom 2 – Proces zarządzany od poziomu 1?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42","PeopleCert Syllabus — PC-01-01"],"r":null,"zap":"","scen":"","o":[{"t":"Planowanie i kontrolowanie wykonania oraz zarządzanie produktami pracy","ok":true,"w":"Poziom 2 dodaje zarządzanie wykonywaniem procesu oraz produktami pracy. Wykonanie jest planowane, monitorowane i dostosowywane; produkty pracy są właściwie określone, kontrolowane i utrzymywane. Oba atrybuty poziomu 2 muszą mieć co najmniej W, a PA (Process Attribute — atrybut procesu) 1.1 — P."},{"t":"Wdrożenie zdefiniowanego standardu procesu w skali organizacji","ok":false,"w":"To poziom 3."},{"t":"Ciągłe doskonalenie procesu przewidywalnego według celów biznesowych","ok":false,"w":"To poziom 5."},{"t":"Osiąganie przeznaczenia i wymaganych rezultatów procesu","ok":false,"w":"To poziom 1."}],"fz":{"h":"Poziom 2 – Proces zarządzany","p":"P1","pulapka":false,"n":"EN: Level 2 Managed","q":"Co oznacza poziom 2 – Proces zarządzany?","a":"Poziom 2 — Proces zarządzany — oznacza, że proces osiągający przeznaczenie jest wykonywany w sposób planowany, monitorowany i dostosowywany, a produkty pracy są właściwie określone, kontrolowane i utrzymywane. Obejmuje PA 2.1 Performance management — Zarządzanie wydajnością — i PA 2.2 Work product management — Zarządzanie produktami pracy. Do potwierdzenia poziomu oba muszą mieć co najmniej W, a PA 1.1 — P.","ex":"Szef kuchni układa grafik, sprawdza, czy zespół zdąża, i poprawia plan; zamówienia i receptury są pod kontrolą, a nie na luźnych karteczkach.","org":""},"cyt":{"s":"42","t":"2 Proces zarządzany (dwa atrybuty) — opisany wyżej proces wykonywany został wdrożony w sposób zarządzany (zapewniono planowanie, monitorowanie i dostosowanie), a jego produkty działań są właściwie określone, kontrolowane i utrzymywane.","w":"ZGODNE"}},"fz-D-058":{"id":"fz-D-058","typ":"egzamin","s":"PC-01-01","t":"Co jest wymagane, aby proces osiągnął poziom 3 – Proces ustanowiony?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42"],"r":null,"zap":"","scen":"","o":[{"t":"Wystarczy spisany dokument standardu","ok":false,"w":"Standard musi działać w praktyce (PA 3.2 Wdrożenie procesu); sam dokument nie wystarczy."},{"t":"Wystarczy zatwierdzenie dokumentu przez zarząd","ok":false,"w":"Zatwierdzenie nie zastępuje stosowania w praktyce."},{"t":"Ilościowa kontrola procesu w ustalonych granicach","ok":false,"w":"Ilościowa kontrola procesu to poziom 4."},{"t":"Wdrożenie standardu procesu w praktyce","ok":true,"w":"Poziom 3 oznacza, że proces zarządzany jest wdrażany za pomocą zdefiniowanego procesu, który pozwala osiągać wyniki (FW-PL s. 42)."}],"fz":{"h":"Poziom 3 – Proces ustanowiony","p":"P1","pulapka":true,"n":"EN: Level 3 Established","q":"Co oznacza poziom 3 – Proces ustanowiony?","a":"Proces zarządzany z poziomu 2 działa teraz według zdefiniowanego standardu (wzorca), wdrożonego w praktyce, który pozwala osiągać wyniki. Sam dokument nie wystarczy. Dwa atrybuty: PA 3.1 Definicja procesu i PA 3.2 Wdrożenie procesu.","ex":"Sieć restauracji ma spisaną książkę receptur i każda kuchnia gotuje według niej, a nie każdy kucharz po swojemu.","org":""},"cyt":{"s":"42","t":"3 Proces ustanowiony (dwa atrybuty) — opisany wcześniej proces zarządzany jest wdrażany za pomocą zdefiniowanego procesu umożliwiającego osiągnięcie wyniku procesu.","w":"ZGODNE","u":"„Sam dokument nie wystarczy” to interpretacja (PA 3.2 Wdrożenie procesu); FW tego wprost nie mówi."}},"fz-D-059":{"id":"fz-D-059","typ":"egzamin","s":"PC-01-01","t":"Co jest wymagane, aby proces osiągnął poziom 4 – Proces przewidywalny?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42","PeopleCert Syllabus — PC-01-01"],"r":null,"zap":"","scen":"","o":[{"t":"Zdefiniowane mierniki i regularne raportowanie wyników","ok":false,"w":"Potrzebne jest też trzymanie procesu w granicach (PA (Process Attribute — atrybut procesu) 4.2)."},{"t":"Ciągłe wdrażanie innowacji w procesie","ok":false,"w":"Innowacja to poziom 5."},{"t":"Zatwierdzenie pomiarów przez osobę oceniającą","ok":false,"w":"Zatwierdzenie pomiarów przez osobę oceniającą nie zastępuje ilościowego rozumienia zachowania procesu i jego kontroli w zdefiniowanych granicach."},{"t":"Ilościowe zrozumienie i kontrola w ustalonych granicach","ok":true,"w":"Poziom 4 wymaga ilościowego rozumienia i kontrolowania procesu ustanowionego w zdefiniowanych granicach. Sam zbiór mierników ani dotrzymany poziom usług nie potwierdza tego poziomu. Wymagane są odpowiednie oceny obu atrybutów poziomu 4 i pełne osiągnięcie niższych."}],"fz":{"h":"Poziom 4 – Proces przewidywalny","p":"P1","pulapka":true,"n":"EN: Level 4 Predictable","q":"Co oznacza poziom 4 – Proces przewidywalny?","a":"Poziom 4 — Proces przewidywalny — oznacza ilościowo rozumiany proces ustanowiony, kontrolowany w zdefiniowanych granicach dla osiągania rezultatów. Samo zbieranie mierników ani spełnienie ustalonego czasu obsługi nie potwierdza poziomu. Potrzebne są oceny PA 4.1 i PA 4.2 co najmniej W oraz pełne osiągnięcie wszystkich niższych atrybutów.","ex":"Zespół nie tylko zbiera czasy obsługi. Rozumie ich zmienność, monitoruje zachowanie procesu i stosuje ilościowe mechanizmy kontroli. To ilustracja wymagań, a nie samodzielny dowód poziomu 4.","org":""},"cyt":{"s":"42","t":"4 Proces przewidywalny (dwa atrybuty) — opisany wcześniej proces ustanowiony działa teraz w ramach zdefiniowanych limitów w celu osiągnięcia wyników procesu.","w":"ZGODNE","u":"FW nie używa sformułowania „ilościowe zrozumienie”; atrybuty: PA 4.1 Pomiar procesu, PA 4.2 Kontrola procesu."}},"fz-D-060":{"id":"fz-D-060","typ":"egzamin","s":"PC-01-01","t":"Co oznacza poziom 5 – Proces zoptymalizowany?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42","PeopleCert Syllabus — PC-01-01"],"r":null,"zap":"","scen":"","o":[{"t":"Proces osiąga cel, choć działa bez planu","ok":false,"w":"To poziom 1."},{"t":"Proces działa według zdefiniowanego standardu","ok":false,"w":"To poziom 3."},{"t":"Proces przewidywalny jest stale doskonalony","ok":true,"w":"Poziom 5 oznacza nieustanne doskonalenie procesu przewidywalnego dla istotnych obecnych i przyszłych celów biznesowych. Obejmuje innowację i optymalizację procesu; nie oznacza końca zmian ani identycznego poziomu dla wszystkich procesów."},{"t":"Proces osiągnął 100% i nie wymaga zmian","ok":false,"w":"Poziom 5 oznacza ciągłe doskonalenie, a nie koniec zmian."}],"fz":{"h":"Poziom 5 – Proces zoptymalizowany","p":"P1","pulapka":false,"n":"EN: Level 5 Optimising","q":"Co oznacza poziom 5 – Proces zoptymalizowany?","a":"Proces przewidywalny jest stale doskonalony, by realizować obecne i przyszłe istotne cele biznesowe. Dwa atrybuty.","ex":"Kuchnia nie spoczywa na laurach: testuje nowe dania i sprzęt, by nadążać za gośćmi dziś i za rok. Czarny pas – i dalej trening.","org":""},"cyt":{"s":"42","t":"5 Proces optymalizujący (dwa atrybuty) — opisany wcześniej proces przewidywalny jest nieustannie doskonalony w celu realizacji istotnych aktualnych i projektowanych celów biznesowych.","w":"ZGODNE","u":"FW: „optymalizujący”."}},"fz-D-061":{"id":"fz-D-061","typ":"egzamin","s":"PC-01-02","t":"Które atrybuty należą do poziomu 2?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42"],"r":null,"zap":"","scen":"","o":[{"t":"Zarządzanie wydajnością i produktami pracy","ok":true,"w":"To dwa atrybuty poziomu 2: PA 2.1 Zarządzanie wydajnością i PA 2.2 Zarządzanie produktami pracy."},{"t":"Definicja procesu i wdrożenie procesu","ok":false,"w":"To atrybuty poziomu 3 (PA 3.1 i 3.2)."},{"t":"Miara procesu i kontrola procesu","ok":false,"w":"To atrybuty poziomu 4 (PA 4.1 i 4.2)."},{"t":"Wykonanie procesu i innowacja procesu","ok":false,"w":"Wykonanie procesu to PA 1.1, a innowacja to PA 5.1."}],"fz":{"h":"Atrybuty poziomów 1 i 2","p":"P1","pulapka":false,"n":"EN: PA 1.1 Process performance; PA 2.1 Performance management; PA 2.2 Work product management","q":"Podaj atrybuty poziomów 1 i 2 (nazwy egzaminacyjne).","a":"Poziom 1: PA 1.1 Wykonanie procesu. Poziom 2: PA 2.1 Zarządzanie wydajnością, PA 2.2 Zarządzanie produktami pracy.","ex":"Poziom 1 pyta: czy obiad wychodzi? Poziom 2 pyta: czy praca jest planowana i pilnowana (2.1) oraz czy receptury i zamówienia są w porządku (2.2)?","org":""},"cyt":{"s":"42","t":"PA 2.1 Zarządzanie sprawnością PA 2.2 Zarządzanie produktami działań","w":"ZGODNE","u":"Tylko il. 19; FW: „sprawnością”, „produktami działań” (egzamin: wydajnością, produktami pracy)."}},"fz-D-063":{"id":"fz-D-063","typ":"egzamin","s":"PC-01-02","t":"Które atrybuty należą do poziomu 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42","PeopleCert Syllabus — PC-01-02"],"r":null,"zap":"","scen":"","o":[{"t":"PA 5.1 Miara procesu i PA 5.2 Kontrola procesu","ok":false,"w":"To atrybuty poziomu 4."},{"t":"PA 5.1 Definicja procesu i PA 5.2 Wdrożenie procesu","ok":false,"w":"To atrybuty poziomu 3."},{"t":"Tylko jeden: PA 5.1 Optymalizacja procesu","ok":false,"w":"Poziom 5 ma dwa atrybuty, a optymalizacja to PA (Process Attribute — atrybut procesu) 5.2."},{"t":"PA 5.1 Innowacja procesu i PA 5.2 Optymalizacja procesu","ok":true,"w":"Poziom 5 obejmuje PA (Process Attribute — atrybut procesu) 5.1 Process innovation — Innowacja procesu — oraz PA 5.2 Process optimization — Optymalizacja procesu. Ich ocena dotyczy systematycznego doskonalenia procesu przewidywalnego w związku z celami biznesowymi."}],"fz":{"h":"Atrybuty poziomu 5","p":"P1","pulapka":false,"n":"EN: PA 5.1 Process innovation; PA 5.2 Process optimisation","q":"Podaj atrybuty poziomu 5 (nazwy egzaminacyjne).","a":"PA 5.1 Innowacja procesu, PA 5.2 Optymalizacja procesu.","ex":"W związku z celami biznesowymi zespół identyfikuje możliwości innowacji i doskonalenia, wprowadza zmiany oraz ocenia ich skuteczność. Skrót najpierw pomysł, potem poprawa jest tylko pomocą pamięciową; formalne potwierdzenie obejmuje oba atrybuty i niższe poziomy.","org":""},"cyt":{"s":"42","t":"PA 5.1 Innowacje procesowe PA 5.2 Optymalizacja procesu","w":"ZGODNE","u":"Tylko il. 19; FW: „Innowacje procesowe”."}},"fz-D-064":{"id":"fz-D-064","typ":"egzamin","s":"PC-01-03","t":"Co oznacza ocena C – Częściowy?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 45"],"r":null,"zap":"","scen":"","o":[{"t":"Systematyczna realizacja z pewnymi słabościami; >50–85%","ok":false,"w":"To ocena W."},{"t":"Pełne osiągnięcie bez istotnych słabości; >85–100%","ok":false,"w":"To ocena P."},{"t":"Pewne dowody realizacji, część nieprzewidywalna; >15–50%","ok":true,"w":"Tak opisuje ocenę C (EN: P – Partially achieved, częściowo) podręcznik: są pewne dowody realizacji atrybutu, ale część działań jest nieprzewidywalna (FW-PL s. 45)."},{"t":"Brak lub znikome osiągnięcie atrybutu; 0–15%","ok":false,"w":"To ocena N."}],"fz":{"h":"Ocena C – Częściowy","p":"P1","pulapka":true,"n":"EN: P – Partially achieved","q":"Co oznacza ocena C – Częściowy (EN: P)?","a":"Są pewne dowody, że atrybut jest realizowany i częściowo osiągany; część rzeczy dzieje się nieprzewidywalnie. >15–50%.","ex":"Kuchnia czasem trzyma się grafiku, czasem nie – raczej przypadkiem niż z zasady. Atrybut osiągnięty częściowo: powyżej 15% i do 50% włącznie – przy 50% nadal C, W zaczyna się powyżej 50%.","org":""},"cyt":{"s":"45","t":"P (częściowo osiągnięto) — istnieją pewne dowody na zbliżanie się do zdefiniowanego atrybutu w ocenianym procesie i częściowe osiąganie go. Niektóre aspekty osiągnięcia atrybutu mogą być niemożliwe do przewidzenia. (uzyskanie 15–50%)","w":"ZGODNE","u":"Litera C to termin egzaminu PL; FW: P."}},"fz-D-065":{"id":"fz-D-065","typ":"egzamin","s":"PC-01-03","t":"Jaki zakres procentowy odpowiada ocenie W – Większościowy (EN: L)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 45","PeopleCert Syllabus — PC-01-03"],"r":null,"zap":"","scen":"","o":[{"t":">15–50%","ok":false,"w":"To zakres oceny C."},{"t":">85–100%","ok":false,"w":"To zakres oceny P."},{"t":">50–85%","ok":true,"w":"W — Większościowy, angielskie L — Largely achieved — obejmuje >50–85% osiągnięcia atrybutu. Wymagane są dowody systematycznego podejścia i znacznego osiągania; pewne słabości mogą nadal istnieć."},{"t":"0–15%","ok":false,"w":"To zakres oceny N."}],"fz":{"h":"Ocena W – Większościowy","p":"P1","pulapka":true,"n":"EN: L – Largely achieved","q":"Co oznacza ocena W – Większościowy (EN: L)?","a":"Są dowody, że atrybut jest realizowany systematycznie i w dużej mierze osiągany; mogą zostać pewne słabości. >50–85%.","ex":"Kuchnia zwykle trzyma się grafiku i robi to celowo, ale zdarzają się wpadki. Zrobiona większość, nie wszystko.","org":""},"cyt":{"s":"45","t":"L (w znacznym stopniu osiągnięto) — istnieją dowody systematycznego zbliżania się do zdefiniowanego atrybutu w ocenianym procesie i znacznego osiągania go. W ocenianym procesie mogą istnieć pewne słabości związane z tym atrybutem. (uzyskanie 50–85%)","w":"ZGODNE","u":"Litera W to termin egzaminu PL; FW: L."}},"fz-D-066":{"id":"fz-D-066","typ":"egzamin","s":"PC-01-03","t":"Jaki stopień osiągnięcia atrybutu wymaga ocena P – Pełny?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 45","PeopleCert Syllabus — PC-01-03"],"r":null,"zap":"","scen":"","o":[{"t":"Wyłącznie pełne 100%","ok":false,"w":"Zakres oceny P to >85–100%."},{"t":"Ponad 85%, bez istotnych słabości","ok":true,"w":"P — Pełny, angielskie F — Fully achieved — obejmuje >85–100%. Potrzebne są dowody kompletnego i systematycznego podejścia oraz brak istotnych słabości. Sam procent bez jakościowej oceny dowodów nie wystarcza."},{"t":"Ponad 50% z pewnymi słabościami","ok":false,"w":"Ponad 50% to dopiero ocena W."},{"t":"100% potwierdzone przez asesora","ok":false,"w":"Ocena P nie wymaga 100% ani zewnętrznego asesora."}],"fz":{"h":"Ocena P – Pełny","p":"P1","pulapka":true,"n":"EN: F – Fully achieved","q":"Co oznacza ocena P – Pełny (EN: F)?","a":"Są dowody, że atrybut jest realizowany kompletnie i systematycznie oraz w pełni osiągany; brak istotnych słabości. >85–100%.","ex":"Ponad 85% ocenionego osiągnięcia może odpowiadać P, ale potrzebne są również kompletne i systematyczne podejście oraz brak istotnych słabości. Nie jest to prosty procent udanych zgłoszeń ani wynik testu wiedzy.","org":""},"cyt":{"s":"45","t":"W ocenianym procesie nie stwierdzono istotnych słabości związanych z tym atrybutem. (uzyskanie 85–100%)","w":"ZGODNE","u":"FW: F (w pełni osiągnięto)."}},"fz-D-067":{"id":"fz-D-067","typ":"egzamin","s":"PC-02-06","t":"Na podstawie czego ocenia się, czy proces osiągnął poziom 1?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 45","PeopleCert Syllabus — PC-02-06"],"r":null,"zap":"","scen":"","o":[{"t":"Wyłącznie planu pracy procesu","ok":false,"w":"Planowanie to poziom 2."},{"t":"Rezultatów i praktyk bazowych procesu","ok":true,"w":"Ogólna ocena zaczyna się od rezultatów procesu, następnie uwzględnia praktyki bazowe, a w celu dopracowania także produkty pracy. Produkty pracy są wejściami i wyjściami procesu, a nie wyłącznie dokumentami."},{"t":"Atrybutów PA 2.1 i PA 2.2","ok":false,"w":"To atrybuty poziomu 2."},{"t":"Dojrzałości całej organizacji","ok":false,"w":"Ocena dotyczy procesu, a nie organizacji."}],"fz":{"h":"Ocena poziomu 1","p":"P1","pulapka":false,"n":"EN: Assessing level 1","q":"Jak ocenia się, czy proces osiągnął poziom 1?","a":"Ogólne podejście z podręcznika: sprawdzić wymagane rezultaty i ocenić osiąganie celu; uwzględnić realizację praktyk bazowych; dla dopracowania oceny uwzględnić produkty pracy. Produkty pracy są wejściami i wyjściami, nie tylko dokumentami. Dla poziomu 1 PA 1.1 musi otrzymać co najmniej W.","ex":"Oceniający pyta o wymagane wyniki procesu, weryfikuje działania prowadzące do nich i sprawdza odpowiednie produkty pracy. Sama obecność procedury nie dowodzi osiągania rezultatów.","org":""},"cyt":{"s":"45","t":"Z myślą o dalszym dopracowaniu oceny można również uwzględnić produkty działań w celu ustalenia stopnia, w jakim osiągnięto dany atrybut oceny.","w":"ZGODNE","u":"Kroki 1–2 (wyniki procesu, podstawowe praktyki) – ta sama strona."}},"fz-D-069":{"id":"fz-D-069","typ":"egzamin","s":"PC-01-04","t":"Które z poniższych NIE jest jednym z czterech pojęć ISO/IEC 15504 używanych w ocenie?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 43"],"r":null,"zap":"","scen":"","o":[{"t":"Mapa drogowa","ok":true,"w":"To pojęcie z wytycznych wdrożenia (faza 3)."},{"t":"Praktyka bazowa","ok":false,"w":"To jedno z czterech pojęć."},{"t":"Produkt pracy","ok":false,"w":"To jedno z czterech pojęć."},{"t":"Rezultat procesu","ok":false,"w":"To jedno z czterech pojęć."}],"fz":{"h":"Cztery pojęcia ISO/IEC 15504","p":"P1","pulapka":false,"n":"EN: Process purpose, outcome, base practice, work product","q":"Podaj cztery pojęcia ISO/IEC 15504 używane w ocenie.","a":"Przeznaczenie procesu, rezultat procesu, praktyka bazowa, produkt pracy (podr.: cel procesu, wynik procesu, podstawowa praktyka, produkt działań).","ex":"Kuchnia: przeznaczenie – po co jest (karmić gości); rezultat – co widać (obiad na stole); praktyka bazowa – co się robi (gotowanie); produkt pracy – ślad (zamówienie, rachunek).","org":""},"cyt":{"s":"43","t":"Zamiast tego podejście definiuje informacje wymagane w „modelu referencyjnym procesu” (model procesu, który zostanie wykorzystany dla celów oceny)","w":"ZGODNE","u":"Lista: opis procesu ze wskazanym celem, podstawowe praktyki, produkty działań (s. 43). Wyniki procesu: „opis procesu zawiera jego cel i wyniki” (s. 43); FW nie nazywa tego „czterema pojęciami”. Mapy drogowej brak."}},"fz-D-070":{"id":"fz-D-070","typ":"egzamin","s":"PC-01-04","t":"Czym są praktyki bazowe w COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 43","PeopleCert Syllabus — PC-01-04"],"r":null,"zap":"","scen":"","o":[{"t":"Odpowiednikami wejść i wyjść procesu","ok":false,"w":"To produkty pracy."},{"t":"Atrybutami poziomów 2–5","ok":false,"w":"Atrybuty to cechy zdolności, a nie praktyki bazowe."},{"t":"Odpowiednikami praktyk Ładu i Zarządzania z opisu procesu","ok":true,"w":"Praktyki bazowe odpowiadają praktykom Ładu i Zarządzania danego procesu. Ich realizacja prowadzi do wymaganych rezultatów. Szczegółowe czynności rozwijające praktykę są działaniami; tych poziomów opisu nie należy utożsamiać."},{"t":"Widocznymi efektami spełnienia przeznaczenia procesu","ok":false,"w":"To rezultaty procesu."}],"fz":{"h":"Praktyki bazowe","p":"P1","pulapka":false,"n":"EN: Base practices = governance/management practices","q":"Czym są praktyki bazowe w COBIT 5?","a":"To odpowiedniki praktyk Ładu i Zarządzania z opisu procesu; ich wykonywanie prowadzi do rezultatów procesu (poziom 1).","ex":"Praktyka bazowa opisuje, co należy robić, aby osiągnąć rezultat procesu. Jej wdrożenie można rozwinąć w działania i bardziej szczegółowe czynności. Praktyka i pojedynczy krok roboczy to różne poziomy opisu.","org":""},"cyt":{"s":"43","t":"podstawowe praktyki, stanowiące odpowiednik praktyk nadzoru nad procesami lub zarządzania nimi w kategoriach stosowanych w metodyce COBIT 5","w":"ZGODNE","u":"Termin: podstawowe praktyki = praktyki bazowe."}},"fz-D-071":{"id":"fz-D-071","typ":"egzamin","s":"PC-01-04","t":"Czemu w COBIT 5 odpowiadają produkty pracy?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 43","PeopleCert Syllabus — PC-01-04"],"r":null,"zap":"","scen":"","o":[{"t":"Praktykom Ładu i Zarządzania","ok":false,"w":"Im odpowiadają praktyki bazowe."},{"t":"Atrybutom procesu","ok":false,"w":"Atrybuty to mierzalne cechy zdolności."},{"t":"Wejściom i wyjściom procesu","ok":true,"w":"Produkty pracy odpowiadają wejściom i wyjściom procesu. Mogą obejmować dokumenty, rejestry, informacje i inne wyniki potrzebne do działania procesu albo potwierdzające jego realizację."},{"t":"Poziomom zdolności","ok":false,"w":"Poziomy to skala 0–5, a nie produkty pracy."}],"fz":{"h":"Produkty pracy","p":"P1","pulapka":false,"n":"EN: Work products = inputs/outputs","q":"Czym są produkty pracy w COBIT 5?","a":"To odpowiedniki wejść i wyjść procesu: dokumenty i inne ślady (dowody) powstające przy jego wykonywaniu.","ex":"W kuchni: zamówienie od kelnera (wejście), rachunek i zapis temperatur lodówki (wyjścia). Inspektor ogląda je jako dowód, że praca była wykonana.","org":""},"cyt":{"s":"43","t":"produkty działań, stanowiące odpowiednik danych wejściowych i wyników w kategoriach stosowanych w metodyce COBIT 5","w":"ZGODNE","u":"Termin: produkty działań = produkty pracy."}},"fz-D-073":{"id":"fz-D-073","typ":"egzamin","s":"PC-02-04","t":"Czym różni się Wymiar Procesu od Wymiaru Zdolności?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42","PeopleCert Syllabus — PC-02-04"],"r":null,"zap":"","scen":"","o":[{"t":"Wymiar Procesu ma atrybuty wspólne, Zdolności – specyficzne wskaźniki","ok":false,"w":"Definicje są tu zamienione."},{"t":"Wymiar Procesu dotyczy COBIT 4.1, a Wymiar Zdolności – COBIT 5","ok":false,"w":"Oba wymiary dotyczą oceny w COBIT 5."},{"t":"Wymiar Procesu ma specyficzne wskaźniki, Zdolności – wspólne atrybuty","ok":true,"w":"Wymiar procesu zawiera treść właściwą konkretnym procesom i wskaźniki ich wykonania (poziom 1). Wymiar zdolności zawiera wspólne atrybuty poziomów 1–5, w tym PA (Process Attribute — atrybut procesu) 1.1. Specyficzne są wskaźniki osiągania celu procesu, nie sam atrybut PA 1.1."},{"t":"To dwie nazwy tego samego wymiaru oceny","ok":false,"w":"To dwa różne wymiary wskaźników oceny."}],"fz":{"h":"Wymiar Procesu a Wymiar Zdolności","p":"P1","pulapka":false,"n":"EN: Process dimension vs capability dimension","q":"Czym różnią się Wymiar Procesu i Wymiar Zdolności?","a":"Wymiar Procesu: wskaźniki właściwe dla danego procesu – praktyki bazowe i produkty pracy (procesy i ich wyniki definiuje PRM); sprawdza poziom 1 (PA 1.1). Wymiar Zdolności: atrybuty z ogólnymi praktykami, zasobami i produktami pracy, wspólne dla procesów; poziomy 1–5. Wskaźniki opisuje PAM.","ex":"Wymiar Procesu – pytania o konkretne stanowisko (czy grill piecze mięso?). Wymiar Zdolności – te same pytania dla każdego stanowiska (czy jest plan, standard, pomiar?).","org":""},"cyt":{"s":"42","t":"COBIT 5 Model oceny procesu — wskaźniki wydajności Wyniki procesu Podstawowe praktyki (praktyki nadzoru/ zarządzania) Produkty działań (dane wejściowe/ wyniki) COBIT 5 Model oceny procesu — wskaźniki potencjału Typowe praktyki Typowe zasoby Typowe produkty działań","w":"ZGODNE","u":"Tylko il. 19; terminy „Wymiar Procesu/Zdolności” są z PAM, w FW nie występują. Wspólne atrybuty poziomów 2–5 – s. 43."}},"fz-D-074":{"id":"fz-D-074","typ":"egzamin","s":"PC-02-03","t":"Czego według ISO/IEC 15504-2 NIE może zawierać opis procesu w PRM?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 43","PeopleCert Syllabus — PC-02-03"],"r":null,"zap":"","scen":"","o":[{"t":"Ogólnych cech wyższych poziomów zdolności","ok":true,"w":"Opis w PRM (Process Reference Model — Referencyjny Model Procesu) obejmuje przeznaczenie i rezultaty procesu. Nie włącza ogólnych cech atrybutów zdolności poziomów 2–5 do treści każdego procesu. Nie oznacza to zakazu planowania lub monitorowania, gdy właśnie taki jest merytoryczny cel ocenianego procesu."},{"t":"Opisu przeznaczenia procesu","ok":false,"w":"Przeznaczenie (cel) procesu musi się w opisie znaleźć."},{"t":"Oczekiwanych rezultatów procesu","ok":false,"w":"Rezultaty procesu muszą się w opisie znaleźć."},{"t":"Kroków prowadzących do celu procesu","ok":false,"w":"Kroki prowadzące do celu procesu mogą się znaleźć w opisie."}],"fz":{"h":"Wymagania ISO/IEC 15504-2 wobec PRM","p":"P2","pulapka":false,"n":"EN: PRM requirements per ISO/IEC 15504-2","q":"Jakie wymagania ISO/IEC 15504-2 musi spełniać opis procesu w PRM?","a":"Opis procesu w Process Reference Model — Referencyjnym Modelu Procesu — zawiera jego przeznaczenie i rezultaty. Nie włącza do treści każdego procesu ogólnych cech atrybutów zdolności ponad poziom 1. Rozdziela się to, co proces ma osiągnąć, od oceny sposobu jego wykonywania. Planowanie lub monitorowanie może być własnym celem konkretnego procesu, np. procesów MEA.","ex":"Proces monitorowania może wytwarzać raporty już jako wymagane wyniki swojego wykonania. Oddzielnie bada się, czy samo wykonywanie tego procesu jest planowane, zarządzane i kontrolowane.","org":""},"cyt":{"s":"43","t":"Opis procesu nie może zawierać żadnych aspektów struktury pomiarów wykraczających poza poziom 1, co oznacza, że w opisie procesu nie może pojawić się żadna cecha atrybutu procesu wykraczająca poza poziom 1.","w":"ZGODNE"}},"fz-D-075":{"id":"fz-D-075","typ":"egzamin","s":"PC-02-01","t":"Który z poniższych NIE jest celem oceny zdolności procesu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 45","PeopleCert Syllabus — PC-02-01"],"r":null,"zap":"","scen":"","o":[{"t":"Porównanie procesów przez Ład i kierownictwo","ok":false,"w":"Jest to cel oceny wymieniony w podręczniku."},{"t":"Ustalenie „jak jest” i „jak ma być”, by zdecydować o inwestycjach","ok":false,"w":"Jest to cel oceny wymieniony w podręczniku."},{"t":"Ocena osobistych kompetencji każdego pracownika","ok":true,"w":"Ocena zdolności dotyczy procesów: porównań, stanu aktualnego i docelowego, luk, planu usprawnień oraz monitorowania zdolności w czasie. Nie służy wystawianiu ogólnej oceny wartości lub kompetencji poszczególnych pracowników."},{"t":"Śledzenie zdolności w czasie dzięki porównywalnym ocenom","ok":false,"w":"Jest to cel oceny wymieniony w podręczniku."}],"fz":{"h":"Cele oceny zdolności procesu","p":"P2","pulapka":false,"n":"EN: Purposes of process capability assessment","q":"Jakie są cele oceny zdolności procesu?","a":"Ład i kierownictwo mogą porównać procesy; ustalić „jak jest” i „jak ma być”, by zdecydować o inwestycjach; zobaczyć luki i zaplanować usprawnienia; śledzić zdolność w czasie dzięki porównywalnym ocenom.","ex":"Właściciel sieci restauracji widzi, która kuchnia odstaje, ile brakuje do celu i w co włożyć pieniądze – oraz czy z roku na rok jest lepiej.","org":""},"cyt":{"s":"45","t":"Podejście do oszacowania według COBIT 5 oparte na normie ISO/IEC 15504 ułatwia realizację następujących celów stanowiących kluczowe podejście COBIT od roku 2000: • umożliwienie organowi nadzorującemu i kierownictwu porównanie potencjału procesów;","w":"ZGODNE","u":"Dalsze cele (jak jest / jak ma być, luki, monitorowanie) dotyczą procesów; ocena kompetencji pracowników nie występuje."}},"fz-D-076":{"id":"fz-D-076","typ":"egzamin","s":"PC-02-01","t":"Jakie cele może mieć ocena według ISO/IEC 15504?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 45","PeopleCert Syllabus — PC-02-01"],"r":null,"zap":"","scen":"","o":[{"t":"Wyłącznie zewnętrzne – certyfikację","ok":false,"w":"Ocena może mieć też cele wewnętrzne."},{"t":"Wyłącznie wewnętrzne – porównania obszarów","ok":false,"w":"Ocena może mieć też cele zewnętrzne."},{"t":"Wewnętrzne lub zewnętrzne, zależnie od celu oceny","ok":true,"w":"Ocena może służyć wewnętrznemu doskonaleniu lub celom zewnętrznym, np. formalnemu raportowaniu. Cel, zakres i wymagany rygor ustala się dla oceny. Samoocena nie zapewnia automatycznej certyfikacji, a ocena wewnętrzna także może być formalna."},{"t":"Wyłącznie finansowe – wycenę działu IT","ok":false,"w":"Podręcznik nie wymienia takiego celu."}],"fz":{"h":"Ocena wewnętrzna a zewnętrzna","p":"P2","pulapka":false,"n":"EN: Internal vs external assessment","q":"Jakie cele może mieć ocena wg ISO/IEC 15504?","a":"Ocena według ISO/IEC 15504 może mieć cele wewnętrzne, np. doskonalenie i porównania obszarów, lub zewnętrzne, np. formalne raportowanie. Wymagany rygor zależy od celu i ustalonej procedury. Wewnętrzna ocena także może być formalna, a samoocena nie nadaje automatycznie certyfikacji.","ex":"Organizacja może zlecić własnemu kompetentnemu zespołowi formalną ocenę albo wykonać orientacyjną samoocenę. Zewnętrzny odbiorca może wymagać dodatkowo określonej procedury i raportu.","org":""},"cyt":{"s":"45","t":"Cele mogą mieć charakter wewnętrzny i dotyczyć porównania między obszarami przedsiębiorstwa i/lub dotyczyć udoskonalenia procesów z myślą o korzyściach wewnętrznych albo też mogą mieć charakter zewnętrzny i dotyczyć formalnego oszacowania, raportowania i certyfikacji.","w":"ZGODNE"}},"fz-D-077":{"id":"fz-D-077","typ":"egzamin","s":"PC-02-02","t":"Który dokument NIE należy do trzech przewodników programu oceny COBIT?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 41","PeopleCert Syllabus — PC-02-02"],"r":null,"zap":"","scen":"","o":[{"t":"Model Oceny Procesu (PAM)","ok":false,"w":"To jeden z trzech przewodników."},{"t":"Przewodnik COBIT 5: Wdrożenie","ok":true,"w":"Trzy przewodniki programu oceny to PAM — Model Oceny Procesu, Assessor Guide — Przewodnik Asesora i Self-assessment Guide — Przewodnik Samooceny. Przewodnik wdrożenia ma inny cel: wspiera wdrażanie i doskonalenie Ładu i Zarządzania."},{"t":"Przewodnik Asesora","ok":false,"w":"To jeden z trzech przewodników."},{"t":"Przewodnik Samooceny","ok":false,"w":"To jeden z trzech przewodników."}],"fz":{"h":"Trzy przewodniki programu oceny","p":"P2","pulapka":false,"n":"EN: PAM, Assessor Guide, Self-Assessment Guide","q":"Podaj trzy przewodniki programu oceny COBIT.","a":"Process Assessment Model — Model Oceny Procesu (PAM); Assessor Guide — Przewodnik Asesora; Self-assessment Guide — Przewodnik Samooceny.","ex":"Model określa procesy i wskaźniki oceny. Przewodnik Asesora wyjaśnia formalne przeprowadzenie oceny, a Przewodnik Samooceny prostsze rozpoznanie. Nie są to trzy nazwy tego samego dokumentu.","org":""},"cyt":{"s":"41","t":"Szczegóły podejścia do oszacowania potencjału w ramach metodyki COBIT 5 są zawarte w publikacji ISACA COBIT® Model oceny procesu (ang. Process Assessment Model – PAM)","w":"BRAK_W_FW","u":"FW-PL wymienia tylko PAM; Assessor Guide i Self-assessment Guide pochodzą z sylabusa / COBIT Assessment Programme. Że przewodnik Wdrożenie do nich nie należy, wynika pośrednio."}},"fz-D-078":{"id":"fz-D-078","typ":"egzamin","s":"PC-02-06","t":"PA 1.1 = P, PA 2.1 = W, PA 2.2 = W, PA 3.1 = C. Jaki to poziom zdolności?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42","PeopleCert Syllabus — PC-02-06"],"r":null,"zap":"","scen":"","o":[{"t":"Poziom 1","ok":false,"w":"Atrybuty poziomu 2 na W wystarczają do poziomu 2."},{"t":"Poziom 2","ok":true,"w":"PA (Process Attribute — atrybut procesu) 1.1 jest pełny, a oba atrybuty poziomu 2 mają W, więc proces osiąga poziom 2. Do poziomu 3 potrzebne są pełne atrybuty niższe oraz co najmniej W dla obu atrybutów poziomu 3; wskazane oceny tego nie spełniają."},{"t":"Poziom 3","ok":false,"w":"Wymagałby P na obu atrybutach poziomu 2 i co najmniej W na PA (Process Attribute — atrybut procesu) 3.1 i 3.2."},{"t":"Poziom 0","ok":false,"w":"PA (Process Attribute — atrybut procesu) 1.1 = P, więc proces osiąga cel."}],"fz":{"h":"Liczenie poziomu: P, W, W, C","p":"P1","pulapka":false,"n":"EN: Worked example","q":"PA1.1=P, PA2.1=W, PA2.2=W, PA3.1=C – jaki poziom zdolności?","a":"Poziom 2. Poziom 1 pełny (P), atrybuty poziomu 2 co najmniej W. Poziom 3 nie: wymaga P na obu atrybutach poziomu 2 i co najmniej W na PA 3.1 i 3.2.","ex":"Stoisz na stopniu 2: stopień 1 jest cały (P), a 2 „prawie” (W). Na 3 nie wejdziesz: stopień 2 musiałby być cały, a PA 3.1 ma tylko C.","org":""},"cyt":{"s":"42","t":"Każdy z poziomów potencjału może zostać osiągnięty tylko wtedy, gdy w pełni uzyskano niższy poziom.","w":"ZGODNE","u":"Wynik wyliczony z reguły; litery egzaminu W/P = L/F."}},"fz-D-079":{"id":"fz-D-079","typ":"egzamin","s":"PC-02-06","t":"PA 1.1 = W, PA 2.1 = P, PA 2.2 = P. Jaki to poziom zdolności?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42","PeopleCert Syllabus — PC-02-06"],"r":null,"zap":"","scen":"","o":[{"t":"Poziom 2","ok":false,"w":"Poziom 2 wymaga P na PA (Process Attribute — atrybut procesu) 1.1."},{"t":"Poziom 0","ok":false,"w":"W na PA (Process Attribute — atrybut procesu) 1.1 wystarcza do poziomu 1."},{"t":"Poziom 3","ok":false,"w":"Nie oceniono atrybutów poziomu 3, a PA (Process Attribute — atrybut procesu) 1.1 nie jest pełny."},{"t":"Poziom 1","ok":true,"w":"W na PA (Process Attribute — atrybut procesu) 1.1 wystarcza do poziomu 1. Do poziomu 2 PA 1.1 musi mieć P, dlatego pełne oceny PA 2.1 i PA 2.2 nie podnoszą poziomu. Oceny atrybutów nie kompensują się średnią."}],"fz":{"h":"Liczenie poziomu: W, P, P","p":"P1","pulapka":false,"n":"EN: Worked example","q":"PA1.1=W, PA2.1=P, PA2.2=P – jaki poziom zdolności?","a":"Poziom 1. W na PA 1.1 wystarcza do poziomu 1, ale poziom 2 wymaga P na PA 1.1 – dobre oceny PA 2.x nie pomagają.","ex":"Jak pasy: świetnie opanowane techniki zielonego pasa nic nie dają, gdy żółty jest zaliczony tylko „prawie”. Najpierw domknij niższy poziom.","org":""},"cyt":{"s":"42","t":"Każdy z poziomów potencjału może zostać osiągnięty tylko wtedy, gdy w pełni uzyskano niższy poziom.","w":"ZGODNE","u":"Wynik wyliczony z reguły: poziom 2 wymaga F na PA 1.1."}},"fz-D-080":{"id":"fz-D-080","typ":"egzamin","s":"PC-02-06","t":"PA 1.1 = P, PA 2.1 = P, PA 2.2 = P, PA 3.1 = W, PA 3.2 = C. Jaki to poziom zdolności?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42","PeopleCert Syllabus — PC-02-06"],"r":null,"zap":"","scen":"","o":[{"t":"Poziom 3","ok":false,"w":"Oba atrybuty poziomu 3 muszą mieć co najmniej W."},{"t":"Poziom 1","ok":false,"w":"Atrybuty poziomu 2 są pełne, więc poziom 2 jest osiągnięty."},{"t":"Poziom 4","ok":false,"w":"Poziom 3 nie jest nawet osiągnięty."},{"t":"Poziom 2","ok":true,"w":"PA (Process Attribute — atrybut procesu) 3.2 ma C, więc nie osiągnięto wymaganego minimum W dla każdego atrybutu poziomu 3. Pełne osiągnięcie atrybutów poziomów 1 i 2 pozwala potwierdzić poziom 2."}],"fz":{"h":"Liczenie poziomu: P, P, P, W, C","p":"P1","pulapka":false,"n":"EN: Worked example","q":"PA1.1=P, PA2.1=P, PA2.2=P, PA3.1=W, PA3.2=C – jaki poziom zdolności?","a":"Poziom 2. Do poziomu 3 oba atrybuty PA 3.1 i PA 3.2 muszą mieć co najmniej W; PA 3.2 ma tylko C.","ex":"Do poziomu 3 oba jego pytania trzeba zaliczyć co najmniej na W. Jedno słabe (C) blokuje cały poziom – jak oblany jeden z dwóch egzaminów.","org":""},"cyt":{"s":"42","t":"poziom 3 potencjału procesu (proces ustanowiony) wymaga zdefiniowania procesu oraz osiągnięcia (w znacznym stopniu) atrybutów wdrożenia — oprócz pełnego osiągnięcia wszystkich atrybutów poziomu 2 potencjału procesu (proces zarządzany)","w":"ZGODNE","u":"Wynik wyliczony z reguły; PA 3.2 = C (FW: P) to za mało."}},"fz-D-081":{"id":"fz-D-081","typ":"egzamin","s":"PC-02-06","t":"PA 1.1 osiągnięto w 40%. Jaka to ocena i jaki poziom zdolności?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 45","PeopleCert Syllabus — PC-02-06"],"r":null,"zap":"","scen":"","o":[{"t":"Ocena C, poziom 0","ok":true,"w":"Ocenione 40% osiągnięcia PA (Process Attribute — atrybut procesu) 1.1 odpowiada C — Częściowy, czyli angielskiemu P — Partially achieved. Do poziomu 1 potrzeba co najmniej W, dlatego wynik zdolności to poziom 0. Procent nie oznacza automatycznie odsetka udanych zgłoszeń."},{"t":"Ocena C, poziom 1","ok":false,"w":"Poziom 1 wymaga na PA (Process Attribute — atrybut procesu) 1.1 co najmniej W, czyli ponad 50%."},{"t":"Ocena W, poziom 1","ok":false,"w":"40% to C, a nie W."},{"t":"Ocena N, poziom 0","ok":false,"w":"N to tylko 0–15%."}],"fz":{"h":"Liczenie poziomu: PA 1.1 w 40%","p":"P1","pulapka":false,"n":"EN: Worked example","q":"PA 1.1 osiągnięty w 40%. Jaka ocena i poziom?","a":"Ocena C (Częściowy, >15–50%), więc poziom 0 – proces niekompletny.","ex":"Do poziomu 1 trzeba na PA 1.1 co najmniej W, czyli ponad 50%. 40% to oceniony stopień osiągnięcia atrybutu (nie odsetek udanych obiadów) – za mało, więc zostaje 0.","org":""},"cyt":{"s":"42","t":"Osiągnięcie poziomu 1 potencjału procesu wymaga osiągnięcia (w znacznym stopniu) atrybutu sprawności procesu","w":"ZGODNE","u":"40% to P (częściowo osiągnięto, 15–50%) wg s. 45; litera C to termin egzaminu PL."}},"fz-D-082":{"id":"fz-D-082","typ":"egzamin","s":"PC-02-04","t":"Które stwierdzenie o atrybutach poziomów 2–5 jest prawdziwe?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 43","PeopleCert Syllabus — PC-02-04"],"r":null,"zap":"","scen":"","o":[{"t":"Są wspólne dla wszystkich ocenianych procesów","ok":true,"w":"PA (Process Attribute — atrybut procesu) 2.1–PA 5.2 są wspólne dla procesów. Wspólny jest również PA 1.1, który mierzy osiąganie przeznaczenia. Konkretne rezultaty, praktyki bazowe i produkty pracy dostarczające wskaźników wykonania różnią się między procesami."},{"t":"Każdy proces ma własne atrybuty poziomów 2–5","ok":false,"w":"Atrybuty 2–5 są wspólne."},{"t":"Różnią się w zależności od domeny procesu","ok":false,"w":"Atrybuty 2–5 są wspólne dla wszystkich procesów."},{"t":"Poziomy 2–5 w ogóle nie mają atrybutów","ok":false,"w":"Każdy z poziomów 2–5 ma dwa atrybuty."}],"fz":{"h":"Wspólne atrybuty poziomów 2–5","p":"P1","pulapka":false,"n":"EN: Generic attributes for levels 2–5","q":"Czy atrybuty poziomów 2–5 są inne dla każdego procesu?","a":"PA 2.1–PA 5.2 są wspólne dla procesów. Wspólny jest również PA 1.1 Process performance — Wykonanie procesu. Specyficzne dla danego procesu są przeznaczenie, rezultaty, praktyki bazowe i produkty pracy, które dostarczają wskaźników wykonania. Wszystkie atrybuty należą do wspólnego wymiaru zdolności.","ex":"Dwa różne procesy ocenia się tym samym atrybutem PA 1.1: czy osiągają swoje przeznaczenie? Różne są wymagane rezultaty i dowody, bo inny jest cel procesu obsługi incydentów, a inny procesu strategii.","org":""},"cyt":{"s":"43","t":"wspólne atrybuty możliwe do zastosowania w odniesieniu do wszystkich procesów przedsiębiorstwa, powodujące powielenie celów kontrolnych w publikacji COBIT® 3rd Edition i zgrupowane w ramach celów procesów kontrolnych (PC) w metodyce COBIT 4.1, zdefiniowano obecnie na poziomach 2–5 modelu oszacowania","w":"ZGODNE"}},"fz-D-084":{"id":"fz-D-084","typ":"egzamin","s":"PC-02-04","t":"Co ocenia atrybut PA 1.1?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42","PeopleCert Syllabus — PC-02-04"],"r":null,"zap":"","scen":"","o":[{"t":"Jak dobrze proces jest zarządzany","ok":false,"w":"To zakres atrybutów poziomu 2."},{"t":"Czy proces jest stale doskonalony","ok":false,"w":"To zakres poziomu 5."},{"t":"Czy proces osiąga swój cel","ok":true,"w":"PA (Process Attribute — atrybut procesu) 1.1 Process performance — Wykonanie procesu — ocenia stopień osiągania przeznaczenia procesu. To wspólny atrybut wymiaru zdolności. Przy jego ocenie wykorzystuje się specyficzne dla procesu rezultaty, praktyki bazowe i produkty pracy."},{"t":"Czy proces działa w granicach ilościowych","ok":false,"w":"To zakres poziomu 4."}],"fz":{"h":"PA 1.1 a pozostałe atrybuty","p":"P1","pulapka":false,"n":"EN: PA 1.1 vs higher attributes","q":"Co ocenia PA 1.1, a co pozostałe atrybuty?","a":"PA 1.1 Process performance — Wykonanie procesu — jest wspólnym atrybutem wymiaru zdolności i mierzy osiąganie przeznaczenia. Specyficzne rezultaty, praktyki bazowe i produkty pracy dostarczają wskaźników i dowodów. Pozostałe atrybuty oceniają zarządzanie, ustanowienie, przewidywalność i doskonalenie procesu.","ex":"PA 1.1 pyta: czy obiad wychodzi? Pozostałe osiem pyta, jak porządnie kuchnia działa: czy planuje, ma receptury, mierzy i się ulepsza.","org":""},"cyt":{"s":"45","t":"na poziomie 1 potencjału procesu ustala się, czy zamierzony cel procesu został osiągnięty","w":"ZGODNE","u":"FW: PA 1.1 „Sprawność procesu”."}},"fz-D-085":{"id":"fz-D-085","typ":"egzamin","s":"PC-01-02","t":"Co oznacza zdolność procesu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 93","PeopleCert Syllabus — PC-01-02"],"r":null,"zap":"","scen":"","o":[{"t":"Mierzalną cechę odnoszącą się do każdego procesu","ok":false,"w":"To definicja atrybutu procesu."},{"t":"Zdolność osiągania obecnych lub planowanych celów biznesowych","ok":true,"w":"Process capability — Zdolność procesu — opisuje zdolność do osiągania aktualnych lub planowanych celów biznesowych przez wykonywanie procesu. Process attribute — Atrybut procesu — jest mierzalną cechą tej zdolności odnoszącą się do każdego procesu."},{"t":"Liczbę praktyk bazowych wykonywanych w procesie","ok":false,"w":"Liczba praktyk bazowych nie jest definicją zdolności procesu."},{"t":"Dokumenty powstające przy wykonywaniu procesu","ok":false,"w":"To produkty pracy."}],"fz":{"h":"Atrybut procesu i zdolność procesu (słownik)","p":"P2","pulapka":false,"n":"EN: Process attribute; process capability","q":"Jak słownik COBIT 5 definiuje atrybut procesu i zdolność procesu?","a":"Atrybut procesu: mierzalna cecha zdolności procesu, odnosząca się do każdego procesu (ISO/IEC 15504). Zdolność procesu (podr. potencjał): cecha mówiąca, na ile proces potrafi osiągać obecne lub planowane cele biznesowe.","ex":"Zdolność procesu wydawania posiłków dotyczy jego możliwości realizowania aktualnych i planowanych celów biznesowych. Ocenia się proces jako całość. Umiejętność pojedynczego kucharza należy do aktywatora Ludzie, Umiejętności i Kompetencje.","org":""},"cyt":{"s":"93","t":"ISO/IEC 15504: Charakterystyka zdolności do osiągnięcia aktualnych lub projektowanych celów biznesowych w wyniku realizacji procesu.","w":"ZGODNE","u":"Hasło w FW: „Potencjał procesu” (= zdolność procesu)."}},"q-pc-gap-01":{"id":"q-pc-gap-01","typ":"egzamin","s":"EN-02-13","t":"Za co odpowiada dyrektor ds. finansowych (CFO)?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 76","FW-PL s. 77"],"r":null,"zap":"CFO = finanse: pieniądze, ryzyko finansowe, kontrola i rzetelna księgowość.","scen":"","o":[{"t":"Za funkcjonowanie całej organizacji","ok":false,"w":"To opis dyrektora ds. operacyjnych (COO) (FW-PL s. 76)."},{"t":"Za zarządzanie finansami, w tym ryzykiem finansowym","ok":true,"w":"CFO odpowiada za wszystkie aspekty zarządzania finansami: ryzyko finansowe, mechanizmy kontrolne oraz wiarygodną i dokładną rachunkowość (FW-PL s. 76, Rysunek 33)."},{"t":"Za zarządzanie ryzykiem w całej organizacji","ok":false,"w":"To opis dyrektora ds. ryzyka (CRO). CFO odpowiada tylko za ryzyko finansowe (FW-PL s. 76)."},{"t":"Za planowanie i polityki zasobów ludzkich","ok":false,"w":"To opis dyrektora ds. zarządzania zasobami ludzkimi (FW-PL s. 76)."}],"przyklad":"W domu CFO to osoba, która prowadzi budżet, pilnuje, żeby nie zabrakło na rachunki, i trzyma paragony w porządku. HACZYK: CRO odpowiada za każde ryzyko, CFO tylko za ryzyko finansowe.","cyt":{"s":"76","t":"Menedżer najwyższego szczebla w przedsiębiorstwie odpowiedzialny za wszystkie aspekty zarządzania finansami, w tym za ryzyko finansowe i mechanizmy kontrolne, a także za wiarygodną i dokładną rachunkowość.","w":"ZGODNE"}},"q-pc-gap-02":{"id":"q-pc-gap-02","typ":"egzamin","s":"EN-02-13","t":"Który opis dotyczy dyrektora ds. operacyjnych (COO)?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 76","FW-PL s. 77"],"r":null,"zap":"COO = funkcjonowanie całego przedsiębiorstwa. Dyrektor ds. operacji IT = tylko środowiska operacyjne i infrastruktura IT.","scen":"","o":[{"t":"Najwyższy rangą dyrektor w pełni zarządzający organizacją","ok":false,"w":"To opis dyrektora generalnego (CEO) (FW-PL s. 76)."},{"t":"Członek wyższej kadry dbający o infrastrukturę IT","ok":false,"w":"To dyrektor ds. operacji IT. Słowo „operacyjny” łatwo pomylić, ale COO odpowiada za całe przedsiębiorstwo, nie tylko za IT (FW-PL s. 76)."},{"t":"Przedstawiciel kierownictwa jednej jednostki biznesowej","ok":false,"w":"To członek naczelnego kierownictwa (ang. Business Executive) (FW-PL s. 76)."},{"t":"Menedżer najwyższego szczebla dbający o funkcjonowanie organizacji","ok":true,"w":"COO to menedżer najwyższego szczebla odpowiedzialny za funkcjonowanie przedsiębiorstwa (FW-PL s. 76, Rysunek 33)."}],"przyklad":"W szpitalu COO pilnuje, żeby cały szpital działał na co dzień: izby przyjęć, kuchnia, transport. Szef serwerowni dba tylko o sprzęt IT. HACZYK: „operacyjny” ma i COO, i dyrektor ds. operacji IT; rozstrzyga zakres – całe przedsiębiorstwo czy samo IT.","cyt":{"s":"76","t":"Menedżer najwyższego szczebla odpowiedzialny za funkcjonowanie przedsiębiorstwa.","w":"ZGODNE"}},"q-pc-gap-03":{"id":"q-pc-gap-03","typ":"egzamin","s":"EN-02-13","t":"Kto na najwyższym szczeblu odpowiada za bezpieczeństwo informacji we wszystkich formach?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 76","FW-PL s. 77"],"r":null,"zap":"CISO = najwyższy szczebel, bezpieczeństwo informacji we wszystkich formach (także papier i rozmowy, nie tylko IT).","scen":"","o":[{"t":"Kierownik ds. bezpieczeństwa informacji","ok":false,"w":"Kierownik projektuje, nadzoruje i ocenia bezpieczeństwo informacji oraz nim zarządza, ale nie jest rolą najwyższego szczebla (FW-PL s. 77)."},{"t":"Dyrektor ds. bezpieczeństwa informacji (CISO)","ok":true,"w":"CISO to dyrektor najwyższego szczebla odpowiedzialny za bezpieczeństwo informacji przedsiębiorstwa we wszystkich formach (FW-PL s. 76)."},{"t":"Dyrektor ds. informatyki (CIO)","ok":false,"w":"CIO dopasowuje strategię IT do biznesowej i zarządza usługami i rozwiązaniami IT; bezpieczeństwo informacji to osobna rola (FW-PL s. 76)."},{"t":"Dyrektor ds. prywatności","ok":false,"w":"Dyrektor ds. prywatności zajmuje się ryzykiem i przepisami o ochronie prywatności, a nie całym bezpieczeństwem informacji (FW-PL s. 77)."}],"przyklad":"W urzędzie CISO odpowiada za to, żeby żadna ważna informacja nie wyciekła: z komputera, z szafy z aktami ani z rozmowy na korytarzu. HACZYK: „we wszystkich formach” i „najwyższy szczebel” wskazują CISO, a nie kierownika ds. bezpieczeństwa.","cyt":{"s":"76","t":"Dyrektor najwyższego szczebla w przedsiębiorstwie odpowiedzialny za bezpieczeństwo informacji przedsiębiorstwa we wszystkich formach.","w":"ZGODNE"}},"q-pc-gap-04":{"id":"q-pc-gap-04","typ":"egzamin","s":"EN-02-13","t":"Która rola spoza najwyższego kierownictwa projektuje, nadzoruje i ocenia bezpieczeństwo informacji?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 76","FW-PL s. 77"],"r":null,"zap":"Kierownik ds. bezpieczeństwa informacji = projektuje, nadzoruje, ocenia, zarządza. CISO = ten sam temat na najwyższym szczeblu.","scen":"","o":[{"t":"Kierownik ds. ciągłości działalności biznesowej","ok":false,"w":"Ten kierownik dba o to, by funkcje krytyczne działały po zdarzeniach powodujących zakłócenia, a nie o bezpieczeństwo informacji (FW-PL s. 77)."},{"t":"Funkcja audytu wewnętrznego","ok":false,"w":"Audyt to funkcja przeprowadzająca audyty wewnętrzne; nie projektuje zabezpieczeń (FW-PL s. 76)."},{"t":"Kierownik ds. bezpieczeństwa informacji","ok":true,"w":"Tak opisuje tę rolę Rysunek 33: projektowanie, nadzorowanie i/lub ocena bezpieczeństwa informacji oraz zarządzanie nim (FW-PL s. 77)."},{"t":"Dyrektor ds. bezpieczeństwa informacji (CISO)","ok":false,"w":"CISO to rola najwyższego szczebla; w pytaniu chodzi o osobę spoza najwyższego kierownictwa (FW-PL s. 76)."}],"przyklad":"CISO to komendant odpowiedzialny za bezpieczeństwo całej jednostki, a kierownik ds. bezpieczeństwa to oficer, który na co dzień układa zabezpieczenia i sprawdza, czy działają. HACZYK: słowa „projektuje, nadzoruje, ocenia” wskazują kierownika.","cyt":{"s":"77","t":"Kierownik ds. bezpieczeństwa informacji Osoba zajmująca się projektowaniem, nadzorowaniem i/lub oceną bezpieczeństwa informacji oraz zarządzaniem nim w przedsiębiorstwie.","w":"ZGODNE","u":"FW-PL: „Ilustracja 33” (pytanie: Rysunek 33)."}},"q-pc-gap-05":{"id":"q-pc-gap-05","typ":"egzamin","s":"EN-02-13","t":"Która funkcja przeprowadza audyty wewnętrzne?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 76","FW-PL s. 77"],"r":null,"zap":"Audyt = przeprowadza audyty wewnętrzne. Zgodność = wytyczne co do przepisów, regulacji i umów.","scen":"","o":[{"t":"Zgodność","ok":false,"w":"Zgodność daje wytyczne dotyczące zgodności z wymogami prawnymi, regulacyjnymi i wynikającymi z umów, ale nie przeprowadza audytów (FW-PL s. 76)."},{"t":"Komitet ds. ryzyka w organizacji","ok":false,"w":"Ten komitet uzgadnia wspólne stanowisko kierownictwa w sprawie ryzyka przedsiębiorstwa (ERM), nie prowadzi audytów (FW-PL s. 76)."},{"t":"Biuro zarządzania wartością (VMO)","ok":false,"w":"VMO jest sekretariatem portfela inwestycji i usług (FW-PL s. 77)."},{"t":"Audyt","ok":true,"w":"Rysunek 33 opisuje Audyt jako funkcję odpowiedzialną za przeprowadzanie audytów wewnętrznych (FW-PL s. 76)."}],"przyklad":"Zgodność mówi, jakich przepisów trzeba przestrzegać, a Audyt przychodzi potem i sprawdza, czy naprawdę się ich przestrzega. HACZYK: kto „przeprowadza audyty wewnętrzne” – tylko Audyt.","cyt":{"s":"76","t":"Audyt Funkcja w przedsiębiorstwie odpowiedzialna za przeprowadzanie audytów wewnętrznych.","w":"ZGODNE"}},"q-pc-gap-06":{"id":"q-pc-gap-06","typ":"egzamin","s":"EN-02-13","t":"Czym różni się dyrektor ds. architektury od Rady ds. Architektury?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 76","FW-PL s. 77"],"r":null,"zap":"Dyrektor ds. architektury = proces (osoba). Rada ds. Architektury = wytyczne, polityki, standardy (grupa).","scen":"","o":[{"t":"Dyrektor odpowiada za proces, Rada za polityki i standardy","ok":true,"w":"Dyrektor ds. architektury to członek wyższej kadry odpowiedzialny za proces architektury korporacyjnej, a Rada ds. Architektury to grupa interesariuszy i ekspertów, która daje wytyczne w sprawach architektury oraz opracowuje jej polityki i standardy (FW-PL s. 76)."},{"t":"Rada odpowiada za proces, dyrektor za polityki i standardy","ok":false,"w":"Role są zamienione: proces należy do dyrektora, polityki i standardy do Rady (FW-PL s. 76)."},{"t":"To dwie nazwy tej samej roli w organizacji","ok":false,"w":"Rysunek 33 wymienia je osobno: jedna to osoba, druga to grupa interesariuszy i ekspertów (FW-PL s. 76)."},{"t":"Dyrektor odpowiada za infrastrukturę, Rada za rozwój IT","ok":false,"w":"Infrastruktura IT to dyrektor ds. operacji IT, a rozwój rozwiązań IT to dyrektor ds. rozwoju (FW-PL s. 76)."}],"przyklad":"Przy budowie osiedla główny architekt prowadzi projekt, a komisja urbanistyczna ustala zasady, których muszą trzymać się wszystkie budynki. HACZYK: osoba prowadzi proces, grupa ustala reguły.","cyt":{"s":"76","t":"Rada ds. Architektury Grupa interesariuszy i ekspertów odpowiedzialna za wytyczne odnoszące się do kwestii i decyzji dotyczących architektury korporacyjnej oraz za opracowywanie polityk i standardów w zakresie architektury.","w":"ZGODNE","u":"Część o dyrektorze na tej samej stronie: „Dyrektor ds. architektury Członek wyższej kadry kierowniczej odpowiedzialny za proces związany z architekturą korporacyjną.”"}},"q-pc-gap-07":{"id":"q-pc-gap-07","typ":"egzamin","s":"EN-02-13","t":"Który członek wyższej kadry kierowniczej odpowiada za środowiska operacyjne i infrastrukturę IT?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 76","FW-PL s. 77"],"r":null,"zap":"Trzech dyrektorów IT: rozwoju (nowe rozwiązania), operacji IT (środowiska i infrastruktura), administracji IT (zapisy i administracja).","scen":"","o":[{"t":"Dyrektor ds. operacyjnych (COO)","ok":false,"w":"COO odpowiada za funkcjonowanie całego przedsiębiorstwa, a nie za infrastrukturę IT (FW-PL s. 76)."},{"t":"Dyrektor ds. rozwoju","ok":false,"w":"Dyrektor ds. rozwoju odpowiada za procesy rozwoju rozwiązań IT (FW-PL s. 76)."},{"t":"Dyrektor ds. operacji IT","ok":true,"w":"Tak opisuje go Rysunek 33: środowiska operacyjne oraz infrastruktura IT (FW-PL s. 76)."},{"t":"Dyrektor ds. administracji IT","ok":false,"w":"Dyrektor ds. administracji IT odpowiada za zapisy i kwestie administracyjne związane z IT (FW-PL s. 77)."}],"przyklad":"W firmie przewozowej jeden szef projektuje nowe trasy (rozwój), drugi pilnuje, by autobusy jeździły i były sprawne (operacje), trzeci prowadzi dokumentację i rozliczenia floty (administracja). HACZYK: infrastruktura i środowiska operacyjne to operacje IT.","cyt":{"s":"76","t":"Dyrektor ds. operacji IT Członek wyższej kadry kierowniczej odpowiedzialny za środowiska operacyjne oraz infrastrukturę IT.","w":"ZGODNE"}},"q-pc-gap-08":{"id":"q-pc-gap-08","typ":"egzamin","s":"EN-02-13","t":"Która rola zarządza rozwojem i oceną produktów oraz usług dla określonego klienta lub grupy klientów?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 76","FW-PL s. 77"],"r":null,"zap":"Kierownik ds. usług = produkty i usługi dla konkretnej grupy klientów (użytkowników).","scen":"","o":[{"t":"Właściciel procesu biznesowego","ok":false,"w":"Właściciel procesu odpowiada za sprawność procesu, jego doskonalenie i zatwierdzanie zmian w procesie, a nie za usługi dla grupy klientów (FW-PL s. 76)."},{"t":"Kierownik ds. usług","ok":true,"w":"Tak opisuje tę rolę Rysunek 33: rozwój, wdrożenie, ocena i zarządzanie produktami i usługami dla określonego klienta lub grupy klientów (FW-PL s. 77)."},{"t":"Biuro zarządzania projektami i programami (PMO)","ok":false,"w":"PMO wspiera kierowników programów i projektów oraz raportuje o ich realizacji (FW-PL s. 77)."},{"t":"Członek naczelnego kierownictwa","ok":false,"w":"Członek naczelnego kierownictwa odpowiada za działalność całej jednostki biznesowej lub spółki zależnej (FW-PL s. 76)."}],"przyklad":"W banku kierownik ds. usług odpowiada za konto dla studentów: projektuje je, wprowadza, sprawdza, czy się sprawdza, i nim zarządza. HACZYK: „dla określonego klienta lub grupy klientów” wskazuje kierownika ds. usług.","cyt":{"s":"77","t":"Kierownik ds. usług Osoba zarządzająca rozwojem, wdrożeniem i oceną nowych oraz istniejących produktów i usług, a także zarządzaniem nimi, na rzecz określonego klienta (użytkownika) lub grupy klientów (użytkowników).","w":"ZGODNE"}},"q-pc-gap-09":{"id":"q-pc-gap-09","typ":"egzamin","s":"IM-02-01","t":"Który z poniższych należy do czynników środowiska wewnętrznego i zewnętrznego, które przedsiębiorstwo uwzględnia, projektując plan wdrożenia?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 35","FW-PL s. 36"],"r":"B","zap":"10 czynników kontekstu: etyka i kultura; przepisy, regulacje i polityki; misja, wizja i wartości; polityki i praktyki nadzoru; plan biznesowy i kierunki strategiczne; model operacyjny i dojrzałość; styl zarządzania; apetyt na ryzyko; potencjał i zasoby; praktyki w branży.","scen":"","o":[{"t":"Praktyki stosowane w branży","ok":true,"w":"Praktyki stosowane w branży są na liście dziesięciu czynników kontekstu przedsiębiorstwa w rozdziale 7 (FW-PL s. 35)."},{"t":"Istotne incydenty związane z ryzykiem IT, np. utrata danych","ok":false,"w":"To przykład punktu zapalnego, czyli problemu, który skłania do działania, a nie czynnika kontekstu (FW-PL s. 36)."},{"t":"Skupienie się na szybkich korzyściach","ok":false,"w":"To jeden z kluczowych czynników sukcesu wdrożenia, a nie czynnik kontekstu przedsiębiorstwa (FW-PL s. 36)."},{"t":"Problemy z realizacją usług w ramach outsourcingu","ok":false,"w":"To przykład punktu zapalnego (FW-PL s. 36)."}],"przyklad":"Plan remontu zależy od tego, jaki masz dom, budżet, gust i jakie są normy budowlane – to kontekst. Cieknący dach to punkt zapalny, a dobry kierownik budowy to czynnik sukcesu. HACZYK: kontekst opisuje, jakie jest przedsiębiorstwo, a punkt zapalny – co boli.","cyt":{"s":"35","t":"praktyki stosowane w branży.","w":"ZGODNE","u":"Ostatni punkt listy czynników środowiska wewnętrznego i zewnętrznego; pozostałe opcje to punkty zapalne (s. 36) i kluczowy czynnik sukcesu (s. 36)."}},"q-pc-gap-10":{"id":"q-pc-gap-10","typ":"egzamin","s":"IM-02-01","t":"Który zestaw zawiera wyłącznie czynniki środowiskowe uwzględniane w planie wdrożenia?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 35","FW-PL s. 36"],"r":null,"zap":"Nie mieszaj trzech list z rozdziału 7: czynniki kontekstu (jakie jest przedsiębiorstwo), kluczowe czynniki sukcesu (co pomaga wdrożeniu) oraz punkty zapalne i zdarzenia inicjujące (co skłania do działania).","scen":"","o":[{"t":"Misja, wizja i wartości; fuzja firm; styl zarządzania","ok":false,"w":"Fuzja to zdarzenie inicjujące, a nie czynnik kontekstu (FW-PL s. 37)."},{"t":"Apetyt na ryzyko; niezgodność z regulacjami; etyka i kultura","ok":false,"w":"Niespełnienie wymagań regulacyjnych to punkt zapalny. Czynnikiem kontekstu są same obowiązujące przepisy i regulacje (FW-PL s. 35–36)."},{"t":"Misja, wizja i wartości; polityki Ładu; plan biznesowy","ok":true,"w":"Wszystkie trzy (misja, wizja i wartości; polityki i praktyki Ładu – w podręczniku „nadzoru”; plan biznesowy i strategiczne kierunki działania) są na liście czynników środowiska wewnętrznego i zewnętrznego, które trzeba uwzględnić w planie wdrożenia (FW-PL s. 35)."},{"t":"Etyka i kultura; zaangażowanie kierownictwa; model operacyjny","ok":false,"w":"Widoczne zaangażowanie kierownictwa najwyższego szczebla to kluczowy czynnik sukcesu wdrożenia, a nie czynnik kontekstu (FW-PL s. 35)."}],"przyklad":"Przed przeprowadzką spisujesz: ile osób mieszka, jaki masz budżet, jakie macie zwyczaje – to kontekst. Zalanie mieszkania to punkt zapalny, nowa praca w innym mieście to zdarzenie inicjujące. HACZYK: w każdej błędnej odpowiedzi jest jeden element z innej listy.","cyt":{"s":"35","t":"misja, wizja i wartości; • polityki i praktyki w zakresie nadzoru; • plan biznesowy i strategiczne kierunki działania;","w":"ZGODNE"}},"q-pc-gap-11":{"id":"q-pc-gap-11","typ":"egzamin","s":"EN-02-04","t":"Który aspekt cyklu życia polityk zapewnia, że pracownicy stosują jej aktualną wersję?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 68"],"r":null,"zap":"Cykl życia poli
