oblemów i okazji","ok":false,"w":"Należy: zarządzanie programem, faza 2 (rys. 17, s. 38)."},{"t":"Komunikowanie rezultatu","ok":true,"w":"To aktywowanie zmiany w fazie 3 (rys. 17, s. 38)."}]},"q-pc-impc-071":{"id":"q-pc-impc-071","typ":"egzamin","s":"IM-02-07","t":"Które działanie NIE wchodzi w skład fazy 7 cyklu życia wdrożenia?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 38, Rys. 17"],"r":"B","zap":"Faza 7: Przegląd skuteczności · Utrzymanie · Monitorowanie i szacowanie.","scen":"","o":[{"t":"Realizacja korzyści","ok":true,"w":"To zarządzanie programem w fazie 6 (rys. 17, s. 38)."},{"t":"Przegląd skuteczności","ok":false,"w":"Należy: program, faza 7 (rys. 17)."},{"t":"Utrzymanie","ok":false,"w":"Należy: aktywowanie zmiany, faza 7 (rys. 17)."},{"t":"Monitorowanie i szacowanie","ok":false,"w":"Należy: ciągłe doskonalenie, faza 7 (rys. 17)."}]},"q-pc-impc-076":{"id":"q-pc-impc-076","typ":"egzamin","s":"PC-01-01","t":"Który poziom zdolności opisuje proces działający w zdefiniowanych limitach, by osiągać swoje rezultaty?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 42"],"r":"B","zap":"Poziom 4 – proces przewidywalny: działa w zdefiniowanych limitach.","scen":"","o":[{"t":"Proces przewidywalny","ok":true,"w":"Poziom 4: proces ustanowiony działa w zdefiniowanych limitach (s. 42)."},{"t":"Proces ustanowiony","ok":false,"w":"Poziom 3: proces realizowany według zdefiniowanego procesu (s. 42)."},{"t":"Proces zoptymalizowany","ok":false,"w":"Poziom 5: proces nieustannie doskonalony (s. 42)."},{"t":"Proces zarządzany","ok":false,"w":"Poziom 2: planowanie, monitorowanie i dostosowanie (s. 42)."}]},"q-pc-impc-081":{"id":"q-pc-impc-081","typ":"egzamin","s":"PC-01-01","t":"Którego poziomu charakterystyką jest wdrażanie procesu według standardowego procesu organizacji, dopasowywanego do danego wykonania?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 42"],"r":"A","zap":"To charakterystyka poziomu 3. Formalne przyznanie poziomu wymaga też PA 3.1 i 3.2 na W/P oraz  można zrobić na podstawie oceny?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 42","FW-PL s. 45"],"r":"A","zap":"Brak poziomu 1 → ustal brakujące praktyki i zaplanuj doskonalenie.","scen":"","o":[{"t":"Pominąć proces, bo poziom 1 nie ma znaczenia","ok":false,"w":"Odwrotnie: poziom 1 jest bardzo ważny i stanowi fundament wyższych (s. 45)."},{"t":"Od razu przejść do oceny atrybutów poziomu 2","ok":false,"w":"Można zbierać dowody dotyczące wyższych atrybutów. Nie pozwala to jednak przyznać poziomu 2 bez PA (Process Attribute — atrybut procesu) 1.1 osiągniętego w pełni. Najpierw należy rozpoznać braki w osiąganiu celu procesu (s. 42, 45)."},{"t":"Zastąpić ocenę analizą kosztów i korzyści procesu","ok":false,"w":"Podręcznik wskazuje plan doskonalenia oparty na ocenie praktyk (s. 45)."},{"t":"Ustalić brakujące praktyki i zaplanować doskonalenie","ok":true,"w":"Strona 45: ocena praktyk wskazuje braki, co pozwala zdefiniować plan doskonalenia."}]},"q-pc-impc-123":{"id":"q-pc-impc-123","typ":"egzamin","s":"PC-02-02","t":"Samoocena według Przewodnika Samooceny dała procesowi sklepu internetowego poziom 2. Jak traktować ten wynik?","k":false,"st":"autorskie","src":"","z":["PeopleCert Syllabus — PC-02-02","FW-PL s. 43"],"r":"A","zap":"Samoocena służy prostszemu rozpoznaniu sytuacji i może przygotować ocenę formalną. Przewodnik Asesora opisuje formalną procedurę; dokument sam nie nadaje wyniku.","scen":"","o":[{"t":"Jako formalny wynik do certyfikacji","ok":false,"w":"Mniej rygorystyczna samoocena nie jest równoważna formalnej ocenie prowadzonej według Przewodnika Asesora. Sam wynik poziomu nie oznacza automatycznej certyfikacji."},{"t":"Jako orientacyjny, przed formalną oceną","ok":true,"w":"To orientacyjny wynik mniej rygorystycznej samooceny, mogący pomóc przygotować formalną ocenę. Znaczenie wyniku zależy też od jakości dowodów i zakresu oceny."},{"t":"Jako nieważny, bo samoocena nie korzysta z PAM","ok":false,"w":"Oba przewodniki opierają się na PAM (Process Assessment Model — Model Oceny Procesu) (sylabus)."},{"t":"Jako poziom dojrzałości według COBIT 4.1","ok":false,"w":"Wyników zdolności nie da się prosto przenieść na skalę dojrzałości (s. 43)."}]},"q-pc-impc-128":{"id":"q-pc-impc-128","typ":"egzamin","s":"PC-02-03","t":"Wymagania której normy muszą spełniać opisy procesów w Referencyjnym Modelu Procesu COBIT 5?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 43"],"r":null,"zap":"Opisy procesów w PRM spełniają wymagania ISO/IEC 15504-2.","scen":"","o":[{"t":"ISO/IEC 27001","ok":false,"w":"To norma bezpieczeństwa informacji; podręcznik wskazuje ISO/IEC 15504:2 (s. 43)."},{"t":"Żadnej – opisy procesów można tworzyć dowolnie","ok":false,"w":"Opisy muszą zawierać cel i rezultaty, bez cech wyższych poziomów (s. 43)."},{"t":"Modelu dojrzałości COBIT 4.1","ok":false,"w":"To nie norma; COBIT 5 zrezygnował z modeli dojrzałości dla procesów (s. 43)."},{"t":"ISO/IEC 15504-2","ok":true,"w":"Strona 43: opis każdego ocenianego procesu musi spełniać wymagania dla modelu referencyjnego procesu z ISO/IEC 15504:2."}]},"q-pc-impc-131":{"id":"q-pc-impc-131","typ":"egzamin","s":"PC-02-03","t":"Który model stanowi źródło specyficznego opisu procesu DSS02, jego przeznaczenia i rezultatów, rozwiniętych w praktyki bazowe w modelu oceny?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 39","FW-PL s. 43","FW-PL s. 45","PeopleCert Syllabus — PC-02-03"],"r":"A","zap":"PRM: procesy, przeznaczenie i rezultaty. PAM: model oceny, który wykorzystuje PRM i wskaźniki wykonania oraz wymiar zdolności.","scen":"","o":[{"t":"Z Referencyjnego Modelu Procesu","ok":true,"w":"PRM (Process Reference Model — Referencyjny Model Procesu) określa proces DSS02, jego przeznaczenie i rezultaty. PAM (Process Assessment Model — Model Oceny Procesu) rozwija wymiar procesu o specyficzne wskaźniki wykonania, w tym praktyki bazowe i produkty pracy (s. 43, 45)."},{"t":"Z Przewodnika Samooceny","ok":false,"w":"Przewodnik Samooceny opisuje prostszy sposób oceny i może odwoływać się do treści modeli. Źródłem specyficznego opisu procesu jest jednak PRM (Process Reference Model — Referencyjny Model Procesu), rozwinięty w PAM (Process Assessment Model — Model Oceny Procesu)."},{"t":"Z ogólnych praktyk ISO/IEC 15504-2","ok":false,"w":"Ogólne praktyki są wspólne dla wszystkich procesów (s. 43, 45)."},{"t":"Z uzasadnienia biznesowego wdrożenia","ok":false,"w":"Uzasadnienie dotyczy inicjatywy, nie opisu procesu (s. 39)."}]},"q-pc-impc-141":{"id":"q-pc-impc-141","typ":"egzamin","s":"PC-02-04","t":"Dla którego poziomu praktyki bazowe i produkty pracy konkretnego procesu stanowią specyficzne wskaźniki osiągania rezultatów?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 43","FW-PL s. 45","FW-PL s. 42, Rys. 19","PeopleCert Syllabus — PC-02-04"],"r":"B","zap":"Praktyki bazowe i produkty pracy wspierają ocenę wykonania na poziomie 1. Dowody z procesu mogą być także użyteczne przy ocenie innych atrybutów.","scen":"","o":[{"t":"Poziomu 1 – procesu wykonywanego","ok":true,"w":"Praktyki bazowe i produkty pracy to wskaźniki poziomu 1 (s. 45, sylabus)."},{"t":"Poziomu 2 – procesu zarządzanego","ok":false,"w":"Poziom 2 ocenia się atrybutami PA (Process Attribute — atrybut procesu) 2.1 i PA 2.2 (rys. 19)."},{"t":"Poziomu 3 – procesu ustanowionego","ok":false,"w":"Poziom 3 ocenia się atrybutami PA (Process Attribute — atrybut procesu) 3.1 i PA 3.2 (rys. 19)."},{"t":"Wszystkich poziomów od 2 do 5","ok":false,"w":"Poziomy 2–5 ocenia się ogólnymi wskaźnikami zdolności (s. 43, 45)."}]},"q-pc-impc-147":{"id":"q-pc-impc-147","typ":"egzamin","s":"PC-02-05","t":"Co NIE jest korzyścią podejścia COBIT 5 do oceny zdolności?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 43","FW-PL s. 44","FW-PL s. 45"],"r":"B","zap":"Wyników COBIT 5 i COBIT 4.1 nie da się prosto porównać.","scen":"","o":[{"t":"Uproszczenie przez wyeliminowanie powielania treści","ok":false,"w":"To korzyść (s. 44)."},{"t":"Zgodność z ogólnie akceptowanym standardem oceny","ok":false,"w":"To korzyść (s. 45)."},{"t":"Podstawa do bardziej formalnej, rygorystycznej oceny procesów","ok":false,"w":"To korzyść (s. 44–45)."},{"t":"Proste porównanie wyników z ocenami dojrzałości COBIT 4.1","ok":true,"w":"Porównanie takie jest trudne ze względu na różnice w zakresie i intencjach (s. 43)."}]},"q-pc-impc-157":{"id":"q-pc-impc-157","typ":"egzamin","s":"PC-02-06","t":"Proces w szpitalu ma oceny PA 1.1 = W, PA 2.1 = W, PA 2.2 = P. Która minimalna zmiana ocen jest konieczna, by uzyskać poziom 2?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 42","PeopleCert Syllabus — PC-02-06"],"r":"B","zap":"Do poziomu 2 potrzebne PA 1.1 = P oraz PA 2.1 i 2.2 na W/P.","scen":"","o":[{"t":"Podnieść ocenę PA 2.1 do P","ok":false,"w":"Dla atrybutów poziomu 2 wystarczy W (s. 42)."},{"t":"Nic – proces ma już poziom 2","ok":false,"w":"PA (Process Attribute — atrybut procesu) 1.1 = W to za mało, by wejść na poziom 2 (s. 42)."},{"t":"Podnieść wszystkie trzy atrybuty do P","ok":false,"w":"Pełne osiągnięcie wszystkich trzech również spełniłoby warunek. Nie jest to jednak zmiana minimalna: PA (Process Attribute — atrybut procesu) 2.1 już ma wystarczające W, a PA 2.2 ma P (s. 42)."},{"t":"Podnieść ocenę PA 1.1 do P","ok":true,"w":"Poziom 2 wymaga PA (Process Attribute — atrybut procesu) 1.1 = P; PA 2.1 = W i PA 2.2 = P już wystarczą (s. 42)."}]},"q-pc-pr-004":{"id":"q-pc-pr-004","typ":"egzamin","s":"PR-01-01","t":"Ministerstwo obejmuje Ładem także usługi IT zewnętrznych dostawców. Którą zasadę realizuje?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 14","FW-PL s. 23"],"r":"A","zap":"Zasada 2 — Pokrycie całej organizacji: Ład IT (Information Technology — technologie informacyjne) jest częścią Ładu organizacji; obejmuje wszystkie istotne funkcje, procesy oraz wewnętrzne i zewnętrzne usługi IT. Informacja i technologia są aktywami organizacji, a nie wyłączną sprawą działu IT.","scen":"","o":[{"t":"Zastosowanie Pojedynczej Zintegrowanej Struktury Ramowej","ok":false,"w":"Zasada 3 dotyczy spójności z innymi standardami, nie zasięgu Ładu (s. 25)."},{"t":"Realizacja potrzeb interesariusza","ok":false,"w":"Zasada 1 dotyczy tworzenia wartości i Kaskady Celów (s. 14)."},{"t":"Pokrycie całej organizacji","ok":true,"w":"Zasada 2 obejmuje wszystkie istotne funkcje i procesy organizacji oraz usługi informatyczne dostarczane wewnętrznie i zewnętrznie. Ład nad informacją i technologią jest częścią Ładu całej organizacji, a informację i technologię traktuje się jako aktywa organizacji."},{"t":"Oddzielenie Ładu od Zarządzania","ok":false,"w":"Zasada 5 rozdziela działania Ładu i Zarządzania, nie określa zasięgu (s. 14)."}]},"q-pc-pr-005":{"id":"q-pc-pr-005","typ":"egzamin","s":"PR-01-01","t":"Uzupełnij nazwę zasady: Zastosowanie Pojedynczej [?] Struktury Ramowej.","k":false,"st":"autorskie","src":"","z":["FW-PL s. 14","FW-PL s. 25"],"r":"B","zap":"Zasada 3: Zastosowanie Pojedynczej Zintegrowanej Struktury Ramowej.","scen":"","o":[{"t":"Zintegrowanej","ok":true,"w":"Pełna nazwa Zasady 3: Zastosowanie Pojedynczej Zintegrowanej Struktury Ramowej (s. 14, 25)."},{"t":"Holistycznej","ok":false,"w":"„Holistyczne” pochodzi z Zasady 4 – Aktywacja holistycznego podejścia (s. 14)."},{"t":"Całościowej","ok":false,"w":"„Całościowe” to podręcznikowe słowo z nazwy Zasady 4, nie Zasady 3 (s. 14)."},{"t":"Nadrzędnej","ok":false,"w":"COBIT 5 może być strukturą nadrzędną, ale nazwa zasady mówi „Zintegrowanej” (s. 25)."}]},"q-pc-pr-014":{"id":"q-pc-pr-014","typ":"egzamin","s":"PR-01-02","t":"Który element NIE jest kategorią aktywatora COBIT 5?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 27"],"r":"B","zap":"7 aktywatorów: zasady/polityki, procesy, struktury, kultura, informacja, usługi, ludzie.","scen":"","o":[{"t":"Struktury organizacyjne","ok":false,"w":"To aktywator nr 3 (s. 27)."},{"t":"Procesy","ok":false,"w":"To aktywator nr 2 (s. 27)."},{"t":"Ryzyko i zgodność","ok":true,"w":"Nie ma takiej kategorii; siedem aktywatorów wymieniono na s. 27."},{"t":"Informacja","ok":false,"w":"To aktywator nr 5 (s. 27)."}]},"q-pc-pr-016":{"id":"q-pc-pr-016","typ":"egzamin","s":"PR-01-02","t":"Bank ma jasno opisaną politykę bezpieczeństwa; pracownicy znają zasady i potrafią je stosować, lecz świadomie je lekceważą. Który aktywator wymaga tu przede wszystkim poprawy?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 28"],"r":"A","zap":"Dobra polityka nie zadziała bez kultury i etyki.","scen":"","o":[{"t":"Informacja","ok":false,"w":"Informacja nadal wspiera bezpieczeństwo, ale opis podkreśla świadome lekceważenie znanych reguł, a więc postawy i zachowania."},{"t":"Kultura, Etyka i Zachowanie","ok":true,"w":"Bez właściwej kultury i etyki procesy bezpieczeństwa nie będą skuteczne (s. 28, przykład 4)."},{"t":"Struktury organizacyjne","ok":false,"w":"Struktury także mogą wymagać działania. Bezpośrednim problemem wskazanym w scenariuszu są jednak postawy pracowników."},{"t":"Procesy","ok":false,"w":"Procesy współdziałają z kulturą. Scenariusz akcentuje świadome zachowania, a nie brak opisu praktyk."}]},"q-pc-pr-022":{"id":"q-pc-pr-022","typ":"egzamin","s":"PR-01-03","t":"Ile procesów ma Ład w Referencyjnym Modelu Procesu?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 32","FW-PL s. 33"],"r":"B","zap":"EDM = 5 procesów; razem 37.","scen":"","o":[{"t":"Trzynaście","ok":false,"w":"13 procesów ma domena APO (Align, Plan and Organise — Dostosuj, Planuj i Organizuj) (s. 33)."},{"t":"Cztery","ok":false,"w":"Cztery to liczba domen Zarządzania (APO (Align, Plan and Organise — Dostosuj, Planuj i Organizuj), BAI (Build, Acquire and Implement — Twórz, Nabywaj i Wdrażaj), DSS (Deliver, Service and Support — Dostarczaj, Obsługuj i Wspieraj), MEA (Monitor, Evaluate and Assess — Monitoruj, Oszacuj i Oceń)) (s. 32)."},{"t":"Pięć","ok":true,"w":"Domena Ładu obejmuje pięć procesów EDM01 (Ensure Governance Framework Setting and Maintenance — Zapewnienie ustanowienia i utrzymania struktury ramowej Ładu)–EDM05 (Ensure Stakeholder Transparency — Zapewnienie transparentności interesariuszy) (s. 32–33)."},{"t":"Trzydzieści siedem","ok":false,"w":"37 to wszystkie procesy Ładu i Zarządzania razem (s. 33)."}]},"q-pc-pr-024":{"id":"q-pc-pr-024","typ":"egzamin","s":"PR-01-03","t":"Uzupełnij nazwę EDM01: Zapewnienie ustanowienia i utrzymania struktury ramowej [?].","k":false,"st":"autorskie","src":"","z":["FW-PL s. 33","Enabling Processes s. 27"],"r":null,"zap":"EDM01 dotyczy struktury ramowej Ładu, jej ustanowienia i utrzymania, a nie tylko ogólnego zapewnienia Ładu.","scen":"","o":[{"t":"ryzyka","ok":false,"w":"Ryzyko to EDM03 (Ensure Risk Optimisation — Zapewnienie optymalizacji ryzyka) (s. 33)."},{"t":"Ładu","ok":true,"w":"EDM01 (Ensure Governance Framework Setting and Maintenance — Zapewnienie ustanowienia i utrzymania struktury ramowej Ładu) to Ensure Governance Framework Setting and Maintenance: ustanowienie i utrzymanie struktury ramowej Ładu. polski podręcznik COBIT 5 s. 33 używa skróconej nazwy „Zapewnienie i utrzymanie ładu korporacyjnego”."},{"t":"zarządzania","ok":false,"w":"Domena EDM (Evaluate, Direct and Monitor — Oszacuj, Kieruj i Monitoruj) dotyczy Ładu, nie Zarządzania (s. 32–33)."},{"t":"portfela","ok":false,"w":"Portfel to APO05 (Manage Portfolio — Zarządzanie portfelem) (s. 33)."}]},"q-pc-pr-025":{"id":"q-pc-pr-025","typ":"egzamin","s":"PR-01-03","t":"Organ Ładu gminy chce przejrzystego raportowania wyników IT dla mieszkańców. Który proces?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 33"],"r":"A","zap":"Transparentność wobec interesariuszy = EDM05.","scen":"","o":[{"t":"MEA01 Monitorowanie, ocena i oszacowanie wydajności i zgodności","ok":false,"w":"MEA01 (Monitor, Evaluate and Assess Performance and Conformance — Monitorowanie, ocena i oszacowanie wydajności i zgodności) dostarcza monitorowania i ocen, które mogą zasilać raportowanie. Zapewnienie przejrzystości wobec interesariuszy na poziomie Ładu to jednak EDM05 (Ensure Stakeholder Transparency — Zapewnienie transparentności interesariuszy) (s. 33)."},{"t":"EDM05 Zapewnienie Transparentności Interesariuszy","ok":true,"w":"Przejrzystość wobec interesariuszy to EDM05 (Ensure Stakeholder Transparency — Zapewnienie transparentności interesariuszy) (s. 33)."},{"t":"EDM01 Zapewnienie ustanowienia i utrzymania struktury ramowej Ładu","ok":false,"w":"EDM01 (Ensure Governance Framework Setting and Maintenance — Zapewnienie ustanowienia i utrzymania struktury ramowej Ładu) dotyczy ustanowienia systemu Ładu (s. 33)."},{"t":"EDM02 Zapewnienie realizacji korzyści","ok":false,"w":"Korzyści również należy przejrzyście raportować. Proces, którego głównym tematem jest transparentność wobec interesariuszy, to EDM05 (Ensure Stakeholder Transparency — Zapewnienie transparentności interesariuszy) (s. 33)."}]},"q-pc-pr-026":{"id":"q-pc-pr-026","typ":"egzamin","s":"PR-01-04","t":"Do której domeny należy proces Zarządzanie zmianami?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 33"],"r":"B","zap":"Zarządzanie zmianami = BAI06 (Twórz, Nabywaj i Wdrażaj).","scen":"","o":[{"t":"Dostosuj, Planuj i Organizuj","ok":false,"w":"W APO (Align, Plan and Organise — Dostosuj, Planuj i Organizuj) są m.in. strategia, architektura, ryzyko (s. 33)."},{"t":"Twórz, Nabywaj i Wdrażaj","ok":true,"w":"Zarządzanie zmianami to BAI06 (Manage Changes — Zarządzanie zmianami) (s. 33)."},{"t":"Dostarczaj, Obsługuj i Wspieraj","ok":false,"w":"W DSS (Deliver, Service and Support — Dostarczaj, Obsługuj i Wspieraj) są m.in. eksploatacja, incydenty, problemy (s. 33)."},{"t":"Monitoruj, Oszacuj i Oceń","ok":false,"w":"MEA (Monitor, Evaluate and Assess — Monitoruj, Oszacuj i Oceń) ma trzy procesy monitorowania (s. 33)."}]},"q-pc-pr-029":{"id":"q-pc-pr-029","typ":"egzamin","s":"PR-01-04","t":"Który proces NIE należy do domeny Dostosuj, Planuj i Organizuj?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 33"],"r":"A","zap":"Ciągłość = DSS04; bezpieczeństwo (zarządzanie) = APO13.","scen":"","o":[{"t":"Zarządzanie ciągłością","ok":true,"w":"To DSS04 (Manage Continuity — Zarządzanie ciągłością) (s. 33)."},{"t":"Zarządzanie innowacjami","ok":false,"w":"To APO04 (Manage Innovation — Zarządzanie innowacjami) (s. 33)."},{"t":"Zarządzanie jakością","ok":false,"w":"To APO11 (Manage Quality — Zarządzanie jakością) (s. 33)."},{"t":"Zarządzanie bezpieczeństwem","ok":false,"w":"To APO13 (Manage Security — Zarządzanie bezpieczeństwem); usługi bezpieczeństwa to DSS05 (Manage Security Services — Zarządzanie usługami bezpieczeństwa) (s. 33)."}]},"q-pc-pr-034":{"id":"q-pc-pr-034","typ":"egzamin","s":"PR-01-05","t":"Na czym opiera się odpowiadanie na pytania o wydajność aktywatora?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 29"],"r":null,"zap":"Wydajność aktywatora: regularne monitorowanie na podstawie mierników.","scen":"","o":[{"t":"Na ocenie dojrzałości z COBIT 4.1","ok":false,"w":"Model aktywatora nie korzysta z modelu dojrzałości COBIT 4.1 (s. 29)."},{"t":"Na opinii interesariuszy zewnętrznych","ok":false,"w":"Za wąsko – liczą się mierniki dla wszystkich czterech pytań (s. 29)."},{"t":"Na regularnym monitorowaniu mierników","ok":true,"w":"Wymaga regularnego monitorowania i odpowiedzi na podstawie mierników (s. 29)."},{"t":"Na jednorazowym audycie zewnętrznym","ok":false,"w":"Podręcznik mówi o regularnym monitorowaniu, nie jednorazowym audycie (s. 29)."}]},"q-pc-pr-035":{"id":"q-pc-pr-035","typ":"egzamin","s":"PR-01-05","t":"Pytanie „Czy cele aktywatora są osiągane?” wiąże się z którym wymiarem?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 28"],"r":"B","zap":"Każde z 4 pytań = jeden wymiar aktywatora.","scen":"","o":[{"t":"Cele","ok":true,"w":"Każdemu z czterech pytań odpowiada jeden wymiar aktywatora; to pytanie – wymiarowi Cele (s. 28)."},{"t":"Cykl życia","ok":false,"w":"Wymiarowi Cykl życia odpowiada pytanie o zarządzanie cyklem życia (s. 28)."},{"t":"Dobre praktyki","ok":false,"w":"Wymiarowi Dobre praktyki odpowiada pytanie o stosowanie praktyk (s. 28)."},{"t":"Interesariusze","ok":false,"w":"Wymiarowi Interesariusze odpowiada pyt -pr-074","typ":"egzamin","s":"PR-02-04","t":"Cel „Zgodność z przepisami prawa i regulacjami” ma relację P wyłącznie z… Odpowiedz zgodnie z mapowaniem Rysunku 5.","k":false,"st":"autorskie","src":"","z":["FW-PL s. 19","FW-PL s. 20"],"r":"B","zap":"Zgodność z przepisami → P z optymalizacją ryzyka. P/S opisują typowe relacje modelu, nie ocenę realizacji celu ani uniwersalny zakaz innych powiązań.","scen":"","o":[{"t":"optymalizacją zasobów","ok":false,"w":"Na Rysunku 5 przy celu 4 i optymalizacji zasobów nie oznaczono istotnego powiązania. To odczyt konkretnej macierzy, nie twierdzenie, że zgodność nigdy nie wpływa na wykorzystanie zasobów."},{"t":"optymalizacją ryzyka","ok":true,"w":"Na Rysunku 5 cel organizacji 4 ma relację P (Primary — powiązanie podstawowe) z optymalizacją ryzyka. W pozostałych dwóch kolumnach tego wiersza nie ma oznaczonej relacji. Mapowanie jest wytyczną do dostosowania."},{"t":"wszystkimi trzema celami Ładu","ok":false,"w":"Podstawowe powiązanie ze wszystkimi trzema celami Ładu ma w tej macierzy cel 9 — świadome podejmowanie decyzji strategicznych na podstawie informacji."},{"t":"realizacją korzyści","ok":false,"w":"Na Rysunku 5 przy realizacji korzyści w wierszu celu 4 nie oznaczono istotnego powiązania. Organizacja dostosowuje typowe mapowanie do własnego kontekstu."}]},"q-pc-pr-075":{"id":"q-pc-pr-075","typ":"egzamin","s":"PR-02-04","t":"Który cel organizacji ma relację P ze wszystkimi trzema celami Ładu? Odpowiedz zgodnie z mapowaniem Rysunku 5.","k":false,"st":"autorskie","src":"","z":["FW-PL s. 19","FW-PL s. 20"],"r":"A","zap":"Cel 9 (decyzje na podstawie informacji) = P, P, P. P/S opisują typowe relacje modelu, nie ocenę realizacji celu ani uniwersalny zakaz innych powiązań.","scen":"","o":[{"t":"Świadome decyzje strategiczne na podstawie informacji","ok":true,"w":"Cel 9 ma P (Primary — powiązanie podstawowe) przy korzyściach, ryzyku i zasobach (s. 19)."},{"t":"Zgodność z politykami wewnętrznymi","ok":false,"w":"Cel 15 ma P (Primary — pow n łączy właścicieli z organem Ładu, zaś Report role operacyjne z kierownictwem. Nie tworzą one pary między kierownictwem a rolami operacyjnymi."}]},"q-pc-pr-117":{"id":"q-pc-pr-117","typ":"egzamin","s":"PR-02-09","t":"Administratorzy systemów urzędu przekazują kierownikowi raport z incydentów. Jaką rolę pełnią?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 24"],"r":"A","zap":"Wykonują i raportują = Role operacyjne.","scen":"","o":[{"t":"Kierownictwo średniego szczebla","ok":false,"w":"To odbiorca raportu, nie nadawca (s. 24)."},{"t":"Organ Ładu","ok":false,"w":"Organ Ładu wyznacza kierunek (s. 24)."},{"t":"Właściciele i interesariusze","ok":false,"w":"Oni delegują (s. 24)."},{"t":"Role operacyjne","ok":true,"w":"Role operacyjne wykonują zadania i raportują do Kierownictwa (s. 24)."}]},"q-pc-pr-123":{"id":"q-pc-pr-123","typ":"egzamin","s":"PR-02-10","t":"Co, według przypisu 4 w podręczniku COBIT 5 z 2012 r., stało się z inicjatywą Taking Governance Forward (TGF)?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 23","FW-PL s. 33"],"r":null,"zap":"TGF włączono do COBIT 5 i wycofano.","scen":"","o":[{"t":"Stała się przewodnikiem COBIT 5 – Ryzyko","ok":false,"w":"To osobny przewodnik specjalistyczny (s. 26)."},{"t":"Działa nadal jako osobny zasób","ok":false,"w":"Przypis 4 mówi o włączeniu pojęć TGF (Taking Governance Forward — inicjatywa rozwoju podejścia do Ładu) do COBIT 5 i wycofaniu inicjatywy. Pytanie dotyczy tego historycznego opisu (s. 23)."},{"t":"Zastąpiła COBIT 4.1","ok":false,"w":"COBIT 5 jest następcą COBIT 4.1. Pojęcia inicjatywy TGF (Taking Governance Forward — inicjatywa rozwoju podejścia do Ładu) włączono do COBIT 5, a odrębną inicjatywę wycofano."},{"t":"Włączono ją do COBIT 5 i wycofano","ok":true,"w":"Pojęcia TGF (Taking Governance Forward — inicjatywa rozwoju podejścia do Ładu) włączono do COBIT 5, a TGF wycofano (s. 23, przypis 4)."}]},"q-pc-pr-125":{"id":"q-pc-pr-125","typ":"egzamin","s":"PR-02-10","t":"Który przewodnik NIE jest przewodnikiem specjalistycznym COBIT 5?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 26"],"r":"A","zap":"Procesy umożliwiające = przewodnik aktywatora; Wdrożenie, Ryzyko = specjalistyczne.","scen":"","o":[{"t":"COBIT 5 – Ryzyko","ok":false,"w":"Przewodnik specjalistyczny (s. 26)."},{"t":"COBIT 5 – Bezpieczeństwo informacji","ok":false,"w":"Przewodnik specjalistyczny (s. 26)."},{"t":"COBIT 5 – Procesy umożliwiające","ok":true,"w":"To przewodnik dotyczący aktywatorów, nie specjalistyczny (s. 26)."},{"t":"COBIT 5 – Wdrożenie","ok":false,"w":"Przewodnik specjalistyczny (s. 26)."}]},"q-pc-pr-131":{"id":"q-pc-pr-131","typ":"egzamin","s":"PR-02-11","t":"Jakim językiem sformułowano wytyczne wskazane jako atut jednej nadrzędnej struktury ramowej COBIT 5?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 25"],"r":null,"zap":"Wytyczne COBIT 5 – przystępne dla nietechnicznych.","scen":"","o":[{"t":"Prawniczym, dla działu zgodności","ok":false,"w":"COBIT może być wykorzystywany przez dział zgodności, ale podany atut to przystępność języka dla szerokiego grona odbiorców."},{"t":"Formalnym, zgodnym z normami ISO","ok":false,"w":"Spójność ze standardami nie oznacza, że wskazanym atutem jest specjalistyczny język formalny. Podręcznik akcentuje przystępność."},{"t":"Technicznym, dla specjalistów IT","ok":false,"w":"Materiały mogą zawierać zagadnienia techniczne, ale wskazany atut to język zrozumiały także dla osób bez wiedzy technicznej."},{"t":"Przystępnym dla odbiorców bez wiedzy technicznej","ok":true,"w":"COBIT 5 łączy wytyczne w spójne źródło napisane przystępnym językiem, także dla odbiorców bez specjalistycznej wiedzy technicznej. Jest to jeden z powodów, dla których może stanowić jedną nadrzędną strukturę ramową."}]},"q-pc-pr-134":{"id":"q-pc-pr-134","typ":"egzamin","s":"PR-02-11","t":"Gmina chce jednego źródła wytycznych zamiast kilku struktur ISACA. Który atut COBIT 5 odpowiada?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 25"],"r":"B","zap":"Jedno źródło zamiast wielu struktur ISACA = Zasada 3.","scen":"","o":[{"t":"Oddziela Ład od Zarządzania","ok":false,"w":"To Zasada 5 (s. 31)."},{"t":"Łączy wiedzę z wcześniejszych struktur ISACA","ok":true,"w":"COBIT 5 zawiera wiedzę z COBIT, Val IT, Risk IT, BMIS (Business Model for Information Security — biznesowy model bezpieczeństwa informacji), ITAF (Information Technology Assurance Framework — struktura ramowa zapewnienia dotycząca technologii informacyjnych) (s. 25)."},{"t":"Opiera się na Kaskadzie Celów","ok":false,"w":"To Zasada 1 (s. 17)."},{"t":"Definiuje siedem aktywatorów","ok":false,"w":"To Zasada 4 (s. 27)."}]},"q-pc-pr-140":{"id":"q-pc-pr-140","typ":"egzamin","s":"PR-02-12","t":"Dane pacjentów szpitala widzą tylko uprawnieni lekarze. Jaka to kategoria celu aktywatora?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 29"],"r":"B","zap":"Tylko dla uprawnionych = Dostęp i Bezpieczeństwo.","scen":"","o":[{"t":"Interesariusze wewnętrzni","ok":false,"w":"To wymiar Interesariusze, nie kategoria celu (s. 28)."},{"t":"Jakość kontekstowa","ok":false,"w":"To istotność i przydatność wyników (s. 29)."},{"t":"Jakość wewnętrzna","ok":false,"w":"To dokładność i obiektywność (s. 29)."},{"t":"Dostęp i Bezpieczeństwo","ok":true,"w":"Wyniki dostępne tylko dla uprawnionych = dostęp i bezpieczeństwo (s. 29)."}]},"q-pc-pr-145":{"id":"q-pc-pr-145","typ":"egzamin","s":"PR-02-12","t":"Którą drugą możliwość opisu celu aktywatora, obok oczekiwanych wyników, wskazuje wprost FW-PL s. 29?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 29"],"r":null,"zap":"Cele aktywatora: wyniki albo zastosowanie samego aktywatora.","scen":"","o":[{"t":"liczbę jego interesariuszy wewnętrznych","ok":false,"w":"Interesariusze to inny wymiar (s. 28)."},{"t":"jego koszt zakupu","ok":false,"w":"Koszt może być elementem celu lub miernika w konkretnym kontekście. Cytowany ogólny podział rozróżnia jednak oczekiwane wyniki i zastosowanie samego aktywatora."},{"t":"jego poziom dojrzałości","ok":false,"w":"Można oceniać różne właściwości aktywatora, ale wskazany podział dotyczy oczekiwanych wyników oraz jego zastosowania. Pojęcie dojrzałości nie jest zastrzeżone wyłącznie dla COBIT 4.1."},{"t":"zastosowanie samego aktywatora","ok":true,"w":"Cele mogą dotyczyć oczekiwanych wyników lub zastosowania aktywatora (s. 29)."}]},"q-pc-pr-148":{"id":"q-pc-pr-148","typ":"egzamin","s":"PR-02-13","t":"Bank mierzy odsetek klientów zadowolonych z portalu. Jaki to wskaźnik aktywatora?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 29"],"r":"B","zap":"Zadowolenie (rezultat) = wskaźnik opóźniony.","scen":"","o":[{"t":"Opóźniony – mierzy osiągnięty rezultat","ok":true,"w":"Zadowolenie klientów pokazuje, czy osiągnięto cel – wskaźnik opóźniony (s. 29)."},{"t":"Wiodący – mierzy stosowanie dobrych praktyk","ok":false,"w":"Tu mierzymy rezultat, nie praktyki (s. 29)."},{"t":"Wiodący – mierzy cykl życia","ok":false,"w":"Tu mierzymy rezultat, nie cykl życia (s. 29)."},{"t":"Ani wiodący, ani opóźniony","ok":false,"w":"Mierniki aktywatora są wiodące albo opóźnione (s. 29)."}]},"q-pc-pr-163":{"id":"q-pc-pr-163","typ":"egzamin","s":"PR-02-14","t":"Dyrektor IT ministerstwa przygotowuje plan wdrożenia systemu kadrowego. To działanie z obszaru…","k":false,"st":"autorskie","src":"","z":["FW-PL s. 31"],"r":"B","zap":"Planowanie wdrożenia = Zarządzanie.","scen":"","o":[{"t":"Zarządzania","ok":true,"w":"Planowanie i budowanie zgodnie z kierunkiem to Zarządzanie (s. 31)."},{"t":"Organu Ładu i nadzoru","ok":false,"w":"Organ Ładu wyznacza kierunek (s. 24)."},{"t":"Interesariuszy","ok":false,"w":"Interesariusze delegują (s. 24)."},{"t":"Ładu","ok":false,"w":"Ład ocenia, kieruje i monitoruje (s. 31)."}]},"q-pc-pr-174":{"id":"q-pc-pr-174","typ":"egzamin","s":"PR-02-15","t":"Rada banku ustala apetyt na ryzyko, a kierownictwo podejmuje decyzje wdrożeniowe o zabezpieczeniach. Której pozycji tabeli interakcji Ładu i Zarządzania odpowiada ten przykład (FW-PL s. 31)?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 31"],"r":"B","zap":"Decyzje struktur Ładu ↔ decyzje wdrożeniowe = Struktury organizacyjne.","scen":"","o":[{"t":"Informacja","ok":false,"w":"Informacja to wejścia i wyjścia procesów (s. 31)."},{"t":"Struktury organizacyjne","ok":true,"w":"Interakcja decyzji struktur Ładu (np. apetyt na ryzyko) z decyzjami wdrożeniowymi (s. 31)."},{"t":"Kultura, Etyka i Zachowanie","ok":false,"w":"Kultura to przykład dawany odgórnie (s. 31)."},{"t":"Procesy","ok":false,"w":"Procesy to praktyki, działania i RACI (Responsible, Accountable, Consulted, Informed — Odpowiedzialny, Rozliczany, Konsultowany, Informowany) (s. 31)."}]},"fz-A-001":{"id":"fz-A-001","typ":"egzamin","s":"PR-02-01","t":"Czym jest COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 13","FW-PL s. 14","FW-PL s. 41"],"r":null,"zap":"","scen":"","o":[{"t":"Normą oceny zdolności procesów informatycznych","ok":false,"w":"Norma ISO/IEC (International Organization for Standardization / International Electrotechnical Commission — Międzynarodowa Organizacja Normalizacyjna / Międzynarodowa Komisja Elektrotechniczna) 15504 opisuje ocenę procesów i stanowi podstawę klasycznego modelu zdolności COBIT 5. Sam COBIT 5 jest szerszą strukturą ramową Ładu i Zarządzania IT (Information Technology — technologie informacyjne)."},{"t":"Strukturą ramową Ładu i Zarządzania IT w organizacji","ok":true,"w":"COBIT 5 jest kompleksową strukturą ramową Ładu i Zarządzania IT (Information Technology — technologie informacyjne) w organizacji. Pomaga tworzyć wartość przez równoważenie korzyści, ryzyka i wykorzystania zasobów; nie ogranicza się do jednej metody oceny lub jednego obszaru operacyjnego."},{"t":"Zbiorem praktyk bieżącego zarządzania usługami IT","ok":false,"w":"Bieżące zarządzanie usługami jest jednym z obszarów objętych COBIT 5, ale nie wyczerpuje jego zakresu. COBIT 5 obejmuje również Ład, planowanie, budowę rozwiązań oraz monitorowanie w całej organizacji."},{"t":"Metodyką prowadzenia programów i projektów IT","ok":false,"w":"Prowadzenie programów i projektów jest przedmiotem jednego z procesów Zarządzania. COBIT 5 nie jest metodyką zarządzania projektami zastępującą PRINCE2 (Projects in Controlled Environments — projekty w kontrolowanych środowiskach); może integrować takie szczegółowe metody."}],"fz":{"h":"Struktura ramowa","p":"P2","pulapka":false,"n":"≠ TŁUMACZENIE · egzamin: struktura ramowa · podr.: metodyka · EN: business framework · EN: Business framework for the governance and management of enterprise IT (Information Technology — technologie informacyjne)","q":"Czym jest COBIT 5?","a":"Kompleksową strukturą ramową (podr. metodyką) Ładu i Zarządzania IT (Information Technology — technologie informacyjne) w organizacji. Pomaga uzyskać optymalną wartość z IT przez równowagę korzyści, ryzyka i wykorzystania zasobów.","ex":"W domu rodzice ustalają, na co idą pieniądze (Ład), a ktoś robi codzienne zakupy i naprawy (Zarządzanie). COBIT 5 podpowiada jedno i drugie dla IT (Information Technology — technologie informacyjne).","org":""}},"fz-A-002":{"id":"fz-A-002","typ":"egzamin","s":"PR-02-11","t":"Dla jakich organizacji przeznaczony jest COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 13"],"r":null,"zap":"","scen":"","o":[{"t":"Dla organizacji komercyjnych o rozwiniętym systemie ładu korporacyjnego","ok":false,"w":"COBIT 5 może być stosowany w organizacji komercyjnej, ale jego przeznaczenie nie jest ograniczone do takiego sektora ani do określonego stopnia rozwoju Ładu."},{"t":"Dla organizacji publicznych o formalnej strukturze hierarchicznej","ok":false,"w":"Sektor publiczny również może korzystać z COBIT 5. Charakter ogólny frameworka nie uzależnia jego stosowania od formalnej hierarchii ani nie ogranicza go do administracji."},{"t":"Dla organizacji informatycznych świadczących usługi klientom zewnętrznym","ok":false,"w":"Firma informatyczna świadcząca usługi zewnętrzne jest jednym z możliwych użytkowników. COBIT 5 obejmuje również organizacje innych branż i organizacje korzystające z informatyki na własne potrzeby."},{"t":"Dla organizacji dowolnej wielkości i sektora","ok":true,"w":"COBIT 5 ma charakter ogólny: jest przeznaczony dla organizacji każdej wielkości, komercyjnych, non-profit i publicznych. Każda dostosowuje go do własnego kontekstu."}],"fz":{"h":"Przeznaczenie COBIT 5","p":"P2","pulapka":false,"n":"egzamin: ogólny, każda wielkość · podr.: ogólny, każda wielkość · EN: generic, all sizes · EN: Generic, for all sizes, commercial, not-for-profit, public sector","q":"Dla jakich organizacji przeznaczony jest COBIT 5?","a":"Dla organizacji każdej wielkości: komercyjnych, non-profit i z sektora publicznego. Ma charakter ogólny.","ex":"Pasuje wszędzie: od osiedlowego sklepu po urząd i straż pożarną. Haczyk: „ogólny” znaczy rozmiar uniwersalny, każdy dopasowuje go do siebie.","org":"sklep internetowy i komenda straży pożarnej korzystają z tego samego modelu."}},"fz-A-003":{"id":"fz-A-003","typ":"egzamin","s":"PR-02-11","t":"Do której części rodziny produktów COBIT 5 należy przewodnik „COBIT 5: Procesy umożliwiające”?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 11","FW-PL s. 26"],"r":null,"zap":"","scen":"","o":[{"t":"Do przewodników specjalistycznych","ok":false,"w":"Przewodniki specjalistyczne to np. Wdrożenie, Bezpieczeństwo informacji, Audyt, Ryzyko."},{"t":"Do samej struktury ramowej COBIT 5","ok":false,"w":"Struktura ramowa to osobna, główna publikacja rodziny."},{"t":"Do przewodników aktywatorów","ok":true,"w":"COBIT 5 (struktura ramowa); przewodniki aktywatorów (Procesy umożliwiające, Informacje umożliwiające, inne); przewodniki specjalistyczne (Wdrożenie, Bezpieczeństwo informacji, Audyt, Ryzyko, inne); środowisko współpracy online."},{"t":"Do środowiska współpracy online","ok":false,"w":"Środowisko online to osobny element rodziny, nie przewodnik."}],"fz":{"h":"Rodzina produktów","p":"P2","pulapka":false,"n":"egzamin: rodzina produktów · podr.: rodzina produktów · EN: COBIT 5 product family · EN: COBIT 5 product family: framework, enabler guides, professional guides, collaborative online environment","q":"Z czego składa się rodzina produktów COBIT 5?","a":"COBIT 5 (struktura ramowa); przewodniki aktywatorów (Procesy umożliwiające, Informacje umożliwiające, inne); przewodniki specjalistyczne (Wdrożenie, Bezpieczeństwo informacji, Audyt, Ryzyko, inne); środowisko współpracy online.","ex":"Jak podręcznik szkolny: główna książka (struktura ramowa), zeszyty o elementach (aktywatory), zbiory tematyczne (wdrożenie, bezpieczeństwo, audyt, ryzyko) i klasowa grupa w internecie.","org":""}},"fz-A-004":{"id":"fz-A-004","typ":"egzamin","s":"PR-02-01","t":"Który z poniższych NIE jest korzyścią, do której dążą organizacje stosujące COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 13","FW-PL s. 17"],"r":null,"zap":"","scen":"","o":[{"t":"Wysoka jakość informacji wspierającej decyzje","ok":false,"w":"To jedna z korzyści wymienionych na fiszce."},{"t":"Optymalizacja kosztów usług i technologii IT","ok":false,"w":"To jedna z korzyści wymienionych na fiszce."},{"t":"Zgodność z przepisami, umowami i politykami","ok":false,"w":"To jedna z korzyści wymienionych na fiszce."},{"t":"Minimalizacja ryzyka IT bez oceny korzyści i zasobów","ok":true,"w":"COBIT 5 dąży do utrzymania ryzyka na poziomie akceptowalnym przy realizacji korzyści i właściwym wykorzystaniu zasobów. Sama minimalizacja ryzyka, bez uwzględnienia korzyści i zasobów, nie opisuje oczekiwanej równowagi wartości."}],"fz":{"h":"Korzyści stosowania","p":"P2","pulapka":false,"n":"egzamin: korzyści · podr.: korzyści · EN: benefits · EN: Benefits: information quality, value, operational excellence, acceptable IT (Information Technology — technologie informacyjne) risk, cost optimisation, compliance","q":"Do czego dążą organizacje, stosując COBIT 5 (korzyści)?","a":"Wysoka jakość informacji do decyzji; wartość biznesowa z inwestycji wspieranych przez IT (Information Technology — technologie informacyjne); sprawność operacyjna; ryzyko IT na akceptowalnym poziomie; optymalizacja kosztów usług i technologii IT; zgodność z przepisami, umowami i politykami.","ex":"Jak przy remoncie: dobre informacje do decyzji, remont się opłaca, ekipa sprawna, ryzyko pod kontrolą, koszty rozsądne i wszystko zgodne z prawem.","org":"krótsze przerwy usług krytycznych przy tym samym budżecie."}},"fz-A-005":{"id":"fz-A-005","typ":"egzamin","s":"PR-01-03,PR-01-04","t":"Ile procesów zawiera Referencyjny Model Procesu COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 32","FW-PL s. 33","Altkom — Różnice tłumaczenia PL, s. 1"],"r":null,"zap":"","scen":"","o":[{"t":"34","ok":false,"w":"34 procesy miał COBIT 4.1, nie COBIT 5."},{"t":"32","ok":false,"w":"32 to liczba procesów samego Zarządzania (APO (Align, Plan and Organise — Dostosuj, Planuj i Organizuj), BAI (Build, Acquire and Implement — Twórz, Nabywaj i Wdrażaj), DSS (Deliver, Service and Support — Dostarczaj, Obsługuj i Wspieraj), MEA (Monitor, Evaluate and Assess — Monitoruj, Oszacuj i Oceń))."},{"t":"37","ok":true,"w":"37 procesów: Ład — EDM (Evaluate, Direct and Monitor — Oszacuj, Kieruj i Monitoruj), 5; Zarządzanie — APO (Align, Plan and Organise — Dostosuj, Planuj i Organizuj), 13; BAI (Build, Acquire and Implement — Twórz, Nabywaj i Wdrażaj), 10; DSS (Deliver, Service and Support — Dostarczaj, Obsługuj i Wspieraj), 6; MEA (Monitor, Evaluate and Assess — Monitoruj, Oszacuj i Oceń), 3. Razem 5 + 13 + 10 + 6 + 3 = 37; część Zarządzania ma 32 procesy."},{"t":"40","ok":false,"w":"40 celów ma COBIT 2019, a egzamin dotyczy COBIT 5."}],"fz":{"h":"Liczba procesów","p":"P1","pulapka":false,"n":"PRM — Process Reference Model — Referencyjny Model Procesu. Pięć domen, 37 procesów.","q":"Ile procesów ma COBIT 5 i jak się rozkładają?","a":"37 procesów: Ład — EDM (Evaluate, Direct and Monitor — Oszacuj, Kieruj i Monitoruj), 5; Zarządzanie — APO (Align, Plan and Organise — Dostosuj, Planuj i Organizuj), 13; BAI (Build, Acquire and Implement — Twórz, Nabywaj i Wdrażaj), 10; DSS (Deliver, Service and Support — Dostarczaj, Obsługuj i Wspieraj), 6; MEA (Monitor, Evaluate and Assess — Monitoruj, Oszacuj i Oceń), 3. Razem 5 + 13 + 10 + 6 + 3 = 37; część Zarządzania ma 32 procesy.","ex":"Ciąg liczb 5-13-10-6-3. Ład ma 5 (jak palce ręki), Zarządzanie 32; razem 37, czyli o trzy więcej niż 34 w COBIT 4.1.","org":""}},"fz-A-006":{"id":"fz-A-006","typ":"egzamin","s":"PR-01-04","t":"Która domena COBIT 5 ma 13 procesów?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 33"],"r":null,"zap":"","scen":"","o":[{"t":"APO","ok":true,"w":"APO ma 13 procesów – najwięcej ze wszystkich domen."},{"t":"BAI","ok":false,"w":"BAI ma 10 procesów."},{"t":"DSS","ok":false,"w":"DSS ma 6 procesów."},{"t":"EDM","ok":false,"w":"EDM (Ład) ma 5 procesów."}],"fz":{"h":"Liczba procesów","p":"P1","pulapka":false,"n":"egzamin: 37 procesów · podr.: 37 procesów · EN: 37 processes · EN: 37 processes: EDM 5, APO 13, BAI 10, DSS 6, MEA 3","q":"Ile procesów ma COBIT 5 i jak się rozkładają? / Ile procesów ma COBIT 5 i jak się rozkładają?","a":"37: Ład EDM 5; Zarządzanie APO 13, BAI 10, DSS 6, MEA 3 (razem 32).\n37 procesów. Ład: EDM 5. Zarządzanie: APO 13, BAI 10, DSS 6, MEA 3 (razem 32).","ex":"Zapamiętaj ciąg 5-13-10-6-3. Ład (EDM) ma 5 procesów jak palce jednej ręki szefa, reszta to Zarządzanie: 32. Razem 37.\nCiąg liczb 5-13-10-6-3. Ład ma 5 (jak palce ręki), Zarządzanie 32; razem 37, czyli o trzy więcej niż 34 w COBIT 4.1.","org":""}},"fz-A-007":{"id":"fz-A-007","typ":"egzamin","s":"PR-01-01,PR-01-02","t":"Ile zasad i ile kategorii aktywatorów ma COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 90"],"r":null,"zap":"","scen":"","o":[{"t":"7 zasad i 5 kategorii aktywatorów","ok":false,"w":"Liczby są zamienione: zasad jest 5, kategorii aktywatorów 7."},{"t":"5 zasad i 5 kategorii aktywatorów","ok":false,"w":"Kategorii aktywatorów jest 7, nie 5."},{"t":"4 zasady i 7 kategorii aktywatorów","ok":false,"w":"Zasad jest 5, nie 4."},{"t":"5 zasad i 7 kategorii aktywatorów","ok":true,"w":"Tak podaje fiszka: 5 zasad, 7 kategorii aktywatorów."}],"fz":{"h":"Liczba zasad i aktywatorów","p":"P1","pulapka":false,"n":"EN: 5 principles, 7 enablers","q":"Ile zasad i ile kategorii aktywatorów ma COBIT 5?","a":"5 zasad i 7 kategorii aktywatorów.","ex":"5 zasad jak 5 palców jednej ręki, 7 aktywatorów jak 7 dni tygodnia. Zasady mówią, jak myśleć, aktywatory – czym działać.","org":""}},"fz-A-008":{"id":"fz-A-008","typ":"egzamin","s":"PR-01-01","t":"Pytanie egzaminacyjne odwołuje się do „Rysunku 8”. Gdzie znajdziesz go w polskim podręczniku COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 9","PeopleCert Sample Paper 1 PL — nazewnictwo Rysunek"],"r":null,"zap":"","scen":"","o":[{"t":"To Ilustracja 9 – numeracja jest przesunięta o jeden","ok":false,"w":"Numery rysunków i ilustracji są te same."},{"t":"To Ilustracja 8 – zmienia się tylko słowo, numer zostaje","ok":true,"w":"W polskim podręczniku COBIT 5 obiekt nazywa się Ilustracja 8, a w polskich materiałach egzaminacyjnych Rysunek 8. Numeracja pozostaje ta sama; różni się nazwa użyta w tłumaczeniu."},{"t":"To Tabela 8 w załącznikach","ok":false,"w":"Rysunek N odpowiada Ilustracji N, nie tabeli w załącznikach."},{"t":"Polski podręcznik nie zawiera rysunków z egzaminu","ok":false,"w":"Zawiera je jako ilustracje o tych samych numerach."}],"fz":{"h":"Rysunek N = Ilustracja N","p":"P2","pulapka":true,"n":"EN: Figure N = Ilustracja N","q":"„Rysunek N” w pytaniu egzaminu – gdzie go znaleźć w podręczniku PL?","a":"To „Ilustracja N” w polskim podręczniku; numery są te same.","ex":"Tłumacz zmienił tylko słowo: egzaminacyjny „Rysunek 5” to podręcznikowa „Ilustracja 5”. Numer się zgadza, więc szukasz po numerze.","org":""}},"fz-A-009":{"id":"fz-A-009","typ":"egzamin","s":"PR-02-14","t":"Jak na egzaminie PL nazywa się Governance (w podręczniku: nadzór)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 91"],"r":null,"zap":"","scen":"","o":[{"t":"Zarządzanie","ok":false,"w":"Zarządzanie to Management, osobna dyscyplina według Zasady 5."},{"t":"Struktura ramowa","ok":false,"w":"Struktura ramowa to Framework."},{"t":"Aktywator","ok":false,"w":"Aktywator to Enabler."},{"t":"Ład","ok":true,"w":"Governance to na egzaminie Ład (podr. nadzór)."}],"fz":{"h":"Nazwy egzaminacyjne: Governance, Framework, Enabler, Enterprise","p":"P1","pulapka":true,"n":"EN: Governance, Framework, Enabler, Enterprise","q":"Governance, Framework, Enabler, Enterprise – nazwy egzaminacyjne?","a":"Ład (podr. nadzór), Struktura ramowa (podr. metodyka), Aktywator (podr. czynnik umożliwiający), Organizacja (podr. przedsiębiorstwo).","ex":"Ład = kto wyznacza kierunek (jak rada rodziców), Aktywator = coś, co umożliwia działanie, Organizacja = cała firma lub urząd. Na egzaminie używaj tych słów.","org":""}},"fz-A-010":{"id":"fz-A-010","typ":"egzamin","s":"PR-01-02","t":"Jak na egzaminie PL nazywa się Enabler (w podręczniku: czynnik umożliwiający)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 91"],"r":null,"zap":"","scen":"","o":[{"t":"Aktywator","ok":true,"w":"Enabler to na egzaminie Aktywator."},{"t":"Wyznacznik","ok":false,"w":"Wyznacznik to driver – czynnik wpływający na potrzeby interesariuszy."},{"t":"Organizacja","ok":false,"w":"Organizacja to Enterprise (podr. przedsiębiorstwo)."},{"t":"Struktura ramowa","ok":false,"w":"Struktura ramowa to Framework (podr. metodyka)."}],"fz":{"h":"Nazwy egzaminacyjne: Governance, Framework, Enabler, Enterprise","p":"P1","pulapka":true,"n":"EN: Governance, Framework, Enabler, Enterprise","q":"Governance, Framework, Enabler, Enterprise – nazwy egzaminacyjne?","a":"Ład (podr. nadzór), Struktura ramowa (podr. metodyka), Aktywator (podr. czynnik umożliwiający), Organizacja (podr. przedsiębiorstwo).","ex":"Ład = kto wyznacza kierunek (jak rada rodziców), Aktywator = coś, co umożliwia działanie, Organizacja = cała firma lub urząd. Na egzaminie używaj tych słów.","org":""}},"fz-A-011":{"id":"fz-A-011","typ":"egzamin","s":"PR-02-13","t":"Jak na egzaminie PL nazywają się lead i lag indicators?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 29"],"r":null,"zap":"","scen":"","o":[{"t":"Wskaźniki podstawowe i wspierające","ok":false,"w":"Podstawowe i wspierające to relacje P i S w macierzach mapowania."},{"t":"Wskaźniki wiodące i opóźnione","ok":true,"w":"To nazwy egzaminacyjne; podręcznik mówi: wyprzedzające i następujące."},{"t":"Wskaźniki wewnętrzne i kontekstowe","ok":false,"w":"Wewnętrzna i kontekstowa to kategorie jakości informacji."},{"t":"Wskaźniki zdolności i wydajności","ok":false,"w":"To nie są nazwy lead/lag indicators ani na egzaminie, ani w podręczniku."}],"fz":{"h":"Lead/lag indicators – nazwy","p":"P1","pulapka":true,"n":"EN: Lead / lag indicators","q":"Lead/lag indicators – nazwy na egzaminie i w podręczniku?","a":"Egzamin: wskaźniki wiodące / opóźnione. Podręcznik: wskaźniki wyprzedzające / następujące.","ex":"Wiodący to prognoza pogody (zapowiada, co będzie), opóźniony to deszczomierz po fakcie (pokazuje, co już spadło). Haczyk: wiodący idzie z przodu, opóźniony z tyłu.","org":""}},"fz-A-012":{"id":"fz-A-012","typ":"egzamin","s":"PR-01-04","t":"Co oznacza skrót PBRM opisujący obszar Zarządzania?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 32"],"r":null,"zap":"","scen":"","o":[{"t":"Oszacuj, Kieruj i Monitoruj","ok":false,"w":"To nazwa domeny Ładu EDM."},{"t":"Monitoruj, Oszacuj i Oceń","ok":false,"w":"To nazwa domeny MEA."},{"t":"Planuj, Twórz (Wytwarzaj), Wykonuj i Monitoruj","ok":true,"w":"PBRM = Plan, Build, Run, Monitor; na egzaminie oba warianty: Twórz lub Wytwarzaj."},{"t":"Twórz, Nabywaj i Wdrażaj","ok":false,"w":"To nazwa domeny BAI, a nie całego PBRM."}],"fz":{"h":"PBRM – nazwa egzaminacyjna","p":"P2","pulapka":true,"n":"EN: Plan, Build, Run and Monitor","q":"PBRM – jak brzmi na egzaminie PL?","a":"Dwa warianty – rozpoznawaj oba: Planuj, Wytwarzaj, Wykonuj i Monitoruj (zestawienie Altkom) oraz Planuj, Twórz, Wykonuj i Monitoruj (SP1). Podr.: Planowanie, Budowanie, Uruchamianie i Monitorowanie. Domena BAI: Twórz, Nabywaj i Wdrażaj.","ex":"Jak budowa domu: projekt (Planuj), budowa (Wytwarzaj/Twórz), mieszkanie w nim (Wykonuj), przeglądy (Monitoruj). Angielskie pierwsze litery: Plan, Build, Run, Monitor.","org":""}},"fz-A-013":{"id":"fz-A-013","typ":"egzamin","s":"PR-01-03,PR-01-04","t":"Nazwa której domeny zaczyna się od słowa „Oszacuj”?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 32"],"r":null,"zap":"","scen":"","o":[{"t":"MEA – Monitoruj, Oszacuj i Oceń","ok":false,"w":"W MEA „Oszacuj” stoi w środku, a nazwa zaczyna się od „Monitoruj”."},{"t":"BAI – Twórz, Nabywaj i Wdrażaj","ok":false,"w":"W nazwie BAI w ogóle nie ma „Oszacuj”."},{"t":"Obu: EDM i MEA","ok":false,"w":"Tylko EDM zaczyna się od „Oszacuj”; MEA zaczyna się od „Monitoruj”."},{"t":"EDM – Oszacuj, Kieruj i Monitoruj","ok":true,"w":"W EDM (Evaluate, Direct, Monitor) „Oszacuj” stoi na początku."}],"fz":{"h":"EDM i MEA – „Oszacuj”","p":"P2","pulapka":true,"n":"EN: Evaluate, Direct and Monitor vs Monitor, Evaluate and Assess","q":"EDM i MEA – gdzie stoi „Oszacuj”?","a":"EDM: Oszacuj, Kieruj i Monitoruj (na początku). MEA: Monitoruj, Oszacuj i Oceń (w środku).","ex":"Patrz na literę E (Evaluate = Oszacuj): w EDM stoi na początku, w MEA (Monitor-Evaluate-Assess) w środku.","org":""}},"fz-A-014":{"id":"fz-A-014","typ":"egzamin","s":"PC-01-03","t":"Co oznacza litera „P” na polskiej skali ocen atrybutu procesu (N/C/W/P)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 45"],"r":null,"zap":"","scen":"","o":[{"t":"Częściowy – tak jak Partially w wersji EN","ok":false,"w":"To pułapka: na skali PL częściowy to C, a P to Pełny."},{"t":"Pełny","ok":true,"w":"Na skali PL: N Nieosiągnięty, C Częściowy, W Większościowy, P Pełny."},{"t":"Większościowy","ok":false,"w":"Większościowy oznacza litera W."},{"t":"Nieosiągnięty","ok":false,"w":"Nieosiągnięty oznacza litera N."}],"fz":{"h":"Skala ocen PL a EN","p":"P1","pulapka":true,"n":"EN: N/P/L/F vs N/C/W/P","q":"Skala ocen: litery egzaminu PL a oryginalne EN?","a":"PL: N Nieosiągnięty, C Częściowy, W Większościowy, P Pełny. EN: N, P (Partially), L (Largely), F (Fully). „P” oznacza co innego!","ex":"Jak ocena, ile pracy domowej zrobiono: nic, częściowo, w większości, w pełni. Pułapka: polskie „P” to Pełny, angielskie „P” to Partially, czyli częściowo.","org":""}},"fz-A-015":{"id":"fz-A-015","typ":"egzamin","s":"PC-01-02","t":"Jak na egzaminie PL nazywa się atrybut PA 2.1 (w podręczniku: Zarządzanie sprawnością)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42","PeopleCert Syllabus — PC-01-02","SP1 s. 26"],"r":null,"zap":"","scen":"","o":[{"t":"Wykonanie procesu","ok":false,"w":"Wykonanie procesu to PA (Process Attribute — atrybut procesu) 1.1."},{"t":"Sprawność procesu","ok":false,"w":"Sprawność procesu to podręcznikowa nazwa PA (Process Attribute — atrybut procesu) 1.1."},{"t":"Przeznaczenie procesu","ok":false,"w":"Przeznaczenie procesu to process purpose, a nie atrybut procesu."},{"t":"Zarządzanie wydajnością","ok":true,"w":"PA (Process Attribute — atrybut procesu) 2.1 to Performance management — Zarządzanie wydajnością, w podręczniku Zarządzanie sprawnością. Dotyczy zarządzania wykonywaniem procesu. PA 1.1 to Process performance — Wykonanie procesu, czyli osiąganie jego przeznaczenia. Nazwę egzaminacyjną potwierdza również polski arkusz próbny, pytanie 12."}],"fz":{"h":"PA 1.1 i PA 2.1 – nazwy","p":"P2","pulapka":true,"n":"EN: PA 1.1 Process performance; PA 2.1 Performance management","q":"PA 1.1 i PA 2.1 – nazwy egzaminacyjne i podręcznikowe?","a":"PA 1.1 Wykonanie procesu (podr. Sprawność procesu); PA 2.1 Zarządzanie wydajnością (podr. Zarządzanie sprawnością). Nie myl PA 2.1 z Zarządzaniem wydajnością aktywatora.","ex":"PA 1.1: czy proces w ogóle robi swoje, jak kuchnia, która wydaje dania. PA 2.1: czy tę pracę się planuje i pilnuje, jak grafik i kontrola czasu wydawania.","org":""}},"fz-A-016":{"id":"fz-A-016","typ":"egzamin","s":"PC-01-01,PC-01-04","t":"Jak na egzaminie PL nazywa się process capability (w podręczniku: potencjał procesu)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 43"],"r":null,"zap":"","scen":"","o":[{"t":"Zdolność procesu","ok":true,"w":"Process capability to zdolność procesu, a jej ocena to ocena zdolności procesu."},{"t":"Przeznaczenie procesu","ok":false,"w":"Przeznaczenie procesu to process purpose – po co proces istnieje."},{"t":"Wykonanie procesu","ok":false,"w":"Wykonanie procesu to nazwa atrybutu PA 1.1."},{"t":"Cel aktywatora","ok":false,"w":"Cel aktywatora to ostatni krok Kaskady Celów, nie zdolność procesu."}],"fz":{"h":"Process purpose i process capability – nazwy","p":"P2","pulapka":true,"n":"EN: Process purpose; process capability","q":"Process purpose i process capability – nazwy egzaminacyjne?","a":"Przeznaczenie procesu (podr. cel procesu); zdolność procesu, ocena zdolności procesu (podr. potencjał procesu).","ex":"Przeznaczenie procesu = po co on jest (kuchnia jest po to, by karmić). Zdolność procesu = jak dobrze to robi, na skali 0–5, jak stopnie w karate.","org":""}},"fz-A-017":{"id":"fz-A-017","typ":"egzamin","s":"IM-01-01","t":"Jak na egzaminie PL nazywa się change enablement (w podręczniku: umożliwienie zmian)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 37"],"r":null,"zap":"","scen":"","o":[{"t":"Mapa drogowa","ok":false,"w":"Mapa drogowa to road map (podr. plan działań)."},{"t":"Zdarzenie wyzwalające","ok":false,"w":"Zdarzenie wyzwalające to trigger event."},{"t":"Aktywowanie zmiany","ok":true,"w":"Change enablement to na egzaminie Aktywowanie zmiany."},{"t":"Punkt zapalny","ok":false,"w":"Punkt zapalny to osobne pojęcie (pain point), nie change enablement."}],"fz":{"h":"Change enablement, trigger events, road map – nazwy","p":"P2","pulapka":true,"n":"EN: Change enablement; trigger events; road map","q":"Change enablement, trigger events, road map – nazwy egzaminacyjne?","a":"Aktywowanie zmiany (podr. umożliwienie zmian), zdarzenia wyzwalające (podr. zdarzenia inicjujące), mapa drogowa (podr. plan działań).","ex":"Aktywowanie zmiany to przygotowanie ludzi, by chcieli zmiany; zdarzenie wyzwalające to iskra, która uruchamia wdrożenie; mapa drogowa to plan trasy krok po kroku.","org":""}},"fz-A-018":{"id":"fz-A-018","typ":"egzamin","s":"IM-02-02","t":"Jak na egzaminie PL nazywają się trigger events (w podręczniku: zdarzenia inicjujące)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 37"],"r":null,"zap":"","scen":"","o":[{"t":"Wyznaczniki interesariuszy","ok":false,"w":"Wyznaczniki to drivers – pierwszy krok Kaskady Celów."},{"t":"Zdarzenia wyzwalające","ok":true,"w":"Trigger events to na egzaminie zdarzenia wyzwalające – iskra uruchamiająca wdrożenie."},{"t":"Mapa drogowa","ok":false,"w":"Mapa drogowa to road map, czyli plan działań."},{"t":"Punkty zapalne","ok":false,"w":"Punkty zapalne to pain points – osobne pojęcie sylabusa."}],"fz":{"h":"Change enablement, trigger events, road map – nazwy","p":"P2","pulapka":true,"n":"EN: Change enablement; trigger events; road map","q":"Change enablement, trigger events, road map – nazwy egzaminacyjne?","a":"Aktywowanie zmiany (podr. umożliwienie zmian), zdarzenia wyzwalające (podr. zdarzenia inicjujące), mapa drogowa (podr. plan działań).","ex":"Aktywowanie zmiany to przygotowanie ludzi, by chcieli zmiany; zdarzenie wyzwalające to iskra, która uruchamia wdrożenie; mapa drogowa to plan trasy krok po kroku.","org":""}},"fz-A-019":{"id":"fz-A-019","typ":"egzamin","s":"EN-02-17","t":"Co oznacza „jakość wewnętrzna” informacji (EN: intrinsic quality, podr. jakość rzeczywista)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 29"],"r":null,"zap":"","scen":"","o":[{"t":"Jakość informacji używanej wyłącznie wewnątrz organizacji","ok":false,"w":"Pułapka: „wewnętrzna” znaczy „sama w sobie”, a nie „wewnątrz organizacji”."},{"t":"Jakość informacji ocenianej przez audyt wewnętrzny","ok":false,"w":"Nazwa nie ma związku z audytem wewnętrznym."},{"t":"Jakość informacji samej w sobie, np. czy jest prawdziwa, dokładna i wiarygodna","ok":true,"w":"Jakość wewnętrzna = jakość sama w sobie, niezależnie od tego, kto i gdzie używa informacji."},{"t":"Jakość informacji w systemach wewnętrznych działu IT","ok":false,"w":"Nie chodzi o miejsce przechowywania, lecz o jakość samej informacji."}],"fz":{"h":"Intrinsic quality – nazwa","p":"P2","pulapka":true,"n":"EN: Intrinsic quality","q":"Intrinsic quality – jak na egzaminie, a jak w podręczniku?","a":"Egzamin: jakość wewnętrzna (= sama w sobie, nie „wewnątrz organizacji”). Podręcznik: jakość rzeczywista.","ex":"Jakość „sama w sobie”, jak świeżość jabłka: czy informacja jest prawdziwa, dokładna i wiarygodna, niezależnie od tego, kto i gdzie jej używa.","org":""}},"fz-A-020":{"id":"fz-A-020","typ":"egzamin","s":"PR-02-09","t":"Jak na egzaminie PL nazywa się governing body (w podręczniku: organ nadzorujący)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 24"],"r":null,"zap":"","scen":"","o":[{"t":"Role operacyjne","ok":false,"w":"Role operacyjne to operations and execution."},{"t":"Kierownictwo","ok":false,"w":"Kierownictwo to management – dostaje kierunek od organu Ładu."},{"t":"Interesariusze","ok":false,"w":"Interesariusze (owners and stakeholders) delegują uprawnienia do organu Ładu."},{"t":"Organ Ładu","ok":true,"w":"Governing body to na egzaminie Organ Ładu."}],"fz":{"h":"Governing body i Operations and execution – nazwy","p":"P2","pulapka":true,"n":"EN: Governing body; operations and execution","q":"Governing body i Operations and execution – nazwy egzaminacyjne?","a":"Organ Ładu (podr. organ nadzorujący) i Role operacyjne (podr. eksploatacja i wykonanie).","ex":"Organ Ładu to np. zarząd lub rada, która wyznacza kierunek, jak właściciel restauracji. Role operacyjne wykonują codzienną pracę, jak kucharze i kelnerzy.","org":""}},"fz-A-021":{"id":"fz-A-021","typ":"egzamin","s":"PR-02-08","t":"Czym są Aktywatory Ładu (w podręczniku: czynniki umożliwiające nadzór)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 24","FW-PL s. 91"],"r":null,"zap":"","scen":"","o":[{"t":"Procesami domeny EDM w Referencyjnym Modelu Procesu","ok":false,"w":"EDM (Evaluate, Direct and Monitor — Oszacuj, Kieruj i Monitoruj) to domena procesów Ładu; aktywatory Ładu obejmują znacznie więcej niż procesy."},{"t":"Czynnikami, które wpływają na potrzeby interesariuszy","ok":false,"w":"To definicja wyznaczników w Kaskadzie Celów."},{"t":"Zasobami organizacyjnymi i zasobami przedsiębiorstwa wspierającymi Ład","ok":true,"w":"Zasobami organizacyjnymi Ładu (struktury ramowe, zasady, struktury, procesy, praktyki) oraz zasobami organizacji (zdolność usługowa, ludzie, informacje). Ich brak osłabia tworzenie wartości."},{"t":"Właścicielami i interesariuszami, którzy delegują uprawnienia organowi Ładu","ok":false,"w":"To opis ról z Rysunku 9, nie aktywatorów Ładu."}],"fz":{"h":"Aktywatory Ładu","p":"P2","pulapka":false,"n":"≠ TŁUMACZENIE · egzamin: aktywatory Ładu · podr.: czynniki umożliwiające nadzór · EN: governance enablers · EN: Governance enablers","q":"Czym są Aktywatory Ładu?","a":"Zasobami organizacyjnymi Ładu (struktury ramowe, zasady, struktury, procesy, praktyki) oraz zasobami organizacji (zdolność usługowa, ludzie, informacje). Ich brak osłabia tworzenie wartości.","ex":"W domu to regulamin, domowe ustalenia i zwyczaje, ale też sprzęt, domownicy i wiedza. Bez nich dom nie przynosi tego, czego się od niego oczekuje.","org":"polityka obsługi zgłoszeń, komitet sterujący."}},"fz-A-022":{"id":"fz-A-022","typ":"egzamin","s":"PR-01-01","t":"Która z poniższych NIE jest jedną z pięciu zasad COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 13","FW-PL s. 14"],"r":null,"zap":"","scen":"","o":[{"t":"Realizacja potrzeb interesariusza","ok":false,"w":"To Zasada 1."},{"t":"Aktywacja holistycznego podejścia","ok":false,"w":"To Zasada 4."},{"t":"Ustanowienie jednolitego systemu kontroli IT","ok":true,"w":"„Ustanowienie jednolitego systemu kontroli IT (Information Technology — technologie informacyjne)” nie jest nazwą jednej z pięciu zasad. Zasady to: Realizacja potrzeb interesariusza; Pokrycie całej organizacji; Zastosowanie pojedynczej zintegrowanej struktury ramowej; Aktywacja holistycznego podejścia; Oddzielenie Ładu od Zarządzania."},{"t":"Oddzielenie Ładu od Zarządzania","ok":false,"w":"To Zasada 5."}],"fz":{"h":"Pięć zasad","p":"P1","pulapka":false,"n":"egzamin: 5 zasad · podr.: 5 zasad · EN: 5 principles · EN: Meeting Stakeholder Needs; Covering the Enterprise End-to-End; Applying a Single Integrated Framework; Enabling a Holistic Approach; Separating Governance From Management","q":"Podaj pięć zasad COBIT 5 (nazwy egzaminacyjne).","a":"1. Realizacja potrzeb interesariusza. 2. Pokrycie całej organizacji. 3. Zastosowanie Pojedynczej Zintegrowanej Struktury Ramowej. 4. Aktywacja holistycznego podejścia. 5. Oddzielenie Ładu od Zarządzania. Zasada 1 oznacza tworzenie wartości dla interesariuszy przez równoważenie realizacji korzyści, optymalizacji ryzyka i wykorzystania zasobów; Kaskada Celów przekłada ich potrzeby na cele organizacji, cele związane z informatyką i cele aktywatorów.","ex":"Pierwsze słowa nazw zasad: Realizacja, Pokrycie, Zastosowanie, Aktywacja, Oddzielenie. Mnemonik R–P–Z–A–O: „Rano Pies Zjada Ananasa Ochoczo”. To pomoc pamięciowa, nie terminologia COBIT 5.","org":""}},"fz-A-023":{"id":"fz-A-023","typ":"egzamin","s":"PR-01-01","t":"Która zasada COBIT 5 mówi o tworzeniu wartości dla interesariuszy i o przekładaniu ich potrzeb na cele Kaskadą Celów?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 14","FW-PL s. 17"],"r":null,"zap":"","scen":"","o":[{"t":"Zasada 1: Realizacja potrzeb interesariusza","ok":true,"w":"Zasada 1 to tworzenie wartości przez równowagę korzyści, ryzyka i zasobów oraz Kaskada Celów."},{"t":"Zasada 2: Pokrycie całej organizacji","ok":false,"w":"Zasada 2 mówi, że Ład IT obejmuje całą organizację."},{"t":"Zasada 4: Aktywacja holistycznego podejścia","ok":false,"w":"Zasada 4 dotyczy 7 współzależnych kategorii aktywatorów."},{"t":"Zasada 5: Oddzielenie Ładu od Zarządzania","ok":false,"w":"Zasada 5 rozdziela działania, struktury i cele Ładu oraz Zarządzania."}],"fz":{"h":"Zasada 1: Realizacja potrzeb interesariusza","p":"P1","pulapka":false,"n":"≠ TŁUMACZENIE · egzamin: Realizacja potrzeb interesariusza · podr.: Spełnienie potrzeb interesariuszy · EN: Principle 1: Meeting Stakeholder Needs","q":"O co chodzi w Zasadzie 1? / Co mówi Zasada 1: Realizacja potrzeb interesariusza?","a":"Tworzenie wartości dla interesariuszy przez równowagę korzyści, ryzyka i zasobów; potrzeby przekłada się na cele kaskadą celów.\nOrganizacja istnieje, by tworzyć wartość dla interesariuszy: równoważyć korzyści, ryzyko i zasoby. Kaskada Celów przekłada potrzeby na cele organizacji, cele IT i cele aktywatorów.","ex":"Restauracja istnieje dla gości i właścicieli: ma dawać korzyść, nie ryzykować za dużo i nie marnować produktów. Ich życzenia rozpisuje się w dół na konkretne cele.\nJak rodzinny budżet: najpierw życzenie rodziny („suchy dom”), potem cel („nowy dach”), potem zadania dla wykonawców. To rozpisywanie w dół to Kaskada Celów.","org":"potrzeba „usługi bez przerw” → cel organizacji CO7."}},"fz-A-024":{"id":"fz-A-024","typ":"egzamin","s":"PR-01-01","t":"Jak Zasada 2 (Pokrycie całej organizacji) traktuje informację i technologię?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 14","FW-PL s. 23"],"r":null,"zap":"","scen":"","o":[{"t":"Jako sprawę wyłącznie działu IT","ok":false,"w":"Zasada 2 obejmuje wszystkie funkcje i procesy organizacji, nie tylko dział IT."},{"t":"Jak każdy inny zasób (aktywo) organizacji – we wszystkich funkcjach i procesach","ok":true,"w":"Informację i technologię traktuje się jak inne aktywa, a aktywatory są ogólnofirmowe."},{"t":"Jako zasób ważniejszy od innych, zarządzany zupełnie osobno","ok":false,"w":"Według Zasady 2 informacja i technologia to aktywa jak każde inne."},{"t":"Jako temat wyłącznie dla usług IT dostarczanych wewnętrznie","ok":false,"w":"Zasada 2 obejmuje także zewnętrzne usługi IT."}],"fz":{"h":"Zasada 2: Pokrycie całej organizacji","p":"P1","pulapka":false,"n":"≠ TŁUMACZENIE · egzamin: Pokrycie całej organizacji · podr.: Uwzględnienie wszystkich aspektów działania przedsiębiorstwa · EN: Principle 2: Covering the Enterprise End-to-End","q":"O co chodzi w Zasadzie 2? / Co mówi Zasada 2: Pokrycie całej organizacji?","a":"Ład IT jest częścią Ładu całej organizacji; obejmuje wszystkie funkcje i procesy, a informację i technologię traktuje jak każdy inny zasób.\nŁad IT jest częścią ładu korporacyjnego. Obejmuje wszystkie funkcje i procesy, wewnętrzne i zewnętrzne usługi IT; informacje i technologię traktuje jak inne aktywa. Aktywatory są ogólnofirmowe.","ex":"IT to nie osobna wyspa: jak prąd w domu dotyczy każdego pokoju, tak informatyka dotyczy każdego działu. Informacja to taki sam majątek jak budynki.\nWydatki na internet to część budżetu całego domu, nie osobna kasa. Tak samo Ład IT dotyczy każdego działu i usług zamawianych z zewnątrz.","org":"zmiana obejmuje komendy, nie tylko komórkę IT."}},"fz-A-025":{"id":"fz-A-025","typ":"egzamin","s":"PR-01-01,PR-02-10","t":"O co chodzi w Zasadzie 3: Zastosowanie pojedynczej zintegrowanej struktury ramowej?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 14","FW-PL s. 25","FW-PL s. 26","FW-PL s. 61"],"r":null,"zap":"","scen":"","o":[{"t":"COBIT 5 narzuca wspólny sposób wykonywania praktyk wszystkich standardów","ok":false,"w":"Spójność na wysokim poziomie nie oznacza narzucenia jednego sposobu wykonania praktyk wszystkich standardów. COBIT 5 pozwala integrować szczegółowe wytyczne odpowiednie dla organizacji."},{"t":"COBIT 5 łączy Ład i Zarządzanie w jeden zestaw celów i odpowiedzialności","ok":false,"w":"Zasada 5 rozróżnia Ład i Zarządzanie: mają odmienne działania, cele i struktury odpowiedzialności. Integracja frameworków nie łączy tych dwóch dyscyplin w jedną."},{"t":"COBIT 5 porządkuje procesy według tego samego cyklu co ITIL","ok":false,"w":"Zasada 3 dotyczy integracji i spójności z innymi standardami, a nie narzucenia COBIT 5 tego samego układu procesów co ITIL (Information Technology Infrastructure Library — biblioteka praktyk zarządzania usługami informatycznymi)."},{"t":"COBIT 5 jest nadrzędną ramą spójną z innymi standardami","ok":true,"w":"COBIT 5 jest na poziomie ogólnym spójny z innymi standardami i może być nadrzędną strukturą ramową Ładu i Zarządzania IT (Information Technology — technologie informacyjne). Jego prosta architektura porządkuje materiały, obejmuje całą organizację i łączy wcześniejsze wytyczne ISACA."}],"fz":{"h":"Zasada 3: Pojedyncza zintegrowana struktura ramowa","p":"P1","pulapka":false,"n":"≠ TŁUMACZENIE · egzamin: Zastosowanie pojedynczej zintegrowanej struktury ramowej · podr.: Stosowanie jednej zintegrowanej metodyki · EN: Principle 3: Applying a Single Integrated Framework","q":"Co mówi Zasada 3: Zastosowanie Pojedynczej Zintegrowanej Struktury Ramowej?","a":"Zasada 3: COBIT 5 jest spójny z innymi standardami i może pełnić rolę nadrzędnej struktury ramowej Ładu i Zarządzania IT (Information Technology — technologie informacyjne). Integruje wytyczne, zamiast zastępować szczegółowe praktyki innych standardów. Powody integracji: obejmuje całe przedsiębiorstwo; zapewnia prostą architekturę materiałów i produktów; łączy wiedzę z wcześniejszych struktur ISACA; pozwala dostarczać spójne wytyczne przystępne także dla odbiorców nietechnicznych.","ex":"COBIT 5 przypomina wspólny segregator: porządkuje wytyczne, a szczegółowe instrukcje nadal pochodzą z odpowiednich standardów i metodyk. ITIL — Information Technology Infrastructure Library, biblioteka praktyk zarządzania usługami informatycznymi; TOGAF — The Open Group Architecture Framework, struktura ramowa architektury The Open Group.","org":"procedury bezpieczeństwa i normy włączone do jednej ramy Ładu i Zarządzania."}},"fz-A-026":{"id":"fz-A-026","typ":"egzamin","s":"PR-01-01,PR-01-02","t":"Czego wymaga Zasada 4: Aktywacja holistycznego podejścia?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 14","FW-PL s. 27"],"r":null,"zap":"","scen":"","o":[{"t":"Uwzględnienia 7 współzależnych kategorii aktywatorów, a nie samych procesów","ok":true,"w":"Zasada 4 każe patrzeć na całość: 7 kategorii aktywatorów wpływa na siebie nawzajem."},{"t":"Usprawniania wyłącznie procesów, bo to one decydują o Ładzie","ok":false,"w":"Same procesy nie wystarczą – potrzebne są wszystkie aktywatory."},{"t":"Wdrożenia wszystkich 37 procesów naraz w ściśle ustalonej kolejności","ok":false,"w":"Kolejność usprawnień wybiera organizacja."},{"t":"Oddzielenia Ładu od Zarządzania","ok":false,"w":"To treść Zasady 5, nie Zasady 4."}],"fz":{"h":"Zasada 4: Holistyczne podejście","p":"P1","pulapka":false,"n":"≠ TŁUMACZENIE · egzamin: Aktywacja holistycznego podejścia · podr.: Wdrożenie podejścia całościowego · EN: Principle 4: Enabling a Holistic Approach","q":"O co chodzi w Zasadzie 4? / Co mówi Zasada 4: Aktywacja holistycznego podejścia?","a":"Ład i Zarządzanie wymagają 7 współzależnych kategorii aktywatorów, a nie samych procesów.\nDobry Ład i Zarządzanie wymagają patrzenia na całość, bo wiele elementów wpływa na siebie nawzajem. COBIT 5 wyróżnia 7 kategorii aktywatorów tworzących ten system.","ex":"Samochód nie pojedzie na samym silniku: potrzebuje kół, paliwa, kierowcy i przepisów. Tak samo procesy nie wystarczą – trzeba uwzględnić wszystkie 7 aktywatorów i ich zależności; kolejność usprawnień wybiera organizacja.\nJak przyjęcie urodzinowe: liczą się goście, jedzenie, miejsce, muzyka i plan naraz – brak jednego psuje całość. COBIT 5 wyróżnia 7 takich składników.","org":"procedura + dyżur + rejestr + szkolenia jednocześnie."}},"fz-A-027":{"id":"fz-A-027","typ":"egzamin","s":"PR-01-01,PR-02-14","t":"Jak Zasada 5 rozdziela działania Ładu i Zarządzania?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 14","FW-PL s. 31"],"r":null,"zap":"","scen":"","o":[{"t":"Ład planuje, tworzy, wykonuje i monitoruje; Zarządzanie ocenia, kieruje i monitoruje","ok":false,"w":"Role są tu zamienione: to Ład ocenia, kieruje i monitoruje."},{"t":"Ład zajmuje się tylko monitorowaniem, a Zarządzanie wszystkimi pozostałymi działaniami","ok":false,"w":"Ład także ocenia i kieruje, a Zarządzanie również monitoruje."},{"t":"Ład (EDM) ocenia, kieruje i monitoruje; Zarządzanie (PBRM) planuje, tworzy, wykonuje i monitoruje","ok":true,"w":"Tak rozdziela je Zasada 5: różne działania, struktury i cele."},{"t":"Ład i Zarządzanie wykonują te same działania, różnią się tylko szczeblem","ok":false,"w":"Według Zasady 5 to różne dyscypliny z innymi działaniami."}],"fz":{"h":"Zasada 5: Oddzielenie Ładu od Zarządzania","p":"P1","pulapka":true,"n":"≠ TŁUMACZENIE · egzamin: Oddzielenie Ładu od Zarządzania · podr.: Oddzielenie nadzoru od zarządzania · EN: Principle 5: Separating Governance From Management","q":"O co chodzi w Zasadzie 5? / Co mówi Zasada 5: Oddzielenie Ładu od Zarządzania?","a":"Ład (EDM) ocenia, kieruje i monitoruje; Zarządzanie (PBRM) planuje, tworzy, wykonuje i monitoruje. To różne działania, struktury i cele.\nŁad i Zarządzanie to różne dyscypliny: obejmują inne działania, wymagają innych struktur organizacyjnych i służą innym celom.","ex":"Właściciel restauracji ocenia, decyduje i sprawdza (Ład); kierownik kuchni planuje, przygotowuje, gotuje i pilnuje (Zarządzanie). Jeden mówi „co”, drugi robi „jak”.\nW szkole dyrektor ustala kierunek i rozlicza (Ład), a nauczyciele prowadzą lekcje (Zarządzanie). Inne zadania, inne gremia, inne cele.","org":"kierownictwo zatwierdza progi ryzyka; dyrektor IT wdraża procedurę."}},"fz-A-028":{"id":"fz-A-028","typ":"egzamin","s":"PR-02-08","t":"Który z poniższych jest jednym z czterech kluczowych komponentów Podejścia do Ładu (Rysunek 8)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 23","FW-PL s. 32"],"r":null,"zap":"","scen":"","o":[{"t":"Kaskada Celów","ok":false,"w":"Kaskada Celów to mechanizm Zasady 1, nie komponent z Rysunku 8."},{"t":"Zakres Ładu","ok":true,"w":"Cztery kluczowe komponenty Podejścia do Ładu z Rysunku 8: Cel Ładu — tworzenie wartości; Aktywatory Ładu; Zakres Ładu; Role, działania i relacje. EDM (Evaluate, Direct and Monitor — Oszacuj, Kieruj i Monitoruj) jest domeną procesów w Referencyjnym Modelu Procesu, a nie piątym komponentem Podejścia do Ładu."},{"t":"Referencyjny Model Procesu","ok":false,"w":"Referencyjny Model Procesu to katalog 37 procesów, nie komponent Podejścia do Ładu."},{"t":"Zrównoważona karta wyników (BSC)","ok":false,"w":"BSC (Balanced Scorecard — zrównoważona karta wyników) grupuje cele organizacji i cele IT (Information Technology — technologie informacyjne); nie jest komponentem z Rysunku 8."}],"fz":{"h":"Komponenty Podejścia do Ładu","p":"P1","pulapka":false,"n":"EN: Governance objective, governance enablers, governance scope, roles/activities/relationships","q":"Jakie są kluczowe komponenty Podejścia do Ładu (Rysunek 8)?","a":"Cztery kluczowe komponenty Podejścia do Ładu z Rysunku 8: Cel Ładu — tworzenie wartości; Aktywatory Ładu; Zakres Ładu; Role, działania i relacje. EDM (Evaluate, Direct and Monitor — Oszacuj, Kieruj i Monitoruj) jest domeną procesów w Referencyjnym Modelu Procesu, a nie piątym komponentem Podejścia do Ładu.","ex":"Cztery pytania jak przed remontem: po co (wartość), czym to zrobimy (aktywatory), co remontujemy (zakres), kto co robi (role).","org":""}},"fz-A-029":{"id":"fz-A-029","typ":"egzamin","s":"PR-02-09","t":"Co definiuje komponent Ładu „Role, działania i relacje”?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 24"],"r":null,"zap":"","scen":"","o":[{"t":"Czego dotyczy system Ładu: całej organizacji, jednostki czy zasobu","ok":false,"w":"To definicja Zakresu Ładu."},{"t":"Jak Ład równoważy korzyści, ryzyko i zasoby","ok":false,"w":"To Cel Ładu, czyli Tworzenie wartości."},{"t":"Jakie zasoby wspierają skuteczny Ład","ok":false,"w":"To Aktywatory Ładu."},{"t":"Kto uczestniczy w Ładzie, co robi i jak współdziała","ok":true,"w":"Kto uczestniczy w Ładzie, jak jest zaangażowany, co robi i jak współdziała z innymi w systemie Ładu."}],"fz":{"h":"Role, działania i relacje – definicja","p":"P2","pulapka":false,"n":"EN: Roles, activities and relationships","q":"Co definiuje komponent Role, działania i relacje?","a":"Kto uczestniczy w Ładzie, jak jest zaangażowany, co robi i jak współdziała z innymi w systemie Ładu.","ex":"Odpowiada na pytania: kto bierze udział, co robi i z kim współpracuje – jak grafik dyżurów w straży z podziałem zadań.","org":""}},"fz-A-030":{"id":"fz-A-030","typ":"egzamin","s":"PR-02-09","t":"Co robi organ Ładu w relacjach ról z Rysunku 9?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 24","PeopleCert Sample Paper 1 PL — Organ Ładu i Role operacyjne"],"r":null,"zap":"","scen":"","o":[{"t":"Wyznacza kierunek, monitoruje Zarządzanie i rozlicza się przed interesariuszami","ok":true,"w":"Właściciele i interesariusze delegują uprawnienia organowi Ładu. Organ Ładu (governing body; podr. organ nadzorujący) wyznacza kierunek kierownictwu, monitoruje Zarządzanie i jest rozliczany przed właścicielami i interesariuszami. Kierownictwo instruuje i dopasowuje role operacyjne (operations and execution; podr. eksploatacja i wykonanie), a role operacyjne raportują kierownictwu. To wzajemne relacje, a nie kolejne fazy wdrożenia."},{"t":"Instruuje i dopasowuje role operacyjne","ok":false,"w":"To zadanie kierownictwa, nie organu Ładu."},{"t":"Raportuje kierownictwu o wykonaniu codziennych zadań","ok":false,"w":"Kierownictwu raportują role operacyjne."},{"t":"Deleguje uprawnienia właścicielom i interesariuszom","ok":false,"w":"Kierunek jest odwrotny: to interesariusze delegują do organu Ładu."}],"fz":{"h":"Role, działania i relacje","p":"P2","pulapka":false,"n":"egzamin: role, działania i relacje · podr.: role, działania i relacje · EN: roles, activities and relationships · EN: Owners and stakeholders – delegate/accountable; governing body – set direction/monitor; management – instruct and align/report; operations and execution","q":"Opisz relacje ról z Rysunku 9.","a":"Właściciele i interesariusze delegują uprawnienia organowi Ładu. Organ Ładu (governing body; podr. organ nadzorujący) wyznacza kierunek kierownictwu, monitoruje Zarządzanie i jest rozliczany przed właścicielami i interesariuszami. Kierownictwo instruuje i dopasowuje role operacyjne (operations and execution; podr. eksploatacja i wykonanie), a role operacyjne raportują kierownictwu. To wzajemne relacje, a nie kolejne fazy wdrożenia.","ex":"Jak w spółdzielni: mieszkańcy wybierają radę i dają jej władzę, rada wyznacza kierunek prezesowi, prezes kieruje pracownikami, a ci raportują w górę.","org":"kierownictwo organizacji → dyrektor IT (Information Technology — technologie informacyjne) → zespół dyżurny."}},"fz-A-031":{"id":"fz-A-031","typ":"egzamin","s":"PR-02-08","t":"Czego może dotyczyć Zakres Ładu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 24"],"r":null,"zap":"","scen":"","o":[{"t":"Całej organizacji, bez odrębnego definiowania zakresu","ok":false,"w":"Ład może obejmować całą organizację, ale zakres systemu Ładu trzeba jasno określić. Nie można przyjąć, że jego zdefiniowanie jest zbędne."},{"t":"Funkcji IT, niezależnie od zakresu działalności biznesowej","ok":false,"w":"Zakres nie wynika automatycznie z granic działu informatyki. COBIT 5 traktuje informację i technologię w kontekście całej organizacji; zakres można ustalić także dla jednostki lub aktywa."},{"t":"Całej organizacji, jednostki lub wybranego aktywa","ok":true,"w":"System Ładu może dotyczyć całej organizacji, jednostki, środków trwałych lub wartości niematerialnych. Trzeba jawnie ustalić jego zakres; zakres COBIT 5 jako frameworka obejmuje organizację."},{"t":"Aktywów materialnych, z pominięciem wartości niematerialnych","ok":false,"w":"COBIT 5 uwzględnia zarówno aktywa materialne, jak i niematerialne. Przedmiot Ładu nie jest ograniczony do fizycznego sprzętu."}],"fz":{"h":"Zakres Ładu","p":"P2","pulapka":false,"n":"≠ TŁUMACZENIE · egzamin: zakres Ładu · podr.: zakres nadzoru · EN: governance scope · EN: Governance scope","q":"Czym jest Zakres Ładu?","a":"Określeniem, czego dotyczy system Ładu: całej organizacji, jednostki, aktywów materialnych lub niematerialnych. Zakres COBIT 5 to organizacja.","ex":"Jak przy sprzątaniu: najpierw mówisz, czy chodzi o cały dom, jeden pokój czy tylko lodówkę. W COBIT 5 domyślnie jest to cała organizacja.","org":"zakres pierwszej iteracji: usługi centralne IT (Information Technology — technologie informacyjne)."}},"fz-A-032":{"id":"fz-A-032","typ":"egzamin","s":"PR-02-11","t":"Który z poniższych jest powodem, dla którego COBIT 5 jest pojedynczą zintegrowaną strukturą ramową?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 25"],"r":null,"zap":"","scen":"","o":[{"t":"Zastępuje wszystkie inne standardy, więc nie trzeba ich stosować","ok":false,"w":"COBIT 5 jest spójny z innymi standardami i je integruje, a nie zastępuje."},{"t":"Obejmuje wyłącznie funkcję IT, dzięki czemu jest prosty","ok":false,"w":"COBIT 5 obejmuje całą organizację."},{"t":"Ma prostą architekturę porządkującą materiały i łączy wiedzę rozproszoną dotąd w strukturach ISACA","ok":true,"w":"To dwa z powodów podanych na fiszce (obok spójności i objęcia całej organizacji)."},{"t":"Zawiera tylko jeden proces Ładu","ok":false,"w":"Domena Ładu EDM ma 5 procesów."}],"fz":{"h":"Pojedyncza zintegrowana struktura ramowa – dlaczego","p":"P2","pulapka":false,"n":"EN: Why COBIT 5 is a single integrated framework","q":"Dlaczego COBIT 5 jest pojedynczą zintegrowaną strukturą ramową?","a":"Jest spójny z innymi standardami; obejmuje całą organizację i integruje inne struktury; ma prostą architekturę porządkującą materiały i produkty; łączy wiedzę rozpro
