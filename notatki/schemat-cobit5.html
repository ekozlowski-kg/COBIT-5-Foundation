,"typ":"egzamin","s":"EN-02-08","t":"Na jakie kategorie dzielą się cele procesu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 69"],"r":null,"zap":"","scen":"","o":[{"t":"Cele wewnętrzne, kontekstowe oraz dostępności i bezpieczeństwa","ok":true,"w":"Tak: ta sama logika co cele aktywatora."},{"t":"Interesariusze, cele, cykl życia i dobre praktyki","ok":false,"w":"To cztery wymiary aktywatora."},{"t":"Korzyści, ryzyko i zasoby","ok":false,"w":"To elementy celu Ładu „Tworzenie wartości”."},{"t":"Planowanie, budowanie, uruchamianie i monitorowanie","ok":false,"w":"To obszary działań Zarządzania (PBRM)."}],"fz":{"h":"Cele procesu: kategorie","p":"P1","pulapka":false,"n":"egzamin: cele wewnętrzne, kontekstowe, dostępności i bezpieczeństwa · podr.: cele wewnętrzne, cele dotyczące zgodności z kontekstem, cele dotyczące dostępności i bezpieczeństwa · EN: intrinsic, contextual, accessibility and security goals","q":"Jakie kategorie celów ma proces?","a":"Cele wewnętrzne, cele kontekstowe, cele dostępności i bezpieczeństwa (ta sama logika co cele aktywatora).","ex":"Te same trzy szuflady co u aktywatorów: czy proces jest dobrze zrobiony (wewnętrzne), czy pasuje do potrzeb (kontekstowe), czy jest dostępny i chroniony (dostępność i bezpieczeństwo).","org":"kontekstowy cel DSS02: obsługa zgłoszeń dopasowana do godzin pracy komend i zrozumiała dla ich użytkowników."},"cyt":{"s":"69","t":"Cele wewnętrzne — czy proces ma jakość rzeczywistą?","w":"ZGODNE","u":"Pozostałe kategorie w tym samym wyliczeniu: „Cele dotyczące zgodności z kontekstem” i „Cele dotyczące dostępności i bezpieczeństwa”."}},"fz-B-027":{"id":"fz-B-027","typ":"egzamin","s":"EN-02-08","t":"Pytanie „czy proces jest poufny, gdy trzeba, oraz znany i dostępny dla potrzebujących?” dotyczy której kategorii celów procesu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 69"],"r":null,"zap":"","scen":"","o":[{"t":"Celów jakości wewnętrznej","ok":false,"w":"Te pytają o jakość wewnętrzną i zgodność z dobrą praktyką i regułami."},{"t":"Celów jakości kontekstowej","ok":false,"w":"Te pytają, czy proces jest dopasowany, zrozumiały i łatwy w użyciu."},{"t":"Celów dostępności i bezpieczeństwa","ok":true,"w":"Tak: poufność i dostępność dla potrzebujących to ta kategoria."},{"t":"Wskaźników wiodących procesu","ok":false,"w":"To mierniki stosowania praktyk, a nie kategoria celów procesu."}],"fz":{"h":"Kategorie celów procesu","p":"P1","pulapka":false,"n":"EN: Intrinsic, contextual, accessibility and security goals","q":"Podaj kategorie celów procesu z przykładowymi pytaniami.","a":"Cele wewnętrzne: czy proces ma jakość wewnętrzną, jest zgodny z dobrą praktyką i regułami? Cele kontekstowe: czy jest dopasowany, zrozumiały, łatwy w użyciu? Cele dostępności i bezpieczeństwa: poufny, gdy trzeba, znany i dostępny dla potrzebujących.","ex":"Jak ocena restauracji: wewnętrzne – czy kuchnia trzyma standard; kontekstowe – czy danie pasuje gościowi; dostępność i bezpieczeństwo – czy trafia na czas do właściwego stolika.","org":""},"cyt":{"s":"69","t":"Cele dotyczące dostępności i bezpieczeństwa — proces pozostaje poufny, gdy jest to wymagane, oraz jest znany i dostępny dla osób, które tego potrzebują.","w":"ZGODNE"}},"fz-B-028":{"id":"fz-B-028","typ":"egzamin","s":"EN-02-08","t":"Co oznacza litera A w kryteriach SMART dla mierników procesu w COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 69"],"r":null,"zap":"","scen":"","o":[{"t":"Achievable","ok":false,"w":"To popularne rozwinięcie, ale w COBIT 5 A = Actionable."},{"t":"Actionable","ok":true,"w":"Tak: w COBIT 5 litera A w SMART oznacza Actionable (przekładalne na działania), a nie Achievable (FW-PL s. 69)."},{"t":"Accountable","ok":false,"w":"To litera A w RACI (Responsible, Accountable, Consulted, Informed — odpowiedzialny wykonawczo, odpowiedzialny decyzyjnie, konsultowany, informowany), nie w SMART (Specific, Measurable, Actionable, Relevant, Timely — specyficzne, mierzalne, umożliwiające podjęcie działań, istotne i terminowe)."},{"t":"Accessible","ok":false,"w":"Dostępność to kategoria celów procesu, a nie kryterium SMART (Specific, Measurable, Actionable, Relevant, Timely — specyficzne, mierzalne, umożliwiające podjęcie działań, istotne i terminowe)."}],"fz":{"h":"Mierniki procesu: SMART","p":"P2","pulapka":true,"n":"EN: SMART metrics","q":"Jakie kryteria powinny spełniać mierniki procesu?","a":"SMART: specyficzne, mierzalne (podr. wymierne), składające się z konkretnych działań (EN actionable – da się na ich podstawie działać), istotne, terminowe. Pułapka: w COBIT 5 A = Actionable, nie popularne Achievable (osiągalne).","ex":"Jak cel odchudzania: „schudnę 3 kg do 1 czerwca, chodząc codziennie 5 km” – konkretny, mierzalny, wiadomo, co robić, ma sens i termin. „Chcę być fit” nie jest SMART.","org":""},"cyt":{"s":"69","t":"Mierniki powinny spełniać kryteria SMART — muszą być specyficzne, wymierne, składające się z konkretnych działań, istotne i terminowe","w":"ZGODNE","u":"Podręcznik tłumaczy Actionable jako „składające się z konkretnych działań”."}},"fz-B-029":{"id":"fz-B-029","typ":"egzamin","s":"EN-02-09","t":"Jaki jest cykl życia procesu w COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 70"],"r":null,"zap":"","scen":"","o":[{"t":"Siedem faz wdrożenia, od wyznaczników do utrzymania motywacji","ok":false,"w":"To fazy cyklu życia wdrożenia, nie cykl życia procesu."},{"t":"Ocena, kierowanie i monitorowanie","ok":false,"w":"To działania Ładu (EDM (Evaluate, Direct and Monitor — Oszacuj, Kieruj i Monitoruj))."},{"t":"Definiowanie, tworzenie, obsługa, monitorowanie, zmiana lub wycofanie","ok":true,"w":"Proces ma własny cykl życia: jest definiowany, tworzony, obsługiwany, monitorowany, a następnie dostosowywany lub aktualizowany albo wycofywany. Nie jest to siedem faz wdrażania COBIT 5 (FW-PL s. 70)."},{"t":"Planowanie, wytwarzanie, wykonywanie i monitorowanie","ok":false,"w":"To obszary działań Zarządzania (PBRM (Plan, Build, Run and Monitor — Planuj, Wytwarzaj, Wykonuj i Monitoruj))."}],"fz":{"h":"Cykl życia procesu","p":"P2","pulapka":false,"n":"EN: Process life cycle","q":"Jaki jest cykl życia procesu?","a":"Proces jest definiowany, tworzony, obsługiwany, monitorowany oraz dostosowywany/aktualizowany lub wycofywany.","ex":"Jak sklep: pomysł (definiowanie), otwarcie (tworzenie), codzienna praca (obsługa), liczenie utargu (monitorowanie), potem remont albo zamknięcie (dostosowanie lub wycofanie).","org":""},"cyt":{"s":"70","t":"Jest on definiowany, tworzony, obsługiwany, monitorowany oraz dostosowywany/aktualizowany lub wycofywany.","w":"ZGODNE"}},"fz-B-030":{"id":"fz-B-030","typ":"egzamin","s":"EN-02-10","t":"Czym jest praktyka Ładu lub Zarządzania?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 70","FW-PL s. 91"],"r":null,"zap":"","scen":"","o":[{"t":"Szczegółową procedurą, którą wdraża się bez zmian","ok":false,"w":"Praktyki są ogólne i trzeba je dopasować do organizacji."},{"t":"Kompletnym zbiorem wymagań procesu zawartym w jednym punkcie","ok":false,"w":"Dopiero zestaw praktyk procesu daje kompletny zbiór wymagań."},{"t":"Produktem pracy na wejściu lub wyjściu procesu","ok":false,"w":"To wejścia i wyjścia."},{"t":"Ogólną deklaracją działania organu Ładu lub kierownictwa","ok":true,"w":"Praktyka to ogólna deklaracja działania organu Ładu lub kierownictwa w procesie, którą trzeba dopasować do organizacji (FW-PL s. 91)."}],"fz":{"h":"Praktyka Ładu/Zarządzania","p":"P1","pulapka":true,"n":"EN: Governance/management practice","q":"Czym jest praktyka Ładu/Zarządzania?","a":"Ogólna deklaracja działania organu Ładu lub kierownictwa w danym procesie. Dopiero zestaw praktyk procesu daje kompletny zbiór ogólnych wymagań. Praktyki są ogólne, więc trzeba je dopasować do organizacji.","ex":"Praktyka to jeden punkt z listy kontrolnej pilota; dopiero cała lista mówi, co musi być zrobione. Lista jest uniwersalna, więc każda linia lotnicza dopasowuje ją do siebie.","org":""},"cyt":{"s":"91","t":"Stanowią one deklaracje dotyczące działań ze strony organów nadzorujących i zarządczych.","w":"ZGODNE","u":"Konieczność dostosowania: s.70 „typowe i w związku z tym muszą zostać dostosowane do potrzeb każdego przedsiębiorstwa”."}},"fz-B-031":{"id":"fz-B-031","typ":"egzamin","s":"EN-02-10","t":"Który z poniższych NIE jest wyborem organu Ładu i kierownictwa co do praktyk?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 70"],"r":null,"zap":"","scen":"","o":[{"t":"Wdrożenie wszystkich praktyk COBIT 5 bez zmian, bo są obowiązkowe","ok":true,"w":"Praktyki można wybierać i dostosowywać, a nawet świadomie ich nie wdrożyć."},{"t":"Dodanie lub dostosowanie praktyk","ok":false,"w":"To jeden z wyborów organu Ładu i kierownictwa wymienionych w podręczniku (FW-PL s. 70)."},{"t":"Wybór częstotliwości, zakresu i stopnia automatyzacji wdrożenia","ok":false,"w":"To wybór sposobu wdrożenia wymieniony w podręczniku (FW-PL s. 70)."},{"t":"Zaakceptowanie ryzyka niewdrożenia praktyki","ok":false,"w":"Tak można zrobić; podręcznik wymienia świadome zaakceptowanie ryzyka niewdrożenia praktyki (FW-PL s. 70)."}],"fz":{"h":"Wybory co do praktyk","p":"P2","pulapka":false,"n":"EN: Choices on practices, incl. accepting the risk of not implementing","q":"Jakie wybory co do praktyk podejmuje organ Ładu i kierownictwo?","a":"Wybierają właściwe praktyki i decydują o wdrożeniu; dodają lub dostosowują praktyki; definiują praktyki spoza IT; wybierają sposób wdrożenia (częstotliwość, zakres, automatyzacja); akceptują ryzyko niewdrożenia praktyki.","ex":"Jak inwestor domu: wybiera z katalogu, dodaje własne pomysły, decyduje, co zautomatyzować, i może świadomie zrezygnować z alarmu, biorąc na siebie ryzyko włamania.","org":""},"cyt":{"s":"70","t":"Organ nadzorujący oraz kadra kierownicza w przedsiębiorstwie muszą dokonywać wyborów w odniesieniu do tych praktyk nadzoru i zarządzania poprzez:","w":"ZGODNE","u":"Lista wyborów obejmuje m.in. wybór właściwych praktyk i akceptację ryzyka niewdrożenia praktyk – brak „wdrożenia wszystkich bez zmian”."}},"fz-B-032":{"id":"fz-B-032","typ":"egzamin","s":"EN-02-10","t":"Czym są działania procesu w COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 70"],"r":null,"zap":"","scen":"","o":[{"t":"Ogólnymi deklaracjami tego, co trzeba robić w procesie","ok":false,"w":"To praktyki."},{"t":"Koniecznymi i wystarczającymi krokami do wdrożenia praktyki","ok":true,"w":"Tak: to podstawowe czynności obsługi procesu."},{"t":"Produktami pracy umożliwiającymi kluczowe decyzje","ok":false,"w":"To wejścia i wyjścia."},{"t":"Miernikami stosowania praktyk","ok":false,"w":"To wskaźniki wiodące."}],"fz":{"h":"Działania procesu","p":"P1","pulapka":true,"n":"EN: Activities","q":"Czym są działania procesu?","a":"Podstawowymi czynnościami obsługi procesu: koniecznymi i wystarczającymi krokami do wdrożenia praktyki. Uwzględniają wejścia i wyjścia, opierają się na dobrych praktykach, ułatwiają przypisanie ról.","ex":"Działania to kroki przepisu: „rozbij jajka, dodaj mąkę, piecz 40 minut”. Tylko potrzebne, ani jednego za dużo, i wiadomo, kto przy którym stoi.","org":""},"cyt":{"s":"70","t":"opisują zbiór koniecznych i wystarczających kroków zorientowanych na działanie wymaganych do wdrożenia praktyki nadzoru/praktyki zarządzania (GP/MP)","w":"ZGODNE"}},"fz-B-033":{"id":"fz-B-033","typ":"egzamin","s":"EN-02-10","t":"Jak należy stosować działania procesów COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 70"],"r":null,"zap":"","scen":"","o":[{"t":"Dosłownie, jako gotowe procedury","ok":false,"w":"Trzeba je dostosować i rozwinąć w procedury organizacji."},{"t":"Dosłownie, ale tylko w procesach Ładu","ok":false,"w":"Działania nie są normatywne w żadnym procesie."},{"t":"Po dostosowaniu i rozwinięciu w procedury","ok":true,"w":"Działania nie są normatywne: trzeba je dostosować i rozwinąć w konkretne procedury organizacji."},{"t":"Wcale – COBIT 5 nie opisuje działań","ok":false,"w":"COBIT 5 opisuje działania, tylko nie są one obowiązkowe."}],"fz":{"h":"Czy działania są normatywne","p":"P2","pulapka":false,"n":"EN: Activities are not prescriptive","q":"Czy działania procesu są normatywne?","a":"Nie. Trzeba je dostosować i rozwinąć w konkretne procedury właściwe dla organizacji.","ex":"Działania z COBIT to przepis ogólny, jak „dopraw do smaku”. Każda kuchnia zapisuje własną dokładną procedurę: ile soli, w jakim garnku.","org":""},"cyt":{"s":"70","t":"nie mają charakteru normatywnego i muszą zostać dostosowane oraz rozwinięte w celu opracowania konkretnych procedur odpowiednich dla przedsiębiorstwa.","w":"ZGODNE"}},"fz-B-034":{"id":"fz-B-034","typ":"egzamin","s":"EN-02-10","t":"Do czego służą wejścia i wyjścia procesu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 70"],"r":null,"zap":"","scen":"","o":[{"t":"Określają, kto jest odpowiedzialny wykonawczo i decyzyjnie","ok":false,"w":"To robi tabela RACI (Responsible, Accountable, Consulted, Informed — odpowiedzialny wykonawczo, odpowiedzialny decyzyjnie, konsultowany, informowany)."},{"t":"Opisują ogólny cel, któremu służy proces","ok":false,"w":"To przeznaczenie procesu."},{"t":"Służą wyłącznie wewnątrz jednego procesu","ok":false,"w":"Często są wejściami innych procesów."},{"t":"Wspierają decyzje i tworzą ścieżkę rewizyjną","ok":true,"w":"Wejścia i wyjścia to produkty pracy określane dla praktyk: umożliwiają kluczowe decyzje, zostawiają ścieżkę rewizyjną i pozwalają sprawdzić przebieg po incydencie."}],"fz":{"h":"Wejścia i wyjścia procesu","p":"P2","pulapka":false,"n":"EN: Inputs and outputs","q":"Czym są wejścia i wyjścia procesu?","a":"Produktami pracy potrzebnymi w procesie. Umożliwiają kluczowe decyzje, zostawiają ślad do kontroli (ścieżkę rewizyjną) i pozwalają sprawdzić przebieg po incydencie; określa się je dla praktyk; często są wejściami innych procesów.","ex":"Jak papiery w warsztacie: zlecenie naprawy (wejście), karta naprawy i faktura (wyjście). Widać, kto co zdecydował, a karta trafia potem dalej, np. do księgowości.","org":""},"cyt":{"s":"70","t":"Umożliwiają podejmowanie kluczowych decyzji, zapewniają rejestr oraz ścieżkę rewizyjną dla działań w ramach procesu i pozwalają na weryfikację w przypadku wystąpienia incydentu.","w":"ZGODNE"}},"fz-B-035":{"id":"fz-B-035","typ":"egzamin","s":"EN-02-11","t":"Który zestaw opisuje relacje Procesów z innymi aktywatorami?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 71"],"r":null,"zap":"","scen":"","o":[{"t":"Informacja na wejściu i wyjściu, role w RACI, potrzebne zdolności usługowe","ok":true,"w":"Procesy wymagają informacji i mogą jej dostarczać, korzystają z ról oraz struktur, a także wymagają i dostarczają zdolności usługowych. Zależą też od innych procesów, polityk i kultury (s.71)."},{"t":"Wartości organizacji, osobiste wartości, reakcje na negatywne wyniki","ok":false,"w":"To zakres celów aktywatora Kultura, Etyka i Zachowanie. Może wpływać na procesy, ale nie jest przytoczoną listą ich relacji (s.79)."},{"t":"Pryncypia architektury, punkty widzenia, repozytorium i poziomy usług","ok":false,"w":"To dobre praktyki aktywatora Usługi, Infrastruktura i Aplikacje, a nie opis relacji procesu z pozostałymi aktywatorami (s.85–86)."},{"t":"Wytwarzanie informacji, opieka nad informacją i jej wykorzystanie","ok":false,"w":"To ogólne role interesariuszy informacji: wytwórca, opiekun i konsument. Nie są pełną listą relacji procesów (s.82)."}],"fz":{"h":"Procesy a inne aktywatory","p":"P2","pulapka":false,"n":"EN: Processes – relationships with other enablers","q":"Jak procesy wiążą się z innymi aktywatorami?","a":"Wymagają i dostarczają informacji; wymagają struktur i ról z RACI; zapewniają i wymagają zdolności usługowej; zależą od innych procesów; wymagają polityk i procedur; kultura i zachowanie decydują o ich skuteczności.","ex":"Aktywator = wszystko, co pomaga działać. Gotowanie w restauracji potrzebuje zamówień (informacja), kucharzy z rolami, sprzętu, dostaw (inny proces), regulaminu i dobrej atmosfery (kultura).","org":""},"cyt":{"s":"71","t":"Procesy wymagają informacji (stanowiących jeden z typów danych wejściowych) oraz mogą dostarczać informacji (jako produktów działań).","w":"ZGODNE","u":"Role RACI i zdolności do świadczenia usług to kolejne punkty tej samej listy relacji (s.71)."}},"fz-B-036":{"id":"fz-B-036","typ":"egzamin","s":"EN-02-24","t":"Który element NIE wchodzi w skład opisu procesu w przewodniku Procesy umożliwiające (Enabling Processes)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["Enabling Processes s. 25","SYL EN02.24","SYL EN02.25","FW-PL s. 33"],"r":null,"zap":"","scen":"","o":[{"t":"Tabela ról i odpowiedzialności RACI","ok":false,"w":"RACI (Responsible, Accountable, Consulted, Informed — odpowiedzialny wykonawczo, odpowiedzialny decyzyjnie, konsultowany, informowany) jest częścią opisu procesu. Tabela określa zaangażowanie ról w praktyki procesu (Enabling Processes s.25; sylabus PeopleCert EN02.25)."},{"t":"Deklaracja przeznaczenia procesu","ok":false,"w":"Przeznaczenie wyjaśnia ogólnie, po co proces istnieje i jakie są spodziewane rezultaty jego skutecznej realizacji. Jest elementem opisu procesu, odrębnym od konkretnych celów i mierników (Enabling Processes s.25; sylabus PeopleCert EN02.24)."},{"t":"Wynik oceny zdolności procesu","ok":true,"w":"Enabling Processes opisuje procesy w sposób ogólny, niezależny od konkretnego wdrożenia. Wynik oceny zdolności ustala się dla rzeczywiście realizowanego procesu na podstawie dowodów; nie stanowi części jego ogólnego opisu w tym przewodniku (Enabling Processes s.25; podręcznik COBIT 5 PL s.42–46)."},{"t":"Odniesienia do powiązanych wytycznych","ok":false,"w":"Powiązane wytyczne wskazują inne standardy i struktury ramowe dotyczące danego procesu. Są częścią opisu procesu w przewodniku Enabling Processes (s.25)."}],"fz":{"h":"Opis procesu w Procesach umożliwiających","p":"P2","pulapka":false,"n":"EN: Process description components (COBIT 5: Enabling Processes)","q":"Z jakich elementów składa się opis procesu w Procesach umożliwiających?","a":"Etykieta (kod), nazwa, obszar (Ład/Zarządzanie), domena; opis procesu; przeznaczenie procesu; kaskada celów (cele IT i mierniki); cele i mierniki procesu; RACI; praktyki z wejściami/wyjściami i działaniami; powiązane wytyczne.","ex":"Jak etykieta na słoiku plus przepis: kod i nazwa, po co jest, cele i mierniki, kto co robi (RACI), kroki z wejściami i wyjściami, gdzie doczytać więcej.","org":""},"cyt":{"s":"","t":"","w":"BRAK_W_FW","u":"Struktura opisu procesu pochodzi z przewodnika COBIT 5: Enabling Processes (s.25), nie z FW-PL; FW-PL opisuje tylko ogólny model procesu (s.69–71)."}},"fz-B-037":{"id":"fz-B-037","typ":"egzamin","s":"EN-02-25","t":"Do czego służy diagram RACI?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 93"],"r":null,"zap":"","scen":"","o":[{"t":"Wiąże mierniki z osiągnięciem celów aktywatora","ok":false,"w":"To robią wskaźniki opóźnione."},{"t":"Wiąże koszty informatyki z jednostkami odbiorców","ok":false,"w":"To refundacja kosztów IT (chargeback)."},{"t":"Wiąże praktyki procesu z rolami i odpowiedzialnością","ok":true,"w":"RACI (Responsible, Accountable, Consulted, Informed — odpowiedzialny wykonawczo, odpowiedzialny decyzyjnie, konsultowany, informowany) opisuje zaangażowanie ról w praktyki procesu. Wskazuje wykonanie, ostateczną odpowiedzialność, konsultowanie i informowanie."},{"t":"Wiąże fazy cyklu życia z okresami działania procesu","ok":false,"w":"To cykl życia procesu."}],"fz":{"h":"Diagram RACI","p":"P1","pulapka":false,"n":"EN: RACI chart","q":"Do czego służy diagram RACI?","a":"Określa, kto w strukturze organizacyjnej jest odpowiedzialny wykonawczo, odpowiedzialny decyzyjnie, konsultowany i informowany w ramach praktyk procesu.","ex":"Tabela jak grafik remontu: w wierszach zadania, w kolumnach osoby, w kratkach litery R, A, C, I. Rzut oka i wiesz, do kogo iść.","org":""},"cyt":{"s":"31","t":"Model procesu uwzględnia również tabele RACI, opisujące zakresy odpowiedzialności różnych struktur organizacyjnych oraz ról w ramach przedsiębiorstwa.","w":"ZGODNE"}},"fz-B-039":{"id":"fz-B-039","typ":"egzamin","s":"EN-02-25","t":"Ile ról oznacza się literą A (odpowiedzialny decyzyjnie) dla jednej praktyki w tabeli RACI?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 89","FW-PL s. 93"],"r":null,"zap":"","scen":"","o":[{"t":"Kilka – wszystkich wykonawców","ok":false,"w":"To R; wykonawców może być kilku."},{"t":"Wszystkie role konsultowane","ok":false,"w":"Konsultowani to C."},{"t":"Dwie – prezesa i CEO","ok":false,"w":"A to jedna wskazana rola; może nią być osoba lub organ."},{"t":"Jedną – ostatecznie odpowiedzialną","ok":true,"w":"Jedną – rolę ostatecznie odpowiedzialną za powodzenie zadania w danej praktyce; w innych praktykach A może mieć inna rola; gdy odpowiadają wszyscy, nie odpowiada nikt."}],"fz":{"h":"RACI","p":"P1","pulapka":true,"n":"egzamin: RACI · podr.: RACI · EN: Responsible, Accountable, Consulted, Informed","q":"Co oznacza RACI? / RACI: co oznacza A – Odpowiedzialny decyzyjnie?","a":"R odpowiedzialny (wykonuje i zapewnia realizację), A rozliczany (jedna rola ostatecznie odpowiedzialna za powodzenie, z uprawnieniami; osoba lub organ), C konsultowany (dwukierunkowo), I informowany (jednokierunkowo).\nKto odpowiada za powodzenie zadania? Osoba lub jednostka ostatecznie odpowiedzialna. Podr.: strona rozliczana.","ex":"Remont: R – fachowiec, który kładzie kafelki; A – właściciel mieszkania, który ostatecznie odpowiada za efekt (jedna rola, np. też wspólnota); C – sąsiad, z którym ustalasz; I – administracja, którą powiadamiasz.\nA to ten, kto się rozlicza: właściciel mieszkania odpowiada za efekt remontu, choć sam nie kładzie płytek (to R). Jedna wskazana rola, bo gdy odpowiadają wszyscy, nie odpowiada nikt.","org":"A: właściciel procesu DSS02; R: dyżurny."},"cyt":{"s":"89","t":"Osoba, grupa lub jednostka ostatecznie odpowiedzialna za daną kwestię, proces lub zakres.","w":"CZESCIOWO","u":"FW-PL nie mówi, że A to tylko jedna rola (dopuszcza „grupę”); zasada jednego A pochodzi z praktyki RACI/Enabling Processes."}},"fz-B-040":{"id":"fz-B-040","typ":"egzamin","s":"EN-02-25","t":"Jaki rodzaj komunikacji dotyczy roli C (konsultowany) w RACI?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 90"],"r":null,"zap":"","scen":"","o":[{"t":"Dwukierunkowa – zasięga się opinii i słucha odpowiedzi","ok":true,"w":"Tak: C zapewnia dane wejściowe."},{"t":"Jednokierunkowa – tylko powiadomienie o postępach","ok":false,"w":"To rola I – informowany."},{"t":"Żadna – C samodzielnie wykonuje zadanie","ok":false,"w":"Zadanie wykonuje R."},{"t":"Rozliczeniowa – C odpowiada ostatecznie za powodzenie","ok":false,"w":"To rola A."}],"fz":{"h":"RACI: C – Konsultant","p":"P1","pulapka":true,"n":"EN: Consulted","q":"RACI: co oznacza C – Konsultant?","a":"Kto zapewnia dane wejściowe? Osoby, których opinii się zasięga; komunikacja dwukierunkowa.","ex":"C jak „Co sądzisz?”: sąsiad, z którym ustalasz godziny wiercenia. Rozmowa w obie strony – pytasz i słuchasz odpowiedzi.","org":""},"cyt":{"s":"90","t":"Strona konsultowana (RACI) Odnosi się do osób, u których zasięga się opinii na temat danego działania (komunikacja dwukierunkowa).","w":"ZGODNE"}},"fz-B-041":{"id":"fz-B-041","typ":"egzamin","s":"EN-02-25","t":"Kogo oznacza litera I w tabeli RACI?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 92"],"r":null,"zap":"","scen":"","o":[{"t":"Osoby zapewniające dane wejściowe w rozmowie dwukierunkowej","ok":false,"w":"To C – konsultowany."},{"t":"Rolę ostatecznie odpowiedzialną za powodzenie zadania","ok":false,"w":"To A – odpowiedzialny decyzyjnie."},{"t":"Osoby informowane o postępach i efektach – komunikacja jednokierunkowa","ok":true,"w":"Tak: wiadomość idzie w jedną stronę."},{"t":"Role najbardziej zaangażowane operacyjnie w wykonanie działań","ok":false,"w":"To R – odpowiedzialny wykonawczo."}],"fz":{"h":"RACI: I – Informowany","p":"P1","pulapka":true,"n":"EN: Informed","q":"RACI: co oznacza I – Informowany?","a":"Kto otrzymuje informacje? Osoby informowane o postępach i efektach; komunikacja jednokierunkowa.","ex":"I jak „Informacja”: administracja dostaje kartkę, że w środę remont. Wiadomość idzie tylko w jedną stronę, nikt nie czeka na odpowiedź.","org":""},"cyt":{"s":"92","t":"Odnosi się do osób, które otrzymują aktualne dane dotyczące postępów w realizacji działań (komunikacja jednokierunkowa).","w":"ZGODNE"}},"fz-B-042":{"id":"fz-B-042","typ":"egzamin","s":"PR-01-04","t":"Który proces APO zarządza umowami o świadczenie usług?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 33"],"r":null,"zap":"","scen":"","o":[{"t":"APO09","ok":true,"w":"APO09 — Manage Service Agreements, Zarządzanie umowami o świadczenie usług — dotyczy uzgadniania i zarządzania zobowiązaniami usługowymi. APO08 — Manage Relationships, Zarządzanie relacjami — oraz APO10 — Manage Suppliers, Zarządzanie dostawcami — są odrębnymi procesami."},{"t":"APO10","ok":false,"w":"APO10 (Manage Suppliers — Zarządzanie dostawcami) to Zarządzanie dostawcami."},{"t":"APO08","ok":false,"w":"APO08 (Manage Relationships — Zarządzanie relacjami) to Zarządzanie relacjami."},{"t":"APO11","ok":false,"w":"APO11 (Manage Quality — Zarządzanie jakością) to Zarządzanie jakością."}],"fz":{"h":"13 procesów APO","p":"P2","pulapka":false,"n":"APO — Align, Plan and Organise — Dostosuj, Planuj i Organizuj. 13 procesów.","q":"Podaj 13 procesów domeny APO (Dostosuj, Planuj i Organizuj).","a":"APO01 — Zarządzanie strukturą ramową zarządzania IT (Manage the IT Management Framework); APO02 — Zarządzanie strategią (Manage Strategy); APO03 — Zarządzanie architekturą korporacyjną (Manage Enterprise Architecture); APO04 — Zarządzanie innowacjami (Manage Innovation); APO05 — Zarządzanie portfelem (Manage Portfolio); APO06 — Zarządzanie budżetem i kosztami (Manage Budget and Costs); APO07 — Zarządzanie zasobami ludzkimi (Manage Human Resources); APO08 — Zarządzanie relacjami (Manage Relationships); APO09 — Zarządzanie umowami o świadczenie usług (Manage Service Agreements); APO10 — Zarządzanie dostawcami (Manage Suppliers); APO11 — Zarządzanie jakością (Manage Quality); APO12 — Zarządzanie ryzykiem (Manage Risk); APO13 — Zarządzanie bezpieczeństwem (Manage Security). W podręczniku APO05 nazwano „Zarządzanie portfelem projektów”; angielskie Manage Portfolio ma szerszy zakres. APO07 dotyczy zasobów ludzkich, a APO08 relacji.","ex":"APO (Align, Plan and Organise — Dostosuj, Planuj i Organizuj) to biuro restauracji: plan, karta dań, budżet, kadry, umowy z dostawcami, kontrola jakości, ryzyko i zamki w drzwiach. Uwaga terminologiczna: „APO07 Relacje ludzkie”, „BAI04 Moc obliczeniowa” i „DSS01 Operacje” są potocznymi skrótami notatek. W podręczniku: APO07 (Manage Human Resources — Zarządzanie zasobami ludzkimi); BAI04 (Manage Availability and Capacity — Zarządzanie dostępnością i pojemnością); DSS01 (Manage Operations — Zarządzanie eksploatacją).","org":""},"cyt":{"s":"33","t":"APO09 Zarządzanie umowami o świadczenie usług","w":"ZGODNE"}},"fz-B-043":{"id":"fz-B-043","typ":"egzamin","s":"PR-01-04","t":"Czym zarządza proces BAI08?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 33"],"r":null,"zap":"","scen":"","o":[{"t":"Konfiguracją","ok":false,"w":"To BAI10 (Manage Configuration — Zarządzanie konfiguracją)."},{"t":"Wiedzą","ok":true,"w":"BAI08 — Manage Knowledge, Zarządzanie wiedzą — to proces dotyczący wiedzy. BAI09 — Manage Assets, Zarządzanie aktywami (podr. zasobami) — dotyczy aktywów, a BAI10 — Manage Configuration, Zarządzanie konfiguracją — konfiguracji."},{"t":"Zasobami (aktywami)","ok":false,"w":"To BAI09 (Manage Assets — Zarządzanie aktywami; podr. Zarządzanie zasobami)."},{"t":"Definiowaniem wymagań","ok":false,"w":"To BAI02 (Manage Requirements Definition — Zarządzanie definiowaniem wymagań)."}],"fz":{"h":"10 procesów BAI","p":"P2","pulapka":false,"n":"BAI — Build, Acquire and Implement — Twórz, Nabywaj i Wdrażaj. 10 procesów.","q":"Podaj 10 procesów domeny BAI (Twórz, Nabywaj i Wdrażaj).","a":"BAI01 — Zarządzanie programami i projektami (Manage Programmes and Projects); BAI02 — Zarządzanie definiowaniem wymagań (Manage Requirements Definition); BAI03 — Zarządzanie identyfikacją i budowaniem rozwiązań (Manage Solutions Identification and Build); BAI04 — Zarządzanie dostępnością i pojemnością (Manage Availability and Capacity); BAI05 — Zarządzanie wdrażaniem zmian organizacyjnych (Manage Organisational Change Enablement); BAI06 — Zarządzanie zmianami (Manage Changes); BAI07 — Zarządzanie procesem akceptacji zmian i przejścia (Manage Change Acceptance and Transitioning); BAI08 — Zarządzanie wiedzą (Manage Knowledge); BAI09 — Zarządzanie aktywami; podr. Zarządzanie zasobami (Manage Assets); BAI10 — Zarządzanie konfiguracją (Manage Configuration).","ex":"BAI (Build, Acquire and Implement — Twórz, Nabywaj i Wdrażaj) to budowa nowej kuchni: projekt, lista wymagań, montaż sprzętu, odbiór, przeszkolenie kucharzy, spis wyposażenia i jego ustawień.","org":""},"cyt":{"s":"33","t":"BAI08 Zarządzanie wiedzą","w":"ZGODNE"}},"fz-B-045":{"id":"fz-B-045","typ":"egzamin","s":"PR-01-04","t":"Jak brzmi polska nazwa procesu APO07?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 33"],"r":null,"zap":"","scen":"","o":[{"t":"Zarządzanie relacjami ludzkimi","ok":false,"w":"To nieoficjalne spolszczenie z notatek."},{"t":"Zarządzanie zasobami ludzkimi","ok":true,"w":"Tak nazywa APO07 (Manage Human Resources) polski podręcznik na Ilustracji 16 (FW-PL s. 33)."},{"t":"Zarządzanie relacjami","ok":false,"w":"To APO08."},{"t":"Zarządzanie zasobami","ok":false,"w":"To BAI09, proces o aktywach."}],"fz":{"h":"Nieoficjalne nazwy procesów","p":"P2","pulapka":true,"n":"EN: Unofficial PL names vs manual names","q":"„APO07 Relacje ludzkie”, „BAI04 Moc obliczeniowa”, „DSS01 Operacje” – czy to nazwy z podręcznika?","a":"Nie, to nieoficjalne spolszczenia z notatek. Podręcznik PL (Rysunek 16): APO07 Zarządzanie zasobami ludzkimi, BAI04 Zarządzanie dostępnością i pojemnością, DSS01 Zarządzanie eksploatacją. Rozpoznawaj proces po kodzie i sensie.","ex":"Jak potoczne nazwy dań („schabowy”) i nazwy z karty: w zamówieniu liczy się, które to danie, a nie słowo.","org":""},"cyt":{"s":"33","t":"APO07 Zarządzanie zasobami ludzkimi","w":"ZGODNE"}},"fz-B-046":{"id":"fz-B-046","typ":"egzamin","s":"PR-01-03,PR-01-04","t":"Co odróżnia BAI09 „Zarządzanie zasobami” od EDM04 „Zapewnienie optymalizacji zasobów”?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 33","FW-PL s. 93","COBIT 5 Enabling Processes — opis procesów BAI09 i EDM04"],"r":null,"zap":"","scen":"","o":[{"t":"BAI09 sprawuje Ład, a EDM04 zarządza aktywami","ok":false,"w":"Role są odwrócone: BAI09 (Manage Assets — Zarządzanie aktywami; podr. Zarządzanie zasobami) jest procesem Zarządzania aktywami, a EDM04 (Ensure Resource Optimisation — Zapewnienie optymalizacji zasobów) procesem Ładu zapewniającym optymalizację zasobów."},{"t":"Oba mają ten sam zakres i tę samą rolę","ok":false,"w":"Zakresy częściowo się nakładają, ale nie są tożsame. EDM04 (Ensure Resource Optimisation — Zapewnienie optymalizacji zasobów) dotyczy optymalizacji szerszego zbioru zasobów na poziomie Ładu; BAI09 (Manage Assets — Zarządzanie aktywami; podr. Zarządzanie zasobami) zarządza aktywami na poziomie Zarządzania."},{"t":"BAI09 zarządza aktywami IT, a EDM04 optymalizuje zasoby","ok":true,"w":"BAI09 (Manage Assets — Zarządzanie aktywami; podr. Zarządzanie zasobami) zarządza aktywami IT (Information Technology — technologie informacyjne), np. sprzętem i licencjami. EDM04 (Ensure Resource Optimisation — Zapewnienie optymalizacji zasobów) zapewnia optymalne wykorzystanie szerszego zbioru zasobów, w tym także tych aktywów. Procesy różnią się rolą i zakresem, nie rozłącznością zasobów."},{"t":"BAI09 dotyczy ludzi, a EDM04 sprzętu i licencji","ok":false,"w":"BAI09 (Manage Assets — Zarządzanie aktywami; podr. Zarządzanie zasobami) nie jest procesem zarządzania zasobami ludzkimi — to APO07 (Manage Human Resources — Zarządzanie zasobami ludzkimi). EDM04 (Ensure Resource Optimisation — Zapewnienie optymalizacji zasobów) nie prowadzi codziennej ewidencji sprzętu i licencji, lecz zapewnia optymalizację zasobów na poziomie Ładu."}],"fz":{"h":"BAI09 a EDM04","p":"P2","pulapka":true,"n":"EN: BAI09 (Manage Assets — Zarządzanie aktywami; podr. Zarządzanie zasobami) Manage Assets vs EDM04 (Ensure Resource Optimisation — Zapewnienie optymalizacji zasobów) Ensure Resource Optimisation","q":"Co odróżnia BAI09 od EDM04 i czy ich zakresy zasobów mogą się nakładać?","a":"BAI09 (Manage Assets — Zarządzanie aktywami; podr. Zarządzanie zasobami) Manage Assets — Zarządzanie aktywami (w podręczniku: Zarządzanie zasobami) zarządza aktywami IT (Information Technology — technologie informacyjne) w ich cyklu życia, np. sprzętem i licencjami. EDM04 Ensure Resource Optimisation — Zapewnienie optymalizacji zasobów to proces Ładu obejmujący szerszy zbiór zasobów: ludzi, finanse, sprzęt, infrastrukturę i informacje. Zakresy się nakładają: aktywa zarządzane w BAI09 są również częścią zasobów optymalizowanych w EDM04. Różnią się rolą i zakresem, a nie rozłącznością zasobów.","ex":"Spis garnków w magazynie to BAI09 (Manage Assets — Zarządzanie aktywami; podr. Zarządzanie zasobami). Pilnowanie przez właściciela, by ludzie, budżet i kuchnia były dobrze wykorzystane, to proces EDM04 (Ensure Resource Optimisation — Zapewnienie optymalizacji zasobów).","org":""},"cyt":{"s":"93","t":"Jeden z celów nadzoru. Obejmuje skuteczne, wydajne i odpowiedzialne wykorzystanie wszystkich zasobów — ludzkich, finansowych, sprzętu, infrastruktury itd.","w":"CZESCIOWO","u":"FW-PL potwierdza szeroki zakres optymalizacji zasobów (EDM04), ale BAI09 nazywa „Zarządzanie zasobami” (s.33) i nie opisuje go jako aktywów IT – to z Enabling Processes."}},"fz-B-047":{"id":"fz-B-047","typ":"egzamin","s":"PR-01-04","t":"Który proces odpowiada za codzienną ochronę, np. dostęp, uprawnienia i ochronę przed złośliwym oprogramowaniem?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 33"],"r":null,"zap":"","scen":"","o":[{"t":"APO13 Zarządzanie bezpieczeństwem","ok":false,"w":"APO13 (Manage Security — Zarządzanie bezpieczeństwem) ustala i utrzymuje podejście do bezpieczeństwa (domena planowania)."},{"t":"DSS06 Zarządzanie mechanizmami kontrolnymi procesów biznesowych","ok":false,"w":"DSS06 (Manage Business Process Controls — Zarządzanie mechanizmami kontrolnymi procesów biznesowych) to kontrole wbudowane w procesy biznesowe."},{"t":"EDM03 Zapewnienie optymalizacji ryzyka","ok":false,"w":"EDM03 (Ensure Risk Optimisation — Zapewnienie optymalizacji ryzyka) to proces Ładu ustalający apetyt na ryzyko."},{"t":"DSS05 Zarządzanie usługami bezpieczeństwa","ok":true,"w":"APO13 (Manage Security — Zarządzanie bezpieczeństwem) (domena planowania): ustala i utrzymuje podejście do bezpieczeństwa informacji. DSS05 (Manage Security Services — Zarządzanie usługami bezpieczeństwa) (domena wykonania): codzienna ochrona, np. dostęp, uprawnienia, ochrona przed złośliwym oprogramowaniem."}],"fz":{"h":"APO13 a DSS05","p":"P2","pulapka":true,"n":"EN: APO13 (Manage Security — Zarządzanie bezpieczeństwem) Manage Security vs DSS05 (Manage Security Services — Zarządzanie usługami bezpieczeństwa) Manage Security Services","q":"APO13 a DSS05 – oba o bezpieczeństwie. Czym się różnią?","a":"APO13 (Manage Security — Zarządzanie bezpieczeństwem) (domena planowania): ustala i utrzymuje podejście do bezpieczeństwa informacji. DSS05 (Manage Security Services — Zarządzanie usługami bezpieczeństwa) (domena wykonania): codzienna ochrona, np. dostęp, uprawnienia, ochrona przed złośliwym oprogramowaniem.","ex":"Plan ochrony budynku to APO13 (Manage Security — Zarządzanie bezpieczeństwem). Ochroniarz przy drzwiach i zamykanie zamków każdego wieczoru to DSS05 (Manage Security Services — Zarządzanie usługami bezpieczeństwa).","org":""},"cyt":{"s":"33","t":"DSS05 Zarządzanie usługami bezpieczeństwa","w":"ZGODNE","u":"FW-PL podaje tylko nazwę; zakres (dostęp, uprawnienia, złośliwe oprogramowanie) i odróżnienie od APO13 pochodzą z Enabling Processes."}},"fz-B-048":{"id":"fz-B-048","typ":"egzamin","s":"PR-01-04","t":"Który proces dotyczy ludzkiej strony zmiany: gotowości, komunikacji i przyjęcia?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 33","FW-PL s. 60"],"r":null,"zap":"","scen":"","o":[{"t":"BAI05 Zarządzanie wdrażaniem zmian organizacyjnych","ok":true,"w":"BAI05 (Manage Organisational Change Enablement — Zarządzanie wdrażaniem zmian organizacyjnych) dotyczy aktywowania zmian organizacyjnych: przygotowania ludzi i organizacji, komunikacji, zaangażowania oraz przyjęcia nowego sposobu pracy. EN: Manage Organisational Change Enablement; podr. Zarządzanie wdrażaniem zmian organizacyjnych."},{"t":"BAI06 Zarządzanie zmianami","ok":false,"w":"BAI06 (Manage Changes — Zarządzanie zmianami) obsługuje wnioski o zmianę."},{"t":"BAI07 Zarządzanie procesem akceptacji zmian i przejścia","ok":false,"w":"BAI07 (Manage Change Acceptance and Transitioning — Zarządzanie procesem akceptacji zmian i przejścia) to testy, odbiór i przekazanie do użytku."},{"t":"BAI03 Zarządzanie identyfikacją i budowaniem rozwiązań","ok":false,"w":"BAI03 (Manage Solutions Identification and Build — Zarządzanie identyfikacją i budowaniem rozwiązań) dotyczy budowania rozwiązań, nie ludzkiej strony zmiany."}],"fz":{"h":"BAI05, BAI06, BAI07","p":"P2","pulapka":true,"n":"EN: BAI05 (Manage Organisational Change Enablement — Zarządzanie wdrażaniem zmian organizacyjnych) Change Enablement vs BAI06 (Manage Changes — Zarządzanie zmianami) Changes vs BAI07 (Manage Change Acceptance and Transitioning — Zarządzanie procesem akceptacji zmian i przejścia) Change Acceptance and Transitioning","q":"BAI05, BAI06, BAI07 – trzy procesy o zmianach. Czym się różnią?","a":"BAI05 (Manage Organisational Change Enablement — Zarządzanie wdrażaniem zmian organizacyjnych): ludzka strona zmiany (EN Organisational Change Enablement). BAI06 (Manage Changes — Zarządzanie zmianami): obsługa wniosków o zmianę. BAI07 (Manage Change Acceptance and Transitioning — Zarządzanie procesem akceptacji zmian i przejścia): testy, odbiór, przekazanie do użytku.","ex":"Wymiana pieca: przekonujesz kucharzy (BAI05 (Manage Organisational Change Enablement — Zarządzanie wdrażaniem zmian organizacyjnych)), zatwierdzasz zakup i montaż (BAI06 (Manage Changes — Zarządzanie zmianami)), robisz próbny obiad i odbiór (BAI07 (Manage Change Acceptance and Transitioning — Zarządzanie procesem akceptacji zmian i przejścia)).","org":""},"cyt":{"s":"33","t":"BAI05 Zarządzanie wdrażaniem zmian organizacyjnych","w":"ZGODNE","u":"FW-PL podaje tylko nazwę; opis zakresu (gotowość, komunikacja, przyjęcie zmiany) z Enabling Processes."},"przyklad":"Sytuacja: Organizacja uruchamia nowy sposób pracy, ale pracownicy opierają się zmianie. Który proces wspiera ich gotowość, komunikację i przyjęcie zmiany?"},"fz-B-049":{"id":"fz-B-049","typ":"egzamin","s":"PR-01-03,PR-01-04","t":"Który proces ustala apetyt na ryzyko i pilnuje, by go nie przekroczyć?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 33","FW-PL s. 68"],"r":null,"zap":"","scen":"","o":[{"t":"APO12 Zarządzanie ryzykiem","ok":false,"w":"APO12 (Manage Risk — Zarządzanie ryzykiem) to bieżące rozpoznawanie, ocena i ograniczanie ryzyka IT (Information Technology — technologie informacyjne)."},{"t":"EDM03 Zapewnienie optymalizacji ryzyka","ok":true,"w":"EDM03 (Ensure Risk Optimisation — Zapewnienie optymalizacji ryzyka) to Ład: ustalenie apetytu na ryzyko i pilnowanie, by go nie przekroczyć. APO12 (Manage Risk — Zarządzanie ryzykiem) to Zarządzanie: bieżące rozpoznawanie, ocena i ograniczanie ryzyka IT (Information Technology — technologie informacyjne)."},{"t":"APO13 Zarządzanie bezpieczeństwem","ok":false,"w":"APO13 (Manage Security — Zarządzanie bezpieczeństwem) ustala podejście do bezpieczeństwa informacji."},{"t":"MEA03 (zgodność z wymogami zewnętrznymi)","ok":false,"w":"MEA03 (Monitor, Evaluate and Assess Compliance With External Requirements — Monitorowanie, ocena i oszacowanie zgodności z wymogami zewnętrznymi) monitoruje zgodność z wymogami zewnętrznymi."}],"fz":{"h":"EDM03 a APO12","p":"P2","pulapka":true,"n":"EN: EDM03 (Ensure Risk Optimisation — Zapewnienie optymalizacji ryzyka) Ensure Risk Optimisation vs APO12 (Manage Risk — Zarządzanie ryzykiem) Manage Risk","q":"EDM03 a APO12 – oba o ryzyku. Czym się różnią?","a":"EDM03 (Ensure Risk Optimisation — Zapewnienie optymalizacji ryzyka) to Ład: ustalenie apetytu na ryzyko i pilnowanie, by go nie przekroczyć. APO12 (Manage Risk — Zarządzanie ryzykiem) to Zarządzanie: bieżące rozpoznawanie, ocena i ograniczanie ryzyka IT (Information Technology — technologie informacyjne).","ex":"Właściciel restauracji decyduje, ile ryzyka przyjmuje (EDM03 (Ensure Risk Optimisation — Zapewnienie optymalizacji ryzyka)). Szef kuchni na co dzień pilnuje gazu, noży i dat ważności (APO12 (Manage Risk — Zarządzanie ryzykiem)).","org":""},"cyt":{"s":"68","t":"W ramach czynności związanych z nadzorem nad ryzykiem definiuje się apetyt na ryzyko w przedsiębiorstwie","w":"ZGODNE","u":"Przypisanie do EDM03 przez nazwę „Zapewnienie optymalizacji ryzyka” (s.33); „pilnowanie, by nie przekroczyć” nie pada wprost."}},"fz-B-050":{"id":"fz-B-050","typ":"egzamin","s":"PR-01-04","t":"Czym zajmuje się MEA02 w odróżnieniu od DSS06?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 33","FW-PL s. 89","FW-PL s. 93"],"r":null,"zap":"","scen":"","o":[{"t":"Kontrolami wbudowanymi w codzienne procesy biznesowe","ok":false,"w":"To DSS06 (Manage Business Process Controls — Zarządzanie mechanizmami kontrolnymi procesów biznesowych)."},{"t":"Zgodnością z wymogami zewnętrznymi","ok":false,"w":"To MEA03 (Monitor, Evaluate and Assess Compliance With External Requirements — Monitorowanie, ocena i oszacowanie zgodności z wymogami zewnętrznymi)."},{"t":"Monitorowaniem i oceną całego systemu kontroli wewnętrznej","ok":true,"w":"DSS06 (Manage Business Process Controls — Zarządzanie mechanizmami kontrolnymi procesów biznesowych): kontrole wbudowane w codzienne procesy biznesowe (polityki, procedury, praktyki dające rozsądną pewność, że proces osiągnie cel). MEA02 (Monitor, Evaluate and Assess the System of Internal Control — Monitorowanie, ocena i oszacowanie systemu kontroli wewnętrznej): monitorowanie i ocena całego systemu kontroli wewnętrznej, czyli polityk, planów, procedur i struktur chroniących cele organizacji."},{"t":"Monitorowaniem wydajności i zgodności","ok":false,"w":"To MEA01 (Monitor, Evaluate and Assess Performance and Conformance — Monitorowanie, ocena i oszacowanie wydajności i zgodności)."}],"fz":{"h":"DSS06 a MEA02","p":"P2","pulapka":true,"n":"EN: DSS06 (Manage Business Process Controls — Zarządzanie mechanizmami kontrolnymi procesów biznesowych) Business Process Controls vs MEA02 (Monitor, Evaluate and Assess the System of Internal Control — Monitorowanie, ocena i oszacowanie systemu kontroli wewnętrznej) System of Internal Control","q":"DSS06 a MEA02 – czym różnią się mechanizmy kontrolne procesów biznesowych od systemu kontroli wewnętrznej?","a":"DSS06 (Manage Business Process Controls — Zarządzanie mechanizmami kontrolnymi procesów biznesowych): kontrole wbudowane w codzienne procesy biznesowe (polityki, procedury, praktyki dające rozsądną pewność, że proces osiągnie cel). MEA02 (Monitor, Evaluate and Assess the System of Internal Control — Monitorowanie, ocena i oszacowanie systemu kontroli wewnętrznej): monitorowanie i ocena całego systemu kontroli wewnętrznej, czyli polityk, planów, procedur i struktur chroniących cele organizacji.","ex":"Kasjer liczy pieniądze przy każdym rachunku (DSS06 (Manage Business Process Controls — Zarządzanie mechanizmami kontrolnymi procesów biznesowych)). Raz w miesiącu ktoś sprawdza, czy cały system liczenia działa (MEA02 (Monitor, Evaluate and Assess the System of Internal Control — Monitorowanie, ocena i oszacowanie systemu kontroli wewnętrznej)).","org":""},"cyt":{"s":"33","t":"MEA02 Monitorowanie, ocena i oszacowanie systemu kontroli wewnętrznej","w":"ZGODNE","u":"Opis DSS06 jako kontroli w procesach biznesowych: definicja „Mechanizmy kontrolne procesów biznesowych” s.89."}},"fz-B-051":{"id":"fz-B-051","typ":"egzamin","s":"PR-02-12","t":"Na jakie kategorie dzielą się cele aktywatora?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 28"],"r":null,"zap":"","scen":"","o":[{"t":"Korzyści, ryzyko i zasoby","ok":false,"w":"To elementy celu Ładu „Tworzenie wartości”."},{"t":"Interesariusze, cele, cykl życia i dobre praktyki","ok":false,"w":"To cztery wymiary aktywatora."},{"t":"Planowanie, budowanie, użytkowanie i wycofanie","ok":false,"w":"To etapy cyklu życia aktywatora."},{"t":"Jakość wewnętrzna, jakość kontekstowa, dostęp i bezpieczeństwo","ok":true,"w":"Tak: podręcznik mówi „jakość rzeczywista” zamiast „wewnętrzna”."}],"fz":{"h":"Cele aktywatora","p":"P1","pulapka":false,"n":"≠ TŁUMACZENIE · egzamin: jakość wewnętrzna, kontekstowa, dostęp i bezpieczeństwo · podr.: jakość rzeczywista, kontekstowa, dostęp i bezpieczeństwo · EN: enabler goals: intrinsic, contextual, access and security","q":"Na jakie kategorie dzieli się cele aktywatora?","a":"Jakość wewnętrzna, jakość kontekstowa, dostęp i bezpieczeństwo.","ex":"Jak ocena jedzenia: wewnętrzna – czy samo w sobie świeże i dobre; kontekstowa – czy pasuje do okazji; dostęp i bezpieczeństwo – czy podane na czas i tylko zamawiającemu.","org":"rejestr: dane prawdziwe, kompletne, dostępne dla uprawnionych."},"cyt":{"s":"28","t":"Jakość rzeczywista • Jakość kontekstowa (istotność, skuteczność) • Dostępność i bezpieczeństwo","w":"ZGODNE","u":"Podręcznik: „jakość rzeczywista” (= wewnętrzna); w tekście s.29 „Dostęp i bezpieczeństwo”."}},"fz-B-053":{"id":"fz-B-053","typ":"egzamin","s":"PR-02-12","t":"Które etapy tworzą cykl życia aktywatora?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 28","FW-PL s. 29"],"r":null,"zap":"","scen":"","o":[{"t":"Siedem faz wdrożenia, od wyznaczników do utrzymania motywacji","ok":false,"w":"To fazy cyklu życia wdrożenia, a nie wymiar czynnika umożliwiającego – łatwo je pomylić (FW-PL s. 29, 37)."},{"t":"Planowanie, projektowanie, budowanie, użytkowanie, ocena, aktualizacja","ok":true,"w":"Planowanie → Projektowanie → Budowanie/nabywanie/tworzenie/wdrażanie → Użytkowanie/eksploatacja → Ocena/monitorowanie → Aktualizacja/pozbywanie się."},{"t":"Ocena, kierowanie i monitorowanie","ok":false,"w":"To działania Ładu (EDM (Evaluate, Direct and Monitor — Oszacuj, Kieruj i Monitoruj))."},{"t":"Planowanie, tworzenie, wykonywanie i monitorowanie","ok":false,"w":"To obszary działań Zarządzania (PBRM (Plan, Build, Run and Monitor — Planuj, Wytwarzaj/Twórz, Wykonuj i Monitoruj))."}],"fz":{"h":"Cykl życia aktywatora","p":"P1","pulapka":true,"n":"≠ TŁUMACZENIE · egzamin: cykl życia aktywatora · podr.: cykl życia czynnika umożliwiającego · EN: enabler life cycle","q":"Podaj fazy cyklu życia aktywatora.","a":"Planowanie → Projektowanie → Budowanie/nabywanie/tworzenie/wdrażanie → Użytkowanie/eksploatacja → Ocena/monitorowanie → Aktualizacja/pozbywanie się.","ex":"Jak lodówka: wybierasz, jakiej potrzebujesz (planowanie), projekt, kupno, używanie, sprawdzanie, czy dobrze chłodzi, aż w końcu naprawa albo wywiezienie na złom.","org":"system zgłoszeń: zaplanowany, zbudowany, używany, oceniany."},"cyt":{"s":"29","t":"Fazy cyklu życia: – Planowanie (obejmuje opracowanie oraz wybór koncepcji); – Projektowanie; – Budowanie/nabywanie/tworzenie/wdrażanie; – Użytkowanie/obsługa; – Ocena/monitorowanie; – Aktualizacja/pozbywanie się.","w":"ZGODNE","u":"Podręcznik: „pozbywanie się” zamiast „wycofanie”."}},"fz-B-054":{"id":"fz-B-054","typ":"egzamin","s":"PR-02-12","t":"Co obejmuje wymiar Dobre praktyki aktywatora?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 28","FW-PL s. 29"],"r":null,"zap":"","scen":"","o":[{"t":"Wewnętrznych i zewnętrznych interesariuszy z ich rolami","ok":false,"w":"To wymiar Interesariusze."},{"t":"Etapy od planowania do wycofania","ok":false,"w":"To wymiar Cykl życia."},{"t":"Przykłady wdrożenia i wymagane produkty pracy: wejścia oraz wyjścia","ok":true,"w":"Przykładami lub sugestiami optymalnego wdrożenia aktywatora, z wymaganymi produktami pracy (wejściami i wyjściami). Dla części aktywatorów korzysta się z innych standardów."},{"t":"Mierniki osiągnięcia celów aktywatora","ok":false,"w":"To wskaźniki opóźnione."}],"fz":{"h":"Dobre praktyki","p":"P2","pulapka":false,"n":"egzamin: dobre praktyki · podr.: dobre praktyki · EN: good practices","q":"Czym jest wymiar Dobre praktyki aktywatora?","a":"Przykładami lub sugestiami optymalnego wdrożenia aktywatora, z wymaganymi produktami pracy (wejściami i wyjściami). Dla części aktywatorów korzysta się z innych standardów.","ex":"Sprawdzone porady, jak zrobić coś najlepiej, jak przepis od babci, plus lista, co trzeba mieć na start i co ma wyjść. Czasem przepis bierze się z innej książki (standardu).","org":"procedura DSS02 (Manage Service Requests and Incidents — Zarządzanie zgłoszeniami serwisowymi i incydentami) oparta na ITIL (Information Technology Infrastructure Library — biblioteka praktyk zarządzania usługami informatycznymi)."},"cyt":{"s":"29","t":"Dobre praktyki obejmują przykłady lub sugestie dotyczące optymalnego sposobu wdrożenia czynnika umożliwiającego i określają wymagane produkty działań bądź dane wejściowe i wyniki.","w":"ZGODNE"}},"fz-B-055":{"id":"fz-B-055","typ":"egzamin","s":"PR-02-12","t":"Kim są interesariusze aktywatora?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 28","FW-PL s. 29"],"r":null,"zap":"","scen":"","o":[{"t":"Osoby zarządzające aktywatorem, bez użytkowników jego wyników","ok":false,"w":"Zarządzający aktywatorem są interesariuszami, ale są nimi również strony korzystające z jego wyników lub zainteresowane nimi."},{"t":"Odbiorcy wyników aktywatora, bez osób uczestniczących w jego realizacji","ok":false,"w":"Odbiorcy wyników są interesariuszami, lecz definicja obejmuje także osoby aktywnie realizujące działania aktywatora."},{"t":"Role rozliczane za aktywator w tabeli RACI","ok":false,"w":"Rola A w tabeli RACI (Responsible, Accountable, Consulted, Informed — Odpowiedzialny, Rozliczany, Konsultowany, Informowany) jest jedną z możliwych odpowiedzialności. Interesariusze obejmują również inne role oraz strony zainteresowane aktywatorem lub jego wynikami."},{"t":"Strony uczestniczące w aktywatorze lub zainteresowane jego wynikami","ok":true,"w":"Interesariusze to strony aktywnie uczestniczące w aktywatorze lub zainteresowane nim i jego wynikami. Mogą być wewnętrzni i zewnętrzni; ich interesy mogą być różne."}],"fz":{"h":"Interesariusze aktywatora","p":"P2","pulapka":false,"n":"egzamin: interesariusze · podr.: interesariusze · EN: stakeholders","q":"Kim są interesariusze aktywatora?","a":"Interesariusze aktywatora to strony odgrywające w nim aktywną rolę lub zainteresowane nim albo jego wynikami. Mogą być wewnętrzni i zewnętrzni oraz mieć różne, nawet sprzeczne interesy. Grupa ta nie ogranicza się do kierownictwa, odbiorców wyników ani jednej roli w tabeli odpowiedzialności.","ex":"Interesariusz = każdy, kogo coś dotyczy albo komu na tym zależy. Przy szkolnej stołówce: kucharki, uczniowie, rodzice, sanepid – każdy chce czegoś innego.","org":"procedura: dyżurni, komendy, kierownictwo, audyt."},"cyt":{"s":"28","t":"dla każdego czynnika umożliwiającego można wskazać interesariuszy (strony, które odgrywają aktywną rolę i/lub są zainteresowane czynnikiem umożliwiającym).","w":"ZGODNE"}},"fz-B-056":{"id":"fz-B-056","typ":"egzamin","s":"PR-01-05","t":"Które z poniższych NIE jest jednym z czterech pytań zarządzania wydajnością aktywatora?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 29"],"r":null,"zap":"","scen":"","o":[{"t":"Czy uwzględniono potrzeby interesariuszy?","ok":false,"w":"To pytanie 1."},{"t":"Czy osiągnięto cele aktywatora?","ok":false,"w":"To pytanie 2."},{"t":"Czy stosowane są dobre praktyki?","ok":false,"w":"To pytanie 4."},{"t":"Czy aktywator ma uzasadnienie biznesowe?","ok":true,"w":"Uzasadnienie biznesowe nie jest jednym z czterech pytań zarządzania wydajnością aktywatora. Cztery pytania dotyczą potrzeb interesariuszy, osiągnięcia celów, zarządzania cyklem życia i stosowania dobrych praktyk. Uzasadnienie biznesowe jest istotne w cyklu wdrożenia."}],"fz":{"h":"Cztery pytania zarządzania wydajnością aktywatora","p":"P1","pulapka":false,"n":"EN: Enabler performance management – 4 questions","q":"Jakie cztery pytania obejmuje zarządzanie wydajnością aktywatora?","a":"Cztery pytania zarządzania wydajnością aktywatora (odpowiada się na nie na podstawie mierników): Czy uwzględniono potrzeby interesariuszy? Czy osiągnięto cele aktywatora? Czy zarządza się cyklem życia aktywatora? Czy stosowane są dobre praktyki? Dwa pierwsze dotyczą wyniku (wskaźniki opóźnione), dwa ostatnie – funkcjonowania aktywatora (wskaźniki wiodące).","ex":"Jak przy diecie: czy schudłem (cel osiągnięty)? I czy trzymam się planu posiłków (dobrze tym zarządzam)? Pierwsze mierzą wskaźniki opóźnione, drugie wiodące.","org":""},"cyt":{"s":"29","t":"• Czy uwzględniono potrzeby interesariuszy? • Czy osiągnięto cele czynników umożliwiających? • Czy zadbano o zarządzanie cyklem życia czynników umożliwiających? • Czy stosowane są dobre praktyki?","w":"ZGODNE"}},"fz-B-057":{"id":"fz-B-057","typ":"egzamin","s":"PR-02-12","t":"Jak model aktywatora traktuje inne aktywatory?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 28"],"r":null,"zap":"","scen":"","o":[{"t":"Uwzględnia zależności od pozostałych aktywatorów","ok":true,"w":"Model aktywatora uwzględnia jego zależności od pozostałych (Zasada 4: Aktywacja holistycznego podejścia) – aktywator opisuje się razem z tym, od czego zależy."},{"t":"Opisuje każdy aktywator całkowicie niezależnie","ok":false,"w":"Model uwzględnia powiązania z innymi aktywatorami."},{"t":"Opisuje powiązania tylko dla procesów","ok":false,"w":"Powiązania dotyczą każdego aktywatora."},{"t":"Opisuje powiązania tylko z aktywatorami-zasobami","ok":false,"w":"Model uwzględnia zależności od wszystkich pozostałych aktywatorów."}],"fz":{"h":"Powiązania z innymi aktywatorami","p":"P1","pulapka":false,"n":"egzamin: powiązania · podr.: powiązania · EN: interconnected enablers","q":"Czy aktywator opisuje się w oderwaniu od innych?","a":"Nie. Model aktywatora uwzględnia jego zależności od pozostałych (Zasada 4).","ex":"Jak straż pożarna: wóz bez strażaków, a strażacy bez wody i dyspozytora nic nie zdziałają. Dlatego aktywator opisuje się razem z tym, od czego zależy.","org":"procedura potrzebuje dyżurnych, rejestru i systemu."},"cyt":{"s":"27","t":"Każde przedsiębiorstwo musi zawsze uwzględniać wzajemnie powiązany zbiór czynników umożliwiających.","w":"ZGODNE"}},"fz-B-058":{"id":"fz-B-058","typ":"egzamin","s":"PR-02-13","t":"Na które z czterech pytań zarządzania wydajnością aktywatora odpowiadają wskaźniki opóźnione?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 29","Altkom — Różnice tłumaczenia PL, s. 1"],"r":null,"zap":"","scen":"","o":[{"t":"Na pytania o cykl życia i dobre praktyki","ok":false,"w":"Na pytania 3 i 4 (cykl życia, dobre praktyki) odpowiadają wskaźniki wiodące."},{"t":"Na pytania o potrzeby interesariuszy i cele","ok":true,"w":"Wskaźniki opóźnione (lag indicators; podr. wskaźniki następujące) mierzą rzeczywiste wyniki: czy uwzględniono potrzeby interesariuszy i czy osiągnięto cele aktywatora — pytania 1 i 2. Wskaźniki wiodące (podr. wyprzedzające) mierzą sposób zarządzania cyklem życia i stosowanie dobrych praktyk — pytania 3 i 4."},{"t":"Tylko na pytanie o dobre praktyki","ok":false,"w":"Dobre praktyki mierzą wskaźniki wiodące."},{"t":"Na wszystkie cztery pytania jednocześnie","ok":false,"w":"Pytania dzielą się: 1–2 opóźnione, 3–4 wiodące."}],"fz":{"h":"Wskaźniki opóźnione","p":"P1","pulapka":true,"n":"≠ TŁUMACZENIE · egzamin: wskaźniki opóźnione · podr.: wskaźniki następujące · EN: lag indicators","q":"Czym są wskaźniki opóźnione?","a":"Wskaźniki opóźnione (lag indicators; podr. wskaźniki następujące) mierzą rzeczywiste wyniki: czy uwzględniono potrzeby interesariuszy i czy osiągnięto cele aktywatora — pytania 1 i 2. Ocenia się je względem konkretnego celu. Wskaźniki wiodące (lead indicators; podr. wyprzedzające) mierzą sposób zarządzania cyklem życia i stosowanie dobrych praktyk — pytania 3 i 4.","ex":"Jak waga na koniec miesiąca: pokazuje wynik po fakcie, czyli odpowiada na pytania 1 i 2. Pułapka: podręcznik mówi „wskaźniki następujące”.","org":"łączna przerwa usług krytycznych w roku."},"cyt":{"s":"29","t":"Pierwsze dwa punkty dotyczą rzeczywistego wyniku zastosowania czynnika umożliwiającego. Mierniki pozwalające na określenie stopnia, w jakim osiągnięto cele, można nazwać „wskaźnikami następującymi”.","w":"ZGODNE","u":"Wskaźniki opóźnione = następujące."}},"fz-B-060":{"id":"fz-B-060","typ":"egzamin","s":"PR-02-12","t":"Jakie są cztery wspólne wymiary aktywatora?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 28"],"r":null,"zap":"","scen":"","o":[{"t":"Jakość wewnętrzna, jakość kontekstowa, dostęp i bezpieczeństwo, wydajność","ok":false,"w":"To nie jest lista czterech wspólnych wymiarów. Cele grupuje się w trzy kategorie: jakość wewnętrzna, jakość kontekstowa oraz dostęp i bezpieczeństwo. Wydajność nie jest czwartą kategorią celów ani wspólnym wymiarem."},{"t":"Planuj, Twórz, Wykonuj, Monitoruj","ok":false,"w":"To obszary działań Zarządzania (PBRM (Plan, Build, Run and Monitor — Planuj, Wytwarzaj/Twórz, Wykonuj i Monitoruj))."},{"t":"Zasady, Procesy, Struktury organizacyjne, Kultura","ok":false,"w":"To część z siedmiu kategorii aktywatorów."},{"t":"Interesariusze, cele, cykl życia, dobre praktyki","ok":true,"w":"Cztery wspólne wymiary to Interesariusze, Cele, Cykl życia i Dobre praktyki. Dzięki nim każdy aktywator można opisać w podobny, uporządkowany sposób, zachowując jego własne cele i zależności."}],"fz":{"h":"Wymiary aktywatora","p":"P1","pulapka":false,"n":"≠ TŁUMACZENIE · egzamin: wymiary aktywatora · podr.: wymiary czynnika umożliwiającego · EN: enabler dimensions","q":"Podaj cztery wspólne wymiary aktywatora.","a":"Cztery wspólne wymiary aktywatora: Interesariusze, Cele, Cykl życia, Dobre praktyki. Cele są jednym wymiarem; ich trzy kategorie jakościowe nie są dodatkowymi wymiarami. Siedem kategorii aktywatorów to jeszcze inny podział.","ex":"Cztery pytania o każdą rzecz: dla kogo (interesariusze), po co (cele), od narodzin do końca (cykl życia), jak robić to dobrze (dobre praktyki). Haczyk: „Kto, Po co, Kiedy, Jak”.","org":""},"cyt":{"s":"28","t":"Wymiar czynnika umożliwiającego Interesariusze Cele Cykl życia Dobre praktyki","w":"ZGODNE","u":"Tekst z Ilustracji 13; zdanie wprowadzające „Cztery wspólne wymiary dla czynników umożliwiających to:” na s.28."}},"fz-B-063":{"id":"fz-B-063","typ":"egzamin","s":"PR-02-12","t":"Po co aktywatory mają wspólne wymiary?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 28"],"r":null,"zap":"","scen":"","o":[{"t":"Pozwalają ocenić poziom zdolności każdego procesu","ok":false,"w":"Formalna ocena zdolności procesu wykorzystuje osobny model oceny i atrybuty procesu. Wspólne wymiary służą do uporządkowanego opisu wszystkich aktywatorów oraz ich interakcji."},{"t":"Ustalają wspólne cele i wartości mierników dla wszystkich aktywatorów","ok":false,"w":"Wspólny model opisu nie oznacza jednakowych celów ani identycznych wartości mierników. Każdy aktywator ma własnych interesariuszy, cele, cykl życia i dobre praktyki."},{"t":"Ujednolicają opis aktywatorów i ułatwiają zarządzanie ich relacjami","ok":true,"w":"Wspólne wymiary upraszczają i ujednolicają opis aktywatorów, pomagają zarządzać ich interakcjami i wspierają skuteczne wykorzystanie. Nie znoszą różnic między aktywatorami."},{"t":"Ustalają kolejność wdrażania aktywatorów w Kaskadzie Celów","ok":false,"w":"Wymiary nie ustanawiają kolejności wdrażania. Priorytety wynikają z celów i kontekstu organizacji; Kaskada Celów przekłada potrzeby na cele, a wymiary opisują aktywatory."}],"fz":{"h":"Po co wspólne wymiary","p":"P2","pulapka":false,"n":"EN: Purpose of common enabler dimensions","q":"Po co aktywatory mają wspólne wymiary?","a":"Wspólne wymiary pozwalają opisywać aktywatory w prosty, ustrukturyzowany sposób, zarządzać ich złożonymi interakcjami i skutecznie je wykorzystywać. Wspólny sposób opisu nie oznacza wspólnych celów, identycznych mierników ani jednej kolejności wdrażania.","ex":"Jak jeden formularz dla wszystkich urządzeń w domu: każde opisujesz tak samo, więc łatwiej porównać i zobaczyć, jak ze sobą współpracują.","org":""},"cyt":{"s":"28","t":"pozwala na wykorzystanie czynników umożliwiających w sposób typowy, prosty i ustrukturyzowany; • umożliwia przedsiębiorstwu zarządzanie jego złożonymi interakcjami;","w":"ZGODNE"}},"fz-C-001":{"id":"fz-C-001","typ":"egzamin","s":"PR-01-02","t":"Czym jest aktywator w COBIT 5 i ile jest ich kategorii?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 27"],"r":null,"zap":"","scen":"","o":[{"t":"Wszystko, co pomaga osiągnąć cele organizacji; kategorii jest 7","ok":true,"w":"Aktywator (enabler; podr. czynnik umożliwiający) to czynnik ułatwiający osiągnięcie celów organizacji. Siedem kategorii: Zasady, Polityki i Struktury ramowe; Procesy; Struktury organizacyjne; Kultura, Etyka i Zachowanie; Informacja; Usługi, Infrastruktura i Aplikacje; Ludzie, Umiejętności i Kompetencje. Współdziałają systemowo — to Zasada 4, Aktywacja holistycznego podejścia."},{"t":"Wszystko, co pomaga osiągnąć cele organizacji; kategorii jest 5","ok":false,"w":"Pięć to liczba zasad COBIT 5, aktywatorów jest 7 kategorii."},{"t":"Wyłącznie zasoby IT organizacji; kategorii jest 7","ok":false,"w":"Aktywatorami są też np. kultura, polityki i struktury, nie tylko zasoby IT (Information Technology — technologie informacyjne)."},{"t":"Proces z Referencyjnego Modelu Procesu; kategorii jest 37","ok":false,"w":"Procesy to tylko jedna z 7 kategorii aktywatorów; 37 to liczba procesów."}],"fz":{"h":"Aktywator","p":"P1","pulapka":false,"n":"egzamin: aktywator · podr.: czynnik umożliwiający · EN: enabler","q":"Czym jest aktywator i ile jest kategorii?","a":"Aktywator (enabler; podr. czynnik umożliwiający) to czynnik ułatwiający osiągnięcie celów organizacji. Siedem kategorii: Zasady, Polityki i Struktury ramowe; Procesy; Struktury organizacyjne; Kultura, Etyka i Zachowanie; Informacja; Usługi, Infrastruktura i Aplikacje; Ludzie, Umiejętności i Kompetencje. Współdziałają systemowo — to Zasada 4, Aktywacja holistycznego podejścia.","ex":"Aktywator to wszystko, dzięki czemu restauracja działa: regulamin, przepisy, stanowiska, atmosfera, zamówienia, sprzęt, kucharze. Siedem po kolei: „Zupa Pomidorowa Smakuje Kucharzom I Uczniom Licealnym”.","org":"w organizacji: procedura obsługi zgłoszeń, dyżur całodobowy, jeden rejestr zgłoszeń, przeszkoleni dyżurni."},"cyt":{"s":"27","t":"W metodyce COBIT 5 opisano siedem kategorii czynników umożliwiających","w":"ZGODNE","u":"Definicja zgodna z FW-PL s. 14: „Czynnik umożliwiający to pojęcie bardzo szerokie — obejmuje wszystko, co może ułatwić osiągnięcie celów przedsiębiorstwa”; siedem kategorii – s. 14 i 27."}},"fz-C-002":{"id":"fz-C-002","typ":"egzamin","s":"PR-01-02","t":"Jaką rolę pełni aktywator Informacja?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 27"],"r":null,"zap":"","scen":"","o":[{"t":"Jest kluczową jednostką podejmującą decyzje w organizacji","ok":false,"w":"Tak opisuje się Struktury organizacyjne."},{"t":"Zamienia pożądane zachowania w praktyczne wskazówki na co dzień","ok":false,"w":"To rola Zasad, polityk i struktur ramowych."},{"t":"Obejmuje tworzone i używane informacje; wspiera działanie organizacji i Ład","ok":true,"w":"Wszystkie informacje, które organizacja tworzy i wykorzystuje. Bez nich nie da się działać ani sprawować Ładu; w codziennej pracy często są głównym produktem."},{"t":"Obejmuje infrastrukturę, technologie i aplikacje do przetwarzania informacji","ok":false,"w":"To rola aktywatora Usługi, infrastruktura i aplikacje."}],"fz":{"h":"Informacja","p":"P1","pulapka":false,"n":"egzamin: informacja · podr.: informacja · EN: information","q":"Jaką rolę pełni Informacja?","a":"Wszystkie informacje, które organizacja tworzy i wykorzystuje. Bez nich nie da się działać ani sprawować Ładu; w codziennej pracy często są głównym produktem.","ex":"W restauracji to bloczki zamówień, menu, rachunki i lista alergenów. Bez kartki z zamówieniem kucharz nie wie, co gotować. Dla banku czy biura podróży informacja bywa wręcz tym, co się sprzedaje.","org":"rejestr zgłoszeń, raport dostępności usług, protokół z omówienia awarii."},"cyt":{"s":"27","t":"Informacje są wymagane do zapewnienia właściwego funkcjonowania organizacji oraz nadzoru nad jej działalnością, ale na poziomie operacyjnym informacje są bardzo często kluczowym produktem przedsiębiorstwa.","w":"ZGODNE"}},"fz-C-003":{"id":"fz-C-003","typ":"egzamin","s":"PR-01-02","t":"Jak COBIT 5 opisuje znaczenie aktywatora Kultura, etyka i zachowanie?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 27"],"r":null,"zap":"","scen":"","o":[{"t":"W codziennej pracy jest często głównym produktem organizacji","ok":false,"w":"To cecha aktywatora Informacja."},{"t":"Dotyczy ludzi i całej organizacji; to często niedoceniany czynnik sukcesu Ładu i Zarządzania","ok":true,"w":"Kultura, etyka i zachowanie dotyczą ludzi i całej organizacji. COBIT 5 opisuje je jako często niedoceniany czynnik sukcesu Ładu i Zarządzania. Nie są wyłącznie sprawą kadry kierowniczej; wpływają np. na to, czy pracownicy rzeczywiście przestrzegają znanych polityk."},{"t":"Jest uporządkowanym zbiorem praktyk i działań dających określone wyniki","ok":false,"w":"To definicja Procesów."},{"t":"Dotyczy wyłącznie zachowań kadry kierowniczej","ok":false,"w":"Dotyczy ludzi i całej organizacji, nie tylko kierownictwa."}],"fz":{"h":"Kultura, etyka i zachowanie","p":"P1","pulapka":false,"n":"egzamin: kultura, etyka i zachowanie · podr.: kultura, etyka i zachowanie · EN: culture, ethics and behaviour","q":"Jaką rolę pełni Kultura, etyka i zachowanie?","a":"Kultura, etyka i zachowanie dotyczą ludzi i całej organizacji. COBIT 5 opisuje je jako często niedoceniany czynnik sukcesu Ładu i Zarządzania. Nie są wyłącznie sprawą kadry kierowniczej; wpływają np. na to, czy pracownicy rzeczywiście przestrzegają znanych polityk.","ex":"Przykład: pracownik zna procedurę bezpieczeństwa i umie ją stosować, ale świadomie ją lekceważy. Sam dokument nie usuwa tego problemu — trzeba zadbać o normy, przykład przywódców, bodźce i zachowanie.","org":"błędy zgłaszamy bez szukania winnych; dyżurny nie ukrywa awarii przed przełożonym."},"cyt":{"s":"27","t":"Kultura, etyka i zachowanie odnoszą się do osób oraz przedsiębiorstwa i są często niedocenianym czynnikiem sukcesu działań związanych z nadzorem i zarządzaniem.","w":"ZGODNE"}},"fz-C-004":{"id":"fz-C-004","typ":"egzamin","s":"PR-01-02","t":"Które stwierdzenie opisuje rolę aktywatora Ludzie, umiejętności i kompetencje?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 27","FW-PL s. 28"],"r":null,"zap":"","scen":"","o":[{"t":"Formalne spisanie wytycznych organu Ładu i kierownictwa","ok":false,"w":"Ludzie uczestniczą w formułowaniu wytycznych, ale zdanie opisuje typową rolę kategorii Zasady, polityki i struktury ramowe. Nie jest najwierniejszym opisem roli kategorii Ludzie, umiejętności i kompetencje."},{"t":"Przetwarzanie informacji i dostarczanie usług IT","ok":false,"w":"Ludzie są potrzebni także do przetwarzania informacji i świadczenia usług. W opisie siedmiu kategorii takie sformułowanie odpowiada jednak przede wszystkim Usługom, infrastrukturze i aplikacjom."},{"t":"Wyznaczanie granic uprawnień decyzyjnych w organizacji","ok":false,"w":"Ludzie mogą ustalać uprawnienia. Zakres uprawnień decyzyjnych jest jednak cechą opisu Struktur organizacyjnych, a nie definicją roli kategorii Ludzie, umiejętności i kompetencje."},{"t":"Skuteczne działanie, trafne decyzje i działania naprawcze","ok":true,"w":"COBIT 5 wiąże tę kategorię ze skuteczną realizacją wszystkich działań, właściwymi decyzjami i działaniami naprawczymi. Aktywatory współdziałają; opis nie wyklucza uczestnictwa ludzi w pozostałych czynnościach."}],"fz":{"h":"Ludzie, umiejętności i kompetencje","p":"P1","pulapka":false,"n":"egzamin: ludzie, umiejętności i kompetencje · podr.: ludzie, umiejętności i kompetencje · EN: people, skills and competencies","q":"Jaką rolę pełnią Ludzie, umiejętności i kompetencje?","a":"Ludzie, umiejętności i kompetencje są potrzebni do skutecznego wykonywania wszystkich działań, podejmowania właściwych decyzji i działań naprawczych. Ludzie współuczestniczą także w procesach, przetwarzaniu informacji i świadczeniu usług; pytanie rozróżnia typowy opis roli kategorii, a nie rozłączne obszary pracy.","ex":"Przeszkolony dyżurny potrafi wykonać procedurę i podjąć właściwą decyzję przy awarii. Do skuteczności potrzebuje również informacji, narzędzi i jasnych uprawnień. Kategorie aktywatorów współdziałają.","org":"dyżurny przeszkolony z procedury i eskalacji; administrator z uprawnieniami do przywracania usług."},"cyt":{"s":"27","t":"Ludzie, umiejętności i kompetencje to czynnik dotyczący osób i jest wymagany do skutecznej realizacji wszystkich działań oraz podejmowania właściwych decyzji i przeprowadzania działań naprawczych.","w":"ZGODNE"}},"fz-C-006":{"id":"fz-C-006","typ":"egzamin","s":"PR-01-02","t":"Jaką rolę pełnią Procesy?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 27"],"r":null,"zap":"","scen":"","o":[{"t":"Są kluczowymi jednostkami podejmującymi decyzje: osobami, zespołami, komitetami","ok":false,"w":"Tak opisuje się Struktury organizacyjne."},{"t":"Są wzorcem zachowań, poglądów, założeń i postaw","ok":false,"w":"To definicja kultury."},{"t":"Są zbiorem praktyk i działań realizujących określone cele procesu","ok":true,"w":"Uporządkowany zbiór praktyk i działań, które osiągają określone cele i dają wyniki wspierające cele związane z IT (Information Technology — technologie informacyjne)."},{"t":"Są sposobem, w jaki organ Ładu przekazuje swoje wytyczne","ok":false,"w":"To rola Zasad, polityk i struktur ramowych."}],"fz":{"h":"Procesy","p":"P1","pulapka":false,"n":"egzamin: procesy · podr.: procesy · EN: processes","q":"Jaką rolę pełnią Procesy?","a":"Uporządkowany zbiór praktyk i działań, które osiągają określone cele i dają wyniki wspierające cele związane z IT (Information Technology — technologie informacyjne).","ex":"Proces to przepis na danie: uzgodniony sposób pracy od przyjęcia zamówienia do podania talerza, z określonymi wejściami i efektem; konkretne kroki dopasowuje się do sytuacji. Każdy krok ma cel, a całość służy celom całej restauracji.","org":"DSS02 (Manage Service Requests and Incidents — Zarządzanie zgłoszeniami serwisowymi i incydentami)."},"cyt":{"s":"27","t":"Procesy opisują uporządkowany zbiór praktyk i działań umożliwiających osiągnięcie określonych celów i uzyskanie zbioru wyników ułatwiających realizację ogólnych celów związanych z IT.","w":"ZGODNE"}},"fz-C-007":{"id":"fz-C-007","typ":"egzamin","s":"PR-01-02","t":"Jaką rolę pełnią Struktury organizacyjne?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 27"],"r":null,"zap":"","scen":"","o":[{"t":"Opisują etapy dojścia od architektury bazowej do docelowej","ok":false,"w":"To architektura przejściowa z aktywatora Usługi, infrastruktura i aplikacje."},{"t":"Zamieniają wejścia w wyniki za pomocą praktyk i działań","ok":false,"w":"Tak działają Procesy."},{"t":"Obejmują wszystkie informacje tworzone przez organizację","ok":false,"w":"To rola aktywatora Informacja."},{"t":"Są kluczowymi podmiotami podejmującymi decyzje w organizacji","ok":true,"w":"Kluczowe jednostki podejmujące decyzje w organizacji (osoby, zespoły, komitety). Opisuje się je m.in. poziomem uprawnień i delegowaniem uprawnień (s. 75–76)."}],"fz":{"h":"Struktury organizacyjne","p":"P1","pulapka":false,"n":"egzamin: struktury org. · poziom uprawnień · delegowanie uprawnień · podr.: struktury org. · poziom decyzyjny · przekazywanie uprawnień · EN: organisational structures · level of authority · delegation of authority","q":"Jaką rolę pełnią Struktury organizacyjne?","a":"Kluczowe jednostki podejmujące decyzje w organizacji (osoby, zespoły, komitety). Opisuje się je m.in. poziomem uprawnień i delegowaniem uprawnień (s. 75–76).","ex":"Podział stanowisk: szef kuchni decyduje o menu, kierownik zmiany o grafiku, a pod nieobecność szefa jego zastępca. Odpowiada na pytanie: kto o czym decyduje. Pytanie „kto tu rządzi i w jakich sprawach?”.","org":"komitet sterujący programu, dyżur całodobowy z kierownikiem zmiany, który eskaluje."},"cyt":{"s":"27","t":"Struktury organizacyjne to kluczowe jednostki odpowiedzialne za podejmowanie decyzji w przedsiębiorstwie.","w":"ZGODNE"}},"fz-C-008":{"id":"fz-C-008","typ":"egzamin","s":"PR-01-02","t":"Jaką rolę pełnią Usługi, infrastruktura i aplikacje?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 27"],"r":null,"zap":"","scen":"","o":[{"t":"Określają, kto w organizacji o czym decyduje","ok":false,"w":"To rola Struktur organizacyjnych."},{"t":"Zapewniają przetwarzanie informacji i dostarczanie usług IT","ok":true,"w":"Infrastruktura, technologie i aplikacje, dzięki którym organizacja przetwarza informacje i ma usługi IT (Information Technology — technologie informacyjne)."},{"t":"Zapewniają osoby zdolne do podejmowania działań naprawczych","ok":false,"w":"To rola aktywatora Ludzie, umiejętności i kompetencje."},{"t":"Opisują wzorzec zachowań i postaw w organizacji","ok":false,"w":"To definicja kultury."}],"fz":{"h":"Usługi, infrastruktura i aplikacje","p":"P1","pulapka":false,"n":"egzamin: usługi, infrastruktura i aplikacje · podr.: usługi, infrastruktura i aplikacje · EN: services, infrastructure and applications","q":"Jaką rolę pełnią Usługi, infrastruktura i aplikacje?","a":"Infrastruktura, technologie i aplikacje, dzięki którym organizacja przetwarza informacje i ma usługi IT (Information Technology — technologie informacyjne).","ex":"Sprzęt i zaplecze restauracji: kuchenki, lodówki, kasa, system zamówień na tablecie kelnera. Bez nich ludzie mają związane ręce. Narzędzia, dzięki którym zamówienie trafia do kucharza, a rachunek do klienta.","org":"system zgłoszeń, monitoring dostępności usług, łącza do komend."},"cyt":{"s":"27","t":"Usługi, infrastruktura i aplikacje obejmują infrastrukturę, technologię i aplikacje zapewniające przedsiębiorstwu możliwości przetwarzania oraz usługi IT.","w":"ZGODNE"}},"fz-C-010":{"id":"fz-C-010","typ":"egzamin","s":"PR-01-02","t":"Które trzy kategorie aktywatorów są jednocześnie zasobami organizacji?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 24","FW-PL s. 27"],"r":null,"zap":"","scen":"","o":[{"t":"Procesy; Struktury organizacyjne; Informacja","ok":false,"w":"Ten zestaw nie odpowiada trzem kategoriom wyróżnionym jako zasoby przedsiębiorstwa na Rysunku 12. Procesy i struktury mogą być nazywane zasobami organizacyjnymi w innych kontekstach, np. przy aktywatorach Ładu."},{"t":"Zasady/polityki/struktury ramowe; Procesy; Ludzie/umiejętności/kompetencje","ok":false,"w":"Rysunek 12 wyróżnia Informację, Usługi/infrastrukturę/aplikacje oraz Ludzi/umiejętności/kompetencje. Wskazanie zasad i procesów zamiast dwóch pierwszych kategorii nie odpowiada tej klasyfikacji."},{"t":"Informacja; Usługi/infrastruktura/aplikacje; Ludzie/umiejętności/kompetencje","ok":true,"w":"Na Rysunku 12 wyróżniono właśnie trzy ostatnie kategorie: Informacja; Usługi, Infrastruktura i Aplikacje; Ludzie, Umiejętności i Kompetencje. To klasyfikacja tego modelu, nie uniwersalne stwierdzenie, że inne elementy nigdy nie są zasobami organizacyjnymi."},{"t":"Kultura/etyka/zachowanie; Informacja; Usługi/infrastruktura/aplikacje","ok":false,"w":"W klasyfikacji Rysunku 12 wśród trzech kategorii zasobów są Ludzie, umiejętności i kompetencje, nie Kultura, etyka i zachowanie."}],"fz":{"h":"Zasoby wśród aktywatorów","p":"P1","pulapka":true,"n":"egzamin: aktywatory będące zasobami · podr.: czynniki będące zasobami · EN: enablers that are also resources","q":"Które trzy kategorie aktywatorów wyróżniono jako zasoby przedsiębiorstwa na Rysunku 12?","a":"Na Rysunku 12 jako zasoby przedsiębiorstwa wyróżniono trzy kategorie: Informacja; Usługi, Infrastruktura i Aplikacje; Ludzie, Umiejętności i Kompetencje. To klasyfikacja w tym modelu aktywatorów. Nie oznacza, że w innym kontekście struktury, procesy czy polityki nigdy nie mogą być nazywane zasobami organizacyjnymi — s. 24 używa takiego określenia przy aktywatorach Ładu.","ex":"Zasoby to to, czym organizacja dysponuje i co wykorzystuje: wiedza w notatkach (informacja), sprzęt (infrastruktura), kucharze (ludzie). Haczyk: I-U-L, trzy ostatnie z siedmiu.","org":"rejestr zgłoszeń (informacja), serwery (infrastruktura), dyżurni (ludzie)."},"cyt":{"s":"27","t":"Niektóre zdefiniowane wcześniej czynniki umożliwiające stanowią również zasoby przedsiębiorstwa, które również wymagają zarządzania i nadzoru.","w":"ZGODNE","u":"Dalej wymienione: Informacje; Usługi, infrastruktura i aplikacje; Ludzie, umiejętności i kompetencje."}},"fz-C-011":{"id":"fz-C-011","typ":"egzamin","s":"EN-02-02","t":"Czym według COBIT 5 jest polityka (w odróżnieniu od zasady i struktury ramowej)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 67","FW-PL s. 91","FW-PL s. 92","FW-PL s. 93"],"r":null,"zap":"","scen":"","o":[{"t":"Wartościami i podstawowymi przekonaniami organizacji","ok":false,"w":"To definicja zasady."},{"t":"Podstawowym szkieletem pojęć pomagającym rozwiązywać złożone problemy","ok":false,"w":"To definicja struktury ramowej."},{"t":"Koniecznymi i wystarczającymi krokami do wdrożenia praktyki","ok":false,"w":"To definicja działania w procesie."},{"t":"Ogólnymi zamierzeniami i wytycznymi, formalnie spisanymi przez kierownictwo","ok":true,"w":"Słownik określa politykę jako ogólne zamierzenia i wytyczne formalnie wyrażone przez kierownictwo. Zasada wyraża podstawowe wartości, a struktura ramowa porządkuje pojęcia i podejście do złożonych kwestii (s.91–93)."}],"fz":{"h":"Zasada, polityka, struktura ramowa","p":"P1","pulapka":true,"n":"EN: Principle vs policy vs framework","q":"Czym różni się zasada od polityki i struktury ramowej?","a":"Zasada: wartości i podstawowe przekonania organizacji. Polityka: ogólne zamierzenia i wytyczne, formalnie spisane przez kierownictwo. Struktura ramowa: podstawowy szkielet pojęć, który pomaga rozwiązywać złożone problemy.","ex":"Zasada: „gość jest najważniejszy”. Polityka: „reklamacje przyjmuje kierownik zmiany”. Struktura ramowa: cały gotowy system bezpieczeństwa żywności, szkielet do ogarnięcia złożonej sprawy.","org":""},"cyt":{"s":"92","t":"Ogólne zamierzenia i wytyczne formalnie wyrażone przez kierownictwo.","w":"ZGODNE"}},"fz-C-012":{"id":"fz-C-012","typ":"egzamin","s":"EN-02-05","t":"Jakie kryteria muszą spełniać zasady?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 67"],"r":null,"zap":"","scen":"","o":[{"t":"Nieliczne, prosto sformułowane i precyzyjne","ok":true,"w":"Zasad ma być niewiele, mają być sformułowane prostym językiem i jak najprecyzyjniej wyrażać podstawowe wartości (FW-PL s. 67)."},{"t":"Skuteczne, wydajne i nieinwazyjne","ok":false,"w":"To cechy dobrej polityki."},{"t":"Kompleksowe, otwarte, aktualne i dostępne","ok":false,"w":"Tak powinny wyglądać struktury ramowe (kompleksowe, otwarte i elastyczne, aktualne, dostępne)."},{"t":"Szczegółowe, by objąć każdy możliwy przypadek","ok":false,"w":"Odwrotnie: zasad ma być mało i mają być proste."}],"fz":{"h":"Kryteria zasad","p":"P2","pulapka":false,"n":"EN: Principles: limited in number, simple language","q":"Jakie kryteria muszą spełniać zasady?","a":"Ich liczba musi być ograniczona; muszą być sformułowane prostym językiem i jak najprecyzyjniej wyrażać podstawowe wartości organ
