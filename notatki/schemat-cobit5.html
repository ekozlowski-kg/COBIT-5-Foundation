<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schemat COBIT 5</title>
<link rel="stylesheet" href="https://unpkg.com/@xyflow/react@12.3.2/dist/style.css">
<style>
:root{
  --bg:#f6f5f0;--surface:#ffffff;--text:#1f1e1d;--muted:#5f5e5a;--border:#d9d7cd;--line:#888780;
  --acc-f:#EEEDFE;--acc-s:#534AB7;--acc-t:#3C3489;--exam-good:#17643f;--exam-bad:#a63731;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171716;--surface:#242422;--text:#efeee9;--muted:#b4b2a9;--border:#3d3d3a;--line:#9c9a92;
  --acc-f:#3C3489;--acc-s:#AFA9EC;--acc-t:#EEEDFE;--exam-good:#85d6a7;--exam-bad:#ffb3ad;
}}
:root[data-theme="dark"]{
  --bg:#171716;--surface:#242422;--text:#efeee9;--muted:#b4b2a9;--border:#3d3d3a;--line:#9c9a92;
  --acc-f:#3C3489;--acc-s:#AFA9EC;--acc-t:#EEEDFE;--exam-good:#85d6a7;--exam-bad:#ffb3ad;
}
.g-amber{--f:#FAEEDA;--s:#BA7517;--t:#633806}
.g-green{--f:#EAF3DE;--s:#3B6D11;--t:#27500A}
.g-coral{--f:#FAECE7;--s:#993C1D;--t:#712B13}
.g-pink{--f:#FBEAF0;--s:#993556;--t:#72243E}
.g-blue{--f:#E6F1FB;--s:#185FA5;--t:#0C447C}
.g-purple{--f:#EEEDFE;--s:#534AB7;--t:#3C3489}
.g-teal{--f:#E1F5EE;--s:#0F6E56;--t:#085041}
.g-gray{--f:#F1EFE8;--s:#5F5E5A;--t:#444441}
.g-red{--f:#FCEBEB;--s:#A32D2D;--t:#791F1F}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .g-amber{--f:#4a2a05;--s:#EF9F27;--t:#FAC775}
  :root:not([data-theme="light"]) .g-green{--f:#1d3a08;--s:#97C459;--t:#C0DD97}
  :root:not([data-theme="light"]) .g-coral{--f:#57200e;--s:#F0997B;--t:#F5C4B3}
  :root:not([data-theme="light"]) .g-pink{--f:#4B1528;--s:#ED93B1;--t:#F4C0D1}
  :root:not([data-theme="light"]) .g-blue{--f:#09345f;--s:#85B7EB;--t:#B5D4F4}
  :root:not([data-theme="light"]) .g-purple{--f:#2d2768;--s:#AFA9EC;--t:#CECBF6}
  :root:not([data-theme="light"]) .g-teal{--f:#063d31;--s:#5DCAA5;--t:#9FE1CB}
  :root:not([data-theme="light"]) .g-gray{--f:#353533;--s:#B4B2A9;--t:#D3D1C7}
  :root:not([data-theme="light"]) .g-red{--f:#5c1717;--s:#F09595;--t:#F7C1C1}
}
:root[data-theme="dark"] .g-amber{--f:#4a2a05;--s:#EF9F27;--t:#FAC775}
:root[data-theme="dark"] .g-green{--f:#1d3a08;--s:#97C459;--t:#C0DD97}
:root[data-theme="dark"] .g-coral{--f:#57200e;--s:#F0997B;--t:#F5C4B3}
:root[data-theme="dark"] .g-pink{--f:#4B1528;--s:#ED93B1;--t:#F4C0D1}
:root[data-theme="dark"] .g-blue{--f:#09345f;--s:#85B7EB;--t:#B5D4F4}
:root[data-theme="dark"] .g-purple{--f:#2d2768;--s:#AFA9EC;--t:#CECBF6}
:root[data-theme="dark"] .g-teal{--f:#063d31;--s:#5DCAA5;--t:#9FE1CB}
:root[data-theme="dark"] .g-gray{--f:#353533;--s:#B4B2A9;--t:#D3D1C7}
:root[data-theme="dark"] .g-red{--f:#5c1717;--s:#F09595;--t:#F7C1C1}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.bar{height:50px;flex:none;position:relative;z-index:20;display:flex;align-items:center;gap:10px;padding:6px 12px;border-bottom:1px solid var(--border);background:var(--surface)}
.brand{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.brand-mark{display:grid;place-items:center;flex:none;width:28px;height:28px;border-radius:8px;background:var(--acc-f);color:var(--acc-t);font-size:12px;font-weight:800;letter-spacing:-.08em}
.bar h1{font-size:15px;line-height:1.2;font-weight:750;letter-spacing:-.025em;margin:0;white-space:nowrap}
.bar button,.bar select,.bar summary{font:inherit;font-size:12px;font-weight:550;min-height:34px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);padding:6px 10px;cursor:pointer}
.bar button:hover,.bar summary:hover{background:var(--bg)}
.bar :is(button,select,summary):focus-visible{outline:3px solid var(--acc-s);outline-offset:2px}
.bar .exam-link{display:flex;gap:8px;align-items:center;justify-content:center;flex:none;background:#6552c5;border-color:#6552c5;color:white;font-weight:700}
.bar .exam-link:hover{background:#5442af}
.exam-count{font-size:11px;font-weight:600;border-left:1px solid #ffffff55;padding-left:8px;opacity:.9}
.bar .area-select{width:100%;min-width:0;background:var(--bg)}
.bar #exbtn[aria-pressed="true"]{background:var(--acc-f);color:var(--acc-t);border-color:var(--acc-s)}
.tools-menu{position:relative;flex:none}
.tools-menu summary{list-style:none;display:flex;align-items:center;justify-content:center;gap:8px;user-select:none}
.tools-menu summary::-webkit-details-marker{display:none}
.tools-menu summary::after{content:'⌄';font-size:15px;color:var(--muted);line-height:1}
.tools-menu[open] summary{border-color:var(--acc-s);background:var(--acc-f)}
.tools-popover{position:absolute;right:0;top:calc(100% + 8px);width:300px;max-width:calc(100vw - 24px);max-height:calc(100dvh - 64px);overflow-y:auto;padding:14px;border:1px solid var(--border);border-radius:12px;background:var(--surface);box-shadow:0 16px 48px #00000030;display:grid;gap:9px}
.tools-popover .menu-label{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin:3px 0 0}
.tools-popover .menu-row{display:flex;gap:8px}
.tools-popover .menu-row button{flex:1}
.tools-popover .menu-help{font-size:11px;color:var(--muted);line-height:1.6;border-top:1px solid var(--border);padding-top:10px;margin:3px 0 0}
.tools-popover kbd{font:inherit;font-size:10px;border:1px solid var(--border);padding:1px 4px;border-radius:4px;background:var(--bg)}
.tools-popover .theme{display:flex}
.tools-popover .theme button{flex:1;padding:6px}
@media(max-width:520px){.bar{height:48px;padding:6px 10px;gap:8px}.brand-extra,.exam-count{display:none}.bar h1{font-size:14px}}
@media(max-width:360px){.brand-mark{display:none}.bar{gap:6px}.bar button,.bar summary{padding:6px 8px}}
.grp{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;flex-shrink:0}
.grp button{font:inherit;font-size:14px;padding:6px 12px;border:0;background:var(--surface);color:var(--muted);cursor:pointer;white-space:nowrap}
.grp button+button{border-left:1px solid var(--border)}
.grp button[aria-pressed="true"]{background:var(--acc-f);color:var(--acc-t);font-weight:600}
.grp button:focus-visible{outline:2px solid var(--acc-s);outline-offset:-2px}
.wrap{position:relative;display:flex;flex:1;min-height:0}
.wrap:fullscreen{height:100vh}
#app{flex:1;min-width:0;height:100%;background:var(--bg)}
#side{position:absolute;right:28px;top:50%;transform:translateY(-50%);width:min(800px,58%);max-height:calc(100% - 40px);overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25);padding:18px 26px 28px;font-size:16px;line-height:1.55;z-index:10}
#side[hidden]{display:none}
#side h2{font-size:21px;font-weight:700;margin:0 0 4px;color:var(--t,var(--text))}
#side .names{font-size:13px;color:var(--muted);margin-bottom:12px}
#side h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:18px 0 6px;font-weight:700}
#side p{margin:0 0 8px}
#side ul.refs{margin:0;padding-left:18px}
#side ul.refs li{margin:3px 0}
#side .trap{background:var(--f,var(--acc-f));border-left:4px solid var(--s,var(--acc-s));padding:8px 10px;border-radius:0 8px 8px 0}
#side .empty{color:var(--muted)}
#side .x{float:right;font:inherit;border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:8px;padding:2px 9px;cursor:pointer}
#side table.mini{width:100%;border-collapse:collapse;font-size:13.5px;margin:4px 0 6px}
#side table.mini th,#side table.mini td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--border);vertical-align:top}
#side table.mini th{color:var(--muted);font-weight:700;font-size:12px}
#side table.mini td:first-child{font-weight:600}
#side .note2{font-size:12.5px;color:var(--muted);margin:2px 0 8px}
#side p.trap + p.trap{margin-top:6px}
.qtools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:4px 0 8px;font-size:13.5px;color:var(--muted)}
.qtools input[type=search]{flex:1 1 100%;font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text)}
.qtools label{display:inline-flex;gap:5px;align-items:center;cursor:pointer}
.qrst{font:inherit;font-size:12.5px;border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:8px;padding:3px 9px;cursor:pointer;margin-left:auto}
.wyn{display:inline-block;margin-left:8px;font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;vertical-align:1px}
.wyn-ok{color:#27500A;background:#C0DD97}
.wyn-bad{color:#791F1F;background:#F7C1C1}
.qtools .cnt{margin-left:auto}
.ans{font-size:14px;margin-top:6px}
.ans ul,.ans ol{padding-left:20px;margin:4px 0}
.ans li{margin:4px 0}
.ans small{color:var(--muted)}
.scen{background:var(--surface);border:1px dashed var(--border);border-radius:8px;padding:7px 9px;font-size:14px}
.opt.reveal{text-align:center;font-weight:600}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--border);margin:10px 0 14px}
.tabs button{font:inherit;font-size:14px;font-weight:600;padding:8px 12px;border:0;border-bottom:3px solid transparent;background:none;color:var(--muted);cursor:pointer;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--t,var(--text));border-bottom-color:var(--s,var(--acc-s))}
.tabs button:focus-visible{outline:2px solid var(--acc-s);outline-offset:-2px}
.nm{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:2px 0 6px}
.chip{background:var(--f,var(--acc-f));border:1.5px solid var(--s,var(--acc-s));border-radius:12px;padding:8px 11px}
.chip .lb{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--t,var(--text));opacity:.75}
.chip .vl{display:block;font-size:17px;font-weight:700;color:var(--t,var(--text));line-height:1.25;margin-top:2px}
.card .more{all:unset;cursor:pointer;display:inline-block;margin-top:8px;font-size:15px;font-weight:600;color:var(--t);background:var(--f);border-radius:999px;padding:2px 12px}
.card .more:focus-visible{outline:2px solid var(--s);outline-offset:2px}
.card.lst{padding:8px 10px}
.card.lst .tog{all:unset;cursor:pointer;display:block;width:100%;font-weight:700;font-size:19px;color:var(--t);line-height:1.3}
.card.lst .tog .cnt{font-weight:600;color:var(--muted)}
.card.lst .tog:focus-visible{outline:2px solid var(--s);outline-offset:2px;border-radius:4px}
.lstbody{max-height:440px;overflow-y:auto;margin-top:8px;cursor:auto}
.lstbody ol,.lstbody ul{margin:0;padding-left:24px;font-size:16px}
.lstbody li{margin:6px 0}
.lstbody .pl{display:block}
.lstbody .en{display:block;font-size:14px;color:var(--muted);font-style:italic}
.cyk{width:100%;background:var(--f);border:2px solid var(--s);border-radius:18px;padding:16px 20px;color:var(--t)}
.cyk-t{font-size:22px;font-weight:700;text-align:center;margin-bottom:12px}
.cyk-row{display:flex;align-items:stretch;gap:10px}
.cyk-f{flex:1;background:var(--surface);border:1.5px solid var(--s);border-radius:12px;padding:10px 12px;font-size:19px;color:var(--text);text-align:center;display:flex;flex-direction:column;gap:3px;justify-content:center}
.cyk-f b{color:var(--t);font-size:15px;text-transform:uppercase;letter-spacing:.04em}
.cyk-ar{align-self:center;font-size:28px;color:var(--s);font-weight:700}
.cyk-back{font-size:22px;white-space:nowrap}
.cykl-fig{display:grid;grid-template-columns:1fr;gap:12px;justify-items:center;margin:4px 0}
.cykl-fig .cykl-svg{max-width:360px}
.cykl-leg{width:100%}
.cykl-leg > span{align-items:flex-start !important}
.cykl-leg > span > span{display:block}
.cykl-svg{width:100%;height:auto}
.cykl-svg path{fill:var(--f);stroke:var(--surface);stroke-width:3}
.cykl-svg text{fill:var(--t);font-size:20px;font-weight:600}
.cykl-svg text.big{font-size:30px;font-weight:800}
.cykl-svg .core{fill:var(--surface);stroke:var(--border)}
.cykl-svg .core-t{fill:var(--text);font-size:18px;font-weight:700}
.cykl-leg{display:flex;flex-direction:column;gap:8px;font-size:15px}
.cykl-leg span{display:flex;align-items:center;gap:8px;color:var(--t);font-weight:600}
.cykl-leg i{width:18px;height:18px;border-radius:5px;background:var(--f);border:2px solid var(--s);flex-shrink:0}
.cykl-tab th.g-amber,.cykl-tab th.g-teal,.cykl-tab th.g-purple{color:var(--t);background:var(--f)}
@media (max-width:700px){.cykl-fig{grid-template-columns:1fr}}
.trapnote{display:inline-block;margin-top:8px;font-size:14px;font-weight:700;color:#791F1F;background:#FCEBEB;border:1px solid #F09595;border-radius:999px;padding:1px 10px}
:root[data-theme="dark"] .trapnote{color:#F7C1C1;background:#5c1717;border-color:#A32D2D}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .trapnote{color:#F7C1C1;background:#5c1717;border-color:#A32D2D}}
.zas .trapnote{margin:0 0 0 10px;font-size:13px}
.cyk .trapnote{display:block;width:max-content;margin:10px auto 0}
.pref{font:inherit;font-size:inherit;color:var(--acc-s);background:none;border:0;border-bottom:1.5px dotted var(--acc-s);padding:0;cursor:pointer}
.pref:hover{background:var(--acc-f)}
#pv{position:absolute;left:24px;top:50%;transform:translateY(-50%);width:min(560px,calc(42% - 70px));max-height:calc(100% - 40px);overflow-y:auto;background:var(--surface);border:2px solid var(--acc-s);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.28);padding:16px 20px 22px;z-index:12;font-size:15px}
#pv[hidden]{display:none}
#pv h2{font-size:20px;margin:0 0 6px}
#pv .x{position:absolute;right:14px;top:12px;font:inherit;border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:8px;padding:2px 9px;cursor:pointer}
#pv .pvt{white-space:pre-wrap;font-family:inherit;font-size:15px;line-height:1.55;margin:8px 0 0;color:var(--text)}
@media (max-width:900px){#pv{left:10px;right:10px;width:auto;top:10px;transform:none;max-height:45%}}
details.q.sp1{border-left:5px solid #BA7517}
details.q.sp1 .meta{color:#854F0B;font-weight:600}
.f1box{display:block;box-sizing:border-box;width:100%;height:100%;border:4px dashed var(--s);border-radius:20px;background:color-mix(in srgb,var(--f) 70%,transparent);padding:12px 16px}
.grp-t{font-weight:800;font-size:26px;line-height:1.2;color:var(--t)}
.grp-en{display:block;font-weight:600;font-size:19px}
.grp-s{font-size:18px;line-height:1.35;color:var(--t);margin-top:4px}
.card .en{font-size:16px;color:var(--muted);margin-top:2px;line-height:1.25}
.zas .en{display:block;font-size:15px;opacity:.85}
.grp-names{margin:6px 0 8px;line-height:1.25;color:var(--t)}
.grp-names .hb,.grp-names .ex{font-size:24px}
.grp-names .hb{font-weight:800}
.grp-names .ex{font-weight:400;margin-top:2px}
.grp-names .en{font-size:17px;margin-top:4px}
.grp-names > div{margin:3px 0}
.grp-names .lb{display:inline-block;min-width:118px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;opacity:.75;margin-right:6px}
.cykl-tab tr.cykl-ph td{background:var(--f,var(--acc-f));color:var(--t,var(--text))}
.cykl-tab .rdot{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--f);border:2px solid var(--s);margin-right:6px;vertical-align:-1px}
.cykl-leg small{font-weight:400;color:var(--muted)}

.fundbox{width:100%;height:100%;box-sizing:border-box;border:4px solid #993C1D;border-radius:22px;background:color-mix(in srgb,#FAECE7 55%,transparent);padding:18px 26px;color:var(--text)}
.fund-t{font-size:30px;font-weight:800}
.fund-t i{font-weight:600;font-size:22px}
.fund-s{font-size:19px;margin-top:6px;line-height:1.35}
:root[data-theme="dark"] .fundbox{border-color:#F0997B;background:color-mix(in srgb,#57200e 45%,transparent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fundbox{border-color:#F0997B;background:color-mix(in srgb,#57200e 45%,transparent)}}


.exban{display:inline-block;font-size:12.5px;font-weight:700;letter-spacing:.02em;color:var(--t,var(--text));background:var(--f,var(--acc-f));border:1px solid var(--s,var(--acc-s));border-radius:999px;padding:3px 10px;margin:2px 0 8px}
.expane-box h3:first-child{margin-top:4px}
.expane-box p{font-size:15.5px;line-height:1.5}
.gojump{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--s,var(--acc-s));background:var(--f,var(--acc-f));color:var(--t,var(--text));border-radius:999px;padding:4px 12px;margin:2px 4px 2px 0;cursor:pointer}
.gojump:hover{filter:brightness(.95)}
.pol-box{background:var(--f,var(--acc-f));border:1px solid var(--s,var(--acc-s));border-radius:12px;padding:10px 14px;margin:2px 0 12px}
.pol-box b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--t,var(--text))}
.pol-box p{margin:4px 0 0;font-size:16px;line-height:1.5}
.expane-out{font-weight:700;background:var(--f,var(--acc-f));border-left:4px solid var(--s,var(--acc-s));padding:8px 10px;border-radius:0 8px 8px 0}
#exbtn[aria-pressed="true"]{background:var(--acc-f);color:var(--acc-t);font-weight:600}
.wedge-fig{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:4px 0 8px}
.wedge-svg{width:200px;max-width:200px;flex:none}
.wedge-svg .wdim{opacity:.45}
.wedge-svg path:not(.wdim){fill:var(--s)}
.wedge-rows{flex:1;min-width:240px;display:flex;flex-direction:column;gap:10px}
.wedge-row{display:flex;gap:8px;align-items:flex-start;font-size:15px;line-height:1.3}
.wedge-row .rdot{flex:none;display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--f);border:2px solid var(--s);margin-top:3px}
.wedge-k{font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
.wedge-hb,.wedge-en{font-size:13px;color:var(--muted)}
.card.cmini{padding:9px 12px;border-top-width:5px}
.card.cmini .t{font-size:17px}
.card.cmini .s{font-size:14px;margin-top:3px}
.card.cmini .en{font-size:13px}
.pvimg{display:block;width:100%;height:auto;border-radius:8px;background:#fff;border:1px solid var(--border);margin:6px 0 10px}
.pvtxt summary{cursor:pointer;font-size:13px;color:var(--muted);margin:6px 0}
.ilfig{margin:8px 0 14px}
.ilfig img{display:block;width:100%;height:auto;border-radius:8px;background:#fff;border:1px solid var(--border);margin-bottom:6px}
.ilfig figcaption{font-size:12.5px;color:var(--muted)}
.figbox{width:100%;height:100%;box-sizing:border-box;border:3px dashed var(--s);border-radius:18px;background:color-mix(in srgb,var(--f) 30%,transparent);padding:14px 20px;color:var(--text)}
.figbox-t{font-size:22px;font-weight:800;color:var(--t)}
.figbox-s{font-size:14px;color:var(--muted);margin-top:4px;line-height:1.3}
.card.cfix{height:118px;overflow:hidden}
.card.cfix .t{font-size:15px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card.cfix .en,.card.cfix .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.q{border:1px solid var(--border);border-radius:10px;margin:8px 0;background:var(--bg)}
details.q > summary{cursor:pointer;padding:9px 11px;list-style:none;font-size:14.5px}
details.q > summary::-webkit-details-marker{display:none}
details.q > summary .meta{display:block;font-size:12px;color:var(--muted);margin-top:3px}
details.q[open] > summary{border-bottom:1px solid var(--border)}
.qb{padding:8px 11px 11px}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:14px;margin:5px 0;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);cursor:pointer}
.opt:hover{border-color:var(--line)}
.opt.ok{border-color:#3B6D11;background:#EAF3DE;color:#173404}
.opt.bad{border-color:#A32D2D;background:#FCEBEB;color:#501313}
.opt .why{display:none;font-size:13px;margin-top:4px}
.done .opt .why{display:block}
.opt .why b{font-weight:700}
.qsrc{font-size:12px;color:var(--muted);margin-top:6px}
.fzbtn{font:inherit;font-size:13px;margin:8px 0 2px;padding:6px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:inherit;cursor:pointer}.fzbtn:focus-visible{outline:3px solid var(--acc-s);outline-offset:2px}.fzbox .fz-card{font-size:13px;border:1px solid var(--border);padding:10px 12px;margin:6px 0}.fzbox .fz-n{font-size:12px;color:var(--muted);margin:0}.fzbox .fz-h{font-size:15px;margin:4px 0 6px}.fzbox .fz-ex{border-left:3px solid var(--text);background:var(--bg);padding:8px 10px;margin:6px 0}.fzbox .fz-org{border-left-color:var(--border)}.fzbox .fz-ex span{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.react-flow__node.sel .card,.react-flow__node.sel .zas{outline:3px solid var(--s);outline-offset:3px}
.react-flow__node{cursor:pointer;transition:opacity .3s}
.react-flow__node.dim{opacity:.16}
.react-flow__edge{transition:opacity .3s}
.react-flow__edge.dim{opacity:.1}
.react-flow__node.sel .card{box-shadow:0 0 0 4px var(--s),0 12px 30px rgba(0,0,0,.25)}
.fnav{display:flex;align-items:center;gap:8px;margin:0 46px 8px 0;font-size:13px;color:var(--muted)}
.fnav button{font:inherit;font-size:13px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:4px 10px;cursor:pointer}
.fnav button:hover{border-color:var(--line)}
#side h2{font-size:26px !important;line-height:1.2}
@media (max-width:900px){#side{left:10px;right:10px;width:auto;top:auto;bottom:10px;transform:none;max-height:62%}}
.loading{padding:24px;color:var(--muted)}

/* węzły */
.card{width:100%;background:var(--surface);border:1px solid var(--border);border-top:6px solid var(--s);border-radius:12px;padding:12px 14px;color:var(--text);font-size:19px;line-height:1.35;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.card .t{font-weight:700;font-size:22px;color:var(--t);line-height:1.2}
.card .s{font-size:17px;color:var(--muted);margin-top:4px}
.card ul{margin:8px 0 0;padding-left:22px}
.card li{margin:3px 0}
.card li.hot{font-weight:700;color:var(--t);background:var(--f);border-radius:6px;padding:0 6px;margin-left:-6px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.pill{background:var(--f);color:var(--t);border-radius:999px;padding:2px 11px;font-size:17px;font-weight:600}
.zas{width:100%;background:var(--f);color:var(--t);border:2px solid var(--s);border-radius:14px;padding:10px 16px;text-align:center;font-size:20px}
.zas b{font-weight:700}
.stg{display:flex;align-items:center;gap:10px;font-weight:700;font-size:24px;color:var(--text);white-space:nowrap}
.stg .n{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:var(--s);color:var(--surface);font-size:20px}
.react-flow__edge-text{font-size:17px !important}
.react-flow__handle{opacity:0;width:6px;height:6px;min-width:0;min-height:0;border:0}
.react-flow__edge-textbg{fill:var(--bg)}
.react-flow__edge-text{fill:var(--muted);font-size:13px}
.react-flow__attribution{background:transparent}

main{max-width:800px;margin:0 auto;padding:16px 20px 64px}
main h2{font-size:20px;font-weight:600;margin:40px 0 12px}
.tbl{width:100%;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:top}
th{font-weight:600;color:var(--muted)}
tr:last-child td{border-bottom:0}
code{font-family:ui-monospace,Menlo,monospace;font-size:14px}
main ul{padding-left:20px}
main li{margin:6px 0}
.note{font-size:14px;color:var(--muted)}
</style>
</head>

":"EN-02-06","t":"Z którym aktywatorem zasady i polityki mają silny związek przez wartości etyczne?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 68"],"r":"B","zap":"Polityki odzwierciedlają kulturę i etykę → Kultura, Etyka i Zachowanie.","scen":"","o":[{"t":"Struktury organizacyjne","ok":false,"w":"Inne aktywatory również mogą być powiązane z etyką. Pytanie dotyczy wskazanej w tym fragmencie relacji zasad i polityk z pożądanymi wartościami i zachowaniami (s. 68)."},{"t":"Informacja","ok":false,"w":"Związek z Informacją wynika z tego, że polityki są informacją, nie z etyki (s. 68)."},{"t":"Procesy","ok":false,"w":"Procesy są głównym środkiem realizacji polityk – to inny związek (s. 68)."},{"t":"Kultura, Etyka i Zachowanie","ok":true,"w":"Zasady i polityki mają odzwierciedlać kulturę i wartości etyczne – silny związek z Kulturą, Etyką i Zachowaniem (s. 68)."}]},"q-pc-en1-073":{"id":"q-pc-en1-073","typ":"egzamin","s":"EN-02-07","t":"Która grupa NIE należy do zewnętrznych interesariuszy procesu? Wybierz według przykładowej klasyfikacji na s. 69 FW-PL.","k":false,"st":"autorskie","src":"","z":["FW-PL s. 69"],"r":"B","zap":"Zarząd = interesariusz wewnętrzny.","scen":"","o":[{"t":"Klienci","ok":false,"w":"Klienci są interesariuszami zewnętrznymi (s. 69)."},{"t":"Udziałowcy","ok":false,"w":"Udziałowcy są interesariuszami zewnętrznymi (s. 69)."},{"t":"Organy regulacyjne","ok":false,"w":"Organy regulacyjne są interesariuszami zewnętrznymi (s. 69)."},{"t":"Zarząd","ok":true,"w":"Zarząd jest interesariuszem wewnętrznym (s. 69)."}]},"q-pc-en1-074":{"id":"q-pc-en1-074","typ":"egzamin","s":"EN-02-07","t":"Regulator rynku finansowego nadzoruje proces kredytowy banku. Jakim jest interesariuszem procesu?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 69"],"r":"A","zap":"Regulator = interesariusz zewnętrzny procesu.","scen":"","o":[{"t":"Nie jest interesariuszem procesu","ok":false,"w":"Organy regulacyjne są wymienione wśród interesariuszy (s. 69)."},{"t":"Zewnętrznym","ok any (I)","ok":false,"w":"I ma zarząd – dostaje raport (s. 92)."}]},"q-pc-impc-001":{"id":"q-pc-impc-001","typ":"egzamin","s":"IM-01-01","t":"Który zestaw zawiera trzy wzajemnie powiązane komponenty cyklu życia wdrożenia?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 37","FW-PL s. 38, Rys. 17"],"r":"B","zap":"Trzy pierścienie: zarządzanie programem, aktywowanie zmiany, ciągłe doskonalenie.","scen":"","o":[{"t":"Oszacuj, kieruj i monitoruj","ok":false,"w":"To trzy rodzaje działań Ładu (domena EDM, s. 32), a nie komponenty cyklu wdrożenia (s. 37)."},{"t":"Planowanie, wdrażanie i ocena zdolności procesów","ok":false,"w":"Te działania mogą występować w inicjatywie wdrożenia. Nie są jednak trzema nazwami komponentów Rysunku 17: program, aktywowanie zmiany, ciągłe doskonalenie (s. 37–38)."},{"t":"Zarządzanie programem, aktywowanie zmiany i ciągłe doskonalenie","ok":true,"w":"Tak. Strona 37 wymienia cykl ciągłego doskonalenia, zmianę (aspekty behawioralne i kulturowe) i zarządzanie programem; rys. 17 pokazuje je jako trzy pierścienie (s. 38)."},{"t":"Zarządzanie programem, zarządzanie ryzykiem i zarządzanie dostawcami","ok":false,"w":"Tylko pierwszy element jest pierścieniem. Ryzyko i dostawcy to obszary procesów, nie komponenty cyklu (s. 37)."}]},"q-pc-impc-008":{"id":"q-pc-impc-008","typ":"egzamin","s":"IM-01-01","t":"Bank powołał sponsora wdrożenia, przydzielił zasoby, role i harmonogram projektów. Którym komponentem cyklu życia się zajmuje?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 36","FW-PL s. 39","FW-PL s. 38, Rys. 17"],"r":"A","zap":"Sponsor, zasoby, role, harmonogram → pierścień zarządzania programem.","scen":"","o":[{"t":"Pierścieniem aktywowania zmiany","ok":false,"w":"Ten pierścień dotyczy ludzi, zachowań i kultury (s. 37)."},{"t":"Pierścieniem ciągłego doskonalenia","ok":false,"w":"Ten pierścień ulepsza same aktywatory: ocena stanu, usprawnienia, pomiar (s. 37–38)."},{"t":"Cyklem życia aktywatora","ok":false,"w":"To wymiar modelu aktywatora (s. lturę (s. 35)."},{"t":"Bo tylko firmy przygotowują uzasadnienie biznesowe","ok":false,"w":"Uzasadnienie biznesowe dotyczy każdej inicjatywy wdrożeniowej (s. 39)."}]},"q-pc-impc-017":{"id":"q-pc-impc-017","typ":"egzamin","s":"IM-02-01","t":"Gmina ma niejasny model funkcjonowania i brak aktywatorów Ładu na poziomie całej organizacji. Co jest wtedy jeszcze ważniejsze?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 36"],"r":"A","zap":"W niekorzystnym środowisku wsparcie interesariuszy jest jeszcze ważniejsze.","scen":"","o":[{"t":"Pominięcie uzasadnienia biznesowego, by szybciej ruszyć","ok":false,"w":"Cele i korzyści trzeba przedstawić w uzasadnieniu biznesowym od początku (s. 36, 39)."},{"t":"Wsparcie i uczestnictwo kluczowych interesariuszy","ok":true,"w":"W niekorzystnym środowisku wsparcie i uczestnictwo interesariuszy są jeszcze istotniejsze (s. 36)."},{"t":"Ocena wszystkich procesów na poziomie 5 przed startem","ok":false,"w":"Poziom docelowy wybiera się z rachunku kosztów i korzyści i rzadko jest najwyższy (s. 42–43)."},{"t":"Przekazanie całej inicjatywy dostawcy zewnętrznemu","ok":false,"w":"Podręcznik wskazuje na wsparcie i kierunek ze strony interesariuszy organizacji (s. 36)."}]},"q-pc-impc-024":{"id":"q-pc-impc-024","typ":"egzamin","s":"IM-02-02","t":"Starostwo musi za rok spełnić nowe przepisy o ochronie danych. Czym jest to dla wdrożenia COBIT 5?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 36","FW-PL s. 37"],"r":"A","zap":"Nowe wymagania regulacyjne = zdarzenie; ich niespełnianie = punkt zapalny.","scen":"","o":[{"t":"Punktem zapalnym","ok":false,"w":"Punktem zapalnym byłoby niespełnianie obecnych wymagań regulacyjnych (s. 36). Nowe wymagania to zdarzenie (s. 37)."},{"t":"Kluczowym czynnikiem sukcesu","ok":false,"w":"Kluczowe czynniki sukcesu to warunki udanego wdrożenia, np. wsparcie kierownictwa (s. 35)."},{"t":"Rezultatem procesu","ok":false,"w":"Rezultat to element opisu procesu (s. 43), nie bodziec do wdrożenia."},{"t":"Zdarzeniem wyzwalającym","ok":true,"w":"Nowe wymagania regulacyjne lub dotyczące zgodności to zdarzenie wyzwalające (s. 37)."}]},"q-pc-impc-026":{"id":"q-pc-impc-026","typ":"egzamin","s":"IM-02-02","t":"Który przykład umieszczono w podręczniku wśród punktów zapalnych, a pozostałe wśród zdarzeń wyzwalających (FW-PL s. 36–37)?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 36","FW-PL s. 37"],"r":"B","zap":"Niespełnianie wymagań to punkt zapalny; nowe wymagania to zdarzenie.","scen":"","o":[{"t":"Niespełnianie wymagań regulacyjnych lub umownych","ok":true,"w":"To punkt zapalny (s. 36)."},{"t":"Nowe wymogi dotyczące zgodności z przepisami","ok":false,"w":"To zdarzenie wyzwalające (s. 37)."},{"t":"Ogólnofirmowy projekt w zakresie Ładu","ok":false,"w":"To zdarzenie wyzwalające (s. 37)."},{"t":"Istotna zmiana technologii lub przesunięcie paradygmatu","ok":false,"w":"To zdarzenie wyzwalające (s. 37)."}]},"q-pc-impc-032":{"id":"q-pc-impc-032","typ":"egzamin","s":"IM-02-03","t":"Uzupełnij brakujące słowo: Uzasadnienie biznesowe nie jest jednorazowym, statycznym dokumentem, lecz [?] narzędziem operacyjnym.","k":false,"st":"autorskie","src":"","z":["FW-PL s. 39"],"r":null,"zap":"Uzasadnienie biznesowe to dynamiczne narzędzie, stale aktualizowane.","scen":"","o":[{"t":"dynamicznym","ok":true,"w":"Strona 39: dynamiczne narzędzie operacyjne, stale aktualizowane."},{"t":"archiwalnym","ok":false,"w":"Odwrotnie: musi być stale aktualizowane (s. 39)."},{"t":"normatywnym","ok":false,"w":"Podręcznik tak go nie nazywa; ma odzwierciedlać aktualny obraz sytuacji (s. 39)."},{"t":"opcjonalnym","ok":false,"w":"Inicjatywa musi opierać się na uzasadnieniu biznesowym (s. 39)."}]},"q-pc-impc-038":{"id":"q-pc-impc-038","typ":"egzamin","s":"IM-02-03","t":"Zarząd sklepu internetowego pyta, dlaczego ma sfinansować poprawę Ładu IT. Co powinno mu to wyjaśnić w kategoriach biznesowych?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 36","FW-PL s. 37","FW-PL s. 39","FW-EN s. 37"],"r":"A","zap":"Cele i korzyści w yka bazowa to działanie wykonywane w procesie (sylabus)."},{"t":"Przeznaczenie procesu","ok":true,"w":"Przeznaczenie (process purpose) to ogólny cel procesu i oczekiwane efekty (sylabus; podręcznik: cel procesu, s. 43)."},{"t":"Definicja procesu (PA 3.1)","ok":false,"w":"To atrybut poziomu 3, a nie element opisu procesu (rys. 19, s. 42)."}]},"q-pc-impc-112":{"id":"q-pc-impc-112","typ":"egzamin","s":"PC-02-01","t":"Proces w ministerstwie nie osiągnął poziomu 1. Co można zrobić na podstawie oceny?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 42","FW-PL s. 45"],"r":"A","zap":"Brak poziomu 1 → ustal brakujące praktyki i zaplanuj doskonalenie.","scen":"","o":[{"t":"Pominąć proces, bo poziom 1 nie ma znaczenia","ok":false,"w":"Odwrotnie: poziom 1 jest bardzo ważny i stanowi fundament wyższych (s. 45)."},{"t":"Od razu przejść do oceny atrybutów poziomu 2","ok":false,"w":"Można zbierać dowody dotyczące wyższych atrybutów. Nie pozwala to jednak przyznać poziomu 2 bez PA 1.1 osiągniętego w pełni. Najpierw należy rozpoznać braki w osiąganiu celu procesu (s. 42, 45)."},{"t":"Zastąpić ocenę analizą kosztów i korzyści procesu","ok":false,"w":"Podręcznik wskazuje plan doskonalenia oparty na ocenie praktyk (s. 45)."},{"t":"Ustalić brakujące praktyki i zaplanować doskonalenie","ok":true,"w":"Strona 45: ocena praktyk wskazuje braki, co pozwala zdefiniować plan doskonalenia."}]},"q-pc-impc-123":{"id":"q-pc-impc-123","typ":"egzamin","s":"PC-02-02","t":"Samoocena według Przewodnika Samooceny dała procesowi sklepu internetowego poziom 2. Jak traktować ten wynik?","k":false,"st":"autorskie","src":"","z":["SYL","FW-PL s. 43"],"r":"A","zap":"Samoocena służy prostszemu rozpoznaniu sytuacji i może przygotować ocenę formalną. Przewodnik Asesora opisuje formalną procedurę; dokument sam nie nadaje wyniku.","scen":"","o":[{"t":"Jako formalny wynik do certyfikacji","ok":false,"w":"Mniej rygorystyczna samoocena nie jest równoważna formalnej ocenie prowadzonej według Przewodnika Asesora. Sam w pokazuje, czy osiągnięto cel – wskaźnik opóźniony (s. 29)."},{"t":"Wiodący – mierzy stosowanie dobrych praktyk","ok":false,"w":"Tu mierzymy rezultat, nie praktyki (s. 29)."},{"t":"Wiodący – mierzy cykl życia","ok":false,"w":"Tu mierzymy rezultat, nie cykl życia (s. 29)."},{"t":"Ani wiodący, ani opóźniony","ok":false,"w":"Mierniki aktywatora są wiodące albo opóźnione (s. 29)."}]},"q-pc-pr-163":{"id":"q-pc-pr-163","typ":"egzamin","s":"PR-02-14","t":"Dyrektor IT ministerstwa przygotowuje plan wdrożenia systemu kadrowego. To działanie z obszaru…","k":false,"st":"autorskie","src":"","z":["FW-PL s. 31"],"r":"B","zap":"Planowanie wdrożenia = Zarządzanie.","scen":"","o":[{"t":"Zarządzania","ok":true,"w":"Planowanie i budowanie zgodnie z kierunkiem to Zarządzanie (s. 31)."},{"t":"Organu Ładu i nadzoru","ok":false,"w":"Organ Ładu wyznacza kierunek (s. 24)."},{"t":"Interesariuszy","ok":false,"w":"Interesariusze delegują (s. 24)."},{"t":"Ładu","ok":false,"w":"Ład ocenia, kieruje i monitoruje (s. 31)."}]},"q-pc-pr-174":{"id":"q-pc-pr-174","typ":"egzamin","s":"PR-02-15","t":"Rada banku ustala apetyt na ryzyko, a kierownictwo podejmuje decyzje wdrożeniowe o zabezpieczeniach. Której pozycji tabeli interakcji Ładu i Zarządzania odpowiada ten przykład (FW-PL s. 31)?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 31"],"r":"B","zap":"Decyzje struktur Ładu ↔ decyzje wdrożeniowe = Struktury organizacyjne.","scen":"","o":[{"t":"Informacja","ok":false,"w":"Informacja to wejścia i wyjścia procesów (s. 31)."},{"t":"Struktury organizacyjne","ok":true,"w":"Interakcja decyzji struktur Ładu (np. apetyt na ryzyko) z decyzjami wdrożeniowymi (s. 31)."},{"t":"Kultura, Etyka i Zachowanie","ok":false,"w":"Kultura to przykład dawany odgórnie (s. 31)."},{"t":"Procesy","ok":false,"w":"Procesy to praktyki, działania i RACI (s. 31)."}]},"fz-A-001":{"id":"fz-A-001","typ":"egzamin","s":"PR-02-01","t":"Czym jest COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 13"],"r":null,"zap":"","scen":"","o":[{"t":"Normą ISO opisującą wyłącznie zarządzanie usługami IT","ok":false,"w":"COBIT 5 nie jest normą ISO, tylko ogólną strukturą ramową Ładu i Zarządzania IT."},{"t":"Kompleksową strukturą ramową Ładu i Zarządzania IT w organizacji, która pomaga tworzyć wartość przez równowagę korzyści, ryzyka i zasobów","ok":true,"w":"Tak definiuje COBIT 5 fiszka i podręcznik (s. 13)."},{"t":"Zbiorem procedur technicznych dla działu IT, bez związku z celami biznesu","ok":false,"w":"COBIT 5 wiąże IT z wartością dla całej organizacji, a nie tylko z działem IT."},{"t":"Metodyką zarządzania projektami, która zastępuje PRINCE2","ok":false,"w":"COBIT 5 integruje PRINCE2 i inne standardy, a nie je zastępuje."}],"fz":{"h":"Struktura ramowa","p":"P2","pulapka":false,"n":"≠ TŁUMACZENIE · egzamin: struktura ramowa · podr.: metodyka · EN: business framework · EN: Business framework for the governance and management of enterprise IT","q":"Czym jest COBIT 5? / Czym jest COBIT 5?","a":"Kompleksową strukturą ramową Ładu i Zarządzania IT w organizacji; pomaga tworzyć wartość przez równowagę korzyści, ryzyka i zasobów.\nKompleksową strukturą ramową (podr. metodyką) Ładu i Zarządzania IT w organizacji. Pomaga uzyskać optymalną wartość z IT przez równowagę korzyści, ryzyka i wykorzystania zasobów.","ex":"Instrukcja rządzenia komputerami i danymi w firmie: tak, by wydatki na IT dawały korzyść, nie narażały na kłopoty i nie marnowały pieniędzy.\nW domu rodzice ustalają, na co idą pieniądze (Ład), a ktoś robi codzienne zakupy i naprawy (Zarządzanie). COBIT 5 podpowiada jedno i drugie dla IT.","org":""}},"fz-A-002":{"id":"fz-A-002","typ":"egzamin","s":"PR-02-11","t":"Dla jakich organizacji przeznaczony jest COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 13"],"r":null,"zap":"","scen":"","o":[{"t":"Tylko dla dużych korporacji notowanych na giełdzie","ok":false,"w":"COBIT 5 jest dla organizacji każdej wielkości, nie tylko dużych."},{"t":"Tylko dla instytucji sektora publicznego","ok":false,"w":"Obejmuje też organizacje komercyjne i non-profit."},{"t":"Tylko dla firm, które same wytwarzają oprogramowanie","ok":false,"w":"COBIT 5 ma charakter ogólny i nie zależy od branży."},{"t":"Dla organizacji każdej wielkości: komercyjnych, non-profit i z sektora publicznego","ok":true,"w":"COBIT 5 ma charakter ogólny – każdy dopasowuje go do siebie."}],"fz":{"h":"Przeznaczenie COBIT 5","p":"P2","pulapka":false,"n":"egzamin: ogólny, każda wielkość · podr.: ogólny, każda wielkość · EN: generic, all sizes · EN: Generic, for all sizes, commercial, not-for-profit, public sector","q":"Dla jakich organizacji jest COBIT 5? / Dla jakich organizacji przeznaczony jest COBIT 5?","a":"Dla organizacji każdej wielkości: komercyjnych, non-profit i z sektora publicznego. Ma charakter ogólny.\nDla organizacji każdej wielkości: komercyjnych, non-profit i z sektora publicznego. Ma charakter ogólny.","ex":"Jak przepisy BHP: pasują i do małego sklepu, i do dużej komendy straży, bo są ogólne. Każdy dopasowuje je do siebie.\nPasuje wszędzie: od osiedlowego sklepu po urząd i straż pożarną. Haczyk: „ogólny” znaczy rozmiar uniwersalny, każdy dopasowuje go do siebie.","org":"sklep internetowy i komenda straży pożarnej korzystają z tego samego modelu."}},"fz-A-003":{"id":"fz-A-003","typ":"egzamin","s":"PR-02-11","t":"Do której części rodziny produktów COBIT 5 należy przewodnik „COBIT 5: Procesy umożliwiające”?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 11"],"r":null,"zap":"","scen":"","o":[{"t":"Do przewodników specjalistycznych","ok":false,"w":"Przewodniki specjalistyczne to np. Wdrożenie, Bezpieczeństwo informacji, Audyt, Ryzyko."},{"t":"Do samej struktury ramowej COBIT 5","ok":false,"w":"Struktura ramowa to osobna, główna publikacja rodziny."},{"t":"Do przewodników aktywatorów","ok":true,"w":"Procesy umożliwiające i Informacje umożliwiające to przewodniki aktywatorów."},{"t":"Do środowiska współpracy online","ok":false,"w":"Środowisko online to osobny element rodziny, nie przewodnik."}],"fz":{"h":"Rodzina produktów","p":"P2","pulapka":false,"n":"egzamin: rodzina produktów · podr.: rodzina produktów · EN: COBIT 5 product family · EN: COBIT 5 product family: framework, enabler guides, professional guides, collaborative online environment","q":"Z czego składa się rodzina produktów COBIT 5? / Z czego składa się rodzina produktów COBIT 5?","a":"Struktura ramowa COBIT 5; przewodniki aktywatorów (procesy, informacje…); przewodniki specjalistyczne (wdrożenie, bezpieczeństwo, audyt, ryzyko…); środowisko współpracy online.\nCOBIT 5 (struktura ramowa); przewodniki aktywatorów (Procesy umożliwiające, Informacje umożliwiające, inne); przewodniki specjalistyczne (Wdrożenie, Bezpieczeństwo informacji, Audyt, Ryzyko, inne); środowisko współpracy online.","ex":"Jak zestaw LEGO: instrukcja główna (struktura ramowa), katalogi klocków (przewodniki aktywatorów), zestawy tematyczne (przewodniki specjalistyczne) i forum fanów w internecie.\nJak podręcznik szkolny: główna książka (struktura ramowa), zeszyty o elementach (aktywatory), zbiory tematyczne (wdrożenie, bezpieczeństwo, audyt, ryzyko) i klasowa grupa w internecie.","org":""}},"fz-A-004":{"id":"fz-A-004","typ":"egzamin","s":"PR-02-01","t":"Który z poniższych NIE jest korzyścią, do której dążą organizacje stosujące COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 13"],"r":null,"zap":"","scen":"","o":[{"t":"Wysoka jakość informacji wspierającej decyzje","ok":false,"w":"To jedna z korzyści wymienionych na fiszce."},{"t":"Optymalizacja kosztów usług i technologii IT","ok":false,"w":"To jedna z korzyści wymienionych na fiszce."},{"t":"Zgodność z przepisami, umowami i politykami","ok":false,"w":"To jedna z korzyści wymienionych na fiszce."},{"t":"Całkowite wyeliminowanie ryzyka IT","ok":true,"w":"COBIT 5 dąży do ryzyka IT na akceptowalnym poziomie, a nie do zera."}],"fz":{"h":"Korzyści stosowania","p":"P2","pulapka":false,"n":"egzamin: korzyści · podr.: korzyści · EN: benefits · EN: Benefits: information quality, value, operational excellence, acceptable IT risk, cost optimisation, compliance","q":"Do czego dążą organizacje, stosując COBIT 5? / Do czego dążą organizacje, stosując COBIT 5 (korzyści)?","a":"Wysoka jakość informacji do decyzji; wartość z inwestycji IT; sprawność operacyjna; ryzyko IT na akceptowalnym poziomie; optymalne koszty IT; zgodność z przepisami.\nWysoka jakość informacji do decyzji; wartość biznesowa z inwestycji wspieranych przez IT; sprawność operacyjna; ryzyko IT na akceptowalnym poziomie; optymalizacja kosztów usług i technologii IT; zgodność z przepisami, umowami i politykami.","ex":"Jak dobrze prowadzony dom: wiesz, na co wydajesz, sprzęt działa, ryzyko pożaru jest pod kontrolą, rachunki rozsądne, a wszystko zgodne z przepisami.\nJak przy remoncie: dobre informacje do decyzji, remont się opłaca, ekipa sprawna, ryzyko pod kontrolą, koszty rozsądne i wszystko zgodne z prawem.","org":"krótsze przerwy usług krytycznych przy tym samym budżecie."}},"fz-A-005":{"id":"fz-A-005","typ":"egzamin","s":"PR-01-03,PR-01-04","t":"Ile procesów zawiera Referencyjny Model Procesu COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 33"],"r":null,"zap":"","scen":"","o":[{"t":"34","ok":false,"w":"34 procesy miał COBIT 4.1, nie COBIT 5."},{"t":"32","ok":false,"w":"32 to liczba procesów samego Zarządzania (APO, BAI, DSS, MEA)."},{"t":"37","ok":true,"w":"EDM 5 + APO 13 + BAI 10 + DSS 6 + MEA 3 = 37."},{"t":"40","ok":false,"w":"40 celów ma COBIT 2019, a egzamin dotyczy COBIT 5."}],"fz":{"h":"Liczba procesów","p":"P1","pulapka":false,"n":"egzamin: 37 procesów · podr.: 37 procesów · EN: 37 processes · EN: 37 processes: EDM 5, APO 13, BAI 10, DSS 6, MEA 3","q":"Ile procesów ma COBIT 5 i jak się rozkładają? / Ile procesów ma COBIT 5 i jak się rozkładają?","a":"37: Ład EDM 5; Zarządzanie APO 13, BAI 10, DSS 6, MEA 3 (razem 32).\n37 procesów. Ład: EDM 5. Zarządzanie: APO 13, BAI 10, DSS 6, MEA 3 (razem 32).","ex":"Zapamiętaj ciąg 5-13-10-6-3. Ład (EDM) ma 5 procesów jak palce jednej ręki szefa, reszta to Zarządzanie: 32. Razem 37.\nCiąg liczb 5-13-10-6-3. Ład ma 5 (jak palce ręki), Zarządzanie 32; razem 37, czyli o trzy więcej niż 34 w COBIT 4.1.","org":""}},"fz-A-006":{"id":"fz-A-006","typ":"egzamin","s":"PR-01-04","t":"Która domena COBIT 5 ma 13 procesów?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 33"],"r":null,"zap":"","scen":"","o":[{"t":"APO","ok":true,"w":"APO ma 13 procesów – najwięcej ze wszystkich domen."},{"t":"BAI","ok":false,"w":"BAI ma 10 procesów."},{"t":"DSS","ok":false,"w":"DSS ma 6 procesów."},{"t":"EDM","ok":false,"w":"EDM (Ład) ma 5 procesów."}],"fz":{"h":"Liczba procesów","p":"P1","pulapka":false,"n":"egzamin: 37 procesów · podr.: 37 procesów · EN: 37 processes · EN: 37 processes: EDM 5, APO 13, BAI 10, DSS 6, MEA 3","q":"Ile procesów ma COBIT 5 i jak się rozkładają? / Ile procesów ma COBIT 5 i jak się rozkładają?","a":"37: Ład EDM 5; Zarządzanie APO 13, BAI 10, DSS 6, MEA 3 (razem 32).\n37 procesów. Ład: EDM 5. Zarządzanie: APO 13, BAI 10, DSS 6, MEA 3 (razem 32).","ex":"Zapamiętaj ciąg 5-13-10-6-3. Ład (EDM) ma 5 procesów jak palce jednej ręki szefa, reszta to Zarządzanie: 32. Razem 37.\nCiąg liczb 5-13-10-6-3. Ład ma 5 (jak palce ręki), Zarządzanie 32; razem 37, czyli o trzy więcej niż 34 w COBIT 4.1.","org":""}},"fz-A-007":{"id":"fz-A-007","typ":"egzamin","s":"PR-01-01,PR-01-02","t":"Ile zasad i ile kategorii aktywatorów ma COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 90"],"r":null,"zap":"","scen":"","o":[{"t":"7 zasad i 5 kategorii aktywatorów","ok":false,"w":"Liczby są zamienione: zasad jest 5, kategorii aktywatorów 7."},{"t":"5 zasad i 5 kategorii aktywatorów","ok":false,"w":"Kategorii aktywatorów jest 7, nie 5."},{"t":"4 zasady i 7 kategorii aktywatorów","ok":false,"w":"Zasad jest 5, nie 4."},{"t":"5 zasad i 7 kategorii aktywatorów","ok":true,"w":"Tak podaje fiszka: 5 zasad, 7 kategorii aktywatorów."}],"fz":{"h":"Liczba zasad i aktywatorów","p":"P1","pulapka":false,"n":"EN: 5 principles, 7 enablers","q":"Ile zasad i ile kategorii aktywatorów ma COBIT 5?","a":"5 zasad i 7 kategorii aktywatorów.","ex":"5 zasad jak 5 palców jednej ręki, 7 aktywatorów jak 7 dni tygodnia. Zasady mówią, jak myśleć, aktywatory – czym działać.","org":""}},"fz-A-008":{"id":"fz-A-008","typ":"egzamin","s":"PR-01-01","t":"Pytanie egzaminacyjne odwołuje się do „Rysunku 8”. Gdzie znajdziesz go w polskim podręczniku COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 9"],"r":null,"zap":"","scen":"","o":[{"t":"To Ilustracja 9 – numeracja jest przesunięta o jeden","ok":false,"w":"Numery rysunków i ilustracji są te same."},{"t":"To Ilustracja 8 – zmienia się tylko słowo, numer zostaje","ok":true,"w":"Egzaminacyjny Rysunek N to podręcznikowa Ilustracja N."},{"t":"To Tabela 8 w załącznikach","ok":false,"w":"Rysunek N odpowiada Ilustracji N, nie tabeli w załącznikach."},{"t":"Polski podręcznik nie zawiera rysunków z egzaminu","ok":false,"w":"Zawiera je jako ilustracje o tych samych numerach."}],"fz":{"h":"Rysunek N = Ilustracja N","p":"P2","pulapka":true,"n":"EN: Figure N = Ilustracja N","q":"„Rysunek N” w pytaniu egzaminu – gdzie go znaleźć w podręczniku PL?","a":"To „Ilustracja N” w polskim podręczniku; numery są te same.","ex":"Tłumacz zmienił tylko słowo: egzaminacyjny „Rysunek 5” to podręcznikowa „Ilustracja 5”. Numer się zgadza, więc szukasz po numerze.","org":""}},"fz-A-009":{"id":"fz-A-009","typ":"egzamin","s":"PR-02-14","t":"Jak na egzaminie PL nazywa się Governance (w podręczniku: nadzór)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 91"],"r":null,"zap":"","scen":"","o":[{"t":"Zarządzanie","ok":false,"w":"Zarządzanie to Management, osobna dyscyplina według Zasady 5."},{"t":"Struktura ramowa","ok":false,"w":"Struktura ramowa to Framework."},{"t":"Aktywator","ok":false,"w":"Aktywator to Enabler."},{"t":"Ład","ok":true,"w":"Governance to na egzaminie Ład (podr. nadzór)."}],"fz":{"h":"Nazwy egzaminacyjne: Governance, Framework, Enabler, Enterprise","p":"P1","pulapka":true,"n":"EN: Governance, Framework, Enabler, Enterprise","q":"Governance, Framework, Enabler, Enterprise – nazwy egzaminacyjne?","a":"Ład (podr. nadzór), Struktura ramowa (podr. metodyka), Aktywator (podr. czynnik umożliwiający), Organizacja (podr. przedsiębiorstwo).","ex":"Ład = kto wyznacza kierunek (jak rada rodziców), Aktywator = coś, co umożliwia działanie, Organizacja = cała firma lub urząd. Na egzaminie używaj tych słów.","org":""}},"fz-A-010":{"id":"fz-A-010","typ":"egzamin","s":"PR-01-02","t":"Jak na egzaminie PL nazywa się Enabler (w podręczniku: czynnik umożliwiający)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 91"],"r":null,"zap":"","scen":"","o":[{"t":"Aktywator","ok":true,"w":"Enabler to na egzaminie Aktywator."},{"t":"Wyznacznik","ok":false,"w":"Wyznacznik to driver – czynnik wpływający na potrzeby interesariuszy."},{"t":"Organizacja","ok":false,"w":"Organizacja to Enterprise (podr. przedsiębiorstwo)."},{"t":"Struktura ramowa","ok":false,"w":"Struktura ramowa to Framework (podr. metodyka)."}],"fz":{"h":"Nazwy egzaminacyjne: Governance, Framework, Enabler, Enterprise","p":"P1","pulapka":true,"n":"EN: Governance, Framework, Enabler, Enterprise","q":"Governance, Framework, Enabler, Enterprise – nazwy egzaminacyjne?","a":"Ład (podr. nadzór), Struktura ramowa (podr. metodyka), Aktywator (podr. czynnik umożliwiający), Organizacja (podr. przedsiębiorstwo).","ex":"Ład = kto wyznacza kierunek (jak rada rodziców), Aktywator = coś, co umożliwia działanie, Organizacja = cała firma lub urząd. Na egzaminie używaj tych słów.","org":""}},"fz-A-011":{"id":"fz-A-011","typ":"egzamin","s":"PR-02-13","t":"Jak na egzaminie PL nazywają się lead i lag indicators?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 29"],"r":null,"zap":"","scen":"","o":[{"t":"Wskaźniki podstawowe i wspierające","ok":false,"w":"Podstawowe i wspierające to relacje P i S w macierzach mapowania."},{"t":"Wskaźniki wiodące i opóźnione","ok":true,"w":"To nazwy egzaminacyjne; podręcznik mówi: wyprzedzające i następujące."},{"t":"Wskaźniki wewnętrzne i kontekstowe","ok":false,"w":"Wewnętrzna i kontekstowa to kategorie jakości informacji."},{"t":"Wskaźniki zdolności i wydajności","ok":false,"w":"To nie są nazwy lead/lag indicators ani na egzaminie, ani w podręczniku."}],"fz":{"h":"Lead/lag indicators – nazwy","p":"P1","pulapka":true,"n":"EN: Lead / lag indicators","q":"Lead/lag indicators – nazwy na egzaminie i w podręczniku?","a":"Egzamin: wskaźniki wiodące / opóźnione. Podręcznik: wskaźniki wyprzedzające / następujące.","ex":"Wiodący to prognoza pogody (zapowiada, co będzie), opóźniony to deszczomierz po fakcie (pokazuje, co już spadło). Haczyk: wiodący idzie z przodu, opóźniony z tyłu.","org":""}},"fz-A-012":{"id":"fz-A-012","typ":"egzamin","s":"PR-01-04","t":"Co oznacza skrót PBRM opisujący obszar Zarządzania?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 32"],"r":null,"zap":"","scen":"","o":[{"t":"Oszacuj, Kieruj i Monitoruj","ok":false,"w":"To nazwa domeny Ładu EDM."},{"t":"Monitoruj, Oszacuj i Oceń","ok":false,"w":"To nazwa domeny MEA."},{"t":"Planuj, Twórz (Wytwarzaj), Wykonuj i Monitoruj","ok":true,"w":"PBRM = Plan, Build, Run, Monitor; na egzaminie oba warianty: Twórz lub Wytwarzaj."},{"t":"Twórz, Nabywaj i Wdrażaj","ok":false,"w":"To nazwa domeny BAI, a nie całego PBRM."}],"fz":{"h":"PBRM – nazwa egzaminacyjna","p":"P2","pulapka":true,"n":"EN: Plan, Build, Run and Monitor","q":"PBRM – jak brzmi na egzaminie PL?","a":"Dwa warianty – rozpoznawaj oba: Planuj, Wytwarzaj, Wykonuj i Monitoruj (zestawienie Altkom) oraz Planuj, Twórz, Wykonuj i Monitoruj (SP1). Podr.: Planowanie, Budowanie, Uruchamianie i Monitorowanie. Domena BAI: Twórz, Nabywaj i Wdrażaj.","ex":"Jak budowa domu: projekt (Planuj), budowa (Wytwarzaj/Twórz), mieszkanie w nim (Wykonuj), przeglądy (Monitoruj). Angielskie pierwsze litery: Plan, Build, Run, Monitor.","org":""}},"fz-A-013":{"id":"fz-A-013","typ":"egzamin","s":"PR-01-03,PR-01-04","t":"Nazwa której domeny zaczyna się od słowa „Oszacuj”?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 32"],"r":null,"zap":"","scen":"","o":[{"t":"MEA – Monitoruj, Oszacuj i Oceń","ok":false,"w":"W MEA „Oszacuj” stoi w środku, a nazwa zaczyna się od „Monitoruj”."},{"t":"BAI – Twórz, Nabywaj i Wdrażaj","ok":false,"w":"W nazwie BAI w ogóle nie ma „Oszacuj”."},{"t":"Obu: EDM i MEA","ok":false,"w":"Tylko EDM zaczyna się od „Oszacuj”; MEA zaczyna się od „Monitoruj”."},{"t":"EDM – Oszacuj, Kieruj i Monitoruj","ok":true,"w":"W EDM (Evaluate, Direct, Monitor) „Oszacuj” stoi na początku."}],"fz":{"h":"EDM i MEA – „Oszacuj”","p":"P2","pulapka":true,"n":"EN: Evaluate, Direct and Monitor vs Monitor, Evaluate and Assess","q":"EDM i MEA – gdzie stoi „Oszacuj”?","a":"EDM: Oszacuj, Kieruj i Monitoruj (na początku). MEA: Monitoruj, Oszacuj i Oceń (w środku).","ex":"Patrz na literę E (Evaluate = Oszacuj): w EDM stoi na początku, w MEA (Monitor-Evaluate-Assess) w środku.","org":""}},"fz-A-014":{"id":"fz-A-014","typ":"egzamin","s":"PC-01-03","t":"Co oznacza litera „P” na polskiej skali ocen atrybutu procesu (N/C/W/P)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 45"],"r":null,"zap":"","scen":"","o":[{"t":"Częściowy – tak jak Partially w wersji EN","ok":false,"w":"To pułapka: na skali PL częściowy to C, a P to Pełny."},{"t":"Pełny","ok":true,"w":"Na skali PL: N Nieosiągnięty, C Częściowy, W Większościowy, P Pełny."},{"t":"Większościowy","ok":false,"w":"Większościowy oznacza litera W."},{"t":"Nieosiągnięty","ok":false,"w":"Nieosiągnięty oznacza litera N."}],"fz":{"h":"Skala ocen PL a EN","p":"P1","pulapka":true,"n":"EN: N/P/L/F vs N/C/W/P","q":"Skala ocen: litery egzaminu PL a oryginalne EN?","a":"PL: N Nieosiągnięty, C Częściowy, W Większościowy, P Pełny. EN: N, P (Partially), L (Largely), F (Fully). „P” oznacza co innego!","ex":"Jak ocena, ile pracy domowej zrobiono: nic, częściowo, w większości, w pełni. Pułapka: polskie „P” to Pełny, angielskie „P” to Partially, czyli częściowo.","org":""}},"fz-A-015":{"id":"fz-A-015","typ":"egzamin","s":"PC-01-02","t":"Jak na egzaminie PL nazywa się atrybut PA 2.1 (w podręczniku: Zarządzanie sprawnością)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42"],"r":null,"zap":"","scen":"","o":[{"t":"Wykonanie procesu","ok":false,"w":"Wykonanie procesu to PA 1.1."},{"t":"Sprawność procesu","ok":false,"w":"Sprawność procesu to podręcznikowa nazwa PA 1.1."},{"t":"Przeznaczenie procesu","ok":false,"w":"Przeznaczenie procesu to process purpose, a nie atrybut procesu."},{"t":"Zarządzanie wydajnością","ok":true,"w":"PA 2.1 Performance management to na egzaminie Zarządzanie wydajnością."}],"fz":{"h":"PA 1.1 i PA 2.1 – nazwy","p":"P2","pulapka":true,"n":"EN: PA 1.1 Process performance; PA 2.1 Performance management","q":"PA 1.1 i PA 2.1 – nazwy egzaminacyjne i podręcznikowe?","a":"PA 1.1 Wykonanie procesu (podr. Sprawność procesu); PA 2.1 Zarządzanie wydajnością (podr. Zarządzanie sprawnością). Nie myl PA 2.1 z Zarządzaniem wydajnością aktywatora.","ex":"PA 1.1: czy proces w ogóle robi swoje, jak kuchnia, która wydaje dania. PA 2.1: czy tę pracę się planuje i pilnuje, jak grafik i kontrola czasu wydawania.","org":""}},"fz-A-016":{"id":"fz-A-016","typ":"egzamin","s":"PC-01-01,PC-01-04","t":"Jak na egzaminie PL nazywa się process capability (w podręczniku: potencjał procesu)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 43"],"r":null,"zap":"","scen":"","o":[{"t":"Zdolność procesu","ok":true,"w":"Process capability to zdolność procesu, a jej ocena to ocena zdolności procesu."},{"t":"Przeznaczenie procesu","ok":false,"w":"Przeznaczenie procesu to process purpose – po co proces istnieje."},{"t":"Wykonanie procesu","ok":false,"w":"Wykonanie procesu to nazwa atrybutu PA 1.1."},{"t":"Cel aktywatora","ok":false,"w":"Cel aktywatora to ostatni krok Kaskady Celów, nie zdolność procesu."}],"fz":{"h":"Process purpose i process capability – nazwy","p":"P2","pulapka":true,"n":"EN: Process purpose; process capability","q":"Process purpose i process capability – nazwy egzaminacyjne?","a":"Przeznaczenie procesu (podr. cel procesu); zdolność procesu, ocena zdolności procesu (podr. potencjał procesu).","ex":"Przeznaczenie procesu = po co on jest (kuchnia jest po to, by karmić). Zdolność procesu = jak dobrze to robi, na skali 0–5, jak stopnie w karate.","org":""}},"fz-A-017":{"id":"fz-A-017","typ":"egzamin","s":"IM-01-01","t":"Jak na egzaminie PL nazywa się change enablement (w podręczniku: umożliwienie zmian)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 37"],"r":null,"zap":"","scen":"","o":[{"t":"Mapa drogowa","ok":false,"w":"Mapa drogowa to road map (podr. plan działań)."},{"t":"Zdarzenie wyzwalające","ok":false,"w":"Zdarzenie wyzwalające to trigger event."},{"t":"Aktywowanie zmiany","ok":true,"w":"Change enablement to na egzaminie Aktywowanie zmiany."},{"t":"Punkt zapalny","ok":false,"w":"Punkt zapalny to osobne pojęcie (pain point), nie change enablement."}],"fz":{"h":"Change enablement, trigger events, road map – nazwy","p":"P2","pulapka":true,"n":"EN: Change enablement; trigger events; road map","q":"Change enablement, trigger events, road map – nazwy egzaminacyjne?","a":"Aktywowanie zmiany (podr. umożliwienie zmian), zdarzenia wyzwalające (podr. zdarzenia inicjujące), mapa drogowa (podr. plan działań).","ex":"Aktywowanie zmiany to przygotowanie ludzi, by chcieli zmiany; zdarzenie wyzwalające to iskra, która uruchamia wdrożenie; mapa drogowa to plan trasy krok po kroku.","org":""}},"fz-A-018":{"id":"fz-A-018","typ":"egzamin","s":"IM-02-02","t":"Jak na egzaminie PL nazywają się trigger events (w podręczniku: zdarzenia inicjujące)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 37"],"r":null,"zap":"","scen":"","o":[{"t":"Wyznaczniki interesariuszy","ok":false,"w":"Wyznaczniki to drivers – pierwszy krok Kaskady Celów."},{"t":"Zdarzenia wyzwalające","ok":true,"w":"Trigger events to na egzaminie zdarzenia wyzwalające – iskra uruchamiająca wdrożenie."},{"t":"Mapa drogowa","ok":false,"w":"Mapa drogowa to road map, czyli plan działań."},{"t":"Punkty zapalne","ok":false,"w":"Punkty zapalne to pain points – osobne pojęcie sylabusa."}],"fz":{"h":"Change enablement, trigger events, road map – nazwy","p":"P2","pulapka":true,"n":"EN: Change enablement; trigger events; road map","q":"Change enablement, trigger events, road map – nazwy egzaminacyjne?","a":"Aktywowanie zmiany (podr. umożliwienie zmian), zdarzenia wyzwalające (podr. zdarzenia inicjujące), mapa drogowa (podr. plan działań).","ex":"Aktywowanie zmiany to przygotowanie ludzi, by chcieli zmiany; zdarzenie wyzwalające to iskra, która uruchamia wdrożenie; mapa drogowa to plan trasy krok po kroku.","org":""}},"fz-A-019":{"id":"fz-A-019","typ":"egzamin","s":"EN-02-17","t":"Co oznacza „jakość wewnętrzna” informacji (EN: intrinsic quality, podr. jakość rzeczywista)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 29"],"r":null,"zap":"","scen":"","o":[{"t":"Jakość informacji używanej wyłącznie wewnątrz organizacji","ok":false,"w":"Pułapka: „wewnętrzna” znaczy „sama w sobie”, a nie „wewnątrz organizacji”."},{"t":"Jakość informacji ocenianej przez audyt wewnętrzny","ok":false,"w":"Nazwa nie ma związku z audytem wewnętrznym."},{"t":"Jakość informacji samej w sobie, np. czy jest prawdziwa, dokładna i wiarygodna","ok":true,"w":"Jakość wewnętrzna = jakość sama w sobie, niezależnie od tego, kto i gdzie używa informacji."},{"t":"Jakość informacji w systemach wewnętrznych działu IT","ok":false,"w":"Nie chodzi o miejsce przechowywania, lecz o jakość samej informacji."}],"fz":{"h":"Intrinsic quality – nazwa","p":"P2","pulapka":true,"n":"EN: Intrinsic quality","q":"Intrinsic quality – jak na egzaminie, a jak w podręczniku?","a":"Egzamin: jakość wewnętrzna (= sama w sobie, nie „wewnątrz organizacji”). Podręcznik: jakość rzeczywista.","ex":"Jakość „sama w sobie”, jak świeżość jabłka: czy informacja jest prawdziwa, dokładna i wiarygodna, niezależnie od tego, kto i gdzie jej używa.","org":""}},"fz-A-020":{"id":"fz-A-020","typ":"egzamin","s":"PR-02-09","t":"Jak na egzaminie PL nazywa się governing body (w podręczniku: organ nadzorujący)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 24"],"r":null,"zap":"","scen":"","o":[{"t":"Role operacyjne","ok":false,"w":"Role operacyjne to operations and execution."},{"t":"Kierownictwo","ok":false,"w":"Kierownictwo to management – dostaje kierunek od organu Ładu."},{"t":"Interesariusze","ok":false,"w":"Interesariusze (owners and stakeholders) delegują uprawnienia do organu Ładu."},{"t":"Organ Ładu","ok":true,"w":"Governing body to na egzaminie Organ Ładu."}],"fz":{"h":"Governing body i Operations and execution – nazwy","p":"P2","pulapka":true,"n":"EN: Governing body; operations and execution","q":"Governing body i Operations and execution – nazwy egzaminacyjne?","a":"Organ Ładu (podr. organ nadzorujący) i Role operacyjne (podr. eksploatacja i wykonanie).","ex":"Organ Ładu to np. zarząd lub rada, która wyznacza kierunek, jak właściciel restauracji. Role operacyjne wykonują codzienną pracę, jak kucharze i kelnerzy.","org":""}},"fz-A-021":{"id":"fz-A-021","typ":"egzamin","s":"PR-02-08","t":"Czym są Aktywatory Ładu (w podręczniku: czynniki umożliwiające nadzór)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 24","FW-PL s. 91"],"r":null,"zap":"","scen":"","o":[{"t":"Procesami domeny EDM w Referencyjnym Modelu Procesu","ok":false,"w":"EDM to domena procesów Ładu; aktywatory Ładu obejmują znacznie więcej niż procesy."},{"t":"Czynnikami, które wpływają na potrzeby interesariuszy","ok":false,"w":"To definicja wyznaczników w Kaskadzie Celów."},{"t":"Materialnymi i niematerialnymi zasobami wspierającymi skuteczny Ład, np. zasadami, strukturami, procesami, ludźmi i informacjami","ok":true,"w":"Tak opisuje je fiszka; ich brak osłabia tworzenie wartości."},{"t":"Właścicielami i interesariuszami, którzy delegują uprawnienia organowi Ładu","ok":false,"w":"To opis ról z Rysunku 9, nie aktywatorów Ładu."}],"fz":{"h":"Aktywatory Ładu","p":"P2","pulapka":false,"n":"≠ TŁUMACZENIE · egzamin: aktywatory Ładu · podr.: czynniki umożliwiające nadzór · EN: governance enablers · EN: Governance enablers","q":"Czym są aktywatory Ładu? / Czym są Aktywatory Ładu?","a":"Materialne i niematerialne zasoby wspierające skuteczny Ład: struktury ramowe, zasady, struktury organizacyjne, procesy i praktyki, a także zdolność usługowa, ludzie i informacje.\nZasobami organizacyjnymi Ładu (struktury ramowe, zasady, struktury, procesy, praktyki) oraz zasobami organizacji (zdolność usługowa, ludzie, informacje). Ich brak osłabia tworzenie wartości.","ex":"Jak w szkole: statut, regulaminy, rada pedagogiczna i procedury to narzędzia, którymi dyrekcja kieruje szkołą i sprawdza, czy wszystko idzie dobrze.\nW domu to regulamin, domowe ustalenia i zwyczaje, ale też sprzęt, domownicy i wiedza. Bez nich dom nie przynosi tego, czego się od niego oczekuje.","org":"polityka obsługi zgłoszeń, komitet sterujący."}},"fz-A-022":{"id":"fz-A-022","typ":"egzamin","s":"PR-01-01","t":"Która z poniższych NIE jest jedną z pięciu zasad COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 13","FW-PL s. 14"],"r":null,"zap":"","scen":"","o":[{"t":"Realizacja potrzeb interesariusza","ok":false,"w":"To Zasada 1."},{"t":"Aktywacja holistycznego podejścia","ok":false,"w":"To Zasada 4."},{"t":"Ograniczenie Ładu do działu IT","ok":true,"w":"Takiej zasady nie ma; Zasada 2 mówi wręcz o pokryciu całej organizacji."},{"t":"Oddzielenie Ładu od Zarządzania","ok":false,"w":"To Zasada 5."}],"fz":{"h":"Pięć zasad","p":"P1","pulapka":false,"n":"egzamin: 5 zasad · podr.: 5 zasad · EN: 5 principles · EN: Meeting Stakeholder Needs; Covering the Enterprise End-to-End; Applying a Single Integrated Framework; Enabling a Holistic Approach; Separating Governance From Management","q":"Wymień pięć zasad COBIT 5. / Podaj pięć zasad COBIT 5 (nazwy egzaminacyjne).","a":"1 Realizacja potrzeb interesariusza; 2 Pokrycie całej organizacji; 3 Zastosowanie pojedynczej zintegrowanej struktury ramowej; 4 Aktywacja holistycznego podejścia; 5 Oddzielenie Ładu od Zarządzania.\n1. Realizacja potrzeb interesariusza. 2. Pokrycie całej organizacji. 3. Zastosowanie Pojedynczej Zintegrowanej Struktury Ramowej. 4. Aktywacja holistycznego podejścia. 5. Oddzielenie Ładu od Zarządzania.","ex":"Jak w restauracji: 1 gość i jego potrzeby, 2 cały lokal, 3 jedna książka przepisów, 4 wszystko naraz (kuchnia, ludzie, sprzęt), 5 właściciel to nie kierownik zmiany.\nPierwsze słowa: Realizacja, Pokrycie, Zastosowanie, Aktywacja, Oddzielenie – R-P-Z-A-O: „Rano Pies Zjada Ananasa Ochoczo”.","org":""}},"fz-A-023":{"id":"fz-A-023","typ":"egzamin","s":"PR-01-01","t":"Która zasada COBIT 5 mówi o tworzeniu wartości dla interesariuszy i o przekładaniu ich potrzeb na cele Kaskadą Celów?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 14","FW-PL s. 17"],"r":null,"zap":"","scen":"","o":[{"t":"Zasada 1: Realizacja potrzeb interesariusza","ok":true,"w":"Zasada 1 to tworzenie wartości przez równowagę korzyści, ryzyka i zasobów oraz Kaskada Celów."},{"t":"Zasada 2: Pokrycie całej organizacji","ok":false,"w":"Zasada 2 mówi, że Ład IT obejmuje całą organizację."},{"t":"Zasada 4: Aktywacja holistycznego podejścia","ok":false,"w":"Zasada 4 dotyczy 7 współzależnych kategorii aktywatorów."},{"t":"Zasada 5: Oddzielenie Ładu od Zarządzania","ok":false,"w":"Zasada 5 rozdziela działania, struktury i cele Ładu oraz Zarządzania."}],"fz":{"h":"Zasada 1: Realizacja potrzeb interesariusza","p":"P1","pulapka":false,"n":"≠ TŁUMACZENIE · egzamin: Realizacja potrzeb interesariusza · podr.: Spełnienie potrzeb interesariuszy · EN: Principle 1: Meeting Stakeholder Needs","q":"O co chodzi w Zasadzie 1? / Co mówi Zasada 1: Realizacja potrzeb interesariusza?","a":"Tworzenie wartości dla interesariuszy przez równowagę korzyści, ryzyka i zasobów; potrzeby przekłada się na cele kaskadą celów.\nOrganizacja istnieje, by tworzyć wartość dla interesariuszy: równoważyć korzyści, ryzyko i zasoby. Kaskada Celów przekłada potrzeby na cele organizacji, cele IT i cele aktywatorów.","ex":"Restauracja istnieje dla gości i właścicieli: ma dawać korzyść, nie ryzykować za dużo i nie marnować produktów. Ich życzenia rozpisuje się w dół na konkretne cele.\nJak rodzinny budżet: najpierw życzenie rodziny („suchy dom”), potem cel („nowy dach”), potem zadania dla wykonawców. To rozpisywanie w dół to Kaskada Celów.","org":"potrzeba „usługi bez przerw” → cel organizacji CO7."}},"fz-A-024":{"id":"fz-A-024","typ":"egzamin","s":"PR-01-01","t":"Jak Zasada 2 (Pokrycie całej organizacji) traktuje informację i technologię?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 14","FW-PL s. 23"],"r":null,"zap":"","scen":"","o":[{"t":"Jako sprawę wyłącznie działu IT","ok":false,"w":"Zasada 2 obejmuje wszystkie funkcje i procesy organizacji, nie tylko dział IT."},{"t":"Jak każdy inny zasób (aktywo) organizacji – we wszystkich funkcjach i procesach","ok":true,"w":"Informację i technologię traktuje się jak inne aktywa, a aktywatory są ogólnofirmowe."},{"t":"Jako zasób ważniejszy od innych, zarządzany zupełnie osobno","ok":false,"w":"Według Zasady 2 informacja i technologia to aktywa jak każde inne."},{"t":"Jako temat wyłącznie dla usług IT dostarczanych wewnętrznie","ok":false,"w":"Zasada 2 obejmuje także zewnętrzne usługi IT."}],"fz":{"h":"Zasada 2: Pokrycie całej organizacji","p":"P1","pulapka":false,"n":"≠ TŁUMACZENIE · egzamin: Pokrycie całej organizacji · podr.: Uwzględnienie wszystkich aspektów działania przedsiębiorstwa · EN: Principle 2: Covering the Enterprise End-to-End","q":"O co chodzi w Zasadzie 2? / Co mówi Zasada 2: Pokrycie całej organizacji?","a":"Ład IT jest częścią Ładu całej organizacji; obejmuje wszystkie funkcje i procesy, a informację i technologię traktuje jak każdy inny zasób.\nŁad IT jest częścią ładu korporacyjnego. Obejmuje wszystkie funkcje i procesy, wewnętrzne i zewnętrzne usługi IT; informacje i technologię traktuje jak inne aktywa. Aktywatory są ogólnofirmowe.","ex":"IT to nie osobna wyspa: jak prąd w domu dotyczy każdego pokoju, tak informatyka dotyczy każdego działu. Informacja to taki sam majątek jak budynki.\nWydatki na internet to część budżetu całego domu, nie osobna kasa. Tak samo Ład IT dotyczy każdego działu i usług zamawianych z zewnątrz.","org":"zmiana obejmuje komendy, nie tylko komórkę IT."}},"fz-A-025":{"id":"fz-A-025","typ":"egzamin","s":"PR-01-01,PR-02-10","t":"O co chodzi w Zasadzie 3: Zastosowanie pojedynczej zintegrowanej struktury ramowej?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 14","FW-PL s. 25"],"r":null,"zap":"","scen":"","o":[{"t":"Organizacja może stosować tylko jedną strukturę ramową, więc rezygnuje z ITIL i ISO","ok":false,"w":"COBIT 5 nie wyklucza innych standardów, tylko je integruje."},{"t":"Ład i Zarządzanie łączy się w jedną strukturę organizacyjną","ok":false,"w":"To przeczy Zasadzie 5, według której Ład i Zarządzanie wymagają różnych struktur."},{"t":"Wszystkie procesy przypisuje się do jednej domeny","ok":false,"w":"Procesy są w 5 domenach; Zasada 3 dotyczy integracji z innymi standardami."},{"t":"COBIT 5 jest spójny z innymi standardami (np. ITIL, TOGAF, ISO) i może być nadrzędną strukturą, która je integruje","ok":true,"w":"To sedno Zasady 3: COBIT 5 jako parasol nad innymi standardami."}],"fz":{"h":"Zasada 3: Pojedyncza zintegrowana struktura ramowa","p":"P1","pulapka":false,"n":"≠ TŁUMACZENIE · egzamin: Zastosowanie pojedynczej zintegrowanej struktury ramowej · podr.: Stosowanie jednej zintegrowanej metodyki · EN: Principle 3: Applying a Single Integrated Framework","q":"O co chodzi w Zasadzie 3? / Co mówi Zasada 3: Zastosowanie Pojedynczej Zintegrowanej Struktury Ramowej?","a":"COBIT 5 łączy się z innymi standardami i strukturami (np. ITIL, TOGAF, ISO) i może służyć jako nadrzędna rama.\nCOBIT 5 jest spójny z innymi standardami i strukturami ramowymi, więc może być nadrzędną strukturą Ładu i Zarządzania IT, integrującą pozostałe.","ex":"COBIT to parasol, pod którym mieszczą się inne poradniki (ITIL, TOGAF, ISO). Nie wyrzucasz ich, tylko chowasz pod jeden wspólny parasol.\nJak szafa z szufladami: COBIT 5 to główna szafa, a ITIL, ISO czy TOGAF to szuflady, które do niej pasują i razem tworzą jeden mebel.","org":"procedury KSC i normy bezpieczeństwa włączone do jednej ramy."}},"fz-A-026":{"id":"fz-A-026","typ":"egzamin","s":"PR-01-01,PR-01-02","t":"Czego wymaga Zasada 4: Aktywacja holistycznego podejścia?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 14","FW-PL s. 27"],"r":null,"zap":"","scen":"","o":[{"t":"Uwzględnienia 7 współzależnych kategorii aktywatorów, a nie samych procesów","ok":true,"w":"Zasada 4 każe patrzeć na całość: 7 kategorii aktywatorów wpływa na siebie nawzajem."},{"t":"Usprawniania wyłącznie procesów, bo to one decydują o Ładzie","ok":false,"w":"Same procesy nie wystarczą – potrzebne są wszystkie aktywatory."},{"t":"Wdrożenia wszystkich 37 procesów naraz w ściśle ustalonej kolejności","ok":false,"w":"Kolejność usprawnień wybiera organizacja."},{"t":"Oddzielenia Ładu od Zarządzania","ok":false,"w":"To treść Zasady 5, nie Zasady 4."}],"fz":{"h":"Zasada 4: Holistyczne podejście","p":"P1","pulapka":false,"n":"≠ TŁUMACZENIE · egzamin: Aktywacja holistycznego podejścia · podr.: Wdrożenie podejścia całościowego · EN: Principle 4: Enabling a Holistic Approach","q":"O co chodzi w Zasadzie 4? / Co mówi Zasada 4: Aktywacja holistycznego podejścia?","a":"Ład i Zarządzanie wymagają 7 współzależnych kategorii aktywatorów, a nie samych procesów.\nDobry Ład i Zarządzanie wymagają patrzenia na całość, bo wiele elementów wpływa na siebie nawzajem. COBIT 5 wyróżnia 7 kategorii aktywatorów tworzących ten system.","ex":"Samochód nie pojedzie na samym silniku: potrzebuje kół, paliwa, kierowcy i przepisów. Tak samo procesy nie wystarczą – trzeba uwzględnić wszystkie 7 aktywatorów i ich zależności; kolejność usprawnień wybiera organizacja.\nJak przyjęcie urodzinowe: liczą się goście, jedzenie, miejsce, muzyka i plan naraz – brak jednego psuje całość. COBIT 5 wyróżnia 7 takich składników.","org":"procedura + dyżur + rejestr + szkolenia jednocześnie."}},"fz-A-027":{"id":"fz-A-027","typ":"egzamin","s":"PR-01-01,PR-02-14","t":"Jak Zasada 5 rozdziela działania Ładu i Zarządzania?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 14","FW-PL s. 31"],"r":null,"zap":"","scen":"","o":[{"t":"Ład planuje, tworzy, wykonuje i monitoruje; Zarządzanie ocenia, kieruje i monitoruje","ok":false,"w":"Role są tu zamienione: to Ład ocenia, kieruje i monitoruje."},{"t":"Ład zajmuje się tylko monitorowaniem, a Zarządzanie wszystkimi pozostałymi działaniami","ok":false,"w":"Ład także ocenia i kieruje, a Zarządzanie również monitoruje."},{"t":"Ład (EDM) ocenia, kieruje i monitoruje; Zarządzanie (PBRM) planuje, tworzy, wykonuje i monitoruje","ok":true,"w":"Tak rozdziela je Zasada 5: różne działania, struktury i cele."},{"t":"Ład i Zarządzanie wykonują te same działania, różnią się tylko szczeblem","ok":false,"w":"Według Zasady 5 to różne dyscypliny z innymi działaniami."}],"fz":{"h":"Zasada 5: Oddzielenie Ładu od Zarządzania","p":"P1","pulapka":true,"n":"≠ TŁUMACZENIE · egzamin: Oddzielenie Ładu od Zarządzania · podr.: Oddzielenie nadzoru od zarządzania · EN: Principle 5: Separating Governance From Management","q":"O co chodzi w Zasadzie 5? / Co mówi Zasada 5: Oddzielenie Ładu od Zarządzania?","a":"Ład (EDM) ocenia, kieruje i monitoruje; Zarządzanie (PBRM) planuje, tworzy, wykonuje i monitoruje. To różne działania, struktury i cele.\nŁad i Zarządzanie to różne dyscypliny: obejmują inne działania, wymagają innych struktur organizacyjnych i służą innym celom.","ex":"Właściciel restauracji ocenia, decyduje i sprawdza (Ład); kierownik kuchni planuje, przygotowuje, gotuje i pilnuje (Zarządzanie). Jeden mówi „co”, drugi robi „jak”.\nW szkole dyrektor ustala kierunek i rozlicza (Ład), a nauczyciele prowadzą lekcje (Zarządzanie). Inne zadania, inne gremia, inne cele.","org":"kierownictwo zatwierdza progi ryzyka; dyrektor IT wdraża procedurę."}},"fz-A-028":{"id":"fz-A-028","typ":"egzamin","s":"PR-02-08","t":"Który z poniższych jest jednym z czterech kluczowych komponentów Podejścia do Ładu (Rysunek 8)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 23"],"r":null,"zap":"","scen":"","o":[{"t":"Kaskada Celów","ok":false,"w":"Kaskada Celów to mechanizm Zasady 1, nie komponent z Rysunku 8."},{"t":"Zakres Ładu","ok":true,"w":"Komponenty to: Cel Ładu, Aktywatory Ładu, Zakres Ładu oraz Role, działania i relacje."},{"t":"Referencyjny Model Procesu","ok":false,"w":"Referencyjny Model Procesu to katalog 37 procesów, nie komponent Podejścia do Ładu."},{"t":"Zrównoważona karta wyników (BSC)","ok":false,"w":"BSC grupuje cele organizacji i cele IT; nie jest komponentem z Rysunku 8."}],"fz":{"h":"Komponenty Podejścia do Ładu","p":"P1","pulapka":false,"n":"EN: Governance objective, governance enablers, governance scope, roles/activities/relationships","q":"Jakie są kluczowe komponenty Podejścia do Ładu (Rysunek 8)?","a":"1. Cel Ładu (Tworzenie Wartości). 2. Aktywatory Ładu. 3. Zakres Ładu. 4. Role, działania i relacje.","ex":"Cztery pytania jak przed remontem: po co (wartość), czym to zrobimy (aktywatory), co remontujemy (zakres), kto co robi (role).","org":""}},"fz-A-029":{"id":"fz-A-029","typ":"egzamin","s":"PR-02-09","t":"Co definiuje komponent Ładu „Role, działania i relacje”?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 24"],"r":null,"zap":"","scen":"","o":[{"t":"Czego dotyczy system Ładu: całej organizacji, jednostki czy zasobu","ok":false,"w":"To definicja Zakresu Ładu."},{"t":"Jak Ład równoważy korzyści, ryzyko i zasoby","ok":false,"w":"To Cel Ładu, czyli Tworzenie wartości."},{"t":"Jakie zasoby wspierają skuteczny Ład","ok":false,"w":"To Aktywatory Ładu."},{"t":"Kto uczestniczy w Ładzie, jak jest zaangażowany, co robi i jak współdziała z innymi","ok":true,"w":"Tak definiuje ten komponent fiszka."}],"fz":{"h":"Role, działania i relacje – definicja","p":"P2","pulapka":false,"n":"EN: Roles, activities and relationships","q":"Co definiuje komponent Role, działania i relacje?","a":"Kto uczestniczy w Ładzie, jak jest zaangażowany, co robi i jak współdziała z innymi w systemie Ładu.","ex":"Odpowiada na pytania: kto bierze udział, co robi i z kim współpracuje – jak grafik dyżurów w straży z podziałem zadań.","org":""}},"fz-A-030":{"id":"fz-A-030","typ":"egzamin","s":"PR-02-09","t":"Co robi organ Ładu w relacjach ról z Rysunku 9?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 24"],"r":null,"zap":"","scen":"","o":[{"t":"Wyznacza kierunek kierownictwu i je monitoruje, a rozlicza się przed właścicielami i interesariuszami","ok":true,"w":"Tak przebiega relacja: interesariusze delegują, organ Ładu wyznacza kierunek i monitoruje."},{"t":"Instruuje i dopasowuje role operacyjne","ok":false,"w":"To zadanie kierownictwa, nie organu Ładu."},{"t":"Raportuje kierownictwu o wykonaniu codziennych zadań","ok":false,"w":"Kierownictwu raportują role operacyjne."},{"t":"Deleguje uprawnienia właścicielom i interesariuszom","ok":false,"w":"Kierunek jest odwrotny: to interesariusze delegują do organu Ładu."}],"fz":{"h":"Role, działania i relacje","p":"P2","pulapka":false,"n":"egzamin: role, działania i relacje · podr.: role, działania i relacje · EN: roles, activities and relationships · EN: Owners and stakeholders – delegate/accountable; governing body – set direction/monitor; management – instruct and align/report; operations and execution","q":"Jak przebiegają role i relacje w Ładzie? / Opisz relacje ról z Rysunku 9.","a":"Właściciele i interesariusze delegują do organu Ładu; organ Ładu wyznacza kierunek kierownictwu; kierownictwo instruuje i dostosowuje operacje; informacje płyną z powrotem w górę.\nInteresariusze delegują → Organ Ładu (rozlicza się przed nimi) wyznacza kierunek → Kierownictwo (monitorowane przez Organ Ładu) instruuje i dopasowuje → Role operacyjne (raportują Kierownictwu).","ex":"Jak w restauracji: właściciele powołują radę, ta wyznacza kierunek kierownikowi, kierownik ustawia pracę kuchni, a raporty płyną z kuchni z powrotem w górę.\nJak w spółdzielni: mieszkańcy wybierają radę i dają jej władzę, rada wyznacza kierunek prezesowi, prezes kieruje pracownikami, a ci raportują w górę.","org":"kierownictwo KG → dyrektor IT → zespół dyżurny."}},"fz-A-031":{"id":"fz-A-031","typ":"egzamin","s":"PR-02-08","t":"Czego może dotyczyć Zakres Ładu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 24"],"r":null,"zap":"","scen":"","o":[{"t":"Wyłącznie całej organizacji – węższego zakresu nie przewiduje się","ok":false,"w":"Zakres COBIT 5 to domyślnie organizacja, ale Ład może dotyczyć też jednostki lub zasobu."},{"t":"Wyłącznie działu IT","ok":false,"w":"Zakres nie jest ograniczony do działu IT."},{"t":"Całej organizacji, jednostki, a nawet pojedynczego zasobu – zakres trzeba jasno określić","ok":true,"w":"Tak podaje fiszka: zakres może być różny, ale musi być jasno określony."},{"t":"Wyłącznie zasobów materialnych, np. sprzętu","ok":false,"w":"Zakres może obejmować aktywa materialne i niematerialne."}],"fz":{"h":"Zakres Ładu","p":"P2","pulapka":false,"n":"≠ TŁUMACZENIE · egzamin: zakres Ładu · podr.: zakres nadzoru · EN: governance scope · EN: Governance scope","q":"Czego może dotyczyć Ład? / Czym jest Zakres Ładu?","a":"Całej organizacji, jednostki, a nawet pojedynczego zasobu; zakres trzeba jasno określić.\nOkreśleniem, czego dotyczy system Ładu: całej organizacji, jednostki, aktywów materialnych lub niematerialnych. Zakres COBIT 5 to organizacja.","ex":"Ład można ustawić dla całej sieci sklepów, jednego sklepu albo nawet jednej kasy. Najpierw trzeba jasno powiedzieć, czego dotyczy.\nJak przy s
