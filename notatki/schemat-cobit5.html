<!--PYTANIA-START--><script>/* Bank pytań: 469 własnych (252 z fiszek, 217 autorskich) tutaj + 74 oryginały 1:1 w sp1.local.js (50 SP1, 20 Altkom, 4 znaleziska); łącznie 543. plan.pulapki: opisy pułapek egzaminacyjnych (id → opis). Każde pytanie ma pole cyt (strona i dosłowny cytat FW-PL). Bez dubli SP1/Altkom i bez pewnych dubli własnych. */window.PYTANIA={"Q":{"q-pc-en1-007":{"id":"q-pc-en1-007","typ":"egzamin","s":"EN-01-01","t":"Co NIE jest elementem definicji procesu w COBIT 5?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 69","FW-PL s. 75"],"r":"B","zap":"Definicja procesu: praktyki + polityki/procedury + wejścia + wyniki.","scen":"","o":[{"t":"Podejmowanie decyzji w granicach zakresu kontroli","ok":true,"w":"Zakres kontroli to dobra praktyka Struktur organizacyjnych (s. 75), a nie element definicji procesu (s. 69)."},{"t":"Przetwarzanie wejść z różnych źródeł","ok":false,"w":"To element definicji: proces przetwarza dane wejściowe (s. 69)."},{"t":"Dostarczanie wyników, np. produktów i usług","ok":false,"w":"To element definicji (s. 69)."},{"t":"Ukierunkowanie przez polityki i procedury","ok":false,"w":"To element definicji (s. 69)."}],"cyt":{"s":"69","t":"zbiór praktyk ukierunkowanych przez polityki i procedury przedsiębiorstwa, które wykorzystują dane wejściowe z różnych źródeł (również z innych procesów), przetwarzają je i dostarczają wyniki (np. produkty, usługi)","w":"ZGODNE","u":"Zakres kontroli to dobra praktyka Struktur organizacyjnych (s. 75), nie element definicji procesu."}},"q-pc-en1-011":{"id":"q-pc-en1-011","typ":"egzamin","s":"EN-01-01","t":"Co według słownika COBIT 5 powinien mieć każdy proces?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 93"],"r":null,"zap":"Proces: uzasadnienie biznesowe, właściciel (A), jasne role, mierniki.","scen":"","o":[{"t":"Osobną politykę dla każdej swojej praktyki","ok":false,"w":"Słownik nie wymaga polityki dla każdej praktyki (s. 93)."},{"t":"Własną strukturę organizacyjną i odrębny budżet","ok":false,"w":"Słownik nie wymaga osobnej struktury ani budżetu dla procesu (s. 93)."},{"t":"Odpowiedzialnego decyzyjnie właściciela i mierniki wydajności","ok":true,"w":"Uwaga do definicji: jasne przesłanki biznesowe, rozliczani właściciele, jasne role i środki pomiaru sprawności (s. 93)."},{"t":"Certyfikat zgodności z normą ISO/IEC 15504","ok":false,"w":"ISO/IEC 15504 to podstawa oceny zdolności, nie wymóg certyfikatu (s. 70, 93)."}],"cyt":{"s":"93","t":"określa się rozliczanych właścicieli, jasne role i zakresy odpowiedzialności związane z realizacją procesu oraz środki pomiaru sprawności","w":"ZGODNE","u":"Terminologia: rozliczany = odpowiedzialny decyzyjnie (A), sprawność = wydajność."}},"q-pc-en1-017":{"id":"q-pc-en1-017","typ":"egzamin","s":"EN-02-01","t":"Która cecha NIE jest wymaganiem wobec dobrych struktur ramowych?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 67"],"r":"B","zap":"Struktury ramowe powinny być kompleksowe, otwarte i elastyczne, aktualne oraz dostępne dla wszystkich interesariuszy. Ograniczona liczba jest kryterium zasad.","scen":"","o":[{"t":"Dostępność dla interesariuszy","ok":false,"w":"Dostępność dla wszystkich interesariuszy to wymóg wobec struktur ramowych (s. 67)."},{"t":"Kompleksowość","ok":false,"w":"Kompleksowość, czyli objęcie wszystkich wymaganych obszarów, to wymóg wobec struktur ramowych (s. 67)."},{"t":"Ograniczona liczba","ok":true,"w":"Ograniczona liczba to kryterium ZASAD, nie struktur ramowych (s. 67)."},{"t":"Aktualność","ok":false,"w":"Aktualność, czyli odzwierciedlenie obecnych celów Ładu, to wymóg wobec struktur ramowych (s. 67)."}],"przyklad":"Firma dopasowuje strukturę ramową do swojej wielkości i przepisów, aktualizuje ją po zmianie strategii oraz udostępnia pracownikom potrzebne wytyczne. To ilustruje elastyczność, aktualność i dostępność.","cyt":{"s":"67","t":"ich liczba musi być ograniczona;","w":"ZGODNE","u":"To kryterium zasad; metodyki (struktury ramowe) mają być kompleksowe, otwarte i elastyczne, aktualne, dostępne (s. 67)."}},"q-pc-en1-024":{"id":"q-pc-en1-024","typ":"egzamin","s":"EN-02-01","t":"Uzupełnij brakujące słowo: „Struktury ramowe powinny być [?], czyli obejmować wszystkie wymagane obszary”.","k":false,"st":"autorskie","src":"","z":["FW-PL s. 67"],"r":null,"zap":"Kompleksowa struktura ramowa obejmuje wszystkie wymagane obszary.","scen":"","o":[{"t":"kompleksowe","ok":true,"w":"Metodyki powinny być kompleksowe – obejmować wszystkie wymagane obszary (s. 67)."},{"t":"aktualne","ok":false,"w":"Aktualne = odzwierciedlające obecne ukierunkowanie i cele; to inna cecha (s. 67)."},{"t":"dostępne","ok":false,"w":"Dostępne = dla wszystkich interesariuszy; to inna cecha (s. 67)."},{"t":"nieinwazyjne","ok":false,"w":"To cecha dobrej polityki, nie struktury ramowej (s. 67)."}],"cyt":{"s":"67","t":"kompleksowe, powinny obejmować wszystkie wymagane obszary;","w":"ZGODNE","u":"Terminologia: struktury ramowe = metodyki."}},"q-pc-en1-h01":{"id":"q-pc-en1-h01","typ":"egzamin","s":"EN-02-01","t":"Jak COBIT 5 układa względem siebie strukturę ramową, zasady i polityki?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 67","FW-PL s. 68"],"r":null,"zap":"Struktura ramowa = w polskim podręczniku FW-PL „metodyka” (ang. framework); to ta sama rzecz. Hierarchia: struktura ramowa (szkielet całości) → zasady (wartości) → polityki (jak stosować zasady) → praktyki i działania procesów (realizacja polityk).","scen":"","o":[{"t":"Hierarchicznie: zasady streszczają polityki","ok":false,"w":"Odwrotnie: polityki zawierają bardziej szczegółowe wytyczne, jak stosować zasady w praktyce. To zasady są wyżej (FW-PL s. 67)."},{"t":"Hierarchicznie: polityki uszczegóławiają zasady","ok":true,"w":"Struktura ramowa tworzy hierarchiczną całość: na górze są nieliczne zasady, a polityki je uszczegóławiają i każda wyraźnie odnosi się do zasad. Zasady wyrażają wartości, a polityki mówią, jak je stosować (FW-PL s. 67–68)."},{"t":"Równorzędnie: bez wzajemnych odniesień","ok":false,"w":"COBIT 5 opisuje strukturę hierarchiczną: każda polityka ma w niej swoje miejsce i wyraźnie odnosi się do zasad (FW-PL s. 68)."},{"t":"Struktura ramowa to jedna z polityk","ok":false,"w":"Struktura ramowa to szkielet, w którym tworzy się i utrzymuje spójny zbiór polityk. Nie jest pojedynczą polityką (FW-PL s. 68)."}],"przyklad":"Kodeks drogowy jako całość to struktura ramowa. Zasada: „bezpieczeństwo uczestników ruchu jest najważniejsze”. Polityka: „w terenie zabudowanym jedziesz maksymalnie 50 km/h”. HACZYK: polityka, która nie wynika z żadnej zasady, „wisi w powietrzu” i budzi opór.","cyt":{"s":"68","t":"polityki powinny być częścią ogólnej metodyki nadzoru i zarządzania, stanowiącej (hierarchiczną) strukturę, w której każda z polityk powinna mieć swoje miejsce oraz wyraźnie odnosić się do podstawowych zasad","w":"ZGODNE","u":"„Zasady na górze, polityki je uszczegóławiają” to synteza s. 67–68 (polityki = szczegółowe wytyczne stosowania zasad)."}},"q-pc-en1-h02":{"id":"q-pc-en1-h02","typ":"egzamin","s":"EN-02-02","t":"Jak COBIT 5 klasyfikuje kolejno: wyrażoną wartość, konkretną regułę postępowania i uporządkowany spis polityk?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 67","FW-PL s. 68"],"r":null,"zap":"Wartość = zasada; konkretna reguła = polityka; porządek wszystkich polityk (zakres, konsekwencje, wyjątki, kontrola) = struktura ramowa.","scen":"","o":[{"t":"Polityka, zasada, struktura ramowa","ok":false,"w":"Zamieniono poziomy: krótkie zdanie o wartości to zasada, a konkretna reguła postępowania to polityka (FW-PL s. 67)."},{"t":"Zasada, struktura ramowa, polityka","ok":false,"w":"Pojedyncza reguła postępowania to polityka. Spis polityk z zakresem, konsekwencjami i wyjątkami to struktura, w której polityki mają swoje miejsce (FW-PL s. 68)."},{"t":"Struktura ramowa, polityka, zasada","ok":false,"w":"Zasada to krótkie zdanie o wartościach, a nie zbiór wszystkich polityk. Uporządkowany spis polityk to struktura ramowa (FW-PL s. 67–68)."},{"t":"Zasada, polityka, struktura ramowa","ok":true,"w":"Krótko wyrażona wartość to zasada. Konkretna reguła, jak postępować, to polityka. Spis porządkujący polityki z zakresem, konsekwencjami nieprzestrzegania, obsługą wyjątków i kontrolą zgodności to struktura polityk (FW-PL s. 67–68)."}],"przyklad":"Sytuacja: Komenda straży pożarnej spisała trzy dokumenty: (1) „Dane o zgłoszeniach chronimy tak samo starannie jak sprzęt ratowniczy” – zasada; (2) „Dostęp do systemu zgłoszeń nadaje kierownik zmiany, a wyjątki zatwierdza komendant” – polityka; (3) spis wszystkich polityk z ich zakresem, konsekwencjami naruszeń, obsługą wyjątków i sposobem kontroli zgodności – struktura ramowa polityk. Szkoła: zasada „szanujemy się nawzajem”; polityka „w czasie lekcji telefony leżą w szafce”; statut zbiera wszystkie regulaminy razem z karami i wyjątkami, więc działa jak struktura ramowa. HACZYK: dokument opisujący zakres, konsekwencje, wyjątki i kontrolę zgodności to struktura polityk, a nie kolejna polityka.","cyt":{"s":"68","t":"W ramach struktury polityk muszą zostać opisane następujące elementy: • zakres i prawidłowość; • konsekwencje nieprzestrzegania polityki; • sposób obsługi wyjątków; • sposób kontroli i pomiaru zgodności z polityką.","w":"ZGODNE","u":"Zasada i polityka – definicje na s. 67; podręcznik pisze „zakres i prawidłowość” (nie „ważność”)."}},"q-pc-en1-h03":{"id":"q-pc-en1-h03","typ":"egzamin","s":"EN-02-01","t":"Na którym poziomie czynnika umożliwiającego Zasady, polityki i struktury ramowe COBIT 5 umieszcza sam siebie?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 67","FW-PL s. 68"],"r":null,"zap":"COBIT 5 = struktura ramowa, czyli szkielet, w którym mieszczą się zasady i polityki przedsiębiorstwa.","scen":"","o":[{"t":"Jako jedną z zasad przedsiębiorstwa, bo opiera się na pięciu zasadach","ok":false,"w":"Pięć zasad COBIT 5 to fundament metodyki, a nie podstawowe wartości konkretnego przedsiębiorstwa. Sam COBIT 5 jest przykładem struktury ramowej (FW-PL s. 68)."},{"t":"Jako politykę, którą kierownictwo formalnie zatwierdza","ok":false,"w":"Polityki tworzy przedsiębiorstwo, żeby uszczegółowić własne zasady. Uznane struktury, takie jak COBIT 5, mogą podpowiadać treść polityk, ale same są strukturą ramową (FW-PL s. 68)."},{"t":"Jako strukturę ramową (metodykę) nadzoru i zarządzania","ok":true,"w":"Podręcznik wprost wskazuje, że COBIT 5 jest przykładem struktury ramowej (metodyki) opisanej w tym czynniku. Daje kierownictwu strukturę, wytyczne i narzędzia do nadzoru nad IT i zarządzania nim (FW-PL s. 67–68)."},{"t":"Poza tym czynnikiem, bo COBIT 5 należy wyłącznie do czynnika Procesy","ok":false,"w":"Model procesów to tylko część COBIT 5. Podręcznik zaznacza, że COBIT 5 jest przykładem struktury ramowej z czynnika Zasady, polityki i struktury ramowe (FW-PL s. 68)."}],"przyklad":"Książka kucharska to gotowa struktura: podsuwa układ i pomysły. Twoja domowa zasada „jemy zdrowo” i reguła „w piątek bez mięsa” to już twoje zasada i polityka. HACZYK: pięć zasad COBIT 5 to nie to samo co zasady przedsiębiorstwa w tym czynniku umożliwiającym.","cyt":{"s":"68","t":"Uwaga: COBIT 5 jest przykładem metodyki opisanej w ramach tego czynnika umożliwiającego.","w":"ZGODNE"}},"q-pc-en1-030":{"id":"q-pc-en1-030","typ":"egzamin","s":"EN-02-02","t":"Ubezpieczyciel przyjął zbiór szczegółowych wytycznych określających progi zatwierdzania wypłat. Jak nazywa się taki zbiór wytycznych?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 67"],"r":"A","zap":"Szczegółowe wytyczne stosowania zasad = polityka.","scen":"","o":[{"t":"Zasada","ok":false,"w":"Zasada wyraża podstawową wartość, np. rzetelność obsługi. Szczegółowe wytyczne postępowania i progi zatwierdzania są w tym przykładzie treścią polityki (s. 67)."},{"t":"Struktura ramowa","ok":false,"w":"Struktura ramowa porządkuje cały zbiór polityk i daje kierownictwu narzędzia (s. 67–68)."},{"t":"Polityka","ok":true,"w":"Polityki stanowią szczegółowe wytyczne przekładające zasady na codzienne postępowanie; mogą określać progi zatwierdzania (s. 67–68)."},{"t":"Struktura organizacyjna","ok":false,"w":"Struktura organizacyjna to jednostka decyzyjna, nie dokument (s. 75)."}],"cyt":{"s":"67","t":"Polityki zawierają bardziej szczegółowe wytyczne dotyczące sposobu praktycznego zastosowania zasad","w":"ZGODNE"}},"q-pc-en1-031":{"id":"q-pc-en1-031","typ":"egzamin","s":"EN-02-02","t":"Która cecha NIE jest kryterium dobrych zasad?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 67"],"r":"B","zap":"Nieinwazyjność – cecha polityk, nie zasad.","scen":"","o":[{"t":"Są sformułowane prostym językiem","ok":false,"w":"To kryterium zasad (s. 67)."},{"t":"Są nieinwazyjne","ok":true,"w":"Nieinwazyjność to cecha dobrej POLITYKI, nie kryterium zasad (s. 67)."},{"t":"Jest ich ograniczona liczba","ok":false,"w":"To kryterium zasad (s. 67)."},{"t":"Wyrażają podstawowe wartości","ok":false,"w":"To kryterium zasad (s. 67)."}],"cyt":{"s":"67","t":"nieingerencyjne — osobom, które muszą ich przestrzegać, wydają się logiczne, tj. nie budzą niepotrzebnego oporu.","w":"ZGODNE","u":"Cecha z listy „Dobre polityki są”, nie z kryteriów zasad; podręcznik: „nieingerencyjne”."}},"q-pc-en1-035":{"id":"q-pc-en1-035","typ":"egzamin","s":"EN-02-02","t":"Który zapis starostwa jest polityką?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 67"],"r":null,"zap":"Konkrety (kto, kiedy, jak) = polityka; wartość = zasada.","scen":"","o":[{"t":"Dostęp do danych zatwierdza ich właściciel","ok":true,"w":"To przykład autorskiej polityki: konkretne wytyczne określające postępowanie i odpowiedzialność. COBIT 5 nie nakazuje tego konkretnego rozwiązania (s. 67)."},{"t":"Szanujemy czas i potrzeby wszystkich mieszkańców","ok":false,"w":"Krótkie zdanie o wartościach – zasada (s. 67)."},{"t":"Podejmujemy decyzje uczciwie i przejrzyście","ok":false,"w":"Krótkie zdanie o wartościach – zasada (s. 67)."},{"t":"Dane mieszkańców chronimy z należytą starannością","ok":false,"w":"Krótkie zdanie o wartościach – zasada (s. 67)."}],"cyt":{"s":"67","t":"Polityki zawierają bardziej szczegółowe wytyczne dotyczące sposobu praktycznego zastosowania zasad","w":"ZGODNE"}},"q-pc-en1-041":{"id":"q-pc-en1-041","typ":"egzamin","s":"EN-02-03","t":"Do czego COBIT 5 odnosi wymaganie „ograniczonej liczby” elementów?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 67"],"r":"A","zap":"Ograniczoną liczbę wymieniono przy zasadach. Przy politykach: skuteczność, wydajność i nieinwazyjność.","scen":"","o":[{"t":"Do struktur ramowych","ok":false,"w":"Struktury ramowe mają być kompleksowe, otwarte, aktualne i dostępne (s. 67)."},{"t":"Do dobrych polityk","ok":false,"w":"COBIT 5 podaje trzy cechy dobrych polityk: skuteczność, wydajność i nieinwazyjność; ograniczonej liczby wśród nich nie ma (s. 67)."},{"t":"Do dobrych zasad","ok":true,"w":"Ograniczona liczba to kryterium dobrych zasad: ich liczba musi być ograniczona, a same zasady sformułowane prostym językiem (FW-PL s. 67)."},{"t":"Do procedur eskalacji","ok":false,"w":"Procedury eskalacji to dobra praktyka struktur organizacyjnych (s. 75)."}],"cyt":{"s":"67","t":"ich liczba musi być ograniczona;","w":"ZGODNE"}},"q-pc-en1-048":{"id":"q-pc-en1-048","typ":"egzamin","s":"EN-02-03","t":"Polityka jest logiczna dla osób, które mają jej przestrzegać, i nie powoduje niepotrzebnego oporu. Którą cechę dobrej polityki opisano?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 67"],"r":"B","zap":"Nieinwazyjna polityka nie budzi niepotrzebnego oporu.","scen":"","o":[{"t":"Nieinwazyjność","ok":true,"w":"Nieinwazyjna polityka (podręcznik: nieingerencyjna) wydaje się odbiorcom logiczna i nie budzi niepotrzebnego oporu (s.67)."},{"t":"Wydajność","ok":false,"w":"Wydajność dotyczy sposobu wdrażania zasad i wykorzystania zasobów, a nie reakcji odbiorców na politykę (s.67)."},{"t":"Skuteczność","ok":false,"w":"Skuteczność oznacza osiąganie wskazanego celu. Scenariusz podkreśla jednak brak niepotrzebnego oporu, czyli nieinwazyjność (s.67)."},{"t":"Kompleksowość","ok":false,"w":"Kompleksowość jest wskazaną cechą struktur ramowych: obejmują wszystkie wymagane obszary. To inna lista niż cechy dobrej polityki (s.67)."}],"cyt":{"s":"67","t":"nieingerencyjne — osobom, które muszą ich przestrzegać, wydają się logiczne, tj. nie budzą niepotrzebnego oporu.","w":"ZGODNE","u":"Podręcznik: „nieingerencyjne” (egzamin: nieinwazyjne)."}},"q-pc-en1-050":{"id":"q-pc-en1-050","typ":"egzamin","s":"EN-02-04","t":"Co należy zrobić z polityką zastąpioną nową wersją?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 68"],"r":"A","zap":"Stare polityki: archiwizować i wycofywać; dostępna ma być najnowsza.","scen":"","o":[{"t":"Zarchiwizować ją i wycofać z obowiązującego obiegu","ok":true,"w":"Pracownicy mają mieć łatwy dostęp do najnowszej wersji, a nieaktualne wersje należy właściwie zarchiwizować lub się ich pozbyć, tak by nie pozostawały w obiegu (FW-PL s. 68)."},{"t":"Pozostawić ją obowiązującą do kolejnego przeglądu","ok":false,"w":"Po zastąpieniu polityki nie powinny równocześnie obowiązywać sprzeczne wersje. Trzeba oznaczyć wersję aktualną oraz wycofaną (s.68)."},{"t":"Zniszczyć ją w chwili zatwierdzenia nowej wersji","ok":false,"w":"Samo zastąpienie nową wersją nie uzasadnia natychmiastowego zniszczenia starej. Potrzebna jest właściwa archiwizacja lub usunięcie zgodnie z wymaganiami cyklu życia (s.68)."},{"t":"Zachować ją w repozytorium bez zmiany jej statusu","ok":false,"w":"Zachowanie starej wersji może być zasadne, lecz trzeba oznaczyć jej status i zapewnić dostęp do wersji aktualnej (s.68)."}],"cyt":{"s":"68","t":"zapewniające łatwy dostęp do najnowszej wersji (zob. wcześniejszy punkt) oraz zapewniające właściwą archiwizację i pozbywanie się nieaktualnych informacji","w":"ZGODNE","u":"FW mówi ogólnie o archiwizacji i pozbywaniu się nieaktualnych wersji; „wymagania przechowywania” z uzasadnienia nie występują w FW."},"przyklad":"Sytuacja: Szpital zastąpił politykę nową wersją i musi zdecydować, co zrobić ze starą."},"q-pc-en1-051":{"id":"q-pc-en1-051","typ":"egzamin","s":"EN-02-04","t":"Co zapewnia struktura ramowa polityk w ich cyklu życia?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 68"],"r":null,"zap":"Struktura ramowa polityki = spójny zbiór polityk, łatwy w nawigacji.","scen":"","o":[{"t":"Decyzje podejmowane przez komitety","ok":false,"w":"Decyzje komitetów mogą prowadzić do zmiany polityk. Opis struktury ramowej polityk podkreśla jednak utworzenie i utrzymanie ich spójnego zbioru (s. 68)."},{"t":"Wejścia dla procesów domeny MEA","ok":false,"w":"Informacje o politykach mogą zasilać procesy MEA (Monitor, Evaluate and Assess — Monitoruj, Oszacuj i Oceń). Nie jest to jednak podstawowa rola struktury ramowej wskazana w tym fragmencie (s. 68)."},{"t":"Tworzenie spójnego zbioru polityk","ok":true,"w":"Metodyka dotycząca polityk zapewnia strukturę do utworzenia i utrzymania spójnego zbioru polityk (s. 68)."},{"t":"Ograniczoną liczbę wartości organizacji","ok":false,"w":"To kryterium zasad (s. 67)."}],"cyt":{"s":"68","t":"metodyka dotycząca polityk zapewnia strukturę, w ramach której można utworzyć i utrzymać spójny zbiór polityk","w":"ZGODNE"}},"q-pc-en1-052":{"id":"q-pc-en1-052","typ":"egzamin","s":"EN-02-04","t":"Które podejście do aktualizacji polityk COBIT 5 wskazuje jako ogólną dobrą praktykę?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 68"],"r":"B","zap":"Polityki przegląda i aktualizuje się regularnie.","scen":"","o":[{"t":"Oczekiwanie na zmianę wymagań regulatora","ok":false,"w":"Zmiana regulacji może wymagać aktualizacji, lecz nie zastępuje regularnego przeglądania i odnawiania polityk (s.68)."},{"t":"Przegląd i aktualizowanie w regularnych odstępach","ok":true,"w":"Dobrą praktyką jest regularne odnawianie lub aktualizowanie polityk. Istotne zdarzenia także mogą być impulsem do wcześniejszej zmiany (s.68)."},{"t":"Oczekiwanie na zalecenia audytu zewnętrznego","ok":false,"w":"Zalecenia audytu mogą wywołać zmianę, lecz podstawowa praktyka nie polega na biernym oczekiwaniu na audytora (s.68)."},{"t":"Oczekiwanie na zgłoszenie poważnego incydentu","ok":false,"w":"Incydent może uzasadniać pilną aktualizację, ale nie zastępuje regularnego cyklu przeglądów (s.68)."}],"cyt":{"s":"68","t":"Polityki muszą być przedłużane i/lub aktualizowane w regularnych odstępach czasu.","w":"ZGODNE","u":"Wzmianka z uzasadnienia o istotnych zdarzeniach jako impulsie nie występuje w FW."}},"q-pc-en1-054":{"id":"q-pc-en1-054","typ":"egzamin","s":"EN-02-05","t":"Uzupełnij brakujące słowa: „Struktura polityk opisuje m.in. zakres i ważność oraz konsekwencje [?]”.","k":false,"st":"autorskie","src":"","z":["FW-PL s. 68"],"r":"B","zap":"Struktura polityk opisuje: zakres i ważność; konsekwencje nieprzestrzegania; sposób obsługi wyjątków; kontrolę i pomiar zgodności. To elementy struktury, a skuteczność, wydajność i nieinwazyjność to cechy dobrej polityki.","scen":"","o":[{"t":"decyzji zarządu","ok":false,"w":"Nie ma takiego elementu w strukturze polityk (s. 68)."},{"t":"braku zgodności z polityką","ok":true,"w":"Struktura polityk opisuje: zakres i ważność, konsekwencje nieprzestrzegania, obsługę wyjątków, kontrolę i pomiar zgodności (s. 68)."},{"t":"oceny zdolności całego procesu","ok":false,"w":"Ocena zdolności dotyczy procesów (s. 71)."},{"t":"wdrożenia procesu","ok":false,"w":"Nie ma takiego elementu w strukturze polityk (s. 68)."}],"cyt":{"s":"68","t":"konsekwencje nieprzestrzegania polityki;","w":"ZGODNE","u":"Podręcznik: „nieprzestrzegania polityki” i „zakres i prawidłowość” (pytanie: „braku zgodności”, „ważność”)."}},"q-pc-en1-055":{"id":"q-pc-en1-055","typ":"egzamin","s":"EN-02-05","t":"Którego elementu struktury polityk brakuje, gdy nikt nie sprawdza ich przestrzegania?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 68"],"r":"A","zap":"Sprawdzanie przestrzegania = kontrola i pomiar zgodności.","scen":"","o":[{"t":"Kontroli zgodności","ok":true,"w":"Struktura polityk musi opisywać sposób kontroli i pomiaru zgodności z polityką (s. 68)."},{"t":"Zakresu i ważności","ok":false,"w":"Zakres mówi, kogo i czego polityka dotyczy – nie o sprawdzaniu (s. 68)."},{"t":"Nieinwazyjności","ok":false,"w":"To cecha dobrej polityki, nie element jej struktury (s. 67)."},{"t":"Obsługi wyjątków","ok":false,"w":"Wyjątki to sytuacje, gdy polityki nie da się zastosować – tu problem to brak kontroli (s. 68)."}],"cyt":{"s":"68","t":"sposób kontroli i pomiaru zgodności z polityką.","w":"ZGODNE"},"przyklad":"Sytuacja: Gmina przyjęła politykę, ale nikt nie sprawdza jej przestrzegania."},"q-pc-en1-058":{"id":"q-pc-en1-058","typ":"egzamin","s":"EN-02-05","t":"Do czego powinna wyraźnie odnosić się każda polityka?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 68"],"r":null,"zap":"Każda polityka odnosi się do podstawowych zasad.","scen":"","o":[{"t":"Do wskaźników opóźnionych","ok":false,"w":"Wskaźniki opóźnione mierzą osiągnięcie celów (s. 29)."},{"t":"Do diagramu RACI","ok":false,"w":"RACI (Responsible, Accountable, Consulted, Informed — odpowiedzialny wykonawczo, odpowiedzialny decyzyjnie, konsultowany, informowany) opisuje role w procesie (s. 69)."},{"t":"Do podstawowych zasad","ok":true,"w":"Każda polityka powinna wyraźnie odnosić się do podstawowych zasad (s. 68)."},{"t":"Do procedur eskalacji","ok":false,"w":"Eskalacja to dobra praktyka struktur organizacyjnych (s. 75)."}],"cyt":{"s":"68","t":"każda z polityk powinna mieć swoje miejsce oraz wyraźnie odnosić się do podstawowych zasad","w":"ZGODNE"}},"q-pc-en1-061":{"id":"q-pc-en1-061","typ":"egzamin","s":"EN-02-06","t":"Co COBIT 5 wskazuje jako najistotniejszy środek realizacji polityk?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 68"],"r":"A","zap":"Polityka działa, gdy jest wbudowana w praktyki procesu.","scen":"","o":[{"t":"Wbudowanie w praktyki i działania procesów","ok":true,"w":"Praktyki i działania procesów są najistotniejszym środkiem realizacji polityk. To w ich przebiegu reguły polityki są wykonywane (s.68)."},{"t":"Szkolenie pracowników o celu i treści polityki","ok":false,"w":"Szkolenie zwiększa świadomość i umiejętności. Podręcznik wskazuje jednak praktyki i działania procesów jako najistotniejszy środek realizacji polityk (s.68)."},{"t":"Zapewnienie dostępu do aktualnej wersji polityki","ok":false,"w":"Dostęp do aktualnej wersji jest istotny w cyklu życia polityki. Jej reguły są realizowane przede wszystkim przez praktyki i działania procesów (s.68)."},{"t":"Przypisanie kierownictwu przeglądów zgodności","ok":false,"w":"Kontrola zgodności pozwala sprawdzać przestrzeganie polityki. Nie zastępuje wykonywania jej reguł w praktykach i działaniach procesów (s.68)."}],"cyt":{"s":"68","t":"Praktyki i działania dotyczące procesów są najistotniejszym środkiem realizacji polityk.","w":"ZGODNE"},"przyklad":"Sytuacja: Szpital przyjął politykę przechowywania dokumentacji; realizuje ją, wbudowując reguły w praktyki i działania procesu."},"q-pc-en1-062":{"id":"q-pc-en1-062","typ":"egzamin","s":"EN-02-06","t":"Z którym aktywatorem łączy polityki to, że mają promować etyczne zachowanie?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 68"],"r":"B","zap":"Polityki odzwierciedlają kulturę i etykę → Kultura, Etyka i Zachowanie.","scen":"","o":[{"t":"Struktury organizacyjne","ok":false,"w":"Inne aktywatory również mogą być powiązane z etyką. Chodzi jednak o wskazaną relację zasad i polityk z pożądanymi wartościami i zachowaniami (s. 68)."},{"t":"Informacja","ok":false,"w":"Związek z Informacją wynika z tego, że polityki są informacją, nie z etyki (s. 68)."},{"t":"Procesy","ok":false,"w":"Procesy są głównym środkiem realizacji polityk – to inny związek (s. 68)."},{"t":"Kultura, Etyka i Zachowanie","ok":true,"w":"Zasady i polityki mają odzwierciedlać kulturę i wartości etyczne – silny związek z Kulturą, Etyką i Zachowaniem (s. 68)."}],"cyt":{"s":"68","t":"Zasady, polityki i metodyki powinny odzwierciedlać kulturę i wartości etyczne przedsiębiorstwa oraz powinny promować pożądane zachowanie; to oznacza, że istnieje silny związek z czynnikiem umożliwiającym Kultura, etyka i zachowanie.","w":"ZGODNE"},"przyklad":"Sytuacja: Organizacja chce, by reguły zapisane w politykach promowały uczciwe postępowanie także wtedy, gdy naruszenie nie zostanie wykryte przez kontrolę."},"q-pc-en1-073":{"id":"q-pc-en1-073","typ":"egzamin","s":"EN-02-07","t":"Która grupa NIE należy do zewnętrznych interesariuszy procesu?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 69"],"r":"B","zap":"Zarząd = interesariusz wewnętrzny.","scen":"","o":[{"t":"Klienci","ok":false,"w":"Klienci są interesariuszami zewnętrznymi (s. 69)."},{"t":"Udziałowcy","ok":false,"w":"Udziałowcy są interesariuszami zewnętrznymi (s. 69)."},{"t":"Organy regulacyjne","ok":false,"w":"Organy regulacyjne są interesariuszami zewnętrznymi (s. 69)."},{"t":"Zarząd","ok":true,"w":"Zarząd jest interesariuszem wewnętrznym (s. 69)."}],"cyt":{"s":"69","t":"Do interesariuszy wewnętrznych należy zarząd, kierownictwo, pracownicy i wolontariusze.","w":"ZGODNE"}},"q-pc-en1-074":{"id":"q-pc-en1-074","typ":"egzamin","s":"EN-02-07","t":"Jaką rolę wobec procesu pełni organ regulacyjny?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 69"],"r":"A","zap":"Regulator = interesariusz zewnętrzny procesu.","scen":"","o":[{"t":"Wewnętrzny wykonawca praktyk procesu","ok":false,"w":"Organ nadzorujący przestrzeganie przepisów działa spoza organizacji; nie staje się przez raportowanie wewnętrznym wykonawcą procesu (s.69)."},{"t":"Zewnętrzny interesariusz procesu","ok":true,"w":"Organy regulacyjne są przykładem zewnętrznych interesariuszy procesu. Są zainteresowane jego wynikiem i zgodnością, mimo że nie należą do organizacji (s.69)."},{"t":"Wewnętrzny właściciel procesu","ok":false,"w":"Właściciel procesu jest rolą w organizacji. Zewnętrzny regulator nadzoruje zgodność, lecz nie staje się przez to właścicielem procesu (s.69,76)."},{"t":"Organ Ładu organizacji","ok":false,"w":"Organ Ładu jest elementem struktury organizacji. Zewnętrzny regulator jest interesariuszem, z którym organizacja pozostaje w relacji nadzorczej (s.69)."}],"cyt":{"s":"69","t":"Interesariuszami zewnętrznymi są klienci, partnerzy biznesowi, udziałowcy i organy regulacyjne.","w":"ZGODNE"},"przyklad":"Sytuacja: Bank przekazuje raporty organowi nadzorującemu przestrzeganie przepisów, który nie należy do struktury banku."},"q-pc-en1-082":{"id":"q-pc-en1-082","typ":"egzamin","s":"EN-02-07","t":"Które stwierdzenie o interesariuszach procesu jest prawdziwe?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 69"],"r":null,"zap":"Udziałowcy – zewnętrzni; zarząd – wewnętrzny. To klasyfikacja przykładowa; położenie granicy organizacji i przyjęta rola mogą zmieniać kontekst.","scen":"","o":[{"t":"Udziałowcy są interesariuszami zewnętrznymi","ok":true,"w":"Udziałowcy są wymienieni wśród interesariuszy zewnętrznych (s. 69)."},{"t":"Wolontariusze nie są interesariuszami","ok":false,"w":"Wolontariusze są interesariuszami wewnętrznymi (s. 69)."},{"t":"Organy regulacyjne są interesariuszami wewnętrznymi","ok":false,"w":"Organy regulacyjne są zewnętrzne (s. 69)."},{"t":"Zarząd jest interesariuszem zewnętrznym","ok":false,"w":"Zarząd jest wewnętrzny (s. 69)."}],"cyt":{"s":"69","t":"Interesariuszami zewnętrznymi są klienci, partnerzy biznesowi, udziałowcy i organy regulacyjne.","w":"ZGODNE"}},"q-pc-en1-083":{"id":"q-pc-en1-083","typ":"egzamin","s":"EN-02-08","t":"Cel procesu: „proces jest łatwy do zastosowania”. Do której kategorii należy?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 29","FW-PL s. 69"],"r":"A","zap":"Proces ma cele wewnętrzne (jakość i zgodność), kontekstowe (dopasowanie do organizacji, zrozumiałość, łatwość użycia) oraz dostępności i bezpieczeństwa (poufność, gdy potrzebna, oraz dostęp dla uprawnionych). To ta sama logika co ogólne kategorie celów aktywatora.","scen":"","o":[{"t":"Cele związane z informatyką","ok":false,"w":"To poziom kaskady celów, nie kategoria celów procesu (s. 69)."},{"t":"Cele wewnętrzne","ok":false,"w":"Cele wewnętrzne dotyczą jakości, zgodności z dobrą praktyką i regułami (s. 69)."},{"t":"Cele dostępności i bezpieczeństwa","ok":false,"w":"Te cele dotyczą poufności i dostępu do procesu (s. 69)."},{"t":"Cele kontekstowe","ok":true,"w":"Cele kontekstowe: czy proces jest dopasowany do organizacji, odpowiedni, zrozumiały i łatwy do zastosowania (s. 69)."}],"przyklad":"Proces obsługi zgłoszeń: zgodność z przyjętym standardem to cel wewnętrzny; formularz zrozumiały dla pracowników to cel kontekstowy; dostęp do poufnych zgłoszeń wyłącznie dla właściwych osób to cel dostępności i bezpieczeństwa.","cyt":{"s":"69","t":"Cele dotyczące zgodności z kontekstem — czy proces został dostosowany i dopasowany do konkretnej sytuacji przedsiębiorstwa? Czy proces jest odpowiedni, zrozumiały i łatwy do zastosowania?","w":"ZGODNE","u":"Podręcznik: „cele dotyczące zgodności z kontekstem” (egzamin: cele kontekstowe)."}},"q-pc-en1-089":{"id":"q-pc-en1-089","typ":"egzamin","s":"EN-02-08","t":"Uzupełnij brakujące słowa: „Cele procesu wspierają cele związane z informatyką, a te wspierają [?]”.","k":false,"st":"autorskie","src":"","z":["FW-PL s. 69"],"r":"B","zap":"Czytając od dołu: cele procesu wspierają cele IT, a te cele organizacji. To kierunek wsparcia, odwrotny do rozwijania kaskady od potrzeb.","scen":"","o":[{"t":"cele organizacji","ok":true,"w":"Cele procesu wspierają realizację celów związanych z IT (Information Technology — technologie informatyczne), które wspierają osiągnięcie celów przedsiębiorstwa (organizacji) (s. 69)."},{"t":"cele aktywatorów","ok":false,"w":"Kolejność kaskady jest odwrotna: cele aktywatorów (procesu) są na dole (s. 69)."},{"t":"cele dostępności i bezpieczeństwa","ok":false,"w":"To kategoria celów procesu, nie poziom kaskady (s. 69)."},{"t":"potrzeby interesariuszy","ok":false,"w":"Cele organizacji mają zaspokajać potrzeby interesariuszy. W bezpośrednim kolejnym kroku przytoczonej zależności cele IT (Information Technology — technologie informatyczne) wspierają jednak cele organizacji (s. 69)."}],"cyt":{"s":"69","t":"cele procesu wspierają realizację celów związanych z IT, które z kolei wspierają osiągnięcie celów przedsiębiorstwa.","w":"ZGODNE","u":"Terminologia: organizacja = przedsiębiorstwo."}},"q-pc-en1-097":{"id":"q-pc-en1-097","typ":"egzamin","s":"EN-02-09","t":"Który opis odpowiada końcowej części cyklu życia procesu w COBIT 5?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 70","FW-PL s. 72"],"r":"A","zap":"Cykl życia procesu: definiowanie, tworzenie, obsługa, monitorowanie, a na końcu dostosowanie/aktualizacja albo wycofanie.","scen":"","o":[{"t":"Ocena zdolności i certyfikacja procesu","ok":false,"w":"Ocena zdolności jest odrębnym zagadnieniem, a opis cyklu życia nie ustanawia obowiązku certyfikowania procesu (s.70)."},{"t":"Dostosowanie lub aktualizacja albo wycofanie","ok":true,"w":"Proces jest definiowany, tworzony, obsługiwany i monitorowany, a następnie może być dostosowany, zaktualizowany lub wycofany (s.70)."},{"t":"Ustalenie mandatu i składu struktury","ok":false,"w":"Mandat i skład dotyczą struktury organizacyjnej, a nie końcowej części cyklu życia procesu (s.75)."},{"t":"Uporządkowanie zasad i hierarchii polityk","ok":false,"w":"Hierarchia polityk należy do aktywatora Zasady, Polityki i Struktury ramowe, a nie do wskazanego fragmentu cyklu procesu (s.68)."}],"cyt":{"s":"70","t":"Jest on definiowany, tworzony, obsługiwany, monitorowany oraz dostosowywany/aktualizowany lub wycofywany.","w":"ZGODNE"}},"q-pc-en1-102":{"id":"q-pc-en1-102","typ":"egzamin","s":"EN-02-09","t":"Który element procesu jest deklaracją działań umożliwiających uzyskanie korzyści oraz optymalizację ryzyka i zasobów?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 70"],"r":"B","zap":"Deklaracja działań dla korzyści = praktyka.","scen":"","o":[{"t":"Działanie","ok":false,"w":"Działania wdrażają praktyki i także służą uzyskiwaniu korzyści. Przytoczony opis ogólnych deklaracji odnosi się jednak do praktyk (s. 70)."},{"t":"Praktyka","ok":true,"w":"Praktyki są deklaracjami działań umożliwiającymi uzyskanie korzyści, optymalizację ryzyka i zasobów (s. 70)."},{"t":"Wynik","ok":false,"w":"Wyniki to produkty działań/pozostałości (s. 70)."},{"t":"Szczegółowe działanie","ok":false,"w":"To dodatkowe wytyczne, np. z ITIL (Information Technology Infrastructure Library — biblioteka dobrych praktyk zarządzania usługami informatycznymi) czy PRINCE2 (s. 70)."}],"cyt":{"s":"70","t":"deklaracjami dotyczącymi działań umożliwiającymi uzyskanie korzyści, optymalizację poziomu ryzyka oraz optymalizację wykorzystania zasobów;","w":"ZGODNE"}},"q-pc-en1-108":{"id":"q-pc-en1-108","typ":"egzamin","s":"EN-02-10","t":"Co robi organizacja, która nie wdraża praktyki mogącej mieć u niej zastosowanie?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 70"],"r":"A","zap":"Organizacja dobiera praktyki do kontekstu. Świadome niewdrożenie praktyki mającej zastosowanie oznacza akceptację związanego z tym ryzyka.","scen":"","o":[{"t":"Zastępuje ocenę konsekwencji porównaniem kosztów","ok":false,"w":"Koszt jest częścią decyzji, lecz nie zastępuje oceny ryzyka niewdrożenia mającej zastosowanie praktyki. Organ Ładu i kierownictwo muszą świadomie uwzględnić to ryzyko (s.70)."},{"t":"Z góry przyjmuje poziom zdolności 0 całego procesu","ok":false,"w":"Brak jednej praktyki nie oznacza automatycznie poziomu 0. Ocenia się osiągnięcie wyników procesu i odpowiednich atrybutów (s.45–46,70)."},{"t":"Przekazuje autorowi standardu odpowiedzialność za ryzyko","ok":false,"w":"Za wybór praktyk i konsekwencje w organizacji odpowiada jej organ Ładu i kierownictwo; autor standardu nie przejmuje tej odpowiedzialności (s.70)."},{"t":"Akceptuje ryzyko wynikające z tej decyzji","ok":true,"w":"COBIT 5 dopuszcza świadomą akceptację ryzyka niewdrożenia praktyk, które mogą mieć zastosowanie. Jest to decyzja organizacji w jej kontekście (s.70)."}],"cyt":{"s":"70","t":"akceptację ryzyka niewdrożenia praktyk, które mogą mieć zastosowanie.","w":"ZGODNE"},"przyklad":"Sytuacja: Bank nie wdraża praktyki, która mogłaby mieć u niego zastosowanie – świadomie akceptuje ryzyko jej niewdrożenia."},"q-pc-en1-111":{"id":"q-pc-en1-111","typ":"egzamin","s":"EN-02-10","t":"Kto według COBIT 5 wybiera praktyki procesu do wdrożenia?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 70"],"r":"B","zap":"Organ Ładu i kierownictwo wybierają właściwe praktyki; dodają lub dostosowują je; definiują praktyki spoza informatyki dla integracji z biznesem; ustalają częstotliwość, zakres i automatyzację wdrożenia; mogą świadomie zaakceptować ryzyko niewdrożenia praktyki mającej zastosowanie.","scen":"","o":[{"t":"Audytor zewnętrzny organizacji","ok":false,"w":"Audytor może doradzać lub oceniać. Wybór praktyk do wdrożenia pozostaje odpowiedzialnością organu Ładu i kierownictwa organizacji (s. 70)."},{"t":"ISACA jako autor COBIT 5","ok":false,"w":"ISACA tworzy COBIT 5, ale wyboru dokonuje organizacja (s. 70)."},{"t":"Organ Ładu i kadra kierownicza","ok":true,"w":"Organ nadzorujący oraz kadra kierownicza dokonują wyboru praktyk do wdrożenia (s. 70)."},{"t":"Dostawcy usług informatycznych","ok":false,"w":"Dostawcy mogą uczestniczyć we wdrożeniu i proponować praktyki. Nie przejmują przez to odpowiedzialności organu Ładu i kierownictwa za wybór (s. 70)."}],"cyt":{"s":"70","t":"Organ nadzorujący oraz kadra kierownicza w przedsiębiorstwie muszą dokonywać wyborów w odniesieniu do tych praktyk nadzoru i zarządzania","w":"ZGODNE","u":"Terminologia: organ Ładu = organ nadzorujący."}},"q-pc-en1-116":{"id":"q-pc-en1-116","typ":"egzamin","s":"EN-02-11","t":"Proces rozwoju przekazuje gotowe rozwiązanie do procesu operacyjnego. Którą relację ilustruje to bezpośrednio?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 71"],"r":null,"zap":"Procesy zależą od innych procesów.","scen":"","o":[{"t":"Powiązanie praktyk z rolami w tabeli RACI","ok":false,"w":"Tabela RACI (Responsible, Accountable, Consulted, Informed — odpowiedzialny wykonawczo, odpowiedzialny decyzyjnie, konsultowany, informowany) wiąże role z praktykami procesu. Scenariusz opisuje przekazanie wyniku między procesami, a nie podział ról (s.69,75)."},{"t":"Zależność jednego procesu od innego procesu","ok":true,"w":"Proces operacyjny korzysta z wyniku innego procesu, co ilustruje zależność procesów. COBIT 5 wskazuje, że procesy mogą zależeć i zależą od innych procesów (s.71)."},{"t":"Powiązanie polityk z podstawowymi zasadami","ok":false,"w":"Polityki powinny odnosić się do podstawowych zasad. W scenariuszu chodzi jednak o przepływ wyniku między procesami (s.68,71)."},{"t":"Zależność składu struktury od umiejętności","ok":false,"w":"Skład struktury powinien odzwierciedlać wymagane umiejętności jej członków. Tu opisano dwa procesy, a nie skład struktury (s.75)."}],"cyt":{"s":"71","t":"Procesy mogą zależeć (i zależą) od innych procesów.","w":"ZGODNE"}},"q-pc-en1-117":{"id":"q-pc-en1-117","typ":"egzamin","s":"EN-02-11","t":"Które zdanie NIE opisuje relacji Procesów z innymi aktywatorami?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 71"],"r":"B","zap":"Kultura determinuje skuteczność procesów.","scen":"","o":[{"t":"Procesy wymagają informacji i mogą jej dostarczać","ok":false,"w":"To prawdziwa relacja (s. 71)."},{"t":"Procesy są niezależne od kultury organizacji","ok":true,"w":"Fałsz: aspekty kultury i zachowania determinują skuteczność procesów (s. 71)."},{"t":"Procesy wymagają struktur organizacyjnych","ok":false,"w":"To prawdziwa relacja (s. 71)."},{"t":"Procesy wymagają polityk i procedur","ok":false,"w":"To prawdziwa relacja (s. 71)."}],"cyt":{"s":"71","t":"Aspekty związane z zachowaniem i kulturą determinują skuteczność realizacji procesów.","w":"ZGODNE"}},"q-pc-en1-119":{"id":"q-pc-en1-119","typ":"egzamin","s":"EN-02-11","t":"Którą relację procesów z innymi aktywatorami ujawnia awaria serwera obsługującego proces?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 71"],"r":"A","zap":"Awaria infrastruktury → procesy wymagają zdolności usługowych.","scen":"","o":[{"t":"Procesy wymagają polityk i procedur","ok":false,"w":"Prawda, ale awaria serwera dotyczy zdolności usługowych (s. 71)."},{"t":"Procesy wymagają zdolności usługowych","ok":true,"w":"Procesy wymagają zdolności usługowych – infrastruktury, aplikacji (s. 71)."},{"t":"Procesy wymagają struktur organizacyjnych","ok":false,"w":"Prawda, ale tu problemem jest infrastruktura (s. 71)."},{"t":"Kultura determinuje skuteczność procesów","ok":false,"w":"Prawda, ale tu problemem jest infrastruktura (s. 71)."}],"cyt":{"s":"71","t":"Procesy zapewniają (lecz także wymagają) zdolności do świadczenia usług (infrastruktura, aplikacje itd.).","w":"ZGODNE"},"przyklad":"Sytuacja: Sklep internetowy ma dobry proces zwrotów, ale serwer sklepu nie działa."},"q-pc-en1-124":{"id":"q-pc-en1-124","typ":"egzamin","s":"EN-02-12","t":"Komitet ds. ryzyka banku dobiera członków z działu ryzyka i zewnętrznego eksperta. Którą praktykę stosuje?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 75"],"r":"A","zap":"Dobór członków (wewnętrznych/zewnętrznych) = skład.","scen":"","o":[{"t":"Delegowanie uprawnień","ok":false,"w":"Delegowanie to przekazanie uprawnień podległym strukturom (s. 75)."},{"t":"Skład","ok":true,"w":"Skład: struktury składają się z członków – interesariuszy wewnętrznych lub zewnętrznych (s. 75)."},{"t":"Zasady operacyjne","ok":false,"w":"Zasady operacyjne to np. częstotliwość spotkań i dokumentowanie (s. 75)."},{"t":"Zakres kontroli","ok":false,"w":"Zakres kontroli to granice uprawnień decyzyjnych (s. 75)."}],"cyt":{"s":"75","t":"Skład — struktury składają się z członków, którzy są interesariuszami wewnętrznymi lub zewnętrznymi;","w":"ZGODNE"}},"q-pc-en1-128":{"id":"q-pc-en1-128","typ":"egzamin","s":"EN-02-12","t":"Który element NIE jest dobrą praktyką struktur organizacyjnych?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 75","FW-PL s. 76","SYL EN02.12"],"r":"B","zap":"Dobre praktyki struktur: zasady operacyjne (np. częstotliwość zebrań i dokumentowanie), skład, zakres kontroli (granice uprawnień), poziom uprawnień (decyzje, do których struktura jest uprawniona), delegowanie części uprawnień podległym strukturom oraz procedury eskalacji. Sylabus PeopleCert wymienia także podejmowanie decyzji. Przy tworzeniu struktury określa się mandat, czyli powód i cel istnienia. Wynikami są decyzje, informacje lub prośby o dodatkowe dane.","scen":"","o":[{"t":"Delegowanie uprawnień","ok":false,"w":"Delegowanie uprawnień jest dobrą praktyką: struktura może przekazać część uprawnień decyzyjnych strukturom podległym (podręcznik, s.75)."},{"t":"Zakres kontroli","ok":false,"w":"Zakres kontroli określa granice uprawnień decyzyjnych struktury. Poziom uprawnień wskazuje decyzje, do których jest ona uprawniona (podręcznik, s.75)."},{"t":"Nieinwazyjność","ok":true,"w":"Nieinwazyjność jest cechą dobrej polityki: polityka wydaje się logiczna i nie budzi niepotrzebnego oporu. Nie jest pozycją tej listy praktyk struktur (podręcznik, s.67,75)."},{"t":"Procedury eskalacji","ok":false,"w":"Procedury eskalacji opisują postępowanie, gdy struktura ma problem z podjęciem decyzji, np. przekazanie sprawy do wyższego szczebla. To dobra praktyka struktur (podręcznik, s.75)."}],"przyklad":"Komitet zmian ma mandat oceny zmian systemów. Zbiera się co tydzień i zapisuje decyzje (zasady operacyjne); obejmuje przedstawicieli biznesu i informatyki (skład); może zatwierdzać zmiany do ustalonego progu (uprawnienia), przekazuje drobne decyzje zespołowi operacyjnemu (delegowanie), a sprawy poza progiem kieruje wyżej (eskalacja). Na podstawie raportu wydaje zgodę lub żąda dodatkowych danych.","cyt":{"s":"75","t":"Praktyki: Zasady działania, zasięg (zakres) kontroli, poziom uprawnień, przekazywanie uprawnień, procedury eskalacji","w":"ZGODNE","u":"Nieinwazyjność (nieingerencyjność) to cecha dobrej polityki (s. 67)."}},"q-pc-en2-001":{"id":"q-pc-en2-001","typ":"egzamin","s":"EN-02-13","t":"Która rola jest najwyższym rangą dyrektorem odpowiedzialnym za pełne zarządzanie organizacją?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 76"],"r":"B","zap":"CEO = najwyższy rangą dyrektor, pełne zarządzanie organizacją.","scen":"","o":[{"t":"Zarząd","ok":false,"w":"Zarząd to grupa rozliczana za Ład (nadzór) i ogólną kontrolę nad zasobami, a nie dyrektor zarządzający (s. 76)."},{"t":"CEO (dyrektor generalny)","ok":true,"w":"Rysunek 33: CEO (Chief Executive Officer — dyrektor generalny) to najwyższy rangą dyrektor odpowiedzialny za pełne zarządzanie organizacją (s. 76)."},{"t":"Dyrektor ds. operacyjnych (COO)","ok":false,"w":"COO (Chief Operating Officer — dyrektor operacyjny) odpowiada za funkcjonowanie organizacji, nie za pełne zarządzanie nią (s. 76)."},{"t":"Członek naczelnego kierownictwa","ok":false,"w":"Odpowiada za działalność jednej jednostki biznesowej lub spółki zależnej (s. 76)."}],"przyklad":"W grupie handlowej organ Ładu ustala kierunek i nadzoruje zasoby; CEO zarządza całą organizacją; COO dba o jej funkcjonowanie; dyrektor jednej spółki zależnej odpowiada za jej działalność jako członek naczelnego kierownictwa. Są to przykładowe role COBIT 5, nie obowiązkowy schemat stanowisk.","cyt":{"s":"76","t":"Dyrektor generalny (CEO) Najwyższy rangą dyrektor odpowiedzialny za pełne zarządzanie przedsiębiorstwem.","w":"ZGODNE"}},"q-pc-en2-003":{"id":"q-pc-en2-003","typ":"egzamin","s":"EN-02-13","t":"Która rola monitoruje ryzyko i wpływ przepisów o ochronie danych osobowych na biznes?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 76","FW-PL s. 77"],"r":"A","zap":"W Rysunku 33 dyrektor ds. prywatności monitoruje wpływ przepisów i ryzyko prywatności. To opis COBIT 5 z 2012 r., a nie automatyczne utożsamienie z każdą późniejszą rolą prawną inspektora ochrony danych.","scen":"","o":[{"t":"Kierownik ds. bezpieczeństwa informacji","ok":false,"w":"Bezpieczeństwo informacji obejmuje także ochronę danych. W Rysunku 33 opis monitorowania wpływu przepisów o prywatności wyróżnia jednak dyrektora ds. prywatności (s. 77)."},{"t":"Funkcja Zgodność","ok":false,"w":"Funkcja zgodności także zajmuje się tymi przepisami. Jej opis jest ogólny; przytoczone szczegółowe zadanie wyróżnia opis dyrektora ds. prywatności (s. 76–77)."},{"t":"Dyrektor ds. ryzyka (CRO)","ok":false,"w":"CRO (Chief Risk Officer — dyrektor ds. ryzyka) odpowiada za wszystkie aspekty zarządzania ryzykiem w całej organizacji (s. 76)."},{"t":"Dyrektor ds. prywatności","ok":true,"w":"Monitoruje ryzyko i wpływ przepisów o prywatności oraz koordynuje polityki; zwany też dyrektorem ds. ochrony danych (s. 77)."}],"cyt":{"s":"77","t":"Dyrektor ds. prywatności Osoba odpowiedzialna za monitorowanie ryzyka oraz wpływu na biznes przepisów w zakresie ochrony prywatności","w":"ZGODNE"}},"q-pc-en2-013":{"id":"q-pc-en2-013","typ":"egzamin","s":"EN-02-14","t":"Która dobra praktyka kształtowania zachowań polega na tym, że liderzy sami stosują nowe zasady?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 80"],"r":"A","zap":"Przykład kierownictwa i czempionów = zwiększanie świadomości pożądanych zachowań.","scen":"","o":[{"t":"Zwiększanie świadomości przez przykład","ok":true,"w":"Świadomość pożądanych zachowań buduje przykład kierownictwa wyższego szczebla i czempionów (s. 80)."},{"t":"Komunikowanie wzorców zachowań","ok":false,"w":"Komunikowanie pożądanych wzorców zachowań w całej organizacji to ogłaszanie wzorców i wartości, a tu chodzi o dawanie przykładu (s. 80)."},{"t":"Zachęty i środki zniechęcające","ok":false,"w":"Zachęty to nagrody i kary, np. w systemie wynagradzania (s. 80)."},{"t":"Reguły i normy postępowania","ok":false,"w":"Reguły i normy to dodatkowe pisemne wytyczne o zachowaniach (s. 80)."}],"cyt":{"s":"80","t":"zwiększanie świadomości pożądanych wzorców zachowań dzięki przykładowi kierownictwa wyższego szczebla oraz innych osób wspierających;","w":"ZGODNE"},"przyklad":"Sytuacja: Prezes sieci sklepów sam stosuje nowe zasady obsługi klienta, by inni brali z niego przykład."},"q-pc-en2-015":{"id":"q-pc-en2-015","typ":"egzamin","s":"EN-02-14","t":"Uzupełnij: Reguły i normy są wyraźnie powiązane z [?] wdrożonymi w organizacji.","k":false,"st":"autorskie","src":"","z":["FW-PL s. 80"],"r":null,"zap":"Reguły i normy ↔ zasady i polityki.","scen":"","o":[{"t":"strukturami organizacyjnymi","ok":false,"w":"Struktury mają własne praktyki, np. zasady operacyjne (s. 75)."},{"t":"kategoriami umiejętności","ok":false,"w":"Kategorie umiejętności to praktyka aktywatora Ludzie, Umiejętności i Kompetencje (s. 87)."},{"t":"poziomami usług","ok":false,"w":"Poziomy usług to praktyka aktywatora Usługi, Infrastruktura i Aplikacje (s. 86)."},{"t":"zasadami i politykami","ok":true,"w":"Reguły i normy dają dodatkowe wytyczne o zachowaniach i są wyraźnie powiązane z zasadami i politykami (s. 80)."}],"cyt":{"s":"80","t":"Reguły i normy zawierające dodatkowe wytyczne dotyczące pożądanych wzorców zachowań w organizacji. Są one wyraźnie powiązane z zasadami i politykami wdrożonymi przez przedsiębiorstwo.","w":"ZGODNE"}},"q-pc-en2-016":{"id":"q-pc-en2-016","typ":"egzamin","s":"EN-02-14","t":"Który element NIE jest dobrą praktyką kształtowania pożądanego zachowania?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 75","FW-PL s. 80"],"r":"B","zap":"W tej klasyfikacji: procedury eskalacji → struktury; komunikowanie, przykład, zachęty, reguły i normy → kultura. Aktywatory współdziałają.","scen":"","o":[{"t":"Dawanie przykładu przez czempionów","ok":false,"w":"To dobra praktyka: świadomość przez przykład kierownictwa i czempionów (s. 80)."},{"t":"Określanie procedur eskalacji","ok":true,"w":"Procedury eskalacji to dobra praktyka Struktur organizacyjnych (s. 75)."},{"t":"Komunikowanie wartości korporacyjnych","ok":false,"w":"To dobra praktyka: komunikowanie wzorców i wartości (s. 80)."},{"t":"Zachęty promujące pożądane zachowanie","ok":false,"w":"To dobra praktyka: zachęty i środki zniechęcające (s. 80)."}],"cyt":{"s":"79","t":"Praktyki: – Komunikowanie – Egzekwowanie wymagań – Zachęty i nagrody – Świadomość – Reguły i normy – Osoby wspierające","w":"ZGODNE"}},"q-pc-en2-030":{"id":"q-pc-en2-030","typ":"egzamin","s":"EN-02-15","t":"Zarząd banku ustala, jak duże ryzyko bank może przyjąć i jakie jest gotów podjąć. Jakiego rodzaju zachowania to dotyczy?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 79"],"r":"A","zap":"Ile ryzyka przyjmujemy i podejmujemy? = zachowanie związane z podejmowaniem ryzyka.","scen":"","o":[{"t":"Zachowania związanego z przestrzeganiem polityki","ok":false,"w":"To stopień przyjęcia i przestrzegania polityki (s. 79)."},{"t":"Zachowania w przypadku negatywnych wyników","ok":false,"w":"To reakcja na szkodę lub utraconą szansę (s. 79)."},{"t":"Zachowania związanego z podejmowaniem ryzyka","ok":true,"w":"Tak podręcznik opisuje zachowanie związane z podejmowaniem ryzyka (s. 79)."},{"t":"Etyki indywidualnej członków zarządu","ok":false,"w":"Etyka indywidualna to osobiste wartości, a nie ustalanie apetytu na ryzyko (s. 79)."}],"cyt":{"s":"79","t":"Zachowanie związane z podejmowaniem ryzyka — jak duże ryzyko przedsiębiorstwo może w swojej ocenie przyjąć i jakie ryzyko jest gotowe podjąć?","w":"ZGODNE"}},"q-pc-en2-034":{"id":"q-pc-en2-034","typ":"egzamin","s":"EN-02-15","t":"Uzupełnij: Etyka organizacyjna jest determinowana przez [?], które mają być podstawą funkcjonowania organizacji.","k":false,"st":"autorskie","src":"","z":["FW-PL s. 79"],"r":"B","zap":"Etyka organizacyjna = wartości organizacji.","scen":"","o":[{"t":"wartości","ok":true,"w":"Etyka organizacji jest determinowana przez wartości, które mają być podstawą jej funkcjonowania (s. 79)."},{"t":"regulacje","ok":false,"w":"Regulacje mogą wpływać na organizację i jej wartości. Cytowana definicja etyki organizacyjnej wskazuje jednak wartości, które mają stanowić podstawę jej funkcjonowania (s. 79)."},{"t":"procedury","ok":false,"w":"Procedury mogą wzmacniać zachowania i odzwierciedlać wartości. W tej definicji podstawę etyki stanowią jednak wartości (s. 79)."},{"t":"zasoby","ok":false,"w":"Zasoby nie są w definicji etyki organizacji (s. 79)."}],"cyt":{"s":"79","t":"etyki organizacji determinowanej przez wartości, które mają być podstawą funkcjonowania przedsiębiorstwa;","w":"ZGODNE"}},"q-pc-en2-046":{"id":"q-pc-en2-046","typ":"egzamin","s":"EN-02-16","t":"Po wdrożeniu katalogu usług pracownicy obsługi nadal traktują użytkowników jak intruzów. Który aspekt innego aktywatora trzeba uwzględnić, aby zmienić tę sytuację?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 83","FW-PL s. 86"],"r":"A","zap":"Kultura usług wymaga uwzględnienia zachowań i kultury.","scen":"","o":[{"t":"Kulturę i wzorce zachowań","ok":true,"w":"Nastawienie pracowników do użytkowników jest problemem kultury i zachowań. W relacjach aktywatora usług COBIT 5 wskazuje ich znaczenie przy budowaniu kultury ukierunkowanej na usługi (s.86)."},{"t":"Poziomy usług zapisane w umowach","ok":false,"w":"Uzgodnione poziomy usług określają wymagania wobec dostawców, ale samo zapisanie parametrów nie zmienia nastawienia pracowników (s.86)."},{"t":"Pryncypium otwartości architektury","ok":false,"w":"Otwartość dotyczy oparcia architektury na otwartych standardach branżowych. Nie opisuje traktowania użytkowników (s.86)."},{"t":"Warstwę fizyczną informacji","ok":false,"w":"Warstwa fizyczna odnosi się do nośników informacji. Scenariusz opisuje zachowania ludzi, nie nośnik danych (s.83,86)."}],"cyt":{"s":"86","t":"Gdy konieczne jest zbudowanie kultury ukierunkowanej na usługi, istotne są również aspekty związane z zachowaniem i kulturą.","w":"ZGODNE"}},"q-pc-en2-047":{"id":"q-pc-en2-047","typ":"egzamin","s":"EN-02-16","t":"Zidentyfikuj brakujące słowo w następującym zdaniu. Nawet dobrze zaprojektowane struktury organizacyjne nie zapewnią właściwego Ładu, jeśli ich [?] nie będą wdrażane.","k":false,"st":"autorskie","src":"","z":["FW-PL s. 75","FW-PL s. 80"],"r":null,"zap":"Niewdrożone decyzje struktur = brak skutecznego Ładu.","scen":"","o":[{"t":"procesy","ok":false,"w":"Podręcznik mówi tu o decyzjach struktur (s. 80)."},{"t":"budżety","ok":false,"w":"Budżetów tu nie wymieniono (s. 80)."},{"t":"decyzje","ok":true,"w":"Jeśli decyzje struktur nie będą wdrażane, nie zapewnią odpowiedniego Ładu (nadzoru) i Zarządzania IT (s. 80)."},{"t":"polityki","ok":false,"w":"Polityki określają mandat struktur; mowa o wdrażaniu decyzji (s. 75, 80)."}],"cyt":{"s":"80","t":"jeśli ich decyzje nie będą wdrażane — ze względu na różnice w zamiarach poszczególnych osób, brak zachęt itd. — nie zapewnią odpowiedniego nadzoru i zarządzania","w":"ZGODNE","u":"Terminologia: Ład = nadzór."}},"q-pc-en2-052":{"id":"q-pc-en2-052","typ":"egzamin","s":"EN-02-17","t":"Raport spełnia potrzeby dyrektora szpitala, ale jego ręczne przygotowanie zajmuje tydzień, mimo że te same informacje można wiarygodnie uzyskać w godzinę. Które kryterium wymaga poprawy?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 63"],"r":"A","zap":"Spełnienie potrzeb odbiorcy to skuteczność, a niepotrzebny nakład zasobów na uzyskanie i użycie informacji to problem wydajności. Są to kryteria informacji COBIT 4.1; COBIT 5 odwzorowuje je na cele jakości informacji (wydajność m.in. na dostępność i łatwość posługiwania się).","scen":"","o":[{"t":"Skuteczności","ok":false,"w":"Skuteczność jest spełniona, bo raport zaspokaja potrzeby odbiorcy (s. 63)."},{"t":"Integralności","ok":false,"w":"Nic nie wskazuje na błędy ani braki w raporcie (s. 63)."},{"t":"Poufności","ok":false,"w":"Problemem nie jest dostęp nieuprawnionych (s. 63)."},{"t":"Wydajności","ok":true,"w":"Potrzeby są spełnione (skuteczność), ale uzyskanie wymaga dużo zasobów – brak wydajności (s. 63)."}],"cyt":{"s":"63","t":"Jeśli informacje spełniające potrzeby odbiorcy informacji są uzyskiwane i wykorzystywane w prosty sposób (tj. wymagający użycia niewielu zasobów — wysiłek fizyczny, wysiłek poznawczy, czas, pieniądze), wówczas wykorzystanie informacji jest wydajne.","w":"ZGODNE","u":"Źródło: Załącznik F (odpowiedniki kryteriów COBIT 4.1)."}},"q-pc-en2-071":{"id":"q-pc-en2-071","typ":"egzamin","s":"EN-02-18","t":"Zarząd szpitala podejmuje decyzję na podstawie raportu z hurtowni danych. Która to faza cyklu życia informacji?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 83"],"r":"A","zap":"Decyzja zarządcza na podstawie informacji = wykorzystanie.","scen":"","o":[{"t":"Udostępnianie","ok":false,"w":"Udostępnianie dostarcza informacje, a tu są już używane (s. 83)."},{"t":"Wykorzystanie","ok":true,"w":"Wykorzystanie: informacje służą do osiągnięcia celów, np. decyzji zarządczych (s. 83)."},{"t":"Przechowywanie","ok":false,"w":"Przechowywanie w hurtowni poprzedza decyzję (s. 83)."},{"t":"Ocena/monitorowanie","ok":false,"w":"To dbanie o wartość zasobu, np. czyszczenie danych (s. 83)."}],"cyt":{"s":"83","t":"Wykorzystanie — faza, w której informacje wykorzystuje się do osiągnięcia celów.","w":"ZGODNE"}},"q-pc-en2-073":{"id":"q-pc-en2-073","typ":"egzamin","s":"EN-02-19","t":"Które zastosowanie modelu informacji polega na określeniu wymagań wobec nowej aplikacji?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 84","FW-PL s. 86"],"r":"A","zap":"Model informacji: specyfikacja, wymagana ochrona, łatwość korzystania z danych.","scen":"","o":[{"t":"Określenie wymaganej ochrony","ok":false,"w":"Przykład 14 dotyczy zespołów bezpieczeństwa i zabezpieczeń (s. 84)."},{"t":"Określenie specyfikacji informacji","ok":true,"w":"Przykład 13: atrybuty z modelu informacji służą do zdefiniowania specyfikacji aplikacji i procesów (s. 84)."},{"t":"Określenie łatwości korzystania z danych","ok":false,"w":"Przykład 15 to przegląd jakości danych w procesie (s. 84)."},{"t":"Określenie poziomów usług","ok":false,"w":"Poziomy usług to praktyka aktywatora Usługi, Infrastruktura i Aplikacje (s. 86)."}],"cyt":{"s":"84","t":"Atrybuty informacji zawarte w modelu informacji mogą posłużyć do zdefiniowania specyfikacji dla aplikacji oraz procesów biznesowych, które będą wykorzystywać informacje.","w":"ZGODNE"},"przyklad":"Sytuacja: Zespół projektuje nową aplikację sklepu i na podstawie atrybutów informacji określa jej wymagania."},"q-pc-en2-075":{"id":"q-pc-en2-075","typ":"egzamin","s":"EN-02-19","t":"Które zastosowanie modelu informacji polega na ocenie kompletności i aktualności informacji w procesie?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 84","FW-PL s. 87"],"r":null,"zap":"Przegląd jakości danych w procesie = łatwość korzystania z danych.","scen":"","o":[{"t":"Określenie specyfikacji informacji","ok":false,"w":"To projektowanie nowej aplikacji (s. 84)."},{"t":"Określenie wymaganej ochrony","ok":false,"w":"To dobór zabezpieczeń (s. 84)."},{"t":"Określenie kategorii umiejętności","ok":false,"w":"To praktyka aktywatora Ludzie, Umiejętności i Kompetencje (s. 87)."},{"t":"Określenie łatwości korzystania z danych","ok":true,"w":"Przykład 15: kryteria jakości pozwalają ocenić dane przetwarzane w procesie biznesowym (s. 84)."}],"cyt":{"s":"84","t":"Kryteria jakościowe mogą zostać wykorzystane do oszacowania stopnia dostępności informacji — czy są kompletne, dostępne na czas, zgodne z faktami, istotne i dostępne w odpowiedniej ilości.","w":"ZGODNE"},"przyklad":"Sytuacja: Gmina sprawdza, czy dane w procesie wydawania decyzji są kompletne, aktualne i zrozumiałe."},"q-pc-en2-077":{"id":"q-pc-en2-077","typ":"egzamin","s":"EN-02-19","t":"Do czego testerzy mogą użyć modelu informacji?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 84","Enabling Processes s. 25"],"r":null,"zap":"Testerzy: kryteria jakości informacji → przypadki testowe.","scen":"","o":[{"t":"Do ustalenia budżetu projektu","ok":false,"w":"Przykład 13 nie mówi o budżecie (s. 84)."},{"t":"Do opracowania przypadków testowych","ok":true,"w":"Testerzy analizują kryteria jakości informacji, by opracować kompleksowy zbiór przypadków testowych (s. 84)."},{"t":"Do przypisania ról w diagramie RACI","ok":false,"w":"RACI (Responsible, Accountable, Consulted, Informed — odpowiedzialny wykonawczo, odpowiedzialny decyzyjnie, konsultowany, informowany) przypisuje role w praktykach procesu. Według podręcznika testerzy wykorzystują kryteria jakości informacji do przygotowania przypadków testowych, a nie do przypisania ról (FW-PL s. 84)."},{"t":"Do oceny zdolności procesu","ok":false,"w":"Informacja może stanowić dowód w ocenie procesu. Przykład 13 opisuje jednak opracowanie przypadków testowych, nie wyznaczenie poziomu zdolności (s. 84)."}],"cyt":{"s":"84","t":"Podczas testowania aplikacji testerzy mogą przeanalizować kryteria dotyczące jakości informacji w celu opracowania kompleksowego zbioru przypadków testowych.","w":"ZGODNE"}},"q-pc-en2-079":{"id":"q-pc-en2-079","typ":"egzamin","s":"EN-02-20","t":"Które pryncypium architektury polega na budowaniu rozwiązań ze wspólnych komponentów?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 75","FW-PL s. 82","FW-PL s. 86"],"r":"A","zap":"Wspólne komponenty = ponowne wykorzystanie.","scen":"","o":[{"t":"Spójne przedstawienie","ok":false,"w":"To kryterium jakości informacji, nie pryncypium architektury (s. 82)."},{"t":"Delegowanie uprawnień","ok":false,"w":"To praktyka Struktur organizacyjnych (s. 75)."},{"t":"Nabywanie lub samodzielne tworzenie","ok":false,"w":"To także pryncypium architektury, ale mówi, że rozwiązania należy nabywać, chyba że istnieje zatwierdzony powód, by tworzyć je samodzielnie. Nie dotyczy budowania rozwiązań ze wspólnych komponentów (FW-PL s. 86)."},{"t":"Ponowne wykorzystanie","ok":true,"w":"Ponowne wykorzystanie: wspólne komponenty używane przy projektowaniu i wdrażaniu rozwiązań (s. 86)."}],"cyt":{"s":"86","t":"Ponowne wykorzystanie — wspólne komponenty architektury powinny być wykorzystywane podczas projektowania i wdrażania rozwiązań w ramach architektury docelowej lub przejściowej.","w":"ZGODNE"},"przyklad":"Sytuacja: Bank projektuje nowy system z istniejących, wspólnych komponentów architektury."},"q-pc-en2-084":{"id":"q-pc-en2-084","typ":"egzamin","s":"EN-02-21","t":"Jaka architektura odzwierciedla kolejne etapy przejścia od architektury referencyjnej do docelowej?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 85","FW-PL s. 89"],"r":null,"zap":"Referencyjna = dziś, docelowa = przyszłość, przejściowa = etapy pomiędzy.","scen":"","o":[{"t":"Architektura referencyjna","ok":false,"w":"Opisuje aktualną zdolność usługową (s. 85)."},{"t":"Architektura docelowa","ok":false,"w":"Opisuje przyszłą lub planowaną zdolność usługową (s. 85)."},{"t":"Architektura przejściowa","ok":true,"w":"Architektura przejściowa odzwierciedla kolejne etapy prac nad architekturą docelową (s. 85)."},{"t":"Architektura aplikacji","ok":false,"w":"To logiczne grupowanie zdolności aplikacyjnych (s. 89)."}],"cyt":{"s":"85","t":"zdefiniowana może zostać także architektura przejściowa, w której odzwierciedlone będą kolejne etapy prac nad architekturą docelową przedsiębiorstwa (na podstawie architektury referencyjnej)","w":"ZGODNE"}},"q-pc-en2-094":{"id":"q-pc-en2-094","typ":"egzamin","s":"EN-02-21","t":"Co, obok aplikacji i infrastruktury, COBIT 5 wskazuje jako jedną ze zdolności usługowych?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 75","FW-PL s. 86","FW-PL s. 87"],"r":"B","zap":"Zdolności usługowe: aplikacje, infrastruktura, technologia – i informacja.","scen":"","o":[{"t":"Informacja","ok":true,"w":"Informacje stanowią jedną ze zdolności usługowych do świadczenia usług wewnętrznych i zewnętrznych (s. 86)."},{"t":"Kultura, Etyka i Zachowanie","ok":false,"w":"Kultura ma znaczenie dla budowy kultury usług. W przytoczonej relacji jako jedną ze zdolności usługowych wymieniono jednak informację (s. 86)."},{"t":"Struktury organizacyjne","ok":false,"w":"Struktury podejmują decyzje i wspierają świadczenie usług. Wskazana relacja na s. 86 dotyczy jednak informacji jako zdolności usługowej."},{"t":"Kategorie umiejętności","ok":false,"w":"Umiejętności wspierają świadczenie usług. W przytoczonym zdaniu na s. 86 jako zdolność usługową wskazano informację."}],"cyt":{"s":"86","t":"Informacje stanowią jedną ze zdolności do świadczenia usług, a zdolności te wykorzystuje się poprzez procesy pozwalające na świadczeniu usług wewnętrznych i zewnętrznych.","w":"ZGODNE"},"przyklad":"Sytuacja: Ministerstwo świadczy e-usługi obywatelom, korzystając z aplikacji, infrastruktury i informacji."},"q-pc-en2-099":{"id":"q-pc-en2-099","typ":"egzamin","s":"EN-02-22","t":"Czego jeszcze wymaga dobra praktyka, gdy dla roli opisano kategorie i poziomy umiejętności?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 76","FW-PL s. 87","FW-PL s. 88"],"r":"B","zap":"Dla każdej roli definiuje się obiektywny zestaw wymaganych umiejętności, ich kategorie i poziomy. Każdy właściwy poziom w danej kategorii powinien mieć definicję. Pomocnym zewnętrznym źródłem jest SFIA (Skills Framework for the Information Age — ramy kompetencji dla ery informacji).","scen":"","o":[{"t":"Definicji umiejętności dla każdego poziomu","ok":true,"w":"Dla każdego poziomu umiejętności w poszczególnych kategoriach powinna być dostępna definicja umiejętności (s. 87)."},{"t":"Certyfikatu SFIA dla każdego pracownika","ok":false,"w":"SFIA (Skills Framework for the Information Age — ramy kompetencji dla ery informacji) to źródło definicji, nie wymóg certyfikacji (s. 88)."},{"t":"Zatwierdzenia przez Radę ds. Architektury","ok":false,"w":"Rada ds. Architektury zajmuje się architekturą korporacyjną (s. 76)."},{"t":"Jednej kategorii wspólnej dla wszystkich ról","ok":false,"w":"Każda rola wymaga osobnego zestawu umiejętności (s. 87)."}],"przyklad":"Sytuacja: Bank opisał dla roli analityka poziomy umiejętności w kilku kategoriach. Dla analityka określono analizę biznesową na poziomie 3. Sama liczba nie wystarcza: opis poziomu powinien wyjaśniać, jakie zadania osoba potrafi wykonać i przy jakiej samodzielności.","cyt":{"s":"87","t":"Dla każdego odpowiedniego poziomu umiejętności w poszczególnych kategoriach powinna być dostępna definicja umiejętności.","w":"ZGODNE"}},"q-pc-en2-103":{"id":"q-pc-en2-103","typ":"egzamin","s":"EN-02-22","t":"Jaki cel ma okresowa ocena bazy umiejętności organizacji?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 87"],"r":null,"zap":"Baza umiejętności wymaga okresowej oceny. „Raz w roku” to przykład z podręcznika, nie bezwzględny wymóg dla każdej organizacji.","scen":"","o":[{"t":"Określa mandat i zasady działania struktur organizacyjnych","ok":false,"w":"Mandat określa powód i cel istnienia struktury. Ocena bazy umiejętności dotyczy zmian w zasobach kompetencyjnych (s.75,87)."},{"t":"Pokazuje zmianę umiejętności i zasila planowanie kolejnego okresu","ok":true,"w":"Okresowy przegląd pozwala zrozumieć zmianę bazy umiejętności i wykorzystać wyniki w planowaniu następnego okresu. Raz w roku to przykład, nie obowiązkowa częstotliwość (s.87)."},{"t":"Zastępuje definiowanie wymagań umiejętności dla poszczególnych ról","ok":false,"w":"Wymagania dla ról nadal muszą być zdefiniowane. Ocena bazy pozwala porównać dostępne umiejętności z potrzebami, nie zastępuje określenia potrzeb (s.87)."},{"t":"Wyznacza bieżący poziom zdolności wszystkich procesów","ok":false,"w":"Umiejętności są jednym z aktywatorów potrzebnych procesom, lecz ich ocena nie wyznacza automatycznie zdolności procesów. Zdolność wymaga oceny wyników i atrybutów procesu (s.42–46,87)."}],"cyt":{"s":"87","t":"Okresowo (np. raz w roku) przedsiębiorstwo musi ocenić bazę umiejętności w celu zrozumienia zmiany, która nastąpiła. Zostanie ona włączona do procesu planowania w odniesieniu do kolejnego okresu.","w":"ZGODNE"}},"q-pc-en2-112":{"id":"q-pc-en2-112","typ":"egzamin","s":"EN-02-23","t":"Do której domeny należy kategoria umiejętności „monitorowanie wydajności (sprawności)”?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 88"],"r":"B","zap":"Według Rysunku 39: EDM (Evaluate, Direct and Monitor — Oszacuj, Kieruj i Monitoruj): Ład nad informatyką w organizacji. MEA (Monitor, Evaluate and Assess — Monitoruj, Oszacuj i Oceń): weryfikacja zgodności, monitorowanie wydajności/sprawności i audyt mechanizmów kontrolnych. To przykładowe kategorie umiejętności, nie wyłączność wykonywania każdego takiego zadania w danej domenie.","scen":"","o":[{"t":"MEA","ok":true,"w":"Rysunek 39: monitorowanie sprawności to kategoria domeny MEA (s. 88)."},{"t":"EDM","ok":false,"w":"EDM (Evaluate, Direct and Monitor — Oszacuj, Kieruj i Monitoruj) też monitoruje, ale jego kategoria to Ład nad IT (s. 88)."},{"t":"DSS","ok":false,"w":"DSS (Deliver, Service and Support — Dostarczaj, Obsługuj i Wspieraj) to obsługa i wsparcie (s. 88)."},{"t":"BAI","ok":false,"w":"BAI (Build, Acquire and Implement — Twórz, Nabywaj i Wdrażaj) to budowanie i wdrażanie (s. 88)."}],"przyklad":"Sytuacja: Szpital szuka osoby do monitorowania wydajności (sprawności) IT. Osoba sprawdzająca zgodność usługi, analizująca wyniki i audytująca mechanizmy kontrolne korzysta z kategorii umiejętności przypisanych w Rysunku 39 do MEA. Członkowie organu Ładu potrzebują umiejętności Ładu nad informatyką, wskazanych przy EDM.","cyt":{"s":"88","t":"Monitorowanie, ocena i oszacowanie (MEA) • Weryfikacja zgodności • Monitorowanie sprawności","w":"ZGODNE"}},"q-pc-en2-119":{"id":"q-pc-en2-119","typ":"egzamin","s":"EN-02-24","t":"Który element opisu procesu zawiera etykietę, nazwę, obszar i domenę procesu?","k":false,"st":"autorskie","src":"","z":["PeopleCert Syllabus — EN-02-24","FW-PL s. 32","FW-PL s. 70","Enabling Processes s. 25"],"r":null,"zap":"Identyfikacja = etykieta, nazwa, obszar, domena.","scen":"","o":[{"t":"Przeznaczenie procesu","ok":false,"w":"Przeznaczenie mówi, po co proces istnieje (sylabus EN-02-24 (Procesy umożliwiające))."},{"t":"Szczegóły praktyk","ok":false,"w":"Szczegóły praktyk to wejścia, wyjścia i działania (sylabus EN-02-24 (Procesy umożliwiające); s. 70)."},{"t":"Identyfikacja procesu","ok":true,"w":"Identyfikacja procesu: etykieta (np. APO12), nazwa, obszar (Ład/Zarządzanie) i domena (sylabus EN-02-24 (Procesy umożliwiające); obszary s. 32)."},{"t":"Powiązane wytyczne","ok":false,"w":"To odniesienia do innych standardów (sylabus EN-02-24 (Procesy umożliwiające))."}],"cyt":{"s":"","t":"","w":"BRAK_W_FW","u":"Elementu „Identyfikacja procesu” (etykieta, nazwa, obszar, domena) nie ma w FW-PL; pochodzi z opisu procesu w przewodniku COBIT 5: Enabling Processes (sylabus EN-02-24)."}},"q-pc-en2-122":{"id":"q-pc-en2-122","typ":"egzamin","s":"EN-02-24","t":"Która część opisu procesu wskazuje inne standardy i metodyki odnoszące się do procesu?","k":false,"st":"autorskie","src":"","z":["PeopleCert Syllabus — EN-02-24","FW-PL s. 69","FW-PL s. 70","Enabling Processes s. 25"],"r":"B","zap":"Inne standardy = powiązane wytyczne.","scen":"","o":[{"t":"Powiązane wytyczne","ok":true,"w":"Powiązane wytyczne wskazują inne standardy i metodyki związane z procesem (sylabus EN-02-24 (Procesy umożliwiające))."},{"t":"Identyfikacja procesu","ok":false,"w":"Zawiera etykietę, nazwę, obszar i domenę (sylabus EN-02-24 (Procesy umożliwiające))."},{"t":"Szczegóły praktyk","ok":false,"w":"Zawierają wejścia, wyjścia i działania (sylabus EN-02-24 (Procesy umożliwiające); s. 70)."},{"t":"Informacje kaskady celów","ok":false,"w":"Podają cele związane z informatyką i ich mierniki (sylabus EN-02-24 (Procesy umożliwiające); s. 69)."}],"cyt":{"s":"70","t":"dodatkowe wytyczne można znaleźć w powiązanych standardach i metodykach wskazanych w szczegółowych opisach procesów.","w":"BRAK_W_FW","u":"Nazwa części „Powiązane wytyczne” pochodzi z COBIT 5: Enabling Processes; FW-PL w przypisie 14 tylko wspomina o standardach wskazanych w opisach procesów."},"przyklad":"Sytuacja: Kierownik w banku sprawdza, które standardy zewnętrzne odnoszą się do procesu APO13."},"q-pc-en2-134":{"id":"q-pc-en2-134","typ":"egzamin","s":"EN-02-25","t":"Co NIE jest zgodne z zasadami diagramu RACI?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 89","FW-PL s. 90","FW-PL s. 92","FW-PL s. 93","Enabling Processes s. 25"],"r":"B","zap":"RACI: jedna rola A dla danego zakresu zadania; wielu R jest możliwych. Wyższe szczeble zachowują rozliczalność, a A może też działać operacyjnie.","scen":"","o":[{"t":"Kilka ról R przy jednym działaniu","ok":false,"w":"Dopuszczalne: wykonawców może być wielu (s. 93)."},{"t":"A otrzymuje informacje o realizacji zadania","ok":false,"w":"Zgodne: rola A (Accountable — odpowiedzialny decyzyjnie) zawsze powinna je otrzymywać (s. 92)."},{"t":"C dostarcza dane wejściowe do zadania","ok":false,"w":"Zgodne: tak działa Konsultant (s. 90)."},{"t":"Dwie role A przy jednym działaniu","ok":true,"w":"Dla danego zakresu zadania nie dzieli się ostatecznej rozliczalności: należy wskazać jedną rolę A (Accountable — odpowiedzialny decyzyjnie). EP s. 25 dopuszcza przy tym wyższe szczeble rozliczalności i przekazywanie jej na najniższy właściwy poziom; A (Accountable — odpowiedzialny decyzyjnie) może także wykonywać pracę."}],"cyt":{"s":"89","t":"Osoba, grupa lub jednostka ostatecznie odpowiedzialna za daną kwestię, proces lub zakres.","w":"BRAK_W_FW","u":"FW-PL nie formułuje zasady jednej roli A na działanie; pochodzi z COBIT 5: Enabling Processes (s. 25) / sylabusa."}},"q-pc-en2-141":{"id":"q-pc-en2-141","typ":"egzamin","s":"EN-02-25","t":"Jaką rolę w diagramie RACI ma osoba, której opinii zasięga się przy wykonaniu zadania?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 89","FW-PL s. 90","FW-PL s. 92","FW-PL s. 93"],"r":null,"zap":"Opiniuje = C; wykonuje = R; za sukces = A; dostaje raport = I.","scen":"","o":[{"t":"Odpowiedzialny decyzyjnie (A)","ok":false,"w":"A (odpowiedzialny decyzyjnie) to rola ostatecznie rozliczana za powodzenie zadania, a nie ta, której opinii się zasięga (FW-PL s. 89)."},{"t":"Konsultant (C)","ok":true,"w":"C (konsultowany) to osoba, której opinii zasięga się na temat działania; komunikacja jest dwukierunkowa, a C zapewnia dane wejściowe (FW-PL s. 90)."},{"t":"Odpowiedzialny wykonawczo (R)","ok":false,"w":"R (odpowiedzialny wykonawczo) to rola najbardziej zaangażowana operacyjnie w wykonanie działania, a nie opiniująca (FW-PL s. 93)."},{"t":"Informowany (I)","ok":false,"w":"I (informowany) otrzymuje informacje o postępach i efektach; komunikacja jest jednokierunkowa, bez zasięgania opinii (FW-PL s. 92)."}],"cyt":{"s":"90","t":"Odnosi się do osób, u których zasięga się opinii na temat danego działania (komunikacja dwukierunkowa). W tabeli RACI odpowiada na pytanie: Kto zapewnia dane wejściowe?","w":"ZGODNE"},"przyklad":"Sytuacja: Bank migruje dane: dyrektor IT odpowiada za sukces (A), zespół wykonuje migrację (R), dział ryzyka ją opiniuje (C), zarząd dostaje raport (I)."},"q-pc-impc-001":{"id":"q-pc-impc-001","typ":"egzamin","s":"IM-01-01","t":"Które trzy wzajemnie powiązane komponenty tworzą cykl życia wdrożenia?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 37","FW-PL s. 38, Rys. 17"],"r":"B","zap":"Trzy pierścienie: zarządzanie programem, aktywowanie zmiany, ciągłe doskonalenie.","scen":"","o":[{"t":"Oszacuj, Kieruj i Monitoruj","ok":false,"w":"To trzy rodzaje działań Ładu (domena EDM (Evaluate, Direct and Monitor — Oszacuj, Kieruj i Monitoruj), s. 32), a nie komponenty cyklu wdrożenia (s. 37)."},{"t":"Planowanie, wdrażanie i ocena zdolności procesów","ok":false,"w":"Te działania mogą występować w inicjatywie wdrożenia. Nie są jednak trzema nazwami komponentów Rysunku 17: program, aktywowanie zmiany, ciągłe doskonalenie (s. 37–38)."},{"t":"Program, aktywowanie zmiany i ciągłe doskonalenie","ok":true,"w":"Trzy komponenty to zarządzanie programem, aktywowanie zmiany (change enablement) oraz podstawowy cykl ciągłego doskonalenia. Współdziałają w siedmiu fazach. Doskonalenie ma charakter iteracyjny, a przegląd fazy 7 może wskazać następną potrzebę działania (s. 37–38)."},{"t":"Zarządzanie programem, ryzykiem i dostawcami","ok":false,"w":"Tylko pierwszy element jest pierścieniem. Ryzyko i dostawcy to obszary procesów, nie komponenty cyklu (s. 37)."}],"cyt":{"s":"37","t":"Trzy wzajemnie powiązane komponenty cyklu życia: 1. Podstawowy cykl życia ciągłego doskonalenia — nie jest to projekt jednorazowy. 2. Wdrożenie zmiany — uwzględnienie aspektów związanych z zachowaniem i kulturą. 3. Zarządzanie programem.","w":"ZGODNE","u":"Podręcznik: „wdrożenie zmiany” / „umożliwienie zmian” (egzamin: aktywowanie zmiany)."}},"q-pc-impc-008":{"id":"q-pc-impc-008","typ":"egzamin","s":"IM-01-01","t":"Który komponent cyklu życia wdrożenia obejmuje sponsora, zasoby, role i harmonogram?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 36","FW-PL s. 39","FW-PL s. 38, Rys. 17"],"r":"A","zap":"Sponsor, zasoby, role, harmonogram → pierścień zarządzania programem.","scen":"","o":[{"t":"Pierścień aktywowania zmiany","ok":false,"w":"Ten pierścień dotyczy ludzi, zachowań i kultury (s. 37)."},{"t":"Pierścień ciągłego doskonalenia","ok":false,"w":"Ten pierścień ulepsza same aktywatory: ocena stanu, usprawnienia, pomiar (s. 37–38)."},{"t":"Cykl życia aktywatora","ok":false,"w":"To wymiar modelu aktywatora (s. 29), a nie komponent cyklu wdrożenia."},{"t":"Pierścień zarządzania programem","ok":true,"w":"Zasoby, role i odpowiedzialności w programie (s. 36) oraz sponsor (s. 39) to zadania pierścienia zewnętrznego (rys. 17, s. 38)."}],"cyt":{"s":"36","t":"Po uzyskaniu zaangażowania konieczne jest zapewnienie odpowiednich zasobów umożliwiających realizację programu. Należy zdefiniować i przydzielić kluczowe role oraz zakresy odpowiedzialności w programie.","w":"ZGODNE"},"przyklad":"Sytuacja: Bank powołał sponsora wdrożenia, przydzielił zasoby, role i harmonogram projektów."},"q-pc-impc-013":{"id":"q-pc-impc-013","typ":"egzamin","s":"IM-02-01","t":"Które stwierdzenie o planach wdrożenia COBIT 5 w różnych organizacjach jest prawdziwe?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 35"],"r":null,"zap":"Każda organizacja tworzy własny plan, dopasowany do swojego kontekstu.","scen":"","o":[{"t":"Administracja stosuje osobną wersję COBIT 5","ok":false,"w":"Podręcznik nie dzieli COBIT 5 na wersje sektorowe; mówi o dopasowaniu do kontekstu (s. 35)."},{"t":"Wytyczne podają jeden obowiązkowy plan","ok":false,"w":"Odwrotnie: COBIT 5 — Wdrożenie nie ma charakteru normatywnego (s. 35)."},{"t":"Każda organizacja dopasowuje plan do kontekstu","ok":true,"w":"Każda organizacja projektuje własny plan lub mapę działań, uwzględniając czynniki środowiska, np. przepisy i kulturę (s. 35)."},{"t":"Tylko firmy przygotowują uzasadnienie biznesowe","ok":false,"w":"Uzasadnienie biznesowe dotyczy każdej inicjatywy wdrożeniowej (s. 39)."}],"cyt":{"s":"35","t":"Każde przedsiębiorstwo musi zaprojektować własny plan wdrożenia lub mapę działań, uwzględniając poniższe czynniki związane ze środowiskiem wewnętrznym i zewnętrznym przedsiębiorstwa","w":"ZGODNE"},"przyklad":"Sytuacja: Ministerstwo i sklep internetowy wdrażają COBIT 5 – ich plany wdrożenia będą się różnić."},"q-pc-impc-017":{"id":"q-pc-impc-017","typ":"egzamin","s":"IM-02-01","t":"Co jest szczególnie ważne przy niejasnym modelu funkcjonowania i braku aktywatorów Ładu?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 36"],"r":"A","zap":"W niekorzystnym środowisku wsparcie interesariuszy jest jeszcze ważniejsze.","scen":"","o":[{"t":"Pominięcie uzasadnienia biznesowego, by szybciej ruszyć","ok":false,"w":"Cele i korzyści trzeba przedstawić w uzasadnieniu biznesowym od początku (s. 36, 39)."},{"t":"Wsparcie i uczestnictwo kluczowych interesariuszy","ok":true,"w":"W niekorzystnym środowisku wsparcie i uczestnictwo interesariuszy są jeszcze istotniejsze (s. 36)."},{"t":"Ocena wszystkich procesów na poziomie 5 przed startem","ok":false,"w":"Poziom docelowy wybiera się z rachunku kosztów i korzyści i rzadko jest najwyższy (s. 42–43)."},{"t":"Przekazanie całej inicjatywy dostawcy zewnętrznemu","ok":false,"w":"Podręcznik wskazuje na wsparcie i kierunek ze strony interesariuszy organizacji (s. 36)."}],"cyt":{"s":"36","t":"W przypadku przedsiębiorstw działających w niekorzystnym środowisku (np. gdy ogólny model funkcjonowania przedsiębiorstwa jest niejasny lub brak czynników umożliwiających nadzór na poziomie przedsiębiorstwa) tego rodzaju wsparcie i uczestnictwo są jeszcze istotniejsze.","w":"ZGODNE"},"przyklad":"Sytuacja: Gmina ma niejasny model funkcjonowania i brak aktywatorów Ładu na poziomie całej organizacji."},"q-pc-impc-024":{"id":"q-pc-impc-024","typ":"egzamin
