 — PC-02-06"],"r":"B","zap":"Do poziomu 2 potrzebne PA 1.1 = P oraz PA 2.1 i 2.2 na W/P.","scen":"","o":[{"t":"Podnieść ocenę PA 2.1 do P","ok":false,"w":"Dla atrybutów poziomu 2 wystarczy W (s. 42)."},{"t":"Nic – proces ma już poziom 2","ok":false,"w":"PA (Process Attribute — atrybut procesu) 1.1 = W to za mało, by wejść na poziom 2 (s. 42)."},{"t":"Podnieść wszystkie trzy atrybuty do P","ok":false,"w":"Pełne osiągnięcie wszystkich trzech również spełniłoby warunek. Nie jest to jednak zmiana minimalna: PA (Process Attribute — atrybut procesu) 2.1 już ma wystarczające W, a PA 2.2 ma P (s. 42)."},{"t":"Podnieść ocenę PA 1.1 do P","ok":true,"w":"Poziom 2 wymaga PA (Process Attribute — atrybut procesu) 1.1 = P; PA 2.1 = W i PA 2.2 = P już wystarczą (s. 42)."}],"cyt":{"s":"42","t":"Każdy z poziomów potencjału może zostać osiągnięty tylko wtedy, gdy w pełni uzyskano niższy poziom.","w":"ZGODNE"}},"q-pc-pr-004":{"id":"q-pc-pr-004","typ":"egzamin","s":"PR-01-01","t":"Którą zasadę realizuje objęcie Ładem także usług IT zewnętrznych dostawców?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 14","FW-PL s. 23"],"r":"A","zap":"Zasada 2 — Pokrycie całej organizacji: Ład IT (Information Technology — technologie informacyjne) jest częścią Ładu organizacji; obejmuje wszystkie istotne funkcje, procesy oraz wewnętrzne i zewnętrzne usługi IT. Informacja i technologia są aktywami organizacji, a nie wyłączną sprawą działu IT.","scen":"","o":[{"t":"Zastosowanie Pojedynczej Zintegrowanej Struktury Ramowej","ok":false,"w":"Zasada 3 dotyczy spójności z innymi standardami, nie zasięgu Ładu (s. 25)."},{"t":"Realizacja potrzeb interesariusza","ok":false,"w":"Zasada 1 dotyczy tworzenia wartości i Kaskady Celów (s. 14)."},{"t":"Pokrycie całej organizacji","ok":true,"w":"Zasada 2 obejmuje wszystkie istotne funkcje i procesy organizacji oraz usługi informatyczne dostarczane wewnętrznie i zewnętrznie. Ład nad informacją i technologią jest częścią Ładu całej organizacji, a informację i technologię traktuje się jako aktywa organizacji."},{"t":"Oddzielenie Ładu od Zarządzania","ok":false,"w":"Zasada 5 rozdziela działania Ładu i Zarządzania, nie określa zasięgu (s. 14)."}],"cyt":{"s":"23","t":"metodyka COBIT 5 uwzględnia wszystkie istotne wewnętrzne i zewnętrzne usługi IT, a także wewnętrzne i zewnętrzne procesy biznesowe.","w":"ZGODNE","u":"Podręcznik: Zasada 2 „Uwzględnienie wszystkich aspektów działania przedsiębiorstwa” (egzamin: Pokrycie całej organizacji)."},"przyklad":"Sytuacja: Ministerstwo obejmuje Ładem także usługi IT zewnętrznych dostawców."},"q-pc-pr-005":{"id":"q-pc-pr-005","typ":"egzamin","s":"PR-01-01","t":"Uzupełnij nazwę zasady: Zastosowanie Pojedynczej [?] Struktury Ramowej.","k":false,"st":"autorskie","src":"","z":["FW-PL s. 14","FW-PL s. 25"],"r":"B","zap":"Zasada 3: Zastosowanie Pojedynczej Zintegrowanej Struktury Ramowej.","scen":"","o":[{"t":"Zintegrowanej","ok":true,"w":"Pełna nazwa Zasady 3: Zastosowanie Pojedynczej Zintegrowanej Struktury Ramowej (s. 14, 25)."},{"t":"Holistycznej","ok":false,"w":"„Holistyczne” pochodzi z Zasady 4 – Aktywacja holistycznego podejścia (s. 14)."},{"t":"Całościowej","ok":false,"w":"„Całościowe” to podręcznikowe słowo z nazwy Zasady 4, nie Zasady 3 (s. 14)."},{"t":"Nadrzędnej","ok":false,"w":"COBIT 5 może być strukturą nadrzędną, ale nazwa zasady mówi „Zintegrowanej” (s. 25)."}],"cyt":{"s":"14","t":"Zasada 3: Stosowanie jednej zintegrowanej metodyki","w":"ZGODNE","u":"Podręcznik: „Stosowanie jednej zintegrowanej metodyki” (egzamin: Zastosowanie Pojedynczej Zintegrowanej Struktury Ramowej)."}},"q-pc-pr-014":{"id":"q-pc-pr-014","typ":"egzamin","s":"PR-01-02","t":"Który element NIE jest kategorią aktywatora COBIT 5?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 27"],"r":"B","zap":"7 aktywatorów: zasady/polityki, procesy, struktury, kultura, informacja, usługi, ludzie.","scen":"","o":[{"t":"Struktury organizacyjne","ok":false,"w":"To aktywator nr 3 (s. 27)."},{"t":"Procesy","ok":false,"w":"To aktywator mego aktywatora."},{"t":"Jego poziom dojrzałości","ok":false,"w":"Można oceniać różne właściwości aktywatora, ale wskazany podział dotyczy oczekiwanych wyników oraz jego zastosowania. Pojęcie dojrzałości nie jest zastrzeżone wyłącznie dla COBIT 4.1."},{"t":"Zastosowanie samego aktywatora","ok":true,"w":"Cele mogą dotyczyć oczekiwanych wyników lub zastosowania aktywatora (s. 29)."}],"cyt":{"s":"29","t":"oczekiwane wyniki wykorzystania czynników umożliwiających; – zastosowanie lub wykorzystanie samego czynnika umożliwiającego.","w":"ZGODNE"}},"q-pc-pr-148":{"id":"q-pc-pr-148","typ":"egzamin","s":"PR-02-13","t":"Jakim wskaźnikiem aktywatora jest odsetek klientów zadowolonych z usługi?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 29"],"r":"B","zap":"Zadowolenie (rezultat) = wskaźnik opóźniony.","scen":"","o":[{"t":"Opóźniony – mierzy osiągnięty rezultat","ok":true,"w":"Zadowolenie klientów pokazuje, czy osiągnięto cel – wskaźnik opóźniony (s. 29)."},{"t":"Wiodący – mierzy stosowanie dobrych praktyk","ok":false,"w":"Tu mierzymy rezultat, nie praktyki (s. 29)."},{"t":"Wiodący – mierzy cykl życia","ok":false,"w":"Tu mierzymy rezultat, nie cykl życia (s. 29)."},{"t":"Ani wiodący, ani opóźniony","ok":false,"w":"Mierniki aktywatora są wiodące albo opóźnione (s. 29)."}],"cyt":{"s":"29","t":"Mierniki pozwalające na określenie stopnia, w jakim osiągnięto cele, można nazwać „wskaźnikami następującymi”.","w":"ZGODNE","u":"Wskaźnik opóźniony (egzamin) = wskaźnik następujący (podręcznik)."},"przyklad":"Sytuacja: Bank mierzy odsetek klientów zadowolonych z portalu."},"q-pc-pr-163":{"id":"q-pc-pr-163","typ":"egzamin","s":"PR-02-14","t":"Dyrektor IT ministerstwa przygotowuje plan wdrożenia systemu kadrowego. To działanie z obszaru…","k":false,"st":"autorskie","src":"","z":["FW-PL s. 31"],"r":"B","zap":"Planowanie wdrożenia = Zarządzanie.","scen":"","o":[{"t":"Zarządzania","ok":true,"w":"Planowanie i budowanie zgodnie z kierunkiem to Zarządzanie (s. 31)."},{"t":"Organu Ładu i nadzoru","ok":false,"w":"Organ Ładu wyznacza kierunek (s. 24)."},{"t":"Interesariuszy","ok":false,"w":"Interesariusze delegują (s. 24)."},{"t":"Ładu","ok":false,"w":"Ład ocenia, kieruje i monitoruje (s. 31)."}],"cyt":{"s":"31","t":"Zarządzanie polega na planowaniu, budowaniu, realizacji i monitorowaniu działań w sposób spójny z kierunkiem wskazanym przez organ nadzorujący, aby osiągnąć cele przedsiębiorstwa.","w":"ZGODNE"}},"q-pc-pr-174":{"id":"q-pc-pr-174","typ":"egzamin","s":"PR-02-15","t":"Którego aktywatora dotyczy interakcja: organ Ładu ustala apetyt na ryzyko, a kierownictwo decyduje o zabezpieczeniach?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 31"],"r":"B","zap":"Decyzje struktur Ładu ↔ decyzje wdrożeniowe = Struktury organizacyjne.","scen":"","o":[{"t":"Informacja","ok":false,"w":"Informacja to wejścia i wyjścia procesów (s. 31)."},{"t":"Struktury organizacyjne","ok":true,"w":"Interakcja decyzji struktur Ładu (np. apetyt na ryzyko) z decyzjami wdrożeniowymi (s. 31)."},{"t":"Kultura, Etyka i Zachowanie","ok":false,"w":"Kultura to przykład dawany odgórnie (s. 31)."},{"t":"Procesy","ok":false,"w":"Procesy to praktyki, działania i RACI (Responsible, Accountable, Consulted, Informed — Odpowiedzialny, Rozliczany, Konsultowany, Informowany) (s. 31)."}],"cyt":{"s":"31","t":"istnieje interakcja między decyzjami podejmowanymi przez struktury nadzoru — np. decyzjami dotyczącymi portfela inwestycyjnego oraz określania apetytu na ryzyko w przedsiębiorstwie — oraz decyzjami i operacjami, które dotyczą wdrożenia.","w":"ZGODNE","u":"Zdanie z wiersza „Struktury organizacyjne” Ilustracji 14."},"przyklad":"Sytuacja: Rada banku ustala apetyt na ryzyko, a kierownictwo podejmuje decyzje wdrożeniowe o zabezpieczeniach."},"fz-A-001":{"id":"fz-A-001","typ":"egzamin","s":"PR-02-01","t":"Czym jest COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 13","FW-PL s. 14","FW-PL s. 41"],"r":null,"zap":"","scen":"","o":[{"t":"Normą oceny zdolności procesów informatycznych","ok":false,"w":"Norma ISO/IEC (International Organization for Standardization / International Electrotechnical Commission — Międzynarodowa Organizacja Normalizacyjna / Międzynarodowa Komisja Elektrotechniczna) 15504 opisuje ocenę procesów i stanowi podstawę klasycznego modelu zdolności COBIT 5. Sam COBIT 5 jest szerszą strukturą ramową Ładu i Zarządzania IT (Information Technology — technologie informacyjne)."},{"t":"Strukturą ramową Ładu i Zarządzania IT w organizacji","ok":true,"w":"COBIT 5 jest kompleksową strukturą ramową Ładu i Zarządzania IT (Information Technology — technologie informacyjne) w organizacji. Pomaga tworzyć wartość przez równoważenie korzyści, ryzyka i wykorzystania zasobów; nie ogranicza się do jednej metody oceny lub jednego obszaru operacyjnego."},{"t":"Zbiorem praktyk bieżącego zarządzania usługami IT","ok":false,"w":"Bieżące zarządzanie usługami jest jednym z obszarów objętych COBIT 5, ale nie wyczerpuje jego zakresu. COBIT 5 obejmuje również Ład, planowanie, budowę rozwiązań oraz monitorowanie w całej organizacji."},{"t":"Metodyką prowadzenia programów i projektów IT","ok":false,"w":"Prowadzenie programów i projektów jest przedmiotem jednego z procesów Zarządzania. COBIT 5 nie jest metodyką zarządzania projektami zastępującą PRINCE2 (Projects in Controlled Environments — projekty w kontrolowanych środowiskach); może integrować takie szczegółowe metody."}],"fz":{"h":"Struktura ramowa","p":"P2","pulapka":false,"n":"≠ TŁUMACZENIE · egzamin: struktura ramowa · podr.: metodyka · EN: business framework · EN: Business framework for the governance and management of enterprise IT (Information Technology — technologie informacyjne)","q":"Czym jest COBIT 5?","a":"Kompleksową strukturą ramową (podr. metodyką) Ładu i Zarządzania IT (Information Technology — technologie informacyjne) w organizacji. Pomaga uzyskać optymalną wartość z IT przez równowagę korzyści, ryzyka i wykorzystania zasobów.","ex":"W domu rodzice ustalają, na co idą pieniądze (Ład), a ktoś robi codzienne zakupy i naprawy (Zarządzanie). COBIT 5 podpowiada jedno i drugie dla IT (Information Technology — technologie informacyjne).","org":""},"cyt":{"s":"13","t":"COBIT 5 stanowi kompleksową metodykę ułatwiającą przedsiębiorstwom osiągnięcie założonych celów w zakresie nadzoru nad technologiami informatycznymi w przedsiębiorstwie i zarządzania nimi.","w":"ZGODNE","u":"Struktura ramowa = metodyka, Ład = nadzór."}},"fz-A-002":{"id":"fz-A-002","typ":"egzamin","s":"PR-02-11","t":"Dla jakich organizacji przeznaczony jest COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 13"],"r":null,"zap":"","scen":"","o":[{"t":"Dla organizacji komercyjnych o rozwiniętym systemie ładu korporacyjnego","ok":false,"w":"COBIT 5 może być stosowany w organizacji komercyjnej, ale jego przeznaczenie nie jest ograniczone do takiego sektora ani do określonego stopnia rozwoju Ładu."},{"t":"Dla organizacji publicznych o formalnej strukturze hierarchicznej","ok":false,"w":"Sektor publiczny również może korzystać z COBIT 5. Charakter ogólny frameworka nie uzależnia jego stosowania od formalnej hierarchii ani nie ogranicza go do administracji."},{"t":"Dla organizacji informatycznych świadczących usługi klientom zewnętrznym","ok":false,"w":"Firma informatyczna świadcząca usługi zewnętrzne jest jednym z możliwych użytkowników. COBIT 5 obejmuje również organizacje innych branż i organizacje korzystające z informatyki na własne potrzeby."},{"t":"Dla organizacji dowolnej wielkości i sektora","ok":true,"w":"COBIT 5 ma charakter ogólny: jest przeznaczony dla organizacji każdej wielkości, komercyjnych, non-profit i publicznych. Każda dostosowuje go do własnego kontekstu."}],"fz":{"h":"Przeznaczenie COBIT 5","p":"P2","pulapka":false,"n":"egzamin: ogólny, każda wielkość · podr.: ogólny, każda wielkość · EN: generic, all sizes · EN: Generic, for all sizes, commercial, not-for-profit, public sector","q":"Dla jakich organizacji przeznaczony jest COBIT 5?","a":"Dla organizacji każdej wielkości: komercyjnych, non-profit i z sektora publicznego. Ma charakter ogólny.","ex":"Pasuje wszędzie: od osiedlowego sklepu po urząd i straż pożarną. Haczyk: „ogólny” znaczy rozmiar uniwersalny, każdy dopasowuje go do siebie.","org":"sklep internetowy i komenda straży pożarnej korzystają z tego samego modelu."},"cyt":{"s":"13","t":"Metodyka COBIT 5 ma charakter ogólny i może zostać z powodzeniem wykorzystana w przedsiębiorstwach każdej wielkości, niezależnie od tego, czy mają charakter komercyjny, działają na zasadach not-for-profit, czy też należą do sektora publicznego.","w":"ZGODNE"}},"fz-A-004":{"id":"fz-A-004","typ":"egzamin","s":"PR-02-01","t":"Który z poniższych NIE jest korzyścią, do której dążą organizacje stosujące COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 13","FW-PL s. 17"],"r":null,"zap":"","scen":"","o":[{"t":"Wysoka jakość informacji wspierającej decyzje","ok":false,"w":"To jedna z korzyści, do których dążą organizacje: utrzymanie wysokiej jakości informacji wspierających podejmowanie decyzji biznesowych (FW-PL s. 13)."},{"t":"Optymalizacja kosztów usług i technologii IT","ok":false,"w":"To jedna z korzyści, do których dążą organizacje: optymalizacja kosztu usług oraz technologii IT (FW-PL s. 13)."},{"t":"Zgodność z przepisami, umowami i politykami","ok":false,"w":"To jedna z korzyści, do których dążą organizacje: zapewnienie zgodności z przepisami, regulacjami, zobowiązaniami umownymi oraz politykami (FW-PL s. 13)."},{"t":"Minimalizacja ryzyka IT bez oceny korzyści i zasobów","ok":true,"w":"COBIT 5 dąży do utrzymania ryzyka na poziomie akceptowalnym przy realizacji korzyści i właściwym wykorzystaniu zasobów. Sama minimalizacja ryzyka, bez uwzględnienia korzyści i zasobów, nie opisuje oczekiwanej równowagi wartości."}],"fz":{"h":"Korzyści stosowania","p":"P2","pulapka":false,"n":"egzamin: korzyści · podr.: korzyści · EN: benefits · EN: Benefits: information quality, value, operational excellence, acceptable IT (Information Technology — technologie informacyjne) risk, cost optimisation, compliance","q":"Do czego dążą organizacje, stosując COBIT 5 (korzyści)?","a":"Wysoka jakość informacji do decyzji; wartość biznesowa z inwestycji wspieranych przez IT (Information Technology — technologie informacyjne); sprawność operacyjna; ryzyko IT na akceptowalnym poziomie; optymalizacja kosztów usług i technologii IT; zgodność z przepisami, umowami i politykami.","ex":"Jak przy remoncie: dobre informacje do decyzji, remont się opłaca, ekipa sprawna, ryzyko pod kontrolą, koszty rozsądne i wszystko zgodne z prawem.","org":"krótsze przerwy usług krytycznych przy tym samym budżecie."},"cyt":{"s":"13","t":"Utrzymania ryzyka związanego z IT na akceptowalnym poziomie.","w":"ZGODNE","u":"Na liście s. 13 jest utrzymanie ryzyka na akceptowalnym poziomie, nie jego minimalizacja bez oceny korzyści i zasobów."}},"fz-A-005":{"id":"fz-A-005","typ":"egzamin","s":"PR-01-03,PR-01-04","t":"Ile procesów zawiera Referencyjny Model Procesu COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 32","FW-PL s. 33","Altkom — Różnice tłumaczenia PL, s. 1"],"r":null,"zap":"","scen":"","o":[{"t":"34","ok":false,"w":"34 procesy miał COBIT 4.1, nie COBIT 5."},{"t":"32","ok":false,"w":"32 to liczba procesów samego Zarządzania (APO (Align, Plan and Organise — Dostosuj, Planuj i Organizuj), BAI (Build, Acquire and Implement — Twórz, Nabywaj i Wdrażaj), DSS (Deliver, Service and Support — Dostarczaj, Obsługuj i Wspieraj), MEA (Monitor, Evaluate and Assess — Monitoruj, Oszacuj i Oceń))."},{"t":"37","ok":true,"w":"37 procesów: Ład — EDM (Evaluate, Direct and Monitor — Oszacuj, Kieruj i Monitoruj), 5; Zarządzanie — APO (Align, Plan and Organise — Dostosuj, Planuj i Organizuj), 13; BAI (Build, Acquire and Implement — Twórz, Nabywaj i Wdrażaj), 10; DSS (Deliver, Service and Support — Dostarczaj, Obsługuj i Wspieraj), 6; MEA (Monitor, Evaluate and Assess — Monitoruj, Oszacuj i Oceń), 3. Razem 5 + 13 + 10 + 6 + 3 = 37; część Zarządzania ma 32 procesy."},{"t":"40","ok":false,"w":"40 celów ma COBIT 2019, a egzamin dotyczy COBIT 5."}],"fz":{"h":"Liczba procesów","p":"P1","pulapka":false,"n":"PRM — Process Reference Model — Referencyjny Model Procesu. Pięć domen, 37 procesów.","q":"Ile procesów ma COBIT 5 i jak się rozkładają?","a":"37 procesów: Ład — EDM (Evaluate, Direct and Monitor — Oszacuj, Kieruj i Monitoruj), 5; Zarządzanie — APO (Align, Plan and Organise — Dostosuj, Planuj i Organizuj), 13; BAI (Build, Acquire and Implement — Twórz, Nabywaj i Wdrażaj), 10; DSS (Deliver, Service and Support — Dostarczaj, Obsługuj i Wspieraj), 6; MEA (Monitor, Evaluate and Assess — Monitoruj, Oszacuj i Oceń), 3. Razem 5 + 13 + 10 + 6 + 3 = 37; część Zarządzania ma 32 procesy.","ex":"Ciąg liczb 5-13-10-6-3. Ład ma 5 (jak palce ręki), Zarządzanie 32; razem 37, czyli o trzy więcej niż 34 w COBIT 4.1.","org":""},"cyt":{"s":"33","t":"Na ilustracji 16 przedstawiono pełny zestaw 37 procesów nadzoru i zarządzania w ramach metodyki COBIT 5.","w":"ZGODNE","u":"Podział na domeny (EDM 5, APO 13, BAI 10, DSS 6, MEA 3) wynika z wyliczenia na Ilustracji 16."}},"fz-A-006":{"id":"fz-A-006","typ":"egzamin","s":"PR-01-04","t":"Która domena COBIT 5 ma 13 procesów?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 33"],"r":null,"zap":"","scen":"","o":[{"t":"APO","ok":true,"w":"APO ma 13 procesów – najwięcej ze wszystkich domen."},{"t":"BAI","ok":false,"w":"BAI ma 10 procesów."},{"t":"DSS","ok":false,"w":"DSS ma 6 procesów."},{"t":"EDM","ok":false,"w":"EDM (Ład) ma 5 procesów."}],"fz":{"h":"Liczba procesów","p":"P1","pulapka":false,"n":"egzamin: 37 procesów · podr.: 37 procesów · EN: 37 processes · EN: 37 processes: EDM 5, APO 13, BAI 10, DSS 6, MEA 3","q":"Ile procesów ma COBIT 5 i jak się rozkładają?","a":"37: Ład EDM 5; Zarządzanie APO 13, BAI 10, DSS 6, MEA 3 (razem 32).\n37 procesów. Ład: EDM 5. Zarządzanie: APO 13, BAI 10, DSS 6, MEA 3 (razem 32).","ex":"Zapamiętaj ciąg 5-13-10-6-3. Ład (EDM) ma 5 procesów jak palce jednej ręki szefa, reszta to Zarządzanie: 32. Razem 37.\nCiąg liczb 5-13-10-6-3. Ład ma 5 (jak palce ręki), Zarządzanie 32; razem 37, czyli o trzy więcej niż 34 w COBIT 4.1.","org":""},"cyt":{"s":"33","t":"APO12 Zarządzanie ryzykiem APO06 Zarządzanie budżetem i kosztami APO13 Zarządzanie bezpieczeństwem APO07 Zarządzanie zasobami ludzkimi","w":"ZGODNE","u":"Liczba 13 wynika z wyliczenia APO01–APO13 na Ilustracji 16; podręcznik nie podaje jej słownie."}},"fz-A-007":{"id":"fz-A-007","typ":"egzamin","s":"PR-01-01,PR-01-02","t":"Ile zasad i ile kategorii aktywatorów ma COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 90"],"r":null,"zap":"","scen":"","o":[{"t":"7 zasad i 5 kategorii aktywatorów","ok":false,"w":"Liczby są zamienione: zasad jest 5, kategorii aktywatorów 7."},{"t":"5 zasad i 5 kategorii aktywatorów","ok":false,"w":"Kategorii aktywatorów jest 7, nie 5."},{"t":"4 zasady i 7 kategorii aktywatorów","ok":false,"w":"Zasad jest 5, nie 4."},{"t":"5 zasad i 7 kategorii aktywatorów","ok":true,"w":"Tak podaje podręcznik: 5 zasad i 7 kategorii czynników umożliwiających (aktywatorów) (FW-PL s. 90)."}],"fz":{"h":"Liczba zasad i aktywatorów","p":"P1","pulapka":false,"n":"EN: 5 principles, 7 enablers","q":"Ile zasad i ile kategorii aktywatorów ma COBIT 5?","a":"5 zasad i 7 kategorii aktywatorów.","ex":"5 zasad jak 5 palców jednej ręki, 7 aktywatorów jak 7 dni tygodnia. Zasady mówią, jak myśleć, aktywatory – czym działać.","org":""},"cyt":{"s":"90","t":"W ramach metodyki COBIT opisano pięć zasad i siedem czynników umożliwiających","w":"ZGODNE","u":"Słownik mówi „siedem czynników umożliwiających”; s. 14: „siedem kategorii czynników umożliwiających”."}},"fz-A-008":{"id":"fz-A-008","typ":"egzamin","s":"PR-01-01","t":"Która zasada wymaga uwzględnienia wszystkich współdziałających aktywatorów?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 14","FW-PL s. 27–29"],"r":null,"zap":"","scen":"","o":[{"t":"Realizacja potrzeb interesariusza","ok":false,"w":"Realizacja potrzeb interesariusza opisuje tworzenie wartości i przekładanie potrzeb przez Kaskadę Celów."},{"t":"Aktywacja holistycznego podejścia","ok":true,"w":"Aktywacja holistycznego podejścia wymaga uwzględnienia siedmiu współdziałających kategorii aktywatorów oraz ich zależności."},{"t":"Pokrycie całej organizacji","ok":false,"w":"Pokrycie całej organizacji integruje Ład IT z Ładem organizacji i obejmuje całą organizację, w tym usługi zewnętrzne."},{"t":"Oddzielenie Ładu od Zarządzania","ok":false,"w":"Oddzielenie Ładu od Zarządzania rozróżnia ich działania, struktury organizacyjne i cele."}],"fz":{"h":"Zasada 4 – podejście holistyczne","p":"P2","pulapka":true,"n":"egzamin: Aktywacja holistycznego podejścia · podr.: Wdrożenie podejścia całościowego · EN: Enabling a Holistic Approach","q":"Która zasada wymaga uwzględnienia wszystkich współdziałających aktywatorów?","a":"Zasada 4: Ład i Zarządzanie wymagają uwzględnienia siedmiu kategorii aktywatorów, które na siebie oddziałują i od siebie zależą. Żaden aktywator nie działa w pojedynkę.","ex":"Sam proces bezpieczeństwa nie wystarczy: potrzebne są też informacje, ludzie z kompetencjami, kultura, zasady i polityki, struktury organizacyjne oraz narzędzia (usługi, infrastruktura, aplikacje). HACZYK: „wszystkie aktywatory razem” to Zasada 4, a nie Pokrycie całej organizacji (Zasada 2).","org":""},"cyt":{"s":"14","t":"Zasada 4: Wdrożenie podejścia całościowego — skuteczny nadzór nad technologiami informatycznymi oraz wydajne zarządzanie nimi w przedsiębiorstwie wymagają przyjęcia całościowego podejścia uwzględniającego wiele wzajemnie oddziałujących na siebie komponentów.","w":"TERMIN","u":"FW-PL: „Wdrożenie podejścia całościowego”; egzamin PL: Aktywacja holistycznego podejścia."}},"fz-A-009":{"id":"fz-A-009","typ":"egzamin","s":"PR-02-14","t":"Jak na egzaminie PL nazywa się Governance, tłumaczone też jako nadzór?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 91"],"r":null,"zap":"","scen":"","o":[{"t":"Zarządzanie","ok":false,"w":"Zarządzanie to Management, osobna dyscyplina według Zasady 5."},{"t":"Struktura ramowa","ok":false,"w":"Struktura ramowa to Framework."},{"t":"Aktywator","ok":false,"w":"Aktywator to Enabler."},{"t":"Ład","ok":true,"w":"Governance to na egzaminie Ład (podr. nadzór)."}],"fz":{"h":"Nazwy egzaminacyjne: Governance, Framework, Enabler, Enterprise","p":"P1","pulapka":true,"n":"EN: Governance, Framework, Enabler, Enterprise","q":"Governance, Framework, Enabler, Enterprise – nazwy egzaminacyjne?","a":"Ład (podr. nadzór), Struktura ramowa (podr. metodyka), Aktywator (podr. czynnik umożliwiający), Organizacja (podr. przedsiębiorstwo).","ex":"Ład = kto wyznacza kierunek (jak rada rodziców), Aktywator = coś, co umożliwia działanie, Organizacja = cała firma lub urząd. Na egzaminie używaj tych słów.","org":""},"cyt":{"s":"91","t":"Nadzór Dzięki nadzorowi zyskuje się pewność, że oceniono potrzeby, warunki i opcje interesariuszy","w":"TERMIN","u":"Podręcznik używa wyłącznie „nadzór”; nazwa „Ład” pochodzi z terminologii egzaminu PL."}},"fz-A-010":{"id":"fz-A-010","typ":"egzamin","s":"PR-01-02","t":"Jak na egzaminie PL nazywa się Enabler, tłumaczony też jako czynnik umożliwiający?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 91"],"r":null,"zap":"","scen":"","o":[{"t":"Aktywator","ok":true,"w":"Enabler to na egzaminie Aktywator."},{"t":"Wyznacznik","ok":false,"w":"Wyznacznik to driver – czynnik wpływający na potrzeby interesariuszy."},{"t":"Organizacja","ok":false,"w":"Organizacja to Enterprise (podr. przedsiębiorstwo)."},{"t":"Struktura ramowa","ok":false,"w":"Struktura ramowa to Framework (podr. metodyka)."}],"fz":{"h":"Nazwy egzaminacyjne: Governance, Framework, Enabler, Enterprise","p":"P1","pulapka":true,"n":"EN: Governance, Framework, Enabler, Enterprise","q":"Governance, Framework, Enabler, Enterprise – nazwy egzaminacyjne?","a":"Ład (podr. nadzór), Struktura ramowa (podr. metodyka), Aktywator (podr. czynnik umożliwiający), Organizacja (podr. przedsiębiorstwo).","ex":"Ład = kto wyznacza kierunek (jak rada rodziców), Aktywator = coś, co umożliwia działanie, Organizacja = cała firma lub urząd. Na egzaminie używaj tych słów.","org":""},"cyt":{"s":"91","t":"Czynnik umożliwiający nadzór Coś (materialnego lub niematerialnego), co wspiera sprawowanie skutecznego nadzoru.","w":"TERMIN","u":"Podręcznik: „czynnik umożliwiający”; „Aktywator” to terminologia egzaminu PL."}},"fz-A-011":{"id":"fz-A-011","typ":"egzamin","s":"PR-02-13","t":"Jak na egzaminie PL nazywają się lead i lag indicators?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 29"],"r":null,"zap":"","scen":"","o":[{"t":"Wskaźniki podstawowe i wspierające","ok":false,"w":"Podstawowe i wspierające to relacje P i S w macierzach mapowania."},{"t":"Wskaźniki wiodące i opóźnione","ok":true,"w":"To nazwy egzaminacyjne; podręcznik mówi: wyprzedzające i następujące."},{"t":"Wskaźniki wewnętrzne i kontekstowe","ok":false,"w":"Jakość wewnętrzna (podr. rzeczywista) i kontekstowa to kategorie celów aktywatora, a nie nazwy wskaźników (FW-PL s. 29)."},{"t":"Wskaźniki zdolności i wydajności","ok":false,"w":"To nie są nazwy lead/lag indicators ani na egzaminie, ani w podręczniku."}],"fz":{"h":"Lead/lag indicators – nazwy","p":"P1","pulapka":true,"n":"EN: Lead / lag indicators","q":"Lead/lag indicators – nazwy na egzaminie i w podręczniku?","a":"Egzamin: wskaźniki wiodące / opóźnione. Podręcznik: wskaźniki wyprzedzające / następujące.","ex":"Wiodący to prognoza pogody (zapowiada, co będzie), opóźniony to deszczomierz po fakcie (pokazuje, co już spadło). Haczyk: wiodący idzie z przodu, opóźniony z tyłu.","org":""},"cyt":{"s":"29","t":"Mierniki pozwalające na określenie stopnia, w jakim osiągnięto cele, można nazwać „wskaźnikami następującymi”.","w":"TERMIN","u":"Podręcznik: wskaźniki następujące/wyprzedzające; nazwy „wiodące/opóźnione” to terminologia egzaminu PL."}},"fz-A-012":{"id":"fz-A-012","typ":"egzamin","s":"PR-01-04","t":"Co oznacza skrót PBRM opisujący obszar Zarządzania?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 32"],"r":null,"zap":"","scen":"","o":[{"t":"Oszacuj, Kieruj i Monitoruj","ok":false,"w":"To nazwa domeny Ładu EDM."},{"t":"Monitoruj, Oszacuj i Oceń","ok":false,"w":"To nazwa domeny MEA."},{"t":"Planuj, Twórz, Wykonuj i Monitoruj","ok":true,"w":"PBRM = Plan, Build, Run, Monitor – Planuj, Twórz (Wytwarzaj), Wykonuj i Monitoruj; na egzaminie występują oba warianty: Twórz lub Wytwarzaj."},{"t":"Twórz, Nabywaj i Wdrażaj","ok":false,"w":"To nazwa domeny BAI, a nie całego PBRM."}],"fz":{"h":"PBRM – nazwa egzaminacyjna","p":"P2","pulapka":true,"n":"EN: Plan, Build, Run and Monitor","q":"PBRM – jak brzmi na egzaminie PL?","a":"Dwa warianty – rozpoznawaj oba: Planuj, Wytwarzaj, Wykonuj i Monitoruj (zestawienie Altkom) oraz Planuj, Twórz, Wykonuj i Monitoruj (SP1). Podr.: Planowanie, Budowanie, Uruchamianie i Monitorowanie. Domena BAI: Twórz, Nabywaj i Wdrażaj.","ex":"Jak budowa domu: projekt (Planuj), budowa (Wytwarzaj/Twórz), mieszkanie w nim (Wykonuj), przeglądy (Monitoruj). Angielskie pierwsze litery: Plan, Build, Run, Monitor.","org":""},"cyt":{"s":"32","t":"Zarządzanie — obejmuje cztery domeny związane z obszarami odpowiedzialności w zakresie planowania, budowania, realizacji i monitorowania (PBRM)","w":"ZGODNE","u":"Różnica terminologiczna: podręcznik „planowanie, budowanie, realizacja, monitorowanie” (Ilustracja 15: Uruchamianie); warianty „Twórz/Wytwarzaj, Wykonuj” są z materiałów egzaminacyjnych."}},"fz-A-013":{"id":"fz-A-013","typ":"egzamin","s":"PR-01-03,PR-01-04","t":"Nazwa której domeny zaczyna się od słowa „Oszacuj”?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 32"],"r":null,"zap":"","scen":"","o":[{"t":"MEA – Monitoruj, Oszacuj i Oceń","ok":false,"w":"W MEA „Oszacuj” stoi w środku, a nazwa zaczyna się od „Monitoruj”."},{"t":"BAI – Twórz, Nabywaj i Wdrażaj","ok":false,"w":"W nazwie BAI w ogóle nie ma „Oszacuj”."},{"t":"Obu: EDM i MEA","ok":false,"w":"Tylko EDM zaczyna się od „Oszacuj”; MEA zaczyna się od „Monitoruj”."},{"t":"EDM – Oszacuj, Kieruj i Monitoruj","ok":true,"w":"W EDM (Evaluate, Direct, Monitor) „Oszacuj” stoi na początku."}],"fz":{"h":"EDM i MEA – „Oszacuj”","p":"P2","pulapka":true,"n":"EN: Evaluate, Direct and Monitor vs Monitor, Evaluate and Assess","q":"EDM i MEA – gdzie stoi „Oszacuj”?","a":"EDM: Oszacuj, Kieruj i Monitoruj (na początku). MEA: Monitoruj, Oszacuj i Oceń (w środku).","ex":"Patrz na literę E (Evaluate = Oszacuj): w EDM stoi na początku, w MEA (Monitor-Evaluate-Assess) w środku.","org":""},"cyt":{"s":"32","t":"praktyki w zakresie oceny, kierowania i monitorowania (EDM)","w":"TERMIN","u":"Podręcznik: EDM = „Ocena, kierowanie i monitorowanie”; słowo „Oszacuj” to wersja egzaminu PL, a w podręczniku „oszacowanie” występuje w nazwie MEA („Monitorowanie, ocena i oszacowanie”) — ryzyko pomyłki."}},"fz-A-014":{"id":"fz-A-014","typ":"egzamin","s":"PC-01-03","t":"Co oznacza litera „P” na polskiej skali ocen atrybutu procesu (N/C/W/P)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 45"],"r":null,"zap":"","scen":"","o":[{"t":"Częściowy","ok":false,"w":"To pułapka: Częściowy to Partially w wersji EN, ale na skali PL częściowy to C, a P to Pełny."},{"t":"Pełny","ok":true,"w":"Na skali PL: N Nieosiągnięty, C Częściowy, W Większościowy, P Pełny."},{"t":"Większościowy","ok":false,"w":"Większościowy oznacza litera W."},{"t":"Nieosiągnięty","ok":false,"w":"Nieosiągnięty oznacza litera N."}],"fz":{"h":"Skala ocen PL a EN","p":"P1","pulapka":true,"n":"EN: N/P/L/F vs N/C/W/P","q":"Skala ocen: litery egzaminu PL a oryginalne EN?","a":"PL: N Nieosiągnięty, C Częściowy, W Większościowy, P Pełny. EN: N, P (Partially), L (Largely), F (Fully). „P” oznacza co innego!","ex":"Jak ocena, ile pracy domowej zrobiono: nic, częściowo, w większości, w pełni. Pułapka: polskie „P” to Pełny, angielskie „P” to Partially, czyli częściowo.","org":""},"cyt":{"s":"45","t":"F (w pełni osiągnięto)","w":"TERMIN","u":"Podręcznik używa liter angielskich N/P/L/F, gdzie „P” = częściowo osiągnięto; skala N/C/W/P z „P = Pełny” pochodzi z terminologii egzaminu PL."}},"fz-A-015":{"id":"fz-A-015","typ":"egzamin","s":"PC-01-02","t":"Jak na egzaminie PL nazywa się atrybut PA 2.1, zwany też Zarządzaniem sprawnością?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42","PeopleCert Syllabus — PC-01-02","SP1 s. 26"],"r":null,"zap":"","scen":"","o":[{"t":"Wykonanie procesu","ok":false,"w":"Wykonanie procesu to PA (Process Attribute — atrybut procesu) 1.1."},{"t":"Sprawność procesu","ok":false,"w":"Sprawność procesu to podręcznikowa nazwa PA (Process Attribute — atrybut procesu) 1.1."},{"t":"Przeznaczenie procesu","ok":false,"w":"Przeznaczenie procesu to process purpose, a nie atrybut procesu."},{"t":"Zarządzanie wydajnością","ok":true,"w":"PA (Process Attribute — atrybut procesu) 2.1 to Performance management — Zarządzanie wydajnością, w podręczniku Zarządzanie sprawnością. Dotyczy zarządzania wykonywaniem procesu. PA 1.1 to Process performance — Wykonanie procesu, czyli osiąganie jego przeznaczenia. Nazwę egzaminacyjną potwierdza również polski arkusz próbny, pytanie 12."}],"fz":{"h":"PA 1.1 i PA 2.1 – nazwy","p":"P2","pulapka":true,"n":"EN: PA 1.1 Process performance; PA 2.1 Performance management","q":"PA 1.1 i PA 2.1 – nazwy egzaminacyjne i podręcznikowe?","a":"PA 1.1 Wykonanie procesu (podr. Sprawność procesu); PA 2.1 Zarządzanie wydajnością (podr. Zarządzanie sprawnością). Nie myl PA 2.1 z Zarządzaniem wydajnością aktywatora.","ex":"PA 1.1: czy proces w ogóle robi swoje, jak kuchnia, która wydaje dania. PA 2.1: czy tę pracę się planuje i pilnuje, jak grafik i kontrola czasu wydawania.","org":""},"cyt":{"s":"42","t":"PA 2.1 Zarządzanie sprawnością","w":"TERMIN","u":"Podręcznik: „Zarządzanie sprawnością”; „Zarządzanie wydajnością” to terminologia egzaminu PL."}},"fz-A-016":{"id":"fz-A-016","typ":"egzamin","s":"PC-01-01,PC-01-04","t":"Jak na egzaminie PL nazywa się process capability, tłumaczone też jako potencjał procesu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 43"],"r":null,"zap":"","scen":"","o":[{"t":"Zdolność procesu","ok":true,"w":"Process capability to zdolność procesu, a jej ocena to ocena zdolności procesu."},{"t":"Przeznaczenie procesu","ok":false,"w":"Przeznaczenie procesu to process purpose – po co proces istnieje."},{"t":"Wykonanie procesu","ok":false,"w":"Wykonanie procesu to nazwa atrybutu PA 1.1."},{"t":"Cel aktywatora","ok":false,"w":"Cel aktywatora to ostatni krok Kaskady Celów, nie zdolność procesu."}],"fz":{"h":"Process purpose i process capability – nazwy","p":"P2","pulapka":true,"n":"EN: Process purpose; process capability","q":"Process purpose i process capability – nazwy egzaminacyjne?","a":"Przeznaczenie procesu (podr. cel procesu); zdolność procesu, ocena zdolności procesu (podr. potencjał procesu).","ex":"Przeznaczenie procesu = po co on jest (kuchnia jest po to, by karmić). Zdolność procesu = jak dobrze to robi, na skali 0–5, jak stopnie w karate.","org":""},"cyt":{"s":"41","t":"Model potencjału procesu COBIT 5","w":"TERMIN","u":"Podręcznik: „potencjał procesu”; „zdolność procesu” to terminologia egzaminu PL."}},"fz-A-017":{"id":"fz-A-017","typ":"egzamin","s":"IM-01-01","t":"Jak na egzaminie PL nazywa się change enablement, tłumaczone też jako umożliwienie zmian?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 37"],"r":null,"zap":"","scen":"","o":[{"t":"Mapa drogowa","ok":false,"w":"Mapa drogowa to road map (podr. plan działań)."},{"t":"Zdarzenie wyzwalające","ok":false,"w":"Zdarzenie wyzwalające to trigger event."},{"t":"Aktywowanie zmiany","ok":true,"w":"Change enablement to na egzaminie Aktywowanie zmiany."},{"t":"Punkt zapalny","ok":false,"w":"Punkt zapalny to osobne pojęcie (pain point), nie change enablement."}],"fz":{"h":"Change enablement, trigger events, road map – nazwy","p":"P2","pulapka":true,"n":"EN: Change enablement; trigger events; road map","q":"Change enablement, trigger events, road map – nazwy egzaminacyjne?","a":"Aktywowanie zmiany (podr. umożliwienie zmian), zdarzenia wyzwalające (podr. zdarzenia inicjujące), mapa drogowa (podr. plan działań).","ex":"Aktywowanie zmiany to przygotowanie ludzi, by chcieli zmiany; zdarzenie wyzwalające to iskra, która uruchamia wdrożenie; mapa drogowa to plan trasy krok po kroku.","org":""},"cyt":{"s":"37","t":"Umożliwienie zmian Skuteczne wdrożenie zależy od wprowadzenia właściwej zmiany","w":"TERMIN","u":"Podręcznik: „Umożliwienie zmian”; „Aktywowanie zmiany” to terminologia egzaminu PL."}},"fz-A-018":{"id":"fz-A-018","typ":"egzamin","s":"IM-02-02","t":"Jak na egzaminie PL nazywają się trigger events, tłumaczone też jako zdarzenia inicjujące?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 37"],"r":null,"zap":"","scen":"","o":[{"t":"Wyznaczniki interesariuszy","ok":false,"w":"Wyznaczniki to drivers – pierwszy krok Kaskady Celów."},{"t":"Zdarzenia wyzwalające","ok":true,"w":"Trigger events to na egzaminie zdarzenia wyzwalające – iskra uruchamiająca wdrożenie."},{"t":"Mapa drogowa","ok":false,"w":"Mapa drogowa to road map, czyli plan działań."},{"t":"Punkty zapalne","ok":false,"w":"Punkty zapalne to pain points – osobne pojęcie sylabusa."}],"fz":{"h":"Change enablement, trigger events, road map – nazwy","p":"P2","pulapka":true,"n":"EN: Change enablement; trigger events; road map","q":"Change enablement, trigger events, road map – nazwy egzaminacyjne?","a":"Aktywowanie zmiany (podr. umożliwienie zmian), zdarzenia wyzwalające (podr. zdarzenia inicjujące), mapa drogowa (podr. plan działań).","ex":"Aktywowanie zmiany to przygotowanie ludzi, by chcieli zmiany; zdarzenie wyzwalające to iskra, która uruchamia wdrożenie; mapa drogowa to plan trasy krok po kroku.","org":""},"cyt":{"s":"36","t":"Rozpoznawanie punktów zapalnych i zdarzeń inicjujących","w":"TERMIN","u":"Podręcznik: „zdarzenia inicjujące”; „zdarzenia wyzwalające” to terminologia egzaminu PL."}},"fz-A-019":{"id":"fz-A-019","typ":"egzamin","s":"EN-02-17","t":"Co oznacza „jakość wewnętrzna” informacji (intrinsic quality)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 29","FW-PL s. 82"],"r":null,"zap":"","scen":"","o":[{"t":"Jakość informacji używanej wyłącznie wewnątrz organizacji","ok":false,"w":"Pułapka: „wewnętrzna” znaczy „sama w sobie”, a nie „wewnątrz organizacji”."},{"t":"Jakość informacji ocenianej przez audyt wewnętrzny","ok":false,"w":"Nazwa nie ma związku z audytem wewnętrznym."},{"t":"Jakość informacji samej w sobie, bez względu na kontekst","ok":true,"w":"Jakość wewnętrzna (podr. jakość rzeczywista) = jakość informacji samej w sobie, np. czy jest prawdziwa, dokładna i wiarygodna – niezależnie od tego, kto i gdzie jej używa."},{"t":"Jakość informacji w systemach wewnętrznych działu IT","ok":false,"w":"Nie chodzi o miejsce przechowywania, lecz o jakość samej informacji."}],"fz":{"h":"Intrinsic quality – nazwa","p":"P2","pulapka":true,"n":"EN: Intrinsic quality","q":"Intrinsic quality – jak na egzaminie, a jak w podręczniku?","a":"Egzamin: jakość wewnętrzna (= sama w sobie, nie „wewnątrz organizacji”). Podręcznik: jakość rzeczywista.","ex":"Jakość „sama w sobie”, jak świeżość jabłka: czy informacja jest prawdziwa, dokładna i wiarygodna, niezależnie od tego, kto i gdzie jej używa.","org":""},"cyt":{"s":"82","t":"Jakość rzeczywista — stopień, w jakim wartości danych są zgodne z faktycznymi lub prawdziwymi wartościami.","w":"ZGODNE","u":"Podręcznik: „jakość rzeczywista”; „jakość wewnętrzna” to nazwa egzaminacyjna."}},"fz-A-020":{"id":"fz-A-020","typ":"egzamin","s":"PR-02-09","t":"Jak na egzaminie PL nazywa się governing body, tłumaczone też jako organ nadzorujący?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 24"],"r":null,"zap":"","scen":"","o":[{"t":"Role operacyjne","ok":false,"w":"Role operacyjne to operations and execution."},{"t":"Kierownictwo","ok":false,"w":"Kierownictwo to management – dostaje kierunek od organu Ładu."},{"t":"Interesariusze","ok":false,"w":"Interesariusze (owners and stakeholders) delegują uprawnienia do organu Ładu."},{"t":"Organ Ładu","ok":true,"w":"Governing body to na egzaminie Organ Ładu."}],"fz":{"h":"Governing body i Operations and execution – nazwy","p":"P2","pulapka":true,"n":"EN: Governing body; operations and execution","q":"Governing body i Operations and execution – nazwy egzaminacyjne?","a":"Organ Ładu (podr. organ nadzorujący) i Role operacyjne (podr. eksploatacja i wykonanie).","ex":"Organ Ładu to np. zarząd lub rada, która wyznacza kierunek, jak właściciel restauracji. Role operacyjne wykonują codzienną pracę, jak kucharze i kelnerzy.","org":""},"cyt":{"s":"24","t":"Organ nadzorujący","w":"TERMIN","u":"Podręcznik: „organ nadzorujący”; „Organ Ładu” to terminologia egzaminu PL."}},"fz-A-021":{"id":"fz-A-021","typ":"egzamin","s":"PR-02-08","t":"Czym są Aktywatory Ładu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 24","FW-PL s. 91"],"r":null,"zap":"","scen":"","o":[{"t":"Procesami domeny EDM w Referencyjnym Modelu Procesu","ok":false,"w":"EDM (Evaluate, Direct and Monitor — Oszacuj, Kieruj i Monitoruj) to domena procesów Ładu; aktywatory Ładu obejmują znacznie więcej niż procesy."},{"t":"Czynnikami, które wpływają na potrzeby interesariuszy","ok":false,"w":"To definicja wyznaczników w Kaskadzie Celów."},{"t":"Zasobami organizacyjnymi i zasobami organizacji","ok":true,"w":"Aktywatory Ładu (podr. czynniki umożliwiające nadzór) to zasoby organizacyjne Ładu (struktury ramowe, zasady, struktury, procesy, praktyki) oraz zasoby organizacji (zdolność usługowa, ludzie, informacje). Ich brak osłabia tworzenie wartości."},{"t":"Właścicielami delegującymi uprawnienia organowi Ładu","ok":false,"w":"To opis relacji ról w Podejściu do Ładu (właściciele i interesariusze delegują uprawnienia organowi Ładu), nie aktywatorów Ładu."}],"fz":{"h":"Aktywatory Ładu","p":"P2","pulapka":false,"n":"≠ TŁUMACZENIE · egzamin: aktywatory Ładu · podr.: czynniki umożliwiające nadzór · EN: governance enablers · EN: Governance enablers","q":"Czym są Aktywatory Ładu?","a":"Zasobami organizacyjnymi Ładu (struktury ramowe, zasady, struktury, procesy, praktyki) oraz zasobami organizacji (zdolność usługowa, ludzie, informacje). Ich brak osłabia tworzenie wartości.","ex":"W domu to regulamin, domowe ustalenia i zwyczaje, ale też sprzęt, domownicy i wiedza. Bez nich dom nie przynosi tego, czego się od niego oczekuje.","org":"polityka obsługi zgłoszeń, komitet sterujący."},"cyt":{"s":"24","t":"Czynniki umożliwiające nadzór to zasoby organizacyjne związane z nadzorem, takie jak metodyki, zasady, struktury, procesy oraz praktyki, na które ukierunkowane jest działanie i które umożliwiają osiągnięcie celów. Czynniki umożliwiające uwzględniają również zasoby przedsiębiorstwa","w":"ZGODNE"}},"fz-A-022":{"id":"fz-A-022","typ":"egzamin","s":"PR-01-01","t":"Która z poniższych NIE jest jedną z pięciu zasad COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 13","FW-PL s. 14"],"r":null,"zap":"","scen":"","o":[{"t":"Realizacja potrzeb interesariusza","ok":false,"w":"To Zasada 1."},{"t":"Aktywacja holistycznego podejścia","ok":false,"w":"To Zasada 4."},{"t":"Ustanowienie jednolitej kontroli IT","ok":true,"w":"„Ustanowienie jednolitej kontroli IT” nie jest nazwą jednej z pięciu zasad. Zasady to: Realizacja potrzeb interesariusza; Pokrycie całej organizacji; Zastosowanie pojedynczej zintegrowanej struktury ramowej; Aktywacja holistycznego podejścia; Oddzielenie Ładu od Zarządzania."},{"t":"Oddzielenie Ładu od Zarządzania","ok":false,"w":"To Zasada 5."}],"fz":{"h":"Pięć zasad","p":"P1","pulapka":false,"n":"egzamin: 5 zasad · podr.: 5 zasad · EN: 5 principles · EN: Meeting Stakeholder Needs; Covering the Enterprise End-to-End; Applying a Single Integrated Framework; Enabling a Holistic Approach; Separating Governance From Management","q":"Podaj pięć zasad COBIT 5 (nazwy egzaminacyjne).","a":"1. Realizacja potrzeb interesariusza. 2. Pokrycie całej organizacji. 3. Zastosowanie Pojedynczej Zintegrowanej Struktury Ramowej. 4. Aktywacja holistycznego podejścia. 5. Oddzielenie Ładu od Zarządzania. Zasada 1 oznacza tworzenie wartości dla interesariuszy przez równoważenie realizacji korzyści, optymalizacji ryzyka i wykorzystania zasobów; Kaskada Celów przekłada ich potrzeby na cele organizacji, cele związane z informatyką i cele aktywatorów.","ex":"Pierwsze słowa nazw zasad: Realizacja, Pokrycie, Zastosowanie, Aktywacja, Oddzielenie. Mnemonik R–P–Z–A–O: „Rano Pies Zjada Ananasa Ochoczo”. To pomoc pamięciowa, nie terminologia COBIT 5.","org":""},"cyt":{"s":"13","t":"1. Spełnienie potrzeb interesariuszy 5. Oddzielenie nadzoru od zarządzania 2. Uwzględnienie wszystkich aspektów działania przedsiębiorstwa Zasady metodyki COBIT 5 4. Wdrożenie podejścia całościowego 3. Stosowanie jednej zintegrowanej metodyki","w":"ZGODNE","u":"Ilustracja 2; nazwy zasad w fiszce są w terminologii egzaminu PL."}},"fz-A-023":{"id":"fz-A-023","typ":"egzamin","s":"PR-01-01","t":"Która zasada COBIT 5 mówi o tworzeniu wartości dla interesariuszy i o przekładaniu ich potrzeb na cele Kaskadą Celów?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 14","FW-PL s. 17"],"r":null,"zap":"","scen":"","o":[{"t":"Zasada 1: Realizacja potrzeb interesariusza","ok":true,"w":"Zasada 1 to tworzenie wartości przez równowagę korzyści, ryzyka i zasobów oraz Kaskada Celów."},{"t":"Zasada 2: Pokrycie całej organizacji","ok":false,"w":"Zasada 2 mówi, że Ład IT obejmuje całą organizację."},{"t":"Zasada 4: Aktywacja holistycznego podejścia","ok":false,"w":"Zasada 4 dotyczy 7 współzależnych kategorii aktywatorów."},{"t":"Zasada 5: Oddzielenie Ładu od Zarządzania","ok":false,"w":"Zasada 5 rozdziela działania, struktury i cele Ładu oraz Zarządzania."}],"fz":{"h":"Zasada 1: Realizacja potrzeb interesariusza","p":"P1","pulapka":false,"n":"≠ TŁUMACZENIE · egzamin: Realizacja potrzeb interesariusza · podr.: Spełnienie potrzeb interesariuszy · EN: Principle 1: Meeting Stakeholder Needs","q":"O co chodzi w Zasadzie 1? / Co mówi Zasada 1: Realizacja potrzeb interesariusza?","a":"Tworzenie wartości dla interesariuszy przez równowagę korzyści, ryzyka i zasobów; potrzeby przekłada się na cele kaskadą celów.\nOrganizacja istnieje, by tworzyć wartość dla interesariuszy: równoważyć korzyści, ryzyko i zasoby. Kaskada Celów przekłada potrzeby na cele organizacji, cele IT i cele aktywatorów.","ex":"Restauracja istnieje dla gości i właścicieli: ma dawać korzyść, nie ryzykować za dużo i nie marnować produktów. Ich życzenia rozpisuje się w dół na konkretne cele.\nJak rodzinny budżet: najpierw życzenie rodziny („suchy dom”), potem cel („nowy dach”), potem zadania dla wykonawców. To rozpisywanie w dół to Kaskada Celów.","org":"potrzeba „usługi bez przerw” → cel organizacji CO7."},"cyt":{"s":"14","t":"Zasada 1: Spełnienie potrzeb interesariuszy — istotą działania przedsiębiorstw jest tworzenie wartości dla interesariuszy poprzez zachowanie równowagi między realizacją korzyści, optymalizacją ryzyka i wykorzystaniem zasobów.","w":"ZGODNE","u":"Kaskada celów opisana w dalszej części tego samego punktu."}},"fz-A-024":{"id":"fz-A-024","typ":"egzamin","s":"PR-01-01","t":"Jak Zasada 2 (Pokrycie całej organizacji) traktuje informację i technologię?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 14","FW-PL s. 23"],"r":null,"zap":"","scen":"","o":[{"t":"Jako sprawę wyłącznie działu IT","ok":false,"w":"Zasada 2 obejmuje wszystkie funkcje i procesy organizacji, nie tylko dział IT."},{"t":"Jako zasób taki sam jak każdy inny","ok":true,"w":"Informację i technologię traktuje się jak każdy inny zasób (aktywo) organizacji – we wszystkich funkcjach i procesach; aktywatory są ogólnofirmowe."},{"t":"Jako zasób ważniejszy od pozostałych","ok":false,"w":"Według Zasady 2 informacja i technologia to aktywa jak każde inne, a nie zasób zarządzany zupełnie osobno."},{"t":"Jako temat tylko wewnętrznych usług IT","ok":false,"w":"Zasada 2 obejmuje także zewnętrzne usługi IT."}],"fz":{"h":"Zasada 2: Pokrycie całej organizacji","p":"P1","pulapka":false,"n":"≠ TŁUMACZENIE · egzamin: Pokrycie całej organizacji · podr.: Uwzględnienie wszystkich aspektów działania przedsiębiorstwa · EN: Principle 2: Covering the Enterprise End-to-End","q":"O co chodzi w Zasadzie 2? / Co mówi Zasada 2: Pokrycie całej organizacji?","a":"Ład IT jest częścią Ładu całej organizacji; obejmuje wszystkie funkcje i procesy, a informację i technologię traktuje jak każdy inny zasób.\nŁad IT jest częścią ładu korporacyjnego. Obejmuje wszystkie funkcje i procesy, wewnętrzne i zewnętrzne usługi IT; informacje i technologię traktuje jak inne aktywa. Aktywatory są ogólnofirmowe.","ex":"IT to nie osobna wyspa: jak prąd w domu dotyczy każdego pokoju, tak informatyka dotyczy każdego działu. Informacja to taki sam majątek jak budynki.\nWydatki na internet to część budżetu całego domu, nie osobna kasa. Tak samo Ład IT dotyczy każdego działu i usług zamawianych z zewnątrz.","org":"zmiana obejmuje komendy, nie tylko komórkę IT."},"cyt":{"s":"14","t":"metodyka COBIT 5 nie koncentruje się tylko na funkcji IT, ale traktuje informacje i związane z nimi technologie jako aktywa wymagające uwzględnienia — podobnie jak wszelkie inne zasoby — przez wszystkich pracowników przedsiębiorstwa.","w":"ZGODNE"}},"fz-A-025":{"id":"fz-A-025","typ":"egzamin","s":"PR-01-01,PR-02-10","t":"Co oznacza Zasada 3: Zastosowanie pojedynczej zintegrowanej struktury ramowej?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 14","FW-PL s. 25","FW-PL s. 26","FW-PL s. 61"],"r":null,"zap":"","scen":"","o":[{"t":"Narzuca jeden sposób wykonania praktyk standardów","ok":false,"w":"Spójność na wysokim poziomie nie oznacza narzucenia jednego sposobu wykonania praktyk wszystkich standardów. COBIT 5 pozwala integrować szczegółowe wytyczne odpowiednie dla organizacji."},{"t":"Łączy Ład i Zarządzanie w jeden zestaw celów","ok":false,"w":"Zasada 5 rozróżnia Ład i Zarządzanie: mają odmienne działania, cele i struktury odpowiedzialności. Integracja frameworków nie łączy tych dwóch dyscyplin w jedną."},{"t":"Porządkuje procesy według cyklu ITIL","ok":false,"w":"Zasada 3 dotyczy integracji i spójności z innymi standardami, a nie narzucenia COBIT 5 tego samego układu procesów co ITIL (Information Technology Infrastructure Library — biblioteka praktyk zarządzania usługami informatycznymi)."},{"t":"Jest nadrzędną ramą spójną z innymi standardami","ok":true,"w":"COBIT 5 jest na poziomie ogólnym spójny z innymi standardami i może być nadrzędną strukturą ramową Ładu i Zarządzania IT (Information Technology — technologie informacyjne). Jego prosta architektura porządkuje materiały, obejmuje całą organizację i łączy wcześniejsze wytyczne ISACA."}],"fz":{"h":"Zasada 3: Pojedyncza zintegrowana struktura ramowa","p":"P1","pulapka":false,"n":"≠ TŁUMACZENIE · egzamin: Zastosowanie pojedynczej zintegrowanej struktury ramowej · podr.: Stosowanie jednej zintegrowanej metodyki · EN: Principle 3: Applying a Single Integrated Framework","q":"Co mówi Zasada 3: Zastosowanie Pojedynczej Zintegrowanej Struktury Ramowej?","a":"Zasada 3: COBIT 5 jest spójny z innymi standardami i może pełnić rolę nadrzędnej struktury ramowej Ładu i Zarządzania IT (Information Technology — technologie informacyjne). Integruje wytyczne, zamiast zastępować szczegółowe praktyki innych standardów. Powody integracji: obejmuje całe przedsiębiorstwo; zapewnia prostą architekturę materiałów i produktów; łączy wiedzę z wcześniejszych struktur ISACA; pozwala dostarczać spójne wytyczne przystępne także dla odbiorców nietechnicznych.","ex":"COBIT 5 przypomina wspólny segregator: porządkuje wytyczne, a szczegółowe instrukcje nadal pochodzą z odpowiednich standardów i metodyk. ITIL — Information Technology Infrastructure Library, biblioteka praktyk zarządzania usługami informatycznymi; TOGAF — The Open Group Architecture Framework, struktura ramowa architektury The Open Group.","org":"procedury bezpieczeństwa i normy włączone do jednej ramy Ładu i Zarządzania."},"cyt":{"s":"14","t":"Na poziomie ogólnym metodyka COBIT 5 jest spójna z innymi stosownymi standardami i metodykami. W związku z tym może ona stanowić nadrzędną strukturę nadzoru nad technologiami informatycznymi w przedsiębiorstwie i zarządzania nimi.","w":"ZGODNE"}},"fz-A-027":{"id":"fz-A-027","typ":"egzamin","s":"PR-01-01,PR-02-14","t":"Jak Zasada 5 rozdziela działania Ładu i Zarządzania?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 14","FW-PL s. 31"],"r":null,"zap":"","scen":"","o":[{"t":"Ład realizuje PBRM, a Zarządzanie EDM","ok":false,"w":"Role są tu zamienione: to Ład ocenia, kieruje i monitoruje (EDM), a Zarządzanie planuje, tworzy, wykonuje i monitoruje (PBRM)."},{"t":"Ład tylko monitoruje, a Zarządzanie resztę działań","ok":false,"w":"Ład także ocenia i kieruje, a Zarządzanie również monitoruje."},{"t":"Ład realizuje EDM, a Zarządzanie PBRM","ok":true,"w":"Ład (EDM) ocenia, kieruje i monitoruje; Zarządzanie (PBRM) planuje, tworzy, wykonuje i monitoruje. Tak rozdziela je Zasada 5: różne działania, struktury i cele."},{"t":"Oba wykonują to samo, na innych szczeblach","ok":false,"w":"Według Zasady 5 to różne dyscypliny z innymi działaniami."}],"fz":{"h":"Zasada 5: Oddzielenie Ładu od Zarządzania","p":"P1","pulapka":true,"n":"≠ TŁUMACZENIE · egzamin: Oddzielenie Ładu od Zarządzania · podr.: Oddzielenie nadzoru od zarządzania · EN: Principle 5: Separating Governance From Management","q":"O co chodzi w Zasadzie 5? / Co mówi Zasada 5: Oddzielenie Ładu od Zarządzania?","a":"Ład (EDM) ocenia, kieruje i monitoruje; Zarządzanie (PBRM) planuje, tworzy, wykonuje i monitoruje. To różne działania, struktury i cele.\nŁad i Zarządzanie to różne dyscypliny: obejmują inne działania, wymagają innych struktur organizacyjnych i służą innym celom.","ex":"Właściciel restauracji ocenia, decyduje i sprawdza (Ład); kierownik kuchni planuje, przygotowuje, gotuje i pilnuje (Zarządzanie). Jeden mówi „co”, drugi robi „jak”.\nW szkole dyrektor ustala kierunek i rozlicza (Ład), a nauczyciele prowadzą lekcje (Zarządzanie). Inne zadania, inne gremia, inne cele.","org":"kierownictwo zatwierdza progi ryzyka; dyrektor IT wdraża procedurę."},"cyt":{"s":"32","t":"Nadzór — obejmuje pięć procesów nadzoru; w ramach każdego procesu zdefiniowano praktyki w zakresie oceny, kierowania i monitorowania (EDM)5 . • Zarządzanie — obejmuje cztery domeny związane z obszarami odpowiedzialności w zakresie planowania, budowania, realizacji i monitorowania (PBRM)","w":"ZGODNE"}},"fz-A-029":{"id":"fz-A-029","typ":"egzamin","s":"PR-02-09","t":"Co definiuje komponent Ładu „Role, działania i relacje”?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 24"],"r":null,"zap":"","scen":"","o":[{"t":"Czego dotyczy system Ładu: całej organizacji, jednostki czy zasobu","ok":false,"w":"To definicja Zakresu Ładu."},{"t":"Jak Ład równoważy korzyści, ryzyko i zasoby","ok":false,"w":"To Cel Ładu, czyli Tworzenie wartości."},{"t":"Jakie zasoby wspierają skuteczny Ład","ok":false,"w":"To Aktywatory Ładu."},{"t":"Kto uczestniczy w Ładzie, co robi i jak współdziała","ok":true,"w":"Kto uczestniczy w Ładzie, jak jest zaangażowany, co robi i jak współdziała z innymi w systemie Ładu."}],"fz":{"h":"Role, działania i relacje – definicja","p":"P2","pulapka":false,"n":"EN: Roles, activities and relationships","q":"Co definiuje komponent Role, działania i relacje?","a":"Kto uczestniczy w Ładzie, jak jest zaangażowany, co robi i jak współdziała z innymi w systemie Ładu.","ex":"Odpowiada na pytania: kto bierze udział, co robi i z kim współpracuje – jak grafik dyżurów w straży z podziałem zadań.","org":""},"cyt":{"s":"24","t":"Definiuje on osoby zajmujące się nadzorem, sposób, w jaki są zaangażowane, charakter ich działań oraz sposób interakcji w zakresie określonego systemu zarządzania.","w":"ZGODNE"}},"fz-A-030":{"id":"fz-A-030","typ":"egzamin","s":"PR-02-09","t":"Co robi organ Ładu w relacjach ról Podejścia do Ładu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 24","PeopleCert Sample Paper 1 PL — Organ Ładu i Role operacyjne"],"r":null,"zap":"","scen":"","o":[{"t":"Wyznacza kierunek i monitoruje Zarządzanie","ok":true,"w":"Właściciele i interesariusze delegują uprawnienia organowi Ładu. Organ Ładu (governing body; podr. organ nadzorujący) wyznacza kierunek kierownictwu, monitoruje Zarządzanie i jest rozliczany przed właścicielami i interesariuszami. Kierownictwo instruuje i dopasowuje role operacyjne, a role operacyjne raportują kierownictwu. To wzajemne relacje, a nie kolejne fazy wdrożenia."},{"t":"Instruuje i dopasowuje role operacyjne","ok":false,"w":"To zadanie kierownictwa, nie organu Ładu."},{"t":"Raportuje kierownictwu o wykonaniu codziennych zadań","ok":false,"w":"Kierownictwu raportują role operacyjne."},{"t":"Deleguje uprawnienia właścicielom i interesariuszom","ok":false,"w":"Kierunek jest odwrotny: to interesariusze delegują do organu Ładu."}],"fz":{"h":"Role, działania i relacje","p":"P2","pulapka":false,"n":"egzamin: role, działania i relacje · podr.: role, działania i relacje · EN: roles, activities and relationships · EN: Owners and stakeholders – delegate/accountable; governing body – set direction/monitor; management – instruct and align/report; operations and execution","q":"Opisz relacje ról z Rysunku 9.","a":"Właściciele i interesariusze delegują uprawnienia organowi Ładu. Organ Ładu (governing body; podr. organ nadzorujący) wyznacza kierunek kierownictwu, monitoruje Zarządzanie i jest rozliczany przed właścicielami i interesariuszami. Kierownictwo instruuje i dopasowuje role operacyjne (operations and execution; podr. eksploatacja i wykonanie), a role operacyjne raportują kierownictwu. To wzajemne relacje, a nie kolejne fazy wdrożenia.","ex":"Jak w spółdzielni: mieszkańcy wybierają radę i dają jej władzę, rada wyznacza kierunek prezesowi, prezes kieruje pracownikami, a ci raportują w górę.","org":"kierownictwo organizacji → dyrektor IT (Information Technology — technologie informacyjne) → zespół dyżurny."},"cyt":{"s":"24","t":"Właściciele oraz interesariusze Delegowanie Strona rozliczana Role, działania i relacje Wyznaczanie Instruowanie kierunku i dopasowanie Organ nadzorujący Zarządzanie Eksploatacja i wykonanie Monitorowanie Raportowanie","w":"ZGODNE"}},"fz-A-031":{"id":"fz-A-031","typ":"egzamin","s":"PR-02-08","t":"Czego może dotyczyć Zakres Ładu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 24"],"r":null,"zap":"","scen":"","o":[{"t":"Całej organizacji, bez odrębnego definiowania zakresu","ok":false,"w":"Ład może obejmować całą organizację, ale zakres systemu Ładu trzeba jasno określić. Nie można przyjąć, że jego zdefiniowanie jest zbędne."},{"t":"Funkcji IT, niezależnie od zakresu działalności biznesowej","ok":false,"w":"Zakres nie wynika automatycznie z granic działu informatyki. COBIT 5 traktuje informację i technologię w kontekście całej organizacji; zakres można ustalić także dla jednostki lub aktywa."},{"t":"Całej organizacji, jednostki lub wybranego aktywa","ok":true,"w":"System Ładu może dotyczyć całej organizacji, jednostki, środków trwałych lub wartości niematerialnych. Trzeba jawnie ustalić jego zakres; zakres COBIT 5 jako frameworka obejmuje organizację."},{"t":"Aktywów materialnych, z pominięciem wartości niematerialnych","ok":false,"w":"COBIT 5 uwzględnia zarówno aktywa materialne, jak i niematerialne. Przedmiot Ładu nie jest ograniczony do fizycznego sprzętu."}],"fz":{"h":"Zakres Ładu","p":"P2","pulapka":false,"n":"≠ TŁUMACZENIE · egzamin: zakres Ładu · podr.: zakres nadzoru · EN: governance scope · EN: Governance scope","q":"Czym jest Zakres Ładu?","a":"Określeniem, czego dotyczy system Ładu: całej organizacji, jednostki, aktywów materialnych lub niematerialnych. Zakres COBIT 5 to organizacja.","ex":"Jak przy sprzątaniu: najpierw mówisz, czy chodzi o cały dom, jeden pokój czy tylko lodówkę. W COBIT 5 domyślnie jest to cała organizacja.","org":"zakres pierwszej iteracji: usługi centralne IT (Information Technology — technologie informacyjne)."},"cyt":{"s":"24","t":"Nadzór może być stosowany w odniesieniu do całego przedsiębiorstwa, jednostki, środków trwałych oraz wartości niematerialnych itd.","w":"ZGODNE"}},"fz-A-033":{"id":"fz-A-033","typ":"egzamin","s":"PR-02-06","t":"Na jakim poziomie kończy się Kaskada Celów COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 18","FW-PL s. 21","FW-PL s. 27"],"r":null,"zap":"","scen":"","o":[{"t":"Na celach procesów Referencyjnego Modelu Procesu","ok":false,"w":"Procesy są tylko jedną z siedmiu kategorii aktywatorów. Ostatni krok nie ogranicza się do celów procesów, lecz obejmuje cele wszystkich stosownych aktywatorów."},{"t":"Na celach związanych z informatyką","ok":false,"w":"Cele związane z informatyką są poziomem poprzedzającym cele aktywatorów. Po ich ustaleniu trzeba określić cele wspierających je aktywatorów."},{"t":"Na celach organizacji","ok":false,"w":"Cele organizacji są wcześniejszym poziomem. Następnie wyprowadza się cele związane z informatyką i cele aktywatorów."},{"t":"Na celach wszystkich kategorii aktywatorów","ok":true,"w":"Ostatni krok to cele wszystkich kategorii aktywatorów. Procesy, kultura, struktury, informacja, zasady, usługi i ludzie potrzebują odpowiednich celów wspierających cele związane z informatyką."}],"fz":{"h":"Cele aktywatorów","p":"P1","pulapka":true,"n":"≠ TŁUMACZENIE · egzamin: cele aktywatora · podr.: cele czynników umożliwiających · EN: enabler goals · EN: Goals cascade ends with enabler goals","q":"Czy Kaskada Celów kończy się na procesach?","a":"Nie. Ostatnim krokiem Kaskady Celów są cele aktywatorów wszystkich siedmiu kategorii. Procesy są jedną z tych kategorii; cele związane z informatyką wymagają także odpowiednich celów informacji, struktur, kultury, zasad, usług i ludzi.","ex":"Kaskada to rzeka, która nie kończy się na jednym młynie: płynie do wszystkich siedmiu aktywatorów, także ludzi, kultury i informacji, nie tylko do procesów.","org":"cele procesu DSS02 (Manage Service Requests and Incidents — Zarządzanie zgłoszeniami serwisowymi i incydentami), rejestru zgłoszeń, dyżuru."},"cyt":{"s":"29","t":"Cele czynników umożliwiających to ostateczny etap w kaskadzie celów COBIT 5.","w":"ZGODNE"}},"fz-A-035":{"id":"fz-A-035","typ":"egzamin","s":"PR-02-02","t":"Od czego zaczyna się Kaskada Celów?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 17"],"r":null,"zap":"","scen":"","o":[{"t":"Od potrzeb interesariuszy","ok":false,"w":"Potrzeby są drugie – wpływają na nie wyznaczniki."},{"t":"Od celów organizacji","ok":false,"w":"Cele organizacji są dopiero po potrzebach interesariuszy."},{"t":"Od wyznaczników interesariuszy","ok":true,"w":"Strzałka biegnie od wyznaczników (np. nowych technologii lub regulacji) do potrzeb interesariuszy – to krok 1."},{"t":"Od celu Ładu – Tworzenia wartości","ok":false,"w":"Korzyści, ryzyko i zasoby to perspektywy oceny potrzeb, a nie krok kaskady."}],"fz":{"h":"Wyznaczniki w kaskadzie","p":"P1","pulapka":false,"n":"EN: Drivers influence stakeholder needs","q":"Czy wyznaczniki są pierwszym czy drugim krokiem przed potrzebami?","a":"Pierwszym. Na Rysunku 4 strzałka prowadzi od wyznaczników (np. nowe technologie, regulacje) do potrzeb interesariuszy – to krok 1 kaskady.","ex":"Najpierw pogoda, potem potrzeba parasola: wyznacznik (np. nowe przepisy) wywołuje potrzebę interesariusza. Na rysunku strzałka biegnie od wyznaczników do potrzeb.","org":""},"cyt":{"s":"17","t":"Krok 1. Wyznaczniki dotyczące interesariuszy wpływają na potrzeby interesariuszy","w":"ZGODNE","u":"Rysunek 4 = Ilustracja 4 (s. 18): „Wyznaczniki dotyczące interesariuszy (środowisko, ewolucja technologii...)”; regulacje jako przykład — s. 17."}},"fz-A-037":{"id":"fz-A-037","typ":"egzamin","s":"PR-02-08,PR-01-03","t":"Które stwierdzenie o EDM i Podejściu do Ładu jest prawdziwe?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 23"],"r":null,"zap":"","scen":"","o":[{"t":"To jeden z czterech komponentów Podejścia do Ładu","ok":false,"w":"Cztery komponenty Podejścia do Ładu to Cel Ładu, Aktywatory Ładu, Zakres Ładu oraz Role, działania i relacje; EDM nie jest jednym z nich (FW-PL s. 24)."},{"t":"To domena procesów Ładu w modelu procesów","ok":true,"w":"EDM to domena procesów Ładu w Referencyjnym Modelu Procesu, a nie komponent Podejścia do Ładu."},{"t":"To komponent zastępujący Aktywatory Ładu","ok":false,"w":"Aktywatory Ładu to osobny komponent; EDM go nie zastępuje."},{"t":"To domena procesów Zarządzania w modelu procesów","ok":false,"w":"EDM jest domeną Ładu, nie Zarządzania."}],"fz":{"h":"EDM a Podejście do Ładu","p":"P1","pulapka":true,"n":"EN: EDM is a domain, not a governance approach component","q":"Czy EDM jest komponentem Podejścia do Ładu?","a":"Nie. Komponenty to Cel Ładu, Aktywatory Ładu, Zakres Ładu oraz Role, działania i relacje. EDM to domena procesów Ładu w Referencyjnym Modelu Procesu.","ex":"Pułapka: EDM to grupa procesów w katalogu, a nie część podejścia do Ładu. Komponenty to cztery pytania: po co, czym, czego dotyczy, kto co robi.","org":""},"cyt":{"s":"24","t":"Oprócz celu dotyczącego nadzoru — pozostałe główne elementy podejścia do nadzoru obejmują czynniki umożliwiające, zakres i role, a także działania i relacje.","w":"ZGODNE","u":"EDM nie jest na tej liście; to domena procesów nadzoru w modelu referencyjnym procesu (s. 32)."}},"fz-A-038":{"id":"fz-A-038","typ":"egzamin","s":"PR-01-04","t":"Domena MEA zajmuje się monitorowaniem. Do której części COBIT 5 należy?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 32"],"r":null,"zap":"","scen":"","o":[{"t":"Do Ładu, bo monitorowanie to zadanie organu Ładu","ok":false,"w":"Monitorowanie jest i w Ładzie (EDM), i w Zarządzaniu (MEA)."},{"t":"Do Ładu i Zarządzania jednocześnie","ok":false,"w":"Każda domena należy do jednego obszaru; MEA jest w Zarządzaniu."},{"t":"Do Zarządzania (PBRM) – monitoruje kierownictwo","ok":true,"w":"MEA to domena Zarządzania; w EDM monitoruje organ Ładu."},{"t":"Do żadnej – MEA jest poza Referencyjnym Modelem Procesu","ok":false,"w":"MEA ma 3 procesy w Referencyjnym Modelu Procesu."}],"fz":{"h":"MEA – Ład czy Zarządzanie","p":"P1","pulapka":true,"n":"EN: MEA is management","q":"MEA monitoruje – czy należy więc do Ładu?","a":"Nie. MEA to domena Zarządzania (PBRM). Monitorowanie w EDM wykonuje organ Ładu, a MEA – kierownictwo.","ex":"Sprawdzać może i właściciel, i kierownik. W EDM sprawdza rada (Ład), w MEA kierownictwo (Zarządzanie). Haczyk: MEA zaczyna się na M jak „menedżer”.","org":""},"cyt":{"s":"32","t":"Zarządzanie Planowanie (APO) Budowanie (BAI) Uruchamianie (DSS) Monitorowanie (MEA)","w":"ZGODNE","u":"Tekst Ilustracji 15; w nadzorze monitorowanie wykonuje organ nadzorujący (przypis 5, s. 32)."}},"fz-A-039":{"id":"fz-A-039","typ":"egzamin","s":"PR-02-10","t":"Jak COBIT 5 odnosi się do ITIL, TOGAF i PRINCE2?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 25","FW-PL s. 26","FW-PL s. 61"],"r":null,"zap":"","scen":"","o":[{"t":"Zastępuje ich wytyczne na poziomie szczegółowych praktyk","ok":false,"w":"COBIT 5 dostarcza wytycznych na poziomie nadrzędnym. Szczegółowych praktyk nadal dostarczają stosowne standardy i metodyki; ich zastąpienie nie jest istotą integracji."},{"t":"Zastępuje wytyczne projektowe, zachowując wytyczne usługowe i architektoniczne","ok":false,"w":"COBIT 5 nie zastępuje PRINCE2 (Projects in Controlled Environments — projekty w kontrolowanych środowiskach) tylko dlatego, że obejmuje także programy i projekty. Inne struktury mogą dostarczać szczegółów dla wszystkich tych obszarów."},{"t":"Stosuje je jako niezależne modele bez wspólnej struktury","ok":false,"w":"Zasada 3 akcentuje spójność i integrację w jednej nadrzędnej strukturze. Nie chodzi o utrzymywanie niepowiązanych modeli."},{"t":"Integruje je jako nadrzędna struktura ramowa","ok":true,"w":"COBIT 5 może pełnić rolę nadrzędnej struktury ramowej, spójnej z ITIL (Information Technology Infrastructure Library — biblioteka praktyk zarządzania usługami informatycznymi), TOGAF (The Open Group Architecture Framework — struktura ramowa architektury The Open Group) i PRINCE2 (Projects in Controlled Environments — projekty w kontrolowanych środowiskach). Integruje ich wytyczne i pozwala korzystać ze szczegółów stosownie do potrzeb organizacji."}],"fz":{"h":"COBIT 5 a ITIL, TOGAF, PRINCE2","p":"P2","pulapka":false,"n":"EN: Integrator, not replacement","q":"Czy COBIT 5 zastępuje ITIL, TOGAF czy PRINCE2?","a":"Nie. Jest nadrzędną strukturą ramową, która je integruje i jest z nimi spójna; szczegóły bierze się z tych standardów.","ex":"COBIT 5 nie wyrzuca innych poradników – jest jak spis treści segregatora, w który wpinasz ITIL (Information Technology Infrastructure Library — biblioteka praktyk zarządzania usługami informatycznymi), TOGAF (The Open Group Architecture Framework — struktura ramowa architektury The Open Group) i PRINCE2 (Projects in Controlled Environments — projekty w kontrolowanych środowiskach) ze szczegółami.","org":""},"cyt":{"s":"25","t":"Jest spójna z innymi najnowszymi stosownymi normami i metodykami, co sprawia, że przedsiębiorstwo może wykorzystać metodykę COBIT 5 jako nadrzędną strukturę nadzoru nad technologiami informatycznymi i zarządzania nimi, umożliwiającą integrację innych metodyk.","w":"ZGODNE","u":"ITIL, TOGAF — s. 26; PRINCE2 — Załącznik E, s. 61."}},"fz-A-040":{"id":"fz-A-040","typ":"egzamin","s":"PR-01-01","t":"Jaka jest relacja Ładu IT do ładu korporacyjnego?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 23"],"r":null,"zap":"","scen":"","o":[{"t":"Jest częścią ładu korporacyjnego","ok":true,"w":"Ład IT jest częścią ładu korporacyjnego i obejmuje całą organizację, nie tylko funkcję IT – tak mówi Zasada 2: Pokrycie całej organizacji."},{"t":"Dotyczy wyłącznie działu IT","ok":false,"w":"Ład IT obejmuje całą organizację."},{"t":"Stoi ponad ładem korporacyjnym","ok":false,"w":"Ład IT jest częścią ładu korporacyjnego, a nie nad nim."},{"t":"Całkowicie zastępuje ład korporacyjny","ok":false,"w":"Ład IT jest częścią ładu korporacyjnego, nie jego zamiennikiem."}],"fz":{"h":"Ład IT a ład korporacyjny","p":"P2","pulapka":false,"n":"EN: Governance of enterprise IT is part of corporate governance","q":"Czy Ład IT jest odrębny od ładu korporacyjnego?","a":"Nie. Zasada 2: Ład IT jest częścią ładu korporacyjnego i obejmuje całą organizację, nie tylko funkcję IT.","ex":"Rachunek za internet to część budżetu domu, nie osobny budżet. Tak samo Ład IT to część rządzenia całą organizacją.","org":""},"cyt":{"s":"23","t":"Nadzór nad technologiami informatycznymi w organizacji jest częścią ładu korporacyjnego.","w":"ZGODNE","u":"Obejmowanie wszystkich funkcji i procesów, nie tylko funkcji IT — s. 14."}},"fz-A-041":{"id":"fz-A-041","typ":"egzamin","s":"PR-01-02","t":"Co sprawia, że aktywatorów nie rozpatruje się osobno?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 28"],"r":null,"zap":"","scen":"","o":[{"t":"Wszystkie należą do domeny EDM","ok":false,"w":"Aktywatory to 7 kategorii, a nie procesy jednej domeny."},{"t":"Każdy aktywator ma ten sam cel","ok":false,"w":"Każdy aktywator ma własne cele; łączy je wymiana wejść i wyników."},{"t":"Są wzajemnie powiązane wejściami i wynikami","ok":true,"w":"Aktywatory są wzajemnie powiązane: każdy potrzebuje wejść od innych i daje wyniki innym, np. procesy potrzebują informacji, a struktury – umiejętności i zachowań."},{"t":"Tylko procesy mają cele, a reszta je wspiera","ok":false,"w":"Cele mają wszystkie aktywatory – kaskada kończy się na celach każdego z nich."}],"fz":{"h":"Powiązania aktywatorów","p":"P1","pulapka":false,"n":"EN: Interconnected enablers","q":"Dlaczego aktywatorów nie można rozpatrywać osobno?","a":"Są wzajemnie powiązane: każdy potrzebuje wejść od innych (procesy – informacji, struktury – umiejętności i zachowań) i daje wyniki innym.","ex":"Jak w kuchni: kucharz potrzebuje przepisu (informacja), umiejętności i sprzętu, a jego danie trafia do kelnera. Elementy przekazują sobie wyniki, więc działają razem.","org":""},"cyt":{"s":"28","t":"będzie w pełni efektywny tylko wtedy, jeśli zapewnione zostaną dane wejściowe innych czynników umożliwiających, np. procesy wymagają informacji, struktury organizacyjne wymagają umiejętności i zachowania; • zapewnia wynik, z którego korzystają inne czynniki umożliwiające","w":"ZGODNE"}},"fz-A-043":{"id":"fz-A-043","typ":"egzamin","s":"PR-02-04","t":"Co oznacza litera S w macierzach mapowania Kaskady Celów?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 18","FW-PL s. 19","FW-PL s. 20"],"r":null,"zap":"","scen":"","o":[{"t":"Brak istotnego związku","ok":false,"w":"Puste pole oznacza, że typowa macierz nie wskazuje istotnego związku. Litera S (Secondary — powiązanie wspierające) oznacza istniejące powiązanie wspierające, słabsze od P (Primary — powiązanie podstawowe)."},{"t":"Powiązanie podstawowe, najsilniejsze","ok":false,"w":"Powiązanie podstawowe oznacza P (Primary — powiązanie podstawowe). S (Secondary — powiązanie wspierające) oznacza powiązanie wspierające; obie litery opisują typowy stopień powiązania, a nie rodzaj celu."},{"t":"Cel strategiczny organizacji","ok":false,"w":"S (Secondary — powiązanie wspierające) nie oznacza strategicznego rodzaju celu. Oznacza stopień powiązania — wspierający — w konkretnej macierzy."},{"t":"Powiązanie wspierające, słabsze od P","ok":true,"w":"S (Secondary — powiązanie wspierające; tak samo w podręczniku) wskazuje relację słabszą od P (Primary — podstawowe), ale nadal istotną (FW-PL s. 18, 49). Tabele nie są uniwersalną prawdą: mapowania należy dopasować do kontekstu organizacji (FW-PL s. 20)."}],"fz":{"h":"P i S w macierzach","p":"P1","pulapka":false,"n":"egzamin: podstawowe / wspierające · podr.: podstawowe / wspierające (słabsze) · EN: primary / secondary · EN: Secondary ≠ none","q":"Czy relacja S oznacza brak związku z celem Ładu?","a":"P (Primary — podstawowe) oznacza powiązanie podstawowe. S (Secondary — wspierające; podr. drugorzędne) oznacza powiązanie słabsze od P, lecz nadal istotne. Na Rysunku 5 powiązania łączą cele organizacji z korzyściami, ryzykiem i zasobami; w załącznikach stosuje się je również na dalszych poziomach kaskady. Puste pole oznacza brak wskazanej istotnej relacji w typowym mapowaniu, a nie uniwersalny zakaz powiązania. Macierze trzeba dostosować do kontekstu organizacji.","ex":"Macierz to mapa typowych powiązań: główne oznacza się P (Primary — powiązanie podstawowe), pomocnicze S (Secondary — powiązanie wspierające). Puste pole mówi, że model nie wskazał istotnej relacji; organizacja może dopasować mapę do własnej sytuacji. Nie oznacza to, że inna droga nigdy nie istnieje.","org":"CO7 (Enterprise Goal 7 — cel organizacji 7: Ciągłość i dostępność usług biznesowych) →P (Primary — powiązanie podstawowe)→ IT04 (IT-related Goal 04 — cel związany z informatyką 04: Zarządzanie ryzykiem biznesowym związanym z IT); CO7 →S (Secondary — powiązanie wspierające)→ IT07 (IT-related Goal 07 — cel związany z informatyką 07: Dostarczanie usług IT zgodnie z wymogami biznesowymi)."},"cyt":{"s":"49","t":"S (ang. Secondary) oznacza relację wspierającą, wciąż silną, ale mniej istotną","w":"ZGODNE","u":"Na s. 18: „S — wspierającą, tj. słabszą”."}},"fz-A-044":{"id":"fz-A-044","typ":"egzamin","s":"PR-02-14","t":"Które stwierdzenie o strukturach organizacyjnych Ładu i Zarządzania jest prawdziwe?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 14"],"r":null,"zap":"","scen":"","o":[{"t":"Wymagają różnych struktur organizacyjnych","ok":true,"w":"Ład i Zarządzanie mają różne działania, struktury i cele. Wybrane obowiązki Ładu można delegować specjalnym strukturom na właściwym poziomie; takie delegowanie nie znosi rozróżnienia dyscyplin."},{"t":"To jedna struktura o dwóch nazwach","ok":false,"w":"Zasada 5: Ład i Zarządzanie wymagają różnych struktur."},{"t":"Odpowiedzialności Ładu nie wolno nikomu delegować","ok":false,"w":"Odpowiedzialności Ładu można delegować specjalnym strukturom."},{"t":"Mają te same struktury, działania i cele","ok":false,"w":"Ład i Zarządzanie mają różne działania i cele."}],"fz":{"h":"Struktury Ładu i Zarządzania","p":"P1","pulapka":true,"n":"EN: Different structures","q":"Czy Ład i Zarządzanie mają te same struktury organizacyjne?","a":"Ład i Zarządzanie są różnymi dyscyplinami: mają odmienne działania i cele oraz wymagają różnych struktur organizacyjnych. Poszczególne obowiązki Ładu mogą być delegowane specjalnym strukturom na właściwym poziomie; nie znosi to rozróżnienia obu dyscyplin.","ex":"W klubie sportowym zarząd i trenerzy to różne grupy z innymi zadaniami. Zarząd może jednak powołać komisję, która zrobi część jego pracy.","org":""},"cyt":{"s":"31","t":"Każda z tych dziedzin obejmuje działania o odmiennym charakterze, wymaga różnych struktur organizacyjnych i służy innym celom.","w":"ZGODNE","u":"Delegowanie obowiązków nadzoru specjalnym strukturom — s. 14."}},"fz-A-045":{"id":"fz-A-045","typ":"egzamin","s":"PR-02-04,PR-02-05","t":"Jak grupuje się cele w wymiarach zrównoważonej karty wyników (BSC)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 18–19"],"r":null,"zap":"","scen":"","o":[{"t":"Tylko cele organizacji; cele IT nie są grupowane","ok":false,"w":"Cele związane z informatyką grupuje się w wymiarach IT BSC."},{"t":"Cele organizacji w BSC, cele IT w IT BSC","ok":true,"w":"Cele organizacji są w wymiarach BSC, a cele związane z informatyką w wymiarach IT BSC; obie listy po 17 celów mają te same cztery rubryki."},{"t":"Cele organizacji; cele IT według domen PBRM","ok":false,"w":"Domeny grupują procesy, a cele IT są w wymiarach IT BSC."},{"t":"Cele organizacji oraz procesy domeny EDM","ok":false,"w":"BSC grupuje cele organizacji i cele IT, nie procesy."}],"fz":{"h":"BSC i IT BSC","p":"P2","pulapka":false,"n":"egzamin: zrównoważona karta wyników (BSC) · podr.: zrównoważona karta wyników (BSC) · EN: balanced scorecard · EN: BSC and IT BSC","q":"W jakich wymiarach grupuje się cele? / Czy BSC dotyczy tylko celów organizacji?","a":"Cele organizacji w wymiarach BSC: finanse, klient, obszar wewnętrzny, szkolenie i rozwój. Cele związane z informatyką w wymiarach IT BSC.\nNie. Cele organizacji ułożono w wymiarach BSC, a cele związane z informatyką – w wymiarach IT BSC; obie listy mają po 17 celów.","ex":"Cztery rubryki jak na świadectwie: pieniądze, klient, wnętrze firmy (jak pracujemy), nauka i rozwój. Cele IT mają takie same cztery rubryki.\nBSC (Zrównoważona karta wyników) to tablica z czterema rubrykami: pieniądze, klient, praca wewnątrz, rozwój ludzi. Firma i IT mają osobne tablice, po 17 celów.","org":""},"cyt":{"s":"18","t":"cele związane z IT są ustrukturyzowane zgodnie z wymiarami zrównoważonej karty wyników IT (IT BSC).","w":"ZGODNE","u":"Cele przedsiębiorstwa w wymiarach BSC — s. 17 (krok 2) i s. 18."}},"fz-A-046":{"id":"fz-A-046","typ":"egzamin","s":"PR-02-04","t":"Który z poniższych NIE jest wymiarem zrównoważonej karty wyników (BSC) w COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 18–19"],"r":null,"zap":"","scen":"","o":[{"t":"Finanse","ok":false,"w":"Finanse to jeden z czterech wymiarów BSC."},{"t":"Klient","ok":false,"w":"Klient to jeden z czterech wymiarów BSC."},{"t":"Szkolenie i rozwój","ok":false,"w":"Szkolenie i rozwój to jeden z czterech wymiarów BSC."},{"t":"Ryzyko","ok":true,"w":"Wymiary BSC to: finanse, klient, obszar wewnętrzny, szkolenie i rozwój – ryzyka wśród nich nie ma."}],"fz":{"h":"BSC i IT BSC","p":"P2","pulapka":false,"n":"egzamin: zrównoważona karta wyników (BSC) · podr.: zrównoważona karta wyników (BSC) · EN: balanced scorecard · EN: BSC and IT BSC","q":"W jakich wymiarach grupuje się cele? / Czy BSC dotyczy tylko celów organizacji?","a":"Cele organizacji w wymiarach BSC: finanse, klient, obszar wewnętrzny, szkolenie i rozwój. Cele związane z informatyką w wymiarach IT BSC.\nNie. Cele organizacji ułożono w wymiarach BSC, a cele związane z informatyką – w wymiarach IT BSC; obie listy mają po 17 celów.","ex":"Cztery rubryki jak na świadectwie: pieniądze, klient, wnętrze firmy (jak pracujemy), nauka i rozwój. Cele IT mają takie same cztery rubryki.\nBSC (Zrównoważona karta wyników) to tablica z czterema rubrykami: pieniądze, klient, praca wewnątrz, rozwój ludzi. Firma i IT mają osobne tablice, po 17 celów.","org":""},"cyt":{"s":"50","t":"Finanse Klient Obszar wewnętrzny Szkolenie i rozwój","w":"ZGODNE","u":"Nagłówki wymiarów BSC w tabeli (Ilustracja 22); te same wymiary na Ilustracji 5, s. 19 — ryzyka wśród nich nie ma."}},"fz-A-047":{"id":"fz-A-047","typ":"egzamin","s":"PR-01-04","t":"Co wyznacza przypisanie procesu do domeny?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 32","FW-PL s. 33"],"r":null,"zap":"","scen":"","o":[{"t":"Proces z APO wykonuje wyłącznie planowanie","ok":false,"w":"Większość procesów zawiera wszystkie cztery działania PBRM (Plan, Build, Run and Monitor — Planuj, Wytwarzaj/Twórz, Wykonuj i Monitoruj)."},{"t":"Domena wskazuje główny obszar działania procesu","ok":true,"w":"Przypisanie do domeny wskazuje najwłaściwszy główny obszar. Większość procesów potrzebuje planowania, budowania, wykonywania i monitorowania w swoim zakresie; PBRM (Plan, Build, Run and Monitor — Planuj, Wytwarzaj/Twórz, Wykonuj i Monitoruj) nie tworzy czterech rozłącznych etapów wyłącznych dla domen."},{"t":"Każdy proces ma dokładnie jedną fazę PBRM","ok":false,"w":"Domena nie wyznacza jednej wyłącznej czynności. Większość procesów obejmuje działania z wszystkich czterech obszarów Zarządzania w odniesieniu do własnego zakresu."},{"t":"Procesy w ogóle nie są przypisane do domen","ok":false,"w":"Każdy z 37 procesów jest przypisany do jednej z 5 domen."}],"fz":{"h":"Domeny a fazy PBRM","p":"P1","pulapka":true,"n":"EN: Domain = most relevant area","q":"Czy domeny przypisują procesy wyłącznie do jednej fazy PBRM?","a":"Nie. Domeny wskazują najwłaściwszy główny obszar dzia
