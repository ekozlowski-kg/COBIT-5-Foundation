oszeń: zaplanowany, zbudowany, używany, oceniany."}},"fz-B-054":{"id":"fz-B-054","typ":"egzamin","s":"PR-02-12","t":"Co obejmuje wymiar Dobre praktyki aktywatora?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 28","FW-PL s. 29"],"r":null,"zap":"","scen":"","o":[{"t":"Wewnętrznych i zewnętrznych interesariuszy z ich rolami","ok":false,"w":"To wymiar Interesariusze."},{"t":"Etapy od planowania do wycofania","ok":false,"w":"To wymiar Cykl życia."},{"t":"Przykłady wdrożenia i wymagane produkty pracy: wejścia oraz wyjścia","ok":true,"w":"Przykładami lub sugestiami optymalnego wdrożenia aktywatora, z wymaganymi produktami pracy (wejściami i wyjściami). Dla części aktywatorów korzysta się z innych standardów."},{"t":"Mierniki osiągnięcia celów aktywatora","ok":false,"w":"To wskaźniki opóźnione."}],"fz":{"h":"Dobre praktyki","p":"P2","pulapka":false,"n":"egzamin: dobre praktyki · podr.: dobre praktyki · EN: good practices","q":"Czym jest wymiar Dobre praktyki aktywatora?","a":"Przykładami lub sugestiami optymalnego wdrożenia aktywatora, z wymaganymi produktami pracy (wejściami i wyjściami). Dla części aktywatorów korzysta się z innych standardów.","ex":"Sprawdzone porady, jak zrobić coś najlepiej, jak przepis od babci, plus lista, co trzeba mieć na start i co ma wyjść. Czasem przepis bierze się z innej książki (standardu).","org":"procedura DSS02 (Manage Service Requests and Incidents — Zarządzanie zgłoszeniami serwisowymi i incydentami) oparta na ITIL (Information Technology Infrastructure Library — biblioteka praktyk zarządzania usługami informatycznymi)."}},"fz-B-055":{"id":"fz-B-055","typ":"egzamin","s":"PR-02-12","t":"Kim są interesariusze aktywatora?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 28","FW-PL s. 29"],"r":null,"zap":"","scen":"","o":[{"t":"Osoby zarządzające aktywatorem, bez użytkowników jego wyników","ok":false,"w":"Zarządzający aktywatorem są interesariuszami, ale są nimi również strony korzystające z jego wyników lub zainteresowane nimi."},{"t":"Odbiorcy wyników aktywatora, bez osób uczestniczących w jego realizacji","ok":false,"w":"Odbiorcy wyników są interesariuszami, lecz definicja obejmuje także osoby aktywnie realizujące działania aktywatora."},{"t":"Role rozliczane za aktywator w tabeli RACI","ok":false,"w":"Rola A w tabeli RACI (Responsible, Accountable, Consulted, Informed — Odpowiedzialny, Rozliczany, Konsultowany, Informowany) jest jedną z możliwych odpowiedzialności. Interesariusze obejmują również inne role oraz strony zainteresowane aktywatorem lub jego wynikami."},{"t":"Strony uczestniczące w aktywatorze lub zainteresowane jego wynikami","ok":true,"w":"Interesariusze to strony aktywnie uczestniczące w aktywatorze lub zainteresowane nim i jego wynikami. Mogą być wewnętrzni i zewnętrzni; ich interesy mogą być różne."}],"fz":{"h":"Interesariusze aktywatora","p":"P2","pulapka":false,"n":"egzamin: interesariusze · podr.: interesariusze · EN: stakeholders","q":"Kim są interesariusze aktywatora?","a":"Interesariusze aktywatora to strony odgrywające w nim aktywną rolę lub zainteresowane nim albo jego wynikami. Mogą być wewnętrzni i zewnętrzni oraz mieć różne, nawet sprzeczne interesy. Grupa ta nie ogranicza się do kierownictwa, odbiorców wyników ani jednej roli w tabeli odpowiedzialności.","ex":"Interesariusz = każdy, kogo coś dotyczy albo komu na tym zależy. Przy szkolnej stołówce: kucharki, uczniowie, rodzice, sanepid – każdy chce czegoś innego.","org":"procedura: dyżurni, komendy, kierownictwo, audyt."}},"fz-B-056":{"id":"fz-B-056","typ":"egzamin","s":"PR-01-05","t":"Które z poniższych NIE jest jednym z czterech pytań zarządzania wydajnością aktywatora?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 29"],"r":null,"zap":"","scen":"","o":[{"t":"Czy uwzględniono potrzeby interesariuszy?","ok":false,"w":"To pytanie 1."},{"t":"Czy osiągnięto cele aktywatora?","ok":false,"w":"To pytanie 2."},{"t":"Czy stosowane są dobre praktyki?","ok":false,"w":"To pytanie 4."},{"t":"Czy aktywator ma uzasadnienie biznesowe?","ok":true,"w":"Uzasadnienie biznesowe nie jest jednym z czterech pytań zarządzania wydajnością aktywatora. Cztery pytania dotyczą potrzeb interesariuszy, osiągnięcia celów, zarządzania cyklem życia i stosowania dobrych praktyk. Uzasadnienie biznesowe jest istotne w cyklu wdrożenia."}],"fz":{"h":"Cztery pytania zarządzania wydajnością aktywatora","p":"P1","pulapka":false,"n":"EN: Enabler performance management – 4 questions","q":"Jakie dwa aspekty obejmuje pomiar aktywatora?","a":"Czy potrzeby interesariuszy są spełnione (cele osiągnięte)? Czy aktywatorem dobrze się zarządza (cykl życia, dobre praktyki)? Pełne cztery pytania – na karcie o zarządzaniu wydajnością aktywatora.","ex":"Jak przy diecie: czy schudłem (cel osiągnięty)? I czy trzymam się planu posiłków (dobrze tym zarządzam)? Pierwsze mierzą wskaźniki opóźnione, drugie wiodące.","org":""}},"fz-B-057":{"id":"fz-B-057","typ":"egzamin","s":"PR-02-12","t":"Czy aktywator opisuje się w oderwaniu od innych aktywatorów?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 28"],"r":null,"zap":"","scen":"","o":[{"t":"Nie – model aktywatora uwzględnia jego zależności od pozostałych (Zasada 4)","ok":true,"w":"Tak: aktywator opisuje się razem z tym, od czego zależy."},{"t":"Tak – każdy aktywator ma własny, niezależny model","ok":false,"w":"Model uwzględnia powiązania z innymi aktywatorami."},{"t":"Tak – powiązania opisuje się tylko dla procesów","ok":false,"w":"Powiązania dotyczą każdego aktywatora."},{"t":"Nie – ale powiązania dotyczą tylko aktywatorów będących zasobami","ok":false,"w":"Model uwzględnia zależności od wszystkich pozostałych aktywatorów."}],"fz":{"h":"Powiązania z innymi aktywatorami","p":"P1","pulapka":false,"n":"egzamin: powiązania · podr.: powiązania · EN: interconnected enablers","q":"Czy aktywator opisuje się w oderwaniu od innych?","a":"Nie. Model aktywatora uwzględnia jego zależności od pozostałych (Zasada 4).","ex":"Jak straż pożarna: wóz bez strażaków, a strażacy bez wody i dyspozytora nic nie zdziałają. Dlatego aktywator opisuje się razem z tym, od czego zależy.","org":"procedura potrzebuje dyżurnych, rejestru i systemu."}},"fz-B-058":{"id":"fz-B-058","typ":"egzamin","s":"PR-02-13","t":"Na które z czterech pytań zarządzania wydajnością aktywatora odpowiadają wskaźniki opóźnione (podr.: następujące)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 29","Altkom — Różnice tłumaczenia PL, s. 1"],"r":null,"zap":"","scen":"","o":[{"t":"Na pytania 3 i 4 – o cykl życia i dobre praktyki","ok":false,"w":"Na te odpowiadają wskaźniki wiodące."},{"t":"Na pytania 1 i 2 – o potrzeby interesariuszy i cele aktywatora","ok":true,"w":"Wskaźniki opóźnione (lag indicators; podr. wskaźniki następujące) mierzą rzeczywiste wyniki: czy uwzględniono potrzeby interesariuszy i czy osiągnięto cele aktywatora — pytania 1 i 2. Ocenia się je względem konkretnego celu. Wskaźniki wiodące (lead indicators; podr. wyprzedzające) mierzą sposób zarządzania cyklem życia i stosowanie dobrych praktyk — pytania 3 i 4."},{"t":"Tylko na pytanie 4 – o dobre praktyki","ok":false,"w":"Dobre praktyki mierzą wskaźniki wiodące."},{"t":"Na wszystkie cztery pytania jednocześnie","ok":false,"w":"Pytania dzielą się: 1–2 opóźnione, 3–4 wiodące."}],"fz":{"h":"Wskaźniki opóźnione","p":"P1","pulapka":true,"n":"≠ TŁUMACZENIE · egzamin: wskaźniki opóźnione · podr.: wskaźniki następujące · EN: lag indicators","q":"Czym są wskaźniki opóźnione?","a":"Wskaźniki opóźnione (lag indicators; podr. wskaźniki następujące) mierzą rzeczywiste wyniki: czy uwzględniono potrzeby interesariuszy i czy osiągnięto cele aktywatora — pytania 1 i 2. Ocenia się je względem konkretnego celu. Wskaźniki wiodące (lead indicators; podr. wyprzedzające) mierzą sposób zarządzania cyklem życia i stosowanie dobrych praktyk — pytania 3 i 4.","ex":"Jak waga na koniec miesiąca: pokazuje wynik po fakcie, czyli odpowiada na pytania 1 i 2. Pułapka: podręcznik mówi „wskaźniki następujące”.","org":"łączna przerwa usług krytycznych w roku."}},"fz-B-059":{"id":"fz-B-059","typ":"egzamin","s":"PR-02-13","t":"Co mierzą wskaźniki wiodące (podr.: wyprzedzające)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 29","Altkom — Różnice tłumaczenia PL, s. 1"],"r":null,"zap":"","scen":"","o":[{"t":"Czy cele aktywatora zostały już osiągnięte","ok":false,"w":"To mierzą wskaźniki opóźnione."},{"t":"Wynik po fakcie, np. łączną przerwę usług krytycznych w roku","ok":false,"w":"To przykład wskaźnika opóźnionego."},{"t":"Czy aktywatorem dobrze się zarządza (stosowanie praktyk), co zapowiada wynik","ok":true,"w":"Wskaźniki wiodące (lead indicators; podr. wyprzedzające) mierzą rzeczywiste funkcjonowanie aktywatora: zarządzanie jego cyklem życia i stosowanie dobrych praktyk — pytania 3 i 4. Pomagają przewidywać osiągnięcie rezultatu, ale go nie gwarantują. Ten sam miernik może mieć różną rolę względem różnych celów, dlatego trzeba wskazać cel odniesienia."},{"t":"Apetyt na ryzyko ustalony przez Ład","ok":false,"w":"Apetyt na ryzyko ustala proces EDM03 (Ensure Risk Optimisation — Zapewnienie optymalizacji ryzyka), a nie wskaźnik."}],"fz":{"h":"Wskaźniki wiodące","p":"P1","pulapka":true,"n":"≠ TŁUMACZENIE · egzamin: wskaźniki wiodące · podr.: wskaźniki wyprzedzające · EN: lead indicators","q":"Czym są wskaźniki wiodące?","a":"Wskaźniki wiodące (lead indicators; podr. wyprzedzające) mierzą rzeczywiste funkcjonowanie aktywatora: zarządzanie jego cyklem życia i stosowanie dobrych praktyk — pytania 3 i 4. Pomagają przewidywać osiągnięcie rezultatu, ale go nie gwarantują. Ten sam miernik może mieć różną rolę względem różnych celów, dlatego trzeba wskazać cel odniesienia.","ex":"Jak codzienne zapisywanie posiłków: widzisz, czy robisz to dobrze, zanim wynik się pojawi; to pytania 3 i 4. Pułapka: podręcznik mówi „wskaźniki wyprzedzające”.","org":"odsetek zgłoszeń w jednym rejestrze."}},"fz-B-060":{"id":"fz-B-060","typ":"egzamin","s":"PR-02-12","t":"Jakie są cztery wspólne wymiary aktywatora?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 28"],"r":null,"zap":"","scen":"","o":[{"t":"Jakość wewnętrzna, jakość kontekstowa, dostęp i bezpieczeństwo, wydajność","ok":false,"w":"To nie jest lista czterech wspólnych wymiarów. Cele grupuje się w trzy kategorie: jakość wewnętrzna, jakość kontekstowa oraz dostęp i bezpieczeństwo. Wydajność nie jest czwartą kategorią celów ani wspólnym wymiarem."},{"t":"Planuj, Twórz, Wykonuj, Monitoruj","ok":false,"w":"To obszary działań Zarządzania (PBRM (Plan, Build, Run and Monitor — Planuj, Wytwarzaj/Twórz, Wykonuj i Monitoruj))."},{"t":"Zasady, Procesy, Struktury organizacyjne, Kultura","ok":false,"w":"To część z siedmiu kategorii aktywatorów."},{"t":"Interesariusze, cele, cykl życia, dobre praktyki","ok":true,"w":"Cztery wspólne wymiary to Interesariusze, Cele, Cykl życia i Dobre praktyki. Dzięki nim każdy aktywator można opisać w podobny, uporządkowany sposób, zachowując jego własne cele i zależności."}],"fz":{"h":"Wymiary aktywatora","p":"P1","pulapka":false,"n":"≠ TŁUMACZENIE · egzamin: wymiary aktywatora · podr.: wymiary czynnika umożliwiającego · EN: enabler dimensions","q":"Podaj cztery wspólne wymiary aktywatora.","a":"Cztery wspólne wymiary aktywatora: Interesariusze, Cele, Cykl życia, Dobre praktyki. Cele są jednym wymiarem; ich trzy kategorie jakościowe nie są dodatkowymi wymiarami. Siedem kategorii aktywatorów to jeszcze inny podział.","ex":"Cztery pytania o każdą rzecz: dla kogo (interesariusze), po co (cele), od narodzin do końca (cykl życia), jak robić to dobrze (dobre praktyki). Haczyk: „Kto, Po co, Kiedy, Jak”.","org":""}},"fz-B-061":{"id":"fz-B-061","typ":"egzamin","s":"PR-01-02","t":"Który z poniższych NIE jest jedną z siedmiu kategorii aktywatorów COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 27"],"r":null,"zap":"","scen":"","o":[{"t":"Kultura, Etyka i Zachowanie","ok":false,"w":"To kategoria nr 4."},{"t":"Interesariusze","ok":true,"w":"To jeden z czterech wymiarów aktywatora, a nie kategoria aktywatora."},{"t":"Informacja","ok":false,"w":"To kategoria nr 5."},{"t":"Ludzie, Umiejętności i Kompetencje","ok":false,"w":"To kategoria nr 7."}],"fz":{"h":"Siedem kategorii aktywatorów","p":"P1","pulapka":false,"n":"EN: Principles, Policies and Frameworks; Processes; Organisational Structures; Culture, Ethics and Behaviour; Information; Services, Infrastructure and Applications; People, Skills and Competencies","q":"Podaj siedem kategorii aktywatorów (nazwy egzaminacyjne).","a":"1. Zasady, Polityki i Struktury ramowe. 2. Procesy. 3. Struktury organizacyjne. 4. Kultura, Etyka i Zachowanie. 5. Informacja. 6. Usługi, Infrastruktura i Aplikacje. 7. Ludzie, Umiejętności i Kompetencje.","ex":"Siedem rzeczy, bez których restauracja nie działa: regulamin, przepisy kuchenne, podział stanowisk, atmosfera, informacja, sprzęt i lokal, ludzie z umiejętnościami. Haczyk: od zasad do ludzi.","org":""}},"fz-B-063":{"id":"fz-B-063","typ":"egzamin","s":"PR-02-12","t":"Po co aktywatory mają wspólne wymiary?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 28"],"r":null,"zap":"","scen":"","o":[{"t":"Pozwalają ocenić poziom zdolności każdego procesu","ok":false,"w":"Formalna ocena zdolności procesu wykorzystuje osobny model oceny i atrybuty procesu. Wspólne wymiary służą do uporządkowanego opisu wszystkich aktywatorów oraz ich interakcji."},{"t":"Ustalają wspólne cele i wartości mierników dla wszystkich aktywatorów","ok":false,"w":"Wspólny model opisu nie oznacza jednakowych celów ani identycznych wartości mierników. Każdy aktywator ma własnych interesariuszy, cele, cykl życia i dobre praktyki."},{"t":"Ujednolicają opis aktywatorów i ułatwiają zarządzanie ich relacjami","ok":true,"w":"Wspólne wymiary upraszczają i ujednolicają opis aktywatorów, pomagają zarządzać ich interakcjami i wspierają skuteczne wykorzystanie. Nie znoszą różnic między aktywatorami."},{"t":"Ustalają kolejność wdrażania aktywatorów w Kaskadzie Celów","ok":false,"w":"Wymiary nie ustanawiają kolejności wdrażania. Priorytety wynikają z celów i kontekstu organizacji; Kaskada Celów przekłada potrzeby na cele, a wymiary opisują aktywatory."}],"fz":{"h":"Po co wspólne wymiary","p":"P2","pulapka":false,"n":"EN: Purpose of common enabler dimensions","q":"Po co aktywatory mają wspólne wymiary?","a":"Wspólne wymiary pozwalają opisywać aktywatory w prosty, ustrukturyzowany sposób, zarządzać ich złożonymi interakcjami i skutecznie je wykorzystywać. Wspólny sposób opisu nie oznacza wspólnych celów, identycznych mierników ani jednej kolejności wdrażania.","ex":"Jak jeden formularz dla wszystkich urządzeń w domu: każde opisujesz tak samo, więc łatwiej porównać i zobaczyć, jak ze sobą współpracują.","org":""}},"fz-C-001":{"id":"fz-C-001","typ":"egzamin","s":"PR-01-02","t":"Czym jest aktywator w COBIT 5 i ile jest ich kategorii?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 27"],"r":null,"zap":"","scen":"","o":[{"t":"Wszystko, co pomaga osiągnąć cele organizacji; kategorii jest 7","ok":true,"w":"Aktywator (enabler; podr. czynnik umożliwiający) to czynnik ułatwiający osiągnięcie celów organizacji. Siedem kategorii: Zasady, Polityki i Struktury ramowe; Procesy; Struktury organizacyjne; Kultura, Etyka i Zachowanie; Informacja; Usługi, Infrastruktura i Aplikacje; Ludzie, Umiejętności i Kompetencje. Współdziałają systemowo — to Zasada 4, Aktywacja holistycznego podejścia."},{"t":"Wszystko, co pomaga osiągnąć cele organizacji; kategorii jest 5","ok":false,"w":"Pięć to liczba zasad COBIT 5, aktywatorów jest 7 kategorii."},{"t":"Wyłącznie zasoby IT organizacji; kategorii jest 7","ok":false,"w":"Aktywatorami są też np. kultura, polityki i struktury, nie tylko zasoby IT (Information Technology — technologie informacyjne)."},{"t":"Proces z Referencyjnego Modelu Procesu; kategorii jest 37","ok":false,"w":"Procesy to tylko jedna z 7 kategorii aktywatorów; 37 to liczba procesów."}],"fz":{"h":"Aktywator","p":"P1","pulapka":false,"n":"egzamin: aktywator · podr.: czynnik umożliwiający · EN: enabler","q":"Czym jest aktywator i ile jest kategorii?","a":"Aktywator (enabler; podr. czynnik umożliwiający) to czynnik ułatwiający osiągnięcie celów organizacji. Siedem kategorii: Zasady, Polityki i Struktury ramowe; Procesy; Struktury organizacyjne; Kultura, Etyka i Zachowanie; Informacja; Usługi, Infrastruktura i Aplikacje; Ludzie, Umiejętności i Kompetencje. Współdziałają systemowo — to Zasada 4, Aktywacja holistycznego podejścia.","ex":"Aktywator to wszystko, dzięki czemu restauracja działa: regulamin, przepisy, stanowiska, atmosfera, zamówienia, sprzęt, kucharze. Siedem po kolei: „Zupa Pomidorowa Smakuje Kucharzom I Uczniom Licealnym”.","org":"w organizacji: procedura obsługi zgłoszeń, dyżur całodobowy, jeden rejestr zgłoszeń, przeszkoleni dyżurni."}},"fz-C-002":{"id":"fz-C-002","typ":"egzamin","s":"PR-01-02","t":"Jaką rolę pełni aktywator Informacja?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 27"],"r":null,"zap":"","scen":"","o":[{"t":"Jest kluczową jednostką podejmującą decyzje w organizacji","ok":false,"w":"Tak opisuje się Struktury organizacyjne."},{"t":"Zamienia pożądane zachowania w praktyczne wskazówki na co dzień","ok":false,"w":"To rola Zasad, polityk i struktur ramowych."},{"t":"Obejmuje tworzone i używane informacje; wspiera działanie organizacji i Ład","ok":true,"w":"Wszystkie informacje, które organizacja tworzy i wykorzystuje. Bez nich nie da się działać ani sprawować Ładu; w codziennej pracy często są głównym produktem."},{"t":"Obejmuje infrastrukturę, technologie i aplikacje do przetwarzania informacji","ok":false,"w":"To rola aktywatora Usługi, infrastruktura i aplikacje."}],"fz":{"h":"Informacja","p":"P1","pulapka":false,"n":"egzamin: informacja · podr.: informacja · EN: information","q":"Jaką rolę pełni Informacja?","a":"Wszystkie informacje, które organizacja tworzy i wykorzystuje. Bez nich nie da się działać ani sprawować Ładu; w codziennej pracy często są głównym produktem.","ex":"W restauracji to bloczki zamówień, menu, rachunki i lista alergenów. Bez kartki z zamówieniem kucharz nie wie, co gotować. Dla banku czy biura podróży informacja bywa wręcz tym, co się sprzedaje.","org":"rejestr zgłoszeń, raport dostępności usług, protokół z omówienia awarii."}},"fz-C-003":{"id":"fz-C-003","typ":"egzamin","s":"PR-01-02","t":"Jak COBIT 5 opisuje znaczenie aktywatora Kultura, etyka i zachowanie?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 27"],"r":null,"zap":"","scen":"","o":[{"t":"W codziennej pracy jest często głównym produktem organizacji","ok":false,"w":"To cecha aktywatora Informacja."},{"t":"Dotyczy ludzi i całej organizacji; to często niedoceniany czynnik sukcesu Ładu i Zarządzania","ok":true,"w":"Kultura, etyka i zachowanie dotyczą ludzi i całej organizacji. COBIT 5 opisuje je jako często niedoceniany czynnik sukcesu Ładu i Zarządzania. Nie są wyłącznie sprawą kadry kierowniczej; wpływają np. na to, czy pracownicy rzeczywiście przestrzegają znanych polityk."},{"t":"Jest uporządkowanym zbiorem praktyk i działań dających określone wyniki","ok":false,"w":"To definicja Procesów."},{"t":"Dotyczy wyłącznie zachowań kadry kierowniczej","ok":false,"w":"Dotyczy ludzi i całej organizacji, nie tylko kierownictwa."}],"fz":{"h":"Kultura, etyka i zachowanie","p":"P1","pulapka":false,"n":"egzamin: kultura, etyka i zachowanie · podr.: kultura, etyka i zachowanie · EN: culture, ethics and behaviour","q":"Jaką rolę pełni Kultura, etyka i zachowanie?","a":"Kultura, etyka i zachowanie dotyczą ludzi i całej organizacji. COBIT 5 opisuje je jako często niedoceniany czynnik sukcesu Ładu i Zarządzania. Nie są wyłącznie sprawą kadry kierowniczej; wpływają np. na to, czy pracownicy rzeczywiście przestrzegają znanych polityk.","ex":"Przykład: pracownik zna procedurę bezpieczeństwa i umie ją stosować, ale świadomie ją lekceważy. Sam dokument nie usuwa tego problemu — trzeba zadbać o normy, przykład przywódców, bodźce i zachowanie.","org":"błędy zgłaszamy bez szukania winnych; dyżurny nie ukrywa awarii przed przełożonym."}},"fz-C-004":{"id":"fz-C-004","typ":"egzamin","s":"PR-01-02","t":"Które stwierdzenie najwierniej odpowiada opisowi roli aktywatora Ludzie, umiejętności i kompetencje w COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 27","FW-PL s. 28"],"r":null,"zap":"","scen":"","o":[{"t":"Do formalnego spisania wytycznych organu Ładu i kierownictwa","ok":false,"w":"Ludzie uczestniczą w formułowaniu wytycznych, ale zdanie opisuje typową rolę kategorii Zasady, polityki i struktury ramowe. Nie jest najwierniejszym opisem roli kategorii Ludzie, umiejętności i kompetencje."},{"t":"Do przetwarzania informacji i dostarczania usług IT","ok":false,"w":"Ludzie są potrzebni także do przetwarzania informacji i świadczenia usług. W opisie siedmiu kategorii takie sformułowanie odpowiada jednak przede wszystkim Usługom, infrastrukturze i aplikacjom."},{"t":"Do wyznaczania granic uprawnień decyzyjnych w organizacji","ok":false,"w":"Ludzie mogą ustalać uprawnienia. Zakres uprawnień decyzyjnych jest jednak cechą opisu Struktur organizacyjnych, a nie definicją roli kategorii Ludzie, umiejętności i kompetencje."},{"t":"Do skutecznego wykonania działań, podejmowania właściwych decyzji i działań naprawczych","ok":true,"w":"COBIT 5 wiąże tę kategorię ze skuteczną realizacją wszystkich działań, właściwymi decyzjami i działaniami naprawczymi. Aktywatory współdziałają; opis nie wyklucza uczestnictwa ludzi w pozostałych czynnościach."}],"fz":{"h":"Ludzie, umiejętności i kompetencje","p":"P1","pulapka":false,"n":"egzamin: ludzie, umiejętności i kompetencje · podr.: ludzie, umiejętności i kompetencje · EN: people, skills and competencies","q":"Jaką rolę pełnią Ludzie, umiejętności i kompetencje?","a":"Ludzie, umiejętności i kompetencje są potrzebni do skutecznego wykonywania wszystkich działań, podejmowania właściwych decyzji i działań naprawczych. Ludzie współuczestniczą także w procesach, przetwarzaniu informacji i świadczeniu usług; pytanie rozróżnia typowy opis roli kategorii, a nie rozłączne obszary pracy.","ex":"Przeszkolony dyżurny potrafi wykonać procedurę i podjąć właściwą decyzję przy awarii. Do skuteczności potrzebuje również informacji, narzędzi i jasnych uprawnień. Kategorie aktywatorów współdziałają.","org":"dyżurny przeszkolony z procedury i eskalacji; administrator z uprawnieniami do przywracania usług."}},"fz-C-005":{"id":"fz-C-005","typ":"egzamin","s":"PR-01-02","t":"Czy aktywatory COBIT 5 działają niezależnie od siebie?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 27","FW-PL s. 28"],"r":null,"zap":"","scen":"","o":[{"t":"Nie – są systemowo powiązane i każdy potrzebuje innych (Zasada 4)","ok":true,"w":"Nie. S (Secondary — powiązanie wspierające)ą systemowo powiązane (Zasada 4): każdy potrzebuje innych, np. proces potrzebuje informacji, struktur, ludzi i kultury."},{"t":"Tak – każdy aktywator wdraża się i ocenia całkowicie osobno","ok":false,"w":"Aktywatory są wzajemnie powiązane; słabość jednego osłabia pozostałe."},{"t":"Tak – od siebie zależą tylko Procesy i Struktury organizacyjne","ok":false,"w":"Powiązania dotyczą wszystkich aktywatorów, nie tylko dwóch."},{"t":"Nie – ale powiązane są wyłącznie aktywatory będące zasobami","ok":false,"w":"Powiązania obejmują wszystkie 7 kategorii, także procesy i kulturę."}],"fz":{"h":"Powiązania aktywatorów","p":"P1","pulapka":false,"n":"egzamin: wzajemnie powiązane aktywatory · podr.: wzajemnie powiązane czynniki · EN: systemic, interconnected enablers","q":"Czy aktywatory działają niezależnie?","a":"Nie. S (Secondary — powiązanie wspierające)ą systemowo powiązane (Zasada 4): każdy potrzebuje innych, np. proces potrzebuje informacji, struktur, ludzi i kultury.","ex":"Jak naczynia połączone: przepis bez kucharza, produktów i pieca nie da obiadu. Brak lub słabość jednego aktywatora osłabia pozostałe.","org":"procedura bez dyżurnych i rejestru nie zadziała, nawet dobrze spisana."}},"fz-C-006":{"id":"fz-C-006","typ":"egzamin","s":"PR-01-02","t":"Jaką rolę pełnią Procesy?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 27"],"r":null,"zap":"","scen":"","o":[{"t":"Są kluczowymi jednostkami podejmującymi decyzje: osobami, zespołami, komitetami","ok":false,"w":"Tak opisuje się Struktury organizacyjne."},{"t":"Są wzorcem zachowań, poglądów, założeń i postaw","ok":false,"w":"To definicja kultury."},{"t":"Są zbiorem praktyk i działań realizujących określone cele procesu","ok":true,"w":"Uporządkowany zbiór praktyk i działań, które osiągają określone cele i dają wyniki wspierające cele związane z IT (Information Technology — technologie informacyjne)."},{"t":"Są sposobem, w jaki organ Ładu przekazuje swoje wytyczne","ok":false,"w":"To rola Zasad, polityk i struktur ramowych."}],"fz":{"h":"Procesy","p":"P1","pulapka":false,"n":"egzamin: procesy · podr.: procesy · EN: processes","q":"Jaką rolę pełnią Procesy?","a":"Uporządkowany zbiór praktyk i działań, które osiągają określone cele i dają wyniki wspierające cele związane z IT (Information Technology — technologie informacyjne).","ex":"Proces to przepis na danie: uzgodniony sposób pracy od przyjęcia zamówienia do podania talerza, z określonymi wejściami i efektem; konkretne kroki dopasowuje się do sytuacji. Każdy krok ma cel, a całość służy celom całej restauracji.","org":"DSS02 (Manage Service Requests and Incidents — Zarządzanie zgłoszeniami serwisowymi i incydentami)."}},"fz-C-007":{"id":"fz-C-007","typ":"egzamin","s":"PR-01-02","t":"Jaką rolę pełnią Struktury organizacyjne?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 27"],"r":null,"zap":"","scen":"","o":[{"t":"Opisują etapy dojścia od architektury bazowej do docelowej","ok":false,"w":"To architektura przejściowa z aktywatora Usługi, infrastruktura i aplikacje."},{"t":"Zamieniają wejścia w wyniki za pomocą praktyk i działań","ok":false,"w":"Tak działają Procesy."},{"t":"Obejmują wszystkie informacje tworzone przez organizację","ok":false,"w":"To rola aktywatora Informacja."},{"t":"Są kluczowymi podmiotami podejmującymi decyzje w organizacji","ok":true,"w":"Kluczowe jednostki podejmujące decyzje w organizacji (osoby, zespoły, komitety). Opisuje się je m.in. poziomem uprawnień i delegowaniem uprawnień (s. 75–76)."}],"fz":{"h":"Struktury organizacyjne","p":"P1","pulapka":false,"n":"egzamin: struktury org. · poziom uprawnień · delegowanie uprawnień · podr.: struktury org. · poziom decyzyjny · przekazywanie uprawnień · EN: organisational structures · level of authority · delegation of authority","q":"Jaką rolę pełnią Struktury organizacyjne?","a":"Kluczowe jednostki podejmujące decyzje w organizacji (osoby, zespoły, komitety). Opisuje się je m.in. poziomem uprawnień i delegowaniem uprawnień (s. 75–76).","ex":"Podział stanowisk: szef kuchni decyduje o menu, kierownik zmiany o grafiku, a pod nieobecność szefa jego zastępca. Odpowiada na pytanie: kto o czym decyduje. Pytanie „kto tu rządzi i w jakich sprawach?”.","org":"komitet sterujący programu, dyżur całodobowy z kierownikiem zmiany, który eskaluje."}},"fz-C-008":{"id":"fz-C-008","typ":"egzamin","s":"PR-01-02","t":"Jaką rolę pełnią Usługi, infrastruktura i aplikacje?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 27"],"r":null,"zap":"","scen":"","o":[{"t":"Określają, kto w organizacji o czym decyduje","ok":false,"w":"To rola Struktur organizacyjnych."},{"t":"Zapewniają przetwarzanie informacji i dostarczanie usług IT","ok":true,"w":"Infrastruktura, technologie i aplikacje, dzięki którym organizacja przetwarza informacje i ma usługi IT (Information Technology — technologie informacyjne)."},{"t":"Zapewniają osoby zdolne do podejmowania działań naprawczych","ok":false,"w":"To rola aktywatora Ludzie, umiejętności i kompetencje."},{"t":"Opisują wzorzec zachowań i postaw w organizacji","ok":false,"w":"To definicja kultury."}],"fz":{"h":"Usługi, infrastruktura i aplikacje","p":"P1","pulapka":false,"n":"egzamin: usługi, infrastruktura i aplikacje · podr.: usługi, infrastruktura i aplikacje · EN: services, infrastructure and applications","q":"Jaką rolę pełnią Usługi, infrastruktura i aplikacje?","a":"Infrastruktura, technologie i aplikacje, dzięki którym organizacja przetwarza informacje i ma usługi IT (Information Technology — technologie informacyjne).","ex":"Sprzęt i zaplecze restauracji: kuchenki, lodówki, kasa, system zamówień na tablecie kelnera. Bez nich ludzie mają związane ręce. Narzędzia, dzięki którym zamówienie trafia do kucharza, a rachunek do klienta.","org":"system zgłoszeń, monitoring dostępności usług, łącza do komend."}},"fz-C-009":{"id":"fz-C-009","typ":"egzamin","s":"PR-01-02","t":"Jaką rolę pełnią Zasady, polityki i struktury ramowe?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 27"],"r":null,"zap":"","scen":"","o":[{"t":"Opisują uporządkowany zbiór praktyk i działań dających wyniki","ok":false,"w":"To rola Procesów."},{"t":"Przekładają pożądane zachowania na praktyczne wskazówki","ok":true,"w":"Zamieniają pożądane zachowania w praktyczne wskazówki na co dzień; to sposób, w jaki organ Ładu i kierownictwo przekazują swoje wytyczne."},{"t":"Dostarczają użytkownikom usług IT","ok":false,"w":"To rola Usług, infrastruktury i aplikacji."},{"t":"Są głównym produktem pracy struktur organizacyjnych","ok":false,"w":"Głównym produktem struktur są decyzje."}],"fz":{"h":"Zasady, polityki i struktury ramowe","p":"P1","pulapka":false,"n":"egzamin: zasady, polityki i struktury ramowe · podr.: zasady, polityki i metodyki · EN: principles, policies and frameworks","q":"Jaką rolę pełnią Zasady, polityki i struktury ramowe?","a":"Zamieniają pożądane zachowania w praktyczne wskazówki na co dzień; to sposób, w jaki organ Ładu i kierownictwo przekazują swoje wytyczne.","ex":"Regulamin restauracji: „klient z alergią dostaje danie z osobnej deski”. Szefostwo spisuje, czego chce, a zespół wie, jak się zachować na co dzień. Jak regulamin wiszący w kuchni: kartka na ścianie mówi kucharzom, jak postępować w zwykły dzień.","org":"polityka obsługi zgłoszeń; progi ryzyka zatwierdzone przez kierownictwo."}},"fz-C-010":{"id":"fz-C-010","typ":"egzamin","s":"PR-01-02","t":"Które trzy kategorie aktywatorów wyróżniono jako zasoby przedsiębiorstwa na Rysunku 12?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 24","FW-PL s. 27"],"r":null,"zap":"","scen":"","o":[{"t":"Procesy; Struktury organizacyjne; Informacja","ok":false,"w":"Ten zestaw nie odpowiada trzem kategoriom wyróżnionym jako zasoby przedsiębiorstwa na Rysunku 12. Procesy i struktury mogą być nazywane zasobami organizacyjnymi w innych kontekstach, np. przy aktywatorach Ładu."},{"t":"Zasady, polityki i struktury ramowe; Procesy; Ludzie, umiejętności i kompetencje","ok":false,"w":"Rysunek 12 wyróżnia Informację, Usługi/infrastrukturę/aplikacje oraz Ludzi/umiejętności/kompetencje. Wskazanie zasad i procesów zamiast dwóch pierwszych kategorii nie odpowiada tej klasyfikacji."},{"t":"Informacja; Usługi, infrastruktura i aplikacje; Ludzie, umiejętności i kompetencje","ok":true,"w":"Na Rysunku 12 wyróżniono właśnie trzy ostatnie kategorie: Informacja; Usługi, Infrastruktura i Aplikacje; Ludzie, Umiejętności i Kompetencje. To klasyfikacja tego modelu, nie uniwersalne stwierdzenie, że inne elementy nigdy nie są zasobami organizacyjnymi."},{"t":"Kultura, etyka i zachowanie; Informacja; Usługi, infrastruktura i aplikacje","ok":false,"w":"W klasyfikacji Rysunku 12 wśród trzech kategorii zasobów są Ludzie, umiejętności i kompetencje, nie Kultura, etyka i zachowanie."}],"fz":{"h":"Zasoby wśród aktywatorów","p":"P1","pulapka":true,"n":"egzamin: aktywatory będące zasobami · podr.: czynniki będące zasobami · EN: enablers that are also resources","q":"Które trzy kategorie aktywatorów wyróżniono jako zasoby przedsiębiorstwa na Rysunku 12?","a":"Na Rysunku 12 jako zasoby przedsiębiorstwa wyróżniono trzy kategorie: Informacja; Usługi, Infrastruktura i Aplikacje; Ludzie, Umiejętności i Kompetencje. To klasyfikacja w tym modelu aktywatorów. Nie oznacza, że w innym kontekście struktury, procesy czy polityki nigdy nie mogą być nazywane zasobami organizacyjnymi — s. 24 używa takiego określenia przy aktywatorach Ładu.","ex":"Zasoby to to, czym organizacja dysponuje i co wykorzystuje: wiedza w notatkach (informacja), sprzęt (infrastruktura), kucharze (ludzie). Haczyk: I-U-L, trzy ostatnie z siedmiu.","org":"rejestr zgłoszeń (informacja), serwery (infrastruktura), dyżurni (ludzie)."}},"fz-C-011":{"id":"fz-C-011","typ":"egzamin","s":"EN-02-02","t":"Czym według COBIT 5 jest polityka (w odróżnieniu od zasady i struktury ramowej)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 67","FW-PL s. 91","FW-PL s. 92","FW-PL s. 93"],"r":null,"zap":"","scen":"","o":[{"t":"Wartościami i podstawowymi przekonaniami organizacji","ok":false,"w":"To definicja zasady."},{"t":"Podstawowym szkieletem pojęć pomagającym rozwiązywać złożone problemy","ok":false,"w":"To definicja struktury ramowej."},{"t":"Koniecznymi i wystarczającymi krokami do wdrożenia praktyki","ok":false,"w":"To definicja działania w procesie."},{"t":"Ogólnymi zamierzeniami i wytycznymi, formalnie spisanymi przez kierownictwo","ok":true,"w":"Słownik określa politykę jako ogólne zamierzenia i wytyczne formalnie wyrażone przez kierownictwo. Zasada wyraża podstawowe wartości, a struktura ramowa porządkuje pojęcia i podejście do złożonych kwestii (s.91–93)."}],"fz":{"h":"Zasada, polityka, struktura ramowa","p":"P1","pulapka":true,"n":"EN: Principle vs policy vs framework","q":"Czym różni się zasada od polityki i struktury ramowej?","a":"Zasada: wartości i podstawowe przekonania organizacji. Polityka: ogólne zamierzenia i wytyczne, formalnie spisane przez kierownictwo. Struktura ramowa: podstawowy szkielet pojęć, który pomaga rozwiązywać złożone problemy.","ex":"Zasada: „gość jest najważniejszy”. Polityka: „reklamacje przyjmuje kierownik zmiany”. Struktura ramowa: cały gotowy system bezpieczeństwa żywności, szkielet do ogarnięcia złożonej sprawy.","org":""}},"fz-C-012":{"id":"fz-C-012","typ":"egzamin","s":"EN-02-05","t":"Jakie kryteria muszą spełniać zasady?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 67"],"r":null,"zap":"","scen":"","o":[{"t":"Ograniczona liczba, prosty język i jak najprecyzyjniejsze wyrażenie podstawowych wartości","ok":true,"w":"Haczyk z fiszki: mało, prosto, precyzyjnie."},{"t":"Skuteczność, wydajność i nieinwazyjność","ok":false,"w":"To cechy dobrej polityki."},{"t":"Kompleksowość, otwartość i elastyczność, aktualność, dostępność","ok":false,"w":"Tak powinny wyglądać struktury ramowe."},{"t":"Jak najwięcej szczegółów, by objąć każdy możliwy przypadek","ok":false,"w":"Odwrotnie: zasad ma być mało i mają być proste."}],"fz":{"h":"Kryteria zasad","p":"P2","pulapka":false,"n":"EN: Principles: limited in number, simple language","q":"Jakie kryteria muszą spełniać zasady?","a":"Ich liczba musi być ograniczona; muszą być sformułowane prostym językiem i jak najprecyzyjniej wyrażać podstawowe wartości organizacji.","ex":"Jak dziesięć przykazań: mało, krótko i prosto. Zasad nie może być sto, bo nikt ich nie zapamięta. Haczyk: mało, prosto, precyzyjnie.","org":""}},"fz-C-013":{"id":"fz-C-013","typ":"egzamin","s":"EN-02-03","t":"Jakie są cechy dobrej polityki?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 67"],"r":null,"zap":"","scen":"","o":[{"t":"Kompleksowa, otwarta i elastyczna, aktualna","ok":false,"w":"To cechy struktur ramowych Ładu i Zarządzania."},{"t":"Zakres i ważność, skutki nieprzestrzegania, obsługa wyjątków","ok":false,"w":"To elementy struktury polityk, nie cechy dobrej polityki."},{"t":"Nieliczna, prosta językowo, precyzyjna","ok":false,"w":"To kryteria dla zasad."},{"t":"Skuteczna, wydajna, nieinwazyjna","ok":true,"w":"Skuteczna polityka osiąga wskazany cel; wydajna wdraża zasady przy racjonalnym wykorzystaniu zasobów; nieinwazyjna jest logiczna dla odbiorców i nie budzi zbędnego oporu. To trzy cechy podane przy politykach (s.67)."}],"fz":{"h":"Cechy dobrej polityki","p":"P1","pulapka":true,"n":"EN: Effective, efficient, non-intrusive","q":"Jakie są cechy dobrej polityki?","a":"Dobre polityki są skuteczne (osiągają wskazany cel), wydajne (wdrażają zasady przy racjonalnym wykorzystaniu zasobów) i nieinwazyjne (podręcznik: nieingerencyjne — logiczne dla odbiorców, bez niepotrzebnego oporu).","ex":"Dobra reguła w kuchni działa, nie kosztuje fortuny i nie irytuje ludzi bez powodu. Haczyk SWN: Skuteczna, Wydajna, Nieinwazyjna.","org":""}},"fz-C-014":{"id":"fz-C-014","typ":"egzamin","s":"EN-02-05","t":"Który z poniższych NIE jest elementem, który musi opisywać struktura polityk?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 68"],"r":null,"zap":"","scen":"","o":[{"t":"Zakres i ważność – kogo i kiedy polityka dotyczy","ok":false,"w":"To element struktury polityk."},{"t":"Skutki nieprzestrzegania polityki","ok":false,"w":"To element struktury polityk."},{"t":"Nieinwazyjność polityki","ok":true,"w":"To cecha dobrej polityki, nie element struktury polityk."},{"t":"Sposób kontroli i pomiaru przestrzegania polityki","ok":false,"w":"To element struktury polityk."}],"fz":{"h":"Struktura polityk","p":"P1","pulapka":true,"n":"EN: Scope and validity; consequences of non-compliance; exception handling; compliance monitoring","q":"Jakie elementy musi opisywać struktura polityk?","a":"Zakres i ważność (podr. prawidłowość) – kogo i kiedy dotyczy; skutki nieprzestrzegania; obsługa wyjątków; sposób kontroli i pomiaru przestrzegania polityki.","ex":"Każdy regulamin kuchni mówi: kogo i gdzie dotyczy, co grozi za złamanie, kiedy wolno zrobić wyjątek i kto to sprawdza. Cztery rubryki: zakres, kara, wyjątek, kontrola.","org":""}},"fz-C-015":{"id":"fz-C-015","typ":"egzamin","s":"EN-02-05,EN-02-03","t":"Czym w COBIT 5 jest „zakres i ważność”?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 68"],"r":null,"zap":"","scen":"","o":[{"t":"Cechą dobrej polityki, obok skuteczności i wydajności","ok":false,"w":"Cechy dobrej polityki to: skuteczna, wydajna, nieinwazyjna."},{"t":"Elementem struktury polityk, obok konsekwencji, wyjątków i kontroli zgodności","ok":true,"w":"Zakres i ważność należy do elementów struktury polityk, podobnie jak konsekwencje nieprzestrzegania, obsługa wyjątków oraz kontrola zgodności. Cechy dobrej polityki to odrębna lista: skuteczność, wydajność, nieinwazyjność (s.67–68)."},{"t":"Kryterium, które muszą spełniać zasady","ok":false,"w":"Kryteria zasad to ograniczona liczba, prosty język i precyzja."},{"t":"Cechą struktur ramowych Ładu i Zarządzania","ok":false,"w":"Struktury ramowe mają być kompleksowe, otwarte, aktualne i dostępne."}],"fz":{"h":"Zakres i ważność","p":"P1","pulapka":true,"n":"EN: Policy framework elements vs good policy characteristics","q":"„Zakres i ważność” – cecha dobrej polityki czy element struktury polityk?","a":"Element struktury polityk (obok konsekwencji, wyjątków i kontroli zgodności). Cechy dobrej polityki to: skuteczna, wydajna, nieinwazyjna.","ex":"Cechy dobrej polityki to oceny regulaminu (SWN: skuteczna, wydajna, nieinwazyjna). Elementy struktury to rubryki w samym regulaminie: zakres, kary, wyjątki, kontrola.","org":""}},"fz-C-016":{"id":"fz-C-016","typ":"egzamin","s":"EN-02-05","t":"Jakie powinny być struktury ramowe Ładu i Zarządzania?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 67"],"r":null,"zap":"","scen":"","o":[{"t":"Kompleksowe, otwarte i elastyczne, aktualne oraz dostępne dla wszystkich zainteresowanych","ok":true,"w":"To cechy struktur ramowych z fiszki."},{"t":"Skuteczne, wydajne i nieinwazyjne","ok":false,"w":"To cechy dobrej polityki."},{"t":"Nieliczne i sformułowane prostym językiem","ok":false,"w":"To kryteria dla zasad."},{"t":"Poufne i dostępne wyłącznie dla organu Ładu","ok":false,"w":"Mają być dostępne dla wszystkich zainteresowanych."}],"fz":{"h":"Struktury ramowe Ładu i Zarządzania","p":"P2","pulapka":false,"n":"EN: Frameworks: comprehensive, open and flexible, current, available","q":"Jakie powinny być struktury ramowe Ładu i Zarządzania?","a":"Kompleksowe (obejmują całość), otwarte i elastyczne, aktualne oraz dostępne dla wszystkich zainteresowanych.","ex":"Jak księga procedur restauracji: obejmuje całą kuchnię, da się ją dopasować do nowego menu, jest aktualna i leży tam, gdzie każdy może zajrzeć.","org":""}},"fz-C-017":{"id":"fz-C-017","typ":"egzamin","s":"EN-02-05","t":"Która z poniższych jest dobrą praktyką dotyczącą polityk?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 68"],"r":null,"zap":"","scen":"","o":[{"t":"Polityki powstają niezależnie od zasad organizacji","ok":false,"w":"Polityki wynikają z zasad."},{"t":"Raz zatwierdzonej polityki się nie aktualizuje","ok":false,"w":"Polityki są regularnie odnawiane lub aktualizowane."},{"t":"Polityki stoją poza hierarchiczną strukturą ramową","ok":false,"w":"Polityki są częścią hierarchicznej struktury ramowej."},{"t":"Polityki pasują do apetytu na ryzyko organizacji","ok":true,"w":"Fiszka wymienia dopasowanie do apetytu na ryzyko."}],"fz":{"h":"Dobre praktyki polityk","p":"P2","pulapka":false,"n":"EN: Policy good practices","q":"Jakie dobre praktyki dotyczą polityk?","a":"Są częścią hierarchicznej struktury ramowej i wynikają z zasad; pasują do apetytu na ryzyko (ile ryzyka organizacja akceptuje); są regularnie odnawiane lub aktualizowane.","ex":"Regulamin kuchni wynika z zasad lokalu, pasuje do tego, ile ryzyka szef akceptuje (podajemy surową rybę czy nie), i co sezon się go przegląda.","org":""}},"fz-C-018":{"id":"fz-C-018","typ":"egzamin","s":"EN-02-04","t":"Co jest kluczowe w cyklu życia polityki?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 68"],"r":null,"zap":"","scen":"","o":[{"t":"Zapewnienie logicznej treści, która nie budzi zbędnego oporu","ok":false,"w":"To cecha dobrej polityki, nie klucz cyklu życia."},{"t":"Utrzymywanie aktualnej wersji i właściwe wycofywanie starych","ok":true,"w":"W cyklu życia trzeba dbać o aktualizację polityki, świadomość zmian i dostęp do aktualnej wersji oraz odpowiednią archiwizację lub usuwanie wersji nieaktualnych (s.68). Nieinwazyjność jest cechą dobrej polityki, ale nie zastępuje zarządzania jej cyklem życia."},{"t":"Ograniczenie liczby zasad i używanie prostego języka","ok":false,"w":"To kryteria dla zasad."},{"t":"Stosowanie otwartych standardów przy projektowaniu architektury","ok":false,"w":"To pryncypium otwartości architektury."}],"fz":{"h":"Cykl życia polityki","p":"P2","pulapka":false,"n":"EN: Policy life cycle","q":"Co jest kluczowe w cyklu życia polityki?","a":"Aktualność: czy i kiedy się ją aktualizuje, czy pracownicy wiedzą o zmianach, mają dostęp do najnowszej wersji, a nieaktualne wersje są archiwizowane lub usuwane.","ex":"Jak karta dań: po zmianie cen stara znika ze stołów, a wszyscy kelnerzy wiedzą o nowej. Najgorsze to dwie różne wersje w obiegu.","org":""}},"fz-C-019":{"id":"fz-C-019","typ":"egzamin","s":"EN-02-06","t":"Co jest najważniejszym środkiem realizacji polityk?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 68"],"r":null,"zap":"","scen":"","o":[{"t":"Praktyki i działania procesów","ok":true,"w":"Praktyki i działania procesów przekładają reguły polityki na rzeczywiste wykonywanie pracy. Struktury mogą polityki definiować i wdrażać, a zachęty i informacja je wspierają; głównym środkiem realizacji pozostają procesy (s.68)."},{"t":"Decyzje komitetu sterującego","ok":false,"w":"Komitety i inne struktury mogą definiować i wdrażać polityki w swoim zakresie kontroli. Praktyki i działania procesów są jednak najistotniejszym środkiem ich realizacji (podręcznik, s.68)."},{"t":"Zachęty i nagrody dla pracowników","ok":false,"w":"To dobra praktyka kształtowania zachowań."},{"t":"Repozytorium architektury","ok":false,"w":"To dobra praktyka aktywatora Usługi, infrastruktura i aplikacje."}],"fz":{"h":"Polityki a inne aktywatory","p":"P2","pulapka":false,"n":"EN: Policies – relationships with other enablers; Processes execute policies","q":"Jak polityki wiążą się z innymi aktywatorami? Czym jest najważniejszy środek realizacji polityk?","a":"Odzwierciedlają kulturę i wartości etyczne; najważniejszym sposobem ich realizacji są praktyki i działania procesów; struktury ustalają i wdrażają polityki w swoim zakresie kontroli; polityki są też informacją. Polityki mówią, co wolno i trzeba, a procesy to wykonują.","ex":"Regulamin wyrasta z atmosfery lokalu, wykonuje się go, gotując według przepisów, ogłasza go szefostwo, a wisi na ścianie jako kartka, czyli informacja. Regulamin mówi „mięso trzymaj w 4°C”, a dopiero codzienne czynności w kuchni sprawiają, że tak jest. Polityka mówi, proces robi.","org":""}},"fz-C-020":{"id":"fz-C-020","typ":"egzamin","s":"EN-02-12","t":"Który z poniższych NIE jest dobrą praktyką struktur organizacyjnych?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 75"],"r":null,"zap":"","scen":"","o":[{"t":"Procedury eskalacji","ok":false,"w":"To dobra praktyka struktur."},{"t":"Delegowanie uprawnień","ok":false,"w":"To dobra praktyka struktur."},{"t":"Liczba podwładnych menedżera","ok":true,"w":"Na liście nie ma takiej praktyki; zakres kontroli to granice uprawnień, nie liczba podwładnych."},{"t":"Skład struktury","ok":false,"w":"To dobra praktyka struktur."}],"fz":{"h":"Dobre praktyki struktur organizacyjnych","p":"P2","pulapka":false,"n":"EN: Operating principles, composition, span of control, level of authority, delegation of authority, escalation procedures","q":"Jakie są dobre praktyki struktur organizacyjnych?","a":"Zasady operacyjne (podr. zasady działania), skład, zakres kontroli, poziom uprawnień (decyzyjnych), delegowanie uprawnień, procedury eskalacji; sylabus PeopleCert dodaje podejmowanie decyzji.","ex":"Opis każdego zespołu w kuchni: jak pracuje, kto w nim jest, o czym decyduje, co może oddać zastępcy i do kogo idzie, gdy sam nie rozstrzygnie.","org":""}},"fz-C-021":{"id":"fz-C-021","typ":"egzamin","s":"EN-02-12","t":"Czy „podejmowanie decyzji” jest dobrą praktyką struktury organizacyjnej?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["SYL EN02.12","FW-PL s. 75–76"],"r":null,"zap":"","scen":"","o":[{"t":"Nie – decyzje są wyłącznie produktem pracy struktury","ok":false,"w":"Jedno nie wyklucza drugiego: to dwa ujęcia, sposób decydowania i jego wynik."},{"t":"Nie – to jedna z cech dobrej polityki","ok":false,"w":"Cechy dobrej polityki to: skuteczna, wydajna, nieinwazyjna."},{"t":"Tak – ale tylko w strukturach ramowych z COBIT 4.1","ok":false,"w":"Sylabus wymienia je wprost przy strukturach organizacyjnych COBIT 5."},{"t":"Tak – sylabus PeopleCert (EN02.12) wymienia je wśród dobrych praktyk struktur","ok":true,"w":"Sylabus PeopleCert EN02.12 wymienia Decision making — podejmowanie decyzji — wśród dobrych praktyk struktur. Sposób podejmowania decyzji jest praktyką, a podjęte decyzje mogą być produktem pracy struktury; te ujęcia się nie wykluczają (s.75–76)."}],"fz":{"h":"Podejmowanie decyzji jako dobra praktyka","p":"P2","pulapka":true,"n":"EN: Organisational structure good practices; decisions are outputs","q":"Czy „podejmowanie decyzji” to dobra praktyka struktury organizacyjnej?","a":"Tak – sylabus PeopleCert (EN02.12) wymienia podejmowanie decyzji wśród dobrych praktyk struktur, obok zasad działania, zakresu kontroli, poziomu uprawnień, delegowania i eskalacji. Podręcznik pokazuje też decyzje jako główny produkt pracy struktury. To dwa ujęcia: sposób decydowania i jego wynik.","ex":"Rada rodzinna ma ustalony sposób podejmowania uchwał (praktyka), a same uchwały to wynik jej pracy. Jedno nie wyklucza drugiego.","org":""}},"fz-C-022":{"id":"fz-C-022","typ":"egzamin","s":"EN-02-12","t":"Czym są zasady operacyjne (podr. zasady działania) struktury organizacyjnej?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 75"],"r":null,"zap":"","scen":"","o":[{"t":"Granicami uprawnień decyzyjnych struktury","ok":false,"w":"To zakres kontroli."},{"t":"Praktycznymi ustaleniami działania struktury, np. częstotliwością zebrań, regułami dokumentowania, porządkiem obrad","ok":true,"w":"Tak definiuje je fiszka."},{"t":"Mandatem, czyli celem istnienia struktury","ok":false,"w":"Mandat definiuje się przy tworzeniu struktury; to nie zasady operacyjne."},{"t":"Drogą przekazania sprawy wyżej, gdy struktura nie może zdecydować","ok":false,"w":"To procedury eskalacji."}],"fz":{"h":"Zasady operacyjne struktury","p":"P2","pulapka":false,"n":"EN: Operating principles","q":"Czym są zasady operacyjne struktury?","a":"Praktycznymi ustaleniami działania struktury, np. częstotliwość zebrań, reguły dokumentowania i porządku obrad.","ex":"Jak regulamin porannej narady w kuchni: odprawa codziennie o 10:00, ktoś notuje ustalenia, wiadomo, o czym się rozmawia i w jakiej kolejności.","org":""}},"fz-C-023":{"id":"fz-C-023","typ":"egzamin","s":"EN-02-12","t":"Czym jest zakres kontroli (span of control) w COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 75"],"r":null,"zap":"","scen":"","o":[{"t":"Granicami uprawnień decyzyjnych struktury organizacyjnej","ok":true,"w":"Zakres kontroli wyznacza granice, w których struktura jest uprawniona do podejmowania decyzji. W opisie dobrych praktyk COBIT 5 chodzi o obszar decyzji, a nie o liczbę podwładnych menedżera (FW-PL s. 75)."},{"t":"Liczbą podwładnych menedżera","ok":false,"w":"To klasyczna pułapka: w COBIT 5 nie chodzi o liczbę podwładnych."},{"t":"Przekazaniem uprawnień decyzyjnych strukturom podległym","ok":false,"w":"To delegowanie uprawnień."},{"t":"Zakresem audytu mechanizmów kontrolnych","ok":false,"w":"Audyt mechanizmów kontrolnych to kategoria umiejętności MEA (Monitor, Evaluate and Assess — Monitoruj, Oszacuj i Oceń), nie zakres kontroli."}],"fz":{"h":"Zakres kontroli","p":"P2","pulapka":true,"n":"EN: Span of control; Span of control ≠ number of subordinates","q":"Czym jest zakres kontroli (span of control)? Czy to liczba podwładnych menedżera?","a":"Zakres kontroli to granice uprawnień decyzyjnych struktury organizacyjnej. W tym opisie COBIT 5 nie oznacza liczby podwładnych.","ex":"Kierownik sali decyduje o rezerwacjach, ale nie o menu. Zakres kontroli to płot wokół jego decyzji, a nie liczba kelnerów pod nim. Pułapka egzaminacyjna: „zakres kontroli” brzmi jak liczba podwładnych, ale w COBIT to płot wokół decyzji, czyli o czym dany zespół może rozstrzygać.","org":""}},"fz-C-024":{"id":"fz-C-024","typ":"egzamin","s":"EN-02-12","t":"Czym jest poziom uprawnień (podr. poziom decyzyjny) struktury?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 75"],"r":null,"zap":"","scen":"","o":[{"t":"Liczbą członków struktury","ok":false,"w":"To dotyczy składu struktury."},{"t":"Ustaleniami o częstotliwości zebrań i porządku obrad","ok":false,"w":"To zasady operacyjne."},{"t":"Decyzjami, do których podjęcia struktura jest uprawniona","ok":true,"w":"Tak definiuje go fiszka."},{"t":"Drogą przekazania sprawy wyżej, gdy struktura nie może zdecydować","ok":false,"w":"To procedury eskalacji."}],"fz":{"h":"Poziom uprawnień","p":"P2","pulapka":false,"n":"EN: Level of authority / decision rights","q":"Czym jest poziom uprawnień?","a":"Decyzjami, do których podjęcia struktura jest uprawniona (podr. poziom decyzyjny / uprawnienia decyzyjne).","ex":"Kucharz zmiany może sam zmienić dodatek do dania, ale nowe danie w karcie zatwierdza tylko szef. Chodzi o to, kto może podjąć jaką decyzję.","org":""}},"fz-C-025":{"id":"fz-C-025","typ":"egzamin","s":"EN-02-12","t":"Czym jest delegowanie uprawnień (podr. przekazywanie uprawnień)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 75"],"r":null,"zap":"","scen":"","o":[{"t":"Przekazaniem sprawy wyżej, gdy struktura nie umie podjąć decyzji","ok":false,"w":"To procedury eskalacji – ruch w górę, nie w dół."},{"t":"Wyznaczeniem przez zarząd komitetu ds. strategii","ok":false,"w":"To opis komitetu ds. strategii, nie delegowania."},{"t":"Określeniem granic, w jakich struktura może decydować","ok":false,"w":"To zakres kontroli."},{"t":"Przekazaniem przez strukturę jej uprawnień decyzyjnych (lub ich części) podległym strukturom","ok":true,"w":"Tak definiuje je fiszka."}],"fz":{"h":"Delegowanie uprawnień","p":"P2","pulapka":false,"n":"EN: Delegation of authority","q":"Czym jest delegowanie uprawnień?","a":"Przekazaniem przez strukturę jej uprawnień decyzyjnych (lub ich części) podległym strukturom. Podr.: przekazywanie uprawnień.","ex":"Szef kuchni przed urlopem mówi zastępcy: „zamówienia u dostawców zatwierdzasz ty”. Oddaje część swoich decyzji komuś niżej.","org":""}},"fz-C-026":{"id":"fz-C-026","typ":"egzamin","s":"EN-02-12","t":"Co opisują procedury eskalacji?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 75"],"r":null,"zap":"","scen":"","o":[{"t":"Przekazanie części uprawnień strukturom podległym","ok":false,"w":"To delegowanie uprawnień."},{"t":"Częstotliwość zebrań i porządek obrad","ok":false,"w":"To zasady operacyjne."},{"t":"Co zrobić, gdy struktura ma problem z podjęciem decyzji – drogę przekazania sprawy wyżej","ok":true,"w":"Tak opisuje je fiszka."},{"t":"Skutki nieprzestrzegania polityki","ok":false,"w":"To element struktury polityk."}],"fz":{"h":"Procedury eskalacji","p":"P2","pulapka":false,"n":"EN: Escalation procedures","q":"Czym są procedury eskalacji?","a":"Ustalona droga przekazania sprawy wyżej: opisuje, co trzeba zrobić, gdy struktura ma problem z podjęciem decyzji.","ex":"Kelner nie umie rozwiązać skargi, więc woła kierownika sali, a ten właściciela. Eskalacja to schody w górę, aż ktoś zdecyduje.","org":""}},"fz-C-027":{"id":"fz-C-027","typ":"egzamin","s":"EN-02-12","t":"Co definiuje się przy tworzeniu struktury organizacyjnej?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 75"],"r":null,"zap":"","scen":"","o":[{"t":"Mandat – po co struktura istnieje i jaki ma cel","ok":true,"w":"Fiszka: przy tworzeniu struktury definiuje się mandat."},{"t":"Pryncypia architektury","ok":false,"w":"To dobra praktyka aktywatora Usługi, infrastruktura i aplikacje."},{"t":"Cykl życia umiejętności","ok":false,"w":"To element aktywatora Ludzie, umiejętności i kompetencje."},{"t":"Architekturę docelową","ok":false,"w":"To przyszła zdolność usługowa, nie element tworzenia struktury."}],"fz":{"h":"Mandat i wyniki struktury","p":"P2","pulapka":false,"n":"EN: Mandate; outputs: decisions","q":"Co definiuje się przy tworzeniu struktury i co ona wytwarza?","a":"Mandat, czyli po co struktura istnieje i jaki ma cel. Decyzje podejmuje na podstawie wejść (zwykle informacji); jej wyniki to decyzje, informacje lub prośby o dodatkowe dane.","ex":"Komisja menu powstaje „po to, by co kwartał odświeżać kartę” – to mandat. Dostaje opinie gości i ceny, a wydaje decyzje: co zostaje, co znika.","org":""}},"fz-C-028":{"id":"fz-C-028","typ":"egzamin","s":"EN-02-12","t":"Co jest głównym produktem pracy struktury organizacyjnej?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 75","FW-PL s. 76"],"r":null,"zap":"","scen":"","o":[{"t":"Informacje, które struktura otrzymuje na wejściu","ok":false,"w":"Informacje są zwykle wejściem, a nie głównym produktem."},{"t":"Decyzje (a także informacje i prośby o dodatkowe dane)","ok":true,"w":"Fiszka: wchodzą informacje, wychodzą decyzje."},{"t":"Usługi IT dla użytkowników","ok":false,"w":"Usługi IT zapewnia aktywator Usługi, infrastruktura i aplikacje."},{"t":"Wartość wynikająca z wiedzy","ok":false,"w":"To ostatni element cyklu informacji."}],"fz":{"h":"Produkt pracy struktury","p":"P2","pulapka":true,"n":"EN: Structures output decisions; Mandate; outputs: decisions","q":"Co jest produktem pracy struktury organizacyjnej?","a":"Decyzje (a także informacje i żądania dodatkowych danych). Wejściem są zwykle informacje. Przy tworzeniu struktury definiuje się mandat, czyli po co struktura istnieje i jaki ma cel.","ex":"Narada szefów kuchni nie gotuje zup – jej produktem są decyzje, np. nowe menu. Wchodzą informacje, wychodzą decyzje. Komisja menu dostaje opinie gości i ceny, a wydaje decyzje: co zostaje, co znika.","org":""}},"fz-C-029":{"id":"fz-C-029","typ":"egzamin","s":"EN-02-13","t":"Co według COBIT 5 łączy działania procesów ze strukturami i rolami?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 75"],"r":null,"zap":"","scen":"","o":[{"t":"Repozytorium architektury","ok":false,"w":"Repozytorium przechowuje wyniki prac architektonicznych."},{"t":"Cykl informacji","ok":false,"w":"Cykl informacji opisuje drogę od procesów biznesowych do wartości."},{"t":"Tabela RACI","ok":true,"w":"Fiszka: RACI łączy działania procesów ze strukturami i rolami."},{"t":"Struktura polityk","ok":false,"w":"Struktura polityk określa mandat i zasady działania, nie wiąże działań z rolami."}],"fz":{"h":"Struktury a inne aktywatory","p":"P2","pulapka":false,"n":"EN: Organisational structures – relationships","q":"Jak struktury wiążą się z innymi aktywatorami?","a":"RACI łączy działania procesów ze strukturami i rolami; kultura i zachowanie decydują o skuteczności decyzji; skład powinien odzwierciedlać umiejętności; mandat i zasady działania określa struktura polityk.","ex":"RACI to tabela „kto robi, kto odpowiada, kogo zapytać, kogo powiadomić”. Komisja menu działa, gdy ma właściwych ludzi, dobrą atmosferę i spisany regulamin.","org":""}},"fz-C-030":{"id":"fz-C-030","typ":"egzamin","s":"EN-02-13","t":"Czy role z Rysunku 33 trzeba wdrożyć w organizacji?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 76"],"r":null,"zap":"","scen":"","o":[{"t":"Tak – COBIT 5 wymaga wszystkich tych ról w każdej organizacji","ok":false,"w":"Role nie muszą odpowiadać rzeczywistym funkcjom."},{"t":"Nie – mają charakter ilustracyjny, choć opis ich celu pasuje do większości organizacji","ok":true,"w":"Rysunek 33 jest ilustracyjny i nie narzuca uniwersalnego schematu organizacyjnego ani obowiązku utworzenia każdego stanowiska. Cele i odpowiedzialności opisanych ról pozostają jednak przydatne dla większości organizacji (s.76)."},{"t":"Tak – ale tylko w dużych organizacjach","ok":false,"w":"Podręcznik nie ustanawia obowiązku wdrożenia wszystkich ról także dla dużych organizacji. Rysunek 33 ma charakter ilustracyjny i nie definiuje uniwersalnej struktury (s.76)."},{"t":"Nie – a opisy ich celu nie pasują do większości organizacji","ok":false,"w":"Opis celu ról jest trafny dla większości organizacji."}],"fz":{"h":"Rysunek 33 – role ilustracyjne","p":"P2","pulapka":false,"n":"EN: Figure 33 is illustrative","q":"Czy role z Rysunku 33 trzeba wdrożyć w organizacji?","a":"Nie. Mają charakter ilustracyjny i nie muszą odpowiadać rzeczywistym funkcjom; ich opis celu jest jednak trafny dla większości organizacji.","ex":"To przykładowy schemat stanowisk, jak wzorcowy plan lokalu w poradniku gastronomii: nie musisz mieć każdego stanowiska, ale opisy ich zadań pasują prawie wszędzie.","org":""}},"fz-C-031":{"id":"fz-C-031","typ":"egzamin","s":"EN-02-13","t":"Kto zwykle przewodniczy komitetowi ds. strategii (wykonawczemu IT)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 76"],"r":null,"zap":"","scen":"","o":[{"t":"CIO","ok":false,"w":"To pułapka: CIO (Chief Information Officer — dyrektor ds. informatyki) doradza, ale zwykle nie przewodniczy komitetowi."},{"t":"CISO","ok":false,"w":"CISO (Chief Information Security Officer — dyrektor ds. bezpieczeństwa informacji) odpowiada za bezpieczeństwo informacji, nie prowadzi tego komitetu."},{"t":"Kierownik PMO","ok":false,"w":"PMO (Programme and Project Management Office — biuro zarządzania programami i projektami) wspiera kierowników programów i projektów."},{"t":"Członek zarządu","ok":true,"w":"W opisie komitetu ds. strategii IT (Information Technology — technologie informatyczne) przewodniczącym jest zazwyczaj członek zarządu, a nie CIO (Chief Information Officer — dyrektor ds. informatyki). Chodzi o angażowanie organu Ładu w kluczowe kwestie i decyzje oraz odpowiedzialność za portfele inwestycji, usług i zasobów (s.76)."}],"fz":{"h":"Komitet ds. strategii (wykonawczy IT)","p":"P2","pulapka":false,"n":"EN: IT strategy committee; Chaired by a board member, not the CIO","q":"Czym jest komitet ds. strategii (wykonawczy IT) i kto mu przewodniczy?","a":"Grupa najwyższych kierowników wyznaczona przez zarząd, by włączać go w kluczowe decyzje IT; rozlicza się z portfeli (zestawów) inwestycji, usług i zasobów IT. Przewodniczy zwykle członek zarządu, nie CIO.","ex":"Jak rada właścicieli sieci restauracji decydująca o drogich inwestycjach. Prowadzi ją ktoś z zarządu, nie szef techniki – żeby nie oceniał sam siebie. Kierownik techniczny siedzi przy stole, ale nie przewodniczy. Zarząd trzyma ster, CIO doradza.","org":""}},"fz-C-032":{"id":"fz-C-032","typ":"egzamin","s":"EN-02-13","t":"Czym zajmują się komitety sterujące (programów i projektów)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 76"],"r":null,"zap":"","scen":"","o":[{"t":"Wytycznymi dla programów i projektów: planami, przydziałem zasobów, korzyściami i ryzykiem","ok":true,"w":"Komitety sterujące programów i projektów udzielają wytycznych dotyczących planów, zasobów, korzyści i wartości oraz ryzyka danego programu lub projektu. To inny zakres niż architektura całego przedsiębiorstwa lub wspólne stanowisko w zarządzaniu jego ryzykiem (s.76)."},{"t":"Wytycznymi w sprawach architektury korporacyjnej","ok":false,"w":"Rada ds. Architektury udziela wytycznych dotyczących architektury korporacyjnej oraz tworzy polityki i standardy architektury. Komitety sterujące zajmują się programami i projektami (s.76)."},{"t":"Wspólnym stanowiskiem ws. ryzyka całego przedsiębiorstwa (ERM)","ok":false,"w":"Komitet ds. zarządzania ryzykiem w przedsiębiorstwie współpracuje i uzgadnia wspólne stanowisko kadry kierowniczej w ERM (Enterprise Risk Management — zarządzanie ryzykiem w przedsiębiorstwie). Może wspierać go rada ds. ryzyka IT (Information Technology — technologie informatyczne), która zajmuje się nim bardziej szczegółowo i doradza komitetowi (s.76)."},{"t":"Audytami wewnętrznymi","ok":false,"w":"To zadanie Audytu."}],"fz":{"h":"Komitety sterujące","p":"P2","pulapka":false,"n":"EN: Steering (programmes/projects) committees","q":"Czym zajmują się komitety sterujące?","a":"Wytycznymi dla programów i projektów: zarządzanie planami i ich monitorowanie, przydział zasobów, dostarczanie korzyści i wartości, ryzyko programów i projektów.","ex":"Jak ekipa nadzorująca remont lokalu: pilnuje planu, przydziela ludzi i pieniądze, sprawdza, czy remont się opłaci, i ostrzega przed wpadkami.","org":""}},"fz-C-033":{"id":"fz-C-033","typ":"egzamin","s":"EN-02-13","t":"Czym zajmuje się Rada ds. Architektury?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 76"],"r":null,"zap":"","scen":"","o":[{"t":"Prowadzeniem sekretariatu portfela inwestycji i usług","ok":false,"w":"To zadanie VMO."},{"t":"Wytycznymi w sprawach architektury korporacyjnej oraz tworzeniem polityk i standardów architektury","ok":true,"w":"Tak opisuje ją fiszka."},{"t":"Wspieraniem kierowników programów i projektów","ok":false,"w":"To zadanie PMO."},{"t":"Bezpieczeństwem informacji we wszystkich formach","ok":false,"w":"To odpowiedzialność CISO."}],"fz":{"h":"Rada ds. Architektury","p":"P2","pulapka":false,"n":"EN: Architecture board","q":"Czym zajmuje się Rada ds. Architektury?","a":"Wytycznymi w sprawach architektury korporacyjnej (jak systemy firmy do siebie pasują) oraz tworzeniem polityk i standardów architektury.","ex":"Jak główny architekt sieci restauracji: pilnuje, by każda nowa kuchnia miała pasujący do reszty układ i sprzęt, i spisuje standardy.","org":""}},"fz-C-034":{"id":"fz-C-034","typ":"egzamin","s":"EN-02-13","t":"Czym zajmuje się komitet ds. zarządzania ryzykiem w przedsiębiorstwie?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 76"],"r":null,"zap":"","scen":"","o":[{"t":"Wyłącznie ryzykiem pojedynczych programów i projektów","ok":false,"w":"Ryzykiem programów i projektów zajmują się komitety sterujące."},{"t":"Wytycznymi zgodności z wymogami prawnymi i umownymi","ok":false,"w":"To zadanie funkcji Zgodność."},{"t":"Zarządzaniem finansami i rzetelną rachunkowością","ok":false,"w":"To odpowiedzialność CFO."},{"t":"Uzgadnianiem wspólnego stanowiska kadry kierowniczej w zarządzaniu ryzykiem całego przedsiębiorstwa (ERM)","ok":true,"w":"Tak opisuje go fiszka; może mieć pod sobą radę ds. ryzyka IT."}],"fz":{"h":"Komitet ds. zarządzania ryzykiem w przedsiębiorstwie","p":"P2","pulapka":false,"n":"EN: Enterprise risk committee","q":"Czym zajmuje się komitet ds. zarządzania ryzykiem w przedsiębiorstwie?","a":"Współpracą i uzgadnianiem wspólnego stanowiska kadry kierowniczej, potrzebnego do działań i decyzji w zarządzaniu ryzykiem całego przedsiębiorstwa (ERM); może mieć pod sobą radę ds. ryzyka IT.","ex":"Narada kierowników o zagrożeniach całej firmy: pożar, zatrucie, utrata dostawcy. Uzgadniają wspólne stanowisko; awariami systemów może zająć się osobna, mniejsza rada.","org":""}},"fz-C-035":{"id":"fz-C-035","typ":"egzamin","s":"EN-02-13","t":"Które przypisanie zadań do PMO i VMO jest zgodne z COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 77"],"r":null,"zap":"","scen":"","o":[{"t":"VMO – sekretariat portfela inwestycji i usług, ocena szans i uzasadnień biznesowych","ok":true,"w":"VMO (Value Management Office — biuro zarządzania wartością) działa jako sekretariat zarządzania portfelem inwestycji i usług: ocenia szanse i uzasadnienia biznesowe, doradza oraz raportuje utrzymanie i tworzenie wartości. PMO (Programme and Project Management Office — biuro zarządzania programami i projektami) wspiera kierowników i raportuje przebieg programów oraz projektów (s.77)."},{"t":"PMO – ocena uzasadnień biznesowych i raportowanie tworzenia wartości","ok":false,"w":"To zadania VMO (Value Management Office — biuro zarządzania wartością), nie PMO (Programme and Project Management Office — biuro zarządzania programami i projektami)."},{"t":"VMO – wsparcie kierowników programów i projektów","ok":false,"w":"To zadanie PMO (Programme and Project Management Office — biuro zarządzania programami i projektami)."},{"t":"PMO – tworzenie polityk i standardów architektury","ok":false,"w":"To zadanie Rady ds. Architektury."}],"fz":{"h":"PMO i VMO","p":"P2","pulapka":false,"n":"EN: Project and programme management office; value management office","q":"Czym zajmują się PMO i VMO?","a":"PMO (biuro projektów): wspiera kierowników programów i projektów; zbiera, ocenia i raportuje informacje o ich przebiegu. VMO (biuro wartości): sekretariat portfela inwestycji i usług – ocenia szanse i uzasadnienia biznesowe, raportuje tworzenie wartości.","ex":"PMO to biuro, które pilnuje wszystkich remontów naraz i raportuje postępy. VMO liczy, czy nowy lokal się opłaci. P jak projekty, V jak value, czyli wartość.","org":""}},"fz-C-036":{"id":"fz-C-036","typ":"egzamin","s":"EN-02-13","t":"Za co odpowiada właściciel procesu biznesowego?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 76"],"r":null,"zap":"","scen":"","o":[{"t":"Za audyty wewnętrzne","ok":false,"w":"To zadanie Audytu."},{"t":"Za wytyczne zgodności z wymogami prawnymi, regulacyjnymi i umownymi","ok":false,"w":"To zadanie funkcji Zgodność."},{"t":"Za osiąganie celów procesu, jego doskonalenie i zatwierdzanie zmian","ok":true,"w":"Właściciel procesu biznesowego odpowiada za jego sprawność poprzez realizację celów, doskonalenie i zatwierdzanie zmian. Nie jest to ogólna rola funkcji audytu, zgodności ani dyrektora informatyki (s.76)."},{"t":"Za dopasowanie strategii IT do strategii biznesowej","ok":false,"w":"To odpowiedzialność CIO (Chief Information Officer — dyrektor ds. informatyki)."}],"fz":{"h":"Audyt, Zgodność, właściciel procesu biznesowego","p":"P2","pulapka":false,"n":"EN: Audit, compliance, business process owner","q":"Za co odpowiadają Audyt, Zgodność i właściciel procesu biznesowego?","a":"Audyt: audyty wewnętrzne. Zgodność: wytyczne zgodności z wymogami prawnymi, regulacyjnymi i umownymi. Właściciel procesu biznesowego: osiąganie celów procesu, jego doskonalenie i zatwierdzanie zmian.","ex":"Audyt to wewnętrzny inspektor, który sprawdza kuchnię. Zgodność pilnuje przepisów sanepidu i umów. Właściciel procesu „ma” dany przepis: ulepsza go i zatwierdza zmiany.","org":""}},"fz-C-037":{"id":"fz-C-037","typ":"egzamin","s":"EN-02-13","t":"Za co odpowiada CIO?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 76"],"r":null,"zap":"","scen":"","o":[{"t":"Za przewodniczenie komitetowi ds. strategii (wykonawczemu IT)","ok":false,"w":"Komitetowi przewodniczy zwykle członek zarządu, nie CIO (Chief Information Officer — dyrektor ds. informatyki)."},{"t":"Za wszystkie aspekty zarządzania ryzykiem w organizacji","ok":false,"w":"To odpowiedzialność CRO (Chief Risk Officer — dyrektor ds. ryzyka)."},{"t":"Za bezpieczeństwo informacji we wszystkich formach","ok":false,"w":"To odpowiedzialność CISO (Chief Information Security Officer — dyrektor ds. bezpieczeństwa informacji)."},{"t":"Za dopasowanie strategii IT do biznesowej oraz planowanie, optymalizację zasobów i dostarczanie usług IT","ok":true,"w":"CIO (Chief Information Officer — dyrektor ds. informatyki) odpowiada za dopasowanie strategii IT (Information Technology — technologie informatyczne) do biznesowej, planowanie, optymalizację zasobów i zarządzanie dostarczaniem usług oraz rozwiązań informatycznych wspierających cele organizacji (s.76)."}],"fz":{"h":"CIO","p":"P2","pulapka":false,"n":"EN: Chief Information Officer","q":"Za co odpowiada CIO?","a":"Za dopasowanie strategii IT do strategii biznesowej oraz za planowanie, optymalizację zasobów i dostarczanie usług i rozwiązań IT wspierających cele organizacji.","ex":"CIO to szef całej techniki w sieci restauracji: dba, by kasy i systemy zamówień służyły planom firmy, a nie żyły własnym życiem.","org":""}},"fz-C-038":{"id":"fz-C-038","typ":"egzamin","s":"EN-02-13","t":"Za co odpowiada CRO?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 76"],"r":null,"zap":"","scen":"","o":[{"t":"Za wszystkie aspekty zarządzania ryzykiem w organizacji","ok":true,"w":"CRO (Chief Risk Officer — dyrektor ds. ryzyka) obejmuje wszystkie aspekty zarządzania ryzykiem przedsiębiorstwa. CFO (Chief Financial Officer — dyrektor ds. finansowych) skupia się na finansach i ryzyku finansowym, a CISO (Chief Information Security Officer — dyrektor ds. bezpieczeństwa informacji) na bezpieczeństwie informacji we wszystkich formach (s.76)."},{"t":"Za ryzyko finansowe, kontrole i rzetelną rachunkowość","ok":false,"w":"To odpowiedzialność CFO (Chief Financial Officer — dyrektor ds. finansowych)."},{"t":"Za bezpieczeństwo informacji we wszystkich formach","ok":false,"w":"To odpowiedzialność CISO (Chief Information Security Officer — dyrektor ds. bezpieczeństwa informacji)."},{"t":"Za funkcjonowanie organizacji","ok":false,"w":"To odpowiedzialność COO (Chief Operating Officer — dyrektor operacyjny)."}],"fz":{"h":"CFO, CRO, CISO","p":"P2","pulapka":false,"n":"EN: CFO, CRO, CISO","q":"Za co odpowiadają CFO, CRO i CISO?","a":"CFO: zarządzanie finansami, ryzyko finansowe i kontrole, rzetelna rachunkowość. CRO: wszystkie aspekty zarządzania ryzykiem w organizacji. CISO: bezpieczeństwo informacji we wszystkich formach.","ex":"CFO – kasa i księgowość (F jak finanse). CRO – wszystkie zagrożenia (R jak ryzyko). CISO – ochrona informacji w każdej postaci, także na papierze (S jak security).","org":""}},"fz-C-039":{"id":"fz-C-039","typ":"egzamin","s":"EN-02-15","t":"Jak COBIT 5 definiuje kulturę?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 91"],"r":null,"zap":"","scen":"","o":[{"t":"Jako ogólne zamierzenia formalnie spisane przez kierownictwo","ok":false,"w":"To definicja polityki."},{"t":"Jako wzorzec zachowań, poglądów, założeń, postaw i sposobów działania","ok":true,"w":"Słownik definiuje kulturę jako wzorzec zachowań, poglądów, założeń, postaw i sposobów działania. Nie ogranicza jej do formalnej polityki ani indywidualnych wartości jednego pracownika (s.91)."},{"t":"Jako wartości osobiste wynikające z religii i pochodzenia","ok":false,"w":"To opis etyki indywidualnej."},{"t":"Jako wartości i podstawowe przekonania organizacji","ok":false,"w":"To definicja zasady."}],"fz":{"h":"Definicja kultury","p":"P2","pulapka":false,"n":"EN: Culture","q":"Jak COBIT 5 definiuje kulturę?","a":"Wzorzec zachowań, poglądów, założeń, postaw i sposobów działania.","ex":"Kultura to „jak się u nas robi”: czy w kuchni pomaga się nowym i sprząta po sobie. Pięć słów: zachowania, poglądy, założenia, postawy, sposoby działania.","org":""}},"fz-C-040":{"id":"fz-C-040","typ":"egzamin","s":"EN-02-15","t":"Na jakich poziomach określa się cele aktywatora Kultura, etyka i zachowanie?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 79"],"r":null,"zap":"","scen":"","o":[{"t":"Jakość wewnętrzna, jakość kontekstowa, jakość bezpieczeństwa","ok":false,"w":"To kategorie celów aktywatora Informacja."},{"t":"Wytwórca, opiekun, konsument","ok":false,"w":"To role interesariuszy informacji."},{"t":"Etyka organizacyjna, etyka indywidualna, zachowania indywidualne","ok":true,"w":"Te trzy poziomy razem tworzą kulturę organizacji."},{"t":"Zasady, polityki, struktury ramowe","ok":false,"w":"To elementy innego aktywatora."}],"fz":{"h":"Poziomy celów kultury, etyki i zachowania","p":"P2","pulapka":false,"n":"EN: Organisational ethics, individual ethics, individual behaviour","q":"Na jakich poziomach określa się cele tego aktywatora?","a":"Etyka organizacyjna (wartości organizacji), etyka indywidualna (wartości osobiste), zachowania indywidualne – łącznie tworzące kulturę organizacji.","ex":"Trzy piętra: wartości restauracji („tylko świeże produkty”), wartości kucharza (uczciwość wyniesiona z domu) i to, co faktycznie robi przy garach. Razem dają atmosferę lokalu.","org":""}},"fz-C-041":{"id":"fz-C-041","typ":"egzamin","s":"EN-02-15","t":"Które źródło etyki indywidualnej akcentuje opis COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 79"],"r":null,"zap":"","scen":"","o":[{"t":"Osobiste wartości, w znacznym stopniu kształtowane przez czynniki zewnętrzne","ok":true,"w":"Etyka indywidualna jest oparta na osobistych wartościach pracownika i w znacznym stopniu zależy m.in. od religii, pochodzenia, statusu społeczno-ekonomicznego, regionu i doświadczeń. Nie oznacza to braku wpływu organizacji (s.79)."},{"t":"Wartości organizacji formalnie przyjęte w jej zasadach i kodeksie postępowania","ok":false,"w":"Wartości, na których ma opierać się funkcjonowanie organizacji, określają przede wszystkim etykę organizacyjną. Mogą wpływać na ludzi, lecz nie są pełną definicją ich etyki indywidualnej (s.79)."},{"t":"System nagród i kar służący egzekwowaniu pożądanych zachowań w organizacji","ok":false,"w":"Nagrody, zachęty i środki zniechęcające to dobre praktyki kształtowania zachowań. Nie zastępują osobistych źródeł etyki indywidualnej (s.79–80)."},{"t":"Mandat struktury określający cel, zakres i zasady działania jej członków","ok":false,"w":"Mandat wyjaśnia powód i cel istnienia struktury organizacyjnej. Nie definiuje wartości osobistych pracownika (s.75,79)."}],"fz":{"h":"Etyka indywidualna","p":"P2","pulapka":false,"n":"EN: Individual ethics","q":"Od czego zależy etyka indywidualna?","a":"W dużej mierze od czynników zewnętrznych: religii, pochodzenia, statusu społeczno-ekonomicznego, regionu i doświadczeń osobistych.","ex":"Każdy kucharz przynosi wartości z zewnątrz: wiarę, wychowanie, zamożność rodziny, miejsce, z którego pochodzi, i to, co przeżył. Firma ich nie wymyśla.","org":""}},"fz-C-042":{"id":"fz-C-042","typ":"egzamin","s":"EN-02-15","t":"Który przykład to zachowanie indywidualne istotne dla Ładu według COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 79"],"r":null,"zap":"","scen":"","o":[{"t":"Zasady prowadzenia zebrań komitetu","ok":false,"w":"Ustalenia dotyczące zebrań, dokumentowania i porządku obrad są zasadami operacyjnymi struktury organizacyjnej. To dobra praktyka struktur, a nie jeden z przytoczonych rodzajów zachowań indywidualnych (podręcznik COBIT 5 PL s.75,79)."},{"t":"Opis przyszłej architektury organizacji","ok":false,"w":"Architektura docelowa opisuje przyszłą lub planowaną zdolność usługową, w tym aplikacje, infrastrukturę oraz ich powiązania. Należy do opisu aktywatora Usługi, Infrastruktura i Aplikacje (podręcznik COBIT 5 PL s.85)."},{"t":"Docelowy wskaźnik rotacji personelu","ok":false,"w":"Odpowiedni wskaźnik rotacji personelu jest jednym z celów aktywatora Ludzie, Umiejętności i Kompetencje. Nie jest przytoczonym rodzajem zachowania indywidualnego (podręcznik COBIT 5 PL s.87)."},{"t":"Reakcja na negatywne wyniki","ok":true,"w":"COBIT 5 wymienia zachowanie w przypadku negatywnych wyników: czy organizacja uczy się, zmienia sposób działania i usuwa przyczyny, czy poprzestaje na obwinianiu. Pozostałe przykłady to zachowanie wobec ryzyka i przestrzeganie polityk (podręcznik COBIT 5 PL s.79)."}],"fz":{"h":"Zachowania indywidualne istotne dla Ładu","p":"P2","pulapka":false,"n":"EN: Risk-taking, policy compliance, behaviour on negative outcomes","q":"Podaj przykłady zachowań indywidualnych istotnych dla Ładu.","a":"Zachowanie wobec ryzyka (ile ryzyka przyjąć), przestrzeganie polityk, zachowanie wobec negatywnych wyników (nauka czy szukanie winnych).","ex":"Czy kucharz zaryzykuje nowy przepis w sobotni wieczór, czy trzyma się regulaminu i czy po wpadce szuka przyczyny, czy winnego. Haczyk: ryzyko, reguły, porażka.","org":""}},"fz-C-043":{"id":"fz-C-043","typ":"egzamin","s":"EN-02-14","t":"Który z poniższych NIE jest dobrą praktyką kształtowania pożądanych zachowań?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 80"],"r":null,"zap":"","scen":"","o":[{"t":"Zachęty i nagrody","ok":false,"w":"To dobra praktyka kształtowania zachowań."},{"t":"Delegowanie uprawnień","ok":true,"w":"To dobra praktyka struktur organizacyjnych, nie kształtowania zachowań."},{"t":"Przykład kierownictwa i czempionów","ok":false,"w":"To dobra praktyka kształtowania zachowań (świadomość)."},{"t":"Egzekwowanie wymagań","ok":false,"w":"To dobra praktyka kształtowania zachowań."}],"fz":{"h":"Dobre praktyki kształtowania zachowań","p":"P2","pulapka":false,"n":"EN: Communication, enforcement, incentives and rewards, awareness, rules and norms, champions","q":"Jakie są dobre praktyki kształtowania pożądanych zachowań?","a":"Komunikowanie zachowań i wartości; świadomość przez przykład kierownictwa i czempionów (podr. osoby wspierające, czyli wzory do naśladowania); zachęty i nagrody oraz środki zniechęcające do zachowań niepożądanych; reguły i normy; egzekwowanie wymagań.","ex":"Szef sam myje ręce przed gotowaniem, nagradza porządek, wiesza zasady na ścianie i reaguje, gdy ktoś je łamie. Mówić, pokazywać, nagradzać, pilnować.","org":""}},"fz-C-044":{"id":"fz-C-044","typ":"egzamin","s":"EN-02-16","t":"Jak kultura wiąże się z innymi aktywatorami według COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 80"],"r":null,"zap":"","scen":"","o":[{"t":"Decyzje struktur są wdrażane niezależnie od zachęt","ok":false,"w":"Zachęty, intencje i kultura wpływają na wdrażanie decyzji struktur. Podręcznik wymienia brak zachęt jako jedną z możliwych przeszkód, nie twierdzi, że bez osobnej zachęty żadna decyzja nie zostanie wykonana (s.80)."},{"t":"Zasady i polityki nie mają związku z wartościami","ok":false,"w":"Zasady i polityki komunikują wartości i pożądane zachowania."},{"t":"Nawet doskonały proces nie da wyników, gdy ludzie nie chcą go stosować","ok":true,"w":"Poprawny projekt procesu nie wystarczy, jeśli interesariusze nie realizują działań we właściwy sposób. Kultura, etyka i zachowanie wpływają więc na wyniki procesów i skuteczność decyzji struktur (s.80)."},{"t":"Kultura wpływa tylko na aktywatory będące zasobami","ok":false,"w":"Kultura wpływa też na procesy, struktury i polityki."}],"fz":{"h":"Kultura a inne aktywatory","p":"P2","pulapka":false,"n":"EN: Culture – relationships","q":"Jak kultura wiąże si
