izacji.","ex":"Jak dziesięć przykazań: mało, krótko i prosto. Zasad nie może być sto, bo nikt ich nie zapamięta. Haczyk: mało, prosto, precyzyjnie.","org":""},"cyt":{"s":"67","t":"muszą być sformułowane prostym językiem i w sposób maksymalnie precyzyjny wyrażać podstawowe wartości przedsiębiorstwa.","w":"ZGODNE","u":"Poprzedni punkt tej samej listy: „ich liczba musi być ograniczona”."}},"fz-C-013":{"id":"fz-C-013","typ":"egzamin","s":"EN-02-03","t":"Jakie są cechy dobrej polityki?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 67"],"r":null,"zap":"","scen":"","o":[{"t":"Kompleksowa, otwarta i elastyczna, aktualna","ok":false,"w":"To cechy struktur ramowych Ładu i Zarządzania."},{"t":"Zakres i ważność, skutki nieprzestrzegania, obsługa wyjątków","ok":false,"w":"To elementy struktury polityk, nie cechy dobrej polityki."},{"t":"Nieliczna, prosta językowo, precyzyjna","ok":false,"w":"To kryteria dla zasad."},{"t":"Skuteczna, wydajna, nieinwazyjna","ok":true,"w":"Skuteczna polityka osiąga wskazany cel; wydajna wdraża zasady przy racjonalnym wykorzystaniu zasobów; nieinwazyjna jest logiczna dla odbiorców i nie budzi zbędnego oporu. To trzy cechy podane przy politykach (s.67)."}],"fz":{"h":"Cechy dobrej polityki","p":"P1","pulapka":true,"n":"EN: Effective, efficient, non-intrusive","q":"Jakie są cechy dobrej polityki?","a":"Dobre polityki są skuteczne (osiągają wskazany cel), wydajne (wdrażają zasady przy racjonalnym wykorzystaniu zasobów) i nieinwazyjne (podręcznik: nieingerencyjne — logiczne dla odbiorców, bez niepotrzebnego oporu).","ex":"Dobra reguła w kuchni działa, nie kosztuje fortuny i nie irytuje ludzi bez powodu. Haczyk SWN: Skuteczna, Wydajna, Nieinwazyjna.","org":""},"cyt":{"s":"67","t":"nieingerencyjne — osobom, które muszą ich przestrzegać, wydają się logiczne, tj. nie budzą niepotrzebnego oporu.","w":"ZGODNE","u":"Ta sama lista „Dobre polityki są:” wymienia też skuteczne i wydajne; podręcznik: „nieingerencyjne” zamiast „nieinwazyjne”."}},"fz-C-014":{"id":"fz-C-014","typ":"egzamin","s":"EN-02-05","t":"Który z poniższych NIE jest elementem, który musi opisywać struktura polityk?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 68"],"r":null,"zap":"","scen":"","o":[{"t":"Zakres i ważność – kogo i kiedy polityka dotyczy","ok":false,"w":"To element struktury polityk."},{"t":"Skutki nieprzestrzegania polityki","ok":false,"w":"To element struktury polityk."},{"t":"Nieinwazyjność polityki","ok":true,"w":"To cecha dobrej polityki, nie element struktury polityk."},{"t":"Sposób kontroli i pomiaru przestrzegania polityki","ok":false,"w":"To element struktury polityk."}],"fz":{"h":"Struktura polityk","p":"P1","pulapka":true,"n":"EN: Scope and validity; consequences of non-compliance; exception handling; compliance monitoring","q":"Jakie elementy musi opisywać struktura polityk?","a":"Zakres i ważność (podr. prawidłowość) – kogo i kiedy dotyczy; skutki nieprzestrzegania; obsługa wyjątków; sposób kontroli i pomiaru przestrzegania polityki.","ex":"Każdy regulamin kuchni mówi: kogo i gdzie dotyczy, co grozi za złamanie, kiedy wolno zrobić wyjątek i kto to sprawdza. Cztery rubryki: zakres, kara, wyjątek, kontrola.","org":""},"cyt":{"s":"68","t":"W ramach struktury polityk muszą zostać opisane następujące elementy: • zakres i prawidłowość; • konsekwencje nieprzestrzegania polityki; • sposób obsługi wyjątków; • sposób kontroli i pomiaru zgodności z polityką.","w":"ZGODNE"}},"fz-C-015":{"id":"fz-C-015","typ":"egzamin","s":"EN-02-05,EN-02-03","t":"Czym w COBIT 5 jest „zakres i ważność”?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 68"],"r":null,"zap":"","scen":"","o":[{"t":"Cechą dobrej polityki","ok":false,"w":"Cechy dobrej polityki to: skuteczna, wydajna, nieinwazyjna."},{"t":"Elementem struktury polityk","ok":true,"w":"Zakres i ważność należy do elementów struktury polityk, podobnie jak konsekwencje nieprzestrzegania, obsługa wyjątków oraz kontrola zgodności. Cechy dobrej polityki to odrębna lista: skuteczność, wydajność, nieinwazyjność (s.67–68)."},{"t":"Kryterium, które muszą spełniać zasady","ok":false,"w":"Kryteria zasad to ograniczona liczba, prosty język i precyzja."},{"t":"Cechą struktur ramowych Ładu","ok":false,"w":"Struktury ramowe mają być kompleksowe, otwarte, aktualne i dostępne."}],"fz":{"h":"Zakres i ważność","p":"P1","pulapka":true,"n":"EN: Policy framework elements vs good policy characteristics","q":"„Zakres i ważność” – cecha dobrej polityki czy element struktury polityk?","a":"Element struktury polityk (obok konsekwencji, wyjątków i kontroli zgodności). Cechy dobrej polityki to: skuteczna, wydajna, nieinwazyjna.","ex":"Cechy dobrej polityki to oceny regulaminu (SWN: skuteczna, wydajna, nieinwazyjna). Elementy struktury to rubryki w samym regulaminie: zakres, kary, wyjątki, kontrola.","org":""},"cyt":{"s":"68","t":"W ramach struktury polityk muszą zostać opisane następujące elementy: • zakres i prawidłowość; • konsekwencje nieprzestrzegania polityki; • sposób obsługi wyjątków; • sposób kontroli i pomiaru zgodności z polityką.","w":"ZGODNE","u":"Tekst podręcznika: „zakres i prawidłowość” (na Ilustracji 28: „zakres, ważność”)."}},"fz-C-016":{"id":"fz-C-016","typ":"egzamin","s":"EN-02-05","t":"Jakie powinny być struktury ramowe Ładu i Zarządzania?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 67"],"r":null,"zap":"","scen":"","o":[{"t":"Kompleksowe, otwarte, aktualne i dostępne","ok":true,"w":"Struktury ramowe mają być kompleksowe, otwarte i elastyczne, aktualne oraz dostępne dla wszystkich zainteresowanych (FW-PL s. 67)."},{"t":"Skuteczne, wydajne i nieinwazyjne","ok":false,"w":"To cechy dobrej polityki."},{"t":"Nieliczne i sformułowane prostym językiem","ok":false,"w":"To kryteria dla zasad."},{"t":"Poufne i przeznaczone dla organu Ładu","ok":false,"w":"Struktury ramowe mają być dostępne dla wszystkich zainteresowanych, a nie poufne."}],"fz":{"h":"Struktury ramowe Ładu i Zarządzania","p":"P2","pulapka":false,"n":"EN: Frameworks: comprehensive, open and flexible, current, available","q":"Jakie powinny być struktury ramowe Ładu i Zarządzania?","a":"Kompleksowe (obejmują całość), otwarte i elastyczne, aktualne oraz dostępne dla wszystkich zainteresowanych.","ex":"Jak księga procedur restauracji: obejmuje całą kuchnię, da się ją dopasować do nowego menu, jest aktualna i leży tam, gdzie każdy może zajrzeć.","org":""},"cyt":{"s":"67","t":"kompleksowe, powinny obejmować wszystkie wymagane obszary;","w":"ZGODNE","u":"Dalsze punkty listy „Metodyki powinny być:”: otwarte i elastyczne, aktualne, dostępne dla wszystkich interesariuszy; struktura ramowa = metodyka."}},"fz-C-017":{"id":"fz-C-017","typ":"egzamin","s":"EN-02-05","t":"Która z poniższych jest dobrą praktyką dotyczącą polityk?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 68"],"r":null,"zap":"","scen":"","o":[{"t":"Polityki powstają niezależnie od zasad organizacji","ok":false,"w":"Polityki wynikają z zasad."},{"t":"Raz zatwierdzonej polityki się nie aktualizuje","ok":false,"w":"Polityki są regularnie odnawiane lub aktualizowane."},{"t":"Polityki stoją poza hierarchiczną strukturą ramową","ok":false,"w":"Polityki są częścią hierarchicznej struktury ramowej."},{"t":"Polityki pasują do apetytu na ryzyko organizacji","ok":true,"w":"Podręcznik wymienia dopasowanie polityk do apetytu na ryzyko jako dobrą praktykę (FW-PL s. 68)."}],"fz":{"h":"Dobre praktyki polityk","p":"P2","pulapka":false,"n":"EN: Policy good practices","q":"Jakie dobre praktyki dotyczą polityk?","a":"Są częścią hierarchicznej struktury ramowej i wynikają z zasad; pasują do apetytu na ryzyko (ile ryzyka organizacja akceptuje); są regularnie odnawiane lub aktualizowane.","ex":"Regulamin kuchni wynika z zasad lokalu, pasuje do tego, ile ryzyka szef akceptuje (podajemy surową rybę czy nie), i co sezon się go przegląda.","org":""},"cyt":{"s":"68","t":"Polityki powinny być dopasowane do apetytu na ryzyko w danym przedsiębiorstwie.","w":"ZGODNE"}},"fz-C-018":{"id":"fz-C-018","typ":"egzamin","s":"EN-02-04","t":"Co jest kluczowe w cyklu życia polityki?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 68"],"r":null,"zap":"","scen":"","o":[{"t":"Zapewnienie logicznej treści, która nie budzi zbędnego oporu","ok":false,"w":"To cecha dobrej polityki, nie klucz cyklu życia."},{"t":"Utrzymywanie aktualnej wersji i właściwe wycofywanie starych","ok":true,"w":"W cyklu życia trzeba dbać o aktualizację polityki, świadomość zmian i dostęp do aktualnej wersji oraz odpowiednią archiwizację lub usuwanie wersji nieaktualnych (s.68). Nieinwazyjność jest cechą dobrej polityki, ale nie zastępuje zarządzania jej cyklem życia."},{"t":"Ograniczenie liczby zasad i używanie prostego języka","ok":false,"w":"To kryteria dla zasad."},{"t":"Stosowanie otwartych standardów przy projektowaniu architektury","ok":false,"w":"To pryncypium otwartości architektury."}],"fz":{"h":"Cykl życia polityki","p":"P2","pulapka":false,"n":"EN: Policy life cycle","q":"Co jest kluczowe w cyklu życia polityki?","a":"Aktualność: czy i kiedy się ją aktualizuje, czy pracownicy wiedzą o zmianach, mają dostęp do najnowszej wersji, a nieaktualne wersje są archiwizowane lub usuwane.","ex":"Jak karta dań: po zmianie cen stara znika ze stołów, a wszyscy kelnerzy wiedzą o nowej. Najgorsze to dwie różne wersje w obiegu.","org":""},"cyt":{"s":"68","t":"zapewniające łatwy dostęp do najnowszej wersji (zob. wcześniejszy punkt) oraz zapewniające właściwą archiwizację i pozbywanie się nieaktualnych informacji","w":"ZGODNE"}},"fz-C-020":{"id":"fz-C-020","typ":"egzamin","s":"EN-02-12","t":"Co NIE jest dobrą praktyką struktur organizacyjnych?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 75"],"r":null,"zap":"","scen":"","o":[{"t":"Procedury eskalacji","ok":false,"w":"To dobra praktyka struktur."},{"t":"Delegowanie uprawnień","ok":false,"w":"To dobra praktyka struktur."},{"t":"Liczba podwładnych","ok":true,"w":"Na liście dobrych praktyk nie ma liczby podwładnych menedżera; zakres kontroli to granice uprawnień decyzyjnych, nie liczba podwładnych."},{"t":"Skład struktury","ok":false,"w":"To dobra praktyka struktur."}],"fz":{"h":"Dobre praktyki struktur organizacyjnych","p":"P2","pulapka":false,"n":"EN: Operating principles, composition, span of control, level of authority, delegation of authority, escalation procedures","q":"Jakie są dobre praktyki struktur organizacyjnych?","a":"Zasady operacyjne (podr. zasady działania), skład, zakres kontroli, poziom uprawnień (decyzyjnych), delegowanie uprawnień, procedury eskalacji; sylabus PeopleCert dodaje podejmowanie decyzji.","ex":"Opis każdego zespołu w kuchni: jak pracuje, kto w nim jest, o czym decyduje, co może oddać zastępcy i do kogo idzie, gdy sam nie rozstrzygnie.","org":""},"cyt":{"s":"75","t":"Praktyki: Zasady działania, zasięg (zakres) kontroli, poziom uprawnień, przekazywanie uprawnień, procedury eskalacji","w":"ZGODNE","u":"Tekst z Ilustracji 32; lista w tekście dodaje „Skład”; brak liczby podwładnych."}},"fz-C-021":{"id":"fz-C-021","typ":"egzamin","s":"EN-02-12","t":"Którą pozycję COBIT 5 wymienia jako dobrą praktykę Struktur organizacyjnych?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["SYL EN02.12","FW-PL s. 75–76"],"r":null,"zap":"","scen":"","o":[{"t":"Ograniczanie liczby zasad","ok":false,"w":"Ograniczona liczba jest kryterium dobrych zasad, nie pozycją listy dobrych praktyk struktur organizacyjnych."},{"t":"Kontrola zgodności polityk","ok":false,"w":"Sposób kontroli i pomiaru zgodności należy opisać w strukturze polityki. To inna lista niż dobre praktyki struktur organizacyjnych."},{"t":"Definiowanie poziomów usług","ok":false,"w":"Poziomy usług są dobrą praktyką aktywatora Usługi, infrastruktura i aplikacje."},{"t":"Podejmowanie decyzji","ok":true,"w":"Podejmowanie decyzji jest dobrą praktyką Struktur organizacyjnych. Sposób decydowania jest praktyką, a podjęte decyzje mogą być produktami pracy struktury. Sylabus PeopleCert wskazuje tę pozycję w EN-02-12 (s.75–76)."}],"fz":{"h":"Podejmowanie decyzji jako dobra praktyka","p":"P2","pulapka":true,"n":"EN: Organisational structure good practices; decisions are outputs","q":"Czy „podejmowanie decyzji” to dobra praktyka struktury organizacyjnej?","a":"Tak – sylabus PeopleCert (EN02.12) wymienia podejmowanie decyzji wśród dobrych praktyk struktur, obok zasad działania, zakresu kontroli, poziomu uprawnień, delegowania i eskalacji. Podręcznik pokazuje też decyzje jako główny produkt pracy struktury. To dwa ujęcia: sposób decydowania i jego wynik.","ex":"Rada rodzinna ma ustalony sposób podejmowania uchwał (praktyka), a same uchwały to wynik jej pracy. Jedno nie wyklucza drugiego.","org":""},"cyt":{"s":"75","t":"Poziom decyzyjny/uprawnienia decyzyjne — decyzje, do których podjęcia struktura jest uprawniona;","w":"BRAK_W_FW","u":"FW-PL nie wymienia „podejmowania decyzji” wśród dobrych praktyk struktur (decyzje to produkt działań, Ilustracja 32); pochodzi z sylabusa PeopleCert EN02.12."}},"fz-C-023":{"id":"fz-C-023","typ":"egzamin","s":"EN-02-12","t":"Czym jest zakres kontroli (span of control) w COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 75"],"r":null,"zap":"","scen":"","o":[{"t":"Granicami uprawnień decyzyjnych struktury organizacyjnej","ok":true,"w":"Zakres kontroli wyznacza granice, w których struktura jest uprawniona do podejmowania decyzji. W opisie dobrych praktyk COBIT 5 chodzi o obszar decyzji, a nie o liczbę podwładnych menedżera (FW-PL s. 75)."},{"t":"Liczbą podwładnych menedżera","ok":false,"w":"To klasyczna pułapka: w COBIT 5 nie chodzi o liczbę podwładnych."},{"t":"Przekazaniem uprawnień decyzyjnych strukturom podległym","ok":false,"w":"To delegowanie uprawnień."},{"t":"Zakresem audytu mechanizmów kontrolnych","ok":false,"w":"Audyt mechanizmów kontrolnych to kategoria umiejętności MEA (Monitor, Evaluate and Assess — Monitoruj, Oszacuj i Oceń), nie zakres kontroli."}],"fz":{"h":"Zakres kontroli","p":"P2","pulapka":true,"n":"EN: Span of control; Span of control ≠ number of subordinates","q":"Czym jest zakres kontroli (span of control)? Czy to liczba podwładnych menedżera?","a":"Zakres kontroli to granice uprawnień decyzyjnych struktury organizacyjnej. W tym opisie COBIT 5 nie oznacza liczby podwładnych.","ex":"Kierownik sali decyduje o rezerwacjach, ale nie o menu. Zakres kontroli to płot wokół jego decyzji, czyli to, o czym może rozstrzygać, a nie liczba kelnerów pod nim.","org":""},"cyt":{"s":"75","t":"Zakres kontroli — granice uprawnień decyzyjnych struktury organizacyjnej;","w":"ZGODNE"}},"fz-C-024":{"id":"fz-C-024","typ":"egzamin","s":"EN-02-12","t":"Czym jest poziom uprawnień struktury organizacyjnej?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 75"],"r":null,"zap":"","scen":"","o":[{"t":"Liczbą i doborem członków struktury","ok":false,"w":"To dotyczy składu struktury."},{"t":"Ustaleniami o częstotliwości zebrań","ok":false,"w":"To zasady operacyjne."},{"t":"Decyzjami, które struktura może podejmować","ok":true,"w":"Poziom uprawnień (w podręczniku: poziom decyzyjny) to decyzje, do których podjęcia struktura jest uprawniona (FW-PL s. 75)."},{"t":"Drogą przekazania sprawy na wyższy szczebel","ok":false,"w":"To procedury eskalacji."}],"fz":{"h":"Poziom uprawnień","p":"P2","pulapka":false,"n":"EN: Level of authority / decision rights","q":"Czym jest poziom uprawnień?","a":"Decyzjami, do których podjęcia struktura jest uprawniona (podr. poziom decyzyjny / uprawnienia decyzyjne).","ex":"Kucharz zmiany może sam zmienić dodatek do dania, ale nowe danie w karcie zatwierdza tylko szef. Chodzi o to, kto może podjąć jaką decyzję.","org":""},"cyt":{"s":"75","t":"Poziom decyzyjny/uprawnienia decyzyjne — decyzje, do których podjęcia struktura jest uprawniona;","w":"ZGODNE"}},"fz-C-025":{"id":"fz-C-025","typ":"egzamin","s":"EN-02-12","t":"Czym jest delegowanie uprawnień w strukturze organizacyjnej?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 75"],"r":null,"zap":"","scen":"","o":[{"t":"Przekazaniem sprawy wyżej, gdy brak decyzji","ok":false,"w":"To procedury eskalacji – ruch w górę, nie w dół."},{"t":"Wyznaczeniem przez zarząd komitetu ds. strategii","ok":false,"w":"To opis komitetu ds. strategii, nie delegowania."},{"t":"Określeniem granic, w jakich struktura decyduje","ok":false,"w":"To zakres kontroli."},{"t":"Przekazaniem uprawnień strukturom podległym","ok":true,"w":"Delegowanie (w podręczniku: przekazywanie) uprawnień to przekazanie przez strukturę jej uprawnień decyzyjnych lub ich części podległym strukturom (FW-PL s. 75)."}],"fz":{"h":"Delegowanie uprawnień","p":"P2","pulapka":false,"n":"EN: Delegation of authority","q":"Czym jest delegowanie uprawnień?","a":"Przekazaniem przez strukturę jej uprawnień decyzyjnych (lub ich części) podległym strukturom. Podr.: przekazywanie uprawnień.","ex":"Szef kuchni przed urlopem mówi zastępcy: „zamówienia u dostawców zatwierdzasz ty”. Oddaje część swoich decyzji komuś niżej.","org":""},"cyt":{"s":"75","t":"Przekazywanie uprawnień — struktury mogą przekazywać uprawnienia decyzyjne (lub ich podzbiór) innym, podległym im strukturom;","w":"ZGODNE"}},"fz-C-026":{"id":"fz-C-026","typ":"egzamin","s":"EN-02-12","t":"Co opisują procedury eskalacji?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 75"],"r":null,"zap":"","scen":"","o":[{"t":"Przekazanie części uprawnień strukturom podległym","ok":false,"w":"To delegowanie uprawnień."},{"t":"Częstotliwość zebrań i porządek obrad","ok":false,"w":"To zasady operacyjne."},{"t":"Postępowanie, gdy struktura nie może podjąć decyzji","ok":true,"w":"Procedury eskalacji opisują, co zrobić, gdy struktura ma problem z podjęciem decyzji – drogę przekazania sprawy wyżej (FW-PL s. 75)."},{"t":"Skutki nieprzestrzegania polityki przez pracowników","ok":false,"w":"To element struktury polityk."}],"fz":{"h":"Procedury eskalacji","p":"P2","pulapka":false,"n":"EN: Escalation procedures","q":"Czym są procedury eskalacji?","a":"Ustalona droga przekazania sprawy wyżej: opisuje, co trzeba zrobić, gdy struktura ma problem z podjęciem decyzji.","ex":"Kelner nie umie rozwiązać skargi, więc woła kierownika sali, a ten właściciela. Eskalacja to schody w górę, aż ktoś zdecyduje.","org":""},"cyt":{"s":"75","t":"Procedury eskalacji — ścieżka eskalacji dla struktury, opisująca wymagane działania w przypadku problemów z podjęciem decyzji.","w":"ZGODNE"}},"fz-C-027":{"id":"fz-C-027","typ":"egzamin","s":"EN-02-12","t":"Co definiuje się przy tworzeniu struktury organizacyjnej?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 75"],"r":null,"zap":"","scen":"","o":[{"t":"Mandat i cel istnienia","ok":true,"w":"Przy tworzeniu struktury definiuje się jej mandat – po co struktura istnieje i jaki ma cel (FW-PL s. 75)."},{"t":"Pryncypia architektury","ok":false,"w":"To dobra praktyka aktywatora Usługi, infrastruktura i aplikacje."},{"t":"Cykl życia umiejętności","ok":false,"w":"To element aktywatora Ludzie, umiejętności i kompetencje."},{"t":"Architekturę docelową","ok":false,"w":"To przyszła zdolność usługowa, nie element tworzenia struktury."}],"fz":{"h":"Mandat i wyniki struktury","p":"P2","pulapka":false,"n":"EN: Mandate; outputs: decisions","q":"Co definiuje się przy tworzeniu struktury i co ona wytwarza?","a":"Mandat, czyli po co struktura istnieje i jaki ma cel. Decyzje podejmuje na podstawie wejść (zwykle informacji); jej wyniki to decyzje, informacje lub prośby o dodatkowe dane.","ex":"Komisja menu powstaje „po to, by co kwartał odświeżać kartę” – to mandat. Dostaje opinie gości i ceny, a wydaje decyzje: co zostaje, co znika.","org":""},"cyt":{"s":"75","t":"W chwili jej założenia musi zostać zdefiniowany mandat — powód i cel jej istnienia.","w":"ZGODNE"}},"fz-C-028":{"id":"fz-C-028","typ":"egzamin","s":"EN-02-12","t":"Co jest głównym produktem pracy struktury organizacyjnej?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 75","FW-PL s. 76"],"r":null,"zap":"","scen":"","o":[{"t":"Informacje, które struktura otrzymuje na wejściu","ok":false,"w":"Informacje są zwykle wejściem, a nie głównym produktem."},{"t":"Decyzje (a także informacje i prośby o dodatkowe dane)","ok":true,"w":"Podręcznik: na wejściu są zwykle informacje, a wynikiem są decyzje (FW-PL s. 76)."},{"t":"Usługi IT dla użytkowników","ok":false,"w":"Usługi IT zapewnia aktywator Usługi, infrastruktura i aplikacje."},{"t":"Wartość wynikająca z wiedzy","ok":false,"w":"To ostatni element cyklu informacji."}],"fz":{"h":"Produkt pracy struktury","p":"P2","pulapka":true,"n":"EN: Structures output decisions; Mandate; outputs: decisions","q":"Co jest produktem pracy struktury organizacyjnej?","a":"Decyzje (a także informacje i żądania dodatkowych danych). Wejściem są zwykle informacje. Przy tworzeniu struktury definiuje się mandat, czyli po co struktura istnieje i jaki ma cel.","ex":"Narada szefów kuchni nie gotuje zup – jej produktem są decyzje, np. nowe menu. Wchodzą informacje, wychodzą decyzje. Komisja menu dostaje opinie gości i ceny, a wydaje decyzje: co zostaje, co znika.","org":""},"cyt":{"s":"76","t":"struktura podejmuje świadome decyzje na podstawie danych wejściowych (zazwyczaj informacji) i przedstawia wyniki, na przykład decyzje, inne informacje lub żądania dodatkowych danych wejściowych.","w":"ZGODNE"}},"fz-C-029":{"id":"fz-C-029","typ":"egzamin","s":"EN-02-13","t":"Co według COBIT 5 łączy działania procesów ze strukturami i rolami?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 75"],"r":null,"zap":"","scen":"","o":[{"t":"Repozytorium architektury","ok":false,"w":"Repozytorium przechowuje wyniki prac architektonicznych."},{"t":"Cykl informacji","ok":false,"w":"Cykl informacji opisuje drogę od procesów biznesowych do wartości."},{"t":"Tabela RACI","ok":true,"w":"Podręcznik: tabele RACI łączą działania procesów ze strukturami i rolami (FW-PL s. 75)."},{"t":"Struktura polityk","ok":false,"w":"Struktura polityk określa mandat i zasady działania, nie wiąże działań z rolami."}],"fz":{"h":"Struktury a inne aktywatory","p":"P2","pulapka":false,"n":"EN: Organisational structures – relationships","q":"Jak struktury wiążą się z innymi aktywatorami?","a":"RACI łączy działania procesów ze strukturami i rolami; kultura i zachowanie decydują o skuteczności decyzji; skład powinien odzwierciedlać umiejętności; mandat i zasady działania określa struktura polityk.","ex":"RACI to tabela „kto robi, kto odpowiada, kogo zapytać, kogo powiadomić”. Komisja menu działa, gdy ma właściwych ludzi, dobrą atmosferę i spisany regulamin.","org":""},"cyt":{"s":"75","t":"Tabele RACI umożliwiają powiązanie działań w ramach procesów ze strukturami organizacyjnymi i/lub poszczególnymi rolami w przedsiębiorstwie.","w":"ZGODNE"}},"fz-C-030":{"id":"fz-C-030","typ":"egzamin","s":"EN-02-13","t":"Które stwierdzenie dotyczy ról i struktur organizacyjnych opisanych w COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 76"],"r":null,"zap":"","scen":"","o":[{"t":"Należy wdrożyć je wszystkie w każdej organizacji","ok":false,"w":"Role nie muszą odpowiadać rzeczywistym funkcjom; zestawienie ról (Rysunek 33) ma charakter ilustracyjny (s.76)."},{"t":"Są przykładowe, a ich cele pasują do większości organizacji","ok":true,"w":"Rysunek 33 jest ilustracyjny i nie narzuca uniwersalnego schematu organizacyjnego ani obowiązku utworzenia każdego stanowiska. Cele i odpowiedzialności opisanych ról pozostają jednak przydatne dla większości organizacji (s.76)."},{"t":"Należy wdrożyć je wszystkie w dużych organizacjach","ok":false,"w":"Podręcznik nie ustanawia obowiązku wdrożenia wszystkich ról także dla dużych organizacji. Rysunek 33 ma charakter ilustracyjny i nie definiuje uniwersalnej struktury (s.76)."},{"t":"Są przykładowe, a ich cele rzadko pasują do organizacji","ok":false,"w":"Opis celu ról jest trafny dla większości organizacji."}],"fz":{"h":"Rysunek 33 – role ilustracyjne","p":"P2","pulapka":false,"n":"EN: Figure 33 is illustrative","q":"Czy role z Rysunku 33 trzeba wdrożyć w organizacji?","a":"Nie. Mają charakter ilustracyjny i nie muszą odpowiadać rzeczywistym funkcjom; ich opis celu jest jednak trafny dla większości organizacji.","ex":"To przykładowy schemat stanowisk, jak wzorcowy plan lokalu w poradniku gastronomii: nie musisz mieć każdego stanowiska, ale opisy ich zadań pasują prawie wszędzie.","org":""},"cyt":{"s":"76","t":"Nie muszą one odpowiadać rzeczywistym funkcjom wdrożonym przez przedsiębiorstwa, niemniej są one wartościowe w tym sensie, że opisany cel struktury lub roli zachowuje ważność w przypadku większości przedsiębiorstw.","w":"ZGODNE"}},"fz-C-031":{"id":"fz-C-031","typ":"egzamin","s":"EN-02-13","t":"Kto zwykle przewodniczy komitetowi ds. strategii (wykonawczemu IT)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 76"],"r":null,"zap":"","scen":"","o":[{"t":"CIO","ok":false,"w":"To pułapka: CIO (Chief Information Officer — dyrektor ds. informatyki) doradza, ale zwykle nie przewodniczy komitetowi."},{"t":"CISO","ok":false,"w":"CISO (Chief Information Security Officer — dyrektor ds. bezpieczeństwa informacji) odpowiada za bezpieczeństwo informacji, nie prowadzi tego komitetu."},{"t":"Kierownik PMO","ok":false,"w":"PMO (Programme and Project Management Office — biuro zarządzania programami i projektami) wspiera kierowników programów i projektów."},{"t":"Członek zarządu","ok":true,"w":"W opisie komitetu ds. strategii IT (Information Technology — technologie informatyczne) przewodniczącym jest zazwyczaj członek zarządu, a nie CIO (Chief Information Officer — dyrektor ds. informatyki). Chodzi o angażowanie organu Ładu w kluczowe kwestie i decyzje oraz odpowiedzialność za portfele inwestycji, usług i zasobów (s.76)."}],"fz":{"h":"Komitet ds. strategii (wykonawczy IT)","p":"P2","pulapka":false,"n":"EN: IT strategy committee; Chaired by a board member, not the CIO","q":"Czym jest komitet ds. strategii (wykonawczy IT) i kto mu przewodniczy?","a":"Grupa najwyższych kierowników wyznaczona przez zarząd, by włączać go w kluczowe decyzje IT; rozlicza się z portfeli (zestawów) inwestycji, usług i zasobów IT. Przewodniczy zwykle członek zarządu, nie CIO.","ex":"Jak rada właścicieli sieci restauracji decydująca o drogich inwestycjach. Prowadzi ją ktoś z zarządu, nie szef techniki – żeby nie oceniał sam siebie. Kierownik techniczny siedzi przy stole, ale nie przewodniczy. Zarząd trzyma ster, CIO doradza.","org":""},"cyt":{"s":"76","t":"Przewodniczącym komitetu jest zazwyczaj członek zarządu, nie zaś dyrektor ds. informatyki (CIO).","w":"ZGODNE"}},"fz-C-032":{"id":"fz-C-032","typ":"egzamin","s":"EN-02-13","t":"Czym zajmują się komitety sterujące programów i projektów?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 76"],"r":null,"zap":"","scen":"","o":[{"t":"Wytycznymi co do planów, zasobów, korzyści i ryzyka","ok":true,"w":"Komitety sterujące programów i projektów udzielają wytycznych dotyczących planów, zasobów, korzyści i wartości oraz ryzyka danego programu lub projektu. To inny zakres niż architektura całego przedsiębiorstwa lub wspólne stanowisko w zarządzaniu jego ryzykiem (s.76)."},{"t":"Wytycznymi w sprawach architektury korporacyjnej","ok":false,"w":"Rada ds. Architektury udziela wytycznych dotyczących architektury korporacyjnej oraz tworzy polityki i standardy architektury. Komitety sterujące zajmują się programami i projektami (s.76)."},{"t":"Wspólnym stanowiskiem ws. ryzyka całej organizacji","ok":false,"w":"Komitet ds. zarządzania ryzykiem w przedsiębiorstwie współpracuje i uzgadnia wspólne stanowisko kadry kierowniczej w ERM (Enterprise Risk Management — zarządzanie ryzykiem w przedsiębiorstwie). Może wspierać go rada ds. ryzyka IT (Information Technology — technologie informatyczne), która zajmuje się nim bardziej szczegółowo i doradza komitetowi (s.76)."},{"t":"Planowaniem i realizacją audytów wewnętrznych","ok":false,"w":"To zadanie Audytu."}],"fz":{"h":"Komitety sterujące","p":"P2","pulapka":false,"n":"EN: Steering (programmes/projects) committees","q":"Czym zajmują się komitety sterujące?","a":"Wytycznymi dla programów i projektów: zarządzanie planami i ich monitorowanie, przydział zasobów, dostarczanie korzyści i wartości, ryzyko programów i projektów.","ex":"Jak ekipa nadzorująca remont lokalu: pilnuje planu, przydziela ludzi i pieniądze, sprawdza, czy remont się opłaci, i ostrzega przed wpadkami.","org":""},"cyt":{"s":"76","t":"Grupa interesariuszy i ekspertów odpowiedzialnych za wytyczne w odniesieniu do programów i projektów, w tym dotyczące zarządzania planami i monitorowania ich, przydzielania zasobów, dostarczania korzyści i wartości oraz zarządzania ryzykiem związanym z programami i projektami.","w":"ZGODNE"}},"fz-C-033":{"id":"fz-C-033","typ":"egzamin","s":"EN-02-13","t":"Czym zajmuje się Rada ds. Architektury?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 76"],"r":null,"zap":"","scen":"","o":[{"t":"Prowadzeniem sekretariatu portfela inwestycji i usług","ok":false,"w":"To zadanie VMO."},{"t":"Wytycznymi i standardami architektury korporacyjnej","ok":true,"w":"Rada ds. Architektury udziela wytycznych w sprawach architektury korporacyjnej oraz tworzy polityki i standardy architektury (Rysunek 33, FW-PL s. 76)."},{"t":"Wspieraniem kierowników programów i projektów","ok":false,"w":"To zadanie PMO."},{"t":"Bezpieczeństwem informacji we wszystkich formach","ok":false,"w":"To odpowiedzialność CISO."}],"fz":{"h":"Rada ds. Architektury","p":"P2","pulapka":false,"n":"EN: Architecture board","q":"Czym zajmuje się Rada ds. Architektury?","a":"Wytycznymi w sprawach architektury korporacyjnej (jak systemy firmy do siebie pasują) oraz tworzeniem polityk i standardów architektury.","ex":"Jak główny architekt sieci restauracji: pilnuje, by każda nowa kuchnia miała pasujący do reszty układ i sprzęt, i spisuje standardy.","org":""},"cyt":{"s":"76","t":"Grupa interesariuszy i ekspertów odpowiedzialna za wytyczne odnoszące się do kwestii i decyzji dotyczących architektury korporacyjnej oraz za opracowywanie polityk i standardów w zakresie architektury.","w":"ZGODNE"}},"fz-C-034":{"id":"fz-C-034","typ":"egzamin","s":"EN-02-13","t":"Czym zajmuje się komitet ds. zarządzania ryzykiem w organizacji (ERM)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 76"],"r":null,"zap":"","scen":"","o":[{"t":"Ryzykiem poszczególnych programów i projektów","ok":false,"w":"Ryzykiem programów i projektów zajmują się komitety sterujące."},{"t":"Wytycznymi zgodności z wymogami prawnymi i umownymi","ok":false,"w":"To zadanie funkcji Zgodność."},{"t":"Zarządzaniem finansami i rzetelną rachunkowością","ok":false,"w":"To odpowiedzialność CFO."},{"t":"Wspólnym stanowiskiem kierownictwa wobec ryzyka","ok":true,"w":"Komitet uzgadnia wspólne stanowisko kadry kierowniczej w zarządzaniu ryzykiem całej organizacji (ERM); może mieć pod sobą radę ds. ryzyka IT (Rysunek 33, FW-PL s. 76)."}],"fz":{"h":"Komitet ds. zarządzania ryzykiem w przedsiębiorstwie","p":"P2","pulapka":false,"n":"EN: Enterprise risk committee","q":"Czym zajmuje się komitet ds. zarządzania ryzykiem w przedsiębiorstwie?","a":"Współpracą i uzgadnianiem wspólnego stanowiska kadry kierowniczej, potrzebnego do działań i decyzji w zarządzaniu ryzykiem całego przedsiębiorstwa (ERM); może mieć pod sobą radę ds. ryzyka IT.","ex":"Narada kierowników o zagrożeniach całej firmy: pożar, zatrucie, utrata dostawcy. Uzgadniają wspólne stanowisko; awariami systemów może zająć się osobna, mniejsza rada.","org":""},"cyt":{"s":"76","t":"Grupa członków kadry kierowniczej odpowiedzialna za współpracę i uzgadnianie wspólnego stanowiska na poziomie przedsiębiorstwa, wymaganych w celu wspierania działań i decyzji w zakresie zarządzania ryzykiem przedsiębiorstwa (ERM).","w":"ZGODNE"}},"fz-C-035":{"id":"fz-C-035","typ":"egzamin","s":"EN-02-13","t":"Które przypisanie zadań do PMO i VMO jest zgodne z COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 77"],"r":null,"zap":"","scen":"","o":[{"t":"VMO – sekretariat portfela inwestycji i usług, ocena szans i uzasadnień biznesowych","ok":true,"w":"VMO (Value Management Office — biuro zarządzania wartością) działa jako sekretariat zarządzania portfelem inwestycji i usług: ocenia szanse i uzasadnienia biznesowe, doradza oraz raportuje utrzymanie i tworzenie wartości. PMO (Programme and Project Management Office — biuro zarządzania programami i projektami) wspiera kierowników i raportuje przebieg programów oraz projektów (s.77)."},{"t":"PMO – ocena uzasadnień biznesowych i raportowanie tworzenia wartości","ok":false,"w":"To zadania VMO (Value Management Office — biuro zarządzania wartością), nie PMO (Programme and Project Management Office — biuro zarządzania programami i projektami)."},{"t":"VMO – wsparcie kierowników programów i projektów","ok":false,"w":"To zadanie PMO (Programme and Project Management Office — biuro zarządzania programami i projektami)."},{"t":"PMO – tworzenie polityk i standardów architektury","ok":false,"w":"To zadanie Rady ds. Architektury."}],"fz":{"h":"PMO i VMO","p":"P2","pulapka":false,"n":"EN: Project and programme management office; value management office","q":"Czym zajmują się PMO i VMO?","a":"PMO (biuro projektów): wspiera kierowników programów i projektów; zbiera, ocenia i raportuje informacje o ich przebiegu. VMO (biuro wartości): sekretariat portfela inwestycji i usług – ocenia szanse i uzasadnienia biznesowe, raportuje tworzenie wartości.","ex":"PMO to biuro, które pilnuje wszystkich remontów naraz i raportuje postępy. VMO liczy, czy nowy lokal się opłaci. P jak projekty, V jak value, czyli wartość.","org":""},"cyt":{"s":"77","t":"Funkcja działająca jako sekretariat ds. zarządzania portfelem inwestycji i portfelem usług, z uwzględnieniem szacowania i doradztwa w odniesieniu do szans inwestycyjnych oraz uzasadnień biznesowych","w":"ZGODNE"}},"fz-C-036":{"id":"fz-C-036","typ":"egzamin","s":"EN-02-13","t":"Za co odpowiada właściciel procesu biznesowego?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 76"],"r":null,"zap":"","scen":"","o":[{"t":"Za planowanie i prowadzenie audytów wewnętrznych","ok":false,"w":"To zadanie Audytu."},{"t":"Za wytyczne zgodności z wymogami prawnymi","ok":false,"w":"To zadanie funkcji Zgodność."},{"t":"Za cele, doskonalenie i zatwierdzanie zmian","ok":true,"w":"Właściciel procesu biznesowego odpowiada za osiąganie celów procesu, jego doskonalenie i zatwierdzanie zmian. Nie jest to ogólna rola funkcji audytu, zgodności ani dyrektora informatyki (s.76)."},{"t":"Za dopasowanie strategii IT do strategii biznesowej","ok":false,"w":"To odpowiedzialność CIO (Chief Information Officer — dyrektor ds. informatyki)."}],"fz":{"h":"Audyt, Zgodność, właściciel procesu biznesowego","p":"P2","pulapka":false,"n":"EN: Audit, compliance, business process owner","q":"Za co odpowiadają Audyt, Zgodność i właściciel procesu biznesowego?","a":"Audyt: audyty wewnętrzne. Zgodność: wytyczne zgodności z wymogami prawnymi, regulacyjnymi i umownymi. Właściciel procesu biznesowego: osiąganie celów procesu, jego doskonalenie i zatwierdzanie zmian.","ex":"Audyt to wewnętrzny inspektor, który sprawdza kuchnię. Zgodność pilnuje przepisów sanepidu i umów. Właściciel procesu „ma” dany przepis: ulepsza go i zatwierdza zmiany.","org":""},"cyt":{"s":"76","t":"Osoba odpowiedzialna za sprawność procesu przez realizację jego celów, dążenie do doskonalenia procesu oraz zatwierdzanie zmian dotyczących procesu.","w":"ZGODNE"}},"fz-C-038":{"id":"fz-C-038","typ":"egzamin","s":"EN-02-13","t":"Za co odpowiada CRO?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 76"],"r":null,"zap":"","scen":"","o":[{"t":"Za wszystkie aspekty zarządzania ryzykiem w organizacji","ok":true,"w":"CRO (Chief Risk Officer — dyrektor ds. ryzyka) obejmuje wszystkie aspekty zarządzania ryzykiem przedsiębiorstwa. CFO (Chief Financial Officer — dyrektor ds. finansowych) skupia się na finansach i ryzyku finansowym, a CISO (Chief Information Security Officer — dyrektor ds. bezpieczeństwa informacji) na bezpieczeństwie informacji we wszystkich formach (s.76)."},{"t":"Za ryzyko finansowe, kontrole i rzetelną rachunkowość","ok":false,"w":"To odpowiedzialność CFO (Chief Financial Officer — dyrektor ds. finansowych)."},{"t":"Za bezpieczeństwo informacji we wszystkich formach","ok":false,"w":"To odpowiedzialność CISO (Chief Information Security Officer — dyrektor ds. bezpieczeństwa informacji)."},{"t":"Za funkcjonowanie organizacji","ok":false,"w":"To odpowiedzialność COO (Chief Operating Officer — dyrektor operacyjny)."}],"fz":{"h":"CFO, CRO, CISO","p":"P2","pulapka":false,"n":"EN: CFO, CRO, CISO","q":"Za co odpowiadają CFO, CRO i CISO?","a":"CFO: zarządzanie finansami, ryzyko finansowe i kontrole, rzetelna rachunkowość. CRO: wszystkie aspekty zarządzania ryzykiem w organizacji. CISO: bezpieczeństwo informacji we wszystkich formach.","ex":"CFO – kasa i księgowość (F jak finanse). CRO – wszystkie zagrożenia (R jak ryzyko). CISO – ochrona informacji w każdej postaci, także na papierze (S jak security).","org":""},"cyt":{"s":"76","t":"Menedżer najwyższego szczebla odpowiedzialny w odniesieniu do wszystkich aspektów zarządzania ryzykiem w ramach całego przedsiębiorstwa.","w":"ZGODNE"}},"fz-C-039":{"id":"fz-C-039","typ":"egzamin","s":"EN-02-15","t":"Jak COBIT 5 definiuje kulturę?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 91"],"r":null,"zap":"","scen":"","o":[{"t":"Jako ogólne zamierzenia formalnie spisane przez kierownictwo","ok":false,"w":"To definicja polityki."},{"t":"Jako wzorzec zachowań, poglądów, założeń, postaw i sposobów działania","ok":true,"w":"Słownik definiuje kulturę jako wzorzec zachowań, poglądów, założeń, postaw i sposobów działania. Nie ogranicza jej do formalnej polityki ani indywidualnych wartości jednego pracownika (s.91)."},{"t":"Jako wartości osobiste wynikające z religii i pochodzenia","ok":false,"w":"To opis etyki indywidualnej."},{"t":"Jako wartości i podstawowe przekonania organizacji","ok":false,"w":"To definicja zasady."}],"fz":{"h":"Definicja kultury","p":"P2","pulapka":false,"n":"EN: Culture","q":"Jak COBIT 5 definiuje kulturę?","a":"Wzorzec zachowań, poglądów, założeń, postaw i sposobów działania.","ex":"Kultura to „jak się u nas robi”: czy w kuchni pomaga się nowym i sprząta po sobie. Pięć słów: zachowania, poglądy, założenia, postawy, sposoby działania.","org":""},"cyt":{"s":"91","t":"Kultura Wzorzec zachowań, poglądów, założeń, postaw i sposobów działania.","w":"ZGODNE"}},"fz-C-040":{"id":"fz-C-040","typ":"egzamin","s":"EN-02-15","t":"Na jakich poziomach określa się cele aktywatora Kultura, etyka i zachowanie?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 79"],"r":null,"zap":"","scen":"","o":[{"t":"Zasady działania, zakres kontroli, procedury eskalacji","ok":false,"w":"To dobre praktyki Aktywatora Struktury organizacyjne, a nie poziomy celów kultury, etyki i zachowania (FW-PL s. 75)."},{"t":"Wytwórca informacji, opiekun informacji, konsument informacji","ok":false,"w":"To role interesariuszy informacji."},{"t":"Etyka organizacyjna, etyka indywidualna, zachowania indywidualne","ok":true,"w":"Cele tego Aktywatora dotyczą etyki organizacji (wartości organizacji), etyki indywidualnej (wartości osobiste pracownika) i indywidualnych wzorców zachowań, które łącznie określają kulturę organizacji (FW-PL s. 79)."},{"t":"Zasady organizacyjne, polityki, struktury ramowe","ok":false,"w":"To elementy innego aktywatora."}],"fz":{"h":"Poziomy celów kultury, etyki i zachowania","p":"P2","pulapka":false,"n":"EN: Organisational ethics, individual ethics, individual behaviour","q":"Na jakich poziomach określa się cele tego aktywatora?","a":"Etyka organizacyjna (wartości organizacji), etyka indywidualna (wartości osobiste) i zachowania indywidualne – to te indywidualne wzorce zachowań łącznie określają kulturę organizacji.","ex":"Trzy piętra: wartości restauracji („tylko świeże produkty”), wartości kucharza (uczciwość wyniesiona z domu) i to, co każdy faktycznie robi przy garach. Dopiero suma codziennych zachowań wszystkich daje atmosferę lokalu.","org":""},"cyt":{"s":"79","t":"indywidualnych wzorców zachowań, które łącznie określają kulturę przedsiębiorstwa.","w":"ZGODNE","u":"Ostatni z trzech punktów listy celów; wcześniejsze: etyka organizacji i etyka indywidualna (ta sama strona)."}},"fz-C-041":{"id":"fz-C-041","typ":"egzamin","s":"EN-02-15","t":"Na czym opiera się etyka indywidualna?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 79"],"r":null,"zap":"","scen":"","o":[{"t":"Na osobistych wartościach pracownika","ok":true,"w":"Etyka indywidualna jest oparta na osobistych wartościach pracownika i w znacznym stopniu zależy m.in. od religii, pochodzenia, statusu społeczno-ekonomicznego, regionu i doświadczeń. Nie oznacza to braku wpływu organizacji (s.79)."},{"t":"Na wartościach zapisanych w kodeksie organizacji","ok":false,"w":"Wartości, na których ma opierać się funkcjonowanie organizacji, określają przede wszystkim etykę organizacyjną. Mogą wpływać na ludzi, lecz nie są pełną definicją ich etyki indywidualnej (s.79)."},{"t":"Na systemie nagród i kar w organizacji","ok":false,"w":"Nagrody, zachęty i środki zniechęcające to dobre praktyki kształtowania zachowań. Nie zastępują osobistych źródeł etyki indywidualnej (s.79–80)."},{"t":"Na mandacie struktury organizacyjnej","ok":false,"w":"Mandat wyjaśnia powód i cel istnienia struktury organizacyjnej. Nie definiuje wartości osobistych pracownika (s.75,79)."}],"fz":{"h":"Etyka indywidualna","p":"P2","pulapka":false,"n":"EN: Individual ethics","q":"Od czego zależy etyka indywidualna?","a":"W dużej mierze od czynników zewnętrznych: religii, pochodzenia, statusu społeczno-ekonomicznego, regionu i doświadczeń osobistych.","ex":"Każdy kucharz przynosi wartości z zewnątrz: wiarę, wychowanie, zamożność rodziny, miejsce, z którego pochodzi, i to, co przeżył. Firma ich nie wymyśla.","org":""},"cyt":{"s":"79","t":"etyki indywidualnej determinowanej osobistymi wartościami każdego z pracowników przedsiębiorstwa i uzależnionej — w znacznym stopniu — od czynników zewnętrznych","w":"ZGODNE"}},"fz-C-043":{"id":"fz-C-043","typ":"egzamin","s":"EN-02-14","t":"Który z poniższych NIE jest dobrą praktyką kształtowania pożądanych zachowań?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 80"],"r":null,"zap":"","scen":"","o":[{"t":"Zachęty i nagrody","ok":false,"w":"To dobra praktyka kształtowania zachowań."},{"t":"Delegowanie uprawnień","ok":true,"w":"To dobra praktyka struktur organizacyjnych, nie kształtowania zachowań."},{"t":"Przykład kierownictwa i czempionów","ok":false,"w":"To dobra praktyka kształtowania zachowań (świadomość)."},{"t":"Egzekwowanie wymagań","ok":false,"w":"To dobra praktyka kształtowania zachowań."}],"fz":{"h":"Dobre praktyki kształtowania zachowań","p":"P2","pulapka":false,"n":"EN: Communication, enforcement, incentives and rewards, awareness, rules and norms, champions","q":"Jakie są dobre praktyki kształtowania pożądanych zachowań?","a":"Komunikowanie zachowań i wartości; świadomość przez przykład kierownictwa i czempionów (podr. osoby wspierające, czyli wzory do naśladowania); zachęty i nagrody oraz środki zniechęcające do zachowań niepożądanych; reguły i normy; egzekwowanie wymagań.","ex":"Szef sam myje ręce przed gotowaniem, nagradza porządek, wiesza zasady na ścianie i reaguje, gdy ktoś je łamie. Mówić, pokazywać, nagradzać, pilnować.","org":""},"cyt":{"s":"79","t":"Praktyki: – Komunikowanie – Egzekwowanie wymagań – Zachęty i nagrody – Świadomość – Reguły i normy – Osoby wspierające","w":"ZGODNE","u":"Tekst z Ilustracji 34; przekazywanie uprawnień to praktyka struktur (s.75)."}},"fz-C-044":{"id":"fz-C-044","typ":"egzamin","s":"EN-02-16","t":"Które stwierdzenie opisuje związek kultury z innymi aktywatorami?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 80"],"r":null,"zap":"","scen":"","o":[{"t":"Decyzje struktur wdraża się niezależnie od zachęt","ok":false,"w":"Zachęty, intencje i kultura wpływają na wdrażanie decyzji struktur. Podręcznik wymienia brak zachęt jako jedną z możliwych przeszkód, nie twierdzi, że bez osobnej zachęty żadna decyzja nie zostanie wykonana (s.80)."},{"t":"Zasady i polityki nie mają związku z wartościami","ok":false,"w":"Zasady i polityki komunikują wartości i pożądane zachowania."},{"t":"Dobry proces nie działa, gdy ludzie go nie stosują","ok":true,"w":"Poprawny projekt procesu nie wystarczy, jeśli interesariusze nie realizują działań we właściwy sposób. Kultura, etyka i zachowanie wpływają więc na wyniki procesów i skuteczność decyzji struktur (s.80)."},{"t":"Kultura wpływa tylko na aktywatory będące zasobami","ok":false,"w":"Kultura wpływa też na procesy, struktury i polityki."}],"fz":{"h":"Kultura a inne aktywatory","p":"P2","pulapka":false,"n":"EN: Culture – relationships","q":"Jak kultura wiąże się z innymi aktywatorami?","a":"Nawet dobrze zaprojektowany proces nie da oczekiwanych wyników, jeśli ludzie nie realizują działań prawidłowo. Skuteczność struktur zależy od wdrażania ich decyzji; przeszkodami mogą być m.in. rozbieżne intencje i niewłaściwe zachęty. Zasady i polityki komunikują wartości oraz pożądane zachowania.","ex":"Najlepszy przepis nie uratuje dania, jeśli kucharzowi się nie chce. Decyzja szefa bez zachęty i przekonania zespołu łatwo zostaje na kartce.","org":""},"cyt":{"s":"80","t":"Procesy mogą zostać zaprojektowane w sposób doskonały, ale jeśli interesariusze procesu nie zechcą zrealizować działań w ramach procesu we właściwy sposób","w":"ZGODNE","u":"Zdanie kończy się: „wyniki procesu nie zostaną uzyskane”."}},"fz-C-045":{"id":"fz-C-045","typ":"egzamin","s":"EN-02-18","t":"Jaka jest kolejność elementów cyklu informacji?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 81"],"r":null,"zap":"","scen":"","o":[{"t":"Procesy biznesowe, dane, informacje, wiedza, wartość","ok":true,"w":"Wartość z kolei ukierunkowuje procesy biznesowe (cykl informacji, Rysunek 35)."},{"t":"Dane, informacje, wiedza, mądrość, wartość","ok":false,"w":"Mądrości nie ma w cyklu, a brakuje procesów biznesowych."},{"t":"Planowanie, budowanie, użytkowanie, ocena, aktualizacja","ok":false,"w":"To skrócony opis cyklu życia informacji, nie cyklu informacji."},{"t":"Dane, procesy biznesowe, wiedza, informacje, wartość","ok":false,"w":"Kolejność jest zła: z danych powstają informacje, a z nich wiedza."}],"fz":{"h":"Cykl informacji (Rysunek 35)","p":"P1","pulapka":true,"n":"EN: Information cycle: business processes → data → information → knowledge → value","q":"Czym jest cykl informacji (Rysunek 35)?","a":"Pięć elementów w kole: procesy biznesowe → dane → informacje → wiedza → wartość; wartość z kolei ukierunkowuje procesy biznesowe. Nie myl z cyklem życia informacji (6 grup etapów).","ex":"Kelner zapisuje zamówienia (dane), szef widzi, co się sprzedaje (informacja), rozumie, że goście lubią zupy (wiedza), i zmienia menu, zarabiając więcej (wartość).","org":""},"cyt":{"s":"81","t":"W cyklu informacji (ilustracja 35) procesy biznesowe generują i przetwarzają dane, przekształcając je w informacje i wiedzę, a na koniec generując wartość dla przedsiębiorstwa.","w":"ZGODNE"}},"fz-C-046":{"id":"fz-C-046","typ":"egzamin","s":"EN-02-18","t":"Która faza cyklu życia informacji obejmuje przechowywanie, udostępnianie i wykorzystanie?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 82"],"r":null,"zap":"","scen":"","o":[{"t":"Budowanie/nabywanie","ok":false,"w":"To faza poprzedzająca użytkowanie."},{"t":"Użytkowanie/obsługa","ok":true,"w":"Przechowywanie, udostępnianie i wykorzystanie są podetapami użytkowania/obsługi informacji. Ocena/monitorowanie i aktualizacja/pozbywanie się to odrębne grupy cyklu życia (s.82–83)."},{"t":"Ocena/monitorowanie","ok":false,"w":"To faza następująca po użytkowaniu."},{"t":"Aktualizacja/pozbywanie się","ok":false,"w":"To ostatnia faza cyklu życia."}],"fz":{"h":"Cykl życia informacji","p":"P1","pulapka":true,"n":"EN: Information life cycle","q":"Podaj fazy cyklu życia informacji.","a":"Planowanie → Projektowanie → Budowanie/nabywanie → Użytkowanie/obsługa (przechowywanie, udostępnianie, wykorzystanie) → Ocena/monitorowanie → Aktualizacja/pozbywanie się.","ex":"Jak z kartą dań: planujesz ją, projektujesz, drukujesz, kładziesz na stoły, sprawdzasz, czy goście ją rozumieją, a potem poprawiasz albo wyrzucasz.","org":""},"cyt":{"s":"82","t":"Użytkowanie/obsługa, które obejmują:","w":"ZGODNE","u":"Podfazy: Przechowywanie (s.82), Udostępnianie i Wykorzystanie (s.83)."}},"fz-C-047":{"id":"fz-C-047","typ":"egzamin","s":"EN-02-18","t":"Jakie ogólne role interesariuszy informacji wyróżnia COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 82"],"r":null,"zap":"","scen":"","o":[{"t":"Wykonawca, odpowiedzialny decyzyjnie, konsultant, informowany","ok":false,"w":"To role w tabeli RACI (Responsible, Accountable, Consulted, Informed — odpowiedzialny wykonawczo, odpowiedzialny decyzyjnie, konsultowany, informowany)."},{"t":"Etyka organizacyjna, etyka indywidualna, zachowanie","ok":false,"w":"To poziomy celów aktywatora Kultura, etyka i zachowanie."},{"t":"Wytwórca, opiekun, konsument","ok":true,"w":"Role zależą od fazy cyklu życia informacji."},{"t":"Właściciel procesu, audytor, regulator","ok":false,"w":"Właściciel procesu, audytor lub regulator mogą być interesariuszami, lecz nie są przytoczonym ogólnym podziałem ról informacji. COBIT 5 wskazuje wytwórcę, opiekuna i konsumenta; dopuszcza też role bardziej szczegółowe (s.82)."}],"fz":{"h":"Role interesariuszy informacji","p":"P2","pulapka":false,"n":"EN: Information producer, custodian, consumer","q":"Jakie ogólne role interesariuszy informacji wyróżnia COBIT 5?","a":"Wytwórca (tworzy informacje), opiekun (przechowuje i utrzymuje), konsument (korzysta z informacji). Role zależą od fazy cyklu życia.","ex":"Zamówienie: kelner je zapisuje (wytwórca), kierownik przechowuje bloczki (opiekun), kucharz z nich gotuje (konsument). Pisze, trzyma, korzysta.","org":""},"cyt":{"s":"82","t":"po role bardziej ogólne (np. wytwórcy informacji, opiekunowie informacji i konsumenci informacji)","w":"ZGODNE"}},"fz-C-048":{"id":"fz-C-048","typ":"egzamin","s":"EN-02-17","t":"Do której kategorii jakości informacji COBIT 5 należy wiarygodność?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 82"],"r":null,"zap":"","scen":"","o":[{"t":"Do jakości kontekstowej","ok":false,"w":"Kontekstowa to np. istotność, kompletność, aktualność."},{"t":"Do jakości reprezentacji","ok":false,"w":"Reprezentacja to np. zwięzłe i spójne przedstawienie."},{"t":"Do jakości bezpieczeństwa/dostępności","ok":false,"w":"Ta kategoria to dostępność i ograniczony dostęp."},{"t":"Do jakości wewnętrznej (podr. rzeczywistej)","ok":true,"w":"Razem z dokładnością, obiektywnością i reputacją (DOWR)."}],"fz":{"h":"Jakość wewnętrzna informacji","p":"P1","pulapka":true,"n":"EN: Intrinsic quality: accuracy, objectivity, believability, reputation; Believability = intrinsic","q":"Co obejmuje jakość wewnętrzna informacji (podr. rzeczywista)? Wiarygodność informacji – do której kategorii jakości COBIT 5 należy?","a":"Dokładność, obiektywność, wiarygodność, reputację – zgodność wartości danych z prawdą. Wiarygodność należy do jakości wewnętrznej (rzeczywistej), razem z dokładnością, obiektywnością i reputacją.","ex":"Czy zapis na bloczku jest prawdziwy: dokładny, bez zmyślania, godny wiary i od kelnera z dobrą opinią. Haczyk DOWR: Dokładność, Obiektywność, Wiarygodność, Reputacja. Wiarygodność to cecha samej informacji – czy można jej wierzyć, niezależnie od sytuacji.","org":""},"cyt":{"s":"82","t":"wiarygodność — stopień, w jakim informacje uważa się za prawdziwe i godne zaufania;","w":"ZGODNE","u":"Punkt listy pod „Jakość rzeczywista” (= wewnętrzna), obok dokładności, obiektywności i reputacji."}},"fz-C-049":{"id":"fz-C-049","typ":"egzamin","s":"EN-02-17","t":"Która cecha należy do wspólnej kategorii jakości kontekstowej i reprezentacji informacji?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 82"],"r":null,"zap":"","scen":"","o":[{"t":"Dokładność","ok":false,"w":"Dokładność należy do jakości wewnętrznej."},{"t":"Obiektywność","ok":false,"w":"Obiektywność należy do jakości wewnętrznej."},{"t":"Ograniczony dostęp","ok":false,"w":"To jakość bezpieczeństwa/dostępności."},{"t":"Kompletność","ok":true,"w":"Kompletność jest wymieniona we wspólnym podwymiarze jakości kontekstowej i reprezentacji. Oznacza właściwy zakres i szczegółowość bez braków istotnych dla zadania użytkownika (s.82)."}],"fz":{"h":"Jakość kontekstowa i reprezentacji","p":"P1","pulapka":false,"n":"EN: Contextual and representational quality","q":"Co obejmuje jakość kontekstowa i jakość reprezentacji informacji?","a":"Istotność, kompletność, aktualność, odpowiednia ilość, zwięzłe przedstawienie, spójne przedstawienie, możliwość interpretacji, jasność przekazu (zrozumiałość), łatwość posługiwania się.","ex":"Kontekstowa: czy informacja pasuje do potrzeby (na temat, pełna, świeża, w sam raz). Reprezentacji: czy podano ją czytelnie, jak dobrze napisana karta dań.","org":""},"cyt":{"s":"82","t":"kompletność — stopień, w jakim żadnych informacji nie brakuje oraz informacje mają właściwy zakres i stopień szczegółowości dla wykonywanego zadania;","w":"ZGODNE","u":"Punkt listy pod „Jakość zgodności z kontekstem i jakość reprezentacji”."}},"fz-C-050":{"id":"fz-C-050","typ":"egzamin","s":"EN-02-17","t":"Co obejmuje jakość bezpieczeństwa/dostępności informacji?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 82"],"r":null,"zap":"","scen":"","o":[{"t":"Dostępność/terminowość i ograniczony dostęp","ok":true,"w":"Informacja ma być dostępna, gdy trzeba, ale tylko dla upoważnionych."},{"t":"Dokładność, obiektywność, wiarygodność i reputacja","ok":false,"w":"To kryteria jakości wewnętrznej."},{"t":"Istotność, kompletność i aktualność","ok":false,"w":"To kryteria jakości kontekstowej."},{"t":"Zwięzłość, spójność i interpretowalność","ok":false,"w":"To kryteria jakości kontekstowej i reprezentacji."}],"fz":{"h":"Jakość bezpieczeństwa/dostępności","p":"P1","pulapka":false,"n":"EN: Security/accessibility quality: availability, restricted access","q":"Co obejmuje jakość bezpieczeństwa/dostępności informacji?","a":"Dostępność/terminowość (informacja dostępna, gdy potrzeba) oraz ograniczony dostęp (tylko dla upoważnionych).","ex":"Zeszyt z przepisami szefa: ma być pod ręką, gdy kucharz go potrzebuje, ale zamknięty przed konkurencją. Dostępny dla swoich, niedostępny dla obcych.","org":""},"cyt":{"s":"82","t":"Jakość bezpieczeństwa/dostępności — stopień, w jakim informacje są dostępne lub możliwe do uzyskania.","w":"ZGODNE","u":"Obejmuje: dostępność/terminowość oraz ograniczony dostęp (ta sama strona)."}},"fz-C-051":{"id":"fz-C-051","typ":"egzamin","s":"EN-02-17","t":"Które z poniższych NIE należy do siedmiu kryteriów informacji z COBIT 4.1?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 63"],"r":null,"zap":"","scen":"","o":[{"t":"Integralność","ok":false,"w":"To jedno z siedmiu kryteriów COBIT 4.1."},{"t":"Zgodność","ok":false,"w":"To jedno z siedmiu kryteriów COBIT 4.1."},{"t":"Reputacja","ok":true,"w":"Reputacja to cel jakości wewnętrznej w COBIT 5, nie kryterium COBIT 4.1."},{"t":"Wiarygodność","ok":false,"w":"To jedno z siedmiu kryteriów COBIT 4.1."}],"fz":{"h":"Siedem kryteriów informacji COBIT 4.1","p":"P2","pulapka":true,"n":"EN: COBIT 4.1 information criteria","q":"Podaj siedem kryteriów informacji z COBIT 4.1.","a":"Skuteczność, wydajność, poufność, integralność, dostępność, zgodność, wiarygodność.","ex":"Weź znane z bezpieczeństwa trio PID (Poufność, Integralność, Dostępność), dołóż z przodu SW (Skuteczność, Wydajność), a na końcu ZW (Zgodność, Wiarygodność).","org":""},"cyt":{"s":"63","t":"siedmioma kryteriami informacji w metodyce COBIT 4.1 (skuteczność, wydajność, integralność, wiarygodność, dostępność, poufność, zgodność)","w":"ZGODNE"}},"fz-C-053":{"id":"fz-C-053","typ":"egzamin","s":"EN-02-17","t":"Na co w COBIT 5 rozkłada się kryterium integralności z COBIT 4.1?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 63","FW-PL s. 82"],"r":null,"zap":"","scen":"","o":[{"t":"Na ograniczony dostęp","ok":false,"w":"Na ograniczony dostęp przeszła poufność."},{"t":"Na wiarygodność, reputację i obiektywność","ok":false,"w":"Na te trzy cechy rozpisano wiarygodność."},{"t":"Na cele kompletności i dokładności","ok":true,"w":"Integralność to kryterium COBIT 4.1, w COBIT 5 rozkłada się na te dwa cele."},{"t":"Na dostępność/terminowość","ok":false,"w":"To odpowiednik kryterium dostępności."}],"fz":{"h":"Kryteria COBIT 4.1 w COBIT 5","p":"P2","pulapka":true,"n":"EN: Mapping COBIT 4.1 criteria to COBIT 5 quality goals; Integrity → completeness, accuracy","q":"Jak kryteria COBIT 4.1 odwzorowano w COBIT 5? Integralność – kategoria jakości COBIT 5 czy kryterium COBIT 4.1?","a":"Integralność → kompletność i dokładność; poufność → ograniczony dostęp; dostępność → dostępność; zgodność → ujęta w każdym celu jakości; wiarygodność → wiarygodność, reputacja, obiektywność. Integralność to kryterium COBIT 4.1; w COBIT 5 rozkłada się na cele kompletności i dokładności.","ex":"Stare słowa rozpisano na nowe: „integralność” to teraz „kompletna i dokładna”, „poufność” – „ograniczony dostęp”, a „wiarygodność” rozbito na trzy cechy. W COBIT 5 pytasz: czy rachunek jest kompletny (wszystkie pozycje) i dokładny (dobre ceny)?","org":""},"cyt":{"s":"63","t":"Integralność informacji oznacza, że są one wolne od błędów i kompletne. Odnosi się do następujących celów jakościowych dotyczących informacji: kompletność, dokładność.","w":"ZGODNE"}},"fz-C-054":{"id":"fz-C-054","typ":"egzamin","s":"EN-02-08","t":"Jak mają się kategorie celów procesu do kategorii celów aktywatora?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 69"],"r":null,"zap":"","scen":"","o":[{"t":"Są identyczne, łącznie z nazwami kategorii","ok":false,"w":"Logika jest ta sama, ale nazwy kategorii procesu są inne."},{"t":"Proces ma cele wiodące i cele opóźnione","ok":false,"w":"To rodzaje wskaźników, nie kategorie celów procesu."},{"t":"Proces ma cele organizacji, IT i aktywatorów","ok":false,"w":"To poziomy kaskady celów."},{"t":"Logika jest ta sama, ale nazwy są inne","ok":true,"w":"Aktywator: Jakość wewnętrzna, Jakość kontekstowa, Dostęp i bezpieczeństwo; proces: Cele wewnętrzne, Cele kontekstowe, Cele dostępności i bezpieczeństwa."}],"fz":{"h":"Kategorie celów procesu a aktywatora","p":"P2","pulapka":true,"n":"EN: Enabler goal categories vs process goal categories","q":"Kategorie celów procesu a kategorie celów aktywatora – czy to to samo?","a":"Ta sama logika, inne nazwy. Aktywator ogólnie: Jakość wewnętrzna, Jakość kontekstowa, Dostęp i Bezpieczeństwo. Proces: Cele wewnętrzne, Cele kontekstowe, Cele dostępności i bezpieczeństwa.","ex":"Te same trzy szuflady pod innymi etykietami: jakość samej rzeczy, przydatność w danej sytuacji, dostęp i ochrona. Aktywator mówi „Jakość…”, proces mówi „Cele…”.","org":""},"cyt":{"s":"69","t":"Cele wewnętrzne — czy proces ma jakość rzeczywistą?","w":"ZGODNE","u":"Podręcznik: „Cele dotyczące zgodności z kontekstem” (nie „Cele kontekstowe”) i „Cele dotyczące dostępności i bezpieczeństwa”; kategorie czynnika na s.29."}},"fz-C-056":{"id":"fz-C-056","typ":"egzamin","s":"EN-02-21","t":"Czym jest zdolność usługowa?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 85"],"r":null,"zap":"","scen":"","o":[{"t":"Poziomem usług uzgodnionym z dostawcą","ok":false,"w":"Poziomy usług to osobna dobra praktyka."},{"t":"Zasobami wykorzystywanymi do świadczenia usług IT","ok":true,"w":"Zdolność usługowa (w podręczniku: zdolność do świadczenia usług) oznacza zasoby, np. aplikacje i infrastrukturę, wykorzystywane do świadczenia usług związanych z informatyką. Nie jest samym uzgodnionym poziomem usługi ani indywidualną umiejętnością pracownika (s.85)."},{"t":"Umiejętnościami personelu Service Desk","ok":false,"w":"To aktywator Ludzie, umiejętności i kompetencje."},{"t":"Kolejnymi etapami dojścia do architektury docelowej","ok":false,"w":"To architektura przejściowa."}],"fz":{"h":"Zdolność usługowa","p":"P2","pulapka":false,"n":"EN: Service capabilities","q":"Czym jest zdolność usługowa?","a":"Zasobami, takimi jak aplikacje i infrastruktura, wykorzystywanymi do świadczenia usług związanych z IT. Podr.: zdolność do świadczenia usług.","ex":"To sprzęt i programy, którymi restauracja obsługuje gości: kasa, system rezerwacji, kuchenka. Czyli czym dysponujesz, żeby móc świadczyć usługę.","org":""},"cyt":{"s":"85","t":"Zdolność do świadczenia usług odnosi się do zasobów takich jak aplikacje oraz infrastruktura, które wykorzystuje się do świadczenia usług związanych z IT.","w":"ZGODNE"}},"fz-C-057":{"id":"fz-C-057","typ":"egzamin","s":"EN-02-20","t":"Co opisuje architektura referencyjna (ang. baseline)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 85"],"r":null,"zap":"","scen":"","o":[{"t":"Przyszłą, planowaną zdolność usługową","ok":false,"w":"Przyszłą zdolność opisuje architektura docelowa."},{"t":"Etapy pośrednie dojścia do celu","ok":false,"w":"Etapy pośrednie opisuje architektura przejściowa."},{"t":"Model referencyjny procesów COBIT 5","ok":false,"w":"To inne pojęcie: architektura referencyjna (bazowa, ang. baseline) to nie model referencyjny procesu (FW-PL s. 85)."},{"t":"Obecną zdolność usługową organizacji","ok":true,"w":"Architektura referencyjna (bazowa) opisuje bieżącą zdolność usługową, czyli stan obecny; polski podręcznik nazywa baseline architekturą referencyjną."}],"fz":{"h":"Architektura docelowa, referencyjna, przejściowa","p":"P2","pulapka":true,"n":"EN: Target, baseline (reference), transition architecture; Reference (baseline) = current","q":"Czym różnią się architektura docelowa, referencyjna i przejściowa? Architektura referencyjna – stan obecny czy docelowy?","a":"Docelowa: przyszła, planowana zdolność usługowa. Referencyjna (EN baseline, bazowa): obecna zdolność dostarczająca bieżących usług – nie mylić z modelem referencyjnym. Przejściowa: kolejne etapy dojścia od bazowej do docelowej. Polski podręcznik nazywa referencyjną architekturę bazową (EN baseline), czyli bieżącą zdolność usługową.","ex":"Remont kuchni: jak jest dziś (referencyjna), jak ma być po remoncie (docelowa) i etapy po drodze (przejściowa). Dziś – po drodze – jutro. Referencyjna to punkt odniesienia, czyli to, co już stoi – stan obecny.","org":""},"cyt":{"s":"85","t":"Aktualna zdolność do świadczenia usług wykorzystywana do dostarczania bieżących usług IT została opisana w architekturze referencyjnej.","w":"ZGODNE","u":"Baseline = architektura referencyjna (na s.86 także „architektura bazowa”)."}},"fz-C-058":{"id":"fz-C-058","typ":"egzamin","s":"EN-02-20","t":"Która z poniższych jest dobrą praktyką aktywatora Usługi, infrastruktura i aplikacje?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 85","FW-PL s. 86"],"r":null,"zap":"","scen":"","o":[{"t":"Procedury eskalacji","ok":false,"w":"To dobra praktyka struktur organizacyjnych."},{"t":"Repozytorium (archiwum) architektury","ok":true,"w":"Repozytorium architektury przechowuje wyniki prac, m.in. pryncypia, standardy i modele architektury. Dysponowanie nim jest dobrą praktyką usług, infrastruktury i aplikacji obok definiowania pryncypiów, punktów widzenia i poziomów usług (s.85–86)."},{"t":"Zachęty i nagrody","ok":false,"w":"To dobra praktyka kształtowania zachowań."},{"t":"Struktura polityk z obsługą wyjątków","ok":false,"w":"To element aktywatora Zasady, polityki i struktury ramowe."}],"fz":{"h":"Dobre praktyki usług, infrastruktury i aplikacji","p":"P2","pulapka":false,"n":"EN: Architecture principles, viewpoints, repository, service levels","q":"Jakie są dobre praktyki dla usług, infrastruktury i aplikacji?","a":"Pryncypia (zasady) architektury; punkty widzenia architektury, czyli sposoby jej opisu (modele, katalogi, macierze); repozytorium (archiwum) architektury; poziomy usług do zdefiniowania i osiągnięcia przez dostawców.","ex":"Remont sieci lokali: ogólne zasady budowy, rysunki i spisy sprzętu, jedno archiwum planów i umowa z serwisem „naprawa pieca w 4 godziny”.","org":""},"cyt":{"s":"86","t":"Dysponowanie repozytorium architektury, które może być wykorzystywane do przechowywania różnych typów wyników dotyczących architektury","w":"ZGODNE"}},"fz-C-059":{"id":"fz-C-059","typ":"egzamin","s":"EN-02-20","t":"Które z poniższych NIE jest jednym z pięciu przykładowych pryncypiów architektury w COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 86"],"r":null,"zap":"","scen":"","o":[{"t":"Kompleksowość","ok":true,"w":"To cecha struktur ramowych, nie pryncypium architektury."},{"t":"Ponowne wykorzystanie","ok":false,"w":"To jedno z pięciu pryncypiów."},{"t":"Zwinność","ok":false,"w":"To jedno z pięciu pryncypiów."},{"t":"Otwartość","ok":false,"w":"To jedno z pięciu pryncypiów."}],"fz":{"h":"Pięć pryncypiów architektury","p":"P1","pulapka":false,"n":"EN: Reuse, buy vs build, simplicity, agility, openness","q":"Podaj pięć pryncypiów architektury.","a":"Pięć przykładów podanych w COBIT 5: ponowne wykorzystanie, nabywanie lub samodzielne tworzenie, prostota, zwinność, otwartość.","ex":"Urządzając kuchnię: używaj tego, co już masz, kupuj zamiast budować, prosto, z myślą o zmianach, na standardowe części. Haczyk: „Ponownie Nabyłem Prosty Zwinny Otwieracz”.","org":""},"cyt":{"s":"86","t":"Prostota — architekturę korporacyjną należy zaprojektować i utrzymywać w taki sposób, aby była możliwie najprostsza","w":"ZGODNE","u":"Pięć przykładowych pryncypiów (s.86): Ponowne wykorzystanie, Nabywanie lub samodzielne tworzenie, Prostota, Zwinność, Otwartość; kompleksowość to cecha metodyk (s.67)."}},"fz-C-061":{"id":"fz-C-061","typ":"egzamin","s":"EN-02-20","t":"Co mówi pryncypium nabywania lub samodzielnego tworzenia?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 86"],"r":null,"zap":"","scen":"","o":[{"t":"Należy tworzyć, chyba że zakup jest tańszy","ok":false,"w":"Jest odwrotnie: domyślnie się nabywa."},{"t":"O wyborze decyduje CIO bez uzasadnienia","ok":false,"w":"Pryncypium wymaga zatwierdzonego powodu, by tworzyć samodzielnie."},{"t":"Należy nabywać, chyba że uzasadniono tworzenie","ok":true,"w":"Rozwiązania należy nabywać, chyba że istnieje zatwierdzony powód, by opracować je w organizacji. Domyślnie: kupuj."},{"t":"Należy używać wspólnych komponentów architektury","ok":false,"w":"To pryncypium ponownego wykorzystania."}],"fz":{"h":"Nabywanie lub samodzielne tworzenie","p":"P2","pulapka":false,"n":"EN: Buy vs build","q":"Co mówi pryncypium nabywania lub samodzielnego tworzenia?","a":"Rozwiązania należy nabywać, chyba że istnieje zatwierdzony powód, by opracować je w organizacji.","ex":"Kupujesz gotową zmywarkę, a nie konstruujesz własnej, chyba że szefostwo zatwierdziło ważny powód. Domyślnie: kupuj.","org":""},"cyt":{"s":"86","t":"Nabywanie lub samodzielne tworzenie — rozwiązania należy nabywać, chyba że istnieje zatwierdzony powód, aby opracować je w ramach przedsiębiorstwa.","w":"ZGODNE"}},"fz-C-063":{"id":"fz-C-063","typ":"egzamin","s":"EN-02-21","t":"Proces wymaga uruchomienia środowiska testowego, a po jego zakończeniu środowisko jest przekazywane kolejnemu zespołowi. Co ilustruje to w relacjach Usług, Infrastruktury i Aplikacji z procesami?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 86"],"r":null,"zap":"","scen":"","o":[{"t":"Zdolności usługowe mogą być wejściami i wyjściami praktyk oraz działań","ok":true,"w":"Środowisko testowe jest zdolnością usługową wykorzystywaną przez proces. COBIT 5 dopuszcza zdolności usługowe jako wejścia oraz wyniki praktyk i działań. Informacja także jest jedną ze zdolności usługowych, a gdy trzeba zbudować kulturę ukierunkowaną na usługi, istotne są też zachowanie i kultura (FW-PL s. 86)."},{"t":"Wymagane poziomy usług wyznaczają kategorie jakości informacji","ok":false,"w":"Poziomy usług określają wymagania wobec świadczenia usług; nie wyznaczają trzech kategorii jakości informacji (s.82,86)."},{"t":"Mandat struktury organizacyjnej definiuje szczegółowe działania procesu","ok":false,"w":"Mandat określa powód i cel istnienia struktury. Szczegółowe działania dotyczą wdrażania praktyk procesu i wymagają odpowiednich wytycznych (s.70,75)."},{"t":"Ocena umiejętności personelu wyznacza poziom zdolności procesu","ok":false,"w":"Umiejętności personelu wspierają proces, lecz jego zdolność ocenia się na podstawie wyników i atrybutów procesu, a nie samej kompetencji ludzi (s.42–46,87)."}],"fz":{"h":"Usługi a inne aktywatory","p":"P2","pulapka":false,"n":"EN: Services – relationships","q":"Jak usługi wiążą się z innymi aktywatorami?","a":"Informacja jest jedną ze zdolności usługowych, wykorzystywanych przez procesy; kultura ukierunkowana na usługi wymaga zachowań; wejścia i wyjścia praktyk mogą obejmować zdolności usługowe.","ex":"System zamówień przechowuje bloczki (informacja), z których korzysta kuchnia (proces), a obsługa nastawiona na gościa wymaga odpowiedniego zachowania kelnerów (kultura).","org":""},"przyklad":"Środowisko testowe dostarczone zespołowi jest wejściem zdolności usługowej; gotowe środowisko przekazane do dalszej pracy może być wynikiem. Procesy wykorzystują przy tym informację, a gdy organizacja buduje kulturę nastawioną na usługi, liczą się też zachowania ludzi.","cyt":{"s":"86","t":"W ramach metodyki COBIT 5 dane wejściowe i wyniki praktyk oraz działań dotyczących zarządzania mogą obejmować zdolności do świadczenia usług, wymagane jako dane wejściowe lub uzyskiwane jako wyniki.","w":"ZGODNE"}},"fz-C-064":{"id":"fz-C-064","typ":"egzamin","s":"EN-02-22","t":"Co należy do celów aktywatora Ludzie, umiejętności i kompetencje?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 87"],"r":null,"zap":"","scen":"","o":[{"t":"Zakres kontroli struktury","ok":false,"w":"To dobra praktyka struktur organizacyjnych."},{"t":"Ograniczony dostęp do informacji","ok":false,"w":"To cel jakości bezpieczeństwa informacji."},{"t":"Zgodność z otwartymi standardami branżowymi","ok":false,"w":"To pryncypium otwartości architektury."},{"t":"Dostępność personelu i wskaźnik rotacji","ok":true,"w":"Cele dotyczące ludzi obejmują odpowiednią dostępność personelu i wskaźnik rotacji. Cele umiejętności i kompetencji obejmują m.in. kwalifikacje, umiejętności techniczne, doświadczenie, wiedzę i umiejętności behawioralne (s.87)."}],"fz":{"h":"Cele aktywatora Ludzie, umiejętności i kompetencje","p":"P2","pulapka":false,"n":"EN: People, skills and competencies – goals","q":"Czego dotyczą cele aktywatora Ludzie, Umiejętności i Kompetencje?","a":"Wykształcenia i kwalifikacji, umiejętności technicznych, doświadczenia, wiedzy, umiejętności behawioralnych (np. współpraca); także dostępności personelu i wskaźnika rotacji (odejść z pracy).","ex":"Kucharz: dyplom szkoły, umie filetować rybę, ma lata praktyki, zna przepisy, dogaduje się z zespołem. Liczy się też, czy jest w grafiku i czy ludzie nie odchodzą.","org":""},"cyt":{"s":"87","t":"Cele dotyczące osób obejmują odpowiednie poziomy dostępności personelu i wskaźnik rotacji.","w":"ZGODNE"}},"fz-C-065":{"id":"fz-C-065","typ":"egzamin","s":"EN-02-22","t":"Który etap należy do cyklu życia umiejętności?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 87"],"r":null,"zap":"","scen":"","o":[{"t":"Archiwizowanie nieaktualnych wersji polityk","ok":false,"w":"To element cyklu życia polityki."},{"t":"Pozbywanie się zbędnych kompetencji","ok":true,"w":"Cykl życia umiejętności może obejmować rezygnację z utrzymywania określonych umiejętności w organizacji, np. po automatyzacji lub outsourcingu. Obejmuje też planowanie, rozwój/pozyskiwanie, wdrażanie w rolach i okresową ocenę bazy (s.87)."},{"t":"Delegowanie uprawnień podległym strukturom","ok":false,"w":"To dobra praktyka struktur organizacyjnych."},{"t":"Przekształcanie danych w informacje","ok":false,"w":"To cykl informacji."}],"fz":{"h":"Cykl życia umiejętności","p":"P2","pulapka":false,"n":"EN: Skills life cycle","q":"Jak wygląda cykl życia umiejętności?","a":"Wgląd w obecną bazę i planowanie; rozwijanie (szkolenia) lub pozyskiwanie (rekrutacja); wdrażanie w rolach; pozbywanie się (np. po automatyzacji, outsourcingu); okresowa (np. roczna) ocena bazy.","ex":"Sprawdzasz, co umie zespół, uczysz albo zatrudniasz, przydzielasz do stanowisk, rezygnujesz z niepotrzebnych umiejętności (np. po kupnie maszyny do pierogów), co rok oceniasz.","org":""},"cyt":{"s":"87","t":"Może zaistnieć potrzeba pozbycia się umiejętności, np. gdy dane działanie zostało zautomatyzowane lub zlecone w ramach outsourcingu.","w":"ZGODNE"}},"fz-C-066":{"id":"fz-C-066","typ":"egzamin","s":"EN-02-22","t":"Jaka jest dobra praktyka dla umiejętności i kompetencji?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 87"],"r":null,"zap":"","scen":"","o":[{"t":"Zdefiniowanie mandatu dla każdej roli","ok":false,"w":"Mandat definiuje się dla struktury organizacyjnej."},{"t":"Przypisanie jednego odpowiedzialnego decyzyjnie (A) do każdej umiejętności","ok":false,"w":"Jeden A dotyczy praktyk w tabeli RACI."},{"t":"Oparcie wymagań wyłącznie na stażu pracy","ok":false,"w":"Wymagania mają być obiektywne, z poziomami i definicjami umiejętności."},{"t":"Zdefiniowanie obiektywnych wymagań umiejętności dla każdej roli, np. z użyciem SFIA","ok":true,"w":"Dobra praktyka to zdefiniowanie obiektywnych wymagań umiejętności dla każdej roli: poziomy umiejętności w kategoriach i definicje umiejętności (FW-PL s. 87); zewnętrznym źródłem takich definicji jest np. SFIA (FW-PL s. 88)."}],"fz":{"h":"Dobre praktyki dla umiejętności i kompetencji","p":"P2","pulapka":false,"n":"EN: Skill requirements per role; SFIA","q":"Jakie są dobre praktyki dla umiejętności i kompetencji?","a":"Zdefiniowanie obiektywnych wymagań umiejętności dla każdej roli: poziomy umiejętności w kategoriach umiejętności i definicje umiejętności; zewnętrzne źródła, np. SFIA.","ex":"Dla każdego stanowiska w kuchni spisujesz, co trzeba umieć i na jakim poziomie, np. „kucharz od sushi: poziom 3”. Można sięgnąć po gotowy katalog, np. SFIA.","org":""},"cyt":{"s":"87","t":"Dobra praktyka dotycząca umiejętności i kompetencji obejmuje zdefiniowanie wymogów dotyczących obiektywnych zestawów umiejętności dla każdej z ról odgrywanych przez różnych interesariuszy.","w":"ZGODNE","u":"SFIA podręcznik podaje osobno (s. 88) jako zewnętrzne źródło dobrych praktyk, nie jako część tej praktyki."}},"fz-C-067":{"id":"fz-C-067","typ":"egzamin","s":"EN-02-23","t":"Które kategorie umiejętności przypisuje się domenie MEA?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 88"],"r":null,"zap":"","scen":"","o":[{"t":"Weryfikacja zgodności, monitorowanie wydajności, audyt","ok":true,"w":"MEA to sprawdzanie: weryfikacja zgodności, monitorowanie wydajności i audyt mechanizmów kontrolnych."},{"t":"Analiza biznesowa, zarządzanie projektami, programowanie","ok":false,"w":"To kategorie BAI."},{"t":"Strategia IT, architektura korporacyjna, innowacje","ok":false,"w":"To kategorie APO."},{"t":"Dostępność, Service Desk, zarządzanie incydentami","ok":false,"w":"To kategorie DSS."}],"fz":{"h":"Kategorie umiejętności EDM i MEA (Rysunek 39)","p":"P1","pulapka":false,"n":"EN: Skill categories EDM, MEA","q":"Jakie kategorie umiejętności przypisano do EDM i MEA (Rysunek 39)?","a":"EDM: Ład IT w organizacji. MEA: weryfikacja zgodności, monitorowanie wydajności, audyt mechanizmów kontrolnych.","ex":"EDM (Ład, sama góra): umiejętność rządzenia IT. MEA (sprawdzanie): kontrolerzy – zgodność, wyniki, audyt. Jak właściciel lokalu i inspektor sanepidu.","org":""},"cyt":{"s":"88","t":"Monitorowanie, ocena i oszacowanie (MEA) • Weryfikacja zgodności • Monitorowanie sprawności • Audyt mechanizmów kontrolnych","w":"ZGODNE","u":"Tylko tabela il. 39; FW: „monitorowanie sprawności” (odpowiedź: „monitorowanie wydajności”)."}},"fz-C-069":{"id":"fz-C-069","typ":"egzamin","s":"EN-02-23","t":"Do której domeny należy kategoria umiejętności „analiza biznesowa”?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 88"],"r":null,"zap":"","scen":"","o":[{"t":"Twórz, Nabywaj i Wdrażaj (BAI)","ok":true,"w":"BAI (Build, Acquire and Implement — Twórz, Nabywaj i Wdrażaj) obejmuje m.in. analizę biznesową, zarządzanie projektami i programowanie."},{"t":"Dostosuj, Planuj i Organizuj (APO)","ok":false,"w":"APO (Align, Plan and Organise — Dostosuj, Planuj i Organizuj) to np. strategia IT (Information Technology — technologie informatyczne), innowacje i zarządzanie portfelami."},{"t":"Dostarczaj, Obsługuj i Wspieraj (DSS)","ok":false,"w":"DSS (Deliver, Service and Support — Dostarczaj, Obsługuj i Wspieraj) to np. zarządzanie problemami i eksploatacja IT (Information Technology — technologie informatyczne)."},{"t":"Oszacuj, Kieruj i Monitoruj (EDM)","ok":false,"w":"EDM (Evaluate, Direct and Monitor — Oszacuj, Kieruj i Monitoruj) ma jedną kategorię: Ład IT (Information Technology — technologie informatyczne) w organizacji."}],"fz":{"h":"Kategorie umiejętności BAI (Rysunek 39)","p":"P1","pulapka":false,"n":"EN: Skill categories BAI","q":"Jakie kategorie umiejętności przypisano do BAI (Rysunek 39)?","a":"Analiza biznesowa, zarządzanie projektami, ocena użyteczności, definiowanie wymagań i zarządzanie nimi, programowanie, ergonomia systemu, wycofanie oprogramowania, zarządzanie pojemnością.","ex":"BAI to budowanie – jak stawianie nowego lokalu: analiza potrzeb, kierowanie budową, wygoda gości, lista wymagań, wykonanie, rozbiórka starego i miejsce na odpowiednią liczbę gości.","org":""},"cyt":{"s":"88","t":"Budowanie, nabywanie i wdrażanie (BAI) • Analiza biznesowa","w":"ZGODNE","u":"Tylko tabela il. 39."}},"fz-C-070":{"id":"fz-C-070","typ":"egzamin","s":"EN-02-23","t":"Do której domeny należy kategoria umiejętności „administrowanie bazami danych”?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 88"],"r":null,"zap":"","scen":"","o":[{"t":"Twórz, Nabywaj i Wdrażaj (BAI)","ok":false,"w":"BAI (Build, Acquire and Implement — Twórz, Nabywaj i Wdrażaj) to np. programowanie i wycofanie oprogramowania."},{"t":"Dostosuj, Planuj i Organizuj (APO)","ok":false,"w":"APO (Align, Plan and Organise — Dostosuj, Planuj i Organizuj) to np. architektura korporacyjna i zarządzanie finansowe."},{"t":"Monitoruj, Oszacuj i Oceń (MEA)","ok":false,"w":"MEA (Monitor, Evaluate and Assess — Monitoruj, Oszacuj i Oceń) to weryfikacja zgodności, monitorowanie wydajności i audyt."},{"t":"Dostarczaj, Obsługuj i Wspieraj (DSS)","ok":true,"w":"DSS (Deliver, Service and Support — Dostarczaj, Obsługuj i Wspieraj) obejmuje m.in. eksploatację IT (Information Technology — technologie informatyczne) i administrowanie bazami danych."}],"fz":{"h":"Kategorie umiejętności DSS (Rysunek 39)","p":"P1","pulapka":false,"n":"EN: Skill categories DSS","q":"Jakie kategorie umiejętności przypisano do DSS (Rysunek 39)?","a":"Zarządzanie dostępnością, zarządzanie problemami, Service Desk i incydenty, administracja bezpieczeństwa, eksploatacja IT, administrowanie bazami danych.","ex":"DSS to codzienna praca – jak obsługa otwartej restauracji: lokal czynny, szukanie przyczyn usterek, przyjmowanie skarg, ochrona, praca kuchni i porządek w spiżarni (bazy danych).","org":""},"cyt":{"s":"88","t":"Dostarczanie, obsługa i wsparcie (DSS) • Zarządzanie dostępnością • Zarządzanie problemami • Zarządzanie jednostką Service Desk i incydentami • Administracja bezpieczeństwa • Eksploatacja IT • Administrowanie bazami danych","w":"ZGODNE","u":"Tylko tabela il. 39."}},"fz-C-071":{"id":"fz-C-071","typ":"egzamin","s":"EN-02-23","t":"Do których domen należą kategorie umiejętności „zarządzanie dostępnością” i „zarządzanie pojemnością”?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 88"],"r":null,"zap":"","scen":"","o":[{"t":"Obie do BAI, bo łączy je proces BAI04","ok":false,"w":"BAI04 łączy obie, ale przypisanie kategorii umiejętności (Rysunek 39) nie odpowiada procesom."},{"t":"Dostępność do DSS, pojemność do BAI","ok":true,"w":"Przypisani
