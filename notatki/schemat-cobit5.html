przątaniu: najpierw mówisz, czy chodzi o cały dom, jeden pokój czy tylko lodówkę. W COBIT 5 domyślnie jest to cała organizacja.","org":"zakres pierwszej iteracji: usługi centralne IT."}},"fz-A-032":{"id":"fz-A-032","typ":"egzamin","s":"PR-02-11","t":"Który z poniższych jest powodem, dla którego COBIT 5 jest pojedynczą zintegrowaną strukturą ramową?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 25"],"r":null,"zap":"","scen":"","o":[{"t":"Zastępuje wszystkie inne standardy, więc nie trzeba ich stosować","ok":false,"w":"COBIT 5 jest spójny z innymi standardami i je integruje, a nie zastępuje."},{"t":"Obejmuje wyłącznie funkcję IT, dzięki czemu jest prosty","ok":false,"w":"COBIT 5 obejmuje całą organizację."},{"t":"Ma prostą architekturę porządkującą materiały i łączy wiedzę rozproszoną dotąd w strukturach ISACA","ok":true,"w":"To dwa z powodów podanych na fiszce (obok spójności i objęcia całej organizacji)."},{"t":"Zawiera tylko jeden proces Ładu","ok":false,"w":"Domena Ładu EDM ma 5 procesów."}],"fz":{"h":"Pojedyncza zintegrowana struktura ramowa – dlaczego","p":"P2","pulapka":false,"n":"EN: Why COBIT 5 is a single integrated framework","q":"Dlaczego COBIT 5 jest pojedynczą zintegrowaną strukturą ramową?","a":"Jest spójny z innymi standardami; obejmuje całą organizację i integruje inne struktury; ma prostą architekturę porządkującą materiały i produkty; łączy wiedzę rozproszoną w strukturach ISACA.","ex":"Jak jeden pilot do całego domu: pasuje do innych urządzeń, obsługuje wszystkie pokoje, ma prosty układ przycisków i zastępuje kilka starych pilotów ISACA.","org":""}},"fz-A-033":{"id":"fz-A-033","typ":"egzamin","s":"PR-02-06","t":"Czy Kaskada Celów kończy się na procesach?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 18"],"r":null,"zap":"","scen":"","o":[{"t":"Tak – ostatnim krokiem są cele procesów","ok":false,"w":"Procesy to tylko jedna z 7 kategorii aktywatorów."},{"t":"Nie – kończy się celami związanymi z informatyką","ok":false,"w":"Po celach związanych z informatyką jest jeszcze krok 4: cele aktywatorów."},{"t":"Tak – bo tylko procesy mają w COBIT 5 własne cele","ok":false,"w":"Cele potrzebują też kultura, struktury, umiejętności i inne aktywatory."},{"t":"Nie – kończy się celami wszystkich 7 kategorii aktywatorów","ok":true,"w":"Krok 4 kaskady to cele aktywatorów, nie samych procesów."}],"fz":{"h":"Cele aktywatorów","p":"P1","pulapka":true,"n":"≠ TŁUMACZENIE · egzamin: cele aktywatora · podr.: cele czynników umożliwiających · EN: enabler goals · EN: Goals cascade ends with enabler goals","q":"Czym kończy się kaskada celów? / Czy Kaskada Celów kończy się na procesach?","a":"Celami aktywatorów (krok 4), czyli celami wszystkich 7 kategorii, nie tylko procesów.\nNie. Cele związane z informatyką prowadzą do celów WSZYSTKICH aktywatorów (krok 4); procesy to tylko jeden z siedmiu. Kultura, struktury czy umiejętności też potrzebują celów.","ex":"Kaskada spływa aż do celów dla każdego z 7 aktywatorów: procesów, ludzi, informacji, kultury… Np. w straży: rejestr zgłoszeń ma być kompletny.\nKaskada to rzeka, która nie kończy się na jednym młynie: płynie do wszystkich siedmiu aktywatorów, także ludzi, kultury i informacji, nie tylko do procesów.","org":"cele procesu DSS02, rejestru zgłoszeń, dyżuru."}},"fz-A-034":{"id":"fz-A-034","typ":"egzamin","s":"PR-02-06","t":"Co następuje bezpośrednio po celach związanych z informatyką w Kaskadzie Celów?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 18"],"r":null,"zap":"","scen":"","o":[{"t":"Rezultaty IT jako osobny krok","ok":false,"w":"Osobnego kroku „rezultaty IT” w kaskadzie nie ma."},{"t":"Cele aktywatorów","ok":true,"w":"Po celach związanych z informatyką jest ostatni, czwarty krok: cele aktywatorów."},{"t":"Cele organizacji","ok":false,"w":"Cele organizacji są przed celami związanymi z informatyką."},{"t":"Potrzeby interesariuszy","ok":false,"w":"Potrzeby interesariuszy są na początku kaskady, zaraz po wyznacznikach."}],"fz":{"h":"Krok po celach IT","p":"P1","pulapka":false,"n":"EN: IT-related goals → enabler goals","q":"Co następuje bezpośrednio po celach związanych z informatyką w kaskadzie?","a":"Cele aktywatorów (krok 4). Nie ma osobnego kroku „rezultaty IT”.","ex":"Po celach IT jest już ostatni, czwarty krok – cele aktywatorów. Pułapka egzaminacyjna: wymyślony krok „rezultaty IT” nie istnieje.","org":""}},"fz-A-035":{"id":"fz-A-035","typ":"egzamin","s":"PR-02-02","t":"Od czego zaczyna się Kaskada Celów na Rysunku 4?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 17"],"r":null,"zap":"","scen":"","o":[{"t":"Od potrzeb interesariuszy","ok":false,"w":"Potrzeby są drugie – wpływają na nie wyznaczniki."},{"t":"Od celów organizacji","ok":false,"w":"Cele organizacji są dopiero po potrzebach interesariuszy."},{"t":"Od wyznaczników interesariuszy, np. nowych technologii lub regulacji","ok":true,"w":"Strzałka biegnie od wyznaczników do potrzeb interesariuszy – to krok 1."},{"t":"Od celu Ładu – Tworzenia wartości","ok":false,"w":"Korzyści, ryzyko i zasoby to perspektywy oceny potrzeb, a nie krok kaskady."}],"fz":{"h":"Wyznaczniki w kaskadzie","p":"P1","pulapka":false,"n":"EN: Drivers influence stakeholder needs","q":"Czy wyznaczniki są pierwszym czy drugim krokiem przed potrzebami?","a":"Pierwszym. Na Rysunku 4 strzałka prowadzi od wyznaczników (np. nowe technologie, regulacje) do potrzeb interesariuszy – to krok 1 kaskady.","ex":"Najpierw pogoda, potem potrzeba parasola: wyznacznik (np. nowe przepisy) wywołuje potrzebę interesariusza. Na rysunku strzałka biegnie od wyznaczników do potrzeb.","org":""}},"fz-A-036":{"id":"fz-A-036","typ":"egzamin","s":"PR-02-01","t":"Czy Tworzenie wartości oznacza minimalizację ryzyka i kosztów?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 17","FW-PL s. 93"],"r":null,"zap":"","scen":"","o":[{"t":"Tak – celem Ładu jest ryzyko zerowe","ok":false,"w":"Zerowe ryzyko nie jest celem; ryzyko ma być na akceptowalnym poziomie."},{"t":"Nie – chodzi o optymalizację: ryzyko na akceptowalnym poziomie i najlepsze wykorzystanie zasobów","ok":true,"w":"Tworzenie wartości to realizacja korzyści przy optymalizacji, a nie minimalizacji ryzyka i zasobów."},{"t":"Tak – celem jest najniższy możliwy koszt IT","ok":false,"w":"Minimum kosztów nie jest celem; chodzi o optymalne wykorzystanie zasobów."},{"t":"Nie – chodzi o maksymalizację korzyści bez względu na ryzyko","ok":false,"w":"Tworzenie wartości to równowaga korzyści, ryzyka i zasobów."}],"fz":{"h":"Optymalizacja ryzyka i zasobów","p":"P1","pulapka":false,"n":"egzamin: optymalizacja ryzyka / zasobów · podr.: optymalizacja ryzyka / zasobów · EN: risk / resource optimisation · EN: Optimisation, not minimisation","q":"Co oznaczają oba składniki? / Czy Tworzenie Wartości oznacza minimalizację ryzyka?","a":"Ryzyko na akceptowalnym poziomie (nie zero); najlepsze wykorzystanie zasobów. Optymalizacja, nie minimalizacja.\nNie. To równowaga: realizacja korzyści przy OPTYMALIZACJI ryzyka i zasobów. Zerowe ryzyko lub minimum kosztów nie jest celem.","ex":"Jak przy domu: nie zamykasz się w bunkrze (zero ryzyka), tylko akceptujesz rozsądne ryzyko. Ludzi i sprzętu tyle, ile trzeba – nie mniej, nie więcej.\nJak jazda autem: nie chodzi o to, by nigdy nie wyjeżdżać (zero ryzyka), tylko jeździć bezpiecznie i z sensem. Optymalnie, nie minimalnie.","org":"przerwa do 15 min akceptowana; dyżur bez nadmiaru etatów."}},"fz-A-037":{"id":"fz-A-037","typ":"egzamin","s":"PR-02-08,PR-01-03","t":"Czy EDM jest komponentem Podejścia do Ładu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 23"],"r":null,"zap":"","scen":"","o":[{"t":"Tak – to jeden z czterech komponentów, obok Celu, Zakresu i Ról","ok":false,"w":"Czwartym komponentem są Aktywatory Ładu, a nie EDM."},{"t":"Nie – EDM to domena procesów Ładu w Referencyjnym Modelu Procesu","ok":true,"w":"EDM to grupa procesów w katalogu, nie komponent Podejścia do Ładu."},{"t":"Tak – EDM zastępuje komponent Aktywatory Ładu","ok":false,"w":"Aktywatory Ładu to osobny komponent; EDM go nie zastępuje."},{"t":"Nie – EDM to domena Zarządzania","ok":false,"w":"EDM jest domeną Ładu, nie Zarządzania."}],"fz":{"h":"EDM a Podejście do Ładu","p":"P1","pulapka":true,"n":"EN: EDM is a domain, not a governance approach component","q":"Czy EDM jest komponentem Podejścia do Ładu?","a":"Nie. Komponenty to Cel Ładu, Aktywatory Ładu, Zakres Ładu oraz Role, działania i relacje. EDM to domena procesów Ładu w Referencyjnym Modelu Procesu.","ex":"Pułapka: EDM to grupa procesów w katalogu, a nie część podejścia do Ładu. Komponenty to cztery pytania: po co, czym, czego dotyczy, kto co robi.","org":""}},"fz-A-038":{"id":"fz-A-038","typ":"egzamin","s":"PR-01-04","t":"Domena MEA zajmuje się monitorowaniem. Do której części COBIT 5 należy?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 32"],"r":null,"zap":"","scen":"","o":[{"t":"Do Ładu, bo monitorowanie to zadanie organu Ładu","ok":false,"w":"Monitorowanie jest i w Ładzie (EDM), i w Zarządzaniu (MEA)."},{"t":"Do Ładu i Zarządzania jednocześnie","ok":false,"w":"Każda domena należy do jednego obszaru; MEA jest w Zarządzaniu."},{"t":"Do Zarządzania (PBRM) – monitoruje kierownictwo","ok":true,"w":"MEA to domena Zarządzania; w EDM monitoruje organ Ładu."},{"t":"Do żadnej – MEA jest poza Referencyjnym Modelem Procesu","ok":false,"w":"MEA ma 3 procesy w Referencyjnym Modelu Procesu."}],"fz":{"h":"MEA – Ład czy Zarządzanie","p":"P1","pulapka":true,"n":"EN: MEA is management","q":"MEA monitoruje – czy należy więc do Ładu?","a":"Nie. MEA to domena Zarządzania (PBRM). Monitorowanie w EDM wykonuje organ Ładu, a MEA – kierownictwo.","ex":"Sprawdzać może i właściciel, i kierownik. W EDM sprawdza rada (Ład), w MEA kierownictwo (Zarządzanie). Haczyk: MEA zaczyna się na M jak „menedżer”.","org":""}},"fz-A-039":{"id":"fz-A-039","typ":"egzamin","s":"PR-02-10","t":"Czy COBIT 5 zastępuje ITIL, TOGAF czy PRINCE2?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 25"],"r":null,"zap":"","scen":"","o":[{"t":"Tak – po wdrożeniu COBIT 5 te standardy są zbędne","ok":false,"w":"COBIT 5 je integruje, a szczegóły bierze się właśnie z nich."},{"t":"Tak, ale tylko PRINCE2","ok":false,"w":"COBIT 5 nie zastępuje żadnego z tych standardów."},{"t":"Nie – bo COBIT 5 nie jest z nimi spójny i działa całkiem osobno","ok":false,"w":"COBIT 5 jest spójny z tymi standardami."},{"t":"Nie – jest nadrzędną strukturą, która je integruje; szczegóły bierze się z tych standardów","ok":true,"w":"COBIT 5 to integrator, nie zamiennik."}],"fz":{"h":"COBIT 5 a ITIL, TOGAF, PRINCE2","p":"P2","pulapka":false,"n":"EN: Integrator, not replacement","q":"Czy COBIT 5 zastępuje ITIL, TOGAF czy PRINCE2?","a":"Nie. Jest nadrzędną strukturą ramową, która je integruje i jest z nimi spójna; szczegóły bierze się z tych standardów.","ex":"COBIT 5 nie wyrzuca innych poradników – jest jak spis treści segregatora, w który wpinasz ITIL, TOGAF i PRINCE2 ze szczegółami.","org":""}},"fz-A-040":{"id":"fz-A-040","typ":"egzamin","s":"PR-01-01","t":"Czy Ład IT jest odrębny od ładu korporacyjnego?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 23"],"r":null,"zap":"","scen":"","o":[{"t":"Nie – jest jego częścią i obejmuje całą organizację, nie tylko funkcję IT","ok":true,"w":"Tak mówi Zasada 2: Pokrycie całej organizacji."},{"t":"Tak – Ład IT dotyczy wyłącznie działu IT","ok":false,"w":"Ład IT obejmuje całą organizację."},{"t":"Tak – Ład IT stoi ponad ładem korporacyjnym i go nadzoruje","ok":false,"w":"Ład IT jest częścią ładu korporacyjnego, a nie nad nim."},{"t":"Nie – bo Ład IT całkowicie zastępuje ład korporacyjny","ok":false,"w":"Ład IT jest częścią ładu korporacyjnego, nie jego zamiennikiem."}],"fz":{"h":"Ład IT a ład korporacyjny","p":"P2","pulapka":false,"n":"EN: Governance of enterprise IT is part of corporate governance","q":"Czy Ład IT jest odrębny od ładu korporacyjnego?","a":"Nie. Zasada 2: Ład IT jest częścią ładu korporacyjnego i obejmuje całą organizację, nie tylko funkcję IT.","ex":"Rachunek za internet to część budżetu domu, nie osobny budżet. Tak samo Ład IT to część rządzenia całą organizacją.","org":""}},"fz-A-041":{"id":"fz-A-041","typ":"egzamin","s":"PR-01-02","t":"Dlaczego aktywatorów nie można rozpatrywać osobno?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 28"],"r":null,"zap":"","scen":"","o":[{"t":"Bo wszystkie należą do domeny EDM","ok":false,"w":"Aktywatory to 7 kategorii, a nie procesy jednej domeny."},{"t":"Bo każdy aktywator ma ten sam cel","ok":false,"w":"Każdy aktywator ma własne cele; łączy je wymiana wejść i wyników."},{"t":"Bo są wzajemnie powiązane: każdy potrzebuje wejść od innych i daje wyniki innym","ok":true,"w":"Np. procesy potrzebują informacji, a struktury – umiejętności i zachowań."},{"t":"Bo tylko procesy mają cele, a reszta aktywatorów jedynie je wspiera","ok":false,"w":"Cele mają wszystkie aktywatory – kaskada kończy się na celach każdego z nich."}],"fz":{"h":"Powiązania aktywatorów","p":"P1","pulapka":false,"n":"EN: Interconnected enablers","q":"Dlaczego aktywatorów nie można rozpatrywać osobno?","a":"Są wzajemnie powiązane: każdy potrzebuje wejść od innych (procesy – informacji, struktury – umiejętności i zachowań) i daje wyniki innym.","ex":"Jak w kuchni: kucharz potrzebuje przepisu (informacja), umiejętności i sprzętu, a jego danie trafia do kelnera. Elementy przekazują sobie wyniki, więc działają razem.","org":""}},"fz-A-042":{"id":"fz-A-042","typ":"egzamin","s":"PR-02-13","t":"Wskaźnik mierzy, czy cel aktywatora został osiągnięty. Jaki to wskaźnik?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 29"],"r":null,"zap":"","scen":"","o":[{"t":"Wiodący, bo zapowiada przyszły wynik","ok":false,"w":"Wiodące dotyczą cyklu życia i dobrych praktyk (pytania 3–4), nie samego wyniku."},{"t":"Opóźniony, bo dotyczy wyniku","ok":true,"w":"Opóźnione dotyczą wyniku – pytań 1–2 o zarządzanie wydajnością aktywatora."},{"t":"Wiodący, bo dotyczy dobrych praktyk","ok":false,"w":"Pomiar osiągnięcia celu dotyczy wyniku, a nie dobrych praktyk."},{"t":"Podstawowy (P), bo dotyczy głównego celu","ok":false,"w":"P i S to relacje w macierzach mapowania, nie rodzaje wskaźników."}],"fz":{"h":"Wskaźnik osiągnięcia celu aktywatora","p":"P1","pulapka":true,"n":"EN: Lag = outcome","q":"Wskaźnik mierzy, czy cel aktywatora osiągnięto. Wiodący czy opóźniony?","a":"Opóźniony – dotyczy wyniku (pytania 1–2). Wiodące dotyczą cyklu życia i dobrych praktyk (pytania 3–4).","ex":"Opóźniony to wynik meczu po końcowym gwizdku – pokazuje, czy cel osiągnięto. Wiodące to treningi i kondycja przed meczem – zapowiadają wynik.","org":""}},"fz-A-043":{"id":"fz-A-043","typ":"egzamin","s":"PR-02-04","t":"Co oznacza litera S w macierzach mapowania Kaskady Celów?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 18"],"r":null,"zap":"","scen":"","o":[{"t":"Brak istotnego związku","ok":false,"w":"Brak istotnego związku oznacza puste pole, nie literę S."},{"t":"Powiązanie podstawowe, najsilniejsze","ok":false,"w":"Powiązanie podstawowe oznacza litera P."},{"t":"Cel strategiczny organizacji","ok":false,"w":"S nie oznacza rodzaju celu, tylko siłę powiązania."},{"t":"Powiązanie wspierające (podr. drugorzędne) – słabsze od P, ale nadal istotne","ok":true,"w":"S to relacja wspierająca; wciąż jest to prawdziwy związek."}],"fz":{"h":"P i S w macierzach","p":"P1","pulapka":false,"n":"≠ TŁUMACZENIE · egzamin: podstawowe / wspierające · podr.: podstawowe / drugorzędne · EN: primary / secondary · EN: Secondary ≠ none","q":"Co oznaczają P i S w załącznikach? / Czy relacja S oznacza brak związku z celem Ładu?","a":"P: powiązanie podstawowe; S: wspierające (nadal silne). Macierze to wytyczna do dostosowania, nie algorytm.\nNie. S oznacza relację wspierającą (słabszą); brak litery oznacza brak istotnego związku.","ex":"P to główny filar mostu, S to filar pomocniczy, też mocny. Tabele to podpowiedź, nie przepis do ślepego kopiowania.\nP to główna droga, S to boczna, ale wciąż przejezdna. Puste pole w tabeli oznacza: tędy nie ma drogi.","org":"CO7 →P→ IT04; CO7 →S→ IT07."}},"fz-A-044":{"id":"fz-A-044","typ":"egzamin","s":"PR-02-14","t":"Czy Ład i Zarządzanie mają te same struktury organizacyjne?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 14"],"r":null,"zap":"","scen":"","o":[{"t":"Nie – wymagają różnych struktur, ale odpowiedzialności Ładu można delegować specjalnym strukturom","ok":true,"w":"Tak mówi Zasada 5 i fiszka."},{"t":"Tak – to jedna struktura, różnią się tylko nazwą","ok":false,"w":"Zasada 5: Ład i Zarządzanie wymagają różnych struktur."},{"t":"Nie – a odpowiedzialności Ładu nie wolno nikomu delegować","ok":false,"w":"Odpowiedzialności Ładu można delegować specjalnym strukturom."},{"t":"Tak – bo mają te same działania i cele","ok":false,"w":"Ład i Zarządzanie mają różne działania i cele."}],"fz":{"h":"Struktury Ładu i Zarządzania","p":"P1","pulapka":true,"n":"EN: Different structures","q":"Czy Ład i Zarządzanie mają te same struktury organizacyjne?","a":"Nie. Zasada 5: wymagają różnych struktur, mają różne działania i cele. Odpowiedzialności Ładu można jednak delegować specjalnym strukturom.","ex":"W klubie sportowym zarząd i trenerzy to różne grupy z innymi zadaniami. Zarząd może jednak powołać komisję, która zrobi część jego pracy.","org":""}},"fz-A-045":{"id":"fz-A-045","typ":"egzamin","s":"PR-02-04,PR-02-05","t":"Czy zrównoważona karta wyników (BSC) dotyczy tylko celów organizacji?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 18–19"],"r":null,"zap":"","scen":"","o":[{"t":"Tak – cele związane z informatyką nie są grupowane w wymiarach","ok":false,"w":"Cele związane z informatyką grupuje się w wymiarach IT BSC."},{"t":"Nie – cele organizacji są w wymiarach BSC, a cele związane z informatyką w wymiarach IT BSC","ok":true,"w":"Obie listy po 17 celów mają te same cztery rubryki."},{"t":"Tak – cele IT grupuje się według domen PBRM","ok":false,"w":"Domeny grupują procesy, a cele IT są w wymiarach IT BSC."},{"t":"Nie – BSC grupuje też procesy domeny EDM","ok":false,"w":"BSC grupuje cele organizacji i cele IT, nie procesy."}],"fz":{"h":"BSC i IT BSC","p":"P2","pulapka":false,"n":"egzamin: zrównoważona karta wyników (BSC) · podr.: zrównoważona karta wyników (BSC) · EN: balanced scorecard · EN: BSC and IT BSC","q":"W jakich wymiarach grupuje się cele? / Czy BSC dotyczy tylko celów organizacji?","a":"Cele organizacji w wymiarach BSC: finanse, klient, obszar wewnętrzny, szkolenie i rozwój. Cele związane z informatyką w wymiarach IT BSC.\nNie. Cele organizacji ułożono w wymiarach BSC, a cele związane z informatyką – w wymiarach IT BSC; obie listy mają po 17 celów.","ex":"Cztery rubryki jak na świadectwie: pieniądze, klient, wnętrze firmy (jak pracujemy), nauka i rozwój. Cele IT mają takie same cztery rubryki.\nBSC (Zrównoważona karta wyników) to tablica z czterema rubrykami: pieniądze, klient, praca wewnątrz, rozwój ludzi. Firma i IT mają osobne tablice, po 17 celów.","org":""}},"fz-A-046":{"id":"fz-A-046","typ":"egzamin","s":"PR-02-04","t":"Który z poniższych NIE jest wymiarem zrównoważonej karty wyników (BSC) w COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 18–19"],"r":null,"zap":"","scen":"","o":[{"t":"Finanse","ok":false,"w":"Finanse to jeden z czterech wymiarów BSC."},{"t":"Klient","ok":false,"w":"Klient to jeden z czterech wymiarów BSC."},{"t":"Szkolenie i rozwój","ok":false,"w":"Szkolenie i rozwój to jeden z czterech wymiarów BSC."},{"t":"Ryzyko","ok":true,"w":"Wymiary BSC to: finanse, klient, obszar wewnętrzny, szkolenie i rozwój – ryzyka wśród nich nie ma."}],"fz":{"h":"BSC i IT BSC","p":"P2","pulapka":false,"n":"egzamin: zrównoważona karta wyników (BSC) · podr.: zrównoważona karta wyników (BSC) · EN: balanced scorecard · EN: BSC and IT BSC","q":"W jakich wymiarach grupuje się cele? / Czy BSC dotyczy tylko celów organizacji?","a":"Cele organizacji w wymiarach BSC: finanse, klient, obszar wewnętrzny, szkolenie i rozwój. Cele związane z informatyką w wymiarach IT BSC.\nNie. Cele organizacji ułożono w wymiarach BSC, a cele związane z informatyką – w wymiarach IT BSC; obie listy mają po 17 celów.","ex":"Cztery rubryki jak na świadectwie: pieniądze, klient, wnętrze firmy (jak pracujemy), nauka i rozwój. Cele IT mają takie same cztery rubryki.\nBSC (Zrównoważona karta wyników) to tablica z czterema rubrykami: pieniądze, klient, praca wewnątrz, rozwój ludzi. Firma i IT mają osobne tablice, po 17 celów.","org":""}},"fz-A-047":{"id":"fz-A-047","typ":"egzamin","s":"PR-01-04","t":"Czy przypisanie procesu do domeny oznacza, że proces obejmuje tylko jedną fazę PBRM?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 33"],"r":null,"zap":"","scen":"","o":[{"t":"Tak – proces z APO wykonuje wyłącznie planowanie","ok":false,"w":"Większość procesów zawiera wszystkie cztery działania PBRM."},{"t":"Nie – większość procesów zawiera planowanie, budowanie, uruchamianie i monitorowanie; domenę wybrano wg najwłaściwszego obszaru","ok":true,"w":"Domena wskazuje główny obszar działania procesu, a nie jedyną fazę."},{"t":"Tak – każdy proces ma dokładnie jedną fazę PBRM","ok":false,"w":"Fiszka mówi wprost, że jest odwrotnie."},{"t":"Nie – procesy w ogóle nie są przypisane do domen","ok":false,"w":"Każdy z 37 procesów jest przypisany do jednej z 5 domen."}],"fz":{"h":"Domeny a fazy PBRM","p":"P1","pulapka":true,"n":"EN: Domain = most relevant area","q":"Czy domeny przypisują procesy wyłącznie do jednej fazy PBRM?","a":"Nie. Większość procesów zawiera planowanie, budowanie, uruchamianie i monitorowanie; domenę wybrano wg najwłaściwszego obszaru działania.","ex":"Jak w domu: w każdym pokoju się sprząta, urządza i mieszka. Pokój nazywasz od jego głównego przeznaczenia – tak samo proces przypisano do domeny jego najwłaściwszego obszaru.","org":""}},"fz-A-048":{"id":"fz-A-048","typ":"egzamin","s":"PR-02-04","t":"Ile ogólnych celów organizacji opisuje COBIT 5 i jak się je grupuje?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 19"],"r":null,"zap":"","scen":"","o":[{"t":"17 celów w 4 wymiarach BSC","ok":true,"w":"Rysunek 5: 17 celów organizacji w wymiarach BSC."},{"t":"37 celów w 5 domenach","ok":false,"w":"37 to liczba procesów w 5 domenach, nie celów organizacji."},{"t":"17 celów w 5 domenach procesów","ok":false,"w":"Cele organizacji grupuje się w wymiarach BSC, a nie w domenach."},{"t":"13 celów w 4 wymiarach BSC","ok":false,"w":"Celów organizacji jest 17; 13 procesów ma domena APO."}],"fz":{"h":"Cele organizacji","p":"P2","pulapka":false,"n":"≠ TŁUMACZENIE · egzamin: cele organizacji · podr.: cele przedsiębiorstwa · EN: enterprise goals · EN: 17 enterprise goals; BSC: Financial, Customer, Internal, Learning and Growth","q":"Ile jest celów organizacji? / Ile jest celów organizacji i w jakich wymiarach BSC?","a":"17 ogólnych celów w 4 wymiarach BSC (Rys. 5), np. CO7 Ciągłość i dostępność usług biznesowych.\n17 celów w 4 wymiarach Zrównoważonej karty wyników: Finanse (1–5), Klient (6–10), Obszar wewnętrzny (11–15), Szkolenie i rozwój (16–17).","ex":"Haczyk: 17 jak „siedemnastka” – tyle samo celów ma organizacja i IT. Cel 7 dla straży: numer alarmowy działa zawsze.\nRozkład 5-5-5-2: po pięć celów w finansach, kliencie i obszarze wewnętrznym, dwa w rozwoju. Jak trzy pełne dłonie i dwa palce.","org":"CO7 dla komendy: usługi wspierające działania dostępne zawsze."}},"fz-A-049":{"id":"fz-A-049","typ":"egzamin","s":"PR-02-04","t":"Ile celów organizacji należy do wymiaru BSC „Szkolenie i rozwój”?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 19"],"r":null,"zap":"","scen":"","o":[{"t":"5","ok":false,"w":"Po 5 celów mają finanse, klient i obszar wewnętrzny."},{"t":"7","ok":false,"w":"7 to liczba celów IT w obszarze wewnętrznym IT BSC."},{"t":"2 (cele 16–17)","ok":true,"w":"Rozkład celów organizacji to 5-5-5-2; szkolenie i rozwój ma cele 16–17."},{"t":"6","ok":false,"w":"6 celów ma wymiar finansowy w IT BSC, nie szkolenie i rozwój celów organizacji."}],"fz":{"h":"Cele organizacji","p":"P2","pulapka":false,"n":"≠ TŁUMACZENIE · egzamin: cele organizacji · podr.: cele przedsiębiorstwa · EN: enterprise goals · EN: 17 enterprise goals; BSC: Financial, Customer, Internal, Learning and Growth","q":"Ile jest celów organizacji? / Ile jest celów organizacji i w jakich wymiarach BSC?","a":"17 ogólnych celów w 4 wymiarach BSC (Rys. 5), np. CO7 Ciągłość i dostępność usług biznesowych.\n17 celów w 4 wymiarach Zrównoważonej karty wyników: Finanse (1–5), Klient (6–10), Obszar wewnętrzny (11–15), Szkolenie i rozwój (16–17).","ex":"Haczyk: 17 jak „siedemnastka” – tyle samo celów ma organizacja i IT. Cel 7 dla straży: numer alarmowy działa zawsze.\nRozkład 5-5-5-2: po pięć celów w finansach, kliencie i obszarze wewnętrznym, dwa w rozwoju. Jak trzy pełne dłonie i dwa palce.","org":"CO7 dla komendy: usługi wspierające działania dostępne zawsze."}},"fz-A-050":{"id":"fz-A-050","typ":"egzamin","s":"PR-02-05","t":"W którym wymiarze IT BSC jest najwięcej celów związanych z informatyką?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 19"],"r":null,"zap":"","scen":"","o":[{"t":"Finanse (01–06)","ok":false,"w":"Finanse mają 6 celów IT – mniej niż obszar wewnętrzny."},{"t":"Klient (07–08)","ok":false,"w":"Klient ma tylko 2 cele IT."},{"t":"Szkolenie i rozwój (16–17)","ok":false,"w":"Szkolenie i rozwój ma tylko 2 cele IT."},{"t":"Obszar wewnętrzny (09–15)","ok":true,"w":"Obszar wewnętrzny ma 7 celów IT; rozkład to 6-2-7-2."}],"fz":{"h":"Cele związane z informatyką","p":"P2","pulapka":false,"n":"≠ TŁUMACZENIE · egzamin: cele związane z informatyką · podr.: cele związane z IT · EN: IT-related goals · EN: 17 IT-related goals; IT BSC","q":"Ile jest celów IT? / Ile jest celów związanych z informatyką i w jakich wymiarach?","a":"17 celów w 4 wymiarach IT BSC (Rys. 6), np. IT04 Zarządzanie ryzykiem biznesowym związanym z IT.\n17 celów w wymiarach IT BSC: Finanse (01–06), Klient (07–08), Obszar wewnętrzny (09–15), Szkolenie i rozwój (16–17).","ex":"Lustro: 17 celów organizacji i 17 celów IT w tych samych czterech rubrykach. IT04 to pilnowanie, by awaria komputerów nie zaszkodziła działalności.\nRozkład 6-2-7-2, inny niż u celów organizacji (5-5-5-2). Najwięcej celów IT dotyczy „zaplecza” (obszar wewnętrzny), najmniej klienta i rozwoju.","org":"IT04 i IT07 wynikają z CO7."}},"fz-A-051":{"id":"fz-A-051","typ":"egzamin","s":"PR-02-03","t":"Kim jest interesariusz w COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 93"],"r":null,"zap":"","scen":"","o":[{"t":"Wyłącznie udziałowcem, który posiada akcje organizacji","ok":false,"w":"Udziałowcy to tylko jedna z grup interesariuszy."},{"t":"Każdym, kto odpowiada za organizację, ma wobec niej oczekiwania lub jakiś udział – wewnątrz lub na zewnątrz","ok":true,"w":"Tak definiuje interesariusza słownik COBIT 5."},{"t":"Wyłącznie pracownikiem organizacji","ok":false,"w":"Interesariusze są też zewnętrzni, np. dostawcy, klienci, rząd."},{"t":"Wyłącznie członkiem organu Ładu","ok":false,"w":"Organ Ładu to tylko jedna z ról; interesariuszy jest znacznie więcej."}],"fz":{"h":"Interesariusz","p":"P1","pulapka":false,"n":"egzamin: interesariusz · podr.: interesariusz · EN: stakeholder · EN: Stakeholder","q":"Kim jest interesariusz? / Kim jest interesariusz?","a":"Każdy, kto odpowiada za organizację, ma wobec niej oczekiwania lub udział: wewnętrzni i zewnętrzni.\nKażda osoba, na której spoczywa odpowiedzialność za organizację, która ma wobec niej oczekiwania lub jakiś udział, np. udziałowcy, użytkownicy, rząd, dostawcy, klienci, opinia publiczna.","ex":"Każdy, komu zależy na losie organizacji: w restauracji właściciel, kucharze, goście, dostawcy i sanepid. Wewnętrzni są w środku, zewnętrzni na zewnątrz.\nKażdy, kto zyskuje lub traci na działaniu organizacji: w szkole uczniowie, rodzice, nauczyciele, kuratorium i firma dowożąca obiady.","org":"komendy, kierownictwo, ministerstwo, obywatele."}},"fz-A-052":{"id":"fz-A-052","typ":"egzamin","s":"PR-02-02,PR-02-05,PR-02-06","t":"Jaka jest poprawna kolejność Kaskady Celów?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 18"],"r":null,"zap":"","scen":"","o":[{"t":"Potrzeby interesariuszy → wyznaczniki → cele organizacji → cele związane z informatyką → cele aktywatorów","ok":false,"w":"Wyznaczniki są pierwsze – to one wpływają na potrzeby."},{"t":"Wyznaczniki → potrzeby interesariuszy → cele związane z informatyką → cele organizacji → cele aktywatorów","ok":false,"w":"Cele organizacji są przed celami związanymi z informatyką."},{"t":"Wyznaczniki → potrzeby interesariuszy → cele organizacji → cele aktywatorów → cele związane z informatyką","ok":false,"w":"Cele aktywatorów to ostatni krok kaskady."},{"t":"Wyznaczniki → potrzeby interesariuszy → cele organizacji → cele związane z informatyką → cele aktywatorów","ok":true,"w":"To kolejność z Rysunku 4 (haczyk W-P-O-I-A)."}],"fz":{"h":"Kaskada celów","p":"P1","pulapka":false,"n":"egzamin: kaskada celów · podr.: kaskada celów · EN: goals cascade · EN: Stakeholder drivers → stakeholder needs → enterprise goals → IT-related goals → enabler goals","q":"Podaj kroki kaskady celów. / Podaj kolejność Kaskady Celów.","a":"Wyznaczniki → potrzeby interesariuszy → cele organizacji → cele związane z informatyką → cele aktywatorów (Rys. 4). Daje priorytety, zakres wdrożenia i wspólny język (s. 20).\nWyznaczniki interesariuszy → potrzeby interesariuszy → cele organizacji → cele związane z informatyką → cele aktywatorów.","ex":"Jak w domu: ulewa (wyznacznik) → „suchy dom” (potrzeba) → szczelny dach (cel organizacji) → dobra rynna (cel IT) → fachowiec, plan, materiał (aktywatory).\nHaczyk W-P-O-I-A: „Wiatr Popycha Organizację, IT, Aktywatory”. Od przyczyny (wyznaczniki) do konkretnych zadań (aktywatory), jak woda spływająca po schodach.","org":"awaria → „usługi bez przerw” → CO7 → IT04 → DSS02."}},"fz-A-053":{"id":"fz-A-053","typ":"egzamin","s":"PR-02-01","t":"Co oznacza optymalizacja ryzyka?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 93"],"r":null,"zap":"","scen":"","o":[{"t":"Rozpoznawanie ryzyka, ocenę jego skutków i prawdopodobieństwa oraz trzymanie go w granicach apetytu na ryzyko","ok":true,"w":"Tak definiuje optymalizację ryzyka słownik COBIT 5."},{"t":"Doprowadzenie ryzyka do zera","ok":false,"w":"Zerowe ryzyko nie jest celem; ryzyko ma mieścić się w akceptowanych granicach."},{"t":"Przeniesienie całego ryzyka na dostawców","ok":false,"w":"Przeniesienie to tylko jedna z możliwych strategii, nie definicja optymalizacji."},{"t":"Skuteczne, wydajne i odpowiedzialne wykorzystanie wszystkich zasobów","ok":false,"w":"To definicja optymalizacji zasobów."}],"fz":{"h":"Optymalizacja ryzyka","p":"P1","pulapka":false,"n":"EN: Risk optimisation","q":"Co oznacza optymalizacja ryzyka?","a":"Rozpoznawanie ryzyka, ocena jego skutków i prawdopodobieństwa oraz trzymanie go w granicach, które organizacja akceptuje (apetyt na ryzyko).","ex":"Apetyt na ryzyko to ile ryzyka organizacja godzi się znieść, jak ograniczenie prędkości. Rozpoznajesz zagrożenia, oceniasz je i trzymasz w tej granicy.","org":""}},"fz-A-054":{"id":"fz-A-054","typ":"egzamin","s":"PR-02-01","t":"Co oznacza optymalizacja zasobów?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 93"],"r":null,"zap":"","scen":"","o":[{"t":"Jak najniższe wydatki na IT","ok":false,"w":"Chodzi o optymalne, a nie minimalne wykorzystanie zasobów."},{"t":"Wykorzystanie wyłącznie zasobów finansowych","ok":false,"w":"Obejmuje wszystkie zasoby: ludzi, finanse, sprzęt, infrastrukturę."},{"t":"Skuteczne, wydajne i odpowiedzialne wykorzystanie wszystkich zasobów: ludzi, finansów, sprzętu, infrastruktury","ok":true,"w":"Tak definiuje optymalizację zasobów słownik COBIT 5."},{"t":"Eliminowanie inicjatyw, które nie dają wartości","ok":false,"w":"To element realizacji korzyści, nie optymalizacji zasobów."}],"fz":{"h":"Optymalizacja zasobów","p":"P1","pulapka":false,"n":"EN: Resource optimisation","q":"Co oznacza optymalizacja zasobów?","a":"Skuteczne, wydajne i odpowiedzialne wykorzystanie wszystkich zasobów: ludzkich, finansowych, sprzętu, infrastruktury itd.","ex":"Jak gotowanie z zapasów: nic się nie marnuje, nic nie leży bezużytecznie, a ludzie, pieniądze i sprzęt trafiają tam, gdzie są potrzebne.","org":""}},"fz-A-055":{"id":"fz-A-055","typ":"egzamin","s":"PR-02-01","t":"Co obejmuje realizacja korzyści?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 17","FW-PL s. 89"],"r":null,"zap":"","scen":"","o":[{"t":"Wyłącznie zwiększanie zysku finansowego","ok":false,"w":"Korzyści mogą mieć różną postać, np. jakość służby w administracji."},{"t":"Trzymanie ryzyka w granicach apetytu na ryzyko","ok":false,"w":"To optymalizacja ryzyka."},{"t":"Wyłącznie uruchamianie nowych inicjatyw","ok":false,"w":"Obejmuje też utrzymanie istniejących korzyści i eliminację inicjatyw bez wartości."},{"t":"Uzyskiwanie nowych korzyści, utrzymanie i rozszerzanie istniejących oraz eliminowanie inicjatyw bez wystarczającej wartości","ok":true,"w":"Tak definiuje realizację korzyści słownik COBIT 5."}],"fz":{"h":"Realizacja korzyści","p":"P1","pulapka":false,"n":"egzamin: realizacja korzyści · podr.: realizacja korzyści · EN: benefits realisation · EN: Benefits realisation","q":"Co oznacza realizacja korzyści? / Co oznacza realizacja korzyści?","a":"Tworzenie nowej wartości, utrzymanie i zwiększanie istniejącej, eliminacja inicjatyw bez wartości. W administracji korzyścią jest jakość służby.\nUzyskiwanie nowych korzyści, utrzymanie i rozszerzanie istniejących oraz eliminowanie inicjatyw i zasobów, które nie dają wystarczającej wartości.","ex":"Jak porządki w szafie: dokupujesz, czego brakuje, dbasz o dobre rzeczy i wyrzucasz to, co tylko zajmuje miejsce. W urzędzie zysk to lepsza obsługa ludzi.\nJak ogródek: siejesz nowe rośliny, podlewasz te, które rosną, i wyrywasz chwasty, które tylko zabierają miejsce.","org":"krótszy czas przywrócenia usług dla komend."}},"fz-A-056":{"id":"fz-A-056","typ":"egzamin","s":"PR-02-01","t":"Czym jest cel Ładu w COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 17"],"r":null,"zap":"","scen":"","o":[{"t":"Tworzeniem wartości: realizacją korzyści przy optymalnym ryzyku i optymalnym wykorzystaniu zasobów","ok":true,"w":"Cel Ładu (podr. cel nadzoru) to Tworzenie wartości przez równowagę trzech składników."},{"t":"Maksymalizacją zysku niezależnie od ryzyka","ok":false,"w":"Tworzenie wartości to równowaga korzyści, ryzyka i zasobów."},{"t":"Wdrożeniem wszystkich 37 procesów","ok":false,"w":"Procesy to tylko jeden z aktywatorów, a nie cel Ładu."},{"t":"Ułożeniem celów w wymiarach BSC","ok":false,"w":"BSC grupuje cele organizacji; nie jest celem Ładu."}],"fz":{"h":"Tworzenie wartości","p":"P1","pulapka":false,"n":"≠ TŁUMACZENIE · egzamin: tworzenie wartości – cel Ładu · podr.: tworzenie wartości – cel nadzoru · EN: value creation, governance objective · EN: Value creation – governance objective","q":"Czym jest cel Ładu? / Czym jest Tworzenie Wartości?","a":"Tworzenie wartości: realizacja korzyści przy optymalnym ryzyku i zasobach (Rys. 3). Te trzy składniki to perspektywy oceny potrzeb, nie krok kaskady.\nCelem Ładu (podr. cel nadzoru): osiąganie korzyści przy optymalnym ryzyku i optymalnym wykorzystaniu zasobów. Osiąga się je, równoważąc trzy cele.","ex":"Waga szalkowa: na jednej szali korzyści, na drugiej ryzyko i koszty. Ład trzyma równowagę. To sposób patrzenia, nie osobny krok kaskady.\nJak zakupy z budżetem: chcesz dobrej rzeczy (korzyść), bez przepłacania (zasoby) i bez ryzyka bubla (ryzyko). Tworzenie wartości to równowaga tych trzech.","org":""}},"fz-A-057":{"id":"fz-A-057","typ":"egzamin","s":"PR-02-01","t":"Który z poniższych NIE jest składnikiem Celu Ładu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 17"],"r":null,"zap":"","scen":"","o":[{"t":"Realizacja korzyści","ok":false,"w":"To pierwszy składnik Celu Ładu."},{"t":"Optymalizacja ryzyka","ok":false,"w":"To drugi składnik Celu Ładu."},{"t":"Zapewnienie zgodności z przepisami","ok":true,"w":"Składniki Celu Ładu to korzyści, ryzyko i zasoby (K-R-Z); zgodność do nich nie należy."},{"t":"Optymalizacja zasobów","ok":false,"w":"To trzeci składnik Celu Ładu."}],"fz":{"h":"Składniki Celu Ładu","p":"P1","pulapka":false,"n":"EN: Benefits realisation, risk optimisation, resource optimisation","q":"Jakie trzy składniki tworzą Cel Ładu?","a":"1. Realizacja korzyści. 2. Optymalizacja ryzyka. 3. Optymalizacja zasobów.","ex":"Haczyk K-R-Z: Korzyści, Ryzyko, Zasoby – jak „kurz” bez u. Korzyści się realizuje, ryzyko i zasoby optymalizuje.","org":""}},"fz-A-058":{"id":"fz-A-058","typ":"egzamin","s":"PR-02-02","t":"Czym jest wyznacznik w Kaskadzie Celów?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 18","FW-PL s. 91"],"r":null,"zap":"","scen":"","o":[{"t":"Wskaźnikiem, który mierzy, czy cel aktywatora osiągnięto","ok":false,"w":"To opis wskaźnika opóźnionego, nie wyznacznika."},{"t":"Czynnikiem wewnętrznym lub zewnętrznym, który wpływa na potrzeby interesariuszy, np. nowa strategia, przepisy, technologie","ok":true,"w":"Wyznaczniki zmieniają potrzeby interesariuszy – to krok 1 kaskady."},{"t":"Osobą, która ma wobec organizacji oczekiwania lub udział","ok":false,"w":"To definicja interesariusza."},{"t":"Jednym z 17 celów związanych z informatyką","ok":false,"w":"Cele IT to dalszy krok kaskady, nie wyznaczniki."}],"fz":{"h":"Wyznacznik","p":"P1","pulapka":false,"n":"egzamin: wyznaczniki · podr.: wyznaczniki · EN: stakeholder drivers · EN: Driver / stakeholder drivers","q":"Czym jest wyznacznik w kaskadzie? / Czym jest wyznacznik (czynnik wpływający na potrzeby interesariuszy)?","a":"Czynnik wpływający na potrzeby interesariuszy: zmiany strategii, otoczenia, regulacji, technologii.\nCzynniki zewnętrzne i wewnętrzne, które wywołują zmiany w organizacji lub wpływają na jej działanie, np. nowa strategia, zmiany otoczenia biznesowego i przepisów, nowe technologie.","ex":"Wyznacznik to „pogoda”, która zmienia życzenia ludzi: nowe przepisy, nowa technologia, nowa strategia. Jak zima wymusza zakup opon zimowych.\nBodziec z zewnątrz lub z wewnątrz, jak nowe prawo o recyklingu, które zmusza sklep do zmiany opakowań.","org":"nawałnice i nowe przepisy zmieniają potrzeby komend."}},"fz-A-059":{"id":"fz-A-059","typ":"egzamin","s":"PR-02-05","t":"Który załącznik COBIT 5 mapuje cele organizacji na cele związane z informatyką?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 18"],"r":null,"zap":"","scen":"","o":[{"t":"Załącznik C","ok":false,"w":"Załącznik C mapuje cele związane z IT na procesy."},{"t":"Załącznik D","ok":false,"w":"Załącznik D mapuje potrzeby interesariuszy na cele organizacji."},{"t":"Załącznik B","ok":true,"w":"Załącznik B (Rysunek 22): cele organizacji → cele związane z IT."},{"t":"Załącznik A","ok":false,"w":"Mapowania kaskady są w załącznikach D, B i C (kolejność D-B-C)."}],"fz":{"h":"Załączniki B, C, D","p":"P2","pulapka":false,"n":"egzamin: załączniki B, C, D · podr.: załączniki B, C, D · EN: appendices B, C, D · EN: Appendices B, C, D","q":"Co zawierają załączniki B, C i D? / Które załączniki zawierają mapowania kaskady?","a":"B: cele organizacji → cele IT (Rys. 22); C: cele IT → procesy (Rys. 23); D: potrzeby interesariuszy → cele organizacji.\nD: potrzeby interesariuszy → cele organizacji; B: cele organizacji → cele związane z IT; C: cele związane z IT → procesy.","ex":"Kolejność kaskady to D-B-C, nie A-B-C: D (potrzeby → cele organizacji), B (cele organizacji → cele IT), C (cele IT → procesy). „Dobry Bigos Codziennie”.\nKolejność kaskady to D-B-C, nie A-B-C: najpierw D (potrzeby), potem B (cele organizacji → IT), na końcu C (IT → procesy).","org":""}},"fz-A-060":{"id":"fz-A-060","typ":"egzamin","s":"PR-02-03","t":"Który z poniższych jest interesariuszem zewnętrznym według Rysunku 7?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 22"],"r":null,"zap":"","scen":"","o":[{"t":"CIO","ok":false,"w":"CIO (szef informatyki) to interesariusz wewnętrzny."},{"t":"Audyt wewnętrzny","ok":false,"w":"Audyt wewnętrzny to interesariusz wewnętrzny."},{"t":"Właściciele procesów biznesowych","ok":false,"w":"Właściciele procesów biznesowych są interesariuszami wewnętrznymi."},{"t":"Organy nadzorcze i rządowe","ok":true,"w":"Organy nadzorcze i rządowe są na Rysunku 7 wśród interesariuszy zewnętrznych."}],"fz":{"h":"Interesariusze wewnętrzni i zewnętrzni","p":"P2","pulapka":false,"n":"EN: Internal and external stakeholders","q":"Podaj przykłady interesariuszy wewnętrznych i zewnętrznych (Rysunek 7).","a":"Wewnętrzni: zarząd, CEO, CFO, CIO, CRO, właściciele procesów biznesowych, kierownicy biznesu, ryzyka, bezpieczeństwa, usług, HR, audyt wewnętrzny, użytkownicy IT. Zewnętrzni: partnerzy biznesowi, dostawcy, udziałowcy, organy nadzorcze/rządowe, użytkownicy zewnętrzni.","ex":"Skróty: CEO prezes, CFO finanse, CIO informatyka, CRO ryzyko. Wewnętrzni pracują w organizacji, zewnętrzni są poza nią: dostawcy, partnerzy, urzędy.","org":""}},"fz-A-061":{"id":"fz-A-061","typ":"egzamin","s":"PR-02-03","t":"Który z poniższych jest interesariuszem wewnętrznym według Rysunku 7?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 22"],"r":null,"zap":"","scen":"","o":[{"t":"CRO","ok":true,"w":"CRO (szef ryzyka) jest na Rysunku 7 wśród interesariuszy wewnętrznych."},{"t":"Dostawcy","ok":false,"w":"Dostawcy to interesariusze zewnętrzni."},{"t":"Partnerzy biznesowi","ok":false,"w":"Partnerzy biznesowi to interesariusze zewnętrzni."},{"t":"Udziałowcy","ok":false,"w":"Na Rysunku 7 udziałowcy są wśród interesariuszy zewnętrznych."}],"fz":{"h":"Interesariusze wewnętrzni i zewnętrzni","p":"P2","pulapka":false,"n":"EN: Internal and external stakeholders","q":"Podaj przykłady interesariuszy wewnętrznych i zewnętrznych (Rysunek 7).","a":"Wewnętrzni: zarząd, CEO, CFO, CIO, CRO, właściciele procesów biznesowych, kierownicy biznesu, ryzyka, bezpieczeństwa, usług, HR, audyt wewnętrzny, użytkownicy IT. Zewnętrzni: partnerzy biznesowi, dostawcy, udziałowcy, organy nadzorcze/rządowe, użytkownicy zewnętrzni.","ex":"Skróty: CEO prezes, CFO finanse, CIO informatyka, CRO ryzyko. Wewnętrzni pracują w organizacji, zewnętrzni są poza nią: dostawcy, partnerzy, urzędy.","org":""}},"fz-A-062":{"id":"fz-A-062","typ":"egzamin","s":"PR-02-01","t":"Jakie trzy pytania zadaje się przy każdej decyzji Ładu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 17"],"r":null,"zap":"","scen":"","o":[{"t":"Co planujemy? Co tworzymy? Co monitorujemy?","ok":false,"w":"To nawiązanie do PBRM, czyli działań Zarządzania."},{"t":"Kto odnosi korzyści? Kto ponosi ryzyko? Jakie zasoby są wymagane?","ok":true,"w":"Trzy pytania odpowiadają trzem składnikom Celu Ładu: korzyściom, ryzyku, zasobom."},{"t":"Gdzie jesteśmy teraz? Do czego dążymy? Jak się tam dostaniemy?","ok":false,"w":"To pytania faz cyklu wdrożenia, nie decyzji Ładu."},{"t":"Kto odpowiada? Kto wykonuje? Kogo informujemy?","ok":false,"w":"To pytania o role w tabeli RACI."}],"fz":{"h":"Trzy pytania decyzji Ładu","p":"P2","pulapka":false,"n":"EN: Who receives the benefits? Who bears the risk? What resources are required?","q":"Jakie trzy pytania zadaje się przy każdej decyzji Ładu?","a":"Kto odnosi korzyści? Kto ponosi ryzyko? Jakie zasoby są wymagane?","ex":"Jak przy kupnie auta dla rodziny: kto będzie z niego korzystał, kto zapłaci za ewentualną szkodę, ile to kosztuje (pieniądze, czas, garaż).","org":""}},"fz-A-063":{"id":"fz-A-063","typ":"egzamin","s":"PR-02-01","t":"Jaką postać mogą mieć korzyści według COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 17"],"r":null,"zap":"","scen":"","o":[{"t":"Wyłącznie finansową","ok":false,"w":"Korzyści mogą mieć wiele postaci, nie tylko finansową."},{"t":"Wiele postaci, np. finansową w firmach komercyjnych albo lepsze usługi publiczne w administracji","ok":true,"w":"Fiszka podkreśla, że to przykłady, a nie zamknięta lista."},{"t":"Wyłącznie oszczędności na kosztach IT","ok":false,"w":"Oszczędności to tylko jedna z możliwych postaci korzyści."},{"t":"W administracji publicznej korzyści nie występują","ok":false,"w":"W administracji korzyścią są np. lepsze usługi publiczne."}],"fz":{"h":"Korzyści w firmie i w administracji","p":"P2","pulapka":false,"n":"EN: Benefits: financial vs public services","q":"Jaką postać mają korzyści w firmie, a jaką w administracji?","a":"Mogą mieć wiele postaci, np. finansową w firmach komercyjnych albo lepsze usługi publiczne w administracji. To przykłady, nie zamknięta lista.","ex":"Sklep liczy korzyść często w złotówkach, a straż pożarna w szybkich dojazdach i uratowanych ludziach. Ale i sklep zyskuje zaufanie klientów, a straż – oszczędności.","org":""}},"fz-A-064":{"id":"fz-A-064","typ":"egzamin","s":"PR-02-04","t":"Do którego wymiaru BSC należy cel organizacji 7 „Ciągłość i dostępność usług biznesowych”?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 19"],"r":null,"zap":"","scen":"","o":[{"t":"Finanse","ok":false,"w":"Finanse to cele 1–5, np. zgodność z przepisami."},{"t":"Obszar wewnętrzny","ok":false,"w":"Obszar wewnętrzny to cele 11–15."},{"t":"Szkolenie i rozwój","ok":false,"w":"Szkolenie i rozwój to cele 16–17."},{"t":"Klient","ok":true,"w":"Wymiar Klient obejmuje cele 6–10, w tym cel 7."}],"fz":{"h":"Przykładowe cele organizacji","p":"P2","pulapka":false,"n":"EN: Enterprise goals examples","q":"Podaj przykładowe cele organizacji z każdego wymiaru BSC.","a":"Finanse: 1 Wartość inwestycji biznesowych dla interesariuszy, 4 Zgodność z przepisami. Klient: 6 Kultura usług zorientowanych na klienta, 7 Ciągłość i dostępność usług. Obszar wewnętrzny: 11 Optymalizacja funkcjonalności procesów biznesowych, 15 Zgodność z politykami wewnętrznymi. Szkolenie i rozwój: 16 Wykwalifikowany i zmotywowany personel, 17 Kultura innowacji.","ex":"Po ludzku: pieniądze i przepisy, zadowolony klient i usługi bez przerw, sprawna praca i własne regulaminy, a na koniec dobrzy ludzie i nowe pomysły.","org":""}},"fz-A-065":{"id":"fz-A-065","typ":"egzamin","s":"PR-02-05","t":"Który z poniższych jest celem związanym z informatyką, a nie celem organizacji?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 19"],"r":null,"zap":"","scen":"","o":[{"t":"Zwinność IT","ok":true,"w":"Zwinność IT to cel związany z informatyką nr 09."},{"t":"Kultura innowacji","ok":false,"w":"To cel organizacji nr 17 (Szkolenie i rozwój)."},{"t":"Ciągłość i dostępność usług biznesowych","ok":false,"w":"To cel organizacji nr 7 (Klient)."},{"t":"Zgodność z politykami wewnętrznymi","ok":false,"w":"To cel organizacji nr 15 (Obszar wewnętrzny)."}],"fz":{"h":"Przykładowe cele związane z informatyką","p":"P2","pulapka":false,"n":"EN: IT-related goals examples","q":"Podaj przykładowe cele związane z informatyką.","a":"01 Zgodność IT z biznesowymi celami strategicznymi; 07 Dostarczanie usług IT zgodnie z wymogami biznesowymi; 09 Zwinność IT; 10 Bezpieczeństwo informacji, infrastruktury przetwarzania i aplikacji; 14 Dostępność wiarygodnych i przydatnych informacji; 16 Kompetentny i zmotywowany personel biznesu i IT.","ex":"Po ludzku: IT idzie w tym samym kierunku co firma, działa tak, jak biznes potrzebuje, szybko się dostosowuje, chroni dane, daje dobre informacje i ma dobrych ludzi.","org":""}},"fz-A-066":{"id":"fz-A-066","typ":"egzamin","s":"PR-02-04","t":"Czego dotyczą relacje P i S przy celach organizacji?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 18"],"r":null,"zap":"","scen":"","o":[{"t":"Przypisania celu do Ładu (P) albo do Zarządzania (S)","ok":false,"w":"P i S opisują siłę związku, a nie podział na Ład i Zarządzanie."},{"t":"Związku celu organizacji z trzema składnikami Celu Ładu: korzyściami, ryzykiem i zasobami","ok":true,"w":"P to relacja podstawowa, S – wspierająca, słabsza."},{"t":"Związku celu organizacji z domenami PBRM","ok":false,"w":"Przy celach organizacji P i S odnoszą się do składników Celu Ładu, nie do domen."},{"t":"Kolejności wdrażania: cele P najpierw, cele S później","ok":false,"w":"P i S nie wyznaczają kolejności wdrażania."}],"fz":{"h":"Relacje P i S przy celach organizacji","p":"P1","pulapka":false,"n":"EN: P = primary, S = secondary","q":"Co oznaczają relacje P i S przy celach organizacji?","a":"Związek celu organizacji z trzema składnikami Celu Ładu: P – relacja podstawowa (primary), S – wspierająca, czyli słabsza (secondary).","ex":"Jak przyjaciele: P to najlepszy przyjaciel (mocny, główny związek), S to dobry kolega (słabszy, ale prawdziwy).","org":""}},"fz-A-067":{"id":"fz-A-067","typ":"egzamin","s":"PR-02-04","t":"Który cel organizacji ma relację P ze wszystkimi trzema składnikami Celu Ładu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 19"],"r":null,"zap":"","scen":"","o":[{"t":"Cel 7: Ciągłość i dostępność usług biznesowych","ok":false,"w":"Relację P ze wszystkimi trzema składnikami ma tylko cel 9."},{"t":"Cel 17: Kultura innowacji","ok":false,"w":"Relację P ze wszystkimi trzema składnikami ma tylko cel 9."},{"t":"Cel 4: Zgodność z przepisami","ok":false,"w":"Relację P ze wszystkimi trzema składnikami ma tylko cel 9."},{"t":"Cel 9: Świadome podejmowanie decyzji strategicznych na podstawie informacji","ok":true,"w":"Cel 9 ma relacje P, P, P – „dziewiątka trafia trzy razy w dziesiątkę”."}],"fz":{"h":"Cel organizacji 9 (P, P, P)","p":"P2","pulapka":false,"n":"EN: Enterprise goal 9: Information-based strategic decision making","q":"Który cel organizacji ma relację P ze wszystkimi trzema celami Ładu?","a":"Cel 9: Świadome podejmowanie decyzji strategicznych na podstawie informacji (P, P, P).","ex":"Haczyk: dziewiątka trafia trzy razy w dziesiątkę. Decyzje oparte na informacjach pomagają naraz korzyściom, ryzyku i zasobom – jak dobra mapa w podróży.","org":""}},"fz-A-068":{"id":"fz-A-068","typ":"egzamin","s":"PR-02-07","t":"Do czego służy Kaskada Celów w praktyce?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 20"],"r":null,"zap":"","scen":"","o":[{"t":"Wyznacza istotne i mierzalne cele na każdym poziomie i pozwala wybrać z bazy wiedzy COBIT 5 to, co służy celom organizacji","ok":true,"w":"To korzyści kaskady z fiszki; dodatkowo pokazuje, jak aktywatory pomagają osiągać cele."},{"t":"Ustala poziom zdolności każdego procesu w skali 0–5","ok":false,"w":"Poziomy zdolności ustala ocena zdolności procesu, nie Kaskada Celów."},{"t":"Przypisuje każdy proces do jednej fazy PBRM","ok":false,"w":"Kaskada nie przypisuje procesów do faz PBRM."},{"t":"Zastępuje potrzebę dostosowania COBIT 5 do organizacji","ok":false,"w":"Mapowania kaskady trzeba wręcz dostosować do swojej sytuacji."}],"fz":{"h":"Do czego służy Kaskada Celów","p":"P1","pulapka":false,"n":"EN: Benefits of the goals cascade","q":"Do czego służy Kaskada Celów w praktyce?","a":"Wyznacza istotne i mierzalne cele na każdym poziomie odpowiedzialności; wybiera z bazy wiedzy COBIT 5 to, co służy celom organizacji; pokazuje, jak aktywatory pomagają te cele osiągać.","ex":"Kaskada działa jak GPS: każdy zna swój mierzalny cel, z całej wiedzy COBIT bierze się tylko potrzebne, a widać, co pomaga dojechać do celu organizacji.","org":""}},"fz-A-069":{"id":"fz-A-069","typ":"egzamin","s":"PR-02-07","t":"Jak właściwie korzystać z tabel mapowania Kaskady Celów?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 20"],"r":null,"zap":"","scen":"","o":[{"t":"Mechanicznie – kopiując wszystkie powiązania P i S bez zmian","ok":false,"w":"Tabel nie stosuje się mechanicznie."},{"t":"Wyłącznie w organizacjach sektora publicznego","ok":false,"w":"COBIT 5 i jego kaskada są dla organizacji każdego rodzaju."},{"t":"Jako wytycznej: organizacja najpierw dostosowuje mapowania do swojej sytuacji i tworzy własną kaskadę","ok":true,"w":"Uwzględnia się priorytety, wielkość i branżę organizacji."},{"t":"Wyłącznie do oceny poziomu zdolności procesów","ok":false,"w":"Tabele mapowania służą kaskadzie celów, nie ocenie zdolności."}],"fz":{"h":"Korzystanie z tabel mapowania","p":"P1","pulapka":false,"n":"EN: Using the goals cascade carefully","q":"Jak właściwie korzystać z tabel mapowania kaskady?","a":"Nie mechanicznie, lecz jako wytycznej. Organizacja najpierw dostosowuje mapowania do swojej sytuacji (priorytety, wielkość, branża), tworząc własną kaskadę.","ex":"Jak przepis z internetu: dopasowujesz go do swojej kuchni, liczby gości i gustu, zamiast gotować dokładnie co do grama.","org":""}},"fz-A-070":{"id":"fz-A-070","typ":"egzamin","s":"PR-02-06","t":"Osiągnięcie czego wspierają cele aktywatora – ostatni etap Kaskady Celów?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 29"],"r":null,"zap":"","scen":"","o":[{"t":"Bezpośrednio wyznaczników interesariuszy","ok":false,"w":"Wyznaczniki to początek kaskady; cele aktywatora wspierają cele IT."},{"t":"Wyłącznie procesów domeny EDM","ok":false,"w":"Cele aktywatora dotyczą wszystkich aktywatorów, nie tylko procesów EDM."},{"t":"Celów związanych z informatyką","ok":true,"w":"Cele aktywatora wspierają osiągnięcie celów związanych z informatyką."},{"t":"Wyłącznie wskaźników wiodących","ok":false,"w":"Wskaźniki mierzą cele, a nie są tym, co cele aktywatora wspierają."}],"fz":{"h":"Cele aktywatora","p":"P1","pulapka":false,"n":"EN: Enabler goals","q":"Czym są cele aktywatora?","a":"Ostatnim etapem Kaskady Celów: zbiorem celów każdego aktywatora (procesów, struktur, informacji itd.), które wspierają osiągnięcie celów związanych z informatyką.","ex":"Na samym dole kaskady każdy element dostaje swoje zadanie: procedura, zespół, rejestr danych, szkolenie – jak w remoncie każda ekipa dostaje własny cel.","org":""}},"fz-A-071":{"id":"fz-A-071","typ":"egzamin","s":"PR-02-01","t":"Jak COBIT 5 definiuje ryzyko?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 93"],"r":null,"zap":"","scen":"","o":[{"t":"Jako każde zdarzenie, które już wystąpiło","ok":false,"w":"Ryzyko dotyczy prawdopodobieństwa zdarzenia, a nie zdarzeń przeszłych."},{"t":"Jako ilość ryzyka, którą organizacja jest gotowa przyjąć","ok":false,"w":"To definicja apetytu na ryzyko."},{"t":"Jako połączenie prawdopodobieństwa zdarzenia i jego skutków","ok":true,"w":"Tak definiuje ryzyko słownik COBIT 5."},{"t":"Jako wyłącznie zagrożenie techniczne systemów IT","ok":false,"w":"Definicja nie ogranicza ryzyka do zagrożeń technicznych."}],"fz":{"h":"Ryzyko i zarządzanie ryzykiem","p":"P2","pulapka":false,"n":"EN: Risk; risk management","q":"Jak COBIT 5 definiuje ryzyko i co robi zarządzanie ryzykiem?","a":"Ryzyko to połączenie prawdopodobieństwa zdarzenia i jego skutków (ISO/IEC 73). Zarządzanie ryzykiem: rozpoznać ryzyko, ocenić wpływ i prawdopodobieństwo, dobrać strategię (unikanie, ograniczenie skutków, przeniesienie na innych) w granicach apetytu na ryzyko.","ex":"Pożar w kuchni: ryzyko to szansa, że wybuchnie, razem z tym, ile szkód narobi. Gaśnica ogranicza skutki, ubezpieczenie przenosi koszt.","org":""}},"fz-A-072":{"id":"fz-A-072","typ":"egzamin","s":"PR-02-01","t":"Czym jest apetyt na ryzyko?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 68"],"r":null,"zap":"","scen":"","o":[{"t":"Ogólną ilością ryzyka, jaką organizacja jest gotowa przyjąć, realizując swoją misję","ok":true,"w":"Tak definiuje apetyt na ryzyko fiszka (FW-PL s. 68)."},{"t":"Najwyższym ryzykiem wykrytym przez audyt","ok":false,"w":"Apetyt to akceptowany poziom ryzyka, a nie wynik audytu."},{"t":"Połączeniem prawdopodobieństwa zdarzenia i jego skutków","ok":false,"w":"To definicja samego ryzyka."},{"t":"Listą ryzyk przeniesionych na ubezpieczyciela","ok":false,"w":"Przeniesienie to strategia postępowania z ryzykiem, nie apetyt."}],"fz":{"h":"Apetyt na ryzyko","p":"P2","pulapka":false,"n":"EN: Risk appetite","q":"Czym jest apetyt na ryzyko i kto go ustala?","a":"Ogólna ilość ryzyka, jaką organizacja jest gotowa przyjąć, realizując swoją misję. Ustala się go w ramach Ładu nad ryzykiem; polityki muszą go odzwierciedlać: organizacja ostrożna ma bardziej restrykcyjne polityki.","ex":"Jak na stoku: jedni jeżdżą tylko niebieskimi trasami, inni czarnymi. Rodzina sama ustala, na które trasy puszcza dzieci.","org":""}},"fz-A-073":{"id":"fz-A-073","typ":"egzamin","s":"EN-02-06,PR-02-01","t":"Jak apetyt na ryzyko wpływa na polityki organizacji?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 68"],"r":null,"zap":"","scen":"","o":[{"t":"Polityki są od apetytu na ryzyko niezależne","ok":false,"w":"Polityki muszą odzwierciedlać apetyt na ryzyko."},{"t":"Ostrożna organizacja ma mniej restrykcyjne polityki","ok":false,"w":"Jest odwrotnie: ostrożna organizacja ma polityki bardziej restrykcyjne."},{"t":"Apetyt na ryzyko ustala samodzielnie dział IT w polityce bezpieczeństwa","ok":false,"w":"Apetyt ustala się w ramach Ładu nad ryzykiem."},{"t":"Polityki muszą go odzwierciedlać – ostrożna organizacja ma bardziej restrykcyjne polityki","ok":true,"w":"Tak podaje fiszka: polityki odzwierciedlają apetyt ustalony w ramach Ładu nad ryzykiem."}],"fz":{"h":"Apetyt na ryzyko","p":"P2","pulapka":false,"n":"EN: Risk appetite","q":"Czym jest apetyt na ryzyko i kto go ustala?","a":"Ogólna ilość ryzyka, jaką organizacja jest gotowa przyjąć, realizując swoją misję. Ustala się go w ramach Ładu nad ryzykiem; polityki muszą go odzwierciedlać: organizacja ostrożna ma bardziej restrykcyjne polityki.","ex":"Jak na stoku: jedni jeżdżą tylko niebieskimi trasami, inni czarnymi. Rodzina sama ustala, na które trasy puszcza dzieci.","org":""}},"fz-A-074":{"id":"fz-A-074","typ":"egzamin","s":"PR-02-05","t":"Cele związane z informatyką opisują rezultaty IT potrzebne organizacji. Czym jest rezultat?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 18"],"r":null,"zap":"","scen":"","o":[{"t":"Osobnym etapem kaskady między celami IT a celami aktywatorów","ok":false,"w":"Osobnego etapu „rezultaty IT” w kaskadzie nie ma."},{"t":"Wytworem, istotną zmianą stanu lub poprawą zdolności","ok":true,"w":"Tak fiszka definiuje rezultat (outcome)."},{"t":"Inną nazwą celu organizacji","ok":false,"w":"Cele organizacji to wcześniejszy krok kaskady, a nie rezultaty IT."},{"t":"Wskaźnikiem wiodącym aktywatora","ok":false,"w":"Wskaźniki wiodące dotyczą cyklu życia i dobrych praktyk, nie definiują rezultatu."}],"fz":{"h":"Cele związane z informatyką a rezultaty IT","p":"P2","pulapka":true,"n":"EN: IT-related goals represent IT-related outcomes","q":"Jak cele związane z informatyką mają się do „rezultatów IT”?","a":"Cele związane z IT opisują rezultaty IT, których organizacja potrzebuje do swoich celów (rezultat: wytwór, istotna zmiana stanu lub poprawa zdolności). To krok kaskady przed celami aktywatorów, a nie osobny etap „rezultaty IT”.","ex":"Cel szkoły: lepsze matury. Od pracowni potrzeba sprawnych komputerów na lekcjach. To zapisujesz jako cel pracowni, bez osobnego etapu.","org":""}},"fz-B-001":{"id":"fz-B-001","typ":"egzamin","s":"PR-01-04","t":"Do której domeny Zarządzania należą m.in. strategia, architektura korporacyjna, portfel, ryzyko i bezpieczeństwo?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 33"],"r":null,"zap":"","scen":"","o":[{"t":"APO – Dostosuj, Planuj i Organizuj","ok":true,"w":"Tak: APO to domena planowania (13 procesów), w tym strategia, architektura, portfel, ryzyko i bezpieczeństwo."},{"t":"BAI – Twórz, Nabywaj i Wdrażaj","ok":false,"w":"BAI obejmuje programy i projekty, wymagania, rozwiązania i zmiany, a nie strategię."},{"t":"DSS – Dostarczaj, Obsługuj i Wspieraj","ok":false,"w":"DSS to codzienność: eksploatacja, incydenty, problemy i ciągłość."},{"t":"EDM – Oszacuj, Kieruj i Monitoruj","ok":false,"w":"EDM to domena Ładu, a nie Zarządzania."}],"fz":{"h":"APO","p":"P2","pulapka":false,"n":"≠ TŁUMACZENIE · egzamin: Dostosuj, Planuj i Organizuj · podr.: Dopasowanie, planowanie i organizacja · EN: Align, Plan and Organise","q":"Co obejmuje domena APO? / Która domena: strategia, architektura, innowacje, portfel, budżet, HR, relacje, umowy, dostawcy, jakość, ryzyko, bezpieczeństwo?","a":"Domena Zarządzania (Planuj): 13 procesów, m.in. strategia, architektura, portfel, ryzyko, bezpieczeństwo.\nAPO (Dostosuj, Planuj i Organizuj), APO01–APO13; APO01 to zarządzanie strukturą ramową zarządzania IT.","ex":"Planowanie przed działaniem, jak przed remontem: pomysł, budżet, ekipa, umowy z fachowcami, co może pójść źle. Haczyk: APO – „A Plan Obmyśl”; 13 procesów, najwięcej ze wszystkich.\nWszystko, co robisz przed remontem: pomysł, projekt, budżet, ludzie, umowy, wybór fachowców, jakość, ryzyko i zamki w drzwiach. Planowanie = APO, 13 procesów.","org":"APO12 ocena ryzyka przerw usług."}},"fz-B-002":{"id":"fz-B-002","typ":"egzamin","s":"PR-01-04","t":"Ile procesów obejmuje domena BAI (Twórz, Nabywaj i Wdrażaj)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 33"],"r":null,"zap":"","scen":"","o":[{"t":"10","ok":true,"w":"Tak: BAI01–BAI10."},{"t":"13","ok":false,"w":"Tyle procesów ma APO, najliczniejsza domena."},{"t":"6","ok":false,"w":"Tyle procesów ma DSS."},{"t":"5","ok":false,"w":"Tyle procesów ma domena Ładu EDM."}],"fz":{"h":"BAI","p":"P2","pulapka":false,"n":"≠ TŁUMACZENIE · egzamin: Twórz, Nabywaj i Wdrażaj · podr.: Budowanie, nabywanie i wdrażanie · EN: Build, Acquire and Implement","q":"Co obejmuje domena BAI? / Która domena: programy i projekty, wymagania, rozwiązania, pojemność, zmiany, wiedza, aktywa, konfiguracja?","a":"Domena Zarządzania (Twórz): 10 procesów, m.in. programy i projekty, wymagania, rozwiązania, zmiany.\nBAI (Twórz, Nabywaj i Wdrażaj), BAI01–BAI10; m.in. BAI05 wdrażanie zmian organizacyjnych, BAI07 akceptacja zmian i przejście, BAI09 zarządzanie zasobami (aktywami).","ex":"Ekipa remontowa: według planu buduje albo kupuje nowe rzeczy i je wprowadza, np. nową kuchnię. Haczyk: BAI – „Buduj Albo Importuj”; 10 procesów.\nSam remont: prowadzisz roboty, spisujesz, czego chcesz, budujesz, wprowadzasz zmiany, odbierasz pracę i spisujesz, co masz w domu (aktywa = posiadane rzeczy). Budowa = BAI, 10 procesów.","org":"BAI03 rozbudowa systemu zgłoszeń."}},"fz-B-003":{"id":"fz-B-003","typ":"egzamin","s":"PR-01-04","t":"Która domena obejmuje m.in. eksploatację, zgłoszenia i incydenty, problemy oraz ciągłość?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 33"],"r":null,"zap":"","scen":"","o":[{"t":"DSS – Dostarczaj, Obsługuj i Wspieraj","ok":true,"w":"Tak: DSS to codzienna obsługa, 6 procesów (DSS01–DSS06)."},{"t":"BAI – Twórz, Nabywaj i Wdrażaj","ok":false,"w":"BAI buduje lub nabywa rozwiązania i wdraża zmiany, a nie prowadzi bieżącej obsługi."},{"t":"MEA – Monitoruj, Oszacuj i Oceń","ok":false,"w":"MEA monitoruje wydajność, zgodność i kontrolę wewnętrzną."},{"t":"APO – Dostosuj, Planuj i Organizuj","ok":false,"w":"APO to planowanie: strategia, architektura, portfel, ryzyko."}],"fz":{"h":"DSS","p":"P2","pulapka":false,"n":"≠ TŁUMACZENIE · egzamin: Dostarczaj, Obsługuj i Wspieraj · podr.: Dostarczanie, obsługa i wsparcie · EN: Deliver, Service and Support","q":"Co obejmuje domena DSS? / Która domena: eksploatacja, zgłoszenia i incydenty, problemy, ciągłość, usługi bezpieczeństwa, kontrole procesów biznesowych?","a":"Domena Zarządzania (Wykonuj): 6 procesów, m.in. eksploatacja, incydenty, problemy, ciągłość.\nDSS (Dostarczaj, Obsługuj i Wspieraj), DSS01–DSS06.","ex":"Codzienność jak w warsztacie samochodowym: auta mają jeździć, a gdy coś się zepsuje – szybka naprawa, szukanie przyczyny, auto zastępcze. Haczyk: DSS – „Dzień w Dzień Serwis”; 6 procesów.\nŻycie w gotowym domu: codzienna obsługa, naprawa awarii, szukanie przyczyny przecieku, plan na wypadek pożaru, zamki i alarm. Codzienność = DSS, 6 procesów.","org":"DSS02 obsługa zgłoszeń i awarii."}},"fz-B-004":{"id":"fz-B-004","typ":"egzamin","s":"PR-01-04","t":"Czego dotyczą trzy procesy domeny MEA (Monitoruj, Oszacuj i Oceń)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 33"],"r":null,"zap":"","scen":"","o":[{"t":"Wydajności i zgodności, systemu kontroli wewnętrznej oraz zgodności z wymogami zewnętrznymi","ok":true,"w":"Tak: to MEA01, MEA02 i MEA03."},{"t":"Oceny, kierowania i monitorowania kierunku wyznaczonego dla organizacji","ok":false,"w":"To działania Ładu w domenie EDM."},{"t":"Incydentów, problemów i ciągłości działania","ok":false,"w":"To procesy domeny DSS."},{"t":"Strategii, ryzyka i bezpieczeństwa","ok":false,"w":"To procesy domeny APO."}],"fz":{"h":"MEA","p":"P2","pulapka":false,"n":"≠ TŁUMACZENIE · egzamin: Monitoruj, Oszacuj i Oceń · podr.: Monitorowanie, ocena i oszacowanie · EN: Monitor, Evaluate and Assess","q":"Co obejmuje domena MEA? / Która domena: wydajność i zgodność, system kontroli wewnętrznej, zgodność z wymogami zewnętrznymi?","a":"Domena Zarządzania (Monitoruj): 3 procesy: wydajność i zgodność, system kontroli wewnętrznej, zgodność z wymogami zewnętrznymi.\nMEA (Monitoruj, Oszacuj i Oceń): MEA01, MEA02, MEA03.","ex":"Kontrola jak u kierowcy: czy auto jedzie dobrze (wyniki), czy hamulce działają (własne zabezpieczenia), czy są przegląd i OC (przepisy z zewnątrz). Haczyk: MEA – „Mierz, Egzaminuj, Audytuj”; 3 procesy.\nTrzy kontrole jak u kierowcy: czy auto jedzie dobrze (wyniki), czy hamulce działają (kontrola wewnętrzna), czy są przegląd i OC (przepisy z zewnątrz). MEA, 3 procesy.","org":"MEA01 comiesięczny raport z liczbami."}},"fz-B-005":{"id":"fz-B-005","typ":"egzamin","s":"PR-01-03","t":"Z jaką normą zgodnie Ład ocenia, kieruje i monitoruje w domenie EDM?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 32"],"r":null,"zap":"","scen":"","o":[{"t":"ISO/IEC 38500","ok":true,"w":"Tak: karta wskazuje ISO/IEC 38500, normę o nadzorze nad IT."},{"t":"ISO/IEC 15504","ok":false,"w":"To norma oceny procesów, na której opiera się ocena zdolności, a nie model Ładu."},{"t":"ISO/IEC 27000","ok":false,"w":"To seria norm o bezpieczeństwie informacji, źródło szczegółowych działań."},{"t":"PRINCE2","ok":false,"w":"To metodyka zarządzania projektami, źródło szczegółowych działań."}],"fz":{"h":"EDM","p":"P1","pulapka":false,"n":"≠ TŁUMACZENIE · egzamin: Oszacuj, Kieruj i Monitoruj · podr.: Ocena, Kierowanie i Monitorowanie · EN: Evaluate, Direct and Monitor","q":"Co obejmuje domena EDM?","a":"Domena Ładu: 5 procesów (EDM01–05). Ład ocenia, kieruje i monitoruje, zgodnie z ISO/IEC 38500.","ex":"Rola właściciela restauracji: ocenia sytuację, wyznacza kierunek, sprawdza efekty, ale sam nie gotuje. Haczyk: 5 procesów EDM jak 5 palców ręki szefa. ISO/IEC 38500 – norma o nadzorze nad IT.","org":"kierownictwo ocenia raport ryzyka przerw co miesiąc."}},"fz-B-006":{"id":"fz-B-006","typ":"egzamin","s":"PR-02-14","t":"Z jakich czterech obszarów działań składa się Zarządzanie (PBRM)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 32"],"r":null,"zap":"","scen":"","o":[{"t":"Planuj, Twórz (Altkom: Wytwarzaj), Wykonuj i Monitoruj","ok":true,"w":"Tak: to cztery obszary Zarządzania powiązane z APO, BAI, DSS i MEA."},{"t":"Oszacuj, Kieruj i Monitoruj","ok":false,"w":"To trzy działania Ładu (EDM), nie Zarządzania."},{"t":"Dostosuj, Planuj i Organizuj","ok":false,"w":"To nazwa jednej domeny (APO), a nie całego Zarządzania."},{"t":"Planowanie, projektowanie, budowanie i użytkowanie","ok":false,"w":"To początkowe etapy cyklu życia aktywatora."}],"fz":{"h":"PBRM","p":"P1","pulapka":true,"n":"≠ TŁUMACZENIE · egzamin: Planuj, Wytwarzaj, Wykonuj i Monitoruj (Altkom) / Planuj, Twórz, Wykonuj i Monitoruj (SP1) · podr.: Planowanie, Budowanie, Uruchamianie i Monitorowanie · EN: Plan, Build, Run and Monitor","q":"Z jakich działań składa się Zarządzanie? / Jakie działania obejmują Ład i Zarządzanie?","a":"Planuj, Wytwarzaj, Wykonuj i Monitoruj (zestawienie Altkom) / Planuj, Twórz, Wykonuj i Monitoruj (SP1) – zgodnie z kierunkiem Ładu. To cztery główne obszary działań Zarządzania, z którymi powiązano domeny APO, BAI, DSS i MEA.\nŁad: Oszacuj, Kieruj i Monitoruj (EDM). Zarządzanie: Planuj, Wytwarzaj (w SP1: Twórz), Wykonuj i Monitoruj (PBRM).","ex":"Jak dom: projekt, budowa, codzienne mieszkanie i naprawy, przeglądy – a kierunek wskazuje inwestor, czyli Ład. To obszary działań, nie kolejne etapy: w procesie każdej domeny się planuje, realizuje i sprawdza.\nŁad ma trzy czasowniki: oceń, kieruj, sprawdzaj (EDM). Zarządzanie ma cztery: zaplanuj, zbuduj, prowadź, sprawdzaj (PBRM). Oba kończą się sprawdzaniem, ale na innym piętrze.","org":""}},"fz-B-007":{"id":"fz-B-007","typ":"egzamin","s":"EN-02-10","t":"Czym różni się praktyka od działania w procesie COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 70"],"r":null,"zap":"","scen":"","o":[{"t":"Praktyka mówi, co trzeba robić, a działanie – jak to zrobić (jako propozycja)","ok":true,"w":"Tak: praktyka to CO, działanie to JAK, a szczegóły bierze się z innych standardów."},{"t":"Praktyka mówi, jak to zrobić, a działanie – co trzeba robić","ok":false,"w":"Odwrotnie: praktyka to CO, działanie to JAK."},{"t":"Działanie jest obowiązkowe, a praktyka jest tylko propozycją","ok":false,"w":"Działanie to propozycja, nie obowiązek."},{"t":"Praktyka i działanie to synonimy","ok":false,"w":"Karta wyraźnie je rozróżnia: CO kontra JAK."}],"fz":{"h":"Praktyka, działanie, szczegółowe działanie","p":"P1","pulapka":true,"n":"egzamin: praktyka · działanie · podr.: praktyka · działanie · EN: practice · activity · detailed activity","q":"Czym się różnią?","a":"Praktyka: co trzeba robić w procesie. Działanie: jak to zrobić (propozycja, nie obowiązek). Szczegółowe działania bierze się z innych standardów (ITIL, ISO/IEC 27000, PRINCE2).","ex":"Jak w kuchni: praktyka mówi CO zrobić („upiecz ciasto”), działanie – JAK, krok po kroku, a dokładną recepturę bierzesz z książki kucharskiej, czyli innego standardu.","org":"praktyka DSS02.02 rejestrowanie zgłoszeń."}},"fz-B-008":{"id":"fz-B-008","typ":"egzamin","s":"EN-01-01","t":"Jak COBIT 5 definiuje proces?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 69"],"r":null,"zap":"","scen":"","o":[{"t":"Zbiór praktyk ukierunkowanych przez polityki i procedury, który pobiera wejścia, przetwarza je i dostarcza wyniki","ok":true,"w":"Tak: to definicja procesu; proces ma też cele, mierniki, praktyki, działania i RACI."},{"t":"Ogólna deklaracja działania organu Ładu lub kierownictwa w danym procesie","ok":false,"w":"To definicja praktyki, nie procesu."},{"t":"Ogólny cel, któremu służy proces, opisany w PRM","ok":false,"w":"To przeznaczenie procesu."},{"t":"Opis pożądanego wyniku, np. wytworu lub istotnej zmiany stanu","ok":false,"w":"To cel procesu."}],"fz":{"h":"Proces","p":"P1","pulapka":true,"n":"egzamin: proces · podr.: proces · EN: process","q":"Jak COBIT 5 definiuje proces? / Jak brzmi definicja procesu w COBIT 5?","a":"Zbiór praktyk z wejściami i wyjściami, które osiągają cele procesu; ma cele, mierniki, praktyki, działania i RACI.\nZbiór praktyk ukierunkowanych przez polityki i procedury organizacji, który pobiera wejścia z różnych źródeł (również innych procesów), przetwarza je i dostarcza wyniki (np. produkty, usługi).","ex":"Proces to przepis: składniki na wejściu (mąka, jajka), kroki (praktyki), ciasto na wyjściu. Wiadomo też, kto piecze (RACI) i po czym poznać, że wyszło (cele, mierniki).\nPiekarnia: według zasad lokalu (polityki, procedury) bierze mąkę od dostawcy lub z magazynu (wejścia), przerabia ją i wydaje chleb klientom (wyniki).","org":"DSS02 Zarządzanie zgłoszeniami serwisowymi i incydentami."}},"fz-B-009":{"id":"fz-B-009","typ":"egzamin","s":"EN-02-24","t":"Co opisuje przeznaczenie procesu (podr.: cel procesu)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 33","FW-PL s. 69","FW-PL s. 43"],"r":null,"zap":"","scen":"","o":[{"t":"Konkretne pożądane wyniki procesu wraz z miernikami","ok":false,"w":"To cele procesu; karta ostrzega, by nie mylić ich z przeznaczeniem."},{"t":"Ogólny cel: po co proces istnieje i jakie są spodziewane rezultaty jego skutecznej realizacji","ok":true,"w":"Tak: to jedno zdanie „po co ten proces istnieje”."},{"t":"Kto wykonuje, rozlicza, jest konsultowany i informowany","ok":false,"w":"To tabela RACI."},{"t":"Konieczne i wystarczające kroki do wdrożenia praktyki","ok":false,"w":"To działania procesu."}],"fz":{"h":"Przeznaczenie procesu","p":"P2","pulapka":true,"n":"≠ TŁUMACZENIE · egzamin: przeznaczenie procesu · podr.: cel procesu · EN: process purpose","q":"Co opisuje przeznaczenie procesu w PRM? / Czym jest przeznaczenie procesu?","a":"Ogólny cel, któremu służy proces (opis procesu w Referencyjnym Modelu Procesu).\nOgólny cel procesu: po co istnieje i jakie są spodziewane rezultaty jego skutecznej realizacji (podr. cel procesu). Nie myl z celami procesu – to konkretne pożądane wyniki z miernikami.","ex":"Jedno zdanie „po co ten proces istnieje”, jak napis nad wejściem: „Pogotowie – ratujemy życie”. PRM to katalog wszystkich 37 procesów COBIT 5.\nJak tablica nad remizą: „Jesteśmy, by ratować ludzi i mienie” – po co istniejemy i co dajemy. Pułapka: podręcznik nazywa to „celem procesu”.","org":"DSS02: szybkie przywracanie usług i obsługa próśb."}},"fz-B-010":{"id":"fz-B-010","typ":"egzamin","s":"PR-02-14","t":"Czym jest Zarządzanie według COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 14"],"r":null,"zap":"","scen":"","o":[{"t":"Planowaniem, budowaniem, uruchamianiem i monitorowaniem działań zgodnie z kierunkiem wyznaczonym przez organ Ładu","ok":true,"w":"Tak: to definicja Zarządzania (PBRM)."},{"t":"Oceną potrzeb interesariuszy, wyznaczaniem kierunku i monitorowaniem wyników","ok":false,"w":"To definicja Ładu."},{"t":"Sprawdzaniem przez organ Ładu, w jakim stopniu kierunek wcielono w życie","ok":false,"w":"To monitorowanie w domenie Ładu."},{"t":"Ustalaniem apetytu na ryzyko i pilnowaniem, by go nie przekroczyć","ok":false,"w":"To EDM03, proces Ładu."}],"fz":{"h":"Zarządzanie","p":"P1","pulapka":true,"n":"≠ TŁUMACZENIE · egzamin: Zarządzanie · podr.: zarządzanie · EN: management","q":"Czym jest Zarządzanie? / Jak brzmi definicja Zarządzania?","a":"Planowanie, tworzenie (budowanie), wykonywanie i monitorowanie działań zgodnie z kierunkiem Ładu. Zwykle kadra kierownicza pod przewodnictwem dyrektora generalnego (CEO).\nPlanowanie, budowanie, uruchamianie i monitorowanie działań zgodnie z kierunkiem wyznaczonym przez organ Ładu, aby osiągnąć cele organizacji.","ex":"Szef kuchni z kucharzami: gotują według karty ustalonej przez właściciela (Ład). Ład mówi CO i DOKĄD, Zarządzanie – JAK to zrobić na co dzień.\nEkipa planuje dom, buduje go, zapewnia codzienne użytkowanie i utrzymanie, a potem sprawdza wyniki – tak, jak zdecydował inwestor (Ład). Run = bieżące działanie, nie tylko oddanie do użytku. Haczyk: PBRM – Plan, Build, Run, Monitor.","org":"dyrektor IT i zespół wdrażają procedurę."}},"fz-B-011":{"id":"fz-B-011","typ":"egzamin","s":"PR-02-14","t":"Co według definicji COBIT 5 robi Ład?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 14"],"r":null,"zap":"","scen":"","o":[{"t":"Planuje, buduje, uruchamia i monitoruje działania","ok":false,"w":"To Zarządzanie (PBRM)."},{"t":"Na co dzień rozpoznaje, ocenia i ogranicza ryzyko IT","ok":false,"w":"To APO12, proces Zarządzania."},{"t":"Ocenia potrzeby interesariuszy, wyznacza kierunek przez priorytety i decyzje oraz monitoruje wyniki i zgodność","ok":true,"w":"Tak: to trzy ruchy Ładu: oceń, kieruj, monitoruj."},{"t":"Buduje lub nabywa rozwiązania i wdraża zmiany","ok":false,"w":"To domena BAI w Zarządzaniu."}],"fz":{"h":"Ład","p":"P1","pulapka":true,"n":"≠ TŁUMACZENIE · egzamin: Ład · podr.: nadzór · EN: governance","q":"Czym jest Ład? / Jak brzmi definicja Ładu?","a":"Ocena potrzeb interesariuszy, wyznaczanie kierunku przez priorytety i decyzje oraz monitorowanie wyników i zgodności. Zwykle zarząd pod przewodnictwem prezesa.\nŁad zapewnia, że oceniono potrzeby, warunki i możliwe opcje interesariuszy, by ustalić wyważone (zrównoważone) cele organizacji; wyznacza kierunek przez priorytety i decyzje; monitoruje wyniki (wydajność) i zgodność z kierunkiem i celami.","ex":"Właściciel restauracji: pyta gości i wspólników, czego chcą, ustala, co najważniejsze, i sprawdza wyniki. Interesariusz = każdy, komu na organizacji zależy.\nTrzy ruchy właściciela: wysłuchaj, czego chcą goście i wspólnicy (oceń), wybierz kierunek (kieruj), sprawdzaj, czy kuchnia go trzyma (monitoruj). Interesariusz = każdy, komu zależy.","org":"kierownictwo KG zatwierdza progi ryzyka."}},"fz-B-012":{"id":"fz-B-012","typ":"egzamin","s":"PR-02-14","t":"Kto zwykle odpowiada za Ład?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 14"],"r":null,"zap":"","scen":"","o":[{"t":"Zarząd pod przywództwem prezesa (przewodniczącego)","ok":true,"w":"Tak: Ład sprawuje zarząd z prezesem."},{"t":"Kadra zarządzająca pod przywództwem CEO","ok":false,"w":"Ona odpowiada za Zarządzanie."},{"t":"Dyrektor IT ze swoim zespołem","ok":false,"w":"W przykładzie z fiszek dyrektor IT i zespół wdrażają procedurę, czyli działają w Zarządzaniu."},{"t":"Interesariusze zewnętrzni, np. organy regulacyjne","ok":false,"w":"Interesariusze zgłaszają potrzeby, ale Ład sprawuje zarząd."}],"fz":{"h":"Kto odpowiada za Ład i Zarządzanie","p":"P1","pulapka":false,"n":"EN: Board under the chair; executive management under the CEO","q":"Kto zwykle odpowiada za Ład, a kto za Zarządzanie?","a":"Ład: zarząd pod przywództwem prezesa (przewodniczącego). Zarządzanie: kadra zarządzająca pod przywództwem CEO.","ex":"Klub sportowy: zarząd z prezesem ustala, dokąd zmierza klub (Ład), a dyrektor z trenerami prowadzi drużynę na co dzień (Zarządzanie). CEO = dyrektor generalny.","org":""}},"fz-B-013":{"id":"fz-B-013","typ":"egzamin","s":"PR-02-15","t":"Jak przebiega przepływ w kluczowych obszarach Ładu i Zarządzania (Rysunek 15)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 32"],"r":null,"zap":"","scen":"","o":[{"t":"Potrzeby biznesowe → Zarządzanie → Ład, który wykonuje zaplanowane działania","ok":false,"w":"Odwrotnie: Ład wyznacza kierunek, a Zarządzanie go realizuje."},{"t":"Ład → Zarządzanie, bez informacji zwrotnej","ok":false,"w":"Informacje zwrotne z Zarządzania wracają do Ładu; koło się zamyka."},{"t":"Zarządzanie → potrzeby biznesowe → Ład","ok":false,"w":"Przepływ zaczyna się od potrzeb biznesowych trafiających do Ładu."},{"t":"Potrzeby biznesowe → Ład (Oszacuj, Kieruj, Monitoruj) → Zarządzanie (Planuj, Twórz, Wykonuj, Monitoruj) → informacje zwrotne do Ładu","ok":true,"w":"Tak: tak wygląda Rysunek 15."}],"fz":{"h":"Przepływ Ład–Zarządzanie (Rysunek 15)","p":"P1","pulapka":false,"n":"EN: Key governance and management areas","q":"Opisz przepływ w kluczowych obszarach Ładu i Zarządzania (Rysunek 15).","a":"Potrzeby biznesowe → Ład: Oszacuj, Kieruj, Monitoruj → Zarządzanie: Planuj (APO), Twórz (BAI), Wykonuj (DSS), Monitoruj (MEA) → informacje zwrotne z Zarządzania wracają do Ładu.","ex":"Jak sztafeta: potrzeby firmy trafiają do zarządu, ten wskazuje kierunek, kierownicy planują, budują, prowadzą i sprawdzają, a raporty wracają do zarządu. Koło się zamyka.","org":""}},"fz-B-014":{"id":"fz-B-014","typ":"egzamin","s":"PR-02-15","t":"Co oznacza „monitorowanie” w domenie Ładu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 32"],"r":null,"zap":"","scen":"","o":[{"t":"Sprawdzanie przez organ Ładu, w jakim stopniu Zarządzanie wcieliło w życie wyznaczony kierunek","ok":true,"w":"Tak: Ład porównuje efekt z kierunkiem, sam nie wykonuje pracy."},{"t":"Comiesięczny raport z liczbami przygotowany w procesie MEA01","ok":false,"w":"To monitorowanie w Zarządzaniu (MEA), nie w Ładzie."},{"t":"Monitorowanie i ocena całego systemu kontroli wewnętrznej","ok":false,"w":"To proces Zarządzania MEA02."},{"t":"Codzienna obsługa zgłoszeń i incydentów","ok":false,"w":"To DSS02, proces Zarządzania."}],"fz":{"h":"Monitorowanie w domenie Ładu","p":"P2","pulapka":false,"n":"EN: Monitor in governance domain","q":"Co oznacza „monitorowanie” w domenie Ładu?","a":"Działania, w których organ Ładu sprawdza, w jakim stopniu wyznaczony kierunek został wcielony w życie przez Zarządzanie.","ex":"Jak inwestor, który zagląda na budowę i sprawdza, czy ekipa robi to, co zlecił. Sam nie kładzie cegieł, tylko porównuje efekt z planem.","org":""}}
