z":["FW-PL s. 77"],"r":null,"zap":"","scen":"","o":[{"t":"Za rozwój i prowadzenie usług dla konkretnego klienta lub grupy klientów","ok":false,"w":"To kierownik ds. usług."},{"t":"Za zdolność organizacji do utrzymania funkcji krytycznych po zdarzeniach zakłócających","ok":true,"w":"Tak opisuje tę rolę fiszka."},{"t":"Za ryzyko i przepisy dotyczące prywatności","ok":false,"w":"To dyrektor ds. prywatności."},{"t":"Za wszystkie aspekty zarządzania ryzykiem w organizacji","ok":false,"w":"To CRO."}],"fz":{"h":"Kierownik ds. usług i kierownik ds. ciągłości","p":"P2","pulapka":false,"n":"EN: Service Manager; Business Continuity Manager","q":"Czym zajmują się kierownik ds. usług i kierownik ds. ciągłości działalności biznesowej?","a":"Kierownik ds. usług: rozwój, wdrożenie, ocena i prowadzenie produktów i usług dla konkretnego klienta lub grupy klientów. Kierownik ds. ciągłości: zdolność organizacji do utrzymania funkcji krytycznych po zdarzeniach zakłócających.","ex":"Kierownik sali dba o gości jednego lokalu. Ktoś inny ma plan, co robić, gdy wysiądzie prąd albo zaleje kuchnię.","org":""}},"fz-C-080":{"id":"fz-C-080","typ":"egzamin","s":"EN-02-13","t":"Czym zajmuje się dyrektor ds. prywatności (ds. ochrony danych)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 76–77"],"r":null,"zap":"","scen":"","o":[{"t":"Ryzykiem i przepisami o prywatności oraz wdrażaniem polityk prywatności","ok":true,"w":"Tak opisuje tę rolę fiszka."},{"t":"Bezpieczeństwem informacji całej organizacji we wszystkich formach","ok":false,"w":"To CISO, najwyższy szczebel bezpieczeństwa."},{"t":"Projektowaniem, nadzorem, oceną i prowadzeniem bezpieczeństwa informacji","ok":false,"w":"To kierownik ds. bezpieczeństwa informacji."},{"t":"Audytami wewnętrznymi","ok":false,"w":"To zadanie Audytu."}],"fz":{"h":"CISO, kierownik ds. bezpieczeństwa informacji, dyrektor ds. prywatności","p":"P2","pulapka":false,"n":"EN: CISO; Information Security Manager; Privacy Officer","q":"CISO, kierownik ds. bezpieczeństwa informacji i dyrektor ds. prywatności – czym się różnią?","a":"CISO: najwyższy szczebel, bezpieczeństwo informacji całej organizacji we wszystkich formach. Kierownik ds. bezpieczeństwa informacji: projektuje, nadzoruje, ocenia i prowadzi bezpieczeństwo. Dyrektor ds. prywatności (też ds. ochrony danych): ryzyko i przepisy o prywatności, wdrażanie polityk prywatności.","ex":"W straży: komendant odpowiada za bezpieczeństwo wszystkich informacji jednostki, dowódca zmiany prowadzi bieżące działania ochronne, a inspektor pilnuje, by nikt nie czytał cudzych danych osobowych.","org":""}},"fz-D-001":{"id":"fz-D-001","typ":"egzamin","s":"IM-01-01,IM-02-05","t":"Który krąg cyklu życia wdrożenia zajmuje się zachowaniem ludzi i kulturą?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 37"],"r":null,"zap":"","scen":"","o":[{"t":"Zarządzanie programem – krąg zewnętrzny","ok":false,"w":"Krąg zewnętrzny kieruje całością programu, a nie kulturą."},{"t":"Cykl ciągłego doskonalenia – krąg wewnętrzny","ok":false,"w":"Krąg wewnętrzny to samo ulepszanie, a nie ludzka strona zmiany."},{"t":"Żaden krąg – kulturą zajmuje się tylko faza 7","ok":false,"w":"Kulturą zajmuje się osobny krąg, obecny w każdej fazie."},{"t":"Aktywowanie zmiany – krąg środkowy","ok":true,"w":"Fiszka: krąg środkowy dotyczy ludzi, ich zachowań, nawyków i kultury."}],"fz":{"h":"Aktywowanie zmiany","p":"P1","pulapka":true,"n":"egzamin: aktywowanie zmiany · podr.: umożliwienie zmian · EN: change enablement","q":"Na czym polega Aktywowanie zmiany i który to krąg? | Który komponent cyklu dotyczy zachowania i kultury?","a":"Krąg środkowy cyklu wdrożenia: ludzie, ich zachowania i nawyki (kultura), motywowanie zaangażowanych do przyjęcia zmiany, plan komunikacji dla każdej fazy. | Aktywowanie zmiany (podr. umożliwienie zmian / wdrożenie zmiany).","ex":"Nowa kuchnia nic nie da, jeśli domownicy dalej gotują po staremu. Ten krąg przekonuje ludzi do zmiany i na bieżąco mówi im, co się dzieje. | Kultura to „u nas tak się robi”, czyli nawyki ludzi. Ludzie są pośrodku: środkowy pierścień leży między samym ulepszaniem a kierowaniem całością.","org":"lider zmiany w każdej komendzie wojewódzkiej i comiesięczny komunikat."}},"fz-D-002":{"id":"fz-D-002","typ":"egzamin","s":"IM-02-05","t":"Na czym polega Aktywowanie zmiany?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 37"],"r":null,"zap":"","scen":"","o":[{"t":"Na zarządzaniu ludzką stroną zmiany i motywowaniu interesariuszy, z planem komunikacji dla każdej fazy","ok":true,"w":"Tak opisuje to fiszka: zachowania, nawyki, kultura i plan komunikacji."},{"t":"Na planowaniu budżetu i harmonogramu całego programu","ok":false,"w":"Kierowanie programem należy do kręgu zarządzania programem."},{"t":"Na formalnej ocenie zdolności procesów według ISO/IEC 15504","ok":false,"w":"Ocena zdolności dotyczy procesów, a nie ludzkiej strony zmiany."},{"t":"Na jednorazowym szkoleniu pracowników po zakończeniu wdrożenia","ok":false,"w":"Komunikacja i motywowanie trwają w każdej fazie, a nie raz na końcu."}],"fz":{"h":"Aktywowanie zmiany","p":"P1","pulapka":false,"n":"EN: Change enablement","q":"Na czym polega Aktywowanie zmiany?","a":"Na zarządzaniu ludzką stroną zmiany (zachowania, nawyki, kultura) i motywowaniu zaangażowanych (interesariuszy), by ją przyjęli; z planem komunikacji dla każdej fazy (treść, sposób, adresaci).","ex":"Jak zdrowa dieta całej rodziny: kupić warzywa łatwo, trudniej przekonać domowników, żeby je jedli. Plan komunikacji: co, jak i komu mówimy na każdym etapie.","org":""}},"fz-D-003":{"id":"fz-D-003","typ":"egzamin","s":"IM-01-01","t":"Które trzy komponenty tworzą cykl życia wdrożenia?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 37–38","FW-PL s. 37"],"r":null,"zap":"","scen":"","o":[{"t":"Zasady, polityki i struktury ramowe","ok":false,"w":"To nazwa jednego z siedmiu aktywatorów, a nie komponenty cyklu wdrożenia."},{"t":"Uzasadnienie biznesowe, mapa drogowa, ocena zdolności","ok":false,"w":"To produkty lub działania wewnątrz faz, a nie trzy pierścienie."},{"t":"Zarządzanie programem, Aktywowanie zmiany, cykl ciągłego doskonalenia","ok":true,"w":"To trzy pierścienie: zewnętrzny, środkowy i wewnętrzny."},{"t":"Przewodnik Asesora, Przewodnik Samooceny, Model Oceny Procesu","ok":false,"w":"To trzy przewodniki programu oceny, a nie komponenty wdrożenia."}],"fz":{"h":"Cykl życia wdrożenia","p":"P1","pulapka":false,"n":"egzamin: cykl życia wdrożenia · podr.: cykl życia wdrożenia · EN: implementation life cycle","q":"Z czego składa się cykl życia wdrożenia? | Podaj trzy wzajemnie powiązane komponenty Cyklu Życia Wdrożenia.","a":"7 faz i 3 kręgi: zarządzanie programem (zewnętrzny), aktywowanie zmiany (środkowy), cykl ciągłego doskonalenia (wewnętrzny). To nie jednorazowy projekt. | 1. Główny cykl życia ciągłego doskonalenia (pierścień wewnętrzny). 2. Aktywowanie zmiany (środkowy) – zachowanie i kultura. 3. Zarządzanie programem (zewnętrzny).","ex":"Jak dbanie o dom: remont nie jest raz na zawsze. 7 kroków i 3 pierścienie jak tarcza: zewnętrzny – kierownik remontu, środkowy – domownicy, wewnętrzny – samo ulepszanie. | Trzy pierścienie jak tarcza: w środku samo ulepszanie, wokół ludzie i ich nawyki, na zewnątrz kierownik pilnujący planu i budżetu. Od środka: co – kto – jak kierować.","org":"pierwsza iteracja: obsługa zgłoszeń; druga: przyczyny powtarzających się awarii."}},"fz-D-004":{"id":"fz-D-004","typ":"egzamin","s":"IM-02-01","t":"Który z poniższych NIE jest wymieniony wśród czynników środowiska wewnętrznego i zewnętrznego wdrożenia?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 35"],"r":null,"zap":"","scen":"","o":[{"t":"Apetyt na ryzyko","ok":false,"w":"Apetyt na ryzyko jest na liście czynników."},{"t":"Liczba procesów w Referencyjnym Modelu Procesu","ok":true,"w":"Tego nie ma na liście czynników kontekstu organizacji."},{"t":"Etyka i kultura","ok":false,"w":"Etyka i kultura otwierają listę czynników."},{"t":"Styl zarządzania","ok":false,"w":"Styl zarządzania jest na liście czynników."}],"fz":{"h":"Czynniki środowiskowe","p":"P2","pulapka":false,"n":"egzamin: czynniki środowiskowe (kontekst organizacji) · podr.: czynniki środowiska wewn. i zewn. · EN: internal and external environment factors","q":"Jakie czynniki kontekstu uwzględnia się przy wdrożeniu? | Podaj czynniki środowiska wewnętrznego i zewnętrznego wdrożenia.","a":"Etyka i kultura; przepisy; misja, wizja, wartości; polityki Ładu; plan biznesowy; model operacyjny i dojrzałość; styl zarządzania; apetyt na ryzyko; zasoby; praktyki branżowe. | Etyka i kultura; przepisy, regulacje i polityki; misja, wizja i wartości; polityki i praktyki Ładu; plan biznesowy i kierunki strategiczne; model operacyjny i poziom dojrzałości; styl zarządzania; apetyt na ryzyko; zdolności i dostępne zasoby; praktyki branżowe.","ex":"Remont dopasowujesz do przepisów, budżetu, gustu domowników i tego, ile ryzyka akceptujesz (apetyt na ryzyko). Tak samo wdrożenie COBIT dopasowuje się do warunków firmy. | Zanim kupisz meble, mierzysz pokój, sprawdzasz budżet i gust rodziny. Tu tak samo: wdrożenie dopasowujesz do kultury, przepisów, celów, pieniędzy i ludzi firmy.","org":"przepisy o cyberbezpieczeństwie i zamówieniach publicznych; mały zespół IT."}},"fz-D-005":{"id":"fz-D-005","typ":"egzamin","s":"IM-02-01","t":"Który z poniższych NIE jest jednym z pięciu kluczowych czynników sukcesu wdrożenia?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 35–36","FW-PL s. 35"],"r":null,"zap":"","scen":"","o":[{"t":"Kierunek, mandat i stałe wsparcie kierownictwa najwyższego szczebla","ok":false,"w":"To czynnik nr 1."},{"t":"Szybkie korzyści i priorytet najłatwiejszych, najkorzystniejszych usprawnień","ok":false,"w":"To czynnik nr 5."},{"t":"Dopasowanie COBIT i innych praktyk do kontekstu organizacji","ok":false,"w":"To czynnik nr 4."},{"t":"Osiągnięcie poziomu 5 zdolności przez wszystkie procesy","ok":true,"w":"Tego nie ma wśród czynników sukcesu, a poziom docelowy dobiera się do potrzeb."}],"fz":{"h":"Kluczowe czynniki sukcesu","p":"P2","pulapka":false,"n":"egzamin: kluczowe czynniki sukcesu wdrożenia · podr.: kluczowe czynniki sukcesu · EN: critical success factors","q":"Podaj kluczowe czynniki sukcesu wdrożenia. | Podaj pięć kluczowych czynników sukcesu wdrożenia.","a":"1) kierownictwo wskazuje kierunek, daje upoważnienie (mandat) i wsparcie; 2) zrozumienie celów biznesowych i IT; 3) komunikacja i umożliwienie zmian; 4) dopasowanie COBIT do sytuacji organizacji; 5) szybkie korzyści. | 1. Kierownictwo najwyższego szczebla daje kierunek, mandat i stałe wsparcie. 2. Wszyscy rozumieją cele biznesowe i cele IT. 3. Skuteczna komunikacja i umożliwienie zmian. 4. Dopasowanie COBIT i innych praktyk do kontekstu. 5. Szybkie korzyści i priorytet najłatwiejszych, najkorzystniejszych usprawnień.","ex":"Udany remont: właściciel decyduje i płaci (1), wszyscy wiedzą, po co (2), domownicy są na bieżąco (3), projekt pasuje do tego mieszkania (4), szybko widać pierwszy efekt (5). | Haczyk na pięć palców: szef chce (1), wszyscy wiedzą, po co (2), mówimy o zmianach (3), szyjemy na miarę (4), szybko widać efekt (5).","org":"zastępca komendanta jako sponsor; efekt widoczny po miesiącu."}},"fz-D-006":{"id":"fz-D-006","typ":"egzamin","s":"IM-02-06","t":"W której fazie i w którym kręgu powstaje mapa drogowa?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 38"],"r":null,"zap":"","scen":"","o":[{"t":"W fazie 1, w kręgu Aktywowania zmiany","ok":false,"w":"W fazie 1 krąg zmiany ustanawia chęć zmiany."},{"t":"W fazie 4, w kręgu cyklu ciągłego doskonalenia","ok":false,"w":"W fazie 4 doskonalenie buduje usprawnienia; mapa powstaje wcześniej."},{"t":"W fazie 5, w kręgu zarządzania programem","ok":false,"w":"W fazie 5 program wykonuje plan, a nie go definiuje."},{"t":"W fazie 3 („Do czego dążymy?”), w kręgu zarządzania programem","ok":true,"w":"Program: Definiowanie mapy drogowej to działanie fazy 3."}],"fz":{"h":"Mapa drogowa","p":"P1","pulapka":false,"n":"egzamin: mapa drogowa · podr.: plan działań · EN: road map","q":"Czym jest mapa drogowa i w której fazie powstaje? | Czym jest mapa drogowa?","a":"Kolejność i priorytety działań. Faza 3 („Do czego dążymy?”), krąg zarządzania programem. | Planem działań dojścia do stanu docelowego (podr. plan działań; EN road map); definiuje się go w fazie 3 w pierścieniu zarządzania programem.","ex":"Jak harmonogram remontu: najpierw elektryka, potem tynki, na końcu malowanie. Powstaje w fazie 3, bo dopiero wtedy wiesz, jak mieszkanie ma wyglądać. | Jak trasa w nawigacji: wiesz, skąd i dokąd jedziesz, a mapa pokazuje kolejne zakręty. Rysuje się ją w fazie 3, bo dopiero wtedy znany jest cel.","org":"najpierw rejestr, potem dyżur, na końcu procedura i szkolenia."}},"fz-D-007":{"id":"fz-D-007","typ":"egzamin","s":"IM-01-01","t":"Czy przewodnik COBIT 5: Wdrożenie jest normatywny?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 35"],"r":null,"zap":"","scen":"","o":[{"t":"Tak – nakazuje dokładną kolejność kroków, której trzeba przestrzegać","ok":false,"w":"Normatywny znaczy „rób dokładnie tak”, a przewodnik tylko podpowiada."},{"t":"Tak – jest kompletnym, gotowym rozwiązaniem do wdrożenia","ok":false,"w":"Fiszka wprost mówi, że nie jest kompletnym rozwiązaniem."},{"t":"Nie – bo dotyczy wyłącznie oceny zdolności procesów","ok":false,"w":"Przewodnik dotyczy wdrożenia, a nie wyłącznie oceny zdolności."},{"t":"Nie – to zbiór wskazówek, jak unikać typowych problemów i korzystać z dobrych praktyk","ok":true,"w":"Fiszka: nie jest normatywny ani kompletnym rozwiązaniem."}],"fz":{"h":"Normatywność wytycznych","p":"P2","pulapka":false,"n":"egzamin: nie jest normatywny · podr.: nie jest normatywny · EN: not prescriptive","q":"Czy przewodnik COBIT 5: Wdrożenie jest normatywny? | Czy przewodnik COBIT 5 – Wdrożenie jest normatywny?","a":"Nie. To zbiór wskazówek, jak unikać typowych problemów, korzystać z dobrych praktyk i osiągać wyniki, a nie gotowe rozwiązanie. | Nie. Nie jest normatywny ani kompletnym rozwiązaniem; to zbiór wskazówek, jak unikać typowych problemów, korzystać z dobrych praktyk i osiągać pożądane wyniki.","ex":"Jak książka z poradami remontowymi, a nie gotowy projekt architekta: podpowiada, czego unikać, ale decydujesz sam. Normatywny = nakazujący „rób dokładnie tak”. | Jak przewodnik turystyczny: pokazuje dobre trasy i pułapki, ale nie wybiera drogi za ciebie. Haczyk: „wskazówki, nie przepis”.","org":""}},"fz-D-008":{"id":"fz-D-008","typ":"egzamin","s":"IM-02-02","t":"Czym różni się punkt zapalny od zdarzenia wyzwalającego?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 36–37","FW-PL s. 36"],"r":null,"zap":"","scen":"","o":[{"t":"Punkt zapalny to zmiana w otoczeniu, a zdarzenie wyzwalające to istniejący problem","ok":false,"w":"Definicje są tu zamienione miejscami."},{"t":"To synonimy – oba oznaczają problem wykazany przez audyt","ok":false,"w":"To dwa różne pojęcia, choć razem tworzą wyznaczniki fazy 1."},{"t":"Punkt zapalny to istniejący problem, a zdarzenie wyzwalające to zmiana, która daje powód, by działać teraz","ok":true,"w":"Ból kontra bodziec – tak rozróżnia je fiszka."},{"t":"Punkty zapalne ustala się w fazie 7, a zdarzenia wyzwalające w fazie 1","ok":false,"w":"Oba identyfikuje się w fazie 1 jako wyznaczniki."}],"fz":{"h":"Punkt zapalny a zdarzenie wyzwalające","p":"P1","pulapka":true,"n":"egzamin: punkt zapalny / zdarzenie wyzwalające · podr.: punkt zapalny / zdarzenie inicjujące · EN: pain point vs trigger event","q":"Czym różni się punkt zapalny od zdarzenia wyzwalającego?","a":"Punkt zapalny: istniejący problem. Zdarzenie wyzwalające: zmiana w otoczeniu lub organizacji, która daje powód, by działać teraz. Razem tworzą wyznaczniki fazy 1. | Punkt zapalny to istniejący problem wskazujący potrzebę usprawnienia Ładu (np. nieudane projekty). Zdarzenie wyzwalające to inne zdarzenie w otoczeniu wewnętrznym lub zewnętrznym, które skłania do zajęcia się Ładem (np. fuzja, nowy CIO).","ex":"Punkt zapalny: auto stuka od miesięcy. Zdarzenie wyzwalające: zbliża się przegląd albo wyjazd na wakacje – nic nowego się nie zepsuło, ale trzeba działać teraz. | Punkt zapalny: kran cieknie od miesięcy (problem już jest). Zdarzenie wyzwalające: zapowiedzieli się goście (coś nowego każe działać teraz). Ból kontra bodziec.","org":"awaria = punkt zapalny; nowy komendant lub zapowiedziany audyt = zdarzenie wyzwalające."}},"fz-D-009":{"id":"fz-D-009","typ":"egzamin","s":"IM-02-02","t":"Który z poniższych jest przykładem punktu zapalnego?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 36–37","FW-PL s. 36"],"r":null,"zap":"","scen":"","o":[{"t":"Fuzja z inną firmą","ok":false,"w":"Fuzja to zdarzenie wyzwalające, a nie istniejący problem."},{"t":"Nowy prezes (CEO)","ok":false,"w":"Nowy CEO to zdarzenie wyzwalające."},{"t":"Firma zewnętrzna (outsourcing) nie dotrzymuje uzgodnionego poziomu usług","ok":true,"w":"To istniejący problem z listy punktów zapalnych."},{"t":"Nowa strategia organizacji","ok":false,"w":"Nowa strategia to zdarzenie wyzwalające."}],"fz":{"h":"Punkty zapalne","p":"P2","pulapka":false,"n":"egzamin: punkty zapalne · podr.: punkty zapalne · EN: pain points","q":"Czym są punkty zapalne? Podaj przykłady. | Podaj punkty zapalne (część 1).","a":"Istniejące problemy, które pokazują potrzebę usprawnień, np. frustracja biznesu, poważne incydenty ryzyka IT (utrata danych), kłopoty z firmą zewnętrzną (outsourcing), niespełnione przepisy, słabe wyniki audytów. | Frustracja biznesu nieudanymi inicjatywami, rosnącymi kosztami IT i niską wartością; poważne incydenty ryzyka IT (utrata danych, porażka projektu); kłopoty z firmą zewnętrzną (outsourcing), która nie dotrzymuje uzgodnionego poziomu usług; niespełnione wymagania przepisów lub umów; IT hamuje innowacje i szybkie reagowanie (zwinność); audyty regularnie wskazują słabą wydajność lub jakość IT.","ex":"Jak ból zęba, który w końcu każe iść do dentysty: coś już źle działa i wszyscy to czują. „Zapalny” = już boli. | Sześć „bólów”: szefowie sfrustrowani, coś poważnego się stało (wyciek danych), firma zewnętrzna zawodzi, łamiemy przepisy, IT hamuje nowe pomysły, kontrole stale wytykają błędy.","org":"system ewidencji zdarzeń niedostępny 95 min w czasie nawałnic; sklep nie działał 6 godzin w Black Friday."}},"fz-D-010":{"id":"fz-D-010","typ":"egzamin","s":"IM-02-02","t":"Który z poniższych NIE jest punktem zapalnym?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 37"],"r":null,"zap":"","scen":"","o":[{"t":"Ukryte i nieuczciwe wydatki na IT","ok":false,"w":"To punkt zapalny z drugiej części listy."},{"t":"Powielanie inicjatyw i marnotrawstwo zasobów","ok":false,"w":"To punkt zapalny z drugiej części listy."},{"t":"Brak ludzi, umiejętności lub wypalenie zespołu IT","ok":false,"w":"To punkt zapalny z drugiej części listy."},{"t":"Audyt zewnętrzny lub ocena konsultantów","ok":true,"w":"To zdarzenie wyzwalające, a nie istniejący problem."}],"fz":{"h":"Punkty zapalne (część 2)","p":"P2","pulapka":false,"n":"EN: Pain points (2)","q":"Podaj punkty zapalne (część 2).","a":"Ukryte i nieuczciwe wydatki na IT; powielanie inicjatyw i marnotrawstwo zasobów; brak ludzi, umiejętności lub wypalenie zespołu IT; zmiany IT spóźnione, ponad budżet, nietrafione; niechęć zarządu do współpracy z IT, brak sponsorów (osób z kierownictwa popierających IT); złożone, zagmatwane modele operacyjne IT.","ex":"Kolejne sześć „bólów”: pieniądze na IT idą bokiem, dwa zespoły robią to samo, brak ludzi lub są wypaleni, zmiany spóźnione i za drogie, zarząd unika IT, wszystko zagmatwane.","org":""}},"fz-D-011":{"id":"fz-D-011","typ":"egzamin","s":"IM-02-04","t":"Który element NIE należy do minimalnej zawartości uzasadnienia biznesowego?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 39"],"r":null,"zap":"","scen":"","o":[{"t":"Właściciele korzyści, czyli kto odpowiada za ich uzyskanie","ok":false,"w":"To element minimalnej zawartości."},{"t":"Ryzyko, ograniczenia i zależności","ok":false,"w":"To element minimalnej zawartości."},{"t":"Pełny opis wszystkich procesów z Referencyjnego Modelu Procesu","ok":true,"w":"Tego nie ma na liście; uzasadnienie dotyczy korzyści, kosztów, ryzyka i ról."},{"t":"Monitorowanie inwestycji i wartości przez cały cykl ekonomiczny, z miernikami","ok":false,"w":"To element minimalnej zawartości."}],"fz":{"h":"Uzasadnienie biznesowe","p":"P1","pulapka":true,"n":"egzamin: uzasadnienie biznesowe · podr.: uzasadnienie biznesowe · EN: business case","q":"Co musi zawierać uzasadnienie biznesowe? | Co musi zawierać co najmniej uzasadnienie biznesowe?","a":"Docelowe korzyści, ich zgodność ze strategią i właściciele korzyści (kto odpowiada za ich uzyskanie); zmiany biznesowe i zakres; inwestycje; koszty bieżące; korzyści po zmianie; ryzyka i zależności; role i rozliczalność; monitorowanie wartości i mierniki. Aktualizuje się je przez cały cykl. | Docelowe korzyści biznesowe, ich zgodność ze strategią oraz właściciele korzyści (kto odpowiada za ich zapewnienie; podr. beneficjenci); wymagane zmiany biznesowe; inwestycje; bieżące koszty IT i biznesowe; oczekiwane korzyści po zmianach; ryzyko, ograniczenia i zależności; role, odpowiedzialności i rozliczalności; monitorowanie inwestycji i wartości przez cały cykl ekonomiczny, z miernikami.","ex":"Jak wniosek o kredyt na remont: co zyskasz i kto pilnuje, by to się stało, ile to kosztuje teraz i potem, co może pójść źle, kto odpowiada i jak sprawdzisz efekt. | Jak kosztorys remontu dla rodziny: co zyskamy i kto pilnuje, żeby to się stało, co zmienić, ile kosztuje teraz i co roku, co może pójść źle, kto odpowiada, jak sprawdzimy efekt.","org":"krótsze przerwy usług krytycznych za ok. 480 tys. zł w pierwszym roku."}},"fz-D-012":{"id":"fz-D-012","typ":"egzamin","s":"IM-02-01","t":"Co obejmuje stworzenie właściwego środowiska wdrożenia?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 36"],"r":null,"zap":"","scen":"","o":[{"t":"Formalną ocenę zdolności wszystkich procesów przez zewnętrznego asesora","ok":false,"w":"Ocena zdolności nie jest elementem tworzenia środowiska."},{"t":"Przyjęcie normatywnego zestawu kroków do dokładnego wykonania","ok":false,"w":"Przewodnik wdrożenia nie jest normatywny."},{"t":"Przekazanie programu wyłącznie działowi IT, bez udziału zarządu","ok":false,"w":"Fiszka wymaga widocznego wsparcia zarządu i udziału interesariuszy."},{"t":"Zaangażowanie interesariuszy od początku, zasoby, jasne role, struktury Ładu i widoczne wsparcie zarządu","ok":true,"w":"To pełna lista z fiszki."}],"fz":{"h":"Właściwe środowisko","p":"P2","pulapka":false,"n":"egzamin: stworzenie właściwego środowiska · podr.: stworzenie właściwego środowiska · EN: creating the appropriate environment","q":"Co obejmuje stworzenie właściwego środowiska? | Co obejmuje stworzenie właściwego środowiska wdrożenia?","a":"Zaangażowanie od początku wszystkich zainteresowanych (interesariuszy), zasoby dla programu, jasno przydzielone role, struktury i procesy Ładu oraz widoczne wsparcie zarządu. | Zaangażowanie od początku wszystkich zainteresowanych (interesariuszy) – cele i korzyści opisane w uzasadnieniu biznesowym; zasoby dla programu; jasno przydzielone role; struktury i procesy Ładu; widoczne wsparcie zarządu.","ex":"Zanim ruszy remont: domownicy wiedzą i się zgadzają, są pieniądze i ekipa, wiadomo, kto o czym decyduje, a właściciel widocznie jest „za”. Bez tego ekipa stoi. | Jak przygotowanie wesela: rodzina zgadza się od początku, jest budżet, każdy wie, za co odpowiada, a rodzice widocznie wspierają. Dopiero wtedy ruszasz.","org":"sponsor, kierownik programu, przegląd co dwa tygodnie."}},"fz-D-013":{"id":"fz-D-013","typ":"egzamin","s":"IM-02-02","t":"Który z poniższych jest przykładem zdarzenia wyzwalającego?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 37"],"r":null,"zap":"","scen":"","o":[{"t":"Poważny incydent utraty danych","ok":false,"w":"To punkt zapalny, czyli istniejący problem."},{"t":"Nowe wymagania regulacyjne","ok":true,"w":"To zdarzenie z listy zdarzeń wyzwalających."},{"t":"Audyty regularnie wskazują słabą jakość IT","ok":false,"w":"To punkt zapalny."},{"t":"Zmiany IT są spóźnione i ponad budżet","ok":false,"w":"To punkt zapalny."}],"fz":{"h":"Zdarzenia wyzwalające","p":"P2","pulapka":false,"n":"egzamin: zdarzenia wyzwalające · podr.: zdarzenia inicjujące · EN: trigger events","q":"Czym są zdarzenia wyzwalające? Podaj przykłady. | Podaj zdarzenia wyzwalające.","a":"Zdarzenia wewnątrz lub na zewnątrz organizacji, które skłaniają do zajęcia się Ładem: fuzje, zmiana pozycji na rynku, nowe przepisy, zmiana technologii, nowy prezes lub szef IT (CEO/CIO), audyt zewnętrzny, nowa strategia. | Fuzje, przejęcia, sprzedaż części firmy (zbycie); zmiana pozycji rynkowej, finansowej lub wobec konkurencji; zmiana modelu działania lub zaopatrzenia; nowe wymagania regulacyjne; duża zmiana technologii lub podejścia (paradygmatu); ogólnofirmowa inicjatywa Ładu; nowy CEO, CFO, CIO itd.; audyt zewnętrzny lub ocena konsultantów; nowa strategia lub priorytet.","ex":"Jak przeprowadzka, po której w końcu robisz porządek w szafach: nic się nie zepsuło, ale nowa sytuacja daje powód do działania. | Nic nie boli, ale sytuacja się zmienia, jak po ślubie czy przeprowadzce. Skróty: CEO = prezes, CFO = dyrektor finansowy, CIO = szef IT.","org":"nowe wymogi cyberbezpieczeństwa; zapowiedź audytu; nowy prezes po fuzji."}},"fz-D-014":{"id":"fz-D-014","typ":"egzamin","s":"IM-02-02,IM-02-03","t":"Po co identyfikuje się punkty zapalne i zdarzenia wyzwalające?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 36"],"r":null,"zap":"","scen":"","o":[{"t":"Aby ustalić poziom zdolności procesów według ISO/IEC 15504","ok":false,"w":"Do tego służy ocena zdolności, a nie wyznaczniki."},{"t":"Aby zastąpić uzasadnienie biznesowe","ok":false,"w":"Wiążą uzasadnienie z realnymi problemami, a nie zastępują go."},{"t":"Wiążą uzasadnienie biznesowe z codziennymi problemami, zwiększają poczucie pilności i pomagają zdobyć poparcie kierownictwa","ok":true,"w":"Tak uzasadnia to fiszka."},{"t":"Aby formalnie zamknąć cykl wdrożenia w fazie 7","ok":false,"w":"To punkt wejścia do wdrożenia (faza 1), a nie zakończenie."}],"fz":{"h":"Punkty zapalne i zdarzenia wyzwalające jako punkt wejścia","p":"P2","pulapka":false,"n":"EN: Pain points and trigger events as entry points","q":"Po co identyfikować punkty zapalne i zdarzenia wyzwalające?","a":"Wiążą uzasadnienie biznesowe z codziennymi problemami, zwiększają akceptację i poczucie pilności, pozwalają wskazać szybkie korzyści i zdobyć poparcie kierownictwa.","ex":"Ludzie chętniej płacą za naprawę dachu, gdy właśnie kapie im na głowę. Realny problem daje poczucie, że trzeba działać teraz, i pozwala szybko pokazać efekt.","org":""}},"fz-D-015":{"id":"fz-D-015","typ":"egzamin","s":"IM-02-05","t":"Jak według fiszki osiąga się trwałą poprawę podczas zmiany?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 37"],"r":null,"zap":"","scen":"","o":[{"t":"Przez zaangażowanie ludzi (zaufanie, przywództwo, komunikacja) albo, gdy trzeba, egzekwowanie zgodności","ok":true,"w":"Marchewka albo kontrola – obie drogi podaje fiszka."},{"t":"Wyłącznie przez kary dla pracowników","ok":false,"w":"Egzekwowanie to tylko opcja, gdy zaangażowanie nie wystarcza."},{"t":"Wyłącznie przez zakup nowych narzędzi IT","ok":false,"w":"Fiszka mówi o ludziach i zgodności, nie o narzędziach."},{"t":"Przez rezygnację z komunikacji, by nie wywoływać oporu","ok":false,"w":"Komunikacja jest jednym z filarów zaangażowania."}],"fz":{"h":"Trwała poprawa podczas zmiany","p":"P2","pulapka":false,"n":"EN: Sustainable change: buy-in or enforced compliance","q":"Jak osiągnąć trwałą poprawę podczas zmiany?","a":"Przez zaangażowanie ludzi (interesariuszy: zaufanie, przywództwo, komunikacja) lub, gdy trzeba, egzekwowanie zgodności (administrowanie, monitorowanie, egzekwowanie).","ex":"Jak z dziećmi i myciem zębów: najlepiej przekonać i dać przykład (zaangażowanie), a gdy to nie działa – pilnować i sprawdzać (egzekwowanie). Marchewka albo kontrola.","org":""}},"fz-D-016":{"id":"fz-D-016","typ":"egzamin","s":"IM-02-06,IM-02-07","t":"Jak brzmi pytanie fazy 4 cyklu wdrożenia (nazwa egzaminacyjna)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 38"],"r":null,"zap":"","scen":"","o":[{"t":"Jak się tam dostaniemy?","ok":false,"w":"To pytanie fazy 5."},{"t":"Do czego dążymy?","ok":false,"w":"To pytanie fazy 3."},{"t":"Jakie działania należy podjąć?","ok":true,"w":"To pytanie fazy 4."},{"t":"Czy dotarliśmy do celu?","ok":false,"w":"To pytanie fazy 6."}],"fz":{"h":"Pytania siedmiu faz","p":"P1","pulapka":false,"n":"EN: What are the drivers? Where are we now? Where do we want to be? What needs to be done? How do we get there? Did we get there? How do we keep the momentum going?","q":"Podaj pytania siedmiu faz (nazwy egzaminacyjne).","a":"1. Jakie są wyznaczniki? 2. Gdzie jesteśmy teraz? 3. Do czego dążymy? 4. Jakie działania należy podjąć? 5. Jak się tam dostaniemy? 6. Czy dotarliśmy do celu? 7. Jak utrzymać motywację do działania?","ex":"Remont: po co? – jak jest? – jak ma być? – co zrobić? – robimy – czy wyszło? – jak nie odpuścić? Po kroku 7 zaczynasz od nowa.","org":""}},"fz-D-017":{"id":"fz-D-017","typ":"egzamin","s":"IM-02-06","t":"Co dzieje się w fazie 1 „Jakie są wyznaczniki?”?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 38"],"r":null,"zap":"","scen":"","o":[{"t":"Określa się stan docelowy i analizuje luki","ok":false,"w":"To faza 3."},{"t":"Ocenia się stan obecny i zdolność procesów","ok":false,"w":"To faza 2."},{"t":"Uzgadnia się potrzebę inicjatywy oraz identyfikuje punkty zapalne i zdarzenia wyzwalające","ok":true,"w":"Tak opisuje fazę 1 fiszka."},{"t":"Ocenia się ogólny sukces i wzmacnia potrzebę ciągłego doskonalenia","ok":false,"w":"To faza 7."}],"fz":{"h":"Faza 1 „Jakie są wyznaczniki?”","p":"P1","pulapka":false,"n":"EN: Initiate programme; Establish desire to change; Recognise need to act","q":"Faza 1 „Jakie są wyznaczniki?” – co się dzieje i jakie działania pierścieni?","a":"Uzgadnia się potrzebę inicjatywy, identyfikuje punkty zapalne i zdarzenia wyzwalające. Program: Inicjowanie programu. Zmiana: Ustanowienie chęci zmiany. Doskonalenie: Rozpoznanie potrzeby działania.","ex":"Remont: zgadzacie się, że trzeba – bo cieknie dach (punkt zapalny) albo rodzi się dziecko (zdarzenie wyzwalające). Domownicy chcą zmiany, widać potrzebę działania.","org":""}},"fz-D-018":{"id":"fz-D-018","typ":"egzamin","s":"IM-02-06","t":"Które działanie kręgu Aktywowania zmiany przypada na fazę 2 „Gdzie jesteśmy teraz?”?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 38"],"r":null,"zap":"","scen":"","o":[{"t":"Utworzenie zespołu wdrożeniowego","ok":true,"w":"To działanie kręgu zmiany w fazie 2."},{"t":"Ustanowienie chęci zmiany","ok":false,"w":"To faza 1."},{"t":"Komunikowanie rezultatu","ok":false,"w":"To faza 3."},{"t":"Identyfikacja odtwórców ról","ok":false,"w":"To faza 4."}],"fz":{"h":"Faza 2 „Gdzie jesteśmy teraz?”","p":"P1","pulapka":false,"n":"EN: Define problems and opportunities; Form implementation team; Assess current state","q":"Faza 2 „Gdzie jesteśmy teraz?” – co się dzieje i jakie działania pierścieni?","a":"Zakres: cele organizacji przekłada się na cele IT i procesy; scenariusze ryzyka (co może pójść źle); ocena stanu obecnego i zdolności procesów. Program: Definiowanie problemów i okazji. Zmiana: Utworzenie zespołu wdrożeniowego. Doskonalenie: Ocena stanu obecnego.","ex":"Remont: obchodzisz mieszkanie z kartką – co jest w złym stanie, co pilne, co grozi awarią – i kompletujesz ekipę. Najpierw szczery opis tego, jak jest.","org":""}},"fz-D-019":{"id":"fz-D-019","typ":"egzamin","s":"IM-02-06","t":"Które działanie cyklu ciągłego doskonalenia odpowiada fazie 3 „Do czego dążymy?”?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 38"],"r":null,"zap":"","scen":"","o":[{"t":"Ocena stanu obecnego","ok":false,"w":"To faza 2."},{"t":"Zdefiniowanie stanu docelowego","ok":true,"w":"To działanie kręgu doskonalenia w fazie 3."},{"t":"Budowanie usprawnień","ok":false,"w":"To faza 4."},{"t":"Wdrażanie usprawnień","ok":false,"w":"To faza 5."}],"fz":{"h":"Faza 3 „Do czego dążymy?”","p":"P1","pulapka":false,"n":"EN: Define road map; Communicate outcome; Define target state","q":"Faza 3 „Do czego dążymy?” – co się dzieje i jakie działania pierścieni?","a":"Określa się stan docelowy, analizuje luki i rozwiązania, priorytet mają szybkie korzyści i największe korzyści. Program: Definiowanie mapy drogowej. Zmiana: Komunikowanie rezultatu. Doskonalenie: Zdefiniowanie stanu docelowego.","ex":"Remont: wybierasz, jak ma wyglądać mieszkanie, widzisz różnicę między „jest” a „ma być” (luka) i ustalasz kolejność prac. Najpierw drobiazgi dające szybki efekt.","org":""}},"fz-D-020":{"id":"fz-D-020","typ":"egzamin","s":"IM-02-07","t":"Które działanie kręgu zarządzania programem przypada na fazę 4 „Jakie działania należy podjąć?”?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 38"],"r":null,"zap":"","scen":"","o":[{"t":"Wykonywanie planu","ok":false,"w":"To faza 5."},{"t":"Planowanie programu","ok":true,"w":"To działanie programu w fazie 4."},{"t":"Definiowanie mapy drogowej","ok":false,"w":"To faza 3."},{"t":"Realizacja korzyści","ok":false,"w":"To faza 6."}],"fz":{"h":"Faza 4 „Jakie działania należy podjąć?”","p":"P1","pulapka":false,"n":"EN: Plan programme; Identify role players; Build improvements","q":"Faza 4 „Jakie działania należy podjąć?” – co się dzieje i jakie działania pierścieni?","a":"Planuje się praktyczne rozwiązania: projekty z uzasadnieniami biznesowymi i plan zmian. Program: Planowanie programu. Zmiana: Identyfikacja odtwórców ról. Doskonalenie: Budowanie usprawnień.","ex":"Remont: rozpisujesz prace na konkretne zlecenia z kosztorysem, ustalasz, kto co robi (elektryk, hydraulik, kto pilnuje), a ekipa przygotowuje materiały.","org":""}},"fz-D-021":{"id":"fz-D-021","typ":"egzamin","s":"IM-02-07","t":"Który zestaw działań pierścieni (program / zmiana / doskonalenie) należy do fazy 5 „Jak się tam dostaniemy?”?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 38"],"r":null,"zap":"","scen":"","o":[{"t":"Planowanie programu / Identyfikacja odtwórców ról / Budowanie usprawnień","ok":false,"w":"To działania fazy 4."},{"t":"Wykonywanie planu / Działaj i używaj / Wdrażanie usprawnień","ok":true,"w":"To trzy działania fazy 5."},{"t":"Realizacja korzyści / Umożliwianie nowych podejść / Eksploatacja i pomiar","ok":false,"w":"To działania fazy 6."},{"t":"Przegląd skuteczności / Utrzymanie / Monitorowanie i szacowanie","ok":false,"w":"To działania fazy 7."}],"fz":{"h":"Faza 5 „Jak się tam dostaniemy?”","p":"P1","pulapka":false,"n":"EN: Execute plan; Operate and use; Implement improvements","q":"Faza 5 „Jak się tam dostaniemy?” – co się dzieje i jakie działania pierścieni?","a":"Rozwiązania przechodzą w praktykę; definiuje się miary i monitorowanie. Program: Wykonywanie planu. Zmiana: Działaj i używaj. Doskonalenie: Wdrażanie usprawnień.","ex":"Remont: ekipa wchodzi i robi, domownicy zaczynają korzystać z nowej kuchni, a ty ustalasz, po czym poznasz sukces, np. niższe rachunki za prąd.","org":""}},"fz-D-022":{"id":"fz-D-022","typ":"egzamin","s":"IM-02-07","t":"Co jest istotą fazy 6 „Czy dotarliśmy do celu?”?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 38"],"r":null,"zap":"","scen":"","o":[{"t":"Trwałe korzystanie z nowych aktywatorów i monitorowanie korzyści","ok":true,"w":"Tak opisuje fazę 6 fiszka."},{"t":"Określenie stanu docelowego i analiza luk","ok":false,"w":"To faza 3."},{"t":"Utworzenie zespołu wdrożeniowego","ok":false,"w":"To działanie kręgu zmiany w fazie 2."},{"t":"Uzgodnienie potrzeby inicjatywy","ok":false,"w":"To faza 1."}],"fz":{"h":"Faza 6 „Czy dotarliśmy do celu?”","p":"P1","pulapka":false,"n":"EN: Realise benefits; Embed new approaches; Operate and measure","q":"Faza 6 „Czy dotarliśmy do celu?” – co się dzieje i jakie działania pierścieni?","a":"Trwałe korzystanie z nowych aktywatorów (np. procesów, ról) i monitorowanie korzyści. Program: Realizacja korzyści. Zmiana: Umożliwianie nowych podejść (podr. integracja nowych podejść). Doskonalenie: Eksploatacja i pomiar.","ex":"Remont: mieszkasz w odnowionym mieszkaniu na co dzień, nowe nawyki się utrwalają, a ty sprawdzasz, czy rachunki naprawdę spadły. Czy obiecany efekt przyszedł?","org":""}},"fz-D-023":{"id":"fz-D-023","typ":"egzamin","s":"IM-02-07","t":"Które działanie kręgu Aktywowania zmiany przypada na fazę 7 „Jak utrzymać motywację do działania?”?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 38"],"r":null,"zap":"","scen":"","o":[{"t":"Utrzymanie","ok":true,"w":"To działanie kręgu zmiany w fazie 7."},{"t":"Działaj i używaj","ok":false,"w":"To faza 5."},{"t":"Umożliwianie nowych podejść","ok":false,"w":"To faza 6."},{"t":"Ustanowienie chęci zmiany","ok":false,"w":"To faza 1."}],"fz":{"h":"Faza 7 „Jak utrzymać motywację do działania?”","p":"P1","pulapka":false,"n":"EN: Review effectiveness; Sustain; Monitor and evaluate","q":"Faza 7 „Jak utrzymać motywację do działania?” – co się dzieje i jakie działania pierścieni?","a":"Ocenia się ogólny sukces, nowe wymagania Ładu i wzmacnia potrzebę ciągłego doskonalenia. Program: Przegląd skuteczności. Zmiana: Utrzymanie. Doskonalenie: Monitorowanie i szacowanie.","ex":"Remont: po roku oceniasz, co się udało i co jeszcze poprawić, i pilnujesz, żeby nie wrócił stary bałagan. Potem kolejna runda, np. łazienka.","org":""}},"fz-D-024":{"id":"fz-D-024","typ":"egzamin","s":"IM-01-01","t":"Dlaczego duże wdrożenie dzieli się na iteracje cyklu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 38"],"r":null,"zap":"","scen":"","o":[{"t":"Bo norma ISO/IEC 15504 zabrania wdrożeń dłuższych niż rok","ok":false,"w":"Fiszka nie wiąże iteracji z normą ISO."},{"t":"Bo każda iteracja musi kończyć się osiągnięciem poziomu 5","ok":false,"w":"Poziom docelowy dobiera się do potrzeb, rzadko jest nim 5."},{"t":"Bo inicjatywa trwająca dłużej niż sześć miesięcy grozi utratą tempa, skupienia i poparcia interesariuszy","ok":true,"w":"Tak uzasadnia to fiszka."},{"t":"Bo przewodnik nakazuje dokładnie trzy iteracje","ok":false,"w":"Przewodnik nie jest normatywny i nie nakazuje liczby iteracji."}],"fz":{"h":"Iteracje cyklu","p":"P2","pulapka":false,"n":"EN: More than six months – risk of losing momentum","q":"Dlaczego duże wdrożenie dzieli się na iteracje cyklu?","a":"Inicjatywa trwająca dłużej niż sześć miesięcy grozi utratą tempa (dynamiki), skupienia i poparcia zaangażowanych (interesariuszy).","ex":"Jak odchudzanie: plan na dwa lata łatwo porzucić, a cele na kilka miesięcy dają widoczne efekty i motywują. Haczyk: ponad pół roku – rośnie ryzyko utraty tempa.","org":""}},"fz-D-025":{"id":"fz-D-025","typ":"egzamin","s":"IM-02-06","t":"W której fazie identyfikuje się szybkie korzyści (quick wins)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 38"],"r":null,"zap":"","scen":"","o":[{"t":"W fazie 5, przy wdrażaniu usprawnień","ok":false,"w":"W fazie 5 rozwiązania przechodzą w praktykę."},{"t":"W fazie 6, przy realizacji korzyści","ok":false,"w":"W fazie 6 monitoruje się uzyskanie korzyści."},{"t":"W fazie 7, przy przeglądzie skuteczności","ok":false,"w":"W fazie 7 ocenia się ogólny sukces."},{"t":"W fazie 3, przy analizie luk","ok":true,"w":"Fiszka: część rozwiązań z analizy luk daje szybkie korzyści."}],"fz":{"h":"Szybkie korzyści (quick wins)","p":"P1","pulapka":true,"n":"EN: Quick wins – phase 3","q":"W której fazie identyfikuje się szybkie korzyści (quick wins)?","a":"W fazie 3: przy analizie luk część rozwiązań daje szybkie korzyści; priorytet mają łatwiejsze i najkorzystniejsze inicjatywy.","ex":"Zanim ruszy kucie ścian, wymieniasz żarówki i klamki – tanio, szybko, wszyscy widzą efekt. Wybierasz je w fazie 3, gdy porównujesz „jest” z „ma być”.","org":""}},"fz-D-026":{"id":"fz-D-026","typ":"egzamin","s":"IM-02-03,IM-02-04","t":"Czy uzasadnienie biznesowe tworzy się tylko na starcie programu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 39"],"r":null,"zap":"","scen":"","o":[{"t":"Tak – to jednorazowy dokument zatwierdzany w fazie 1","ok":false,"w":"Fiszka: to nie jednorazowy dokument."},{"t":"Tak – po zatwierdzeniu nie wolno go zmieniać","ok":false,"w":"Uzasadnienie stale się aktualizuje."},{"t":"Nie – powstaje dopiero w fazie 7, po ocenie sukcesu","ok":false,"w":"Istnieje od początku programu, a nie dopiero na końcu."},{"t":"Nie – zaczyna jako ogólne i strategiczne, potem się je uszczegóławia i stale aktualizuje","ok":true,"w":"To żywe narzędzie przez cały program."}],"fz":{"h":"Ewolucja uzasadnienia biznesowego","p":"P1","pulapka":false,"n":"EN: Business case evolves","q":"Jak ewoluuje uzasadnienie biznesowe? | Czy uzasadnienie biznesowe tworzy się tylko na starcie?","a":"Na początku może być ogólne, strategiczne (odgórne); potem uszczegóławia się zadania, kamienie milowe (ważne etapy) i role. To żywe narzędzie, stale aktualizowane, nie jednorazowy dokument. | Nie. Żyje przez cały program: zaczyna jako ogólne i strategiczne, potem się je uszczegóławia i stale aktualizuje.","ex":"Jak plan wesela: najpierw „chcemy skromnie, w sierpniu”, potem lista gości, terminy i kto co załatwia, a plan zmienia się do samego końca. | Jak budżet remontu: na początku szacunek „około 50 tys.”, potem dopisujesz faktury i poprawiasz plan aż do końca prac. Uzasadnienie „żyje” przez cały program.","org":""}},"fz-D-027":{"id":"fz-D-027","typ":"egzamin","s":"IM-02-03","t":"Kto powinien odpowiadać za inicjatywę wdrożeniową?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 39"],"r":null,"zap":"","scen":"","o":[{"t":"Zewnętrzny asesor","ok":false,"w":"Asesor prowadzi formalną ocenę zdolności, a nie odpowiada za inicjatywę."},{"t":"Sponsor","ok":true,"w":"Fiszka: za inicjatywę odpowiada sponsor."},{"t":"Każdy pracownik IT osobno","ok":false,"w":"Bez jednego sponsora zmiana nie ma właściciela."},{"t":"Firma zewnętrzna (outsourcing)","ok":false,"w":"Fiszka wskazuje sponsora, a nie dostawcę."}],"fz":{"h":"Sponsor inicjatywy","p":"P2","pulapka":false,"n":"EN: Sponsor","q":"Kto powinien odpowiadać za inicjatywę wdrożeniową?","a":"Sponsor; inicjatywa obejmuje wszystkich kluczowych zainteresowanych (interesariuszy) i opiera się na uzasadnieniu biznesowym.","ex":"Jak inwestor remontu: decyduje, płaci i odpowiada, choć sam nie kładzie płytek. Bez sponsora zmiana nie ma właściciela.","org":""}},"fz-D-028":{"id":"fz-D-028","typ":"egzamin","s":"IM-02-04","t":"Na jakich korzyściach powinno skupiać się uzasadnienie biznesowe?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 39"],"r":null,"zap":"","scen":"","o":[{"t":"Tylko na realistycznych i osiągalnych; pomagają badania korzyści w innych organizacjach","ok":true,"w":"Tak mówi fiszka."},{"t":"Na jak najwyższych, by przekonać zarząd","ok":false,"w":"Liczą się korzyści realne, nie efektowne."},{"t":"Wyłącznie na korzyściach dla działu IT","ok":false,"w":"Uzasadnienie opisuje docelowe korzyści biznesowe."},{"t":"Na korzyściach niemierzalnych, bo mierniki są zbędne","ok":false,"w":"Uzasadnienie obejmuje monitorowanie wartości z miernikami."}],"fz":{"h":"Realistyczne korzyści","p":"P2","pulapka":false,"n":"EN: Realistic benefits","q":"Na jakie korzyści wdrożenia skupia się uzasadnienie?","a":"Tylko na realistycznych i osiągalnych; pomocne są badania korzyści osiągniętych w innych organizacjach.","ex":"Jak w reklamie diety: „minus 20 kg w miesiąc” brzmi świetnie, ale liczy się realne „minus 4 kg”. Pomaga sprawdzić, co naprawdę osiągnęli inni.","org":""}},"fz-D-029":{"id":"fz-D-029","typ":"egzamin","s":"IM-01-01","t":"Ile działań obejmuje cykl wdrożenia, jeśli każda faza ma działanie w każdym pierścieniu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 38"],"r":null,"zap":"","scen":"","o":[{"t":"7","ok":false,"w":"Tyle jest faz, a każda ma trzy działania."},{"t":"21","ok":true,"w":"Każda z 7 faz ma działanie w każdym z 3 pierścieni."},{"t":"10","ok":false,"w":"Nie wynika to z liczby faz i pierścieni."},{"t":"3","ok":false,"w":"Tyle jest pierścieni, a każdy działa w siedmiu fazach."}],"fz":{"h":"Pierścienie a fazy","p":"P1","pulapka":false,"n":"EN: 3 rings × 7 phases = 21 activities","q":"Czy trzy pierścienie dotyczą różnych faz?","a":"Nie. Każda z 7 faz ma działanie w każdym z 3 pierścieni – razem 21 działań.","ex":"Jak w remoncie: każdy z 7 etapów ma jednocześnie zadanie dla kierownika (program), dla domowników (zmiana) i dla samej roboty (doskonalenie). Haczyk: 3 × 7 = 21.","org":""}},"fz-D-030":{"id":"fz-D-030","typ":"egzamin","s":"IM-01-01","t":"Co następuje po zakończeniu fazy 7?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 37"],"r":null,"zap":"","scen":"","o":[{"t":"Powrót do fazy 1 – cykl ciągłego doskonalenia realizuje się iteracyjnie","ok":true,"w":"Fiszka: po fazie 7 wraca się do fazy 1."},{"t":"Koniec wdrożenia, bo to jednorazowy projekt","ok":false,"w":"Wdrożenie COBIT 5 nie jest jednorazowym projektem."},{"t":"Faza 8: certyfikacja ISO","ok":false,"w":"Cykl ma 7 faz."},{"t":"Rozwiązanie zespołu i archiwizacja uzasadnienia biznesowego","ok":false,"w":"Cykl trwa dalej, a uzasadnienie żyje przez cały program."}],"fz":{"h":"Wdrożenie to nie jednorazowy projekt","p":"P1","pulapka":false,"n":"EN: Not a one-off project","q":"Czy wdrożenie COBIT 5 to jednorazowy projekt?","a":"Nie. Rdzeń to cykl ciągłego doskonalenia, realizowany iteracyjnie; po fazie 7 wraca się do fazy 1.","ex":"Jak sprzątanie domu: nie sprzątasz raz na zawsze. Po fazie 7 wracasz do fazy 1 – cykl kręci się jak koło.","org":""}},"fz-D-031":{"id":"fz-D-031","typ":"egzamin","s":"IM-02-06","t":"W której fazie ocenia się stan obecny?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 38"],"r":null,"zap":"","scen":"","o":[{"t":"W fazie 3 – Do czego dążymy?","ok":false,"w":"W fazie 3 określa się stan docelowy i luki."},{"t":"W fazie 2 – Gdzie jesteśmy teraz?","ok":true,"w":"Doskonalenie: Ocena stanu obecnego to faza 2."},{"t":"W fazie 1 – Jakie są wyznaczniki?","ok":false,"w":"W fazie 1 uzgadnia się potrzebę inicjatywy."},{"t":"W fazie 6 – Czy dotarliśmy do celu?","ok":false,"w":"W fazie 6 monitoruje się korzyści."}],"fz":{"h":"Ocena stanu obecnego – faza 2","p":"P1","pulapka":true,"n":"EN: Assess current state – phase 2","q":"Ocena stanu obecnego – faza 2 czy 3?","a":"Faza 2 (Gdzie jesteśmy teraz?). W fazie 3 określa się stan docelowy i luki.","ex":"Najpierw stajesz na wadze (faza 2 – jak jest teraz), dopiero potem wybierasz wagę docelową (faza 3). Nie ustalisz celu, nie wiedząc, gdzie jesteś.","org":""}},"fz-D-032":{"id":"fz-D-032","typ":"egzamin","s":"IM-02-07","t":"W której fazie definiuje się miary i monitorowanie przy wdrażaniu rozwiązań?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 38"],"r":null,"zap":"","scen":"","o":[{"t":"W fazie 6 – Czy dotarliśmy do celu?","ok":false,"w":"Faza 6 korzysta z miar, by monitorować korzyści."},{"t":"W fazie 2 – Gdzie jesteśmy teraz?","ok":false,"w":"W fazie 2 ocenia się stan obecny."},{"t":"W fazie 7 – Jak utrzymać motywację do działania?","ok":false,"w":"W fazie 7 ocenia się ogólny sukces."},{"t":"W fazie 5 – Jak się tam dostaniemy?","ok":true,"w":"Faza 5 wprowadza miary i monitorowanie."}],"fz":{"h":"Miary i monitorowanie – faza 5","p":"P1","pulapka":true,"n":"EN: Measures defined in phase 5","q":"Definiowanie miar i monitorowania – faza 5 czy 6?","a":"Faza 5 wprowadza miary i monitorowanie przy wdrażaniu; faza 6 korzysta z nich, by monitorować uzyskanie korzyści. Mierniki są jednak obecne wcześniej – już w uzasadnieniu biznesowym.","ex":"Jak dieta: w fazie 5 kupujesz wagę i ustalasz, że ważysz się co tydzień; w fazie 6 patrzysz, czy waga naprawdę spada. 5 – ustal miarę, 6 – mierz efekt.","org":""}},"fz-D-033":{"id":"fz-D-033","typ":"egzamin","s":"IM-02-07","t":"W której fazie planuje się projekty z uzasadnieniami biznesowymi i plan zmian?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 38"],"r":null,"zap":"","scen":"","o":[{"t":"W fazie 3 – Do czego dążymy?","ok":false,"w":"W fazie 3 określa się stan docelowy i mapę drogową."},{"t":"W fazie 5 – Jak się tam dostaniemy?","ok":false,"w":"W fazie 5 rozwiązania przechodzą w praktykę."},{"t":"W fazie 1 – Jakie są wyznaczniki?","ok":false,"w":"W fazie 1 identyfikuje się wyznaczniki."},{"t":"W fazie 4 – Jakie działania należy podjąć?","ok":true,"w":"Fiszka: projekty z uzasadnieniami to faza 4."}],"fz":{"h":"Projekty z uzasadnieniami – faza 4","p":"P1","pulapka":true,"n":"EN: Projects with business cases – phase 4","q":"Projekty z uzasadnieniami biznesowymi – w której fazie?","a":"W fazie 4 (Jakie działania należy podjąć?) – planuje się praktyczne rozwiązania i plan zmian.","ex":"Faza 4 = kosztorysy: każdą większą pracę (kuchnia, łazienka) rozpisujesz jako osobne zlecenie z wyliczeniem, czy się opłaca. „Jakie działania?” = konkretne zlecenia.","org":""}},"fz-D-034":{"id":"fz-D-034","typ":"egzamin","s":"IM-02-02","t":"W organizacji pojawił się nowy CIO. Jak to zaklasyfikować?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 37"],"r":null,"zap":"","scen":"","o":[{"t":"Punkt zapalny","ok":false,"w":"Punkt zapalny to istniejący problem, a nowy CIO niczego nie zepsuł."},{"t":"Zdarzenie wyzwalające","ok":true,"w":"Nowy CIO to zmiana, która daje okazję do działania."},{"t":"Szybka korzyść","ok":false,"w":"Szybkie korzyści to usprawnienia wybierane w fazie 3."},{"t":"Mapa drogowa","ok":false,"w":"Mapa drogowa to plan działań z fazy 3."}],"fz":{"h":"Nowy CIO","p":"P1","pulapka":true,"n":"EN: New CIO = trigger event","q":"Nowy CIO – punkt zapalny czy zdarzenie wyzwalające?","a":"Zdarzenie wyzwalające. Złożone modele operacyjne IT czy nieudane projekty to punkty zapalne.","ex":"Nowy szef IT (CIO) jeszcze niczego nie zepsuł – to zmiana, która daje okazję do działania, jak nowy trener w drużynie. Zapalny = coś już boli.","org":""}},"fz-D-035":{"id":"fz-D-035","typ":"egzamin","s":"IM-02-05","t":"Dlaczego wdrożenia Ładu IT często się nie udają?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 37"],"r":null,"zap":"","scen":"","o":[{"t":"Bo procesy nie osiągają poziomu 5 zdolności","ok":false,"w":"Poziom 5 rzadko jest celem i nie jest wskazany jako przyczyna porażki."},{"t":"Bo zbyt mało uwagi poświęca się ludziom, zachowaniu, kulturze i motywowaniu do zmiany","ok":true,"w":"Dlatego istnieje pierścień Aktywowania zmiany."},{"t":"Bo przewodnik COBIT 5: Wdrożenie jest normatywny i zbyt sztywny","ok":false,"w":"Przewodnik nie jest normatywny."},{"t":"Bo uzasadnienie biznesowe aktualizuje się przez cały cykl","ok":false,"w":"To dobra praktyka, a nie przyczyna porażki."}],"fz":{"h":"Dlaczego wdrożenia się nie udają","p":"P2","pulapka":false,"n":"EN: Behaviour and culture neglected","q":"Dlaczego wdrożenia Ładu IT często się nie udają?","a":"Bo zbyt mało uwagi poświęca się ludziom, zachowaniu i kulturze oraz motywowaniu do zmiany – stąd pierścień Aktywowania zmiany.","ex":"Jak firmowa siłownia, do której nikt nie chodzi: sprzęt jest, ale nikt nie przekonał ludzi. Dlatego osobny pierścień zajmuje się ludźmi.","org":""}},"fz-D-036":{"id":"fz-D-036","typ":"egzamin","s":"IM-02-02","t":"Czy aktywatory COBIT są celem samym w sobie?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 36"],"r":null,"zap":"","scen":"","o":[{"t":"Tak – wdrożenie kończy się, gdy działa wszystkie siedem aktywatorów","ok":false,"w":"Aktywatory służą rozwiązaniu problemów, a nie są celem."},{"t":"Tak – ich wdrożenia wymaga norma ISO/IEC 15504","ok":false,"w":"Norma dotyczy oceny procesów, nie celu wdrożenia."},{"t":"Nie – bo COBIT 5 nie ma aktywatorów, tylko procesy","ok":false,"w":"COBIT 5 ma siedem kategorii aktywatorów, procesy to jedna z nich."},{"t":"Nie – mają rozwiązywać realne potrzeby biznesowe, wskazane przez punkty zapalne i wyznaczniki","ok":true,"w":"Tak mówi fiszka."}],"fz":{"h":"Aktywatory a realne potrzeby","p":"P2","pulapka":false,"n":"EN: Enablers solve real business needs","q":"Czy aktywatory COBIT są celem samym w sobie?","a":"Nie. Mają rozwiązywać realne potrzeby i problemy biznesowe, zidentyfikowane z punktów zapalnych i wyznaczników.","ex":"Jak wiertarka: kupujesz ją, żeby powiesić półkę, a nie dla samej wiertarki. Aktywatory (np. procesy, role, zasady) mają rozwiązać konkretny problem firmy.","org":""}},"fz-D-037":{"id":"fz-D-037","typ":"egzamin","s":"IM-02-06,IM-02-07","t":"Faza 7 na egzaminie brzmi „Jak utrzymać motywację do działania?”. Jak nazywa ją podręcznik?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 38"],"r":null,"zap":"","scen":"","o":[{"t":"Jak utrzymać obecną dynamikę?","ok":true,"w":"To podręcznikowa nazwa fazy 7."},{"t":"Czy cel został osiągnięty?","ok":false,"w":"To podręcznikowa nazwa fazy 6."},{"t":"Jak osiągnąć założony cel?","ok":false,"w":"To podręcznikowa nazwa fazy 5."},{"t":"Jaka jest nasza obecna sytuacja?","ok":false,"w":"To podręcznikowa nazwa fazy 2."}],"fz":{"h":"Nazwy faz 2, 5, 6, 7: egzamin a podręcznik","p":"P2","pulapka":true,"n":"EN: Phases 2, 5, 6, 7: Where are we now? How do we get there? Did we get there? How do we keep the momentum going?","q":"Pytania faz 2, 5, 6 i 7 – jak brzmią na egzaminie, a jak w podręczniku?","a":"Egzamin (podr.): 2 Gdzie jesteśmy teraz? (Jaka jest nasza obecna sytuacja?); 5 Jak się tam dostaniemy? (Jak osiągnąć założony cel?); 6 Czy dotarliśmy do celu? (Czy cel został osiągnięty?); 7 Jak utrzymać motywację do działania? (Jak utrzymać obecną dynamikę?). Fazy 1, 3, 4 brzmią tak samo.","ex":"Jak jeden przepis w dwóch książkach kucharskich: inne słowa, te same kroki.","org":""}},"fz-D-038":{"id":"fz-D-038","typ":"egzamin","s":"PC-01-02","t":"Ile atrybutów procesu ma model zdolności i jak się rozkładają?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42","FW-PL s. 43"],"r":null,"zap":"","scen":"","o":[{"t":"Sześć: po jednym na każdy poziom 0–5","ok":false,"w":"Poziom 0 nie ma atrybutu, a poziomy 2–5 mają po dwa."},{"t":"Dziesięć: po dwa na poziomy 1–5","ok":false,"w":"Poziom 1 ma tylko jeden atrybut: PA 1.1."},{"t":"Dziewięć: poziom 1 – jeden, poziomy 2–5 – po dwa","ok":true,"w":"1 + 4 × 2 = 9, poziom 0 nie ma atrybutu."},{"t":"Dziewięć: poziom 0 – jeden, poziomy 1–4 – po dwa","ok":false,"w":"Poziom 0 nie ma atrybutu, a poziom 5 ma dwa."}],"fz":{"h":"Atrybuty procesu","p":"P1","pulapka":false,"n":"egzamin: atrybuty procesu · podr.: atrybuty potencjału procesu · EN: process attributes (PA)","q":"Ile jest atrybutów i jak się rozkładają? | Ile atrybutów procesu ma model i jak się rozkładają?","a":"9 atrybutów, czyli 9 mierzalnych cech zdolności; każdy dostaje ocenę N/C/W/P. Poziom 1: PA 1.1 Wykonanie procesu (czy cel jest osiągany). Poziom 2: PA 2.1 Zarządzanie wydajnością (plan i pilnowanie), PA 2.2 Zarządzanie produktami pracy (porządek w dokumentach i wynikach). Poziom 3: PA 3.1 Definicja procesu (zdefiniowany standard), PA 3.2 Wdrożenie procesu (standard stosowany w praktyce). Poziom 4: PA 4.1 Miara procesu (podr.: Pomiar procesu), PA 4.2 Kontrola procesu (trzymanie w granicach). Poziom 5: PA 5.1 Innowacja procesu, PA 5.2 Optymalizacja procesu. Poziom 0 nie ma atrybutu. | Dziewięć: poziom 1 – jeden, poziomy 2–5 – po dwa.","ex":"Atrybut to obszar pytań inspektora, np. „czy praca jest planowana i pilnowana?” – każdy obejmuje kilka warunków. Jak w sztukach walki: pierwszy pas wymaga jednego atrybutu, każdy kolejny dwóch. | Pierwszy pas zdobywasz jednym zadaniem, każdy kolejny dwoma: 1 + 4 × 2 = 9. Poziom 0 nie ma zadania – to punkt startu.","org":"DSS02: PA 1.1 = W, PA 2.1 = C → poziom 1."}},"fz-D-039":{"id":"fz-D-039","typ":"egzamin","s":"PC-02-05","t":"Czy oceny dojrzałości z COBIT 4.1 da się prosto przełożyć na poziomy zdolności COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 41","FW-PL s. 43"],"r":null,"zap":"","scen":"","o":[{"t":"Tak – skale są identyczne, wystarczy przepisać wynik","ok":false,"w":"Fiszka: nie ma prostego przełożenia."},{"t":"Tak – wystarczy dodać jeden poziom do wyniku z COBIT 4.1","ok":false,"w":"Wyniki w COBIT 5 są zwykle niższe, a nie wyższe."},{"t":"Nie – bo COBIT 4.1 w ogóle nie oceniał procesów","ok":false,"w":"COBIT 4.1 miał modele dojrzałości dla procesów."},{"t":"Nie – COBIT 5 ocenia zdolność wg ISO/IEC 15504, a mapowanie skali jest tylko przybliżone","ok":true,"w":"Mimo podobnych słów modele różnią się zakresem i intencją."}],"fz":{"h":"COBIT 4.1 a model zdolności","p":"P1","pulapka":true,"n":"egzamin: model dojrzałości / zdolności · podr.: model dojrzałości / potencjału · EN: maturity model vs capability model","q":"Czym różni się ocena w COBIT 5 od COBIT 4.1? | Czy wyniki COBIT 4.1 i COBIT 5 da się prosto porównać?","a":"COBIT 4.1 miał modele dojrzałości dla procesów; COBIT 5 ocenia zdolność wg ISO/IEC 15504. Wyniki są zwykle niższe i nie ma prostego przełożenia. | Nie. Mimo podobnych skal i słów różnią się zakresem, ukierunkowaniem i intencją; mapowanie skali jest tylko przybliżone (Rysunek 20).","ex":"Jak zmiana egzaminatora na surowszego: stara skala była opisowa, nowa wg normy ISO wymaga dowodów. Ta sama kuchnia dostaje zwykle niższą ocenę, a starej nie przeliczysz 1:1. | Jak przeliczanie polskich ocen szkolnych na amerykańskie A–F: wygląda podobnie, ale mierzy co innego, więc przełożenie jest tylko orientacyjne.","org":""}},"fz-D-040":{"id":"fz-D-040","typ":"egzamin","s":"PC-01-01","t":"Na jakiej normie oparto model zdolności procesu COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 41"],"r":null,"zap":"","scen":"","o":[{"t":"ISO/IEC 15504","ok":true,"w":"Fiszka: ISO/IEC 15504 – ocena procesów."},{"t":"ISO/IEC 27001","ok":false,"w":"Fiszka wskazuje ISO/IEC 15504, nie tę normę."},{"t":"ISO/IEC 20000","ok":false,"w":"Fiszka wskazuje ISO/IEC 15504, nie tę normę."},{"t":"ISO 9001","ok":false,"w":"Fiszka wskazuje ISO/IEC 15504, nie tę normę."}],"fz":{"h":"ISO/IEC 15504","p":"P1","pulapka":false,"n":"egzamin: ISO/IEC 15504 · podr.: ISO/IEC 15504 · EN: ISO/IEC 15504","q":"Na jakiej normie oparto model zdolności? | Na jakiej normie opiera się model zdolności procesu COBIT 5?","a":"ISO/IEC 15504 (ocena procesów). Ocena dotyczy procesu, nie całej organizacji. | ISO/IEC 15504 (Software Engineering – Process Assessment). Szczegóły: Model Oceny Procesu (PAM).","ex":"Norma ISO to jak oficjalny regulamin egzaminu, jednakowy na całym świecie. Ocenia się jedno stanowisko w kuchni (proces), a nie całą restaurację. | Norma to regulamin egzaminu, a Model Oceny Procesu (PAM) to szczegółowy arkusz pytań, z którym przychodzi inspektor.","org":""}},"fz-D-041":{"id":"fz-D-041","typ":"egzamin","s":"PC-02-01","t":"Na jakiej podstawie przeprowadza się ocenę zdolności procesu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 41"],"r":null,"zap":"","scen":"","o":[{"t":"Na podstawie deklaracji właściciela procesu, bez dowodów","ok":false,"w":"Inspektor nie wierzy na słowo – potrzebne są dowody."},{"t":"Na podstawie wyników finansowych całej organizacji","ok":false,"w":"Ocena dotyczy procesu, a nie całej organizacji."},{"t":"Na podstawie liczby pracowników działu IT","ok":false,"w":"Tego fiszka nie wymienia; liczą się wyniki, praktyki i produkty pracy."},{"t":"Na podstawie dowodów: wyników, praktyk i produktów pracy","ok":true,"w":"Fiszka: ocena opiera się na dowodach."}],"fz":{"h":"Ocena zdolności procesu","p":"P1","pulapka":false,"n":"egzamin: ocena zdolności procesu · podr.: ocena potencjału procesu · EN: process capability assessment","q":"Co ocenia się w ocenie zdolności?","a":"Na ile proces osiąga swoje cele i atrybuty, na podstawie dowodów (wyniki, praktyki, produkty pracy). To tylko jeden aktywator.","ex":"Inspektor nie wierzy na słowo: przegląda zamówienia i rachunki, pyta kucharzy. Sprawdza jednak tylko procesy, a to jeden z siedmiu aktywatorów.","org":"próbka 40 zgłoszeń, monitoring, wywiady."}},"fz-D-042":{"id":"fz-D-042","typ":"egzamin","s":"PC-02-01","t":"Czy ocena zdolności procesów daje pełny obraz Ładu w organizacji?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 41"],"r":null,"zap":"","scen":"","o":[{"t":"Nie – procesy to tylko jeden z siedmiu aktywatorów, trzeba ocenić też pozostałe","ok":true,"w":"Tak mówi fiszka."},{"t":"Tak – procesy obejmują wszystkie aktywatory","ok":false,"w":"Procesy to jedna z siedmiu kategorii aktywatorów."},{"t":"Tak – jeśli wszystkie procesy mają poziom 5","ok":false,"w":"Nawet najwyższy poziom nie mówi nic o pozostałych aktywatorach."},{"t":"Nie – bo ocenia się wyłącznie procesy domeny EDM","ok":false,"w":"Ocenia się procesy, nie tylko EDM; problemem jest pominięcie innych aktywatorów."}],"fz":{"h":"Ocena procesów a pełny obraz Ładu","p":"P1","pulapka":false,"n":"EN: Process assessment is only one enabler","q":"Czy ocena procesów daje pełny obraz Ładu w organizacji?","a":"Nie. Procesy to tylko jeden z siedmiu aktywatorów; trzeba ocenić też pozostałe.","ex":"Ocena samych przepisów nie mówi wszystkiego o restauracji – liczą się też ludzie, sprzęt, informacje, kultura. Procesy to jeden z siedmiu elementów.","org":""}},"fz-D-043":{"id":"fz-D-043","typ":"egzamin","s":"PC-01-01","t":"Co oznacza poziom 0 – Proces niekompletny?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42"],"r":null,"zap":"","scen":"","o":[{"t":"Proces osiąga cel, ale działa bez planowania","ok":false,"w":"To poziom 1 – Proces wykonywany."},{"t":"Proces nie działa albo nie osiąga celu; prawie nie ma dowodów, że cel jest osiągany regularnie","ok":true,"w":"Tak opisuje poziom 0 fiszka."},{"t":"Proces działa według standardu, ale nie jest mierzony","ok":false,"w":"To poziom 3 – Proces ustanowiony."},{"t":"Proces ma ocenę W na PA 1.1","ok":false,"w":"W na PA 1.1 wystarcza już do poziomu 1."}],"fz":{"h":"Poziom 0 i poziom 1","p":"P1","pulapka":false,"n":"egzamin: niekompletny, wykonywany · podr.: niekompletny, wykonywany · EN: Level 0 Incomplete, Level 1 Performed","q":"Czym są poziomy 0 i 1? | Co oznacza poziom 0 – Proces niekompletny?","a":"0: proces niekompletny, nie osiąga celu. 1: proces wykonywany, osiąga swój cel (PA 1.1). Poziom 1 jest szczególny: ocenia się wyniki procesu. | Proces nie działa albo nie osiąga celu; prawie nie ma dowodów, że cel jest osiągany regularnie.","ex":"Poziom 0: obiad nie wychodzi albo wychodzi przypadkiem. Poziom 1: goście regularnie dostają obiad, choć kuchnia działa „na żywioł”, bez planu. | Kuchnia, w której obiad czasem wychodzi, a czasem nie, i nikt nie umie pokazać, że wychodzi regularnie. Biały pas – dopiero start.","org":"jeśli PA 1.1 procesu DSS02 oceniono na W lub P (wg celu i wymaganych wyników procesu), a wymagania poziomu 2 nie są spełnione → poziom 1."}},"fz-D-044":{"id":"fz-D-044","typ":"egzamin","s":"PC-01-01","t":"Co jest istotą poziomu 1 – Proces wykonywany?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42"],"r":null,"zap":"","scen":"","o":[{"t":"Proces jest planowany, monitorowany i korygowany","ok":false,"w":"Planowanie należy już do poziomu 2."},{"t":"Proces osiąga swój cel; ocenia się jeden atrybut – PA 1.1","ok":true,"w":"Poziom 1 ustala, czy proces w ogóle osiąga cel."},{"t":"Proces jest rozumiany ilościowo i trzymany w granicach","ok":false,"w":"To poziom 4."},{"t":"Proces działa według zdefiniowanego standardu","ok":false,"w":"To poziom 3."}],"fz":{"h":"Poziom 1 – Proces wykonywany","p":"P1","pulapka":false,"n":"EN: Level 1 Performed","q":"Co oznacza poziom 1 – Proces wykonywany? | Czym poziom 1 różni się od wyższych poziomów?","a":"Proces działa i osiąga swój cel (przeznaczenie). Ocenia się jeden atrybut: PA 1.1. Planowanie należy już do poziomu 2. | Ustala, czy proces w ogóle osiąga cel – to ważne osiągnięcie i fundament wyższych poziomów; wymaga co najmniej W na PA 1.1.","ex":"Goście regularnie dostają obiad – cel osiągnięty, nawet jeśli kucharze pracują bez grafiku i improwizują. Liczy się wynik, nie porządek. | Poziom 1 to najważniejsze pytanie: czy goście w ogóle dostają obiad? Bez tego porządek, receptury i pomiary nie mają sensu.","org":""}},"fz-D-045":{"id":"fz-D-045","typ":"egzamin","s":"PC-02-01","t":"Czy celem organizacji zawsze powinien być poziom 5 zdolności?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 43"],"r":null,"zap":"","scen":"","o":[{"t":"Tak – tylko poziom 5 jest zgodny z ISO/IEC 15504","ok":false,"w":"Zgodność z normą nie wymaga poziomu 5."},{"t":"Nie – poziom docelowy dobiera się do kosztów, korzyści i wykonalności; ambicją wielu jest poziom 1","ok":true,"w":"Fiszka: bardzo rzadko celem jest najwyższy poziom."},{"t":"Tak – niższe poziomy oznaczają, że proces nie działa","ok":false,"w":"Już poziom 1 oznacza, że proces osiąga cel."},{"t":"Nie – celem zawsze jest poziom 3","ok":false,"w":"Nie ma jednego poziomu dla wszystkich; dobiera go organizacja."}],"fz":{"h":"Poziom docelowy","p":"P2","pulapka":false,"n":"egzamin: docelowy poziom zdolności · podr.: docelowy poziom potencjału · EN: target capability level","q":"Czy celem zawsze jest poziom 5? | Jaki poziom docelowy powinna wybrać organizacja?","a":"Nie. Poziom dobiera się do potrzeb, kosztów i wykonalności. | Własny, wg kosztów, korzyści i wykonalności – bardzo rzadko najwyższy. Ambicją wielu jest poziom 1 dla wszystkich procesów.","ex":"Nie każdy potrzebuje czarnego pasa: budka z kebabem nie musi gotować jak restauracja z gwiazdką Michelin. Cel dobiera się do potrzeb i budżetu. | Budka z kebabem nie potrzebuje gwiazdki Michelin. Wiele firm byłoby zadowolonych, gdyby każdy ich proces po prostu działał (poziom 1).","org":"DSS02: cel poziom 3."}},"fz-D-046":{"id":"fz-D-046","typ":"egzamin","s":"PC-01-01","t":"Jak brzmią nazwy egzaminacyjne poziomów zdolności 2–5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42"],"r":null,"zap":"","scen":"","o":[{"t":"Powtarzalny, zdefiniowany, zarządzany i mierzalny, zoptymalizowany","ok":false,"w":"To nazwy z modelu dojrzałości COBIT 4.1."},{"t":"Wykonywany, zarządzany, ustanowiony, przewidywalny","ok":false,"w":"Wykonywany to poziom 1, nazwy przesunięto o jeden."},{"t":"Zarządzany, ustanowiony, przewidywalny, zoptymalizowany","ok":true,"w":"Haczyk Z-U-P-O, jak „zupa”."},{"t":"Zarządzany, przewidywalny, ustanowiony, zoptymalizowany","ok":false,"w":"Ustanowiony (3) jest przed przewidywalnym (4)."}],"fz":{"h":"Poziomy 2–5","p":"P1","pulapka":true,"n":"egzamin: zarządzany, ustanowiony, przewidywalny, zoptymalizowany · podr.: zarządzany, ustanowiony, przewidywalny, optymalizujący · EN: Managed, Established, Predictable, Optimising","q":"Nazwij poziomy 2–5. | Podaj sześć poziomów zdolności procesu (nazwy egzaminacyjne).","a":"2 zarządzany (planowany i pilnowany); 3 ustanowiony (zdefiniowany standard wdrożony w praktyce – sam dokument nie wystarczy); 4 przewidywalny (ilościowo rozumiany i trzymany w granicach – samo mierzenie nie wystarczy); 5 zoptymalizowany (podr.: optymalizujący; stale ulepszany). | 0 Proces niekompletny, 1 Proces wykonywany, 2 Proces zarządzany, 3 Proces ustanowiony, 4 Proces przewidywalny, 5 Proces zoptymalizowany (podr. optymalizujący).","ex":"Kuchnia: 2 – szef planuje i pilnuje; 3 – spisane receptury dla wszystkich; 4 – mierzy się czas i jakość; 5 – menu stale ulepszane. Haczyk: Z-U-P-O, jak „zupa”. | Haczyk: najpierw N i W (niekompletny, wykonywany), potem Z-U-P-O jak „zupa”: zarządzany, ustanowiony, przewidywalny, zoptymalizowany.","org":""}},"fz-D-047":{"id":"fz-D-047","typ":"egzamin","s":"PC-02-02","t":"Kiedy korzysta się z Przewodnika Asesora?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 41"],"r":null,"zap":"","scen":"","o":[{"t":"Do uproszczonej samooceny bez formalnego zbierania dowodów","ok":false,"w":"To Przewodnik Samooceny."},{"t":"Do opisu przeznaczenia i rezultatów procesów","ok":false,"w":"To rola Referencyjnego Modelu Procesu (PRM)."},{"t":"Do formalnej oceny zgodnej z ISO, opartej na dowodach, prowadzonej przez przeszkoloną osobę oceniającą","ok":true,"w":"Tak opisuje go fiszka."},{"t":"Do przygotowania uzasadnienia biznesowego","ok":false,"w":"Uzasadnienie biznesowe to element wdrożenia, a nie oceny."}],"fz":{"h":"Przewodnik Asesora","p":"P2","pulapka":false,"n":"egzamin: Przewodnik Asesora · podr.: Przewodnik osoby oceniającej · EN: Assessor Guide","q":"Do czego służy? | Do czego służą Przewodnik Asesora i Przewodnik Samooceny?","a":"Do formalnej oceny zdolności opartej na dowodach. Prowadzi ją przeszkolona osoba oceniająca (asesor), często z zewnątrz – coś jak egzaminator na prawo jazdy. | Przewodnik Asesora: formalna ocena zgodna z ISO, oparta na dowodach, prowadzona przez kompetentną, przeszkoloną osobę oceniającą. Przewodnik Samooceny: uproszczona ocena wewnętrzna bez formalnego zbierania dowodów, oparta na osądzie uczestników; wynik orientacyjny, np. przed oceną formalną.","ex":"Jak egzamin na prawo jazdy: przychodzi egzaminator z listą, sprawdza dowody i wystawia oficjalny wynik. Przewodnik to jego instrukcja. Haczyk: asesor = ten, kto ocenia. | Jak egzamin na prawo jazdy z egzaminatorem i jazda próbna z rodzicem: pierwszy daje oficjalny wynik, druga pokazuje, czy jesteś gotowy.","org":"ocena zewnętrzna po 9 miesiącach."}},"fz-D-048":{"id":"fz-D-048","typ":"egzamin","s":"PC-02-02","t":"Czym charakteryzuje się Przewodnik Samooceny?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 41"],"r":null,"zap":"","scen":"","o":[{"t":"Wymaga zewnętrznej, przeszkolonej osoby oceniającej","ok":false,"w":"To cecha Przewodnika Asesora."},{"t":"Daje oficjalny wynik formalnej oceny","ok":false,"w":"Samoocena daje wynik orientacyjny."},{"t":"Pozwala organizacji ocenić się samodzielnie, w uproszczony sposób","ok":true,"w":"Tak mówi fiszka."},{"t":"Zawiera wskaźniki oceny dla procesów","ok":false,"w":"Wskaźniki oceny opisuje Model Oceny Procesu (PAM)."}],"fz":{"h":"Przewodnik Samooceny","p":"P2","pulapka":false,"n":"egzamin: Przewodnik Samooceny · podr.: Podręcznik samooceny · EN: Self-assessment Guide","q":"Do czego służy?","a":"Pozwala organizacji ocenić się samodzielnie, w uproszczony sposób.","ex":"Jak jazda próbna przed egzaminem: szef kuchni sam przechodzi listę pytań, bez formalnego zbierania dowodów, i dostaje wynik orientacyjny – często jako przygotowanie do oceny formalnej.","org":"ocena wewnętrzna w fazie 2."}},"fz-D-049":{"id":"fz-D-049","typ":"egzamin","s":"PC-02-06","t":"Kiedy proces osiąga dany poziom zdolności?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42"],"r":null,"zap":"","scen":"","o":[{"t":"Gdy atrybuty tego poziomu mają P, a niższych poziomów co najmniej W","ok":false,"w":"Warunki są tu odwrócone."},{"t":"Gdy średnia ocen wszystkich atrybutów przekracza 50%","ok":false,"w":"Nie liczy się średniej – każdy atrybut ocenia się osobno."},{"t":"Gdy co najmniej jeden atrybut tego poziomu ma C","ok":false,"w":"C to za mało; potrzebne jest co najmniej W."},{"t":"Gdy atrybuty tego poziomu mają co najmniej W, a atrybuty wszystkich niższych poziomów – P","ok":true,"w":"To dwa warunki z fiszki."}],"fz":{"h":"Reguła osiągnięcia poziomu","p":"P1","pulapka":true,"n":"egzamin: zasada oceny · podr.: zasada oceny · EN: rating rule","q":"Kiedy proces osiąga dany poziom? | Kiedy proces osiąga dany poziom zdolności?","a":"Dwa warunki naraz: 1) atrybuty tego poziomu mają co najmniej W (Większościowy, ponad 50%); 2) atrybuty wszystkich niższych poziomów mają P (Pełny, ponad 85%). Do poziomu 1 wystarczy W na PA 1.1. | Gdy atrybuty tego poziomu mają ocenę W lub P (EN: L lub F), a atrybuty wszystkich niższych poziomów – P (EN: F).","ex":"Jak schody: na stopniu, na którym stoisz, wystarczy „prawie” (W), ale stopnie pod tobą muszą być całe (P). PA 1.1 = W, PA 2.x = P → nadal poziom 1. | Jak pasy: do nowego pasa wystarczy dobrze (W) zdać jego zadania, ale wszystkie wcześniejsze trzeba mieć opanowane w pełni (P).","org":"poziom 2: PA 2.1 i 2.2 ≥ W oraz PA 1.1 = P."}},"fz-D-050":{"id":"fz-D-050","typ":"egzamin","s":"PC-02-06","t":"Czy do poziomu 3 wystarczy ocena W na atrybutach poziomu 2?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 42"],"r":null,"zap":"","scen":"","o":[{"t":"Tak – W wystarcza na wszystkich poziomach","ok":false,"w":"W wystarcza tylko na poziomie ocenianym."},{"t":"Nie – atrybuty poziomu 2 muszą mieć P; W wystarcza tylko na atrybutach poziomu 3","ok":true,"w":"Niższe poziomy muszą być osiągnięte w pełni."},{"t":"Tak – jeśli atrybuty poziomu 3 mają P","ok":false,"w":"Dobre oceny wyższego poziomu nie nadrabiają niższego."},{"t":"Nie – wszystkie atrybuty, także poziomu 3, muszą mieć P","ok":false,"w":"Na atrybutach poziomu ocenianego wystarczy W."}],"fz":{"h":"Pełne osiągnięcie niższych poziomów","p":"P1","pulapka":true,"n":"EN: Full achievement of lower levels","q":"Czy do poziomu 3 wystarczy W na atrybutach poziomu 2?","a":"Nie. Wyższy poziom wymaga P (pełnego) na wszystkich atrybutach niższych poziomów; W wystarcza tylko na atrybutach poziomu ocenianego.","ex":"Nie dostaniesz czarnego pasa, jeśli brązowy masz tylko „prawie”. Niższe poziomy muszą być na P – „prawie” (W) wystarcza tylko na poziomie, który zdobywasz.","org":""}},"fz-D-051":{"id":"fz-D-051","typ":"egzamin","s":"PC-01-03","t":"Co oznacza litera P w skali ocen egzaminu PL?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 45"],"r":null,"zap":"","scen":"","o":[{"t":"Częściowy (EN: P – Partially achieved)","ok":false,"w":"Częściowy to po polsku C; angielskie P to nasze C."},{"t":"Pełny (EN: F – Fully achieved)","ok":true,"w":"Polskie P stoi na końcu skali, >85–100%."},{"t":"Większościowy (EN: L – Largely achieved)","ok":false,"w":"Większościowy to W."},{"t":"Nieosiągnięty (EN: N – Not achieved)","ok":false,"w":"Nieosiągnięty to N."}],"fz":{"h":"Skala ocen","p":"P1","pulapka":true,"n":"egzamin: N/C/W/P: Nieosiągnięty, Częściowy, Większościowy, Pełny · podr.: N/P/L/F: nie, częściowo, w znacznym stopniu, w pełni osiągnięto · EN: N/P/L/F: Not, Partially, Largely, Fully achieved","q":"Jaka jest skala ocen atrybutu? | Podaj skalę ocen atrybutu z zakresami procentowymi. | „P” w skali egzaminu PL – Częściowy czy Pełny?","a":"Litera mówi, na ile spełniono jeden atrybut: N Nieosiągnięty 0–15% · C Częściowy >15–50% · W Większościowy >50–85% · P Pełny >85–100%. Pułapka: P po polsku = Pełny, po angielsku = Partially (częściowy). | N Nieosiągnięty: 0–15%; C Częściowy: >15–50%; W Większościowy: >50–85%; P Pełny: >85–100%. EN: N/P/L/F. Procent = oceniony stopień osiągnięcia atrybutu, nie odsetek udanych zgłoszeń. | Pełny (EN: F). Częściowy to C (EN: P) – najczęstsza pułapka.","ex":"Jak ocena za jedno zadanie na sprawdzianie: N – prawie nic, C – mniej niż połowa, W – większość, P – prawie wszystko. Litery rosną jak pasek ładowania. | Jak procenty z kartkówki zamienione na litery: do 15% – N, do połowy – C, do 85% – W, powyżej – P. Haczyk: progi 15 – 50 – 85. | Haczyk: N-C-W-P = Nic, Coś, Większość, Pełnia. Polskie P stoi na końcu skali, czyli najwyżej; angielskie P (Partially) to nasze C.","org":""}},"fz-D-052":{"id":"fz-D-052","typ":"egzamin","s":"PC-02-05","t":"Do czego służyły modele dojrzałości COBIT 4.1?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 41"],"r":null,"zap":"","scen":"","o":[{"t":"Do formalnej certyfikacji według ISO/IEC 15504","ok":false,"w":"Na ISO/IEC 15504 oparto dopiero model COBIT 5."},{"t":"Do oceny wyłącznie aktywatora Informacja","ok":false,"w":"Modele dojrzałości dotyczyły procesów."},{"t":"Do pomiaru obecnej i wymaganej dojrzałości procesów, luki między nimi i sposobu doskonalenia","ok":true,"w":"Tak opisuje je fiszka."},{"t":"Do przygotowania uzasadnienia biznesowego","ok":false,"w":"Uzasadnienie biznesowe to element wdrożenia, a nie modelu dojrzałości."}],"fz":{"h":"Modele dojrzałości COBIT 4.1","p":"P2","pulapka":false,"n":"EN: COBIT 4.1 maturity models","q":"Do czego służyły modele dojrzałości COBIT 4.1?","a":"Do pomiaru obecnej dojrzałości procesów („tak jest”), określenia wymaganej („tak ma być”), luki między nimi i sposobu doskonalenia.","ex":"Stary sposób: zdjęcie kuchni „jak jest dziś”, rysunek „jak ma być” i lista, co poprawić, żeby dojść od jednego do drugiego.","org":""}},"fz-D-053":{"id":"fz-D-053","typ":"egzamin","s":"PC-02-05","t":"Proces miał poziom 1 w COBIT 4.1, ale nie osiąga rezultatów procesu. Jaki poziom może dostać w COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 43","FW-PL s. 44"],"r":null,"zap":"","scen":"","o":[{"t":"0 – bez osiągnięcia rezultatów procesu nie ma poziomu 1","ok":true,"w":"Stąd zwykle niższe wyniki w COBIT 5."},{"t":"1 – poziomy przelicza się 1:1","ok":false,"w":"Prostego przełożenia nie ma."},{"t":"2 – w COBIT 5 wyniki są zwykle wyższe","ok":false,"w":"Wyniki w COBIT 5 są zwykle niższe."},{"t":"Nie da się go ocenić, bo COBIT 5 nie ma poziomu 0","ok":false,"w":"Poziom 0 – Proces niekompletny istnieje."}],"fz":{"h":"Niższe wyniki w COBIT 5","p":"P2","pulapka":false,"n":"EN: Lower scores in COBIT 5","q":"Dlaczego wyniki oceny COBIT 5 są zwykle niższe niż w COBIT 4.1? | Proces na poziomie 1 w COBIT 4.1 – jaki poziom w COBIT 5?","a":"W COBIT 4.1 proces mógł mieć poziom 1 lub 2 bez pełnego osiągnięcia celów procesu; w COBIT 5 taki proces dostanie 0 lub 1. | Może wyjść 0, jeśli nie osiąga rezultatów procesu – stąd zwykle niższe wyniki w COBIT 5.","ex":"Stary egzaminator dawał punkty „za starania”. Nowy pyta najpierw: czy kuchnia naprawdę osiąga swój cel (obiady dla gości)? Jeśli nie w pełni, zostaje na 0 lub 1. | Kuchnia, która „się stara, ale obiady nie zawsze wychodzą”, w starej skali dostawała 1, w nowej dostaje 0 – liczy się efekt.","org":""}},"fz-D-054":{"id":"fz-D-054","typ":"egzamin","s":"PC-02-05","t":"Co ocenia model zdolności COBIT 5 – organizację czy proces?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 41","FW-PL s. 43–44","FW-PL s. 43"],"r":null,"zap":"","scen":"","o":[{"t":"Całą organizację jednym wynikiem","ok":false,"w":"Ocena dotyczy procesu, a nie całej organizacji."},{"t":"Profil dojrzałości całego przedsiębiorstwa","ok":false,"w":"Profil przedsiębiorstwa składało się w COBIT 4.1."},{"t":"Tylko procesy domeny EDM","ok":false,"w":"Ocenia się każdy proces, nie tylko EDM."},{"t":"Każdy proces osobno, według dziewięciu wspólnych atrybutów","ok":true,"w":"COBIT 5 = proces po procesie."}],"fz":{"h":"Profil organizacji czy procesu","p":"P1","pulapka":true,"n":"EN: Enterprise maturity profile vs per-process capability","q":"Co daje model COBIT 4.1, a co COBIT 5 – profil organizacji czy procesu? | Model zdolności ocenia organizację czy proces?","a":"COBIT 4.1 oceniał dojrzałość procesów i pozwalał złożyć z nich profil dojrzałości przedsiębiorstwa. COBIT 5 ocenia zdolność każdego procesu według dziewięciu wspólnych atrybutów. Ocen 4.1 nie przeliczysz 1:1. | Proces – każdy osobno, według dziewięciu atrybutów. COBIT 4.1 też oceniał procesy, ale z ocen składał profil dojrzałości przedsiębiorstwa.","ex":"COBIT 4.1 oceniał stanowiska i składał z ocen profil całej restauracji. COBIT 5 ocenia każde stanowisko (proces) tymi samymi dziewięcioma atrybutami. | Inspektor ocenia każde stanowisko osobno (zmywak, grill). Haczyk: COBIT 5 = proces po procesie.","org":""}},"fz-D-055":{"id":"fz-D-055","typ":"egzamin","s":"PC-02-03","t":"Czy COBIT 5 ma osobny model dojrzałości dla każdego procesu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 43"],"r":null,"zap":"","scen":"","o":[{"t":"Nie – ISO/IEC 15504 tego nie wymaga; wystarczy opis procesu: cel, praktyki bazowe i produkty pracy","ok":true,"w":"Norma wręcz na to nie pozwala."},{"t":"Tak – każdy proces ma własną skalę 0–5","ok":false,"w":"Skala i atrybuty są wspólne dla wszystkich procesów."},{"t":"Tak, ale tylko procesy Ładu (EDM)","ok":false,"w":"Żaden proces nie ma osobnego modelu dojrzałości."},{"t":"Nie – bo COBIT 5 w ogóle nie ocenia procesów","ok":false,"w":"COBIT 5 ocenia zdolność procesów."}],"fz":{"h":"Brak osobnego modelu dojrzałości dla procesu","p":"P2","pulapka":false,"n":"EN: No per-process maturity model","q":"Czy COBIT 5 ma osobny model dojrzałości dla każdego procesu?","a":"Nie. Norma ISO/IEC 15504 tego nie wymaga, a wręc
