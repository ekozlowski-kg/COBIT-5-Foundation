szoną w strukturach ISACA.","ex":"Jak jeden pilot do całego domu: pasuje do innych urządzeń, obsługuje wszystkie pokoje, ma prosty układ przycisków i zastępuje kilka starych pilotów ISACA.","org":""}},"fz-A-033":{"id":"fz-A-033","typ":"egzamin","s":"PR-02-06","t":"Na jakim poziomie kończy się Kaskada Celów COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 18","FW-PL s. 21","FW-PL s. 27"],"r":null,"zap":"","scen":"","o":[{"t":"Na celach procesów Referencyjnego Modelu Procesu","ok":false,"w":"Procesy są tylko jedną z siedmiu kategorii aktywatorów. Ostatni krok nie ogranicza się do celów procesów, lecz obejmuje cele wszystkich stosownych aktywatorów."},{"t":"Na celach związanych z informatyką","ok":false,"w":"Cele związane z informatyką są poziomem poprzedzającym cele aktywatorów. Po ich ustaleniu trzeba określić cele wspierających je aktywatorów."},{"t":"Na celach organizacji","ok":false,"w":"Cele organizacji są wcześniejszym poziomem. Następnie wyprowadza się cele związane z informatyką i cele aktywatorów."},{"t":"Na celach wszystkich kategorii aktywatorów","ok":true,"w":"Ostatni krok to cele wszystkich kategorii aktywatorów. Procesy, kultura, struktury, informacja, zasady, usługi i ludzie potrzebują odpowiednich celów wspierających cele związane z informatyką."}],"fz":{"h":"Cele aktywatorów","p":"P1","pulapka":true,"n":"≠ TŁUMACZENIE · egzamin: cele aktywatora · podr.: cele czynników umożliwiających · EN: enabler goals · EN: Goals cascade ends with enabler goals","q":"Czy Kaskada Celów kończy się na procesach?","a":"Nie. Ostatnim krokiem Kaskady Celów są cele aktywatorów wszystkich siedmiu kategorii. Procesy są jedną z tych kategorii; cele związane z informatyką wymagają także odpowiednich celów informacji, struktur, kultury, zasad, usług i ludzi.","ex":"Kaskada to rzeka, która nie kończy się na jednym młynie: płynie do wszystkich siedmiu aktywatorów, także ludzi, kultury i informacji, nie tylko do procesów.","org":"cele procesu DSS02 (Manage Service Requests and Incidents — Zarządzanie zgłoszeniami serwisowymi i incydentami), rejestru zgłoszeń, dyżuru."}},"fz-A-034":{"id":"fz-A-034","typ":"egzamin","s":"PR-02-06","t":"Co następuje bezpośrednio po celach związanych z informatyką w Kaskadzie Celów?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 18"],"r":null,"zap":"","scen":"","o":[{"t":"Rezultaty IT jako osobny krok","ok":false,"w":"Osobnego kroku „rezultaty IT” w kaskadzie nie ma."},{"t":"Cele aktywatorów","ok":true,"w":"Po celach związanych z informatyką jest ostatni, czwarty krok: cele aktywatorów."},{"t":"Cele organizacji","ok":false,"w":"Cele organizacji są przed celami związanymi z informatyką."},{"t":"Potrzeby interesariuszy","ok":false,"w":"Potrzeby interesariuszy są na początku kaskady, zaraz po wyznacznikach."}],"fz":{"h":"Krok po celach IT","p":"P1","pulapka":false,"n":"EN: IT-related goals → enabler goals","q":"Co następuje bezpośrednio po celach związanych z informatyką w kaskadzie?","a":"Cele aktywatorów (krok 4). Nie ma osobnego kroku „rezultaty IT”.","ex":"Po celach IT jest już ostatni, czwarty krok – cele aktywatorów. Pułapka egzaminacyjna: wymyślony krok „rezultaty IT” nie istnieje.","org":""}},"fz-A-035":{"id":"fz-A-035","typ":"egzamin","s":"PR-02-02","t":"Od czego zaczyna się Kaskada Celów na Rysunku 4?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 17"],"r":null,"zap":"","scen":"","o":[{"t":"Od potrzeb interesariuszy","ok":false,"w":"Potrzeby są drugie – wpływają na nie wyznaczniki."},{"t":"Od celów organizacji","ok":false,"w":"Cele organizacji są dopiero po potrzebach interesariuszy."},{"t":"Od wyznaczników interesariuszy, np. nowych technologii lub regulacji","ok":true,"w":"Strzałka biegnie od wyznaczników do potrzeb interesariuszy – to krok 1."},{"t":"Od celu Ładu – Tworzenia wartości","ok":false,"w":"Korzyści, ryzyko i zasoby to perspektywy oceny potrzeb, a nie krok kaskady."}],"fz":{"h":"Wyznaczniki w kaskadzie","p":"P1","pulapka":false,"n":"EN: Drivers influence stakeholder needs","q":"Czy wyznaczniki są pierwszym czy drugim krokiem przed potrzebami?","a":"Pierwszym. Na Rysunku 4 strzałka prowadzi od wyznaczników (np. nowe technologie, regulacje) do potrzeb interesariuszy – to krok 1 kaskady.","ex":"Najpierw pogoda, potem potrzeba parasola: wyznacznik (np. nowe przepisy) wywołuje potrzebę interesariusza. Na rysunku strzałka biegnie od wyznaczników do potrzeb.","org":""}},"fz-A-036":{"id":"fz-A-036","typ":"egzamin","s":"PR-02-01","t":"Czy Tworzenie wartości oznacza minimalizację ryzyka i kosztów?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 17","FW-PL s. 93"],"r":null,"zap":"","scen":"","o":[{"t":"Tak – celem Ładu jest ryzyko zerowe","ok":false,"w":"Zerowe ryzyko nie jest celem; ryzyko ma być na akceptowalnym poziomie."},{"t":"Nie – chodzi o optymalizację: ryzyko na akceptowalnym poziomie i najlepsze wykorzystanie zasobów","ok":true,"w":"Tworzenie wartości to realizacja korzyści przy optymalizacji, a nie minimalizacji ryzyka i zasobów."},{"t":"Tak – celem jest najniższy możliwy koszt IT","ok":false,"w":"Minimum kosztów nie jest celem; chodzi o optymalne wykorzystanie zasobów."},{"t":"Nie – chodzi o maksymalizację korzyści bez względu na ryzyko","ok":false,"w":"Tworzenie wartości to równowaga korzyści, ryzyka i zasobów."}],"fz":{"h":"Optymalizacja ryzyka i zasobów","p":"P1","pulapka":false,"n":"egzamin: optymalizacja ryzyka / zasobów · podr.: optymalizacja ryzyka / zasobów · EN: risk / resource optimisation · EN: Optimisation, not minimisation","q":"Co oznaczają oba składniki? / Czy Tworzenie Wartości oznacza minimalizację ryzyka?","a":"Ryzyko na akceptowalnym poziomie (nie zero); najlepsze wykorzystanie zasobów. Optymalizacja, nie minimalizacja.\nNie. To równowaga: realizacja korzyści przy OPTYMALIZACJI ryzyka i zasobów. Zerowe ryzyko lub minimum kosztów nie jest celem.","ex":"Jak przy domu: nie zamykasz się w bunkrze (zero ryzyka), tylko akceptujesz rozsądne ryzyko. Ludzi i sprzętu tyle, ile trzeba – nie mniej, nie więcej.\nJak jazda autem: nie chodzi o to, by nigdy nie wyjeżdżać (zero ryzyka), tylko jeździć bezpiecznie i z sensem. Optymalnie, nie minimalnie.","org":"przerwa do 15 min akceptowana; dyżur bez nadmiaru etatów."}},"fz-A-037":{"id":"fz-A-037","typ":"egzamin","s":"PR-02-08,PR-01-03","t":"Czy EDM jest komponentem Podejścia do Ładu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 23"],"r":null,"zap":"","scen":"","o":[{"t":"Tak – to jeden z czterech komponentów, obok Celu, Zakresu i Ról","ok":false,"w":"Czwartym komponentem są Aktywatory Ładu, a nie EDM."},{"t":"Nie – EDM to domena procesów Ładu w Referencyjnym Modelu Procesu","ok":true,"w":"EDM to grupa procesów w katalogu, nie komponent Podejścia do Ładu."},{"t":"Tak – EDM zastępuje komponent Aktywatory Ładu","ok":false,"w":"Aktywatory Ładu to osobny komponent; EDM go nie zastępuje."},{"t":"Nie – EDM to domena Zarządzania","ok":false,"w":"EDM jest domeną Ładu, nie Zarządzania."}],"fz":{"h":"EDM a Podejście do Ładu","p":"P1","pulapka":true,"n":"EN: EDM is a domain, not a governance approach component","q":"Czy EDM jest komponentem Podejścia do Ładu?","a":"Nie. Komponenty to Cel Ładu, Aktywatory Ładu, Zakres Ładu oraz Role, działania i relacje. EDM to domena procesów Ładu w Referencyjnym Modelu Procesu.","ex":"Pułapka: EDM to grupa procesów w katalogu, a nie część podejścia do Ładu. Komponenty to cztery pytania: po co, czym, czego dotyczy, kto co robi.","org":""}},"fz-A-038":{"id":"fz-A-038","typ":"egzamin","s":"PR-01-04","t":"Domena MEA zajmuje się monitorowaniem. Do której części COBIT 5 należy?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 32"],"r":null,"zap":"","scen":"","o":[{"t":"Do Ładu, bo monitorowanie to zadanie organu Ładu","ok":false,"w":"Monitorowanie jest i w Ładzie (EDM), i w Zarządzaniu (MEA)."},{"t":"Do Ładu i Zarządzania jednocześnie","ok":false,"w":"Każda domena należy do jednego obszaru; MEA jest w Zarządzaniu."},{"t":"Do Zarządzania (PBRM) – monitoruje kierownictwo","ok":true,"w":"MEA to domena Zarządzania; w EDM monitoruje organ Ładu."},{"t":"Do żadnej – MEA jest poza Referencyjnym Modelem Procesu","ok":false,"w":"MEA ma 3 procesy w Referencyjnym Modelu Procesu."}],"fz":{"h":"MEA – Ład czy Zarządzanie","p":"P1","pulapka":true,"n":"EN: MEA is management","q":"MEA monitoruje – czy należy więc do Ładu?","a":"Nie. MEA to domena Zarządzania (PBRM). Monitorowanie w EDM wykonuje organ Ładu, a MEA – kierownictwo.","ex":"Sprawdzać może i właściciel, i kierownik. W EDM sprawdza rada (Ład), w MEA kierownictwo (Zarządzanie). Haczyk: MEA zaczyna się na M jak „menedżer”.","org":""}},"fz-A-039":{"id":"fz-A-039","typ":"egzamin","s":"PR-02-10","t":"Jak COBIT 5 odnosi się do ITIL, TOGAF i PRINCE2?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 25","FW-PL s. 26","FW-PL s. 61"],"r":null,"zap":"","scen":"","o":[{"t":"Zastępuje ich wytyczne na poziomie szczegółowych praktyk","ok":false,"w":"COBIT 5 dostarcza wytycznych na poziomie nadrzędnym. Szczegółowych praktyk nadal dostarczają stosowne standardy i metodyki; ich zastąpienie nie jest istotą integracji."},{"t":"Zastępuje wytyczne projektowe, zachowując wytyczne usługowe i architektoniczne","ok":false,"w":"COBIT 5 nie zastępuje PRINCE2 (Projects in Controlled Environments — projekty w kontrolowanych środowiskach) tylko dlatego, że obejmuje także programy i projekty. Inne struktury mogą dostarczać szczegółów dla wszystkich tych obszarów."},{"t":"Stosuje je jako niezależne modele bez wspólnej struktury","ok":false,"w":"Zasada 3 akcentuje spójność i integrację w jednej nadrzędnej strukturze. Nie chodzi o utrzymywanie niepowiązanych modeli."},{"t":"Integruje je jako nadrzędna struktura ramowa","ok":true,"w":"COBIT 5 może pełnić rolę nadrzędnej struktury ramowej, spójnej z ITIL (Information Technology Infrastructure Library — biblioteka praktyk zarządzania usługami informatycznymi), TOGAF (The Open Group Architecture Framework — struktura ramowa architektury The Open Group) i PRINCE2 (Projects in Controlled Environments — projekty w kontrolowanych środowiskach). Integruje ich wytyczne i pozwala korzystać ze szczegółów stosownie do potrzeb organizacji."}],"fz":{"h":"COBIT 5 a ITIL, TOGAF, PRINCE2","p":"P2","pulapka":false,"n":"EN: Integrator, not replacement","q":"Czy COBIT 5 zastępuje ITIL, TOGAF czy PRINCE2?","a":"Nie. Jest nadrzędną strukturą ramową, która je integruje i jest z nimi spójna; szczegóły bierze się z tych standardów.","ex":"COBIT 5 nie wyrzuca innych poradników – jest jak spis treści segregatora, w który wpinasz ITIL (Information Technology Infrastructure Library — biblioteka praktyk zarządzania usługami informatycznymi), TOGAF (The Open Group Architecture Framework — struktura ramowa architektury The Open Group) i PRINCE2 (Projects in Controlled Environments — projekty w kontrolowanych środowiskach) ze szczegółami.","org":""}},"fz-A-040":{"id":"fz-A-040","typ":"egzamin","s":"PR-01-01","t":"Czy Ład IT jest odrębny od ładu korporacyjnego?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 23"],"r":null,"zap":"","scen":"","o":[{"t":"Nie – jest jego częścią i obejmuje całą organizację, nie tylko funkcję IT","ok":true,"w":"Tak mówi Zasada 2: Pokrycie całej organizacji."},{"t":"Tak – Ład IT dotyczy wyłącznie działu IT","ok":false,"w":"Ład IT obejmuje całą organizację."},{"t":"Tak – Ład IT stoi ponad ładem korporacyjnym i go nadzoruje","ok":false,"w":"Ład IT jest częścią ładu korporacyjnego, a nie nad nim."},{"t":"Nie – bo Ład IT całkowicie zastępuje ład korporacyjny","ok":false,"w":"Ład IT jest częścią ładu korporacyjnego, nie jego zamiennikiem."}],"fz":{"h":"Ład IT a ład korporacyjny","p":"P2","pulapka":false,"n":"EN: Governance of enterprise IT is part of corporate governance","q":"Czy Ład IT jest odrębny od ładu korporacyjnego?","a":"Nie. Zasada 2: Ład IT jest częścią ładu korporacyjnego i obejmuje całą organizację, nie tylko funkcję IT.","ex":"Rachunek za internet to część budżetu domu, nie osobny budżet. Tak samo Ład IT to część rządzenia całą organizacją.","org":""}},"fz-A-041":{"id":"fz-A-041","typ":"egzamin","s":"PR-01-02","t":"Dlaczego aktywatorów nie można rozpatrywać osobno?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 28"],"r":null,"zap":"","scen":"","o":[{"t":"Bo wszystkie należą do domeny EDM","ok":false,"w":"Aktywatory to 7 kategorii, a nie procesy jednej domeny."},{"t":"Bo każdy aktywator ma ten sam cel","ok":false,"w":"Każdy aktywator ma własne cele; łączy je wymiana wejść i wyników."},{"t":"Bo są wzajemnie powiązane: każdy potrzebuje wejść od innych i daje wyniki innym","ok":true,"w":"Np. procesy potrzebują informacji, a struktury – umiejętności i zachowań."},{"t":"Bo tylko procesy mają cele, a reszta aktywatorów jedynie je wspiera","ok":false,"w":"Cele mają wszystkie aktywatory – kaskada kończy się na celach każdego z nich."}],"fz":{"h":"Powiązania aktywatorów","p":"P1","pulapka":false,"n":"EN: Interconnected enablers","q":"Dlaczego aktywatorów nie można rozpatrywać osobno?","a":"Są wzajemnie powiązane: każdy potrzebuje wejść od innych (procesy – informacji, struktury – umiejętności i zachowań) i daje wyniki innym.","ex":"Jak w kuchni: kucharz potrzebuje przepisu (informacja), umiejętności i sprzętu, a jego danie trafia do kelnera. Elementy przekazują sobie wyniki, więc działają razem.","org":""}},"fz-A-042":{"id":"fz-A-042","typ":"egzamin","s":"PR-02-13","t":"Wskaźnik mierzy, czy cel aktywatora został osiągnięty. Jaki to wskaźnik?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 29","Altkom — Różnice tłumaczenia PL, s. 1"],"r":null,"zap":"","scen":"","o":[{"t":"Wiodący, bo zapowiada przyszły wynik","ok":false,"w":"Wiodące dotyczą cyklu życia i dobrych praktyk (pytania 3–4), nie samego wyniku."},{"t":"Opóźniony, bo dotyczy wyniku","ok":true,"w":"Opóźniony – dotyczy wyniku (pytania 1–2). Wiodące dotyczą cyklu życia i dobrych praktyk (pytania 3–4)."},{"t":"Wiodący, bo dotyczy dobrych praktyk","ok":false,"w":"Pomiar osiągnięcia celu dotyczy wyniku, a nie dobrych praktyk."},{"t":"Podstawowy (P), bo dotyczy głównego celu","ok":false,"w":"P (Primary — powiązanie podstawowe) i S (Secondary — powiązanie wspierające) to relacje w macierzach mapowania, nie rodzaje wskaźników."}],"fz":{"h":"Wskaźnik osiągnięcia celu aktywatora","p":"P1","pulapka":true,"n":"EN: Lag = outcome","q":"Wskaźnik mierzy, czy cel aktywatora osiągnięto. Wiodący czy opóźniony?","a":"Opóźniony – dotyczy wyniku (pytania 1–2). Wiodące dotyczą cyklu życia i dobrych praktyk (pytania 3–4).","ex":"Opóźniony to wynik meczu po końcowym gwizdku – pokazuje, czy cel osiągnięto. Wiodące to treningi i kondycja przed meczem – zapowiadają wynik.","org":""}},"fz-A-043":{"id":"fz-A-043","typ":"egzamin","s":"PR-02-04","t":"Co oznacza litera S w macierzach mapowania Kaskady Celów?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 18","FW-PL s. 19","FW-PL s. 20"],"r":null,"zap":"","scen":"","o":[{"t":"Brak istotnego związku","ok":false,"w":"Puste pole oznacza, że typowa macierz nie wskazuje istotnego związku. Litera S (Secondary — powiązanie wspierające) oznacza istniejące powiązanie wspierające, słabsze od P (Primary — powiązanie podstawowe)."},{"t":"Powiązanie podstawowe, najsilniejsze","ok":false,"w":"Powiązanie podstawowe oznacza P (Primary — powiązanie podstawowe). S (Secondary — powiązanie wspierające) oznacza powiązanie wspierające; obie litery opisują typowy stopień powiązania, a nie rodzaj celu."},{"t":"Cel strategiczny organizacji","ok":false,"w":"S (Secondary — powiązanie wspierające) nie oznacza strategicznego rodzaju celu. Oznacza stopień powiązania — wspierający — w konkretnej macierzy."},{"t":"Powiązanie wspierające, słabsze od P","ok":true,"w":"S (Secondary — wspierające; podr. drugorzędne) wskazuje relację słabszą od P (Primary — podstawowe), ale nadal istotną. Tabele nie są uniwersalną prawdą: mapowania należy dopasować do kontekstu organizacji."}],"fz":{"h":"P i S w macierzach","p":"P1","pulapka":false,"n":"≠ TŁUMACZENIE · egzamin: podstawowe / wspierające · podr.: podstawowe / drugorzędne · EN: primary / secondary · EN: Secondary ≠ none","q":"Czy relacja S oznacza brak związku z celem Ładu?","a":"P (Primary — podstawowe) oznacza powiązanie podstawowe. S (Secondary — wspierające; podr. drugorzędne) oznacza powiązanie słabsze od P, lecz nadal istotne. Na Rysunku 5 powiązania łączą cele organizacji z korzyściami, ryzykiem i zasobami; w załącznikach stosuje się je również na dalszych poziomach kaskady. Puste pole oznacza brak wskazanej istotnej relacji w typowym mapowaniu, a nie uniwersalny zakaz powiązania. Macierze trzeba dostosować do kontekstu organizacji.","ex":"Macierz to mapa typowych powiązań: główne oznacza się P (Primary — powiązanie podstawowe), pomocnicze S (Secondary — powiązanie wspierające). Puste pole mówi, że model nie wskazał istotnej relacji; organizacja może dopasować mapę do własnej sytuacji. Nie oznacza to, że inna droga nigdy nie istnieje.","org":"CO7 (Enterprise Goal 7 — cel organizacji 7: Ciągłość i dostępność usług biznesowych) →P (Primary — powiązanie podstawowe)→ IT04 (IT-related Goal 04 — cel związany z informatyką 04: Zarządzanie ryzykiem biznesowym związanym z IT); CO7 →S (Secondary — powiązanie wspierające)→ IT07 (IT-related Goal 07 — cel związany z informatyką 07: Dostarczanie usług IT zgodnie z wymogami biznesowymi)."}},"fz-A-044":{"id":"fz-A-044","typ":"egzamin","s":"PR-02-14","t":"Czy Ład i Zarządzanie mają te same struktury organizacyjne?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 14"],"r":null,"zap":"","scen":"","o":[{"t":"Nie — wymagają różnych struktur organizacyjnych","ok":true,"w":"Ład i Zarządzanie mają różne działania, struktury i cele. Wybrane obowiązki Ładu można delegować specjalnym strukturom na właściwym poziomie; takie delegowanie nie znosi rozróżnienia dyscyplin."},{"t":"Tak – to jedna struktura, różnią się tylko nazwą","ok":false,"w":"Zasada 5: Ład i Zarządzanie wymagają różnych struktur."},{"t":"Nie – a odpowiedzialności Ładu nie wolno nikomu delegować","ok":false,"w":"Odpowiedzialności Ładu można delegować specjalnym strukturom."},{"t":"Tak – bo mają te same działania i cele","ok":false,"w":"Ład i Zarządzanie mają różne działania i cele."}],"fz":{"h":"Struktury Ładu i Zarządzania","p":"P1","pulapka":true,"n":"EN: Different structures","q":"Czy Ład i Zarządzanie mają te same struktury organizacyjne?","a":"Ład i Zarządzanie są różnymi dyscyplinami: mają odmienne działania i cele oraz wymagają różnych struktur organizacyjnych. Poszczególne obowiązki Ładu mogą być delegowane specjalnym strukturom na właściwym poziomie; nie znosi to rozróżnienia obu dyscyplin.","ex":"W klubie sportowym zarząd i trenerzy to różne grupy z innymi zadaniami. Zarząd może jednak powołać komisję, która zrobi część jego pracy.","org":""}},"fz-A-045":{"id":"fz-A-045","typ":"egzamin","s":"PR-02-04,PR-02-05","t":"Czy zrównoważona karta wyników (BSC) dotyczy tylko celów organizacji?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 18–19"],"r":null,"zap":"","scen":"","o":[{"t":"Tak – cele związane z informatyką nie są grupowane w wymiarach","ok":false,"w":"Cele związane z informatyką grupuje się w wymiarach IT BSC."},{"t":"Nie – cele organizacji są w wymiarach BSC, a cele związane z informatyką w wymiarach IT BSC","ok":true,"w":"Obie listy po 17 celów mają te same cztery rubryki."},{"t":"Tak – cele IT grupuje się według domen PBRM","ok":false,"w":"Domeny grupują procesy, a cele IT są w wymiarach IT BSC."},{"t":"Nie – BSC grupuje też procesy domeny EDM","ok":false,"w":"BSC grupuje cele organizacji i cele IT, nie procesy."}],"fz":{"h":"BSC i IT BSC","p":"P2","pulapka":false,"n":"egzamin: zrównoważona karta wyników (BSC) · podr.: zrównoważona karta wyników (BSC) · EN: balanced scorecard · EN: BSC and IT BSC","q":"W jakich wymiarach grupuje się cele? / Czy BSC dotyczy tylko celów organizacji?","a":"Cele organizacji w wymiarach BSC: finanse, klient, obszar wewnętrzny, szkolenie i rozwój. Cele związane z informatyką w wymiarach IT BSC.\nNie. Cele organizacji ułożono w wymiarach BSC, a cele związane z informatyką – w wymiarach IT BSC; obie listy mają po 17 celów.","ex":"Cztery rubryki jak na świadectwie: pieniądze, klient, wnętrze firmy (jak pracujemy), nauka i rozwój. Cele IT mają takie same cztery rubryki.\nBSC (Zrównoważona karta wyników) to tablica z czterema rubrykami: pieniądze, klient, praca wewnątrz, rozwój ludzi. Firma i IT mają osobne tablice, po 17 celów.","org":""}},"fz-A-046":{"id":"fz-A-046","typ":"egzamin","s":"PR-02-04","t":"Który z poniższych NIE jest wymiarem zrównoważonej karty wyników (BSC) w COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 18–19"],"r":null,"zap":"","scen":"","o":[{"t":"Finanse","ok":false,"w":"Finanse to jeden z czterech wymiarów BSC."},{"t":"Klient","ok":false,"w":"Klient to jeden z czterech wymiarów BSC."},{"t":"Szkolenie i rozwój","ok":false,"w":"Szkolenie i rozwój to jeden z czterech wymiarów BSC."},{"t":"Ryzyko","ok":true,"w":"Wymiary BSC to: finanse, klient, obszar wewnętrzny, szkolenie i rozwój – ryzyka wśród nich nie ma."}],"fz":{"h":"BSC i IT BSC","p":"P2","pulapka":false,"n":"egzamin: zrównoważona karta wyników (BSC) · podr.: zrównoważona karta wyników (BSC) · EN: balanced scorecard · EN: BSC and IT BSC","q":"W jakich wymiarach grupuje się cele? / Czy BSC dotyczy tylko celów organizacji?","a":"Cele organizacji w wymiarach BSC: finanse, klient, obszar wewnętrzny, szkolenie i rozwój. Cele związane z informatyką w wymiarach IT BSC.\nNie. Cele organizacji ułożono w wymiarach BSC, a cele związane z informatyką – w wymiarach IT BSC; obie listy mają po 17 celów.","ex":"Cztery rubryki jak na świadectwie: pieniądze, klient, wnętrze firmy (jak pracujemy), nauka i rozwój. Cele IT mają takie same cztery rubryki.\nBSC (Zrównoważona karta wyników) to tablica z czterema rubrykami: pieniądze, klient, praca wewnątrz, rozwój ludzi. Firma i IT mają osobne tablice, po 17 celów.","org":""}},"fz-A-047":{"id":"fz-A-047","typ":"egzamin","s":"PR-01-04","t":"Czy przypisanie procesu do domeny ogranicza go do jednego z obszarów PBRM?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 32","FW-PL s. 33"],"r":null,"zap":"","scen":"","o":[{"t":"Tak – proces z APO wykonuje wyłącznie planowanie","ok":false,"w":"Większość procesów zawiera wszystkie cztery działania PBRM (Plan, Build, Run and Monitor — Planuj, Wytwarzaj/Twórz, Wykonuj i Monitoruj)."},{"t":"Nie — domena wskazuje główny obszar działania procesu","ok":true,"w":"Przypisanie do domeny wskazuje najwłaściwszy główny obszar. Większość procesów potrzebuje planowania, budowania, wykonywania i monitorowania w swoim zakresie; PBRM (Plan, Build, Run and Monitor — Planuj, Wytwarzaj/Twórz, Wykonuj i Monitoruj) nie tworzy czterech rozłącznych etapów wyłącznych dla domen."},{"t":"Tak – każdy proces ma dokładnie jedną fazę PBRM","ok":false,"w":"Domena nie wyznacza jednej wyłącznej czynności. Większość procesów obejmuje działania z wszystkich czterech obszarów Zarządzania w odniesieniu do własnego zakresu."},{"t":"Nie – procesy w ogóle nie są przypisane do domen","ok":false,"w":"Każdy z 37 procesów jest przypisany do jednej z 5 domen."}],"fz":{"h":"Domeny a fazy PBRM","p":"P1","pulapka":true,"n":"EN: Domain = most relevant area","q":"Czy domeny przypisują procesy wyłącznie do jednej fazy PBRM?","a":"Nie. Domeny wskazują najwłaściwszy główny obszar działania procesu. Większość procesów obejmuje planowanie, budowanie, wykonywanie oraz monitorowanie w odniesieniu do własnego zakresu. PBRM (Plan, Build, Run and Monitor — Planuj, Wytwarzaj/Twórz, Wykonuj i Monitoruj) opisuje obszary działań Zarządzania, a nie cztery rozłączne etapy przypisane na wyłączność domenom.","ex":"Jak w domu: w każdym pokoju się sprząta, urządza i mieszka. Pokój nazywasz od jego głównego przeznaczenia – tak samo proces przypisano do domeny jego najwłaściwszego obszaru.","org":""}},"fz-A-048":{"id":"fz-A-048","typ":"egzamin","s":"PR-02-04","t":"Ile ogólnych celów organizacji opisuje COBIT 5 i jak się je grupuje?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 18","FW-PL s. 19"],"r":null,"zap":"","scen":"","o":[{"t":"17 celów w 4 wymiarach BSC","ok":true,"w":"17 ogólnych celów organizacji w czterech wymiarach zrównoważonej karty wyników: Finanse — cele 1–5; Klient — 6–10; Obszar wewnętrzny — 11–15; Szkolenie i rozwój — 16–17. Rozkład 5–5–5–2. Cel 7 „Ciągłość i dostępność usług biznesowych” należy do wymiaru Klient. Cele związane z informatyką również mają cztery wymiary, lecz inny rozkład: 6–2–7–2."},{"t":"37 celów w 5 domenach","ok":false,"w":"37 to liczba procesów w 5 domenach, nie celów organizacji."},{"t":"17 celów w 5 domenach procesów","ok":false,"w":"Cele organizacji grupuje się w wymiarach BSC (Balanced Scorecard — zrównoważona karta wyników), a nie w domenach."},{"t":"13 celów w 4 wymiarach BSC","ok":false,"w":"Celów organizacji jest 17; 13 procesów ma domena APO (Align, Plan and Organise — Dostosuj, Planuj i Organizuj)."}],"fz":{"h":"Cele organizacji","p":"P2","pulapka":false,"n":"≠ TŁUMACZENIE · egzamin: cele organizacji · podr.: cele przedsiębiorstwa · EN: enterprise goals · EN: 17 enterprise goals; BSC (Balanced Scorecard — zrównoważona karta wyników): Financial, Customer, Internal, Learning and Growth","q":"Ile jest celów organizacji i w jakich wymiarach BSC?","a":"17 ogólnych celów organizacji w czterech wymiarach zrównoważonej karty wyników: Finanse — cele 1–5; Klient — 6–10; Obszar wewnętrzny — 11–15; Szkolenie i rozwój — 16–17. Rozkład 5–5–5–2. Cel 7 „Ciągłość i dostępność usług biznesowych” należy do wymiaru Klient. Cele związane z informatyką również mają cztery wymiary, lecz inny rozkład: 6–2–7–2.","ex":"Zapamiętaj 17 celów i rozkład 5–5–5–2. Cel 7 dotyczący ciągłości i dostępności usług jest w wymiarze Klient, ponieważ odzwierciedla potrzeby odbiorców usług. Szkolenie i rozwój obejmuje dwa cele, 16 i17.","org":"CO7 (Enterprise Goal 7 — cel organizacji 7: Ciągłość i dostępność usług biznesowych) dla komendy: usługi wspierające działania dostępne zawsze."}},"fz-A-049":{"id":"fz-A-049","typ":"egzamin","s":"PR-02-04","t":"Ile celów organizacji należy do wymiaru BSC „Szkolenie i rozwój”?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 19"],"r":null,"zap":"","scen":"","o":[{"t":"5","ok":false,"w":"Po 5 celów mają finanse, klient i obszar wewnętrzny."},{"t":"7","ok":false,"w":"7 to liczba celów IT w obszarze wewnętrznym IT BSC."},{"t":"2","ok":true,"w":"Rozkład celów organizacji to 5-5-5-2; szkolenie i rozwój ma cele 16–17."},{"t":"6","ok":false,"w":"6 celów ma wymiar finansowy w IT BSC, nie szkolenie i rozwój celów organizacji."}],"fz":{"h":"Cele organizacji","p":"P2","pulapka":false,"n":"≠ TŁUMACZENIE · egzamin: cele organizacji · podr.: cele przedsiębiorstwa · EN: enterprise goals · EN: 17 enterprise goals; BSC: Financial, Customer, Internal, Learning and Growth","q":"Ile jest celów organizacji? / Ile jest celów organizacji i w jakich wymiarach BSC?","a":"17 ogólnych celów w 4 wymiarach BSC (Rys. 5), np. CO7 Ciągłość i dostępność usług biznesowych.\n17 celów w 4 wymiarach Zrównoważonej karty wyników: Finanse (1–5), Klient (6–10), Obszar wewnętrzny (11–15), Szkolenie i rozwój (16–17).","ex":"Haczyk: 17 jak „siedemnastka” – tyle samo celów ma organizacja i IT. Cel 7 dla straży: numer alarmowy działa zawsze.\nRozkład 5-5-5-2: po pięć celów w finansach, kliencie i obszarze wewnętrznym, dwa w rozwoju. Jak trzy pełne dłonie i dwa palce.","org":"CO7 dla komendy: usługi wspierające działania dostępne zawsze."}},"fz-A-050":{"id":"fz-A-050","typ":"egzamin","s":"PR-02-05","t":"W którym wymiarze IT BSC jest najwięcej celów związanych z informatyką?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 19"],"r":null,"zap":"","scen":"","o":[{"t":"Finanse","ok":false,"w":"Finanse mają 6 celów IT (Information Technology — technologie informacyjne) – mniej niż obszar wewnętrzny."},{"t":"Klient","ok":false,"w":"Klient ma tylko 2 cele IT (Information Technology — technologie informacyjne)."},{"t":"Szkolenie i rozwój","ok":false,"w":"Szkolenie i rozwój ma tylko 2 cele IT (Information Technology — technologie informacyjne)."},{"t":"Obszar wewnętrzny","ok":true,"w":"Wymiar Obszar wewnętrzny obejmuje cele związane z informatyką 09–15, czyli siedem. Pozostałe wymiary mają odpowiednio sześć, dwa i dwa cele; rozkład to 6–2–7–2."}],"fz":{"h":"Cele związane z informatyką","p":"P2","pulapka":false,"n":"≠ TŁUMACZENIE · egzamin: cele związane z informatyką · podr.: cele związane z IT (Information Technology — technologie informacyjne) · EN: IT-related goals · EN: 17 IT-related goals; IT BSC (Balanced Scorecard — zrównoważona karta wyników)","q":"Ile jest celów związanych z informatyką i w jakich wymiarach?","a":"17 celów w wymiarach IT (Information Technology — technologie informacyjne) BSC (Balanced Scorecard — zrównoważona karta wyników): Finanse (01–06), Klient (07–08), Obszar wewnętrzny (09–15), Szkolenie i rozwój (16–17).","ex":"Rozkład 6-2-7-2, inny niż u celów organizacji (5-5-5-2). Najwięcej celów IT (Information Technology — technologie informacyjne) dotyczy „zaplecza” (obszar wewnętrzny), najmniej klienta i rozwoju.","org":"IT04 (IT-related Goal 04 — cel związany z informatyką 04: Zarządzanie ryzykiem biznesowym związanym z IT) i IT07 (IT-related Goal 07 — cel związany z informatyką 07: Dostarczanie usług IT zgodnie z wymogami biznesowymi) wynikają z CO7 (Enterprise Goal 7 — cel organizacji 7: Ciągłość i dostępność usług biznesowych)."}},"fz-A-051":{"id":"fz-A-051","typ":"egzamin","s":"PR-02-03","t":"Która definicja interesariusza jest zgodna ze słownikiem COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 93"],"r":null,"zap":"","scen":"","o":[{"t":"Właściciel kapitału, który uczestniczy w finansowaniu organizacji","ok":false,"w":"Właściciele kapitału są interesariuszami, lecz nie wyczerpują definicji. Należą do niej także inne strony mające odpowiedzialność, oczekiwania lub udział w organizacji."},{"t":"Podmiot odpowiedzialny za organizację, mający wobec niej oczekiwania lub udział","ok":true,"w":"Definicja obejmuje każdą stronę odpowiedzialną za organizację, mającą wobec niej oczekiwania lub mającą w niej udział. Może to być interesariusz wewnętrzny lub zewnętrzny."},{"t":"Pracownik zatrudniony przy realizacji procesów organizacji","ok":false,"w":"Pracownik może być interesariuszem wewnętrznym. Definicja jest jednak szersza i obejmuje także strony zewnętrzne, np. klientów, dostawców i organy regulacyjne."},{"t":"Członek organu Ładu podejmujący decyzje o kierunku organizacji","ok":false,"w":"Organ Ładu jest jedną z ról związanych z organizacją, lecz interesariuszami są również inne strony. Utożsamienie pojęcia z członkostwem w organie Ładu nadmiernie je zawęża."}],"fz":{"h":"Interesariusz","p":"P1","pulapka":false,"n":"egzamin: interesariusz · podr.: interesariusz · EN: stakeholder · EN: Stakeholder","q":"Kim jest interesariusz?","a":"Interesariusz (stakeholder) to osoba lub podmiot, na którym spoczywa odpowiedzialność za organizację, który ma wobec niej oczekiwania lub ma w niej udział. Interesariusze mogą być wewnętrzni i zewnętrzni; nie ograniczają się do udziałowców, pracowników ani organu Ładu.","ex":"Każdy, kto zyskuje lub traci na działaniu organizacji: w szkole uczniowie, rodzice, nauczyciele, kuratorium i firma dowożąca obiady.","org":"komendy, kierownictwo, ministerstwo, obywatele."}},"fz-A-052":{"id":"fz-A-052","typ":"egzamin","s":"PR-02-02,PR-02-05,PR-02-06","t":"Jaka jest poprawna kolejność Kaskady Celów?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 17","FW-PL s. 18","FW-PL s. 19"],"r":null,"zap":"","scen":"","o":[{"t":"Potrzeby interesariuszy → wyznaczniki → cele organizacji → cele związane z informatyką → cele aktywatorów","ok":false,"w":"Wyznaczniki są pierwsze – to one wpływają na potrzeby."},{"t":"Wyznaczniki → potrzeby interesariuszy → cele związane z informatyką → cele organizacji → cele aktywatorów","ok":false,"w":"Cele organizacji są przed celami związanymi z informatyką."},{"t":"Wyznaczniki → potrzeby interesariuszy → cele organizacji → cele aktywatorów → cele związane z informatyką","ok":false,"w":"Cele aktywatorów to ostatni krok kaskady."},{"t":"Wyznaczniki → potrzeby interesariuszy → cele organizacji → cele związane z informatyką → cele aktywatorów","ok":true,"w":"Kolejność: wyznaczniki interesariuszy → potrzeby interesariuszy → cele organizacji → cele związane z informatyką → cele aktywatorów. Krok 1: wyznaczniki wpływają na potrzeby. Krok 2: potrzeby przekłada się na cele organizacji. Krok 3: cele organizacji na cele związane z informatyką. Krok 4: cele związane z informatyką na cele wszystkich kategorii aktywatorów. Nie dodaje się osobnego kroku „rezultaty IT (Information Technology — technologie informacyjne)”."}],"fz":{"h":"Kaskada celów","p":"P1","pulapka":false,"n":"egzamin: kaskada celów · podr.: kaskada celów · EN: goals cascade · EN: Stakeholder drivers → stakeholder needs → enterprise goals → IT (Information Technology — technologie informacyjne)-related goals → enabler goals","q":"Podaj kolejność Kaskady Celów.","a":"Kolejność: wyznaczniki interesariuszy → potrzeby interesariuszy → cele organizacji → cele związane z informatyką → cele aktywatorów. Krok 1: wyznaczniki wpływają na potrzeby. Krok 2: potrzeby przekłada się na cele organizacji. Krok 3: cele organizacji na cele związane z informatyką. Krok 4: cele związane z informatyką na cele wszystkich kategorii aktywatorów. Nie dodaje się osobnego kroku „rezultaty IT (Information Technology — technologie informacyjne)”.","ex":"Haczyk W-P (Primary — powiązanie podstawowe)-O-I-A: „Wiatr Popycha Organizację, IT (Information Technology — technologie informacyjne), Aktywatory”. Od przyczyny (wyznaczniki) do konkretnych zadań (aktywatory), jak woda spływająca po schodach.","org":"awaria → „usługi bez przerw” → CO7 (Enterprise Goal 7 — cel organizacji 7: Ciągłość i dostępność usług biznesowych) → IT04 (IT-related Goal 04 — cel związany z informatyką 04: Zarządzanie ryzykiem biznesowym związanym z IT) → DSS02 (Manage Service Requests and Incidents — Zarządzanie zgłoszeniami serwisowymi i incydentami)."}},"fz-A-053":{"id":"fz-A-053","typ":"egzamin","s":"PR-02-01","t":"Które stwierdzenie najlepiej oddaje istotę optymalizacji ryzyka w COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 17","FW-PL s. 93"],"r":null,"zap":"","scen":"","o":[{"t":"Zarządzanie rozpoznanym ryzykiem w granicach apetytu organizacji","ok":true,"w":"Optymalizacja obejmuje rozpoznanie ryzyka, ocenę skutków i prawdopodobieństwa oraz dobranie postępowania utrzymującego ryzyko w granicach apetytu organizacji. Nie jest równoznaczna z doprowadzeniem ryzyka do minimum za każdą cenę."},{"t":"Zmniejszanie ryzyka do najniższego możliwego poziomu","ok":false,"w":"Najniższe możliwe ryzyko może uniemożliwiać uzyskanie oczekiwanych korzyści lub zużywać nadmierne zasoby. COBIT 5 wymaga optymalizacji i równowagi wartości, nie samej minimalizacji."},{"t":"Przenoszenie finansowych skutków ryzyka na ubezpieczyciela","ok":false,"w":"Transfer ryzyka jest jedną z możliwych strategii postępowania. Nie zastępuje rozpoznania i oceny ryzyka ani ustalenia jego akceptowalnego poziomu."},{"t":"Skuteczne, wydajne i odpowiedzialne wykorzystanie wszystkich zasobów","ok":false,"w":"Skuteczne, wydajne i odpowiedzialne wykorzystanie zasobów opisuje optymalizację zasobów. Optymalizacja ryzyka dotyczy rozpoznania, oceny i postępowania z ryzykiem."}],"fz":{"h":"Optymalizacja ryzyka","p":"P1","pulapka":false,"n":"EN: Risk optimisation","q":"Co oznacza optymalizacja ryzyka?","a":"Rozpoznawanie ryzyka, ocena jego skutków i prawdopodobieństwa oraz trzymanie go w granicach, które organizacja akceptuje (apetyt na ryzyko).","ex":"Apetyt na ryzyko to ile ryzyka organizacja godzi się znieść, jak ograniczenie prędkości. Rozpoznajesz zagrożenia, oceniasz je i trzymasz w tej granicy.","org":""}},"fz-A-054":{"id":"fz-A-054","typ":"egzamin","s":"PR-02-01","t":"Które stwierdzenie oddaje słownikowe znaczenie optymalizacji zasobów?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 93"],"r":null,"zap":"","scen":"","o":[{"t":"Jak najniższe wydatki na IT","ok":false,"w":"Chodzi o optymalne, a nie minimalne wykorzystanie zasobów."},{"t":"Wykorzystanie wyłącznie zasobów finansowych","ok":false,"w":"Obejmuje wszystkie zasoby: ludzi, finanse, sprzęt, infrastrukturę."},{"t":"Skuteczne, wydajne i odpowiedzialne wykorzystanie wszystkich zasobów","ok":true,"w":"Skuteczne, wydajne i odpowiedzialne wykorzystanie wszystkich zasobów: ludzkich, finansowych, sprzętu, infrastruktury itd."},{"t":"Eliminowanie inicjatyw, które nie dają wartości","ok":false,"w":"Eliminacja inicjatyw lub aktywów o niewystarczającej wartości pojawia się w definicji realizacji korzyści. Może wpływać także na zasoby, lecz nie jest pełną słownikową definicją optymalizacji zasobów."}],"fz":{"h":"Optymalizacja zasobów","p":"P1","pulapka":false,"n":"EN: Resource optimisation","q":"Co oznacza optymalizacja zasobów?","a":"Skuteczne, wydajne i odpowiedzialne wykorzystanie wszystkich zasobów: ludzkich, finansowych, sprzętu, infrastruktury itd.","ex":"Jak gotowanie z zapasów: nic się nie marnuje, nic nie leży bezużytecznie, a ludzie, pieniądze i sprzęt trafiają tam, gdzie są potrzebne.","org":""}},"fz-A-055":{"id":"fz-A-055","typ":"egzamin","s":"PR-02-01","t":"Co obejmuje realizacja korzyści?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 17","FW-PL s. 89"],"r":null,"zap":"","scen":"","o":[{"t":"Rozwijanie przychodów finansowych z inwestycji wspieranych przez informatykę","ok":false,"w":"Korzyści mogą być finansowe, ale COBIT 5 uwzględnia także korzyści niefinansowe, np. jakość usług publicznych. Definicja obejmuje również utrzymanie i rozszerzanie istniejących korzyści oraz eliminację niewystarczającej wartości."},{"t":"Utrzymywanie rozpoznanego ryzyka w granicach apetytu organizacji","ok":false,"w":"To opis optymalizacji ryzyka. Realizacja korzyści jest odrębnym składnikiem tworzenia wartości, równoważonym z ryzykiem i zasobami."},{"t":"Uruchamianie nowych inicjatyw biznesowych i uzyskiwanie z nich korzyści","ok":false,"w":"Uruchamianie nowych inicjatyw i nowe korzyści to tylko część definicji. Trzeba także utrzymywać i zwiększać istniejące korzyści oraz eliminować inicjatywy i aktywa o niewystarczającej wartości."},{"t":"Uzyskiwanie i utrzymywanie korzyści oraz eliminowanie inicjatyw o niewystarczającej wartości","ok":true,"w":"Realizacja korzyści obejmuje nowe korzyści, utrzymanie i rozszerzanie istniejących oraz eliminację inicjatyw i aktywów, które nie dają wystarczającej wartości. Może dotyczyć korzyści finansowych i niefinansowych."}],"fz":{"h":"Realizacja korzyści","p":"P1","pulapka":false,"n":"egzamin: realizacja korzyści · podr.: realizacja korzyści · EN: benefits realisation · EN: Benefits realisation","q":"Co oznacza realizacja korzyści?","a":"Realizacja korzyści (benefits realisation) obejmuje uzyskiwanie nowych korzyści, utrzymywanie i rozszerzanie istniejących oraz eliminowanie inicjatyw i aktywów, które nie generują wystarczającej wartości. Korzyści mogą być finansowe i niefinansowe, np. lepsze usługi publiczne. Tworzenie wartości wymaga przy tym równoważenia korzyści z ryzykiem i wykorzystaniem zasobów.","ex":"Jak ogródek: siejesz nowe rośliny, podlewasz te, które rosną, i wyrywasz chwasty, które tylko zabierają miejsce.","org":"krótszy czas przywrócenia usług dla komend."}},"fz-A-056":{"id":"fz-A-056","typ":"egzamin","s":"PR-02-01","t":"Czym jest cel Ładu w COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 17"],"r":null,"zap":"","scen":"","o":[{"t":"Tworzeniem wartości: realizacją korzyści przy optymalnym ryzyku i optymalnym wykorzystaniu zasobów","ok":true,"w":"Cel Ładu (podr. cel nadzoru) to Tworzenie wartości przez równowagę trzech składników."},{"t":"Maksymalizacją zysku niezależnie od ryzyka","ok":false,"w":"Tworzenie wartości to równowaga korzyści, ryzyka i zasobów."},{"t":"Wdrożeniem wszystkich 37 procesów","ok":false,"w":"Procesy to tylko jeden z aktywatorów, a nie cel Ładu."},{"t":"Ułożeniem celów w wymiarach BSC","ok":false,"w":"BSC grupuje cele organizacji; nie jest celem Ładu."}],"fz":{"h":"Tworzenie wartości","p":"P1","pulapka":false,"n":"≠ TŁUMACZENIE · egzamin: tworzenie wartości – cel Ładu · podr.: tworzenie wartości – cel nadzoru · EN: value creation, governance objective · EN: Value creation – governance objective","q":"Czym jest cel Ładu? / Czym jest Tworzenie Wartości?","a":"Tworzenie wartości: realizacja korzyści przy optymalnym ryzyku i zasobach (Rys. 3). Te trzy składniki to perspektywy oceny potrzeb, nie krok kaskady.\nCelem Ładu (podr. cel nadzoru): osiąganie korzyści przy optymalnym ryzyku i optymalnym wykorzystaniu zasobów. Osiąga się je, równoważąc trzy cele.","ex":"Waga szalkowa: na jednej szali korzyści, na drugiej ryzyko i koszty. Ład trzyma równowagę. To sposób patrzenia, nie osobny krok kaskady.\nJak zakupy z budżetem: chcesz dobrej rzeczy (korzyść), bez przepłacania (zasoby) i bez ryzyka bubla (ryzyko). Tworzenie wartości to równowaga tych trzech.","org":""}},"fz-A-057":{"id":"fz-A-057","typ":"egzamin","s":"PR-02-01","t":"Który z poniższych NIE jest składnikiem Celu Ładu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 17"],"r":null,"zap":"","scen":"","o":[{"t":"Realizacja korzyści","ok":false,"w":"To pierwszy składnik Celu Ładu."},{"t":"Optymalizacja ryzyka","ok":false,"w":"To drugi składnik Celu Ładu."},{"t":"Zapewnienie zgodności z przepisami","ok":true,"w":"Składniki Celu Ładu to korzyści, ryzyko i zasoby (K-R-Z); zgodność do nich nie należy."},{"t":"Optymalizacja zasobów","ok":false,"w":"To trzeci składnik Celu Ładu."}],"fz":{"h":"Składniki Celu Ładu","p":"P1","pulapka":false,"n":"EN: Benefits realisation, risk optimisation, resource optimisation","q":"Jakie trzy składniki tworzą Cel Ładu?","a":"1. Realizacja korzyści. 2. Optymalizacja ryzyka. 3. Optymalizacja zasobów.","ex":"Haczyk K-R-Z: Korzyści, Ryzyko, Zasoby – jak „kurz” bez u. Korzyści się realizuje, ryzyko i zasoby optymalizuje.","org":""}},"fz-A-058":{"id":"fz-A-058","typ":"egzamin","s":"PR-02-02","t":"Czym jest wyznacznik w Kaskadzie Celów?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 17","FW-PL s. 91"],"r":null,"zap":"","scen":"","o":[{"t":"Wskaźnikiem, który mierzy, czy cel aktywatora osiągnięto","ok":false,"w":"To opis wskaźnika opóźnionego, nie wyznacznika."},{"t":"Czynnikiem wpływającym na potrzeby interesariuszy","ok":true,"w":"Czynniki zewnętrzne i wewnętrzne, które wywołują zmiany w organizacji lub wpływają na jej działanie, np. nowa strategia, zmiany otoczenia biznesowego i przepisów, nowe technologie."},{"t":"Osobą, która ma wobec organizacji oczekiwania lub udział","ok":false,"w":"To definicja interesariusza."},{"t":"Jednym z 17 celów związanych z informatyką","ok":false,"w":"Cele IT (Information Technology — technologie informacyjne) to dalszy krok kaskady, nie wyznaczniki."}],"fz":{"h":"Wyznacznik","p":"P1","pulapka":false,"n":"egzamin: wyznaczniki · podr.: wyznaczniki · EN: stakeholder drivers · EN: Driver / stakeholder drivers","q":"Czym jest wyznacznik (czynnik wpływający na potrzeby interesariuszy)?","a":"Czynniki zewnętrzne i wewnętrzne, które wywołują zmiany w organizacji lub wpływają na jej działanie, np. nowa strategia, zmiany otoczenia biznesowego i przepisów, nowe technologie.","ex":"Bodziec z zewnątrz lub z wewnątrz, jak nowe prawo o recyklingu, które zmusza sklep do zmiany opakowań.","org":"nawałnice i nowe przepisy zmieniają potrzeby komend."}},"fz-A-059":{"id":"fz-A-059","typ":"egzamin","s":"PR-02-05","t":"Który załącznik COBIT 5 mapuje cele organizacji na cele związane z informatyką?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 18","FW-PL s. 50","FW-PL s. 52","FW-PL s. 55"],"r":null,"zap":"","scen":"","o":[{"t":"Załącznik C","ok":false,"w":"Załącznik C mapuje cele związane z IT (Information Technology — technologie informacyjne) na procesy."},{"t":"Załącznik D","ok":false,"w":"Załącznik D mapuje potrzeby interesariuszy na cele organizacji."},{"t":"Załącznik B","ok":true,"w":"D: potrzeby interesariuszy → cele organizacji; B: cele organizacji → cele związane z IT (Information Technology — technologie informacyjne); C: cele związane z IT → procesy."},{"t":"Załącznik A","ok":false,"w":"Mapowania kaskady są w załącznikach D, B i C (kolejność D-B-C)."}],"fz":{"h":"Załączniki B, C, D","p":"P2","pulapka":false,"n":"egzamin: załączniki B, C, D · podr.: załączniki B, C, D · EN: appendices B, C, D · EN: Appendices B, C, D","q":"Które załączniki zawierają mapowania kaskady?","a":"D: potrzeby interesariuszy → cele organizacji; B: cele organizacji → cele związane z IT (Information Technology — technologie informacyjne); C: cele związane z IT → procesy.","ex":"Kolejność kaskady to D-B-C, nie A-B-C: najpierw D (potrzeby), potem B (cele organizacji → IT (Information Technology — technologie informacyjne)), na końcu C (IT → procesy).","org":""}},"fz-A-060":{"id":"fz-A-060","typ":"egzamin","s":"PR-02-03","t":"Który z poniższych jest interesariuszem zewnętrznym według Rysunku 7?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 22"],"r":null,"zap":"","scen":"","o":[{"t":"CIO","ok":false,"w":"CIO (Chief Information Officer — dyrektor ds. informatyki) to interesariusz wewnętrzny."},{"t":"Audyt wewnętrzny","ok":false,"w":"Audyt wewnętrzny to interesariusz wewnętrzny."},{"t":"Właściciele procesów biznesowych","ok":false,"w":"Właściciele procesów biznesowych są interesariuszami wewnętrznymi."},{"t":"Organy nadzorcze i rządowe","ok":true,"w":"Wewnętrzni: zarząd, CEO (Chief Executive Officer — dyrektor generalny), CFO (Chief Financial Officer — dyrektor finansowy), CIO (Chief Information Officer — dyrektor ds. informatyki), CRO (Chief Risk Officer — dyrektor ds. ryzyka), właściciele procesów biznesowych, kierownicy biznesu, ryzyka, bezpieczeństwa, usług, HR (Human Resources — zasoby ludzkie), audyt wewnętrzny, użytkownicy IT (Information Technology — technologie informacyjne). Zewnętrzni: partnerzy biznesowi, dostawcy, udziałowcy, organy nadzorcze/rządowe, użytkownicy zewnętrzni."}],"fz":{"h":"Interesariusze wewnętrzni i zewnętrzni","p":"P2","pulapka":false,"n":"EN: Internal and external stakeholders","q":"Podaj przykłady interesariuszy wewnętrznych i zewnętrznych (Rysunek 7).","a":"Wewnętrzni: zarząd, CEO (Chief Executive Officer — dyrektor generalny), CFO (Chief Financial Officer — dyrektor finansowy), CIO (Chief Information Officer — dyrektor ds. informatyki), CRO (Chief Risk Officer — dyrektor ds. ryzyka), właściciele procesów biznesowych, kierownicy biznesu, ryzyka, bezpieczeństwa, usług, HR (Human Resources — zasoby ludzkie), audyt wewnętrzny, użytkownicy IT (Information Technology — technologie informacyjne). Zewnętrzni: partnerzy biznesowi, dostawcy, udziałowcy, organy nadzorcze/rządowe, użytkownicy zewnętrzni.","ex":"Skróty: CEO (Chief Executive Officer — dyrektor generalny) prezes, CFO (Chief Financial Officer — dyrektor finansowy) finanse, CIO (Chief Information Officer — dyrektor ds. informatyki) informatyka, CRO (Chief Risk Officer — dyrektor ds. ryzyka) ryzyko. Wewnętrzni pracują w organizacji, zewnętrzni są poza nią: dostawcy, partnerzy, urzędy.","org":""}},"fz-A-061":{"id":"fz-A-061","typ":"egzamin","s":"PR-02-03","t":"Który z poniższych jest interesariuszem wewnętrznym według Rysunku 7?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 22"],"r":null,"zap":"","scen":"","o":[{"t":"CRO","ok":true,"w":"CRO (szef ryzyka) jest na Rysunku 7 wśród interesariuszy wewnętrznych."},{"t":"Dostawcy","ok":false,"w":"Dostawcy to interesariusze zewnętrzni."},{"t":"Partnerzy biznesowi","ok":false,"w":"Partnerzy biznesowi to interesariusze zewnętrzni."},{"t":"Udziałowcy","ok":false,"w":"Na Rysunku 7 udziałowcy są wśród interesariuszy zewnętrznych."}],"fz":{"h":"Interesariusze wewnętrzni i zewnętrzni","p":"P2","pulapka":false,"n":"EN: Internal and external stakeholders","q":"Podaj przykłady interesariuszy wewnętrznych i zewnętrznych (Rysunek 7).","a":"Wewnętrzni: zarząd, CEO, CFO, CIO, CRO, właściciele procesów biznesowych, kierownicy biznesu, ryzyka, bezpieczeństwa, usług, HR, audyt wewnętrzny, użytkownicy IT. Zewnętrzni: partnerzy biznesowi, dostawcy, udziałowcy, organy nadzorcze/rządowe, użytkownicy zewnętrzni.","ex":"Skróty: CEO prezes, CFO finanse, CIO informatyka, CRO ryzyko. Wewnętrzni pracują w organizacji, zewnętrzni są poza nią: dostawcy, partnerzy, urzędy.","org":""}},"fz-A-062":{"id":"fz-A-062","typ":"egzamin","s":"PR-02-01","t":"Jakie trzy pytania zadaje się przy każdej decyzji Ładu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 17"],"r":null,"zap":"","scen":"","o":[{"t":"Co planujemy? Co tworzymy? Co monitorujemy?","ok":false,"w":"To nawiązanie do PBRM (Plan, Build, Run and Monitor — Planuj, Wytwarzaj/Twórz, Wykonuj i Monitoruj), czyli działań Zarządzania."},{"t":"Kto odnosi korzyści? Kto ponosi ryzyko? Jakie zasoby są wymagane?","ok":true,"w":"Kto odnosi korzyści? Kto ponosi ryzyko? Jakie zasoby są wymagane?"},{"t":"Gdzie jesteśmy teraz? Do czego dążymy? Jak się tam dostaniemy?","ok":false,"w":"To pytania faz cyklu wdrożenia, nie decyzji Ładu."},{"t":"Kto odpowiada? Kto wykonuje? Kogo informujemy?","ok":false,"w":"To pytania o role w tabeli RACI (Responsible, Accountable, Consulted, Informed — Odpowiedzialny, Rozliczany, Konsultowany, Informowany)."}],"fz":{"h":"Trzy pytania decyzji Ładu","p":"P2","pulapka":false,"n":"EN: Who receives the benefits? Who bears the risk? What resources are required?","q":"Jakie trzy pytania zadaje się przy każdej decyzji Ładu?","a":"Kto odnosi korzyści? Kto ponosi ryzyko? Jakie zasoby są wymagane?","ex":"Jak przy kupnie auta dla rodziny: kto będzie z niego korzystał, kto zapłaci za ewentualną szkodę, ile to kosztuje (pieniądze, czas, garaż).","org":""}},"fz-A-063":{"id":"fz-A-063","typ":"egzamin","s":"PR-02-01","t":"Jaką postać mogą mieć korzyści według COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 17"],"r":null,"zap":"","scen":"","o":[{"t":"Wyłącznie finansową","ok":false,"w":"Korzyści mogą mieć wiele postaci, nie tylko finansową."},{"t":"Wiele postaci, np. finansową w firmach komercyjnych albo lepsze usługi publiczne w administracji","ok":true,"w":"Fiszka podkreśla, że to przykłady, a nie zamknięta lista."},{"t":"Wyłącznie oszczędności na kosztach IT","ok":false,"w":"Oszczędności to tylko jedna z możliwych postaci korzyści."},{"t":"W administracji publicznej korzyści nie występują","ok":false,"w":"W administracji korzyścią są np. lepsze usługi publiczne."}],"fz":{"h":"Korzyści w firmie i w administracji","p":"P2","pulapka":false,"n":"EN: Benefits: financial vs public services","q":"Jaką postać mają korzyści w firmie, a jaką w administracji?","a":"Mogą mieć wiele postaci, np. finansową w firmach komercyjnych albo lepsze usługi publiczne w administracji. To przykłady, nie zamknięta lista.","ex":"Sklep liczy korzyść często w złotówkach, a straż pożarna w szybkich dojazdach i uratowanych ludziach. Ale i sklep zyskuje zaufanie klientów, a straż – oszczędności.","org":""}},"fz-A-064":{"id":"fz-A-064","typ":"egzamin","s":"PR-02-04","t":"Do którego wymiaru BSC należy cel organizacji 7 „Ciągłość i dostępność usług biznesowych”?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 19"],"r":null,"zap":"","scen":"","o":[{"t":"Finanse","ok":false,"w":"Finanse to cele 1–5, np. zgodność z przepisami."},{"t":"Obszar wewnętrzny","ok":false,"w":"Obszar wewnętrzny to cele 11–15."},{"t":"Szkolenie i rozwój","ok":false,"w":"Szkolenie i rozwój to cele 16–17."},{"t":"Klient","ok":true,"w":"Wymiar Klient obejmuje cele 6–10, w tym cel 7."}],"fz":{"h":"Przykładowe cele organizacji","p":"P2","pulapka":false,"n":"EN: Enterprise goals examples","q":"Podaj przykładowe cele organizacji z każdego wymiaru BSC.","a":"Finanse: 1 Wartość inwestycji biznesowych dla interesariuszy, 4 Zgodność z przepisami. Klient: 6 Kultura usług zorientowanych na klienta, 7 Ciągłość i dostępność usług. Obszar wewnętrzny: 11 Optymalizacja funkcjonalności procesów biznesowych, 15 Zgodność z politykami wewnętrznymi. Szkolenie i rozwój: 16 Wykwalifikowany i zmotywowany personel, 17 Kultura innowacji.","ex":"Po ludzku: pieniądze i przepisy, zadowolony klient i usługi bez przerw, sprawna praca i własne regulaminy, a na koniec dobrzy ludzie i nowe pomysły.","org":""}},"fz-A-065":{"id":"fz-A-065","typ":"egzamin","s":"PR-02-05","t":"Który z poniższych jest celem związanym z informatyką, a nie celem organizacji?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 19"],"r":null,"zap":"","scen":"","o":[{"t":"Zwinność IT","ok":true,"w":"01 Zgodność IT (Information Technology — technologie informacyjne) z biznesowymi celami strategicznymi; 07 Dostarczanie usług IT zgodnie z wymogami biznesowymi; 09 Zwinność IT; 10 Bezpieczeństwo informacji, infrastruktury przetwarzania i aplikacji; 14 Dostępność wiarygodnych i przydatnych informacji; 16 Kompetentny i zmotywowany personel biznesu i IT."},{"t":"Kultura innowacji","ok":false,"w":"To cel organizacji nr 17 (Szkolenie i rozwój)."},{"t":"Ciągłość i dostępność usług biznesowych","ok":false,"w":"To cel organizacji nr 7 (Klient)."},{"t":"Zgodność z politykami wewnętrznymi","ok":false,"w":"To cel organizacji nr 15 (Obszar wewnętrzny)."}],"fz":{"h":"Przykładowe cele związane z informatyką","p":"P2","pulapka":false,"n":"EN: IT (Information Technology — technologie informacyjne)-related goals examples","q":"Podaj przykładowe cele związane z informatyką.","a":"01 Zgodność IT (Information Technology — technologie informacyjne) z biznesowymi celami strategicznymi; 07 Dostarczanie usług IT zgodnie z wymogami biznesowymi; 09 Zwinność IT; 10 Bezpieczeństwo informacji, infrastruktury przetwarzania i aplikacji; 14 Dostępność wiarygodnych i przydatnych informacji; 16 Kompetentny i zmotywowany personel biznesu i IT.","ex":"Po ludzku: IT (Information Technology — technologie informacyjne) idzie w tym samym kierunku co firma, działa tak, jak biznes potrzebuje, szybko się dostosowuje, chroni dane, daje dobre informacje i ma dobrych ludzi.","org":""}},"fz-A-066":{"id":"fz-A-066","typ":"egzamin","s":"PR-02-04","t":"Czego dotyczą relacje P i S przy celach organizacji?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 18"],"r":null,"zap":"","scen":"","o":[{"t":"Przypisania celu do Ładu (P) albo do Zarządzania (S)","ok":false,"w":"P i S opisują siłę związku, a nie podział na Ład i Zarządzanie."},{"t":"Związku celu organizacji z trzema składnikami Celu Ładu: korzyściami, ryzykiem i zasobami","ok":true,"w":"P to relacja podstawowa, S – wspierająca, słabsza."},{"t":"Związku celu organizacji z domenami PBRM","ok":false,"w":"Przy celach organizacji P i S odnoszą się do składników Celu Ładu, nie do domen."},{"t":"Kolejności wdrażania: cele P najpierw, cele S później","ok":false,"w":"P i S nie wyznaczają kolejności wdrażania."}],"fz":{"h":"Relacje P i S przy celach organizacji","p":"P1","pulapka":false,"n":"EN: P = primary, S = secondary","q":"Co oznaczają relacje P i S przy celach organizacji?","a":"Związek celu organizacji z trzema składnikami Celu Ładu: P – relacja podstawowa (primary), S – wspierająca, czyli słabsza (secondary).","ex":"Jak przyjaciele: P to najlepszy przyjaciel (mocny, główny związek), S to dobry kolega (słabszy, ale prawdziwy).","org":""}},"fz-A-067":{"id":"fz-A-067","typ":"egzamin","s":"PR-02-04","t":"Który cel organizacji ma relację P ze wszystkimi trzema składnikami Celu Ładu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 19"],"r":null,"zap":"","scen":"","o":[{"t":"Cel 7: Ciągłość i dostępność usług biznesowych","ok":false,"w":"Relację P ze wszystkimi trzema składnikami ma tylko cel 9."},{"t":"Cel 17: Kultura innowacji","ok":false,"w":"Relację P ze wszystkimi trzema składnikami ma tylko cel 9."},{"t":"Cel 4: Zgodność z przepisami","ok":false,"w":"Relację P ze wszystkimi trzema składnikami ma tylko cel 9."},{"t":"Cel 9: Świadome podejmowanie decyzji strategicznych na podstawie informacji","ok":true,"w":"Cel 9 ma relacje P, P, P – „dziewiątka trafia trzy razy w dziesiątkę”."}],"fz":{"h":"Cel organizacji 9 (P, P, P)","p":"P2","pulapka":false,"n":"EN: Enterprise goal 9: Information-based strategic decision making","q":"Który cel organizacji ma relację P ze wszystkimi trzema celami Ładu?","a":"Cel 9: Świadome podejmowanie decyzji strategicznych na podstawie informacji (P, P, P).","ex":"Haczyk: dziewiątka trafia trzy razy w dziesiątkę. Decyzje oparte na informacjach pomagają naraz korzyściom, ryzyku i zasobom – jak dobra mapa w podróży.","org":""}},"fz-A-068":{"id":"fz-A-068","typ":"egzamin","s":"PR-02-07","t":"Do czego służy Kaskada Celów w praktyce?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 17","FW-PL s. 20"],"r":null,"zap":"","scen":"","o":[{"t":"Przekłada potrzeby interesariuszy na konkretne cele na kolejnych poziomach","ok":true,"w":"Kaskada Celów przekłada potrzeby interesariuszy na konkretne, istotne i mierzalne cele na kolejnych poziomach odpowiedzialności. Pomaga wyznaczać priorytety wdrożenia, doskonalenia i audytu, wybierać potrzebne wytyczne z bazy COBIT 5 oraz wyjaśniać wkład aktywatorów w osiąganie celów organizacji. Nie zastępuje oceny zdolności procesów."},{"t":"Ustala poziom zdolności każdego procesu w skali 0–5","ok":false,"w":"Poziomy zdolności ustala ocena zdolności procesu, nie Kaskada Celów."},{"t":"Przypisuje każdy proces do jednej fazy PBRM","ok":false,"w":"Kaskada nie przypisuje procesów do faz PBRM (Plan, Build, Run and Monitor — Planuj, Wytwarzaj/Twórz, Wykonuj i Monitoruj)."},{"t":"Zastępuje potrzebę dostosowania COBIT 5 do organizacji","ok":false,"w":"Mapowania kaskady trzeba wręcz dostosować do swojej sytuacji."}],"fz":{"h":"Do czego służy Kaskada Celów","p":"P1","pulapka":false,"n":"EN: Benefits of the goals cascade","q":"Do czego służy Kaskada Celów w praktyce?","a":"Kaskada Celów przekłada potrzeby interesariuszy na konkretne, istotne i mierzalne cele na kolejnych poziomach odpowiedzialności. Pomaga wyznaczać priorytety wdrożenia, doskonalenia i audytu, wybierać potrzebne wytyczne z bazy COBIT 5 oraz wyjaśniać wkład aktywatorów w osiąganie celów organizacji. Nie zastępuje oceny zdolności procesów.","ex":"Kaskada działa jak GPS: każdy zna swój mierzalny cel, z całej wiedzy COBIT bierze się tylko potrzebne, a widać, co pomaga dojechać do celu organizacji.","org":""}},"fz-A-069":{"id":"fz-A-069","typ":"egzamin","s":"PR-02-07","t":"Jak właściwie korzystać z tabel mapowania Kaskady Celów?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 20"],"r":null,"zap":"","scen":"","o":[{"t":"Kopiować powiązania podstawowe, pomijając wspierające","ok":false,"w":"Pominięcie wszystkich relacji wspierających nie wynika z COBIT 5. P (Primary — powiązanie podstawowe) i S (Secondary — powiązanie wspierające) są punktami odniesienia; organizacja ocenia wszystkie stosowne powiązania i dopasowuje mapowanie do swojej sytuacji."},{"t":"Dopasować procesy do wszystkich ogólnych celów organizacji z podręcznika","ok":false,"w":"Lista ogólnych celów jest punktem odniesienia, a nie obowiązkiem jednakowego priorytetu wszystkich celów. Własne priorytety i kontekst organizacji określają potrzebną kaskadę."},{"t":"Potraktować tabele jako wytyczną i dostosować do kontekstu organizacji","ok":true,"w":"Macierze są wytyczną. Organizacja najpierw dopasowuje mapowania do swoich priorytetów, wielkości, branży i sytuacji, zamiast kopiować je mechanicznie."},{"t":"Zastąpić mapowanie celów oceną zdolności procesów","ok":false,"w":"Ocena zdolności procesu odpowiada na inne pytanie — jak dobrze proces realizuje swój cel i atrybuty. Nie zastępuje przekładania potrzeb interesariuszy na cele organizacji, informatyki i aktywatorów."}],"fz":{"h":"Korzystanie z tabel mapowania","p":"P1","pulapka":false,"n":"EN: Using the goals cascade carefully","q":"Jak właściwie korzystać z tabel mapowania kaskady?","a":"Mapowania są wytyczną, a nie uniwersalną prawdą. Organizacja dostosowuje je do swoich priorytetów, wielkości i branży oraz opracowuje własną kaskadę. Oznaczenia P (Primary — powiązanie podstawowe) i S (Secondary — powiązanie wspierające) wskazują typowy stopień powiązania, nie automatyczną kolejność wdrażania.","ex":"Jak przepis z internetu: dopasowujesz go do swojej kuchni, liczby gości i gustu, zamiast gotować dokładnie co do grama.","org":""}},"fz-A-070":{"id":"fz-A-070","typ":"egzamin","s":"PR-02-06","t":"Osiągnięcie czego wspierają cele aktywatora – ostatni etap Kaskady Celów?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 18","FW-PL s. 29"],"r":null,"zap":"","scen":"","o":[{"t":"Bezpośrednio wyznaczników interesariuszy","ok":false,"w":"Wyznaczniki to początek kaskady; cele aktywatora wspierają cele IT (Information Technology — technologie informacyjne)."},{"t":"Wyłącznie procesów domeny EDM","ok":false,"w":"Cele aktywatora dotyczą wszystkich aktywatorów, nie tylko procesów EDM (Evaluate, Direct and Monitor — Oszacuj, Kieruj i Monitoruj)."},{"t":"Celów związanych z informatyką","ok":true,"w":"Ostatnim etapem Kaskady Celów: zbiorem celów każdego aktywatora (procesów, struktur, informacji itd.), które wspierają osiągnięcie celów związanych z informatyką."},{"t":"Wyłącznie wskaźników wiodących","ok":false,"w":"Wskaźniki mierzą cele, a nie są tym, co cele aktywatora wspierają."}],"fz":{"h":"Cele aktywatora","p":"P1","pulapka":false,"n":"EN: Enabler goals","q":"Czym są cele aktywatora?","a":"Ostatnim etapem Kaskady Celów: zbiorem celów każdego aktywatora (procesów, struktur, informacji itd.), które wspierają osiągnięcie celów związanych z informatyką.","ex":"Na samym dole kaskady każdy element dostaje swoje zadanie: procedura, zespół, rejestr danych, szkolenie – jak w remoncie każda ekipa dostaje własny cel.","org":""}},"fz-A-071":{"id":"fz-A-071","typ":"egzamin","s":"PR-02-01","t":"Jak COBIT 5 definiuje ryzyko?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 93"],"r":null,"zap":"","scen":"","o":[{"t":"Jako każde zdarzenie, które już wystąpiło","ok":false,"w":"Ryzyko dotyczy prawdopodobieństwa zdarzenia, a nie zdarzeń przeszłych."},{"t":"Jako ilość ryzyka, którą organizacja jest gotowa przyjąć","ok":false,"w":"To definicja apetytu na ryzyko."},{"t":"Jako połączenie prawdopodobieństwa zdarzenia i jego skutków","ok":true,"w":"Ryzyko to połączenie prawdopodobieństwa zdarzenia i jego skutków (ISO/IEC (International Organization for Standardization / International Electrotechnical Commission — Międzynarodowa Organizacja Normalizacyjna / Międzynarodowa Komisja Elektrotechniczna) 73). Zarządzanie ryzykiem: rozpoznać ryzyko, ocenić wpływ i prawdopodobieństwo, dobrać strategię (unikanie, ograniczenie skutków, przeniesienie na innych) w granicach apetytu na ryzyko."},{"t":"Jako wyłącznie zagrożenie techniczne systemów IT","ok":false,"w":"Definicja nie ogranicza ryzyka do zagrożeń technicznych."}],"fz":{"h":"Ryzyko i zarządzanie ryzykiem","p":"P2","pulapka":false,"n":"EN: Risk; risk management","q":"Jak COBIT 5 definiuje ryzyko i co robi zarządzanie ryzykiem?","a":"Ryzyko to połączenie prawdopodobieństwa zdarzenia i jego skutków (ISO/IEC (International Organization for Standardization / International Electrotechnical Commission — Międzynarodowa Organizacja Normalizacyjna / Międzynarodowa Komisja Elektrotechniczna) 73). Zarządzanie ryzykiem: rozpoznać ryzyko, ocenić wpływ i prawdopodobieństwo, dobrać strategię (unikanie, ograniczenie skutków, przeniesienie na innych) w granicach apetytu na ryzyko.","ex":"Pożar w kuchni: ryzyko to szansa, że wybuchnie, razem z tym, ile szkód narobi. Gaśnica ogranicza skutki, ubezpieczenie przenosi koszt.","org":""}},"fz-A-072":{"id":"fz-A-072","typ":"egzamin","s":"PR-02-01","t":"Czym jest apetyt na ryzyko?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 68","ISACA Interactive Glossary — Risk appetite: https://www.isaca.org/resources/glossary"],"r":null,"zap":"","scen":"","o":[{"t":"Ogólną ilością ryzyka, jaką organizacja jest gotowa przyjąć, realizując swoją misję","ok":true,"w":"Apetyt na ryzyko (risk appetite) to ogólna ilość ryzyka, jaką organizacja jest gotowa przyjąć, realizując swoją misję. Definiuje się go w ramach Ładu nad ryzykiem; polityki powinny go odzwierciedlać. Podręcznik s. 68 opisuje związek apetytu z politykami, a pełną definicję podaje oficjalny słownik ISACA."},{"t":"Najwyższym ryzykiem wykrytym przez audyt","ok":false,"w":"Apetyt to akceptowany poziom ryzyka, a nie wynik audytu."},{"t":"Połączeniem prawdopodobieństwa zdarzenia i jego skutków","ok":false,"w":"To definicja samego ryzyka."},{"t":"Listą ryzyk przeniesionych na ubezpieczyciela","ok":false,"w":"Przeniesienie to strategia postępowania z ryzykiem, nie apetyt."}],"fz":{"h":"Apetyt na ryzyko","p":"P2","pulapka":false,"n":"EN: Risk appetite","q":"Czym jest apetyt na ryzyko i kto go ustala?","a":"Apetyt na ryzyko (risk appetite) to ogólna ilość ryzyka, jaką organizacja jest gotowa przyjąć, realizując swoją misję. Definiuje się go w ramach Ładu nad ryzykiem; polityki powinny go odzwierciedlać. Podręcznik s. 68 opisuje związek apetytu z politykami, a pełną definicję podaje oficjalny słownik ISACA.","ex":"Jak na stoku: jedni jeżdżą tylko niebieskimi trasami, inni czarnymi. Rodzina sama ustala, na które trasy puszcza dzieci.","org":""}},"fz-A-073":{"id":"fz-A-073","typ":"egzamin","s":"EN-02-06,PR-02-01","t":"Jak apetyt na ryzyko wpływa na polityki organizacji?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 68"],"r":null,"zap":"","scen":"","o":[{"t":"Polityki są od apetytu na ryzyko niezależne","ok":false,"w":"Polityki muszą odzwierciedlać apetyt na ryzyko."},{"t":"Ostrożna organizacja ma mniej restrykcyjne polityki","ok":false,"w":"Jest odwrotnie: ostrożna organizacja ma polityki bardziej restrykcyjne."},{"t":"Apetyt na ryzyko ustala samodzielnie dział IT w polityce bezpieczeństwa","ok":false,"w":"Apetyt ustala się w ramach Ładu nad ryzykiem."},{"t":"Polityki muszą go odzwierciedlać – ostrożna organizacja ma bardziej restrykcyjne polityki","ok":true,"w":"Polityki są częścią systemu kontroli wewnętrznej i powinny odzwierciedlać apetyt na ryzyko określony w ramach Ładu nad ryzykiem. Organizacja bardziej ostrożna zwykle przyjmuje bardziej restrykcyjne polityki (s.68)."}],"fz":{"h":"Apetyt na ryzyko","p":"P2","pulapka":false,"n":"EN: Risk appetite","q":"Czym jest apetyt na ryzyko i kto go ustala?","a":"Ogólna ilość ryzyka, jaką organizacja jest gotowa przyjąć, realizując swoją misję. Ustala się go w ramach Ładu nad ryzykiem; polityki muszą go odzwierciedlać: organizacja ostrożna ma bardziej restrykcyjne polityki.","ex":"Jak na stoku: jedni jeżdżą tylko niebieskimi trasami, inni czarnymi. Rodzina sama ustala, na które trasy puszcza dzieci.","org":""}},"fz-A-074":{"id":"fz-A-074","typ":"egzamin","s":"PR-02-05","t":"Cele związane z informatyką opisują rezultaty IT potrzebne organizacji. Czym jest rezultat?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 18","FW-PL s. 92"],"r":null,"zap":"","scen":"","o":[{"t":"Osobnym etapem kaskady między celami IT a celami aktywatorów","ok":false,"w":"Osobnego etapu „rezultaty IT (Information Technology — technologie informacyjne)” w kaskadzie nie ma."},{"t":"Wytworem, istotną zmianą stanu lub poprawą zdolności","ok":true,"w":"Cele związane z informatyką opisują pożądane rezultaty IT (Information Technology — technologie informacyjne) wspierające cele organizacji. Zgodnie z hasłem „Cel IT” w słowniku COBIT 5 rezultatem może być wytwór, istotna zmiana stanu albo istotna poprawa zdolności. Rezultat nie jest osobnym poziomem Kaskady Celów między celami IT a celami aktywatorów."},{"t":"Inną nazwą celu organizacji","ok":false,"w":"Cele organizacji to wcześniejszy krok kaskady, a nie rezultaty IT (Information Technology — technologie informacyjne)."},{"t":"Wskaźnikiem wiodącym aktywatora","ok":false,"w":"Wskaźniki wiodące dotyczą cyklu życia i dobrych praktyk, nie definiują rezultatu."}],"fz":{"h":"Cele związane z informatyką a rezultaty IT","p":"P2","pulapka":true,"n":"EN: IT (Information Technology — technologie informacyjne)-related goals represent IT-related outcomes","q":"Jak cele związane z informatyką mają się do „rezultatów IT”?","a":"Cele związane z informatyką opisują pożądane rezultaty IT (Information Technology — technologie informacyjne) wspierające cele organizacji. Zgodnie z hasłem „Cel IT” w słowniku COBIT 5 rezultatem może być wytwór, istotna zmiana stanu albo istotna poprawa zdolności. Rezultat nie jest osobnym poziomem Kaskady Celów między celami IT a celami aktywatorów.","ex":"Cel szkoły: lepsze matury. Od pracowni potrzeba sprawnych komputerów na lekcjach. To zapisujesz jako cel pracowni, bez osobnego etapu.","org":""}},"fz-B-001":{"id":"fz-B-001","typ":"egzamin","s":"PR-01-04","t":"Do której domeny Zarządzania należą m.in. strategia, architektura korporacyjna, portfel, ryzyko i bezpieczeństwo?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 33"],"r":null,"zap":"","scen":"","o":[{"t":"APO – Dostosuj, Planuj i Organizuj","ok":true,"w":"Tak: APO to domena planowania (13 procesów), w tym strategia, architektura, portfel, ryzyko i bezpieczeństwo."},{"t":"BAI – Twórz, Nabywaj i Wdrażaj","ok":false,"w":"BAI obejmuje programy i projekty, wymagania, rozwiązania i zmiany, a nie strategię."},{"t":"DSS – Dostarczaj, Obsługuj i Wspieraj","ok":false,"w":"DSS to codzienność: eksploatacja, incydenty, problemy i ciągłość."},{"t":"EDM – Oszacuj, Kieruj i Monitoruj","ok":false,"w":"EDM to domena Ładu, a nie Zarządzania."}],"fz":{"h":"APO","p":"P2","pulapka":false,"n":"≠ TŁUMACZENIE · egzamin: Dostosuj, Planuj i Organizuj · podr.: Dopasowanie, planowanie i organizacja · EN: Align, Plan and Organise","q":"Co obejmuje domena APO? / Która domena: strategia, architektura, innowacje, portfel, budżet, HR, relacje, umowy, dostawcy, jakość, ryzyko, bezpieczeństwo?","a":"Domena Zarządzania (Planuj): 13 procesów, m.in. strategia, architektura, portfel, ryzyko, bezpieczeństwo.\nAPO (Dostosuj, Planuj i Organizuj), APO01–APO13; APO01 to zarządzanie strukturą ramową zarządzania IT.","ex":"Planowanie przed działaniem, jak przed remontem: pomysł, budżet, ekipa, umowy z fachowcami, co może pójść źle. Haczyk: APO – „A Plan Obmyśl”; 13 procesów, najwięcej ze wszystkich.\nWszystko, co robisz przed remontem: pomysł, projekt, budżet, ludzie, umowy, wybór fachowców, jakość, ryzyko i zamki w drzwiach. Planowanie = APO, 13 procesów.","org":"APO12 ocena ryzyka przerw usług."}},"fz-B-002":{"id":"fz-B-002","typ":"egzamin","s":"PR-01-04","t":"Ile procesów obejmuje domena BAI (Twórz, Nabywaj i Wdrażaj)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 33"],"r":null,"zap":"","scen":"","o":[{"t":"10","ok":true,"w":"Tak: BAI01–BAI10."},{"t":"13","ok":false,"w":"Tyle procesów ma APO, najliczniejsza domena."},{"t":"6","ok":false,"w":"Tyle procesów ma DSS."},{"t":"5","ok":false,"w":"Tyle procesów ma domena Ładu EDM."}],"fz":{"h":"BAI","p":"P2","pulapka":false,"n":"≠ TŁUMACZENIE · egzamin: Twórz, Nabywaj i Wdrażaj · podr.: Budowanie, nabywanie i wdrażanie · EN: Build, Acquire and Implement","q":"Co obejmuje domena BAI? / Która domena: programy i projekty, wymagania, rozwiązania, pojemność, zmiany, wiedza, aktywa, konfiguracja?","a":"Domena Zarządzania (Twórz): 10 procesów, m.in. programy i projekty, wymagania, rozwiązania, zmiany.\nBAI (Twórz, Nabywaj i Wdrażaj), BAI01–BAI10; m.in. BAI05 wdrażanie zmian organizacyjnych, BAI07 akceptacja zmian i przejście, BAI09 zarządzanie zasobami (aktywami).","ex":"Ekipa remontowa: według planu buduje albo kupuje nowe rzeczy i je wprowadza, np. nową kuchnię. Haczyk: BAI – „Buduj Albo Importuj”; 10 procesów.\nSam remont: prowadzisz roboty, spisujesz, czego chcesz, budujesz, wprowadzasz zmiany, odbierasz pracę i spisujesz, co masz w domu (aktywa = posiadane rzeczy). Budowa = BAI, 10 procesów.","org":"BAI03 rozbudowa systemu zgłoszeń."}},"fz-B-003":{"id":"fz-B-003","typ":"egzamin","s":"PR-01-04","t":"Która domena obejmuje m.in. eksploatację, zgłoszenia i incydenty, problemy oraz ciągłość?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 33"],"r":null,"zap":"","scen":"","o":[{"t":"DSS – Dostarczaj, Obsługuj i Wspieraj","ok":true,"w":"Tak: DSS to codzienna obsługa, 6 procesów (DSS01–DSS06)."},{"t":"BAI – Twórz, Nabywaj i Wdrażaj","ok":false,"w":"BAI buduje lub nabywa rozwiązania i wdraża zmiany, a nie prowadzi bieżącej obsługi."},{"t":"MEA – Monitoruj, Oszacuj i Oceń","ok":false,"w":"MEA monitoruje wydajność, zgodność i kontrolę wewnętrzną."},{"t":"APO – Dostosuj, Planuj i Organizuj","ok":false,"w":"APO to planowanie: strategia, architektura, portfel, ryzyko."}],"fz":{"h":"DSS","p":"P2","pulapka":false,"n":"≠ TŁUMACZENIE · egzamin: Dostarczaj, Obsługuj i Wspieraj · podr.: Dostarczanie, obsługa i wsparcie · EN: Deliver, Service and Support","q":"Co obejmuje domena DSS? / Która domena: eksploatacja, zgłoszenia i incydenty, problemy, ciągłość, usługi bezpieczeństwa, kontrole procesów biznesowych?","a":"Domena Zarządzania (Wykonuj): 6 procesów, m.in. eksploatacja, incydenty, problemy, ciągłość.\nDSS (Dostarczaj, Obsługuj i Wspieraj), DSS01–DSS06.","ex":"Codzienność jak w warsztacie samochodowym: auta mają jeździć, a gdy coś się zepsuje – szybka naprawa, szukanie przyczyny, auto zastępcze. Haczyk: DSS – „Dzień w Dzień Serwis”; 6 procesów.\nŻycie w gotowym domu: codzienna obsługa, naprawa awarii, szukanie przyczyny przecieku, plan na wypadek pożaru, zamki i alarm. Codzienność = DSS, 6 procesów.","org":"DSS02 obsługa zgłoszeń i awarii."}},"fz-B-004":{"id":"fz-B-004","typ":"egzamin","s":"PR-01-04","t":"Czego dotyczą trzy procesy domeny MEA (Monitoruj, Oszacuj i Oceń)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 32","FW-PL s. 33","Altkom — Różnice tłumaczenia PL, s. 1"],"r":null,"zap":"","scen":"","o":[{"t":"Wyników i zgodności, kontroli wewnętrznej oraz wymogów zewnętrznych","ok":true,"w":"MEA01: Monitorowanie, ocena i oszacowanie wydajności i zgodności — Monitor, Evaluate and Assess Performance and Conformance. MEA02: Monitorowanie, ocena i oszacowanie systemu kontroli wewnętrznej — Monitor, Evaluate and Assess the System of Internal Control. MEA03: Monitorowanie, ocena i oszacowanie zgodności z wymogami zewnętrznymi — Monitor, Evaluate and Assess Compliance With External Requirements. To trzy procesy domeny MEA (Monitor, Evaluate and Assess — Monitoruj, Oszacuj i Oceń) w Zarządzaniu."},{"t":"Oceny, kierowania i monitorowania kierunku wyznaczonego dla organizacji","ok":false,"w":"To działania Ładu w domenie EDM (Evaluate, Direct and Monitor — Oszacuj, Kieruj i Monitoruj)."},{"t":"Incydentów, problemów i ciągłości działania","ok":false,"w":"To procesy domeny DSS (Deliver, Service and Support — Dostarczaj, Obsługuj i Wspieraj)."},{"t":"Strategii, ryzyka i bezpieczeństwa","ok":false,"w":"To procesy domeny APO (Align, Plan and Organise — Dostosuj, Planuj i Organizuj)."}],"fz":{"h":"MEA","p":"P2","pulapka":false,"n":"MEA — Monitor, Evaluate and Assess — Monitoruj, Oszacuj i Oceń. Trzy procesy Zarządzania.","q":"Która domena: wydajność i zgodność, system kontroli wewnętrznej, zgodność z wymogami zewnętrznymi?","a":"MEA01: Monitorowanie, ocena i oszacowanie wydajności i zgodności — Monitor, Evaluate and Assess Performance and Conformance. MEA02: Monitorowanie, ocena i oszacowanie systemu kontroli wewnętrznej — Monitor, Evaluate and Assess the System of Internal Control. MEA03: Monitorowanie, ocena i oszacowanie zgodności z wymogami zewnętrznymi — Monitor, Evaluate and Assess Compliance With External Requirements. To trzy procesy domeny MEA (Monitor, Evaluate and Assess — Monitoruj, Oszacuj i Oceń) w Zarządzaniu.","ex":"Trzy kontrole jak u kierowcy: czy auto jedzie dobrze (wyniki), czy hamulce działają (kontrola wewnętrzna), czy są przegląd i OC (przepisy z zewnątrz). MEA (Monitor, Evaluate and Assess — Monitoruj, Oszacuj i Oceń), 3 procesy.","org":"MEA01 (Monitor, Evaluate and Assess Performance and Conformance — Monitorowanie, ocena i oszacowanie wydajności i zgodności) comiesięczny raport z liczbami."}},"fz-B-005":{"id":"fz-B-005","typ":"egzamin","s":"PR-01-03","t":"Z jaką normą zgodnie Ład ocenia, kieruje i monitoruje w domenie EDM?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 32","FW-PL s. 60"],"r":null,"zap":"","scen":"","o":[{"t":"ISO/IEC 38500","ok":true,"w":"Domena Ładu: 5 procesów (EDM01 (Ensure Governance Framework Setting and Maintenance — Zapewnienie ustanowienia i utrzymania struktury ramowej Ładu)–05). Ład ocenia, kieruje i monitoruje, zgodnie z ISO/IEC (International Organization for Standardization / International Electrotechnical Commission — Międzynarodowa Organizacja Normalizacyjna / Międzynarodowa Komisja Elektrotechniczna) 38500."},{"t":"ISO/IEC 15504","ok":false,"w":"To norma oceny procesów, na której opiera się ocena zdolności, a nie model Ładu."},{"t":"ISO/IEC 27000","ok":false,"w":"To seria norm o bezpieczeństwie informacji, źródło szczegółowych działań."},{"t":"PRINCE2","ok":false,"w":"To metodyka zarządzania projektami, źródło szczegółowych działań."}],"fz":{"h":"EDM","p":"P1","pulapka":false,"n":"≠ TŁUMACZENIE · egzamin: Oszacuj, Kieruj i Monitoruj · podr.: Ocena, Kierowanie i Monitorowanie · EN: Evaluate, Direct and Monitor","q":"Co obejmuje domena EDM?","a":"Domena Ładu: 5 procesów (EDM01 (Ensure Governance Framework Setting and Maintenance — Zapewnienie ustanowienia i utrzymania struktury ramowej Ładu)–05). Ład ocenia, kieruje i monitoruje, zgodnie z ISO/IEC (International Organization for Standardization / International Electrotechnical Commission — Międzynarodowa Organizacja Normalizacyjna / Międzynarodowa Komisja Elektrotechniczna) 38500.","ex":"Rola właściciela restauracji: ocenia sytuację, wyznacza kierunek, sprawdza efekty, ale sam nie gotuje. Haczyk: 5 procesów EDM (Evaluate, Direct and Monitor — Oszacuj, Kieruj i Monitoruj) jak 5 palców ręki szefa. ISO/IEC (International Organization for Standardization / International Electrotechnical Commission — Międzynarodowa Organizacja Normalizacyjna / Międzynarodowa Komisja Elektrotechniczna) 38500 – norma o nadzorze nad IT (Information Technology — technologie informacyjne).","org":"kierownictwo ocenia raport ryzyka przerw co miesiąc."}},"fz-B-006":{"id":"fz-B-006","typ":"egzamin","s":"PR-02-14","t":"Z jakich czterech obszarów działań składa się Zarządzanie (PBRM)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 32","Altkom — Różnice tłumaczenia PL, s. 1","PeopleCert Sample Paper 1 PL — wariant Twórz w PBRM"],"r":null,"zap":"","scen":"","o":[{"t":"Planuj, Twórz, Wykonuj i Monitoruj","ok":true,"w":"PBRM (Plan, Build, Run and Monitor — Planuj, Wytwarzaj/Twórz, Wykonuj i Monitoruj) — Plan, Build, Run and Monitor: Planuj, Wytwarzaj, Wykonuj i Monitoruj. W Sample Paper 1 występuje wariant „Twórz” zamiast „Wytwarzaj”. To cztery główne obszary Zarządzania, powiązane odpowiednio z APO (Align, Plan and Organise — Dostosuj, Planuj i Organizuj), BAI (Build, Acquire and Implement — Twórz, Nabywaj i Wdrażaj), DSS (Deliver, Service and Support — Dostarczaj, Obsługuj i Wspieraj) i MEA (Monitor, Evaluate and Assess — Monitoruj, Oszacuj i Oceń). Run oznacza bieżące wykonywanie i eksploatację, a nie samo uruchomienie rozwiązania. Obszary te mogą występować wewnątrz procesów każdej domeny."},{"t":"Oszacuj, Kieruj i Monitoruj","ok":false,"w":"To trzy działania Ładu (EDM (Evaluate, Direct and Monitor — Oszacuj, Kieruj i Monitoruj)), nie Zarządzania."},{"t":"Dostosuj, Planuj i Organizuj","ok":false,"w":"To nazwa jednej domeny (APO (Align, Plan and Organise — Dostosuj, Planuj i Organizuj)), a nie całego Zarządzania."},{"t":"Planowanie, projektowanie, budowanie i użytkowanie","ok":false,"w":"To początkowe etapy cyklu życia aktywatora."}],"fz":{"h":"PBRM","p":"P1","pulapka":true,"n":"≠ TŁUMACZENIE · egzamin: Planuj, Wytwarzaj
