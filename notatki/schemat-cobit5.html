łania procesu. Większość procesów obejmuje planowanie, budowanie, wykonywanie oraz monitorowanie w odniesieniu do własnego zakresu. PBRM (Plan, Build, Run and Monitor — Planuj, Wytwarzaj/Twórz, Wykonuj i Monitoruj) opisuje obszary działań Zarządzania, a nie cztery rozłączne etapy przypisane na wyłączność domenom.","ex":"Jak w domu: w każdym pokoju się sprząta, urządza i mieszka. Pokój nazywasz od jego głównego przeznaczenia – tak samo proces przypisano do domeny jego najwłaściwszego obszaru.","org":""},"cyt":{"s":"33","t":"większość procesów wymaga działań związanych z planowaniem, wdrożeniem, realizacją i monitorowaniem w ramach procesów lub w ramach konkretnego problemu (np. jakość, bezpieczeństwo), są one umieszczane w domenach odpowiadających zasadniczo najwłaściwszemu obszarowi działania","w":"ZGODNE"}},"fz-A-048":{"id":"fz-A-048","typ":"egzamin","s":"PR-02-04","t":"Ile ogólnych celów organizacji opisuje COBIT 5 i jak się je grupuje?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 18","FW-PL s. 19"],"r":null,"zap":"","scen":"","o":[{"t":"17 celów w 4 wymiarach BSC","ok":true,"w":"17 ogólnych celów organizacji w czterech wymiarach zrównoważonej karty wyników: Finanse — cele 1–5; Klient — 6–10; Obszar wewnętrzny — 11–15; Szkolenie i rozwój — 16–17. Rozkład 5–5–5–2. Cel 7 „Ciągłość i dostępność usług biznesowych” należy do wymiaru Klient. Cele związane z informatyką również mają cztery wymiary, lecz inny rozkład: 6–2–7–2."},{"t":"37 celów w 5 domenach","ok":false,"w":"37 to liczba procesów w 5 domenach, nie celów organizacji."},{"t":"17 celów w 5 domenach procesów","ok":false,"w":"Cele organizacji grupuje się w wymiarach BSC (Balanced Scorecard — zrównoważona karta wyników), a nie w domenach."},{"t":"13 celów w 4 wymiarach BSC","ok":false,"w":"Celów organizacji jest 17; 13 procesów ma domena APO (Align, Plan and Organise — Dostosuj, Planuj i Organizuj)."}],"fz":{"h":"Cele organizacji","p":"P2","pulapka":false,"n":"≠ TŁUMACZENIE · egzamin: cele organizacji · podr.: cele przedsiębiorstwa · EN: enterprise goals · EN: 17 enterprise goals; BSC (Balanced Scorecard — zrównoważona karta wyników): Financial, Customer, Internal, Learning and Growth","q":"Ile jest celów organizacji i w jakich wymiarach BSC?","a":"17 ogólnych celów organizacji w czterech wymiarach zrównoważonej karty wyników: Finanse — cele 1–5; Klient — 6–10; Obszar wewnętrzny — 11–15; Szkolenie i rozwój — 16–17. Rozkład 5–5–5–2. Cel 7 „Ciągłość i dostępność usług biznesowych” należy do wymiaru Klient. Cele związane z informatyką również mają cztery wymiary, lecz inny rozkład: 6–2–7–2.","ex":"Zapamiętaj 17 celów i rozkład 5–5–5–2. Cel 7 dotyczący ciągłości i dostępności usług jest w wymiarze Klient, ponieważ odzwierciedla potrzeby odbiorców usług. Szkolenie i rozwój obejmuje dwa cele, 16 i17.","org":"CO7 (Enterprise Goal 7 — cel organizacji 7: Ciągłość i dostępność usług biznesowych) dla komendy: usługi wspierające działania dostępne zawsze."},"cyt":{"s":"18","t":"W metodyce COBIT 5 zdefiniowano 17 typowych celów widocznych na ilustracji 5, na której przedstawiono następujące informacje: • wymiar BSC, w którym mieści się dany cel przedsiębiorstwa;","w":"ZGODNE","u":"Cztery wymiary i rozkład 5–5–5–2 wynikają z Ilustracji 5 (s. 19)."}},"fz-A-051":{"id":"fz-A-051","typ":"egzamin","s":"PR-02-03","t":"Która definicja interesariusza jest zgodna ze słownikiem COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 93"],"r":null,"zap":"","scen":"","o":[{"t":"Właściciel kapitału, który uczestniczy w finansowaniu organizacji","ok":false,"w":"Właściciele kapitału są interesariuszami, lecz nie wyczerpują definicji. Należą do niej także inne strony mające odpowiedzialność, oczekiwania lub udział w organizacji."},{"t":"Podmiot odpowiedzialny za organizację, mający wobec niej oczekiwania lub udział","ok":true,"w":"Definicja obejmuje każdą stronę odpowiedzialną za organizację, mającą wobec niej oczekiwania lub mającą w niej udział. Może to być interesariusz wewnętrzny lub zewnętrzny."},{"t":"Pracownik zatrudniony przy realizacji procesów organizacji","ok":false,"w":"Pracownik może być interesariuszem wewnętrznym. Definicja jest jednak szersza i obejmuje także strony zewnętrzne, np. klientów, dostawców i organy regulacyjne."},{"t":"Członek organu Ładu podejmujący decyzje o kierunku organizacji","ok":false,"w":"Organ Ładu jest jedną z ról związanych z organizacją, lecz interesariuszami są również inne strony. Utożsamienie pojęcia z członkostwem w organie Ładu nadmiernie je zawęża."}],"fz":{"h":"Interesariusz","p":"P1","pulapka":false,"n":"egzamin: interesariusz · podr.: interesariusz · EN: stakeholder · EN: Stakeholder","q":"Kim jest interesariusz?","a":"Interesariusz (stakeholder) to osoba lub podmiot, na którym spoczywa odpowiedzialność za organizację, który ma wobec niej oczekiwania lub ma w niej udział. Interesariusze mogą być wewnętrzni i zewnętrzni; nie ograniczają się do udziałowców, pracowników ani organu Ładu.","ex":"Każdy, kto zyskuje lub traci na działaniu organizacji: w szkole uczniowie, rodzice, nauczyciele, kuratorium i firma dowożąca obiady.","org":"komendy, kierownictwo, ministerstwo, obywatele."},"cyt":{"s":"93","t":"Każda osoba, na której spoczywa odpowiedzialność za przedsiębiorstwo, mająca wobec niego oczekiwania lub jakiś udział w przedsiębiorstwie, np. udziałowcy, użytkownicy, rząd, dostawcy, klienci oraz opinia publiczna.","w":"ZGODNE"}},"fz-A-052":{"id":"fz-A-052","typ":"egzamin","s":"PR-02-02,PR-02-05,PR-02-06","t":"Jaka jest poprawna kolejność Kaskady Celów?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 17","FW-PL s. 18","FW-PL s. 19"],"r":null,"zap":"","scen":"","o":[{"t":"Potrzeby, wyznaczniki, cele organizacji, cele IT, cele aktywatorów","ok":false,"w":"Wyznaczniki są pierwsze – to one wpływają na potrzeby."},{"t":"Wyznaczniki, potrzeby, cele IT, cele organizacji, cele aktywatorów","ok":false,"w":"Cele organizacji są przed celami związanymi z informatyką."},{"t":"Wyznaczniki, potrzeby, cele organizacji, cele aktywatorów, cele IT","ok":false,"w":"Cele aktywatorów to ostatni krok kaskady."},{"t":"Wyznaczniki, potrzeby, cele organizacji, cele IT, cele aktywatorów","ok":true,"w":"Kolejność: wyznaczniki interesariuszy → potrzeby interesariuszy → cele organizacji → cele związane z informatyką → cele aktywatorów. Krok 1: wyznaczniki wpływają na potrzeby. Krok 2: potrzeby przekłada się na cele organizacji. Krok 3: cele organizacji na cele związane z informatyką. Krok 4: cele związane z informatyką na cele wszystkich kategorii aktywatorów. Nie dodaje się osobnego kroku „rezultaty IT (Information Technology — technologie informacyjne)”."}],"fz":{"h":"Kaskada celów","p":"P1","pulapka":false,"n":"egzamin: kaskada celów · podr.: kaskada celów · EN: goals cascade · EN: Stakeholder drivers → stakeholder needs → enterprise goals → IT (Information Technology — technologie informacyjne)-related goals → enabler goals","q":"Podaj kolejność Kaskady Celów.","a":"Kolejność: wyznaczniki interesariuszy → potrzeby interesariuszy → cele organizacji → cele związane z informatyką → cele aktywatorów. Krok 1: wyznaczniki wpływają na potrzeby. Krok 2: potrzeby przekłada się na cele organizacji. Krok 3: cele organizacji na cele związane z informatyką. Krok 4: cele związane z informatyką na cele wszystkich kategorii aktywatorów. Nie dodaje się osobnego kroku „rezultaty IT (Information Technology — technologie informacyjne)”.","ex":"Haczyk W-P-O-I-A: „Wiatr Popycha Organizację, IT, Aktywatory”. Od przyczyny (wyznaczniki) do konkretnych zadań (aktywatory), jak woda spływająca po schodach.","org":"awaria → „usługi bez przerw” → CO7 (Enterprise Goal 7 — cel organizacji 7: Ciągłość i dostępność usług biznesowych) → IT04 (IT-related Goal 04 — cel związany z informatyką 04: Zarządzanie ryzykiem biznesowym związanym z IT) → DSS02 (Manage Service Requests and Incidents — Zarządzanie zgłoszeniami serwisowymi i incydentami)."},"cyt":{"s":"17","t":"Kaskada celów COBIT 5 to mechanizm umożliwiający przełożenie potrzeb interesariuszy na określone, składające się z konkretnych działań i dostosowane cele przedsiębiorstwa, cele związane z IT oraz cele czynników umożliwiających.","w":"ZGODNE","u":"Wyznaczniki jako krok 1 — ta sama strona."}},"fz-A-053":{"id":"fz-A-053","typ":"egzamin","s":"PR-02-01","t":"Które stwierdzenie najlepiej oddaje istotę optymalizacji ryzyka w COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 17","FW-PL s. 93"],"r":null,"zap":"","scen":"","o":[{"t":"Zarządzanie rozpoznanym ryzykiem w granicach apetytu organizacji","ok":true,"w":"Optymalizacja obejmuje rozpoznanie ryzyka, ocenę skutków i prawdopodobieństwa oraz dobranie postępowania utrzymującego ryzyko w granicach apetytu organizacji. Nie jest równoznaczna z doprowadzeniem ryzyka do minimum za każdą cenę."},{"t":"Zmniejszanie ryzyka do najniższego możliwego poziomu","ok":false,"w":"Najniższe możliwe ryzyko może uniemożliwiać uzyskanie oczekiwanych korzyści lub zużywać nadmierne zasoby. COBIT 5 wymaga optymalizacji i równowagi wartości, nie samej minimalizacji."},{"t":"Przenoszenie finansowych skutków ryzyka na ubezpieczyciela","ok":false,"w":"Transfer ryzyka jest jedną z możliwych strategii postępowania. Nie zastępuje rozpoznania i oceny ryzyka ani ustalenia jego akceptowalnego poziomu."},{"t":"Skuteczne, wydajne i odpowiedzialne wykorzystanie wszystkich zasobów","ok":false,"w":"Skuteczne, wydajne i odpowiedzialne wykorzystanie zasobów opisuje optymalizację zasobów. Optymalizacja ryzyka dotyczy rozpoznania, oceny i postępowania z ryzykiem."}],"fz":{"h":"Optymalizacja ryzyka","p":"P1","pulapka":false,"n":"EN: Risk optimisation","q":"Co oznacza optymalizacja ryzyka?","a":"Rozpoznawanie ryzyka, ocena jego skutków i prawdopodobieństwa oraz trzymanie go w granicach, które organizacja akceptuje (apetyt na ryzyko).","ex":"Apetyt na ryzyko to ile ryzyka organizacja godzi się znieść, jak ograniczenie prędkości. Rozpoznajesz zagrożenia, oceniasz je i trzymasz w tej granicy.","org":""},"cyt":{"s":"93","t":"Wiąże się z rozpoznawaniem ryzyka, oszacowaniem wpływu i prawdopodobieństwa takiego ryzyka oraz opracowaniem strategii, takich jak unikanie ryzyka, ograniczanie negatywnego wpływu ryzyka i/lub transfer ryzyka oraz zarządzanie nim w kontekście apetytu na ryzyko w przedsiębiorstwie.","w":"ZGODNE"}},"fz-A-054":{"id":"fz-A-054","typ":"egzamin","s":"PR-02-01","t":"Które stwierdzenie oddaje słownikowe znaczenie optymalizacji zasobów?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 93"],"r":null,"zap":"","scen":"","o":[{"t":"Jak najniższe wydatki na zasoby i infrastrukturę IT","ok":false,"w":"Chodzi o optymalne, a nie minimalne wykorzystanie zasobów."},{"t":"Oszczędne wykorzystanie wyłącznie zasobów finansowych","ok":false,"w":"Obejmuje wszystkie zasoby: ludzi, finanse, sprzęt, infrastrukturę."},{"t":"Skuteczne, wydajne i odpowiedzialne wykorzystanie wszystkich zasobów","ok":true,"w":"Skuteczne, wydajne i odpowiedzialne wykorzystanie wszystkich zasobów: ludzkich, finansowych, sprzętu, infrastruktury itd."},{"t":"Eliminowanie inicjatyw, które nie dają wystarczającej wartości","ok":false,"w":"Eliminacja inicjatyw lub aktywów o niewystarczającej wartości pojawia się w definicji realizacji korzyści. Może wpływać także na zasoby, lecz nie jest pełną słownikową definicją optymalizacji zasobów."}],"fz":{"h":"Optymalizacja zasobów","p":"P1","pulapka":false,"n":"EN: Resource optimisation","q":"Co oznacza optymalizacja zasobów?","a":"Skuteczne, wydajne i odpowiedzialne wykorzystanie wszystkich zasobów: ludzkich, finansowych, sprzętu, infrastruktury itd.","ex":"Jak gotowanie z zapasów: nic się nie marnuje, nic nie leży bezużytecznie, a ludzie, pieniądze i sprzęt trafiają tam, gdzie są potrzebne.","org":""},"cyt":{"s":"93","t":"Obejmuje skuteczne, wydajne i odpowiedzialne wykorzystanie wszystkich zasobów — ludzkich, finansowych, sprzętu, infrastruktury itd.","w":"ZGODNE"}},"fz-A-055":{"id":"fz-A-055","typ":"egzamin","s":"PR-02-01","t":"Co obejmuje realizacja korzyści?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 17","FW-PL s. 89"],"r":null,"zap":"","scen":"","o":[{"t":"Rozwijanie przychodów finansowych z inwestycji wspieranych przez informatykę","ok":false,"w":"Korzyści mogą być finansowe, ale COBIT 5 uwzględnia także korzyści niefinansowe, np. jakość usług publicznych. Definicja obejmuje również utrzymanie i rozszerzanie istniejących korzyści oraz eliminację niewystarczającej wartości."},{"t":"Utrzymywanie rozpoznanego ryzyka w granicach apetytu organizacji","ok":false,"w":"To opis optymalizacji ryzyka. Realizacja korzyści jest odrębnym składnikiem tworzenia wartości, równoważonym z ryzykiem i zasobami."},{"t":"Uruchamianie nowych inicjatyw biznesowych i uzyskiwanie z nich korzyści","ok":false,"w":"Uruchamianie nowych inicjatyw i nowe korzyści to tylko część definicji. Trzeba także utrzymywać i zwiększać istniejące korzyści oraz eliminować inicjatywy i aktywa o niewystarczającej wartości."},{"t":"Uzyskiwanie i utrzymywanie korzyści oraz eliminowanie inicjatyw o niewystarczającej wartości","ok":true,"w":"Realizacja korzyści obejmuje nowe korzyści, utrzymanie i rozszerzanie istniejących oraz eliminację inicjatyw i aktywów, które nie dają wystarczającej wartości. Może dotyczyć korzyści finansowych i niefinansowych."}],"fz":{"h":"Realizacja korzyści","p":"P1","pulapka":false,"n":"egzamin: realizacja korzyści · podr.: realizacja korzyści · EN: benefits realisation · EN: Benefits realisation","q":"Co oznacza realizacja korzyści?","a":"Realizacja korzyści (benefits realisation) obejmuje uzyskiwanie nowych korzyści, utrzymywanie i rozszerzanie istniejących oraz eliminowanie inicjatyw i aktywów, które nie generują wystarczającej wartości. Korzyści mogą być finansowe i niefinansowe, np. lepsze usługi publiczne. Tworzenie wartości wymaga przy tym równoważenia korzyści z ryzykiem i wykorzystaniem zasobów.","ex":"Jak ogródek: siejesz nowe rośliny, podlewasz te, które rosną, i wyrywasz chwasty, które tylko zabierają miejsce.","org":"krótszy czas przywrócenia usług dla komend."},"cyt":{"s":"89","t":"Uzyskiwanie przez przedsiębiorstwo nowych korzyści, utrzymanie i rozszerzenie istniejących form korzyści oraz wyeliminowanie inicjatyw i zasobów, które nie generują wystarczającej wartości.","w":"ZGODNE","u":"Podręcznik: „inicjatyw i zasobów” (fiszka: „inicjatyw i aktywów”)."}},"fz-A-056":{"id":"fz-A-056","typ":"egzamin","s":"PR-02-01","t":"Czym jest cel Ładu w COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 17"],"r":null,"zap":"","scen":"","o":[{"t":"Tworzeniem wartości przy optymalnym ryzyku i zasobach","ok":true,"w":"Cel Ładu (podr. cel nadzoru) to Tworzenie wartości: realizacja korzyści przy optymalnym ryzyku i optymalnym wykorzystaniu zasobów."},{"t":"Maksymalizacją zysku organizacji niezależnie od ryzyka","ok":false,"w":"Tworzenie wartości to równowaga korzyści, ryzyka i zasobów."},{"t":"Wdrożeniem wszystkich 37 procesów COBIT 5","ok":false,"w":"Procesy to tylko jeden z aktywatorów, a nie cel Ładu."},{"t":"Ułożeniem celów organizacji w wymiarach BSC","ok":false,"w":"BSC grupuje cele organizacji; nie jest celem Ładu."}],"fz":{"h":"Tworzenie wartości","p":"P1","pulapka":false,"n":"≠ TŁUMACZENIE · egzamin: tworzenie wartości – cel Ładu · podr.: tworzenie wartości – cel nadzoru · EN: value creation, governance objective · EN: Value creation – governance objective","q":"Czym jest cel Ładu? / Czym jest Tworzenie Wartości?","a":"Tworzenie wartości: realizacja korzyści przy optymalnym ryzyku i zasobach (Rys. 3). Te trzy składniki to perspektywy oceny potrzeb, nie krok kaskady.\nCelem Ładu (podr. cel nadzoru): osiąganie korzyści przy optymalnym ryzyku i optymalnym wykorzystaniu zasobów. Osiąga się je, równoważąc trzy cele.","ex":"Waga szalkowa: na jednej szali korzyści, na drugiej ryzyko i koszty. Ład trzyma równowagę. To sposób patrzenia, nie osobny krok kaskady.\nJak zakupy z budżetem: chcesz dobrej rzeczy (korzyść), bez przepłacania (zasoby) i bez ryzyka bubla (ryzyko). Tworzenie wartości to równowaga tych trzech.","org":""},"cyt":{"s":"93","t":"Główny cel nadzoru w przedsiębiorstwie, który osiąga się po zapewnieniu równowagi między trzema podstawowymi celami (realizacja korzyści, optymalizacja ryzyka i optymalizacja zasobów).","w":"ZGODNE","u":"Cel Ładu = cel nadzoru."}},"fz-A-058":{"id":"fz-A-058","typ":"egzamin","s":"PR-02-02","t":"Czym jest wyznacznik w Kaskadzie Celów?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 17","FW-PL s. 91"],"r":null,"zap":"","scen":"","o":[{"t":"Wskaźnikiem, który mierzy, czy cel aktywatora osiągnięto","ok":false,"w":"To opis wskaźnika opóźnionego, nie wyznacznika."},{"t":"Czynnikiem wpływającym na potrzeby interesariuszy","ok":true,"w":"Czynniki zewnętrzne i wewnętrzne, które wywołują zmiany w organizacji lub wpływają na jej działanie, np. nowa strategia, zmiany otoczenia biznesowego i przepisów, nowe technologie."},{"t":"Osobą, która ma wobec organizacji oczekiwania lub udział","ok":false,"w":"To definicja interesariusza."},{"t":"Jednym z 17 celów związanych z informatyką","ok":false,"w":"Cele IT (Information Technology — technologie informacyjne) to dalszy krok kaskady, nie wyznaczniki."}],"fz":{"h":"Wyznacznik","p":"P1","pulapka":false,"n":"egzamin: wyznaczniki · podr.: wyznaczniki · EN: stakeholder drivers · EN: Driver / stakeholder drivers","q":"Czym jest wyznacznik (czynnik wpływający na potrzeby interesariuszy)?","a":"Czynniki zewnętrzne i wewnętrzne, które wywołują zmiany w organizacji lub wpływają na jej działanie, np. nowa strategia, zmiany otoczenia biznesowego i przepisów, nowe technologie.","ex":"Bodziec z zewnątrz lub z wewnątrz, jak nowe prawo o recyklingu, które zmusza sklep do zmiany opakowań.","org":"nawałnice i nowe przepisy zmieniają potrzeby komend."},"cyt":{"s":"91","t":"Wyznacznik Czynniki zewnętrzne i wewnętrzne, które inicjują i wpływają na sposób funkcjonowania przedsiębiorstwa lub osób bądź dokonywania przez nie zmian.","w":"ZGODNE"}},"fz-A-059":{"id":"fz-A-059","typ":"egzamin","s":"PR-02-05","t":"Które stwierdzenie opisuje mapowanie celów organizacji na cele związane z informatyką?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 18","FW-PL s. 49–50","FW-PL s. 51–53","FW-PL s. 55"],"r":null,"zap":"","scen":"","o":[{"t":"Każdy cel IT wspiera dokładnie jeden cel organizacji","ok":false,"w":"Mapowanie nie jest relacją jeden do jednego. Jeden cel organizacji może wiązać się z wieloma celami IT."},{"t":"Cele organizacji zastępuje się celami IT","ok":false,"w":"Cele organizacji pozostają punktem odniesienia. Cele IT (Information Technology — technologie informatyczne) opisują potrzebne rezultaty związane z informatyką."},{"t":"Jeden cel organizacji może wymagać wielu celów IT","ok":true,"w":"Relacja jest wiele do wielu: osiągnięcie jednego celu organizacji może wymagać wielu celów związanych z informatyką, a jeden cel IT może wspierać wiele celów organizacji. Przykładową macierz zawiera Załącznik B (FW-PL s. 18, 49–50)."},{"t":"Mapowanie pomija cele związane z informatyką","ok":false,"w":"Cele związane z informatyką są kolejnym poziomem Kaskady Celów, pomiędzy celami organizacji a celami aktywatorów."}],"fz":{"h":"Załączniki B, C, D","p":"P2","pulapka":false,"n":"egzamin: załączniki B, C, D · podr.: załączniki B, C, D · EN: appendices B, C, D · EN: Appendices B, C, D","q":"Które załączniki zawierają mapowania kaskady?","a":"D: potrzeby interesariuszy → cele organizacji; B: cele organizacji → cele związane z IT (Information Technology — technologie informacyjne); C: cele związane z IT → procesy.","ex":"Kolejność kaskady to D-B-C, nie A-B-C: najpierw D (potrzeby), potem B (cele organizacji → IT (Information Technology — technologie informacyjne)), na końcu C (IT → procesy).","org":""},"cyt":{"s":"18","t":"Zilustrowano w niej sposób, w jaki każdy z celów przedsiębiorstwa jest wspierany przez szereg celów związanych z IT.","w":"ZGODNE"}},"fz-A-060":{"id":"fz-A-060","typ":"egzamin","s":"PR-02-03","t":"Który z poniższych jest interesariuszem zewnętrznym?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 22"],"r":null,"zap":"","scen":"","o":[{"t":"CIO","ok":false,"w":"CIO (Chief Information Officer — dyrektor ds. informatyki) to interesariusz wewnętrzny."},{"t":"Audyt wewnętrzny","ok":false,"w":"Audyt wewnętrzny to interesariusz wewnętrzny."},{"t":"Właściciele procesów biznesowych","ok":false,"w":"Właściciele procesów biznesowych są interesariuszami wewnętrznymi."},{"t":"Organy nadzorcze i rządowe","ok":true,"w":"Wewnętrzni: zarząd, CEO (Chief Executive Officer — dyrektor generalny), CFO (Chief Financial Officer — dyrektor finansowy), CIO (Chief Information Officer — dyrektor ds. informatyki), CRO (Chief Risk Officer — dyrektor ds. ryzyka), właściciele procesów biznesowych, kierownicy biznesu, ryzyka, bezpieczeństwa, usług, HR (Human Resources — zasoby ludzkie), audyt wewnętrzny, użytkownicy IT (Information Technology — technologie informacyjne). Zewnętrzni: partnerzy biznesowi, dostawcy, udziałowcy, organy nadzorcze/rządowe, użytkownicy zewnętrzni."}],"fz":{"h":"Interesariusze wewnętrzni i zewnętrzni","p":"P2","pulapka":false,"n":"EN: Internal and external stakeholders","q":"Podaj przykłady interesariuszy wewnętrznych i zewnętrznych (Rysunek 7).","a":"Wewnętrzni: zarząd, CEO (Chief Executive Officer — dyrektor generalny), CFO (Chief Financial Officer — dyrektor finansowy), CIO (Chief Information Officer — dyrektor ds. informatyki), CRO (Chief Risk Officer — dyrektor ds. ryzyka), właściciele procesów biznesowych, kierownicy biznesu, ryzyka, bezpieczeństwa, usług, HR (Human Resources — zasoby ludzkie), audyt wewnętrzny, użytkownicy IT (Information Technology — technologie informacyjne). Zewnętrzni: partnerzy biznesowi, dostawcy, udziałowcy, organy nadzorcze/rządowe, użytkownicy zewnętrzni.","ex":"Skróty: CEO (Chief Executive Officer — dyrektor generalny) prezes, CFO (Chief Financial Officer — dyrektor finansowy) finanse, CIO (Chief Information Officer — dyrektor ds. informatyki) informatyka, CRO (Chief Risk Officer — dyrektor ds. ryzyka) ryzyko. Wewnętrzni pracują w organizacji, zewnętrzni są poza nią: dostawcy, partnerzy, urzędy.","org":""},"cyt":{"s":"22","t":"Interesariusze zewnętrzni Pytania interesariuszy zewnętrznych • Partnerzy biznesowi • Dostawcy • Udziałowcy • Organy nadzorcze/rządowe","w":"ZGODNE","u":"Rysunek 7 = Ilustracja 7."}},"fz-A-062":{"id":"fz-A-062","typ":"egzamin","s":"PR-02-01","t":"Jakie trzy pytania zadaje się przy każdej decyzji Ładu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 17"],"r":null,"zap":"","scen":"","o":[{"t":"Co planujemy? Co tworzymy? Co monitorujemy?","ok":false,"w":"To nawiązanie do PBRM (Plan, Build, Run and Monitor — Planuj, Wytwarzaj/Twórz, Wykonuj i Monitoruj), czyli działań Zarządzania."},{"t":"Kto odnosi korzyści? Kto ponosi ryzyko? Jakie zasoby są wymagane?","ok":true,"w":"Kto odnosi korzyści? Kto ponosi ryzyko? Jakie zasoby są wymagane?"},{"t":"Gdzie jesteśmy teraz? Do czego dążymy? Jak się tam dostaniemy?","ok":false,"w":"To pytania faz cyklu wdrożenia, nie decyzji Ładu."},{"t":"Kto odpowiada? Kto wykonuje? Kogo informujemy?","ok":false,"w":"To pytania o role w tabeli RACI (Responsible, Accountable, Consulted, Informed — Odpowiedzialny, Rozliczany, Konsultowany, Informowany)."}],"fz":{"h":"Trzy pytania decyzji Ładu","p":"P2","pulapka":false,"n":"EN: Who receives the benefits? Who bears the risk? What resources are required?","q":"Jakie trzy pytania zadaje się przy każdej decyzji Ładu?","a":"Kto odnosi korzyści? Kto ponosi ryzyko? Jakie zasoby są wymagane?","ex":"Jak przy kupnie auta dla rodziny: kto będzie z niego korzystał, kto zapłaci za ewentualną szkodę, ile to kosztuje (pieniądze, czas, garaż).","org":""},"cyt":{"s":"17","t":"W przypadku każdej decyzji można i należy zadać następujące pytania: Kto odnosi korzyści? Kto ponosi ryzyko? Jakie zasoby są wymagane?","w":"ZGODNE"}},"fz-A-063":{"id":"fz-A-063","typ":"egzamin","s":"PR-02-01","t":"Jaką postać mogą mieć korzyści według COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 17"],"r":null,"zap":"","scen":"","o":[{"t":"Wyłącznie finansową, mierzoną zyskiem","ok":false,"w":"Korzyści mogą mieć wiele postaci, nie tylko finansową."},{"t":"Różną, zależnie od rodzaju organizacji","ok":true,"w":"Korzyści mogą mieć wiele postaci, np. finansową w firmach komercyjnych albo lepsze usługi publiczne w administracji; to przykłady, a nie zamknięta lista (FW-PL s. 17)."},{"t":"Wyłącznie oszczędności na kosztach IT","ok":false,"w":"Oszczędności to tylko jedna z możliwych postaci korzyści."},{"t":"Żadną w administracji publicznej","ok":false,"w":"W administracji korzyścią są np. lepsze usługi publiczne."}],"fz":{"h":"Korzyści w firmie i w administracji","p":"P2","pulapka":false,"n":"EN: Benefits: financial vs public services","q":"Jaką postać mają korzyści w firmie, a jaką w administracji?","a":"Mogą mieć wiele postaci, np. finansową w firmach komercyjnych albo lepsze usługi publiczne w administracji. To przykłady, nie zamknięta lista.","ex":"Sklep liczy korzyść często w złotówkach, a straż pożarna w szybkich dojazdach i uratowanych ludziach. Ale i sklep zyskuje zaufanie klientów, a straż – oszczędności.","org":""},"cyt":{"s":"17","t":"Korzyści mogą przybierać wiele różnych postaci, np. w przypadku przedsiębiorstw komercyjnych mają charakter finansowy, zaś dla podmiotów rządowych są nimi usługi publiczne.","w":"ZGODNE"}},"fz-A-065":{"id":"fz-A-065","typ":"egzamin","s":"PR-02-05","t":"Który z poniższych jest celem związanym z informatyką, a nie celem organizacji?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 19"],"r":null,"zap":"","scen":"","o":[{"t":"Zwinność IT","ok":true,"w":"Zwinność IT to cel związany z informatyką nr 09 (wymiar Obszar wewnętrzny IT BSC). Nie myl go z celem organizacji nr 8 „Zwinność w reagowaniu na zmieniające się otoczenie biznesowe” (FW-PL s. 19)."},{"t":"Kultura innowacji","ok":false,"w":"To cel organizacji nr 17 (Szkolenie i rozwój)."},{"t":"Ciągłość i dostępność usług biznesowych","ok":false,"w":"To cel organizacji nr 7 (Klient)."},{"t":"Zgodność z politykami wewnętrznymi","ok":false,"w":"To cel organizacji nr 15 (Obszar wewnętrzny)."}],"fz":{"h":"Przykładowe cele związane z informatyką","p":"P2","pulapka":false,"n":"EN: IT (Information Technology — technologie informacyjne)-related goals examples","q":"Podaj przykładowe cele związane z informatyką.","a":"01 Zgodność IT (Information Technology — technologie informacyjne) z biznesowymi celami strategicznymi; 07 Dostarczanie usług IT zgodnie z wymogami biznesowymi; 09 Zwinność IT; 10 Bezpieczeństwo informacji, infrastruktury przetwarzania i aplikacji; 14 Dostępność wiarygodnych i przydatnych informacji; 16 Kompetentny i zmotywowany personel biznesu i IT.","ex":"Po ludzku: IT (Information Technology — technologie informacyjne) idzie w tym samym kierunku co firma, działa tak, jak biznes potrzebuje, szybko się dostosowuje, chroni dane, daje dobre informacje i ma dobrych ludzi.","org":""},"cyt":{"s":"19","t":"09 Zwinność IT (ang. agility) 10 Bezpieczeństwo informacji, infrastruktury przetwarzania i aplikacji","w":"ZGODNE"}},"fz-A-066":{"id":"fz-A-066","typ":"egzamin","s":"PR-02-04","t":"Czego dotyczą relacje P i S przy celach organizacji?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 18"],"r":null,"zap":"","scen":"","o":[{"t":"Przypisania celu do Ładu albo do Zarządzania","ok":false,"w":"P i S opisują siłę związku, a nie podział na Ład i Zarządzanie."},{"t":"Związku celu organizacji ze składnikami Celu Ładu","ok":true,"w":"P i S opisują związek celu organizacji z trzema składnikami Celu Ładu: korzyściami, ryzykiem i zasobami. P to relacja podstawowa, S – wspierająca, słabsza."},{"t":"Związku celu organizacji z domenami PBRM","ok":false,"w":"Przy celach organizacji P i S odnoszą się do składników Celu Ładu, nie do domen."},{"t":"Kolejności wdrażania celów organizacji","ok":false,"w":"P i S nie wyznaczają kolejności wdrażania."}],"fz":{"h":"Relacje P i S przy celach organizacji","p":"P1","pulapka":false,"n":"EN: P = primary, S = secondary","q":"Co oznaczają relacje P i S przy celach organizacji?","a":"Związek celu organizacji z trzema składnikami Celu Ładu: P – relacja podstawowa (primary), S – wspierająca, czyli słabsza (secondary).","ex":"Jak przyjaciele: P to najlepszy przyjaciel (mocny, główny związek), S to dobry kolega (słabszy, ale prawdziwy).","org":""},"cyt":{"s":"18","t":"związek z trzema głównymi celami w zakresie nadzoru — realizacją korzyści, optymalizacją ryzyka i optymalizacją zasobów (P oznacza relację podstawową, natomiast S — wspierającą, tj. słabszą).","w":"ZGODNE"}},"fz-A-070":{"id":"fz-A-070","typ":"egzamin","s":"PR-02-06","t":"Osiągnięcie czego wspierają cele aktywatora – ostatni etap Kaskady Celów?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 18","FW-PL s. 29"],"r":null,"zap":"","scen":"","o":[{"t":"Bezpośrednio wyznaczników interesariuszy","ok":false,"w":"Wyznaczniki to początek kaskady; cele aktywatora wspierają cele IT (Information Technology — technologie informacyjne)."},{"t":"Wyłącznie procesów domeny EDM","ok":false,"w":"Cele aktywatora dotyczą wszystkich aktywatorów, nie tylko procesów EDM (Evaluate, Direct and Monitor — Oszacuj, Kieruj i Monitoruj)."},{"t":"Celów związanych z informatyką","ok":true,"w":"Ostatnim etapem Kaskady Celów: zbiorem celów każdego aktywatora (procesów, struktur, informacji itd.), które wspierają osiągnięcie celów związanych z informatyką."},{"t":"Wyłącznie wskaźników wiodących","ok":false,"w":"Wskaźniki mierzą cele, a nie są tym, co cele aktywatora wspierają."}],"fz":{"h":"Cele aktywatora","p":"P1","pulapka":false,"n":"EN: Enabler goals","q":"Czym są cele aktywatora?","a":"Ostatnim etapem Kaskady Celów: zbiorem celów każdego aktywatora (procesów, struktur, informacji itd.), które wspierają osiągnięcie celów związanych z informatyką.","ex":"Na samym dole kaskady każdy element dostaje swoje zadanie: procedura, zespół, rejestr danych, szkolenie – jak w remoncie każda ekipa dostaje własny cel.","org":""},"cyt":{"s":"18","t":"dla każdego czynnika umożliwiającego można zdefiniować zbiór konkretnych istotnych celów wspierających realizację celów związanych z IT.","w":"ZGODNE"}},"fz-A-071":{"id":"fz-A-071","typ":"egzamin","s":"PR-02-01","t":"Jak COBIT 5 definiuje ryzyko?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 93"],"r":null,"zap":"","scen":"","o":[{"t":"Jako każde zdarzenie, które już wystąpiło","ok":false,"w":"Ryzyko dotyczy prawdopodobieństwa zdarzenia, a nie zdarzeń przeszłych."},{"t":"Jako ilość ryzyka, którą organizacja jest gotowa przyjąć","ok":false,"w":"To definicja apetytu na ryzyko."},{"t":"Jako połączenie prawdopodobieństwa zdarzenia i jego skutków","ok":true,"w":"Ryzyko to połączenie prawdopodobieństwa zdarzenia i jego skutków (ISO/IEC (International Organization for Standardization / International Electrotechnical Commission — Międzynarodowa Organizacja Normalizacyjna / Międzynarodowa Komisja Elektrotechniczna) 73). Zarządzanie ryzykiem: rozpoznać ryzyko, ocenić wpływ i prawdopodobieństwo, dobrać strategię (unikanie, ograniczenie skutków, przeniesienie na innych) w granicach apetytu na ryzyko."},{"t":"Jako wyłącznie zagrożenie techniczne systemów IT","ok":false,"w":"Definicja nie ogranicza ryzyka do zagrożeń technicznych."}],"fz":{"h":"Ryzyko i zarządzanie ryzykiem","p":"P2","pulapka":false,"n":"EN: Risk; risk management","q":"Jak COBIT 5 definiuje ryzyko i co robi zarządzanie ryzykiem?","a":"Ryzyko to połączenie prawdopodobieństwa zdarzenia i jego skutków (ISO/IEC (International Organization for Standardization / International Electrotechnical Commission — Międzynarodowa Organizacja Normalizacyjna / Międzynarodowa Komisja Elektrotechniczna) 73). Zarządzanie ryzykiem: rozpoznać ryzyko, ocenić wpływ i prawdopodobieństwo, dobrać strategię (unikanie, ograniczenie skutków, przeniesienie na innych) w granicach apetytu na ryzyko.","ex":"Pożar w kuchni: ryzyko to szansa, że wybuchnie, razem z tym, ile szkód narobi. Gaśnica ogranicza skutki, ubezpieczenie przenosi koszt.","org":""},"cyt":{"s":"93","t":"Połączenie prawdopodobieństwa zdarzenia i jego konsekwencji (ISO/IEC 73).","w":"ZGODNE"}},"fz-A-072":{"id":"fz-A-072","typ":"egzamin","s":"PR-02-01","t":"Czym jest apetyt na ryzyko?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 68","ISACA Interactive Glossary — Risk appetite: https://www.isaca.org/resources/glossary"],"r":null,"zap":"","scen":"","o":[{"t":"Ilością ryzyka, którą organizacja jest gotowa przyjąć","ok":true,"w":"Apetyt na ryzyko (risk appetite) to ogólna ilość ryzyka, jaką organizacja jest gotowa przyjąć, realizując swoją misję. Definiuje się go w ramach Ładu nad ryzykiem; polityki powinny go odzwierciedlać. Podręcznik s. 68 opisuje związek apetytu z politykami, a pełną definicję podaje oficjalny słownik ISACA."},{"t":"Najwyższym ryzykiem wykrytym przez audyt","ok":false,"w":"Apetyt to akceptowany poziom ryzyka, a nie wynik audytu."},{"t":"Połączeniem prawdopodobieństwa zdarzenia i jego skutków","ok":false,"w":"To definicja samego ryzyka."},{"t":"Listą ryzyk przeniesionych na ubezpieczyciela","ok":false,"w":"Przeniesienie to strategia postępowania z ryzykiem, nie apetyt."}],"fz":{"h":"Apetyt na ryzyko","p":"P2","pulapka":false,"n":"EN: Risk appetite","q":"Czym jest apetyt na ryzyko i kto go ustala?","a":"Apetyt na ryzyko (risk appetite) to ogólna ilość ryzyka, jaką organizacja jest gotowa przyjąć, realizując swoją misję. Definiuje się go w ramach Ładu nad ryzykiem; polityki powinny go odzwierciedlać. Podręcznik s. 68 opisuje związek apetytu z politykami, a pełną definicję podaje oficjalny słownik ISACA.","ex":"Jak na stoku: jedni jeżdżą tylko niebieskimi trasami, inni czarnymi. Rodzina sama ustala, na które trasy puszcza dzieci.","org":""},"cyt":{"s":"68","t":"W ramach czynności związanych z nadzorem nad ryzykiem definiuje się apetyt na ryzyko w przedsiębiorstwie, który powinien zostać odzwierciedlony w politykach.","w":"BRAK_W_FW","u":"FW-PL nie definiuje apetytu na ryzyko jako „ogólnej ilości ryzyka… realizując misję”; definicja pochodzi ze słownika ISACA (COBIT 5 Glossary)."}},"fz-A-073":{"id":"fz-A-073","typ":"egzamin","s":"EN-02-06,PR-02-01","t":"Jak apetyt na ryzyko wpływa na polityki organizacji?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 68"],"r":null,"zap":"","scen":"","o":[{"t":"Polityki są od apetytu na ryzyko niezależne","ok":false,"w":"Polityki muszą odzwierciedlać apetyt na ryzyko."},{"t":"Ostrożna organizacja ma mniej restrykcyjne polityki","ok":false,"w":"Jest odwrotnie: ostrożna organizacja ma polityki bardziej restrykcyjne."},{"t":"Apetyt na ryzyko ustala samodzielnie dział IT w polityce bezpieczeństwa","ok":false,"w":"Apetyt ustala się w ramach Ładu nad ryzykiem."},{"t":"Polityki muszą go odzwierciedlać – ostrożna organizacja ma bardziej restrykcyjne polityki","ok":true,"w":"Polityki są częścią systemu kontroli wewnętrznej i powinny odzwierciedlać apetyt na ryzyko określony w ramach Ładu nad ryzykiem. Organizacja bardziej ostrożna zwykle przyjmuje bardziej restrykcyjne polityki (s.68)."}],"fz":{"h":"Apetyt na ryzyko","p":"P2","pulapka":false,"n":"EN: Risk appetite","q":"Czym jest apetyt na ryzyko i kto go ustala?","a":"Ogólna ilość ryzyka, jaką organizacja jest gotowa przyjąć, realizując swoją misję. Ustala się go w ramach Ładu nad ryzykiem; polityki muszą go odzwierciedlać: organizacja ostrożna ma bardziej restrykcyjne polityki.","ex":"Jak na stoku: jedni jeżdżą tylko niebieskimi trasami, inni czarnymi. Rodzina sama ustala, na które trasy puszcza dzieci.","org":""},"cyt":{"s":"68","t":"W ramach czynności związanych z nadzorem nad ryzykiem definiuje się apetyt na ryzyko w przedsiębiorstwie, który powinien zostać odzwierciedlony w politykach. Przedsiębiorstwo niechętnie podejmujące ryzyko ma bardziej restrykcyjne polityki niż przedsiębiorstwo skłonne do agresywnego podejmowania ryzyka.","w":"ZGODNE"}},"fz-A-074":{"id":"fz-A-074","typ":"egzamin","s":"PR-02-05","t":"Cele związane z informatyką opisują rezultaty IT potrzebne organizacji. Czym jest rezultat?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 18","FW-PL s. 92"],"r":null,"zap":"","scen":"","o":[{"t":"Osobnym etapem kaskady między celami IT a celami aktywatorów","ok":false,"w":"Osobnego etapu „rezultaty IT (Information Technology — technologie informacyjne)” w kaskadzie nie ma."},{"t":"Wytworem, istotną zmianą stanu lub poprawą zdolności","ok":true,"w":"Cele związane z informatyką opisują pożądane rezultaty IT (Information Technology — technologie informacyjne) wspierające cele organizacji. Zgodnie z hasłem „Cel IT” w słowniku COBIT 5 rezultatem może być wytwór, istotna zmiana stanu albo istotna poprawa zdolności. Rezultat nie jest osobnym poziomem Kaskady Celów między celami IT a celami aktywatorów."},{"t":"Inną nazwą celu organizacji","ok":false,"w":"Cele organizacji to wcześniejszy krok kaskady, a nie rezultaty IT (Information Technology — technologie informacyjne)."},{"t":"Wskaźnikiem wiodącym aktywatora","ok":false,"w":"Wskaźniki wiodące dotyczą cyklu życia i dobrych praktyk, nie definiują rezultatu."}],"fz":{"h":"Cele związane z informatyką a rezultaty IT","p":"P2","pulapka":true,"n":"EN: IT (Information Technology — technologie informacyjne)-related goals represent IT-related outcomes","q":"Jak cele związane z informatyką mają się do „rezultatów IT”?","a":"Cele związane z informatyką opisują pożądane rezultaty IT (Information Technology — technologie informacyjne) wspierające cele organizacji. Zgodnie z hasłem „Cel IT” w słowniku COBIT 5 rezultatem może być wytwór, istotna zmiana stanu albo istotna poprawa zdolności. Rezultat nie jest osobnym poziomem Kaskady Celów między celami IT a celami aktywatorów.","ex":"Cel szkoły: lepsze matury. Od pracowni potrzeba sprawnych komputerów na lekcjach. To zapisujesz jako cel pracowni, bez osobnego etapu.","org":""},"cyt":{"s":"92","t":"Wynikiem może być pozostałość, istotna zmiana stanu lub istotna poprawa potencjału.","w":"ZGODNE","u":"Hasło „Cel IT” w słowniku; podręcznik: „pozostałość” (fiszka: wytwór) i „potencjał” (fiszka: zdolność)."}},"fz-B-001":{"id":"fz-B-001","typ":"egzamin","s":"PR-01-04","t":"Do której domeny Zarządzania należą m.in. strategia, architektura korporacyjna, portfel, ryzyko i bezpieczeństwo?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 33"],"r":null,"zap":"","scen":"","o":[{"t":"APO – Dostosuj, Planuj i Organizuj","ok":true,"w":"Tak: APO to domena planowania (13 procesów), w tym strategia, architektura, portfel, ryzyko i bezpieczeństwo."},{"t":"BAI – Twórz, Nabywaj i Wdrażaj","ok":false,"w":"BAI obejmuje programy i projekty, wymagania, rozwiązania i zmiany, a nie strategię."},{"t":"DSS – Dostarczaj, Obsługuj i Wspieraj","ok":false,"w":"DSS to codzienność: eksploatacja, incydenty, problemy i ciągłość."},{"t":"EDM – Oszacuj, Kieruj i Monitoruj","ok":false,"w":"EDM to domena Ładu, a nie Zarządzania."}],"fz":{"h":"APO","p":"P2","pulapka":false,"n":"≠ TŁUMACZENIE · egzamin: Dostosuj, Planuj i Organizuj · podr.: Dopasowanie, planowanie i organizacja · EN: Align, Plan and Organise","q":"Co obejmuje domena APO? / Która domena: strategia, architektura, innowacje, portfel, budżet, HR, relacje, umowy, dostawcy, jakość, ryzyko, bezpieczeństwo?","a":"Domena Zarządzania (Planuj): 13 procesów, m.in. strategia, architektura, portfel, ryzyko, bezpieczeństwo.\nAPO (Dostosuj, Planuj i Organizuj), APO01–APO13; APO01 to zarządzanie strukturą ramową zarządzania IT.","ex":"Planowanie przed działaniem, jak przed remontem: pomysł, budżet, ekipa, umowy z fachowcami, co może pójść źle. Haczyk: APO – „A Plan Obmyśl”; 13 procesów, najwięcej ze wszystkich.\nWszystko, co robisz przed remontem: pomysł, projekt, budżet, ludzie, umowy, wybór fachowców, jakość, ryzyko i zamki w drzwiach. Planowanie = APO, 13 procesów.","org":"APO12 ocena ryzyka przerw usług."},"cyt":{"s":"33","t":"APO02 Zarządzanie strategią APO09 Zarządzanie umowami o świadczenie usług APO03 Zarządzanie architekturą korporacyjną APO10 Zarządzanie dostawcami APO04 Zarządzanie innowacjami APO11 Zarządzanie jakością APO05 Zarządzanie portfelem projektów APO12 Zarządzanie ryzykiem","w":"ZGODNE","u":"APO13 Zarządzanie bezpieczeństwem — ta sama ilustracja; podręcznik nazywa APO „Dopasowanie, planowanie i organizacja” (egzamin: Dostosuj, Planuj i Organizuj)."}},"fz-B-002":{"id":"fz-B-002","typ":"egzamin","s":"PR-01-04","t":"Ile procesów obejmuje domena BAI (Twórz, Nabywaj i Wdrażaj)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 33"],"r":null,"zap":"","scen":"","o":[{"t":"10","ok":true,"w":"Tak: BAI01–BAI10."},{"t":"13","ok":false,"w":"Tyle procesów ma APO, najliczniejsza domena."},{"t":"6","ok":false,"w":"Tyle procesów ma DSS."},{"t":"5","ok":false,"w":"Tyle procesów ma domena Ładu EDM."}],"fz":{"h":"BAI","p":"P2","pulapka":false,"n":"≠ TŁUMACZENIE · egzamin: Twórz, Nabywaj i Wdrażaj · podr.: Budowanie, nabywanie i wdrażanie · EN: Build, Acquire and Implement","q":"Co obejmuje domena BAI? / Która domena: programy i projekty, wymagania, rozwiązania, pojemność, zmiany, wiedza, aktywa, konfiguracja?","a":"Domena Zarządzania (Twórz): 10 procesów, m.in. programy i projekty, wymagania, rozwiązania, zmiany.\nBAI (Twórz, Nabywaj i Wdrażaj), BAI01–BAI10; m.in. BAI05 wdrażanie zmian organizacyjnych, BAI07 akceptacja zmian i przejście, BAI09 zarządzanie zasobami (aktywami).","ex":"Ekipa remontowa: według planu buduje albo kupuje nowe rzeczy i je wprowadza, np. nową kuchnię. Haczyk: BAI – „Buduj Albo Importuj”; 10 procesów.\nSam remont: prowadzisz roboty, spisujesz, czego chcesz, budujesz, wprowadzasz zmiany, odbierasz pracę i spisujesz, co masz w domu (aktywa = posiadane rzeczy). Budowa = BAI, 10 procesów.","org":"BAI03 rozbudowa systemu zgłoszeń."},"cyt":{"s":"33","t":"BAI01 Zarządzanie programami i projektami BAI08 Zarządzanie wiedzą BAI02 Zarządzanie definiowaniem wymagań BAI09 Zarządzanie zasobami BAI03 Zarządzanie identyfikacją i budowaniem rozwiązań BAI10 Zarządzanie konfiguracją","w":"ZGODNE","u":"Liczba 10 wynika z wyliczenia BAI01–BAI10 na Ilustracji 16; podręcznik: „Budowanie, nabywanie i wdrażanie”."}},"fz-B-003":{"id":"fz-B-003","typ":"egzamin","s":"PR-01-04","t":"Która domena obejmuje m.in. eksploatację, zgłoszenia i incydenty, problemy oraz ciągłość?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 33"],"r":null,"zap":"","scen":"","o":[{"t":"DSS – Dostarczaj, Obsługuj i Wspieraj","ok":true,"w":"Tak: DSS to codzienna obsługa, 6 procesów (DSS01–DSS06)."},{"t":"BAI – Twórz, Nabywaj i Wdrażaj","ok":false,"w":"BAI buduje lub nabywa rozwiązania i wdraża zmiany, a nie prowadzi bieżącej obsługi."},{"t":"MEA – Monitoruj, Oszacuj i Oceń","ok":false,"w":"MEA monitoruje wydajność, zgodność i kontrolę wewnętrzną."},{"t":"APO – Dostosuj, Planuj i Organizuj","ok":false,"w":"APO to planowanie: strategia, architektura, portfel, ryzyko."}],"fz":{"h":"DSS","p":"P2","pulapka":false,"n":"≠ TŁUMACZENIE · egzamin: Dostarczaj, Obsługuj i Wspieraj · podr.: Dostarczanie, obsługa i wsparcie · EN: Deliver, Service and Support","q":"Co obejmuje domena DSS? / Która domena: eksploatacja, zgłoszenia i incydenty, problemy, ciągłość, usługi bezpieczeństwa, kontrole procesów biznesowych?","a":"Domena Zarządzania (Wykonuj): 6 procesów, m.in. eksploatacja, incydenty, problemy, ciągłość.\nDSS (Dostarczaj, Obsługuj i Wspieraj), DSS01–DSS06.","ex":"Codzienność jak w warsztacie samochodowym: auta mają jeździć, a gdy coś się zepsuje – szybka naprawa, szukanie przyczyny, auto zastępcze. Haczyk: DSS – „Dzień w Dzień Serwis”; 6 procesów.\nŻycie w gotowym domu: codzienna obsługa, naprawa awarii, szukanie przyczyny przecieku, plan na wypadek pożaru, zamki i alarm. Codzienność = DSS, 6 procesów.","org":"DSS02 obsługa zgłoszeń i awarii."},"cyt":{"s":"33","t":"DSS01 Zarządzanie eksploatacją DSS02 Zarządzanie zgłoszeniami serwisowymi i incydentam DSS03 Zarządzanie problemami DSS04 Zarządzanie ciągłością","w":"ZGODNE","u":"Podręcznik: „Dostarczanie, obsługa i wsparcie”."}},"fz-B-004":{"id":"fz-B-004","typ":"egzamin","s":"PR-01-04","t":"Czego dotyczą trzy procesy domeny MEA (Monitoruj, Oszacuj i Oceń)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 32","FW-PL s. 33","Altkom — Różnice tłumaczenia PL, s. 1"],"r":null,"zap":"","scen":"","o":[{"t":"Wyników i zgodności, kontroli wewnętrznej oraz wymogów zewnętrznych","ok":true,"w":"MEA01: Monitorowanie, ocena i oszacowanie wydajności i zgodności — Monitor, Evaluate and Assess Performance and Conformance. MEA02: Monitorowanie, ocena i oszacowanie systemu kontroli wewnętrznej — Monitor, Evaluate and Assess the System of Internal Control. MEA03: Monitorowanie, ocena i oszacowanie zgodności z wymogami zewnętrznymi — Monitor, Evaluate and Assess Compliance With External Requirements. To trzy procesy domeny MEA (Monitor, Evaluate and Assess — Monitoruj, Oszacuj i Oceń) w Zarządzaniu."},{"t":"Oceny, kierowania i monitorowania kierunku wyznaczonego dla organizacji","ok":false,"w":"To działania Ładu w domenie EDM (Evaluate, Direct and Monitor — Oszacuj, Kieruj i Monitoruj)."},{"t":"Incydentów, problemów i ciągłości działania","ok":false,"w":"To procesy domeny DSS (Deliver, Service and Support — Dostarczaj, Obsługuj i Wspieraj)."},{"t":"Strategii, ryzyka i bezpieczeństwa","ok":false,"w":"To procesy domeny APO (Align, Plan and Organise — Dostosuj, Planuj i Organizuj)."}],"fz":{"h":"MEA","p":"P2","pulapka":false,"n":"MEA — Monitor, Evaluate and Assess — Monitoruj, Oszacuj i Oceń. Trzy procesy Zarządzania.","q":"Która domena: wydajność i zgodność, system kontroli wewnętrznej, zgodność z wymogami zewnętrznymi?","a":"MEA01: Monitorowanie, ocena i oszacowanie wydajności i zgodności — Monitor, Evaluate and Assess Performance and Conformance. MEA02: Monitorowanie, ocena i oszacowanie systemu kontroli wewnętrznej — Monitor, Evaluate and Assess the System of Internal Control. MEA03: Monitorowanie, ocena i oszacowanie zgodności z wymogami zewnętrznymi — Monitor, Evaluate and Assess Compliance With External Requirements. To trzy procesy domeny MEA (Monitor, Evaluate and Assess — Monitoruj, Oszacuj i Oceń) w Zarządzaniu.","ex":"Trzy kontrole jak u kierowcy: czy auto jedzie dobrze (wyniki), czy hamulce działają (kontrola wewnętrzna), czy są przegląd i OC (przepisy z zewnątrz). MEA (Monitor, Evaluate and Assess — Monitoruj, Oszacuj i Oceń), 3 procesy.","org":"MEA01 (Monitor, Evaluate and Assess Performance and Conformance — Monitorowanie, ocena i oszacowanie wydajności i zgodności) comiesięczny raport z liczbami."},"cyt":{"s":"33","t":"MEA01 Monitorowanie, ocena i oszacowanie wydajności i zgodności","w":"ZGODNE","u":"MEA02 (system kontroli wewnętrznej) i MEA03 (zgodność z wymogami zewnętrznymi) na tej samej ilustracji; podręcznik: „Monitorowanie, ocena i oszacowanie” (inna kolejność słów niż na egzaminie)."}},"fz-B-007":{"id":"fz-B-007","typ":"egzamin","s":"EN-02-10","t":"Czym różni się praktyka od działania w procesie COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 70"],"r":null,"zap":"","scen":"","o":[{"t":"Praktyka określa co, a działanie – jak","ok":true,"w":"Praktyka mówi, co trzeba robić, a działanie – jak to zrobić (jako propozycja); szczegóły można zaczerpnąć z innych standardów lub z dalszych publikacji COBIT 5 (FW-PL s. 70)."},{"t":"Praktyka określa jak, a działanie – co","ok":false,"w":"Odwrotnie: praktyka to CO, działanie to JAK."},{"t":"Działanie jest obowiązkowe, praktyka nie","ok":false,"w":"Działanie to propozycja, nie obowiązek."},{"t":"Praktyka i działanie to synonimy","ok":false,"w":"Podręcznik je rozróżnia: praktyki to ogólne wymogi (CO), a działania – wytyczne wdrożenia (JAK) (FW-PL s. 70)."}],"fz":{"h":"Praktyka, działanie, szczegółowe działanie","p":"P1","pulapka":true,"n":"egzamin: praktyka · działanie · podr.: praktyka · działanie · EN: practice · activity · detailed activity","q":"Czym się różnią?","a":"Praktyka: co trzeba robić w procesie. Działanie: jak to zrobić (propozycja, nie obowiązek). Szczegółowe działania można zaczerpnąć z innych standardów (ITIL, ISO/IEC 27000, PRINCE2) albo opracować w ramach rodziny produktów COBIT 5.","ex":"Jak w kuchni: praktyka mówi CO zrobić („upiecz ciasto”), działanie – JAK, krok po kroku, a dokładną recepturę bierzesz z książki kucharskiej, czyli innego standardu.","org":"praktyka DSS02.02 rejestrowanie zgłoszeń."},"cyt":{"s":"70","t":"Działania w ramach metodyki COBIT 5 określają sposób, powody oraz przedmiot wdrożenia dla poszczególnych praktyk nadzoru i zarządzania","w":"CZESCIOWO","u":"Podręcznik: praktyki = „kompletny zbiór ogólnych wymogów”, działania = wytyczne wdrożenia (sposób, powody i przedmiot), „nie mają charakteru normatywnego”; skrót „co / jak” to uproszczenie z sylabusa / przewodnika Procesy umożliwiające."}},"fz-B-009":{"id":"fz-B-009","typ":"egzamin","s":"EN-02-24","t":"Co opisuje przeznaczenie procesu (process purpose)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 33","FW-PL s. 69","FW-PL s. 43"],"r":null,"zap":"","scen":"","o":[{"t":"Konkretne wyniki procesu wraz z miernikami","ok":false,"w":"Konkretne pożądane wyniki to cele procesu. Przeznaczenie procesu opisuje ogólnie, po co proces istnieje i jakie są spodziewane rezultaty jego skutecznej realizacji."},{"t":"Ogólnie, po co proces istnieje i co daje","ok":true,"w":"Przeznaczenie procesu (podr. cel procesu) to ogólny cel: po co proces istnieje i jakie są spodziewane rezultaty jego skutecznej realizacji."},{"t":"Kto wykonuje i rozlicza zadania procesu","ok":false,"w":"To tabela RACI (Responsible, Accountable, Consulted, Informed — odpowiedzialny wykonawczo, odpowiedzialny decyzyjnie, konsultowany, informowany)."},{"t":"Kroki potrzebne do wdrożenia praktyki","ok":false,"w":"To działania procesu."}],"fz":{"h":"Przeznaczenie procesu","p":"P2","pulapka":true,"n":"≠ TŁUMACZENIE · egzamin: przeznaczenie procesu · podr.: cel procesu · EN: process purpose","q":"Co opisuje przeznaczenie procesu?","a":"Ogólny cel procesu: po co istnieje i jakie są spodziewane rezultaty jego skutecznej realizacji (podr. w rozdz. 8: cel procesu). Nie myl z celami procesu ze słownika – to konkretne pożądane wyniki z miernikami.","ex":"Jak tablica nad remizą: „Jesteśmy, by ratować ludzi i mienie” – po co istniejemy i co dajemy.","org":"DSS02: szybkie przywracanie usług i obsługa próśb."},"cyt":{"s":"43","t":"opis procesu zawiera jego cel i wyniki.","w":"BRAK_W_FW","u":"FW-PL nie definiuje „przeznaczenia procesu” (process purpose); definicja pochodzi z przewodnika Procesy umożliwiające / PAM. Uwaga: w słowniku FW-PL (s. 93) „Cel procesu” to process goal — „Deklaracja opisująca pożądany wynik procesu”, czyli nie przeznaczenie."}},"fz-B-010":{"id":"fz-B-010","typ":"egzamin","s":"PR-02-14","t":"Czym jest Zarządzanie według COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 14","FW-PL s. 31","Altkom — Różnice tłumaczenia PL, s. 1"],"r":null,"zap":"","scen":"","o":[{"t":"Planowaniem, budowaniem, wykonywaniem i monitorowaniem działań","ok":true,"w":"Zarządzanie (management) planuje, buduje, wykonuje i monitoruje działania zgodnie z kierunkiem wskazanym przez organ Ładu, aby osiągnąć cele organizacji. Zwykle odpowiada za nie kadra zarządzająca (executive management) pod przywództwem CEO (Chief Executive Officer — dyrektor generalny). To odmienna odpowiedzialność od Ładu sprawowanego przez board (organ Ładu; podr. zarząd) pod przewodnictwem chair (przewodniczący)."},{"t":"Oceną potrzeb, wyznaczaniem kierunku i monitorowaniem wyników","ok":false,"w":"To definicja Ładu."},{"t":"Sprawdzaniem, czy wyznaczony kierunek wcielono w życie","ok":false,"w":"To monitorowanie w domenie Ładu."},{"t":"Ustalaniem apetytu na ryzyko i pilnowaniem jego granic","ok":false,"w":"To EDM03 (Ensure Risk Optimisation — Zapewnienie optymalizacji ryzyka), proces Ładu."}],"fz":{"h":"Zarządzanie","p":"P1","pulapka":true,"n":"≠ TŁUMACZENIE · egzamin: Zarządzanie · podr.: zarządzanie · EN: management","q":"Jak brzmi definicja Zarządzania?","a":"Zarządzanie (management) planuje, buduje, wykonuje i monitoruje działania zgodnie z kierunkiem wskazanym przez organ Ładu, aby osiągnąć cele organizacji. Zwykle odpowiada za nie kadra zarządzająca (executive management) pod przywództwem CEO (Chief Executive Officer — dyrektor generalny). To odmienna odpowiedzialność od Ładu sprawowanego przez board (organ Ładu; podr. zarząd) pod przewodnictwem chair (przewodniczący).","ex":"Ekipa planuje dom, buduje go, zapewnia codzienne użytkowanie i utrzymanie, a potem sprawdza wyniki – tak, jak zdecydował inwestor (Ład). Run = bieżące działanie, nie tylko oddanie do użytku. Haczyk: PBRM (Plan, Build, Run and Monitor — Planuj, Wytwarzaj/Twórz, Wykonuj i Monitoruj) – Plan, Build, Run, Monitor.","org":"dyrektor IT (Information Technology — technologie informacyjne) i zespół wdrażają procedurę."},"cyt":{"s":"31","t":"Zarządzanie polega na planowaniu, budowaniu, realizacji i monitorowaniu działań w sposób spójny z kierunkiem wskazanym przez organ nadzorujący, aby osiągnąć cele przedsiębiorstwa.","w":"ZGODNE"}},"fz-B-011":{"id":"fz-B-011","typ":"egzamin","s":"PR-02-14","t":"Co według definicji COBIT 5 robi Ład?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 14","FW-PL s. 31","Altkom — Różnice tłumaczenia PL, s. 1"],"r":null,"zap":"","scen":"","o":[{"t":"Planuje, buduje, uruchamia i monitoruje działania","ok":false,"w":"To Zarządzanie (PBRM (Plan, Build, Run and Monitor — Planuj, Wytwarzaj/Twórz, Wykonuj i Monitoruj))."},{"t":"Na co dzień rozpoznaje, ocenia i ogranicza ryzyko IT","ok":false,"w":"To APO12 (Manage Risk — Zarządzanie ryzykiem), proces Zarządzania."},{"t":"Ocenia potrzeby, wyznacza kierunek i monitoruje wyniki","ok":true,"w":"Ład (governance; podr. nadzór) zapewnia ocenę potrzeb, warunków i opcji interesariuszy w celu ustalenia zrównoważonych, uzgodnionych celów organizacji. Wyznacza kierunek przez priorytety i decyzje oraz monitoruje wyniki i zgodność z uzgodnionym kierunkiem i celami. Zwykle odpowiada za niego organ Ładu — board (organ Ładu; podr. zarząd) pod przewodnictwem chair (przewodniczący). Podręcznik PL oddaje to jako „zarząd pod przywództwem prezesa”; nie należy z tego wyprowadzać uniwersalnego podziału prawnego polskich organów spółki. Zarządzanie należy zwykle do kadry zarządzającej pod przywództwem dyrektora generalnego."},{"t":"Buduje lub nabywa rozwiązania i wdraża zmiany","ok":false,"w":"To domena BAI (Build, Acquire and Implement — Twórz, Nabywaj i Wdrażaj) w Zarządzaniu."}],"fz":{"h":"Ład","p":"P1","pulapka":true,"n":"≠ TŁUMACZENIE · egzamin: Ład · podr.: nadzór · EN: governance","q":"Jak brzmi definicja Ładu?","a":"Ład (governance; podr. nadzór) zapewnia ocenę potrzeb, warunków i opcji interesariuszy w celu ustalenia zrównoważonych, uzgodnionych celów organizacji. Wyznacza kierunek przez priorytety i decyzje oraz monitoruje wyniki i zgodność z uzgodnionym kierunkiem i celami. Zwykle odpowiada za niego organ Ładu — board (organ Ładu; podr. zarząd) pod przewodnictwem chair (przewodniczący). Podręcznik PL oddaje to jako „zarząd pod przywództwem prezesa”; nie należy z tego wyprowadzać uniwersalnego podziału prawnego polskich organów spółki. Zarządzanie należy zwykle do kadry zarządzającej pod przywództwem dyrektora generalnego.","ex":"Trzy ruchy właściciela: wysłuchaj, czego chcą goście i wspólnicy (oceń), wybierz kierunek (kieruj), sprawdzaj, czy kuchnia go trzyma (monitoruj). Interesariusz = każdy, komu zależy.","org":"kierownictwo organizacji zatwierdza progi ryzyka."},"cyt":{"s":"89","t":"Nadzór zapewnia realizację celów przedsiębiorstwa dzięki ocenie potrzeb, warunków i opcji interesariuszy, określaniu kierunków poprzez nadanie priorytetów i podejmowanie decyzji oraz dzięki monitorowaniu sprawności, zgodności i postępów działań w odniesieniu do planów.","w":"ZGODNE","u":"Hasło „Rozliczalność za nadzór” w słowniku; ta sama treść w definicji nadzoru s. 14 i 31."}},"fz-B-012":{"id":"fz-B-012","typ":"egzamin","s":"PR-02-14","t":"Kto zwykle odpowiada za Ład?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 14"],"r":null,"zap":"","scen":"","o":[{"t":"Zarząd pod przywództwem prezesa (przewodniczącego)","ok":true,"w":"Tak: Ład sprawuje zarząd z prezesem."},{"t":"Kadra zarządzająca pod przywództwem CEO","ok":false,"w":"Ona odpowiada za Zarządzanie."},{"t":"Dyrektor IT ze swoim zespołem","ok":false,"w":"Dyrektor IT należy zwykle do kadry zarządzającej i realizuje działania Zarządzania (planowanie, budowanie, wykonywanie, monitorowanie); Ład sprawuje zarząd pod przywództwem prezesa (FW-PL s. 14)."},{"t":"Interesariusze zewnętrzni, np. organy regulacyjne","ok":false,"w":"Interesariusze zgłaszają potrzeby, ale Ład sprawuje zarząd."}],"fz":{"h":"Kto odpowiada za Ład i Zarządzanie","p":"P1","pulapka":false,"n":"EN: Board under the chair; executive management under the CEO","q":"Kto zwykle odpowiada za Ład, a kto za Zarządzanie?","a":"Ład: zarząd pod przywództwem prezesa (przewodniczącego). Zarządzanie: kadra zarządzająca pod przywództwem CEO.","ex":"Klub sportowy: zarząd z prezesem ustala, dokąd zmierza klub (Ład), a dyrektor z trenerami prowadzi drużynę na co dzień (Zarządzanie). CEO = dyrektor generalny.","org":""},"cyt":{"s":"14","t":"W większości przedsiębiorstw za nadzór odpowiada zarząd pod przywództwem prezesa.","w":"ZGODNE"}},"fz-B-013":{"id":"fz-B-013","typ":"egzamin","s":"PR-02-15","t":"Jak przebiega przepływ w kluczowych obszarach Ładu i Zarządzania?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 32"],"r":null,"zap":"","scen":"","o":[{"t":"Potrzeby biznesowe → Zarządzanie → Ład, który wykonuje zaplanowane działania","ok":false,"w":"Odwrotnie: Ład wyznacza kierunek, a Zarządzanie go realizuje."},{"t":"Ład → Zarządzanie, bez informacji zwrotnej","ok":false,"w":"Informacje zwrotne z Zarządzania wracają do Ładu; koło się zamyka."},{"t":"Zarządzanie → potrzeby biznesowe → Ład","ok":false,"w":"Przepływ zaczyna się od potrzeb biznesowych trafiających do Ładu."},{"t":"Potrzeby biznesowe → Ład → Zarządzanie → informacje zwrotne do Ładu","ok":true,"w":"Potrzeby biznesowe → Ład: Oszacuj, Kieruj, Monitoruj → Zarządzanie: Planuj (APO (Align, Plan and Organise — Dostosuj, Planuj i Organizuj)), Twórz (BAI (Build, Acquire and Implement — Twórz, Nabywaj i Wdrażaj)), Wykonuj (DSS (Deliver, Service and Support — Dostarczaj, Obsługuj i Wspieraj)), Monitoruj (MEA (Monitor, Evaluate and Assess — Monitoruj, Oszacuj i Oceń)) → informacje zwrotne z Zarządzania wracają do Ładu."}],"fz":{"h":"Przepływ Ład–Zarządzanie (Rysunek 15)","p":"P1","pulapka":false,"n":"EN: Key governance and management areas","q":"Opisz przepływ w kluczowych obszarach Ładu i Zarządzania (Rysunek 15).","a":"Potrzeby biznesowe → Ład: Oszacuj, Kieruj, Monitoruj → Zarządzanie: Planuj (APO (Align, Plan and Organise — Dostosuj, Planuj i Organizuj)), Twórz (BAI (Build, Acquire and Implement — Twórz, Nabywaj i Wdrażaj)), Wykonuj (DSS (Deliver, Service and Support — Dostarczaj, Obsługuj i Wspieraj)), Monitoruj (MEA (Monitor, Evaluate and Assess — Monitoruj, Oszacuj i Oceń)) → informacje zwrotne z Zarządzania wracają do Ładu.","ex":"Jak sztafeta: potrzeby firmy trafiają do zarządu, ten wskazuje kierunek, kierownicy planują, budują, prowadzą i sprawdzają, a raporty wracają do zarządu. Koło się zamyka.","org":""},"cyt":{"s":"32","t":"Potrzeby biznesowe Nadzór Ocena Kierowanie Informacje zwrotne dotyczące zarządzania Monitorowanie Zarządzanie Planowanie (APO) Budowanie (BAI) Uruchamianie (DSS) Monitorowanie (MEA)","w":"ZGODNE","u":"Informacja tylko w rysunku (Ilustracja 15); podręcznik: Budowanie/Uruchamianie zamiast Twórz/Wykonuj."}},"fz-B-014":{"id":"fz-B-014","typ":"egzamin","s":"PR-02-15","t":"Co oznacza „monitorowanie” w domenie Ładu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 32"],"r":null,"zap":"","scen":"","o":[{"t":"Sprawdzanie, czy Zarządzanie wcieliło w życie kierunek","ok":true,"w":"Działania, w których organ Ładu sprawdza, w jakim stopniu wyznaczony kierunek został wcielony w życie przez Zarządzanie."},{"t":"Comiesięczny raport z liczbami przygotowany w procesie MEA01","ok":false,"w":"To monitorowanie w Zarządzaniu (MEA (Monitor, Evaluate and Assess — Monitoruj, Oszacuj i Oceń)), nie w Ładzie."},{"t":"Monitorowanie i ocena całego systemu kontroli wewnętrznej","ok":false,"w":"To proces Zarządzania MEA02 (Monitor, Evaluate and Assess the System of Internal Control — Monitorowanie, ocena i oszacowanie systemu kontroli wewnętrznej)."},{"t":"Codzienna obsługa zgłoszeń i incydentów","ok":false,"w":"To DSS02 (Manage Service Requests and Incidents — Zarządzanie zgłoszeniami serwisowymi i incydentami), proces Zarządzania."}],"fz":{"h":"Monitorowanie w domenie Ładu","p":"P2","pulapka":false,"n":"EN: Monitor in governance domain","q":"Co oznacza „monitorowanie” w domenie Ładu?","a":"Działania, w których organ Ładu sprawdza, w jakim stopniu wyznaczony kierunek został wcielony w życie przez Zarządzanie.","ex":"Jak inwestor, który zagląda na budowę i sprawdza, czy ekipa robi to, co zlecił. Sam nie kładzie cegieł, tylko porównuje efekt z planem.","org":""},"cyt":{"s":"32","t":"W kontekście domeny nadzoru monitorowanie oznacza te działania, w ramach których organ nadzorujący sprawdza, w jakim stopniu określony kierunek wytyczony dla zarządzania został wcielony w życie.","w":"ZGODNE"}},"fz-B-015":{"id":"fz-B-015","typ":"egzamin","s":"PR-02-15","t":"Jak procesy i informacje łączą Ład z Zarządzaniem?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 31"],"r":null,"zap":"","scen":"","o":[{"t":"Wspólne procesy, bez potrzeby tabel RACI","ok":false,"w":"Model rozróżnia procesy Ładu i Zarządzania, a RACI (Responsible, Accountable, Consulted, Informed — Odpowiedzialny, Rozliczany, Konsultowany, Informowany) mówi, kto za co odpowiada."},{"t":"Odrębne procesy, RACI i wymiana informacji","ok":true,"w":"Procesy: model rozróżnia procesy Ładu i Zarządzania, a tabele RACI (Responsible, Accountable, Consulted, Informed — Odpowiedzialny, Rozliczany, Konsultowany, Informowany) wskazują, kto za co odpowiada. Informacje: procesy wymieniają informacje i produkty pracy na wejściach i wyjściach praktyk (np. dokumenty, raporty, dane, decyzje)."},{"t":"Jednokierunkowy przepływ informacji od Ładu","ok":false,"w":"Informacje płyną w obie strony: raporty wracają do Ładu."},{"t":"Przede wszystkim przykład dawany przez przywódców","ok":false,"w":"To opis interakcji przez kulturę i zachowanie, nie przez procesy i informacje."}],"fz":{"h":"Interakcje: procesy i informacje (Rysunek 14)","p":"P2","pulapka":false,"n":"EN: Interactions: processes, information","q":"Jak procesy i informacje łączą Ład z Zarządzaniem (Rysunek 14)?","a":"Procesy: model rozróżnia procesy Ładu i Zarządzania, a tabele RACI (Responsible, Accountable, Consulted, Informed — Odpowiedzialny, Rozliczany, Konsultowany, Informowany) wskazują, kto za co odpowiada. Informacje: procesy wymieniają informacje i produkty pracy na wejściach i wyjściach praktyk (np. dokumenty, raporty, dane, decyzje).","ex":"Szkoła: dyrekcja i nauczyciele mają osobne zadania, a tabela RACI (Responsible, Accountable, Consulted, Informed — Odpowiedzialny, Rozliczany, Konsultowany, Informowany) mówi, kto za co odpowiada. Łączy ich obieg informacji: plan lekcji i decyzje idą w dół, oceny i raporty wracają w górę.","org":""},"cyt":{"s":"31","t":"rozróżnia się procesy nadzoru i zarządzania, z uwzględnieniem konkretnych zbiorów praktyk i działań. Model procesu uwzględnia również tabele RACI","w":"ZGODNE","u":"Wymianę informacji opisuje kolejny wiersz Ilustracji 14 (Informacje) na tej samej stronie."}},"fz-B-016":{"id":"fz-B-016","typ":"egzamin","s":"PR-02-15","t":"Jak według COBIT 5 kształtuje się zachowanie w relacji Ład–Zarządzanie?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 31"],"r":null,"zap":"","scen":"","o":[{"t":"Oddolnie – pracownicy ustalają normy, a zarząd je przejmuje","ok":false,"w":"Rysunek 14 wskazuje odgórny przykład przywódców jako kluczową interakcję Ładu i Zarządzania przez kulturę i zachowanie. Nie jest to twierdzenie, że w rzeczywistości normy nigdy nie powstają oddolnie."},{"t":"Wyłącznie przez polityki, bez wpływu przywódców","ok":false,"w":"Polityki utrwalają decyzje Ładu, ale zachowanie kształtuje przykład przywódców."},{"t":"Przez tabelę RACI, która przypisuje zachowania","ok":false,"w":"RACI (Responsible, Accountable, Consulted, Informed — Odpowiedzialny, Rozliczany, Konsultowany, Informowany) przypisuje odpowiedzialność za praktyki, a nie kształtuje kultury."},{"t":"Odgórnie – przywódcy dają przykład","ok":true,"w":"Struktury należą do Ładu lub Zarządzania zależnie od składu i zakresu decyzji. Zasady i polityki zamieniają decyzje Ładu w stałe reguły. Zachowanie kształtuje się odgórnie: przywódcy dają przykład."}],"fz":{"h":"Interakcje: struktury, polityki, kultura","p":"P2","pulapka":false,"n":"EN: Interactions: structures, principles/policies, culture","q":"Jak struktury, polityki i kultura łączą Ład z Zarządzaniem?","a":"Struktury należą do Ładu lub Zarządzania zależnie od składu i zakresu decyzji. Zasady i polityki zamieniają decyzje Ładu w stałe reguły. Zachowanie kształtuje się odgórnie: przywódcy dają przykład.","ex":"Szkoła: rada pedagogiczna to struktura, regulamin utrwala decyzje dyrekcji, a uczniowie zachowują się tak, jak dyrektor daje przykład. Kultura płynie z góry.","org":""},"cyt":{"s":"31","t":"Jest ustalane odgórnie (przywództwo przez dawanie przykładu) i w związku z tym stanowi istotną interakcję między nadzorem i zarządzaniem.","w":"ZGODNE"}},"fz-B-017":{"id":"fz-B-017","typ":"egzamin","s":"PR-02-15","t":"Od czego zależy, czy struktura organizacyjna należy do Ładu, czy do Zarządzania?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 31"],"r":null,"zap":"","scen":"","o":[{"t":"Od składu struktury i zakresu podejmowanych przez nią decyzji","ok":true,"w":"Struktury należą do Ładu lub Zarządzania zależnie od składu i zakresu decyzji. Zasady i polityki zamieniają decyzje Ładu w stałe reguły. Zachowanie kształtuje się odgórnie: przywódcy dają przykład."},{"t":"Wszystkie struktury organizacyjne należą do Zarządzania","ok":false,"w":"Struktury mogą należeć do Ładu lub do Zarządzania."},{"t":"Od poziomu zdolności procesów, za które odpowiada","ok":false,"w":"Poziom zdolności dotyczy oceny procesów, a nie przynależności struktur."},{"t":"Od tego, czy jest wpisana jako C lub I w tabeli RACI","ok":false,"w":"Litery RACI (Responsible, Accountable, Consulted, Informed — Odpowiedzialny, Rozliczany, Konsultowany, Informowany) opisują udział w praktykach, a nie przynależność struktury."}],"fz":{"h":"Interakcje: struktury, polityki, kultura","p":"P2","pulapka":false,"n":"EN: Interactions: structures, principles/policies, culture","q":"Jak struktury, polityki i kultura łączą Ład z Zarządzaniem?","a":"Struktury należą do Ładu lub Zarządzania zależnie od składu i zakresu decyzji. Zasady i polityki zamieniają decyzje Ładu w stałe reguły. Zachowanie kształtuje się odgórnie: przywódcy dają przykład.","ex":"Szkoła: rada pedagogiczna to struktura, regulamin utrwala decyzje dyrekcji, a uczniowie zachowują się tak, jak dyrektor daje przykład. Kultura płynie z góry.","org":""},"cyt":{"s":"31","t":"struktury mogą należeć do przestrzeni nadzoru lub przestrzeni zarządzania, w zależności od ich składu i zakresu decyzji.","w":"ZGODNE"}},"fz-B-018":{"id":"fz-B-018","typ":"egzamin","s":"PR-02-15","t":"Jaką rolę w relacji Ład–Zarządzanie pełnią usługi, aplikacje i infrastruktura?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 31"],"r":null,"zap":"","scen":"","o":[{"t":"Wyznaczają kierunek przez priorytety i decyzje","ok":false,"w":"To zadanie organu Ładu, nie usług."},{"t":"Dostarczają informacji do oceny, kierowania i monitorowania","ok":true,"w":"Usługi, aplikacje i infrastruktura dostarczają organowi Ładu informacji do oceny, kierowania i monitorowania."},{"t":"Służą wyłącznie Zarządzaniu i nie mają związku z Ładem","ok":false,"w":"Usługi, aplikacje i infrastruktura wspierają także Ład: dostarczają organowi Ładu informacji do oceny, kierowania i monitorowania. Ich rola nie ogranicza się do Zarządzania."},{"t":"Określają, kto jest R, A, C i I w praktykach","ok":false,"w":"To rola tabel RACI (Responsible, Accountable, Consulted, Informed — Odpowiedzialny, Rozliczany, Konsultowany, Informowany)."}],"fz":{"h":"Interakcje: ludzie i usługi","p":"P2","pulapka":false,"n":"EN: Interactions: people, services","q":"Jak ludzie i usługi łączą Ład z Zarządzaniem?","a":"Ludzie: obie role wymagają innych umiejętności, ale kluczowe jest rozumienie obu zadań i różnic. Usługi, aplikacje i infrastruktura dostarczają organowi Ładu informacji do oceny, kierowania i monitorowania.","ex":"Szpital: dyrektor i chirurg potrzebują innych umiejętności, ale każdy musi rozumieć pracę drugiego. A system z wynikami leczenia daje dyrektorowi dane do decyzji.","org":""},"cyt":{"s":"31","t":"Wymagane są usługi, wspierane przez aplikacje i infrastrukturę, zapewniające organowi nadzorującemu odpowiednie informacje i ułatwiające realizację działań w zakresie nadzoru, które polegają na ocenie, określaniu kierunku i monitorowaniu.","w":"ZGODNE"}},"fz-B-019":{"id":"fz-B-019","typ":"egzamin","s":"PR-01-03,PR-01-04","t":"Która para „kod domeny – nazwa egzaminacyjna” jest poprawna?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 32"],"r":null,"zap":"","scen":"","o":[{"t":"DSS – Dostosuj, Planuj i Organizuj","ok":false,"w":"To nazwa APO; DSS to Dostarczaj, Obsługuj i Wspieraj."},{"t":"BAI – Monitoruj, Oszacuj i Oceń","ok":false,"w":"To nazwa MEA; BAI to Twórz, Nabywaj i Wdrażaj."},{"t":"MEA – Monitoruj, Oszacuj i Oceń","ok":true,"w":"Tak: to egzaminacyjna nazwa MEA."},{"t":"APO – Oszacuj, Kieruj i Monitoruj","ok":false,"w":"To nazwa EDM; APO to Dostosuj, Planuj i Organizuj."}],"fz":{"h":"Pięć domen PRM (nazwy egzaminacyjne)","p":"P1","pulapka":false,"n":"EN: Evaluate, Direct and Monitor; Align, Plan and Organise; Build, Acquire and Implement; Deliver, Service and Support; Monitor, Evaluate and Assess","q":"Podaj nazwy pięciu domen (nazwy egzaminacyjne).","a":"EDM – Oszacuj, Kieruj i Monitoruj; APO – Dostosuj, Planuj i Organizuj; BAI – Twórz, Nabywaj i Wdrażaj; DSS – Dostarczaj, Obsługuj i Wspieraj; MEA – Monitoruj, Oszacuj i Oceń.","ex":"Kolejność jak w życiu: szef ocenia (EDM), potem plan (APO), budowa (BAI), codzienna obsługa (DSS), kontrola (MEA). Haczyk na kolejność liter: Ela, Ania, Basia, Dorota, Monika.","org":""},"cyt":{"s":"32","t":"Monitorowanie, ocena i oszacowanie (MEA)","w":"ZGODNE","u":"Różnica terminologiczna: egzamin „Monitoruj, Oszacuj i Oceń”, podręcznik „Monitorowanie, ocena i oszacowanie”."}},"fz-B-020":{"id":"fz-B-020","typ":"egzamin","s":"PR-01-03","t":"Który z poniższych NIE jest procesem domeny EDM?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 33","Enabling Processes — EDM01, s. 27"],"r":null,"zap":"","scen":"","o":[{"t":"Zarządzanie ryzykiem","ok":true,"w":"Zarządzanie ryzykiem to APO12 — Manage Risk, proces Zarządzania. W domenie Ładu jest EDM03 — Ensure Risk Optimisation, Zapewnienie optymalizacji ryzyka. Różnica dotyczy odpowiedzialności: bieżące zarządzanie ryzykiem a ocena, kierowanie i monitorowanie jego optymalizacji."},{"t":"Zapewnienie realizacji korzyści","ok":false,"w":"To EDM02 (Ensure Benefits Delivery — Zapewnienie realizacji korzyści)."},{"t":"Zapewnienie optymalizacji zasobów","ok":false,"w":"To EDM04 (Ensure Resource Optimisation — Zapewnienie optymalizacji zasobów)."},{"t":"Zapewnienie transparentności interesariuszy","ok":false,"w":"To EDM05 (Ensure Stakeholder Transparency — Zapewnienie transparentności interesariuszy)."}],"fz":{"h":"Pięć procesów EDM","p":"P1","pulapka":false,"n":"EDM — Evaluate, Direct and Monitor — Oszacuj, Kieruj i Monitoruj. 5 procesów.","q":"Podaj pięć procesów domeny EDM.","a":"EDM01 — Zapewnienie ustanowienia i utrzymania struktury ramowej Ładu (Ensure Governance Framework Setting and Maintenance); EDM02 — Zapewnienie realizacji korzyści (Ensure Benefits Delivery); EDM03 — Zapewnienie optymalizacji ryzyka (Ensure Risk Optimisation); EDM04 — Zapewnienie optymalizacji zasobów (Ensure Resource Optimisation); EDM05 — Zapewnienie transparentności interesariuszy (Ensure Stakeholder Transparency). Podręcznik skraca nazwę EDM01 do „Zapewnienie i utrzymanie ładu korporacyjnego”; pełna nazwa dotyczy ustanowienia i utrzymania struktury ramowej Ładu.","ex":"Pięć trosk właściciela: 01 reguły gry, 02 czy się opłaca, 03 czy nie za ryzykownie, 04 czy starczy ludzi i pieniędzy, 05 czy wszyscy zainteresowani wiedzą, co się dzieje.","org":""},"cyt":{"s":"33","t":"EDM01 Zapewnienie i utrzymanie ładu korporacyjnego EDM02 Zapewnienie realizacji korzyści EDM03 Zapewnienie optymalizacji ryzyka EDM04 Zapewnienie optymalizacji zasobów EDM05 Zapewnienie przejrzystości dotyczącej interesariuszy","w":"ZGODNE","u":"„APO12 Zarządzanie ryzykiem” jest na tej samej stronie w domenie APO."}},"fz-B-021":{"id":"fz-B-021","typ":"egzamin","s":"PR-01-03,PR-01-04","t":"Które stwierdzenie o normatywności modelu procesów COBIT 5 jest prawdziwe?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 32"],"r":null,"zap":"","scen":"","o":[{"t":"Każda organizacja musi wdrożyć wszystkie 37 procesów","ok":false,"w":"Model nie jest normatywny; mniejsza organizacja może mieć mniej procesów."},{"t":"Obowiązkowe są wyłącznie procesy domeny EDM","ok":false,"w":"Żadna część modelu nie jest normatywna."},{"t":"Pomija część IT i trzeba go uzupełniać","ok":false,"w":"Model jest kompletny, a procesy Zarządzania razem obejmują całe IT (Information Technology — technologie informacyjne)."},{"t":"Organizacja może inaczej ułożyć swoje procesy","ok":true,"w":"Model referencyjny jest kompletny i kompleksowy, lecz nie jest jedynym dopuszczalnym modelem. Organizacja definiuje własny zestaw procesów stosownie do swojej działalności, tak aby obejmowały wszystkie konieczne dla niej cele Ładu i Zarządzania. Mniejsza organizacja może mieć mniej procesów niż katalog 37. Nie oznacza to pomijania koniecznych celów ani obowiązku wdrażania wszystkich procesów jeden do jednego."}],"fz":{"h":"Czy model procesów jest normatywny","p":"P2","pulapka":false,"n":"EN: Not prescriptive","q":"Czy model procesów COBIT 5 jest normatywny?","a":"Model referencyjny jest kompletny i kompleksowy, lecz nie jest jedynym dopuszczalnym modelem. Organizacja definiuje własny zestaw procesów stosownie do swojej działalności, tak aby obejmowały wszystkie konieczne dla niej cele Ładu i Zarządzania. Mniejsza organizacja może mieć mniej procesów niż katalog 37. Nie oznacza to pomijania koniecznych celów ani obowiązku wdrażania wszystkich procesów jeden do jednego.","ex":"Normatywny = obowiązkowy jeden do jednego. COBIT daje pełne menu, ale mała kawiarnia może podać mniej dań, byle wszyscy goście (cele) zostali obsłużeni.","org":""},"cyt":{"s":"32","t":"Przedsiębiorstwo może organizować swoje procesy w sposób, który uznaje za odpowiedni, o ile obejmują one wszystkie konieczne cele w zakresie nadzoru i zarządzania.","w":"ZGODNE"}},"fz-B-022":{"id":"fz-B-022","typ":"egzamin","s":"PR-01-03","t":"Jakie praktyki zdefiniowano w każdym z pięciu procesów Ładu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 32"],"r":null,"zap":"","scen":"","o":[{"t":"Planuj, Twórz, Wykonuj i Monitoruj","ok":false,"w":"To obszary działań Zarządzania (PBRM (Plan, Build, Run and Monitor — Planuj, Wytwarzaj/Twórz, Wykonuj i Monitoruj))."},{"t":"Oszacuj, Kieruj i Monitoruj (EDM)","ok":true,"w":"Praktyki Oszacuj, Kieruj i Monitoruj (EDM (Evaluate, Direct and Monitor — Oszacuj, Kieruj i Monitoruj)) – w każdym z pięciu procesów Ładu."},{"t":"Odpowiedzialny, Rozliczany, Konsultowany, Informowany","ok":false,"w":"To role w tabeli RACI (Responsible, Accountable, Consulted, Informed — Odpowiedzialny, Rozliczany, Konsultowany, Informowany), nie praktyki."},{"t":"Planowanie, projektowanie, budowanie, użytkowanie, ocena, aktualizacja","ok":false,"w":"To cykl życia aktywatora."}],"fz":{"h":"Praktyki w procesach Ładu","p":"P2","pulapka":false,"n":"EN: EDM (Evaluate, Direct and Monitor — Oszacuj, Kieruj i Monitoruj) practices within each governance process","q":"Jakie praktyki zdefiniowano w każdym procesie Ładu?","a":"Praktyki Oszacuj, Kieruj i Monitoruj (EDM (Evaluate, Direct and Monitor — Oszacuj, Kieruj i Monitoruj)) – w każdym z pięciu procesów Ładu.","ex":"Każdy z pięciu procesów Ładu powtarza ten sam trójkrok właściciela: oceń, wskaż kierunek, sprawdź. Haczyk: EDM (Evaluate, Direct and Monitor — Oszacuj, Kieruj i Monitoruj) w każdym EDM.","org":""},"cyt":{"s":"32","t":"Nadzór — obejmuje pięć procesów nadzoru; w ramach każdego procesu zdefiniowano praktyki w zakresie oceny, kierowania i monitorowania (EDM)","w":"ZGODNE","u":"Podręcznik: ocena (Oszacuj), kierowanie, monitorowanie."}},"fz-B-023":{"id":"fz-B-023","typ":"egzamin","s":"PR-02-14","t":"Czym przede wszystkim różnią się procesy Ładu od procesów Zarządzania?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 71"],"r":null,"zap":"","scen":"","o":[{"t":"Celami, do których dążą te procesy","ok":true,"w":"Procesy Ładu i Zarządzania różnią się celami: Ład dąży do celów interesariuszy (wartość, optymalizacja ryzyka i zasobów), a Zarządzanie w obszarach PBRM obejmuje całe IT (FW-PL s. 71)."},{"t":"Brakiem praktyk w procesach Ładu","ok":false,"w":"Każdy proces Ładu ma praktyki EDM."},{"t":"Brakiem tabel RACI w procesach Zarządzania","ok":false,"w":"Każdy proces COBIT 5 ma RACI."},{"t":"Obowiązkowością tylko procesów Ładu","ok":false,"w":"Model procesów w ogóle nie jest normatywny."}],"fz":{"h":"Procesy Ładu a procesy Zarządzania","p":"P1","pulapka":true,"n":"EN: Governance vs management processes","q":"Czym różnią się procesy Ładu od procesów Zarządzania?","a":"Celami. Ład: cele interesariuszy – dostarczanie wartości, optymalizacja ryzyka i zasobów (przez ocenę, kierowanie, monitorowanie). Zarządzanie: obszary PBRM, które razem obejmują całe IT.","ex":"Ład pilnuje, by firma dawała wartość bez zbędnego ryzyka i marnowania pieniędzy i ludzi. Zarządzanie obejmuje całą robotę z IT: plan, budowę, obsługę i kontrolę.","org":""},"cyt":{"s":"71","t":"należy zauważyć, że różnica między typami procesów tkwi w celach procesów","w":"ZGODNE"}},"fz-B-025":{"id":"fz-B-025","typ":"egzamin","s":"EN-02-08","t":"Czym może być cel procesu (opis pożądanego wyniku)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 69"],"r":null,"zap":"","scen":"","o":[{"t":"Ogólnym uzasadnieniem istnienia procesu","ok":false,"w":"Ogólny powód istnienia procesu to jego przeznaczenie. Cel procesu opisuje konkretny pożądany wynik (podręcznik, s.69)."},{"t":"Krokami potrzebnymi do wdrożenia praktyki","ok":false,"w":"Kroki wdrożenia praktyki to działania procesu, a nie jego pożądany wynik (s.70)."},{"t":"Jednostką pomiaru realizacji celu procesu","ok":false,"w":"Jednostką pomiaru jest miernik, który pozwala ocenić stopień osiągnięcia celu; nie jest samym celem (s.69)."},{"t":"Wytworem, zmianą stanu lub poprawą zdolności","ok":true,"w":"Cel procesu opisuje pożądany wynik: wytwór, np. dokument, istotną zmianę stanu albo istotną poprawę zdolności innych procesów (s.69)."}],"fz":{"h":"Cel procesu","p":"P2","pulapka":true,"n":"EN: Process goal","q":"Jak definiuje się cel procesu?","a":"Opis pożądanego wyniku procesu: wytwór (podr. pozostałość, artefakt, np. dokument), istotna zmiana stanu lub istotna poprawa zdolności innych procesów.","ex":"Po czym poznasz, że proces się udał: powstała rzecz (np. gotowy raport), coś wyraźnie się zmieniło (kran już nie cieknie) albo inne procesy działają lepiej.","org":""},"cyt":{"s":"69","t":"Wynikiem może być pozostałość, istotna zmiana stanu lub istotna poprawa potencjału innych procesów","w":"ZGODNE","u":"Podręcznik: „pozostałość” (wytwór), „potencjał” (zdolność)."}},"fz-B-026":{"id":"fz-B-026"
