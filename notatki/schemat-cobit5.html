tyk: aktualizacja, informowanie o zmianach, łatwy dostęp do najnowszej wersji, archiwizacja i pozbywanie się starych.","scen":"","o":[{"t":"Mechanizmy świadomości aktualizacji i dostępu do nowej wersji","ok":true,"w":"Podręcznik wskazuje aktualność polityk jako kluczowy aspekt: czy wdrożono mechanizmy zwiększające świadomość aktualizacji, łatwy dostęp do najnowszej wersji oraz archiwizację i pozbywanie się nieaktualnych wersji (FW-PL s. 68)."},{"t":"Opisanie konsekwencji nieprzestrzegania polityki","ok":false,"w":"Konsekwencje nieprzestrzegania to element struktury polityk; nie zapewniają, że pracownicy znają nową wersję (FW-PL s. 68)."},{"t":"Dopasowanie polityki do apetytu na ryzyko","ok":false,"w":"Dopasowanie do apetytu na ryzyko dotyczy treści polityki, a nie tego, czy pracownicy znają jej aktualną wersję (FW-PL s. 68)."},{"t":"Nieinwazyjność i logiczność polityki","ok":false,"w":"Nieinwazyjność to cecha dobrej polityki: ma być logiczna i nie budzić oporu. Nie rozwiązuje problemu nieznanej aktualizacji (FW-PL s. 67)."}],"przyklad":"Sytuacja: Polityka haseł została zmieniona, ale pracownicy o tym nie wiedzą i nadal stosują starą wersję – organizacja zawiodła na mechanizmach informowania o aktualizacji. Szkoła zmieniła plan lekcji, ale wywiesiła go w szufladzie dyrektora – uczniowie przyszli według starego. HACZYK: nowa wersja musi dotrzeć do ludzi, a stara – zniknąć z obiegu.","cyt":{"s":"68","t":"czy wdrożono efektywne mechanizmy zwiększające świadomość tych aktualizacji wśród pracowników, zapewniające łatwy dostęp do najnowszej wersji","w":"ZGODNE"}},"q-pc-gap-12":{"id":"q-pc-gap-12","typ":"egzamin","s":"EN-02-09","t":"Które etapy cyklu życia procesu obejmują sprawdzenie mierników i zmianę zbędnych kroków?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 70"],"r":null,"zap":"Cykl życia procesu: definiowanie → tworzenie → obsługa → monitorowanie → dostosowanie/aktualizacja lub wycofanie.","scen":"","o":[{"t":"Definiowanie i tworzenie","ok":false,"w":"Definiowanie i tworzenie to początek cyklu życia, a tu proces już działa (FW-PL s. 70)."},{"t":"Obsługa i wycofanie","ok":false,"w":"Procesu nie wycofano, tylko go zmieniono (FW-PL s. 70)."},{"t":"Monitorowanie i dostosowanie/aktualizacja","ok":true,"w":"Sprawdzanie mierników to monitorowanie, a zmiana zbędnych kroków to dostosowanie/aktualizacja. Pełny cykl: definiowanie, tworzenie, obsługa, monitorowanie oraz dostosowanie/aktualizacja lub wycofanie (FW-PL s. 70)."},{"t":"Tworzenie i ponowne definiowanie od zera","ok":false,"w":"Proces poprawiono, a nie zbudowano od nowa (FW-PL s. 70)."}],"przyklad":"Sytuacja: Proces obsługi zgłoszeń działa od roku. Kierownik sprawdza mierniki i stwierdza, że część kroków jest zbędna, więc je zmienia. Rodzina ustala grafik sprzątania (definiowanie), wiesza go na lodówce (tworzenie), sprząta według niego (obsługa), po miesiącu patrzy, co nie działa (monitorowanie), i go poprawia (dostosowanie). HACZYK: sprawdzanie = monitorowanie, poprawianie = dostosowanie.","cyt":{"s":"70","t":"Jest on definiowany, tworzony, obsługiwany, monitorowany oraz dostosowywany/aktualizowany lub wycofywany.","w":"ZGODNE"}},"q-pc-gap-13":{"id":"q-pc-gap-13","typ":"egzamin","s":"EN-02-19","t":"Które zastosowanie modelu informacji obejmuje analizę miejsca przechowywania, dostępu i retencji informacji?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 84","FW-PL s. 85"],"r":null,"zap":"Trzy zastosowania modelu informacji z przykładów: specyfikacja (nowa aplikacja), wymagana ochrona (zespół bezpieczeństwa), łatwość korzystania z danych (przegląd procesu).","scen":"","o":[{"t":"Określenie specyfikacji informacji","ok":false,"w":"Specyfikację określa się przy projektowaniu nowej aplikacji (Przykład 13) (FW-PL s. 84)."},{"t":"Określenie łatwości korzystania z danych","ok":false,"w":"Łatwość korzystania sprawdza się przy przeglądzie informacji w procesie biznesowym lub aplikacji (Przykład 15) (FW-PL s. 84)."},{"t":"Opracowanie przypadków testowych","ok":false,"w":"Przypadki testowe to dodatkowe zastosowanie wspomniane przy specyfikacji (Przykład 13), a nie analiza zespołu bezpieczeństwa (FW-PL s. 84)."},{"t":"Określenie wymaganej ochrony informacji","ok":true,"w":"Przykład 14: zespoły bezpieczeństwa analizują warstwę fizyczną, empiryczną, semantyczną i pragmatyczną, by określić poziom ochrony i wymagane zabezpieczenia (FW-PL s. 84)."}],"przyklad":"Sytuacja: Zespół bezpieczeństwa analizuje, gdzie fizycznie przechowuje się informacje, jakie są kanały dostępu do nich i jak długo trzeba je przechowywać, korzystając z atrybutów modelu informacji. Przed schowaniem dokumentów pytasz: w której szafie leżą, kto ma do niej klucz i jak długo trzeba je trzymać. Na tej podstawie dobierasz zamek. HACZYK: pytania „gdzie, kto ma dostęp, jak długo” prowadzą do ochrony informacji.","cyt":{"s":"84","t":"Za pomocą tych atrybutów użytkownik może określić poziom ochrony danych i wymagane mechanizmy zabezpieczające.","w":"ZGODNE","u":"Przykład 14 (warstwa fizyczna: gdzie przechowuje się informacje; empiryczna: kanały dostępu; pragmatyczna: wymogi przechowywania)."}},"q-pc-gap-14":{"id":"q-pc-gap-14","typ":"egzamin","s":"PR-02-10","t":"Co pełni rolę filtra zawartości dla bazy wiedzy COBIT 5?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 25"],"r":null,"zap":"Ilustracja 10: źródła (wytyczne ISACA, nowe materiały, inne standardy) → baza wiedzy → filtr: czynniki umożliwiające → rodzina produktów COBIT 5.","scen":"","o":[{"t":"Rodzina produktów COBIT 5","ok":false,"w":"Rodzina produktów to wynik: przewodniki zbudowane na bazie wiedzy, a nie filtr (FW-PL s. 25)."},{"t":"Aktywatory COBIT 5","ok":true,"w":"Aktywatory (w podręczniku: czynniki umożliwiające) są filtrem zawartości dla bazy wiedzy COBIT 5; porządkują istniejące i przyszłe treści (FW-PL s. 25, Ilustracja 10)."},{"t":"Inne standardy i struktury ramowe","ok":false,"w":"Inne standardy i struktury ramowe (metodyki) to jedno ze źródeł wiedzy, które COBIT 5 integruje (FW-PL s. 25)."},{"t":"Pięć zasad COBIT 5","ok":false,"w":"Zasady nie są przedstawione na Ilustracji 10 jako filtr zawartości (FW-PL s. 25)."}],"przyklad":"Biblioteka zbiera książki z wielu wydawnictw (źródła), układa je w magazynie (baza wiedzy) i porządkuje według działów (filtr), a czytelnik dostaje gotowe zestawienia (produkty). HACZYK: filtrem są czynniki umożliwiające.","cyt":{"s":"25","t":"Czynniki umożliwiające COBIT 5 Filtr zawartości dla bazy wiedzy","w":"ZGODNE","u":"Tylko tekst Ilustracji 10."}},"q-pc-gap-16":{"id":"q-pc-gap-16","typ":"egzamin","s":"EN-02-13","t":"Za co odpowiada funkcja Zgodność?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 76","FW-PL s. 77"],"r":null,"zap":"Zgodność = wytyczne co do prawa, regulacji i umów. Audyt = audyty wewnętrzne. Prywatność = osobny dyrektor.","scen":"","o":[{"t":"Za przeprowadzanie audytów wewnętrznych","ok":false,"w":"To funkcja Audyt (FW-PL s. 76)."},{"t":"Za wytyczne o wymogach prawnych, regulacyjnych i umownych","ok":true,"w":"Funkcja Zgodność daje wytyczne dotyczące zgodności z wymogami prawnymi, regulacyjnymi i wynikającymi z umów (FW-PL s. 76, Rysunek 33)."},{"t":"Za monitorowanie ryzyka przepisów o prywatności","ok":false,"w":"To dyrektor ds. prywatności (FW-PL s. 77)."},{"t":"Za zgodność strategii IT ze strategią biznesową","ok":false,"w":"Dopasowanie strategii IT do strategii biznesowej to zadanie CIO (FW-PL s. 76)."}],"przyklad":"W klubie sportowym jedna osoba pilnuje, żeby klub znał przepisy ligi i warunki umów ze sponsorami (Zgodność), a kontroler sprawdza potem, czy ich przestrzegano (Audyt). HACZYK: Zgodność doradza, Audyt sprawdza.","cyt":{"s":"76","t":"Zgodność Funkcja w przedsiębiorstwie odpowiedzialna za wytyczne dotyczące zgodności z wymogami prawnymi, regulacyjnymi i wynikającymi z umów.","w":"ZGODNE"}},"q-pc-deep-01":{"id":"q-pc-deep-01","typ":"egzamin","s":"EN-02-04","t":"Na które pytania o aktualność polityk COBIT 5 każe zwrócić szczególną uwagę w cyklu życia? Wskaż odpowiedź, która do nich NIE należy.","k":false,"st":"autorskie","src":"","z":["FW-PL s. 68"],"r":null,"zap":"Aktualność polityk = 4 pytania: czy i kiedy aktualizować, jak informować o zmianach, jak dać dostęp do najnowszej wersji, jak archiwizować i usuwać stare.","scen":"","o":[{"t":"Czy i kiedy aktualizuje się polityki?","ok":false,"w":"To pierwsze z pytań o aktualność polityk w cyklu życia (FW-PL s. 68)."},{"t":"Czy pracownicy mają łatwy dostęp do najnowszej wersji polityki?","ok":false,"w":"Łatwy dostęp do najnowszej wersji jest wymieniony wśród kluczowych aspektów aktualności (FW-PL s. 68)."},{"t":"Czy polityka jest nieinwazyjna, czyli nie budzi niepotrzebnego oporu?","ok":true,"w":"Nieinwazyjność to cecha dobrej polityki (obok skuteczności i wydajności), a nie pytanie o jej aktualność w cyklu życia (FW-PL s. 67)."},{"t":"Czy nieaktualne wersje są właściwie archiwizowane i usuwane?","ok":false,"w":"Archiwizacja i pozbywanie się nieaktualnych informacji zamykają listę pytań o aktualność (FW-PL s. 68)."}],"przyklad":"Rozkład jazdy autobusów: trzeba go zmienić, gdy zmienia się trasa, ogłosić zmianę, wywiesić nowy na przystanku i zdjąć stary. HACZYK: cechy dobrej polityki (skuteczna, wydajna, nieinwazyjna) to inna lista niż pytania o aktualność.","cyt":{"s":"68","t":"Kluczowym aspektem metodyk i polityk, na który należy zwrócić szczególną uwagę, jest aktualność polityk: czy i kiedy aktualizuje się polityki, czy wdrożono efektywne mechanizmy zwiększające świadomość tych aktualizacji wśród pracowników, zapewniające łatwy dostęp do najnowszej wersji","w":"ZGODNE","u":"Nieinwazyjność to cecha dobrych polityk z s. 67 (FW: „nieingerencyjne”), nie pytanie o aktualność."}},"q-pc-deep-02":{"id":"q-pc-deep-02","typ":"egzamin","s":"EN-02-04","t":"Co wynika dla polityk z różnego stopnia regulacji sektora, w którym działa organizacja?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 68"],"r":null,"zap":"Im silniejsze wymogi regulacyjne wobec kontroli wewnętrznej, tym solidniejsza musi być struktura polityk.","scen":"","o":[{"t":"Słabo regulowane organizacje nie potrzebują polityk","ok":false,"w":"Każde przedsiębiorstwo komunikuje swoje reguły przez zasady i polityki; różnica dotyczy siły struktury, a nie samej potrzeby polityk (FW-PL s. 67–68)."},{"t":"Każda organizacja ma mieć identyczny zestaw polityk","ok":false,"w":"COBIT 5 nie narzuca jednego zestawu polityk; ich struktura zależy od otoczenia przedsiębiorstwa (FW-PL s. 68)."},{"t":"W sektorze regulowanym polityki nie mają cyklu życia","ok":false,"w":"Polityki zawsze mają cykl życia; regulacje wpływają na to, jak silnej kontroli wewnętrznej i struktury polityk się wymaga (FW-PL s. 68)."},{"t":"Silniejsze regulacje wymagają solidniejszej struktury polityk","ok":true,"w":"Podręcznik wskazuje, że w zależności od środowiska zewnętrznego mogą istnieć różne stopnie wymogów regulacyjnych wobec silnej kontroli wewnętrznej, a co za tym idzie – solidnej struktury polityk (FW-PL s. 68)."}],"przyklad":"Sytuacja: Bank działa w silnie regulowanym sektorze, a mała fundacja – w słabo regulowanym. Szpital musi mieć spisane procedury na każdą sytuację, bo kontroluje go wiele instytucji; klub szachowy wystarczy, że ma krótki regulamin. HACZYK: otoczenie decyduje o sile struktury polityk, a nie o tym, czy polityki w ogóle są potrzebne.","cyt":{"s":"68","t":"W zależności od środowiska zewnętrznego, w którym funkcjonuje przedsiębiorstwo, mogą istnieć różne stopnie wymogów regulacyjnych wobec silnej kontroli wewnętrznej, a co za tym idzie – solidnej struktury polityk.","w":"ZGODNE"}},"q-pc-deep-03":{"id":"q-pc-deep-03","typ":"egzamin","s":"EN-02-04","t":"Który etap cyklu życia polityki polega na sprawdzaniu, czy polityka działa i jest przestrzegana?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 67","FW-PL s. 68"],"r":null,"zap":"Cykl życia polityki (Ilustracja 28): planowanie → projektowanie → budowanie/tworzenie/wdrażanie → użytkowanie/eksploatacja → ocena/monitorowanie → aktualizacja/pozbywanie się.","scen":"","o":[{"t":"Planowanie","ok":false,"w":"Planowanie jest na początku cyklu, zanim polityka powstanie (FW-PL s. 67)."},{"t":"Ocena/monitorowanie","ok":true,"w":"Sprawdzanie, czy obowiązująca polityka działa i jest przestrzegana, to etap oceny/monitorowania z Ilustracji 28 (FW-PL s. 67)."},{"t":"Budowanie/nabywanie/tworzenie/wdrażanie","ok":false,"w":"Ten etap dotyczy powstania i wprowadzenia polityki, a nie sprawdzania polityki już obowiązującej (FW-PL s. 67)."},{"t":"Aktualizacja/pozbywanie się","ok":false,"w":"Aktualizacja/pozbywanie się to zmiana polityki lub wycofanie nieaktualnej wersji; samo sprawdzanie, czy polityka działa i jest przestrzegana, to jeszcze ocena/monitorowanie (FW-PL s. 67–68)."}],"przyklad":"Sytuacja: Polityka bezpieczeństwa obowiązuje od dwóch lat, a komisja co roku sprawdza, czy nadal działa i czy pracownicy jej przestrzegają. Regulamin domu: najpierw ustalacie, czego potrzeba (planowanie), piszecie go (projektowanie, tworzenie), stosujecie (użytkowanie), co jakiś czas sprawdzacie, czy działa (ocena), a w razie potrzeby zmieniacie (aktualizacja). HACZYK: „sprawdza, czy działa” = ocena/monitorowanie.","cyt":{"s":"29","t":"– Użytkowanie/obsługa; – Ocena/monitorowanie; – Aktualizacja/pozbywanie się.","w":"ZGODNE","u":"Fazy cyklu życia czynnika umożliwiającego (te same na Ilustracji 28, s. 67); przypisanie corocznej weryfikacji do oceny/monitorowania to interpretacja, FW nie opisuje faz szerzej."}},"q-pc-deep-04":{"id":"q-pc-deep-04","typ":"egzamin","s":"EN-02-09","t":"Który z poniższych NIE jest etapem cyklu życia procesu w COBIT 5?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 70"],"r":null,"zap":"Cykl życia procesu: definiowanie, tworzenie, obsługa, monitorowanie, dostosowanie/aktualizacja lub wycofanie.","scen":"","o":[{"t":"Obsługa","ok":false,"w":"Proces jest obsługiwany – to jeden z etapów cyklu życia (FW-PL s. 70)."},{"t":"Monitorowanie","ok":false,"w":"Proces jest monitorowany – to jeden z etapów cyklu życia (FW-PL s. 70)."},{"t":"Certyfikacja","ok":true,"w":"Podręcznik wymienia: definiowanie, tworzenie, obsługę, monitorowanie oraz dostosowanie/aktualizację lub wycofanie. Certyfikacji (np. przez zewnętrzny organ) wśród nich nie ma (FW-PL s. 70)."},{"t":"Wycofanie","ok":false,"w":"Proces może zostać wycofany – to ostatni możliwy etap cyklu życia (FW-PL s. 70)."}],"przyklad":"Proces jak lokalna linia autobusowa: wytycza się ją, uruchamia, kursuje, liczy się pasażerów, a potem zmienia trasę albo linię likwiduje. Nikt jej nie „certyfikuje”. HACZYK: COBIT 5 nie wymaga certyfikacji procesów.","cyt":{"s":"70","t":"Jest on definiowany, tworzony, obsługiwany, monitorowany oraz dostosowywany/aktualizowany lub wycofywany.","w":"ZGODNE"}},"q-pc-deep-05":{"id":"q-pc-deep-05","typ":"egzamin","s":"EN-02-09","t":"Który etap cyklu życia procesu następuje, gdy proces przestaje być potrzebny?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 70"],"r":null,"zap":"Koniec cyklu życia procesu ma dwie drogi: dostosowanie/aktualizacja (proces zostaje, ale się zmienia) albo wycofanie (proces znika).","scen":"","o":[{"t":"Wycofanie","ok":true,"w":"Gdy proces przestaje być potrzebny, cykl życia kończy się jego wycofaniem (FW-PL s. 70)."},{"t":"Obsługa","ok":false,"w":"Obsługa oznacza bieżące działanie procesu, a ten proces nie jest już potrzebny (FW-PL s. 70)."},{"t":"Definiowanie","ok":false,"w":"Definiowanie to początek cyklu życia nowego procesu (FW-PL s. 70)."},{"t":"Monitorowanie","ok":false,"w":"Monitorowanie sprawdza działający proces; tu wiadomo już, że proces jest zbędny (FW-PL s. 70)."}],"przyklad":"Sytuacja: Urząd wprowadził elektroniczny obieg wniosków i dawny proces ręcznego rejestrowania pism przestał być potrzebny. Gdy w bloku zamontowano domofon, przestaje być potrzebny dyżur portiera przy drzwiach – ten „proces” się wycofuje. HACZYK: zmiana procesu = aktualizacja, likwidacja procesu = wycofanie.","cyt":{"s":"70","t":"Jest on definiowany, tworzony, obsługiwany, monitorowany oraz dostosowywany/aktualizowany lub wycofywany.","w":"ZGODNE"}},"q-pc-deep-06":{"id":"q-pc-deep-06","typ":"egzamin","s":"EN-02-09","t":"Co może ułatwić definiowanie, realizację, monitorowanie i optymalizację procesów w ich cyklu życia?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 70"],"r":null,"zap":"Cykl życia procesu wspierają typowe praktyki z modelu oceny procesu (ISO/IEC 15504) – te same, które ocenia się na poziomach zdolności 2–5.","scen":"","o":[{"t":"Tabele mapowania kaskady celów","ok":false,"w":"Kaskada celów pomaga wybrać ważne procesy, ale podręcznik w tym miejscu wskazuje typowe praktyki z modelu oceny procesu (FW-PL s. 70)."},{"t":"Model informacji COBIT 5","ok":false,"w":"Model informacji opisuje informacje, a nie cykl życia procesów (FW-PL s. 70)."},{"t":"Pryncypia architektury korporacyjnej","ok":false,"w":"Pryncypia architektury dotyczą czynnika Usługi, infrastruktura i aplikacje (FW-PL s. 70)."},{"t":"Typowe praktyki z modelu oceny procesu","ok":true,"w":"Podręcznik wskazuje, że typowe praktyki procesów zdefiniowane w modelu oceny procesu (ISO/IEC 15504) mogą ułatwić definiowanie, realizację, monitorowanie i optymalizację procesów (FW-PL s. 70)."}],"przyklad":"Kuchnia doskonali swoje przepisy według listy kontrolnej inspektora sanepidu: co ma być zaplanowane, spisane, mierzone i poprawiane. HACZYK: model oceny procesu nie tylko ocenia, ale też podpowiada, jak proces ulepszać.","cyt":{"s":"70","t":"Typowe praktyki procesów, takie jak te zdefiniowane w ramach modelu oceny procesu metodyki COBIT, oparte na normie ISO/IEC 15504, mogą ułatwić definiowanie, realizację, monitorowanie i optymalizację procesów.","w":"ZGODNE"}},"q-pc-deep-07":{"id":"q-pc-deep-07","typ":"egzamin","s":"EN-02-19","t":"Projektując nowy system, zespół pyta: „Jaka będzie struktura informacji i jakie strony kodowe zostaną użyte?”. Której warstwy modelu informacji dotyczy to pytanie?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 84"],"r":null,"zap":"Specyfikacja (Przykład 13): fizyczna – gdzie przechowywać; empiryczna – jak uzyskać dostęp; syntaktyczna – struktura i strony kodowe; semantyczna – rodzaj i szczegółowość; pragmatyczna – wymogi przechowywania i przydatność.","scen":"","o":[{"t":"Warstwy fizycznej","ok":false,"w":"Warstwa fizyczna pyta, gdzie informacje będą przechowywane (FW-PL s. 84)."},{"t":"Warstwy syntaktycznej","ok":true,"w":"W Przykładzie 13 warstwa syntaktyczna to pytanie o strukturę informacji i użyte strony kodowe (FW-PL s. 84)."},{"t":"Warstwy empirycznej","ok":false,"w":"Warstwa empiryczna pyta, jak można uzyskać dostęp do informacji (FW-PL s. 84)."},{"t":"Warstwy pragmatycznej","ok":false,"w":"Warstwa pragmatyczna pyta o wymogi przechowywania i inne informacje potrzebne do ich wykorzystania (FW-PL s. 84)."}],"przyklad":"Wysyłasz list: fizyczna – w której skrzynce leży; empiryczna – kto ma do niej klucz; syntaktyczna – w jakim języku i alfabecie jest napisany; semantyczna – o czym jest; pragmatyczna – jak długo trzeba go trzymać. HACZYK: składnia (syntaktyka) = struktura i zapis.","cyt":{"s":"84","t":"Warstwa syntaktyczna — Jaka będzie struktura informacji i jakie strony kodowe zostaną użyte?","w":"ZGODNE"}},"q-pc-deep-08":{"id":"q-pc-deep-08","typ":"egzamin","s":"EN-02-19","t":"Od którego etapu cyklu życia informacji trzeba zadbać o jej bezpieczeństwo?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 84"],"r":null,"zap":"Ochrona informacji (Przykład 14): we wszystkich fazach cyklu życia, od planowania przez przechowywanie i udostępnianie po pozbywanie się.","scen":"","o":[{"t":"Od fazy użytkowania informacji","ok":false,"w":"Ochrona jest potrzebna we wszystkich fazach cyklu życia, nie dopiero od użytkowania (FW-PL s. 84)."},{"t":"Od fazy pozbywania się informacji","ok":false,"w":"Pozbywanie się to tylko jedna z faz, w których potrzebne są zabezpieczenia (FW-PL s. 84)."},{"t":"Od fazy planowania informacji","ok":true,"w":"Informacje wymagają ochrony we wszystkich fazach cyklu życia, a o bezpieczeństwo należy zadbać już w fazie planowania (FW-PL s. 84, Przykład 14)."},{"t":"Od momentu, gdy informacja jest historyczna","ok":false,"w":"Status historyczny to tylko jedno z pytań warstwy pragmatycznej; ochrona dotyczy całego cyklu życia (FW-PL s. 84)."}],"przyklad":"Sejf planuje się razem z projektem banku, a nie montuje po pierwszym napadzie. HACZYK: bezpieczeństwo zaczyna się w fazie planowania.","cyt":{"s":"84","t":"O bezpieczeństwo należy zadbać już w fazie planowania informacji.","w":"ZGODNE"}},"q-pc-deep-09":{"id":"q-pc-deep-09","typ":"egzamin","s":"EN-02-19","t":"Która analiza modelu informacji pozwala określić, kto i kiedy potrzebuje dostępu do danych?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 84"],"r":null,"zap":"Kto (interesariusze) + kiedy (cykl życia) = jaki dostęp do danych.","scen":"","o":[{"t":"Analiza wymiarów interesariuszy i cyklu życia","ok":true,"w":"Analiza wymiarów interesariuszy i cyklu życia pozwala określić wymagany rodzaj dostępu dla poszczególnych osób i faz cyklu życia informacji (FW-PL s. 84, Przykład 13)."},{"t":"Analiza samej warstwy syntaktycznej","ok":false,"w":"Warstwa syntaktyczna opisuje strukturę informacji i strony kodowe, a nie to, kto potrzebuje dostępu (FW-PL s. 84)."},{"t":"Analiza kryteriów prezentacji informacji","ok":false,"w":"Kryteria prezentacji (np. zrozumiałość) pojawiają się przy łatwości korzystania z danych (Przykład 15), a nie przy określaniu dostępu (FW-PL s. 84)."},{"t":"Analiza pryncypiów architektury","ok":false,"w":"Pryncypia architektury należą do czynnika Usługi, infrastruktura i aplikacje, a nie do modelu informacji (FW-PL s. 85)."}],"przyklad":"Dokumentacja medyczna: lekarz potrzebuje pełnego wglądu w czasie leczenia, rejestratorka tylko danych do wizyty, a archiwista dopiero po latach. HACZYK: dostęp ustala się z dwóch wymiarów – kto i w której fazie.","cyt":{"s":"84","t":"Analiza dwóch wymiarów informacji — interesariuszy i cyklu życia — pozwala określić, jaki rodzaj dostępu do danych jest wymagany w przypadku poszczególnych osób (dla poszczególnych faz cyklu życia informacji).","w":"ZGODNE"}},"q-pc-deep-10":{"id":"q-pc-deep-10","typ":"egzamin","s":"PR-02-10","t":"Jakie trzy źródła zasilają bazę wiedzy COBIT 5?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 25"],"r":null,"zap":"Ilustracja 10 czytana od lewej: 3 źródła → baza wiedzy → filtr (czynniki umożliwiające) → rodzina produktów.","scen":"","o":[{"t":"Przewodniki aktywatorów, specjalistyczne i środowisko współpracy","ok":false,"w":"To rodzina produktów COBIT 5, czyli to, co powstaje z bazy wiedzy, a nie jej źródła (FW-PL s. 25)."},{"t":"Pięć zasad, siedem aktywatorów i 37 procesów","ok":false,"w":"To elementy samego COBIT 5, a nie źródła bazy wiedzy z Ilustracji 10 (FW-PL s. 25)."},{"t":"Obecne i nowe wytyczne ISACA oraz inne standardy","ok":true,"w":"Trzy źródła zasilają bazę wiedzy COBIT 5: obecne wytyczne ISACA, nowe materiały z wytycznymi ISACA oraz inne standardy i metodyki (FW-PL s. 25, Ilustracja 10)."},{"t":"Wyłącznie dotychczasowe wytyczne ISACA","ok":false,"w":"Bazę wiedzy zasilają też nowe materiały ISACA oraz inne standardy i metodyki (FW-PL s. 25)."}],"przyklad":"Rzeka ma trzy dopływy: stare źródła (dawne wytyczne ISACA), nowe źródła (nowe materiały ISACA) i dopływy z sąsiednich dolin (inne standardy). Wszystkie wpadają do jednego jeziora – bazy wiedzy. HACZYK: przewodniki to to, co z jeziora wypływa, a nie dopływy.","cyt":{"s":"25","t":"Obecne wytyczne ISACA (COBIT, Val IT, Risk IT, BMIS, …) Nowe materiały z wytycznymi ISACA Inne standardy i metodyki Baza wiedzy COBIT 5","w":"ZGODNE","u":"Tylko tekst Ilustracji 10."}},"q-pc-deep-11":{"id":"q-pc-deep-11","typ":"egzamin","s":"PR-02-10","t":"Co zawiera baza wiedzy COBIT 5 oprócz aktualnych wytycznych i treści?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 25"],"r":null,"zap":"Baza wiedzy COBIT 5 = aktualne wytyczne i treści + struktura dla przyszłych treści.","scen":"","o":[{"t":"Gotowe procedury do wdrożenia bez zmian","ok":false,"w":"COBIT 5 nie ma charakteru normatywnego: działania trzeba dostosować i rozwinąć w konkretne procedury organizacji (FW-PL s. 32, 70)."},{"t":"Wyniki ocen zdolności procesów różnych organizacji","ok":false,"w":"Ilustracja 10 nie wymienia wyników ocen jako zawartości bazy wiedzy (FW-PL s. 25)."},{"t":"Certyfikaty zgodności z normami ISO","ok":false,"w":"Baza wiedzy nie zawiera certyfikatów (FW-PL s. 25)."},{"t":"Strukturę dla przyszłych treści","ok":true,"w":"Ilustracja 10: baza wiedzy obejmuje aktualne wytyczne i treści oraz strukturę dla przyszłych treści (FW-PL s. 25)."}],"przyklad":"Biblioteka ma nie tylko książki na półkach, ale też wolne, opisane półki na książki, które dopiero się ukażą. HACZYK: COBIT 5 od początku przewiduje miejsce na nowe treści.","cyt":{"s":"26","t":"Uzupełnienie bazy wiedzy COBIT 5 zawierającej wszystkie wytyczne i treści utworzone do tej pory i stanowiącej strukturę dla dodatkowych przyszłych treści.","w":"ZGODNE","u":"Na Ilustracji 10 (s. 25): „Aktualne wytyczne i treści • Struktura dla przyszłych treści”."}},"q-pc-deep-12":{"id":"q-pc-deep-12","typ":"egzamin","s":"PR-02-10","t":"Który element NIE należy do rodziny produktów COBIT 5?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 11","FW-PL s. 25"],"r":null,"zap":"Rodzina produktów COBIT 5: COBIT 5 (metodyka), przewodniki dotyczące czynników umożliwiających, specjalistyczne przewodniki, środowisko sieciowe oparte na współpracy.","scen":"","o":[{"t":"Przewodniki dotyczące aktywatorów","ok":false,"w":"To część rodziny produktów, np. COBIT 5: Procesy umożliwiające (FW-PL s. 11, 25)."},{"t":"Inne standardy i struktury ramowe","ok":true,"w":"Inne standardy i metodyki są źródłem, które zasila bazę wiedzy, a nie produktem COBIT 5 (FW-PL s. 25)."},{"t":"Specjalistyczne przewodniki COBIT 5","ok":false,"w":"To część rodziny produktów, np. COBIT 5: Wdrożenie czy Bezpieczeństwo informacji (FW-PL s. 11, 25)."},{"t":"Środowisko sieciowe oparte na współpracy","ok":false,"w":"To część rodziny produktów COBIT 5 (FW-PL s. 11, 25)."}],"przyklad":"Piekarnia kupuje mąkę od różnych młynów (źródła), a sprzedaje chleb, bułki i ciasta (produkty). Mąka z młyna nie jest produktem piekarni. HACZYK: inne standardy wchodzą do COBIT 5, ale nie są jego produktem.","cyt":{"s":"25","t":"Rodzina produktów COBIT 5 COBIT 5 Przewodniki dotyczące czynników umożliwiających w ramach metodyki Specjalistyczne przewodniki dotyczące metodyki COBIT 5 COBIT 5 — Środowisko sieciowe oparte na współpracy","w":"ZGODNE","u":"Tylko tekst Ilustracji 10; „Inne standardy i metodyki” są tam źródłem bazy wiedzy, nie produktem."}},"q-pc-std-01":{"id":"q-pc-std-01","typ":"egzamin","s":"PR-02-10","t":"Czego dotyczy ITIL, z którym COBIT 5 się integruje?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 15","FW-PL s. 86"],"r":null,"zap":"ITIL = usługi IT: jak je zaprojektować, uruchomić i codziennie świadczyć (np. obsługa zgłoszeń, incydentów, zmian).","scen":"","o":[{"t":"Zarządzania projektami w kontrolowanym środowisku","ok":false,"w":"To PRINCE2 (PRojects IN Controlled Environments) (FW-PL s. 15)."},{"t":"Architektury korporacyjnej i cyklu jej rozwoju","ok":false,"w":"To TOGAF, z cyklem ADM (FW-PL s. 61)."},{"t":"Projektowania i świadczenia usług IT","ok":true,"w":"ITIL to biblioteka dobrych praktyk zarządzania usługami IT; podręcznik opisuje ją jako kompleksowe wytyczne dotyczące projektowania i wykonywania usług (FW-PL s. 15, 86)."},{"t":"Zarządzania bezpieczeństwem informacji","ok":false,"w":"Bezpieczeństwa informacji dotyczy seria ISO/IEC 27000 (FW-PL s. 60)."}],"przyklad":"ITIL to jak podręcznik dobrze prowadzonego serwisu samochodowego: przyjęcie zgłoszenia, naprawa, wydanie auta, obsługa reklamacji. HACZYK: ITIL = usługi, PRINCE2 = projekty.","cyt":{"s":"86","t":"Metodyka ITIL zawiera kompleksowe wytyczne dotyczące sposobu projektowania i wykonywania usług.","w":"ZGODNE","u":"FW nie używa wprost zwrotu „zarządzanie usługami IT” przy ITIL (pełna nazwa ITIL na s. 15 i 47)."}},"q-pc-std-02":{"id":"q-pc-std-02","typ":"egzamin","s":"PR-02-10","t":"Które procesy COBIT 5 obejmują ITIL V3 2011 i norma ISO/IEC 20000?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 60","FW-PL s. 61"],"r":null,"zap":"ITIL i ISO/IEC 20000 = usługi IT → przede wszystkim DSS (Dostarczaj, Obsługuj i Wspieraj).","scen":"","o":[{"t":"Podzbiór procesów DSS i BAI oraz niektóre procesy APO","ok":true,"w":"Tak wskazuje Załącznik E: ITIL V3 2011 i ISO/IEC 20000 odnoszą się głównie do świadczenia usług (DSS), częściowo do wdrażania (BAI) i do niektórych procesów APO (FW-PL s. 60)."},{"t":"Wyłącznie procesy Ładu w domenie EDM","ok":false,"w":"Domenie EDM odpowiada norma ISO/IEC 38500 o ładzie IT (FW-PL s. 61)."},{"t":"Procesy zarządzania ryzykiem w EDM i APO","ok":false,"w":"To obszar serii ISO 31000 (FW-PL s. 60)."},{"t":"Procesy portfela w APO oraz programów i projektów w BAI","ok":false,"w":"To obszar PRINCE2 (FW-PL s. 61)."}],"przyklad":"Usługi IT to codzienne życie: działające systemy, obsługa zgłoszeń i awarii. Dlatego ITIL ląduje głównie w DSS – domenie „codziennego serwisu”. HACZYK: ITIL ↔ DSS.","cyt":{"s":"60","t":"ITIL V3 2011 i ISO/IEC 20000 obejmują następujące obszary i domeny COBIT 5: • podzbiór procesów w domenie DSS; • podzbiór procesów w domenie BAI; • niektóre procesy w domenie APO.","w":"ZGODNE"}},"q-pc-std-03":{"id":"q-pc-std-03","typ":"egzamin","s":"PR-02-10","t":"Czego dotyczy norma ISO/IEC 20000?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 47","FW-PL s. 60"],"r":null,"zap":"ISO/IEC 20000 = norma (certyfikowalna) dla zarządzania usługami IT; ITIL = biblioteka dobrych praktyk w tym samym obszarze.","scen":"","o":[{"t":"Ładu korporacyjnego w obszarze IT","ok":false,"w":"Tego dotyczy ISO/IEC 38500 (FW-PL s. 47, 57)."},{"t":"Zarządzania ryzykiem","ok":false,"w":"Tego dotyczy seria ISO 31000 (FW-PL s. 60)."},{"t":"Oceny procesów i ich zdolności","ok":false,"w":"Tego dotyczy ISO/IEC 15504, na której oparto model zdolności procesów COBIT 5 (FW-PL s. 41)."},{"t":"Zarządzania usługami IT","ok":true,"w":"ISO/IEC 20000 to norma zarządzania usługami IT (IT Service Management Standard); w Załączniku E występuje razem z ITIL (FW-PL s. 47, 60)."}],"przyklad":"ITIL to książka kucharska z przepisami serwisu, a ISO/IEC 20000 to egzamin, po którym serwis może dostać certyfikat. HACZYK: 20000 idzie w parze z ITIL.","cyt":{"s":"47","t":"20000:2006 IT Service Management Standard","w":"ZGODNE","u":"FW podaje tylko angielski tytuł normy w Załączniku A."}},"q-pc-std-04":{"id":"q-pc-std-04","typ":"egzamin","s":"PR-02-10","t":"Czym jest PRINCE2?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 15","FW-PL s. 61"],"r":null,"zap":"PRINCE2 = projekty (start, etapy, kontrola, zamknięcie). Podobny obszar obejmuje PMBOK.","scen":"","o":[{"t":"Biblioteką dobrych praktyk zarządzania usługami IT","ok":false,"w":"To ITIL (FW-PL s. 15)."},{"t":"Metodyką zarządzania projektami","ok":true,"w":"PRINCE2 (PRojects IN Controlled Environments) to metodyka zarządzania projektami w kontrolowanym środowisku; w COBIT 5 odnosi się do portfela (APO) oraz programów i projektów (BAI) (FW-PL s. 15, 61)."},{"t":"Normą zarządzania bezpieczeństwem informacji","ok":false,"w":"To seria ISO/IEC 27000 (FW-PL s. 60)."},{"t":"Modelem oceny zdolności procesów","ok":false,"w":"Ocena zdolności procesów opiera się na ISO/IEC 15504 (FW-PL s. 41)."}],"przyklad":"Budowa domu jako projekt: jest początek i koniec, budżet, harmonogram, kierownik i odbiory etapów. Tym zajmuje się PRINCE2. HACZYK: Projekt = PRINCE2 (P jak projekt).","cyt":{"s":"15","t":"PRojects IN Controlled Environments 2 (PRINCE2®)","w":"ZGODNE","u":"FW nie nazywa PRINCE2 wprost „metodyką zarządzania projektami”; wynika to z rozwinięcia nazwy i mapowania na procesy programów i projektów w BAI (s. 61)."}},"q-pc-std-05":{"id":"q-pc-std-05","typ":"egzamin","s":"PR-02-10","t":"Z którymi procesami COBIT 5 wiążą się PRINCE2 i PMBOK?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 60","FW-PL s. 61"],"r":null,"zap":"PRINCE2/PMBOK ↔ APO (portfel) + BAI (programy i projekty).","scen":"","o":[{"t":"Z portfelem w APO oraz programami i projektami w BAI","ok":true,"w":"Załącznik E: PRINCE2 obejmuje procesy portfela w APO i procesy zarządzania programami i projektami w BAI; na Ilustracji 25 stoi razem z PMBOK (FW-PL s. 61)."},{"t":"Z procesami świadczenia i wsparcia usług w DSS","ok":false,"w":"Usługi w DSS to głównie ITIL i ISO/IEC 20000 (FW-PL s. 60)."},{"t":"Wyłącznie z procesami Ładu w domenie EDM","ok":false,"w":"Ładowi w EDM odpowiada ISO/IEC 38500 (FW-PL s. 61)."},{"t":"Z monitorowaniem i oceną zgodności w MEA","ok":false,"w":"Działania monitorujące z MEA wymienia się przy serii ISO/IEC 27000, nie przy PRINCE2 (FW-PL s. 60)."}],"przyklad":"Najpierw wybierasz, które remonty w ogóle zrobić w tym roku (portfel – APO), potem prowadzisz każdy remont jako projekt (BAI). HACZYK: projekty to „Build” – BAI.","cyt":{"s":"61","t":"PRINCE2 obejmuje następujące obszary i domeny COBIT 5: • procesy związane z portfelem w domenie APO; • procesy zarządzania programami i projektami w domenie BAI.","w":"ZGODNE","u":"PMBOK pojawia się tylko na Ilustracji 25 razem z PRINCE2 („PRINCE2/PMBOK”)."}},"q-pc-std-06":{"id":"q-pc-std-06","typ":"egzamin","s":"PR-02-10","t":"Czego dotyczy TOGAF 9?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 61","FW-PL s. 86"],"r":null,"zap":"TOGAF = architektura korporacyjna (jak systemy, dane i procesy organizacji pasują do siebie); rdzeń: cykl ADM.","scen":"","o":[{"t":"Zarządzania usługami IT","ok":false,"w":"To ITIL i ISO/IEC 20000 (FW-PL s. 60)."},{"t":"Zarządzania ryzykiem","ok":false,"w":"To seria ISO 31000 (FW-PL s. 60)."},{"t":"Zarządzania projektami","ok":false,"w":"To PRINCE2 i PMBOK (FW-PL s. 61)."},{"t":"Architektury korporacyjnej","ok":true,"w":"TOGAF 9 dotyczy architektury korporacyjnej; rdzeniem jest cykl ADM, odwzorowany w praktykach COBIT 5 dotyczących architektury w APO (FW-PL s. 61). Podręcznik wskazuje też, że TOGAF daje techniczny model referencyjny (FW-PL s. 86)."}],"przyklad":"TOGAF to jak plan zagospodarowania miasta: gdzie drogi, gdzie budynki, jak wszystko się łączy, a cykl ADM to kolejne etapy rozbudowy. HACZYK: TOGAF ↔ architektura ↔ Rada ds. Architektury.","cyt":{"s":"61","t":"proces związany z architekturą korporacyjną w domenie APO. Rdzeniem TOGAF 9 jest cykl Architecture Development Method (ADM)","w":"ZGODNE"}},"q-pc-std-07":{"id":"q-pc-std-07","typ":"egzamin","s":"PR-02-10","t":"Czego dotyczy seria norm ISO/IEC 27000 i które obszary COBIT 5 obejmuje?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 60"],"r":null,"zap":"ISO/IEC 27000 = bezpieczeństwo informacji; jest „rozproszona” po wielu domenach: EDM, APO, DSS i MEA.","scen":"","o":[{"t":"Zarządzania usługami IT; głównie domeny DSS","ok":false,"w":"Usługi IT w DSS to ITIL i ISO/IEC 20000 (FW-PL s. 60)."},{"t":"Bezpieczeństwa informacji; EDM, APO, DSS i MEA","ok":true,"w":"Tak opisuje ją Załącznik E: procesy związane z bezpieczeństwem i ryzykiem w EDM, APO i DSS, działania bezpieczeństwa w innych domenach i monitorowanie w MEA (FW-PL s. 60)."},{"t":"Ładu korporacyjnego w IT; wyłącznie domeny EDM","ok":false,"w":"To ISO/IEC 38500 (FW-PL s. 57, 61)."},{"t":"Rozwoju aplikacji; procesów budowania w BAI","ok":false,"w":"Budowanie aplikacji w BAI łączy się z CMMI (FW-PL s. 61)."}],"przyklad":"Bezpieczeństwo w domu nie siedzi w jednym pokoju: zamki w drzwiach, sejf w sypialni, alarm w korytarzu i co jakiś czas sprawdzenie, czy wszystko działa. Tak samo 27000 przenika wiele domen. HACZYK: 27000 = bezpieczeństwo, wszędzie po trochu.","cyt":{"s":"60","t":"Norma ISO/IEC 27000 obejmuje następujące obszary i domeny COBIT 5: • procesy związane z bezpieczeństwem i ryzykiem w domenach EDM, APO oraz DSS; • różne działania związane z bezpieczeństwem w ramach procesów w innych domenach; • działania monitorujące i oceniające z domeny MEA.","w":"ZGODNE","u":"Że seria dotyczy bezpieczeństwa informacji, FW nie mówi wprost (wynika z mapowania; ISO/IEC 27005 na s. 47: Information Security Risk Management)."}},"q-pc-std-08":{"id":"q-pc-std-08","typ":"egzamin","s":"PR-02-10","t":"Z którymi procesami COBIT 5 wiąże się seria ISO 31000?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 60"],"r":null,"zap":"ISO 31000 = zarządzanie ryzykiem → EDM (nadzór nad ryzykiem, EDM03) i APO (zarządzanie ryzykiem, APO12).","scen":"","o":[{"t":"Z procesami zarządzania ryzykiem w domenach EDM i APO","ok":true,"w":"Załącznik E: ISO 31000 obejmuje procesy związane z zarządzaniem ryzykiem w EDM i APO (FW-PL s. 60)."},{"t":"Z procesami świadczenia usług w DSS","ok":false,"w":"To obszar ITIL i ISO/IEC 20000 (FW-PL s. 60)."},{"t":"Z procesami architektury korporacyjnej w APO","ok":false,"w":"To obszar TOGAF 9 (FW-PL s. 61)."},{"t":"Z procesami zarządzania projektami w BAI","ok":false,"w":"To obszar PRINCE2 i PMBOK (FW-PL s. 61)."}],"przyklad":"Jak ubezpieczenie domu: zarząd rodziny decyduje, ile ryzyka akceptuje (EDM), a ktoś na co dzień pilnuje polis i zabezpieczeń (APO). HACZYK: 31000 = ryzyko.","cyt":{"s":"60","t":"procesy związane z zarządzaniem ryzykiem w domenach EDM i APO.","w":"ZGODNE"}},"q-pc-std-09":{"id":"q-pc-std-09","typ":"egzamin","s":"PR-02-10,PR-01-03","t":"Czego dotyczy norma ISO/IEC 38500 i z którą domeną COBIT 5 się łączy?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 57","FW-PL s. 60","FW-PL s. 61"],"r":null,"zap":"ISO/IEC 38500 = ład IT, 6 zasad, ocena–kierowanie–monitorowanie → EDM. Nie myl z 5 zasadami COBIT 5.","scen":"","o":[{"t":"Zarządzania usługami IT; łączy się z DSS","ok":false,"w":"To ITIL i ISO/IEC 20000 (FW-PL s. 60)."},{"t":"Oceny zdolności procesów; łączy się z modelem PAM","ok":false,"w":"To ISO/IEC 15504 (FW-PL s. 41)."},{"t":"Ładu korporacyjnego w IT; łączy się z EDM","ok":true,"w":"ISO/IEC 38500 (Corporate governance of information technology) opiera się na sześciu kluczowych zasadach; jej podejście ocena–kierowanie–monitorowanie odpowiada domenie EDM (FW-PL s. 57, 60–61)."},{"t":"Bezpieczeństwa informacji; łączy się z APO i DSS","ok":false,"w":"To seria ISO/IEC 27000 (FW-PL s. 60)."}],"przyklad":"38500 to „regulamin zarządu” w sprawach IT: zarząd ocenia, kieruje i sprawdza, a nie sam naprawia komputery. HACZYK: ISO/IEC 38500 ma 6 zasad, COBIT 5 ma 5 zasad.","cyt":{"s":"57","t":"Norma ISO/IEC 38500:2008–Corporate governance of information technology opiera się na sześciu kluczowych zasadach.","w":"ZGODNE","u":"Powiązanie z EDM: s. 60 („ISO/IEC 38500 Ocena, kierowanie i monitorowanie”) i Ilustracja 25 (s. 61)."}},"q-pc-std-10":{"id":"q-pc-std-10","typ":"egzamin","s":"PR-02-10","t":"Z którymi obszarami COBIT 5 wiąże się model CMMI (rozwój)?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 61"],"r":null,"zap":"CMMI (rozwój) = dojrzałość wytwarzania oprogramowania → BAI (budowanie, nabywanie) + jakość w APO.","scen":"","o":[{"t":"Z procesami zarządzania portfelem w APO","ok":false,"w":"Portfel w APO wiąże się z PRINCE2 (FW-PL s. 61)."},{"t":"Z budowaniem aplikacji w BAI i jakością w APO","ok":true,"w":"CMMI (rozwój) obejmuje procesy budowania aplikacji oraz nabywania w BAI i niektóre procesy organizacyjne i związane z jakością w APO (FW-PL s. 61, Załącznik E)."},{"t":"Wyłącznie z procesami Ładu w domenie EDM","ok":false,"w":"Ładowi w EDM odpowiada ISO/IEC 38500 (FW-PL s. 61)."},{"t":"Z procesami zarządzania bezpieczeństwem w DSS","ok":false,"w":"Bezpieczeństwo w DSS łączy się z serią ISO/IEC 27000 (FW-PL s. 60)."}],"przyklad":"CMMI to jak ocena warsztatu stolarskiego: czy meble robi się według sprawdzonej, powtarzalnej metody, czy za każdym razem inaczej. HACZYK: CMMI ↔ budowanie aplikacji ↔ BAI.","cyt":{"s":"61","t":"CMMI obejmuje następujące obszary i domeny COBIT 5: • procesy związane z budowaniem aplikacji oraz nabyciem w domenie BAI; • niektóre procesy organizacyjne i związane z jakością z domeny APO.","w":"ZGODNE"}},"q-pc-std-11":{"id":"q-pc-std-11","typ":"egzamin","s":"PR-02-10","t":"Która para „standard – obszar, którego dotyczy” jest poprawna?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 60","FW-PL s. 61"],"r":null,"zap":"ITIL – usługi; PRINCE2/PMBOK – projekty; TOGAF – architektura; CMMI – rozwój aplikacji; 27000 – bezpieczeństwo; 31000 – ryzyko; 38500 – ład IT; 20000 – usługi IT; 15504 – ocena procesów.","scen":"","o":[{"t":"ITIL – zarządzanie projektami","ok":false,"w":"ITIL dotyczy zarządzania usługami IT; projektami zajmuje się PRINCE2 (FW-PL s. 60–61)."},{"t":"PRINCE2 – zarządzanie usługami IT","ok":false,"w":"PRINCE2 dotyczy zarządzania projektami; usługami IT zajmuje się ITIL (FW-PL s. 60–61)."},{"t":"ISO 31000 – bezpieczeństwo informacji","ok":false,"w":"ISO 31000 dotyczy zarządzania ryzykiem; bezpieczeństwem informacji zajmuje się ISO/IEC 27000 (FW-PL s. 60)."},{"t":"TOGAF 9 – architektura korporacyjna","ok":true,"w":"TOGAF 9 dotyczy architektury korporacyjnej, z cyklem ADM jako rdzeniem (FW-PL s. 61)."}],"przyklad":"Jak przypisywanie fachowców do zadań: elektryk do prądu, hydraulik do rur, architekt do projektu domu. Pomylenie ich par to typowa pułapka. HACZYK: zapamiętaj ściągę z rubryki „Zapamiętaj”.","cyt":{"s":"61","t":"proces związany z architekturą korporacyjną w domenie APO. Rdzeniem TOGAF 9 jest cykl Architecture Development Method (ADM)","w":"ZGODNE"}},"q-pc-std-12":{"id":"q-pc-std-12","typ":"egzamin","s":"PR-02-10","t":"Która para „standard – organizacja, która go wydaje” jest poprawna?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 47"],"r":null,"zap":"Wydawcy: COBIT – ISACA; ITIL i PRINCE2 – rząd Wielkiej Brytanii; TOGAF – The Open Group; PMBOK – Project Management Institute; normy ISO/IEC – ISO i IEC.","scen":"","o":[{"t":"ITIL – ISACA","ok":false,"w":"ITIL i PRINCE2 wydał rząd Wielkiej Brytanii (HM Government, Best Management Practice Portfolio); ISACA wydaje COBIT (FW-PL s. 47)."},{"t":"TOGAF 9 – The Open Group","ok":true,"w":"Załącznik A wymienia TOGAF 9 jako publikację The Open Group (FW-PL s. 47)."},{"t":"PMBOK – ISO","ok":false,"w":"PMBOK wydaje Project Management Institute (PMI), a nie Międzynarodowa Organizacja Normalizacyjna (ISO) (FW-PL s. 47)."},{"t":"ISO/IEC 27000 – PMI","ok":false,"w":"Normy ISO/IEC wydają wspólnie ISO i IEC, a nie Project Management Institute (PMI) (FW-PL s. 47)."}],"przyklad":"Jak marki samochodów: każda ma swojego producenta. COBIT nie „produkuje” ITIL ani TOGAF, tylko z nimi współpracuje. HACZYK: ISACA to tylko COBIT (oraz Val IT, Risk IT, BMIS, ITAF).","cyt":{"s":"47","t":"The Open Group, TOGAF® 9, Wielka Brytania, 2009","w":"ZGODNE"}},"q-pc-std-13":{"id":"q-pc-std-13","typ":"egzamin","s":"PR-02-10,EN-02-10","t":"Po co COBIT 5 odsyła do standardów takich jak ITIL, ISO/IEC 27000 czy PRINCE2?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 70"],"r":null,"zap":"COBIT 5 = nadrzędna rama (CO trzeba robić); ITIL, ISO, PRINCE2, TOGAF = szczegóły (JAK to zrobić w danym obszarze).","scen":"","o":[{"t":"Aby je zastąpić i przejąć ich treść","ok":false,"w":"COBIT 5 nie zastępuje innych standardów, tylko jest z nimi spójny i je integruje (FW-PL s. 25, 70)."},{"t":"Bo ich certyfikat warunkuje stosowanie COBIT 5","ok":false,"w":"Podręcznik nie stawia takiego wymogu (FW-PL s. 70)."},{"t":"Po szczegółowe wytyczne do realizacji praktyk","ok":true,"w":"Podręcznik wskazuje, że do osiągnięcia celów wdrożenia mogą być potrzebne dodatkowe wytyczne, które można uzyskać ze szczegółowych standardów i dobrych praktyk, takich jak ITIL, ISO/IEC 27000 i PRINCE2 (FW-PL s. 70)."},{"t":"Bo COBIT 5 nie ma własnych procesów","ok":false,"w":"COBIT 5 ma własny model referencyjny 37 procesów (FW-PL s. 33)."}],"przyklad":"COBIT 5 to jak plan budowy domu, a ITIL, PRINCE2 czy normy ISO to instrukcje konkretnych fachowców: elektryka, hydraulika, kierownika budowy. HACZYK: COBIT integruje, nie zastępuje.","cyt":{"s":"70","t":"uzyskać ze szczegółowych istotnych standardów i dobrych praktyk, takich jak ITIL, ISO/IEC serii 27000 oraz PRINCE2;","w":"ZGODNE"}},"q-pc-tl-01":{"id":"q-pc-tl-01","typ":"egzamin","s":"PR-02-05","t":"Jak egzamin PL nazywa „IT-related goals”, w polskim wydaniu COBIT 5 „cele związane z IT”?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 19"],"r":null,"zap":"IT-related goals: podręcznik „cele związane z IT” = egzamin „cele związane z Informatyką”.","scen":"","o":[{"t":"Cele związane z technologią","ok":false,"w":"Takiej nazwy egzamin nie używa; poziom kaskady to cele związane z Informatyką."},{"t":"Cele związane z Informatyką","ok":true,"w":"Na egzaminie PL: cele związane z Informatyką. Polskie wydanie: cele związane z IT (Ilustracja 6, FW-PL s. 19)."},{"t":"Cele związane z Aktywatorami","ok":false,"w":"Cele Aktywatorów (enabler goals) to kolejny poziom kaskady, po celach IT."},{"t":"Cele związane z procesami IT","ok":false,"w":"Cele procesów (process goals) to osobna kategoria celów, nie IT-related goals."}],"przyklad":"Ta sama rzecz pod dwiema etykietami, jak „komputer” i „PC”. HACZYK: na egzaminie szukaj słowa „Informatyką”.","cyt":{"s":"19","t":"Ilustracja 6 — Cele związane z IT","w":"TERMIN","u":"Polskie wydanie podręcznika i egzamin PL używają różnych nazw tego samego pojęcia. Podręcznik: cele związane z IT; egzamin: cele związane z Informatyką."}},"q-pc-tl-02":{"id":"q-pc-tl-02","typ":"egzamin","s":"PR-01-03","t":"Domenę opisaną w polskim wydaniu COBIT 5 jako „Ocena, kierowanie i monitorowanie” egzamin PL nazywa:","k":false,"st":"autorskie","src":"","z":["FW-PL s. 88"],"r":null,"zap":"EDM: podręcznik „Ocena, kierowanie i monitorowanie” = egzamin „Oszacuj, Kieruj i Monitoruj”.","scen":"","o":[{"t":"Monitoruj, Oszacuj i Oceń","ok":false,"w":"To egzaminacyjna nazwa domeny MEA."},{"t":"Dostosuj, Planuj i Organizuj","ok":false,"w":"To egzaminacyjna nazwa domeny APO."},{"t":"Oszacuj, Kieruj i Monitoruj","ok":true,"w":"Egzamin PL nazywa domenę EDM „Oszacuj, Kieruj i Monitoruj”; polskie wydanie: „Ocena, kierowanie i monitorowanie” (FW-PL s. 88)."},{"t":"Oceń, Steruj i Nadzoruj","ok":false,"w":"Taka nazwa nie występuje ani w podręczniku, ani na egzaminie."}],"przyklad":"Na egzaminie EDM zaczyna się od „Oszacuj”, a w podręczniku słowo „oszacowanie” jest w nazwie MEA. HACZYK: E = Evaluate = Oszacuj (egzamin) = Ocena (podręcznik).","cyt":{"s":"88","t":"Ocena, kierowanie i monitorowanie (EDM)","w":"TERMIN","u":"Polskie wydanie podręcznika i egzamin PL używają różnych nazw tego samego pojęcia. Egzamin: Oszacuj, Kieruj i Monitoruj."}},"q-pc-tl-03":{"id":"q-pc-tl-03","typ":"egzamin","s":"PR-01-04","t":"Domenę APO, w polskim wydaniu „Dopasowanie, planowanie i organizacja”, egzamin PL nazywa:","k":false,"st":"autorskie","src":"","z":["FW-PL s. 32"],"r":null,"zap":"APO: podręcznik „Dopasowanie, planowanie i organizacja” = egzamin „Dostosuj, Planuj i Organizuj”.","scen":"","o":[{"t":"Dopasuj, Planuj i Organizuj","ok":false,"w":"Pułapka: egzamin używa słowa „Dostosuj”, a nie „Dopasuj”."},{"t":"Dostosuj, Planuj i Organizuj","ok":true,"w":"Egzaminacyjna nazwa APO to „Dostosuj, Planuj i Organizuj”; polskie wydanie: „Dopasowanie, planowanie i organizacja” (FW-PL s. 32)."},{"t":"Twórz, Nabywaj i Wdrażaj","ok":false,"w":"To egzaminacyjna nazwa domeny BAI."},{"t":"Dostarczaj, Obsługuj i Wspieraj","ok":false,"w":"To egzaminacyjna nazwa domeny DSS."}],"przyklad":"Align po polsku to i „dopasuj”, i „dostosuj” – egzamin wybrał „Dostosuj”. HACZYK: egzamin = tryb rozkazujący, podręcznik = rzeczowniki.","cyt":{"s":"32","t":"Dopasowanie, planowanie i organizacja (APO)","w":"TERMIN","u":"Polskie wydanie podręcznika i egzamin PL używają różnych nazw tego samego pojęcia. Egzamin: Dostosuj, Planuj i Organizuj."}},"q-pc-tl-04":{"id":"q-pc-tl-04","typ":"egzamin","s":"PR-01-04","t":"Jak egzamin PL nazywa domenę BAI, w polskim wydaniu „Budowanie, nabywanie i wdrażanie”?","k":false,"st":"autorskie","src":"","z":["FW-PL s. 32"],"r":null,"zap":"BAI: podręcznik „Budowanie, nabywanie i wdrażanie” = egzamin „Twórz, Nabywaj i Wdrażaj”.","scen":"","o":[{"t":"Buduj, Nabywaj i Wdrażaj","ok":false,"w":"Pułapka: egzamin zamienia „Build” na „Twórz”, a nie „Buduj”."},{"t":"Dostosuj, Planuj i Organizuj","ok":false,"w":"To egzaminacyjna nazwa domeny APO."},{"t":"Monit
