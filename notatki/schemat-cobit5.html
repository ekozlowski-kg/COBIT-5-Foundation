, Wykonuj i Monitoruj (Altkom) / Planuj, Twórz, Wykonuj i Monitoruj (SP1 (Sample Paper 1 — oficjalny arkusz próbny 1)) · podr.: Planowanie, Budowanie, Uruchamianie i Monitorowanie · EN: Plan, Build, Run and Monitor","q":"Jakie działania obejmują Ład i Zarządzanie?","a":"PBRM (Plan, Build, Run and Monitor — Planuj, Wytwarzaj/Twórz, Wykonuj i Monitoruj) — Plan, Build, Run and Monitor: Planuj, Wytwarzaj, Wykonuj i Monitoruj. W Sample Paper 1 występuje wariant „Twórz” zamiast „Wytwarzaj”. To cztery główne obszary Zarządzania, powiązane odpowiednio z APO (Align, Plan and Organise — Dostosuj, Planuj i Organizuj), BAI (Build, Acquire and Implement — Twórz, Nabywaj i Wdrażaj), DSS (Deliver, Service and Support — Dostarczaj, Obsługuj i Wspieraj) i MEA (Monitor, Evaluate and Assess — Monitoruj, Oszacuj i Oceń). Run oznacza bieżące wykonywanie i eksploatację, a nie samo uruchomienie rozwiązania. Obszary te mogą występować wewnątrz procesów każdej domeny.","ex":"Ład ma trzy czasowniki: oceń, kieruj, sprawdzaj (EDM (Evaluate, Direct and Monitor — Oszacuj, Kieruj i Monitoruj)). Zarządzanie ma cztery: zaplanuj, zbuduj, prowadź, sprawdzaj (PBRM (Plan, Build, Run and Monitor — Planuj, Wytwarzaj/Twórz, Wykonuj i Monitoruj)). Oba kończą się sprawdzaniem, ale na innym piętrze.","org":""}},"fz-B-007":{"id":"fz-B-007","typ":"egzamin","s":"EN-02-10","t":"Czym różni się praktyka od działania w procesie COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 70"],"r":null,"zap":"","scen":"","o":[{"t":"Praktyka mówi, co trzeba robić, a działanie – jak to zrobić (jako propozycja)","ok":true,"w":"Tak: praktyka to CO, działanie to JAK, a szczegóły bierze się z innych standardów."},{"t":"Praktyka mówi, jak to zrobić, a działanie – co trzeba robić","ok":false,"w":"Odwrotnie: praktyka to CO, działanie to JAK."},{"t":"Działanie jest obowiązkowe, a praktyka jest tylko propozycją","ok":false,"w":"Działanie to propozycja, nie obowiązek."},{"t":"Praktyka i działanie to synonimy","ok":false,"w":"Karta wyraźnie je rozróżnia: CO kontra JAK."}],"fz":{"h":"Praktyka, działanie, szczegółowe działanie","p":"P1","pulapka":true,"n":"egzamin: praktyka · działanie · podr.: praktyka · działanie · EN: practice · activity · detailed activity","q":"Czym się różnią?","a":"Praktyka: co trzeba robić w procesie. Działanie: jak to zrobić (propozycja, nie obowiązek). Szczegółowe działania bierze się z innych standardów (ITIL, ISO/IEC 27000, PRINCE2).","ex":"Jak w kuchni: praktyka mówi CO zrobić („upiecz ciasto”), działanie – JAK, krok po kroku, a dokładną recepturę bierzesz z książki kucharskiej, czyli innego standardu.","org":"praktyka DSS02.02 rejestrowanie zgłoszeń."}},"fz-B-008":{"id":"fz-B-008","typ":"egzamin","s":"EN-01-01","t":"Jak COBIT 5 definiuje proces?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 69"],"r":null,"zap":"","scen":"","o":[{"t":"Zbiór praktyk ukierunkowanych przez polityki i procedury, który pobiera wejścia, przetwarza je i dostarcza wyniki","ok":true,"w":"Tak: to definicja procesu; proces ma też cele, mierniki, praktyki, działania i RACI."},{"t":"Ogólna deklaracja działania organu Ładu lub kierownictwa w danym procesie","ok":false,"w":"To definicja praktyki, nie procesu."},{"t":"Ogólny cel, któremu służy proces, opisany w PRM","ok":false,"w":"To przeznaczenie procesu."},{"t":"Opis pożądanego wyniku, np. wytworu lub istotnej zmiany stanu","ok":false,"w":"To cel procesu."}],"fz":{"h":"Proces","p":"P1","pulapka":true,"n":"egzamin: proces · podr.: proces · EN: process","q":"Jak COBIT 5 definiuje proces? / Jak brzmi definicja procesu w COBIT 5?","a":"Zbiór praktyk z wejściami i wyjściami, które osiągają cele procesu; ma cele, mierniki, praktyki, działania i RACI.\nZbiór praktyk ukierunkowanych przez polityki i procedury organizacji, który pobiera wejścia z różnych źródeł (również innych procesów), przetwarza je i dostarcza wyniki (np. produkty, usługi).","ex":"Proces to przepis: składniki na wejściu (mąka, jajka), kroki (praktyki), ciasto na wyjściu. Wiadomo też, kto piecze (RACI) i po czym poznać, że wyszło (cele, mierniki).\nPiekarnia: według zasad lokalu (polityki, procedury) bierze mąkę od dostawcy lub z magazynu (wejścia), przerabia ją i wydaje chleb klientom (wyniki).","org":"DSS02 Zarządzanie zgłoszeniami serwisowymi i incydentami."}},"fz-B-009":{"id":"fz-B-009","typ":"egzamin","s":"EN-02-24","t":"Co opisuje przeznaczenie procesu (podr.: cel procesu)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 33","FW-PL s. 69","FW-PL s. 43"],"r":null,"zap":"","scen":"","o":[{"t":"Konkretne pożądane wyniki procesu wraz z miernikami","ok":false,"w":"Konkretne pożądane wyniki to cele procesu. Przeznaczenie procesu opisuje ogólnie, po co proces istnieje i jakie są spodziewane rezultaty jego skutecznej realizacji."},{"t":"Ogólny cel: po co proces istnieje i jakie są spodziewane rezultaty jego skutecznej realizacji","ok":true,"w":"Tak: to jedno zdanie „po co ten proces istnieje”."},{"t":"Kto wykonuje, rozlicza, jest konsultowany i informowany","ok":false,"w":"To tabela RACI (Responsible, Accountable, Consulted, Informed — odpowiedzialny wykonawczo, odpowiedzialny decyzyjnie, konsultowany, informowany)."},{"t":"Konieczne i wystarczające kroki do wdrożenia praktyki","ok":false,"w":"To działania procesu."}],"fz":{"h":"Przeznaczenie procesu","p":"P2","pulapka":true,"n":"≠ TŁUMACZENIE · egzamin: przeznaczenie procesu · podr.: cel procesu · EN: process purpose","q":"Co opisuje przeznaczenie procesu w PRM? / Czym jest przeznaczenie procesu?","a":"Ogólny cel, któremu służy proces (opis procesu w Referencyjnym Modelu Procesu).\nOgólny cel procesu: po co istnieje i jakie są spodziewane rezultaty jego skutecznej realizacji (podr. cel procesu). Nie myl z celami procesu – to konkretne pożądane wyniki z miernikami.","ex":"Jedno zdanie „po co ten proces istnieje”, jak napis nad wejściem: „Pogotowie – ratujemy życie”. PRM to katalog wszystkich 37 procesów COBIT 5.\nJak tablica nad remizą: „Jesteśmy, by ratować ludzi i mienie” – po co istniejemy i co dajemy. Pułapka: podręcznik nazywa to „celem procesu”.","org":"DSS02: szybkie przywracanie usług i obsługa próśb."}},"fz-B-010":{"id":"fz-B-010","typ":"egzamin","s":"PR-02-14","t":"Czym jest Zarządzanie według COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 14","FW-PL s. 31","Altkom — Różnice tłumaczenia PL, s. 1"],"r":null,"zap":"","scen":"","o":[{"t":"Planowaniem, budowaniem, wykonywaniem i monitorowaniem działań zgodnie z kierunkiem Ładu","ok":true,"w":"Zarządzanie (management) planuje, buduje, wykonuje i monitoruje działania zgodnie z kierunkiem wskazanym przez organ Ładu, aby osiągnąć cele organizacji. Zwykle odpowiada za nie kadra zarządzająca (executive management) pod przywództwem CEO (Chief Executive Officer — dyrektor generalny). To odmienna odpowiedzialność od Ładu sprawowanego przez board (organ Ładu; podr. zarząd) pod przewodnictwem chair (przewodniczący)."},{"t":"Oceną potrzeb interesariuszy, wyznaczaniem kierunku i monitorowaniem wyników","ok":false,"w":"To definicja Ładu."},{"t":"Sprawdzaniem przez organ Ładu, w jakim stopniu kierunek wcielono w życie","ok":false,"w":"To monitorowanie w domenie Ładu."},{"t":"Ustalaniem apetytu na ryzyko i pilnowaniem, by go nie przekroczyć","ok":false,"w":"To EDM03 (Ensure Risk Optimisation — Zapewnienie optymalizacji ryzyka), proces Ładu."}],"fz":{"h":"Zarządzanie","p":"P1","pulapka":true,"n":"≠ TŁUMACZENIE · egzamin: Zarządzanie · podr.: zarządzanie · EN: management","q":"Jak brzmi definicja Zarządzania?","a":"Zarządzanie (management) planuje, buduje, wykonuje i monitoruje działania zgodnie z kierunkiem wskazanym przez organ Ładu, aby osiągnąć cele organizacji. Zwykle odpowiada za nie kadra zarządzająca (executive management) pod przywództwem CEO (Chief Executive Officer — dyrektor generalny). To odmienna odpowiedzialność od Ładu sprawowanego przez board (organ Ładu; podr. zarząd) pod przewodnictwem chair (przewodniczący).","ex":"Ekipa planuje dom, buduje go, zapewnia codzienne użytkowanie i utrzymanie, a potem sprawdza wyniki – tak, jak zdecydował inwestor (Ład). Run = bieżące działanie, nie tylko oddanie do użytku. Haczyk: PBRM (Plan, Build, Run and Monitor — Planuj, Wytwarzaj/Twórz, Wykonuj i Monitoruj) – Plan, Build, Run, Monitor.","org":"dyrektor IT (Information Technology — technologie informacyjne) i zespół wdrażają procedurę."}},"fz-B-011":{"id":"fz-B-011","typ":"egzamin","s":"PR-02-14","t":"Co według definicji COBIT 5 robi Ład?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 14","FW-PL s. 31","Altkom — Różnice tłumaczenia PL, s. 1"],"r":null,"zap":"","scen":"","o":[{"t":"Planuje, buduje, uruchamia i monitoruje działania","ok":false,"w":"To Zarządzanie (PBRM (Plan, Build, Run and Monitor — Planuj, Wytwarzaj/Twórz, Wykonuj i Monitoruj))."},{"t":"Na co dzień rozpoznaje, ocenia i ogranicza ryzyko IT","ok":false,"w":"To APO12 (Manage Risk — Zarządzanie ryzykiem), proces Zarządzania."},{"t":"Ocenia potrzeby, wyznacza kierunek i monitoruje wyniki oraz zgodność","ok":true,"w":"Ład (governance; podr. nadzór) zapewnia ocenę potrzeb, warunków i opcji interesariuszy w celu ustalenia zrównoważonych, uzgodnionych celów organizacji. Wyznacza kierunek przez priorytety i decyzje oraz monitoruje wyniki i zgodność z uzgodnionym kierunkiem i celami. Zwykle odpowiada za niego organ Ładu — board (organ Ładu; podr. zarząd) pod przewodnictwem chair (przewodniczący). Podręcznik PL oddaje to jako „zarząd pod przywództwem prezesa”; nie należy z tego wyprowadzać uniwersalnego podziału prawnego polskich organów spółki. Zarządzanie należy zwykle do kadry zarządzającej pod przywództwem dyrektora generalnego."},{"t":"Buduje lub nabywa rozwiązania i wdraża zmiany","ok":false,"w":"To domena BAI (Build, Acquire and Implement — Twórz, Nabywaj i Wdrażaj) w Zarządzaniu."}],"fz":{"h":"Ład","p":"P1","pulapka":true,"n":"≠ TŁUMACZENIE · egzamin: Ład · podr.: nadzór · EN: governance","q":"Jak brzmi definicja Ładu?","a":"Ład (governance; podr. nadzór) zapewnia ocenę potrzeb, warunków i opcji interesariuszy w celu ustalenia zrównoważonych, uzgodnionych celów organizacji. Wyznacza kierunek przez priorytety i decyzje oraz monitoruje wyniki i zgodność z uzgodnionym kierunkiem i celami. Zwykle odpowiada za niego organ Ładu — board (organ Ładu; podr. zarząd) pod przewodnictwem chair (przewodniczący). Podręcznik PL oddaje to jako „zarząd pod przywództwem prezesa”; nie należy z tego wyprowadzać uniwersalnego podziału prawnego polskich organów spółki. Zarządzanie należy zwykle do kadry zarządzającej pod przywództwem dyrektora generalnego.","ex":"Trzy ruchy właściciela: wysłuchaj, czego chcą goście i wspólnicy (oceń), wybierz kierunek (kieruj), sprawdzaj, czy kuchnia go trzyma (monitoruj). Interesariusz = każdy, komu zależy.","org":"kierownictwo organizacji zatwierdza progi ryzyka."}},"fz-B-012":{"id":"fz-B-012","typ":"egzamin","s":"PR-02-14","t":"Kto zwykle odpowiada za Ład?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 14"],"r":null,"zap":"","scen":"","o":[{"t":"Zarząd pod przywództwem prezesa (przewodniczącego)","ok":true,"w":"Tak: Ład sprawuje zarząd z prezesem."},{"t":"Kadra zarządzająca pod przywództwem CEO","ok":false,"w":"Ona odpowiada za Zarządzanie."},{"t":"Dyrektor IT ze swoim zespołem","ok":false,"w":"W przykładzie z fiszek dyrektor IT i zespół wdrażają procedurę, czyli działają w Zarządzaniu."},{"t":"Interesariusze zewnętrzni, np. organy regulacyjne","ok":false,"w":"Interesariusze zgłaszają potrzeby, ale Ład sprawuje zarząd."}],"fz":{"h":"Kto odpowiada za Ład i Zarządzanie","p":"P1","pulapka":false,"n":"EN: Board under the chair; executive management under the CEO","q":"Kto zwykle odpowiada za Ład, a kto za Zarządzanie?","a":"Ład: zarząd pod przywództwem prezesa (przewodniczącego). Zarządzanie: kadra zarządzająca pod przywództwem CEO.","ex":"Klub sportowy: zarząd z prezesem ustala, dokąd zmierza klub (Ład), a dyrektor z trenerami prowadzi drużynę na co dzień (Zarządzanie). CEO = dyrektor generalny.","org":""}},"fz-B-013":{"id":"fz-B-013","typ":"egzamin","s":"PR-02-15","t":"Jak przebiega przepływ w kluczowych obszarach Ładu i Zarządzania (Rysunek 15)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 32"],"r":null,"zap":"","scen":"","o":[{"t":"Potrzeby biznesowe → Zarządzanie → Ład, który wykonuje zaplanowane działania","ok":false,"w":"Odwrotnie: Ład wyznacza kierunek, a Zarządzanie go realizuje."},{"t":"Ład → Zarządzanie, bez informacji zwrotnej","ok":false,"w":"Informacje zwrotne z Zarządzania wracają do Ładu; koło się zamyka."},{"t":"Zarządzanie → potrzeby biznesowe → Ład","ok":false,"w":"Przepływ zaczyna się od potrzeb biznesowych trafiających do Ładu."},{"t":"Potrzeby biznesowe → Ład → Zarządzanie → informacje zwrotne do Ładu","ok":true,"w":"Potrzeby biznesowe → Ład: Oszacuj, Kieruj, Monitoruj → Zarządzanie: Planuj (APO (Align, Plan and Organise — Dostosuj, Planuj i Organizuj)), Twórz (BAI (Build, Acquire and Implement — Twórz, Nabywaj i Wdrażaj)), Wykonuj (DSS (Deliver, Service and Support — Dostarczaj, Obsługuj i Wspieraj)), Monitoruj (MEA (Monitor, Evaluate and Assess — Monitoruj, Oszacuj i Oceń)) → informacje zwrotne z Zarządzania wracają do Ładu."}],"fz":{"h":"Przepływ Ład–Zarządzanie (Rysunek 15)","p":"P1","pulapka":false,"n":"EN: Key governance and management areas","q":"Opisz przepływ w kluczowych obszarach Ładu i Zarządzania (Rysunek 15).","a":"Potrzeby biznesowe → Ład: Oszacuj, Kieruj, Monitoruj → Zarządzanie: Planuj (APO (Align, Plan and Organise — Dostosuj, Planuj i Organizuj)), Twórz (BAI (Build, Acquire and Implement — Twórz, Nabywaj i Wdrażaj)), Wykonuj (DSS (Deliver, Service and Support — Dostarczaj, Obsługuj i Wspieraj)), Monitoruj (MEA (Monitor, Evaluate and Assess — Monitoruj, Oszacuj i Oceń)) → informacje zwrotne z Zarządzania wracają do Ładu.","ex":"Jak sztafeta: potrzeby firmy trafiają do zarządu, ten wskazuje kierunek, kierownicy planują, budują, prowadzą i sprawdzają, a raporty wracają do zarządu. Koło się zamyka.","org":""}},"fz-B-014":{"id":"fz-B-014","typ":"egzamin","s":"PR-02-15","t":"Co oznacza „monitorowanie” w domenie Ładu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 32"],"r":null,"zap":"","scen":"","o":[{"t":"Sprawdzanie przez organ Ładu, w jakim stopniu Zarządzanie wcieliło w życie wyznaczony kierunek","ok":true,"w":"Działania, w których organ Ładu sprawdza, w jakim stopniu wyznaczony kierunek został wcielony w życie przez Zarządzanie."},{"t":"Comiesięczny raport z liczbami przygotowany w procesie MEA01","ok":false,"w":"To monitorowanie w Zarządzaniu (MEA (Monitor, Evaluate and Assess — Monitoruj, Oszacuj i Oceń)), nie w Ładzie."},{"t":"Monitorowanie i ocena całego systemu kontroli wewnętrznej","ok":false,"w":"To proces Zarządzania MEA02 (Monitor, Evaluate and Assess the System of Internal Control — Monitorowanie, ocena i oszacowanie systemu kontroli wewnętrznej)."},{"t":"Codzienna obsługa zgłoszeń i incydentów","ok":false,"w":"To DSS02 (Manage Service Requests and Incidents — Zarządzanie zgłoszeniami serwisowymi i incydentami), proces Zarządzania."}],"fz":{"h":"Monitorowanie w domenie Ładu","p":"P2","pulapka":false,"n":"EN: Monitor in governance domain","q":"Co oznacza „monitorowanie” w domenie Ładu?","a":"Działania, w których organ Ładu sprawdza, w jakim stopniu wyznaczony kierunek został wcielony w życie przez Zarządzanie.","ex":"Jak inwestor, który zagląda na budowę i sprawdza, czy ekipa robi to, co zlecił. Sam nie kładzie cegieł, tylko porównuje efekt z planem.","org":""}},"fz-B-015":{"id":"fz-B-015","typ":"egzamin","s":"PR-02-15","t":"Jak procesy i informacje łączą Ład z Zarządzaniem (Rysunek 14)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 31"],"r":null,"zap":"","scen":"","o":[{"t":"Wszystkie procesy są wspólne dla Ładu i Zarządzania, więc RACI nie jest potrzebna","ok":false,"w":"Model rozróżnia procesy Ładu i Zarządzania, a RACI (Responsible, Accountable, Consulted, Informed — Odpowiedzialny, Rozliczany, Konsultowany, Informowany) mówi, kto za co odpowiada."},{"t":"Przez odrębne procesy, RACI oraz wymianę informacji między praktykami","ok":true,"w":"Procesy: model rozróżnia procesy Ładu i Zarządzania, a tabele RACI (Responsible, Accountable, Consulted, Informed — Odpowiedzialny, Rozliczany, Konsultowany, Informowany) wskazują, kto za co odpowiada. Informacje: procesy wymieniają informacje i produkty pracy na wejściach i wyjściach praktyk (np. dokumenty, raporty, dane, decyzje)."},{"t":"Informacje płyną tylko od Ładu do Zarządzania","ok":false,"w":"Informacje płyną w obie strony: raporty wracają do Ładu."},{"t":"Łączy je przede wszystkim przykład dawany przez przywódców","ok":false,"w":"To opis interakcji przez kulturę i zachowanie, nie przez procesy i informacje."}],"fz":{"h":"Interakcje: procesy i informacje (Rysunek 14)","p":"P2","pulapka":false,"n":"EN: Interactions: processes, information","q":"Jak procesy i informacje łączą Ład z Zarządzaniem (Rysunek 14)?","a":"Procesy: model rozróżnia procesy Ładu i Zarządzania, a tabele RACI (Responsible, Accountable, Consulted, Informed — Odpowiedzialny, Rozliczany, Konsultowany, Informowany) wskazują, kto za co odpowiada. Informacje: procesy wymieniają informacje i produkty pracy na wejściach i wyjściach praktyk (np. dokumenty, raporty, dane, decyzje).","ex":"Szkoła: dyrekcja i nauczyciele mają osobne zadania, a tabela RACI (Responsible, Accountable, Consulted, Informed — Odpowiedzialny, Rozliczany, Konsultowany, Informowany) mówi, kto za co odpowiada. Łączy ich obieg informacji: plan lekcji i decyzje idą w dół, oceny i raporty wracają w górę.","org":""}},"fz-B-016":{"id":"fz-B-016","typ":"egzamin","s":"PR-02-15","t":"Jak według COBIT 5 kształtuje się zachowanie w relacji Ład–Zarządzanie?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 31"],"r":null,"zap":"","scen":"","o":[{"t":"Oddolnie – pracownicy ustalają normy, a zarząd je przejmuje","ok":false,"w":"Rysunek 14 wskazuje odgórny przykład przywódców jako kluczową interakcję Ładu i Zarządzania przez kulturę i zachowanie. Nie jest to twierdzenie, że w rzeczywistości normy nigdy nie powstają oddolnie."},{"t":"Wyłącznie przez polityki, bez wpływu przywódców","ok":false,"w":"Polityki utrwalają decyzje Ładu, ale zachowanie kształtuje przykład przywódców."},{"t":"Przez tabelę RACI, która przypisuje zachowania","ok":false,"w":"RACI (Responsible, Accountable, Consulted, Informed — Odpowiedzialny, Rozliczany, Konsultowany, Informowany) przypisuje odpowiedzialność za praktyki, a nie kształtuje kultury."},{"t":"Odgórnie – przywódcy dają przykład","ok":true,"w":"Struktury należą do Ładu lub Zarządzania zależnie od składu i zakresu decyzji. Zasady i polityki zamieniają decyzje Ładu w stałe reguły. Zachowanie kształtuje się odgórnie: przywódcy dają przykład."}],"fz":{"h":"Interakcje: struktury, polityki, kultura","p":"P2","pulapka":false,"n":"EN: Interactions: structures, principles/policies, culture","q":"Jak struktury, polityki i kultura łączą Ład z Zarządzaniem?","a":"Struktury należą do Ładu lub Zarządzania zależnie od składu i zakresu decyzji. Zasady i polityki zamieniają decyzje Ładu w stałe reguły. Zachowanie kształtuje się odgórnie: przywódcy dają przykład.","ex":"Szkoła: rada pedagogiczna to struktura, regulamin utrwala decyzje dyrekcji, a uczniowie zachowują się tak, jak dyrektor daje przykład. Kultura płynie z góry.","org":""}},"fz-B-017":{"id":"fz-B-017","typ":"egzamin","s":"PR-02-15","t":"Od czego zależy, czy struktura organizacyjna należy do Ładu, czy do Zarządzania?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 31"],"r":null,"zap":"","scen":"","o":[{"t":"Od składu struktury i zakresu podejmowanych przez nią decyzji","ok":true,"w":"Struktury należą do Ładu lub Zarządzania zależnie od składu i zakresu decyzji. Zasady i polityki zamieniają decyzje Ładu w stałe reguły. Zachowanie kształtuje się odgórnie: przywódcy dają przykład."},{"t":"Wszystkie struktury organizacyjne należą do Zarządzania","ok":false,"w":"Struktury mogą należeć do Ładu lub do Zarządzania."},{"t":"Od poziomu zdolności procesów, za które odpowiada","ok":false,"w":"Poziom zdolności dotyczy oceny procesów, a nie przynależności struktur."},{"t":"Od tego, czy jest wpisana jako C lub I w tabeli RACI","ok":false,"w":"Litery RACI (Responsible, Accountable, Consulted, Informed — Odpowiedzialny, Rozliczany, Konsultowany, Informowany) opisują udział w praktykach, a nie przynależność struktury."}],"fz":{"h":"Interakcje: struktury, polityki, kultura","p":"P2","pulapka":false,"n":"EN: Interactions: structures, principles/policies, culture","q":"Jak struktury, polityki i kultura łączą Ład z Zarządzaniem?","a":"Struktury należą do Ładu lub Zarządzania zależnie od składu i zakresu decyzji. Zasady i polityki zamieniają decyzje Ładu w stałe reguły. Zachowanie kształtuje się odgórnie: przywódcy dają przykład.","ex":"Szkoła: rada pedagogiczna to struktura, regulamin utrwala decyzje dyrekcji, a uczniowie zachowują się tak, jak dyrektor daje przykład. Kultura płynie z góry.","org":""}},"fz-B-018":{"id":"fz-B-018","typ":"egzamin","s":"PR-02-15","t":"Jaką rolę w relacji Ład–Zarządzanie pełnią usługi, aplikacje i infrastruktura?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 31"],"r":null,"zap":"","scen":"","o":[{"t":"Wyznaczają kierunek przez priorytety i decyzje","ok":false,"w":"To zadanie organu Ładu, nie usług."},{"t":"Dostarczają organowi Ładu informacji do oceny, kierowania i monitorowania","ok":true,"w":"Ludzie: obie role wymagają innych umiejętności, ale kluczowe jest rozumienie obu zadań i różnic. Usługi, aplikacje i infrastruktura dostarczają organowi Ładu informacji do oceny, kierowania i monitorowania."},{"t":"Służą wyłącznie Zarządzaniu i nie mają związku z Ładem","ok":false,"w":"Usługi, aplikacje i infrastruktura wspierają także Ład: dostarczają organowi Ładu informacji do oceny, kierowania i monitorowania. Ich rola nie ogranicza się do Zarządzania."},{"t":"Określają, kto jest R, A, C i I w praktykach","ok":false,"w":"To rola tabel RACI (Responsible, Accountable, Consulted, Informed — Odpowiedzialny, Rozliczany, Konsultowany, Informowany)."}],"fz":{"h":"Interakcje: ludzie i usługi","p":"P2","pulapka":false,"n":"EN: Interactions: people, services","q":"Jak ludzie i usługi łączą Ład z Zarządzaniem?","a":"Ludzie: obie role wymagają innych umiejętności, ale kluczowe jest rozumienie obu zadań i różnic. Usługi, aplikacje i infrastruktura dostarczają organowi Ładu informacji do oceny, kierowania i monitorowania.","ex":"Szpital: dyrektor i chirurg potrzebują innych umiejętności, ale każdy musi rozumieć pracę drugiego. A system z wynikami leczenia daje dyrektorowi dane do decyzji.","org":""}},"fz-B-019":{"id":"fz-B-019","typ":"egzamin","s":"PR-01-03,PR-01-04","t":"Która para „kod domeny – nazwa egzaminacyjna” jest poprawna?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 32"],"r":null,"zap":"","scen":"","o":[{"t":"DSS – Dostosuj, Planuj i Organizuj","ok":false,"w":"To nazwa APO; DSS to Dostarczaj, Obsługuj i Wspieraj."},{"t":"BAI – Monitoruj, Oszacuj i Oceń","ok":false,"w":"To nazwa MEA; BAI to Twórz, Nabywaj i Wdrażaj."},{"t":"MEA – Monitoruj, Oszacuj i Oceń","ok":true,"w":"Tak: to egzaminacyjna nazwa MEA."},{"t":"APO – Oszacuj, Kieruj i Monitoruj","ok":false,"w":"To nazwa EDM; APO to Dostosuj, Planuj i Organizuj."}],"fz":{"h":"Pięć domen PRM (nazwy egzaminacyjne)","p":"P1","pulapka":false,"n":"EN: Evaluate, Direct and Monitor; Align, Plan and Organise; Build, Acquire and Implement; Deliver, Service and Support; Monitor, Evaluate and Assess","q":"Podaj nazwy pięciu domen (nazwy egzaminacyjne).","a":"EDM – Oszacuj, Kieruj i Monitoruj; APO – Dostosuj, Planuj i Organizuj; BAI – Twórz, Nabywaj i Wdrażaj; DSS – Dostarczaj, Obsługuj i Wspieraj; MEA – Monitoruj, Oszacuj i Oceń.","ex":"Kolejność jak w życiu: szef ocenia (EDM), potem plan (APO), budowa (BAI), codzienna obsługa (DSS), kontrola (MEA). Haczyk na kolejność liter: Ela, Ania, Basia, Dorota, Monika.","org":""}},"fz-B-020":{"id":"fz-B-020","typ":"egzamin","s":"PR-01-03","t":"Który z poniższych NIE jest procesem domeny EDM?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 33","Enabling Processes — EDM01, s. 27"],"r":null,"zap":"","scen":"","o":[{"t":"Zarządzanie ryzykiem","ok":true,"w":"Zarządzanie ryzykiem to APO12 — Manage Risk, proces Zarządzania. W domenie Ładu jest EDM03 — Ensure Risk Optimisation, Zapewnienie optymalizacji ryzyka. Różnica dotyczy odpowiedzialności: bieżące zarządzanie ryzykiem a ocena, kierowanie i monitorowanie jego optymalizacji."},{"t":"Zapewnienie realizacji korzyści","ok":false,"w":"To EDM02 (Ensure Benefits Delivery — Zapewnienie realizacji korzyści)."},{"t":"Zapewnienie optymalizacji zasobów","ok":false,"w":"To EDM04 (Ensure Resource Optimisation — Zapewnienie optymalizacji zasobów)."},{"t":"Zapewnienie transparentności interesariuszy","ok":false,"w":"To EDM05 (Ensure Stakeholder Transparency — Zapewnienie transparentności interesariuszy)."}],"fz":{"h":"Pięć procesów EDM","p":"P1","pulapka":false,"n":"EDM — Evaluate, Direct and Monitor — Oszacuj, Kieruj i Monitoruj. 5 procesów.","q":"Podaj pięć procesów domeny EDM.","a":"EDM01 — Zapewnienie ustanowienia i utrzymania struktury ramowej Ładu (Ensure Governance Framework Setting and Maintenance); EDM02 — Zapewnienie realizacji korzyści (Ensure Benefits Delivery); EDM03 — Zapewnienie optymalizacji ryzyka (Ensure Risk Optimisation); EDM04 — Zapewnienie optymalizacji zasobów (Ensure Resource Optimisation); EDM05 — Zapewnienie transparentności interesariuszy (Ensure Stakeholder Transparency). Podręcznik skraca nazwę EDM01 do „Zapewnienie i utrzymanie ładu korporacyjnego”; pełna nazwa dotyczy ustanowienia i utrzymania struktury ramowej Ładu.","ex":"Pięć trosk właściciela: 01 reguły gry, 02 czy się opłaca, 03 czy nie za ryzykownie, 04 czy starczy ludzi i pieniędzy, 05 czy wszyscy zainteresowani wiedzą, co się dzieje.","org":""}},"fz-B-021":{"id":"fz-B-021","typ":"egzamin","s":"PR-01-03,PR-01-04","t":"Czy model procesów COBIT 5 jest normatywny (obowiązkowy jeden do jednego)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 32"],"r":null,"zap":"","scen":"","o":[{"t":"Tak – każda organizacja musi wdrożyć wszystkie 37 procesów","ok":false,"w":"Model nie jest normatywny; mniejsza organizacja może mieć mniej procesów."},{"t":"Tak – ale obowiązkowe są tylko procesy Ładu (EDM)","ok":false,"w":"Żadna część modelu nie jest normatywna."},{"t":"Nie – bo nie obejmuje całego IT i trzeba go uzupełniać","ok":false,"w":"Model jest kompletny, a procesy Zarządzania razem obejmują całe IT (Information Technology — technologie informacyjne)."},{"t":"Nie — organizacja może inaczej ułożyć procesy pokrywające konieczne cele Ładu i Zarządzania","ok":true,"w":"Model referencyjny jest kompletny i kompleksowy, lecz nie jest jedynym dopuszczalnym modelem. Organizacja definiuje własny zestaw procesów stosownie do swojej działalności, tak aby obejmowały wszystkie konieczne dla niej cele Ładu i Zarządzania. Mniejsza organizacja może mieć mniej procesów niż katalog 37. Nie oznacza to pomijania koniecznych celów ani obowiązku wdrażania wszystkich procesów jeden do jednego."}],"fz":{"h":"Czy model procesów jest normatywny","p":"P2","pulapka":false,"n":"EN: Not prescriptive","q":"Czy model procesów COBIT 5 jest normatywny?","a":"Model referencyjny jest kompletny i kompleksowy, lecz nie jest jedynym dopuszczalnym modelem. Organizacja definiuje własny zestaw procesów stosownie do swojej działalności, tak aby obejmowały wszystkie konieczne dla niej cele Ładu i Zarządzania. Mniejsza organizacja może mieć mniej procesów niż katalog 37. Nie oznacza to pomijania koniecznych celów ani obowiązku wdrażania wszystkich procesów jeden do jednego.","ex":"Normatywny = obowiązkowy jeden do jednego. COBIT daje pełne menu, ale mała kawiarnia może podać mniej dań, byle wszyscy goście (cele) zostali obsłużeni.","org":""}},"fz-B-022":{"id":"fz-B-022","typ":"egzamin","s":"PR-01-03","t":"Jakie praktyki zdefiniowano w każdym z pięciu procesów Ładu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 32"],"r":null,"zap":"","scen":"","o":[{"t":"Planuj, Twórz, Wykonuj i Monitoruj","ok":false,"w":"To obszary działań Zarządzania (PBRM (Plan, Build, Run and Monitor — Planuj, Wytwarzaj/Twórz, Wykonuj i Monitoruj))."},{"t":"Oszacuj, Kieruj i Monitoruj (EDM)","ok":true,"w":"Praktyki Oszacuj, Kieruj i Monitoruj (EDM (Evaluate, Direct and Monitor — Oszacuj, Kieruj i Monitoruj)) – w każdym z pięciu procesów Ładu."},{"t":"Odpowiedzialny, Rozliczany, Konsultowany, Informowany","ok":false,"w":"To role w tabeli RACI (Responsible, Accountable, Consulted, Informed — Odpowiedzialny, Rozliczany, Konsultowany, Informowany), nie praktyki."},{"t":"Planowanie, projektowanie, budowanie, użytkowanie, ocena, aktualizacja","ok":false,"w":"To cykl życia aktywatora."}],"fz":{"h":"Praktyki w procesach Ładu","p":"P2","pulapka":false,"n":"EN: EDM (Evaluate, Direct and Monitor — Oszacuj, Kieruj i Monitoruj) practices within each governance process","q":"Jakie praktyki zdefiniowano w każdym procesie Ładu?","a":"Praktyki Oszacuj, Kieruj i Monitoruj (EDM (Evaluate, Direct and Monitor — Oszacuj, Kieruj i Monitoruj)) – w każdym z pięciu procesów Ładu.","ex":"Każdy z pięciu procesów Ładu powtarza ten sam trójkrok właściciela: oceń, wskaż kierunek, sprawdź. Haczyk: EDM (Evaluate, Direct and Monitor — Oszacuj, Kieruj i Monitoruj) w każdym EDM.","org":""}},"fz-B-023":{"id":"fz-B-023","typ":"egzamin","s":"PR-02-14","t":"Czym przede wszystkim różnią się procesy Ładu od procesów Zarządzania?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 71"],"r":null,"zap":"","scen":"","o":[{"t":"Celami: Ład dąży do celów interesariuszy (wartość, optymalizacja ryzyka i zasobów), a Zarządzanie w obszarach PBRM obejmuje całe IT","ok":true,"w":"Tak: karta wskazuje, że różnią się celami."},{"t":"Tym, że procesy Ładu nie mają praktyk","ok":false,"w":"Każdy proces Ładu ma praktyki EDM."},{"t":"Tym, że procesy Zarządzania nie mają tabel RACI","ok":false,"w":"Każdy proces COBIT 5 ma RACI."},{"t":"Tym, że procesy Ładu są obowiązkowe, a procesy Zarządzania opcjonalne","ok":false,"w":"Model procesów w ogóle nie jest normatywny."}],"fz":{"h":"Procesy Ładu a procesy Zarządzania","p":"P1","pulapka":true,"n":"EN: Governance vs management processes","q":"Czym różnią się procesy Ładu od procesów Zarządzania?","a":"Celami. Ład: cele interesariuszy – dostarczanie wartości, optymalizacja ryzyka i zasobów (przez ocenę, kierowanie, monitorowanie). Zarządzanie: obszary PBRM, które razem obejmują całe IT.","ex":"Ład pilnuje, by firma dawała wartość bez zbędnego ryzyka i marnowania pieniędzy i ludzi. Zarządzanie obejmuje całą robotę z IT: plan, budowę, obsługę i kontrolę.","org":""}},"fz-B-024":{"id":"fz-B-024","typ":"egzamin","s":"EN-02-07","t":"Który z poniższych to interesariusz WEWNĘTRZNY procesu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 69"],"r":null,"zap":"","scen":"","o":[{"t":"Klienci","ok":false,"w":"To interesariusz zewnętrzny."},{"t":"Organy regulacyjne","ok":false,"w":"To interesariusz zewnętrzny."},{"t":"Pracownicy","ok":true,"w":"Tak: wewnętrzni to zarząd, kierownictwo, pracownicy i wolontariusze."},{"t":"Partnerzy biznesowi","ok":false,"w":"To interesariusz zewnętrzny."}],"fz":{"h":"Interesariusze procesów","p":"P2","pulapka":false,"n":"EN: Process stakeholders","q":"Kim są interesariusze procesów?","a":"Zewnętrzni: klienci, partnerzy biznesowi, udziałowcy, organy regulacyjne. Wewnętrzni: zarząd, kierownictwo, pracownicy, wolontariusze. Ich role opisuje tabela RACI.","ex":"Interesariusz = każdy, kogo proces dotyczy. W szkole z zewnątrz: rodzice, kuratorium, sponsorzy; od środka: dyrekcja, nauczyciele, woźny. RACI mówi, kto co robi.","org":""}},"fz-B-025":{"id":"fz-B-025","typ":"egzamin","s":"EN-02-08","t":"Czym może być cel procesu (opis pożądanego wyniku)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 69"],"r":null,"zap":"","scen":"","o":[{"t":"Ogólnym uzasadnieniem istnienia procesu","ok":false,"w":"Ogólny powód istnienia procesu to jego przeznaczenie. Cel procesu opisuje konkretny pożądany wynik (podręcznik, s.69)."},{"t":"Krokami potrzebnymi do wdrożenia praktyki","ok":false,"w":"Kroki wdrożenia praktyki to działania procesu, a nie jego pożądany wynik (s.70)."},{"t":"Jednostką pomiaru realizacji celu procesu","ok":false,"w":"Jednostką pomiaru jest miernik, który pozwala ocenić stopień osiągnięcia celu; nie jest samym celem (s.69)."},{"t":"Wytworem, zmianą stanu lub poprawą zdolności","ok":true,"w":"Cel procesu opisuje pożądany wynik: wytwór, np. dokument, istotną zmianę stanu albo istotną poprawę zdolności innych procesów (s.69)."}],"fz":{"h":"Cel procesu","p":"P2","pulapka":true,"n":"EN: Process goal","q":"Jak definiuje się cel procesu?","a":"Opis pożądanego wyniku procesu: wytwór (podr. pozostałość, artefakt, np. dokument), istotna zmiana stanu lub istotna poprawa zdolności innych procesów.","ex":"Po czym poznasz, że proces się udał: powstała rzecz (np. gotowy raport), coś wyraźnie się zmieniło (kran już nie cieknie) albo inne procesy działają lepiej.","org":""}},"fz-B-026":{"id":"fz-B-026","typ":"egzamin","s":"EN-02-08","t":"Na jakie kategorie dzielą się cele procesu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 69"],"r":null,"zap":"","scen":"","o":[{"t":"Cele wewnętrzne, kontekstowe oraz dostępności i bezpieczeństwa","ok":true,"w":"Tak: ta sama logika co cele aktywatora."},{"t":"Interesariusze, cele, cykl życia i dobre praktyki","ok":false,"w":"To cztery wymiary aktywatora."},{"t":"Korzyści, ryzyko i zasoby","ok":false,"w":"To elementy celu Ładu „Tworzenie wartości”."},{"t":"Planowanie, budowanie, uruchamianie i monitorowanie","ok":false,"w":"To obszary działań Zarządzania (PBRM)."}],"fz":{"h":"Cele procesu: kategorie","p":"P1","pulapka":false,"n":"egzamin: cele wewnętrzne, kontekstowe, dostępności · podr.: cele wewnętrzne, kontekstowe, dostępności · EN: intrinsic, contextual, accessibility and security goals","q":"Jakie kategorie celów ma proces?","a":"Cele wewnętrzne, cele kontekstowe, cele dostępności i bezpieczeństwa (ta sama logika co cele aktywatora).","ex":"Te same trzy szuflady co u aktywatorów: czy proces jest dobrze zrobiony (wewnętrzne), czy pasuje do potrzeb (kontekstowe), czy jest dostępny i chroniony (dostępność i bezpieczeństwo).","org":"kontekstowy cel DSS02: obsługa zgłoszeń dopasowana do godzin pracy komend i zrozumiała dla ich użytkowników."}},"fz-B-027":{"id":"fz-B-027","typ":"egzamin","s":"EN-02-08","t":"Pytanie „czy proces jest poufny, gdy trzeba, oraz znany i dostępny dla potrzebujących?” dotyczy której kategorii celów procesu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 69"],"r":null,"zap":"","scen":"","o":[{"t":"Celów wewnętrznych","ok":false,"w":"Te pytają o jakość wewnętrzną i zgodność z dobrą praktyką i regułami."},{"t":"Celów kontekstowych","ok":false,"w":"Te pytają, czy proces jest dopasowany, zrozumiały i łatwy w użyciu."},{"t":"Celów dostępności i bezpieczeństwa","ok":true,"w":"Tak: poufność i dostępność dla potrzebujących to ta kategoria."},{"t":"Wskaźników wiodących","ok":false,"w":"To mierniki stosowania praktyk, a nie kategoria celów procesu."}],"fz":{"h":"Kategorie celów procesu","p":"P1","pulapka":false,"n":"EN: Intrinsic, contextual, accessibility and security goals","q":"Podaj kategorie celów procesu z przykładowymi pytaniami.","a":"Cele wewnętrzne: czy proces ma jakość wewnętrzną, jest zgodny z dobrą praktyką i regułami? Cele kontekstowe: czy jest dopasowany, zrozumiały, łatwy w użyciu? Cele dostępności i bezpieczeństwa: poufny, gdy trzeba, znany i dostępny dla potrzebujących.","ex":"Jak ocena restauracji: wewnętrzne – czy kuchnia trzyma standard; kontekstowe – czy danie pasuje gościowi; dostępność i bezpieczeństwo – czy trafia na czas do właściwego stolika.","org":""}},"fz-B-028":{"id":"fz-B-028","typ":"egzamin","s":"EN-02-08","t":"Co oznacza litera A w kryteriach SMART dla mierników procesu w COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 69"],"r":null,"zap":"","scen":"","o":[{"t":"Achievable","ok":false,"w":"To popularne rozwinięcie, ale w COBIT 5 A = Actionable."},{"t":"Actionable","ok":true,"w":"Tak: to pułapka z karty, w COBIT 5 A = Actionable."},{"t":"Accountable","ok":false,"w":"To litera A w RACI (Responsible, Accountable, Consulted, Informed — odpowiedzialny wykonawczo, odpowiedzialny decyzyjnie, konsultowany, informowany), nie w SMART (Specific, Measurable, Actionable, Relevant, Timely — specyficzne, mierzalne, umożliwiające podjęcie działań, istotne i terminowe)."},{"t":"Accessible","ok":false,"w":"Dostępność to kategoria celów procesu, a nie kryterium SMART (Specific, Measurable, Actionable, Relevant, Timely — specyficzne, mierzalne, umożliwiające podjęcie działań, istotne i terminowe)."}],"fz":{"h":"Mierniki procesu: SMART","p":"P2","pulapka":true,"n":"EN: SMART metrics","q":"Jakie kryteria powinny spełniać mierniki procesu?","a":"SMART: specyficzne, mierzalne (podr. wymierne), składające się z konkretnych działań (EN actionable – da się na ich podstawie działać), istotne, terminowe. Pułapka: w COBIT 5 A = Actionable, nie popularne Achievable (osiągalne).","ex":"Jak cel odchudzania: „schudnę 3 kg do 1 czerwca, chodząc codziennie 5 km” – konkretny, mierzalny, wiadomo, co robić, ma sens i termin. „Chcę być fit” nie jest SMART.","org":""}},"fz-B-029":{"id":"fz-B-029","typ":"egzamin","s":"EN-02-09","t":"Jaki jest cykl życia procesu w COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 70"],"r":null,"zap":"","scen":"","o":[{"t":"Siedem faz wdrożenia, od wyznaczników do utrzymania motywacji","ok":false,"w":"To fazy cyklu życia wdrożenia, nie cykl życia procesu."},{"t":"Ocena, kierowanie i monitorowanie","ok":false,"w":"To działania Ładu (EDM (Evaluate, Direct and Monitor — Oszacuj, Kieruj i Monitoruj))."},{"t":"Definiowanie, tworzenie, obsługa, monitorowanie oraz dostosowanie/aktualizacja lub wycofanie","ok":true,"w":"Proces ma własny cykl życia: jest definiowany, tworzony, obsługiwany, monitorowany, a następnie dostosowywany lub aktualizowany albo wycofywany. Nie jest to siedem faz wdrażania COBIT 5 (s.70)."},{"t":"Planowanie, wytwarzanie, wykonywanie i monitorowanie","ok":false,"w":"To obszary działań Zarządzania (PBRM (Plan, Build, Run and Monitor — Planuj, Wytwarzaj, Wykonuj i Monitoruj))."}],"fz":{"h":"Cykl życia procesu","p":"P2","pulapka":false,"n":"EN: Process life cycle","q":"Jaki jest cykl życia procesu?","a":"Proces jest definiowany, tworzony, obsługiwany, monitorowany oraz dostosowywany/aktualizowany lub wycofywany.","ex":"Jak sklep: pomysł (definiowanie), otwarcie (tworzenie), codzienna praca (obsługa), liczenie utargu (monitorowanie), potem remont albo zamknięcie (dostosowanie lub wycofanie).","org":""}},"fz-B-030":{"id":"fz-B-030","typ":"egzamin","s":"EN-02-10","t":"Czym jest praktyka Ładu lub Zarządzania?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 70","FW-PL s. 91"],"r":null,"zap":"","scen":"","o":[{"t":"Szczegółową procedurą, którą wdraża się bez zmian","ok":false,"w":"Praktyki są ogólne i trzeba je dopasować do organizacji."},{"t":"Kompletnym zbiorem wymagań procesu zawartym w jednym punkcie","ok":false,"w":"Dopiero zestaw praktyk procesu daje kompletny zbiór wymagań."},{"t":"Produktem pracy na wejściu lub wyjściu procesu","ok":false,"w":"To wejścia i wyjścia."},{"t":"Ogólną deklaracją działania organu Ładu lub kierownictwa w procesie, którą trzeba dopasować do organizacji","ok":true,"w":"Tak: tak definiuje ją karta."}],"fz":{"h":"Praktyka Ładu/Zarządzania","p":"P1","pulapka":true,"n":"EN: Governance/management practice","q":"Czym jest praktyka Ładu/Zarządzania?","a":"Ogólna deklaracja działania organu Ładu lub kierownictwa w danym procesie. Dopiero zestaw praktyk procesu daje kompletny zbiór ogólnych wymagań. Praktyki są ogólne, więc trzeba je dopasować do organizacji.","ex":"Praktyka to jeden punkt z listy kontrolnej pilota; dopiero cała lista mówi, co musi być zrobione. Lista jest uniwersalna, więc każda linia lotnicza dopasowuje ją do siebie.","org":""}},"fz-B-031":{"id":"fz-B-031","typ":"egzamin","s":"EN-02-10","t":"Który z poniższych NIE jest wyborem organu Ładu i kierownictwa co do praktyk?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 70"],"r":null,"zap":"","scen":"","o":[{"t":"Wdrożenie wszystkich praktyk COBIT 5 bez zmian, bo są obowiązkowe","ok":true,"w":"Praktyki można wybierać i dostosowywać, a nawet świadomie ich nie wdrożyć."},{"t":"Dodanie lub dostosowanie praktyk","ok":false,"w":"To jeden z wyborów wymienionych na karcie."},{"t":"Wybór częstotliwości, zakresu i stopnia automatyzacji wdrożenia","ok":false,"w":"To wybór sposobu wdrożenia, wymieniony na karcie."},{"t":"Zaakceptowanie ryzyka niewdrożenia praktyki","ok":false,"w":"Tak można zrobić; to świadomy wybór z karty."}],"fz":{"h":"Wybory co do praktyk","p":"P2","pulapka":false,"n":"EN: Choices on practices, incl. accepting the risk of not implementing","q":"Jakie wybory co do praktyk podejmuje organ Ładu i kierownictwo?","a":"Wybierają właściwe praktyki i decydują o wdrożeniu; dodają lub dostosowują praktyki; definiują praktyki spoza IT; wybierają sposób wdrożenia (częstotliwość, zakres, automatyzacja); akceptują ryzyko niewdrożenia praktyki.","ex":"Jak inwestor domu: wybiera z katalogu, dodaje własne pomysły, decyduje, co zautomatyzować, i może świadomie zrezygnować z alarmu, biorąc na siebie ryzyko włamania.","org":""}},"fz-B-032":{"id":"fz-B-032","typ":"egzamin","s":"EN-02-10","t":"Czym są działania procesu w COBIT 5?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 70"],"r":null,"zap":"","scen":"","o":[{"t":"Ogólnymi deklaracjami tego, co trzeba robić w procesie","ok":false,"w":"To praktyki."},{"t":"Koniecznymi i wystarczającymi krokami do wdrożenia praktyki","ok":true,"w":"Tak: to podstawowe czynności obsługi procesu."},{"t":"Produktami pracy umożliwiającymi kluczowe decyzje","ok":false,"w":"To wejścia i wyjścia."},{"t":"Miernikami stosowania praktyk","ok":false,"w":"To wskaźniki wiodące."}],"fz":{"h":"Działania procesu","p":"P1","pulapka":true,"n":"EN: Activities","q":"Czym są działania procesu?","a":"Podstawowymi czynnościami obsługi procesu: koniecznymi i wystarczającymi krokami do wdrożenia praktyki. Uwzględniają wejścia i wyjścia, opierają się na dobrych praktykach, ułatwiają przypisanie ról.","ex":"Działania to kroki przepisu: „rozbij jajka, dodaj mąkę, piecz 40 minut”. Tylko potrzebne, ani jednego za dużo, i wiadomo, kto przy którym stoi.","org":""}},"fz-B-033":{"id":"fz-B-033","typ":"egzamin","s":"EN-02-10","t":"Czy działania procesu COBIT 5 są normatywne?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 70"],"r":null,"zap":"","scen":"","o":[{"t":"Tak – stosuje się je dosłownie jako procedury","ok":false,"w":"Trzeba je dostosować i rozwinąć w procedury organizacji."},{"t":"Tak – ale tylko w procesach Ładu","ok":false,"w":"Działania nie są normatywne w żadnym procesie."},{"t":"Nie – trzeba je dostosować i rozwinąć w konkretne procedury organizacji","ok":true,"w":"Tak: działania to przepis ogólny."},{"t":"Nie – bo COBIT 5 w ogóle nie opisuje działań, tylko praktyki","ok":false,"w":"COBIT 5 opisuje działania, tylko nie są one obowiązkowe."}],"fz":{"h":"Czy działania są normatywne","p":"P2","pulapka":false,"n":"EN: Activities are not prescriptive","q":"Czy działania procesu są normatywne?","a":"Nie. Trzeba je dostosować i rozwinąć w konkretne procedury właściwe dla organizacji.","ex":"Działania z COBIT to przepis ogólny, jak „dopraw do smaku”. Każda kuchnia zapisuje własną dokładną procedurę: ile soli, w jakim garnku.","org":""}},"fz-B-034":{"id":"fz-B-034","typ":"egzamin","s":"EN-02-10","t":"Do czego służą wejścia i wyjścia procesu?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 70"],"r":null,"zap":"","scen":"","o":[{"t":"Określają, kto jest odpowiedzialny wykonawczo i decyzyjnie","ok":false,"w":"To robi tabela RACI (Responsible, Accountable, Consulted, Informed — odpowiedzialny wykonawczo, odpowiedzialny decyzyjnie, konsultowany, informowany)."},{"t":"Opisują ogólny cel, któremu służy proces","ok":false,"w":"To przeznaczenie procesu."},{"t":"Służą tylko wewnątrz jednego procesu i nie trafiają do innych","ok":false,"w":"Często są wejściami innych procesów."},{"t":"Umożliwiają kluczowe decyzje, zostawiają ścieżkę rewizyjną i pozwalają sprawdzić przebieg po incydencie","ok":true,"w":"Tak: to produkty pracy określane dla praktyk."}],"fz":{"h":"Wejścia i wyjścia procesu","p":"P2","pulapka":false,"n":"EN: Inputs and outputs","q":"Czym są wejścia i wyjścia procesu?","a":"Produktami pracy potrzebnymi w procesie. Umożliwiają kluczowe decyzje, zostawiają ślad do kontroli (ścieżkę rewizyjną) i pozwalają sprawdzić przebieg po incydencie; określa się je dla praktyk; często są wejściami innych procesów.","ex":"Jak papiery w warsztacie: zlecenie naprawy (wejście), karta naprawy i faktura (wyjście). Widać, kto co zdecydował, a karta trafia potem dalej, np. do księgowości.","org":""}},"fz-B-035":{"id":"fz-B-035","typ":"egzamin","s":"EN-02-11","t":"Który zestaw opisuje relacje Procesów z innymi aktywatorami?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 71"],"r":null,"zap":"","scen":"","o":[{"t":"Informacja na wejściu i wyjściu, role w RACI, potrzebne zdolności usługowe","ok":true,"w":"Procesy wymagają informacji i mogą jej dostarczać, korzystają z ról oraz struktur, a także wymagają i dostarczają zdolności usługowych. Zależą też od innych procesów, polityk i kultury (s.71)."},{"t":"Wartości organizacji, osobiste wartości, reakcje na negatywne wyniki","ok":false,"w":"To zakres celów aktywatora Kultura, Etyka i Zachowanie. Może wpływać na procesy, ale nie jest przytoczoną listą ich relacji (s.79)."},{"t":"Pryncypia architektury, punkty widzenia, repozytorium i poziomy usług","ok":false,"w":"To dobre praktyki aktywatora Usługi, Infrastruktura i Aplikacje, a nie opis relacji procesu z pozostałymi aktywatorami (s.85–86)."},{"t":"Wytwarzanie informacji, opieka nad informacją i jej wykorzystanie","ok":false,"w":"To ogólne role interesariuszy informacji: wytwórca, opiekun i konsument. Nie są pełną listą relacji procesów (s.82)."}],"fz":{"h":"Procesy a inne aktywatory","p":"P2","pulapka":false,"n":"EN: Processes – relationships with other enablers","q":"Jak procesy wiążą się z innymi aktywatorami?","a":"Wymagają i dostarczają informacji; wymagają struktur i ról z RACI; zapewniają i wymagają zdolności usługowej; zależą od innych procesów; wymagają polityk i procedur; kultura i zachowanie decydują o ich skuteczności.","ex":"Aktywator = wszystko, co pomaga działać. Gotowanie w restauracji potrzebuje zamówień (informacja), kucharzy z rolami, sprzętu, dostaw (inny proces), regulaminu i dobrej atmosfery (kultura).","org":""}},"fz-B-036":{"id":"fz-B-036","typ":"egzamin","s":"EN-02-24","t":"Który element NIE wchodzi w skład opisu procesu w przewodniku Procesy umożliwiające (Enabling Processes)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["Enabling Processes s. 25","SYL EN02.24","SYL EN02.25","FW-PL s. 33"],"r":null,"zap":"","scen":"","o":[{"t":"Tabela ról i odpowiedzialności RACI","ok":false,"w":"RACI (Responsible, Accountable, Consulted, Informed — odpowiedzialny wykonawczo, odpowiedzialny decyzyjnie, konsultowany, informowany) jest częścią opisu procesu. Tabela określa zaangażowanie ról w praktyki procesu (Enabling Processes s.25; sylabus PeopleCert EN02.25)."},{"t":"Deklaracja przeznaczenia procesu","ok":false,"w":"Przeznaczenie wyjaśnia ogólnie, po co proces istnieje i jakie są spodziewane rezultaty jego skutecznej realizacji. Jest elementem opisu procesu, odrębnym od konkretnych celów i mierników (Enabling Processes s.25; sylabus PeopleCert EN02.24)."},{"t":"Wynik oceny zdolności procesu","ok":true,"w":"Enabling Processes opisuje procesy w sposób ogólny, niezależny od konkretnego wdrożenia. Wynik oceny zdolności ustala się dla rzeczywiście realizowanego procesu na podstawie dowodów; nie stanowi części jego ogólnego opisu w tym przewodniku (Enabling Processes s.25; podręcznik COBIT 5 PL s.42–46)."},{"t":"Odniesienia do powiązanych wytycznych","ok":false,"w":"Powiązane wytyczne wskazują inne standardy i struktury ramowe dotyczące danego procesu. Są częścią opisu procesu w przewodniku Enabling Processes (s.25)."}],"fz":{"h":"Opis procesu w Procesach umożliwiających","p":"P2","pulapka":false,"n":"EN: Process description components (COBIT 5: Enabling Processes)","q":"Z jakich elementów składa się opis procesu w Procesach umożliwiających?","a":"Etykieta (kod), nazwa, obszar (Ład/Zarządzanie), domena; opis procesu; przeznaczenie procesu; kaskada celów (cele IT i mierniki); cele i mierniki procesu; RACI; praktyki z wejściami/wyjściami i działaniami; powiązane wytyczne.","ex":"Jak etykieta na słoiku plus przepis: kod i nazwa, po co jest, cele i mierniki, kto co robi (RACI), kroki z wejściami i wyjściami, gdzie doczytać więcej.","org":""}},"fz-B-037":{"id":"fz-B-037","typ":"egzamin","s":"EN-02-25","t":"Do czego służy diagram RACI?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 93"],"r":null,"zap":"","scen":"","o":[{"t":"Wiąże mierniki z osiągnięciem celów aktywatora","ok":false,"w":"To robią wskaźniki opóźnione."},{"t":"Wiąże koszty informatyki z jednostkami odbiorców","ok":false,"w":"To refundacja kosztów IT (chargeback)."},{"t":"Wiąże praktyki procesu z rolami i odpowiedzialnością","ok":true,"w":"RACI (Responsible, Accountable, Consulted, Informed — odpowiedzialny wykonawczo, odpowiedzialny decyzyjnie, konsultowany, informowany) opisuje zaangażowanie ról w praktyki procesu. Wskazuje wykonanie, ostateczną odpowiedzialność, konsultowanie i informowanie."},{"t":"Wiąże fazy cyklu życia z okresami działania procesu","ok":false,"w":"To cykl życia procesu."}],"fz":{"h":"Diagram RACI","p":"P1","pulapka":false,"n":"EN: RACI chart","q":"Do czego służy diagram RACI?","a":"Określa, kto w strukturze organizacyjnej jest odpowiedzialny wykonawczo, odpowiedzialny decyzyjnie, konsultowany i informowany w ramach praktyk procesu.","ex":"Tabela jak grafik remontu: w wierszach zadania, w kolumnach osoby, w kratkach litery R, A, C, I. Rzut oka i wiesz, do kogo iść.","org":""}},"fz-B-038":{"id":"fz-B-038","typ":"egzamin","s":"EN-02-25","t":"Kogo oznacza litera R w tabeli RACI?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 93"],"r":null,"zap":"","scen":"","o":[{"t":"Osobę ostatecznie odpowiadającą za powodzenie zadania","ok":false,"w":"To A (Accountable — odpowiedzialny decyzyjnie) – odpowiedzialny decyzyjnie (podr.: strona rozliczana)."},{"t":"Tych, którzy realizują zadanie – role najbardziej zaangażowane operacyjnie; może ich być kilku","ok":true,"w":"Tak: R (Responsible — odpowiedzialny wykonawczo) jak „Robi”."},{"t":"Osoby, których opinii się zasięga (komunikacja dwukierunkowa)","ok":false,"w":"To C (Consulted — konsultowany) – konsultowany."},{"t":"Osoby informowane o postępach (komunikacja jednokierunkowa)","ok":false,"w":"To I (Informed — informowany) – informowany."}],"fz":{"h":"RACI: R – Odpowiedzialny wykonawczo","p":"P1","pulapka":true,"n":"EN: Responsible","q":"RACI: co oznacza R – Odpowiedzialny wykonawczo?","a":"Kto realizuje zadanie? Role najbardziej zaangażowane operacyjnie w wykonanie działań. Podr.: strona odpowiedzialna.","ex":"R jak „Robi”: fachowiec, który kładzie kafelki. Wykonawców może być kilku.","org":""}},"fz-B-039":{"id":"fz-B-039","typ":"egzamin","s":"EN-02-25","t":"Ile ról oznacza się literą A (odpowiedzialny decyzyjnie) w tabeli RACI?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 89","FW-PL s. 93"],"r":null,"zap":"","scen":"","o":[{"t":"Kilka – wszystkich, którzy wykonują zadanie","ok":false,"w":"To R; wykonawców może być kilku."},{"t":"Wszystkich, których się konsultuje","ok":false,"w":"Konsultowani to C."},{"t":"Dwie – zawsze prezesa i CEO","ok":false,"w":"A to jedna wskazana rola; może nią być osoba lub organ."},{"t":"Jedną – rolę ostatecznie odpowiedzialną za powodzenie zadania","ok":true,"w":"Tak: gdy odpowiadają wszyscy, nie odpowiada nikt."}],"fz":{"h":"RACI","p":"P1","pulapka":true,"n":"egzamin: RACI · podr.: RACI · EN: Responsible, Accountable, Consulted, Informed","q":"Co oznacza RACI? / RACI: co oznacza A – Odpowiedzialny decyzyjnie?","a":"R odpowiedzialny (wykonuje i zapewnia realizację), A rozliczany (jedna rola ostatecznie odpowiedzialna za powodzenie, z uprawnieniami; osoba lub organ), C konsultowany (dwukierunkowo), I informowany (jednokierunkowo).\nKto odpowiada za powodzenie zadania? Osoba lub jednostka ostatecznie odpowiedzialna. Podr.: strona rozliczana.","ex":"Remont: R – fachowiec, który kładzie kafelki; A – właściciel mieszkania, który ostatecznie odpowiada za efekt (jedna rola, np. też wspólnota); C – sąsiad, z którym ustalasz; I – administracja, którą powiadamiasz.\nA to ten, kto się rozlicza: właściciel mieszkania odpowiada za efekt remontu, choć sam nie kładzie płytek (to R). Jedna wskazana rola, bo gdy odpowiadają wszyscy, nie odpowiada nikt.","org":"A: właściciel procesu DSS02; R: dyżurny."}},"fz-B-040":{"id":"fz-B-040","typ":"egzamin","s":"EN-02-25","t":"Jaki rodzaj komunikacji dotyczy roli C (konsultowany) w RACI?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 90"],"r":null,"zap":"","scen":"","o":[{"t":"Dwukierunkowa – zasięga się opinii i słucha odpowiedzi","ok":true,"w":"Tak: C zapewnia dane wejściowe."},{"t":"Jednokierunkowa – tylko powiadomienie o postępach","ok":false,"w":"To rola I – informowany."},{"t":"Żadna – C samodzielnie wykonuje zadanie","ok":false,"w":"Zadanie wykonuje R."},{"t":"Rozliczeniowa – C odpowiada ostatecznie za powodzenie","ok":false,"w":"To rola A."}],"fz":{"h":"RACI: C – Konsultant","p":"P1","pulapka":true,"n":"EN: Consulted","q":"RACI: co oznacza C – Konsultant?","a":"Kto zapewnia dane wejściowe? Osoby, których opinii się zasięga; komunikacja dwukierunkowa.","ex":"C jak „Co sądzisz?”: sąsiad, z którym ustalasz godziny wiercenia. Rozmowa w obie strony – pytasz i słuchasz odpowiedzi.","org":""}},"fz-B-041":{"id":"fz-B-041","typ":"egzamin","s":"EN-02-25","t":"Kogo oznacza litera I w tabeli RACI?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 92"],"r":null,"zap":"","scen":"","o":[{"t":"Osoby zapewniające dane wejściowe w rozmowie dwukierunkowej","ok":false,"w":"To C – konsultowany."},{"t":"Rolę ostatecznie odpowiedzialną za powodzenie zadania","ok":false,"w":"To A – odpowiedzialny decyzyjnie."},{"t":"Osoby informowane o postępach i efektach – komunikacja jednokierunkowa","ok":true,"w":"Tak: wiadomość idzie w jedną stronę."},{"t":"Role najbardziej zaangażowane operacyjnie w wykonanie działań","ok":false,"w":"To R – odpowiedzialny wykonawczo."}],"fz":{"h":"RACI: I – Informowany","p":"P1","pulapka":true,"n":"EN: Informed","q":"RACI: co oznacza I – Informowany?","a":"Kto otrzymuje informacje? Osoby informowane o postępach i efektach; komunikacja jednokierunkowa.","ex":"I jak „Informacja”: administracja dostaje kartkę, że w środę remont. Wiadomość idzie tylko w jedną stronę, nikt nie czeka na odpowiedź.","org":""}},"fz-B-042":{"id":"fz-B-042","typ":"egzamin","s":"PR-01-04","t":"Który proces APO zarządza umowami o świadczenie usług?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 33"],"r":null,"zap":"","scen":"","o":[{"t":"APO09","ok":true,"w":"APO09 — Manage Service Agreements, Zarządzanie umowami o świadczenie usług — dotyczy uzgadniania i zarządzania zobowiązaniami usługowymi. APO08 — Manage Relationships, Zarządzanie relacjami — oraz APO10 — Manage Suppliers, Zarządzanie dostawcami — są odrębnymi procesami."},{"t":"APO10","ok":false,"w":"APO10 (Manage Suppliers — Zarządzanie dostawcami) to Zarządzanie dostawcami."},{"t":"APO08","ok":false,"w":"APO08 (Manage Relationships — Zarządzanie relacjami) to Zarządzanie relacjami."},{"t":"APO11","ok":false,"w":"APO11 (Manage Quality — Zarządzanie jakością) to Zarządzanie jakością."}],"fz":{"h":"13 procesów APO","p":"P2","pulapka":false,"n":"APO — Align, Plan and Organise — Dostosuj, Planuj i Organizuj. 13 procesów.","q":"Podaj 13 procesów domeny APO (Dostosuj, Planuj i Organizuj).","a":"APO01 — Zarządzanie strukturą ramową zarządzania IT (Manage the IT Management Framework); APO02 — Zarządzanie strategią (Manage Strategy); APO03 — Zarządzanie architekturą korporacyjną (Manage Enterprise Architecture); APO04 — Zarządzanie innowacjami (Manage Innovation); APO05 — Zarządzanie portfelem (Manage Portfolio); APO06 — Zarządzanie budżetem i kosztami (Manage Budget and Costs); APO07 — Zarządzanie zasobami ludzkimi (Manage Human Resources); APO08 — Zarządzanie relacjami (Manage Relationships); APO09 — Zarządzanie umowami o świadczenie usług (Manage Service Agreements); APO10 — Zarządzanie dostawcami (Manage Suppliers); APO11 — Zarządzanie jakością (Manage Quality); APO12 — Zarządzanie ryzykiem (Manage Risk); APO13 — Zarządzanie bezpieczeństwem (Manage Security). W podręczniku APO05 nazwano „Zarządzanie portfelem projektów”; angielskie Manage Portfolio ma szerszy zakres. APO07 dotyczy zasobów ludzkich, a APO08 relacji.","ex":"APO (Align, Plan and Organise — Dostosuj, Planuj i Organizuj) to biuro restauracji: plan, karta dań, budżet, kadry, umowy z dostawcami, kontrola jakości, ryzyko i zamki w drzwiach. Uwaga terminologiczna: „APO07 Relacje ludzkie”, „BAI04 Moc obliczeniowa” i „DSS01 Operacje” są potocznymi skrótami notatek. W podręczniku: APO07 (Manage Human Resources — Zarządzanie zasobami ludzkimi); BAI04 (Manage Availability and Capacity — Zarządzanie dostępnością i pojemnością); DSS01 (Manage Operations — Zarządzanie eksploatacją).","org":""}},"fz-B-043":{"id":"fz-B-043","typ":"egzamin","s":"PR-01-04","t":"Czym zarządza proces BAI08?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 33"],"r":null,"zap":"","scen":"","o":[{"t":"Konfiguracją","ok":false,"w":"To BAI10 (Manage Configuration — Zarządzanie konfiguracją)."},{"t":"Wiedzą","ok":true,"w":"BAI08 — Manage Knowledge, Zarządzanie wiedzą — to proces dotyczący wiedzy. BAI09 — Manage Assets, Zarządzanie aktywami (podr. zasobami) — dotyczy aktywów, a BAI10 — Manage Configuration, Zarządzanie konfiguracją — konfiguracji."},{"t":"Zasobami (aktywami)","ok":false,"w":"To BAI09 (Manage Assets — Zarządzanie aktywami; podr. Zarządzanie zasobami)."},{"t":"Definiowaniem wymagań","ok":false,"w":"To BAI02 (Manage Requirements Definition — Zarządzanie definiowaniem wymagań)."}],"fz":{"h":"10 procesów BAI","p":"P2","pulapka":false,"n":"BAI — Build, Acquire and Implement — Twórz, Nabywaj i Wdrażaj. 10 procesów.","q":"Podaj 10 procesów domeny BAI (Twórz, Nabywaj i Wdrażaj).","a":"BAI01 — Zarządzanie programami i projektami (Manage Programmes and Projects); BAI02 — Zarządzanie definiowaniem wymagań (Manage Requirements Definition); BAI03 — Zarządzanie identyfikacją i budowaniem rozwiązań (Manage Solutions Identification and Build); BAI04 — Zarządzanie dostępnością i pojemnością (Manage Availability and Capacity); BAI05 — Zarządzanie wdrażaniem zmian organizacyjnych (Manage Organisational Change Enablement); BAI06 — Zarządzanie zmianami (Manage Changes); BAI07 — Zarządzanie procesem akceptacji zmian i przejścia (Manage Change Acceptance and Transitioning); BAI08 — Zarządzanie wiedzą (Manage Knowledge); BAI09 — Zarządzanie aktywami; podr. Zarządzanie zasobami (Manage Assets); BAI10 — Zarządzanie konfiguracją (Manage Configuration).","ex":"BAI (Build, Acquire and Implement — Twórz, Nabywaj i Wdrażaj) to budowa nowej kuchni: projekt, lista wymagań, montaż sprzętu, odbiór, przeszkolenie kucharzy, spis wyposażenia i jego ustawień.","org":""}},"fz-B-044":{"id":"fz-B-044","typ":"egzamin","s":"PR-01-04","t":"Czym zarządza proces DSS03?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 33"],"r":null,"zap":"","scen":"","o":[{"t":"Zgłoszeniami serwisowymi i incydentami","ok":false,"w":"To DSS02 (Manage Service Requests and Incidents — Zarządzanie zgłoszeniami serwisowymi i incydentami)."},{"t":"Ciągłością","ok":false,"w":"To DSS04 (Manage Continuity — Zarządzanie ciągłością)."},{"t":"Mechanizmami kontrolnymi procesów biznesowych","ok":false,"w":"To DSS06 (Manage Business Process Controls — Zarządzanie mechanizmami kontrolnymi procesów biznesowych)."},{"t":"Problemami","ok":true,"w":"DSS03 — Manage Problems, Zarządzanie problemami — dotyczy problemów i ich przyczyn. Odmienny proces DSS02 — Manage Service Requests and Incidents, Zarządzanie zgłoszeniami serwisowymi i incydentami — dotyczy obsługi zgłoszeń i przywracania usług po incydentach."}],"fz":{"h":"6 procesów DSS","p":"P2","pulapka":false,"n":"DSS — Deliver, Service and Support — Dostarczaj, Obsługuj i Wspieraj. 6 procesów.","q":"Podaj 6 procesów domeny DSS (Dostarczaj, Obsługuj i Wspieraj).","a":"DSS01 — Zarządzanie eksploatacją (Manage Operations); DSS02 — Zarządzanie zgłoszeniami serwisowymi i incydentami (Manage Service Requests and Incidents); DSS03 — Zarządzanie problemami (Manage Problems); DSS04 — Zarządzanie ciągłością (Manage Continuity); DSS05 — Zarządzanie usługami bezpieczeństwa (Manage Security Services); DSS06 — Zarządzanie mechanizmami kontrolnymi procesów biznesowych (Manage Business Process Controls).","ex":"DSS (Deliver, Service and Support — Dostarczaj, Obsługuj i Wspieraj) to codzienna praca kuchni: gotowanie, reklamacje, szukanie przyczyn awarii, plan na brak prądu, zamknięta spiżarnia i sprawdzanie rachunków.","org":""}},"fz-B-045":{"id":"fz-B-045","typ":"egzamin","s":"PR-01-04","t":"Jak brzmi nazwa procesu APO07 w podręczniku PL (Rysunek 16)?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 33"],"r":null,"zap":"","scen":"","o":[{"t":"Relacje ludzkie","ok":false,"w":"To nieoficjalne spolszczenie z notatek."},{"t":"Zarządzanie zasobami ludzkimi","ok":true,"w":"Tak: tak nazywa APO07 podręcznik."},{"t":"Zarządzanie relacjami","ok":false,"w":"To APO08."},{"t":"Zarządzanie zasobami","ok":false,"w":"To BAI09, proces o aktywach."}],"fz":{"h":"Nieoficjalne nazwy procesów","p":"P2","pulapka":true,"n":"EN: Unofficial PL names vs manual names","q":"„APO07 Relacje ludzkie”, „BAI04 Moc obliczeniowa”, „DSS01 Operacje” – czy to nazwy z podręcznika?","a":"Nie, to nieoficjalne spolszczenia z notatek. Podręcznik PL (Rysunek 16): APO07 Zarządzanie zasobami ludzkimi, BAI04 Zarządzanie dostępnością i pojemnością, DSS01 Zarządzanie eksploatacją. Rozpoznawaj proces po kodzie i sensie.","ex":"Jak potoczne nazwy dań („schabowy”) i nazwy z karty: w zamówieniu liczy się, które to danie, a nie słowo.","org":""}},"fz-B-046":{"id":"fz-B-046","typ":"egzamin","s":"PR-01-03,PR-01-04","t":"Co odróżnia BAI09 „Zarządzanie zasobami” od EDM04 „Zapewnienie optymalizacji zasobów”?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 33","FW-PL s. 93","COBIT 5 Enabling Processes — opis procesów BAI09 i EDM04"],"r":null,"zap":"","scen":"","o":[{"t":"BAI09 sprawuje Ład nad zasobami, a EDM04 zarządza aktywami IT","ok":false,"w":"Role są odwrócone: BAI09 (Manage Assets — Zarządzanie aktywami; podr. Zarządzanie zasobami) jest procesem Zarządzania aktywami, a EDM04 (Ensure Resource Optimisation — Zapewnienie optymalizacji zasobów) procesem Ładu zapewniającym optymalizację zasobów."},{"t":"Oba mają ten sam zakres i nie różnią się odpowiedzialnością Ładu i Zarządzania","ok":false,"w":"Zakresy częściowo się nakładają, ale nie są tożsame. EDM04 (Ensure Resource Optimisation — Zapewnienie optymalizacji zasobów) dotyczy optymalizacji szerszego zbioru zasobów na poziomie Ładu; BAI09 (Manage Assets — Zarządzanie aktywami; podr. Zarządzanie zasobami) zarządza aktywami na poziomie Zarządzania."},{"t":"BAI09 zarządza aktywami IT, a EDM04 zapewnia optymalizację szerszego zbioru zasobów","ok":true,"w":"BAI09 (Manage Assets — Zarządzanie aktywami; podr. Zarządzanie zasobami) zarządza aktywami IT (Information Technology — technologie informacyjne), np. sprzętem i licencjami. EDM04 (Ensure Resource Optimisation — Zapewnienie optymalizacji zasobów) zapewnia optymalne wykorzystanie szerszego zbioru zasobów, w tym także tych aktywów. Procesy różnią się rolą i zakresem, nie rozłącznością zasobów."},{"t":"BAI09 dotyczy zasobów ludzkich, a EDM04 zarządza sprzętem i licencjami","ok":false,"w":"BAI09 (Manage Assets — Zarządzanie aktywami; podr. Zarządzanie zasobami) nie jest procesem zarządzania zasobami ludzkimi — to APO07 (Manage Human Resources — Zarządzanie zasobami ludzkimi). EDM04 (Ensure Resource Optimisation — Zapewnienie optymalizacji zasobów) nie prowadzi codziennej ewidencji sprzętu i licencji, lecz zapewnia optymalizację zasobów na poziomie Ładu."}],"fz":{"h":"BAI09 a EDM04","p":"P2","pulapka":true,"n":"EN: BAI09 (Manage Assets — Zarządzanie aktywami; podr. Zarządzanie zasobami) Manage Assets vs EDM04 (Ensure Resource Optimisation — Zapewnienie optymalizacji zasobów) Ensure Resource Optimisation","q":"Co odróżnia BAI09 od EDM04 i czy ich zakresy zasobów mogą się nakładać?","a":"BAI09 (Manage Assets — Zarządzanie aktywami; podr. Zarządzanie zasobami) Manage Assets — Zarządzanie aktywami (w podręczniku: Zarządzanie zasobami) zarządza aktywami IT (Information Technology — technologie informacyjne) w ich cyklu życia, np. sprzętem i licencjami. EDM04 Ensure Resource Optimisation — Zapewnienie optymalizacji zasobów to proces Ładu obejmujący szerszy zbiór zasobów: ludzi, finanse, sprzęt, infrastrukturę i informacje. Zakresy się nakładają: aktywa zarządzane w BAI09 są również częścią zasobów optymalizowanych w EDM04. Różnią się rolą i zakresem, a nie rozłącznością zasobów.","ex":"Spis garnków w magazynie to BAI09 (Manage Assets — Zarządzanie aktywami; podr. Zarządzanie zasobami). Pilnowanie przez właściciela, by ludzie, budżet i kuchnia były dobrze wykorzystane, to proces EDM04 (Ensure Resource Optimisation — Zapewnienie optymalizacji zasobów).","org":""}},"fz-B-047":{"id":"fz-B-047","typ":"egzamin","s":"PR-01-04","t":"Który proces odpowiada za codzienną ochronę, np. dostęp, uprawnienia i ochronę przed złośliwym oprogramowaniem?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 33"],"r":null,"zap":"","scen":"","o":[{"t":"APO13 Zarządzanie bezpieczeństwem","ok":false,"w":"APO13 (Manage Security — Zarządzanie bezpieczeństwem) ustala i utrzymuje podejście do bezpieczeństwa (domena planowania)."},{"t":"DSS06 Zarządzanie mechanizmami kontrolnymi procesów biznesowych","ok":false,"w":"DSS06 (Manage Business Process Controls — Zarządzanie mechanizmami kontrolnymi procesów biznesowych) to kontrole wbudowane w procesy biznesowe."},{"t":"EDM03 Zapewnienie optymalizacji ryzyka","ok":false,"w":"EDM03 (Ensure Risk Optimisation — Zapewnienie optymalizacji ryzyka) to proces Ładu ustalający apetyt na ryzyko."},{"t":"DSS05 Zarządzanie usługami bezpieczeństwa","ok":true,"w":"APO13 (Manage Security — Zarządzanie bezpieczeństwem) (domena planowania): ustala i utrzymuje podejście do bezpieczeństwa informacji. DSS05 (Manage Security Services — Zarządzanie usługami bezpieczeństwa) (domena wykonania): codzienna ochrona, np. dostęp, uprawnienia, ochrona przed złośliwym oprogramowaniem."}],"fz":{"h":"APO13 a DSS05","p":"P2","pulapka":true,"n":"EN: APO13 (Manage Security — Zarządzanie bezpieczeństwem) Manage Security vs DSS05 (Manage Security Services — Zarządzanie usługami bezpieczeństwa) Manage Security Services","q":"APO13 a DSS05 – oba o bezpieczeństwie. Czym się różnią?","a":"APO13 (Manage Security — Zarządzanie bezpieczeństwem) (domena planowania): ustala i utrzymuje podejście do bezpieczeństwa informacji. DSS05 (Manage Security Services — Zarządzanie usługami bezpieczeństwa) (domena wykonania): codzienna ochrona, np. dostęp, uprawnienia, ochrona przed złośliwym oprogramowaniem.","ex":"Plan ochrony budynku to APO13 (Manage Security — Zarządzanie bezpieczeństwem). Ochroniarz przy drzwiach i zamykanie zamków każdego wieczoru to DSS05 (Manage Security Services — Zarządzanie usługami bezpieczeństwa).","org":""}},"fz-B-048":{"id":"fz-B-048","typ":"egzamin","s":"PR-01-04","t":"Organizacja uruchamia nowy sposób pracy, ale pracownicy opierają się zmianie. Który proces wspiera ich gotowość, komunikację i przyjęcie zmiany?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 33","FW-PL s. 60"],"r":null,"zap":"","scen":"","o":[{"t":"BAI05 Zarządzanie wdrażaniem zmian organizacyjnych","ok":true,"w":"BAI05 (Manage Organisational Change Enablement — Zarządzanie wdrażaniem zmian organizacyjnych) dotyczy aktywowania zmian organizacyjnych: przygotowania ludzi i organizacji, komunikacji, zaangażowania oraz przyjęcia nowego sposobu pracy. EN: Manage Organisational Change Enablement; podr. Zarządzanie wdrażaniem zmian organizacyjnych."},{"t":"BAI06 Zarządzanie zmianami","ok":false,"w":"BAI06 (Manage Changes — Zarządzanie zmianami) obsługuje wnioski o zmianę."},{"t":"BAI07 Zarządzanie procesem akceptacji zmian i przejścia","ok":false,"w":"BAI07 (Manage Change Acceptance and Transitioning — Zarządzanie procesem akceptacji zmian i przejścia) to testy, odbiór i przekazanie do użytku."},{"t":"BAI03 Zarządzanie identyfikacją i budowaniem rozwiązań","ok":false,"w":"BAI03 (Manage Solutions Identification and Build — Zarządzanie identyfikacją i budowaniem rozwiązań) dotyczy budowania rozwiązań, nie ludzkiej strony zmiany."}],"fz":{"h":"BAI05, BAI06, BAI07","p":"P2","pulapka":true,"n":"EN: BAI05 (Manage Organisational Change Enablement — Zarządzanie wdrażaniem zmian organizacyjnych) Change Enablement vs BAI06 (Manage Changes — Zarządzanie zmianami) Changes vs BAI07 (Manage Change Acceptance and Transitioning — Zarządzanie procesem akceptacji zmian i przejścia) Change Acceptance and Transitioning","q":"BAI05, BAI06, BAI07 – trzy procesy o zmianach. Czym się różnią?","a":"BAI05 (Manage Organisational Change Enablement — Zarządzanie wdrażaniem zmian organizacyjnych): ludzka strona zmiany (EN Organisational Change Enablement). BAI06 (Manage Changes — Zarządzanie zmianami): obsługa wniosków o zmianę. BAI07 (Manage Change Acceptance and Transitioning — Zarządzanie procesem akceptacji zmian i przejścia): testy, odbiór, przekazanie do użytku.","ex":"Wymiana pieca: przekonujesz kucharzy (BAI05 (Manage Organisational Change Enablement — Zarządzanie wdrażaniem zmian organizacyjnych)), zatwierdzasz zakup i montaż (BAI06 (Manage Changes — Zarządzanie zmianami)), robisz próbny obiad i odbiór (BAI07 (Manage Change Acceptance and Transitioning — Zarządzanie procesem akceptacji zmian i przejścia)).","org":""}},"fz-B-049":{"id":"fz-B-049","typ":"egzamin","s":"PR-01-03,PR-01-04","t":"Który proces ustala apetyt na ryzyko i pilnuje, by go nie przekroczyć?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 33","FW-PL s. 68"],"r":null,"zap":"","scen":"","o":[{"t":"APO12 Zarządzanie ryzykiem","ok":false,"w":"APO12 (Manage Risk — Zarządzanie ryzykiem) to bieżące rozpoznawanie, ocena i ograniczanie ryzyka IT (Information Technology — technologie informacyjne)."},{"t":"EDM03 Zapewnienie optymalizacji ryzyka","ok":true,"w":"EDM03 (Ensure Risk Optimisation — Zapewnienie optymalizacji ryzyka) to Ład: ustalenie apetytu na ryzyko i pilnowanie, by go nie przekroczyć. APO12 (Manage Risk — Zarządzanie ryzykiem) to Zarządzanie: bieżące rozpoznawanie, ocena i ograniczanie ryzyka IT (Information Technology — technologie informacyjne)."},{"t":"APO13 Zarządzanie bezpieczeństwem","ok":false,"w":"APO13 (Manage Security — Zarządzanie bezpieczeństwem) ustala podejście do bezpieczeństwa informacji."},{"t":"MEA03 (zgodność z wymogami zewnętrznymi)","ok":false,"w":"MEA03 (Monitor, Evaluate and Assess Compliance With External Requirements — Monitorowanie, ocena i oszacowanie zgodności z wymogami zewnętrznymi) monitoruje zgodność z wymogami zewnętrznymi."}],"fz":{"h":"EDM03 a APO12","p":"P2","pulapka":true,"n":"EN: EDM03 (Ensure Risk Optimisation — Zapewnienie optymalizacji ryzyka) Ensure Risk Optimisation vs APO12 (Manage Risk — Zarządzanie ryzykiem) Manage Risk","q":"EDM03 a APO12 – oba o ryzyku. Czym się różnią?","a":"EDM03 (Ensure Risk Optimisation — Zapewnienie optymalizacji ryzyka) to Ład: ustalenie apetytu na ryzyko i pilnowanie, by go nie przekroczyć. APO12 (Manage Risk — Zarządzanie ryzykiem) to Zarządzanie: bieżące rozpoznawanie, ocena i ograniczanie ryzyka IT (Information Technology — technologie informacyjne).","ex":"Właściciel restauracji decyduje, ile ryzyka przyjmuje (EDM03 (Ensure Risk Optimisation — Zapewnienie optymalizacji ryzyka)). Szef kuchni na co dzień pilnuje gazu, noży i dat ważności (APO12 (Manage Risk — Zarządzanie ryzykiem)).","org":""}},"fz-B-050":{"id":"fz-B-050","typ":"egzamin","s":"PR-01-04","t":"Czym zajmuje się MEA02 w odróżnieniu od DSS06?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 33","FW-PL s. 89","FW-PL s. 93"],"r":null,"zap":"","scen":"","o":[{"t":"Kontrolami wbudowanymi w codzienne procesy biznesowe","ok":false,"w":"To DSS06 (Manage Business Process Controls — Zarządzanie mechanizmami kontrolnymi procesów biznesowych)."},{"t":"Zgodnością z wymogami zewnętrznymi","ok":false,"w":"To MEA03 (Monitor, Evaluate and Assess Compliance With External Requirements — Monitorowanie, ocena i oszacowanie zgodności z wymogami zewnętrznymi)."},{"t":"Monitorowaniem i oceną całego systemu kontroli wewnętrznej","ok":true,"w":"DSS06 (Manage Business Process Controls — Zarządzanie mechanizmami kontrolnymi procesów biznesowych): kontrole wbudowane w codzienne procesy biznesowe (polityki, procedury, praktyki dające rozsądną pewność, że proces osiągnie cel). MEA02 (Monitor, Evaluate and Assess the System of Internal Control — Monitorowanie, ocena i oszacowanie systemu kontroli wewnętrznej): monitorowanie i ocena całego systemu kontroli wewnętrznej, czyli polityk, planów, procedur i struktur chroniących cele organizacji."},{"t":"Monitorowaniem wydajności i zgodności","ok":false,"w":"To MEA01 (Monitor, Evaluate and Assess Performance and Conformance — Monitorowanie, ocena i oszacowanie wydajności i zgodności)."}],"fz":{"h":"DSS06 a MEA02","p":"P2","pulapka":true,"n":"EN: DSS06 (Manage Business Process Controls — Zarządzanie mechanizmami kontrolnymi procesów biznesowych) Business Process Controls vs MEA02 (Monitor, Evaluate and Assess the System of Internal Control — Monitorowanie, ocena i oszacowanie systemu kontroli wewnętrznej) System of Internal Control","q":"DSS06 a MEA02 – czym różnią się mechanizmy kontrolne procesów biznesowych od systemu kontroli wewnętrznej?","a":"DSS06 (Manage Business Process Controls — Zarządzanie mechanizmami kontrolnymi procesów biznesowych): kontrole wbudowane w codzienne procesy biznesowe (polityki, procedury, praktyki dające rozsądną pewność, że proces osiągnie cel). MEA02 (Monitor, Evaluate and Assess the System of Internal Control — Monitorowanie, ocena i oszacowanie systemu kontroli wewnętrznej): monitorowanie i ocena całego systemu kontroli wewnętrznej, czyli polityk, planów, procedur i struktur chroniących cele organizacji.","ex":"Kasjer liczy pieniądze przy każdym rachunku (DSS06 (Manage Business Process Controls — Zarządzanie mechanizmami kontrolnymi procesów biznesowych)). Raz w miesiącu ktoś sprawdza, czy cały system liczenia działa (MEA02 (Monitor, Evaluate and Assess the System of Internal Control — Monitorowanie, ocena i oszacowanie systemu kontroli wewnętrznej)).","org":""}},"fz-B-051":{"id":"fz-B-051","typ":"egzamin","s":"PR-02-12","t":"Na jakie kategorie dzielą się cele aktywatora?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 28"],"r":null,"zap":"","scen":"","o":[{"t":"Korzyści, ryzyko i zasoby","ok":false,"w":"To elementy celu Ładu „Tworzenie wartości”."},{"t":"Interesariusze, cele, cykl życia i dobre praktyki","ok":false,"w":"To cztery wymiary aktywatora."},{"t":"Planowanie, budowanie, użytkowanie i wycofanie","ok":false,"w":"To etapy cyklu życia aktywatora."},{"t":"Jakość wewnętrzna, jakość kontekstowa, dostęp i bezpieczeństwo","ok":true,"w":"Tak: podręcznik mówi „jakość rzeczywista” zamiast „wewnętrzna”."}],"fz":{"h":"Cele aktywatora","p":"P1","pulapka":false,"n":"≠ TŁUMACZENIE · egzamin: jakość wewnętrzna, kontekstowa, dostęp i bezpieczeństwo · podr.: jakość rzeczywista, kontekstowa, dostęp i bezpieczeństwo · EN: enabler goals: intrinsic, contextual, access and security","q":"Na jakie kategorie dzieli się cele aktywatora?","a":"Jakość wewnętrzna, jakość kontekstowa, dostęp i bezpieczeństwo.","ex":"Jak ocena jedzenia: wewnętrzna – czy samo w sobie świeże i dobre; kontekstowa – czy pasuje do okazji; dostęp i bezpieczeństwo – czy podane na czas i tylko zamawiającemu.","org":"rejestr: dane prawdziwe, kompletne, dostępne dla uprawnionych."}},"fz-B-052":{"id":"fz-B-052","typ":"egzamin","s":"PR-02-12","t":"Do której kategorii celów aktywatora należą istotność, kompletność, aktualność i zrozumiałość?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 28","FW-PL s. 29"],"r":null,"zap":"","scen":"","o":[{"t":"Jakość kontekstowa","ok":true,"w":"Trzy kategorie celów aktywatora: 1) Jakość wewnętrzna (intrinsic quality; podr. rzeczywista), np. dokładność i obiektywność. 2) Jakość kontekstowa (contextual quality), np. istotność, kompletność, aktualność i zrozumiałość w określonym kontekście. 3) Dostęp i bezpieczeństwo (accessibility and security), np. dostępność w razie potrzeby oraz ochrona wyników. Ostatnia para jest jedną wspólną kategorią, a nie dwiema."},{"t":"Jakość wewnętrzna","ok":false,"w":"Jakość wewnętrzna to dokładność i obiektywność."},{"t":"Dostęp i bezpieczeństwo","ok":false,"w":"Ta kategoria to dostępność w razie potrzeby i ochrona."},{"t":"Dobre praktyki","ok":false,"w":"To wymiar aktywatora, nie kategoria celów."}],"fz":{"h":"Kategorie celów aktywatora","p":"P1","pulapka":false,"n":"EN: Intrinsic quality, contextual quality, accessibility and security","q":"Jakie są kategorie celów aktywatora?","a":"Trzy kategorie celów aktywatora: 1) Jakość wewnętrzna (intrinsic quality; podr. rzeczywista), np. dokładność i obiektywność. 2) Jakość kontekstowa (contextual quality), np. istotność, kompletność, aktualność i zrozumiałość w określonym kontekście. 3) Dostęp i bezpieczeństwo (accessibility and security), np. dostępność w razie potrzeby oraz ochrona wyników. Ostatnia para jest jedną wspólną kategorią, a nie dwiema.","ex":"Jak informacja w gazecie: wewnętrzna – czy prawdziwa i bezstronna; kontekstowa – czy na temat, pełna i świeża; dostęp i bezpieczeństwo – czy dostaniesz ją, gdy trzeba, i czy chroniona.","org":""}},"fz-B-053":{"id":"fz-B-053","typ":"egzamin","s":"PR-02-12","t":"Które etapy tworzą cykl życia aktywatora?","k":false,"st":"fiszki","src":"Fiszki COBIT 5","z":["FW-PL s. 28","FW-PL s. 29"],"r":null,"zap":"","scen":"","o":[{"t":"Siedem faz wdrożenia, od „Jakie są wyznaczniki?” do „Jak utrzymać motywację?”","ok":false,"w":"To fazy cyklu życia wdrożenia; karta ostrzega przed pomyleniem."},{"t":"Planowanie, projektowanie, budowanie/nabywanie, użytkowanie, ocena/monitorowanie, aktualizacja/wycofanie","ok":true,"w":"Planowanie → Projektowanie → Budowanie/nabywanie/tworzenie/wdrażanie → Użytkowanie/eksploatacja → Ocena/monitorowanie → Aktualizacja/pozbywanie się."},{"t":"Ocena, kierowanie i monitorowanie","ok":false,"w":"To działania Ładu (EDM (Evaluate, Direct and Monitor — Oszacuj, Kieruj i Monitoruj))."},{"t":"Planuj, Twórz, Wykonuj i Monitoruj","ok":false,"w":"To obszary działań Zarządzania (PBRM (Plan, Build, Run and Monitor — Planuj, Wytwarzaj/Twórz, Wykonuj i Monitoruj))."}],"fz":{"h":"Cykl życia aktywatora","p":"P1","pulapka":true,"n":"≠ TŁUMACZENIE · egzamin: cykl życia aktywatora · podr.: cykl życia czynnika umożliwiającego · EN: enabler life cycle","q":"Podaj fazy cyklu życia aktywatora.","a":"Planowanie → Projektowanie → Budowanie/nabywanie/tworzenie/wdrażanie → Użytkowanie/eksploatacja → Ocena/monitorowanie → Aktualizacja/pozbywanie się.","ex":"Jak lodówka: wybierasz, jakiej potrzebujesz (planowanie), projekt, kupno, używanie, sprawdzanie, czy dobrze chłodzi, aż w końcu naprawa albo wywiezienie na złom.","org":"system zgł
