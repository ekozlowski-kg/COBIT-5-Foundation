# Publikacja aplikacji na GitHub Pages: buduje dist/ (tools/build-dist.py) i wdraża go.
# Wersja publiczna nie zawiera materiałów chronionych – nie ma ich też w repozytorium (.gitignore).
name: Publikacja (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Walidacja treści
        run: python3 app/tools/serve.py --check | tail -1
      - name: Budowa wersji do udostępnienia
        run: python3 app/tools/build-dist.py
      - name: Kontrola – brak plików chronionych
        run: |
          if find dist \( -name '*.local.*' -o -name '*.pdf' -o -name '*.jpg' -o -path '*ilustracje*' \) | grep -q .; then
            echo "W dist/ są pliki chronione"; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
